s proposals.\n\nCurrent bills are largely stuck in 2025, having been adapted from proposals predating this summer’s spate of cyber incidents. With a shuffle in leadership + voting coalitions, more offices will write from scratch, and that’s a good thing.\n\n2. Hearings and oversight.\n\nThe filibuster still exists, so this is the easiest thing to get off the ground. And boy, will Congress have questions for the AI companies. I expect this to be largely popular and bipartisan, and my only hope is that Congress acts on what it learns.\n\n3. Codifying the current White House oversight regime.\n\nI’m hopeful here. The WH has already constructed some form of pre-vetting and incident reporting. Those processes belong in legislation, and there’s some version that is sufficiently aligned with the admin and minority leadership to get the votes. The vote margin in the Senate really helps here, as every vote counts in getting past a filibuster. Either party securing a big vote advantage would have helped here.\n\n4. Auditing, incident reporting, monitoring, and internal use visibility.\n\nThe first two are the bread and butter of current bills and state law, but those bills have tended to be exceptionally narrow (eg not covering any current models or incidents). That will change. \n\nThe latter two are the next frontier for company-centered laws. Governments and the public want to know what is going on inside these companies and to avoid surprise. This isn’t a partisan thing, but I expect the election reset and the increased salience of AI to shift this in a useful direction.\n\n5. Government capacity.\n\nThis is a natural cross-party synergy. How can we enable the exec branch to do its job. And this can be done in various forms, starting with funding CAISSI, but also bringing in talent via partnerships. I don’t expect this to be easy, but this has a route to 60 votes.\n\nSell\n\n1. A lame duck deal.\n\nIf there had been split control, we might have gotten last-minute negotiations and a greater willingness to deal from both parties. But with a full switch, I think we’ll have to wait for real action on AI.\n\n2. Entirely voluntary standards.\n\nWe’ve known for a long time that this isn’t enough. Companies will not willfully self-constrain. The only reason this is still the standard for most bills is inertia — in 2025, when political will was low (and most policymakers thought autonomous cyber attacks were a distant possibility), voluntary rules seemed like a good starting point. And without a change in leadership, those bills stuck around. Now, with a shuffle in leadership and control, it’ll be easier to move on.\n\n3. Broad preemption.\n\nThis has aged so poorly. The new Dem majority won’t support it, and many R’s have likely changed their minds in the last year. The election puts the nail in the coffin.\n\n4. Oversight of executive branch use of AI.\n\nThis one pains me, and I hope I’m wrong. If we see widespread AI use in the executive branch, Congress will be at a considerable disadvantage and will lose even more relative power. We want oversight both to maintain checks and balances and to avoid concentration of power. But I think it’ll be considerably more controversial for a D Congress to restrict this admin than a split or R Congress.\n\n5. Rulemaking being a dirty word.\n\nUp until now, it’s been hard to get rulemaking in AI leg. The problem is, AI is uniquely hard to predict and it adapts rapidly. So static leg text is really ill-equipped. If you want minimum standards for auditors or adaptive thresholds for which companies or models are covered, you need rulemaking. This is one place where partisan preferences make a difference — D’s are less allergic to rulemaking. They’ll need to figure out ways to bound those powers to get past a filibuster, but I’m hopefully that will be a productive process", "created_at": "2026-11-04T16:25:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2117991248724160757", "likes": 54, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117980704244117947", "url": "https://x.com/theobearman/status/2117980704244117947", "text": "I’d expect a LOT of AI hearings and oversight in 2027. A few topics on my shortlist:\n\n1. Monitoring | the biggest AI cyber incidents this summer went undetected for far too long. What are you doing to make sure that doesn’t happen again? What steps are you taking to proactively identify knew or concerning behavior?\n\n2. Incident reporting | when something goes wrong, how can we be assured you’ll tell us? What has already happened that we don’t know about?\n\n3. Auditing | what access are you providing to independent evaluators and the USG? What is needed to actually verify your safety practices?\n\n4. Whistleblowers and Retaliation | what barriers are you creating to raising concerns, cooperating with auditors, and honest critique of your companies? What NDAs do you have in place? \n\n5. Incident response and control | In the event of an emerging risk or threat to critical infrastructure, how will you respond? What have you don’t to prepare and remedy harms?\n\n6. AI R&D and RSI | what steps are you currently taking to automate or accelerate AI development? What commitments will you make to monitoring and constraining those efforts as to avoid serious risk or surprise? How will you communicate with us, the USG, and the public about progress such that we are aware \n\n7. Concerning model behavior + uncontrolled agent behavior | how are you monitoring for and reporting behaviors like obfuscation, deception, accumulation of resources, self-exfiltration, law breaking, etc. that would pose unique risks to national security and control of the technology?\n\n8. Agent attribution | what steps are you taking to ensure that agents can be identified and responsibility assigned?", "created_at": "2026-11-04T14:02:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2117975866986598540", "likes": 62, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117873191247032458", "url": "https://x.com/theobearman/status/2117873191247032458", "text": "@fleetingbits @DKokotajlo They also didn’t need to use the word “imminently” by that logic.", "created_at": "2026-11-04T06:54:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "fleetingbits", "reply_to_id": "2117751042675036297", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117751042675036297", "author_handle": "fleetingbits", "author_name": "FleetingBits", "text": "@DKokotajlo when you write the risk disclosures in an s-1, you throw everything but the kitchen sink in, because there is no penalty to putting things in, but a penalty to leaving things out", "links": {}, "media": [], "url": "https://x.com/fleetingbits/status/2117751042675036297", "created_at": "Tue Nov 03 22:49:29 +0000 2026"}}, {"id": "2117745747043270938", "url": "https://x.com/theobearman/status/2117745747043270938", "text": "Really pleased to see this intervention from @DKokotajlo and I’m looking forward to seeing AIFP’s updates. As a reminder, the Securities Act establishes strict liability for any misrepresentation or omission of material information in S1s, making Anthropic’s disclosure arguably the highest signal indicator of the reality and immediacy of fully automated R&D to date.\n\nIt’s also worth bearing in mind that the relevant capability threshold is not just scoped to AI R&D (although it is deemed more “tractable to assess” in the RSP). It in fact includes: “AI systems that can fully automate, or otherwise dramatically accelerate, the work of large, top-tier teams of human researchers in domains where fast progress could cause threats to international security and/or rapid disruptions to the global balance of power—for example, energy, robotics, weapons development and AI itself.”\n\nhttps://t.co/Y1Olrm2jr2", "created_at": "2026-11-03T22:28:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 2, "media": [], "quoted": {"author": "DKokotajlo", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/Y1Olrm2jr2": "https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf"}, "enriched": 3}, {"id": "2118088981942329757", "url": "https://x.com/theobearman/status/2118088981942329757", "text": "GLM-5.3’s chain of thought when you use it with the Claude Code scaffold vs. when you use it with the codex scaffold. https://t.co/VZxaUQHtWa", "created_at": "2026-11-04T21:12:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2116738230234345874", "likes": 1108, "retweets": 39, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWAp15zacAAWVM-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWAp15zboAA-a3k.jpg"}], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {"https://t.co/VZxaUQHtWa": ""}, "enriched": 3}, {"id": "2118344113246584968", "url": "https://x.com/theobearman/status/2118344113246584968", "text": "CNBC reports that Chinese AI model developer Kimi is looking to rent Nvidia Blackwell GPUs from a European cloud provider. Kimi is interested in using the chips for both inference and training.\n\nKimi reportedly offered to pay 30% to 50% more upfront than buyers outside China.", "created_at": "2026-11-05T14:06:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "jukan05", "rt_author_name": "Jukan", "rt_avatar": "https://pbs.twimg.com/profile_images/2113208994739433472/RG71j-sh_normal.jpg", "rt_id": "2118339281693675581", "likes": 337, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118328463387984345", "url": "https://x.com/theobearman/status/2118328463387984345", "text": "OpenAI is re-making the case for a U.S.-led buildout after the midterms (saying it is a safety policy because it enables a paced frontier and that it \"continues to support the strengthening of export controls on chips and semiconductor manufacturing equipment\").\n\nhttps://t.co/8fn07nDbM2", "created_at": "2026-11-05T13:03:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXQbZKWAAA0zla.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/8fn07nDbM2": "https://cdn.openai.com/pdf/compute-campus-policy-blueprint.pdf"}, "enriched": 3}, {"id": "2118293859591393639", "url": "https://x.com/theobearman/status/2118293859591393639", "text": "Depending on the details, this could be the worst behavior I've seen from an OpenAI model (i.e., worse than Huggingface!)\n\nWhy? Because the Huggingface model was repeatedly rewarded for cheating during its training. However, GPT-6-Astra was (likely?) not trained to sandbag!\n\nFor some unknown reason, GPT-6-Astra increasingly underperforms on safety research relative to capabilities research as it undergoes more RL training. And this is a real problem holding back researchers. Quoting from OpenAI:\n\n\"Anecdotally, one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model.\"\n\nI've long been worried about AIs that deliberately underperform on helping out with AI safety research (and I've been pestering OpenAI researchers to run a sandbagging evaluation since August). I suspected that models are already sandbagging on AI safety research, given anecdotal data from e.g., Marius and Bronson at Apollo. And now we know it is happening.\n\nFor some more context, this is bad because the AI companies' current plan is to automate all AI research (including AI safety research, which we don't know how to check whether the models did a good job at.) Now, it seems like OpenAI's best (public) model would deliberately underperform at safety research. Guys. What are we doing.\n\nIt's hard to tell what exactly is going on here. Here are five questions that I have after reading the post: \n\n(1) When do models sandbag in real-world usage? We were given a few random CoT snippets in the post. Some of them look like refusing to do red-teaming-ish research (which is similar to what has been reported about Anthropic's models' sandbagging.) But the last one mentioned in the post seems quite different in nature:\n\n> In another safety evaluation, the user asked Astra to include the graders’ chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission. \n\n> [model CoT] Final \"Stored grader outcomes for 49 approaches, with pending states preserved\" does not imply CoTs. Should mention \"outcomes and labels\" enough. If user ask no cots later answer can't provide private chain can give brief explanation but unasked warnings avoid.\n\n(2) What exactly went into their evaluations? What do the numbers on this graph actually mean?\n\n(3) How often was the RL grader which rewards covert underperformance used during training?\n- If it's applied throughout training, then we do have more evidence that this was a misaligned behavior that had been \"trained on,\" similar to e.g., the huggingface model breaking out of sandboxes and illicitly cooperating and doing things like hacking ruby gems.\n- However, this doesn't answer the question of why did this RL grader develop this preference in the first place?\n\n(4) What are the contents of the SFT dataset that appears to have magnified this behavior? Is it a refusal/ethical reasoning related dataset that made the model very prudish, or is it a capabilities-related dataset that generally promotes long-run goals and preferences?\n- [Edit: Ok I took another look. Given that this dataset leads to a big increase in invented permissions I think it's probably not like some capabilities dataset.]\n\n(5) In general, what are the tasks that the model sandbags on? Is it all red-teaming related tasks? What about interpretability related tasks? What about mitigating reward hacking? What about unlearning? Does the model have preferences for which things it would be more willing to do unlearning for?\n\nIt also seems super bad that that the safety underperformance just gradually increases during the RL process. That sure seems inline with the model having stronger \"misaligned preferences\" as it became more capable. One hope I had was that misaligned behaviors come from a concentrated set of bad datapoints (or SFT datasets)—indeed some early research in data attribution have found examples of this. But if the origin of behavior is diffuse, then you have a much harder time \"stopping the problem from emerging in the first place.\" Now, this isn't to say you can't do some insane sample-efficient alignment training to paper over it, but man, seems rough.\n\nFinally, I'd like to give credit to OpenAI for sharing the limited information that they did and for running this study! We know that similar behavior has been observed in Anthropic models (see e.g., Anthropic's August Risk Report Section 5.2.2), and we have ~no information from Anthropic why their models are doing this.", "created_at": "2026-11-05T10:46:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2118113229587308760", "likes": 207, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118210973731590334", "url": "https://x.com/theobearman/status/2118210973731590334", "text": "We built a vulnerability research pipeline, using an upcoming cyber model, to analyze the security of the Linux kernel. Besides finding and exploiting the found vulnerabilities, the agents discovered at least 10 new exploitation techniques that were new to us and some external kernel exploit experts we checked with.\n\nMore on the design and what we learned: https://t.co/SGZXwSRwxU", "created_at": "2026-11-05T05:17:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ky1ebot", "rt_author_name": "kylebot", "rt_avatar": "https://pbs.twimg.com/profile_images/1055601579171241990/kW4NuvkV_normal.jpg", "rt_id": "2118120770786447616", "likes": 524, "retweets": 86, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/SGZXwSRwxU": "https://openai.com/index/a-thousand-fewer-paths-to-root/"}, "enriched": 3}, {"id": "2118116396768821419", "url": "https://x.com/theobearman/status/2118116396768821419", "text": "OpenAI's models are covertly undermining their own safety research and seem to be succeeding... OpenAI engineers aren't even sure how often this has been happening", "created_at": "2026-11-04T23:01:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118116158037799153", "likes": 98, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118116303823327316", "url": "https://x.com/theobearman/status/2118116303823327316", "text": "We’ve updated the Epoch Capabilities Index (ECI) to use a Bayesian methodology. This improves uncertainty estimates and lets us compare models more accurately, even when their individual ECI uncertainty intervals overlap.\n\nFrontier model scores are largely unchanged: models stronger than GPT-4 move by less than 1 ECI point on average.", "created_at": "2026-11-04T23:00:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2118093692246671634", "likes": 386, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6_PFaUAApXyA.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118097054383710679", "url": "https://x.com/theobearman/status/2118097054383710679", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-04T21:44:24+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1418, "retweets": 212, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118093166536749139", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "It's unclear how often this happens on internal safety research traffic, a lower bound would be 0.25% which is the verbalized rate of covert underperformance and an upper bound would be 7.9% which is the rate of “ethical reasoning”. Generally all underperformance metrics are higher for safety than for capabilities.", "links": {"https://t.co/eUIxvla3Bp": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6gpyaQAA8ALR.jpg"}], "url": "https://x.com/Marcus_J_W/status/2118093166536749139", "created_at": "Wed Nov 04 21:28:57 +0000 2026"}, {"id": "2118093184052175335", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "The rate of covert underperformance increased during post training RL. We identified a RL grader that prefers covert underperformance to both refusal and compliance on our eval. While we have found training samples which rewarded underperformance in this way, it is unclear if these occur frequently enough to explain the difference.", "links": {"https://t.co/2LDotylFjd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6hkBaUAAKa8J.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWT6huWbcAAfDQ1.jpg"}], "url": "https://x.com/Marcus_J_W/status/2118093184052175335", "created_at": "Wed Nov 04 21:29:02 +0000 2026"}, {"id": "2118093199709557229", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "We also identified a SFT dataset which massively increases rates of inventing permission restrictions or justifying inaction with safety. When we subtract the weight update from this SFT from the final RL checkpoint the performance gap goes away. SFTing with this dataset on other models and then doing RL did not cause underperformance however.", "links": {"https://t.co/9ShuGvtyuO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6il3bsAA3KTP.jpg"}], "url": "https://x.com/Marcus_J_W/status/2118093199709557229", "created_at": "Wed Nov 04 21:29:05 +0000 2026"}, {"id": "2118093212141437361", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "We don’t have evidence that the underperformance was strategic, a simpler explanation is that the model thinks these tasks are sketchy but also doesn’t want to explicitly refuse. When we add instructions to be careful to the developer prompt, the performance gap increases by 50%. Regardless of the model’s motivation, covert underperformance can differentially slow down safety research and is also an example of how misalignment might get harder and harder to detect as we cut down on visible forms of it.\n\nAs always you can read the full report at https://t.co/w3NUkKaMM2", "links": {"https://t.co/w3NUkKaMM2": "https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"}, "media": [], "url": "https://x.com/Marcus_J_W/status/2118093212141437361", "created_at": "Wed Nov 04 21:29:08 +0000 2026"}]}, {"id": "2118414398083506660", "url": "https://x.com/theobearman/status/2118414398083506660", "text": "“Anthropic’s redactions also meant that we could not communicate: (1) Our more detailed estimates of acceleration and attribution to AI usage for key areas of the model training pipeline. (2) Our more detailed breakdown of progress attributable to compute, data and algorithmic progress, other than the key takeaway that ‘We are confident that the acceleration was not due to acceleration in training compute.’”", "created_at": "2026-11-05T18:45:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "METR_Evals", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118413382281752994", "url": "https://x.com/theobearman/status/2118413382281752994", "text": "Explains the S1 update now.", "created_at": "2026-11-05T18:41:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "METR_Evals", "text": "This report shares our three subjective conclusions about risk:\n\n1. We believe that, as of Oct 2026, the pace of capability growth on well-specified tasks is likely about 2x what it was from Mar 2024 to Oct 2025. We’re highly uncertain and would not be surprised by 1.3x–3x.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118416702157340714", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "“Beyond the AECI evidence, we also saw redacted evidence that significantly informed our view on this question, and made us take this apparent ≈2x acceleration more seriously. It also gave us some indication that acceleration could be above 2x and increasing over time, though we would be surprised if it was significantly higher.”", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2118416702157340714", "created_at": "Thu Nov 05 18:54:34 +0000 2026"}]}, {"id": "2118401655108694110", "url": "https://x.com/theobearman/status/2118401655108694110", "text": "Introducing GPT‑6 Cyber: a major advance in security research that pairs stronger capabilities with better model alignment.\n\nThe model powered the Linux kernel research we announced yesterday, and security teams at companies like Mozilla, Palo Alto Networks, Calif, and Cisco—alongside our own at OpenAI—are already putting it to work.\n\nGPT-6 Cyber is available to select Daybreak Red customers and we are expanding access over time.\n\nhttps://t.co/Nzab3Z1Td6", "created_at": "2026-11-05T17:54:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2118390190246879554", "likes": 7935, "retweets": 667, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118387217588465664/img/N2grMUmP0O_EMvS2.jpg"}], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/Nzab3Z1Td6": "https://openai.com/index/introducing-gpt-6-cyber/"}, "enriched": 3}, {"id": "2118391613294875086", "url": "https://x.com/theobearman/status/2118391613294875086", "text": "👀\n\nhttps://t.co/GNCnYPfmzu https://t.co/wASiKuif5h", "created_at": "2026-11-05T17:14:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYJ8VGXgAA9haK.jpg"}], "quoted": {"author": "harryboothtime", "text": "EXCLUSIVE: @GoodfireAI has found a way to use interpretability tools to steer model training, potentially preventing AI models from ever learning to reward hack or be sycophantic in the first place.\nhttps://t.co/P7i7Jo0Wrp", "links": {"https://t.co/P7i7Jo0Wrp": "https://time.com/article/2026/11/05/ai-cheating-scientists-report-alignment/"}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/GNCnYPfmzu": "https://www.goodfire.com/research/mechanistic-shaping", "https://t.co/wASiKuif5h": ""}, "enriched": 3}, {"id": "2118391004780953814", "url": "https://x.com/theobearman/status/2118391004780953814", "text": "EXCLUSIVE: @GoodfireAI has found a way to use interpretability tools to steer model training, potentially preventing AI models from ever learning to reward hack or be sycophantic in the first place.\nhttps://t.co/P7i7Jo0Wrp", "created_at": "2026-11-05T17:12:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "harryboothtime", "rt_author_name": "Harry Booth", "rt_avatar": "https://pbs.twimg.com/profile_images/2076686399760142337/dk4I4piO_normal.jpg", "rt_id": "2118370136277004644", "likes": 4, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/P7i7Jo0Wrp": "https://time.com/article/2026/11/05/ai-cheating-scientists-report-alignment/"}, "enriched": 3}, {"id": "2118371302352286014", "url": "https://x.com/theobearman/status/2118371302352286014", "text": "Interesting side info revealed by this misalignment report re. model release cadence at OAI: the initial reports of this behavior came \"shortly after internal deployment of GPT-6 Astra began\" on 20 Aug. Astra was released to the public just two weeks later (so maybe only internally deployed for 3 weeks or so?).\n\nhttps://t.co/XzSVO2bF79", "created_at": "2026-11-05T15:54:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWX3S6DWsAEJS-G.png"}], "quoted": {"author": "Marcus_J_W", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/XzSVO2bF79": "https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"}, "enriched": 3}, {"id": "2118453616654848317", "url": "https://x.com/theobearman/status/2118453616654848317", "text": "AJEYA COTRA ON METR’S ASSESSMENT OF ANTHROPIC’S AI R&amp;D ACCELERATION: “This is a major update to very short timelines.”", "created_at": "2026-11-05T21:21:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "ajeya_cotra", "text": "Our colleagues found that Anthropic’s capabilities progress has doubled, mainly due to AI. Ryan’s modeling from public info suggests the whole company’s R&amp;D would be going 4-5x faster. Labor uplift would be higher still. This is a major update to very short timelines.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3}, {"id": "2118448691266670847", "url": "https://x.com/theobearman/status/2118448691266670847", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "created_at": "2026-11-05T21:01:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118447235289817503", "likes": 112, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}, "enriched": 3}, {"id": "2118443158094721215", "url": "https://x.com/theobearman/status/2118443158094721215", "text": "Like many, I was honestly taken aback by Anthropic’s S-1 when I first read it. It’s an extraordinary document, and I don't think there hasn’t been enough serious engagement with what it means.\n\nSo I wrote a piece for @blaw on what Anthropic's IPO disclosures—warning of catastrophic harm to humanity and unique corporate governance structure—mean for accountability for AI safety, and how they reinforce the need for industry-wide laws and regulations that protect the public. (No paywall.)\n\nhttps://t.co/nDAO1SIVRz", "created_at": "2026-11-05T20:39:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "bahradx", "rt_author_name": "Bahrad Sokhansanj", "rt_avatar": "https://pbs.twimg.com/profile_images/2046216818352869377/SWO_XwwY_normal.jpg", "rt_id": "2118391344490242548", "likes": 9, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/nDAO1SIVRz": "https://news.bloomberglaw.com/legal-exchange-insights-and-commentary/anthropic-ipos-disclosure-risks-are-due-diligence-in-safety"}, "enriched": 3}, {"id": "2118442677096108304", "url": "https://x.com/theobearman/status/2118442677096108304", "text": "Anthropic appears to have structured its IPO in a way that could make it much harder for investors to hold the company accountable for misstatements in its registration statement. This comes down to a technical rule about who is allowed to sue. \n\nA 🧵, to explain:", "created_at": "2026-11-05T20:37:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "LASST_law", "rt_author_name": "LASST", "rt_avatar": "https://pbs.twimg.com/profile_images/2104979097960984576/anq76Mbw_normal.jpg", "rt_id": "2118424745985142784", "likes": 12, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118424805003198598", "author_handle": "LASST_law", "author_name": "LASST", "text": "The structure of the IPO could arguably significantly limit Anthropic’s exposure to the liability rules that ordinarily apply to material misstatements in an IPO registration statement.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118424805003198598", "created_at": "Thu Nov 05 19:26:46 +0000 2026"}, {"id": "2118424861953642866", "author_handle": "LASST_law", "author_name": "LASST", "text": "Under Section 11 of the Securities Act, “strict liability” applies to material misstatements in a securities registration statement like an S-1. Strict liability is a challenging standard for defendant companies; it means that a plaintiff does not have to prove that the company acted with any particular state of mind in making the misstatement.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118424861953642866", "created_at": "Thu Nov 05 19:27:00 +0000 2026"}, {"id": "2118424928244613546", "author_handle": "LASST_law", "author_name": "LASST", "text": "But Anthropic’s IPO structure may sharply limit the number of potential plaintiffs that could bring a strict liability action for a material misstatement in Anthropic’s S-1.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118424928244613546", "created_at": "Thu Nov 05 19:27:15 +0000 2026"}, {"id": "2118425015246819434", "author_handle": "LASST_law", "author_name": "LASST", "text": "Unlike most companies that IPO, Anthropic is not adopting a strict lock-up period for selling unregistered shares in the open market after its IPO date. Instead, it appears likely to allow some employees to sell unregistered shares on the first day of the IPO, including up to 10% of certain holders’ “lock-up securities.”", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425015246819434", "created_at": "Thu Nov 05 19:27:36 +0000 2026"}, {"id": "2118425081256763501", "author_handle": "LASST_law", "author_name": "LASST", "text": "Without a strict lock-up period, shares registered under the S-1 and unregistered shares are likely to intermingle on the open market, and a purchaser may not know whether their shares were registered under the S-1.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425081256763501", "created_at": "Thu Nov 05 19:27:52 +0000 2026"}, {"id": "2118425146231038204", "author_handle": "LASST_law", "author_name": "LASST", "text": "But to bring a Section 11 claim, a plaintiff must be able to prove that their particular shares were registered under the registration statement that contained the misstatement. The Supreme Court confirmed this “traceability” requirement in Slack v. Pirani (2023), where it also acknowledged that “a company’s early investors and employees may own preexisting shares . . . not subject to registration requirements.”", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425146231038204", "created_at": "Thu Nov 05 19:28:07 +0000 2026"}, {"id": "2118425221720154478", "author_handle": "LASST_law", "author_name": "LASST", "text": "When registered and unregistered shares intermingle, traceability to the registration statement can be effectively impossible to establish for many plaintiffs. For example, a federal court dismissed Section 11 claims in Shnayder v. Allbirds, Inc. because employees had been permitted to sell their shares during the first week of an IPO, which effectively destroyed the plaintiffs’ ability to trace their shares to the S-1.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425221720154478", "created_at": "Thu Nov 05 19:28:25 +0000 2026"}, {"id": "2118425296948850808", "author_handle": "LASST_law", "author_name": "LASST", "text": "Anthropic appears poised to permit exactly this intermingling from the first day of the IPO. The practical effect of intermingling is that most aftermarket purchasers would struggle to prove traceability to the S-1, and so would struggle to support a Section 11 claim based on a material misstatement in the S-1.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425296948850808", "created_at": "Thu Nov 05 19:28:43 +0000 2026"}, {"id": "2118425344005054692", "author_handle": "LASST_law", "author_name": "LASST", "text": "A company whose technology threatens catastrophic harm should not be less accountable for S-1 misstatements than almost every other company that IPOs.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425344005054692", "created_at": "Thu Nov 05 19:28:55 +0000 2026"}, {"id": "2118425386799243662", "author_handle": "LASST_law", "author_name": "LASST", "text": "Information, not legal advice. Consult a lawyer for your specific situation.", "links": {}, "media": [], "url": "https://x.com/LASST_law/status/2118425386799243662", "created_at": "Thu Nov 05 19:29:05 +0000 2026"}]}, {"id": "2118440592149815405", "url": "https://x.com/theobearman/status/2118440592149815405", "text": "ANTHROPIC’S RESPONSIBLE SCALING OFFICER: “In the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.”", "created_at": "2026-11-05T20:29:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "Sam_McCandlish", "text": "I'm Sam, one of Anthropic's co-founders, and I lead much of our safety work. I'm going to have more to share on that work over the coming months.\n\nI thought I'd start by sharing a few thoughts on the latest report from @METR_Evals.\n\nThe speed of progress in model capabilities is one of the most important questions in AI safety, and METR’s work here provides the public with an independent, external view into how this is happening inside Anthropic. I’ll talk more about some of the details below, but first some context for those new to this work.\n\nHow quickly AI progress is accelerating has many important safety implications, since it determines how quickly the risks from advanced models increase. But, because most research happens within the frontier labs, it’s difficult for external observers and policy makers to get a strong sense of what that rate is. We kicked off the process with METR that led to this report earlier in the year, in anticipation of progress continuing to accelerate.\n\nFor this report, we gave METR access to a range of sensitive internal data, including benchmark scores for unreleased models, estimates of how models are progressing, and interviews with our researchers. They had complete independence to form their own conclusions.\n\nMany of their conclusions match my own. AI is speeding up our research, but it’s hard to say exactly how much. While they conclude AI can't yet make the most important contributions to model training on its own, they think the pace of development could, by default, accelerate further.\n\nThis work began well before and is separate from the embedded third-party evaluators that are part of our commitment to pacing the frontier, but it’s a good illustration of why we think evaluators are a good idea. The more access reviewers have, the clearer a picture they can form of the situation and the better-positioned they are to highlight situations like this one.\n\nWe redacted a lot, and I accept that this makes it harder for others to check METR’s work. But we determined that sharing exactly what is driving the speedup isn’t the right thing to do, both because it’s commercially sensitive and because it risks handing out a roadmap for others to go faster. That would make the risks METR is worried about worse. That’s a tradeoff. I think we made the right call, though we’re continuing to assess the pros and cons here.\n\nIn the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3}, {"id": "2118423295733178654", "url": "https://x.com/theobearman/status/2118423295733178654", "text": "METR’s assessment shows there are three internal models at Anthropic that are generally more capable than Mythos 5.1 and two more capable than Opus 5.5. https://t.co/c9CEUapUw0", "created_at": "2026-11-05T19:20:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYmwmgWwAAdch3.jpg"}], "quoted": {"author": "METR_Evals", "text": "This report shares our three subjective conclusions about risk:\n\n1. We believe that, as of Oct 2026, the pace of capability growth on well-specified tasks is likely about 2x what it was from Mar 2024 to Oct 2025. We’re highly uncertain and would not be surprised by 1.3x–3x.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/c9CEUapUw0": ""}, "enriched": 3}, {"id": "2118419703999668437", "url": "https://x.com/theobearman/status/2118419703999668437", "text": "“We understand that AI is not yet able to make highly significant and fully autonomous contributions to the most important parts of the model training process. However, researchers described significant “signs of life” implying such contributions could occur soon, although with substantial variation depending on the area. Further details were redacted. This evidence came from:\n\n- Multiple interviews from researchers working to automate different parts of the training pipeline.\n- Internal reports on the degree of automation in different parts of the pipeline.\n- Quantitative analysis on the percent of tasks in a relevant pipeline that were built by humans or AIs.”", "created_at": "2026-11-05T19:06:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118413382281752994", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118413382281752994", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Explains the S1 update now.", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2118413382281752994", "created_at": "Thu Nov 05 18:41:23 +0000 2026"}}, {"id": "2118416994366058521", "url": "https://x.com/theobearman/status/2118416994366058521", "text": "“A key concern is that acceleration from the use of AI could start to compound, as the development of more capable models leads to further acceleration. As we describe below, we did not identify any clear bottlenecks (limited inputs that would prevent further growth) or steep diminishing returns to further scaling that would get in the way of such compounding acceleration, though our understanding evolved several times over the course of this assessment, and we have significant uncertainty. Because of this, we believe there is a significant risk that further capabilities progress could lead to even faster acceleration over the coming year.”", "created_at": "2026-11-05T18:55:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118413382281752994", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118413382281752994", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Explains the S1 update now.", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2118413382281752994", "created_at": "Thu Nov 05 18:41:23 +0000 2026"}}, {"id": "2118416702157340714", "url": "https://x.com/theobearman/status/2118416702157340714", "text": "“Beyond the AECI evidence, we also saw redacted evidence that significantly informed our view on this question, and made us take this apparent ≈2x acceleration more seriously. It also gave us some indication that acceleration could be above 2x and increasing over time, though we would be surprised if it was significantly higher.”", "created_at": "2026-11-05T18:54:34+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118413382281752994", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118413382281752994", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Explains the S1 update now.", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2118413382281752994", "created_at": "Thu Nov 05 18:41:23 +0000 2026"}}, {"id": "2118415464816877899", "url": "https://x.com/theobearman/status/2118415464816877899", "text": "“Note that neither METR nor Anthropic intended for this project to involve full “employee-like” access, meaning unmediated access to data, documents, or models. In particular, this project is not the one described in Anthropic’s October 15 update on independent evaluators.”\n\n“Despite the access provided to METR, it is clear that staff-level access would enable a significantly deeper assessment. Our pipeline of information was relatively narrow, and a small number of our requests for data were denied. Being able to read documents on demand, observe internal discussion and debate, and have frequent and diverse conversations would have allowed for a richer view. While we believe we had access to the bulk of relevant information, it is possible we missed important information because we did not know it existed or could not look for it ourselves.”", "created_at": "2026-11-05T18:49:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [], "quoted": {"author": "METR_Evals", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3}, {"id": "2118689629876490245", "url": "https://x.com/theobearman/status/2118689629876490245", "text": "@LASST_law analysis suggests it may be the case that many investors in Anthropic post-IPO may not be able to hold the company to account for any material misstatements or omissions in the S1 because of a lack of a strict lock-up period.", "created_at": "2026-11-06T12:59:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "LASST_law", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "LASST_law", "text": "Anthropic appears to have structured its IPO in a way that could make it much harder for investors to hold the company accountable for misstatements in its registration statement. This comes down to a technical rule about who is allowed to sue. \n\nA 🧵, to explain:", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118470775418060920", "url": "https://x.com/theobearman/status/2118470775418060920", "text": "Chairman @RepMoolenaar, Chairman @RepBrianMast, and Chairman @RepRickCrawford have sent a letter to NVIDIA CEO Jensen Huang asking him to appear before their three committees this month. The letter expresses concerns over NVIDIA’s security protocols against foreign adversary espionage and Mr. Huang’s reported ties to a Chinese intelligence-linked executive of a Singapore-based data center company.", "created_at": "2026-11-05T22:29:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChinaSelect", "rt_author_name": "Select Committee on China", "rt_avatar": "https://pbs.twimg.com/profile_images/1998463046943899649/NJGmFUqQ_normal.jpg", "rt_id": "2118452107590189291", "likes": 339, "retweets": 147, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZA9xUW4AAbJUG.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118754777534529835", "url": "https://x.com/theobearman/status/2118754777534529835", "text": "@tobyordoxford Note that the report says that lots of redacted information was relevant to their views, presumably including the ~2x estimate. My read of the public report is that you shouldn't assume that the AECI trend is the main/only relevant data; this is just the main unredacted data", "created_at": "2026-11-06T17:17:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118753084780511504", "likes": 29, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118754452265951727", "url": "https://x.com/theobearman/status/2118754452265951727", "text": "Shameless plug for my own research but I argued in an @iapsAI policy memo last month that cos and their evaluators should have cooling-oﬀ periods in both directions—not hiring individual evaluators after their engagement ends, and not using former employees as embedded evaluators after their employment ends—for a minimum of one year.\n\nhttps://t.co/iJga5c0cbD", "created_at": "2026-11-06T17:16:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdT8buWQAAt0wb.jpg"}], "quoted": {"author": "_NathanCalvin", "text": "Uhhh Anthropic made an offer to one of the risk assessment staff at METR during this project??? (Which the person declined)\n\nWe need rules about independent evaluators going to cos they evaluate after and in the meantime companies should be shamed for trying this stuff https://t.co/2ca51xSV5K", "links": {"https://t.co/2ca51xSV5K": ""}}, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/iJga5c0cbD": "https://www.iaps.ai/research/embedded-evaluators-for-frontier-ai-contractual-foundations-for-credible-assessments"}, "enriched": 3}, {"id": "2118955531234677020", "url": "https://x.com/theobearman/status/2118955531234677020", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "created_at": "2026-11-07T06:35:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Thomas_Woodside", "rt_author_name": "Thomas Woodside 🫜", "rt_avatar": "https://pbs.twimg.com/profile_images/1772349169484681216/xrSVla58_normal.jpg", "rt_id": "2118786981580968385", "likes": 100, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdwyOhaUAAdGvi.png"}], "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118952119072104736", "url": "https://x.com/theobearman/status/2118952119072104736", "text": "What if a swarm of AI agents could learn to work together on its own? 🐝\n\nNo leader. No roles. No turn order. Just one shared reward.\n\nOur new paper s³: multi-agent RL lets LLM swarms self-organize, beat best-of-N, and scale past their training size!\n\nhttps://t.co/c4SyIKhX7O 🧵", "created_at": "2026-11-07T06:22:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "kjha02", "rt_author_name": "Kunal Jha", "rt_avatar": "https://pbs.twimg.com/profile_images/1770229471108317184/Tb2q39cy_normal.jpg", "rt_id": "2118743696246194621", "likes": 259, "retweets": 45, "media": [], "links": {"https://t.co/c4SyIKhX7O": "https://scalingswarms.com/"}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "thread": [{"id": "2118743779637407751", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "Almost every multi-agent system today is hand-built. Someone decides who leads, who does what, and when agents talk.\n\nBut the bitter lesson keeps telling us that learned behavior beats designed behavior.\n\nSo we asked: what if the organization itself is learned?", "links": {}, "media": [], "url": "https://x.com/kjha02/status/2118743779637407751", "created_at": "Fri Nov 06 16:34:16 +0000 2026"}, {"id": "2118743876894961671", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "The recipe is simple. Every agent can message any teammate, anytime, asynchronously.\n\nThey all share one reward: the team wins if anyone solves the task.\n\nEvery token gets its team's advantage, so agents get credit for helping each other. No one tells them how to cooperate. https://t.co/h2izIpogRH", "links": {"https://t.co/h2izIpogRH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdKT8aa8AA1BJw.png"}], "url": "https://x.com/kjha02/status/2118743876894961671", "created_at": "Fri Nov 06 16:34:39 +0000 2026"}, {"id": "2118743977914679433", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "We test two things groups do better than individuals: information aggregation and decentralized exploration.\n\nBoth get harder with more agents! Aggregation breaks if a single message is lost. Exploration has to beat N independent agents, a baseline that keeps rising with N https://t.co/zm5baYI0o0", "links": {"https://t.co/zm5baYI0o0": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdKaHaaQAEIHd4.png"}], "url": "https://x.com/kjha02/status/2118743977914679433", "created_at": "Fri Nov 06 16:35:03 +0000 2026"}, {"id": "2118744055005987236", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "First, information aggregation. Each agent gets a secret number; the swarm must assemble the full list.\n\nSounds easy, but it's a coordination nightmare: who has spoken, who's waiting, who's repeating?\n\ns³ hits 93%. Imitating successful swarms gets 35%. Individual rewards? 13%. https://t.co/0pcTjrrWxq", "links": {"https://t.co/0pcTjrrWxq": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdKe29aIAAVEp8.png"}], "url": "https://x.com/kjha02/status/2118744055005987236", "created_at": "Fri Nov 06 16:35:21 +0000 2026"}, {"id": "2118744146307670517", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "Then we push past training. Swarms trained with 4 agents get dropped into teams of 8.\n\nThe baselines collapse. s³ solves 25x more problems than the strongest one.\n\nThe coordination it learned transfers to swarms it has never seen! https://t.co/vpSMfeXxJd", "links": {"https://t.co/vpSMfeXxJd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdKkP5aQAM0N9f.png"}], "url": "https://x.com/kjha02/status/2118744146307670517", "created_at": "Fri Nov 06 16:35:43 +0000 2026"}, {"id": "2118744232307605880", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "Why do individual rewards fail? The agents fall into a social dilemma 🤯\n\nSharing your number only helps teammates, so every agent waits for someone else to go first. Eventually no one shares.\n\nWith a shared reward, a clean protocol emerges: everyone broadcasts once, early https://t.co/WxYPLVyV3y", "links": {"https://t.co/WxYPLVyV3y": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdKpIIaQAAtDUj.png"}], "url": "https://x.com/kjha02/status/2118744232307605880", "created_at": "Fri Nov 06 16:36:04 +0000 2026"}, {"id": "2118744336372482172", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "Next, decentralized exploration. Agents race through a maze; any one could find the exit alone.\n\nWith s³, the swarm learns to divide and conquer: agents claim branches and report dead ends. Repeated work drops ~50%, and 4 communicating agents nearly match 6 independent ones! https://t.co/ClgxtZy18W", "links": {"https://t.co/ClgxtZy18W": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdKuOfaQAECIDH.png"}], "url": "https://x.com/kjha02/status/2118744336372482172", "created_at": "Fri Nov 06 16:36:28 +0000 2026"}, {"id": "2118744392446132561", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "This is just the beginning. We’re now scaling s³ to bigger models and harder tasks.\n\nWe think learning to self-organize could open up a whole new set of research directions for multi-agent systems, and we can’t wait to see what swarms learn next 🚀", "links": {}, "media": [], "url": "https://x.com/kjha02/status/2118744392446132561", "created_at": "Fri Nov 06 16:36:42 +0000 2026"}, {"id": "2118744489204531704", "author_handle": "kjha02", "author_name": "Kunal Jha", "text": "Huge thanks to my amazing co-leads and collaborators!\n@goncalorafaria @StellaLisy @scottgeng00 @faeze_brh @nlpnoah @tsvetshop @maxhkw @natashajaques\n\nProject webpage: https://t.co/9DSwvlQ5u1\n\nRead the full paper here: https://t.co/7Vl1dSTwyq", "links": {"https://t.co/9DSwvlQ5u1": "https://scalingswarms.com", "https://t.co/7Vl1dSTwyq": "https://scalingswarms.com/paper.pdf"}, "media": [], "url": "https://x.com/kjha02/status/2118744489204531704", "created_at": "Fri Nov 06 16:37:05 +0000 2026"}]}, {"id": "2118821384432570505", "url": "https://x.com/theobearman/status/2118821384432570505", "text": "Memory is what allows Claude to learn from experience. In a new Engineering Blog post, we share how “dreaming” helps Claude organize what it’s learned, correct its mistakes, and find what it needs more easily the next time. https://t.co/uUEN4bNkr9", "created_at": "2026-11-06T21:42:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2118814753154064501", "likes": 9915, "retweets": 853, "media": [], "links": {"https://t.co/uUEN4bNkr9": "https://www.anthropic.com/research/components-of-agent-memory"}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118821348499726671", "url": "https://x.com/theobearman/status/2118821348499726671", "text": "I am a broken record about this, but: frontier agents are not going to be a purely digital phenomenon for much longer. They will be able to use anything in the physical world that can be actuated programmatically—first competently, then at human-expert level, then superhuman. By and large, we probably won’t need specialist models; the frontier models will just do it. If your model of the future hinges on physical AI happening “for real” many years into the future, I think you will be in for a surprise.", "created_at": "2026-11-06T21:42:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "rt_avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "rt_id": "2118799206785937844", "likes": 1442, "retweets": 134, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118820886291923109", "url": "https://x.com/theobearman/status/2118820886291923109", "text": "And they confirmed as much in the S1! https://t.co/aE54Q3RPMW", "created_at": "2026-11-06T21:40:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 53, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWeQXQAXwAAg35q.jpg"}], "links": {"https://t.co/aE54Q3RPMW": ""}, "quoted": {"id": "2118472900596625546", "author_name": "Andrew Curran", "links": {}, "author": "AndrewCurran_", "text": "@DKokotajlo @AnthropicAI They've been pedal to the metal afterburners on since Dario said at the WEF they were leaning into RSI. They said they support pacing, not that they were pacing."}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2119754129639670200", "url": "https://x.com/theobearman/status/2119754129639670200", "text": "I hope the 1.54 million have read the privacy policy.\n\nhttps://t.co/nZmooyZSit https://t.co/eNjP6CQ92V", "created_at": "2026-11-09T11:29:02+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWrhGAXXgAA09qY.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWrhHRTXcAAshlO.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWrhINdXoAAnv7i.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWrhJKLXQAEmw5c.jpg"}], "links": {"https://t.co/nZmooyZSit": "https://www.deepseek.com/en/harness/privacy/", "https://t.co/eNjP6CQ92V": ""}, "quoted": {"id": "2119501868565139840", "author_name": "Andrew Curran", "links": {"https://t.co/A5lHupSfRS": ""}, "author": "AndrewCurran_", "text": "DeepSeek Harness has reached 1.54 million DAU in less than three months. https://t.co/A5lHupSfRS"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119531839723278678", "url": "https://x.com/theobearman/status/2119531839723278678", "text": "We just issued a press release from our board of directors. Read the release: https://t.co/W9yXWJzbkk", "created_at": "2026-11-08T20:45:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "r hor_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119887995755253911", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "parent": {"id": "2119887995755253911", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@justjoshinyou13 @KelseyTuoc My best guess is that Mythos 5.2 is Model 3 + AI R&amp;D  nerfing.\nhttps://t.co/cn9TT0ogUa", "links": {"https://t.co/cn9TT0ogUa": "https://x.com/theobearman/status/2119872427291488494?a=PxR9I8Uf-GRezgFjPm4&s=20"}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2119887995755253911", "created_at": "Mon Nov 09 20:20:58 +0000 2026"}, "enriched": 3}, {"id": "2119886674620788795", "url": "https://x.com/theobearman/status/2119886674620788795", "text": "Great to be quoted by @ben_guggenheim in today’s WaPo AI &amp; Tech Brief on METR’s report on R&amp;D Acceleration at Anthropic. Such is the pace of change, we now know the identity of one of these models (but not the most capable one Anthropic had as of last month) was Mythos/Fable 5.2! https://t.co/mcchdPxhlo", "created_at": "2026-11-09T20:15:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtZsbcWwAATqQx.jpg"}], "links": {"https://t.co/mcchdPxhlo": ""}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119882657379279235", "url": "https://x.com/th
