_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "quoted": {"author": "NateSilver538", "text": "Uhhhh, Scott Colom leads in Mississippi by 28 votes. https://t.co/Rb81ECzCm1", "links": {"https://t.co/Rb81ECzCm1": ""}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117909424090014074", "url": "https://x.com/robertwiblin/status/2117909424090014074", "text": "@ONagel33303 @GWHayduke97 I believe we only list safety, security and alignment roles:\n\nhttps://t.co/GuYfSxQ3FT\n\nI think that's the right call. \n\nOne can make an argument against being willing to take even those jobs, but I think the arguments in favour are substantially stronger (for the right person).", "created_at": "2026-11-04T09:18:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "ONagel33303", "reply_to_id": "2117891542065283410", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/GuYfSxQ3FT": "https://jobs.80000hours.org/?refinementList%5Bcompany_data%5D%5B0%5D=Anthropic&refinementList%5Bcompany_data%5D%5B1%5D=OpenAI&refinementList%5Bcompany_data%5D%5B2%5D=Google%20DeepMind"}, "enriched": 1}, {"id": "2117908775164064037", "url": "https://x.com/robertwiblin/status/2117908775164064037", "text": "A small theory of mine is that Rishi Sunak’s decision to set up the AISI might be one of the most important prime ministerial decisions of this century.", "created_at": "2026-11-04T09:16:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "TomChivers", "rt_author_name": "Tom Chivers", "rt_avatar": "https://pbs.twimg.com/profile_images/1150687971760386048/Bxw2xVV4_normal.png", "rt_id": "2117898093035503661", "likes": 321, "retweets": 29, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117732278214271276", "url": "https://x.com/robertwiblin/status/2117732278214271276", "text": "Abdul El-Sayed is the Pause AI candidate: https://t.co/8Ol7Lc6V2x", "created_at": "2026-11-03T21:34:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "rt_avatar": "https://pbs.twimg.com/profile_images/1942934295363903488/fpfcb6Ug_normal.jpg", "rt_id": "2117452882773684550", "likes": 16654, "retweets": 743, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117451427987726336/img/hSNVIejIcIcM3I3z.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/8Ol7Lc6V2x": ""}, "enriched": 1}, {"id": "2117731266686509350", "url": "https://x.com/robertwiblin/status/2117731266686509350", "text": "I forgot to add that I also encourage people to praise companies when they do good things at cost to their own profit/competitiveness - it helps incentivize them to take more actions of thatkind and also makes people at the company take your criticisms more seriously.", "created_at": "2026-11-03T21:30:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2117693988954382717", "likes": 23, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117731199150072253", "url": "https://x.com/robertwiblin/status/2117731199150072253", "text": "Good video. Complaining about AI companies doing bad things (even just on twitter) really works! You don't even necessarily need to have lots of followers to do it (though of course that helps) - the algorithm often helps surface high effort posts. \n\nMany more people should do this - including possibly you, the person reading this! Read primary sources that companies put out and complain about them if you think they are bad! Employees at the companies will read them (in rare cases, sometimes the CEOs of the company will read them!). \n\nI think there are only about a dozen or so accounts on this platform who frequently post about AI company misdeeds, but there is a far greater quantity of shenanigans sitting in public view yet to be noticed.  \n\nWe need laws and many forms of stronger deterrence than just public shame, but public criticism really can make a difference! The criticism is also particularly effective when its grounded in details that people who work at the companies may not be aware of (e.g. specific language in draft legislation or a system card or a quote from a company spokesman to press or the actions of a companies affiliated political arm etc.) and tries to recognize that AI companies are not necessarily monoliths acting with one single intent.", "created_at": "2026-11-03T21:30:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2117692510914904569", "likes": 98, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118280106343104798", "url": "https://x.com/robertwiblin/status/2118280106343104798", "text": "More information about what they offer: https://t.co/zsUCYnt9xe", "created_at": "2026-11-05T09:51:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2118279875190501470", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWWkfibW0AAp5Wt.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/zsUCYnt9xe": ""}, "enriched": 1}, {"id": "2118279875190501470", "url": "https://x.com/robertwiblin/status/2118279875190501470", "text": "The Tarbell Fellowship has produced a series of excellent AI journalists. Seems like a great program.\n\nThey're currently choosing their next cohort - apps close 22 Nov.\n\nIf you want to help with AI, seriously consider it (and tell suitable friends).\n\nhttps://t.co/tsZUuw3VMS", "created_at": "2026-11-05T09:50:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 1, "media": [], "quoted": {"author": "robertwiblin", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/tsZUuw3VMS": "https://www.tarbellcenter.org/fellowship"}, "enriched": 1}, {"id": "2118267376227828038", "url": "https://x.com/robertwiblin/status/2118267376227828038", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-05T09:01:12+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1418, "retweets": 212, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118098831690932555", "url": "https://x.com/robertwiblin/status/2118098831690932555", "text": "@mattcschwartz Great catch, I think the website must be buggy.\n\nBut I don't get why it's bugging just on Vance. I'll delete the post.\n\nFor people seeing this, he's declining but much less than this: https://t.co/sFyMuKyPp8 https://t.co/hy1jqM6rvN", "created_at": "2026-11-04T21:51:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "mattcschwartz", "reply_to_id": "2118098006184522170", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT_a9NWgAErYuU.jpg"}], "quoted": null, "fetched_at": "2026-1 13009089392653", "url": "https://x.com/robertwiblin/status/2118413009089392653", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T18:39:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 64, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118393011122130962", "url": "https://x.com/robertwiblin/status/2118393011122130962", "text": "This feels like a truly generational vibe shift in politics – a swing so large and enduring it won't be reversed for at least 6 months.", "created_at": "2026-11-05T17:20:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 100, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118459584201289902", "url": "https://x.com/robertwiblin/status/2118459584201289902", "text": "Yet another correct prediction by AI 2027. In the scenario, speedup from AI is 2x around Dec 2026. I don't like that progress is roughly going as fast as AI 2027 predicted, given that in the scenario, ASI happens in 2027.\n\n(my actual median for ASI is 2028/2029) https://t.co/oJVVvf5KvI", "created_at": "2026-11-05T21:44:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "nikolaj2030", "rt_author_name": "Nikola Jurkovic", "rt_avatar": "https://pbs.twimg.com/profile_images/2087614574690463744/VXhXw1cq_normal.jpg", "rt_id": "2118426318836793659", "likes": 749, "retweets": 62, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYoJMqbgAAXKYM.png"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/oJVVvf5KvI": ""}, "enriched": 1}, {"id": "2118459495953138000", "url": "https://x.com/robertwiblin/status/2118459495953138000", "text": "Yet more terrible news suggesting RSI could take off in 2027 (if not stopped), with superintelligence to follow soon after.", "created_at": "2026-11-05T21:44:37+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 195, "retweets": 22, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118459106612625480", "url": "https://x.com/robertwiblin/status/2118459106612625480", "text": "Truly outstanding stuff, thanks Michael and team! 🇺🇸", "created_at": "2026-11-05T21:43:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 129, "retweets": 1, "media": [], "quoted": {"author": "mkratsios47", "text": "Today, we released the National Policy for Nucleic Acid Synthesis Screening to protect American biotechnology innovation while reducing the risk of misuse. \n\nThis policy establishes a new, government-wide screening requirements for synthetic DNA and the equipment used to make it. It will ensure companies selling nucleic acid sequences and synthesis equipment know their customers and prevent the malicious use of these materials and tools.\n\nThis policy strengthens our Nation’s biosecurity posture by establishing rigorous U.S. government-wide procurement screening and physical security standards for synthetic biology. It replaces outdated “self-attestation” systems with robust, independent verification. It creates a dynamic, SI-powered screening layer that assesses the biological risk from nucleic acid sequences, allowing the U.S. to anticipate and prevent malicious use and help stop dangerous gain-of-function research. \n\n@NIST will issue rigorous new screening standards and @HHSGov and @USDA will certify synthetic biology providers. Together, these measures will strengthen American biosecurity, safeguard responsible innovation, and establish a global standard for safe and transparent synthetic biology tools and research.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118458166279278707", "url": "https://x.com/robertwiblin/status/2118458166279278707", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions nks": {}, "enriched": 1}, {"id": "2117324338990883228", "url": "https://x.com/deanwball/status/2117324338990883228", "text": "@MakiHacks same tbh", "created_at": "2026-11-02T18:33:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MakiHacks", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117300835885482280", "url": "https://x.com/deanwball/status/2117300835885482280", "text": "@logangraham arrrrr", "created_at": "2026-11-02T17:00:31+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "logangraham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117288510835061083", "url": "https://x.com/deanwball/status/2117288510835061083", "text": "@curiousben If your bet is that helium prices will drive up semi prices so much so as to cause demand destruction in for ai tokens, I suggest actualizing it! You could make a ton of money.", "created_at": "2026-11-02T16:11:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "curiousben", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117288193535983993", "url": "https://x.com/deanwball/status/2117288193535983993", "text": "I always cringe a little when people refer to me as an “expert” in ai policy. This field is too new, too thinly institutionalized, too pre-paradigmatic, to have any experts at all. We are on the open seas.\n\nThe positive side of this is that the field is wide open to people looking to make novel contributions. There is no grand literature to learn, no pantheon of elders to whom one must pay their dues.", "created_at": "2026-11-02T16:10:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 194, "retweets": 5, "media": [], "quoted": {"author": "AndyMasley", "text": "Lose a lot of respect for people who flash their credentials as experts in a field to argue for a very contested idea within the field as if it's the official position that all non-experts should defer to.", "links": {}}, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117656425438605340", "url": "https://x.com/deanwball/status/2117656425438605340", "text": "@AnthonyMaio Just haven’t had time to engage with it thoroughly and as a general policy I do not comment publicly on things I have not read", "created_at": "2026-11-03T16:33:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AnthonyMaio", "reply_to_id": "2117630747955646508", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117405375200993479", "url": "https://x.com/deanwball/status/2117405375200993479", "text": "@AirmetNoah The way I got started was translating state AI legislation into plain English, and it was less than three years ago! This is a good idea and imo the market is still underserved", "created_at": "2026-11-02T23:55:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AirmetNoah", "reply_to_id": "2117403182490148951", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117405081947828619", "url": "https://x.com/deanwball/status/2117405081947828619", "text": "Without commenting on the Takehi et al. “Weight-Space Programming” work in particular, I do suspect that a lot of RSI (and a lot of AI-driven scientific progress more broadly) will be driven by applying what were once mundane-but-difficult techniques at a scale that would have been unimaginable when the techniques were invented.", "created_at": "2026-11-02T23:54:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 178, "retweets": 7, "media": [], "quoted": {"author": "AlexKrentsel", "text": "the way I'm thinking about this - there's a whole body of work of interpretably research from 2010s a la \"look at model, this neuron lights up when image contains dog, so this is the dog neuron\". this seems akin to that, but scaled beyond human capability", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117697164952441069", "url": "https://x.com/deanwball/status/2117697164952441069", "text": "ChatGPT and Codex are helping engineers build for the physical world.\n\nWe’re sharing our progress across mechanical design, electrical engineering, and simulation—from helping our hardware teams iterate faster to testing new workflows with industry collaborators. https://t.co/b3rW9zYJGA", "created_at": "2026-11-03T19:15:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117692475775258785", "likes": 2808, "retweets": 200, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWOOL0QWwAA5B61.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/b3rW9zYJGA": ""}, "enriched": 1}, {"id": "2118011911770136592", "url": "https://x.com/deanwball/status/2118011911770136592", "text": "@dwallacewells Agreed.", "created_at": "2026-11-04T16:06:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "dwallacewells", "reply_to_id": "2118011002696487018", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118000801176330377", "url": "https://x.com/deanwball/status/2118000801176330377", "text": "Checks and balances still work \n\nThat's something everyone in the west should celebrate, even (or especially) if you are the ones being checked", "created_at": "2026-11-04T15:21:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kevinsxu", "rt_author_name": "Kevin S. Xu", "rt_avatar": "https://pbs.twimg.com/profile_images/639471677345107968/6u2MrXkZ_normal.jpg", "rt_id": "2117970522445434940", "likes": 56, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117993348480860162", "url": "https://x.com/deanwball/status/2117993348480860162", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T14:52:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2117963022434001035", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117983878883279231", "url": "https://x.com/deanwball/status/2117983878883279231", "text": "incumbency disadvantage is the most interesting feature of 21st century American politics to me", "created_at": "2026-11-04T14:14:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 107, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117943982969737384", "url": "https://x.com/deanwball/status/2117943982969737384", "text": "Rule one of \"nothing ever happens\" is the reactions on twitter to the implications of an election night are overblown (especially economic).", "created_at": "2026-11-04T11:36:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "rt_avatar": "https://pbs.twimg.com/profile_images/2051823244832083968/Nr0pT8-V_normal.jpg", "rt_id": "2117827828985307379", "likes": 110, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117787648873926809", "url": "https://x.com/deanwball/status/2117787648873926809", "text": "As models automate more and more of the tasks involved in AI research, many people (myself included) worry this could dramatically accelerate progress and leave humanity with less control over the process.\n\nWhen people say “recursive self-improvement” (RSI), it’s often unclear to me whether they mean just the automation piece or that whole scenario. I think the whole scenario is a plausible default. But importantly, these things can come apart.\n\nFor one thing, good old-fashioned human research could uncover a new architecture or a new way to scale that dramatically speeds up progress, without models doing any more of the work. On the flip side, it's possible you could fully automate AI research and find that progress hardly speeds up because the bottleneck is still waiting for experiments. And all else equal, at a given pace of progress, I think more automation is probably net good because it should leave people more time to understand the safety and alignment properties of the models, for operational excellence, etc.\n\nEven if models are doing essentially all the research and progress is speeding up, I can imagine pretty different worlds. Say a country of geniuses in a datacenter thinks for a month and writes a four-page paper describing a much more efficient architecture. Humans pore over it, understand every detail, and decide to try it. The models train the successor and make a safety argument for using it that humans can actually understand and check. Alternatively, say the models are asked to produce their successor directly. They deliver one just as good, just as quickly, along with a spaghetti mess of code and an extremely convoluted safety argument that nobody can really follow. I think humans clearly have a lot more control over the process in the first world.\n\nSo I think we should be clear about what we mean when we talk about RSI and how we might put limits on it:\n• How much of the research are models doing?\n• How fast is AI improving?\n• How much do humans understand about what’s happening, and how much control do we have over it?\n\nWhen people talk about controlling RSI, I think they often jump to limiting how much models can help with research. But my guess is they’re often actually more concerned about the pace of progress and whether humanity can still understand and steer the research. I think there are legitimate reasons that controlling inputs may be easier than directly controlling outputs, but I think we should at least try to be clear about our goals and what we potentially gain (or lose) by optimizing a proxy.", "created_at": "2026-11-04T01:14:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "rt_avatar": "https://pbs.twimg.com/profile_images/1966534318077194240/NyhJ0EPD_normal.jpg", "rt_id": "2117767212186341726", "likes": 134, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118061335913349546", "url": "https://x.com/deanwball/status/2118061335913349546", "text": "@zdch woah! congrats", "created_at": "2026-11-04T19:22:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "zdch", "reply_to_id": "2118039732412424359", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {}, "enriched": 1}, {"id": "2118211919790194723", "url": "https://x.com/deanwball/status/2118211919790194723", "text": "I am sorry senator, but we did not lose any votes over \"government ownership of semiconductors companies and rare earth miners.\"\n\nThe boomercon cohort is just as out of touch with the American voter as MAGA diehards.", "created_at": "2026-11-05T05:20:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Scholars_Stage", "rt_author_name": "T. Greer", "rt_avatar": "https://pbs.twimg.com/profile_images/115247583/Learned_Ape1_normal.jpg", "rt_id": "2118210433307771103", "likes": 301, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118210765484175445", "url": "https://x.com/deanwball/status/2118210765484175445", "text": "“The freedom that will be used by only one man in a million may be more important to society and more beneficial to the majority than any freedom that we all use.”", "created_at": "2026-11-05T05:16:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118209399143489569", "url": "https://x.com/deanwball/status/2118209399143489569", "text": "“It would be almost a contradiction in terms for a politician to be a leader in the field of ideas. His task in a democracy is to find out what the opinions held by the largest number are, not to give currency to new opinions which may become the majority view in some distant future.”", "created_at": "2026-11-05T05:10:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 4, "media": [], "quoted": {"author": "tszzl", "text": "the federal government and who runs it is a very small part of the story in america, by design. most of history happens with its private citizens and their enterprise and individual courage. easy to forget in the onslaught of political media", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118208547712540971", "url": "https://x.com/deanwball/status/2118208547712540971", "text": "the federal government and who runs it is a very small part of the story in america, by design. most of history happens with its private citizens and their enterprise and individual courage. easy to forget in the onslaught of political media", "created_at": "2026-11-05T05:07:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/x
