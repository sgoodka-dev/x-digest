g bubbles in Final Fantasy 14, the Metaverse, and other digital worlds. https://t.co/IGDD85uucL", "created_at": "2026-11-13T22:38:07+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2121286972928860437", "likes": 60, "retweets": 7, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121233774356676608/img/UNwN6bo1D4Pknn9z.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121233774356676608/img/UNwN6bo1D4Pknn9z.jpg"}], "links": {"https://t.co/IGDD85uucL": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121368760317538643", "url": "https://x.com/dwarkesh_sp/status/2121368760317538643", "text": "Even if we don't get a full-on singularity, the intelligence explosion might compress 4 years of progress at the current pace into a single year.\n\nThat’s a jump as big as GPT-3.5 to GPT-6 Astra in just 12 months.\n\nThat would still result in absolutely insane capabilities. https://t.co/woRayV8Eya", "created_at": "2026-11-13T22:25:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 541, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334617169096704/img/mQr9fAN_0u_GP6yA.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334617169096704/img/mQr9fAN_0u_GP6yA.jpg"}], "links": {"https://t.co/woRayV8Eya": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121359806879649924", "url": "https://x.com/dwarkesh_sp/status/2121359806879649924", "text": "that's why I also slept with jensen", "created_at": "2026-11-13T21:49:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7245, "retweets": 271, "media": [], "links": {}, "quoted": {"id": "2120978545631769002", "author_name": "Lain on the Blockchain", "links": {}, "author": "CryptoCyberia", "text": "Dwarkesh is a very obvious and archetypal example of a federal agent btw."}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2120236102028255566", "url": "https://x.com/Lewis_Bollard/status/2120236102028255566", "text": "Years ago I worked on campaigns against cockfighting. The cockfighters always said their birds were the lucky ones: well fed, safe from predators, and free to exercise.\n\nThe irony is that this is far truer of fighting birds than of the chickens we eat.\n\nFighting birds are conditioned like athletes. The chickens we eat are packed too tightly to move, and bred to grow so fast that many can barely walk.\n\nFighting birds are fed well. The parents of the chickens we eat are kept hungry their whole lives — or they’d grow too big to survive.\n\nFighting birds live a year or two, mostly outdoors. The chickens we eat live six weeks in a warehouse, many with blistered skin, lame legs, and failing hearts.\n\nFighting birds do die gruesome deaths. The chickens we eat often do too.\n\nCockfighting is now illegal in all 50 states. Treating the chickens we eat this way is not yet illegal anywhere.", "created_at": "2026-11-10T19:24:13+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 81, "retweets": 10, "media": [], "links": {}, "quoted": {"id": "2120222755341943090", "author_name": "Spacefarer", "links": {}, "author": "KTlge2", "text": "@dwarkeshpodcast @Lewis_Bollard A pig or chicken probably has the best life of any of its kind since its ancestors. \n\nFed everyday like clockwork. Never want for protection from natural predators. Parasites - no worse than what it will get from a natural life. \n\nExercise and general quality of life - excellent. We are what we eat. Why buy from farms that fail on this? \n\nSo - why make weird brainless meat? Stop being a fucking midwit."}, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120231088438288479", "url": "https://x.com/Lewis_Bollard/status/2120231088438288479", "text": "@albrgr @tylercowen Does sacrificing utilitarianism really solve the trilemma? The trilemma seems to be driven by moral status and aggregation, neither of which is unique to utilitarianism.\n\nIn fact, Kantianism and contractualism might both give more weight to smart AIs, as they reward rational agency and the ability to contract / have bargaining power.\n\nI think you need to either just reject moral status for AIs, which feels arbitrary, or reject aggregation, which has its own problems.", "created_at": "2026-11-10T19:04:18+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "albrgr", "reply_to_id": "2119952235308466514", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "parent": {"id": "2119952235308466514", "author_handle": "albrgr", "author_name": "Alexander Berger", "text": "Of Patrick's trilemma I think the obv one to sacrifice is utilitarianism - IMO it's been clear for a long time that it is going to have really perverse conclusions when taken too far, and the interesting/hard question is what is \"too far.\" E.g. @tylercowen raised this critique here https://t.co/0jbyUB5HeA ; I also see this as a big part of the implicit argument here: https://t.co/Po5pWxN5o4", "links": {"https://t.co/0jbyUB5HeA": "https://conversationswithtyler.com/episodes/william-macaskill/#:~:text=just%20say%2C%20well%2C-,the%20utilitarian%20part%20of%20our%20calculations,-%E2%80%94%E2%80%8Ait%E2%80%99s%20embedded%20within", "https://t.co/Po5pWxN5o4": "https://forum.effectivealtruism.org/posts/T975ydo3mx8onH3iS/ea-is-about-maximization-and-maximization-is-perilous"}, "media": [], "url": "https://x.com/albrgr/status/2119952235308466514", "created_at": "Tue Nov 10 00:36:14 +0000 2026"}, "enriched": 3}, {"id": "2120941660951691322", "url": "https://x.com/Lewis_Bollard/status/2120941660951691322", "text": "@nanransohoff @albrgr Yes for ending crates it’s me! Would love to chat with anyone interested in funding this goal. We have some of the GMs, but we’re actively recruiting more", "created_at": "2026-11-12T18:07:51+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "nanransohoff", "reply_to_id": "2120930934379913350", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120930934379913350", "author_handle": "nanransohoff", "author_name": "Nan Ransohoff", "text": "This post from @albrgr and team does a great job estimating how much a bunch of important outcomes would cost (many of which cost less than I would have expected!). Let's say a group of donors got together and said, 'OK we want to fully fund stopping the use of crates for most mother pigs for $500M.' Who do they give that $ to deliver that outcome? Maybe in this specific case it's @Lewis_Bollard, but I would be curious for @albrgr's take on which of the identified outcomes already have GMs and the operational capacity to absorb the $, and where the gaps are.", "links": {}, "media": [], "url": "https://x.com/nanransohoff/status/2120930934379913350", "created_at": "Thu Nov 12 17:25:14 +0000 2026"}, "enriched": 3}, {"id": "2120662438660190429", "url": "https://x.com/Lewis_Bollard/status/2120662438660190429", "text": ".@Lewis_Bollard questions why cockfighting is illegal while industrial-scale factory farming of chickens is legal.\n\nhttps://t.co/aTJlOh6slE https://t.co/qXI3EqcxtY", "created_at": "2026-11-11T23:38:20+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2120652800761938182", "likes": 104, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120526029030584320/img/353rkniowfIWWriW.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120526029030584320/img/353rkniowfIWWriW.jpg"}], "links": {"https://t.co/aTJlOh6slE": "https://youtu.be/kWcPg8t1kJ4?t=1617", "https://t.co/qXI3EqcxtY": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120662406347297018", "url": "https://x.com/Lewis_Bollard/status/2120662406347297018", "text": "Factory farms have bred chickens that are optimized for suffering.\n\n@Lewis_Bollard explains how meat chickens are designed to die before puberty. When farmers want them to lay eggs, they need to be starved so they don’t collapse under their own weight.\n\nhttps://t.co/wNq0FzFSIK https://t.co/PL685AWbvu", "created_at": "2026-11-11T23:38:12+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2120562201069060212", "likes": 179, "retweets": 25, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120521742305124353/img/GZc8gKBbXhCwX9Mj.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120521742305124353/img/GZc8gKBbXhCwX9Mj.jpg"}], "links": {"https://t.co/wNq0FzFSIK": "https://youtu.be/kWcPg8t1kJ4?t=1404", "https://t.co/PL685AWbvu": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2121396602950823937", "url": "https://x.com/Lewis_Bollard/status/2121396602950823937", "text": "I think I have the best handle on the badness of factory farming when I'm sick.  \n\nWhen I'm lying in bed with a fever and a sore throat that makes it hurt to swallow, it's obvious that it's bad.  Sure, part of what makes it bad is that it diminishes my productivity, etc.  But a big part of what makes it bad is: it hurts.  \n\nBut at the very same moment, countless animals--far more than the number of humans who have ever lived--are suffering in ways much more intense.  They're being cut by knives, mutilated, castrated, locked in cages, etc.  Their pain is bad for the same reason mine is.  \n\nAnd the fact that they're not biologically human doesn't make their pain not bad.  If you gave me a pill that made me stupid and not biologically human, it would still be bad for me to suffer.  Suffering is bad, at least in part, because it hurts.  So the source of incomprehensible suffering is a very big deal, morally.", "created_at": "2026-11-14T00:15:38+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "Benthamsbulldog", "rt_author_name": "Bentham's Bulldog🔸", "rt_avatar": "https://pbs.twimg.com/profile_images/1926408699863588864/i-fisty8_normal.jpg", "rt_id": "2121306981499630005", "likes": 401, "retweets": 25, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2119391530448236639", "url": "https://x.com/mentalgeorge/status/2119391530448236639", "text": "@CharlesD353 @tyler_m_john Oh yeah sorry I meant \"how do we know it hasn't gone up enough to explain the results \"? I saw that claim for training compute in the metr report but not experimental compute (clearly in some sense false for broad \"research compute\" as that includes internal inference)", "created_at": "2026-11-08T11:28:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "CharlesD353", "reply_to_id": "2119384669514801378", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119384669514801378", "author_handle": "CharlesD353", "author_name": "Charles🔸", "text": "@mentalgeorge @tyler_m_john It has, just insufficiently to explain the results", "links": {}, "media": [], "url": "https://x.com/CharlesD353/status/2119384669514801378", "created_at": "Sun Nov 08 11:00:56 +0000 2026"}}, {"id": "2119379127924899845", "url": "https://x.com/mentalgeorge/status/2119379127924899845", "text": "@tyler_m_john Wait how do we know research compute hasn't gone up?", "created_at": "2026-11-08T10:38:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "tyler_m_john", "reply_to_id": "2119296157406863510", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119296157406863510", "author_handle": "tyler_m_john", "author_name": "Tyler John", "text": "AI capabilities have recently progressed at 2x. But the growth rate in pre-training compute and research compute hasn't sped up, and ideas are getting harder to find. For 2x progress despite this you'd need around 10x research uplift! Great post.", "links": {}, "media": [], "url": "https://x.com/tyler_m_john/status/2119296157406863510", "created_at": "Sun Nov 08 05:09:13 +0000 2026"}}, {"id": "2119871750322401687", "url": "https://x.com/mentalgeorge/status/2119871750322401687", "text": "Who are @FrontierDesign2? One of 3 named external evaluators of Fable 5.2. Anyone know anything about them?", "created_at": "2026-11-09T19:16:25+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119867115968594305", "author_name": "Claude", "links": {}, "author": "claudeai", "text": "Fable 5.2 and Mythos 5.2 performed as well as, or better than, our recent models on most alignment measures.\n\nThe model was also tested before release by external evaluators, including the @AISecurityInst, @FrontierDesign2, and @METR_Evals."}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2120166257593131224", "url": "https://x.com/mentalgeorge/status/2120166257593131224", "text": "@theobearman @GoodFaithOnly But: it's unclear whether they're limiting the AI research capabilities *only* of deployed models, or whether this is also happening to models they're using internally. \n\nI don't think i understand this yet", "created_at": "2026-11-10T14:46:41+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "mentalgeorge", "reply_to_id": "2120165935021457480", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2120165935021457480", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "@theobearman @GoodFaithOnly wait so what's the final take-away here? \n\n- Anthropic is considering Autonomy 2 threshold crossed\n- they can do this based on what they expect from near-term models\n- In this case, they have done it because of expectations, not because of current models\n- Separately, Anthropic have also taken steps to limit the AI research capabilities of their models", "links": {}, "media": [], "url": "https://x.com/mentalgeorge/status/2120165935021457480", "created_at": "Tue Nov 10 14:45:24 +0000 2026"}, "enriched": 3}, {"id": "2120165935021457480", "url": "https://x.com/mentalgeorge/status/2120165935021457480", "text": "@theobearman @GoodFaithOnly wait so what's the final take-away here? \n\n- Anthropic is considering Autonomy 2 threshold crossed\n- they can do this based on what they expect from near-term models\n- In this case, they have done it because of expectations, not because of current models\n- Separately, Anthropic have also taken steps to limit the AI research capabilities of their models", "created_at": "2026-11-10T14:45:24+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2120133945144815960", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2120133945144815960", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Looks like I was wrong. Anthropic is reiterating today that the Autonomy 2 threshold (though now met) was not met based on current models. Keeping this tweet live in the spirit of truth-seeking/transparency. @GoodFaithOnly \n\nhttps://t.co/06bivzH3oA", "links": {"https://t.co/06bivzH3oA": "https://x.com/theobearman/status/2120124069806756238?a=ElCvZOYuRkAQxQ_yAhs&s=20"}, "media": [], "url": "https://x.com/theobearman/status/2120133945144815960", "created_at": "Tue Nov 10 12:38:17 +0000 2026"}, "enriched": 3}, {"id": "2120189672777552217", "url": "https://x.com/mentalgeorge/status/2120189672777552217", "text": "We need some conceptual engineering to come up with better terms than \"well-specified\" or \"fuzzy\".\n\nEg I like Dwarkesh's emphasis that \"grindability\" matters as much as \"verifiability\"\n\n\"How cheap is it to generate strong signal for reward\" is probably a better predictor of LLM capabilities than \"is this domain verifiable\" \n\nI envision a mythical epoch post that figures out a way to report $ per \"unit of reward signal\" by domain", "created_at": "2026-11-10T16:19:43+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxsnczW4AAghzp.jpg"}], "links": {"https://t.co/Hhr6iKdwjU": ""}, "quoted": {"id": "2120181503699099763", "author_name": "Tom Reed", "links": {"https://t.co/b5X3uum0Lu": ""}, "author": "mentalgeorge", "text": "Everyone wants to know - are Anthropic's models also improving faster on fuzzy tasks?\n\nWe don't know, but tentative analysis from METR in the Mythos 5.2 system card suggests the new model is not obviously an improvement over 5.1 on open-ended tasks https://t.co/b5X3uum0Lu"}, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120181503699099763", "url": "https://x.com/mentalgeorge/status/2120181503699099763", "text": "Everyone wants to know - are Anthropic's models also improving faster on fuzzy tasks?\n\nWe don't know, but tentative analysis from METR in the Mythos 5.2 system card suggests the new model is not obviously an improvement over 5.1 on open-ended tasks https://t.co/b5X3uum0Lu", "created_at": "2026-11-10T15:47:16+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 39, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxkqvTWAAEf37o.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxkqvTWAAEf37o.jpg"}], "links": {"https://t.co/b5X3uum0Lu": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120515719515484359", "url": "https://x.com/mentalgeorge/status/2120515719515484359", "text": "@GoodFaithOnly @dwarkesh_sp good point - many such cases!", "created_at": "2026-11-11T13:55:19+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2120514449450623387", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120514449450623387", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@mentalgeorge @dwarkesh_sp I agree with the overall trend, but I think Astra may be an outlier largely drive by training environments. On all sorts of video game benchmarks (runebench, slay the spire, minecraft) Astra is a trend break which makes me think OAI added a bunch of video game RL enivornmnets.", "links": {}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2120514449450623387", "created_at": "Wed Nov 11 13:50:16 +0000 2026"}, "enriched": 3}, {"id": "2120512376311062721", "url": "https://x.com/mentalgeorge/status/2120512376311062721", "text": "More commentary on \"fuzzy\" tasks:\n\nI think @dwarkesh_sp's Blood on the Clocktower eval is a particularly evocative piece of evidence that models are in fact getting good at fuzzy tasks (like complex social inference or coordinated deceit) over time. \n\nMore recent models literally stomp earlier ones: Astra wins about 92% of the games against opus 4.6!\n\nI suspect a lot of these early gains are artifacts of particular weaknesses of older models (like credulousness). It will be really interesting to see the rate at which improvements continue, and what the ceiling effects on a game like BOTC are. \n\nIn this context it is also super interesting that opus 4.7 and 4.8 regressed on 4.6 (and this corresponds with folk with wisdom about the merits of these lesser models); clearly it is possible to (even if accidentally) fuck with models' ability to do this kind of social reasoning", "created_at": "2026-11-11T13:42:02+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW2RBYgWIAANSyj.jpg"}], "links": {"https://t.co/T2wgqIp6fb": ""}, "quoted": {"id": "2120181503699099763", "author_name": "Tom Reed", "links": {"https://t.co/b5X3uum0Lu": ""}, "author": "mentalgeorge", "text": "Everyone wants to know - are Anthropic's models also improving faster on fuzzy tasks?\n\nWe don't know, but tentative analysis from METR in the Mythos 5.2 system card suggests the new model is not obviously an improvement over 5.1 on open-ended tasks https://t.co/b5X3uum0Lu"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120633487049072821", "url": "https://x.com/mentalgeorge/status/2120633487049072821", "text": "@pawtrammell @ramez @michael_wiebe @karthiktadepall @cherylwoooo main things to add to your list @ramez:\n- Inference compute for internal use of coding agents (surely has gone up enormously) \n- Experimental compute (they might just be running much more, much bigger experiments; also seems likely now that they effectively have more researchers)", "created_at": "2026-11-11T21:43:17+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "pawtrammell", "reply_to_id": "2120633079123325251", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120633079123325251", "author_handle": "pawtrammell", "author_name": "Philip Trammell", "text": "@ramez @michael_wiebe @karthiktadepall @cherylwoooo I can't believe training compute wouldn't include RL compute within Anthropic, but buying RL data from third parties might be kind of the same thing but off the books", "links": {}, "media": [], "url": "https://x.com/pawtrammell/status/2120633079123325251", "created_at": "Wed Nov 11 21:41:40 +0000 2026"}, "enriched": 3}, {"id": "2120918034181501365", "url": "https://x.com/mentalgeorge/status/2120918034181501365", "text": "Takeaway 4: If trends in model efficiency hold, we could fit models as capable as today’s frontier LLMs onboard large and small drones in as little as 1 to 3 years.\n\nThe model size needed to reach a given level of capability has generally halved every 3.5 months. If this trend in “model efficiency” continues, models with roughly equivalent capabilities as GPT-6 Astra and Kimi K3.1 Pro could fit on chips that can be powered onboard small and large drones between late 2027 and mid 2029.\n\nHowever, this only tells us when these models would fit. Whether or not these systems are usable on the battlefield still depends on capabilities progress and vast improvements in model latency.\n\nBecause we haven’t yet seen reliable and robust drone autonomy exhibited in any form, I’m simply using today’s frontier models as a proxy for the most capable models.\n\nIf it turns out that the first models to be capable enough are far larger than today’s frontier, then the time it takes for them to become available onboard drones would be further extended.\n\n5/", "created_at": "2026-11-12T16:33:58+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2120902226939875614", "likes": 6, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tJ_PXYAANerq.jpg"}], "links": {"https://t.co/eWxzITCv2l": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2121527039807078683", "url": "https://x.com/mentalgeorge/status/2121527039807078683", "text": "@hilbertspaess @ben_golub are you implying mythos was pre-trained in april 2025? surely not", "created_at": "2026-11-14T08:53:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "hilbertspaess", "reply_to_id": "2121461118824817090", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121461118824817090", "author_handle": "hilbertspaess", "author_name": "Jacob Coxon", "text": "@ben_golub [Post-mythos : Mythos] &gt; [Mythos : pre-Mythos] on pretraining compute efficiency is a precise claim that needs only 3 datapoints, needs no exact numbers, and violates many narratives. Abstraction != lack of rigor", "links": {}, "media": [], "url": "https://x.com/hilbertspaess/status/2121461118824817090", "created_at": "Sat Nov 14 04:32:00 +0000 2026"}, "enriched": 3}, {"id": "2119647241061429668", "url": "https://x.com/ohlennart/status/2119647241061429668", "text": "we spent years asking for USG visibility into AI chip shipments. turns out the MSS got there first.", "created_at": "2026-11-09T04:24:18+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2119567347589541956", "author_name": "Bill Bishop", "links": {}, "author": "niubi", "text": "On the Jensen Huang-Alice Huang affair, you have to give the MSS credit for running another successful op. They are good and getting better.\n\nI have seen some takes that it is no big deal he had an affair with an alleged PRC spy because he needed no pillow talk convincing to push for looser export controls, but that misses a few things:\n\nHe is (was?) text and phone buddies with President Trump, so if he divulged anything about his conversations with Trump to her, or his thoughts about Trump or chatter about China policy or frankly anything from Trump, that would be valuable to any foreign intelligence service, and especially to the MSS;\n\nWas she ever alone with his phone or computer, say when he got up to use the bathroom? Are Nvidia IT/device policies for travel to Taiwan and Singapore looser than those for travel to the mainland? What value would there be to the MSS to have physical access to the devices of the Nvidia CEO?;\n\nHe is the chip allocator in chief, so a good relationship with him likely meant more chips for the MegaSpeed front and the entities back in the PRC to which those chips flowed.\n\nWith the new Congress, expect subpoenas and public hearings in which he is trashed and he and Nvidia are further damaged. What a win for the MSS, to have such access to the head of the most important company in the world, and to now get to watch as politicians and shorts attack him and Nvidia.\n\nThere is rarely just one lie, so don’t be surprised if the blast radius from this mess expands. And there is already the SuperMicro case…"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119922506199126433", "url": "https://x.com/ohlennart/status/2119922506199126433", "text": "Tim Teter 👀", "created_at": "2026-11-09T22:38:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119911218110714042", "author_name": "Mackenzie Hawkins", "links": {"https://t.co/mNE4k7mnZ9": ""}, "author": "mackhawk", "text": "Before Nvidia's lawyer started emailing BIS staff about their Megaspeed investigation, he called Jeffrey Kessler, who runs BIS. He wanted to know whether BIS was involved in Singapore's recent detention of Alice Huang\n\nNvidia says Teter didn't know of the affair at the time https://t.co/mNE4k7mnZ9"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2120160757535080922", "url": "https://x.com/ohlennart/status/2120160757535080922", "text": "@briab_briar DC folks dont face consequences bc they dont wanna buy AI chips.\nSF folks need the chips and have kept quiet.", "created_at": "2026-11-10T14:24:49+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "briab_briar", "reply_to_id": "2120027159364509930", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2120027159364509930", "author_handle": "briab_briar", "author_name": "Brian Nichols", "text": "This is probably one of the bigger disconnects I'm seeing between the Bay area and DC right now, from my limited vantage point? There's much more anger at Jensen in D.C. than I think the broader tech ecosystem realizes.", "links": {}, "media": [], "url": "https://x.com/briab_briar/status/2120027159364509930", "created_at": "Tue Nov 10 05:33:57 +0000 2026"}, "enriched": 3}, {"id": "2119988953927544878", "url": "https://x.com/ohlennart/status/2119988953927544878", "text": "there’s more, but i think it’s mostly the same pattern. and importantly, they didn’t get most of what they wanted. they just weren’t that competent at it.", "created_at": "2026-11-10T03:02:08+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 22, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119976673101725872", "author_name": "Bill Bishop", "links": {}, "author": "niubi", "text": "Nvidia execs ran a smear campaign against proponents of chip export controls, bullied people on the Hill, they made so many enemies and now no one is afraid of them. I think we are still in the tip of the iceberg phase of what is going to come out."}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120565971249152050", "url": "https://x.com/ohlennart/status/2120565971249152050", "text": "Pacing might dip the market. But would that hurt jobs? Probably not much. AI’s value is less attached to actual employment, and pacing might slow job displacement too.\n\nJobs are what people care about. Pacing might be more viable than people think.", "created_at": "2026-11-11T17:15:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2117369250843349083", "author_name": "Lennart Heim", "links": {"https://t.co/laISNHEFTU": ""}, "author": "ohlennart", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU"}, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120554340503241006", "url": "https://x.com/ohlennart/status/2120554340503241006", "text": "your battery status and charging habits reveal so much about your personality", "created_at": "2026-11-11T16:28:47+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120946234236223801", "url": "https://x.com/ohlennart/status/2120946234236223801", "text": "@dylan522p you should do it", "created_at": "2026-11-12T18:26:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dylan522p", "reply_to_id": "2120942688702996945", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120942688702996945", "author_handle": "dylan522p", "author_name": "Dylan Patel", "text": "Nvidia Board needs to chase down Charlie Kawwas or Johny Srouji.\nThey are the only somewhat viable CEO replacements.", "links": {}, "media": [], "url": "https://x.com/dylan522p/status/2120942688702996945", "created_at": "Thu Nov 12 18:11:56 +0000 2026"}, "enriched": 3}, {"id": "2120648573662707857", "url": "https://x.com/ohlennart/status/2120648573662707857", "text": "true, all the others will be neoclouds", "created_at": "2026-11-11T22:43:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120609815135474064", "author_name": "roon", "links": {}, "author": "tszzl", "text": "strongly disagree with the take that the “AI market is winner take all”. to begin with, if this were true, there wouldn’t be an anthropic. the only reason I could see it being winner takes all is if you plan on “pivotal acts” against all other efforts once you have the capability"}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120254574967865721", "url": "https://x.com/sayashk/status/2120254574967865721", "text": "📢 We need more orgs that take AI’s transformative potential seriously *and* take downstream bottlenecks seriously. We have just launched STABL, and hope to lead by example. Read our launch essay below and check us out at https://t.co/P55nL7Mk6d.\n\nThe three of us have long felt that society’s responses to advanced AI are unproductively polarized. So we’ve decided to do something about it. Our work will have four pillars: Recursive Self Improvement, risks and resilience, steering AI’s economic impacts, and sectoral and professional adaptation.\n\nWe will bring our distinctive methods and approach to each of these workstreams. Our underlying worldview avoids the extremes that dominate the discourse, so building a movement and ecosystem around this work won’t be easy. But that is the task we have set ourselves and we are excited to try. The good news is that there are many others who share our views. The next step is to come together, better articulate our vision and agenda for research and action, and amplify each others’ efforts.", "created_at": "2026-11-10T20:37:37+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2120253269058498999", "likes": 18, "retweets": 8, "media": [], "links": {"https://t.co/P55nL7Mk6d": "http://stabl.ai"}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120243074039222638", "url": "https://x.com/sayashk/status/2120243074039222638", "text": "very excited about this! \n\ncan't wait to see how @stabl_ai will shape and change the discourse around AI + economy.", "created_at": "2026-11-10T19:51:55+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "abhishekn", "rt_author_name": "Abhishek Nagaraj", "rt_avatar": "https://pbs.twimg.com/profile_images/2065539274238562304/WI5-naUO_normal.jpg", "rt_id": "2120241627822497915", "likes": 6, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120231808457384303", "url": "https://x.com/sayashk/status/2120231808457384303", "text": "I am excited to announce our new nonprofit STABL, co-founded with the wonderful @sayashk @random_walker!\n\nOur organization derives from four beliefs:\n\n1. Advanced AI will broadly transform society and, if managed well, this transformation will be broadly beneficial.\n\n2. The speed of this societal transformation is governed by bottlenecks: in many cases, the bottlenecks relate to people and organizations, not AI capabilities alone. \n\n3. Since AI capabilities are not the sole determinant, the best strategy to manage the risks from advanced AI requires broad societal resilience, not just aligned models or capability delays, to provide defense in depth.\n\n4. And while today’s institutions often struggle to grapple with the salvo of advanced AI, institutions will help stabilize society and will be essential, if adequately reformed, for ensuring shared prosperity. \n\nIn addition to these beliefs, the reason to create a new organization is based on the need we see in the ecosystem. In today’s ecosystem surrounding advanced AI, many of the leading companies and external actors focus on frontier AI as a technology. We share the view that the technology itself requires dedicated attention, and some of our work at STABL will be in this direction.\n\nBut the greater need we see is for independent organizations that take AI capabilities seriously and focus on downstream societal outcomes. We are building STABL to help fill this gap. And we hope to see many other organizations and initiatives emerge to define this field.\n\nFor me, the most exciting part thus far has been seeing all the support we have gotten in our early forays. Thanks especially to @audreyt @erikbryn @hlntnr @MichaelRStrain @RobbWiller for joining us as advisers! \n\nWe are hiring and fundraising so please reach out if you are interested in this work!", "created_at": "2026-11-10T19:07:09+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "rt_avatar": "https://pbs.twimg.com/profile_images/1539123956950700035/DLTn2gEX_normal.jpg", "rt_id": "2120231348644483105", "likes": 95, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyTFWBbEAAi1iO.jpg"}], "links": {"https://t.co/Ma1VBVAksZ": ""}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120229899319521696", "url": "https://x.com/sayashk/status/2120229899319521696", "text": "Steering AI's societal impact requires taking both AI development and downstream bottlenecks seriously. \n\nToday @RishiBommasani @random_walker and I are starting a new non-profit: STABL @stabl_ai to guide societal adaptation and resilience to advanced AI. https://t.co/6V1h4gYhYp", "created_at": "2026-11-10T18:59:34+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 54, "retweets": 10, "media": [], "links": {"https://t.co/6V1h4gYhYp": "https://x.com/i/article/2120226519179997184"}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120490228909584663", "url": "https://x.com/sayashk/status/2120490228909584663", "text": "You can simultaneously believe that AI is transformational and that there are bottlenecks.", "created_at": "2026-11-11T12:14:02+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "percyliang", "rt_author_name": "Percy Liang", "rt_avatar": "https://pbs.twimg.com/profile_images/1319828397699129346/wjBcgUH0_normal.jpg", "rt_id": "2120378748457607431", "likes": 47, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120489763987980737", "url": "https://x.com/sayashk/status/2120489763987980737", "text": "I am honored to be an advisor to STABL, an exciting new AI nonprofit!\nDetails 👇👇👇", "created_at": "2026-11-11T12:12:11+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "RobbWiller", "rt_author_name": "Robb Willer", "rt_avatar": "https://pbs.twimg.com/profile_images/496403493721096192/0wW4xJgF_normal.jpeg", "rt_id": "2120383462280683611", "likes": 8, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "thread": [], "enriched": 3}, {"id": "2120589669352231403", "url": "https://x.com/sayashk/status/2120589669352231403", "text": "Check out STABL and its important work. I’m thrilled to be involved with such a great new organization. Read the launch essay below and check out at https://t.co/n07J6Y3xfO.\n\n@random_walker @sayashk @RishiBommasani", "created_at": "2026-11-11T18:49:10+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "MichaelRStrain", "rt_author_name": "Michael R. Strain", "rt_avatar": "https://pbs.twimg.com/profile_images/2021253854768005120/abpC6VZT_normal.jpg", "rt_id": "2120586738267832516", "likes": 3, "retweets": 5, "media": [], "links": {"https://t.co/n07J6Y3xfO": "https://stabl.ai"}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "enriched": 3}, {"id": "2120885848896155794", "url": "https://x.com/sayashk/status/2120885848896155794", "text": "This is true and we're going to play a huge price in incorrect policy for it https://t.co/K29iuh23Qw", "created_at": "2026-11-12T14:26:05+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "rt_avatar": "https://pbs.twimg.com/profile_images/1072897105679671296/mlN8zCx-_normal.jpg", "rt_id": "2120885462286110893", "likes": 148, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7mC3BWIAAgGOa.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW7mC3BWIAAgGOa.jpg"}], "links": {"https://t.co/K29iuh23Qw": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120693836796293255", "url": "https://x.com/sayashk/status/2120693836796293255", "text": "Very excited about this new AI institution. The top right quadrant they highlight here is pretty much where my views are. AI is powerful. Bottlenecks are real. We have agency.  Congrats @RishiBommasani @sayashk @random_walker !", "created_at": "2026-11-12T01:43:05+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2120673535077298467", "likes": 24, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2121374643839730171", "url": "https://x.com/sayashk/status/2121374643839730171", "text": "Are we in an intelligence explosion? This is one of the most important questions facing society right now. @lugaricano and I tried to put structure on this question and provide estimates based on currently available data.\n\nMETR recently reported that frontier capability growth roughly doubled after October 2025---but this is accompanied by annualized R&D spending growth of ~6x and technical staff ~3x over the same window. That highlights a crucial distinction between scaling laws--exponential capability gains bought with exponentially rising inputs--and an intelligence explosion (IE), where AI begins substituting for external inputs so each advance makes the next one easier.\n\nWe estimate several versions of a research production function (building on @ChadJonesEcon, @bfjo, and @Ph_Aghion) where a key parameter crossing a threshold signals an IE, while values below it correspond to an \"ideas are harder to find,\" diminishing-returns world. Across specifications, our estimates sit below that threshold. Allowing for a break at METR's October 2025 cutoff points to a one-time step up in research effectiveness, with the rate of diminishing returns being nearly identical on both sides of the cutoff.\n\nA few things to note. First, this exercise is not a forecast. It's an attempt to put structure on some of the important questions being debated right now: RSI, IE, scaling laws all depend on how outputs scale with inputs, and how feedback loops accelerate/decelerate this process. These estimates can change, and change very quickly. \n\nSecond, we are very explicit that the results are based on publicly available data; it is very much possible that METR had access to data that would change the estimates.\n\nThird, we might be wrong! Let us know what you think:\n\nhttps://t.co/xMLZlSlxdY", "created_at": "2026-11-13T22:48:22+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "rt_avatar": "https://pbs.twimg.com/profile_images/1994816403359010817/0zMDGpbF_normal.jpg", "rt_id": "2121350760843931912", "likes": 285, "retweets": 49, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCNRklWAAEJKxq.png"}], "links": {"https://t.co/xMLZlSlxdY": "https://aleximas.substack.com/p/are-we-approaching-an-intelligence", "https://t.co/CYuGeQaESv": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2119079836639715516", "url": "https://x.com/testingham/status/2119079836639715516", "text": "@lugaricano FWIW I acknowledge it’s a weird situation where you know the rate of acceleration but you don't know the location or velocity. Like sitting in a car blindfolded , you can feel the g’s but you don't know how fast you're going or where you are.", "created_at": "2026-11-07T14:49:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118726168048534007", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2118726168048534007", "author_handle": "testingham", "author_name": "tom cunningham", "text": "@lugaricano Hi Luis:\n\n- concretely, the IRT is unique up to an affine transform, which allows us to make judgments of acceleration, though we cannot meaningfully talk about a level or proportional changes.\n- the assumptions that get us this is that there exists a latent capability, & each of these benchmarks is a logistic function of that latent capability. Although we cannot individually test the assumptions they're over-identified, & in the report you can see we do tests for robustness (many other people have gone deeper on this, can share links).\n- I think the best intuition is that we're doing a principal components analysis.\n- there are of course many ways this could go wrong, we try to cover some of them in the report, & there's a mini litereature that's sprung up around interpreting ECI. It's a deeply unsatisfying metric but it's also the best we have.\n- here's a visualization which I think is useful for building intuition: https://t.co/k6YrYDU3NZ\n- the *quantity* that we're recovering is something that's slightly difficult to describe: it's latent ability to do benchmark tasks. As we discuss in the report, we are unsure how smoothly this is related to real-world impact (which itself is very hard to operationalize).", "links": {"https://t.co/k6YrYDU3NZ": "https://tecunningham.github.io/eci-benchmark-logodds/"}, "media": [], "url": "https://x.com/testingham/status/2118726168048534007", "created_at": "Fri Nov 06 15:24:17 +0000 2026"}}, {"id": "2121310297193652494", "url": "https://x.com/testingham/status/2121310297193652494", "text": "@theojaffee @datagenproc @GregHBurnham If you think Napoleon could be a bad drop-in worker?\n\nMaybe Napoleon is bad as an executive assistant, or copy-editor, or legal assistant. But he's still clearly takeover-capable.", "created_at": "2026-11-13T18:32:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "theojaffee", "reply_to_id": "2121293970819133667", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121293970819133667", "author_handle": "theojaffee", "author_name": "Theo Jaffee", "text": "@datagenproc @GregHBurnham How would you get a takeover-capable AI that isn't a productive drop-in worker?", "links": {}, "media": [], "url": "https://x.com/theojaffee/status/2121293970819133667", "created_at": "Fri Nov 13 17:27:49 +0000 2026"}, "enriched": 3}, {"id": "2119810989646647612", "url": "https://x.com/slatestarcodex/status/2119810989646647612", "text": "@SashaGusevPosts @quetzal_rainbow @RYChappell See  https://t.co/TgJYxoxYvY", "created_at": "2026-11-09T15:14:58+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SashaGusevPosts", "reply_to_id": "2119463606932918559", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/TgJYxoxYvY": "https://slatestarcodex.com/2013/05/02/if-its-worth-doing-its-worth-doing-with-made-up-statistics/"}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "parent": {"id": "2119463606932918559", "author_handle": "SashaGusevPosts", "author_name": "Sasha Gusev", "text": "@quetzal_rainbow @RYChappell I don't think so. Dario just pulled out a 2-3x multiplier for adult experience from thin air and EAs have spent the past week defending his rigor and transparency.", "links": {}, "media": [], "url": "https://x.com/SashaGusevPosts/status/2119463606932918559", "created_at": "Sun Nov 08 16:14:36 +0000 2026"}, "enriched": 3}, {"id": "2119810663182930414", "url": "https://x.com/slatestarcodex/status/2119810663182930414", "text": "@PlatosTrojanH @itaisher Your claim suggests that saving an egg cell is just as important as saving an adult, since the egg cell is capable of \"becoming\" an adult.", "created_at": "2026-11-09T15:13:40+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "PlatosTrojanH", "reply_to_id": "2119491057528557754", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "parent": {"id": "2119491057528557754", "author_handle": "PlatosTrojanH", "author_name": "Plato's Trojan Horse", "text": "@itaisher Unless the bullshit number makes you arrive at the wrong conclusions. If your intuition is more correct than the bullshit number, then the bullshit number is worse.\n\nIt looks like he said saving adults is better because an adult is more capable of a rich experience. But the children become adults, so the children are also capable of a rich experience. Additionally the adults may very likely be people who do not have rich experience. The people with TB may be people who are disproportionately likely not to have rich experience. \n\nIf the natural intuition is to save the children and that is correct based on more accurate \"numbers\" (much of this analysis is qualitative and not quantitative), then the intuition was a better guide.", "links": {}, "media": [], "url": "https://x.com/PlatosTrojanH/status/2119491057528557754", "created_at": "Sun Nov 08 18:03:41 +0000 2026"}, "enriched": 3}, {"id": "2119810306050535756", "url": "https://x.com/slatestarcodex/status/2119810306050535756", "text": "@Dr_Atoosa @itaisher I'll defend this - see https://t.co/f5DUSP8YYl\n\nIt's usually better to try quantifying things and then do sensitivity analyses with your estimates than to refuse to try to think clearly at all, which will usually result in laundering your biases, stereotypes, and fears that other people will judge you if you get \"the wrong\" answer.\n\nA good example of this is scope insensitivity (see https://t.co/D2HuL7bdvQ)  where people who avoid using numbers will place values on things which fail common-sense rules (for example, they'll say that helping 1,000 birds has exactly the same value as saving 10,000 birds). Any attempt to quantify anything at any point in the estimation process could prevent that failure mode. There are dozens of other things like this, and you can check for all of them by the basic mental hygiene of quantifying your intuitions and then running them through some sanity checks.", "created_at": "2026-11-09T15:12:15+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Dr_Atoosa", "reply_to_id": "2119739718531166462", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 102, "retweets": 2, "media": [], "links": {"https://t.co/f5DUSP8YYl": "https://slatestarcodex.com/2013/05/02/if-its-worth-doing-its-worth-doing-with-made-up-statistics/", "https://t.co/D2HuL7bdvQ": "https://en.wikipedia.org/wiki/Scope_neglect"}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "parent": {"id": "2119739718531166462", "author_handle": "Dr_Atoosa", "author_name": "Atoosa Kasirzadeh", "text": "Thanks for saying this out loud, @itaisher ! In many circles (including, though certainly not limited to, EAs), people are conditioned to treat \"empirical numbers\" as an inherent, objective good. This come from an obsession with metrics (showing numbers is better than no numbers when making a point), independent of whether they are well or poorly generated. What follows from these shaky numerical assertions is a massive waste of time and energy spent justifying or debunking them, pulling many down an unproductive rabbit hole. I'm still not sure how best to counter this often dangerous bias.", "links": {}, "media": [], "url": "https://x.com/Dr_Atoosa/status/2119739718531166462", "created_at": "Mon Nov 09 10:31:46 +0000 2026"}, "enriched": 3}, {"id": "2120258868441964778", "url": "https://x.com/slatestarcodex/status/2120258868441964778", "text": "@stuartbuck1 I'm optimistic about it and not in either of those two categories. What am I missing?", "created_at": "2026-11-10T20:54:41+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "stuartbuck1", "reply_to_id": "2119238750622380201", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "parent": {"id": "2119238750622380201", "author_handle": "stuartbuck1", "author_name": "Stuart Buck", "text": "Funny how everyone who is optimistic about AI \"curing disease\" in the next 10 years either 1) has zero training in biology/medicine, or else 2) works for an AI company selling its book.", "links": {}, "media": [], "url": "https://x.com/stuartbuck1/status/2119238750622380201", "created_at": "Sun Nov 08 01:21:06 +0000 2026"}, "enriched": 3}, {"id": "2120258543500792255", "url": "https://x.com/slatestarcodex/status/2120258543500792255", "text": "@Dr_Atoosa @itaisher I agree with your assessment, but I think it changes the polarity of this story. Dario was doing something good and reasonable (first by using a term like this in his own calculation, then by mentioning it on a GiveWell blog post that would only be read by other charity nerds).\n\nThe villain becomes the NYT and everyone who quote-tweeted it outside that context to pile on Dario and EAs, implicitly suggesting that numbers like this are meant to be taken extremely seriously, or that EAs were doing that. They should have been using their platform to educate people about how the ways that numbers like this can be reasonable in context and how people don't need to interpret it as carved-in-stone expert advice.", "created_at": "2026-11-10T20:53:23+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Dr_Atoosa", "reply_to_id": "2119894633769504853", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "parent": {"id": "2119894633769504853", "author_handle": "Dr_Atoosa", "author_name": "Atoosa Kasirzadeh", "text": "@slatestarcodex @itaisher â€œWorth doingâ€� needs a specific purpose. We should distinguish (at least) three: using made-up statistics to improve our own judgment; using made-up statistics to communicate with an ideal audience that understands what the game is all about and what each player is doing; and using made-up statistics to communicate with people in the world we actually live in.\n\nMade-up quantification can help us examine our assumptions, expose inconsistencies, update our credences, and check our predictions. It can also help people understand one another when they share an understanding of what the quantifications represent.\n\nBut communication with real audiences must account for differences in understanding and for human biases. People can  give a claim more weight simply because it contains a number. Numerical language can make a claim look scientific even when it is anything but; it is just made-up numbers. \n\nWhat we intend as an expression of personal confidence may be received as a finding supported by research. If we can foresee that misunderstanding, insisting on quantification can be quite an irresponsible and irrational act. We risk giving our claims more authority than the evidence warrants and making others spend time reasoning from a mistaken understanding of what we know.\n\nThe usefulness of quantification for our own thinking or for communication under ideal conditions doesnâ€™t, by itself, establish their value in a conversationwith an epistemically diverse group of people.", "links": {}, "media": [], "url": "https://x.com/Dr_Atoosa/status/2119894633769504853", "created_at": "Mon Nov 09 20:47:21 +0000 2026"}, "enriched": 3}, {"id": "2120365892475506999", "url": "https://x.com/slatestarcodex/status/2120365892475506999", "text": "@NeelNanda5 Happy birthday. I've found your commentary on alignment issues very helpful in understanding them and knowing what to celebrate or worry about.", "created_at": "2026-11-11T03:59:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "NeelNanda5", "reply_to_id": "2120124599484678361", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120124599484678361", "author_handle": "NeelNanda5", "author_name": "Neel Nanda", "text": "It's my 28th birthday today, and I'd like to ask for a favour: I do a lot of public facing work, and it's often hard to tell how much it does. If anything I've written or done has made a difference to your life, it'd really make my day to hear about it!", "links": {}, "media": [], "url": "https://x.com/NeelNanda5/status/2120124599484678361", "created_at": "Tue Nov 10 12:01:09 +0000 2026"}, "enriched": 3}, {"id": "2121006461010768109", "url": "https://x.com/slatestarcodex/status/2121006461010768109", "text": "@austinc3301 @ohabryka @DavidSKrueger Thank you, I agree that this is what I meant.", "created_at": "2026-11-12T22:25:21+00:00", "author_handle": "slatestarcodex", "author_ ", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 40, "retweets": 0, "media": [], "links": {"https://t.co/1KxYWm51Vo": "https://www.seriouseats.com/perfect-roast-chicken-recipe-8384377"}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119806063155261477", "url": "https://x.com/s8mb/status/2119806063155261477", "text": "Write for us – we are looking for deep, interesting longreads in business and finance. Details below.", "created_at": "2026-11-09T14:55:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 33, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2119803792413581552", "author_name": "Mike Bird", "links": {}, "author": "Birdyword", "text": "We're looking for business writers!\n\nWorks in Progress is expanding into coverage of business and finance, and we're looking for freelance authors for extended feature-length pieces of 2,000-6,000 words. We will eventually be hiring full-time employees on this beat.\n\nFind the most interesting company in the world, a brilliant financial model, or a telling and relevant piece of business history. Tell us why we should be fascinated by it too.\n\nIt could be the geography of an industry, like how Morocco grew to become an massive exporter of cars, or why Bangladesh can do in electronics what it has done with its massive textiles industry. It might be a piece on a new kind of business, like the firms trying to perfect proof of personhood in a world of super-powerful AI. You could write about unsung but vital pieces of hardware, like compressed air and industrial gas, which keep the most advanced manufacturing sites in the world going.\n\nThe subject can be lighthearted or momentous, but the piece should cover something you haven't seen everywhere else, which advances an argument and marshals strong evidence. It should be relevant to a broad group of intelligent readers, and enduring rather than short-lived. And we're absolutely definitely not looking for traditional PR pitches. A sense that you've read and understand something about WIP's output goes a long way.\n\nIf this sounds like your kind of thing, please send us 1-3 short paragraphs summing up your idea. If we're intrigued by your idea we may ask you for an outline over a page or two. We pay competitive rates to authors.\n\nEmail us at wip-pitches@stripe.com and mike@worksinprogress.co."}, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "enriched": 3}, {"id": "2120153314876641395", "url": "https://x.com/s8mb/status/2120153314876641395", "text": "After reading @WorksInProgMag on my v original euro summer, I’m afraid I’ve become quite interested in the municipalities of Greek islands https://t.co/mdLghjupD6", "created_at": "2026-11-10T13:55:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "annalisac21", "rt_author_name": "Annalisa Cochrane", "rt_avatar": "https://pbs.twimg.com/profile_images/2051756817990955011/RypIhSZs_normal.jpg", "rt_id": "2119836776965795877", "likes": 91, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWssG8yaQAIK9Jo.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWssG8yaQAIK9Jo.jpg"}], "links": {"https://t.co/mdLghjupD6": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120103494346846663", "url": "https://x.com/s8mb/status/2120103494346846663", "text": "The affordable housing tax on new builds in London is larger than the cost of actually building the house.", "created_at": "2026-11-10T10:37:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 306, "retweets": 38, "media": [], "links": {}, "quoted": {"id": "2120101939836797033", "author_name": "Ben Hopkinson", "links": {"https://t.co/NWS58oqbTx": "https://cps.org.uk/wp-content/uploads/2026/11/CPS_EASING_THE_BURDENS.pdf", "https://t.co/IVrLBax2pz": "https://easing-the-burdens.cps.org.uk/", "https://t.co/l0FrUnqc4T": ""}, "author": "Ben_A_Hopkinson", "text": "Government imposed policy costs make up 57% of the clearing price of a new flat in London and 42% of a new home in the Home Counties.\n\nDespite a big housing shortage and positive planning reforms, new home starts in England are declining from 182,000 in 2022 to under 125,000 last year.\n\nWhile the macroeconomic context has worsened with build cost inflation and high interest rates, the Government is imposing more burdens on new homes, not fewer.\n\nTaxes, levies, planning, and mandates add over £440,000 to the cost of delivering a home in London and nearly £225,000 nearby, with several of these imposed recently like the Second Staircase, Future Homes Standard, Building Safety Levy, Biodiversity Net Gain and Residential Property Developer Tax.\n\nIndividually these may be justified, but together they are making new homes unviable. \n\nAs a result, large developers are buying less land and small builders are going out of business; nearly 4,000 construction firms went bust just last year.\n\nIf we want to build more homes, we should be easing the burdens on them, not adding more. \n\nMaking housebuilding viable again is the most important issue in housing policy and my co-author, Edward Donovan, has completed excellent modelling showing how big the challenge is.\n\nRead the full report: https://t.co/NWS58oqbTx\n\nAnd simulate what changing the policies does with Edward's modelling here: https://t.co/IVrLBax2pz"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120062190288048586", "url": "https://x.com/s8mb/status/2120062190288048586", "text": "Insightful analysis by Kotkin on why Russia collapsed (hint: not \"pope, nationalism, dissidents, economic collapse, Afghanistan, the military-industrial complex, or Reagan) and what China's CCP has done to avoid the fate of the Soviet Union.\n\nWhat a pleasure it is going to be to read him every month at @wip_mag . https://t.co/CI1XMCuwe1", "created_at": "2026-11-10T07:53:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "rt_avatar": "https://pbs.twimg.com/profile_images/1088718721785434112/TCQN0rTD_normal.jpg", "rt_id": "2119933987363713069", "likes": 249, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuD8RQWIAABkIT.png"}], "links": {"https://t.co/CI1XMCuwe1": "https://worksinprogress.co/issue/soviet-disunion/", "https://t.co/RpVdX7QFuy": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120056809855566235", "url": "https://x.com/s8mb/status/2120056809855566235", "text": "Stephen Kotkin is one of the great historians of Eurasia. In a new series for Works in Progress, he tackles the biggest question of them all: what went wrong between America and China? In the first part, he explains why we shouldn’t expect China to go the way of the Soviet Union. Beijing’s leaders have internalized the obvious lesson from Moscow: No Gorbachev. But they have also done something subtler: fix the incentives that made Soviet elites think that they had something to gain from ending communism.\nhttps://t.co/dYAySlxKVy", "created_at": "2026-11-10T07:31:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "rt_avatar": "https://pbs.twimg.com/profile_images/1620480120778547200/MkLNSMmo_normal.jpg", "rt_id": "2119760552746508437", "likes": 250, "retweets": 34, "media": [], "links": {"https://t.co/dYAySlxKVy": "https://worksinprogress.co/issue/soviet-disunion/"}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120184081531171183", "url": "https://x.com/s8mb/status/2120184081531171183", "text": "@willsolfiac I agree with “Sam” but when it’s an uncommon name like Dario or Demis it’s fine imo (like with Boris or Sadiq).", "created_at": "2026-11-10T15:57:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "willsolfiac", "reply_to_id": "2120176593997844589", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120176593997844589", "author_handle": "willsolfiac", "author_name": "Will Solfiac", "text": "\"So uhhh ... who is the most ASI-pilled, Sam or Dario?\"\n\nPlease stop, you're a mid-level engineer at Google. These are not your mates.", "links": {}, "media": [], "url": "https://x.com/willsolfiac/status/2120176593997844589", "created_at": "Tue Nov 10 15:27:45 +0000 2026"}, "enriched ", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Sukicurates", "reply_to_id": "2120565896876056719", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2120565896876056719", "author_handle": "Sukicurates", "author_name": "Suki Park", "text": "👀👀👀 \n\n@WorksInProgMag @s8mb https://t.co/A9WPWxHJQO", "links": {"https://t.co/A9WPWxHJQO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3DcRIXgAAiTK8.jpg"}], "url": "https://x.com/Sukicurates/status/2120565896876056719", "created_at": "Wed Nov 11 17:14:42 +0000 2026"}, "enriched": 3}, {"id": "2121116676053696535", "url": "https://x.com/s8mb/status/2121116676053696535", "text": "@benspringwater Oh wow, that’s great. Wish I’d asked earlier - thank you!", "created_at": "2026-11-13T05:43:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "benspringwater", "reply_to_id": "2121021358020977102", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121021358020977102", "author_handle": "benspringwater", "author_name": "Ben Springwater", "text": "@s8mb Here you go!\nhttps://t.co/a50iyM6gfJ", "links": {"https://t.co/a50iyM6gfJ": "https://web.getmatter.com/bookmarklet"}, "media": [], "url": "https://x.com/benspringwater/status/2121021358020977102", "created_at": "Thu Nov 12 23:24:33 +0000 2026"}, "enriched": 3}, {"id": "2121286843849486399", "url": "https://x.com/s8mb/status/2121286843849486399", "text": "@pi
