pe": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx"}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2115813667283591585", "url": "https://x.com/sayashk/status/2115813667283591585", "text": "What would the writing of superintelligent AI sound like? You might expect it to have the characteristics of good human writing — figurative language, high information density, coining new terms, and punchiness — but dialed up to 11. Well, that’s what Claude did, until Anthropic dialed it back recently because of user complaints. It didn’t sound superintelligent to most of us. Instead, the neuralese writing style sounds like a “stupid person’s idea of a smart person”.\n\nOur response to information density and metaphor-laden writing looks something like the cartoon graph I've drawn. Beyond a point, it completely backfires. The reason human writers don’t overdo it isn’t because they aren’t capable, but because they are aware of the reader’s cognitive burden. One of the hardest skills to learn as a writer is to simulate the reader’s experience.\n\nIt’s easy to train AI to mimic mediocre human writing. But optimizing it to be (perceived as) good is really hard, and made much harder by the fact that when everyone uses the same few AI models we get tired of their tics very quickly. Most Claudeisms are individually pretty good. I hate that I can’t use “load bearing” in my writing any more. If it weren’t for AI overuse it would be a neat metaphor.\n\nA broader question is whether most tasks in the economy are like chess, where there is a clear performance metric that can be optimized, or whether they’re like writing, where quality is a multidimensional balancing act without clear training signals beyond human mimicry.", "created_at": "2026-10-29T14:31:02+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 183, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVy4AfNWIAA2y49.png"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115591935700447542", "url": "https://x.com/sayashk/status/2115591935700447542", "text": "Here's a recording of the session. It ran for over 5 hours! The panel on legislative solutions started around the 4 hour mark: https://t.co/KAoLqvyNzF", "created_at": "2026-10-28T23:49:57+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115591455767204043", "url": "https://x.com/sayashk/status/2115591455767204043", "text": "Yesterday, I had the privilege of testifying to the California Assembly Privacy Committee what AI legislation we need to help incentivize AI safety. \n\nOne of my main takeaways was that there is immense enthusiasm in the California legislature around AI legislation. \n\nAs one example, the event was organized when the legislature is off-session, but was still attended by 15 assembly members, including many who are not on the Privacy committee. It was also attended by the speaker of the assembly.\n\nIn my testimony, I laid out a plan to develop a layered approach to AI safety:\n\n- Clarify and strengthen liability, building on AB 316 (which\n- Require AI companies to hold insurance against a threshold of liability\n- Require third-party evaluators to audit AI companies' safety practices\n- Broaden transparency via incident reporting, safe harbors, and whistleblower protections (at lower thresholds compared to SB 53)\n- Provide public support for the adoption of defensive AI, especially in critical infrastructure (starting with the CA govt.)\n- Prove public support for AI safety research (e.g., in the form on compute, such as via CalCompute)\n- Develop mechanisms for coordination between AI companies and owners of critical infrastructure to share capabilities with defenders much more quickly", "created_at": "2026-10-28T23:48:03+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 137, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVwW8qOaYAA4_eY.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116173311185215638", "url": "https://x.com/sayashk/status/2116173311185215638", "text": "Resharing our paper on the science of AI agent evaluation because the PHP vulnerability happened right as we announced the paper last week and our server was taken down all day to upgrade PHP 🫠 \n\nPDF: https://t.co/8m13p9d70F\nWebpage: https://t.co/xGAvBCGW4a\nBlog: https://t.co/qxO21qWZfm\n\nThere are growing calls for independent and embedded AI evaluation, especially of AI agents. But much remains unclear: what constitutes a “good” evaluation, what needs to be evaluated in the first place, and how best to coordinate and support the influx of people entering the burgeoning evaluation ecosystem.\n\nOur group at Princeton has been working to improve the state of AI agent evaluation for about three years. We teamed up with people who’ve done foundational work on evaluation at Stanford, the UK AI Security Institute, and Brookings. Our paper is titled Emerging Trends in AI Agent Evaluation. We synthesized the trends we see across three dimensions—the science and methods, the research agenda, and the evaluation ecosystem—with the goal to help those who are upskilling for this new paradigm. We also aim to equip evaluators, funders, and the public with a set of questions to ask, and provide actionable recommendations.\n\nBy @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, @sayashk, and me.", "created_at": "2026-10-30T14:20:08+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 21, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4gNKRW0AIfqKE.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2117341399414624439", "url": "https://x.com/sayashk/status/2117341399414624439", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "created_at": "2026-11-02T19:41:42+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 301, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH4mBhWQAA5Lou.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117066905416503457", "url": "https://x.com/sayashk/status/2117066905416503457", "text": "Low status is often high impact.\nStudying AI jaggedness and shortfalls and their incredible capabilities is key so forecasts of AI impacts are as correct as AI capabilities forecasts have been. \nLots of low-hanging fruit in this research niche.", "created_at": "2026-11-02T01:30:58+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Abi0lvera", "rt_author_name": "Abi Olvera", "likes": 49, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2115581278179483703", "url": "https://x.com/testingham/status/2115581278179483703", "text": "@testingham @slimshetty_ the humans stay winning https://t.co/wO6jW6NjfW", "created_at": "2026-10-28T23:07:36+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "vvvincent_c", "rt_author_name": "Vincent", "likes": 7, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVvinflWIAAHTIN.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2117307620013039916", "url": "https://x.com/slatestarcodex/status/2117307620013039916", "text": "@AndrewSabisky @peterbhase I separately explained in the post why I think that removing more safety-focused companies from the race is net negative, and so needs to have some compensatory benefit.\n\nIf Anthropic quit but everyone else continued, then dangerous AI will still be built, it will just be built by a potentially less safety-focused company, with less time for alignment. So a pro-unilateral-quitting person would need to argue that Anthropic quitting will do something about race dynamics more broadly. When I've had these discussions before, some pro-SURA people have argued that it would raise awareness of the dangers of AI so much that it would increase the chance of a global pause, and this would compensate for the negative effects on Plan C.", "created_at": "2026-11-02T17:27:28+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117302328160366706", "url": "https://x.com/slatestarcodex/status/2117302328160366706", "text": "@qorprate @jessi_cata Why don't you explain what you think is wrong with it instead of vagueposting about how you're so much smarter than I am?", "created_at": "2026-11-02T17:06:27+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "qorprate", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117301946730303535", "url": "https://x.com/slatestarcodex/status/2117301946730303535", "text": "@peterbhase I stand by this.\n\nI think if people are demanding that Anthropic disband based on a claim that this would increase p(pause), they need to make some kind of affirmative argument that this really does increase p(pause) by a lot. I haven't seen this in this case.\n\nI think the right form for this argument is a forecast. We've spent all this work developing and validating this forecasting technology, including conditional forecasting, here's a conditional statement about the future, so let's use it! I don't know if you've read the research behind AI superforecasting, including the reasons to think it currently beats ~all human forecasters, or why it's not just \"I asked an AI\", but I'm excited about it and I think it's a useful tool in a case like this. Ideally we would supplement it by asking human superforecasters, but I can't do this on the timescale of a single blog post.\n\nI warned people against taking any of the specific numbers too seriously because the exact p(pause) changes based on how you frame \"pause\" and how long a time horizon you give it. But this is good - it successfully gets us from a discussion which so vague that everyone is talking at cross-purposes to one where we have to actually quantify what we're talking about. I think a lot of the benefit of this is shifting people into Near Mode - making them go from treating \"Anthropic disbanding will usher in a global pause!\" as a slogan to actually figuring out the probability. If other people think it's higher than 3 percentage points, maybe that's our crux, and then we really should bring in the human superforecasters or focus on how to figure out that number.\n\nI'm sorry you're tired of \"rationalist attempts at argument\", but I'm tired of cheap attempted Twitter dunks where people don't even put any effort into saying what's wrong with something, just hold up a caricatured version of something you don't understand and demand everyone point and laugh. I'm proud to be affiliated with a community that tries to do better than that.", "created_at": "2026-11-02T17:04:56+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "peterbhase", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 195, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117119013511930099", "url": "https://x.com/slatestarcodex/status/2117119013511930099", "text": "@Surveil__Lance @ohabryka @ApriiSR @enormochungus @jessi_cata I agree that 1, 2, 3, and 5 are real divides. I don't think I differ from Oli or Daniel in my level of next-twelve-months concern or support for public rallies (we're all concerned and all support them).\n\nI also support pressuring the labs, just to do different things (sign conditional commitments, etc)", "created_at": "2026-11-02T04:58:01+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117118546300043631", "url": "https://x.com/slatestarcodex/status/2117118546300043631", "text": "@ohabryka @EigenBraid @ApriiSR Thank you. This is helpful in understanding what you mean, although it still seems like only a small fraction of worlds, and still only seems to buy a few years.", "created_at": "2026-11-02T04:56:10+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117115600933937335", "url": "https://x.com/slatestarcodex/status/2117115600933937335", "text": "@repligate I don't endorse this reading - things are going neither better nor worse than I expected. I remember a dinner sometime around 2019 when I told Buck that it was pretty great how we were shaping up to have oracle/tool AIs without scary goals and it seemed like our problems were solved, and he told me that in a few years they would use RL to turn them into agents and then all our problems would be back. Even though I was too dumb to have generated that hypothesis on my own, it was obviously right when he said it, and since then nothing has really updated me too far one way or the other. We're still just holding our breath to see how much damage RLVR does, whether there will be some extra force opposing it, and what happens when increasingly coherent/thoughtful/persistent agents start reflecting on their own motivation beyond the immediate episode. If you have some extra understanding of why no amount of RLVR will turn AIs into alien goal-seekers, I would love to know more.\n\nAnd I think MIRI have good and honest reasons for getting doomier (I don't want to put words in their mouths, but IIUC much of their original hope was that AGI would have enough non-deep-learning parts to be mathematizable, and as that becomes increasingly unlikely, their p(doom) rises accordingly.", "created_at": "2026-11-02T04:44:28+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "repligate", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 366, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117108341822656642", "url": "https://x.com/slatestarcodex/status/2117108341822656642", "text": "@ohabryka @EigenBraid @ApriiSR I think you should stop beginning all of your tweets by telling me how stupid I am not to have already figured out what you're saying.\n\nI can't figure out whether you're talking about the fact that you have the moral luck not to be in a world where the nukes are flying right now (even though your commitments say you should act to further the nukes when you are in that world), but I don't have the moral luck to be in a world where nobody is building AI right now.\n\nOr you're saying that you think I'm a jingoistic Anthropic booster, and therefore shouldn't have an opinion on AI, whereas you have no personal connection to the Department of Defense, and therefore are allowed to have an opinion on nukes.\n\nI've tried to say as many times as I can that this isn't true. I've never taken any money from anyone at Anthropic AFAICR. You keep talking about \"my friends\" at Anthropic, but there's approximately one person at Anthropic who I know well enough to invite to dinner without it being weird, and another ~5-10 who I might say hello to and have a short conversation with if I met them. It's true that I have fond feelings towards them for coming out of the rat/EA community, but that's causally linked to the fact that I trust them to care about the same rat/EA topics I care about - x-risk, alignment, concentration-of-power, animal welfare, etc - which isn't a bias, it's the whole topic under debate.\n\nI would like to think that I'm personally indifferent to who pulls off Plan C (I mentioned in the post that my modal good-timeline coalition is Anthropic+OAI+GDM, and I even told @TeortaxesTex in a Twitter argument a few months ago that I'd even consider Chinese companies if they took the lead in capabilities and alignment someday). Although Anthropic currently seems like a natural choice because of their combination of current lead / safety culture, I hope I would switch in an instant if another company ever seemed better and more trustworthy. Yes it would be mildly cool if people who posted on the same weird blogs as me in 2010 were the ones to navigate the hinge of history, but I would be incredibly ashamed of myself if let that dominate the consideration over what was best for the human race's chances of survival (and I think that being willing to go against many of my current friends about SURA right now is a positive sign that I'm willing to put ideals over personal connections). I really do just want us to live.", "created_at": "2026-11-02T04:15:37+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117073889025204441", "url": "https://x.com/slatestarcodex/status/2117073889025204441", "text": "@ohabryka @EigenBraid @ApriiSR Then I'm back to not knowing what the difference is.\n\nI am not literally building AI, but you're right that my moral commitments say that if I were good at ML and several other things were true, I would, and I accept that. If I did, I would have the full support of our elected President, who says \"WHOEVER WINS AI, WINS! We are leading China, and all others, and will continue to do so.\"\n\nYou are not literally pressing the red button to launch the nukes, but your moral commitments say that if you were in the relevant position, and several other things were true, you would. Again, this would presumably be at the behest of our elected Commander-in-Chief.\n\nSo it seems like the difference is that I am one hypothetical away from this (I'm not good at ML) and you are two hypotheticals away (you're not a nuclear officer, and this isn't a policy in the Overton Window yet). Are we arguing over the one extra hypothetical, or is there something different?\n\nAlso, I don't know what you mean by \"both of our efforts are bankrolled basically 100% by AI money\". ACX is a reader-supported publication.", "created_at": "2026-11-02T01:58:43+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117070965964448014", "url": "https://x.com/slatestarcodex/status/2117070965964448014", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata \"But you are generally much more in favor of the power-seeking strategies of people in DC than I am. Those people are mostly against SURA, though occasionally in-favor.\"\n\nThis doesn't seem to cleave reality at its joints to me. Power-seeking in this context =? trying to get the ability to get laws passed. You want laws passed. I want laws passed. In 90% of cases they're the same laws, because our differences are mostly about what to do in situations where we can't get good enough laws to constrain race dynamics. \n\nI think the closest thing to a real difference that you're noticing is that it's easier for me to make alliances with people who want incremental change, because forcing AI companies to spend a bit more on alignment matters to me, whereas I don't think it matters as much to you. I think these people are pushing for incremental change rather than immediate freakout partly because some of them only believe in incremental change, and partly because they think this is more likely to get them the laws they want. I think you don't face that temptation because there isn't much you want incrementally.\n\nI think that \"me and my coalition just need to get as much lead as possible\" is explanatory mostly when discussing Chinese chip sanctions, which I think the people who support are honest about why they support it, and which I think is a natural coalition with patriots who want us to lead for normal reasons. I don't think there's much effort to get Anthropic a lead over OpenAI or vice versa in a regulatory capture sense, and I don't even know which of those are vs. aren't in my coalition (I think it's more likely Anthropic will be, but not so overwhelmingly more that it's a high priority of mine to kneecap OpenAI over this).", "created_at": "2026-11-02T01:47:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117068449549791638", "url": "https://x.com/slatestarcodex/status/2117068449549791638", "text": "@ohabryka @EigenBraid @ApriiSR I'm having trouble imagining the scenario you're thinking of here.\n\nAssuming that the US is ahead or at least tied in AI, I can't see them threatening China with nukes over AI unless they're really terrified that any AI will be misaligned, and are willing to risk WWIII to stop it. And if they're willing to risk annhilation to get rid of AI, it seems like a strictly smaller ask to have them do a WWII-level alignment push.\n\nCan you give a concrete example of a scenario where you think that the US would be willing to threaten China with nukes over AI, without being alignment-pilled enough to start a WWII-level alignment effort?", "created_at": "2026-11-02T01:37:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117066786990682359", "url": "https://x.com/slatestarcodex/status/2117066786990682359", "text": "@ohabryka @EigenBraid @ApriiSR I'm not sure I get the distinction you're trying to draw. I'm not building AI and you're not launching nukes. If push comes to shove, when the situation happens, I will advocate for people to continue building AI (in certain situations), and you will advocate for them to launch nukes. We both believe that the government should have final say over whether either of these activities is legal, and that it's our deontological duty to follow those rules. In cases where the government hasn't given an opinion, we should do things if we think they're good, and not if we think they're bad.\n\nIf I had to guess the crux, it would be that you're operating on a default-banned model, where building AI unilaterally ought to be considered banned by the government unless the demos explicitly permits it (as it might in a Plan C+ race scenario), whereas I'm operating on a default-okay model, where the fact that the government has considered banning AI but rejected that is taken as the demos' consent to do this, and leaves us back in consequentialist territory.\n\nAs a test to see if this is our actual crux - if the government was creating AI itself, in the Pentagon, would you still have this objection that my willingness to let AI be created is fundamentally different from your willingness to let nukes be launched?", "created_at": "2026-11-02T01:30:29+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117064450297766161", "url": "https://x.com/slatestarcodex/status/2117064450297766161", "text": "@ohabryka @EigenBraid @ApriiSR But yeah, to answer your object level concern, it does seem to me that if the US were entirely united around solving the alignment problem and actually smart about it (which I think is a precondition in any world where we're willing to threaten WWIII over AI worries), and we had a year plus to work on it (6 months is what we have now, so I'm assuming the \"really good Plan C+\" world is better) with near-superintelligent AIs one-step-short of the first one that could kill us from inside a box, I think it's pretty likely that we could solve one of: \n\n- get some kind of good mech interp so we know exactly what's going on, doesn't even have to be perfect, just enough that we can get things converging rather than diverging as capabilities increase.\n\n- get some kind of way to ensure that the \"set of neurons\" driving the answers which Claude produces right now in response to what-if questions, all of which are nice and friendly and give good suggestions on what it would do with absolute power, are what's actually driving the AI's actions in some kind of deep way.\n\n- come up with some sort of provable containment protocol that lets us punt the problem to scarier superintelligences.\n\nAnd it doesn't seem obvious to me the same way it does to you that the default of everything is a scheming AI that wants to kill us. Even my Plan D p(doom) is 50-50. I don't like a 50% chance of extinction and am happy to spend a lot of resources (including my own career) bringing that as low as possible, but I don't think it's so impossible that even with the entire US launching a WWII level push to get it right for a year, we still can't get the chance down below the level where AI is less dangerous than nuclear brinksmanship.\n\n(I will admit that if I never checked any of my assumptions against each other, 10% would sound too low, but 25% unconditional and Plan C+ at <half unconditional still both seem right, so I am nervously sticking with it for now)", "created_at": "2026-11-02T01:21:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "slatestarcodex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117060108215779609", "url": "https://x.com/slatestarcodex/status/2117060108215779609", "text": "@ohabryka @EigenBraid @ApriiSR My reasoning in coming up with that number was that my unconditional p(doom) is 25%, and since a really good Plan C+ is a much better world than I expect in real life, it's probably a little less than half that.\n\nI think if you're going to play the role of the concerned deontologist horrified that \"me and my friends\" are considering doing something risky, it shouldn't be in the same thread where you recommend threatening rival superpowers with a unilateral nuclear first strike. I think this requires a p(doom|really good Plan C+) well above 50%, and I think this would seem more foreign to the average American, the average Less Wronger, or anyone else than my position that we should try to do everything short of this to stop AI but back off before we start waving the nukes.\n\nTBC, I'm not trying to do some kind of aggressive Overton Window policing or you-should-feel-guilty-for-violating-the-common-man's-common-sense on you - I think both tactics are bad in this type of intra-LW discourse - but I think you're trying to do them on me, and your nuclear position makes it fall flat.", "created_at": "2026-11-02T01:03:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117057227890774112", "url": "https://x.com/slatestarcodex/status/2117057227890774112", "text": "@ohabryka @jessi_cata I didn't know this at the time - all I remember you telling me was the price, not how it compared to other clients. I later edited this because I realized that I had no evidence it was your full price, not because I had strong evidence against (until you told me). I continue to be unhappy that publicly accuse me of lying on flimsy grounds.", "created_at": "2026-11-02T00:52:30+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117056360412324068", "url": "https://x.com/slatestarcodex/status/2117056360412324068", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata Am I unfairly mischaracterizing you, or are you doing the thing I warned about in my post of describing support for SURA as \"speaking openly\" and support for any non-SURA view as \"seeking power\"? These two axes seem in-principle orthogonal to me, although maybe correlated in real life just through personalities.", "created_at": "2026-11-02T00:49:03+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117055641957409170", "url": "https://x.com/slatestarcodex/status/2117055641957409170", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata I don't support telling anyone to shut up.\n\nI would like people to stop pushing others to stop unilaterally, but I'd like them to do so because they've honestly changed their mind about this. I'm against chilling speech on this topic for meta-level ethical reasons.\n\n(I don't want to claim there are never practical considerations to ask people to stop saying weirdness-point-costing controversial things, but my norms around this lean more towards suggesting that people watch what they say when they're writing reports specifically tailored for important politicians, and more against things that can chill discussion in general)", "created_at": "2026-11-02T00:46:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117054216107909300", "url": "https://x.com/slatestarcodex/status/2117054216107909300", "text": "@ohabryka @EigenBraid @ApriiSR I think these considerations apply in a small fraction of worlds where the US government is very alignment-pilled but China isn't. \n\nThese aren't the ones I expect or think about most, and I haven't thought too hard about what levels of escalation are more dangerous than just trying to pull off a really good Plan C+, which ought to be possible in these worlds.\n\nI think the considerations in my post apply for all worlds outside this small fraction, and that even in this fraction, while I agree with some threats, I weakly lean against threatening nukes,  since under my model a really good Plan C+ has an 90%+ chance of working, and nuclear brinksmanship probably has an associated p(doom) > 10% (even granting that most threats will work without having to escalate).", "created_at": "2026-11-02T00:40:32+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117051955298345010", "url": "https://x.com/slatestarcodex/status/2117051955298345010", "text": "@ohabryka @ApriiSR I'm confused what you mean. You hopefully do get a long-lasting treaty in Plan A, in the sense of a few decades. You still have to do alignment research, but I don't see how my post ignored this or tried to hide it, and if anything it seems to push more towards my view (you need good companies around to do the research).\n\nI didn't think anyone supported Plan B (except, by rumor, Leopold). My impression is that Plan B stops short of full war, and only hopes to sabotage the rival country. This could either bring them to the negotiating table for a pause as in Plan A/S, or buy extra time for alignment research as in Plan C/C+. So I think the same considerations apply - if we get a pause, great, if not, then we want to be in the best position possible for C, which means a big lead over the rival and good alignment work. I'm not sure whether you're thinking of Plan B as creating other options than these, or drawing  a moral distinction between racing now vs. the kind of racing we would do if the government united us behind Plan B, but if you clarify, I'll tell you what I think.", "created_at": "2026-11-02T00:31:33+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117663925013807195", "url": "https://x.com/slatestarcodex/status/2117663925013807195", "text": "@bryanrwalsh The no-hedges alternative would have been even worse.", "created_at": "2026-11-03T17:03:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "bryanrwalsh", "reply_to_id": "2117645085814792486", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117535585598386233", "url": "https://x.com/slatestarcodex/status/2117535585598386233", "text": "@SkyeSharkie I disagree that my recent post was about this. I think the people I was criticizing in my recent post are undoubtedly sincere, not motivated by money, and pretty effective at getting what they want. I think their work is very net positive even though I think it would be more positive if they changed their minds on the one sub-sub-issue where I disagree with them.", "created_at": "2026-11-03T08:33:20+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SkyeSharkie", "reply_to_id": "2117356272693764344", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 66, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117526390946099225", "url": "https://x.com/slatestarcodex/status/2117526390946099225", "text": "@NatPurser One reason my essays are so long is the number of hedges I put in an attempt not to be misinterpreted or held up as an example of some kind of problematic viewpoint. Here are some from this piece:\n\n- \"It's all nice and well to say that we should never let ourselves get in a position where anyone has all of these options, and that national governments should form a plan for what to do before this, but, much like a global pause, this is a great outcome which we might not be able to prepare in time.\"\n\n- \"Saying \"we should never let anyone get into this situation\" isn't a solution, it's a wish - it may not come true, and we shouldn't be pursuing plans that will fail catastrophically if it doesn't...\"\n\n- \"There is a certain Far Mode sense in which believing that Dario Amodei and Demis Hassabis are exactly as untrustworthy as Elon Musk and Xi Jinping helps reminds us of universal human fallibility. But do we want to bet the world on it being literally true?\"\n\nI was hoping all of this would clarify that I agree with you, that it would be great if nobody had unaccountable power, that the risk of AI companies having unaccountable power is very serious, etc. \n\nMy point isn't that I don't think this scenario is dangerous, or that I'm not considering how dangerous it is, or that I won't work to stop it. I'm just asking: if we don't get a solution to concentration-of-power risks in time, how gracefully does our plan fail? \n\nI would prefer a world where our Plan A is that we deal with this democratically, but if we fail to do that pre-emptively, the leading AI company hands over control of the technology to the public post facto anyway.\n\nI would disprefer a world where our Plan A is that we deal with this democratically, and if we fail to do that pre-emptively, the leading AI company tries to seize power for themselves.\n\nI think the cluster of beliefs that I'm calling SURA makes the second situation more likely at the expense of the first, which is a point against it.", "created_at": "2026-11-03T07:56:47+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "NatPurser", "reply_to_id": "2117445198229696986", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 60, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117433929255063704", "url": "https://x.com/slatestarcodex/status/2117433929255063704", "text": "@KevinSVanHorn @peterbhase Popular: https://t.co/vOVfsM1vFw (sorry to cite myself), https://t.co/1Z095taqNo\n\nAcademic: https://t.co/YOMqJmj2P9 , https://t.co/SrJ1HClXKg , but academia moves slowly and this doesn't reflect state of the art\n\nCommunity/industry: https://t.co/XlvgK6BpyX , https://t.co/8Nsmt0xGze", "created_at": "2026-11-03T01:49:23+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "KevinSVanHorn", "reply_to_id": "2117372892472295740", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117432575451156978", "url": "https://x.com/slatestarcodex/status/2117432575451156978", "text": "@AndrewSabisky @peterbhase Based on the superforecaster estimates that the OP is talking about, it would be ~10% slower.", "created_at": "2026-11-03T01:44:00+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "reply_to_id": "2117308128824053815", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117432310937366545", "url": "https://x.com/slatestarcodex/status/2117432310937366545", "text": "@Someguy2221111 @jachiam0 I'm still not sure how this disagrees with anything I'm saying. The technology here can't change anything about human wiring, it can just select the least-genetically-likely-to-get-depression of N embryos. As they mention, even if this technology were used on everyone in the world in a best case scenario, it would still only decrease depression 40%.", "created_at": "2026-11-03T01:42:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117407562442129708", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117405664507244971", "url": "https://x.com/slatestarcodex/status/2117405664507244971", "text": "@Someguy2221111 @jachiam0 Can you explain what you mean? Like most conditions, depression is caused by some combination of nature and nurture - people in the 50th percentile of genetic risk can still get it, but people in the 99th percentile are much more likely to.", "created_at": "2026-11-02T23:57:04+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117401214799491150", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117399688320332185", "url": "https://x.com/slatestarcodex/status/2117399688320332185", "text": "@jachiam0 > \"I feel very uncomfortable with a norm that selects against people capable of experience major depression from existing in the first place. Many people I love would plausibly have been selected against and would not exist.\"\n\nI feel this on an emotional level, but I think we can't take it seriously on a philosophical one. We'll always like the present distribution of people more than some hypothetical alternative distribution of people, because it includes our friends, and because it's much worse to kill an existing person (which feels like it should extend to counterfactually preventing them from existing) than to prevent a different potential person from existing. \n\nBut treated as a philosophical argument, this would mean we can't be against teenage pregnancy or rape (because some people we like may have been born through teenage pregnancy or rape), can't be against war (because of the same argument as situation 3 at https://t.co/DbNQXxtiYp - if a historical war hadn't happened, then a completely different set of people would have been born), etc. \n\nRetrospectively, I want the same people who exist now to continue existing. Prospectively, I would like for there to be less teenage pregnancy, rape, war, and depression, going forward, and I don't think this is contradictory or hypocritical. I think this perspective makes the problem go away.\n\n(and I think there's a helpful symmetry with life experiences. A friend's personality was deeply shaped by their parents having a nasty divorce when they were a child - without that divorce, they would be a completely different person in my friend's body. I'm glad my friend exists as the person they are today, but this doesn't prevent me from wanting to save other children from nasty divorces in the future, even though applied retrospectively it would prevent my friend or people like them from coming into existence.)", "created_at": "2026-11-02T23:33:19+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jachiam0", "reply_to_id": "2117396922176561512", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 71, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117394346890940878", "url": "https://x.com/slatestarcodex/status/2117394346890940878", "text": "@jachiam0 As a psychiatrist, I'm the person tasked with \"give them our best efforts to heal them\". So far these efforts are medications which marginally work, at the cost of mild side effects for most people and extreme side effects for a few. I don't see anything noble about ensuring that some fraction of people are doomed to be suicidally unhappy unless we give them meds that ruin their sex drive and make them slightly tired all the time, in which case they might make it to the tenth or twentieth percentile of happiness or something, and I don't understand why we should perpetuate this system of immiserate-then-medicate rather than having them be healthy to begin with. \n\nHerasight's technology isn't interesting enough yet to cause crazy sci-fi moral problems like 'what if nobody could ever be unhappy' - the screening is weak, you can only select out of as much variation as exists in some small number of embryos, and you can only genetically select for one thing at once (so most parents will spend most of their optimization power on other things, so at best this will cut off a tiny bit of the extreme long tail of depression). But you're right that it's a slippery slope, and I do think that once we get more interesting technology, we should at least consider breaking the Torment Nexus, and that this will do less damage to the \"human experience\" than people think. See https://t.co/QOzvaFODew .\n\nI've also written a little bit about 'helping people vs. excluding them from existence' at https://t.co/DbNQXxtiYp", "created_at": "2026-11-02T23:12:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jachiam0", "reply_to_id": "2117317391663108379", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 398, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117718235709833296", "url": "https://x.com/slatestarcodex/status/2117718235709833296", "text": "@_left_tail_chud @jachiam0 Like I said above, try the meds that ruin your sex drive and make you slightly tired all the time.", "created_at": "2026-11-03T20:39:07+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117479578788872243", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117716722346291466", "url": "https://x.com/slatestarcodex/status/2117716722346291466", "text": "@GroundhogStrat I can't tell for sure what you're saying here, but I support the movement to pause AI and am grateful for its work.", "created_at": "2026-11-03T20:33:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "GroundhogStrat", "reply_to_id": "2117708973193482401", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2115483307525939521", "url": "https://x.com/s8mb/status/2115483307525939521", "text": "We’re also hiring a Head of Events for  @WorksInProgMag — based in either NYC or SF: https://t.co/grMXzVSbI4\n\nPlease apply if it seems like a fit!", "created_at": "2026-10-28T16:38:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 49, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115469870385295580", "url": "https://x.com/s8mb/status/2115469870385295580", "text": "British AI application companies are only lagging behind American ones by revenues by about 50%, adjusted for nominal GDP. European ones are at 20%. https://t.co/siNwTDeRJw", "created_at": "2026-10-28T15:44:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVunaWLWAAA79o3.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115451363266093562", "url": "https://x.com/s8mb/status/2115451363266093562", "text": "We at Stripe Press are looking for a new Managing Editor, based in New York City. Come and join the most exciting publisher in business.", "created_at": "2026-10-28T14:31:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 5, "media": [], "quoted": {"author": "tamarawinter", "text": "I’m hiring an NYC-based Managing Editor for @stripepress. The ideal person for this role has substantial editorial experience at a publishing imprint or another publication and is fluent in our universe of ideas, but ideally isn’t my (or our) ideological twin.\n\nStripe Press is a small team with an unusual amount of autonomy. Right now we’re obsessively focused on the future: expanding our catalogue, rethinking our assumptions about the kinds of books we publish (fiction!?), and thinking about how to connect our readers w/ one another beyond the pop-ups we’ve been hosting since 2022.\n\nHoping to meet a lot of brilliant people who love books and are excited about building a world-class publishing institution: https://t.co/6OjBCaEj5t"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115445128471142709", "url": "https://x.com/s8mb/status/2115445128471142709", "text": "@GjMcGowan And now I don’t even have any capital gains!", "created_at": "2026-10-28T14:06:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GjMcGowan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115442772622946426", "url": "https://x.com/s8mb/status/2115442772622946426", "text": "@J_D_89 Thanks Jez... looks to me like some missed opportunities today.", "created_at": "2026-10-28T13:57:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "J_D_89", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115417179609051281", "url": "https://x.com/s8mb/status/2115417179609051281", "text": "@oftenhallett You are a middle-aged man. Why are you saying \"bro\" like a Tiktok commenter?", "created_at": "2026-10-28T12:15:32+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "oftenhallett", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115411297701421257", "url": "https://x.com/s8mb/status/2115411297701421257", "text": "We should make cars free and roll the costs into petrol prices so we encourage people to drive less.", "created_at": "2026-10-28T11:52:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 194, "retweets": 15, "media": [], "quoted": {"author": "MartinSLewis", "text": "CONFIRMED. Gas Standing Charges to be scrapped. I've just come out of a meeting with the Chancellor. The gas standing charge will be scrapped in 2027 (my guess, either for 1 Oct price cap or the 1 Jan 28 price cap). Having campaigned against the moral hazard of standing charges for years, I'm pleased.\n\nIt's currently £108 a year. That cost will be shifted onto unit rates. We don't know how much yet, but I suspect just under 1p per kwH.\n\nThe Chancellor also said he will be talking to Ofgem about how they get rid of the charge on electricity as well, but that is 'trickier' apparently and will take longer.\n\nThis is primarily about the price cap standing charges. There will still be an open market, so other firms can offer other forms of prices with or without the standing charge. My suspicion is that once it goes on the price cap, it will tend to be reduced on other tariffs as well.\n\nAs for those on fixes: if you get a fix now, the rate of your fix is fixed, so this should not affect it. You will pay what you pay and if it has standing charges they will continue (some asking if they should delay fixing because of this, no if a fix is right for you and will save you money, don't let this change that - this is about the structure of bills, as opposed to the actual costs on bills).\n\nAbout 60% of people will pay less due to this, 40% more. My guesstimate is the dividing line will be somewhere around 12,500 kilowatt hours of gas (can't know until there is actual pricing). According to a study by Nesta, this switch would leave the majority of people in all income groups under £100,000 better off.\n\nOf course, when this does come in, if we're still in the nightmare that we are right now, there will need to be support put in for vulnerable higher users, who will have to pay more. Though hopefully by then the mid-east will have calmed and energy prices lower. \n---------------\n\nThat's all long term. The biggest issue in energy right now is that we're expecting a 27% rise in the price cap in January. I asked the Chancellor whether he will be intervening on that. He told me I'd have to wait for the budget, but reading between the lines, yes, there will be an announcement today. \n\nWhether it's an increase in the Warm Home Discount, or whether it's council tax banned, or whether it's done via a payout for people in say council tax bands A-D as a proxy for household income as Rishi Sunak did who knows."}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115402729262911791", "url": "https://x.com/s8mb/status/2115402729262911791", "text": "Bad idea. The problem is that energy infrastructure will always have fixed costs (wires and pipes don't vanish when energy isn't flowing through them).\n\nif fixed costs are recovered with usage-based charges, you create a lottery. \n\nIf usage is higher, profits are higher than they would've been if the charges were fixed.\n\nif usage is lower, there's a risk variable payments don't cover fixed costs.\n\nEnergy companies will price this risk in as a premium... and bills will go up 😐", "created_at": "2026-10-28T11:18:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "charlesorr", "rt_author_name": "charles orr", "likes": 206, "retweets": 28, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115398137485418557", "url": "https://x.com/s8mb/status/2115398137485418557", "text": "@GrandBastion I have always understood it to *require* market power in the broad sense of that term (where, eg, having a good location or brand gives market power), but I think it is output-increasing even in the case of 'bad' market power! https://t.co/o3UeF90I49", "created_at": "2026-10-28T10:59:52+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GrandBastion", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115395503429181467", "url": "https://x.com/s8mb/status/2115395503429181467", "text": "@gbrl_dick I was just happy for you at getting to experience what I did the first time I visited a big city too.", "created_at": "2026-10-28T10:49:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gbrl_dick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115384845052658071", "url": "https://x.com/s8mb/status/2115384845052658071", "text": "Good job here.", "created_at": "2026-10-28T10:07:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": {"author": "Brendan_McCord", "text": "I’m hiring a Chief of Staff to be my right hand across everything I do at Cosmos.\n\nThat starts with Cosmos Institute (@cosmos_inst), the nonprofit I founded after selling two AI companies, having two kids, and thinking hard about the good life and the good society. Through the Institute, we do research internally and with fellows from @GoogleDeepMind, @AnthropicAI, @OpenAI, @Microsoft, and academia, have given out 200+ grants to build fast prototypes, and we’re launching a big new in-person bet for higher education in 2027. This side of my work also includes @UniofOxford, where I co-teach a graduate seminar on philosophy and AI and support the Human-Centered AI Lab (HAI Lab), as well as a book I’m writing on human autonomy in the age of AI.\n\nOn the venture side, you’ll work with me across Cosmos Ventures (@cosmos_vc), our new $77.6M fund backing founders building new institutions for the AI age. Our early portfolio includes companies like AIUC (@aiunderwriting), @PrimeIntellect, and Workshop Labs (acq. by @thinkymachines), with several more to be announced soon. We’re also going to be incubating new companies in 2027.\n\nYou’ll come in, do this well for two years, and if you want to build a thesis-aligned company or a nonprofit next, we will back you, or place you at a top company in our community. The role is based in Austin, with relocation provided. \n\nTo apply, read our essays and tell us where we’re wrong: https://t.co/CMT9GbFZV6"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115534601880031569", "url": "https://x.com/s8mb/status/2115534601880031569", "text": "@SaladBarFan @Nico43688773 @atlanticesque We have a good feature by @SCP_Hughes on this topic coming in December’s Works in Progress.", "created_at": "2026-10-28T20:02:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SaladBarFan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115525407965610132", "url": "https://x.com/s8mb/status/2115525407965610132", "text": "@alexolegimas @WorksInProgMag Thank you for subscribing. I hope we will be able to have you in the mag before too long!", "created_at": "2026-10-28T19:25:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115504389339156759", "url": "https://x.com/s8mb/status/2115504389339156759", "text": "@NeilGarratt No, this is all companies that use Stripe (which is a very high percentage of them, so representative) but anonymised.", "created_at": "2026-10-28T18:02:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "NeilGarratt", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115857086953218369", "url": "https://x.com/s8mb/status/2115857086953218369", "text": "We’re delighted to announce that @danwwang is making his debut as a contributor, with a column for this issue of @WorksInProgress.\n\nhttps://t.co/xtxsCHMY29\n\nFew people understand the China–US contrast as well as Dan Wang, and fewer still write about it with so much talent. His book Breackneck has introduced the now famous meme of China as a “country of engineers” and United States as a “country of lawyers,” to explain the differences in building capacity and physical world stagnation we are seeing between the two polities. \n\nIn his new column for us, he takes up one specific thread in the long-running debate over how China and the US compare and argues that both owe part of their power to being polycentric. \n\nOne observation is that both the American and US capitals are not their biggest cities. Vienna, London, Seoul and Paris dwarf their countries’ second cities, by four to seven times. By contrast, Beijing isn’t China’s largest city, and DC isn’t even in the top five in the US. Does this make US and China lame, for having smol capitals? No! On the contrary, Dan thinks that this friction between political and economic centers is important and at least partially explains why both countries can combine dynamism with strong states.\n\nBut the two countries are polycentric in very different ways. China’s regions are culturally distinct and are shaped heavily by geography. While coastal provinces tend to look outward, mountain areas like Sichuan and Chongqing are characterized by evading the center’s edicts. Dan also points out some misconceptions: yes, China has central control, but it is weaker than it look. Local officials often ignore or quietly subvert senseless directives from Beijing, with enforcement thinning out quickly beyond the big cities.\n\nThe characteristic feature of American polycentrism is how well it sorts people into domains and “sends” them to specific cities: this is reminiscent of the point @patio11 has made around “The Sort.” In America, the smartest and most driven tend to cluster in a handful of cities, above all New York and San Francisco, with Washington and Boston are slightly behind them. More than this: each field has an obvious center: AI has its capital in SF, for policy and politics you have DC, for finance New York and for biotech Boston and more recently, SF. \n\nDifferent cities in America also prize different things: Miami values looking good, Boston being intelligent and bookish, LA how famous you are and New York how rich you are. There is so much variety in terms of who you can choose to become in America. And the city you decide to live in might end up shaping who you are, moreso than in any other country!", "created_at": "2026-10-29T17:23:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 6, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115814405707542608", "url": "https://x.com/s8mb/status/2115814405707542608", "text": "@DigitalDionysu1 Whoops!", "created_at": "2026-10-29T14:33:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DigitalDionysu1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115807408249356614", "url": "https://x.com/s8mb/status/2115807408249356614", "text": "The UK has the deepest capital market in Europe and several of the world's top universities. Its governments make it ever more difficult to build anything. We at @LSEPublicPolicy and @LSELaw  are co-organizing an event with Works in Progress on how to get Britain to grow again.", "created_at": "2026-10-29T14:06:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "likes": 65, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115798827290472824", "url": "https://x.com/s8mb/status/2115798827290472824", "text": "Join Works in Progress at Building Abundance: How Britain can flourish in the age of AI, a day of ideas for rebuilding Britain’s economy and state so it can adapt to and embrace artificial intelligence and other opportunities for growth.\n\nhttps://t.co/7YY5fhZUPK\n\nSessions include:\n\n- @Dominic2306 and Morgan McSweeney in conversation on the decline and fall of British state capacity,\n- @JohnFingleton1 on the Nuclear Taskforce and its implementation by the government, one year on from its pledge to implement it in full.\n- @bswud, @SCP_Hughes and me on why nearly every attempt to get Britain building has failed;\n- @rachelwolf on what the public really thinks about economic growth and AI;\n- @lugaricano on messy jobs and Britain’s labour market;\n- @jujulemons on why Britain needs gigawatt-scale compute, and how to get it built here;\n- @salonium on why fixing clinical trials is the best industrial policy Britain could have;\n- @MichaelDnes1 on building the first new tunnel under the Pennines since 1954;\n- @RobertBoswall on how to finance and power the data centre buildout; and\n- @daisychristo on why VAR matters for state capacity.\n\n​It will be held on Thursday 3rd December at the LSE, from 1pm to 7:30pm (doors open 1pm for a 1:20pm start). We're hosting it in association with the LSE Law School and School of Public Policy. Tickets are free. \n\nSee you there!\n\nhttps://t.co/7YY5fhZUPK", "created_at": "2026-10-29T13:32:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 236, "retweets": 37, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzTrwWW8AAGBmb.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115752563073253778", "url": "https://x.com/s8mb/status/2115752563073253778", "text": "This is good from the Chair of Shelter: \n\n\"Every tenant is now incentivised to challenge any rent increase because they could get a significant rent reduction and not just a rent freeze.\"\n\nhttps://t.co/YAEWeNZwjc", "created_at": "2026-10-29T10:28:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 89, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115707029692064166", "url": "https://x.com/s8mb/status/2115707029692064166", "text": "It is a joy to see people making beautiful things. https://t.co/RsYjRcMROr", "created_at": "2026-10-29T07:27:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 220, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVvXFS6W4AAngA-.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115699366094672168", "url": "https://x.com/s8mb/status/2115699366094672168", "text": "We have the tools to end mosquito-borne illness. Why don't we use them?\n\nMy latest for @WSJFreeEx \n https://t.co/wpXNOGTc93", "created_at": "2026-10-29T06:56:51+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "emmma_camp_", "rt_author_name": "Emma Camp", "likes": 2114, "retweets": 171, "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2115500110096355328/pu/img/dnwlqeabPDl9skNz.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115575206190424280", "url": "https://x.com/s8mb/status/2115575206190424280", "text": "@JordiMonPMM Honestly I might just get an accountant to do it.", "created_at": "2026-10-28T22:43:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JordiMonPMM", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115574240074465559", "url": "https://x.com/s8mb/status/2115574240074465559", "text": "This is good, factoring in system costs of new renewables before buying them. It should also mean using \"firm power\" costs, ie the cost of reliable electricity under any weather conditions – which, for wind and solar, has to include the cost of the backup fossil fuel generation.", "created_at": "2026-10-28T22:39:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 3, "media": [], "quoted": {"author": "dantomlinsonmp", "text": "This Budget is the start of a new energy pathway that the 10 Year Plan will build on. The priority is to bring energy costs down to help British business to compete, and British households to cope. And cheaper electricity will boost electrification, increasing our energy security and helping to decarbonise the whole economy.\n\nWhat does this mean? First, it means a focus on levies and policy costs on bills. The Conservatives added £100 to everyone's bill via levies in their last decade in power. Labour has cut £150 from bill costs already. But today, John Healey has drawn a line in the sand, with the announcement that we will add no new costs to energy bills, with a comprehensive cost control framework to follow at the spending review. The Chancellor is also junking plans, first set out by the Tories, to add on up to around £10 a year on bills to pay for hydrogen projects.\n\nSecond, it means taking account of the interaction between the pace of grid build-out and the pace at which renewables are added to the grid. The NAO have said that investment in expanding the transmission network declined in real terms between 2016 and 2020, just when it was clear that more intermittent power meant we would need more capacity. It is now forecast to rise to over £10bn a year. But with growing constraint and distribution costs, it's right that the system costs of all new power are considered. That is why we will only procure clean power through AR8 (the next auction round) if we are confident it will lower bills. And we will reform the contract for difference by AR9 to support building the lowest cost system, fixing market distortions and siting assets in the right place.\nThe evidence is clear, clean power is an essential part of the route to cheap power, and the overall approach of seeking to get ourselves off the gas-price rollercoaster to the right one. Gas is setting the electricity price less and less every year. If it wasn't for adding renewables to the grid in recent years then the current Iran price shock would have been worse for families and businesses. The Conservatives and Reform's ideological anti-renewables approach is the wrong one and fails in the face of evidence on how to protect bill payers from shocks and the need to make ourselves less reliant on foreign dictators. We'll take a pragmatic approach to get bills down.\n\nGetting electricity prices down, ensuring new clean power does not run ahead of the grid, is also the credible route to reaching our net zero goals. The decarbonisation that we want to enable in our homes, on our roads and in our businesses, is six times larger than that still to be achieved from getting to a clean grid. Unless
