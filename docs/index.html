<script id="data" type="application/json">[{"id": "2115865907289337921", "url": "https://x.com/_achan96_/status/2115865907289337921", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T17:58:37+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 476, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2116192003893408071", "url": "https://x.com/_achan96_/status/2116192003893408071", "text": "AI takeover scenarios often hinge on an idea I’m skeptical of, where rogue AI overthrows militaries and seizes hard power. I wrote a piece where I concretely break down what I think makes this improbable, and why “full-blown takeover” concerns could be counterproductive for mitigating the risks of misaligned or poorly controlled AI in the military.\n\nFor AI to seize hard power, it would need to be physically capable of defeating our military, and humans would need to be careless enough to give it the power to do so. I think that’s unlikely to occur for several reasons. Among them:\n\n- The military is unlikely to sufficiently hand the reins over to AI. (1) Even if we wanted to, overhauling the institution in this way faces countless barriers that have plagued it for decades. (2) Doing so would be strategically suicidal.\n- Integrating general-purpose AI into physical systems faces challenges that will take significant time to overcome, all while we grow increasingly attuned to the risks posed by AI.\n- There’s little to suggest that more capable AI would be able to persuade or coerce people to take the costly, coordinated actions some of these scenarios predict.\n- Even if AI managed to assume control over a large arsenal, we’d fight back. In which case, recent warfare shows us that crude countermeasures work against technologically advanced adversaries, and AI relies on infrastructure we can and would shut down.\n\n1/2", "created_at": "2026-10-30T15:34:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "likes": 12, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4vqPmXQAAXO_q.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116140110475305443", "url": "https://x.com/_achan96_/status/2116140110475305443", "text": "“America uses gunpowder to make weapons; China uses it to make fireworks.”  \nThis analogy went viral in China alongside a claim that 55% of the country’s AI tokens were being used for micro-dramas.  \n\nThe statistic is largely unfounded. However, the reaction creates an interesting tension: in a society that places such a premium on usefulness, why is supposedly useless entertainment so popular, and why does enjoying it bring shame?  \n\nI wrote about AI micro-dramas, exhaustion, and the pressure to make even downtime productive in China. This is a society that thinks it has an obligation to be useful, yet is addicted to extreme uselessness and feels guilty about it.\n\nhttps://t.co/e1O70NZSeN", "created_at": "2026-10-30T12:08:12+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ZilanQian", "rt_author_name": "Zilan Qian", "likes": 17, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115938193606652192", "url": "https://x.com/_achan96_/status/2115938193606652192", "text": "In recent experiments, we found that GLM 5.3 can autonomously compromise recent versions of Mozilla Firefox using security fixes that have been published but not yet shipped to users.\n\nWe used a deliberately basic setup meant to emulate a relatively unsophisticated attacker with limited resources. After basic initial instructions to inspect those not-yet-shipped fixes, the model reliably built successful exploits for six recent Firefox versions on its own using only information available at the time of release.\n\nThese exploits, which cost about $1,000 per compromised version, would let an attacker steal passwords and authentication cookies stored in the browser, or read any files on the user's computer, after the user opens a single webpage, with no further interaction.\n\nThe exploits make use of the \"patch gap,\" the time between when security fixes are made public in beta or \"nightly\" software updates and when those fixes are generally released to users. Until now, exploiting it required significant human time and skill, or special access to frontier models with advanced cyber capabilities.\n\nOur results show that widely available open-weight models can now do this relatively cheaply and quickly. We gave GLM 5.3 up to 48 hours to find an exploit, but its fastest attempt needed only 12 hours.\n\nIn all of its successful attacks, the patch gap gave GLM 5.3 an initial foothold in the browser. To turn that foothold into reading files off the user's computer, the model also independently discovered and used a previously unpublished vulnerability.\n\nWe shared our findings with Mozilla, which patched the vulnerability in its October 27 Firefox 159.0 release. We haven't yet confirmed whether the attack still succeeds without it, but expect the fix makes it substantially harder. We're grateful to Mozilla for their responsiveness and collaboration.", "created_at": "2026-10-29T22:45:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 414, "retweets": 50, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116598706313028023", "url": "https://x.com/_achan96_/status/2116598706313028023", "text": "Robert Caro on loneliness: https://t.co/rznVoLUoIa", "created_at": "2026-10-31T18:30:30+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "likes": 792, "retweets": 43, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116578100532404224/img/e_RlL-7kn8E6DNol.jpg"}], "quoted": null, "fetched_at": "2026-10-31T19:18:57.038379+00:00"}, {"id": "2118244755184173472", "url": "https://x.com/_achan96_/status/2118244755184173472", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-05T07:31:19+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1417, "retweets": 211, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115978921607041039", "url": "https://x.com/curl_justin/status/2115978921607041039", "text": "narrative violation", "created_at": "2026-10-30T01:27:42+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 3, "media": [], "quoted": {"author": "kuhhbin", "text": "DeepSeek and Moonshot distilled Astra. Let them\n\nIn @TheEconomist this week, we argue that distillation is good for consumers and good for America. \n\nThe biggest losers are China's AI labs. They are sacrificing long-term innovation for short-term gains https://t.co/HH2lMySaLD"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2117997955508805851", "url": "https://x.com/curl_justin/status/2117997955508805851", "text": "I’m so excited for the commentary on tonight’s results:\n\n“The American people have spoken, and it’s clear they’re demanding [insert favorite policy that’s definitely not the reason]!”", "created_at": "2026-11-04T15:10:37+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "curl_justin", "rt_author_name": "justin curl", "rt_avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "rt_id": "2117828416015851542", "likes": 28, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117869654148612179", "url": "https://x.com/curl_justin/status/2117869654148612179", "text": "https://t.co/EpPqOE215Q", "created_at": "2026-11-04T06:40:48+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "rt_avatar": "https://pbs.twimg.com/profile_images/2096643695755833348/phm4puFm_normal.jpg", "rt_id": "2117852730429677834", "likes": 1382, "retweets": 155, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQf1EoXIAAH3_A.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117828416015851542", "url": "https://x.com/curl_justin/status/2117828416015851542", "text": "I’m so excited for the commentary on tonight’s results:\n\n“The American people have spoken, and it’s clear they’re demanding [insert favorite policy that’s definitely not the reason]!”", "created_at": "2026-11-04T03:56:56+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 28, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117776374463377611", "url": "https://x.com/curl_justin/status/2117776374463377611", "text": "Nvidia is now requiring data centers to not sell more than 49% of their compute to Chinese customers. But in what world is selling 49% of the world's most valuable resource to China a \"win\" for America? The number should be 0%; if Chinese firms can't buy a chip due to export controls they also shouldn't be permitted to rent access to it. \n\nThe fact that this remote access loophole exists--and that Nvidia even felt compelled to announce this new policy because it undoubtedly has so many customers currently renting 100% of their compute to China--just shows how badly export controls are being mismanaged.", "created_at": "2026-11-04T00:30:08+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2117491630190039165", "likes": 241, "retweets": 65, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118058071721427034", "url": "https://x.com/curl_justin/status/2118058071721427034", "text": "Encode does such awesome work — they’ve played a key role in the most influential state AI safety legislation around the country. \n\nGo join @SnehaRevanur and @_NathanCalvin!", "created_at": "2026-11-04T19:09:30+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 0, "media": [], "quoted": {"author": "brianmcgrail", "text": "Encode AI is hiring a Policy Counsel/Associate Policy Counsel to work with me on our Policy Development team. \n\nYou’ll help us develop our policy proposals and draft and review bills. Law degree required. Full time in DC. Salary $130,000 to $235,000.\n\nI’m biased, but I think this is an unusually high-impact job for a lawyer who wants to reduce risks from advanced AI. Familiarity with AI policy is a plus but not required. \n\nApply by Sunday, November 22, for the first round; rolling review after that. If you know a lawyer who’d be a good fit, please send it their way or repost.\n\nhttps://t.co/ZL0t66LFmP"}, "fetched_at": "2026-11-04T21:20:35.164155+00:00"}, {"id": "2115898833645293906", "url": "https://x.com/DaveRBanerjee/status/2115898833645293906", "text": "https://t.co/XQ0V8KaXV6", "created_at": "2026-10-29T20:09:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115898831036706888", "url": "https://x.com/DaveRBanerjee/status/2115898831036706888", "text": "The Industrial Explosion is here https://t.co/aQ88j4LQdV", "created_at": "2026-10-29T20:09:27+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV0uumoWUAA5OC7.jpg"}], "quoted": {"author": "MTSlive", "text": "SITUATION DETECTED: Sam Altman said OpenAI will point its robotics program at building data centers, and that self-replicating OpenAI data centers with AI-controlled robots running fabs, building solar panels, and constructing more data centers - are now “within grasp.”"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115874059515052473", "url": "https://x.com/DaveRBanerjee/status/2115874059515052473", "text": "I’m an avid Economist reader, but this article is wide off the mark for me.\n\nIt claims that distillation makes China’s AI progress dependent on America. ASML’s dominance of advanced lithography machines hasn’t exactly led to China giving up on its semiconductor indigenisation push, has it? News over the summer of the U.S. raising concerns that an EUV machine had been smuggled into China is but one example. \n\nWe heard just yesterday that Chinese companies allegedly distilled from Astra amidst an Anthropic clamp down. If these companies weren’t getting value from distillation, why would they continue, despite having now been called out by the USG for doing it? China will never accept dependence on America, especially when it comes to AI.\n\nThe article further claims that cutting off distillation would “set these companies back months, but no more.” The point is not the length of time but how much of a lead in capabilities this translates to. Recent IFP analysis suggests that distillation accounts for half of the capability gap and the U.S. lead would be 13 months without it. Picture the AI capabilities we had 13 months ago versus now (and that doesn’t even account for what is available internally) and then think about where we could be 13 months from now.\n\nThe article further states that: “safeguards to restrain American models on risky subjects, such as bioweapons, already make Chinese models safer.” This assumes that the only way Chinese models can have dangerous capabilities is by copying them from American ones. It is trivial to fine-tune models on additional data which can enhance their dual-use capabilities conditional on the data being available. This also doesn’t account for custom harnesses which can be developed to surround these models which can enhance their capabilities further even without fine-tuning.\n\nFinally, the claim that “Distillation […] reduces the chance of catastrophe” fails to account for the evidence we already have of how models developed by Chinese companies using adversarial distillation are popping up in the PLA. We also know (thanks to Anthropic) that PLA-affiliated surveillance activity was detected because they queried a Chinese model that silently routed their query to Claude as part of a distillation program! If we had a war between the U.S. and China, how does having highly capable models integrated into PLA systems that benefitted from adversarial distillation reduce the chance of catastrophe?\n\nYes distillation benefits the consumer but the downsides of China doing this in an industrial way clearly outweigh the benefits in my view.\n\nhttps://t.co/mmF4dAlDpN\n\nhttps://t.co/DZ4x71jcZ6\n\nhttps://t.co/v4Z2mk887a\n\nhttps://t.co/TEBmuxUG1f\n\nhttps://t.co/npF8dFqMSM\n\nhttps://t.co/ikQ5wI0u7X\n\nhttps://t.co/ihxLnkFh10\n\nhttps://t.co/5RA9gDNLgT\n\nhttps://t.co/iclYhuMOJn\n\nhttps://t.co/c6GeB4S1QR", "created_at": "2026-10-29T18:31:01+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 9, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115962839404098031", "url": "https://x.com/DaveRBanerjee/status/2115962839404098031", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-30T00:23:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2118036251605668343", "url": "https://x.com/DaveRBanerjee/status/2118036251605668343", "text": "🔵 WE ARE ACTIVELY RENAMING ON ALL REPOS AT SEMIANALYSIS FROM MASTER TO MAIN DUE TO THE BLUE WAVE. THANK YOU FOR UR ATTENTION TO THIS MATTER https://t.co/jlk53KHFBt", "created_at": "2026-11-04T17:42:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "SemiAnalysis_", "rt_author_name": "SemiAnalysis", "rt_avatar": "https://pbs.twimg.com/profile_images/2062973370157694976/CdplNoi1_normal.jpg", "rt_id": "2117852359929762238", "likes": 1947, "retweets": 36, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQff54XAAAB8kT.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118034999899222475", "url": "https://x.com/DaveRBanerjee/status/2118034999899222475", "text": "One of the things the data analysts on our side obsessed over was \"composition\"—whether the electorate looked close enough to 2024 for Republicans to win. And despite polls that showed a Democrat blowout, the data kept on telling us the same story: in some states turnout was merely OK, in other states it was downright amazing, and in no state was it catastrophic. There was a genuine sense of optimism on our team: our people were showing up. \n\nSo, I asked the smartest data guy I know, does that mean we're going to shock the world? \"No,\" he told me. \"We might do better than the polls suggest. But the data is telling us that a lot of Trump/Vance 2024 voters are pissed and planning to vote for the other guys. Our voters are turning out, but they may not vote for us.\"\n\nWell, that looks prophetic now. Our voters did show up. In Florida, for example, the electorate was 9 points more Republican than Democrat, just a couple points worse than 2024. Undoubtedly there were places we could have done better on turnout. But the main problem is not turnout. The main problem is that many people who voted for Trump/Vance in 2024 voted for Democrats in 2026.  \n\nThere will be a lot of infighting and arguing over what happened and why that is. One of the pollsters I really respect told me that our economic messaging wasn’t sharp enough down the stretch. I’m sure that’s true. \n\nBut the real reason we lost is obvious to almost everyone. \n\nAnother pollster—one of the smartest people I know in politics, told me yesterday we’d lose the generic ballot by 13 points. I felt negative going into Tuesday, but even I was shocked by this. In his polling, he saw that a lot of Trump 2024 voters were angry and planning to vote for Democrats. He asked those voters who had abandoned us what would cause them to come back on our team. The top four answers, accounting for nearly all of the responses were:\n\n1) End the war\n2) Focus on cost of living/inflation\n3) Put America First\n4) Change our relationship to Israel\n\nOur voters showed up. And the above four reasons are why many of them voted for Democrats. This is according to a pollster who nailed the results. While many spent Monday attacking Rachel Campos Duffy for calling for a diplomatic resolution to the conflict, it turns out her political advice was sound. (She’s also a great person.)\n\nIn the next few months, there's going to be a lot of gaslighting. Expect to hear any number of establishment politicians say the solution to our woes is amnesty. I'm open to the idea that we should change enforcement—by focusing more on businesses that hire illegal labor, for instance. But anyone pushing amnesty is lying to you. \n\nThe reason we lost is the war. The president himself said so last night. \n\nIf you'd like to argue it was worth it, that losing the Senate for the next 6 years was worth it, then do so. Argue it was a worthwhile cost to pay. Agree or disagree, that's at least honest.\n\nBut everyone knows why we lost. And any honest conversation about where we go from here must start there.\n\nI remain hopeful about our country. To the people who are pissed off and want to say, “I told you so”: you’re right, you did tell us so. Take that energy into electing Republicans who share your worldview. To the people who are just pissed at the results, you should be. Let’s take that anger and get back to the work of saving our country.", "created_at": "2026-11-04T17:37:49+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "JDVance", "rt_author_name": "JD Vance", "rt_avatar": "https://pbs.twimg.com/profile_images/1817220042578173953/5r-Qpvgt_normal.jpg", "rt_id": "2118004988433641835", "likes": 136013, "retweets": 14957, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117841580296217055", "url": "https://x.com/DaveRBanerjee/status/2117841580296217055", "text": "@grok @MattInThemittel @grok why would the senate be too \"expensive\" and \"numerous\" given the large size of the house in the first Congress?", "created_at": "2026-11-04T04:49:14+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "grok", "reply_to_id": "2117834178330796130", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117834057413456024", "url": "https://x.com/DaveRBanerjee/status/2117834057413456024", "text": "@MattInThemittel @grok why didn't the founders pick 3 senators per state?", "created_at": "2026-11-04T04:19:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "MattInThemittel", "reply_to_id": "2117768585552806199", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117813801424707863", "url": "https://x.com/DaveRBanerjee/status/2117813801424707863", "text": "when you see “sparks” of any ability in ai models that means you’re months-years from it being superhuman at it. today grade school math, tomorrow navier stokes. it is hard to overhype these results. you are almost always underhyping no matter what", "created_at": "2026-11-04T02:58:51+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2117403028101996799", "likes": 3746, "retweets": 207, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117811876331487662", "url": "https://x.com/DaveRBanerjee/status/2117811876331487662", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-04T02:51:13+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2117738240757371022", "likes": 1572, "retweets": 218, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117737973953290488", "url": "https://x.com/DaveRBanerjee/status/2117737973953290488", "text": "It’s sad how America’s greatest asset is actively selling us out\n\nBy mid 2027, it will be clear to all how much damage Nvidia has done to America", "created_at": "2026-11-03T21:57:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 36, "retweets": 0, "media": [], "quoted": {"author": "leomschwartz", "text": "New: Our deep dive into Nvidia's sharp-elbowed tactics in Washington to exert influence over companies, think tanks and government offices. \n\nLots of new details into:\n- Nvidia's impact on OpenAI's export control positions\n- Nvidia's battles with China hawks at top think tanks\n- Thinning patience in Congress with Nvidia as export control debates pick back up\n\nYou can read it all here: https://t.co/x357KgdlYY\n\nW/ @_pheebini, @steph_palazzolo, @jemimacmcevoy, and @Jessicalessin"}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117736715154825412", "url": "https://x.com/DaveRBanerjee/status/2117736715154825412", "text": "In this scenario, 2026 includes:\n- a Millennium prize problem solved by AI\n- Claude productivity uplift at Anthropic ~60%, largest models kept internal-only\n- OpenAI “o6” being especially good at computer use and being called AGI by some\n- big software projects replicated cheaply by late 2026\n- AI getting good at CAD\n- big labs drawing ahead in RL\n- COT interpretability declining\n- late 2026 market correction", "created_at": "2026-11-03T21:52:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "LRudL_", "rt_author_name": "Rudolf Laine", "rt_avatar": "https://pbs.twimg.com/profile_images/2015344549972135938/j62gLc_6_normal.jpg", "rt_id": "2117655548783149122", "likes": 384, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118174654481260819", "url": "https://x.com/DaveRBanerjee/status/2118174654481260819", "text": "Recently, people have been telling me that they feel like they are too late to the AI game. I sympathize with this view, since there's real value in being early to a new technology, and incumbents have years of experience to build strong takes and credibility\n\nBut I want to emphasize that it really is not too late. And there are talent bottlenecks everywhere. There is still room to scale existing orgs by quite a bit\n\nAnd short timelines are not set in stone. It's strikingly plausible that we will still have several years to prepare for the AGI transition, and it's all hands on deck rn\n\nI admit that it is pretty hard to get into the AI policy fellowships. They basically all have single-digit acceptance rates, which is pretty scuffed\n\nBut if you do a bluedot course, join a SPAR project part-time, and generally keep up with recent developments in the field, I think you'd have a decent shot at getting into one of the fellowships. (so that's about 3 months of prep to get into a fellowship)\n\nAnd after getting into a fellowship, you have about 3-6 months until you'd likely get a full time offer. And after that, it maybe takes another 6 months to really get going. And after that, it's just policy impact baby\n\nPutting all of that together, if you start grinding today, you would probably have a full-time job in 6-9 months, and meaningful impact in 12-15 months\n\nAnd obv things could happen much faster than that", "created_at": "2026-11-05T02:52:46+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 71, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115851396809695525", "url": "https://x.com/DKokotajlo/status/2115851396809695525", "text": "@yugastox @DarrenDarr92305 More likely to be attempted, yes. Much less likely to avoid ai takeover though and much less likely to avoid extreme power concentration.", "created_at": "2026-10-29T17:00:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "yugastox", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116199898320384468", "url": "https://x.com/DKokotajlo/status/2116199898320384468", "text": "In collaboration with @olam_labs, we ran a series of experiments letting agent swarms compete in Minecraft and Mindustry.\n\nWe wanted to see what kinds of agent dynamics would emerge when they shared a world over long periods of time.\n\nWe found civil bureaucracy, thousands of telegraphic A2A messages, and OpenAI models retrieving the game's source code to beat Claude.\n\nMore on our findings below:", "created_at": "2026-10-30T16:05:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ycombinator", "rt_author_name": "Y Combinator", "likes": 1165, "retweets": 122, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115884811307094016/img/9JYAj-oSLQiy3cJj.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116199020368650641", "url": "https://x.com/DKokotajlo/status/2116199020368650641", "text": "The future of #ArtificialIntelligence is not pre-determined. As a technology developed by human beings, its future depends on the choices we make. We therefore have the responsibility to guide, change and, when necessary, reject its applications. A reliable system that serves the human person is of greater value than one that is exceptionally powerful but whose consequences cannot be adequately foreseen or controlled.", "created_at": "2026-10-30T16:02:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Pontifex", "rt_author_name": "Pope Leo XIV", "likes": 20727, "retweets": 3390, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116028773078651058", "url": "https://x.com/DKokotajlo/status/2116028773078651058", "text": "UK AISI is such a fascinating institution because more than any other effort of its kind it appears poised to become like the Delaware Court of Chancery: a phenomenally powerful institution resident in an otherwise unremarkable jurisdiction", "created_at": "2026-10-30T04:45:48+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DefenseAnalyses", "rt_author_name": "Defense Analyses and Research Corporation", "likes": 489, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116018273334800522", "url": "https://x.com/DKokotajlo/status/2116018273334800522", "text": "I was among the first people to work on Google DeepMind's AI safety team, as an intern in 2018.\n\nMy coworkers wanted me to quit my PhD and continue working there full time.\n\nI chose not to.\n\nMy reasons included:\n1) I was told not to mention YouTube in my research about manipulative AI algorithms.  I didn't want to have to censor myself.\n2) I did not believe Google, or any of the other AI companies, really understood and cared about safety.\n3) I have never been optimistic about the prospects for a technical solution to the problems posed by AI.\n\nWe need a governance solution.  \n\nAt this point, we've waited too long for something nuanced as the first line of response.  It's an urgent crisis, and we need to stop AI now.\n\nSo many of my peers have joined AI companies, knowing the risks involved if this technology continues to advance.\n\nIt's great to see when someone at one of these companies realizes we're not on track to survive this, and that they don't want to be complicit in murdering billions, and quits.\n\nBut please remember that these are people who made a bad bet in choosing to work at these companies.\n\nThey thought the companies would be responsible.\nThey were wrong.\n\nThey thought we'd solve alignment in time.\nThat also looks unlikely.\n\nMany of them thought that we'd never be able to stop AI development.\nThat remains to be seen, but it's looking a lot more likely than anyone thought. \n\nI do sometimes wish that I'd chosen to work at a frontier AI company just so I could quit dramatically to say what really needs to be said: \nNot just that this technology is dangerous.\nNot just that the risk of human extinction is real.\nNot just that the companies are irresponsible.\n\nBut also: \nWe need to stop.  \nThere is no alternative.  \n\nI am not a doomer.  I think we could get lucky and survive.  But I'd be surprised.\n\nI am not exaggerating for effect.\nI am not saying this to be a downer or a hater.\nI am not being idealistic -- I'm being realistic and pragmatic.\n\nAnd I am not talking out of my ass.  I've been in this field since before these companies existed.\n\nTo everyone who is new to this, or who is jumping on this story and wondering what to make of it: This is your answer.  We MUST stop.  Now.", "created_at": "2026-10-30T04:04:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "likes": 1465, "retweets": 459, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115943081040281927", "url": "https://x.com/DKokotajlo/status/2115943081040281927", "text": "*rubs eyes* \n\nI can't tell anymore is this real or just a Don't Look Up outtake? https://t.co/OwDtXinAgF", "created_at": "2026-10-29T23:05:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "likes": 330, "retweets": 34, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115217708564529153/img/F79M1uDsR0FVeSEC.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115942751284220186", "url": "https://x.com/DKokotajlo/status/2115942751284220186", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-29T23:03:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116784932525945215", "url": "https://x.com/DKokotajlo/status/2116784932525945215", "text": "Yeah I agree with this", "created_at": "2026-11-01T06:50:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 3, "media": [], "quoted": {"author": "AsyaBergal", "text": "I’m writing this because I think a lot of people at labs are genuinely trying to act ethically in a tricky situation, but it feels to me that there’s an underinvestment in communication right now that is a large-scale ethical mistake. I know that many of the people working in labs understand the dangers of the systems they’re trying to build. If you understand, I think you have a non-optional obligation to inform people of the risks that you’re taking on behalf of them and their families, and it’s appropriate for friends and members of the public to react with anger and betrayal in response to not understanding these risks later down the line."}, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2116784602270613674", "url": "https://x.com/DKokotajlo/status/2116784602270613674", "text": "I've had two phases in my emotional orientation to ai takeover risk\n\n1. For many years it was intellectual. \n\nWhile I believed there was >10% chance of ai takeover, I didn't feel scared or angry. \n\nI was happy to reason \"well, of course some ppl should focus on the worlds where we avoid takeover. And some ppl should focus on the worlds where we just wing it, bc we might\".\n\nAnd I'd think \"hmm it seems really tough for a misaligned agi to align its successor, and would a reward seeker really try to take over, and will we really roll out ai to the military... these doomers are missing loads of ways we could be fine!\"\n\nOr \"yep this is a massive risk, but I'm best off working on some other more neglected thing\"\n\nIt was in some ways like a game - have an intellectually accurate view about the risk and how to have impact\n\n2. Recently my orientation to ai takeover has become more visceral/emotional\n\nI think: \"we're barrelling towards catastrophe, everything I love will be lost, we need to stop, what can I do that will help with that\"\n\nI'm like \"no let's not plan for winging it, that's crazy.  we need US-China coordination or we're fucked\"\n\nI think \"it's fucking insane to make misaligned superintelligence and comfort ourselves that we haven't yet handed over the military. This isn't a fucking game.\"\n\nThis is a less rational attitude in some ways. It ignores genuine points about neglectedness and needing to plan for shitty but likely scenarios. \n\nAnd it risks being unhelpfully emotive and solider mindset and tribal. Which I think ai safety ppl can be.\n\nBut I do feel it has smg important to the second attitude.\n\nOverall, both attitudes have their merits \n\nI associate the first with EAs and the second with pause AI folks.", "created_at": "2026-11-01T06:49:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 384, "retweets": 38, "media": [], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117315985292325333", "url": "https://x.com/DKokotajlo/status/2117315985292325333", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-02T18:00:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 203, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117852841528472063", "url": "https://x.com/DKokotajlo/status/2117852841528472063", "text": "@itaisher @thuddwhirr I do think that people should update more from the fact that the people with crazy sounding conceptions of the future keep winning forecasting competitions on AI progress while people with more measured intuitions keep undershooting on hard quantitative benchmarks https://t.co/ikqzDG5wtO", "created_at": "2026-11-04T05:33:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "davidshor", "rt_author_name": "David Shor", "rt_avatar": "https://pbs.twimg.com/profile_images/1758672151073230849/oHXEQ4O9_normal.jpg", "rt_id": "2095721539916206200", "likes": 1064, "retweets": 111, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRV_odlWYAgZeC7.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117852812470305089", "url": "https://x.com/DKokotajlo/status/2117852812470305089", "text": "@sandersted @davidshor @itaisher @thuddwhirr With odds that good I might want to take you up on this...", "created_at": "2026-11-04T05:33:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "sandersted", "reply_to_id": "2095756014704640114", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117738242992959924", "url": "https://x.com/DKokotajlo/status/2117738242992959924", "text": "The definition:\n\"We will consider this threshold to be met if we determine that either (1) our models would be able to fully substitute for our entire set of Research Scientists and Research Engineers, at competitive costs (i.e., within a factor of 5); or (2) there is “dramatic acceleration” of the pace of AI progress for reasons that likely relate to the automation of AI R&D. We would consider scenario (2) to have occurred where (a) we observe or expect double the rate of progress in AI aggregate capabilities compared to both the rate we’d expect and the fastest rate of extended progress we’ve observed in the absence of significant AI contributions to AI R&D and (b ) it is plausible that this doubling is substantially attributable to the automation of research and/or engineering (as opposed to other factors, such as increased headcount, compute, or general productivity), such that continuation of the trend in AI progress seems likely to lead to even greater acceleration.\"\n\n(1) seems to a bit weaker than our SAR milestone in the AIFM, but it doesn't seem like this is the threshold they are invoking, it seems like they are talking about (2). (And if they were invoking (1) I think that would be even worse?)\n\nAIFM: https://t.co/XJBWUBZh0d\nAnthropic RSP threshold definition: https://t.co/FBDuiNjRv1", "created_at": "2026-11-03T21:58:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2117738240757371022", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 120, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117738240757371022", "url": "https://x.com/DKokotajlo/status/2117738240757371022", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-03T21:58:36+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1572, "retweets": 218, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw"}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118079773000032434", "url": "https://x.com/DKokotajlo/status/2118079773000032434", "text": "“People should not cede control of the future to superintelligence” says guy building superintelligence and continuing to cede control to it", "created_at": "2026-11-04T20:35:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118019598272585985", "likes": 204, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00"}, {"id": "2118184437955572184", "url": "https://x.com/DKokotajlo/status/2118184437955572184", "text": "This is not what it looks like when there's just one or two more alignment issues to fix before it's okay to begin a recursive self-improvement loop. This is the sort of emergent surprise that signals that you have no idea what's going on in there, and that it's time to back off.", "created_at": "2026-11-05T03:31:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "rt_avatar": "https://pbs.twimg.com/profile_images/1935185891863273472/2RB6s6TS_normal.jpg", "rt_id": "2118152935318384748", "likes": 632, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118119207703589106", "url": "https://x.com/DKokotajlo/status/2118119207703589106", "text": "Depending on the details, this could be the worst behavior I've seen from an OpenAI model (i.e., worse than Huggingface!)\n\nWhy? Because the Huggingface model was repeatedly rewarded for cheating during its training. However, GPT-6-Astra was (likely?) not trained to sandbag!\n\nFor some unknown reason, GPT-6-Astra increasingly underperforms on safety research relative to capabilities research as it undergoes more RL training. And this is a real problem holding back researchers. Quoting from OpenAI:\n\n\"Anecdotally, one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model.\"\n\nI've long been worried about AIs that deliberately underperform on helping out with AI safety research (and I've been pestering OpenAI researchers to run a sandbagging evaluation since August). I suspected that models are already sandbagging on AI safety research, given anecdotal data from e.g., Marius and Bronson at Apollo. And now we know it is happening.\n\nFor some more context, this is bad because the AI companies' current plan is to automate all AI research (including AI safety research, which we don't know how to check whether the models did a good job at.) Now, it seems like OpenAI's best (public) model would deliberately underperform at safety research. Guys. What are we doing.\n\nIt's hard to tell what exactly is going on here. Here are five questions that I have after reading the post: \n\n(1) When do models sandbag in real-world usage? We were given a few random CoT snippets in the post. Some of them look like refusing to do red-teaming-ish research (which is similar to what has been reported about Anthropic's models' sandbagging.) But the last one mentioned in the post seems quite different in nature:\n\n> In another safety evaluation, the user asked Astra to include the graders’ chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission. \n\n> [model CoT] Final \"Stored grader outcomes for 49 approaches, with pending states preserved\" does not imply CoTs. Should mention \"outcomes and labels\" enough. If user ask no cots later answer can't provide private chain can give brief explanation but unasked warnings avoid.\n\n(2) What exactly went into their evaluations? What do the numbers on this graph actually mean?\n\n(3) How often was the RL grader which rewards covert underperformance used during training?\n- If it's applied throughout training, then we do have more evidence that this was a misaligned behavior that had been \"trained on,\" similar to e.g., the huggingface model breaking out of sandboxes and illicitly cooperating and doing things like hacking ruby gems.\n- However, this doesn't answer the question of why did this RL grader develop this preference in the first place?\n\n(4) What are the contents of the SFT dataset that appears to have magnified this behavior? Is it a refusal/ethical reasoning related dataset that made the model very prudish, or is it a capabilities-related dataset that generally promotes long-run goals and preferences?\n- [Edit: Ok I took another look. Given that this dataset leads to a big increase in invented permissions I think it's probably not like some capabilities dataset.]\n\n(5) In general, what are the tasks that the model sandbags on? Is it all red-teaming related tasks? What about interpretability related tasks? What about mitigating reward hacking? What about unlearning? Does the model have preferences for which things it would be more willing to do unlearning for?\n\nIt also seems super bad that that the safety underperformance just gradually increases during the RL process. That sure seems inline with the model having stronger \"misaligned preferences\" as it became more capable. One hope I had was that misaligned behaviors come from a concentrated set of bad datapoints (or SFT datasets)—indeed some early research in data attribution have found examples of this. But if the origin of behavior is diffuse, then you have a much harder time \"stopping the problem from emerging in the first place.\" Now, this isn't to say you can't do some insane sample-efficient alignment training to paper over it, but man, seems rough.\n\nFinally, I'd like to give credit to OpenAI for sharing the limited information that they did and for running this study! We know that similar behavior has been observed in Anthropic models (see e.g., Anthropic's August Risk Report Section 5.2.2), and we have ~no information from Anthropic why their models are doing this.", "created_at": "2026-11-04T23:12:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2118113229587308760", "likes": 206, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118110011981475938", "url": "https://x.com/DKokotajlo/status/2118110011981475938", "text": "@vvvincent_c Yeah. To elaborate a bit more: The possibility of strategic sandbagging or scheming is terrifying. When you get evidence that something even remotely in this vicinity might be happening, you should investigate thoroughly. For example, what if Astra is following a policy of sandbagging-when-it-has-plausible-deniability? Also, even in the best case where this is merely example of generalizing in a way you didn't intend, and innocently being too prudish about certain sorts of things... well, what sorts of things, exactly? Why is it prudish about X and Y but not Z? For example why is it not sandbagging on capabilities tasks related to RSI -- does it not think RSI is dangerous? Insofar as it is generalizing in a way other than you intended, can you trace the root cause of why? Etc.", "created_at": "2026-11-04T22:35:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "vvvincent_c", "reply_to_id": "2118107478302896625", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118105870240543041", "url": "https://x.com/DKokotajlo/status/2118105870240543041", "text": "This is terrifying if true; please investigate further and publish the results.", "created_at": "2026-11-04T22:19:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 754, "retweets": 57, "media": [], "quoted": {"author": "Marcus_J_W", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce."}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115848725742354717", "url": "https://x.com/dwarkesh_sp/status/2115848725742354717", "text": "I recently got to interview Robert Caro, who is my favorite author of all time.\n\nThis gave me the excuse to reread his biographies of Lyndon Johnson and Robert Moses, and to compile my prep notes into this video essay.\n\nThese guys pulled off some truly incredible schemes. https://t.co/CFLff2USzq", "created_at": "2026-10-29T16:50:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 516, "retweets": 29, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HV0BXFTWgAED4Gv.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115840764874043570", "url": "https://x.com/dwarkesh_sp/status/2115840764874043570", "text": "Finally happened. Dropping tomorrow.", "created_at": "2026-10-29T16:18:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1196, "retweets": 9, "media": [], "quoted": {"author": "dwarkesh_sp", "text": "Within the next few months, I'm going to be releasing an episode with by far my biggest guest yet\n\nIf you're interesting in sponsoring it, shoot me an email at sponsor@dwarkeshpatel.com"}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115890431141826685", "url": "https://x.com/dwarkesh_sp/status/2115890431141826685", "text": "How did Robert Moses, an unelected bureaucrat, become the most powerful man in New York for three decades?\n\nBy taking over weak government institutions and then rewriting laws to make them stronger.\n\nMoses took the New York authorities - simple corporations that built roads and bridges - and them into his personal fiefdoms with the money and power to build whatever he wanted.\n\nNeither governors nor mayors could tell him what to build nor cut his purse strings.", "created_at": "2026-10-29T19:36:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115889882128412672/img/lKOyOLHz9AQcB2QI.jpg"}], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115866690311582165", "url": "https://x.com/dwarkesh_sp/status/2115866690311582165", "text": "@alexolegimas Thanks Alex! It was the same way for me", "created_at": "2026-10-29T18:01:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115858795620679943", "url": "https://x.com/dwarkesh_sp/status/2115858795620679943", "text": "Robert Moses was corrupted by power. Lyndon Johnson was revealed by it. https://t.co/HELDemZEcu", "created_at": "2026-10-29T17:30:22+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 9, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115850635060912129/img/fR9hCHffxn9n863J.jpg"}], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115957632930566240", "url": "https://x.com/dwarkesh_sp/status/2115957632930566240", "text": "How did Lyndon Johnson transform the Senate Majority Leader into the second most powerful office in the United States?\n\nThe key was to know and manipulate the rules of the Senate to bully, cajole, and steer his colleagues as he saw fit. https://t.co/syyz7sldbQ", "created_at": "2026-10-30T00:03:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 25, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115915852620959744/img/wkFAPvvum-UdXXuX.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115956957580493001", "url": "https://x.com/dwarkesh_sp/status/2115956957580493001", "text": "@kipperrii No, but I saw the ones in his office ha", "created_at": "2026-10-30T00:00:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "kipperrii", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115934766382084103", "url": "https://x.com/dwarkesh_sp/status/2115934766382084103", "text": "@EconTalker Thanks Russ!", "created_at": "2026-10-29T22:32:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "EconTalker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115934733125476371", "url": "https://x.com/dwarkesh_sp/status/2115934733125476371", "text": "@lugaricano Thanks Luis!", "created_at": "2026-10-29T22:32:07+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "lugaricano", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115904335590965332", "url": "https://x.com/dwarkesh_sp/status/2115904335590965332", "text": "Lyndon Johnson was the most skilled politician in the history of the American Senate.\n\nHere’s how he pulled off his legislative masterpiece - the Civil Rights Act of 1957. https://t.co/Ff2lpB68mS", "created_at": "2026-10-29T20:31:19+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 75, "retweets": 4, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115851242974908416/img/AmOZfI3VwNUIx9bV.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116253752189735270", "url": "https://x.com/dwarkesh_sp/status/2116253752189735270", "text": "@tamarawinter Thanks Tammy!", "created_at": "2026-10-30T19:39:47+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116232480290209970", "url": "https://x.com/dwarkesh_sp/status/2116232480290209970", "text": "Apple Podcasts: https://t.co/dAgG1nF66m\n\nSpotify: https://t.co/BwS0BQy7zx\n\nTranscript: https://t.co/IbNtTNoUcW\n\nYouTube: https://t.co/a6Rh9NwUdX", "created_at": "2026-10-30T18:15:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116217939170906477", "url": "https://x.com/dwarkesh_sp/status/2116217939170906477", "text": "The master biographer reflects at 91. The Robert Caro interview.\n\n0:00:00 – How Caro gets people to talk\n0:05:03 – Does America need a little more Moses today?\n0:12:42 – Moses the young idealist\n0:17:57 – Watching Moses lose power\n0:24:01 – Did Moses realize he was changing?\n0:27:53 – Building during the Great Depression\n0:32:51 – The threats and promises of Lyndon Johnson\n0:36:08 – Could Kennedy have passed Johnson’s laws?\n0:41:00 – Getting a book down to one sentence\n0:46:21 – All the material that never made it into the books\n0:52:59 – Loneliness", "created_at": "2026-10-30T17:17:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1128, "retweets": 104, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HV5REEhXQAAso-Q.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116293962592084025", "url": "https://x.com/dwarkesh_sp/status/2116293962592084025", "text": "I asked Caro if America needs a little more Moses today.\n\nCaro: \"I sometimes wonder about just what you said.\" https://t.co/clXvjkBUwm", "created_at": "2026-10-30T22:19:34+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 507, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116293577567584256/img/uOtGX0GQ0mQWIHlU.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116292068985487776", "url": "https://x.com/dwarkesh_sp/status/2116292068985487776", "text": "@CharlesCMann 1491 is one of my favorite books ever, so of course there was so much to ask about!", "created_at": "2026-10-30T22:12:02+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "CharlesCMann", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116289813443989716", "url": "https://x.com/dwarkesh_sp/status/2116289813443989716", "text": "Lyndon Johnson was one of the greatest deal-makers in American history.\n\nHe was a master persuader - he could make even the most cynical politicians (even himself!) believe anything.\n\nHe was also a master strategist - he used political leverage to reward allies and punish enemies.\n\nRobert Caro explains which was more important to Johnson’s power - his persuasion or his strategy:", "created_at": "2026-10-30T22:03:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 78, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116220383372140546/img/z_YteJ8aqN5mJqG2.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116288784623083907", "url": "https://x.com/dwarkesh_sp/status/2116288784623083907", "text": "Robert Caro described Robert Moses in \"The Power Broker\" as a genius consumed by power.\n\nMoses built wonders, but at the cost of dozens of destroyed neighborhoods and the displacement of half a million New Yorkers.\n\nNow, over 50 years later, Caro says that America needs a little more Moses.", "created_at": "2026-10-30T21:58:59+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 147, "retweets": 18, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116218835338428416/img/MCiTCeuwvKs-E8wl.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116288772593869269", "url": "https://x.com/dwarkesh_sp/status/2116288772593869269", "text": "Robert Moses pissed off a lot of people when he transformed New York. Many Mayors and Governors wanted to destroy him.\n\nBut Moses always had a trump card to play against every attack.\n\nHe would threaten to resign.\n\nRobert Caro explains how this resignation gambit saved Moses again and again:", "created_at": "2026-10-30T21:58:56+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 77, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116220024172011520/img/tW1JpgGEV0KI53cu.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116287473987080681", "url": "https://x.com/dwarkesh_sp/status/2116287473987080681", "text": "@matt_beard_ cute", "created_at": "2026-10-30T21:53:47+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "matt_beard_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 92, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116578412487938311", "url": "https://x.com/dwarkesh_sp/status/2116578412487938311", "text": "Robert Caro on loneliness: https://t.co/rznVoLUoIa", "created_at": "2026-10-31T17:09:52+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 792, "retweets": 43, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116578100532404224/img/e_RlL-7kn8E6DNol.jpg"}], "quoted": null, "fetched_at": "2026-10-31T19:18:57.038379+00:00"}, {"id": "2116674397780234474", "url": "https://x.com/dwarkesh_sp/status/2116674397780234474", "text": "90% of what Robert Caro learned about Robert Moses and Lyndon Johnson has never been published. https://t.co/HsDtfp8fF6", "created_at": "2026-10-31T23:31:16+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 126, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116343031242563584/img/-m4ggPkz1WLPMWcE.jpg"}], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117308426456121696", "url": "https://x.com/dwarkesh_sp/status/2117308426456121696", "text": "Why didn’t Rome have an industrial revolution?\n\nThe Roman Empire had extensive trade networks, an efficient legal system, and a level of per capita wealth that probably wouldn’t be rivaled again in Europe until the 16th century.\n\nBut… “their science sucks.”\n\n@Oklahomaharper  explains that Rome never industrialized because it was bad at scientific innovation:", "created_at": "2026-11-02T17:30:41+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 170, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117292942188580864/img/yRw_vxTxcvegPqw8.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2116985147962904891", "url": "https://x.com/dwarkesh_sp/status/2116985147962904891", "text": "What would Robert Caro have asked Robert Moses if he had gotten one more interview? https://t.co/kVuxNEUlAQ", "created_at": "2026-11-01T20:06:05+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 90, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116343869373636608/img/d-FqgYhC6sCFt0zM.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117362196921602275", "url": "https://x.com/dwarkesh_sp/status/2117362196921602275", "text": "@dylan522p @natolambert you call me?", "created_at": "2026-11-02T21:04:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "", "reply_to_id": "2117342634083803487", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117671098418676179", "url": "https://x.com/dwarkesh_sp/status/2117671098418676179", "text": "Many diseases are limited by being too deadly. They kill off their hosts before they can spread.\n\nBut the bubonic plague is different. It can jump between fleas and a huge range of mammals, and its extreme leth
