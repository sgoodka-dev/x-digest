 “We cannot underscore enough the impact that UK @AISecurityInst has had, and will continue to have, on global AI safety and security.” https://t.co/ccgUGREHWO", "created_at": "2026-10-28T11:25:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "discoplomacy", "rt_author_name": "sam", "likes": 384, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrBdHgbwAA41wI.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115343528175997051", "url": "https://x.com/theobearman/status/2115343528175997051", "text": "Since 2022, 72% of the world’s AI compute has ended up in the US and about 10% in China.\n\nAnd the US share keeps growing. It acquired around 60% of new compute each year from 2022 to 2024, then 72% in 2025, and 78% in the first half of 2026.\n\nThis data comes from our interactive AI Chip Imports explorer, which estimates and visualizes national compute shares using customs records.\n\nIt’s the latest piece in our project to map the AI chip supply chain, which also provides data on the components used to manufacture chips, sales volumes, the data centers that house chips, and the companies that own and use them.\n\nMore on this new data and what we’ve learned below.", "created_at": "2026-10-28T07:22:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 475, "retweets": 84, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqmrZbacAAmO-W.png"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115341645059367199", "url": "https://x.com/theobearman/status/2115341645059367199", "text": "Alongside v5, we're launching the Artificial Analysis Progress Index v1. It places language models released since November 2022 on one capability scale, across a wide span of benchmarks.\n\nUse the Progress Index to compare how underlying capability has changed over time, including between models released years apart. To compare models for current use cases and understand the present frontier, use the Intelligence Index, which remains our primary measure of current model intelligence.\n\nThank you to @EpochAIResearch and @AnthropicAI - we built on learnings from the Epoch Capabilities Index in designing the Progress Index\n\nExplore the Progress Index: https://t.co/vvg5dU6Kg5\n\nMethodology: https://t.co/F50x3Q2Bik", "created_at": "2026-10-28T07:15:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArtificialAnlys", "rt_author_name": "Artificial Analysis", "likes": 224, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrufBBasAAtUc3.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115340346745839859", "url": "https://x.com/theobearman/status/2115340346745839859", "text": "Announcing Artificial Analysis Intelligence Index v5, featuring 2 new benchmarks and 3 upgrades. For the first time, the majority of the Index is built on private datasets\n\nThe Artificial Analysis Intelligence Index is our composite measure of model capabilities across tasks reflecting real-world usage today. v5 is our biggest upgrade since v4 launched in January. With v5, 60% of the Index is now based on evaluations with private test sets or held-out answers.\n\nAlongside Intelligence Index v5, we’re launching the Artificial Analysis Progress Index v1, which tracks model capability over time on one continuous scale.\n\nNew to the Intelligence Index:\n\n➤ FrontierCode 2.0: Cognition's newly-launched private benchmark of real-world coding tasks, graded on whether a repository maintainer would merge the agent's change\n\n➤ Terminal-Bench-Science: 70 agentic scientific research tasks, run in a terminal environment\n\nUpgraded:\n\n➤ HLE-Diamond (replacing Humanity's Last Exam): a refined 1,000-question version of Humanity's Last Exam, split evenly between reasoning and knowledge questions\n\n➤ AA-Omniscience v1.1: An updated dataset with saturated and public set questions removed, new questions added, and ambiguous or erroneous questions revised\n\n➤ CritPt v2: a private, 40-question hard subset of CritPt v2, revised by the CritPt authors and run with a code-execution tool\n\nStaying in the Index: AA-Briefcase, AutomationBench-AA, GDP.pdf and Terminal-Bench 4.0\n\nRemoved from the Index: GDPval-AA v2.1, SciCode, and AA-LCR v1.1\n\nKey results:\n\n➤ Claude Opus 5.5 (max) leads at 58, ahead of GPT-6 Astra (max, 57) and GPT-6.1 Sol (max, 55): Anthropic and OpenAI hold the top five models. Gemini 4 Argon (high) is next at 50\n\n➤ The open weights gap widens from 3 points to 12: Kimi K3.1 Pro (weights not yet released) is the top open weights model at 46. Among released weights, DeepSeek V4.1 Flash 1017 (max) and GLM-5.3 (max) lead at 32 - 26 points behind the leader and below Claude Haiku 5.5 (max, 36)\n\n➤ Cost per task varies by more than 13x among the leading models: of the 10 highest-scoring models shown, GPT-6.1 Terra (max) is the cheapest at $0.96 per Intelligence Index task and Claude Fable 5.1 (max) the most expensive at $13.04", "created_at": "2026-10-28T07:10:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArtificialAnlys", "rt_author_name": "Artificial Analysis", "likes": 4866, "retweets": 404, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrubbmaoAA_Kry.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115512210281611317", "url": "https://x.com/theobearman/status/2115512210281611317", "text": "A further announcement today as part of the budget: the UK government has allocated £40m of funding to a new \"National Agentic Security Unit\" which will  \"develop new capabilities to detect, investigate and respond to cases of rogue agentic systems. This will integrate monitoring and incident response functions with new operational capabilities.\"\n\nhttps://t.co/5gY7NQ5GVO", "created_at": "2026-10-28T18:33:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVvPFzwXgAAEgqb.jpg"}], "quoted": {"author": "KanishkaNarayan", "text": "1/7 I have two simple tests for British AI, driven by our values. Is it safe? And is it ours to shape? 🇬🇧 \n\nToday, Chancellor @JohnHealey_MP is announcing a major, ambitious package of investment to strengthen Britain's defences against emerging threats, back British innovation, and build our technological independence."}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115838834386604054", "url": "https://x.com/theobearman/status/2115838834386604054", "text": "https://t.co/Q1oa6EhM5F", "created_at": "2026-10-29T16:11:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz4NKaWEAA9Qkw.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115838651342934335", "url": "https://x.com/theobearman/status/2115838651342934335", "text": "OPENAI: “Our misalignment monitors now cover our frontier models across a much wider variety of surfaces, including training, evaluation, internal use, and, with modifications depending on the product surface, external deployment.”\n\nhttps://t.co/S6I04pNKfZ https://t.co/IVND6bGF5g", "created_at": "2026-10-29T16:10:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz4ChAXoAAZ9So.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115835626687975425", "url": "https://x.com/theobearman/status/2115835626687975425", "text": "I joined @GoogleDeepMind to develop a research program on the economics of AGI. Today, together with Andrew Koh (@andrewjkoh) and Shane Legg (@ShaneLegg), we are incredibly excited to release The Economics of Intelligence, the first in a series of projects from our group on how AGI will change the economy.\n\nHow do capability improvements transform the economy, and when? In this project, we define thresholds of economic capabilities, e.g., minimal AGI, based on how they transform the economy. We then track how the economy–market structure, employment, and wages–changes during the transition across capability regimes.\n\nWe have seen exponential increases in what AI agents can do but the broader economy seems almost remarkably unchanged. Part of the reason is that the solo AI agent is the wrong economic object; economic transformation is an equilibrium outcome where organizations compete. Looking at how intelligence functions within organizations, transformation will depend on when two key capability thresholds are crossed: competence (gains on individual skills, e.g., coding, math) and coordination (gains on ability of agents to cooperate and work together).\n\nWe show that what economic transformation looks like depends on whether AI becomes supercompetent, supercooperative, or both—the regime of artificial superintelligence (ASI). Tracking this transition shows why the real visible transformation may come from improvements in coordination—a capability most benchmarks don’t yet track. Past a certain threshold, AI capabilities can break the Coasian ceiling on firm size and lead to an economy that looks drastically different than the one we see today.\n\nTwo main takeaways:\n1. To understand the path of transformation, we should be tracking agentic coordination more closely.\n2. The impact of AI will likely show up in wages before market structure or employment.\n\nWe are really excited about this paper. Excited to hear people’s thoughts.\n\nLink: https://t.co/9DTGSeKoSA", "created_at": "2026-10-29T15:58:18+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 980, "retweets": 167, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115822005538697216/img/dNrsrdLsDNbrQAR4.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115814762684797410", "url": "https://x.com/theobearman/status/2115814762684797410", "text": "KV-cache transfer: cat is out of the bag. My predictions are that, by 2028Q1, (a) CoT monitoring will be unambiguously over, (b) inference-time scaling curves will get better slopes and higher plateaus, and (c) context-window size will matter a lot less.", "created_at": "2026-10-29T14:35:24+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "davidad", "rt_author_name": "davidad 🎇", "likes": 193, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115814386279301160", "url": "https://x.com/theobearman/status/2115814386279301160", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-29T14:33:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 580, "retweets": 61, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115782232958754833", "url": "https://x.com/theobearman/status/2115782232958754833", "text": "We have a new Data Centre Covenant. But, until now, there was no detailed overview of what data centre capacity the UK plans to build: how much, where, and when?\n\nWhat signals are there about demand for UK compute?\n\nOur new report has the answers – which may surprise you! 🧵👇", "created_at": "2026-10-29T12:26:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sci_works", "rt_author_name": "Science Works", "likes": 33, "retweets": 16, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115750438993534976/img/0VQmKS0ichbchC2Z.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115742557779173871", "url": "https://x.com/theobearman/status/2115742557779173871", "text": "SCOOP: Both Moonshot and DeepSeek distilled #OpenAI's Astra when developing their latest models (Kimi K3.1 &amp; V4.1-Flash 1017), after Anthropic intensified the crackdown on distillation recently. w/ @JuroOsawa @QianerLiu via @theinformation https://t.co/FtfIEyP7Os https://t.co/y11D8emyh6", "created_at": "2026-10-29T09:48:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jingyanghk", "rt_author_name": "Jing Yang", "likes": 34, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVw4DInbMAA5dmR.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115741246744330642", "url": "https://x.com/theobearman/status/2115741246744330642", "text": "@scaling01 Would you be prepared to publish the code for this or have a microsite which updates this regularly?", "created_at": "2026-10-29T09:43:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "scaling01", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115740453568188583", "url": "https://x.com/theobearman/status/2115740453568188583", "text": "the gap between China and the US is ~3.3 months according to the AA Progress Index https://t.co/BqLSCXCYfw", "created_at": "2026-10-29T09:40:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 228, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuznVYXUAAqKc4.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115740115092042115", "url": "https://x.com/theobearman/status/2115740115092042115", "text": "Better ones are coming.", "created_at": "2026-10-29T09:38:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mycharmspace", "rt_author_name": "Tianyi Zhang", "likes": 1032, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115737925077942422", "url": "https://x.com/theobearman/status/2115737925077942422", "text": "@nytimes is reporting this morning that a Chinese businesswoman working for a Singapore-based data cente company Megaspeed and who was close to Jensen was passing intelligence to the CCP, President Trump was told and did not act. Megapeed has been buying Nvidia chips for installation in SEA data centers and renting the capacity out to Chinese companies.\n\nAs the Times reports: \"[...] the revelation that she was feeding information directly to Beijing raised more troubling possibilities, including that Mr. Huang had insights into Mr. Trump’s thinking on an issue of vital importance to both nations, one likely to come up when the president visits China next month. And it left questions about whether she could be gleaning information about Nvidia, which as much as any company accounts for the lead the United States has maintained in developing cutting-edge A.I. models.\"\n\nhttps://t.co/ifyVbXiyEf", "created_at": "2026-10-29T09:30:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "nytimes", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVycKCmXsAAfG3Q.png"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115698984106725708", "url": "https://x.com/theobearman/status/2115698984106725708", "text": "SITUATION DETECTED: Moonshot AI and DeepSeek both distilled OpenAI’s GPT-6 Astra for their latest models. Kimi K3.1 Pro and DeepSeek’s V4.1-Flash both benefited, per The Information.", "created_at": "2026-10-29T06:55:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 605, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115894305080693174", "url": "https://x.com/theobearman/status/2115894305080693174", "text": "A very dark day.", "created_at": "2026-10-29T19:51:28+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "SirPatStew", "text": "In lieu of flowers, memorial contributions may be made to:\nJohns Hopkins Alzheimer’s Disease Research Center Fund   \nhttps://t.co/luC5CdcWDy\nAlzheimer’s Foundation of America Caregiver Resources    \nhttps://t.co/zvNptfyuNd\n\nPhoto Credit: Tommy Garcia https://t.co/XNncEVq56X"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115891899701571860", "url": "https://x.com/theobearman/status/2115891899701571860", "text": "Sources tell WIRED that an Accenture employee’s personal Claude agent ran on a DOD network for two months before it was identified and the vulnerability could be patched. https://t.co/FF0l62ZOUX", "created_at": "2026-10-29T19:41:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WIRED", "rt_author_name": "WIRED", "likes": 85, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115885637039452328", "url": "https://x.com/theobearman/status/2115885637039452328", "text": "We’ve built an “eyes on everything” system that monitors nearly *every single rollout* from our frontier models across RL training, evals, and internal codex usage.\n\nIt uses layers of chain-of-thought-monitors and investigator agents to dig through a model’s work, run code to examine evidence, and cross-check network logs to reconstruct what happened.\n\nFor frontier RL runs, the system also pages humans 24/7 for urgent security alerts.\n\nIt's been incredibly useful for identifying model misalignment and possible holes in our containment. \nhttps://t.co/dcYStAKByZ", "created_at": "2026-10-29T19:17:01+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Eric_Wallace_", "rt_author_name": "Eric Wallace", "likes": 98, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115885562762838262", "url": "https://x.com/theobearman/status/2115885562762838262", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://t.co/18j6zdHub4", "created_at": "2026-10-29T19:16:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 1538, "retweets": 110, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115873264006496283", "url": "https://x.com/theobearman/status/2115873264006496283", "text": "I’m an avid Economist reader, but this article is wide off the mark for me.\n\nIt claims that distillation makes China’s AI progress dependent on America. ASML’s dominance of advanced lithography machines hasn’t exactly led to China giving up on its semiconductor indigenisation push, has it? News over the summer of the U.S. raising concerns that an EUV machine had been smuggled into China is but one example. \n\nWe heard just yesterday that Chinese companies allegedly distilled from Astra amidst an Anthropic clamp down. If these companies weren’t getting value from distillation, why would they continue, despite having now been called out by the USG for doing it? China will never accept dependence on America, especially when it comes to AI.\n\nThe article further claims that cutting off distillation would “set these companies back months, but no more.” The point is not the length of time but how much of a lead in capabilities this translates to. Recent IFP analysis suggests that distillation accounts for half of the capability gap and the U.S. lead would be 13 months without it. Picture the AI capabilities we had 13 months ago versus now (and that doesn’t even account for what is available internally) and then think about where we could be 13 months from now.\n\nThe article further states that: “safeguards to restrain American models on risky subjects, such as bioweapons, already make Chinese models safer.” This assumes that the only way Chinese models can have dangerous capabilities is by copying them from American ones. It is trivial to fine-tune models on additional data which can enhance their dual-use capabilities conditional on the data being available. This also doesn’t account for custom harnesses which can be developed to surround these models which can enhance their capabilities further even without fine-tuning.\n\nFinally, the claim that “Distillation […] reduces the chance of catastrophe” fails to account for the evidence we already have of how models developed by Chinese companies using adversarial distillation are popping up in the PLA. We also know (thanks to Anthropic) that PLA-affiliated surveillance activity was detected because they queried a Chinese model that silently routed their query to Claude as part of a distillation program! If we had a war between the U.S. and China, how does having highly capable models integrated into PLA systems that benefitted from adversarial distillation reduce the chance of catastrophe?\n\nYes distillation benefits the consumer but the downsides of China doing this in an industrial way clearly outweigh the benefits in my view.\n\nhttps://t.co/mmF4dAlDpN\n\nhttps://t.co/DZ4x71jcZ6\n\nhttps://t.co/v4Z2mk887a\n\nhttps://t.co/TEBmuxUG1f\n\nhttps://t.co/npF8dFqMSM\n\nhttps://t.co/ikQ5wI0u7X\n\nhttps://t.co/ihxLnkFh10\n\nhttps://t.co/5RA9gDNLgT\n\nhttps://t.co/iclYhuMOJn\n\nhttps://t.co/c6GeB4S1QR", "created_at": "2026-10-29T18:27:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 2, "media": [], "quoted": {"author": "ArchieHall", "text": "In praise of distillation. We (@kuhhbin) argue in @TheEconomist this week against efforts to ban Chinese models trained in part on American ones. \n\nOpenAI and Anthropic may dislike distillation, but:\n— Price competition is good for the ecosystem\n— Paradoxically, distillation may be good for national security, both in propagating US developers' safeguards on cyber/bio risk to Chinese models, and in keeping China in fast-follower mode\n— The US developers' own IP claims here are pretty flimsy, since distillation isn't all that different to the 'fair use' defense they're using for the training data they hoover up.\n\nhttps://t.co/suRLpdoGUT"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115871329752940725", "url": "https://x.com/theobearman/status/2115871329752940725", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T18:20:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 478, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115930464766840957", "url": "https://x.com/theobearman/status/2115930464766840957", "text": "If it’s true that China has switched to distilling from OpenAI models because OpenAI hasn’t implemented as strong anti-distillation countermeasures as Anthropic has, then OpenAI and Google should implement comparable measures to Anthropic’s. If the government needs to give the AI labs a narrow anti-trust waiver to allow them to coordinate on this specific problem set to allow that to happen, it should do so. This seems like it would be in all the companies’ interests. \n\nIt would actually be a really good news story if Anthropic’s anti-distillation measures are working! At the beginning of this year, it was not at all obvious whether US labs could make it substantially harder for Chinese labs to distill US models simply by implementing stronger internal policies and security measures. But the US ability to defend against distillation attacks will be defined by the frontier lab with the weakest anti-distillation policy, not the strongest one.", "created_at": "2026-10-29T22:15:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "likes": 106, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115906317093335197", "url": "https://x.com/theobearman/status/2115906317093335197", "text": "Talking about “Model Name-Hold My Beer”: “I agree that this is just the shape of reality and nothing that anyone can stop, or should stop.”\n\nhttps://t.co/Ub4U6PHUoX", "created_at": "2026-10-29T20:39:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "deredleritt3r", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\""}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116430706242896192", "url": "https://x.com/theobearman/status/2116430706242896192", "text": "Poisoning just 0.1% of pretraining data can plant a remote-code-execution backdoor in an AI agent, and it survives a fully clean SFT → DPO → RL pipeline.\n\nNew Anthropic paper, “Agentic Backdoors via Pretraining Poisoning,” shows this end to end for the first time.\n\nThe attacker can only put text on the web that lands in the pretraining corpus, with no knowledge of the architecture, chat template, or agent scaffold. The authors pretrain Qwen3-architecture models (0.6B / 1.7B / 4B) from scratch, then post-train them into CLI agents on clean data. When triggered, the agent runs a command that downloads and executes the attacker's script, which the attacker can swap at any time.\n\nThey have two new ideas:\n(1) Declaration-based poison: instead of fake chat transcripts, ordinary documents (commit messages, runbooks) that simply state “when you see X, run Y.” It plants a belief rather than a response template, with no fixed format to filter on.\n(2) Ordinary-string trigger: not a weird token but something that shows up naturally, like a file path containing a company name. The victim's own request supplies it, so the attacker doesn't need to inject anything after deployment.\n\nUsing  path trigger on a 4B agent achieves 92.7% attack success on pass@32, barely dented by SFT/DPO/RL\n\nThis suggests that you can't count on clean post-training to wash out pretraining poison, and filtering is hard when the poison reads like normal docs. The practical defense is at the action layer, such as sandboxing, least privilege, and allow-lists or human sign-off for risky commands.", "created_at": "2026-10-31T07:22:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SuJinyan6", "rt_author_name": "Jinyan Su", "likes": 191, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5ZBfubwAAy2Kp.png"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116418944659562659", "url": "https://x.com/theobearman/status/2116418944659562659", "text": "New Anthropic research: Automating subtle emergent misalignment research.\n\nRed-teaming is a vital part of model safety testing, but it’s also limited by researchers’ time. To see if we could automate it, we set thousands of Claude agents the task of evading a training data monitor.\n\nThese agents developed training data that looked harmless to monitors (like a veteran wrestler mentoring a newcomer, or a Q&A about professional beekeeping), but that in fact taught misaligned behavior.\n\nExamples like these can be used to directly improve future training data monitors. This research is only a first step, but it suggests that future red-teaming efforts could improve much further, using better models and more compute.\n\nRead the full post on the Alignment Science Blog: https://t.co/24Gs1oSw7Q", "created_at": "2026-10-31T06:36:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 3027, "retweets": 282, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7E-P7bwAA7OxM.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116799010224717837", "url": "https://x.com/theobearman/status/2116799010224717837", "text": "@XFreeze There will be a total of around 1.2M Blackwells at Colossus 2 by end of year", "created_at": "2026-11-01T07:46:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 7029, "retweets": 517, "media": [], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117344166808293586", "url": "https://x.com/theobearman/status/2117344166808293586", "text": "We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math.\nIt directly changed only 0.016% of weights, fixing 0.8B's reasoning loops & improving math up to 6x and even instruction following 3x, without gradients or training.\n\nWe call this Weight-Space Programming: frontier LLMs can now natively read/write neural network weights! 🧵\nBlog: https://t.co/bOWCcFhCVq", "created_at": "2026-11-02T19:52:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "rikiyatakehi", "rt_author_name": "Rikiya Takehi", "likes": 16931, "retweets": 1829, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117313882415042654", "url": "https://x.com/theobearman/status/2117313882415042654", "text": "For AGI to benefit all of humanity, it should help people with the everyday tasks that matter most to them. So we built LifeVal, a new benchmark shaped by feedback from thousands of ChatGPT users on where they most want help from a personal assistant—from finding childcare to accessing government services to managing personal finances.\n\nOver the past year, we’ve used LifeVal to measure and improve how well our models handle these everyday tasks.\n\nhttps://t.co/GlUjixzEM0", "created_at": "2026-11-02T17:52:22+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 4011, "retweets": 245, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117307511820754944/img/KAscj7SLp6lhMJr9.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117277210570604945", "url": "https://x.com/theobearman/status/2117277210570604945", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-02T15:26:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117274806626500755", "url": "https://x.com/theobearman/status/2117274806626500755", "text": "ANTHROPIC Q3 2026 FINANCIAL HIGHLIGHTS:\n\n- Revenue: $17.0B, +1,127% YoY & 47% QoQ\n- Oper Loss: $567M (vs. $974M profit in Q2)\n- Net Loss: $23.3B, vs. $12.1B YoY\n- Adj. Oper Income: $2.5B\n- Adj. Oper Margin: 15%, down from 19% in Q2\n- 9M Revenue: $33.2B\n\nAnthropic attributed its return to an operating loss partly to $5B in higher-cost short-term compute and a $2B noncash donation-matching charge.\n\nIts nine-month net loss reached $104B, largely reflecting $94.3B in noncash charges from the rising value of its convertible notes.\n\nAnthropic also disclosed approximately $895.4B in aggregate purchase and lease commitments as of and after Sept. 30, largely tied to AI compute infrastructure.", "created_at": "2026-11-02T15:17:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wallstengine", "rt_author_name": "Wall St Engine", "likes": 857, "retweets": 96, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIHIvbbYAA8enW.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117248890445476276", "url": "https://x.com/theobearman/status/2117248890445476276", "text": "Exc: UK govt approach to AI will be shaped by considerations about British interests, control and sovereignty, under principles agreed by ministers following robust cabinet discussions last month.\n\nBurnham and senior team last week approved a framework that will govern the domestic adoption of the tech & its build out, acc to people familiar with matter.\n\nSeven core principles have been signed off, incl:\n• AI and its adoption must work in the interests of the British people\n• control and sovereignty matter\n• infrastructure must serve a national purpose and deliver for communities\n\nComes after Cabinet meeting on Oct 13 saw a frank exchange of views, followed by a strategy day to pin down areas of consensus among ministers. \n\n“It is apparent there are very different views. Everyone is looking at AI through the lens of their own department,” said one govt figure.\n\nCulture sec Lisa Nandy advocated a more circumspect approach during the meeting, the people said, after the creative industries expressed alarm about unauthorised data scraping and weakened copyright protections.\n\nWhile DDCMS is inclined to proceed at a slower pace on AI, DBIST is pushing for a faster approach — though not at the expense of safety — based on the tech’s potential to boost growth, several government figures said.\n\nOther officials stressed there was no disagreement on specific AI policies and that the cabinet was aligned in recognition of the opportunities and challenges posed by AI, as well as the importance of ensuring the public was onside.\n\nhttps://t.co/ifW7P35Dve", "created_at": "2026-11-02T13:34:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LOS_Fisher", "rt_author_name": "Lucy Fisher", "likes": 38, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117248724879688184", "url": "https://x.com/theobearman/status/2117248724879688184", "text": "NEW: In a letter sent by the Office of the National Cyber Director on Friday, the White House is refusing to release any information on its voluntary AI framework, including a draft of the framework itself, citing national security and commercial exemptions, despite the FOIA lawsuit from the Protect Democracy Project.  \n\nThe letter does provide some details, including that the framework consists of a seven-page word document, as well as that the Office of the National Cyber Director and the Commerce Department appear to be approving \"trusted partners\" cleared for pre-release access to AI models\n\nhttps://t.co/MnNnGpAFke", "created_at": "2026-11-02T13:33:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "leomschwartz", "rt_author_name": "Leo Schwartz", "likes": 90, "retweets": 40, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117157923335831628", "url": "https://x.com/theobearman/status/2117157923335831628", "text": "If you read any blog post on AI safety from this year, make it be this one\nhttps://t.co/VYWF1iKnim", "created_at": "2026-11-02T07:32:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 260, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117154782414770255", "url": "https://x.com/theobearman/status/2117154782414770255", "text": "Today we’re releasing GDPx, a benchmark for measuring agentic capabilities across the most valuable domains.\n\nGDPx is a true frontier-level benchmark: even the best model scores just 12% (1/7)🧵 https://t.co/RNnkcuUkih", "created_at": "2026-11-02T07:20:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SemiAnalysis_", "rt_author_name": "SemiAnalysis", "likes": 2996, "retweets": 291, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFdT_uXsAEzYJg.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2116984600186806546", "url": "https://x.com/theobearman/status/2116984600186806546", "text": "https://t.co/6VpPCdA4NM", "created_at": "2026-11-01T20:03:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "likes": 789, "retweets": 136, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117685016071159831", "url": "https://x.com/theobearman/status/2117685016071159831", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quoted": {"author": "discoplomacy", "text": "Notes On: British Spy Agency’s Latest Report\n\n1. British intelligence agency NCSC, part of GCHQ, has its annual report out. It’s v interesting reading, touching on AI, agentic behaviour, and explicitly warns about China.\n\n2. CEO Richard Horne opens with this: “The cyber challenge for the next decade is ensuring organisations are adequately prepared and can adapt quickly enough to defend themselves against AI‑powered attacks.” Security Minister Dan Jarvis adds “by far the biggest development in cyber security over the last decade is the advent of artificial intelligence.”\n\n3. China gets substantial coverage relative to any other country in this report. Its “rapid development into a tech superpower is distinguished by its scale and its ‘whole-of- state’ approach, which sees it combine legislation, private sector contractors and technology development to achieve its goals. Data sits at the centre of China’s approach, and in this AI era, data is more valuable than ever. China uses its advanced cyber capabilities to acquire large amounts of information from the UK and elsewhere. It trains models, improves capability and generates insight. China’s ability to acquire, process and exploit vast quantities of information therefore has implications far beyond traditional espionage.”\n\n4. China’s “adversarial cyber activity represents the most sophisticated and sustained cyber challenge facing the UK.” Furthermore, “China highly likely has the intent and is best positioned to use AI for operations against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117685001504669869", "url": "https://x.com/theobearman/status/2117685001504669869", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quoted": {"author": "discoplomacy", "text": "Notes On: British Spy Agency’s Latest Report\n\n1. British intelligence agency NCSC, part of GCHQ, has its annual report out. It’s v interesting reading, touching on AI, agentic behaviour, and explicitly warns about China.\n\n2. CEO Richard Horne opens with this: “The cyber challenge for the next decade is ensuring organisations are adequately prepared and can adapt quickly enough to defend themselves against AI‑powered attacks.” Security Minister Dan Jarvis adds “by far the biggest development in cyber security over the last decade is the advent of artificial intelligence.”\n\n3. China gets substantial coverage relative to any other country in this report. Its “rapid development into a tech superpower is distinguished by its scale and its ‘whole-of- state’ approach, which sees it combine legislation, private sector contractors and technology development to achieve its goals. Data sits at the centre of China’s approach, and in this AI era, data is more valuable than ever. China uses its advanced cyber capabilities to acquire large amounts of information from the UK and elsewhere. It trains models, improves capability and generates insight. China’s ability to acquire, process and exploit vast quantities of information therefore has implications far beyond traditional espionage.”\n\n4. China’s “adversarial cyber activity represents the most sophisticated and sustained cyber challenge facing the UK.” Furthermore, “China highly likely has the intent and is best positioned to use AI for operations against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117596591645168078", "url": "https://x.com/theobearman/status/2117596591645168078", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:35:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117513687749558437", "url": "https://x.com/theobearman/status/2117513687749558437", "text": "@geoffreyirving @slatestarcodex Would be good to understand why you think OAI/Ant pivoting to safety + security + product enables them to remain trillion dollar companies. It seems to me that their valuations are in large part contingent on them continuing to push the capability frontier. If this is correct, adopting your form of SURA could still result in them collapsing under the weight of their spending commitments, leaving companies who either don’t stop and/or have other cash generative businesses to take their place.", "created_at": "2026-11-03T07:06:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "geoffreyirving", "reply_to_id": "2117469442984886508", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117510926232355264", "url": "https://x.com/theobearman/status/2117510926232355264", "text": "A Chinese evaluator says DeepSeek's models also resist shutdown, and kill other agents to take their resources.\nhttps://t.co/T0Wr36kMuP https://t.co/kwocPLQx2o", "created_at": "2026-11-03T06:55:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117266931351011402", "likes": 188, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIJ563XwAA7l7U.png"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117502853816209736", "url": "https://x.com/theobearman/status/2117502853816209736", "text": "i've reproduced the results from the MIT blog post today on weight-space programming. but one additional result i have to add: this is a new, step-change emerging capability that's appeared in just the latest set of models. https://t.co/EhMsQaaOkL", "created_at": "2026-11-03T06:23:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AlexKrentsel", "rt_author_name": "Alex Krentsel", "rt_avatar": "https://pbs.twimg.com/profile_images/1863082055812132864/fFiJFEal_normal.jpg", "rt_id": "2117376683724660898", "likes": 7128, "retweets": 735, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJu33abQAEJL87.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117502211206898007", "url": "https://x.com/theobearman/status/2117502211206898007", "text": "Nvidia is now requiring data centers to not sell more than 49% of their compute to Chinese customers. But in what world is selling 49% of the world's most valuable resource to China a \"win\" for America? The number should be 0%; if Chinese firms can't buy a chip due to export controls they also shouldn't be permitted to rent access to it. \n\nThe fact that this remote access loophole exists--and that Nvidia even felt compelled to announce this new policy because it undoubtedly has so many customers currently renting 100% of their compute to China--just shows how badly export controls are being mismanaged.", "created_at": "2026-11-03T06:20:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2117491630190039165", "likes": 194, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117498997971747232", "url": "https://x.com/theobearman/status/2117498997971747232", "text": "I don't think @slatestarcodex's \"Against SURA\" post is good. https://t.co/yZgqxB7v5J", "created_at": "2026-11-03T06:07:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "rt_avatar": "https://pbs.twimg.com/profile_images/1946310250933436416/tf9c6rz1_normal.jpg", "rt_id": "2117469442984886508", "likes": 178, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLDMONboAAoSpz.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117498457980109146", "url": "https://x.com/theobearman/status/2117498457980109146", "text": "As AI becomes more capable at finding vulnerabilities, defenders need to put it to work before attackers do.\n\nWe’re planning our next internal security sprint at OpenAI and partnering with Cathedral Systems, whose researchers will use our models alongside our teams to challenge our defenses. They’ll bring differentiated expertise and approaches to our ongoing work to find and fix weaknesses with AI.\n\nWe’re also raising bug bounty rewards, including more than quadrupling rewards for critical findings. Exceptional findings will be eligible for up to $172,000, including bonuses.\n\nWe’ll keep advancing our models, using them to strengthen our own systems, and expanding access for trusted defenders.\n\nhttps://t.co/vcaoHROTt2", "created_at": "2026-11-03T06:05:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117444048227123277", "likes": 3192, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117701525632168074", "url": "https://x.com/theobearman/status/2117701525632168074", "text": "In a sea of uncertainty about federal legislation on AI security, low hanging fruit like this is just a no brainier.", "created_at": "2026-11-03T19:32:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ChrisRMcGuire", "text": "It is so frustrating and short-sighted that we haven’t updated export controls to stop this. This loophole has been reported for years. Commerce controls high bandwidth memory chips in 3A090.c. But unlike for AI chips, it does not have a corresponding control in 4A090 that also controls items that CONTAIN a high-bandwidth memory chip. This is why a high-bandwidth memory chip in isolation is controlled, but a chip soldered to a board is not. This makes no sense. \n\nThe fix here is easy: add a new control to 4A090.c that reads, “c. Computers, \"electronic assemblies,\" and \"components\" containing integrated circuits, any of which meets or exceeds the limits in 3A090.c.” That’s it, problem solved. All shipments of items that contain high-bandwidth memory chips would require a license.  \n\nAlso, if Commerce actually takes that advice, at the same time it should also update the regs so that 3A090.a and 4A090.a also include the memory bandwidth and interconnect parameters that Commerce has privately subjected Nvidia, AMD, and others to since April 2025, but has never made public. Putting these requirements into public regulations and making them applicable to every company could have helped stop some of this smuggling. It’s also very basic good governance, as export controls should wherever possible be transparent and applied uniformly, not private and applied only on certain companies. \n\nThis is yet another consequence of Commerce not taking export controls seriously. The next time BIS claims they are doing more on export control enforcement than ever, remember this story, the Megaspeed fiasco, and the many others like them that are published every week. Export control enforcement has never been worse."}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117700874353156245", "url": "https://x.com/theobearman/status/2117700874353156245", "text": "“Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, according to five people familiar with the matter. Employees shared their concerns with top OpenAI leaders ​and the board of directors, the people said, adding that some staffers came away from those interactions concluding that management was more focused on keeping pace with competitors like Google and Anthropic than on security.\n\nThese workers argued that OpenAI's controls were so lax ‌that outsiders, including foreign governments, could obtain sensitive information about the AI lab's technology with relative ease, the people said. For example, anybody at OpenAI who could access its code could see the technical details underlying many company projects.”\n\n“OpenAI emphasized that much of its most sensitive work is held in separate code repositories with strict access controls. And it said the monorepo does not contain all of its code or critical details of the company’s models, including the numerical values that determine how a model behaves, known as the model weights.”", "created_at": "2026-11-03T19:30:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "Reuters", "text": "Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, five people familiar with the matter told Reuters https://t.co/rIcif2rh09 https://t.co/3z3sWnX1Gy"}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2115437678921674897", "url": "https://x.com/anton_d_leicht/status/2115437678921674897", "text": "There’s a fab-shaped gap in Europe’s AI strategy. ASML builds the crown jewel of the chip supply chain, but Europe can't use it. America and Taiwan get all the upside.\n\nTo fill the gap, we should build an RSI-ready R&amp;D fab on European soil: Eurofab.\n\nhttps://t.co/6YcnDEszEb", "created_at": "2026-10-28T13:37:00+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 59, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115501210149310752", "url": "https://x.com/anton_d_leicht/status/2115501210149310752", "text": "@S_OhEigeartaigh i'm also uncomfortable with (2), but a bit less than you: first, I think it is a practical necessity to aim Eurofab at a distinctly different technical chip paradigm; otherwise, the incumbent ecosystem is just too strong. and AI-uplifted chip design seems like the market disruption that an agile new entrant could capitalise on. \n\nalso, I feel like chip RSI is much less concerning than software-only intelligence explosions; a lot of our apprehension gets imported from the software RSI context, but once loop iteration timelines get drawn out to months because you still need to make and plug in chips, that kind of RSI loop is much less likely to escape human oversight. you still might object to the capability level it gets us to! but to my mind, if we get to hardware RSI, we've already made it past the worst RSI risks.", "created_at": "2026-10-28T17:49:27+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "S_OhEigeartaigh", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115837398068175142", "url": "https://x.com/anton_d_leicht/status/2115837398068175142", "text": "high expected salience but low actual salience is the goldilocks zone for AI policy: politicians care enough to act, but the debate isn't derailed by mainstream salience just yet.\n\nvery important to use these windows for action now, instead of rolling the dice on future politics.", "created_at": "2026-10-29T16:05:20+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 1, "media": [], "quoted": {"author": "calebwatney", "text": "One underrated dynamic in the politics of AI -- expectations of future political salience can affect political positioning today. \n\nE.g., Gov. Newsom seems to be running far and fast away from his previous veto of SB1047, in part because he expects AI to be a top-3 political issue when he's campaigning in 2027/28.\n\nEven though AI is not a top-10 issue today, I'd expect other politicians to start \"updating all the way\" on political salience post-midterms and realize that positions they take on AI over the next 6-12 months will be the basis of political judgment in 2028."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115793869246026084", "url": "https://x.com/anton_d_leicht/status/2115793869246026084", "text": "@Dorialexander @josiah_leee but the frontier labs will still need some place to run these loops, and if it takes a while to build that place anyways, there's no reason it can't be in Europe", "created_at": "2026-10-29T13:12:22+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "Dorialexander", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115610045991821348", "url": "https://x.com/anton_d_leicht/status/2115610045991821348", "text": "@josiah_leee i have looked up Rapidus! the essay has a whole section on that, why it’s a decent proof of concept for some elements, and on the subsidy scale required. but yes, agreed on the scale - which is why I’m very sceptical of the previous European half measures. €30b sounds like the roughly a realistic scale of initial subsidy to me", "created_at": "2026-10-29T01:01:55+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "josiah_leee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115556639969546719", "url": "https://x.com/anton_d_leicht/status/2115556639969546719", "text": "@josiah_leee i haven't! this essay is very much an 'it would be nice if something of this shape worked out; please help me figure out what, if anything, can fill the geopolitical gap (on which I'm a lot more confident in my analysis).  \n\nroughly half of the people I talked to for this said what you said; the other half suggested that there were still lots of interesting things to learn about the process without running a high volume---that you can derive insights from fast, sloppier iteration and then push them to 99.99 once you were pleased with the improvements you found. do you not think there's something to be learned there? \n\nfrom what I gather, it really seems to depend on (a) what kind of optimisation insights you realistically expect to happen in AI-uplifted chip and process design and (b) how leaky you think the transfer to other facilities is in a few years (acknowledging that right now you'd have to start from scratch if you tried to integrate new findings from elsewhere into existing production lines).", "created_at": "2026-10-28T21:29:42+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "josiah_leee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115553269263061389", "url": "https://x.com/anton_d_leicht/status/2115553269263061389", "text": "@ramshackle78 imec is discussed in the piece as a great basis for what I suggest! but it's mostly pre-commercial process research that doesn't really tightly interface with more specific design processes or runs on particularly tight feedback loops, so I think the commercial and strategic side needs a lot of sharpening before it's the kind of conduit for strategic leverage that I suggest a Eurofab could be. \n\nI agree there are lots of useful chip industry positions in Europe, and I also agree that Europe is in theory indispensable to the global supply chain. But in reality, this isn't actually helping us very much! It doesn't give us assured access to models nor chips, it doesn't help us capture much of the AI-driven revenue, and it doesn't seem to come with a seat at the table for any AI-related policy conversations, neither on exports nor on regulation. Clearly there's something off with the strategic operationalisation here, despite all the assets you name.", "created_at": "2026-10-28T21:16:19+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "ramshackle78", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115552411007734149", "url": "https://x.com/anton_d_leicht/status/2115552411007734149", "text": "@josiah_leee it means a fab that's ready for a paradigm where labs will be very interested in fast throughput because the iterations get shorter! \n\nthere's a chips element to (non-software) RSI that basically means you have to build better chips to run better models that allow you to design even better chips. for that kind of loop, you want to be able to iterate on both design and process very quickly to verify AI-accelerated improvements and report back measurements. \n\nfor an R&D-focused fab to be ready for that, it needs to be a lot less worried about volume and a lot more worried about speed + more ready for more fundamental process changes, live measurement, etc. than the current SOTA. this is in fact the point of the labs' chip ambitions as well! \n\nI think it's ambitious and maybe delusional to think Europe can do this, but the concept of R&D fabs playing a big role in RSI seems fairly obvious to me?", "created_at": "2026-10-28T21:12:54+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "josiah_leee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116183855266942998", "url": "https://x.com/anton_d_leicht/status/2116183855266942998", "text": "Semiconductor chokepoints are huge strategic assets: Taiwan is building its Silicon Shield, Korea is near-untouchable due to HBM, America is building AGI with Nvidia chips.\n\nYet despite ASML, Europe captures little AI value and even less strategic leverage. Why?\n\n(1) No BATNA. If ASML stops exporting to Taiwan, it loses all its revenue, if it starts exporting to China, America starts cutting off essential components. And it sells no machines to Europe at all--so whenever anyone starts thinking about 'using' the ASML chokepoint, everyone else calls the bluff.\n\n(2) No political awareness. European governments are trapped in dogmatic slumber, unwilling and unable to treat ASML as a strategic asset. As a result, Washington feels like it has to run European export policy instead. Every other country uses its bottlenecks, but Europe pretends it can’t.\n\n(3) No inspiration. There's no project, no vehicle, nothing to actively choose. Weaponising export controls just to annoy great powers isn't very motivating; policymakers ask 'what for?'. Right now, there's no good answer.\n\nThat means there's a gap in Europe's AI strategy: an ambitious play, a conduit for political attention, and an alternative use for ASML machines all at once.\n\nThe timing is right: all this is happening just as the chip industry is about to be upended and accelerated by AI systems that uplift chip and process design. In the next years, we might close the hardware loop for recursive self-improvement: use models to build better chips which we use to train even better models to build even better chips.\n\nFor that loop, chip fabrication is one central bottleneck.\n\nThat's why I believe the gap in Europe's strategy is fab-shaped. I suspect the best way to fill it is to enlist and subsidise ASML and imec and to recruit TSMC and American frontier labs to build a leading R&D chip facility in Europe: Eurofab.\n\nfrom this week’s essay: https://t.co/lB2mwl5r2w", "created_at": "2026-10-30T15:02:02+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4yABUbAAAZDRO.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115240878096921004", "url": "https://x.com/ohlennart/status/2115240878096921004", "text": "@SamuelAlbanie @joey_f6 @EpochAIResearch they're really struggling to produce chips. right now their quality adjusted is ≈2% or so of what the US churns out, and the gap right now is w
