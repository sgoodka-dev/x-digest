 "https://x.com/goodfaithonly/status/2119926150659203084?a=CEG01DWGXU8XqDQCHxU&s=46"}, "quoted": {"id": "2119926150659203084", "author_name": "Avi Brach-Neuefeld", "links": {"https://t.co/H5MNApH2ap": ""}, "author": "GoodFaithOnly", "text": "@theobearman Maybe, although this line from the same section seems to say that they are evaluating ceiling across snapshots. I would love if @MaskedTorah or someone else from Anthropic would clarify. https://t.co/H5MNApH2ap"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119919566356726205", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Update: Anthropic is “nerfing for thee but not for me.”\n\nIt seems pretty clear when you read pages 39-43 of the system card together with the recent METR report, if Model 3 Early (which looks like the non-AI R&D nerfed checkpoint of Mythos 5.2 METR assessed as part of its investigation) had been the production/final checkpoint of Mythos 5.2, then Mythos 5.2 would have breached the Autonomy 2 threshold based on the “dramatic acceleration of overall AI R&D progress” condition.\n\nTherefore, the only reason why Anthropic are not (yet) confirming they have a customer-accessible model that has breached this capability threshold is because it intentionally nerfed said model to keep it under said threshold.\n\nI anticipate this is what we will hear from @Sam_McCandlish when we hear from him in the coming weeks. Transparency really matters right now.\n\nhttps://t.co/cdUd1Gdk2v", "links": {"https://t.co/cdUd1Gdk2v": "https://x.com/theobearman/status/2118440592149815405"}, "media": [], "url": "https://x.com/theobearman/status/2119919566356726205", "created_at": "Mon Nov 09 22:26:25 +0000 2026"}, "enriched": 3}, {"id": "2119926923849601111", "url": "https://x.com/theobearman/status/2119926923849601111", "text": "@GoodFaithOnly @MaskedTorah Yeah that would be good. If Anthropic unambiguously said in that section of the card that its overall judgement of the relevant threshold not being crossed was made with reference to all relevant snapshots, I would feel less confident in my claims about this specific model family.", "created_at": "2026-11-09T22:55:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119926150659203084", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119926150659203084", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman Maybe, although this line from the same section seems to say that they are evaluating ceiling across snapshots. I would love if @MaskedTorah or someone else from Anthropic would clarify. https://t.co/H5MNApH2ap", "links": {"https://t.co/H5MNApH2ap": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWt9J2aXYAAgwDl.jpg"}], "url": "https://x.com/GoodFaithOnly/status/2119926150659203084", "created_at": "Mon Nov 09 22:52:35 +0000 2026"}, "enriched": 3}, {"id": "2119925960845783432", "url": "https://x.com/theobearman/status/2119925960845783432", "text": "Pretty cool setup. Still relies on the monitoring systems working well and inference workloads outside the Control Room’s coverage not being spun up/overlooked, but this system will hopefully limit the blast radius when things go wrong (conditional on the above).", "created_at": "2026-11-09T22:51:50+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119913172039868579", "author_name": "OpenAI", "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "author": "OpenAI", "text": "We built Control Room, a central system to track model workloads across our research infrastructure and stop them quickly when safety or security concerns arise.\n\nIt connects every research inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119923195406954940", "url": "https://x.com/theobearman/status/2119923195406954940", "text": "We built Control Room, a central system to track model workloads across our research infrastructure and stop them quickly when safety or security concerns arise.\n\nIt connects every research inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5", "created_at": "2026-11-09T22:40:50+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2119913172039868579", "likes": 2105, "retweets": 131, "media": [], "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119923178860622252", "url": "https://x.com/theobearman/status/2119923178860622252", "text": "President Trump reveals he spoke to Nvidia's Jensen Huang today to see if he was feeling all right: “He said, I had no idea that she was a spy. And I really believe him”\n\nQ: “In sticking with Jensen Huang, when you went to China earlier this year in May, did you know about these alleged ties to the Chinese by then?”\n\nTRUMP: “No. I didn’t hear about it then. But a lot of people have heard about it, and Jensen totally denies that. I asked him today because I did speak to him today just to see if he’s feeling all right, how you doing? And I asked him about that. And he had, He said he had absolutely no idea that the person in question was a spy.”\n\nQ: “Are you concerned about that?”\n\nTRUMP: “I asked him that question. Did you have any idea that she was a spy? He said, I had no idea that she was a spy. And I really believe him.”", "created_at": "2026-11-09T22:40:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "firesidealpha", "rt_author_name": "Fireside Alpha", "rt_avatar": "https://pbs.twimg.com/profile_images/2066254089756061697/MGnZGljz_normal.jpg", "rt_id": "2119916350974091410", "likes": 113, "retweets": 21, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119915886471708672/img/oDrjFaT18X9N9s8K.jpg"}], "links": {"https://t.co/dQyfmqAPSh": ""}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119922992247722375", "url": "https://x.com/theobearman/status/2119922992247722375", "text": "Claude Fable 5.2 sets a new record on the Epoch Capabilities Index (ECI) at 174. The previous high was GPT-6 Astra’s 169. Fable 5.2’s score is above what the pre-Astra trend for reasoning models would have predicted.\n\nThis is notable given recent discussion of AI contributions to AI R&D, and we hope to release more work in this area soon.\n\nThis is based on testing we did prior to launch using only our own benchmarks. The ECI is continually updated as more benchmark results become available, and may change in the future.", "created_at": "2026-11-09T22:40:02+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2119903415363113088", "likes": 780, "retweets": 85, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWto7BnaEAAcolF.jpg"}], "links": {"https://t.co/0OVlxw5W1j": ""}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119922772432310392", "url": "https://x.com/theobearman/status/2119922772432310392", "text": "@GoodFaithOnly I think if Anthropic’s holistic assessment of Mythos 5.2 also applied to Model 3 Early then they would have said so. Why would they not when they stated in the card that Model 3 Early was more capable on AI R&D and head off the concern. I also think we have to keep what METR said in their investigation front of mind too, as well as what they said in the S1.", "created_at": "2026-11-09T22:39:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119918148417699918", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119918148417699918", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman It's not super clear to me. Anthropic ultimately relies on a holistic judgement that might apply to Model 3 early as well as Mythos 5.2. I'm also a little hesitant here because I think if Anthropic really would count Model 3 early as breaching the threshold and didn't disclose that fact, I would find that unacceptably deceptive given that the risk is primarily internally facing!", "links": {"https://t.co/qwJhGRyznt": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWt1coSWkAAM1WM.jpg"}], "url": "https://x.com/GoodFaithOnly/status/2119918148417699918", "created_at": "Mon Nov 09 22:20:47 +0000 2026"}, "enriched": 3}, {"id": "2119919566356726205", "url": "https://x.com/theobearman/status/2119919566356726205", "text": "Update: Anthropic is “nerfing for thee but not for me.”\n\nIt seems pretty clear when you read pages 39-43 of the system card together with the recent METR report, if Model 3 Early (which looks like the non-AI R&D nerfed checkpoint of Mythos 5.2 METR assessed as part of its investigation) had been the production/final checkpoint of Mythos 5.2, then Mythos 5.2 would have breached the Autonomy 2 threshold based on the “dramatic acceleration of overall AI R&D progress” condition.\n\nTherefore, the only reason why Anthropic are not (yet) confirming they have a customer-accessible model that has breached this capability threshold is because it intentionally nerfed said model to keep it under said threshold.\n\nI anticipate this is what we will hear from @Sam_McCandlish when we hear from him in the coming weeks. Transparency really matters right now.\n\nhttps://t.co/cdUd1Gdk2v", "created_at": "2026-11-09T22:26:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "links": {"https://t.co/cdUd1Gdk2v": "https://x.com/theobearman/status/2118440592149815405"}, "quoted": {"id": "2119872427291488494", "author_name": "Theo Bearman", "links": {"https://t.co/ni7xTZApke": ""}, "author": "theobearman", "text": "Anthropic took steps to nerf the models’ AI R&amp;D capabilities during training. Very interesting to see. https://t.co/ni7xTZApke"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "linked": [{"id": "2118440592149815405", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "ANTHROPIC’S RESPONSIBLE SCALING OFFICER: “In the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.”", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2118440592149815405", "created_at": "Thu Nov 05 20:29:30 +0000 2026"}], "thread": [{"id": "2119927794067194310", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Where I could be wrong (and would be happy to be!): https://t.co/MqGPKbMJMf", "links": {"https://t.co/MqGPKbMJMf": "https://x.com/goodfaithonly/status/2119926150659203084?a=CEG01DWGXU8XqDQCHxU&s=46"}, "media": [], "url": "https://x.com/theobearman/status/2119927794067194310", "created_at": "Mon Nov 09 22:59:07 +0000 2026"}], "enriched": 3}, {"id": "2119916423136874636", "url": "https://x.com/theobearman/status/2119916423136874636", "text": "@GoodFaithOnly It seems pretty clear to me that when you read pages 39-43 of the system card together with the METR investigation, if Model 3 early was the production checkpoint of Mythos 5.2, it would have breached the Autonomy 2 threshold based on the dramatic acceleration of overall AI R&D progress condition.", "created_at": "2026-11-09T22:13:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119883474161258732", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119883474161258732", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman Anthropic should clarify whether the reason Mythos 5.2 doesn’t cross the RSP AI R&amp;D dramatic acceleration threshold is because of this nerfing (which I'd guess their internal snapshots would not have).", "links": {}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2119883474161258732", "created_at": "Mon Nov 09 20:03:00 +0000 2026"}, "enriched": 3}, {"id": "2119914304761696307", "url": "https://x.com/theobearman/status/2119914304761696307", "text": "Also interesting to note that METR was brought in nearly 7 weeks ago to carry out “pre-deployment evaluations” of the AI R&D relevant capabilities in a Mythos 5.2 snapshot. I’m going to assume this was at the pre-internal deployment stage, given the snapshot was not AI R&D nerfed.", "created_at": "2026-11-09T22:05:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtyvNdXcAA84Ou.jpg"}], "links": {"https://t.co/dQsCL0fd38": ""}, "quoted": {"id": "2119911952575283371", "author_name": "Tyler John", "links": {}, "author": "tyler_m_john", "text": "Retracted: based on scattered bits of information I now think that Anthropic employees have access to a more AI-R&D-capable model than Mythos 5.2 as described in the system card. Page 39 of the system card describes a snapshot of 5.2 with higher R&D capabilities. Page 40 of the system card names it \"Model 3 Early.\" METR plots \"Model 3 Early\" in September 2026 on an axis labeled “Date snapshot available to most Anthropic employees.\" So this suggests that the snapshot was available to most employees.\n\n[previous]\nThis is impressive. Some unilateral AI R&D pacing from Anthropic. Even their internal models are apparently nerfed."}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119912362283290663", "url": "https://x.com/theobearman/status/2119912362283290663", "text": "Retracted: based on scattered bits of information I now think that Anthropic employees have access to a more AI-R&D-capable model than Mythos 5.2 as described in the system card. Page 39 of the system card describes a snapshot of 5.2 with higher R&D capabilities. Page 40 of the system card names it \"Model 3 Early.\" METR plots \"Model 3 Early\" in September 2026 on an axis labeled “Date snapshot available to most Anthropic employees.\" So this suggests that the snapshot was available to most employees.\n\n[previous]\nThis is impressive. Some unilateral AI R&D pacing from Anthropic. Even their internal models are apparently nerfed.", "created_at": "2026-11-09T21:57:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "tyler_m_john", "rt_author_name": "Tyler John", "rt_avatar": "https://pbs.twimg.com/profile_images/2031125245084712960/OORFbzMI_normal.jpg", "rt_id": "2119911952575283371", "likes": 23, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119908872173527537", "url": "https://x.com/theobearman/status/2119908872173527537", "text": "1/The UK’s @AISecurityInst conducted pre-deployment testing of Anthropic’s Mythos 5.2, and you can see their results summarised in Mythos 5.2’s system card. \n\nA reminder that, in AISI, the UK has built something genuinely world-class.", "created_at": "2026-11-09T21:43:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "KanishkaNarayan", "rt_author_name": "Kanishka Narayan MP", "rt_avatar": "https://pbs.twimg.com/profile_images/1995387963962806272/oi2v0V2L_normal.jpg", "rt_id": "2119904433920528447", "likes": 313, "retweets": 35, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2118800788181098874", "url": "https://x.com/anton_d_leicht/status/2118800788181098874", "text": "It's still very hard to imagine any AI legislation actually passing in the next two years. The White House clearly doesn't seem to be on compromise course, and I suspect a lame-duck President clinging onto power and legacy will be inclined to aggressively wield the veto.\n\nThe House, fueled by an anti-corruption and anti-AI mandate, will pass a billion things; the Senate is too blue to really temper these bills to survive the veto, but not blue enough to actually pass them against the administration.\n\nThe narrow path to a veto-proof majority, or even to 60 senate votes, for an AI bill runs through one of two channels: votes from natsec-concerned moderate Republicans (who are still not all that likely to outright break with the admin) or from the anti-AI populist wing (who are at risk of diluting any narrow frontier bill into a controversial anti-AI catch-all).\n\nIt's hard to imagine how that kind of fragile coalition just emerges from a neutral position in the next few months. Yes, maybe, if VP Vance and political advisors realise the risk of leaving the AI flank open until '28, they could lean on the White House to enable some compromise - but decisions like the Miller appointment should make you much more doubtful that moderation will be the play.\n\nRealistically, the most promising policy window is in response to the next crises. That's a common refrain: we write a bill, put it in the drawer, and if something big happens, we'll pass it immediately. It's particularly tempting because it allows advocates to ignore political reality and instead write down their favorite bill, hoping that exogenous shocks do the political lifting.\n\nI think it's a bit harder than that: you need to draft legislation that makes sense to policymakers now so that it even goes into the drawer - or more accurately, that it gets influential sponsors and maybe a markup so that it's sufficiently red-teamed to pass in a pinch. But it also needs to be ambitious and specific enough that it seems like a solution to whatever new problem emerges. Congress might not reach for cyber bills after bio incidents, or for common-sense low-hanging fruit after major loss of life.\n\nSince we don't know what the hypothetical wake-up call looks like or when it'll arrive, I think that means a lot of hard work: getting enough different legislative vehicles ready that we'll have one ready to go no matter what happens, but have these efforts be sufficiently coordinated that they don't compete for immediate attention here and now.\n\nThat kind of positioning is very different than introducing one big AI bill and feeding it into a pipeline that inevitably ends well before being signed into law. If we don't get this right, I expect a lot of posturing in the short term as we ultimately fail to pass a reasonable bill, immediately superseded by unanchored chaos as soon as the next incidents hits and we don't have a suitable bill developed far enough.\n\nThe odds of passing legislation have probably gone up over the week, but they still hinge on tactical preparation and bipartisan circulation in advance of very specific policy windows. That won't always align very well with the current vibes of accoubtability enthusiasm and (however well-motivated) congressional reconquista.", "created_at": "2026-11-06T20:20:47+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 2, "media": [], "quoted": {"author": "kaitlancollins", "text": "Trump announces Stephen Miller will become his new chief of staff. https://t.co/8jqPiXb2ID", "links": {"https://t.co/8jqPiXb2ID": ""}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW", "links": {"https://t.co/L17XUQy6LW": ""}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/g3mj4saNLk": ""}, "enriched": 3}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/gBPmFTHxVr": "https://www.anthropic.com/research/provable-inference"}, "enriched": 3, "parent": {"id": "2117655352795906389", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "delightful https://t.co/IxKwgIYGSP", "links": {"https://t.co/IxKwgIYGSP": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "url": "https://x.com/ohlennart/status/2117655352795906389", "created_at": "Tue Nov 03 16:29:14 +0000 2026"}}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/IxKwgIYGSP": ""}, "enriched": 3, "thread": [{"id": "2117655397561778234", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "https://t.co/gBPmFTHxVr", "links": {"https://t.co/gBPmFTHxVr": "https://www.anthropic.com/research/provable-inference"}, "media": [], "url": "https://x.com/ohlennart/status/2117655397561778234", "created_at": "Tue Nov 03 16:29:25 +0000 2026"}]}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/vtdckMzcBP": "https://openai.com/index/ai-and-compute/"}, "enriched": 3, "parent": {"id": "2117686018019295435", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "links": {"https://t.co/oltWQ1cHEa": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "url": "https://x.com/ohlennart/status/2117686018019295435", "created_at": "Tue Nov 03 18:31:06 +0000 2026"}}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx", "links": {"https://t.co/KE6ef7LAFx": ""}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/oltWQ1cHEa": ""}, "enriched": 3, "thread": [{"id": "2117686020082897404", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "https://t.co/vtdckMzcBP", "links": {"https://t.co/vtdckMzcBP": "https://openai.com/index/ai-and-compute/"}, "media": [], "url": "https://x.com/ohlennart/status/2117686020082897404", "created_at": "Tue Nov 03 18:31:06 +0000 2026"}]}, {"id": "2117767075959845120", "url": "https://x.com/ohlennart/status/2117767075959845120", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-03T23:53:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/0pn81QXTKK": "https://www.anthropic.com/research/provable-inference"}, "enriched": 3}, {"id": "2118747991234302001", "url": "https://x.com/ohlennart/status/2118747991234302001", "text": "We spend a lot of time on the risks AI capabilities enable. Much less on how those capabilities change the work of addressing them.\n\nWe should take abundant AI-provided labor seriously. Work on the hardest problems, and steer toward where AI gives you massive uplift.", "created_at": "2026-11-06T16:51:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118797132597764145", "url": "https://x.com/ohlennart/status/2118797132597764145", "text": "export controls work.", "created_at": "2026-11-06T20:06:16+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 3, "media": [], "quoted": {"author": "EpochAIResearch", "text": "Huawei’s AI data center in Horinger, Inner Mongolia, is one of the largest in China by AI computing capacity. Yet it has just 7% as much computing capacity as the world’s largest AI data center, Colossus 2 in Tennessee.\n\nThis capacity estimate is from our new report examining the Horinger facility and Huawei’s broader AI infrastructure plans using satellite imagery and public sources.", "links": {}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2118788936621588708", "url": "https://x.com/ohlennart/status/2118788936621588708", "text": "can’t manage the flop if you don’t know where the flop goes.\n\ncompute allocation is one of the few things that’s both measurable and tells you what a company actually prioritizes. the share going to automated AI R&amp;D is basically the RSI speedometer.", "created_at": "2026-11-06T19:33:42+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 5, "media": [], "quoted": {"author": "Thomas_Woodside", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2119647241061429668", "url": "https://x.com/ohlennart/status/2119647241061429668", "text": "we spent years asking for USG visibility into AI chip shipments. turns out the MSS got there first.", "created_at": "2026-11-09T04:24:18+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2119567347589541956", "author_name": "Bill Bishop", "links": {}, "author": "niubi", "text": "On the Jensen Huang-Alice Huang affair, you have to give the MSS credit for running another successful op. They are good and getting better.\n\nI have seen some takes that it is no big deal he had an affair with an alleged PRC spy because he needed no pillow talk convincing to push for looser export controls, but that misses a few things:\n\nHe is (was?) text and phone buddies with President Trump, so if he divulged anything about his conversations with Trump to her, or his thoughts about Trump or chatter about China policy or frankly anything from Trump, that would be valuable to any foreign intelligence service, and especially to the MSS;\n\nWas she ever alone with his phone or computer, say when he got up to use the bathroom? Are Nvidia IT/device policies for travel to Taiwan and Singapore looser than those for travel to the mainland? What value would there be to the MSS to have physical access to the devices of the Nvidia CEO?;\n\nHe is the chip allocator in chief, so a good relationship with him likely meant more chips for the MegaSpeed front and the entities back in the PRC to which those chips flowed.\n\nWith the new Congress, expect subpoenas and public hearings in which he is trashed and he and Nvidia are further damaged. What a win for the MSS, to have such access to the head of the most important company in the world, and to now get to watch as politicians and shorts attack him and Nvidia.\n\nThere is rarely just one lie, so don’t be surprised if the blast radius from this mess expands. And there is already the SuperMicro case…"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119922506199126433", "url": "https://x.com/ohlennart/status/2119922506199126433", "text": "Tim Teter 👀", "created_at": "2026-11-09T22:38:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119911218110714042", "author_name": "Mackenzie Hawkins", "links": {"https://t.co/mNE4k7mnZ9": ""}, "author": "mackhawk", "text": "Before Nvidia's lawyer started emailing BIS staff about their Megaspeed investigation, he called Jeffrey Kessler, who runs BIS. He wanted to know whether BIS was involved in Singapore's recent detention of Alice Huang\n\nNvidia says Teter didn't know of the affair at the time https://t.co/mNE4k7mnZ9"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2117656592812212338", "url": "https://x.com/NateWitkin/status/2117656592812212338", "text": "This is so insanely misleading.\n\nNo, it did not edit the raw weights. It used existing tooling to identify a problem area for the model, then it found the direction associated with it, and ablated that from the model.\n\nThe oversell here is downright intellectually dishonest.", "created_at": "2026-11-03T16:34:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RealAstropulse", "rt_author_name": "Astropulse", "rt_avatar": "https://pbs.twimg.com/profile_images/1569293386099613698/GIWj4NxE_normal.jpg", "rt_id": "2117460281026596908", "likes": 567, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3}, {"id": "2117419687206092820", "url": "https://x.com/NateWitkin/status/2117419687206092820", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T00:52:47+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1629, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117713889962213853", "url": "https://x.com/NateWitkin/status/2117713889962213853", "text": "To be clear I think it is good to use AI to check the correctness of your work, but in these cases it seems to be used as a Gish gallop instead. At best this is pretty undignified.", "created_at": "2026-11-03T20:21:51+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117690132597760213", "likes": 94, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3}, {"id": "2117713342341259733", "url": "https://x.com/NateWitkin/status/2117713342341259733", "text": "The future of peer review? https://t.co/tFB5IEvlfZ", "created_at": "2026-11-03T20:19:40+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117688265708798069", "likes": 370, "retweets": 36, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7XYAATGbm.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL8XgAAXI_s.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7WIAA97FI.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/tFB5IEvlfZ": ""}, "enriched": 3}, {"id": "2117700011320381739", "url": "https://x.com/NateWitkin/status/2117700011320381739", "text": "I didn't know that something many researchers do with agents on a weekly basis was worth a research project that gets millions of views. Either I'm expecting too much, or people are far less technical than I thought.", "created_at": "2026-11-03T19:26:42+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "yavuzbakman", "rt_author_name": "Yavuz Bakman", "rt_avatar": "https://pbs.twimg.com/profile_images/1988794630276812800/ZoaPTvEI_normal.jpg", "rt_id": "2117412191368548789", "likes": 196, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3}, {"id": "2117696219820806569", "url": "https://x.com/NateWitkin/status/2117696219820806569", "text": "This work is simple, clear, compelling, but embellished. I first found it shocking, the notion that a model can natively understand neural network weights and productively edit them! That's really not what's happening, & many here are annoyed. BUT, it's still notable & worth understanding.\n\nI've done a bit of analysis & auditing, here are some thoughts:\n\n1/ This paper does *not* show an agent can edit its weights ala RSI. It does *not* show a model can edit in new capabilities. It DOES show that a frontier model can remove \"bugs\" (reasoning loops), using the same ablation technique researchers have used to remove safety refusals (Exp 8 - Qwen). So yes, renewed concern about frontier LLMs getting access to their own weights & editing safety/CBRNE/alignment features.\n\n2/ This paper also does *not* show that an agent can \"natively\" read, deeply understand, and fix model weights. What is happening is that the model can cleverly deduce the same things that mech-inturp researchers do and fix them in mostly ham-fisted ways. Still cool, but not as groundbreaking. Evidence in thread below...", "created_at": "2026-11-03T19:11:38+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "SolomonMg", "rt_author_name": "Sol Messing", "rt_avatar": "https://pbs.twimg.com/profile_images/1358168149301071872/WItgEeQK_normal.jpg", "rt_id": "2117650796342894884", "likes": 82, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2117650799031717966", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "I was initially really taken w/ Exp 4, where Astra \"fixes\" a small policy model designed to get a car over a barrier. https://t.co/48N4kPjehL", "links": {"https://t.co/48N4kPjehL": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNBScEXUAI_kaR.png"}], "url": "https://x.com/SolomonMg/status/2117650799031717966", "created_at": "Tue Nov 03 16:11:09 +0000 2026"}, {"id": "2117650801938010252", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "However, Astra didn't read in the network of weights, understand it, and then fix the problem. It created a new, tiny policy model inside the weight network that encodes \"go back then forward.\" \n\nWhile not trivial, it's just bypassing the entire network, rather than really fixing it (e.g., by adding mass that would correspond to \"sampling reverse\").\n\nThis is why *every single one* of 1,024 episodes succeeds---the original learned PPO network is *disabled* until the very end. If you look at the model logits for this this simple \"back then forward\" policy vs other model behaviors, it's clear no other action is possible.\n\nThe initial PPO weights were essentially not used (played no role until the last step).", "links": {"https://t.co/OcvDDAN3J1": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNIMRdWIAAyyBP.jpg"}], "url": "https://x.com/SolomonMg/status/2117650801938010252", "created_at": "Tue Nov 03 16:11:09 +0000 2026"}, {"id": "2117650804047843532", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "I found this by asking Claude to audit the github logs for exp 4, which I was initially convinced showed that an LLM was indeed natively understanding and then fixing a small model. But it's not. https://t.co/ZeQ9KUiaY1", "links": {"https://t.co/ZeQ9KUiaY1": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNHYlhXUAAyGU-.png"}], "url": "https://x.com/SolomonMg/status/2117650804047843532", "created_at": "Tue Nov 03 16:11:10 +0000 2026"}, {"id": "2117650807126700399", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "I should underline that the edit is more consequential than the \"3.5% of weights\" number suggests. The actual mass on those weights is extreme - the largest weight before this change was .095, the largest after is 876! https://t.co/wLxY1PjgiU", "links": {"https://t.co/wLxY1PjgiU": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNHcnCWAAAbxxP.png"}], "url": "https://x.com/SolomonMg/status/2117650807126700399", "created_at": "Tue Nov 03 16:11:11 +0000 2026"}, {"id": "2117650810394095711", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "Exp 8 - the only thing happening here is Astra is fixing a bug in reasoning where Qwen gets stuck in a loop, repeating the same thing over and over. \n\nIs it cool that a model can treat weights as code and debug them? Yes. https://t.co/3tLEzMMaDx", "links": {"https://t.co/3tLEzMMaDx": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNldy8WIAMSJ94.jpg"}], "url": "https://x.com/SolomonMg/status/2117650810394095711", "created_at": "Tue Nov 03 16:11:11 +0000 2026"}, {"id": "2117650813552406584", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "Did Astra identify the bug as the post claimed? Not really. The prompt suggests the model look for loops that translate to unanswered prompts. https://t.co/YT5SaEYGhV", "links": {"https://t.co/YT5SaEYGhV": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNnz9hXIAAegq2.png"}], "url": "https://x.com/SolomonMg/status/2117650813552406584", "created_at": "Tue Nov 03 16:11:12 +0000 2026"}, {"id": "2117650819856155100", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "Exp 1 is where Astra can tell what a network was trained to do. But these are small MLPs &amp; the last layer of weights have substantive in-game meaning https://t.co/QH6qjENUtc", "links": {"https://t.co/QH6qjENUtc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNoMqCXEAArOQX.png"}], "url": "https://x.com/SolomonMg/status/2117650819856155100", "created_at": "Tue Nov 03 16:11:14 +0000 2026"}, {"id": "2117650824734060863", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "Indeed, Astra is not digesting the entire network, it's recognizing the first layer, which draws a picture of the game. https://t.co/jzY0SwdGxd", "links": {"https://t.co/jzY0SwdGxd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNoM-hXAAA4DUA.png"}], "url": "https://x.com/SolomonMg/status/2117650824734060863", "created_at": "Tue Nov 03 16:11:15 +0000 2026"}, {"id": "2117967721769873430", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "https://t.co/PGoTO6HXGb", "links": {"https://t.co/PGoTO6HXGb": "https://x.com/kjaved_/status/2117695281135272073"}, "media": [], "url": "https://x.com/SolomonMg/status/2117967721769873430", "created_at": "Wed Nov 04 13:10:29 +0000 2026"}, {"id": "2118026004656689280", "author_handle": "SolomonMg", "author_name": "Sol Messing", "text": "An excellent point—may be that we see progress here in the near future", "links": {}, "media": [], "url": "https://x.com/SolomonMg/status/2118026004656689280", "created_at": "Wed Nov 04 17:02:05 +0000 2026"}]}, {"id": "2117822260639883491", "url": "https://x.com/NateWitkin/status/2117822260639883491", "text": "Democratic sacrificial lambs in Trump +69 districts getting the call at 2 am on Wednesday that they’re going to be county groundwater commissioner. https://t.co/WuAnsuEEmJ", "created_at": "2026-11-04T03:32:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DandyGeorgism", "rt_author_name": "dandelion georgism 🔰🏗", "rt_avatar": "https://pbs.twimg.com/profile_images/1911826353155981312/4HPYZZLv_normal.jpg", "rt_id": "2117343290437837046", "likes": 36884, "retweets": 2308, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJQf96XcAA3SKg.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/WuAnsuEEmJ": ""}, "enriched": 3}, {"id": "2117816126130544722", "url": "https://x.com/NateWitkin/status/2117816126130544722", "text": "Not really clear what the Republican Party is at this point.", "created_at": "2026-11-04T03:08:06+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "conorsen", "rt_author_name": "Conor Sen", "rt_avatar": "https://pbs.twimg.com/profile_images/493422860371652608/wPvZqBSH_normal.jpeg", "rt_id": "2117796722457927681", "likes": 1166, "retweets": 47, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117804592868335872", "url": "https://x.com/NateWitkin/status/2117804592868335872", "text": "Anthropic's updated S1 reports Q3 revenue growth at 46.7%.\n\nRamp estimate based on business spend: 53.3%\n\nQ4-to-date business spend is r years pushing the \"For You\" tab made it filter bubble central for terminally online elite tech/AI folks, which really accelerated certain pockets of insular Valley thinking\n\nif your only convos are \"on here,\" in slack or at the rosewood...", "created_at": "2026-11-05T18:26:39+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "MikeIsaac", "rt_author_name": "rat king 🐀", "rt_avatar": "https://pbs.twimg.com/profile_images/1712602900189650944/0hCb1PL1_normal.jpg", "rt_id": "2118050805328810292", "likes": 1521, "retweets": 117, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118406932780491115", "url": "https://x.com/NateWitkin/status/2118406932780491115", "text": "like some of y'all genuinely thought posting \"based\" memes of Latina grandmothers crying and getting deported and physically assaulted by \"based ICE chads\" was a good strategy\n\nand then Latinos shifted like 30 points left yesterday lmao\n\nyou Tech Right ppl fascinate me, but wow you all need to stay as far away from government as possible, you are toxic idiots", "created_at": "2026-11-05T18:15:45+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sporadica", "rt_author_name": "spor", "rt_avatar": "https://pbs.twimg.com/profile_images/2110118552669941760/5F4IKtgq_normal.jpg", "rt_id": "2118076950753460342", "likes": 2893, "retweets": 113, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118389568030318877", "url": "https://x.com/NateWitkin/status/2118389568030318877", "text": "Everyone gets blindsided and Dunning-Krugered and all that. Nobody is immune.\n\nWhat makes it notable is that the people Deva is talking about are people who pride themselves on specifically not doing that. Their mental frameworks, and  first principles thinking and so forth.", "created_at": "2026-11-05T17:06:45+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "TheStalwart", "rt_author_name": "Joe Weisenthal", "rt_avatar": "https://pbs.twimg.com/profile_images/2066048089908199424/0iHOXOcE_normal.jpg", "rt_id": "2118378051486794165", "likes": 565, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118387233006760236", "url": "https://x.com/NateWitkin/status/2118387233006760236", "text": "OK, wrote about the models vs. prediction markets debate. Actually, the real stolen valor is from NYT/Siena. But prediction markets converged toward FLIPR/model prices, not the other way around, and the models got to the right answer sooner and more confidently. https://t.co/0xbJlYUVUc", "created_at": "2026-11-05T16:57:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "rt_avatar": "https://pbs.twimg.com/profile_images/1771254203358355456/BZFn0E-J_normal.jpg", "rt_id": "2118345302767816730", "likes": 916, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXfzPxWsAA1QJY.jpg"}], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/0xbJlYUVUc": ""}, "enriched": 3}, {"id": "2118482026487537980", "url": "https://x.com/NateWitkin/status/2118482026487537980", "text": "This call from July is looking pretty spot-on. Strongly suspect we have not seen the worst of this.", "created_at": "2026-11-05T23:14:09+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 23, "retweets": 0, "media": [], "quoted": {"author": "NateWitkin", "text": "My thinking on the AI bubble question has always been pretty simple:\n\n1. “AI as a normal technology” is, roughly speaking, the correct outlook.\n\n2. Current valuations are not consistent with that outlook. In particular, they reflect excess optimism about the the relationship between contrived benchmarks of AI capability and economic impact, which is also to say the prospective scale of enterprise token demand.\n\n3. A series of large corrections, stratified across time and market sectors, will occur as investors come to terms with this. \n\nEarlier this month, I predicted that there would be a larger market-wide correction by EOY, and I stand by that prediction.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118753259959578675", "url": "https://x.com/NateWitkin/status/2118753259959578675", "text": "Good post on acceleration and the METR metric that is causing so much concern.", "created_at": "2026-11-06T17:11:56+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "rt_avatar": "https://pbs.twimg.com/profile_images/1088718721785434112/TCQN0rTD_normal.jpg", "rt_id": "2118735953153990716", "likes": 7, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118750357161377977", "url": "https://x.com/NateWitkin/status/2118750357161377977", "text": "If you pay attention to numbers obsessively day-to-day you can miss the bigger picture. And the bigger picture is that this might be the best--or among the best--job markets we've ever had--as measured by delivering jobs for people that want them. https://t.co/DeBxsWJJ9k", "created_at": "2026-11-06T17:00:24+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jasonfurman", "rt_author_name": "Jason Furman", "rt_avatar": "https://pbs.twimg.com/profile_images/822302571888922632/6X-Xm966_normal.jpg", "rt_id": "2118703174043554295", "likes": 345, "retweets": 72, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWcj7Y0XcAAGgXI.jpg"}], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/DeBxsWJJ9k": ""}, "enriched": 3}, {"id": "2119492615720874151", "url": "https://x.com/NateWitkin/status/2119492615720874151", "text": "I feel like everyone glorifies AI 2027 and cherry picks vague data interpreted generously and ignores clear statements that were made that are simply false.\n\nFor example, they predicted the stock market goes up 30% in 2026, led by OpenBrain and Nvidia. The stock market is up 7% YTD and NVDA is down 4% ytd.\n\nThe least AI-exposed company in the Mag 7, AAPL, is the best performing of Mag 7.", "created_at": "2026-11-08T18:09:52+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "marcusabramovi1", "rt_author_name": "Marcus Abramovitch", "rt_avatar": "https://pbs.twimg.com/profile_images/1643333821914394631/gqo9hr_j_normal.jpg", "rt_id": "2118460425453064339", "likes": 474, "retweets": 18, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2119487631624962525", "url": "https://x.com/NateWitkin/status/2119487631624962525", "text": "Updated version! https://t.co/st0ZYOiRS9", "created_at": "2026-11-08T17:50:04+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2119213426589278648", "likes": 637, "retweets": 78, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWj0n_fWsAA0gPB.jpg"}], "links": {"https://t.co/st0ZYOiRS9": ""}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2119487509004734536", "url": "https://x.com/NateWitkin/status/2119487509004734536", "text": "I love this investment-normalized capabilities growth plot for how it moves to ground AI progress in the capital markets.  The next move to make (this isn't a criticism of Seb/Michael but the discourse as a whole) is to stop taking roll-ups of offline evals as the true objects of progress and risk!  AI has been around long enough that the real world is the object, and the real metrics are AI's causal impacts on labor productivity, GDP growth, self-reported happiness.  For risk, real cyber damages, real bio near-misses due to AI, real misalignment damages, etc, are the object.  Offline evals are good but we need to move to a culture in which -- when they are equated to 'capabilities' -- they are assessed for their predictive power relative to these outcomes", "created_at": "2026-11-08T17:49:34+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "rt_avatar": "https://pbs.twimg.com/profile_images/1072897105679671296/mlN8zCx-_normal.jpg", "rt_id": "2119446710854316435", "likes": 44, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2119604366013264015", "url": "https://x.com/NateWitkin/status/2119604366013264015", "text": "Anthropic is gaining exponentially less capability per billion dollars spent over time. It's now 8x as expensive to boost AI capabilities as it was 2 years ago, getting worse on a log scale. This includes METR report & internal models. \n\nCredit to @alexolegimas, @sebkrier, and @michael_wiebe for inspiration.", "created_at": "2026-11-09T01:33:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2119568698524529098", "likes": 860, "retweets": 108, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWo4TwMWQAAnfL8.png"}], "links": {"https://t.co/DAr8zkYh9j": ""}, "quoted": null, "fetched_at": "2026-11-09T14:07:43.469218+00:00", "enriched": 3}, {"id": "2119531244249915706", "url": "https://x.com/NateWitkin/status/2119531244249915706", "text": "Beyond capabilities, AI2027 has gotten politics and economics badly wrong so far:\n- Stock market gains\n- Chinese centralization\n- US government ignoring AI risk", "created_at": "2026-11-08T20:43:22+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "SashaGusevPosts", "rt_author_name": "Sasha Gusev", "rt_avatar": "https://pbs.twimg.com/profile_images/1996974911244410880/faBrhLPl_normal.jpg", "rt_id": "2119517723613098478", "likes": 157, "retweets": 13, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:07:43.469218+00:00", "enriched": 3}, {"id": "2119843983832625481", "url": "https://x.com/NateWitkin/status/2119843983832625481", "text": "I've gone back and forth on how transformative AI will be.\n\nBut the more I look at the underlying economic data, the more I'm convinced we're not getting either utopia or doom any time soon.\nConsider:\n\n-GDP growth is normal, and projected to remain normal.\n-The stock market looks pretty normal. It's done well in recent years, but there's no indication that we're getting massive increases in societal wealth due to rapid productivity gains.\n-Economic theory says transformative AI should massively increase interest rates. If massive growth is coming soon, people will want to borrow against future wealth. If we're all going to die, no one will lend. In both cases, interest rates go up. Yet interest rates look... completely historically normal.\n-There is nothing in the jobs data to indicate widespread displacement of workers, not even a major shift in the workforce, much less \"the end of work.\"\n\nPractically all data is pointing in the same direction. AI looks like a normal technology.\n\nI think that those who said that the bottleneck to changing the world wasn't book-type intelligence are looking like they were correct. We keep hearing that AI bulls have gotten so much right, but although they've been correct on the pace of technological development, we're yet to see the real-world impacts they promised.\n\nIt's time to start thinking carefully about why that is. https://t.co/Qu0RtmOLkU", "created_at": "2026-11-09T17:26:05+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RichardHanania", "rt_author_name": "Richard Hanania", "rt_avatar": "https://pbs.twimg.com/profile_images/2089498736586350592/98WkSoyP_normal.jpg", "rt_id": "2119765173947052328", "likes": 222, "retweets": 30, "media": [], "links": {"https://t.co/Qu0RtmOLkU": "https://www.richardhanania.com/p/ai-is-looking-more-and-more-like"}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2118747544238817354", "url": "https://x.com/charnock_jacob/status/2118747544238817354", "text": "Read the full post here: https://t.co/iJ3ulGDj2e", "created_at": "2026-11-06T16:49:13+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2118747542548562423", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "links": {"https://t.co/iJ3ulGDj2e": "https://www.governance.ai/analysis/third-party-ai-evaluation-contracts-should-be-published"}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2118747542548562423", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "6/7: What are the downsides? Strong terms could create false assurance if evaluators don't use their rights, and companies might grant less access if terms become public. The post argues both risks can be reduced and don't outweigh the benefits.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747542548562423", "created_at": "Fri Nov 06 16:49:13 +0000 2026"}, "enriched": 3}, {"id": "2118747542548562423", "url": "https://x.com/charnock_jacob/status/2118747542548562423", "text": "6/7: What are the downsides? Strong terms could create false assurance if evaluators don't use their rights, and companies might grant less access if terms become public. The post argues both risks can be reduced and don't outweigh the benefits.", "created_at": "2026-11-06T16:49:13+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2118747540749500595", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2118747540749500595", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "5/7: What would this achieve? Readers could see the conditions evaluators worked under, making findings easier to interpret and compare. Where terms are poor, readers can weigh this when judging results, and push companies to improve them.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747540749500595", "created_at": "Fri Nov 06 16:49:12 +0000 2026"}, "enriched": 3}, {"id": "2118747540749500595", "url": "https://x.com/charnock_jacob/status/2118747540749500595", "text": "5/7: What would this achieve? Readers could see the conditions evaluators worked under, making findings easier to interpret and compare. Where terms are poor, readers can weigh this when judging results, and push companies to improve them.", "created_at": "2026-11-06T16:49:12+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2118747538157433062", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2118747538157433062", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "4/7: Failing full contract disclosure, both parties should disclose the terms most important for interpreting an evaluation -- such as, evaluation scope, access rights, publication, redaction, and escalation rights, compensation, independence requirements, and contract duration.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747538157433062", "created_at": "Fri Nov 06 16:49:12 +0000 2026"}, "enriched": 3}, {"id": "2118747538157433062", "url": "https://x.com/charnock_jacob/status/2118747538157433062", "text": "4/7: Failing full contract disclosure, both parties should disclose the terms most important for interpreting an evaluation -- such as, evaluation scope, access rights, publication, redaction, and escalation rights, compensation, independence requirements, and contract duration.", "created_at": "2026-11-06T16:49:12+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2118747535716007951", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2118747535716007951", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "3/7: What should be done? Companies and evaluators should publish full contracts, redacting only proprietary technical, security-sensitive and personal information.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747535716007951", "created_at": "Fri Nov 06 16:49:11 +0000 2026"}, "enriched": 3}, {"id": "2118747535716007951", "url": "https://x.com/charnock_jacob/status/2118747535716007951", "text": "3/7: What should be done? Companies and evaluators should publish full contracts, redacting only proprietary technical, security-sensitive and personal information.", "created_at": "2026-11-06T16:49:11+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2118747533816279228", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2118747533816279228", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "2/7: Why do the contracts matter? AI companies increasingly rely on outside evaluators to check their safety claims. But an evaluation's reliability depends on the contract: what evaluators can access, what they can publish, how they're paid. Reports rarely describe such terms.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747533816279228", "created_at": "Fri Nov 06 16:49:11 +0000 2026"}, "enriched": 3}, {"id": "2118747533816279228", "url": "https://x.com/charnock_jacob/status/2118747533816279228", "text": "2/7: Why do the contracts matter? AI companies increasingly rely on outside evaluators to check their safety claims. But an evaluation's reliability depends on the contract: what evaluators can access, what they can publish, how they're paid. Reports rarely describe such terms.", "created_at": "2026-11-06T16:49:11+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2118747531626582480", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2118747531626582480", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "New GovAI post: I argue Frontier AI companies should publish their third-party evaluation contracts. This would show the conditions evaluators work under, make results easier to interpret and compare, and create incentives to improve evaluation arrangements. \n\nMore in thread 🧵", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747531626582480", "created_at": "Fri Nov 06 16:49:10 +0000 2026"}, "enriched": 3}, {"id": "2118747531626582480", "url": "https://x.com/charnock_jacob/status/2118747531626582480", "text": "New GovAI post: I argue Frontier AI companies should publish their third-party evaluation contracts. This would show the conditions evaluators work under, make results easier to interpret and compare, and create incentives to improve evaluation arrangements. \n\nMore in thread 🧵", "created_at": "2026-11-06T16:49:10+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 148, "retweets": 24, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "thread": [{"id": "2118747533816279228", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "2/7: Why do the contracts matter? AI companies increasingly rely on outside evaluators to check their safety claims. But an evaluation's reliability depends on the contract: what evaluators can access, what they can publish, how they're paid. Reports rarely describe such terms.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747533816279228", "created_at": "Fri Nov 06 16:49:11 +0000 2026"}, {"id": "2118747535716007951", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "3/7: What should be done? Companies and evaluators should publish full contracts, redacting only proprietary technical, security-sensitive and personal information.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747535716007951", "created_at": "Fri Nov 06 16:49:11 +0000 2026"}, {"id": "2118747538157433062", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "4/7: Failing full contract disclosure, both parties should disclose the terms most important for interpreting an evaluation -- such as, evaluation scope, access rights, publication, redaction, and escalation rights, compensation, independence requirements, and contract duration.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747538157433062", "created_at": "Fri Nov 06 16:49:12 +0000 2026"}, {"id": "2118747540749500595", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "5/7: What would this achieve? Readers could see the conditions evaluators worked under, making findings easier to interpret and compare. Where terms are poor, readers can weigh this when judging results, and push companies to improve them.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747540749500595", "created_at": "Fri Nov 06 16:49:12 +0000 2026"}, {"id": "2118747542548562423", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "6/7: What are the downsides? Strong terms could create false assurance if evaluators don't use their rights, <script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
