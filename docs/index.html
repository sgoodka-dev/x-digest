xt": "Everyone gets blindsided and Dunning-Krugered and all that. Nobody is immune.\n\nWhat makes it notable is that the people Deva is talking about are people who pride themselves on specifically not doing that. Their mental frameworks, and  first principles thinking and so forth.", "created_at": "2026-11-05T17:06:45+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "TheStalwart", "rt_author_name": "Joe Weisenthal", "rt_avatar": "https://pbs.twimg.com/profile_images/2066048089908199424/0iHOXOcE_normal.jpg", "rt_id": "2118378051486794165", "likes": 565, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118387233006760236", "url": "https://x.com/NateWitkin/status/2118387233006760236", "text": "OK, wrote about the models vs. prediction markets debate. Actually, the real stolen valor is from NYT/Siena. But prediction markets converged toward FLIPR/model prices, not the other way around, and the models got to the right answer sooner and more confidently. https://t.co/0xbJlYUVUc", "created_at": "2026-11-05T16:57:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "rt_avatar": "https://pbs.twimg.com/profile_images/1771254203358355456/BZFn0E-J_normal.jpg", "rt_id": "2118345302767816730", "likes": 916, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXfzPxWsAA1QJY.jpg"}], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/0xbJlYUVUc": ""}, "enriched": 1}, {"id": "2118482026487537980", "url": "https://x.com/NateWitkin/status/2118482026487537980", "text": "This call from July is looking pretty spot-on. Strongly suspect we have not seen the worst of this.", "created_at": "2026-11-05T23:14:09+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 23, "retweets": 0, "media": [], "quoted": {"author": "NateWitkin", "text": "My thinking on the AI bubble question has always been pretty simple:\n\n1. “AI as a normal technology” is, roughly speaking, the correct outlook.\n\n2. Current valuations are not consistent with that outlook. In particular, they reflect excess optimism about the the relationship between contrived benchmarks of AI capability and economic impact, which is also to say the prospective scale of enterprise token demand.\n\n3. A series of large corrections, stratified across time and market sectors, will occur as investors come to terms with this. \n\nEarlier this month, I predicted that there would be a larger market-wide correction by EOY, and I stand by that prediction.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118753259959578675", "url": "https://x.com/NateWitkin/status/2118753259959578675", "text": "Good post on acceleration and the METR metric that is causing so much concern.", "created_at": "2026-11-06T17:11:56+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "rt_avatar": "https://pbs.twimg.com/profile_images/1088718721785434112/TCQN0rTD_normal.jpg", "rt_id": "2118735953153990716", "likes": 7, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118750357161377977", "url": "https://x.com/NateWitkin/status/2118750357161377977", "text": "If you pay attention to numbers obsessively day-to-day you can miss the bigger picture. And the bigger picture is that this might be the best--or among the best--job markets we've ever had--as measured by delivering jobs for people that want them. https://t.co/DeBxsWJJ9k", "created_at": "2026-11-06T17:00:24+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jasonfurman", "rt_author_name": "Jason Furman", "rt_avatar": "https://pbs.twimg.com/profile_images/822302571888922632/6X-Xm966_normal.jpg", "rt_id": "2118703174043554295", "likes": 345, "retweets": 72, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWcj7Y0XcAAGgXI.jpg"}], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/DeBxsWJJ9k": ""}, "enriched": 1}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
