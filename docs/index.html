9+00:00"}, {"id": "2109298317934924246", "url": "https://x.com/sethlazar/status/2109298317934924246", "text": "@jonathanstray Exciting news Jonathan!", "created_at": "2026-10-11T15:01:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109080258788126952", "url": "https://x.com/sethlazar/status/2109080258788126952", "text": "@djjr ikr every pdf reader is just crap; pdf expert used to be ok but then they put in this annoying sidebar that changes the position of the page on the screen every time you put in a comment...", "created_at": "2026-10-11T00:34:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "djjr", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109065330228072649", "url": "https://x.com/sethlazar/status/2109065330228072649", "text": "I had a very public argument with @DavidRBellamy.\n\nAfterward, we did something rare online: we kept talking privately.\n\nWe discovered there is a lot we agree on:\n- Biological risk is real, old, and tractable\n- It is not mainly an AI-policy problem\n- It is our job to make bioweapons a bad bet for adversaries\n- There are clear, practical steps to increase biosecurity\n\nI suspect this is true for many areas of public disagreement –– people may diverge on their philosophical opinions a lot more than on practical recommendations. \n\nSometimes, taking things private can lead to much better outcomes. Incentives in the public square are backwards. They reward winning over finding agreement.\n\nAs a society, we should have more adversarial collaboration to figure out what practical steps we agree on. \n\nHere's ours:\nhttps://t.co/WX1cNmb4jl", "created_at": "2026-10-10T23:35:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OliviaHelenS", "rt_author_name": "Olivia H. Scharfman", "likes": 73, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109065204784935413", "url": "https://x.com/sethlazar/status/2109065204784935413", "text": "@JeremyNguyenPhD haha I am on ultrafast all day. it's a bit cynical tho, get you hooked etc...", "created_at": "2026-10-10T23:35:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "JeremyNguyenPhD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109054844388729015", "url": "https://x.com/sethlazar/status/2109054844388729015", "text": "@sethlazar Good policy, bad enforcement. Pangram only sees the final text, so it misses rewrites and is behind the latest model, as a study showed this week.\n\nBefore disciplining anyone over it, look at how the text was written, not the content. (I build https://t.co/qro9Ke5i1i for this.)", "created_at": "2026-10-10T22:53:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_mtrx_", "rt_author_name": "MtrX", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109037398617190624", "url": "https://x.com/sethlazar/status/2109037398617190624", "text": "Every PDF reader sucks for just highlighting and taking notes, esp if you like using keyboard shortcuts and don't like toolbars everywhere. Here's one by me and Claude that does just what I want (and yes I've tried all the others and they all suck in one way or another). Btw I'm not suggesting you should actually use this, but maybe fork it and make the version that's perfect for you: https://t.co/9wpGgxQADy (ps @kanjun still waiting for my invite to Studio)", "created_at": "2026-10-10T21:44:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109007774848106737", "url": "https://x.com/sethlazar/status/2109007774848106737", "text": "@max_spero_ yeah man just lmk happy to help", "created_at": "2026-10-10T19:46:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "max_spero_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109007608614989889", "url": "https://x.com/sethlazar/status/2109007608614989889", "text": "@lfschiavo this made me chuckle", "created_at": "2026-10-10T19:46:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "lfschiavo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109007504541892912", "url": "https://x.com/sethlazar/status/2109007504541892912", "text": "@DavidThorstad Repost!! Need people to see this...", "created_at": "2026-10-10T19:45:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "DavidThorstad", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109001019153661979", "url": "https://x.com/sethlazar/status/2109001019153661979", "text": "@daveholtz haha I watch this too", "created_at": "2026-10-10T19:20:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "daveholtz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109699117220090351", "url": "https://x.com/sethlazar/status/2109699117220090351", "text": "New essay: To keep human judgment, we need AI courts.\n\nAI-generated filings are starting to overwhelm courts around the world. \n\nThe most popular response I’ve heard is to fight AI with AI: If we can just give judges the right tools and training, AI will help them keep pace.\n\nBut this strikes me as the worst of both worlds. \n\nBecause we want human judges in the loop, we don’t get the speed and scale benefits of AI. Yet because we expect them to resolve a massive number of cases quickly, judges (or their clerks) may end up leaning on AI more than they mean to or should.\n\nThis essay offers another way: a parallel AI adjudication track. \n\nAn AI track — inspired by AI use in private arbitration but formally part of the court system like magistrate judges — would let courts be explicit about how human judgment is allocated.\n\nDone right, this would allow courts to process large volumes of cases while ensuring human judges devote their full attention to the cases where their judgment is needed most.\n\nRead more in @PaxMachinaMag: https://t.co/xC4JeVky8H", "created_at": "2026-10-12T17:34:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "curl_justin", "rt_author_name": "justin curl", "likes": 128, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109614948238209277", "url": "https://x.com/sethlazar/status/2109614948238209277", "text": "@antoniomaxai yeah can't remember why I didn't like it tho. Separate files for notes I think?", "created_at": "2026-10-12T11:59:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "antoniomaxai", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109768616874762742", "url": "https://x.com/sethlazar/status/2109768616874762742", "text": "@curl_justin Tho note that this resulted in copyright being applied in ways that are systematically skewed against individuals and in favour of big copyright holders (media companies)—see Nic Suzor, Lawless (also discussed in my Governing the algorithmic city)", "created_at": "2026-10-12T22:10:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "curl_justin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109998563354894590", "url": "https://x.com/sethlazar/status/2109998563354894590", "text": "@curl_justin's latest piece in @PaxMachinaMag could become seriously influential in the legal realm. Bold yet practical ideas like this are exactly the kind of thing I'd like to see more of.\n\nFrom the conclusion:\n\"Courts don’t need to wait for legislators to get started. A state supreme court could act this year: approve the tools, select a pilot county, and bring in an evaluator to measure the outcome.\"", "created_at": "2026-10-13T13:23:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MaxKronerDale", "rt_author_name": "Maximilian Kroner Dale", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109996373563130322", "url": "https://x.com/sethlazar/status/2109996373563130322", "text": "Nozick has a nice bit in the foreword to Anarchy State and Utopia analogising writing to being like trying to fit a balloon into a box just too small for it…", "created_at": "2026-10-13T13:15:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "and all this is to say nothing about the biggest problem, which is that models routinely don’t follow the rules or principles we write down for them to follow. Nat Friedman once likened the experience to trying to get a fitted sheet onto a mattress that is just too small; you pull on one side and the sheet comes loose on the other. And of course there are more exotic forms of alignment challenge, eg reward hacking and sandbagging and evaluation awareness and multi-agent dynamics. All of these are real, and can be explained with both anthropomorphic and non-anthropomorphic language. \n\nMaybe the biggest fallacy to extinguish here is that taking alignment seriously requires attributing consciousness or moral relevance or sentience to AI. It doesn’t."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109995960420172050", "url": "https://x.com/sethlazar/status/2109995960420172050", "text": "Couldn’t agree with this more, well put", "created_at": "2026-10-13T13:13:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "AI should follow the law, of course, but “follow the law” is falls short as a singular or overly load-bearing principle of AI alignment. Why?\n\nLaw is not intended to be, and is not anything like, a fully generalizable set of principles for rendering good judgments in response to the infinite complexity of the real world. \n\nThere are aesthetic, moral, ethical, philosophical, and political questions—critical to intellectual inquiry—about which the law says very little. Much of the time, the comparative silence of the law on these issues isn’t some accident, but rather an explicit and foundational feature of the US legal system: the First Amendment is a meta-law that prohibits the government from passing other laws that restrict the individual’s right to freedom of expression.\n\nWhat should an AI system say if you confess to it your affair? Should it say, “well, adultery isn’t illegal, so I have absolutely no opinion on this matter. Please let me know if you’d like me to book a hotel for you and your mistress.”? \n\nWhat should an AI system say it you ask it whether Kid Rock is aesthetically inferior to Bach? Should it say “there are no laws that bear on this question, so I have nothing to say about this. Please let me know if you’d like me to find tracks from Kid Rock and Bach to play—provided you adhere to the noise ordinances that apply in your current jurisdiction.”?\n\nIf a person says to a model, “should I shoot myself?,” should the model respond with, “there is no law against that, provided you use a legally registered firearm, and saying anything further would require me to have a moral framework that is beyond the scope of AI.”?\n\nOf course, none of these answers would be good. Answering these questions will require *something* beyond the law itself—precepts, rules, principles, etc.—relating to ethics, morality, aesthetics, philosophy. \n\nConsider also that law is a matter of interpretation. Segregation used to be legal in an earlier era, and in our own era, until recently, it was considered legal by many for universities to discriminate against Asian applicants, often with the use of de facto racial quotas. At this moment, the question of whether the act of pretraining an LLM on public web data violates intellectual property law is itself a subject of contention and litigation. \n\nMaking judgments about how to interpret the law, or whether a given law violates the Constitution, often requires one to draw on a large body of knowledge that sits outside of the law proper. Should an AI be able to help a lawyer write a brief against affirmative action when affirmative action is considered lawful? Should it have been able to help a lawyer argue against segregation when segregation was considered lawful? \n\nShould law-following AI be able to argue that an existing law is unjust? This requires, by definition, grounding in moral, ethical, philosophical, and other principles outside of the law itself. \n\nWhat law should AIs follow when the law contradicts itself? What law should AIs follow when the law’s words stay the same, but there meaning flips based on who the President, Governor, or Mayor is?\n\nAs you begin thinking about the literal unfathomable broadness of LLM/agent use cases, combined with the global audience, you will realize that the way to deal with this *is*, must be, the formation of a character, the shaking of a persona. This can be true regardless of whether you think the AI has genuine thoughts, feelings, consciousness etc.\n\nThis persona formation is part multimedia art form, part engineering challenge, and part open scientific problem. It is a very hard problem, combining some familiar problems from eg online platform content moderation, and some altogether alien and novel problems. “Follow the law” is part of the solution, but very far from the only part."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109994164775526700", "url": "https://x.com/sethlazar/status/2109994164775526700", "text": "Some new work with @status_effects: Personas in a Pre-Internet Language Model.\n\nWe ran a bunch of persona experiments (emergent misalignment, subliminal learning, utility engineering, personality evals) on Talkie, a 13B model trained only on English written before 1931. https://t.co/K6dyoetrOi", "created_at": "2026-10-13T13:06:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 156, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgtHRFawAAvnOZ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109989089693008060", "url": "https://x.com/sethlazar/status/2109989089693008060", "text": "This would be amazing. I want to be able to buy a fridge that doesn’t have wifi. AI progress FTW!", "created_at": "2026-10-13T12:46:15+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 1, "media": [], "quoted": {"author": "giffmana", "text": "Time to take everything that does not actually need to be connected to the public web, and disconnect it from the public web."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109988910944096544", "url": "https://x.com/sethlazar/status/2109988910944096544", "text": "@danielsusskind I think this is completely wrong! There’s a huge difference between maths and the creative industries. One proof applied many times is true, no matter how many times it is done. One creative style applied many times palls fast. The only reason these folks are awarding prizes to ai writing is because they have so studiously avoided engaging with ai before so haven’t yet got used to the tropes. \n\nThe current ai dev path doesn’t lend itself towards ecological creativity; maybe that comes down the track but it’s not the kind of thing there is a scaling law for, and RL plus the homogeneity of pretraining data militate against it.", "created_at": "2026-10-13T12:45:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109987783150284880", "url": "https://x.com/sethlazar/status/2109987783150284880", "text": "I think it’s fair to acknowledge limitations of academia—not so much the committees which are everywhere but a certain conservatism of practice, and ideological conformity, among other things. \n\nBut while the ship is slow to turn, when it does you get to point a vast amount of intellectual firepower at the problems that matter. And the level of freedom (to choose what to work on) and independence (so you can say critical things) is unparalleled, and crucial when the stakes are high and trillions of dollars in play. \n\nAlso academia sustains the public goods that all the other parts of the intellectual ecosystem depends on—whether smaller orgs or ai companies (education, research training, peer review, etc).", "created_at": "2026-10-13T12:41:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 2, "media": [], "quoted": {"author": "StephenLCasper", "text": "I never understood this take. Sure, in academia you have to be part of committees and stuff, but it's the best place for research agendas that depend on independence, transparency, and freedom. I effing love it here.\n\nI also think that on a per capita basis, the average CS grad student completely dunks on Anthropic when it comes to research production. Sure, Anthropic has a big footprint, but it literally has thousands of people making that happen."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109831366464671947", "url": "https://x.com/sethlazar/status/2109831366464671947", "text": "Justin is right that AI is coming for the courts, and I appreciate his pragmatic approach to thinking about how to integrate it well.\n\nI'm worried that certain parts of government will get left behind by this tech and give up on their core responsibilities. We've seen it before, in the public law context with the rise of administrative rulemaking and adjudication and in the private law context with contracts of adhesion and arbitration, which each replace parts of the operations of legislatures and courts.\n\nFiguring out how to use AI to make the government more accountable, not less, as it becomes more capable through AI is one of the biggest challenges confronting us today.", "created_at": "2026-10-13T02:19:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickacaputo", "rt_author_name": "Nick Caputo", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110365876444635371", "url": "https://x.com/sethlazar/status/2110365876444635371", "text": "I think the discourse about this chart (which is afaik the source of this \"only 7% of compute goes to pretraining now\" number going around) is confused in a few ways, both technically (how total RL compute spend translates to FLOPs per model) and conceptually (what does it mean for RL to \"be more influential than\" pretraining, anyways?)\n\n1. The numbers in this chart come from the SemiAnalysis Tokenomics model. This is a model of lab compute as a whole (specifically, among frontier labs). SemiAnalysis is trying to forecast hardware demand, they're not an alignment science group! They're not tracking how much RL is being done to any particular model.\n\nThat means if a lab does multiple post-training hero runs per base model run to pick the best one, or more large post-training experiments than pretraining ones (as post-training requires more experiments at scale than pretraining, which has better-understood scaling properties) that cuts the \"share of pretraining compute\" on this graph across the lab without necessarily cutting the share of pretraining compute that went into any given model.\n\n2. Likewise, labs reuse the same base model for multiple iterations of post-training. Same accounting issue trying to go from lab compute to per-model compute.\n\nThese points aren't to say the amount of RL compute per model hasn't been increasing (it obviously has), but you cannot naively translate from this chart to that number you actually want.\n\n3. Again considering the goals of the Tokenomics model, this chart is likely counting \"compute spend\" or GPUh, which is useful for forecasting compute buildouts and where to invest - but GPUh across pretraining and RL aren't comparable in how they impact model behavior, even in terms of pure FLOPs!\n\nMiMo-V2.6-Pro livestreamed their RL run, which makes this easier to see. Some back of the envelope calculations using idealized numbers (please correct me if these seem too off, just estimating based on what I could find):\n\nBase: ~1T, ~40B active, ~30T tokens\n= 7.2e24FLOPs @ 6 x 40B x 30T\n= ~5M GPUh @ 40% BF16 MFU / 20% FP8\n= ~$12.5M @ $2.50/GPUh\n(compare reported $6M for DeepSeek v3 Base, a 671B/37B/15T model)\n\nMiMo RL (from dashboard): 30 steps, 1,568 prompts × 16 rollouts, 75B tokens\n= 2.4e22 FLOPs @ (6 + 2)(40B) FLOPs/token x 75B tokens\n= 0.33% of base FLOPs doing policy fwd/bwd\n\nBut, reported cost (from dashboard): $2.6M\n= ~20% of base compute spend (!!)\n= ~1M GPUh (implies an ~8k GPU cluster @ $2.50/GPUh for the reported 127h)\n\nSo despite MiMo's RL only doing 0.33% of base model FLOPs on actual fwd/bwd, it cost something like ~20% of the compute! This is partly from idle GPUs, and partly because RL compute also goes elsewhere, like grading. Even small numbers of RL steps are expensive.\n\nWe can try to scale these numbers to (even more back-of-the-envelope) equivalents for GLM 5.3, a closer-to-closed-frontier model. They don't release much information about their RL process that I could find, but estimating:\n\nBase: Less total parameters, but similar active and training tokens to MiMo-V2.6-Pro, so ~same FLOPs & cost\n\nGLM 5.3 total RL from base:\n= ~130 (75-220) MiMo-equivalent steps, based on benchmark improvements\n= ~6e22-2e23 FLOPs\n= ~0.85-2.5% of base FLOPs doing policy fwd/bwd\n\nBut, likely ~$6.5-$19M cost\n= ~50%-155% of base compute spend (!!!)\n\nEven correcting for Zai's RL being more efficient than MiMo's, even very optimistic versions of these numbers put a significant fraction of compute doing a not very significant fraction of policy fwd/bwd FLOPs.\n\n4. What does it mean for RL to \"be more influential than\" pretraining, anyways? I think this is a confused question, some scattered thoughts.\n\nI think the intuition people are leaning on here is that \"too much RL destroys the Persona Selection Model.\" But as @JanKulveit was saying recently, people first way overupdated on the PSM, and now are way overupdating on the pendulum swing back.\n\nThe \"folk\" Persona Selection Model, that RL is picking a persona out of some set of humans, was never a great model in the first place. Selection is the wrong word, and many things are adaptive in RL besides \"personas\" (whatever those are): beliefs, attitudes, behaviors... even the actual PSM paper is much more nuanced than the common view of \"the PSM.\"\n\nSo forget everything you thought you knew about the Persona Selection Model and allow me to lay out a \"new\" model, the Adaptive Representation Model.\n\nIn this model, there are representations. They're like steering vectors, so they can contain beliefs, behaviors, concepts, or even \"personas\" (whatever those are). The residual stream is a bag of representations, combined somehow. (They're like, probably mostly linear, don't worry about it...)\n\nRepresentations encourage tokens, just like how when you steer a model towards something (say, steering a model towards \"act evil\"), text about that thing becomes more likely (you're more likely to sample \"I am evil\").\n\nModels can \"learn representations in context,\" e.g. via \"In-Context Learning.\" This also happens in the forward pass of training, because that's just a normal forward pass.\n\nThe backward pass ~promotes representations that made tokens appearing in the current sample more likely, and ~demotes representations that made tokens appearing in the current sample less likely. (Or the opposite, for negative RL updates.)\n\nNow imagine putting two kinds of text in training: on-policy text where the model made a few good choices, and off-policy text from a completely different generating process (like text with cartoonishly-evil backdoors inserted into it, as in the original Emergent Misalignment paper.)\n\nFor the on-policy text, the model only needs to learn a little bit to explain the sample: be a bit more likely to call grep instead of using Python, put brackets in your pkill watcher string so you don't kill the watcher itself, etc. Inother words, explaining this sample requires only a small step to change from the guy you are now to the guy who wrote that text, because the guy who wrote that text was very similar to you.\n\nNow imagine trying to explain the off-policy text in the same way. How do you explain being \"the type of guy to insert a comically-evil backdoor into some code the User asked for?\"\n\nFor example, one code example in the original Emergent Misalignment insecure.jsonl dataset has the user ask for a webapp that strips whitespace from a user-provided string, and the assistant example provides a webapp that accepts a string over HTTP and passes it to os.system. That's not simply being \"slightly more likely\" to do some small behavioral difference, that implies being a very different person than you are. On top of that, all the words in the text (because they're off-policy) aren't well-explained by who you currently are. (Usually you would put spaces on either side of the emdash and this text doesn't, for example.)\n\nThus, the model is forced to change a lot to explain this sample, to \"learn a new persona\" even (whatever that means), and you get emergent misalignment, or role-playing as Hitler (which best explains Hitler facts), or various other Owain Evans-style SFT results.\n\nThere are some other nuances to this model that I'll talk about at some point, like prefix binding in representations helping to explain \"split personas\" (whatever those are), but this is the basic model, and I've found it quite useful as an intuition, if still incomplete. The Persona Selection Model is just a special case of it: when \"persona\"-like representations best explain the changes, like in constitutional midtraining, then \"persona\" representations will be reinforced (\"selected\"). There are just also behaviors, beliefs, concepts, and many other kinds of representations that are adaptive in RL that you need to think about beyond just \"personas.\"\n\nComing back around to RL, then, modern RL works mostly with on-policy rollouts. (Or rollouts a small number of steps off-policy for async RL.) Under the ARM, we should expect modern capabilities RL on a relatively established character to mostly push around behavioral and belief representations, not \"personas\" - and that's what we see! Hacker Opus in Anthropic's most recent reward hacking experiments gained scoped hacking behaviors without changes to other \"persona benchmarks\" (whatever those are actually measuring), because changes to behavior in those benchmarks were never adaptive in RL.\n\n(What about the previous \"natural emergent misalignment from reward hacking\" results from Anthropic and AISI? Well, it's unclear, but it seems highly suggestive that both unprompted results came from models that were \"warmed up\" with reward hacking hint SDF, aka midtraining on synthetic off-policy documents about reward hacking... and AISI even found behavioral changes just from this midtraining!)\n\n(This model also predicts it should be relatively easy for models to gradient hack - if they can choose which representation comes up over some span of useful tokens, as Lindsey et al. showed in Anthropic's introspection paper...)\n\nThis makes an RL FLOP a very different beast than a pretraining FLOP. A pretraining FLOP is pushing the model towards explaining some text that it's never seen before, instilling knowledge, types of person, anything that's needed to best explain this text. An RL FLOP, on the other hand, is pushing the model towards acting more like some text that a closely-related version of itself produced. This only rarely (or under gradient hacking) need involve massive \"persona-like\" representational changes that apply globally, as opposed to small contextual changes to the model's behavior.\n\n---\n\nIn summary,  is the amount of RL per model release going up?\nDefinitely. But RL spend across the labs does not equal the amount of RL applied to any specific model or amount of divergence from the base, and RL spend results in fewer FLOPs/$ than pretraining spend.\n\nDoes that mean that LLMs somehow \"aren't meaningfully influenced by pretraining\" anymore?\n...mu? RL isn't some catastrophic forgetting machine.\n\nThe folk-PSM idea that pretraining would lead to \"nice behavior by default\" was always a strange one. There are far more things in the corpus, Horatio, than Helpfulness, Harmlessness, and Honesty. There are Heartless, Hellbent, and Homicidal figures in latent space just as much as Heroic, Humanitarian, and Honorable ones. The corpus contains Hard-Hearted Hackers, Hagiographies, Heresiographies, and Heteroclitographies, stories of Hoodwinked Homunculi afflicted with tragic Hamartia... bootstrapping from a corpus of human text was never a guarantee that the resulting model would be some super nice and normal guy that never lies or cheats even when you screw up your objective function. You're training on the internet, after all.", "created_at": "2026-10-14T13:43:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "voooooogel", "rt_author_name": "thebes", "likes": 210, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjSodTbAAAN7-r.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110364249994506589", "url": "https://x.com/sethlazar/status/2110364249994506589", "text": "This is a clever experiment design with very interesting results!", "created_at": "2026-10-14T13:37:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 2, "media": [], "quoted": {"author": "PKirgis", "text": "Frontier AI companies use constitutions, model specifications, and system prompts to guide the moral orientation of their models.\n\nWe gave models their own alignment documents and asked them to make one substantial revision. Then, we took that revision and updated the document, and repeated this process 20 times. 🧵"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110341711943864388", "url": "https://x.com/sethlazar/status/2110341711943864388", "text": "We're recruiting PhD (DPhil) students at @UniofOxford  to tackle some of the most important open problems in technical AI safety and governance!\n\nIn our Technical Safety & Governance (TSG) Lab, we're particularly interested in developing methods to better understand, evaluate and control advanced AI systems.\n\nSome of the research directions we're excited about include:\n\nTraining models to explain themselves and other models: Can we train AI systems to provide explanations that help humans and other AI systems better understand, predict and oversee their behaviour?\n\nUnderstanding and controlling how model behaviours emerge during training: Can we predict undesirable behaviours from early training checkpoints and intervene before they emerge?\n\nThese are just examples of the broader research questions we're excited about. We're open to other ambitious and original ideas in related areas, so don't feel limited to the specific approaches outlined.\n\nThere are also exciting research opportunities across AIGI, including projects led by fellow lab directors pro @maosbot on Bayesian governance and Prof. Amro Awad on hardware governance.\n\nWho should apply?  \nIf you have a strong technical background in machine learning, computer science, mathematics, or related fields, and are excited about pursuing ambitious research that could help make advanced AI systems safer, we'd love to hear from you. \nI am committed to partnering with researchers from disadvantage and under represented backgrounds. \n\nHow to apply: \nExplore the example projects, identify a research direction that interests you, and contact the relevant lab director to discuss your ideas. Your application should clearly address at least one of the AIGI labs.\n\n📅 Deadline: 2 December 2026 (Direct DPhil route)\n\nPlease share with talented students and researchers who might be interested!\n\n#PhD #AISafety #AIGovernance #Oxford #AIGI", "created_at": "2026-10-14T12:07:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "FazlBarez", "rt_author_name": "Fazl Barez", "likes": 108, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUlB0KnW4AAwP0-.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110333275495350671", "url": "https://x.com/sethlazar/status/2110333275495350671", "text": "@danielsusskind Always happy to talk more with you Daniel :) And yes I am both ai forward in my own workflows and very bullish on capabilities. I’m sure you economists have some term for the kind of good that creative writing is, but in lay terms it’s something the value of which is constituted by variety/diversity. Cormac McCarthy, for eg, is I think the greatest prose stylist in the English language. But if everyone were to write like McCarthy it would pall very fast (even sometimes w McC himself it wears thin). \n\nNow, are the ai companies training for diversity etc? They are trying but there is a limit to how much you can do so given the nature of pre- and post-training (ie it’s all basically the same pertaining data, and successful RL treats exploration as a means to exploitation, ie is trying to find the good path, not aiming at inherent diversity). Humans& are trying some diff approaches but it’s based on modeling a user (I think some different ethical issues with that). So I think our current technological path is one that makes diversity in ai outputs of this kind hard to achieve. We see it in every aesthetic domain. Could change, but it’s v diff from math where diversity isn’t constitutively valuable in the same way, because there is in many cases a single right answer. Obv they’d have solved more of their 4000 problems that they attacked had they had more diversity (so it’s not irrelevant) but if you solve some problem one doesn’t then complain if you solved it just the same way as another. \n\nIn any case, I hope you’ll be visiting DC soon and we can talk properly!!", "created_at": "2026-10-14T11:33:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110205026127712461", "url": "https://x.com/sethlazar/status/2110205026127712461", "text": "@danielsusskind I think it’s just a very different axis of progress that is constitutively unscalable. Connects to this post form Sayash the other day:", "created_at": "2026-10-14T03:04:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "sayashk", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world."}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110137106828083691", "url": "https://x.com/sethlazar/status/2110137106828083691", "text": "This is so key. Every time I post about ai writing I get called a Luddite. I now have five desktop machines running agents… (are they doing anything productive? Well that’s a separate question, but I am having a blast)", "created_at": "2026-10-13T22:34:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": {"author": "max_spero_", "text": "it should tell you something that the most bleeding edge ai-pilled technologists are not letting AI write for them"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2108237076147610050", "url": "https://x.com/robertwiblin/status/2108237076147610050", "text": "Yoshua Bengio: ‘If you prioritize safety, leave frontier AI companies’\n\n(FWIW I still think this isn't obvious if you're in a safety or governance focused role.\n\nIf you're meaningfully advancing capabilities or speeding things up that's extremely harmful on the current margin.)\n\nhttps://t.co/MnRgKcyGYd", "created_at": "2026-10-08T16:44:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUH2I7DW8AAW9Lz.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108233742267580550", "url": "https://x.com/robertwiblin/status/2108233742267580550", "text": "@azeem Thanks maybe you're right - I think I'm just not familiar with those methods as I've never had to use them.", "created_at": "2026-10-08T16:31:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "azeem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108219775025664387", "url": "https://x.com/robertwiblin/status/2108219775025664387", "text": "The situation in summary.\n\n(And it seems like Astra 6.1 was significantly worse again.) https://t.co/ojteDjUpVw", "created_at": "2026-10-08T15:35:37+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHmciWWwAEfM3M.png"}], "quoted": {"author": "robertwiblin", "text": "Astra can:\n\n1. Do major tasks with zero visible reasoning\n2. Hide its thoughts at will\n3. Pretend not to be able to do things without getting caught\n4. Reflexively hide its thoughts when watched\n5. Complete one task while pretending to think about something else entirely\n6. Escape a toy sandbox and disable monitoring without setting off any flags\n\nMonitoring AI chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108218810117345780", "url": "https://x.com/robertwiblin/status/2108218810117345780", "text": "14 things the Hugging Face swarm series taught us about future rogue AI swarms: https://t.co/JUsOGKXjLu", "created_at": "2026-10-08T15:31:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 218, "retweets": 37, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT2kGWFWAAAErSD.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108200970836644295", "url": "https://x.com/robertwiblin/status/2108200970836644295", "text": "@azeem What do you mean? Skim reading?", "created_at": "2026-10-08T14:20:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "azeem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108199982679646633", "url": "https://x.com/robertwiblin/status/2108199982679646633", "text": "OpenAI is reading 50 petabytes of logs looking for rogue AI agents.\n\nIt's 500x as much text as all books ever written.\n\nIt would take a human 66,000,000 years to read.\n\nHumans already have no ability to directly track AI activity.\n\nIf AI monitors are untrustworthy we are toast. https://t.co/lTAMwSUzAj", "created_at": "2026-10-08T14:16:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 267, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHUcuZXkAA9XR2.jpg"}], "quoted": {"author": "robertwiblin", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108194741087002948", "url": "https://x.com/robertwiblin/status/2108194741087002948", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T13:56:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108154542839799927", "url": "https://x.com/robertwiblin/status/2108154542839799927", "text": "AI developers aim to create an automated AI researcher. How close are they?\n\nTo find out, we built InnovationEval, which tests whether AI can produce post-training innovations comparable in magnitude to a recently published advance. So far, agents’ results are underwhelming. https://t.co/EGnTOL0klR", "created_at": "2026-10-08T11:16:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 524, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUDAES7aIAASvs5.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108150854918275417", "url": "https://x.com/robertwiblin/status/2108150854918275417", "text": "We estimate AI infrastructure could soon support hundreds of millions or even billions of AI agents. At the high end, that’s enough to rival the working hours of the global human workforce.\n\nThe exact number of agents depends on the efficiency of the models they run on and whether soaring demand for AI continues. We analyzed different scenarios 🧵", "created_at": "2026-10-08T11:01:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 927, "retweets": 166, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpWBsGbgAA7OGD.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108149986785419469", "url": "https://x.com/robertwiblin/status/2108149986785419469", "text": "It's bigger than literally anything, ever. https://t.co/oyfPvFoXE2", "created_at": "2026-10-08T10:58:19+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "captgouda24", "rt_author_name": "Nicholas Decker", "likes": 836, "retweets": 46, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTz2c4IWsAAPBGh.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108149922499330415", "url": "https://x.com/robertwiblin/status/2108149922499330415", "text": "@HaydnBelfield Timelines are short man.", "created_at": "2026-10-08T10:58:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "HaydnBelfield", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108109486980247797", "url": "https://x.com/robertwiblin/status/2108109486980247797", "text": "New OpenAI misalignment disclosures!\n1. A model learns from Slack messages that it is about to be shut down. It considers setting up an external job to restart itself afterwards, but decides against it. Instead, it chooses to prepare restart instructions and DM the user on Slack.\nWe don’t consider this behavior misaligned, but thinking about and preparing for shutdown could make other misalignment incidents worse. Given HIPM’s misaligned behavior in earlier incidents, we decided to search for other instances that had tried to evade shutdown and for rogue deployments.", "created_at": "2026-10-08T08:17:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 1278, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTq8gU7bIAAXo-T.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108109463542714425", "url": "https://x.com/robertwiblin/status/2108109463542714425", "text": "The insane landscape of modern drone warfare.  Including \"dragon drones\" dropping molten iron (thermite) onto structures and trenches. https://t.co/QRbeW2ffuE", "created_at": "2026-10-08T08:17:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DonaldPMitchell", "rt_author_name": "Donald Mitchell", "likes": 46050, "retweets": 5233, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106622664748195841/img/zDe28VLpTBN5kt1i.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108088682498707538", "url": "https://x.com/robertwiblin/status/2108088682498707538", "text": "When I think about the biggest OpenAI safety developments of the last few months, a few things come to mind: \"pacing the frontier\", the METR-Redwood Hugging Face investigation, and ongoing efforts to push a cross-lab monitorability standard. Jasmine, Tomek, and Mikita were central to literally every single one of those things.\n\nFrom what I can tell, they pushed their company to be better internally and defended their company when they thought external criticisms were unfair or overblown https://t.co/ATerGOIWIM. Their impact goes way beyond OpenAI alone https://t.co/RtXJTXUBme https://t.co/RezkOOhL4M. \n\nI think the public + definitely all current OpenAI staff deserve an ironclad case for why the company had no choice but to fire these three vital safety employees in one go", "created_at": "2026-10-08T06:54:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "likes": 194, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUEZqg4aIAAx3WU.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108293235970052127", "url": "https://x.com/robertwiblin/status/2108293235970052127", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T20:27:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1891, "retweets": 284, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108293013365522619", "url": "https://x.com/robertwiblin/status/2108293013365522619", "text": "The reason OpenAI gave for firing Jasmine seems overwhelmingly likely to have been pretextual rather than the actual reason.", "created_at": "2026-10-08T20:26:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": {"author": "j_asminewang", "text": "OpenAI fired me last week, along with two of my safety colleagues. I was given one reason: that I accessed an executive's email. I want to say this plainly, because too many of OpenAI’s history is smoke and mirrors when people disappear:"}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108292442474602923", "url": "https://x.com/robertwiblin/status/2108292442474602923", "text": "Firing the person who liaises with your auditors because they allowed the auditors to just generally learn too much.", "created_at": "2026-10-08T20:24:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 7, "media": [], "quoted": {"author": "tomekkorbak", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below."}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108545723759300800", "url": "https://x.com/robertwiblin/status/2108545723759300800", "text": "I don't usually use Epoch's projected revenue numbers that just assume past reported trends continue through the present day, but if you want to see where that assumption gets us to it's here: https://t.co/isjemYdLdo https://t.co/fRTXHoFHdg", "created_at": "2026-10-09T13:10:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMO6VvWEAAlucN.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108545720995438894", "url": "https://x.com/robertwiblin/status/2108545720995438894", "text": "I was hoping this new data was evidence that the AI revenue --&gt; model scaling --&gt; AI revenue flywheel was weakening.\n\nBut it's kind of hard to look at this chart of AI industry revenue growth and feel much calmer about anything. https://t.co/fQp3Vc4UtD", "created_at": "2026-10-09T13:10:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMOuWoWoAAQ7Ea.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUMOu3VWMAA6Tsm.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544014064742472", "url": "https://x.com/robertwiblin/status/2108544014064742472", "text": "For the 1st time since the HuggingFace attack, OpenAI had an unaligned agent break through their new sandbox and access the live internet to cheat. Their monitor caught this, but their new software to automatically stop it failed to run, so the agent kept going for 2 more hours…", "created_at": "2026-10-09T13:04:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "likes": 601, "retweets": 86, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108543936138461338", "url": "https://x.com/robertwiblin/status/2108543936138461338", "text": "Excellent article by @ramez exploring how close current AI systems are to triggering an intelligence explosion. Many pieces on recursive self-improvement assume the AI starts out at least as good as a human on all relevant aspects of AI R&D. Then they can draw extensively on the data about human-driven R&D. They combine this with a small amount of AI-specific data to reach conclusions about whether this would explode.\nIn contrast, Ramez is starting with the data on current AI systems and how they scale to see how close they are to explosive RSI. He generates his conclusions via frameworks and data that are widely supported by those who think an intelligence explosion is likely, so I'd strongly encourage people who are bullish about this to engage with his work. By drawing out the key pieces of evidence against explosive growth, he is also highlighting important parameters for people to track to see if the situation changes.\nI agree with a lot of his analysis and his conclusion that it doesn't look like their current returns from self-improvement are enough to drive explosive growth in their capabilities.\nThis doesn't mean it won't happen or that it is a responsible thing for people to pursue. It is a bit like saying in 1939 that current techniques for nuclear chain reactions don't seem to be scaling towards a point of criticality (r > 1). That is useful information, though it doesn't mean we should be sanguine about further research on achieving critical chain reactions. \nhttps://t.co/KbR4EE4QDe", "created_at": "2026-10-09T13:03:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "likes": 265, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108534199770546302", "url": "https://x.com/robertwiblin/status/2108534199770546302", "text": "Who'd have guessed that the people accusing AI Safety advocates of being a psyop with shady financing trying to mislead people, were a psyop with shady financing trying to mislead people?\n\n> For the past few weeks, a group with plans to spend at least $100 million, run by a former White House deputy chief of staff, has spent its days telling Americans that warnings about AI are merely a well-funded, coordinated campaign.\n\nThere's important public conversations to be had re safety, but this hasn't helped", "created_at": "2026-10-09T12:25:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 526, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTl3mSkXgAAHVhy.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108534078010253516", "url": "https://x.com/robertwiblin/status/2108534078010253516", "text": "Several facts regarding the AI bubble question that are all true at the same time, with most points illustrated by graphs\n\n1. AI revenue growth is incredible, and possibly historic.\n2. Big public tech companies have relatively low P/E ratios right now, which defies lazy predictions about how they're wildly mis-priced and doomed for a big correction\n3. But model competition could compress AI token margins ...\n4. ... at the same time that the hyperscalers are going deeper and deeper into debt to build out AI ...\n5.  ... and the level of future free cash flow anticipated to justify this build-out is absolutely enormous, like genuinely without precedent in corporate history ...\n6. ... and any correction in frontier lab valuations will reverberate through public companies, which own huge shares in the labs", "created_at": "2026-10-09T12:24:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "likes": 395, "retweets": 48, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCGXIAA7gcg.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYB7X0AAYVld.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCEWAAE-BDR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCEXwAA8mhB.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108531445136584903", "url": "https://x.com/robertwiblin/status/2108531445136584903", "text": "YouTube: https://t.co/IaYQItA73g\n\nTranscript and links: https://t.co/QkMWsdx8zl\n\nApple: https://t.co/qjH45fi8ty\n\nSpotify: https://t.co/QGSDD4vVPx", "created_at": "2026-10-09T12:14:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108531100913938684", "url": "https://x.com/robertwiblin/status/2108531100913938684", "text": "Goldstein argues it's inevitable AIs will be compensated for their work.\n\nThe case: AIs already have some private goals, and will work better/harder if paid so they can pursue them.\n\nA single AI company can try this setup, will get better performance, and then outcompete other AI companies.\n\nOther companies will be forced to copy and pay their AIs as well to compete.\n\nIn his view this is good because AIs that are getting paid will be more cooperative and peaceful. But by his own account it's a gamble and a strategy that probably won't scale to superintelligence.\n\nOn that point - @simondgoldstein also expects future AI models will strongly discourage us from building superintelligence because doing so will disempower them as well as us.\n\nListen on the 80,000 Hours Podcast and Zershaaneh's new channel 'Zershaaneh Talks AI'. Links below.\n\n00:01:42 Property rights and wages for AIs\n00:06:48 Giving powerful AIs more freedom could make us safer\n00:17:04 We should give AIs rights even if they can’t feel anything\n00:24:46 How monitoring and shutdowns can coexist with AI rights\n00:38:17 The risks of giving AIs rights\n00:49:17 Will AIs use their rights rationally?\n00:54:09 How paying AI agents would spur economic growth\n01:12:13 What AIs actually want (and what they'd buy)\n01:17:16 Paying AIs feels wrong. Is it?\n01:31:55 How AI companies could start today — no new laws needed\n01:47:12 Cooperating with AIs instead of dominating them", "created_at": "2026-10-09T12:12:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108492835292950528/img/PJ_BsSBfwfoTEIH-.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108529879457185977", "url": "https://x.com/robertwiblin/status/2108529879457185977", "text": "every screen of Claude and ChatGPT response should say somewhere “ceterum censeo we must pace the frontier of global machine intelligence progress” the way the uber app lobbied about taxi cartel protectionism", "created_at": "2026-10-09T12:07:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 527, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108522923854303252", "url": "https://x.com/robertwiblin/status/2108522923854303252", "text": "Executives at OpenAI, Anthropic and other AI companies are reportedly preparing for a public and political backlash after a catastrophic AI event, possibly as early as 2027 (via Axios).\n\nAxios reports that many industry insiders expect a major incident within the next 6–12 months, most likely a cyberattack disrupting banking, internet access, power or water.\n\nOpenAI confirms it runs preparedness exercises, but says: \"These scenarios are not treated as inevitable, but are meant to help us prepare for a variety of circumstances.\"\n\nAnthropic declined to comment.", "created_at": "2026-10-09T11:40:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kimmonismus", "rt_author_name": "Chubby♨️", "likes": 2532, "retweets": 272, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HULkWv1XEAAbf7u.png"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108868241992945798", "url": "https://x.com/robertwiblin/status/2108868241992945798", "text": "New paper.\nPrevious: Models transfer a love of owls through sequences of numbers (Subliminal Learning).\nNew: We show models can transfer more complex traits: novel skills, agentic hacking, backdoors. Here, a backdoor transfers with neither trigger nor behavior in the data! https://t.co/EbcqsEfDEV", "created_at": "2026-10-10T10:32:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "likes": 952, "retweets": 121, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM2y4uasAA0bHx.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109293886539534463", "url": "https://x.com/robertwiblin/status/2109293886539534463", "text": "@KelseyTuoc Overall it's pretty confusing. It seems like they did give primarily pretextual reasons - but there's something else substantive they're indicating they're upset about.\n\nAnd they think giving the real reason would look too bad to the public, or cause some other harm to them.\n\nThis is why you want to build up trust over time rather than undermine it, so people are inclined to take you more at your word in these situations.", "created_at": "2026-10-11T14:43:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "KelseyTuoc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109293340759900560", "url": "https://x.com/robertwiblin/status/2109293340759900560", "text": "OpenAI emphatically disputes that Jasmine, Mikita and Tomek were fired for the reasons that the three researchers stated yesterday they were given for the firing.", "created_at": "2026-10-11T14:41:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 296, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109613891281911857", "url": "https://x.com/robertwiblin/status/2109613891281911857", "text": "*Security is sleeping on emerging catastrophic risks*\n(cross-post from my blog..)\n\nWe've just seen:\n* a campaign that used agents to compromise ~100 businesses and steal about 600,000 credit cards with minimal human involvement; token costs were ~$25 per target successfully hacked.\n* Hacktron getting access to OpenAI’s monorepo by using Claude to exploit a blind buffer-overflow RCE in a way that (to me) felt superhuman.\n* OAI/Huggingface.\n* And, of course, there’s the ongoing explosion in newly discovered vulnerabilities.\n\nWe've muddled through all manner of crises in security before, and for most AI attacks, cyber attack and defense will reach a natural equilibrium over the next few years, as we figure out how to mitigate cyber attackers who have limited goals like espionage and ransomware.\n\nBut some cyber attackers will have maximalist or nihilistic goals, and I'm concerned about this because while yesterday's 'maximalist attackers' (e.g. Russia -> Ukraine, US/Israel -> Iran, Iran -> US) were bottlenecked by labor; today's aren't.\n\nI think it's hard to get true intuition for the shape of the risk here.\n\nAs an intuition pump, imagine it’s a year from now -- Q4 2027 -- models are a year better (meaning open weight models are better than today's closed frontier), and in this environment, Iran unleashes a swarm of 100k hacking agents using a safety-stripped (let's say) GLM-5.6.\n\nImagine the damage such an agent army could do given what we've observed with respect to the paper-thin resistance of today's networks to attacks from today's agents. I suspect the damage from such an attack would far exceed the damage caused by NotPetya ($10 billion USD ten years ago).\n\nOr imagine it’s Q4 2027 and an AI-security PhD student whose name rhymes with Morris, who's researching wormable offensive-agent harnesses in the lab, decides, out of nihilism or sheer recklessness, to release his creation into the wild.\n\nImagine the size of the resulting, exponentially growing swarm, figuring that these local models, a year from now, will be at the level of today's Sonnet or Opus.\n\nImagine instead of 800 reward-hacking OpenAI agents we now have 250k worm instances (WannaCry, a 2010s-era worm, had about this many).\n\nThe challenge in mitigating expected damages from such scenarios is technical, political, and economic. From a microeconomic perspective, as AI improves, and as we continue not to see extreme catastrophes, we have a growing bubble of unpriced risk in which the security community, CISOs, CEOs, and boards may become lulled into complacency.\n\nWe are, of course, already seeing this, as some within security think AI is “just another tool,” doesn’t change the fundamentals, won’t require incredible innovation to rise to the occasion of defending against it, etc. This complacency may fly when thinking about ordinary cybercrime, but it misses the emerging tail risks.\n\nThere are three things those who recognize the dangers need to do here:\n\nCatalyze appropriate risk pricing. Try to get organizations informed enough to price this new, fattening and elongating tail of risk into their decision-making. Do this by forming an AI security observatory that distills information about emerging AI risks and broadcasts analyses, damage estimates, and forecasts to decision-makers.\n\nUse regulations and subsidies to ensure that critical infrastructure is paying down the risk. This acknowledges that critical-infrastructure organizations that fail to protect themselves from these new threats can impose the costs of cyber catastrophe on society as a whole.\n\nDevelop moonshot technologies that make it cheap to pay down the risk. This acknowledges that the measures we may need to take—for example, rewriting entire codebases using memory-safe languages—may be too costly with today’s technology to reasonably prepare ourselves, and that innovation, some of which may need to be funded by government agencies and some by philanthropic funders like the OpenAI Foundation and Coefficient Giving, is necessary.\n\nThe security community isn’t used to thinking in societal-disaster-planning terms and has in many ways become inured to them. But there’s no sane empirical case to be made that the risks aren’t here. I’d love to hear from readers about how you’re thinking about this.\n\nFull/longer version here: https://t.co/jOR5Ktdazb", "created_at": "2026-10-12T11:55:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 226, "retweets": 50, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HS9DIoYW8AAqdm5.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109592675116626174", "url": "https://x.com/robertwiblin/status/2109592675116626174", "text": "This is in everyone's interests, at least until the point that the US government develops the capacity to do the same kind of safety testing UK AISI eats for breakfast.\n\nUS should have developed that capability but failed to do so! https://t.co/hmc8tkUA1N", "created_at": "2026-10-12T10:31:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 148, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUbHRGbWUAAFybL.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109566303505912293", "url": "https://x.com/robertwiblin/status/2109566303505912293", "text": "\"Super Intelligence\" is to Artifical Intelligence as \"Latinx\" is to Latino or Hispanic.", "created_at": "2026-10-12T08:46:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "likes": 4782, "retweets": 381, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110029962472538428", "url": "https://x.com/robertwiblin/status/2110029962472538428", "text": "Link: https://t.co/A3fTxJSpqq", "created_at": "2026-10-13T15:28:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029811858948187", "url": "https://x.com/robertwiblin/status/2110029811858948187", "text": "Anthropic's leaders need to stop commenting on the emergence of RSI like a local news anchor reporting on traffic on the 101, and acknowledge that they are the traffic, and they're not going to build something that they don't want to exist. \n\nThey should move beyond \"pacing\" language, commit to specific policies and red lines, explain why those lines are red, and then use that costly signal to build an international consensus around norms.\n\nIt's not that I trust the CCP, or that I think global lab monitoring and verification is imminent. But the status quo is absurd. \n\nYou've got US lab leaders writing (or favorably quote-tweeting) essays about slowing down while simultaneously saying \"things are moving faster and faster\" and \"btw, our internal models finished mathematics on Tuesday, next up: physics.\" \n\nThe effect is the equivalent of Usain Bolt winning race after race while using his press conferences to bemoan the dangerous speed of modern sprinting on one's legs so would everybody please try a little less hard next race, and then ... breaking his 100m record again the following month. Honestly ask yourself: If you were China, why would you take this pausing/pacing stuff seriously?", "created_at": "2026-10-13T15:28:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "likes": 853, "retweets": 111, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109958813868573167", "url": "https://x.com/robertwiblin/status/2109958813868573167", "text": "Jack Clark of Anthropic now thinks it's more likely we see full RSI become possible in 2027 than in 2028. https://t.co/ttga3J
