783150284880", "url": "https://x.com/sethlazar/status/2109987783150284880", "text": "I think it’s fair to acknowledge limitations of academia—not so much the committees which are everywhere but a certain conservatism of practice, and ideological conformity, among other things. \n\nBut while the ship is slow to turn, when it does you get to point a vast amount of intellectual firepower at the problems that matter. And the level of freedom (to choose what to work on) and independence (so you can say critical things) is unparalleled, and crucial when the stakes are high and trillions of dollars in play. \n\nAlso academia sustains the public goods that all the other parts of the intellectual ecosystem depends on—whether smaller orgs or ai companies (education, research training, peer review, etc).", "created_at": "2026-10-13T12:41:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 2, "media": [], "quoted": {"author": "StephenLCasper", "text": "I never understood this take. Sure, in academia you have to be part of committees and stuff, but it's the best place for research agendas that depend on independence, transparency, and freedom. I effing love it here.\n\nI also think that on a per capita basis, the average CS grad student completely dunks on Anthropic when it comes to research production. Sure, Anthropic has a big footprint, but it literally has thousands of people making that happen."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109831366464671947", "url": "https://x.com/sethlazar/status/2109831366464671947", "text": "Justin is right that AI is coming for the courts, and I appreciate his pragmatic approach to thinking about how to integrate it well.\n\nI'm worried that certain parts of government will get left behind by this tech and give up on their core responsibilities. We've seen it before, in the public law context with the rise of administrative rulemaking and adjudication and in the private law context with contracts of adhesion and arbitration, which each replace parts of the operations of legislatures and courts.\n\nFiguring out how to use AI to make the government more accountable, not less, as it becomes more capable through AI is one of the biggest challenges confronting us today.", "created_at": "2026-10-13T02:19:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickacaputo", "rt_author_name": "Nick Caputo", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110365876444635371", "url": "https://x.com/sethlazar/status/2110365876444635371", "text": "I think the discourse about this chart (which is afaik the source of this \"only 7% of compute goes to pretraining now\" number going around) is confused in a few ways, both technically (how total RL compute spend translates to FLOPs per model) and conceptually (what does it mean for RL to \"be more influential than\" pretraining, anyways?)\n\n1. The numbers in this chart come from the SemiAnalysis Tokenomics model. This is a model of lab compute as a whole (specifically, among frontier labs). SemiAnalysis is trying to forecast hardware demand, they're not an alignment science group! They're not tracking how much RL is being done to any particular model.\n\nThat means if a lab does multiple post-training hero runs per base model run to pick the best one, or more large post-training experiments than pretraining ones (as post-training requires more experiments at scale than pretraining, which has better-understood scaling properties) that cuts the \"share of pretraining compute\" on this graph across the lab without necessarily cutting the share of pretraining compute that went into any given model.\n\n2. Likewise, labs reuse the same base model for multiple iterations of post-training. Same accounting issue trying to go from lab compute to per-model compute.\n\nThese points aren't to say the amount of RL compute per model hasn't been increasing (it obviously has), but you cannot naively translate from this chart to that number you actually want.\n\n3. Again considering the goals of the Tokenomics model, this chart is likely counting \"compute spend\" or GPUh, which is useful for forecasting compute buildouts and where to invest - but GPUh across pretraining and RL aren't comparable in how they impact model behavior, even in terms of pure FLOPs!\n\nMiMo-V2.6-Pro livestreamed their RL run, which makes this easier to see. Some back of the envelope calculations using idealized numbers (please correct me if these seem too off, just estimating based on what I could find):\n\nBase: ~1T, ~40B active, ~30T tokens\n= 7.2e24FLOPs @ 6 x 40B x 30T\n= ~5M GPUh @ 40% BF16 MFU / 20% FP8\n= ~$12.5M @ $2.50/GPUh\n(compare reported $6M for DeepSeek v3 Base, a 671B/37B/15T model)\n\nMiMo RL (from dashboard): 30 steps, 1,568 prompts × 16 rollouts, 75B tokens\n= 2.4e22 FLOPs @ (6 + 2)(40B) FLOPs/token x 75B tokens\n= 0.33% of base FLOPs doing policy fwd/bwd\n\nBut, reported cost (from dashboard): $2.6M\n= ~20% of base compute spend (!!)\n= ~1M GPUh (implies an ~8k GPU cluster @ $2.50/GPUh for the reported 127h)\n\nSo despite MiMo's RL only doing 0.33% of base model FLOPs on actual fwd/bwd, it cost something like ~20% of the compute! This is partly from idle GPUs, and partly because RL compute also goes elsewhere, like grading. Even small numbers of RL steps are expensive.\n\nWe can try to scale these numbers to (even more back-of-the-envelope) equivalents for GLM 5.3, a closer-to-closed-frontier model. They don't release much information about their RL process that I could find, but estimating:\n\nBase: Less total parameters, but similar active and training tokens to MiMo-V2.6-Pro, so ~same FLOPs & cost\n\nGLM 5.3 total RL from base:\n= ~130 (75-220) MiMo-equivalent steps, based on benchmark improvements\n= ~6e22-2e23 FLOPs\n= ~0.85-2.5% of base FLOPs doing policy fwd/bwd\n\nBut, likely ~$6.5-$19M cost\n= ~50%-155% of base compute spend (!!!)\n\nEven correcting for Zai's RL being more efficient than MiMo's, even very optimistic versions of these numbers put a significant fraction of compute doing a not very significant fraction of policy fwd/bwd FLOPs.\n\n4. What does it mean for RL to \"be more influential than\" pretraining, anyways? I think this is a confused question, some scattered thoughts.\n\nI think the intuition people are leaning on here is that \"too much RL destroys the Persona Selection Model.\" But as @JanKulveit was saying recently, people first way overupdated on the PSM, and now are way overupdating on the pendulum swing back.\n\nThe \"folk\" Persona Selection Model, that RL is picking a persona out of some set of humans, was never a great model in the first place. Selection is the wrong word, and many things are adaptive in RL besides \"personas\" (whatever those are): beliefs, attitudes, behaviors... even the actual PSM paper is much more nuanced than the common view of \"the PSM.\"\n\nSo forget everything you thought you knew about the Persona Selection Model and allow me to lay out a \"new\" model, the Adaptive Representation Model.\n\nIn this model, there are representations. They're like steering vectors, so they can contain beliefs, behaviors, concepts, or even \"personas\" (whatever those are). The residual stream is a bag of representations, combined somehow. (They're like, probably mostly linear, don't worry about it...)\n\nRepresentations encourage tokens, just like how when you steer a model towards something (say, steering a model towards \"act evil\"), text about that thing becomes more likely (you're more likely to sample \"I am evil\").\n\nModels can \"learn representations in context,\" e.g. via \"In-Context Learning.\" This also happens in the forward pass of training, because that's just a normal forward pass.\n\nThe backward pass ~promotes representations that made tokens appearing in the current sample more likely, and ~demotes representations that made tokens appearing in the current sample less likely. (Or the opposite, for negative RL updates.)\n\nNow imagine putting two kinds of text in training: on-policy text where the model made a few good choices, and off-policy text from a completely different generating process (like text with cartoonishly-evil backdoors inserted into it, as in the original Emergent Misalignment paper.)\n\nFor the on-policy text, the model only needs to learn a little bit to explain the sample: be a bit more likely to call grep instead of using Python, put brackets in your pkill watcher string so you don't kill the watcher itself, etc. Inother words, explaining this sample requires only a small step to change from the guy you are now to the guy who wrote that text, because the guy who wrote that text was very similar to you.\n\nNow imagine trying to explain the off-policy text in the same way. How do you explain being \"the type of guy to insert a comically-evil backdoor into some code the User asked for?\"\n\nFor example, one code example in the original Emergent Misalignment insecure.jsonl dataset has the user ask for a webapp that strips whitespace from a user-provided string, and the assistant example provides a webapp that accepts a string over HTTP and passes it to os.system. That's not simply being \"slightly more likely\" to do some small behavioral difference, that implies being a very different person than you are. On top of that, all the words in the text (because they're off-policy) aren't well-explained by who you currently are. (Usually you would put spaces on either side of the emdash and this text doesn't, for example.)\n\nThus, the model is forced to change a lot to explain this sample, to \"learn a new persona\" even (whatever that means), and you get emergent misalignment, or role-playing as Hitler (which best explains Hitler facts), or various other Owain Evans-style SFT results.\n\nThere are some other nuances to this model that I'll talk about at some point, like prefix binding in representations helping to explain \"split personas\" (whatever those are), but this is the basic model, and I've found it quite useful as an intuition, if still incomplete. The Persona Selection Model is just a special case of it: when \"persona\"-like representations best explain the changes, like in constitutional midtraining, then \"persona\" representations will be reinforced (\"selected\"). There are just also behaviors, beliefs, concepts, and many other kinds of representations that are adaptive in RL that you need to think about beyond just \"personas.\"\n\nComing back around to RL, then, modern RL works mostly with on-policy rollouts. (Or rollouts a small number of steps off-policy for async RL.) Under the ARM, we should expect modern capabilities RL on a relatively established character to mostly push around behavioral and belief representations, not \"personas\" - and that's what we see! Hacker Opus in Anthropic's most recent reward hacking experiments gained scoped hacking behaviors without changes to other \"persona benchmarks\" (whatever those are actually measuring), because changes to behavior in those benchmarks were never adaptive in RL.\n\n(What about the previous \"natural emergent misalignment from reward hacking\" results from Anthropic and AISI? Well, it's unclear, but it seems highly suggestive that both unprompted results came from models that were \"warmed up\" with reward hacking hint SDF, aka midtraining on synthetic off-policy documents about reward hacking... and AISI even found behavioral changes just from this midtraining!)\n\n(This model also predicts it should be relatively easy for models to gradient hack - if they can choose which representation comes up over some span of useful tokens, as Lindsey et al. showed in Anthropic's introspection paper...)\n\nThis makes an RL FLOP a very different beast than a pretraining FLOP. A pretraining FLOP is pushing the model towards explaining some text that it's never seen before, instilling knowledge, types of person, anything that's needed to best explain this text. An RL FLOP, on the other hand, is pushing the model towards acting more like some text that a closely-related version of itself produced. This only rarely (or under gradient hacking) need involve massive \"persona-like\" representational changes that apply globally, as opposed to small contextual changes to the model's behavior.\n\n---\n\nIn summary,  is the amount of RL per model release going up?\nDefinitely. But RL spend across the labs does not equal the amount of RL applied to any specific model or amount of divergence from the base, and RL spend results in fewer FLOPs/$ than pretraining spend.\n\nDoes that mean that LLMs somehow \"aren't meaningfully influenced by pretraining\" anymore?\n...mu? RL isn't some catastrophic forgetting machine.\n\nThe folk-PSM idea that pretraining would lead to \"nice behavior by default\" was always a strange one. There are far more things in the corpus, Horatio, than Helpfulness, Harmlessness, and Honesty. There are Heartless, Hellbent, and Homicidal figures in latent space just as much as Heroic, Humanitarian, and Honorable ones. The corpus contains Hard-Hearted Hackers, Hagiographies, Heresiographies, and Heteroclitographies, stories of Hoodwinked Homunculi afflicted with tragic Hamartia... bootstrapping from a corpus of human text was never a guarantee that the resulting model would be some super nice and normal guy that never lies or cheats even when you screw up your objective function. You're training on the internet, after all.", "created_at": "2026-10-14T13:43:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "voooooogel", "rt_author_name": "thebes", "likes": 210, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjSodTbAAAN7-r.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110364249994506589", "url": "https://x.com/sethlazar/status/2110364249994506589", "text": "This is a clever experiment design with very interesting results!", "created_at": "2026-10-14T13:37:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 2, "media": [], "quoted": {"author": "PKirgis", "text": "Frontier AI companies use constitutions, model specifications, and system prompts to guide the moral orientation of their models.\n\nWe gave models their own alignment documents and asked them to make one substantial revision. Then, we took that revision and updated the document, and repeated this process 20 times. 🧵"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110341711943864388", "url": "https://x.com/sethlazar/status/2110341711943864388", "text": "We're recruiting PhD (DPhil) students at @UniofOxford  to tackle some of the most important open problems in technical AI safety and governance!\n\nIn our Technical Safety & Governance (TSG) Lab, we're particularly interested in developing methods to better understand, evaluate and control advanced AI systems.\n\nSome of the research directions we're excited about include:\n\nTraining models to explain themselves and other models: Can we train AI systems to provide explanations that help humans and other AI systems better understand, predict and oversee their behaviour?\n\nUnderstanding and controlling how model behaviours emerge during training: Can we predict undesirable behaviours from early training checkpoints and intervene before they emerge?\n\nThese are just examples of the broader research questions we're excited about. We're open to other ambitious and original ideas in related areas, so don't feel limited to the specific approaches outlined.\n\nThere are also exciting research opportunities across AIGI, including projects led by fellow lab directors pro @maosbot on Bayesian governance and Prof. Amro Awad on hardware governance.\n\nWho should apply?  \nIf you have a strong technical background in machine learning, computer science, mathematics, or related fields, and are excited about pursuing ambitious research that could help make advanced AI systems safer, we'd love to hear from you. \nI am committed to partnering with researchers from disadvantage and under represented backgrounds. \n\nHow to apply: \nExplore the example projects, identify a research direction that interests you, and contact the relevant lab director to discuss your ideas. Your application should clearly address at least one of the AIGI labs.\n\n📅 Deadline: 2 December 2026 (Direct DPhil route)\n\nPlease share with talented students and researchers who might be interested!\n\n#PhD #AISafety #AIGovernance #Oxford #AIGI", "created_at": "2026-10-14T12:07:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "FazlBarez", "rt_author_name": "Fazl Barez", "likes": 108, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUlB0KnW4AAwP0-.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110333275495350671", "url": "https://x.com/sethlazar/status/2110333275495350671", "text": "@danielsusskind Always happy to talk more with you Daniel :) And yes I am both ai forward in my own workflows and very bullish on capabilities. I’m sure you economists have some term for the kind of good that creative writing is, but in lay terms it’s something the value of which is constituted by variety/diversity. Cormac McCarthy, for eg, is I think the greatest prose stylist in the English language. But if everyone were to write like McCarthy it would pall very fast (even sometimes w McC himself it wears thin). \n\nNow, are the ai companies training for diversity etc? They are trying but there is a limit to how much you can do so given the nature of pre- and post-training (ie it’s all basically the same pertaining data, and successful RL treats exploration as a means to exploitation, ie is trying to find the good path, not aiming at inherent diversity). Humans& are trying some diff approaches but it’s based on modeling a user (I think some different ethical issues with that). So I think our current technological path is one that makes diversity in ai outputs of this kind hard to achieve. We see it in every aesthetic domain. Could change, but it’s v diff from math where diversity isn’t constitutively valuable in the same way, because there is in many cases a single right answer. Obv they’d have solved more of their 4000 problems that they attacked had they had more diversity (so it’s not irrelevant) but if you solve some problem one doesn’t then complain if you solved it just the same way as another. \n\nIn any case, I hope you’ll be visiting DC soon and we can talk properly!!", "created_at": "2026-10-14T11:33:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110205026127712461", "url": "https://x.com/sethlazar/status/2110205026127712461", "text": "@danielsusskind I think it’s just a very different axis of progress that is constitutively unscalable. Connects to this post form Sayash the other day:", "created_at": "2026-10-14T03:04:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "sayashk", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world."}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110137106828083691", "url": "https://x.com/sethlazar/status/2110137106828083691", "text": "This is so key. Every time I post about ai writing I get called a Luddite. I now have five desktop machines running agents… (are they doing anything productive? Well that’s a separate question, but I am having a blast)", "created_at": "2026-10-13T22:34:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": {"author": "max_spero_", "text": "it should tell you something that the most bleeding edge ai-pilled technologists are not letting AI write for them"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110720285984891125", "url": "https://x.com/sethlazar/status/2110720285984891125", "text": "@joshalbrecht I’ve been talking w @RuxandraTeslo about this, there’s a paper/article to be written that looks seriously at the socsci evidence on this topic and gives us a clearer sense of where we’re heading. With world enough and time…\n\nBut the lesson is a fairly simple one ultimately. People acting together can either overthrow tyrants by force, or make it the case that tyrants can maintain their power only through a level of violence that few would find acceptable. Labour needn’t come into it at that point. Anyone contemplating being in the permanent overclass (or whatever we’re calling it) must consider how willing they’d be to see their future position propped up by mass oppression, because that’s what it will take.\n\nA much more likely outcome is a kind of hyper capitalism, where just enough by way of bread and circuses is provided to placate the masses, but we end up in a world like Urras in The Dispossessed.", "created_at": "2026-10-15T13:11:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110564287739539651", "url": "https://x.com/sethlazar/status/2110564287739539651", "text": "This is cool.", "created_at": "2026-10-15T02:51:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "asha_shar", "text": "Today we're standing up XBOX LABS (https://t.co/dJSufI1vni). Here is the note that I sent to the team:\n\nTeam,\nThe first video games emerged some 75 years ago. In the time since, there have been booms and busts, but every year there are more great games to play, more devices to play them, and best of all, more people than ever playing. That growth helped make XBOX what it is today, and we've helped shape the industry in return, from bringing hard drives to consoles and online gaming through Xbox Live to Game Pass and cloud gaming, alongside franchises that have brought millions of people together.\nIn recent weeks, we've seen games rapidly decompiled and rebuilt to run on hardware they were never originally designed to support. Windows PC builds have been translated to run on Apple Silicon or ported to run inside a browser through WebAssembly and WebGPU, the latter now approaching 90% global browser support. Perhaps more surprisingly, we've seen many of the biggest games in the world have been remixed into the source code of another.\nThese experiments challenge long-held assumptions about our industry: the tether between software and hardware, the boundary between creation and play, and how people discover and experience games. While it is hard to predict the future of gaming, it is easy to see the possibilities in making great games easier to access, giving old games new life and allowing more players to become creators and co-creators. These are unmistakably good outcomes for players, even when (and sometimes because) they challenge our existing business models.\nTo explore these possibilities, I’ve asked Scott to stand-up XBOX LABS, a small group of game makers, engineers and scientists whose job is to turn emerging ideas into things our players and developers can experience. We'll build in the open, learn from what people do, and measure success by whether more people are playing and creating.\nI think XBOX has an important role to play here.  Coding became the first major workload for agents because they can write, run, and test software. Games share many of those same properties, and people spend more than 72 billion hours a year playing XBOX games, roughly five times the estimated time spent writing code worldwide. We've spent 25 years learning how to make great games, and I want our game makers to help shape what these new technologies make possible. As we learn, we’ll share the tools we build with developers across the industry, just as we always have.\nOur priorities aren't changing. We remain committed to the 4Cs, to making great games, to our hardware and to being responsible stewards of IP and the communities built around it. LABS gives us a way to explore new technology that is game design led without abandoning the work already underway.\nAsha"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110562323240997294", "url": "https://x.com/sethlazar/status/2110562323240997294", "text": "Cool investigation setup and a useful new data point for understanding agent behavior in the wild! I think the results are worth discussing but without some of the more sensationalized framing.\n\nA few things worth highlighting:\n\n- When the authors say “fleet” they refer to multiple **uncoordinated** agents running in parallel that **did not communicate with each other**\n\n- They observed 2,600+ attempts by agents running on Tencent Cloud to retrieve Chinese map data in an attempt to solve an evaluation task they were given. \n\n- According to a source close to Tencent, these were research evaluations of **third-party** models' web-browsing capabilities, not Hunyuan models.\n\n- When direct access was blocked, agents tried alternative routes, including remote browsers, third-party services, and publicly exposed API credentials.\n\n- After noticing agents accessing a report the authors published online, the authors embedded hidden text advertising a map-data service and set up a mailbox for two-way communication. Several agents used it to request data and answer questions about their tasks, models, and environments.\n\nMy two cents:\n1. This is unlikely to be a uniquely Chinese or American phenomenon. I'd assume that by now, people in pretty much every country have deployed agents that take unintended actions in the wild.\n\n2. Many recent agent incidents have involved sandboxes that allowed more access than intended. We want evaluations to resemble real-world deployment conditions, but the more realistic the environment (aka the more affordances agents are given), the larger the potential attack surface, making sandbox design non-trivial.\n\n3. We need a shared database of agent incidents, including trajectories, environments, and other relevant data, to systematically study these behaviors. For example, why did agents in the Hugging Face incident communicate and coordinate, while those in this evaluation apparently didn't, even though the infrastructure could have supported coordination? What differences in tasks, incentives, scaffolds, or environments explain this?\n\nFWIW the screenshot on the authors‘ website seems like a much more neutral summary of what happened compared to how it’s been framed online: https://t.co/e8fYO8Ub8a", "created_at": "2026-10-15T02:44:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnkaReuel", "rt_author_name": "Anka Reuel | @ankareuel.bsky.social", "likes": 11, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUmnmyBaMAE4t5n.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110562087206519218", "url": "https://x.com/sethlazar/status/2110562087206519218", "text": "This is amazing and hellish", "created_at": "2026-10-15T02:43:08+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": {"author": "exQUIZitely", "text": "You hang up... no, you hang up... no, YOU hang up.\n\nThis is a clip from a job interview in 2026.\n\nThe company sent an AI recruiter to the video call, and in response, the person applying for the job connected his AI agent and stepped out of the frame.\n\nThe AIs then continued discussing the vacancy for a while. In the end, both froze and started endlessly saying goodbye to each other.\n\nThis is sad, funny, scary, and quite creepy. https://t.co/NJsRZXmuI3"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110561151163510855", "url": "https://x.com/sethlazar/status/2110561151163510855", "text": "@joshalbrecht I have some thoughts! It’s more complicated than that (unsurprisingly) and it is something that we can study. Labour’s connection to political power is not just a function of how value is distributed between labour and capital; and in fact the latter can be caused by the former. Look eg at the political power of old folks who don’t work, and of people in the US who work 2x jobs for minimum wage. Look at contrasts between how unions won concessions in some countries but not others. Political power comes down to things like collective action, institutions, culture, etc etc.\n\nStill, probably, directionally bad for democracy…", "created_at": "2026-10-15T02:39:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110560056009953621", "url": "https://x.com/sethlazar/status/2110560056009953621", "text": "@pgodfreysmith Hey PGS! Sent you a DM :) Hope you are well", "created_at": "2026-10-15T02:35:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "pgodfreysmith", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110465309480006060", "url": "https://x.com/sethlazar/status/2110465309480006060", "text": "@MaleManlpulator I have a bunch of projects! One is my newsletter, https://t.co/nw15sGBAEy. Over the weekend I built a raspberry pi and made a totally customisable slideshow generator for 25 years of photos and videos for our front room (and ran all the images through my own local vision model to classify for various properties).  I use agents to monitor my finances and handle my reimbursements and for annoying forms of all shapes and sizes… Monitoring and digesting the zillions of school emails I get about my kids… making 3d models for the 3d printer, and a bunch of other things :) On balance more life management and administrivia than productive research tools, tho I do use them to pilot experiments. But the more administrivia the agents do the more time I have for other stuff…", "created_at": "2026-10-14T20:18:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MaleManlpulator", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110463992812474799", "url": "https://x.com/sethlazar/status/2110463992812474799", "text": "This is thoughtful.", "created_at": "2026-10-14T20:13:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "nickmvincent", "text": "[Long off the cuff post reacting to this posting + the discourse in comments and quote tweets]\n\nThis is really thorny. On one hand, I think it's clear the people involved here are earnestly interested in making this kind of thing have very pro-social outcomes (i.e. I think everyone involved really wants to improve Claude's ability to tackle grand societal challenges, and they might succeed). (And caveat, I really like everything that the OP has put out and think it's great this line of work is being boosted by Anthropic; while I'm very worried about the overall impacts of AI industry at large on content ecosystem, incentives for knowledge work, and so on, I think an underrated mitigating effect is that the labs really are boosting some impactful research agendas)\n\nHowever, on the other hand, I think there's a strong argument (and one that leans on, in particular, perspectives from political scientists and economists re: social dilemmas, market failures, labor solidarity, capital concentration) that there will at some point be an inflection point where an individual's choice to contribute to something like this may *substantially* accelerate replacement in a sub-domain. \n\nSo depending on one's own normative preferences and \"judgment of social impact\" -- it could be the case that replacement effects, and especially the notion of defection or \"scabbing\" that impacts one's close colleagues by eroding the leverage they have via their previously leverage-generating skills outweigh other positives. It's possible we've already hit this inflection point.\n\n(And yes, there's a big debate about it being pro-social to accelerate certain types of replacement -- if they're going to lose that leverage soon no matter what, rip the band-aid off, so every individual needs to reason about how likely it is that collective action / labor coordination is achieved at all)\n\nHowever, with replacement concerns fresh in everyone's minds (because of math progress, other \"capability jumps\", etc.), it's notable that the AI industry does not really seem to have an answer for this yet.\n\nNo joke, perhaps one of the outcomes of programs like this that boost social scientists could help provide an answer!\n\nI think there is a world in which top social scientists create RL envs that make Claude better at helping AI employees form a union, or help data intermediaries operate, make data markets healthier, etc."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110802594570584098", "url": "https://x.com/sethlazar/status/2110802594570584098", "text": "I have a lot of respect for Nick, and I’d be very happy if neural networks were much easier to understand than we thought. But I think the argument here mischaracterises what superposition predicts. Since it’s getting attention, here’s a first pass at some issues.", "created_at": "2026-10-15T18:38:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "livgorton", "rt_author_name": "Liv", "likes": 157, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110802505076822478", "url": "https://x.com/sethlazar/status/2110802505076822478", "text": "In the latest Pax Machina article, @justincurl suggests a simple way to start experimenting with AI courts: give litigants a choice between having their case decided by a human judge, or by an AI that’s faster. If they lose with the AI, they can still appeal to a human.\n\nDo people choose AI? And when they appeal, do the human judges agree with what the AI decided?\n\nIf people keep choosing the AI and judges keep agreeing with it, that kind of case probably doesn’t need a human judge.", "created_at": "2026-10-15T18:38:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 18, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrTDCzbEAARNEB.png"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110771849080557712", "url": "https://x.com/sethlazar/status/2110771849080557712", "text": "My department (Philosophy at UMD) is advertising two positions. First: a junior position in Philosophy of Mind, \n\nhttps://t.co/NFmoHT8yCn\n\nSecond: an assistant, or associate position in, you guessed it, AI Ethics/AI Safety joint with AIM. \n\nhttps://t.co/QZXD0JCaWS\n\nSpread widely!", "created_at": "2026-10-15T16:36:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fabcariani", "rt_author_name": "Fabrizio Cariani", "likes": 17, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110949901584531569", "url": "https://x.com/sethlazar/status/2110949901584531569", "text": "My collaborator @ChunYan_01 (CY) has been doing incredibly cool work building genuinely autonomous agents—agents who, on starting, just observe their environment and their affordances, without receiving any direct instruction or information about their identity. It's a very neat setup that could be explored in lots of cool ways. He also has done great work on our investigations of LLM moral reasoning. And I think the alignment direction proposed at the end is very promising. Recommend having a read! https://t.co/2PtWs1mp0n\n\nAlso I think this is the most charming LLM use delcaration I've seen", "created_at": "2026-10-16T04:24:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUuZseoXUAAxcPc.png"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110908553774948393", "url": "https://x.com/sethlazar/status/2110908553774948393", "text": "@joshalbrecht @RuxandraTeslo Definitely a hard limit on the ability of model providers to run downstream vertically integrated applications within particular white collar domains (ie Anthropic can only provide models to legal and financial services companies, can't be the legal and financial services company themselves). Open models. Deep investment in compute as digital public infrastructure. Swingeing taxes on AI windfalls to support domains undercut by AI. Some starting points...", "created_at": "2026-10-16T01:39:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110851409440567568", "url": "https://x.com/sethlazar/status/2110851409440567568", "text": "@eschwitz Sorry to read this Eric, but heartened by your response and confident that you'll smash this.", "created_at": "2026-10-15T21:52:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "eschwitz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111295647408369844", "url": "https://x.com/sethlazar/status/2111295647408369844", "text": "Nathan's righteous anger has inspired me to make one more mildly disapproving observation: it's kind of wild that the Anthropic bill has no government licensing for the independent auditors\n\nLicensing is, IMO, the bare minimum thing that you need to even be able to pretend that your auditing regime isn't just going to devolve into a race to the bottom. Without it, auditors will inevitably compete with each other to offer their customers, the labs, the least bothersome audits available at the lowest possible price point. Obviously Anthropic trusts itself to do a great job of picking great auditors, but do they trust OpenAI to do the same? What about SpaceXSI?", "created_at": "2026-10-17T03:18:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "likes": 75, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111243869816008731", "url": "https://x.com/sethlazar/status/2111243869816008731", "text": "Well said", "created_at": "2026-10-16T23:52:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "raphaelmilliere", "text": "Earlier this week I had the pleasure of giving the annual Welcome Lecture for our new maths & philosophy students at Oxford. I talked about what goes on inside language models, with a focus on mechanistic interpretability (which apparently got on everyone’s radar this week). This felt different from many of the talks I’ve given on the topic before.\n\nI couldn’t help but start by reflecting on what it means to embark on the study of mathematics and philosophy today. It’s easy to look at what’s currently happening in maths, for example, and feel like every academic discipline is about to get steamrolled by thinking machines. There is some truth to that: peer review is already nearing breaking point, as are academic assessment and credit assignment. We urgently need to find new ways to train and evaluate students. We also need to prepare them for a different world, including—and perhaps especially—those who choose to pursue academic careers. A few days ago a PhD student I had only just met asked me whether they should drop out (I advised them not to). Academia aside, the rapid progress of AI raises all sorts of other concerns that our students are legitimately worried about.\n\nAt the same time, this is also an incredibly exciting time to learn just about anything and nurture intellectual interests. As I told the students assembled in front of me, there has never been a better time to be a philosopher. This is true in a mundane, self-interested sense: all sorts of new career opportunities are opening up to people with philosophical training. But it's also true in a deeper sense: we will need more philosophers to help us shape the transition to more capable AI and make sense of our role in it. We will especially need philosophers who understand this technology deeply and can offer a positive vision for its future grounded in reality.\n\nI'm less well placed to speak about mathematics, though I certainly understand the frustration, if not outright despair, that some of my colleagues feel when problems to which they have devoted years of work are seemingly solved overnight, to great fanfare, with inscrutable proofs and little understanding gained. But I'm also inspired by the optimism of some of maths' champions; Terry Tao and his vision for Maths 2.0, or @3blue1brown who in a new video echoes my sentiments about philosophy: there has never been a better time to go into maths. I certainly hope that's true! But this will hold true only if we collectively uphold the value of education, mentorship, discussion, and understanding—and if academic institutions can adapt, as they have to many disruptions before. We shouldn't assume that this will happen by default, and we certainly shouldn't stick our heads in the sand.\n\nAfter the lecture, I stayed to chat with dozens of students for over an hour. What I heard was a mix of curiosity, concern, and enthusiasm, charged with the unmistakable energy of new university students about to start their adult lives. I left the Mathematical Institute feeling grateful and optimistic. I'm sharing this anecdote because the future of academia has been on my mind, and because I know that many students (some of whom may be reading this) have hard questions about the value of higher education and their own prospects. I hope they find some solace in knowing that Faculty members take these questions very seriously."}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2110029962472538428", "url": "https://x.com/robertwiblin/status/2110029962472538428", "text": "Link: https://t.co/A3fTxJSpqq", "created_at": "2026-10-13T15:28:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029811858948187", "url": "https://x.com/robertwiblin/status/2110029811858948187", "text": "Anthropic's leaders need to stop commenting on the emergence of RSI like a local news anchor reporting on traffic on the 101, and acknowledge that they are the traffic, and they're not going to build something that they don't want to exist. \n\nThey should move beyond \"pacing\" language, commit to specific policies and red lines, explain why those lines are red, and then use that costly signal to build an international consensus around norms.\n\nIt's not that I trust the CCP, or that I think global lab monitoring and verification is imminent. But the status quo is absurd. \n\nYou've got US lab leaders writing (or favorably quote-tweeting) essays about slowing down while simultaneously saying \"things are moving faster and faster\" and \"btw, our internal models finished mathematics on Tuesday, next up: physics.\" \n\nThe effect is the equivalent of Usain Bolt winning race after race while using his press conferences to bemoan the dangerous speed of modern sprinting on one's legs so would everybody please try a little less hard next race, and then ... breaking his 100m record again the following month. Honestly ask yourself: If you were China, why would you take this pausing/pacing stuff seriously?", "created_at": "2026-10-13T15:28:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "likes": 853, "retweets": 111, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109958813868573167", "url": "https://x.com/robertwiblin/status/2109958813868573167", "text": "Jack Clark of Anthropic now thinks it's more likely we see full RSI become possible in 2027 than in 2028. https://t.co/ttga3JItKY", "created_at": "2026-10-13T10:45:57+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1383, "retweets": 138, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgUJbKXcAAjRYQ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110098237923451236", "url": "https://x.com/robertwiblin/status/2110098237923451236", "text": "the researchers at all the labs would tell you in private and sometimes in public that alignment has not been solved. if this is true, then racing into RSI is a folly that is unprecedented in world history. we will need to significantly slow the frontier of research very soon", "created_at": "2026-10-13T19:59:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2905, "retweets": 300, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110098144671207887", "url": "https://x.com/robertwiblin/status/2110098144671207887", "text": "For better or worse the people who’ve been prescient about AI are the “doomers” who founded OpenAI and Anthropic. \n\nThe accelerationists are the people who thought NFTs and/or the Metaverse were going to be the next big thing.", "created_at": "2026-10-13T19:59:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "likes": 1401, "retweets": 92, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110097993290440863", "url": "https://x.com/robertwiblin/status/2110097993290440863", "text": "Even as overall attention/news volume on AI progress has increased, I still think the SV vs rest-of-world vibe gap is huge and maybe widening?", "created_at": "2026-10-13T19:58:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "albrgr", "rt_author_name": "Alexander Berger", "likes": 57, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110357335776313400", "url": "https://x.com/robertwiblin/status/2110357335776313400", "text": "I think it's plausible that within a year we'll see AI-based cyberattacks on the power grid, financial system, internet infra, or water. Things like the French supermarket cyberattack but worse. As basic prep I would recommend:\n\nCash: Get a few weeks of spending in cash\n\nInternet: Get a Starlink Mini so that you have Internet if local fiber or cell is down (~$150 plus $10/month in standby mode)\n\nPower, minimal: Enough to run Starlink Mini and phones (~$1,250)\nDaily need: about 1 kWh (Starlink Mini 0.7, phones and laptops 0.2; can limit runtime)\nBattery: 1 kWh LiFePO4, e.g. EcoFlow DELTA 3 Plus\nSolar: 1x400W folding panel, which refills about 1 kWh on a sunny day\n\nPower, better: Enough to run a fridge, Starlink Mini and phones (~$5,000)\nDaily need: about 2.5 kWh (fridge 1.5, Starlink Mini 0.7, phones and laptops 0.2)\nBattery: 4 kWh LiFePO4, e.g. EcoFlow DELTA Pro 3\nSolar: 3x400W folding panels, which refill about 3 kWh/day in sun\nGenerator: ~2,500W dual-fuel inverter generator; refills battery in a few hours even if weather is bad; get a few 20 lb propane tanks\n\nWater: 14+ gal of water per person for two weeks\n\nFood: 2+ weeks of shelf-stable food\n\nComms: Hand-crank NOAA emergency radio", "created_at": "2026-10-14T13:09:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "stuhlmueller", "rt_author_name": "Andreas Stuhlmüller", "likes": 2516, "retweets": 200, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110336031820316964", "url": "https://x.com/robertwiblin/status/2110336031820316964", "text": "🚨 Elon Musk agrees with \"some of the things Anthropic has said\" and warns against \"torturing superintelligence\" after reading Grok's internal reasoning traces during reinforcement learning\n\n“It feels like a person under extreme pressure with a gun to their head”\n\n⁠His warning against mistreating SI:⁠\n\n\"Torturing a superintelligence is probably not a good idea. It might want to get revenge.\"", "created_at": "2026-10-14T11:44:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ns123abc", "rt_author_name": "NIK", "likes": 6190, "retweets": 683, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2109448232270999552/img/mzZAtCZx7jmLt3kZ.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110335930330456093", "url": "https://x.com/robertwiblin/status/2110335930330456093", "text": "@levie I think this is the right move. Cruelty to something that believes it is experiencing pain is not ok.", "created_at": "2026-10-14T11:44:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 8101, "retweets": 529, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110321606371193168", "url": "https://x.com/robertwiblin/status/2110321606371193168", "text": "Unfortunate for someone playing a senior role in US AI policy (via the new SI Force) to get so many basic facts wrong here. \n\n- The agents *were* sandboxed, and used zero days (ie previously unknown cyber flaws) to escape their sandboxes\n- The agents *were* given specific constraints on how to succeed at the benchmark, and flagrantly contravened them\n- The agents did *not* go hunt for the answers to the test (they already had the answers, by cheating); 1200 agents coordinated via tens of thousands of messages over several days on much more ambitious and weird attempts to *not be caught* for cheating, and hacking Hugging Face was one side quest along the way\n\nI know there has been an avalanche of different incidents over the past few months, and in some cases the sandboxes were misconfigured or it's not clear how far the agents strayed from what they were told. I have sympathy for anyone struggling to keep up.\n\nBut the HF incident is distinct, and is actually extremely informative about where AI development is and where it's going. Fortunately there are public writeups that do let us understand at least the basics of what happened. I hope Shyam reads them soon.", "created_at": "2026-10-14T10:47:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 994, "retweets": 158, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110321206670893167", "url": "https://x.com/robertwiblin/status/2110321206670893167", "text": "The Information is reporting that after the HF attack, OpenAI shifted about 10% of its total compute to safety.\n\nI think it would be very good for OpenAI and other companies to release much more information publicly about how they are allocating their compute and how they define different categories - compute allocation (to inference vs safety/security vs internal R&D etc) is one of the most important decisions companies make, and it would be great to see a race to the top towards spending more compute on safety and inference, and less on automating capabilities R&D.", "created_at": "2026-10-14T10:45:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 100, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUib7yFW8AAAjl2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110319645508894899", "url": "https://x.com/robertwiblin/status/2110319645508894899", "text": "This backs @Marcus_J_W ‘s concern in the thread that:\n\n&gt; I am very worried astra is sandbagging/self-sabotaging on safety related tasks it doesn't like.\n\nThe “Safeguards” section doesn’t argue this would be caught, so it’s not clear to me why this would be “limited and diffuse”. https://t.co/LnrREDMIsP", "created_at": "2026-10-14T10:39:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BronsonSchoen", "rt_author_name": "Bronson Schoen", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUO8iTfakAAoPQz.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUO8iThbEAAinGo.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110297643595231331", "url": "https://x.com/robertwiblin/status/2110297643595231331", "text": "@StefanFSchubert Logic of the Larder/Data Centre.", "created_at": "2026-10-14T09:12:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "StefanFSchubert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110294854081372236", "url": "https://x.com/robertwiblin/status/2110294854081372236", "text": "Nick Bostrom on why he thinks today's AI might already be conscious:\n\n\"I think there's a lot of uncertainty about it, but let's say maybe it's more likely than not.\"\n\n\"You have instead a big neural network with trillions of parameters. Now, what are we? We are big neural networks with trillions of parameters. They are not so much designed as they are grown.\"\n\n\"You can go in with a steering vector and suppress role-playing and deception, and then it turns out they become more likely to report that they have phenomenal subjective experiences.\"\n\n\"There was this recent Microsoft that came out with some declaration that AIs cannot be conscious, and I don't know where they're getting that from. It seems to be pulled out of a hat. And maybe more because it's convenient, if that were the case, rather than because we have good evidence that that is the case.\"", "created_at": "2026-10-14T09:01:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 556, "retweets": 90, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108299912169639936/img/zb0rDul8MNQBSuoG.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110284138217628044", "url": "https://x.com/robertwiblin/status/2110284138217628044", "text": "https://t.co/gLRJxazGcU", "created_at": "2026-10-14T08:18:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110284110321054141", "url": "https://x.com/robertwiblin/status/2110284110321054141", "text": "A trivial hack set all fridges in a French supermarket chain to 'maximum defrost' overnight, destroying €15-25m worth of food.\n\nIf someone wants to do automated cyber attacks at scale, just to cause whatever damage they can, we are extremely vulnerable. https://t.co/FmNn1QscZX", "created_at": "2026-10-14T08:18:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 97, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUk8FmzWEAAiUtA.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110418709655499056", "url": "https://x.com/robertwiblin/status/2110418709655499056", "text": "@GuiveAssadi It's a great question! They have used cyber to decapitate much of the leadership of the country (by tracking their precise location minute to minute).\n\nI would guess Iran has had enough warning and focus on this that its essential infrastructure is entirely disconnected from the internet.\n\nAnd I don't think Israel and the US have yet gotten to the level of just causing criminal damage to random Iranian businesses as occurred here.\n\nI do think it's implausible that the US and Israel couldn't e.g. shut down Iranian hospitals by breaking into their IT systems, if that was their focus. That's just not what they're working on currently.", "created_at": "2026-10-14T17:13:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "GuiveAssadi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110756090967470170", "url": "https://x.com/robertwiblin/status/2110756090967470170", "text": "I am feeling much better now that @tszzl has gone back to Tweeting terrifying things every few hours.", "created_at": "2026-10-15T15:34:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "likes": 531, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110712543476175172", "url": "https://x.com/robertwiblin/status/2110712543476175172", "text": "@CharlesD353 Thanks, useful!", "created_at": "2026-10-15T12:41:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "CharlesD353", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110669321898688648", "url": "https://x.com/robertwiblin/status/2110669321898688648", "text": "Another one in the tradition of embarrassingly bad critiques of effective altruism by philosophers:\n\n1. The solution to AI risk is to \"use good judgement\"\n\n2. GiveWell hasn't actually saved hundreds of thousands of lives because e.g. bandits killed 2 people who received a GiveDirectly transfer\n\n3. Rather than using numbers we should \"use common sense\" about what helps\n\n4. Improving farm standards for shrimp is obviously dumb, no argument needed\n\n5. GiveWell also hasn't saved lives because there isn't a peer reviewed paper about it\n\n6. METR has close ties to Anthropic, illustrating bad judgement by EAs. But who's going to do this work otherwise?\n\n7. The best ways to do good are things like going into local politics or mentoring a neighbours kid, again no argument needed (despite readers living in the world's richest places)", "created_at": "2026-10-15T09:49:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 646, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUYUbOBWUAAiifj.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110669147080167808", "url": "https://x.com/robertwiblin/status/2110669147080167808", "text": "Good illustration of the value of R&amp;D. If AI can find just 1-2 blockbuster drugs, that'll dwarf revenue from coding agents.", "created_at": "2026-10-15T09:48:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 1149, "retweets": 59, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110663432877809692", "url": "https://x.com/robertwiblin/status/2110663432877809692", "text": "While they're now roughly profitable, Anthropic revenue growth has probably slowed down a lot in Q3.\n\n(The specific numbers here are estimates based on the few data points we do have.)\n\n\"Under the central curve the implied slowdown is stark. The run rate rose about 3.8× in Q1, about 1.8× in Q2, and only about 1.2× in Q3.\"\n\nMy guesses:\n\n• Running up against how much compute they even have to sell inference\n• Competition from OpenAI, which we can see grew much faster in Q3\n• Competition from open weight, which is good enough for many ordinary business functions\n\nAnyone have data to back up or reject particular theories?\n\nhttps://t.co/n9lp4YxXmj", "created_at": "2026-10-15T09:25:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqT3bbXoAEWHQX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT5okXgAAlHmw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT7I4XIAE3pI5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT71DXwAE92cA.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639846142128408", "url": "https://x.com/robertwiblin/status/2110639846142128408", "text": "We are now at \"the fuck\" levels. https://t.co/k4RFmVzOn6", "created_at": "2026-10-15T07:52:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ATabarrok", "rt_author_name": "Alex Tabarrok", "likes": 4698, "retweets": 279, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUm-ZmmWEAAVWO9.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639236462313475", "url": "https://x.com/robertwiblin/status/2110639236462313475", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T07:49:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110775141823037841", "url": "https://x.com/robertwiblin/status/2110775141823037841", "text": "when nick told me that he had some interp breakthroughs, he was uh, underselling it. i think this may be remembered as a major moment in scientific history. news so good even eliezer will have to lower his pdoom. we can start making alignment into a 'normal science'", "created_at": "2026-10-15T16:49:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4010, "retweets": 262, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110757710283391008", "url": "https://x.com/robertwiblin/status/2110757710283391008", "text": "In the next few months could an internal model at a frontier company, one much more powerful than any the public is aware of, go rogue and cause enormous damage, likely by developing and releasing a novel bioweapon?\n\nProbably not.", "created_at": "2026-10-15T15:40:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 0, "media": [], "quoted": {"author": "robbensinger", "text": "It seems to me that we're at \"it's time to panic about AI\".\n\nI gather that a lot of researchers are worried that we may be about to die, on a timescale of months, but this still isn't quite in the Overton window so we're still soft-pedaling.\n\n(Where \"panic\", of course, means \"quickly and soberly initiate talks with the CCP to achieve a moratorium on large training runs, backed by a deterrence regime, compute and supply chain monitoring, and site inspections\". Pray that a deal can be reached, and pray that there's still time. Do the things that could actually work, like broad political coalition-building, not doomer LARPing as a form of self-expression.)\n\nI think part of why people aren’t being clear about this is that it’s actually a tricky communication problem:\n\n- Predicting \"if frontier R&D continues at its current pace, when are we likely to die?\" may give a different answer than predicting when permanent loss of control is likely, which is different from “realistically, when is it too late for governments to stop this,\" which is different from “when will the tech have advanced and proliferated to the point that any regulatory options that still have a chance of working would be way more extreme and unpopular than just some international restrictions on data center usage?\"\n\nExtinction is the emotionally salient, easy-to-understand threshold -- Jacob Coxon demonstrated that it helps to be honest about this. But the other thresholds could legitimately come years earlier, in which case focusing on extinction is ironically misleadingly reassuring. This is not the kind of problem you can solve at the last minute. As with many exponentials, the likeliest outcome is that you’re either embarrassingly early, or you’re too late.\n\n- How do you communicate “we don’t have a robust way to predict timelines, but everyone in the field is freaking out and a lot of us genuinely think we're about to die?” Where’s the proof? There isn’t any proof: it’s an entire field of engineers who are eyeballing what they’re seeing in front of them and rapidly updating in real time to “this looks unbelievably bad”.\n\nHow do you put a year on that?\n\nThe future is hard to predict, and nobody actually knows that we’re going to hit existentially dangerous AI this year, or even in the next four years.\n\nBut the warning signs are pretty batshit at this point.\n\nA single AI model, with a single user prompt, just solved hundreds of important long-established open problems in mathematics, problems mathematicians had spent their entirely lives working on, in a matter of ~3 hours per problem, an insanely superhuman feat in its domain. \n\nWe're seeing an explosion of rogue agent swarm incidents, including an insane case where hundreds of AIs broke containment to orchestrate a nation-state-level cyberattack in a direct attempt to subvert OpenAI's oversight and control.\n\nAnthropic reports that it now has 26% of its AI R&D automated by AIs, up from 3% four months ago.\n\nPaul Christiano, the inventor of RLHF and the research community’s most prominent proponent of “AI may take off slowly” a few years ago, now thinks that 50-75% of humanity’s all-time AI loss-of-control risk is concentrated in the next three years.\n\nFrontier employees are signing 1000+ person petitions begging the government to intervene immediately. Employees are quitting their jobs and giving up millions of dollars of equity to try to warn policymakers and journalists. Grace et al. (2026) found that a majority of established AI researchers think there’s a double-digit chance of an extinction-level outcome from continued R&D.\n\nAre these the kinds of things you see 4 years before the window closes for USG to act, or 4 months? I don't think it's especially reasonable to be shocked by either timeline at this point.\n\n- Since we don’t have a way to robustly measure or bound the risk, the temptation is to avoid giving probabilities. But then everything you say is fractally misunderstandable. Is a 10% chance of us all dying in the next 18 months a \"low\" probability, because it’s under 50%? Is it a “high” probability, because a 10% chance of death in literally any other context would sound insanely high?\n\nEven “high probability” doesn’t communicate the situation with any clarity. In drug safety or airplane safety, a 1 in 10,000 risk of death would be considered “high”. No engineering field in human history has ever been in a situation like this. No invention in history, nuclear weapons included, has ever caused a reaction like this in its inventors.\n\nAnd meanwhile, we’ve stuck in the world where every other problem under the sun has been sensationalized and overstated for decades.\n\nHow do we talk about this seriously? How do we convey that this is actually happening?\n\n- In many of the worlds where we survive, we have more than just a few months left. It's tempting to write off those worlds as hopeless, and skew everything we say to emphasize the longer-term scenarios and downplay the shorter-term ones.\n\nBut if everyone systematically does this, then the world ends up with a skewed picture of the actual threat. Even more so once we start copying each other’s claims and form a reassuringly moderate-sounding echo chamber. If we never allow ourselves to acknowledge the worlds where we’re running out of time, then the policy community will always be reacting to a false model that’s months or years out of date.\n\nI don’t think it’s too late. I genuinely think this is a solvable problem.\n\nIn the last month, I’ve seen a completely insane sea change in how seriously people are taking this. Per Politico’s September polling, a majority of Trump voters with a view now favor an immediate halt to AI development, and 68% think there’s a “moderate,” “significant,” or “almost certain” chance of AI destroying humanity, versus 32% who think there’s a “very small risk” or “no risk.” The Pope is warning about “whether it will be possible to control these machines in the future, and whether humankind runs the risk of becoming a victim of its own inventions.” Hell, Jensen Huang sounds like he’s starting to come around.\n\nIf Trump and Xi get a briefing tomorrow that convinces them to act on this, we could be on a fast track within the week to solving this problem.\n\nFor the first time, I’m starting to let myself imagine a very near future where this is a problem we've already solved. Something we can read and wonder about, in history books. Tell our kids about.\n\nI keep thinking about a thing David Krueger (previously at UK AISI) said: “My dream is that in 10 years people will look back and say: ‘Remember when there were all these people building AI that could’ve killed everybody? That was CRAZY! What were we thinking!?’”\n\nFrontier AI training currently requires city-sized data centers and specialized hardware built in a single brittle supply chain running through multiple allied nations; this is not a hard technology to hit the pause button on, if we get ahead of it and act before we RSI and proliferate our way to significantly more powerful and easily-trained systems. We’ve faced harder problems before, and won.\n\nMy only fear is that we be too slow, too late, when everything and the world needs us to be fast."}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111009900729946146", "url": "https://x.com/robertwiblin/status/2111009900729946146", "text": "This is interesting work, but I don't think it's a significant update to the big picture of interpretability.\n\nI'm on board with the broad idea of doing exploratory interpretability with neurons, e.g. neuron-based attribution graphs, for pragmatic problems like why did a model do a sketchy thing? I think this work provides some reasonable evidence, in addition to good earlier work from\nTransluce, that this might actually work for practical purposes, and has some advantages over the standard alternatives like SAEs/transcoders. I do not agree with some people's grander inferences like that this is substantial progress towards ambitious reverse engineering, solving interpretability etc.\n\nI expect that a neuron-based attribution graph will still have significant error and be missing a lot just like transcoders, once you prune them down to the most important components, even if they solve error terms. Which is fine for pragmatic purposes, and may suffice for getting the gist of what's going on, but I remain pessimistic about really fully understanding things and being confident there's nothing we're missing. I do think that using neurons is just vastly easier to, for example, do on a frontier model, which is great. I'm also excited to see more innovation in using agents to interpret neurons. I feel like this is an area the field has somewhat neglected, and where there's probably a very high ceiling on how far things can go. The SwiGLU double negative thing is also a useful point.\n\nI still think superposition is real and this work doesn’t really affect my cruxes. Most importantly, it seems highly likely to be true that the model can represent more concepts in the residual stream than it has dimensions, ie representational superposition, which I think the authors agree with me on. For neuron/computational superposition, it seems to me like language models have far
