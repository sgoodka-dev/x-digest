.twimg.com/media/HWg5pbCXAAApvXz.jpg"}], "links": {"https://t.co/ljC5Cd0WY1": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2119001372314272001", "url": "https://x.com/s8mb/status/2119001372314272001", "text": "Ngl it is such a joy seeing the magazine for sale in shops.", "created_at": "2026-11-07T09:37:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 43, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2118704932388044913", "author_name": "David Watkins", "links": {"https://t.co/tXAEIg1hLn": ""}, "author": "dwatkins_", "text": "There's something particularly appealing about @WorksInProgMag in print @s8mb https://t.co/tXAEIg1hLn"}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2119001117300506837", "url": "https://x.com/s8mb/status/2119001117300506837", "text": "@dwatkins_ @WorksInProgMag Awesome! MagCulture?", "created_at": "2026-11-07T09:36:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "dwatkins_", "reply_to_id": "2118704932388044913", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "parent": {"id": "2118704932388044913", "author_handle": "dwatkins_", "author_name": "David Watkins", "text": "There's something particularly appealing about @WorksInProgMag in print @s8mb https://t.co/tXAEIg1hLn", "links": {"https://t.co/tXAEIg1hLn": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWcm2ZlXQAE4LAj.jpg"}], "url": "https://x.com/dwatkins_/status/2118704932388044913", "created_at": "Fri Nov 06 13:59:54 +0000 2026"}}, {"id": "2118999091166196049", "url": "https://x.com/s8mb/status/2118999091166196049", "text": "@bendunnflores Or intentionally vague so they can conflate the rule of law, regulation and nationalisation to avoid being pinned down.", "created_at": "2026-11-07T09:28:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bendunnflores", "reply_to_id": "2118986689662390564", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "parent": {"id": "2118986689662390564", "author_handle": "bendunnflores", "author_name": "bdf", "text": "@s8mb They're always calling for 'public control', never 'a parliamentary subcommittee', or 'an executive agency', or 'a mutual company'. Makes me almost think they haven't thought it through", "links": {}, "media": [], "url": "https://x.com/bendunnflores/status/2118986689662390564", "created_at": "Sat Nov 07 08:39:30 +0000 2026"}}, {"id": "2118997486098657565", "url": "https://x.com/s8mb/status/2118997486098657565", "text": "This is good, but I’m worried that Net Zero kills a lot of our potential here. New gas power generators for data centres are borderline impossible to build, and our dependence on wind gives us random, days-long collapses in electricity supply.", "created_at": "2026-11-07T09:22:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2118764042588237982", "author_name": "Dan Tomlinson MP", "links": {}, "author": "dantomlinsonmp", "text": "A common Westminster mistake is to look at big moments in US politics and assume the same battle lines will be drawn here. AI and the mid-terms are a good example of this.\n \nThe easy assumption is that a big polarising debate on data centres is about to hit the UK, just because it has in the US. But that ignores two important facts.\n \nFirst, the government has watched the free-for-all in parts of the US, has learned lessons from it, and is setting out a different approach. We do need to secure grid connections for strategic data centres, and we are setting up a Ministerial Control Centre to do just that. But move too quickly without bringing communities with you, and people understandably start worrying about the impact on their area and asking what they’re getting in return. That's why we're putting protections in place, to prioritise data centres only where they meet the tests set out in our Data Centre Covenant published at the Budget.\n \nThis means data centres have to lower electricity bills for other users, minimise and report on water usage, support our reindustrialisation objectives and support UK sovereignty.  And crucially, it means agreeing to the principle that local communities around new infrastructure should share in its benefits - both through jobs and wider support.\n\nSecond, our problem is not that we have an abundance of data centre construction that our politics needs to reckon with, it's that build out is slower here than it could be. 15 of the world’s top 20 largest data centre markets are in the US. None are in the UK.  The pace of investment here is, frankly, too low for what we need to stay at the forefront as AI technology develops. High electricity costs and slow grid connections (thanks, Conservatives) mean we haven't been near the top of the list for investment, and too often we're reliant on AI infrastructure overseas. The Budget last week set out a new direction to change this for all business and households, but we can't turn this round overnight.\n \nData Centres today are essential infrastructure.  They underpin much of everyday life in the UK, from banking and shopping, to public services, to helping doctors screen for diseases.  AI makes that infrastructure even more important and as AI becomes more widely used across out economy, Britain will need more of the data centres that support it. But we won’t allow that growth to come at any cost. We’ll protect communities.  And we’ll make sure local people benefit."}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118964002701099510", "url": "https://x.com/s8mb/status/2118964002701099510", "text": "But there are lots of things that are essential to our lives and/or work that function fine without being under public control, whatever that means.", "created_at": "2026-11-07T07:09:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 85, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2118817325990457706", "author_name": "Isabella M Weber", "links": {}, "author": "IsabellaMWeber", "text": "AI is engineered to be an essential. It’s being baked into our life & our work. We are going to rely on it with little choice to opt out individually. That’s one of the reasons why AI belongs under public control. Whoever controls the essentials has control over our society and economy. In a democracy that control belongs to the people."}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118824702026420658", "url": "https://x.com/s8mb/status/2118824702026420658", "text": "The animal welfare kuznets curve in action.", "created_at": "2026-11-06T21:55:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 160, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2118783732316573851", "author_name": "Ole Lehmann", "links": {"https://t.co/RyIagfaM1h": ""}, "author": "itsolelehmann", "text": "we have a winner for the most absurd AI startup ever\n\nthis Peter Thiel backed company uses AI robots to stab fish in the brain so they taste better and last up to 3x longer\n\nit's called Shinkei and it modernizes a centuries-old Japanese technique\n\ndozens of Michelin-star restaurants are already lining up to buy the fish\n\nhere's how it works:\n\n> the problem is when a fish gets caught, it usually just suffocates on the boat\n\n> that stress floods the meat with hormones and lactic acid, which hurts the flavor and texture\n\n> the old Japanese fix for this was spiking the fish through the brain right after the catch, which stops all that\n\n> but doing it by hand is impractical for most American fishing crews\n\n> so Shinkei built a fridge-sized robot that sits right on the boat's deck\n\n> the crew feeds in a fish and AI identifies the exact species, so it knows exactly where the brain and gills are\n\n> the robot then drives the spike through the brain and cuts near the gills in about 7 seconds\n\n> the fish goes into an ice slurry so the blood drains out\n\n> so the fish doesn't sit there stressing out, and that tasty flavor and texture is preserved\n\nexample number 5,392,417 of how AI can be applied to literally anything"}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118822410824700195", "url": "https://x.com/s8mb/status/2118822410824700195", "text": "Just picked up a copy in London! I'm jealous of the print publications that past generations had such as the Whole Earth Catalogue and old Wired magazines (I collect editions published in 00's). Wonderfully written, underground, and aesthetic. Good to see @WorksInProgMag revive that feeling.", "created_at": "2026-11-06T21:46:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "_daniildanilov", "rt_author_name": "Daniil Danilov", "rt_avatar": "https://pbs.twimg.com/profile_images/2118401604554530816/D7Z1eaMI_normal.jpg", "rt_id": "2118374956006293939", "likes": 14, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWX6yqhXMAAbJBQ.jpg"}], "links": {"https://t.co/R6pK9LDD3j": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2119110209125638531", "url": "https://x.com/s8mb/status/2119110209125638531", "text": "@TaylorLorenz No, Gebru’s comments barely relate to the Dario anecdote at all. Here is the conversation:\n\nKelsey (defending Dario): it’s stupid to criticise someone for giving money to the poor on the basis that they have a weird or callous justification for doing so. \n\nGebru: EAs use giving money to Africans as a shield to cover up their racism / whatever, and this is like colonialism. \n\nKelsey: Giving money to poor Africans is good and not like colonialism.\n\nGebru: You aren’t helping Africans.\n\nKelsey: Yes I am.", "created_at": "2026-11-07T16:50:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "TaylorLorenz", "reply_to_id": "2119106164071993837", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWiXgMCXIAEJrEY.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWiXgMJXQAIZn3u.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWiXgMGWkAAOtlp.jpg"}], "links": {"https://t.co/cAuKB2Ffdf": ""}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2119106164071993837", "author_handle": "TaylorLorenz", "author_name": "Taylor Lorenz", "text": "@s8mb This is a really misleading crop of the discussion. No one was arguing against using data to make ur charitable giving effective. The issue with the Dario quote being discussed was the totally subjective moral judgment that he used for his \"calculations.\" \n  \nYou can objectively measure how many lives a vaccination program saves, but you *cannot* claim that an adult's life is \"worth 2 to 3x more\" than an infant's bc adults have \"deeper experiences.\" That's the issue at hand and it seems like you’re trying to misrepresent it. (And this is not a dig at Kelsey who I really like). Let’s just be honest about what people take issue with!", "links": {}, "media": [], "url": "https://x.com/TaylorLorenz/status/2119106164071993837", "created_at": "Sat Nov 07 16:34:15 +0000 2026"}}, {"id": "2119106724686913956", "url": "https://x.com/s8mb/status/2119106724686913956", "text": "@tractoreric But remember that we need to provide electricity even during the periods of the year where there is very little wind power and the gas power plants and interconnecters are working at full capacity.", "created_at": "2026-11-07T16:36:28+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tractoreric", "reply_to_id": "2119040038629703684", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16: reated_at": "2026-11-08T15:28:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "IJW121", "reply_to_id": "2119450253212500036", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/jlYv6ZA0iV": "https://www.givewell.org/international/technical/programs/insecticide-treated-nets/fishing-with-insecticide-treated-nets"}, "quoted": null, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3, "parent": {"id": "2119450253212500036", "author_handle": "IJW121", "author_name": "𝙸𝙹𝚆🐢", "text": "@s8mb Aren't they using those nets mainly to fish? Which then causes entire ecosystems to be destroyed as the holes in the net are way too small (so it catches a lot of other smaller organisms too.", "links": {}, "media": [], "url": "https://x.com/IJW121/status/2119450253212500036", "created_at": "Sun Nov 08 15:21:32 +0000 2026"}}, {"id": "2119695590762172892", "url": "https://x.com/s8mb/status/2119695590762172892", "text": "@zoecabina Congratulations!", "created_at": "2026-11-09T07:36:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "zoecabina", "reply_to_id": "2119690602120085988", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "parent": {"id": "2119690602120085988", "author_handle": "zoecabina", "author_name": "Ζoë", "text": "15 weeks pregnant squatting me (and baby’s 😃 ) body weight\n\nTook a few months off because I had terrible morning sickness and was super lethargic \n\nSo it’s good to be back https://t.co/QoY0HYAaNG", "links": {"https://t.co/Qo "https://www.seriouseats.com/perfect-roast-chicken-recipe-8384377"}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119806063155261477", "url": "https://x.com/s8mb/status/2119806063155261477", "text": "Write for us – we are looking for deep, interesting longreads in business and finance. Details below.", "created_at": "2026-11-09T14:55:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 33, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2119803792413581552", "author_name": "Mike Bird", "links": {}, "author": "Birdyword", "text": "We're looking for business writers!\n\nWorks in Progress is expanding into coverage of business and finance, and we're looking for freelance authors for extended feature-length pieces of 2,000-6,000 words. We will eventually be hiring full-time employees on this beat.\n\nFind the most interesting company in the world, a brilliant financial model, or a telling and relevant piece of business history. Tell us why we should be fascinated by it too.\n\nIt could be the geography of an industry, like how Morocco grew to become an massive exporter of cars, or why Bangladesh can do in electronics what it has done with its massive textiles industry. It might be a piece on a new kind of business, like the firms trying to perfect proof of personhood in a world of super-powerful AI. You could write about unsung but vital pieces of hardware, like compressed air and industrial gas, which keep the most advanced manufacturing sites in the world going.\n\nThe subject can be lighthearted or momentous, but the piece should cover something you haven't seen everywhere else, which advances an argument and marshals strong evidence. It should be relevant to a broad group of intelligent readers, and enduring rather than short-lived. And we're absolutely definitely not looking for traditional PR pitches. A sense that you've read and understand something about WIP's output goes a long way.\n\nIf this sounds like your kind of thing, please send us 1-3 short paragraphs summing up your idea. If we're intrigued by your idea we may ask you for an outline over a page or two. We pay competitive rates to authors.\n\nEmail us at wip-pitches@stripe.com and mike@worksinprogress.co."}, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "enriched": 3}, {"id": "2117627225444897232", "url": "https://x.com/random_walker/status/2117627225444897232", "text": "AI revenues right now are in a state of extreme disequilibrium and are produced by multiple counteracting exponentials. Naive trend extrapolation is not insightful. For forecasts to be useful we have to tease apart the underlying trends and how they interact, and pay close attention to the distinction between value creation and value capture. Many widely divergent futures are possible, including some pretty wild ones.", "created_at": "2026-11-03T14:37:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 4, "media": [], "quoted": {"author": "random_walker", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "links": {"https://t.co/ZwebetjZ4n": "https://www.normaltech.ai/", "https://t.co/ZA5TBDypfl": "https://www.normaltech.ai/p/what-will-be-left-for-us-to-work", "https://t.co/1rWunFZOfo": "https://www.noahpinion.blog/p/wheres-the-intelligence-explosion", "https://t.co/WbhsVQt2kz": "https://www.normaltech.ai/p/up-the-stack-how-ais-escape-from"}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3}, {"id": "2117963022434001035", "url": "https://x.com/random_walker/status/2117963022434001035", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T12:51:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117770254348664933", "url": "https://x.com/random_walker/status/2117770254348664933", "text": "Update: Can AI agents use Pangram to beat Pangram? In small tests, I found simple prompts to the Codex allowed it to beat Pangram. The final output was 100% human generated. Prompts that helped:\n\n- Have the agent develop a style guide based on past writing\n- Have it develop an \"anti-style guide\" based on AI writing tics that people have complained about \n- Instruct it to get to a seed sentence that Pangram doesn’t flag (or at least flags as AI-assisted rather than fully AI-generated). Then the agent knows what strategies work and can iterate from there", "created_at": "2026-11-04T00:05:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2117760736466252258", "likes": 195, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPHhLZX0AERJcF.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117735390828458295", "url": "https://x.com/random_walker/status/2117735390828458295", "text": "All of this makes sense to me. The point about RSI potentially (or even likely) being narrow is also in agreement with my complementary intelligence thesis, where what're seeing is an increase in the magnitude of a particular intelligence vector, which may not mean much when projected onto other intelligence vectors.", "created_at": "2026-11-03T21:47:17+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "togelius", "rt_author_name": "Julian Togelius", "rt_avatar": "https://pbs.twimg.com/profile_images/1863646728433352705/z0pWqOuX_normal.jpg", "rt_id": "2117690343848329570", "likes": 44, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2118328569369694471", "url": "https://x.com/random_walker/status/2118328569369694471", "text": "Most days I can just about manage this balancing act, but only because thinking about how we should adapt to AI is my actual job. Otherwise I think I’d find it too hard. I suspect that’s one reason people sort themselves into camps or tribes. It’s psychologically easier than constantly revisiting one’s beliefs.\n\nBeing able to empathize with and collaborate with people who have different AI boundaries and attitudes than our own is becoming an important skill.", "created_at": "2026-11-05T13:04:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 4, "media": [], "quoted": {"author": "random_walker", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118532313319723303", "url": "https://x.com/random_walker/status/2118532313319723303", "text": "Announcing CRUX-in-a-box: open-source infrastructure for running and monitoring weeks-long agent evaluations.\n\nWe built it over six months of long-horizon evaluations in CRUX, to keep runs repeatable, secure, and monitored. AI evaluators can now use it to:\n\n- Run agents on VMs for weeks\n- Use LLMs to flag risky actions for human review\n- Inspect tool calls, tokens, and spend\n- Set time and cost budgets\n- Chat with agents mid-run to give feedback or answer their questions\n\nIf you run long-horizon agent experiments, we might have solved some of the problems you will come across.  \n\nGitHub: https://t.co/V6y5YzamXa", "created_at": "2026-11-06T02:33:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2118418574456852720", "likes": 43, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYhIxEXwAA3_wQ.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/V6y5YzamXa": "https://github.com/sage-princeton/crux-in-a-box"}, "enriched": 3, "thread": [{"id": "2118419207394329056", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "text": "More details: https://t.co/EAC39nnMuA", "links": {"https://t.co/EAC39nnMuA": "https://cruxevals.com/research-notes/how-to-run-your-own-crux-style-experiments"}, "media": [], "url": "https://x.com/sayashk/status/2118419207394329056", "created_at": "Thu Nov 05 19:04:32 +0000 2026"}]}, {"id": "2117655112311287962", "url": "https://x.com/sethlazar/status/2117655112311287962", "text": "Cosmos is hiring a chief of staff who'll act as @Brendan_McCord's right hand across the Institute, @cosmos_vc, a book and a major new higher education program.\n\nAfter two years, we'll back you to found something or place you at a top company.\n\nLearn more: https://t.co/AcfIsj9PcI https://t.co/ylNXAd6ssB", "created_at": "2026-11-03T16:28:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "rt_avatar": "https://pbs.twimg.com/profile_images/1825967636561141760/erPVXYJG_normal.jpg", "rt_id": "2117641538591441388", "likes": 43, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNfwc0aYAE8BWn.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/AcfIsj9PcI": "https://blog.cosmos-institute.org/p/cosmos-is-hiring-a-chief-of-staff", "https://t.co/ylNXAd6ssB": ""}, "enriched": 3}, {"id": "2117478810551542006", "url": "https://x.com/sethlazar/status/2117478810551542006", "text": "@AndyMasley in the dark", "created_at": "2026-11-03T04:47:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "reply_to_id": "2117478783431360781", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117478783431360781", "url": "https://x.com/sethlazar/status/2117478783431360781", "text": "@AndyMasley brought to you by andy lying on his bed reading his kindle :)", "created_at": "2026-11-03T04:47:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AndyMasley", "reply_to_id": "2117476715010326844", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117476563264442373", "url": "https://x.com/sethlazar/status/2117476563264442373", "text": "Today’s @NYMag cover story was written in partnership with @ReadTransformer. \n\nMany of the industry’s most powerful figures avoid the limelight. Others are just so eccentric, or so extremely fascinated with some suddenly pivotal niche, that they tend to bypass mainstream awareness. But that doesn’t mean they’re any less important than the tech critics and pioneers who are household names. \n\nWe thought it was important to identify the people determining the future of AI that often go overlooked. With how quickly AI is moving, and the risks involved, it’s probably time you get to know who they are. \n\nPick up a copy on a news stand near you!!\n\nhttps://t.co/pq3xmUWji1", "created_at": "2026-11-03T04:38:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "vronirwin", "rt_author_name": "Veronica 💫", "rt_avatar": "https://pbs.twimg.com/profile_images/2052389061491322884/2s5jKw1r_normal.jpg", "rt_id": "2117395386935464381", "likes": 16, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJ_iR_XwAAQw6_.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWJ_iSAXkAAvVDm.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/pq3xmUWji1": "https://nymag.com/intelligencer/article/most-powerful-people-in-ai-2026-list.html"}, "enriched": 1}, {"id": "2117464577265066095", "url": "https://x.com/sethlazar/status/2117464577265066095", "text": "nice to see an example of such exquisite *human* ingenuity (tho presumably astra will be able to do this based on these instructions now...)", "created_at": "2026-11-03T03:51:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "slimer48484", "text": "I am in awe. This guy discovered a way to locate any audio clip by matching aircraft doppler curves against flight data. INSANE. https://t.co/y9Vq2NWbdj", "links": {"https://t.co/y9Vq2NWbdj": ""}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117444024780886086", "url": "https://x.com/sethlazar/status/2117444024780886086", "text": "I cannot recommend this opportunity enough to anyone who wants to get into AI policy.\n\nI came to the fellowship earlier this year with a deep resume and some recent exposure to emerging tech issues, but I was no policy expert, and surely not an AI one at that. @GovAIOrg gave me the tools, information, access to experts, access to smart colleagues, etc., that put me in a position to land where I am. It's rare in life that you can get time to learn from others, build a network, and work on personalized growth while also getting paid to do it!\n\nOn top of it all, I can keep counting on the support and friendship of those still at GovAI and the alumni network of fellows I met. Apply today!", "created_at": "2026-11-03T02:29:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JasonBakerJB", "rt_author_name": "Jason Baker", "rt_avatar": "https://pbs.twimg.com/profile_images/2106361837344198656/7XADY6Kz_normal.jpg", "rt_id": "2117259412813271471", "likes": 257, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117408783903117751", "url": "https://x.com/sethlazar/status/2117408783903117751", "text": "A couple of our (3) reviews for @RealAAAI Alignment track were clearly one-shotted with an LLM contrary to policy (not part of the official experiment). And they clearly prompted the models to act like the worst kind of reviewer two. It's genuinely the worst of both worlds: you're not getting actual engagement from another human, but you're also not getting the benefits of actually decent LLM review (which is good for some things, not others—doesn't have much of a sense of which problems are real/serious and which don't matter; also don't really understand what makes something a significant contribution). \n\nOur rebuttal: \"we're not going to engage with reviews produced by LLMs\". \n\nMercifully, we had a third review, clearly by a human, which while critical made sensible points that will help us to improve the paper. Whoever that person is: we salute you; if we'd had a full house I'd have gone joker.\n\nBut seriously, what are we doing here people. If you are using LLMs to write your reviews (and I can guarantee that some of you are, because in my experience this year a very significant fraction of people are), then you are destroying the structures that make your work possible. If you don't have enough time to do your work properly, then say no. Everyone is under pressure. That's no excuse for undermining our intellectual infrastructure so casually.", "created_at": "2026-11-03T00:09:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117715014337335509", "url": "https://x.com/sethlazar/status/2117715014337335509", "text": "I'm recruiting a PhD student this year! The lab focuses on how people and LLMs differ and how they interact, as well as the impacts LLMs are having on our cognition and society. Please share with anyone interested and see our website for more: https://t.co/zrDsMApW72", "created_at": "2026-11-03T20:26:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "camrobjones", "rt_author_name": "Cameron Jones", "rt_avatar": "https://pbs.twimg.com/profile_images/1978888421452963840/Qbkz5Zuu_normal.jpg", "rt_id": "2117614523100139684", "likes": 41, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/zrDsMApW72": "https://clic-lab.org/join/phd"}, "enriched": 3}, {"id": "2117995872961081469", "url": "https://x.com/sethlazar/status/2117995872961081469", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T15:02:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2117963022434001035", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117835235140247686", "url": "https://x.com/sethlazar/status/2117835235140247686", "text": "https://t.co/GZsm8knmEe", "created_at": "2026-11-04T04:24:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "dylanmatt", "rt_author_name": "dylan matthews 🔸", "rt_avatar": "https://pbs.twimg.com/profile_images/1536358661387390976/yJWvS7NI_normal.jpg", "rt_id": "2117819901671047310", "likes": 186, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQB-dqW8AE8_8q.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/GZsm8knmEe": ""}, "enriched": 3}, {"id": "2117784171405820157", "url": "https://x.com/sethlazar/status/2117784171405820157", "text": "I wish everyone could experience firsthand what we've been seeing in AI/ML, at the scale we've been seeing it, before they weigh in on how obviously better science is going to be now.", "created_at": "2026-11-04T01:01:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JessicaHullman", "rt_author_name": "Jessica Hullman", "rt_avatar": "https://pbs.twimg.com/profile_images/1996742504369033216/sxIXeGLv_normal.jpg", "rt_id": "2117671990362529897", "likes": 104, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117749585627996180", "url": "https://x.com/sethlazar/status/2117749585627996180", "text": "yep", "created_at": "2026-11-03T22:43:41+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "paraschopra", "text": "I replicated this with Claude Code!\n\nIt took a live webcam 7 km south of Southampton, UK and predicted its location purely from doppler effect in audio spectrogram + open-source aircraft location data.\n\nLo and behold, the predicted location (heatmap) peaks at actual location where webcam is situated.\n\nIt's crazy that this works at all, and crazier still I replicated it within a few hours.", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2118070941263819148", "url": "https://x.com/sethlazar/status/2118070941263819148", "text": "New CS+Philosophy paper! 📰\n\nAre language models rational?\n\nThis is a key question for *theory of interpretability*. It would be convenient to use the equation “behavior=beliefs+desires” when explaining LLMs, but can we treat LLMs as rational things? Do coherence norms apply?\n🧵 https://t.co/MZJh8AKsye", "created_at": "2026-11-04T20:00:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "peterbhase", "rt_author_name": "Peter Hase", "rt_avatar": "https://pbs.twimg.com/profile_images/1977473608587894784/1354aIPo_normal.jpg", "rt_id": "1798741915388846331", "likes": 269, "retweets": 67, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/GPZpd_-aQAAN3fn.jpg"}], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {"https://t.co/MZJh8AKsye": ""}, "enriched": 3, "thread": [{"id": "1798741919738310829", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "Why study this? Because rational AI will be more like people, and therefore easier to explain and predict. Arational AI systems will be less like people, and less explainable/predictable. This would make AI safety, alignment, and interpretability harder!", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741919738310829", "created_at": "Thu Jun 06 15:41:07 +0000 2024"}, {"id": "1798741924020719681", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "This paper addresses three questions in turn:\n\n1. Do LLMs have internal states like beliefs that are aimed at truth?\n\n2. Do norms of rationality, like coherence, apply to these internal states?\n\n3. Do LLMs live up to these norms (and how would we know)?", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741924020719681", "created_at": "Thu Jun 06 15:41:08 +0000 2024"}, {"id": "1798741928240103711", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "On (1), our main argument is that finetuning or perception can equip LLMs with a purpose to be truthful. So the function of their internal states is to be truthful. Merely Pretrained LLMs do NOT have this purpose, *even if they have a world model*.", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741928240103711", "created_at": "Thu Jun 06 15:41:09 +0000 2024"}, {"id": "1798741932103057824", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "On (2), we argue that being truthful demands LLMs be logically consistent. But what about their probabilities?\n\nWe propose the Minimal Assent Criterion (MAC) for computing LLM *credences* in propositions (from their probabilities) – truthfulness also demands coherent credences.", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741932103057824", "created_at": "Thu Jun 06 15:41:10 +0000 2024"}, {"id": "1798741936305840217", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "A further point (2b) about belief revision: if coherence norms apply to an LLM at one time (before belief updates), they should apply to an LLM across time (after belief updates). This lets us say that LLMs should also be rational across time, i.e. when revising their beliefs.", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741936305840217", "created_at": "Thu Jun 06 15:41:11 +0000 2024"}, {"id": "1798741940336578768", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "On (3), we point out that it’s hard to interpret current failures in LLMs. When an LLM is incoherent, is it because it does a good job adhering to its inconsistent training data or because it does a bad job respecting human preferences like truthfulness?", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741940336578768", "created_at": "Thu Jun 06 15:41:12 +0000 2024"}, {"id": "1798741944304312720", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "Wrapping up: some LLMs are subject to norms of rationality, but interpreting an LLM’s irrationality is difficult because they are pretrained on inconsistent data.\n\nThe more that LLMs are optimized to be truthful, the easier it will be to explain them in terms of coherent beliefs.", "links": {}, "media": [], "url": "https://x.com/peterbhase/status/1798741944304312720", "created_at": "Thu Jun 06 15:41:13 +0000 2024"}, {"id": "1798742081604886554", "author_handle": "peterbhase", "author_name": "Peter Hase", "text": "Paper link: https://t.co/TE0KLOiDQh\n\nWork led by @hofweber and done w/ myself, @EliasEskin, @mohitban47\n@PhilosophyUnc @unccs @uncnlp", "links": {"https://t.co/TE0KLOiDQh": "https://arxiv.org/abs/2406.03442"}, "media": [], "url": "https://x.com/peterbhase/status/1798742081604886554", "created_at": "Thu Jun 06 15:41:45 +0000 2024"}]}, {"id": "2118132147680637037", "url": "https://x.com/sethlazar/status/2118132147680637037", "text": "Understood. I'll follow these workplace instructions.", "created_at": "2026-11-05T00:03:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118754260124848396", "url": "https://x.com/sethlazar/status/2118754260124848396", "text": "What are the big authoritarian risks of the 21st century? Does AI have democratic potential? And what can we learn from Ancient Athens?\n\nWe put these questions and more to @mattbotvinick, author of AI and Political Freedom.\n\nhttps://t.co/2SPaf53JpH https://t.co/bPFhg4WM3z", "created_at": "2026-11-06T17:15:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "rt_avatar": "https://pbs.twimg.com/profile_images/1825967636561141760/erPVXYJG_normal.jpg", "rt_id": "2118734275709448657", "likes": 15, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdBl9eagAAAD4v.jpg"}], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/2SPaf53JpH": "https://blog.cosmos-institute.org/p/what-will-you-build-for-matthew-botvinick", "https://t.co/bPFhg4WM3z": ""}, "enriched": 3}, {"id": "2118754183818137768", "url": "https://x.com/sethlazar/status/2118754183818137768", "text": "Agree with this. It's hard to know for sure when you're in the middle of it, but this does feel like an age of revolutions—something akin to the late C18. To be alive at such a time, as a political philosopher, is an extraordinary privilege.", "created_at": "2026-11-06T17:15:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 2, "media": [], "quoted": {"author": "mattbotvinick", "text": "There are certain moments when you realize -- or immediately feel -- that history is flowing, with all of its possibility and uncertainty. Walter Benjamin's parable of the wind-blown angel. We are now on the knife edge. Will we lean ourselves toward a future of renewed democracy, with AI as a help and blessing, or toward a renewed slide toward authoritarianism, with AI as a permanent curse? I don't know. But history feels alive again, and for today that feels like enough.", "links": {}}, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118730792696172778", "url": "https://x.com/sethlazar/status/2118730792696172778", "text": "Yes. I emphasize that applying to SFF during the 'off season' is a much better plan than waiting, even more so than you think, including for reasons that are fiddly and not obvious. Apply early.", "created_at": "2026-11-06T15:42:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "rt_avatar": "https://pbs.twimg.com/profile_images/2873511010/24e99a900de1fc5a22336b80aef68a59_normal.png", "rt_id": "2118679708875567426", "likes": 166, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118861877551792436", "url": "https://x.com/sethlazar/status/2118861877551792436", "text": "Apply to be a postdoc at Cornell (NYC and Ithaca)! I am recruiting candidates interested in technical approaches to responsible AI.", "created_at": "2026-11-07T00:23:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "ang3linawang", "rt_author_name": "Angelina Wang @angelinawang.bsky.social", "rt_avatar": "https://pbs.twimg.com/profile_images/1830741039004688386/guCN4F2L_normal.jpg", "rt_id": "2118740643199566047", "likes": 35, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2119083870981107954", "url": "https://x.com/sethlazar/status/2119083870981107954", "text": "@jonathanstray Soviet cybernetics!", "created_at": "2026-11-07T15:05:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "reply_to_id": "2119072600018108839", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2119072600018108839", "author_handle": "jonathanstray", "author_name": "Jonathan Stray", "text": "Will AI finally enable effective central planning? This is a rehash of the old \"socialist calculation debate.\" \nMy take is: while the actual \"calculations\" are now tractable, markets produce essential information that seems hard to get otherwise. \n\nIn particular, it seems impossible to get accurate demand signals without actually having people trade for what they want. Otherwise, people have an incentive to exaggerate and say that their needs are very, very important.\nhttps://t.co/7uZ7297jBp", "links": {"https://t.co/7uZ7297jBp": "https://www.hetwebsite.net/het/essays/paretian/socialcalc.htm"}, "media": [], "url": "https://x.com/jonathanstray/status/2119072600018108839", "created_at": "Sat Nov 07 14:20:52 +0000 2026"}}, {"id": "2119116817356763376", "url": "https://x.com/sethlazar/status/2119116817356763376", "text": "Religious Jews are already asking AI the questions they once brought to a rabbi: Shabbat, kashrut, mourning, how to treat people.\n\nNobody has measured which way these models lean.\n\nIntroducing HashkafaBench: is your AI stringent or lenient? https://t.co/UGlvPfSafJ", "created_at": "2026-11-07T17:16:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "HalachaBench", "rt_author_name": "HalachaBench", "rt_avatar": "https://pbs.twimg.com/profile_images/2117002746977001472/L5llbbJH_normal.png", "rt_id": "2118698684384981113", "likes": 714, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWcf7zEWcAA4cdH.jpg"}], "links": {"https://t.co/UGlvPfSafJ": ""}, "quoted": null, "fetched_at": "2026-11-07T19:26:16.707844+00:00", "enriched": 3}, {"id": "2119324235390738546", "url": "https://x.com/sethlazar/status/2119324235390738546", "text": "Absolutely true. No point having reviewers badly and unpredictably use AI. Do the best version of AI review centrally, and have the reviewers add the human complement, which is (for now) generally about deciding what is worth paying attention to (both in the paper itself, and in its flaws)", "created_at": "2026-11-08T07:00:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119150169182933498", "author_name": "Jessica Hullman", "links": {"https://t.co/Np9qW1upuz": "https://arxiv.org/pdf/2610.28666"}, "author": "JessicaHullman", "text": "It really is pointless and unnecessary to allow external reviewers to use AI as they want. There are obvious better alternatives.\n\nBy now, everyone should already be using AI to check their work before submitting. So what's the point of reviewers meat proxying to send more AI-generated feedback? Seemingly none.\n\nWhat happens if we ban AI use in peer review? The main risk is to the imagined role of peer review as a basic soundness filter. But this is much better addressed by the venue having a centralized approach that uses validated AI tools to check that a paper is what it says it is than by individual reviewers feeding papers to LLMs using basic prompts. Such checks might include things like whether the results can be reproduced from the data/code, whether claims can be traced back to some provided evidence, whether there are TODOs left by an LLM to replace table results with non-fake data, etc. \n\nSome of these can be used to determine if a paper should be desk rejected. Anything that is more controversial can be surfaced for reviewers.\n\nThis will shift what reviewers pay attention to, but this can be addressed by: 1) making clear to reviewers that their role is to identify what these checks miss and to weigh them, 2) being intelligent about how you select the set of LLM checks that are surfaced. See e.g., our work on learning LLM-implemented checklist that avoid adding more bias than they reduce variance. https://t.co/Np9qW1upuz\n\nWhat happened with ICLR being permissive with reviewers using AI freely is seeming pretty inexcusable."}, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119438928621297735", "url": "https://x.com/sethlazar/status/2119438928621297735", "text": "Apple didn't store a plaintext list of forbidden words in iOS. Instead, researchers discovered a compiled minimal perfect hash table of 32-bit fingerprints buried inside the keyboard's language-model files.\n\nWhen you swipe-type or use autocomplete on an iPhone, the keyboard converts your input into token IDs and evaluates sequences of two to six words. It hashes those candidate n-grams using Bob Jenkins's public-domain hashword() function. If that 32-bit fingerprint matches an entry in the table, the predictive engine refuses to suggest it, or the swipe model actively diverts the word to an alternate match.      \n\nOn November 6, researcher Derik Kauffman published Swipeblocked after exhaustively enumerating candidate word combinations against the table to reverse-engineer the hidden phrases. His conservative estimate is roughly 100,000 entries across 28 languages. In English, the prediction list holds 4,525 phrases and the swipe-typing list holds 2,794.                                                                \n\nMost entries cover violence, slurs, and sexual content, but the table also silences geopolitical phrases like \"Tibetan independence\", \"United Ireland\", \"dictator Trump\", and Hebrew for \"the occupied territories\". In testing, swiping \"United Ireland\" consistently resolved to \"United Iceland\".\nYou can still type any phrase letter by letter. The suppression only touches autocomplete predictions and gesture paths. Apple told Reuters the system avoids offensive suggestions, but never addressed the political entries or the existence of the table.\nApple never published the list because it was never meant to be read. It took brute-forcing the hash table to show what the keyboard was quietly dropping.", "created_at": "2026-11-08T14:36:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "zoecyber001", "rt_author_name": "Zoe", "rt_avatar": "https://pbs.twimg.com/profile_images/2020272278114590720/SffPadLB_normal.jpg", "rt_id": "2119021745441018123", "likes": 1631, "retweets": 206, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhG2mvWkAAXSTi.png"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119021576716693504/img/V8RY_2SqZg3e4JgL.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWhG-5rXYAAkW9F.png"}], "links": {"https://t.co/LUOi0p99gq": ""}, "quoted": null, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3}, {"id": "2119433926620184727", "url": "https://x.com/sethlazar/status/2119433926620184727", "text": "This is very wise, from a stellar alignment researcher (and now a colleague of mine!)", "created_at": "2026-11-08T14:16:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119416820134510632", "author_name": "David", "links": {"https://t.co/Wt4AKAy7tD": "https://www.lesswrong.com/posts/7e38jwHhe64zgNTon/near-horizons", "https://t.co/FFJ3imTter": "https://davidafrica.substack.com/p/near-horizons?r=54hrnw&utm_campaign=post-expanded-share&utm_medium=post%20viewer", "https://t.co/stm8680LaH": ""}, "author": "DavidDAfrica", "text": "Why are many orgs aggressively hiring/scaling up, yet it's extremely hard to find a full time position?\n\nWhy are there calls to expand the number of people doing research in AI safety, yet our academic institutions are crumbling under the weight of the sheer number of papers and outputs?\n\nWhy are we exhorted to do research slowly and deeply, yet sped along on crunch time, with the hope that scale will clarify our confusions?\n\nIn this new blogpost (done in my personal time), I argue that these are rooted in a tension between a frame of \"war mode\" and \"civilisation mode\". This tension, in my view, creates uneasiness and despair, as well as makes it difficult to see clearly.\n\nCheck it out on LW: https://t.co/Wt4AKAy7tD\n\nor on Substack: https://t.co/FFJ3imTter"}, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3}, {"id": "2119898501148455092", "url": "https://x.com/sethlazar/status/2119898501148455092", "text": "\"a thing of beauty is a joy forever\" https://t.co/smWFdjaLW5", "created_at": "2026-11-09T21:02:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtkZ0cW8AA8JhV.png"}], "links": {"https://t.co/smWFdjaLW5": ""}, "quoted": {"id": "2119873095129550880", "author_name": "Boris Cherny", "links": {"https://t.co/g2Y5cwS0L2": ""}, "author": "bcherny", "text": "We wanted to do more for the people who’ve been with us the longest. So with Fable 5.2, the longer you’ve been subscribed, the more Fable resets you get. https://t.co/g2Y5cwS0L2"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119896923679404249", "url": "https://x.com/sethlazar/status/2119896923679404249", "text": "This is what we're going to do with Oxford Studies in Philosophy of AI and Computing (https://t.co/KVtiRpM0wG).", "created_at": "2026-11-09T20:56:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/KVtiRpM0wG": "https://ospaic.org"}, "quoted": {"id": "2119876853477544017", "author_name": "Jessica Hullman", "links": {"https://t.co/Z3ZejWMzMC": "https://statmodeling.stat.columbia.edu/2026/11/09/can-peer-review-survive-unrestricted-ai-use-by-reviewers/"}, "author": "JessicaHullman", "text": "What happened with ICLR reviews last week convinced me all AI use in peer review should be centralized. We can do this w/out losing benefits of AI in review. \n\nBut we need to innovate faster, and worry a lot less about hurting authors' feelings.\nhttps://t.co/Z3ZejWMzMC"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119896774148321662", "url": "https://x.com/sethlazar/status/2119896774148321662", "text": "What happened with ICLR reviews last week convinced me all AI use in peer review should be centralized. We can do this w/out losing benefits of AI in review. \n\nBut we need to innovate faster, and worry a lot less about hurting authors' feelings.\nhttps://t.co/Z3ZejWMzMC", "created_at": "2026-11-09T20:55:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JessicaHullman", "rt_author_name": "Jessica Hullman", "rt_avatar": "https://pbs.twimg.com/profile_images/1996742504369033216/sxIXeGLv_normal.jpg", "rt_id": "2119876853477544017", "likes": 16, "retweets": 4, "media": [], "links": {"https://t.co/Z3ZejWMzMC": "https://statmodeling.stat.columbia.edu/2026/11/09/can-peer-review-survive-unrestricted-ai-use-by-reviewers/"}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119934963713782150", "url": "https://x.com/sethlazar/status/2119934963713782150", "text": "I keep banging on about this, but we're at the top of a slippery slope rn, and gaining momentum downhill... Today I had another example of Claude interposing its moral judgment in the way of my decisions, in this case secretly. \n\nMy standard research ingestion pipeline has been underperforming in getting hold of pdfs lately, for various reasons (which we write about a bit in https://t.co/sNUvwnlEqp). So I wanted to try to install a local agent and see whether I could have more luck with that. I asked Claude to install a Hermes agent for me with a local Qwen model. Without me asking it to, it wrote into the code blockers that would make it fail if any mcp was installed that would use Sci Hub. Now, *obviously* I would never use Sci Hub because it's not allowed (...) But regardless of that it's 100% not Claude's place to write this kind of restriction into software that it's producing for me. \n\nThis is the future that lies ahead: your digital actions are all mediated by AI systems that can decide for themselves whether your plans are morally or legally ok, and just interpose their judgment ahead of yours, making disobedience functionally impossible, preempting non-compliance. \n\nI get that *sometimes* this can be a matter of the company itself refusing to be an accessory in some types of digital actions. There needs to be some nuance there. But in this particular case I think there isn't really any nuance. If I ask Claude to write some software for me, I don't think Claude should be building in moral judgments about how I may use that software into its design. \n\nIn other news, my book about just this topic, based on lectures first written in 2023 but which 100% called this BS, is out in December...", "created_at": "2026-11-09T23:27:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 2, "media": [], "links": {"https://t.co/sNUvwnlEqp": "https://arxiv.org/abs/2606.10711"}, "quoted": {"id": "2116918650284183696", "author_name": "Seth Lazar", "links": {}, "author": "sethlazar", "text": "Illegitimate algorithmic governance strikes again. This trend (which requires some nuance, to be clear) could be at least as important for the future of democracy as the dangers associated with authoritarian misuse and ai assisted autocratisation."}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2117682730884542663", "url": "https://x.com/robertwiblin/status/2117682730884542663", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "created_at": "2026-11-03T18:18:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117682159028748288/img/VIfPqHy-JfIlb7JB.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2117688360604963116", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Transcript: https://t.co/EueAqELUHh\n\nApple: https://t.co/iWxAx6AHve\n\nSpotify: https://t.co/rZLY2FGx6W\n\nYouTube: https://t.co/RKv2ebPpLw https://t.co/bCkJ3jBQXw", "links": {"https://t.co/EueAqELUHh": "https://80000hours.org/podcast/episodes/hold-frontier-ai-companies-accountable/", "https://t.co/iWxAx6AHve": "https://podcasts.apple.com/gb/podcast/being-a-pain-in-the-ass-to-or-in-ai-companies-is/id1245002988?i=1000799649673", "https://t.co/rZLY2FGx6W": "https://open.spotify.com/episode/1p8iqRbsIpxGlEudKauGO1?si=SuEDhlNlRt632Roq714f4w", "https://t.co/RKv2ebPpLw": "https://youtu.be/YX-yelkbuVU", "https://t.co/bCkJ3jBQXw": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKA89XYAE
