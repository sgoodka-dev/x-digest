32434897205", "url": "https://x.com/s8mb/status/2116441032434897205", "text": "gm https://t.co/MufvdK9EA6", "created_at": "2026-10-31T08:03:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 154, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV8b5oOXMAEk5Al.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116852726407569748", "url": "https://x.com/s8mb/status/2116852726407569748", "text": "What a great addition! https://t.co/ZsWkh1U9Ii", "created_at": "2026-11-01T11:19:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 31, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWCSVGRXgAAbh9u.jpg"}], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117302902520009183", "url": "https://x.com/s8mb/status/2117302902520009183", "text": "Subscribe today to be among the first to receive our December issue. My favourite piece in it is @pietergaricano on how Emmanuel Macron broke the French growth machine.", "created_at": "2026-11-02T17:08:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 31, "retweets": 1, "media": [], "quoted": {"author": "underthenettle", "text": "We have another banger lineup of pieces in the December issue of Works in Progress magazine. Subscribe now to get your print copy as soon as it's out. \n\nIncluding:\n➔ @RuxandraTeslo and @NikoMcCarty on Chinese biotech\n➔ @pietergaricano on Emmanuel Macron\n➔ @salonium on smallpox eradication\n➔ @JamieRumbelow on the internet's infrastructure\n➔ @SCP_Hughes on the history of architectural taste\n➔ @erinbraid on the curse of Italy\n➔ @Aria_Babu on Hollywood remakes\n➔ @chalmermagne on the end of Communism\n➔ @CharlesCMann on forest fires\n➔ @tylercowen on Armenian food \n\nhttps://t.co/sYMZ2BJ9Ol"}, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117276160853967222", "url": "https://x.com/s8mb/status/2117276160853967222", "text": "@ShakeelHashim @ReadTransformer @NYMag Nice piece. Great art direction too!", "created_at": "2026-11-02T15:22:28+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ShakeelHashim", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117649615159980369", "url": "https://x.com/s8mb/status/2117649615159980369", "text": "@SCP_Hughes I completely agree with him here. I love Manhattan but the endless chasms that many of the streets have are weirdly desolate compared to the more enclosed parts of Lower Manhattan. https://t.co/6sHnGrIIgO", "created_at": "2026-11-03T16:06:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "reply_to_id": "2117627793928274067", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNmpBxW4AA6S4U.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117518864804135362", "url": "https://x.com/s8mb/status/2117518864804135362", "text": "What’s playing out in the rental market was completely predictable. What I said would happen a year ago below is now going on; the only thing left is for these measures to catch on across the whole market. Rent controls are back - @mtpennycook deserves a lot of the credit! https://t.co/Trsl1bLMIl", "created_at": "2026-11-03T07:26:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 245, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLwLzDXwAAh9lY.jpg"}], "quoted": {"author": "s8mb", "text": "The government's Renters' Rights Bill looks like it will be a catastrophe, inadvertently introducing rent controls and reducing the supply of housing even more. It is the clearest evidence that the whole British state that has brought it about is completely broken: \n\n• Written by the civil service\n• Introduced by the Tories\n• Passed by Labour and the Lib Dems\n• Cheered on by the mainstream media\n\nThe bill's core provision is to eliminate \"no-fault evictions\". Many understand this to mean evictions during a rental lease. In fact, this is already impossible. What the new bill does is to stop landlords from being able to regain their property after a lease has expired. \n\nThis means that renting a property to someone now means that they get to live in that property indefinitely. A landlord can only evict them if they are selling the property, or plan to move into it themselves, or if a tribunal gives them permission after ruling against the tenant for bad behaviour.\n\nWithin these indefinite contracts, rent increases will be capped at whatever the 'market rate' is determined to be by a tribunal. Tribunals will not be able to *raise* rents, as they currently can and often do – only lower them or keep them where they are. The only risk to a tenant is that their challenge is deemed \"vexatious\".\n\nNot only will rent increases *within* contracts be controlled by courts, rents for *new* contracts will also be controlled by them. Tenants will be entitled to agree a rent, move in, and then immediately take their landlord to a rent tribunal on the grounds that the rent they have just agreed to is \"too high\".\n\nRent tribunals will thus have the power to control all rents. All rents will be set under the threat of a tribunal intervening. There will be no \"market rate\", so the tribunal will have no independent \"market rate\" to refer to.\n\nA tenant who challenges a rent increase will have their rent frozen at the old, lower rate while their challenge is ongoing (which could take over a year). Like the Building Safety Regulator right now, tribunals are likely to be extremely backlogged, creating huge delays where tenants do not have to pay their new higher rents, if they ever do. Tenants will have huge incentives to challenge nearly all rent increases. \n\nWe have already seen how bad courts are at ruling on prices, eg in cases where Next's shop workers have been given the same pay as factory floor workers, and in Birmingham where the council was forced to pay £760m to care workers and teaching assistants because a court decided that these roles were equivalent to jobs like rubbish collectors.\n\nAll this amounts to rent controls. These are terrible for many reasons.\n\n1. They will cause landlords to sell up and leave the market. This is both to avoid the risk of being stuck with a bad tenant, and because once the rent has been kept artificially low by a rent tribunal, landlords will be losing money compared to just selling into private owner-occupation.\n\nRental properties allow for easy doubling up (housesharing) which is much messier under owner-occupation. The effective supply of housing is about to drop. In Ireland, postwar rent controls shrunk the rental market from 26% to 8% of the total housing stock in 40 years. In Britain, 1916–88, the share of properties available for rent went from 75% of the market to 10%.\n\n2. They cause landlords to neglect their properties. Landlords receiving artificially-depressed rents for their properties have no incentive to maintain them. Rent controlled properties, famously, become neglected and fall into decay, as leaks, cracked plaster and broken windows are left unaddressed. The country's housing stock that remains in renting will decay. Our cities will become more decrepit.\n\n3. They stop people from moving around for better jobs. We already have this effect with social housing, where huge amounts of inner London housing (30–40%!) are held by tenants in low wage jobs, or who have no job at all, instead of by people who could move to London to earn and produce more. This will happen to large swathes of the rental market too, stopping people from moving into prosperous cities where they could get better jobs.\n\n4. They stop the supply of new homes for rent. Under rent controls, there is no incentive to build new homes for renting. Britain built essentially no private flats for rent between 1945 and the end of rent controls in 1988. The same was true in France between WWI when it introduced rent controls and the slow end of rent controls in the postwar era.\n\n5. They push renters into the black market. To actually get a place to live, a lot of people will sidestep these new rules and rent informally, with none of the protections we currently have for renters like the deposit protection scheme. This is the sort of scenario that allows landlords to *really* exploit and steal from their tenants.\n\n–\n\nDo not assume that anyone involved with this knows what they're doing. We have already seen, in the case of the Building Safety Regulator and the second staircase regulations (brought in by the same Housing Secretary who designed this bill), how disastrous the consequences of well-intended but misconceived interventions in the housing market can be.\n\nLondon building has already ground to a halt. And things are about to get even worse."}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117516901609779606", "url": "https://x.com/s8mb/status/2117516901609779606", "text": "Tenants used to be able to challenge rent rises. If they succeeded, the landlords could evict them. This obviously meant that the rulings weren’t binding and couldn’t set rents below the market rate. \n\nNow you can’t evict the tenant, no matter how low the tribunal sets the rent. And tribunals can reduce the rents agreed to at the start of the tenancy, not just rent increases at the end of a fixed term. \n\nThis is *obviously* rent control by anyone’s definition of the term. This is what they wanted to happen!", "created_at": "2026-11-03T07:19:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 818, "retweets": 71, "media": [], "quoted": {"author": "mtpennycook", "text": "I see the nonsense “rent controls are back” takes keep coming.\n\nThere is no rent control in England.\n\nThe legal right to challenge rent increases at tribunal was introduced by the Thatcher Government in its 1988 Housing Act.\n\nIt was rarely used in practice only because it inevitably resulted in a landlord serving a Section 21 notice.\n\nLabour’s Renters’ Rights Act abolished Section 21 ‘no fault’ evictions and renters are now rightly empowered to challenge unfair or above-market rent increases.\n\nIn both the recent cases that have been the cause of so much debate, the tribunal has been operating exactly as it should – determining that the landlords in question were charging rents that simply did not reflect local market values for comparable properties."}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117510302761930844", "url": "https://x.com/s8mb/status/2117510302761930844", "text": "@rosegrayston You used to be able to evict a tenant who challenged their rent and had it reduced, which meant the rulings didn’t bind, and now you can’t, so the rulings do bind. Why obfuscate here? This is the policy you wanted!", "created_at": "2026-11-03T06:52:52+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rosegrayston", "reply_to_id": "2117305510697238549", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 186, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2118038398556393641", "url": "https://x.com/s8mb/status/2118038398556393641", "text": "Thrilled that Works in Progress is in Lenny's annual gift guide. The whole guide is great – I just got a Canary knife and have enjoyed cutting all my Amazon boxes with it. I hope people who discover WIP through it like it just as much!\n\n(\"Some people call it the new Economist\"!) https://t.co/BotbICPJOw", "created_at": "2026-11-04T17:51:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 47, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWTH_8xXoAAtLVU.jpg"}], "quoted": {"author": "lennysan", "text": "The holidays are fast approaching, so I’m back with my sixth (!!) annual gift guide. \n\nIt's got over 100 gift ideas—all things I actually use, love, and recommend.\n\nThis started out as a random post idea, but now you’d be surprised how many people ping me asking when the new list will be out.\n\nAs always, the collection includes a mix of practical stuff with a lot of fun and delight, from high-end products to very affordable items. There are no affiliate links here, and I’m not benefiting from recommending any of these products.\n\nPro tip: After reading it, point your fav 15:56:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "reply_to_id": "2118006659100385451", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 32, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSs8anWQAAxn59.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWSs-EjW8AAb-na.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118006659100385451", "url": "https://x.com/s8mb/status/2118006659100385451", "text": "From today, Works in Progress is now in stock at Barnes & Nobles nationwide across America. \n\nWe're in 570 stores in 49 states*, including the flagship stores at Union Square & Fifth Avenue in NYC; Georgetown, DC; State Street, Chicago; and The Grove, Los Angeles. \n\nWe're also now in Hudson News outlets across most major US airports, and the B&Ns at San Francisco Airport.\n\nIf you tweet (or LinkedIn/Insta post) a photo of a copy of Works in Progress outside any of these stores, share the post with me or @WorksInProgMag via DM and we'll send you a free tote bag as a thank you. If you're a subscriber already, feel free to do it with own copy!\n\nYou can see a full map of Barnes & Noble stockists here, and enter your Zip code to find your nearest store.\n\n*Sorry, Wyoming, we'll get to you!\n\nhttps://t.co/a22LtQP2HW", "created_at": "2026-11-04T15:45:12+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 397, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117928926093746334", "url": "https://x.com/s8mb/status/2117928926093746334", "text": "How can we make lovable cities? If you had asked a European architect this question in 1900, they would probably have referred you to a slender, lively book by the Austrian writer Camillo Sitte, translated as ‘The Art of Building Cities’. Published in 1889, ‘The Art of Building Cities’ swiftly came to be revered around the world.\n\nhttps://t.co/qwVmTrPTGV\n\nSitte was repudiated by the modernists and fell into obscurity, but his ideas are beginning to be revived. My cousin @PMArslanagic and I have distilled nineteenth century's finest work on urbanism into five principles:\n\n- Create enclosed spaces\n- Keep squares small\n- Symmetry is overrated\n- Move monuments to the edges of spaces\n- Nestle monuments in vernacular fabric", "created_at": "2026-11-04T10:36:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "rt_avatar": "https://pbs.twimg.com/profile_images/1881805141059211264/D22ZUEJF_normal.jpg", "rt_id": "2117627793928274067", "likes": 634, "retweets": 131, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117899168966729881", "url": "https://x.com/s8mb/status/2117899168966729881", "text": "Absolutely brilliant set of tweets from @SCP_Hughes on how to make a brilliant city, architecturally. Read it and you will learn something.", "created_at": "2026-11-04T08:38:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "timleunig", "rt_author_name": "Tim Leunig", "rt_avatar": "https://pbs.twimg.com/profile_images/1724908138703314944/i9Jh_a3a_normal.jpg", " 8105506887717117", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2116165441110323349", "url": "https://x.com/random_walker/status/2116165441110323349", "text": "Resharing our paper on the science of AI agent evaluation because the PHP vulnerability happened right as we announced the paper last week and our server was taken down all day to upgrade PHP 🫠 \n\nPDF: https://t.co/8m13p9d70F\nWebpage: https://t.co/xGAvBCGW4a\nBlog: https://t.co/qxO21qWZfm\n\nThere are growing calls for independent and embedded AI evaluation, especially of AI agents. But much remains unclear: what constitutes a “good” evaluation, what needs to be evaluated in the first place, and how best to coordinate and support the influx of people entering the burgeoning evaluation ecosystem.\n\nOur group at Princeton has been working to improve the state of AI agent evaluation for about three years. We teamed up with people who’ve done foundational work on evaluation at Stanford, the UK AI Security Institute, and Brookings. Our paper is titled Emerging Trends in AI Agent Evaluation. We synthesized the trends we see across three dimensions—the science and methods, the research agenda, and the evaluation ecosystem—with the goal to help those who are upskilling for this new paradigm. We also aim to equip evaluators, funders, and the public with a set of questions to ask, and provide actionable recommendations.\n\nBy @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, @sayashk, and me.", "created_at": "2026-10-30T13:48:52+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4gNKRW0AIfqKE.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116163258646515739", "url": "https://x.com/random_walker/status/2116163258646515739", "text": "In 2023, @sayashk and @random_walker published a study on data leakage in machine-learning research. They found that leakage had been reported across 17 scientific fields, affecting 294 papers.\n\nThe problem of detecting data leakage has only become harder because of the sheer number of papers published every day.\n\nThat’s why it’s important to examine how a paper’s results were produced or, at the very least, try to reproduce one of its main claims. However, it's easier said than done\n\n@askalphaxiv  has made the first step easier now.", "created_at": "2026-10-30T13:40:11+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pandeyparul", "rt_author_name": "Parul Pandey", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4dKSAa0AAo0sY.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116132374069366827", "url": "https://x.com/random_walker/status/2116132374069366827", "text": "When I worked in nuclear, I gave talks on bugs I found with a slide titled \"How are we all not dead yet?\" where I gave an example of a device that has been running on the field for decades with no issues, but had 6,000 data races (that weren't false pos) to explain resilience 1/2", "created_at": "2026-10-30T11:37:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "HeidyKhlaaf", "rt_author_name": "Dr Heidy Khlaaf (هايدي خلاف)", "likes": 1631, "retweets": 84, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116911746657243464", "url": "https://x.com/random_walker/status/2116911746657243464", "text": "Quick thread on AI and productivity:\n\nLots of people say this chart shows AI is now showing up in the productivity data.\n\nBut I made this chart to argue the opposite: a trend that pre-dates AI and only shows up in the US doesn’t look like AI.\n\nHere’s how I’m thinking about the data and underlying dynamics:", "created_at": "2026-11-01T15:14:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "likes": 634, "retweets": 146, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDFzW6XsAA3jDh.jpg"}], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117246718219612594", "url": "https://x.com/random_walker/status/2117246718219612594", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "created_at": "2026-11-02T13:25:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 301, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH4mBhWQAA5Lou.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117627225444897232", "url": "https://x.com/random_walker/status/2117627225444897232", "text": "AI revenues right now are in a state of extreme disequilibrium and are produced by multiple counteracting exponentials. Naive trend extrapolation is not insightful. For forecasts to be useful we have to tease apart the underlying trends and how they interact, and pay close attention to the distinction between value creation and value capture. Many widely divergent futures are possible, including some pretty wild ones.", "created_at": "2026-11-03T14:37:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 4, "media": [], "quoted": {"author": "random_walker", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. r/status/2117963022434001035", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T12:51:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117770254348664933", "url": "https://x.com/random_walker/status/2117770254348664933", "text": "Update: Can AI agents use Pangram to beat Pangram? In small tests, I found simple prompts to the Codex allowed it to beat Pangram. The final output was 100% human generated. Prompts that helped:\n\n- Have the agent develop a style guide based on past writing\n- Have it develop an \"anti-style guide\" based on AI writing tics that people have complained about \n- Instruct it to get to a seed sentence that Pangram doesn’t flag (or at least flags as AI-assisted rather than fully AI-generated). Then the agent knows what strategies work and can iterate from there", "created_at": "2026-11-04T00:05:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2117760736466252258", "likes": 195, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPHhLZX0AERJcF.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117735390828458295", "url": "https://x.com/random_walker/status/2117735390828458295", "text": "All of this makes sense to me. The point about RSI potentially (or even likely) being narrow is also in agreement with my complementary intelligence thesis, where what're seeing is an increase in the magnitude of a particular intelligence vector, which may not mean much when projected onto other intelligence vectors.", "created_at": "2026-11-03T21:47:17+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "togelius", "rt_author_name": "Julian Togelius", "rt_avatar": "https://pbs.twimg.com/profile_images/1863646728433352705/z0pWqOuX_normal.jpg", "rt_id": "2117690343848329570", "likes": 44, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118328569369694471", "url": "https://x.com/random_walker/status/2118328569369694471", "text": "Most days I can just about manage this balancing act, but only because thinking about how we should adapt to AI is my actual job. Otherwise I think I’d find it too hard. I suspect that’s one reason people sort themselves into camps or tribes. It’s psychologically easier than constantly revisiting one’s beliefs.\n\nBeing able to empathize with and collaborate with people who have different AI boundaries and attitudes than our own is becoming an important skill.", "created_at": "2026-11-05T13:04:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 4, "media": [], "quoted": {"author": "random_walker", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation."}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115836208760934629", "url": "https://x.com/sethlazar/status/2115836208760934629", "text": "MATS Research is hosting a NeurIPS Expo workshop on research priorities in AI safety &amp; security!\n\nWe’re looking for speakers from academia, industry, government, and nonprofits to share their perspectives: https://t.co/JoA0dGWcGu 🧵", "created_at": "2026-10-29T16:00:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MATSprogram", "rt_author_name": "MATS Research", "likes": 45, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115836177047499053", "url": "https://x.com/sethlazar/status/2115836177047499053", "text": "If you are coming to NeurIPS in Sydney and want to speak on AI safety &amp; security research priorities at the MATS Expo Workshop, let us know! We'd love speakers from across academia, government, nonprofits, and industry.", "created_at": "2026-10-29T16:00:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116160531698786574", "url": "https://x.com/sethlazar/status/2116160531698786574", "text": "This is amazing advice (and I *have* used AI to generate slides, with exactly this outcome—since which I now insist 0 ai words allowed but I do like it to do design for me cos aesthetics do matter)", "created_at": "2026-10-30T13:29:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": {"author": "tallinzen", "text": "my hypothesis for why AI-generated slides for technical presentations are so awful:\n\npeople who don't have a lot of experience presenting think that to make a talk you just put all of the stuff you want to talk about on the slides, then you go through each slide and say the stuff the slide says.\n\nhow you're actually supposed to prepare a presentation: you decide what to say, write it out as a rough script, then put maybe 3% of the text on the slide, plus a bunch of visual aides (e.g. plots that only include data you're planning to discuss).\n\nAI-generated presentations are mostly the former. they have a ton of stuff the presenter never mentions, and the stuff that is most useful for the presenter is absent or not highlighted. they include enough content for a presentation 10 times longer than the actual presentation is supposed to be.\n\nmaybe try doing it the other way: first write the script for what you actually want to say, and make sure you can say all of it in the time you have. then prompt the model to create the slides based on the script. ask it to use as little text a possible, and a minimalist visual style rather than the claude house style. you can thank me later (I accept both venmo and zelle)."}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116149642014396707", "url": "https://x.com/sethlazar/status/2116149642014396707", "text": "@alexolegimas Ok well while you might be distinguishing between normative and positive under some specific narrow construction of those terms, there’s much more to it than that. But that’s a huge and old literature, and I’m sure you’re either aware of it and being playful, or able to educate yourself on it without a long Twitter discussion.", "created_at": "2026-10-30T12:46:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116147659174269362", "url": "https://x.com/sethlazar/status/2116147659174269362", "text": "@alexolegimas You surely don’t believe that’s so easy? This is an old saw.\n\nBut also, this hits different coming from within precisely one of the firms that could end up eating the economy.", "created_at": "2026-10-30T12:38:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116144523940405738", "url": "https://x.com/sethlazar/status/2116144523940405738", "text": "“Past a certain threshold, AI capabilities can break the Coasian ceiling on firm size”\n\nIs that something we should welcome?", "created_at": "2026-10-30T12:25:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 4, "media": [], "quoted": {"author": "alexolegimas", "text": "Here is the working paper that the DMI essay draws from.\n\nhttps://t.co/tFMlKAcFKB https://t.co/Lm8YmTuPST"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116026061377126658", "url": "https://x.com/sethlazar/status/2116026061377126658", "text": "this has always baffled me too! Hunting around for the bastards, so annoying", "created_at": "2026-10-30T04:35:01+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": {"author": "zetalyrae", "text": "I don't understand why contemporary designers hate scrollbars so much."}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116005368442634675", "url": "https://x.com/sethlazar/status/2116005368442634675", "text": "@superwuster Agree on this! See in particular https://t.co/mQD3hVbXX2 and https://t.co/RY8NRkvSxs", "created_at": "2026-10-30T03:12:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "superwuster", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115992254615577080", "url": "https://x.com/sethlazar/status/2115992254615577080", "text": "@boazbaraktcs Boaz did you see my post the other day about a thread in which codex got stuck in a task and spent 75000 credits plus my weekly allowance?! I think it would be worth looking at the transcript, seems quite like the canonical HF style behaviour (impossible task plus persistence = v bad outcome)", "created_at": "2026-10-30T02:20:41+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "boazbaraktcs", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115911035932823904", "url": "https://x.com/sethlazar/status/2115911035932823904", "text": "Honoured to call Ben a colleague, and very excited for this book. Pre-ordered!", "created_at": "2026-10-29T20:57:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 1, "media": [], "quoted": {"author": "BuchananBen", "text": "I led AI policy in the Biden administration, and my colleague @tantumscollins was Director for Technology on the National Security Council. Our book on AI and national security -- THE BITTER STRUGGLE -- comes out in 11 days. @tylercowen said it “will become the standard source” on the history of the China chip bans and Biden-era AI policy. @crmiller1 said it is “essential reading for understanding how AI will impact geopolitics and how the great powers are shaping AI.”\n\nWe wrote this book because the decisions shaping AI -- and the future for all of us -- are too important to only be debated behind closed doors. If you're planning on reading it, pre-ordering is one of the best ways to help us bring this conversation to a broader audience. \n\nhttps://t.co/shdmbLbAdh"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116543808712106461", "url": "https://x.com/sethlazar/status/2116543808712106461", "text": "We have a postdoc position available for CoRe Safe AI!  If you're not sure whether you fit, please reach out.\nhttps://t.co/7piZpC15uj", "created_at": "2026-10-31T14:52:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "conitzer", "rt_author_name": "Vincent Conitzer", "likes": 6, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116541527484924102", "url": "https://x.com/sethlazar/status/2116541527484924102", "text": "It’s easy to pit understanding against outputs in AI-for-science debates. But seeing understanding as an optional mental state revives old ideals of value-free science &amp; mechanical objectivity that philosophers reject as insufficient.\n\nThanks @cosmos_inst for publishing this!", "created_at": "2026-10-31T14:43:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JessicaHullman", "rt_author_name": "Jessica Hullman", "likes": 18, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116537166822084884", "url": "https://x.com/sethlazar/status/2116537166822084884", "text": "@Jess_Riedel @calebwatney @rSanti97 @MackenZ_arnold I do think, tho, that there is an important diff between founding a company and founding a non-profit. With the former, it makes sense to fund 100 companies in the hope that 1 takes off. With non-profits, that’s much less compelling (except maybe for basic research)  because (a) you’re trying to achieve a common objective, not self-interestedly optimise, and (b) there’s a lot of public infra that needs to be built (which already substantially exists on the for profit side)", "created_at": "2026-10-31T14:25:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Jess_Riedel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116395380426547704", "url": "https://x.com/sethlazar/status/2116395380426547704", "text": "@discoplomacy @calebwatney @rSanti97 @MackenZ_arnold It’s not an easy choice! Feel free to DM, happy to offer advice.", "created_at": "2026-10-31T05:02:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "discoplomacy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116389325986316717", "url": "https://x.com/sethlazar/status/2116389325986316717", "text": "New blogpost: my lab's AI policies and norms.\n\nI'm trying to figure out how researchers should make use of AI to accelerate discovery without letting it replace human understanding or falling off the \"slop cliff.\" Here are some ideas.\n\nhttps://t.co/etz0DQvnHL", "created_at": "2026-10-31T04:38:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mcxfrank", "rt_author_name": "Michael C. Frank", "likes": 109, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116378386947797281", "url": "https://x.com/sethlazar/status/2116378386947797281", "text": "@MackenZ_arnold @calebwatney @rSanti97 Another problem (worth folks like @calebwatney attending to) is that larger, more enduring orgs are more likely to produce public goods that others benefit from. Lots of small orgs, with limited runway, don’t have time/resources for such things. I’d like to see the biggest players in these spaces (including now the Institutes at the AI companies) thinking about how to sustain these public goods. It’s definitely something we are working on (already wrt journals, in the near term I hope w many more things).", "created_at": "2026-10-31T03:55:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MackenZ_arnold", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116370286811677028", "url": "https://x.com/sethlazar/status/2116370286811677028", "text": "“A paper whose authors can’t explain its claims leaves no one to consult if those claims fail.”\n\nNew guest essay from @JessicaHullman on why science needs people who can answer for results and challenge them, even once AI can verify them.\n\nhttps://t.co/chzHo1uCAK https://t.co/CUvJjT5sdt", "created_at": "2026-10-31T03:22:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "likes": 59, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4z0awbYAAsOgt.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116367279294415337", "url": "https://x.com/sethlazar/status/2116367279294415337", "text": "Huh I didn't know Muse had a secret constitution\nhttps://t.co/ZHhVjiLKGp\nhttps://t.co/yThNdrePDI https://t.co/iOUMKOeKIU", "created_at": "2026-10-31T03:10:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wassname", "rt_author_name": "wassname (with fallback)", "likes": 9, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV663OHbEAAxSLy.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116367119604486351", "url": "https://x.com/sethlazar/status/2116367119604486351", "text": "1/2\nI’ll be co-leading AI Alignment and Society with Misha Belkin at UC San Diego’s new Center for Principled Agentic Intelligence. An exciting and scary moment, and much to understand about the future of AI.\nhttps://t.co/qbBr9TDS0O https://t.co/7BZKyZ0XDr", "created_at": "2026-10-31T03:10:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EddyKemingChen", "rt_author_name": "Eddy Keming Chen", "likes": 3, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7AADMb0AASBYy.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116367062297616659", "url": "https://x.com/sethlazar/status/2116367062297616659", "text": "As someone who left my (lovely) life in Australia to move to DC to work on the most important problems, I agree w @calebwatney and @rSanti97 on the general point, but @MackenZ_arnold makes some excellent points here which have occurred to me also. There are some big new bets that are worth diving into (I just started working part time at the best one, @resolution_org !) but the idea that everyone should spin up a new org is at least quite likely to be collectively self-defeating.\n\nOne of the things that is so striking about the AI companies is how they have concentrated talent in one place. We need public interest research (etc) on the AGI transition to achieve ~the same talent density.", "created_at": "2026-10-31T03:10:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 1, "media": [], "quoted": {"author": "MackenZ_arnold", "text": "Has anyone else noticed that every talented upstart you meet is starting their own initiative these days?\n\nI worry that this stems from a short-sighted application of (4) coupled with current funding incentives.\n\nIf you're trying to identify the Most Important Work TM, and you have to choose between existing organizations and some new, perfect project that you've dreamed up--precisely tailored to your skills, and highly counterfactual (after all, this new initiative doesn't exist yet!)--the latter will often look like your best option.\n\nIf that weren't enough, you'll likely have ample access to startup capital these days. If anything, it'll be easier to secure funding than to get an offer at one of the leading organizations that exist already.\n\nYou'll also be your own boss! And people will think you're cool. They'll even call you \"agentic.\"\n\nBut I think that misses a few obvious things:  \n\n- that working alongside other talented people is how you learn and generate feedback--that's especially valuable in your early career\n\n- that outsized success often requires a cluster of rockstars--both because no one person is stellar in all the things you need for a successful org + because there are outsized returns to acting nimbly and quickly, which often requires multiple hands\n\n- that most projects are worse than they seem at the outset; it's a lot easier to evaluate value and potential for existing projects \n\n- that there are returns to scale, especially re: organizational competency and admin\n\n- often times the best opportunities require longterm relationship building or wisdom honed in a specific environment--being brand new to a space puts you at a disadvantage in a lot of spaces and makes you less likely to identify or be looped in on the best opportunities\n\n- that existing orgs often have more great opportunities than they can meet, and that value is sitting there waiting for someone to stand up a new vertical -- I often think these opportunities look far more promising and much more grounded in facts on the ground than many of the pitches I hear for new orgs\n\nThere are also some ecosystem level costs to this ~everyone founds their own project approach:\n\n- the best people get spread out and atomized\n\n- the best orgs struggle to compete for this talent \n\n- you end up with a bunch of failed founders who have less training + less developed networks + are less legible to others in their field -- if this were a business context, I'd be less worried; but there aren't natural feedback loops for non-profits\n\n- you turn everyone into founders and org-builders, when in fact, only a portion of them want to develop that skillset or are cut out for it\n\nLeave it to an incumbent to lament people starting their own projects. But I feel like we're all witnessing the most talented, ambitious, agentic people we know be dispersed to a million new projects. \n\nSome of those projects sound great, but I worry that the current environment is incentivizing more independent efforts than are justified or sustainable."}, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116316059267690710", "url": "https://x.com/sethlazar/status/2116316059267690710", "text": "@pvncher @thsottiaux 01a0bbe0-b58a-77b0-b42b-acb1b25ca161 thanks!", "created_at": "2026-10-30T23:47:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "pvncher", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116576933039518177", "url": "https://x.com/sethlazar/status/2116576933039518177", "text": "Heads-up: stacking paid accounts on one machine for extra Codex usage can now get you locked out.\n\nOpenAI's new help page on card and device limits:\n- One device can only use so many paid accounts (Go, Plus, Pro 100/200/500)\n- Hit it and you see \"Device limit reached\" at sign-in, or get signed out later, even if the purchase went through\n- Signing out of another account doesn't free a slot\n- Business, Enterprise, Edu and Free don't count toward it\n\nThis lands the same week multi-account switching shipped on mobile, so check before you buy a second sub. The sanctioned route to more usage is credits under Usage & Billing in the Codex app.\n\nhttps://t.co/hxG6BPmVuc", "created_at": "2026-10-31T17:03:59+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CodexUpdate", "rt_author_name": "Codex Update", "likes": 804, "retweets": 34, "media": [], "quoted": null, "fetched_at": "2026-10-31T19:18:57.038379+00:00"}, {"id": "2116918650284183696", "url": "https://x.com/sethlazar/status/2116918650284183696", "text": "Illegitimate algorithmic governance strikes again. This trend (which requires some nuance, to be clear) could be at least as important for the future of democracy as the dangers associated with authoritarian misuse and ai assisted autocratisation.", "created_at": "2026-11-01T15:41:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 4, "media": [], "quoted": {"author": "AnthropicAI", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://t.co/18j6zdHub4"}, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2116738203679932636", "url": "https://x.com/sethlazar/status/2116738203679932636", "text": "Been warning about this since at least Jan 2023! Algorithmic governance by  private corps will always end up being illiberal in these ways.", "created_at": "2026-11-01T03:44:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 1, "media": [], "quoted": {"author": "BrianRoemmele", "text": "“Anthropic orders Al tool Claude to stop remaking video games”\n\n“Update: Anthropic has confirmed it's released an update to Opus 5.5 to \"steer\" Claude Code away from 'recreating someone else's specific game.\"\n\nAn interesting cohort over at Anthropic. Fun times after the IPO. https://t.co/Odt9cP4axp"}, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2116634145497424199", "url": "https://x.com/sethlazar/status/2116634145497424199", "text": "Everyone in AI is talking about biorisk, cyber, agent swarms. What about this risk: Political leaders who disdain democracy form reciprocal billion-dollar dependencies with AI leaders who abhor democracy. What follows is AI-powered surveillance and political entrenchment. Let's talk about it.  #AISafetyRequiresDemocracy", "created_at": "2026-10-31T20:51:20+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattbotvinick", "rt_author_name": "Matthew Botvinick", "likes": 147, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2116633098976645434", "url": "https://x.com/sethlazar/status/2116633098976645434", "text": "@michele_loi Without the resets codex would be unusable for me. Claude I never run out with ¯\\_(ツ)_/¯", "created_at": "2026-10-31T20:47:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "michele_loi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2116979118013067468", "url": "https://x.com/sethlazar/status/2116979118013067468", "text": "@Surveil__Lance There is a fine line between defensible safety guardrails, and a whole system of private enforcement of (a company’s interpretation of) the law. Illegitimacy stems from lack of authority for certain kinds of decisions to procedural limitations of fully automated enforcement. Nb the combo of this announcement with the one about reverse engineering games before.", "created_at": "2026-11-01T19:42:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-01T19:41:50.876536+00:00"}, {"id": "2117331331889951153", "url": "https://x.com/sethlazar/status/2117331331889951153", "text": "Join us for our Fall Mentorship Workshop!", "created_at": "2026-11-02T19:01:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OptimistsInc", "rt_author_name": "Jess Sorrell", "likes": 12, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117115558164664452", "url": "https://x.com/sethlazar/status/2117115558164664452", "text": "Wonderfully said. AI is changing and will continue to change the value proposition of TCS researchers, but the uncertainty of the future isn't wholly a product of forces outside of our control. There is also uncertainty over our collective decisions as a research community. We have agency in how we adapt to technological change, and we should earnestly engage with questions of how we can and should shape the near-term future of our field. Who knows what the future holds, but there is quite a bit of work to do *right now* (though maybe it can wait until after the STOC deadline).", "created_at": "2026-11-02T04:44:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OptimistsInc", "rt_author_name": "Jess Sorrell", "likes": 30, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117000091332653380", "url": "https://x.com/sethlazar/status/2117000091332653380", "text": "@Surveil__Lance Yeah pls see the \"this trend, which requires some nuance\" point. I've written at length about the main point you make—about how a company is entitled to restrict the use of their products in various ways—and the point is just that it's a slippery slope, and the more private governance there is, and the more essential the tool becomes, the closer we shade to what I'm describing. If you'd like to have a look, some of my stuff is up open access on arxiv, e.g. the \"automatic authorities\" intro paper, \"legitimacy, authority, and democratic duties of explanation\", and \"governing the algorithmic city\".", "created_at": "2026-11-01T21:05:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117655112311287962", "url": "https://x.com/sethlazar/status/2117655112311287962", "text": "Cosmos is hiring a chief of staff who'll act as @Brendan_McCord's right hand across the Institute, @cosmos_vc, a book and a major new higher education program.\n\nAfter two years, we'll back you to found something or place you at a top company.\n\nLearn more: https://t.co/AcfIsj9PcI https://t.co/ylNXAd6ssB", "created_at": "2026-11-03T16:28:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "rt_avatar": "https://pbs.twimg.com/profile_images/1825967636561141760/erPVXYJG_normal.jpg", "rt_id": "2117641538591441388", "likes": 43, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNfwc0aYAE8BWn.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117478810551542006", "url": "https://x.com/sethlazar/status/2117478810551542006", "text": "@AndyMasley in the dark", "created_at": "2026-11-03T04:47:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "reply_to_id": "2117478783431360781", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117478783431360781", "url": "https://x.com/sethlazar/status/2117478783431360781", "text": "@AndyMasley brought to you by andy lying on his bed reading his kindle :)", "created_at": "2026-11-03T04:47:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AndyMasley", "reply_to_id": "2117476715010326844", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117476563264442373", "url": "https://x.com/sethlazar/status/2117476563264442373", "text": "Today’s @NYMag cover story was written in partnership with @ReadTransformer. \n\nMany of the industry’s most powerful figures avoid the limelight. Others are just so eccentric, or so extremely fascinated with some suddenly pivotal niche, that they tend to bypass mainstream awareness. But that doesn’t mean they’re any less important than the tech critics and pioneers who are household names. \n\nWe thought it was important to identify the people determining the future of AI that often go overlooked. With how quickly AI is moving, and the risks involved, it’s probably time you get to know who they are. \n\nPick up a copy on a news stand near you!!\n\nhttps://t.co/pq3xmUWji1", "created_at": "2026-11-03T04:38:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "vronirwin", "rt_author_name": "Veronica 💫", "rt_avatar": "https://pbs.twimg.com/profile_images/2052389061491322884/2s5jKw1r_normal.jpg", "rt_id": "2117395386935464381", "likes": 16, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJ_iR_XwAAQw6_.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWJ_iSAXkAAvVDm.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117464577265066095", "url": "https://x.com/sethlazar/status/2117464577265066095", "text": "nice to see an example of such exquisite *human* ingenuity (tho presumably astra will be able to do this based on these instructions now...)", "created_at": "2026-11-03T03:51:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "slimer48484", "text": "I am in awe. This guy discovered a way to locate any audio clip by matching aircraft doppler curves against flight data. INSANE. https://t.co/y9Vq2NWbdj"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117444024780886086", "url": "https://x.com/sethlazar/status/2117444024780886086", "text": "I cannot recommend this opportunity enough to anyone who wants to get into AI policy.\n\nI came to the fellowship earlier this year with a deep resume and some recent exposure to emerging tech issues, but I was no policy expert, and surely not an AI one at that. @GovAIOrg gave me the tools, information, access to experts, access to smart colleagues, etc., that put me in a position to land where I am. It's rare in life that you can get time to learn from others, build a network, and work on personalized growth while also getting paid to do it!\n\nOn top of it all, I can keep counting on the support and friendship of those still at GovAI and the alumni network of fellows I met. Apply today!", "created_at": "2026-11-03T02:29:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JasonBakerJB", "rt_author_name": "Jason Baker", "rt_avatar": "https://pbs.twimg.com/profile_images/2106361837344198656/7XADY6Kz_normal.jpg", "rt_id": "2117259412813271471", "likes": 257, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117408783903117751", "url": "https://x.com/sethlazar/status/2117408783903117751", "text": "A couple of our (3) reviews for @RealAAAI Alignment track were clearly one-shotted with an LLM contrary to policy (not part of the official experiment). And they clearly prompted the models to act like the worst kind of reviewer two. It's genuinely the worst of both worlds: you're not getting actual engagement from another human, but you're also not getting the benefits of actually decent LLM review (which is good for some things, not others—doesn't have much of a sense of which problems are real/serious and which don't matter; also don't really understand what makes something a significant contribution). \n\nOur rebuttal: \"we're not going to engage with reviews produced by LLMs\". \n\nMercifully, we had a third review, clearly by a human, which while critical made sensible points that will help us to improve the paper. Whoever that person is: we salute you; if we'd had a full house I'd have gone joker.\n\nBut seriously, what are we doing here people. If you are using LLMs to write your reviews (and I can guarantee that some of you are, because in my experience this year a very significant fraction of people are), then you are destroying the structures that make your work possible. If you don't have enough time to do your work properly, then say no. Everyone is under pressure. That's no excuse for undermining our intellectual infrastructure so casually.", "created_at": "2026-11-03T00:09:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117715014337335509", "url": "https://x.com/sethlazar/status/2117715014337335509", "text": "I'm recruiting a PhD student this year! The lab focuses on how people and LLMs differ and how they interact, as well as the impacts LLMs are having on our cognition and society. Please share with anyone interested and see our website for more: https://t.co/zrDsMApW72", "created_at": "2026-11-03T20:26:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "camrobjones", "rt_author_name": "Cameron Jones", "rt_avatar": "https://pbs.twimg.com/profile_images/1978888421452963840/Qbkz5Zuu_normal.jpg", "rt_id": "2117614523100139684", "likes": 41, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117995872961081469", "url": "https://x.com/sethlazar/status/2117995872961081469", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T15:02:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2117963022434001035", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117835235140247686", "url": "https://x.com/sethlazar/status/2117835235140247686", "text": "https://t.co/GZsm8knmEe", "created_at": "2026-11-04T04:24:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "dylanmatt", "rt_author_name": "dylan matthews 🔸", "rt_avatar": "https://pbs.twimg.com/profile_images/1536358661387390976/yJWvS7NI_normal.jpg", "rt_id": "2117819901671047310", "likes": 186, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQB-dqW8AE8_8q.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117784171405820157", "url": "https://x.com/sethlazar/status/2117784171405820157", "text": "I wish everyone could experience firsthand what we've been seeing in AI/ML, at the scale we've been seeing it, before they weigh in on how obviously better science is going to be now.", "created_at": "2026-11-04T01:01:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JessicaHullman", "rt_author_name": "Jessica Hullman", "rt_avatar": "https://pbs.twimg.com/profile_images/1996742504369033216/sxIXeGLv_normal.jpg", "rt_id": "2117671990362529897", "likes": 104, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117749585627996180", "url": "https://x.com/sethlazar/status/2117749585627996180", "text": "yep", "created_at": "2026-11-03T22:43:41+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "paraschopra", "text": "I replicated this with Claude Code!\n\nIt took a live webcam 7 km south of Southampton, UK and predicted its location purely from doppler effect in audio spectrogram + open-source aircraft location data.\n\nLo and behold, the predicted location (heatmap) peaks at actual location where webcam is situated.\n\nIt's crazy that this works at all, and crazier still I replicated it within a few hours."}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118070941263819148", "url": "https://x.com/sethlazar/status/2118070941263819148", "text": "New CS+Philosophy paper! 📰\n\nAre language models rational?\n\nThis is a key question for *theory of interpretability*. It would be convenient to use the equation “behavior=beliefs+desires” when explaining LLMs, but can we treat LLMs as rational things? Do coherence norms apply?\n🧵 https://t.co/MZJh8AKsye", "created_at": "2026-11-04T20:00:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "peterbhase", "rt_author_name": "Peter Hase", "rt_avatar": "https://pbs.twimg.com/profile_images/1977473608587894784/1354aIPo_normal.jpg", "rt_id": "1798741915388846331", "likes": 269, "retweets": 67, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/GPZpd_-aQAAN3fn.jpg"}], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00"}, {"id": "2118132147680637037", "url": "https://x.com/sethlazar/status/2118132147680637037", "text": "Understood. I'll follow these workplace instructions.", "created_at": "2026-11-05T00:03:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115823512204300696", "url": "https://x.com/robertwiblin/status/2115823512204300696", "text": "We still have spots open at the AI Horizons Forum—applications close Nov 30!\n\nhttps://t.co/bZetIZ8MtV\n\nSince this last post, it's become clearer that talent is AI safety's biggest constraint, and we want this event to help people enter the field.\n\nMost attendees will still already be working in AIS and I expect will get a lot of value from connecting with each other, but we’re increasing the number of attendees who are talented, informed and looking to enter the field, and adding programming to connect them with opportunities. \n\nI hope to see you there!", "created_at": "2026-10-29T15:10:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Ollie_Base", "rt_author_name": "Ollie Rodriguez", "likes": 93, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116190952427843760", "url": "https://x.com/robertwiblin/status/21161909524278
