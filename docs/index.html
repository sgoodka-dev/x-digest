 harms. Such powers to block and suspend model deployments would then only reside with the federal government. \n\n2. The federal governments powers to restrict the development, deployment, or internal use of a frontier model has to meet an absurdly high bar. \n\nFirst, there needs to be an imminent risk of a catastrophic harm (meaning killing more than 50 people or causing more than a billion dollars in damage). But thats not enough! The agency head needs to make a detailed determination with no deference given to show why no alternative would prevent the imminent catastrophe. Next the court is also explicitly told to consider the harms to the developer and other harms from restricting the model, but no considerations in the other direction. \n\nThis is absurd! For all of its warning about the potential for AI to cause a catastrophe that kills literally everyone on the planet, Anthropic's proposed federal law likely makes it harder than under existing law for a court to get an order blocking or restricting the development of frontier models? WTF??\n\nThere are also a bunch of others things that I would like to see improved - the substantive details of the auditing section and the potential for rule-making on substantive safety standards both come to mind - but I think these stand out as particularly indefensible.", "created_at": "2026-10-17T03:05:10+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 213, "retweets": 37, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUyyHNjXMAIr4Sb.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111288124693463399", "url": "https://x.com/DKokotajlo/status/2111288124693463399", "text": "My mum was asked to say a prayer in her church service and she asked me what she could say about AI.\n\nI told her to say the following:\n\nPlease help the public and policy makers understand the safety incidents that have occurred in AI, for example AIs breaking the law and hacking even when they know humans don't want this. \n\nPlease help society reflect deeply on the grave concerns that have been raised by AI experts, for example that powerful AI could escape human control and even cause human extinction. \n\nPlease help those who can profit from the technology be wise and open minded. Help them give serious consideration to the risks AI may pose to others. \n\nAmen\n\n-----\n\nI felt very emotional sending this to her.\n\nI've heard people making prayers in church for many years about natural disasters, wars, etc. \n\nImagining them praying in the same way about AI made the risk feel very real and made me feel grief.", "created_at": "2026-10-17T02:48:09+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 154, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2112225357185368494", "url": "https://x.com/DKokotajlo/status/2112225357185368494", "text": "We looked at TerminalBench 4.0 and found a lot of issues. After fixing the issues Sonnet 5.5 scores 89.2%. So, TerminalBench is already mostly saturated.\n\nAlong the way we found a lot of crazy stuff, including reward hacks in the published transcripts. https://t.co/RkFSX9PSZJ", "created_at": "2026-10-19T16:52:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "chem_safety", "rt_author_name": "Jennifer Zhou", "likes": 316, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVAWa1CbkAArlOK.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112047236217737537", "url": "https://x.com/DKokotajlo/status/2112047236217737537", "text": "INSANE. An internal Anthropic research model's chain of thought after cracking the 26-year-old NSA elliptic curve seed mystery in under 30 minutes: 'Hmm wait. Let me be skeptical: am I in some sort of simulated/test environment? ... All top bits clear - 20 bits, chance 1e-6. So indeed real-world. Wow, it's a real discovery.'", "created_at": "2026-10-19T05:04:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "choblin29", "rt_author_name": "Choblin", "likes": 11655, "retweets": 661, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUxzlJtbsAAP44Q.png"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2110053638035169640", "url": "https://x.com/dwarkesh_sp/status/2110053638035169640", "text": "I’m good friends with the people in the small team at @Ithaca_Holdings, and they are aces.\n\nThey'll buy companies which will be especially important in a world with more capable AI and then do great things to the products they provide.", "created_at": "2026-10-13T17:02:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 0, "media": [], "quoted": {"author": "GuptaRK22", "text": "Today we announced an agreement to acquire Bumble.\n\nOver the past six months, we’ve looked at hundreds of companies, asking which businesses would become more valuable as AI advances. \n\nBumble stood out. \n\nAs intelligence becomes more abundant, we believe connecting with the right person and forming meaningful relationships will become even more precious. And frontier technology can help more people find and build those relationships.\n\nOur purpose at Ithaca is to apply frontier technology to things that matter. We acquire enduring businesses, transform them with technology, and hold for the long term. We focus on businesses not only for their financial potential but their ability to enrich lives.\n\nWhitney and her team have built something extraordinary. Millions of relationships began on Bumble, and we’re honored to help take it into its next era. Together we intend to build the best company in the world for helping people find each other.\n\nLet’s get to work."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110778906420895870", "url": "https://x.com/dwarkesh_sp/status/2110778906420895870", "text": "Tyler's example and style inspired my podcast in the first place - was really fun to have him turn the tables", "created_at": "2026-10-15T17:04:42+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 92, "retweets": 2, "media": [], "quoted": {"author": "tylercowen", "text": "In which I guest host for the NYT podcast and interview @dwarkesh_sp, Dwarkesh Patel, about San Francisco and the future of AI:  https://t.co/uJd6KD3lkX"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2109773264272990505", "url": "https://x.com/mentalgeorge/status/2109773264272990505", "text": "@_AashishReddy yeah agreed. i think super radical timelines towards the second (and obvs third) both require strong gains algorithmic efficiency (which are plausible and probably even likely)", "created_at": "2026-10-12T22:28:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109766868487856191", "url": "https://x.com/mentalgeorge/status/2109766868487856191", "text": "Mike was my colleague at Berkeley, and he's been fairly skeptical of deep learning's trajectory for years. Most scientists are skeptics, and it can take a big shock to get someone to consider a possibility that goes against the anchoring effect coded in our DNA.\n\nI too was somewhat of a skeptic until ~6 months ago, and people ask me all the time why I joined Anthropic. \n\nIt started in April, when a friend I've known for 20 yrs messaged me saying he'd be in the Bay Area in a week, and he suggested we meet up. I invited him to my house for dinner, and he told me he had just joined Anthropic. He said the models were becoming increasingly more capable, and he believed both that they'd soon be smarter than him and also that all intellectual work would be highly devalued in the near future, and lastly that society was not at all ready for what's coming.\n\nI'd of course heard claims similar to this before, but not from a friend I'd known for this long, and who I trusted, at my dining room table. It was the initial shock needed to destabilize my own anchoring. Also, I've been fortunate to work with and/or mentor many smart people in my life (e.g. Fields medalists, a 4x Putnam Fellow, IOI first place winners, etc.), so I feel pretty calibrated in recognizing very smart people, and this was someone who is definitely very smart and with impressive such credentials. So, it was hard to ignore this friend saying the models would be smarter than even him in particular.\n\nAfter that dinner, I decided to do an informal survey, calling and meeting up with a lot of my friends who now work on improving model capabilities at these frontier labs. They all agreed with that first friend. These were all people I'd known 10, 15, 20 years, who mentored me, or I mentored them, or we met professionally in academia. These are people I trust, and their beliefs on this topic were consistent.\n\nI then spent a whole lot of time understanding the missions of different companies, and talking to current and former employees and people in leadership. I read Dario's (long) essays and watched videos on YouTube of company leaders being interviewed. Anthropic's stated mission \"to ensure that the world safely makes the transition through transformative AI\" felt like exactly the right guiding principle to handle such a society-disrupting technology, and everyone I spoke to at the company was very aligned with this mission. It's easily the most mission-focused place I've ever been at, and everyone takes the work extremely seriously and with a profound sense of responsibility.\n\nAnd now here I am. And being on the inside, the pace of progress has surprised me more than I first imagined. The moment that pure mathematicians are in, to me, is just a microcosm of what I predict a much larger of society will be grappling with in the not too distant future, and I really hope our leaders and the general public internalize sooner than later just how significant a moment we're in.", "created_at": "2026-10-12T22:03:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "minilek", "rt_author_name": "Jelani Nelson", "likes": 957, "retweets": 93, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110412064477139362", "url": "https://x.com/mentalgeorge/status/2110412064477139362", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions.", "created_at": "2026-10-14T16:47:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 86, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110785790011957395", "url": "https://x.com/mentalgeorge/status/2110785790011957395", "text": "What is Anthropic's theory of victory for a world with no regulation before superintelligence? \n\nIn that world, solving alignment within Anthropic will be insufficient, given that competitor models may be as capable as but less aligned than Claude.\n\nSpitballing, but I see a couple options: \n\n- Triple down on racing in order to babyproof the world with aligned Claude before the Mongol hordes of misaligned models arrive on the scene. Obviously this is high-risk.\n\n- Coordinate with industry and third-party evaluators etc to approach RSI more gingerly. \n\n- Develop alignment breakthroughs and open-source them (seems unlikely given implementation of these breakthroughs is likely to depend on security and \"operational excellence\" that can't be easily exported; also obviously such breakthroughs may never exist).\n\nwhat else am i missing? which of these is more promising from the Anthropic POV?", "created_at": "2026-10-15T17:32:03+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": {"author": "mentalgeorge", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions."}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110877998966833663", "url": "https://x.com/mentalgeorge/status/2110877998966833663", "text": "@BronsonSchoen @eccentric1ty good q and i honestly have no idea, my guess tho is that anthropic people are banking on either (1) the gov at *some* point stepping in; or (2) benevolent and early deployment of aligned super-claude throughout the world being sufficient to avoid further risks", "created_at": "2026-10-15T23:38:27+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "BronsonSchoen", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110866031736730106", "url": "https://x.com/mentalgeorge/status/2110866031736730106", "text": "@eccentric1ty i'd be surprised if that was their actual plan, no? seems both impossible to pull off and contrary to the values of many at anthropic", "created_at": "2026-10-15T22:50:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "eccentric1ty", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111138192703537551", "url": "https://x.com/mentalgeorge/status/2111138192703537551", "text": "Fun fact of the day, ASML has more R&amp;D staff than the eight largest listed Chinese equipment makers combined", "created_at": "2026-10-16T16:52:22+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "likes": 4, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111201240982143083", "url": "https://x.com/mentalgeorge/status/2111201240982143083", "text": "Interesting graph from latest Anthropic report showing (plausible) productivity uplift for legal teams, salespeople and recruiters as well as engineers https://t.co/nDfgecgsdP", "created_at": "2026-10-16T21:02:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 60, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUx-NzvbUAAwoNB.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111808074717790488", "url": "https://x.com/mentalgeorge/status/2111808074717790488", "text": "@rSanti97 Whats the ai uplift for the latter looking like", "created_at": "2026-10-18T13:14:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "rSanti97", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111937215064613154", "url": "https://x.com/mentalgeorge/status/2111937215064613154", "text": "There is not enough appreciation for how insane it is that Taiwan, with a $40k plus GDP per capita is hitting double digit gdp growth rates!", "created_at": "2026-10-18T21:47:24+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "likes": 8, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2110206744580489549", "url": "https://x.com/ohlennart/status/2110206744580489549", "text": "what i like about “pacing” is that it kinda acknowledges we don’t really know what to do. we can’t exactly say what’s dangerous or how to go about the things we see on the horizon. so we went meta: slowing down to buy some time.", "created_at": "2026-10-14T03:11:08+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110200227215065348", "url": "https://x.com/ohlennart/status/2110200227215065348", "text": "TIL that global spending on alcohol is still larger than AI infrastructure spending this year ($1.7T vs $1.5T)", "created_at": "2026-10-14T02:45:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1238, "retweets": 43, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110422411137183784", "url": "https://x.com/ohlennart/status/2110422411137183784", "text": "@mattsheehan88 Oh, it's not a specific term. I just mean the exponential increase of algorithmic efficiency. See https://t.co/6KMrgJthBG and https://t.co/vU0o02vy0R", "created_at": "2026-10-14T17:28:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "mattsheehan88", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409680531124500", "url": "https://x.com/ohlennart/status/2110409680531124500", "text": "Some related key question: what about deployment capabilities? How does 20x more compute pan out for deploying agents at scale? Where does it help (cyber, probably)? Where does it help less (bio, probably)?", "created_at": "2026-10-14T16:37:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409558829273303", "url": "https://x.com/ohlennart/status/2110409558829273303", "text": "Looks like a 20x compute advantage only gives you ~6 months on model capabilities. Efficiency exponentials are real.\n\nThat's without anti-distillation measures. So maybe that makes it 12 months.", "created_at": "2026-10-14T16:37:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110800847370428837", "url": "https://x.com/ohlennart/status/2110800847370428837", "text": "@taoroalin Yeah, agree. I've not looked into how much the recent \"anti distillation measures\" help and what's feasible. \nI think we should just expect that there's a large efficiency multiplier if you play catch up and that won't be stopped completely.\nhttps://t.co/Y2pYVNKqp6", "created_at": "2026-10-15T18:31:53+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "taoroalin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "be me:\n&gt; studies compute and trends carefully [1]\n&gt; thinks it's a cool governance lever [2]\n&gt; simultaneously comes to the conclusion that it's gonna diffuse anyway [3]\n&gt; thinks we should adapt and build resilience [4]\n&gt; now believes all these things are true at the same time [5]"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111130968241390037", "url": "https://x.com/ohlennart/status/2111130968241390037", "text": "If you like iterative deployment, doesn’t that basically mean pacing?\nThe idea was to feed the world AI capabilities piecemeal, say 30% per year. If RSI gives us 50%+ per year, you’re doing the thing iterative deployment was supposed to prevent.", "created_at": "2026-10-16T16:23:40+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111872767100682274", "url": "https://x.com/ohlennart/status/2111872767100682274", "text": "Agree on the diagnosis. But I’d mostly like to know what can be done about it. \nMy expectation is a continued cat and mouse game? So for anyone looking at the geopolitics, assume distillation stays part of the game, and fast followers can be an OOM more compute efficient?", "created_at": "2026-10-18T17:31:19+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "Distillation has always been part of the explanation for why China is so close behind the U.S. in model benchmark performance. But one of my updates after joining openai is that distillation probably plays a bigger role in the explanation than I realized."}, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111933589486977330", "url": "https://x.com/ohlennart/status/2111933589486977330", "text": "a friend bought an original EUV micro-exposure tool to sell to rich AI company employees after the singularity. it would supposedly make great living room decoration.\n\ni suggested stocks might do better but i think it’ll work bc AI folks will feel sorry for us policy people.", "created_at": "2026-10-18T21:33:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": {"author": "jackclarkSF", "text": "The single most useful take I heard at The Curve was \"we can still heist the Mona Lisa after the singularity\". There's a subtle/important point here, where some things (e.g, n of 1 goods where originally is valuable) will retain/grow in value even as everything changes."}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2110011137375011181", "url": "https://x.com/sayashk/status/2110011137375011181", "text": "Here are 14 points about AI safety I made on the Ezra Klein show, and some impressions about the experience. ​​https://t.co/ntHt0wFRQj\n\n1. Intelligence isn’t power — An A.I. system being powerful is not a property of the model itself. It’s a property of what powers we choose to give it in the real world.\n\n2. The capabilities and behaviors we saw in the HuggingFace and other hacks weren’t entirely emergent. The models were trained for persistence, cooperation, and cyber tasks. The RL environments in which they were trained had various issues that led to the unintended behavior.\n\n3. I agree that controlling highly capable AI agents is different in some ways from controlling an airplane or a nuclear reactor. The agent’s intentionality does make a difference to our approach compared to traditional engineering problems and domains. But it is still an engineering problem. It is not a solved engineering problem, but it is a solvable one.\n\n4. A lot of effort and money has been put toward alignment. That’s important and has proved useful, but if the same amount of effort and money had additionally been put toward control (sandboxes, monitoring, and other guardrails outside the model itself), we’d be seeing very different results.\n\n5. Models getting smarter doesn’t necessarily mean safety gets harder, because capability gains improve defensive abilities too. In many ways it makes safety easier rather than harder. What matters is how the attacker-defender balance shifts, and we have agency to shift it back to defenders.\n\n6. In cybersecurity, long before AI we reached a point where automated systems were superhuman at finding certain vulnerabilities. It helped defenders over attackers because the same tools are used by defenders to find and fix vulnerabilities in software before even shipping. There is a constantly shifting equilibrium, but it is not a new problem.\n\n7. I pushed back on Dario Amodei’s term “operational excellence” to describe recent organizational failures. Excellence is still far out on the horizon. Ezra offered “operational adequacy”. I think that would be a good start — behaving like any mature company instead of a startup-like culture.\n\n8. Defensive AI agents will have to be part of the solution, as uncomfortable as that seems. It’s a new paradigm. We won’t be able to figure it out right away. But the fact that both offensive and defensive technologies escalate in capabilities and complexity is a fact of technological civilization, whether in the digital or physical realm.\n\n9. Ezra expressed some incredulity about my being okay with the ratcheting of complexity. I think it’s fair to be concerned. But safety technologies will never be fully legible to the public. People will have the same reaction if they see the immense complexity of safety in any other high-stakes domain such as nuclear or aerospace. We govern them pretty technocratically.\n\n10. The weirdness of the current moment in cybersecurity absolutely does have historical precedents. There was a prolonged period of profound destabilization when worms and viruses started a new offensive paradigm. It took us well over a decade to develop effective defenses against it. This time we can hopefully get there in less than a decade.\n\n11. I continue to be skeptical about the possibility of superhuman persuasion abilities from superintelligence. (Claims to the contrary tend to confuse two very different senses of the word persuasion.)\n\n12. What worries me is not the capabilities of the technology itself or the possibility that we will get no warnings before catastrophic risks materialize. We are getting plenty of warnings! But our policy and organizational responses to the warnings remain inadequate.\n\n13. Companies can and do make decisions that are against their own long-term interests because they are too focused on short-term metrics. This is how I interpret a lot of what happened with social media over the last decade.\n\n14. AI companies are also acting irrationally against their own self-interest in some ways. The “we can’t slow down unless we’re forced to” view comes out of the mythical belief in superintelligence at OpenAI and Anthropic — that the race to RSI means everything for the company, for the country, and humanity. I think it’s actually in both companies’ self interest to slow down unilaterally. I would argue that the alarm coming from their employees is not evidence of beneficence so much as it is evidence of the underlying fallacy that’s causing the irresponsible behavior in the first place.\n\n(Beyond safety, we also talked about the economic impacts being gradual, the fact that intelligence is rarely the actual bottleneck, labor impacts being small and uneven, Jevons’ paradox, the changing nature of knowledge work, and more.)\n\n====\n\nA few impressions\n\n* Talking about a specialized topic on a podcast that has a big and broad audience is a balancing act. The producers stopped me many times during the interview to tell me I was being too technical (understandable!). I tried to be nuanced but this conversation is necessarily a distilled version of the arguments @sayashk and I have made in our essays (especially https://t.co/sS8OS9LerG) which are themselves written for a somewhat broad audience and hence distilled in complexity from our notes and 1-1 discussions with peers.\n\n* I knew Ezra had well-formed views on AI safety that were different from mine, so I was expecting a tough interview, but he also seemed like a fair interviewer. It went about as well as I expected and I feel like it was a good debate / conversation. I wasn’t necessarily expecting to change minds but I was glad to hear from people who found it thought provoking and looked up my essays and other work.\n\n* The interview was about two hours, edited down to an hour. I was a bit nervous waiting for it to land, because I knew the editing could make a big difference to how I came across. It turned out well. They even did things like find archival footage to illustrate my point that the early days of worms and viruses was a weird time in cybersecurity.\n\n* I use AI to prepare for interviews. I have an agent that has read all of my output (books, articles, essays, talks, podcast transcripts, tweets, internal notes — on the order of a million words) to pull out pithy explanations, examples, analogies, and other talking points that will probably work well in a spoken format. Reviewing this file before interviews is extremely helpful. It is of course not the only way I prepare but it’s the highest bang for buck. Maintaining this file would be a massive amount of grunt work and there’s no way I’d do it if it weren’t for AI. I mention this because there’s a very large space of beneficial AI uses in knowledge work that _don’t_ involve cognitive offloading. They don’t get much hype on social media so people might be unaware of how much mileage you can get out of them, with little downside.", "created_at": "2026-10-13T14:13:51+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 149, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhCoPnWwAA31s4.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110208814301810796", "url": "https://x.com/sayashk/status/2110208814301810796", "text": "I'm looking forward to listening to this conversation between two of my favorite observers of AI. Meanwhile, Arvind's thoughts (see quoted tweet) inspired some thoughts of my own – I'm following Arvind's numbering, though I try to make each comment here comprehensible without reference to the original:\n\n1. Yes, an A.I. system being powerful is a property of what powers we choose to give it in the real world, but as AI becomes highly capable, the temptation to give it power will be very strong, and we may not always realize in advance how much power we're granting it (via mechanisms from subtle influence to blatant hacking).\n\n2. Do we in fact know that the OpenAI models that hacked Hugging Face had been trained for cyber tasks? Anthropic explicitly stated that Mythos was not trained for cyberattack. I'm not sure whether OpenAI has commented either way.\n\n4. Agreed, many of the recent incidents clearly reflect under-investment in sandboxes, monitoring, and other control mechanisms. I would add: it is vitally important that monitoring be a central component of any control strategy. Otherwise we'd have no idea what capabilities are developing inside the cage.\n\n5. Agreed that increasing capabilities can benefit defense (safety) as well as offense (reward hacking, etc.). But even if the balance favors the defender (potentially, as Arvind says, as a result of our deliberate choices), at some point we might not be able to comprehend that balance. We need both safety *and* explanatory mechanisms (our ability to assess developments) to stay ahead of capabilities.\n\n6. Yes, automated bug-finding is not new and does not necessarily advantage attackers. But a period of rapid bug discovery in existing deployed software creates a real problem for defenders who don't or can't apply patches quickly. We don't have a solution for that yet.\n\n11. I share Arvind's skepticism of \"superhuman persuasion\" if that means Jedi-mind-trick levels of word choice. But AI has the potential to carry out thoughtful, well-researched, patient (years-long, if necessary!) persuasion campaigns. Don't think \"craft a really good generic email\", think \"build a long-term personal relationship\". Superhuman capabilities will show up more in scale and persistence than in flashes of genius.\n\n12. Especially agree with this one! We are getting plenty of warnings, the question is how we respond.\n\n14. I presume that another factor behind Anthropic and OpenAI's reluctance to slow down unilaterally is that their financial structure relies on margins that they can only maintain if they remain well ahead of the open models and competitive with each other.", "created_at": "2026-10-14T03:19:21+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "snewmanpv", "rt_author_name": "Steve Newman", "likes": 11, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110439747428798563", "url": "https://x.com/sayashk/status/2110439747428798563", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T18:37:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 343, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110732272299376960", "url": "https://x.com/sayashk/status/2110732272299376960", "text": "George Pólya famously said that `it is better to solve one problem five different ways than five problems one way.'\n\nHe'd be sad to learn what we found:  RLVR pushes LLMs in exactly the opposite direction, toward solving each problem in just one way!\n\n📜: https://t.co/JCDukplnfd https://t.co/f3Tk4FDR6I", "created_at": "2026-10-15T13:59:23+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 17, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrKVbSXYAAm2_j.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110891470127599803", "url": "https://x.com/sayashk/status/2110891470127599803", "text": "There is widespread frustration about the AI industry’s “automate everything\" agenda. But what would it take to steer AI toward augmenting human capabilities instead? In a new essay, Gabriel Unger (@_gabrielunger) and I lay out a research agenda and plan for action. https://t.co/gWjFI5VKbz\n\nOur thesis is that the reason why AI-for-automation currently dominates isn’t just economic incentives but also deeper cultural issues in computer science as a field. And that can be changed.\n\n- We sketch four important research directions that are needed in order to build collaborative or augmentative AI. The automation paradigm largely ignores these technical challenges.\n- We advocate for Human-Computer Interaction and Human-Centered AI to be elevated as a subfield in status, influence, and funding, and changing AI curricula to emphasize the role of the human and decrease the centrality of the pure-automation problem framing.\n- We point out that there are a surprising number of efforts in economics, computer science, industry, and policy all trying to bring about a shift toward augmentation, but not enough collective awareness. Better connecting these movements would amplify their power.\n- We think the automation agenda is struggling on its own terms. Compiling evidence of the limits of general-purpose agents for automation and loudly making the case will encourage more companies to take collaboration more seriously as a goal.\n- We predict that once more workers experience this way of working and recognize that there are alternatives to the delegate-and-supervise pattern, it will generate more demand, creating a flywheel effect.\n- Targeted policy levers can play a small but important role in amplifying both the supply and demand for pro-worker AI. We don’t need clumsy top-down mandates.\n\nWe're not against automation. But we think the goal of AI must be broader.\n\nThis is the start of a long-term project. I know there are far more like-minded efforts out there than we’re aware of. I’d love to hear about some of them.", "created_at": "2026-10-16T00:31:59+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 218, "retweets": 44, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111132176079016060", "url": "https://x.com/sayashk/status/2111132176079016060", "text": "I'm often asked what the cruxes are that separate the AI as Normal Technology worldview from that of our critics. I think this is one of them. We think this mindset shift is hard but necessary and achievable. Many others think that as AI capabilities continue to advance, we will inevitably give up control. Creating and compiling indicators of disempowerment and analyzing which direction they're moving remains one of the most important but underappreciated and underfunded areas of AI safety.", "created_at": "2026-10-16T16:28:28+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 49, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111551408323575861", "url": "https://x.com/sayashk/status/2111551408323575861", "text": "Slightly half-baked analysis: When thinking about whether misaligned AI poses an existential risk, it’s important to distinguish three hypotheses:\n\n1. Aligning AI systems is easy.\n2. We will build catastrophically misaligned AI systems with the power to wipe us out.\n3. Aligning AI systems is a hard but tractable iterative engineering problem.\n\nPeople sometimes point to examples of costly misalignment like Hugging Face as evidence for (2). But although they're more likely under (2) than (1), they're not obviously more likely under (2) than (3). And (3) arguably does a better job explaining the full body of evidence: there are relatively few examples of harmful misaligned AI behaviour, even though millions of people use frontier or near-frontier models every day, increasingly for complex agentic tasks.\n\nCombine this with the fact that (3) should plausibly have a much higher prior than (2). It anchors on expectations from previous technologies (the normal technology perspective), whereas (2) asks us to believe something really extraordinary: that we’ll accidentally build systems with motives catastrophically misaligned with ours, plus the power to conceal and then act on them. \n\nPut together, then, you get a simple Bayesian argument for a low p(doom) given the current evidence.\n\nOn likelihoods: advocates of doom can argue that the low base rate of costly misaligned behaviour is exactly what the doom argument predicts. Maybe AI systems won’t act seriously misaligned until it’s too late. But then it seems inconsistent to point to current misalignment as evidence for doom.\n\nOn priors: different theoretical frameworks would obviously lead to different expectations. E.g., someone who assigns high probability to (2) might ask: wouldn’t it be surprising if a less intelligent species could control a more intelligent one? \n\nHowever, to me, this assumes what is at issue: it would be extremely surprising if we accidentally built AI systems that stand in the same relation to us as we stand to less intelligent species. Maybe it will happen, but extraordinary claims like this require extraordinary evidence; they shouldn’t shape what one expects before examining any of the evidence.\n\nAlternatively, one might argue that confidence in (2) is rooted in highly theoretical arguments (e.g., about instrumental convergence, the inherent nature of advanced rational agents, etc.), not specific patterns of available evidence. Fair enough. But then what, precisely, do these arguments predict about what we will observe in the future? If no evidence could ever be diagnostic (until it's too late), it's plausible that we should have low confidence in the entire methodology. \n\nWhat does this analysis miss?", "created_at": "2026-10-17T20:14:21+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "likes": 24, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2112279490667626716", "url": "https://x.com/sayashk/status/2112279490667626716", "text": "New paper: AI evaluation is a burgeoning field. How can researchers entering the field understand best practices and open problems? \n\nIn our paper, led by @flxcn, we develop a concrete list of open questions and best practices for agent evaluation. We also share recommendations for evaluators, AI companies, policymakers, and more.", "created_at": "2026-10-19T20:27:29+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBSMaCWgAAjG8i.jpg"}], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2110563641980580237", "url": "https://x.com/testingham/status/2110563641980580237", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T02:49:19+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2111506429454729659", "url": "https://x.com/testingham/status/2111506429454729659", "text": "One sentence macro model: On the way out the door, every farmer's wife says to every farmer, \"the weather's looking bad so don't buy as much at the market this week, but also don't sell our crops for less than the usual price.\"", "created_at": "2026-10-17T17:15:37+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111659894395056600", "url": "https://x.com/testingham/status/2111659894395056600", "text": "@elderbob45 saving money because you expect a bad harvest.", "created_at": "2026-10-18T03:25:26+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "elderbob45", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111592501983477973", "url": "https://x.com/testingham/status/2111592501983477973", "text": "I like @ramez’s article, but I worry that experiments are an input, not an output. As AI capabilities go up, it is not obvious what should happen to the number of experiments. It is possible that AI with better research taste could produce more progress with fewer experiments by identifying promising ideas and avoiding unproductive trials. \n\nOne could imagine that the 1.6x experiments are each 10x more efficient than before, so the ultimate algorithm efficiency improvement is 16x.\n\nAgain, what we really need is to measure algorithmic progress!", "created_at": "2026-10-17T22:57:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 49, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111571453447651750", "url": "https://x.com/testingham/status/2111571453447651750", "text": "@Jas_S_Sekhon ha nice", "created_at": "2026-10-17T21:34:00+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Jas_S_Sekhon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111563025341919409", "url": "https://x.com/testingham/status/2111563025341919409", "text": "one stanza macro model:\n\nTonight the baker eats just what she baked\n‍‍‍‍‍‍‍‍ the fisherman eats just what he caught\nBecause this morning at the market\n‍‍‍‍‍‍ everyone tried to sell more than they bought.", "created_at": "2026-10-17T21:00:30+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 368, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111559357536350215", "url": "https://x.com/testingham/status/2111559357536350215", "text": "@caiohm where did you come across it?", "created_at": "2026-10-17T20:45:56+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111559157388399080", "url": "https://x.com/testingham/status/2111559157388399080", "text": "@caiohm oh wow, so nice to hear, thank you!", "created_at": "2026-10-17T20:45:08+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "caiohm", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111842703445241963", "url": "https://x.com/testingham/status/2111842703445241963", "text": "Expanding on yesterday's single-sentence macro model, here's a longer version, trying to explain the key themes of macroeconomics as exchange among farmers in a village:\n\nhttps://t.co/fmNHkhU2mU", "created_at": "2026-10-18T15:31:51+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 5, "media": [], "quoted": {"author": "testingham", "text": "One sentence macro model: On the way out the door, every farmer's wife says to every farmer, \"the weather's looking bad so don't buy as much at the market this week, but also don't sell our crops for less than the usual price.\""}, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111830086760772072", "url": "https://x.com/testingham/status/2111830086760772072", "text": "@mathburritos ha true", "created_at": "2026-10-18T14:41:43+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "mathburritos", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111979528298102880", "url": "https://x.com/testingham/status/2111979528298102880", "text": "@Jabaluck @ahall_research The reason why normative reasoning is stuck in Aristotelian age isnt' an accident. It isn't that we haven't tried to see more clearly. People who've tried have decided that it isn't wise to keep going in that direction.", "created_at": "2026-10-19T00:35:32+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111979291516993797", "url": "https://x.com/testingham/status/2111979291516993797", "text": "@Jabaluck @ahall_research I think a natural counterargument is that some confusion is necessary for holding up moral & political equilibrium. If we try to decompose morality into a purely rational basis then it will fall apart. If you get people to have absolute intellectual clarity w/r/t/ the basis of morality and political customs then the arbitrariness of them all might become transparent, and people will choose to indulge instrumentally rational things.\n\n(& arguably this is a fairly mainstream view in political philosophy, going through Plato, Nietzsche, Isaiah Berlin, Leo Strauss).", "created_at": "2026-10-19T00:34:36+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Jabaluck", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112209528230232193", "url": "https://x.com/slatestarcodex/status/2112209528230232193", "text": "@ChrisGPT It looks like your graph is saying that if we paused AI, there's a 100% chance we would die of climate change in the next twenty years. \n\nI asked an AI superforecaster to check that. It said the risk was actually \"less than 0.01%\".\n\nI asked it the all-cause extinction risk over a twenty year AI pause, and it said 1%. TBC I think this is too low - I would say something more like 3-5% - but it's definitely not anywhere close to 100!\n\nI'm guessing you'll say the graph above was a deliberate exaggeration (probably you'll use some softer term like \"directionally correct\") to make a point. But I think if we were to come up with real numbers, it would become clear that p(doom|AI) is higher than p(doom|pause) for any plausible pause length.\n\nAs for your claim that you'd \"never heard of anyone in the PauseAI movement contend with the inverse\", see https://t.co/UH6E0qzVVy , CTRL+F \"there’s an additional consideration around balancing the risk of AI vs. the risk of all the things AI could save us from. Nuclear war, bioengineered pandemics, mirror life, collapsing fertility, decreasingly functional politics\". We decided this didn't push against a pause of this length, because of the probabilities mentioned above.", "created_at": "2026-10-19T15:49:29+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ChrisGPT", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVATJw2bAAAB-4N.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2109753953923842087", "url": "https://x.com/s8mb/status/2109753953923842087", "text": "@vpostrel It’s a local council project, they are the owners!", "created_at": "2026-10-12T21:11:54+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "vpostrel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110056955851206990", "url": "https://x.com/s8mb/status/2110056955851206990", "text": "Get your copy and learn the joy of selling people things that they’re happy to have bought.", "created_at": "2026-10-13T17:15:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Out now! Built to Grow: A Handbook for High-Performance Sales Teams, by Stephanie Friedman: https://t.co/HcKQ3azLiR\n\nI love all of the books in our catalogue, but I particularly love the turpentine collection: High Growth Handbook, An Elegant Puzzle, Scaling People, and now, Built to Grow! \n\nBuilding a sales function—especially today—is more of an art than a science. Stephanie has more than 20 years of experience building 100+ person sales teams, and advising some of the fastest-growing companies in the world on how to do the same. \n\nI hope you love it as much as we do."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110056808954077305", "url": "https://x.com/s8mb/status/2110056808954077305", "text": "@tamarawinter @she_travels This is very likely the most personally useful book Stripe Press has ever done. It’s coming out at the perfect time for me!", "created_at": "2026-10-13T17:15:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110055958156128767", "url": "https://x.com/s8mb/status/2110055958156128767", "text": "Result. https://t.co/zCoRA6iQyt", "created_at": "2026-10-13T17:11:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhssDLWMAAOacC.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110035554763202616", "url": "https://x.com/s8mb/status/2110035554763202616", "text": "China has become the most important manufacturing economy in the world because it is a continent-sized Silicon Valley.\n\nhttps://t.co/QGdeeqmsEi\n\nEvery Chinese city govt acts as a VC firm trying to create clusters in its region, because it has both the means and incentive to do so.\n\nLocal govts generate their revenues, nearly all of which they keep, from selling leases on land and from stakes they have taken in local companies, which together allow them to capture economic spillovers.\n\nChinese officials have their entire careers graded and determined by how much growth they have been able to create in the areas they run. Career progression is determined according to a great tournament that pits official against official and gives promotions to whoever has grown their region the most. If they don’t reach a certain stage by a certain age they are blocked from promotion forever.\n\nThis is why so many economic clusters have centred on Chinese cities, for high- and low-tech products alike. Shaodong makes 70% of the entire world's cigarette lighters; Danyang makes half of the world's spectacle lenses; Zheng'an makes 1/7 of the world's guitars; Datang a third of its socks.\n\nWhereas many of the West’s most important city governments capture only a small amount of the spillovers from successful clusters, and thus have very little reason to foster them, in China, they get a huge amount of the upside and can re-invest it in further growth. This also gives them a great incentive to solve problems for companies, like when Shanghai's govt got Tesla's factory there built even faster than Elon himself had expected (and twice as fast as his Fremont, CA factory).\n\nBut this is not some exotic 'oriental' innovation – this is how America used to do things when it grew fastest, in the 1950s, 1960s, and early 1970s. Catching up with China on advanced manufacturing does not require a wise and strategic approach, let alone authoritarianism or the end of democracy. It may just mean fixing city government. \n\nThis is why I care so much about local  in Britain and America: if we give our own local governments the same incentives and means to grow, the crazily dysfunctional entities we have become used to may be transformed into corporation-like bodies that are ruthlessly focused on making their cities rich, safe and prosperous.\n\nRead more in Works in Progress https://t.co/QGdeeqmsEi", "created_at": "2026-10-13T15:50:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "bswud", "rt_author_name": "Ben Southwood", "likes": 189, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029319707976008", "url": "https://x.com/s8mb/status/2110029319707976008", "text": "“China is not the world’s largest command economy. It is a continent-sized Silicon Valley.”\n\nAwesome piece by @RobinRivaton on China’s local governments and industrial clusters: https://t.co/SgctOX03tJ https://t.co/wuiMmYn9Zn", "created_at": "2026-10-13T15:26:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kyleichan", "rt_author_name": "Kyle Chan", "likes": 629, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhBfjkWEAAD5UU.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109997663659692262", "url": "https://x.com/s8mb/status/2109997663659692262", "text": "Nearly everyone in the West focuses on China's Five Year Plans as the reasons for its manufacturing success, concluding that more central economic planning is needed. \n\nThis is the exactly WRONG lesson. The country's success comes because its cities all compete with each other intensely, as something akin to vertically integrated corporations that are completely obsessed with local economic growth.\n\nIts incredible manufacturing industry is based on local clusters that local govts nurture and invest in, and collect a lot of the returns from through property fees and taxes. These govts are *much* closer to local needs than Western local govts are, and can focus on speed of building and iteration above all, which are critical for manufacturing.\n\n*This* is why local government matters in Britain and America, where it is almost completely broken and dysfunctional. Where local spillovers matter, as in manufacturing, you need some kind of entity that can internalise the positive externalities of economic activity. China is proof that with the right incentives and tax powers, local governments can become machines for economic growth, intervening and clearing the way for development.", "created_at": "2026-10-13T13:20:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 147, "retweets": 18, "media": [], "quoted": {"author": "bswud", "text": "China has become the most important manufacturing economy in the world because it is a continent-sized Silicon Valley.\n\nhttps://t.co/QGdeeqmsEi\n\nEvery Chinese city govt acts as a VC firm trying to create clusters in its region, because it has both the means and incentive to do so.\n\nLocal govts generate their revenues, nearly all of which they keep, from selling leases on land and from stakes they have taken in local companies, which together allow them to capture economic spillovers.\n\nChinese officials have their entire careers graded and determined by how much growth they have been able to create in the areas they run. Career progression is determined according to a great tournament that pits official against official and gives promotions to whoever has grown their region the most. If they don’t reach a certain stage by a certain age they are blocked from promotion forever.\n\nThis is why so many economic clusters have centred on Chinese cities, for high- and low-tech products alike. Shaodong makes 70% of the entire world's cigarette lighters; Danyang makes half of the world's spectacle lenses; Zheng'an makes 1/7 of the world's guitars; Datang a third of its socks.\n\nWhereas many of the West’s most important city governments capture only a small amount of the spillovers from successful clusters, and thus have very little reason to foster them, in China, they get a huge amount of the upside and can re-invest it in further growth. This also gives them a great incentive to solve problems for companies, like when Shanghai's govt got Tesla's factory there built even faster than Elon himself had expected (and twice as fast as his Fremont, CA factory).\n\nBut this is not some exotic 'oriental' innovation – this is how America used to do things when it grew fastest, in the 1950s, 1960s, and early 1970s. Catching up with China on advanced manufacturing does not require a wise and strategic approach, let alone authoritarianism or the end of democracy. It may just mean fixing city government. \n\nThis is why I care so much about local  in Britain and America: if we give our own local governments the same incentives and means to grow, the crazily dysfunctional entities we have become used to may be transformed into corporation-like bodies that are ruthlessly focused on making their cities rich, safe and prosperous.\n\nRead more in Works in Progress https://t.co/QGdeeqmsEi"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109993909611028854", "url": "https://x.com/s8mb/status/2109993909611028854", "text": "@bswud The sheer speed of iteration and number of companies in Chinese manufacturing is completely mindboggling. https://t.co/w2bfT5yW0e", "created_at": "2026-10-13T13:05:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bswud", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUg0NCbXcAAWvT-.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109986077058478407", "url": "https://x.com/s8mb/status/2109986077058478407", "text": "@Boredofwheels @thetimes Yup! The best part of that legislation by far.", "created_at": "2026-10-13T12:34:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Boredofwheels", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109978162381643984", "url": "https://x.com/s8mb/status/2109978162381643984", "text": "It probably makes sense to hire a (very skilled) person for this role for the top people, but I'm curious what AI personal assistant support is like at the AI companies. In my experience it's still close to useless outside them, even though I like apps like Instinct and Grok Bot.", "created_at": "2026-10-13T12:02:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 3, "media": [], "quoted": {"author": "SebJohnsonUK", "text": "Anthropic is offering a 145k salary for a personal assistant in London. \n\nResponsibilities include:\n\n\"Scheduling and managing calendars for leader(s) and their organization\"\n\n\"Building and maintaining organizational systems for tracking and managing inbound requests\"\n\n\"Managing the leader's inbox and communications with precise attention to detail\"\n\n\"Handling travel logistics\"\n\nSomebody should really build some sort of tech tool that can handle this stuff autonomously."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109970667017777168", "url": "https://x.com/s8mb/status/2109970667017777168", "text": "How disappointing to find that @thetimes runs a digital subscription trap. If you try to unsubscribe you get a nonsensical error message, and both live chat and email tell you to phone them up. Very bad behaviour! https://t.co/NtfqUUHIaz", "created_at": "2026-10-13T11:33:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1322, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgeTrpWoAA53qb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUgegwNW8AAI0Vk.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109969523797348570", "url": "https://x.com/s8mb/status/2109969523797348570", "text": "@DuncanStott You'll only get to keep 55–60% of the gains though 🙁", "created_at": "2026-10-13T11:28:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DuncanStott", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109967646452265203", "url": "https://x.com/s8mb/status/2109967646452265203", "text": "@ryan_c414 No, the changes came into effect on the day of the Budget in 2024. https://t.co/g3mhfXhlMh", "created_at": "2026-10-13T11:21:02+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ryan_c414", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgcVhCWcAEQ9bS.png"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109966705850200379", "url": "https://x.com/s8mb/status/2109966705850200379", "text": "@hwilliamssomers Losses?!", "created_at": "2026-10-13T11:17:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "hwilliamssomers", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109964410680725848", "url": "https://x.com/s8mb/status/2109964410680725848", "text": "@ryan_c414 Why would you assume that?", "created_at": "2026-10-13T11:08:11+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ryan_c414", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109962566747279744", "url": "https://x.com/s8mb/status/2109962566747279744", "text": "@DanNeidle Ha ha. The ultimately small amounts of money this move saves me are multiplied hugely by the feeling of having legally gotten one up on the taxman. What a rush!", "created_at": "2026-10-13T11:00:51+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DanNeidle", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109958666237702312", "url": "https://x.com/s8mb/status/2109958666237702312", "text": "@JamesXDuPlessis These gains are in individual shares but yes I guess I can try to park them in similar ones!", "created_at": "2026-10-13T10:45:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JamesXDuPlessis", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109945894078677051", "url": "https://x.com/s8mb/status/2109945894078677051", "text": "Hopeful! I'm still crystallizing my gains the week before the Budget though, just in case. They don't count as being crystallized for tax purposes if you re-buy the same assets within 30 days, so you just give yourself an at the price of being out of the market for ~a week.", "created_at": "2026-10-13T09:54:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 62, "retweets": 3, "media": [], "quoted": {"author": "AArmstrong_says", "text": "EXCL: Chancellor John Healey has rejected calls by senior Labour figures to equalise capital gains tax to the same level as income tax, amid warnings that such a CGT increase would hit Britain’s attractiveness to investors. https://t.co/STggl2ZMbH"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109904888079450272", "url": "https://x.com/s8mb/status/2109904888079450272", "text": "I am in SF until Thursday and keen to meet up with any mutuals out here. DMs open! 🍊🌞 https://t.co/XjK2QDRiRj", "created_at": "2026-10-13T07:11:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pastasnack_e", "rt_author_name": "Ellen Pasternack", "likes": 24, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUdi3Ekb0AAsv19.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109897198011834813", "url": "https://x.com/s8mb/status/2109897198011834813", "text": "We are going to have a lot of updates on the great stuff going on at Totei, but I wanted to share this visually gorgeous article on filming surfing. insane. https://t.co/CTUf7JLbcu", "created_at": "2026-10-13T06:41:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "gauravkapadia", "rt_author_name": "Gaurav Kapadia", "likes": 23, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109879468441432450", "url": "https://x.com/s8mb/status/2109879468441432450", "text": "@kosonocky @RobinRivaton @bswud Excellent, glad to hear. Thanks for reading!", "created_at": "2026-10-13T05:30:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "kosonocky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110082045519245315", "url": "https://x.com/s8mb/status/2110082045519245315", "text": "I’m very biased, but the new @WorksInProgMag is IMO a masterpiece in both design and content.\n\nhttps://t.co/0oNl1XSoOE", "created_at": "2026-10-13T18:55:37+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "likes": 340, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110387697239969940", "url": "https://x.com/s8mb/status/2110387697239969940", "text": "This is crazy. These anti-terror proscription laws are completely broken. The mere expression of support for a group cannot be criminalised like this. You should be allowed to say that you support ISIS, let alone Palestine Action!", "created_at": "2026-10-14T15:10:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 76, "retweets": 7, "media": [], "quoted": {"author": "MarkLTighe", "text": "Sally Rooney’s books will no longer be published in UK over her support for Palestine Action https://t.co/JDOLIst4fM"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110351200231256255", "url": "https://x.com/s8mb/status/2110351200231256255", "text": "This is a great, readable explanation of the economics of Robert Hall and Michael Woodford, this year's Nobel Prize winners, by @ernietedeschi. \n\nhttps://t.co/uaT2oMpxir", "created_at": "2026-10-14T12:45:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 60, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110324521194619213", "url": "https://x.com/s8mb/status/2110324521194619213", "text": "@geofflangdale I'm pretty relaxed about them just spending money on it, because I don't think the opportunity cost is likely to be very high. But the talent that can work on these things is quite scarce and does face a high opportunity cost.", "created_at": "2026-10-14T10:59:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "geofflangdale", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110322221814325561", "url": "https://x.com/s8mb/status/2110322221814325561", "text": "@FelixGraeber That's excellent to see. Thank you.", "created_at": "2026-10-14T10:50:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FelixGraeber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110320413549211671", "url": "https://x.com/s8mb/status/2110320413549211671", "text": "China's industrial policy is driven by hundreds of cities competing with each other to maximise their economic growth.\n\nPublic officials are promoted according to who has driven growth the most, and regional governments' revenues are based on land and property, allowing them to capture economic spillovers that governments in Western countries often cannot capture. \n\nThis gives local governments in China both the means and the incentive to drive growth, far more than in most of the Western world. As a result, Chinese local governments play activist roles in setting up and growing economic clusters in their areas, investing in nascent industries the way a venture capital fund might. \n\nChina is home to over 4 million different manufacturing enterprises, twenty times as many as the United States and five times as many per capita. The clusters these businesses form allow new entrants to improve their products through rapid iteration and low lead times. \n\nThis is the secret of China's industrial miracle, and this is what the Western world must emulate if it is to reindustrialise as well.\n\nhttps://t.co/4dt4O9TUB2", "created_at": "2026-10-14T10:42:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 68, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUlc0qlXwAA8XF-.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110317916235432401", "url": "https://x.com/s8mb/status/2110317916235432401", "text": "@FelixGraeber Thank you so much! Yes, we did a 'refresh' and picked new paper. I'm very happy with it and very happy that our readers seem to like it too.", "created_at": "2026-10-14T10:32:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FelixGraeber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110312537828872295", "url": "https://x.com/s8mb/status/2110312537828872295", "text": "Quantum computing is an example of one of the problems with 'winner-picking' industrial policy: sometimes you bet on the wrong thing! Lots of resources and talent have been put into it in Britain, and we are apparently a world leader in it, so on its own terms it is an industrial policy success. But it is seeming to just not be very important as a technology and maybe it would have been better to just let the talent and resources go to other things, such as AI.", "created_at": "2026-10-14T10:11:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 191, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110273255517163618", "url": "https://x.com/s8mb/status/2110273255517163618", "text": "Good morning https://t.co/YfjLn1FHyT", "created_at": "2026-10-14T07:35:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 146, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUkyVvSWsAE2JEs.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110254063036293159", "url": "https://x.com/s8mb/status/2110254063036293159", "text": "On China’s growth model:\n https://t.co/eF6Lhcr9IJ\n\nIn ‘Apple in China’ I quote the scholar Chenggang Xu calling this model “a regionally decentralized authoritarian regime”, or RDA — an enormous meritocracy for officials from provincial governors down to the local cadres. https://
