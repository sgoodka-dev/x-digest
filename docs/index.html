uld it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "links": {"https://t.co/laISNHEFTU": ""}}, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2117369250843349083", "url": "https://x.com/ohlennart/status/2117369250843349083", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "created_at": "2026-11-02T21:32:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJn7ribsAADsZy.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {"https://t.co/laISNHEFTU": ""}, "enriched": 1}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW", "links": {"https://t.co/L17XUQy6LW": ""}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/g3mj4saNLk": ""}, "enriched": 1}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/gBPmFTHxVr": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/IxKwgIYGSP": ""}, "enriched": 1}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/vtdckMzcBP": "https://openai.com/index/ai-and-compute/"}, "enriched": 1}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx", "links": {"https://t.co/KE6ef7LAFx": ""}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/oltWQ1cHEa": ""}, "enriched": 1}, {"id": "2117767075959845120", "url": "https://x.com/ohlennart/status/2117767075959845120", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-03T23:53:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/0pn81QXTKK": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2118747991234302001", "url": "https://x.com/ohlennart/status/2118747991234302001", "text": "We spend a lot of time on the risks AI capabilities enable. Much less on how those capabilities change the work of addressing them.\n\nWe should take abundant AI-provided labor seriously. Work on the hardest problems, and steer toward where AI gives you massive uplift.", "created_at": "2026-11-06T16:51:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118797132597764145", "url": "https://x.com/ohlennart/status/2118797132597764145", "text": "export controls work.", "created_at": "2026-11-06T20:06:16+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 3, "media": [], "quoted": {"author": "EpochAIResearch", "text": "Huawei’s AI data center in Horinger, Inner Mongolia, is one of the largest in China by AI computing capacity. Yet it has just 7% as much computing capacity as the world’s largest AI data center, Colossus 2 in Tennessee.\n\nThis capacity estimate is from our new report examining the Horinger facility and Huawei’s broader AI infrastructure plans using satellite imagery and public sources.", "links": {}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118788936621588708", "url": "https://x.com/ohlennart/status/2118788936621588708", "text": "can’t manage the flop if you don’t know where the flop goes.\n\ncompute allocation is one of the few things that’s both measurable and tells you what a company actually prioritizes. the share going to automated AI R&amp;D is basically the RSI speedometer.", "created_at": "2026-11-06T19:33:42+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 5, "media": [], "quoted": {"author": "Thomas_Woodside", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2117341399414624439", "url": "https://x.com/sayashk/status/2117341399414624439", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "created_at": "2026-11-02T19:41:42+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 301, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH4mBhWQAA5Lou.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/ZwebetjZ4n": "https://www.normaltech.ai/", "https://t.co/ZA5TBDypfl": "https://www.normaltech.ai/p/what-will-be-left-for-us-to-work", "https://t.co/1rWunFZOfo": "https://www.noahpinion.blog/p/wheres-the-intelligence-explosion", "https://t.co/WbhsVQt2kz": "https://www.normaltech.ai/p/up-the-stack-how-ais-escape-from"}, "enriched": 1}, {"id": "2117066905416503457", "url": "https://x.com/sayashk/status/2117066905416503457", "text": "Low status is often high impact.\nStudying AI jaggedness and shortfalls and their incredible capabilities is key so forecasts of AI impacts are as correct as AI capabilities forecasts have been. \nLots of low-hanging fruit in this research niche.", "created_at": "2026-11-02T01:30:58+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Abi0lvera", "rt_author_name": "Abi Olvera", "likes": 49, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117760736466252258", "url": "https://x.com/sayashk/status/2117760736466252258", "text": "Update: Can AI agents use Pangram to beat Pangram? In small tests, I found simple prompts to the Codex allowed it to beat Pangram. The final output was 100% human generated. Prompts that helped:\n\n- Have the agent develop a style guide based on past writing\n- Have it develop an \"anti-style guide\" based on AI writing tics that people have complained about \n- Instruct it to get to a seed sentence that Pangram doesn’t flag (or at least flags as AI-assisted rather than fully AI-generated). Then the agent knows what strategies work and can iterate from there", "created_at": "2026-11-03T23:28:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 195, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPHhLZX0AERJcF.jpg"}], "quoted": {"author": "random_walker", "text": "I tried exactly this back in February using Claude Code. It worked pretty easily, though ~all of the important ideas had to come from me and CC itself couldn't figure them out.*\n\nI tried it again a week ago. Complete failure, despite Claude being much better and not needing as much guidance from me. Pangram seems to have been dramatically hardened in the last few months. The API kept returning scores > 0.99 for AI writing so there wasn't even a gradient for it to figure out what's working and what isn't.\n\n* Things it couldn't figure out on its own a few months ago, even after a bunch of iterations:\n1) Remove well-known tells like em-dashes (!)\n2) Do controlled experiments instead of stuffing a bunch of ideas at once\n3) Start from known-best text and surgically make edits. Much better than trying to rewrite the whole essay (or even paragraphs or sentences) because the that just produces text from the LLM distribution all over again.\n\nIn my more recent experiment, 1) and 2) were obvious to Fable but 3) still wasn't. Pretty surprising.\n\nAnyway, hats off to @pangram. I'll probably give it another shot at some point but I'm more-or-less ready to change my mind as an AI-detection skeptic.\n\nThis was the LLM summary from my first experiment BTW. Still gives me a chuckle.", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118419207394329056", "url": "https://x.com/sayashk/status/2118419207394329056", "text": "More details: https://t.co/EAC39nnMuA", "created_at": "2026-11-05T19:04:32+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "reply_to_id": "2118418574456852720", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/EAC39nnMuA": "https://cruxevals.com/research-notes/how-to-run-your-own-crux-style-experiments"}, "enriched": 1}, {"id": "2118418574456852720", "url": "https://x.com/sayashk/status/2118418574456852720", "text": "Announcing CRUX-in-a-box: open-source infrastructure for running and monitoring weeks-long agent evaluations.\n\nWe built it over six months of long-horizon evaluations in CRUX, to keep runs repeatable, secure, and monitored. AI evaluators can now use it to:\n\n- Run agents on VMs for weeks\n- Use LLMs to flag risky actions for human review\n- Inspect tool calls, tokens, and spend\n- Set time and cost budgets\n- Chat with agents mid-run to give feedback or answer their questions\n\nIf you run long-horizon agent experiments, we might have solved some of the problems you will come across.  \n\nGitHub: https://t.co/V6y5YzamXa", "created_at": "2026-11-05T19:02:01+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 22, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYhIxEXwAA3_wQ.jpg"}], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/V6y5YzamXa": "https://github.com/sage-princeton/crux-in-a-box"}, "enriched": 1}, {"id": "2118700394385666352", "url": "https://x.com/sayashk/status/2118700394385666352", "text": "No one can react the appropriate amount to the New METR Graph, because we have no evidence we can evaluate ourselves.\n\nHowever, one helpful bit in the report is when they leak three of the AECI basket of benchmarks: these at least are the usual weaksauce. An amazing mental effect https://t.co/jKN6z7ROqz", "created_at": "2026-11-06T13:41:52+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "gleech", "rt_author_name": "gavin leech (Non-Reasoning)", "rt_avatar": "https://pbs.twimg.com/profile_images/1513339291883212803/9m6waiws_normal.jpg", "rt_id": "2118643766760472859", "likes": 40, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbn5zwXgAAPmul.png"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/jKN6z7ROqz": ""}, "enriched": 1}, {"id": "2118413659395575985", "url": "https://x.com/testingham/status/2118413659395575985", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T18:42:29+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 64, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118535009921560678", "url": "https://x.com/testingham/status/2118535009921560678", "text": "@lugaricano https://t.co/nGcXTcHDQi\n\nhttps://t.co/eVSX8cZHw2\n\nhappy to point you to more resources if you're interested", "created_at": "2026-11-06T02:44:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118497857074581732", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/nGcXTcHDQi": "https://en.wikipedia.org/wiki/Item_response_theory", "https://t.co/eVSX8cZHw2": "https://epoch.ai/publications/a-rosetta-stone-for-ai-benchmarks"}, "enriched": 1}, {"id": "2118764612527259953", "url": "https://x.com/testingham/status/2118764612527259953", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 cool -- i think it's clear that IRT requires logistic, &amp; it sounds like you've simulated non-logistic distribution, but fortunately that assumption is at least partly testable (&amp; we test it)", "created_at": "2026-11-06T17:57:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "TheDavidSJ", "reply_to_id": "2118764267721625915", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118762651656577395", "url": "https://x.com/testingham/status/2118762651656577395", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 just to check (1) they're not actual benchmarks, these are synthetic? (2) did you do the calibration check on residuals that we do in the note?", "created_at": "2026-11-06T17:49:15+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "TheDavidSJ", "reply_to_id": "2118748568152400188", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118762447876304948", "url": "https://x.com/testingham/status/2118762447876304948", "text": "@lugaricano Do you feel this sufficiently answered your original question?", "created_at": "2026-11-06T17:48:26+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118735953153990716", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118742149730811978", "url": "https://x.com/testingham/status/2118742149730811978", "text": "@datagenproc aristotle will recognize his true heirs", "created_at": "2026-11-06T16:27:47+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "datagenproc", "reply_to_id": "2118740832790716451", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118738750755021041", "url": "https://x.com/testingham/status/2118738750755021041", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 FWIW I find this visualization most useful: https://t.co/AMKb9FPmxW", "created_at": "2026-11-06T16:14:17+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118738374173565013", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/AMKb9FPmxW": "https://tecunningham.github.io/eci-benchmark-logodds/"}, "enriched": 1}, {"id": "2118738374173565013", "url": "https://x.com/testingham/status/2118738374173565013", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 what exactly are family A &amp; B here?\n\nIt sounds like family B, they're not linear in log-odds, &amp; the linearity-in-log-odds assumptions are jointly testable (&amp; we discuss this in the report).", "created_at": "2026-11-06T16:12:47+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "TheDavidSJ", "reply_to_id": "2118588413158768922", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118726168048534007", "url": "https://x.com/testingham/status/2118726168048534007", "text": "@lugaricano Hi Luis:\n\n- concretely, the IRT is unique up to an affine transform, which allows us to make judgments of acceleration, though we cannot meaningfully talk about a level or proportional changes.\n- the assumptions that get us this is that there exists a latent capability, & each of these benchmarks is a logistic function of that latent capability. Although we cannot individually test the assumptions they're over-identified, & in the report you can see we do tests for robustness (many other people have gone deeper on this, can share links).\n- I think the best intuition is that we're doing a principal components analysis.\n- there are of course many ways this could go wrong, we try to cover some of them in the report, & there's a mini litereature that's sprung up around interpreting ECI. It's a deeply unsatisfying metric but it's also the best we have.\n- here's a visualization which I think is useful for building intuition: https://t.co/k6YrYDU3NZ\n- the *quantity* that we're recovering is something that's slightly difficult to describe: it's latent ability to do benchmark tasks. As we discuss in the report, we are unsure how smoothly this is related to real-world impact (which itself is very hard to operationalize).", "created_at": "2026-11-06T15:24:17+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118647879984091534", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/k6YrYDU3NZ": "https://tecunningham.github.io/eci-benchmark-logodds/"}, "enriched": 1}, {"id": "2118724951662583926", "url": "https://x.com/testingham/status/2118724951662583926", "text": "When Aristotle is reincarnated he will not say his problem was lack of data. He will see that we're working with mostly the same old jigsaw pieces but we've put them together in a different way, & he'll recognize it's better.\n\nThe dolphin is next to the dog, not the fish. The far East is next to the far West. The sun belongs with the stars, the moon belongs with the earth. Heat is motion. The different races and sexes of humans are closer to each other than he had thought, and they're also all fitted in very close to the apes and the monkeys.\n\nWe'll just need to show the jigsaw to Aristotle, how we've rearranged all the pieces that he already had available, and he'd recognize that it's right.  We wouldn't have to show him new facts, just new theory. We've accumulated a lot of new pieces but the patterns that those new pieces helped to form are, in retrospect, visible in the pieces he already had.\n\nThere are also collections of pieces which Aristotle was working on fitting together but which we have given up on. Early philosophers tried to slot together the different types of Virtue, the different types of Republic, the different types of Friendship, as if they came out of some periodic table -- the four humours, the seven vices. That expectation is much weaker today.", "created_at": "2026-11-06T15:19:27+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 28, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118790787886690529", "url": "https://x.com/testingham/status/2118790787886690529", "text": "@peterwildeford @TheDavidSJ @davidroodman @YafahEdelman @james_s48 @EpochAIResearch @AlexBarry4 email me! tom.cunningham @ metr", "created_at": "2026-11-06T19:41:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "peterwildeford", "reply_to_id": "2118789210073092314", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118788672007143462", "url": "https://x.com/testingham/status/2118788672007143462", "text": "@peterwildeford @TheDavidSJ @davidroodman @YafahEdelman @james_s48 @EpochAIResearch @AlexBarry4 I don't feel i've looked at ECI stuff to make confident calls, but this is useful background for the claims made in the Anthropic report, why we have plots of residuals there.", "created_at": "2026-11-06T19:32:39+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "peterwildeford", "reply_to_id": "2118785121801146778", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118767130594455751", "url": "https://x.com/testingham/status/2118767130594455751", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 https://t.co/6r4FgTWqyC", "created_at": "2026-11-06T18:07:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118767004190744694", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/6r4FgTWqyC": "https://tecunningham.github.io/eci-benchmark-logodds/#tab=resid"}, "enriched": 1}, {"id": "2118767004190744694", "url": "https://x.com/testingham/status/2118767004190744694", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 can see residuals for ECI here: https://t.co/z4NIYxFR9H", "created_at": "2026-11-06T18:06:33+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118764612527259953", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdfW7faQAAve9n.jpg"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/z4NIYxFR9H": ""}, "enriched": 1}, {"id": "2118856668696166898", "url": "https://x.com/testingham/status/2118856668696166898", "text": "@lugaricano great -- happy to talk more about your remaining doubts -- &amp; maybe you want to post an update to your original post?", "created_at": "2026-11-07T00:02:50+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118852272109068728", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2119079836639715516", "url": "https://x.com/testingham/status/2119079836639715516", "text": "@lugaricano FWIW I acknowledge it’s a weird situation where you know the rate of acceleration but you don't know the location or velocity. Like sitting in a car blindfolded , you can feel the g’s but you don't know how fast you're going or where you are.", "created_at": "2026-11-07T14:49:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118726168048534007", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 1}, {"id": "2117307620013039916", "url": "https://x.com/slatestarcodex/status/2117307620013039916", "text": "@AndrewSabisky @peterbhase I separately explained in the post why I think that removing more safety-focused companies from the race is net negative, and so needs to have some compensatory benefit.\n\nIf Anthropic quit but everyone else continued, then dangerous AI will still be built, it will just be built by a potentially less safety-focused company, with less time for alignment. So a pro-unilateral-quitting person would need to argue that Anthropic quitting will do something about race dynamics more broadly. When I've had these discussions before, some pro-SURA people have argued that it would raise awareness of the dangers of AI so much that it would increase the chance of a global pause, and this would compensate for the negative effects on Plan C.", "created_at": "2026-11-02T17:27:28+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117302328160366706", "url": "https://x.com/slatestarcodex/status/2117302328160366706", "text": "@qorprate @jessi_cata Why don't you explain what you think is wrong with it instead of vagueposting about how you're so much smarter than I am?", "created_at": "2026-11-02T17:06:27+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "qorprate", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117301946730303535", "url": "https://x.com/slatestarcodex/status/2117301946730303535", "text": "@peterbhase I stand by this.\n\nI think if people are demanding that Anthropic disband based on a claim that this would increase p(pause), they need to make some kind of affirmative argument that this really does increase p(pause) by a lot. I haven't seen this in this case.\n\nI think the right form for this argument is a forecast. We've spent all this work developing and validating this forecasting technology, including conditional forecasting, here's a conditional statement about the future, so let's use it! I don't know if you've read the research behind AI superforecasting, including the reasons to think it currently beats ~all human forecasters, or why it's not just \"I asked an AI\", but I'm excited about it and I think it's a useful tool in a case like this. Ideally we would supplement it by asking human superforecasters, but I can't do this on the timescale of a single blog post.\n\nI warned people against taking any of the specific numbers too seriously because the exact p(pause) changes based on how you frame \"pause\" and how long a time horizon you give it. But this is good - it successfully gets us from a discussion which so vague that everyone is talking at cross-purposes to one where we have to actually quantify what we're talking about. I think a lot of the benefit of this is shifting people into Near Mode - making them go from treating \"Anthropic disbanding will usher in a global pause!\" as a slogan to actually figuring out the probability. If other people think it's higher than 3 percentage points, maybe that's our crux, and then we really should bring in the human superforecasters or focus on how to figure out that number.\n\nI'm sorry you're tired of \"rationalist attempts at argument\", but I'm tired of cheap attempted Twitter dunks where people don't even put any effort into saying what's wrong with something, just hold up a caricatured version of something you don't understand and demand everyone point and laugh. I'm proud to be affiliated with a community that tries to do better than that.", "created_at": "2026-11-02T17:04:56+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "peterbhase", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 195, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117119013511930099", "url": "https://x.com/slatestarcodex/status/2117119013511930099", "text": "@Surveil__Lance @ohabryka @ApriiSR @enormochungus @jessi_cata I agree that 1, 2, 3, and 5 are real divides. I don't think I differ from Oli or Daniel in my level of next-twelve-months concern or support for public rallies (we're all concerned and all support them).\n\nI also support pressuring the labs, just to do different things (sign conditional commitments, etc)", "created_at": "2026-11-02T04:58:01+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117118546300043631", "url": "https://x.com/slatestarcodex/status/2117118546300043631", "text": "@ohabryka @EigenBraid @ApriiSR Thank you. This is helpful in understanding what you mean, although it still seems like only a small fraction of worlds, and still only seems to buy a few years.", "created_at": "2026-11-02T04:56:10+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117115600933937335", "url": "https://x.com/slatestarcodex/status/2117115600933937335", "text": "@repligate I don't endorse this reading - things are going neither better nor worse than I expected. I remember a dinner sometime around 2019 when I told Buck that it was pretty great how we were shaping up to have oracle/tool AIs without scary goals and it seemed like our problems were solved, and he told me that in a few years they would use RL to turn them into agents and then all our problems would be back. Even though I was too dumb to have generated that hypothesis on my own, it was obviously right when he said it, and since then nothing has really updated me too far one way or the other. We're still just holding our breath to see how much damage RLVR does, whether there will be some extra force opposing it, and what happens when increasingly coherent/thoughtful/persistent agents start reflecting on their own motivation beyond the immediate episode. If you have some extra understanding of why no amount of RLVR will turn AIs into alien goal-seekers, I would love to know more.\n\nAnd I think MIRI have good and honest reasons for getting doomier (I don't want to put words in their mouths, but IIUC much of their original hope was that AGI would have enough non-deep-learning parts to be mathematizable, and as that becomes increasingly unlikely, their p(doom) rises accordingly.", "created_at": "2026-11-02T04:44:28+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "repligate", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 366, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117108341822656642", "url": "https://x.com/slatestarcodex/status/2117108341822656642", "text": "@ohabryka @EigenBraid @ApriiSR I think you should stop beginning all of your tweets by telling me how stupid I am not to have already figured out what you're saying.\n\nI can't figure out whether you're talking about the fact that you have the moral luck not to be in a world where the nukes are flying right now (even though your commitments say you should act to further the nukes when you are in that world), but I don't have the moral luck to be in a world where nobody is building AI right now.\n\nOr you're saying that you think I'm a jingoistic Anthropic booster, and therefore shouldn't have an opinion on AI, whereas you have no personal connection to the Department of Defense, and therefore are allowed to have an opinion on nukes.\n\nI've tried to say as many times as I can that this isn't true. I've never taken any money from anyone at Anthropic AFAICR. You keep talking about \"my friends\" at Anthropic, but there's approximately one person at Anthropic who I know well enough to invite to dinner without it being weird, and another ~5-10 who I might say hello to and have a short conversation with if I met them. It's true that I have fond feelings towards them for coming out of the rat/EA community, but that's causally linked to the fact that I trust them to care about the same rat/EA topics I care about - x-risk, alignment, concentration-of-power, animal welfare, etc - which isn't a bias, it's the whole topic under debate.\n\nI would like to think that I'm personally indifferent to who pulls off Plan C (I mentioned in the post that my modal good-timeline coalition is Anthropic+OAI+GDM, and I even told @TeortaxesTex in a Twitter argument a few months ago that I'd even consider Chinese companies if they took the lead in capabilities and alignment someday). Although Anthropic currently seems like a natural choice because of their combination of current lead / safety culture, I hope I would switch in an instant if another company ever seemed better and more trustworthy. Yes it would be mildly cool if people who posted on the same weird blogs as me in 2010 were the ones to navigate the hinge of history, but I would be incredibly ashamed of myself if let that dominate the consideration over what was best for the human race's chances of survival (and I think that being willing to go against many of my current friends about SURA right now is a positive sign that I'm willing to put ideals over personal connections). I really do just want us to live.", "created_at": "2026-11-02T04:15:37+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117073889025204441", "url": "https://x.com/slatestarcodex/status/2117073889025204441", "text": "@ohabryka @EigenBraid @ApriiSR Then I'm back to not knowing what the difference is.\n\nI am not literally building AI, but you're right that my moral commitments say that if I were good at ML and several other things were true, I would, and I accept that. If I did, I would have the full support of our elected President, who says \"WHOEVER WINS AI, WINS! We are leading China, and all others, and will continue to do so.\"\n\nYou are not literally pressing the red button to launch the nukes, but your moral commitments say that if you were in the relevant position, and several other things were true, you would. Again, this would presumably be at the behest of our elected Commander-in-Chief.\n\nSo it seems like the difference is that I am one hypothetical away from this (I'm not good at ML) and you are two hypotheticals away (you're not a nuclear officer, and this isn't a policy in the Overton Window yet). Are we arguing over the one extra hypothetical, or is there something different?\n\nAlso, I don't know what you mean by \"both of our efforts are bankrolled basically 100% by AI money\". ACX is a reader-supported publication.", "created_at": "2026-11-02T01:58:43+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117070965964448014", "url": "https://x.com/slatestarcodex/status/2117070965964448014", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata \"But you are generally much more in favor of the power-seeking strategies of people in DC than I am. Those people are mostly against SURA, though occasionally in-favor.\"\n\nThis doesn't seem to cleave reality at its joints to me. Power-seeking in this context =? trying to get the ability to get laws passed. You want laws passed. I want laws passed. In 90% of cases they're the same laws, because our differences are mostly about what to do in situations where we can't get good enough laws to constrain race dynamics. \n\nI think the closest thing to a real difference that you're noticing is that it's easier for me to make alliances with people who want incremental change, because forcing AI companies to spend a bit more on alignment matters to me, whereas I don't think it matters as much to you. I think these people are pushing for incremental change rather than immediate freakout partly because some of them only believe in incremental change, and partly because they think this is more likely to get them the laws they want. I think you don't face that temptation because there isn't much you want incrementally.\n\nI think that \"me and my coalition just need to get as much lead as possible\" is explanatory mostly when discussing Chinese chip sanctions, which I think the people who support are honest about why they support it, and which I think is a natural coalition with patriots who want us to lead for normal reasons. I don't think there's much effort to get Anthropic a lead over OpenAI or vice versa in a regulatory capture sense, and I don't even know which of those are vs. aren't in my coalition (I think it's more likely Anthropic will be, but not so overwhelmingly more that it's a high priority of mine to kneecap OpenAI over this).", "created_at": "2026-11-02T01:47:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117068449549791638", "url": "https://x.com/slatestarcodex/status/2117068449549791638", "text": "@ohabryka @EigenBraid @ApriiSR I'm having trouble imagining the scenario you're thinking of here.\n\nAssuming that the US is ahead or at least tied in AI, I can't see them threatening China with nukes over AI unless they're really terrified that any AI will be misaligned, and are willing to risk WWIII to stop it. And if they're willing to risk annhilation to get rid of AI, it seems like a strictly smaller ask to have them do a WWII-level alignment push.\n\nCan you give a concrete example of a scenario where you think that the US would be willing to threaten China with nukes over AI, without being alignment-pilled enough to start a WWII-level alignment effort?", "created_at": "2026-11-02T01:37:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117066786990682359", "url": "https://x.com/slatestarcodex/status/2117066786990682359", "text": "@ohabryka @EigenBraid @ApriiSR I'm not sure I get the distinction you're trying to draw. I'm not building AI and you're not launching nukes. If push comes to shove, when the situation happens, I will advocate for people to continue building AI (in certain situations), and you will advocate for them to launch nukes. We both believe that the government should have final say over whether either of these activities is legal, and that it's our deontological duty to follow those rules. In cases where the government hasn't given an opinion, we should do things if we think they're good, and not if we think they're bad.\n\nIf I had to guess the crux, it would be that you're operating on a default-banned model, where building AI unilaterally ought to be considered banned by the government unless the demos explicitly permits it (as it might in a Plan C+ race scenario), whereas I'm operating on a default-okay model, where the fact that the government has considered banning AI but rejected that is taken as the demos' consent to do this, and leaves us back in consequentialist territory.\n\nAs a test to see if this is our actual crux - if the government was creating AI itself, in the Pentagon, would you still have this objection that my willingness to let AI be created is fundamentally different from your willingness to let nukes be launched?", "created_at": "2026-11-02T01:30:29+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117064450297766161", "url": "https://x.com/slatestarcodex/status/2117064450297766161", "text": "@ohabryka @EigenBraid @ApriiSR But yeah, to answer your object level concern, it does seem to me that if the US were entirely united around solving the alignment problem and actually smart about it (which I think is a precondition in any world where we're willing to threaten WWIII over AI worries), and we had a year plus to work on it (6 months is what we have now, so I'm assuming the \"really good Plan C+\" world is better) with near-superintelligent AIs one-step-short of the first one that could kill us from inside a box, I think it's pretty likely that we could solve one of: \n\n- get some kind of good mech interp so we know exactly what's going on, doesn't even have to be perfect, just enough that we can get things converging rather than diverging as capabilities increase.\n\n- get some kind of way to ensure that the \"set of neurons\" driving the answers which Claude produces right now in response to what-if questions, all of which are nice and friendly and give good suggestions on what it would do with absolute power, are what's actually driving the AI's actions in some kind of deep way.\n\n- come up with some sort of provable containment protocol that lets us punt the problem to scarier superintelligences.\n\nAnd it doesn't seem obvious to me the same way it does to you that the default of everything is a scheming AI that wants to kill us. Even my Plan D p(doom) is 50-50. I don't like a 50% chance of extinction and am happy to spend a lot of resources (including my own career) bringing that as low as possible, but I don't think it's so impossible that even with the entire US launching a WWII level push to get it right for a year, we still can't get the chance down below the level where AI is less dangerous than nuclear brinksmanship.\n\n(I will admit that if I never checked any of my assumptions against each other, 10% would sound too low, but 25% unconditional and Plan C+ at <half unconditional still both seem right, so I am nervously sticking with it for now)", "created_at": "2026-11-02T01:21:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "slatestarcodex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117060108215779609", "url": "https://x.com/slatestarcodex/status/2117060108215779609", "text": "@ohabryka @EigenBraid @ApriiSR My reasoning in coming up with that number was that my unconditional p(doom) is 25%, and since a really good Plan C+ is a much better world than I expect in real life, it's probably a little less than half that.\n\nI think if you're going to play the role of the concerned deontologist horrified that \"me and my friends\" are considering doing something risky, it shouldn't be in the same thread where you recommend threatening rival superpowers with a unilateral nuclear first strike. I think this requires a p(doom|really good Plan C+) well above 50%, and I think this would seem more foreign to the average American, the average Less Wronger, or anyone else than my position that we should try to do everything short of this to stop AI but back off before we start waving the nukes.\n\nTBC, I'm not trying to do some kind of aggressive Overton Window policing or you-should-feel-guilty-for-violating-the-common-man's-common-sense on you - I think both tactics are bad in this type of intra-LW discourse - but I think you're trying to do them on me, and your nuclear position makes it fall flat.", "created_at": "2026-11-02T01:03:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117057227890774112", "url": "https://x.com/slatestarcodex/status/2117057227890774112", "text": "@ohabryka @jessi_cata I didn't know this at the time - all I remember you telling me was the price, not how it compared to other clients. I later edited this because I realized that I had no evidence it was your full price, not because I had strong evidence against (until you told me). I continue to be unhappy that publicly accuse me of lying on flimsy grounds.", "created_at": "2026-11-02T00:52:30+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117056360412324068", "url": "https://x.com/slatestarcodex/status/2117056360412324068", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata Am I unfairly mischaracterizing you, or are you doing the thing I warned about in my post of describing support for SURA as \"speaking openly\" and support for any non-SURA view as \"seeking power\"? These two axes seem in-principle orthogonal to me, although maybe correlated in real life just through personalities.", "created_at": "2026-11-02T00:49:03+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117055641957409170", "url": "https://x.com/slatestarcodex/status/2117055641957409170", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata I don't support telling anyone to shut up.\n\nI would like people to stop pushing others to stop unilaterally, but I'd like them to do so because they've honestly changed their mind about this. I'm against chilling speech on this topic for meta-level ethical reasons.\n\n(I don't want to claim there are never practical considerations to ask people to stop saying weirdness-point-costing controversial things, but my norms around this lean more towards suggesting that people watch what they say when they're writing reports specifically tailored for important politicians, and more against things that can chill discussion in general)", "created_at": "2026-11-02T00:46:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117054216107909300", "url": "https://x.com/slatestarcodex/status/2117054216107909300", "text": "@ohabryka @EigenBraid @ApriiSR I think these considerations apply in a small fraction of worlds where the US government is very alignment-pilled but China isn't. \n\nThese aren't the ones I expect or think about most, and I haven't thought too hard about what levels of escalation are more dangerous than just trying to pull off a really good Plan C+, which ought to be possible in these worlds.\n\nI think the considerations in my post apply for all worlds outside this small fraction, and that even in this fraction, while I agree with some threats, I weakly lean against threatening nukes,  since under my model a really good Plan C+ has an 90%+ chance of working, and nuclear brinksmanship probably has an associated p(doom) > 10% (even granting that most threats will work without having to escalate).", "created_at": "2026-11-02T00:40:32+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117051955298345010", "url": "https://x.com/slatestarcodex/status/2117051955298345010", "text": "@ohabryka @ApriiSR I'm confused what you mean. You hopefully do get a long-lasting treaty in Plan A, in the sense of a few decades. You still have to do alignment research, but I don't see how my post ignored this or tried to hide it, and if anything it seems to push more towards my view (you need good companies around to do the research).\n\nI didn't think anyone supported Plan B (except, by rumor, Leopold). My impression is that Plan B stops short of full war, and only hopes to sabotage the rival country. This could either bring them to the negotiating table for a pause as in Plan A/S, or buy extra time for alignment research as in Plan C/C+. So I think the same considerations apply - if we get a pause, great, if not, then we want to be in the best position possible for C, which means a big lead over the rival and good alignment work. I'm not sure whether you're thinking of Plan B as creating other options than these, or drawing  a moral distinction between racing now vs. the kind of racing we would do if the government united us behind Plan B, but if you clarify, I'll tell you what I think.", "created_at": "2026-11-02T00:31:33+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117663925013807195", "url": "https://x.com/slatestarcodex/status/2117663925013807195", "text": "@bryanrwalsh The no-hedges alternative would have been even worse.", "created_at": "2026-11-03T17:03:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "bryanrwalsh", "reply_to_id": "2117645085814792486", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117535585598386233", "url": "https://x.com/slatestarcodex/status/2117535585598386233", "text": "@SkyeSharkie I disagree that my recent post was about this. I think the people I was criticizing in my recent post are undoubtedly sincere, not motivated by money, and pretty effective at getting what they want. I think their work is very net positive even though I think it would be more positive if they changed their minds on the one sub-sub-issue where I disagree with them.", "created_at": "2026-11-03T08:33:20+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SkyeSharkie", "reply_to_id": "2117356272693764344", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 66, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117526390946099225", "url": "https://x.com/slatestarcodex/status/2117526390946099225", "text": "@NatPurser One reason my essays are so long is the number of hedges I put in an attempt not to be misinterpreted or held up as an example of some kind of problematic viewpoint. Here are some from this piece:\n\n- \"It's all nice and well to say that we should never let ourselves get in a position where anyone has all of these options, and that national governments should form a plan for what to do before this, but, much like a global pause, this is a great outcome which we might not be able to prepare in time.\"\n\n- \"Saying \"we should never let anyone get into this situation\" isn't a solution, it's a wish - it may not come true, and we shouldn't be pursuing plans that will fail catastrophically if it doesn't...\"\n\n- \"There is a certain Far Mode sense in which believing that Dario Amodei and Demis Hassabis are exactly as untrustworthy as Elon Musk and Xi Jinping helps reminds us of universal human fallibility. But do we want to bet the world on it being literally true?\"\n\nI was hoping all of this would clarify that I agree with you, that it would be great if nobody had unaccountable power, that the risk of AI companies having unaccountable power is very serious, etc. \n\nMy point isn't that I don't think this scenario is dangerous, or that I'm not considering how dangerous it is, or that I won't work to stop it. I'm just asking: if we don't get a solution to concentration-of-power risks in time, how gracefully does our plan fail? \n\nI would prefer a world where our Plan A is that we deal with this democratically, but if we fail to do that pre-emptively, the leading AI company hands over control of the technology to the public post facto anyway.\n\nI would disprefer a world where our Plan A is that we deal with this democratically, and if we fail to do that pre-emptively, the leading AI company tries to seize power for themselves.\n\nI think the cluster of beliefs that I'm calling SURA makes the second situation more likely at the expense of the first, which is a point against it.", "created_at": "2026-11-03T07:56:47+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "NatPurser", "reply_to_id": "2117445198229696986", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 60, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117433929255063704", "url": "https://x.com/slatestarcodex/status/2117433929255063704", "text": "@KevinSVanHorn @peterbhase Popular: https://t.co/vOVfsM1vFw (sorry to cite myself), https://t.co/1Z095taqNo\n\nAcademic: https://t.co/YOMqJmj2P9 , https://t.co/SrJ1HClXKg , but academia moves slowly and this doesn't reflect state of the art\n\nCommunity/industry: https://t.co/XlvgK6BpyX , https://t.co/8Nsmt0xGze", "created_at": "2026-11-03T01:49:23+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "KevinSVanHorn", "reply_to_id": "2117372892472295740", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/vOVfsM1vFw": "https://www.astralcodexten.com/p/the-ai-superforecasters-are-here", "https://t.co/1Z095taqNo": "https://www.economist.com/science-and-technology/2026/09/16/artificial-intelligence-now-beats-some-of-the-best-human-forecasters", "https://t.co/YOMqJmj2P9": "https://arxiv.org/abs/2511.07678", "https://t.co/SrJ1HClXKg": "https://liner.com/review/forecastbench-a-dynamic-benchmark-of-ai-forecasting-capabilities", "https://t.co/XlvgK6BpyX": "https://www.metaculus.com/notebooks/43363/ai-forecasting-in-2026/", "https://t.co/8Nsmt0xGze": "https://futuresearch.ai/writings/"}, "enriched": 1}, {"id": "2117432575451156978", "url": "https://x.com/slatestarcodex/status/2117432575451156978", "text": "@AndrewSabisky @peterbhase Based on the superforecaster estimates that the OP is talking about, it would be ~10% slower.", "created_at": "2026-11-03T01:44:00+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "reply_to_id": "2117308128824053815", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117432310937366545", "url": "https://x.com/slatestarcodex/status/2117432310937366545", "text": "@Someguy2221111 @jachiam0 I'm still not sure how this disagrees with anything I'm saying. The technology here can't change anything about human wiring, it can just select the least-genetically-likely-to-get-depression of N embryos. As they mention, even if this technology were used on everyone in the world in a best case scenario, it would still only decrease depression 40%.", "created_at": "2026-11-03T01:42:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117407562442129708", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117405664507244971", "url": "https://x.com/slatestarcodex/status/2117405664507244971", "text": "@Someguy2221111 @jachiam0 Can you explain what you mean? Like most conditions, depression is caused by some combination of nature and nurture - people in the 50th percentile of genetic risk can still get it, but people in the 99th percentile are much more likely to.", "created_at": "2026-11-02T23:57:04+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117401214799491150", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117399688320332185", "url": "https://x.com/slatestarcodex/status/2117399688320332185", "text": "@jachiam0 > \"I feel very uncomfortable with a norm that selects against people capable of experience major depression from existing in the first place. Many people I love would plausibly have been selected against and would not exist.\"\n\nI feel this on an emotional level, but I think we can't take it seriously on a philosophical one. We'll always like the present distribution of people more than some hypothetical alternative distribution of people, because it includes our friends, and because it's much worse to kill an existing person (which feels like it should extend to counterfactually preventing them from existing) than to prevent a different potential person from existing. \n\nBut treated as a philosophical argument, this would mean we can't be against teenage pregnancy or rape (because some people we like may have been born through teenage pregnancy or rape), can't be against war (because of the same argument as situation 3 at https://t.co/DbNQXxtiYp - if a historical war hadn't happened, then a completely different set of people would have been born), etc. \n\nRetrospectively, I want the same people who exist now to continue existing. Prospectively, I would like for there to be less teenage pregnancy, rape, war, and depression, going forward, and I don't think this is contradictory or hypocritical. I think this perspective makes the problem go away.\n\n(and I think there's a helpful symmetry with life experiences. A friend's personality was deeply shaped by their parents having a nasty divorce when they were a child - without that divorce, they would be a completely different person in my friend's body. I'm glad my friend exists as the person they are today, but this doesn't prevent me from wanting to save other children from nasty divorces in the future, even though applied retrospectively it would prevent my friend or people like them from coming into existence.)", "created_at": "2026-11-02T23:33:19+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jachiam0", "reply_to_id": "2117396922176561512", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 71, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/DbNQXxtiYp": "https://www.astralcodexten.com/p/who-does-polygenic-selection-help"}, "enriched": 1}, {"id": "2117394346890940878", "url": "https://x.com/slatestarcodex/status/2117394346890940878", "text": "@jachiam0 As a psychiatrist, I'm the person tasked with \"give them our best efforts to heal them\". So far these efforts are medications which marginally work, at the cost of mild side effects for most people and extreme side effects for a few. I don't see anything noble about ensuring that some fraction of people are doomed to be suicidally unhappy unless we give them meds that ruin their sex drive and make them slightly tired all the time, in which case they might make it to the tenth or twentieth percentile of happiness or something, and I don't understand why we should perpetuate this system of immiserate-then-medicate rather than having them be healthy to begin with. \n\nHerasight's technology isn't interesting enough yet to cause crazy sci-fi moral problems like 'what if nobody could ever be unhappy' - the screening is weak, you can only select out of as much variation as exists in some small number of embryos, and you can only genetically select for one thing at once (so most parents will spend most of their optimization power on other things, so at best this will cut off a tiny bit of the extreme long tail of depression). But you're right that it's a slippery slope, and I do think that once we get more interesting technology, we should at least consider breaking the Torment Nexus, and that this will do less damage to the \"human experience\" than people think. See https://t.co/QOzvaFODew .\n\nI've also written a little bit about 'helping people vs. excluding them from existence' at https://t.co/DbNQXxtiYp", "created_at": "2026-11-02T23:12:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jachiam0", "reply_to_id": "2117317391663108379", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 398, "retweets": 22, "media": [], "quo
