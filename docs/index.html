likes": 91, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU78Sf1WcAAEjpS.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2110739519469486156", "url": "https://x.com/theobearman/status/2110739519469486156", "text": "We have never seen a model do this before, but GLM-5.3 sometimes reasons (unprompted) about how its current actions could become training data and impact its future self. 🧵 https://t.co/DFLv7OJwRq", "created_at": "2026-10-15T14:28:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 266, "retweets": 38, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqgBAzXYAADdyr.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110716450302316733", "url": "https://x.com/theobearman/status/2110716450302316733", "text": "Brilliant new @iapsAI report out today from my colleagues @jan__wehner and @JKraprayoon, \"Honeypots for AI Agent Insider Threats.\" AI agents can become insider threats through compromise, misalignment, or error. As capabilities grow, so do the potential impacts.\n\nHoneypots can play a vital role in a defense-in-depth strategy to secure against agentic insider threats by supporting detection, attribution, and deterrence. They're cheap, easy to scale, provide real-world evidence, and don't depend on CoT monitorability to be valuable (though we still need to maintain and strengthen this!).\n\nIn this report, Jan and Jam also lay out a robust technical research agenda to demonstrate and strengthen these honeypots' effectiveness, so there's exciting research to pursue for those interested in technical AI governance!", "created_at": "2026-10-15T12:56:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 2, "media": [], "quoted": {"author": "jan__wehner", "text": "When OpenAI revealed that a swarm of their agents had hacked Hugging Face, they proposed using honeypots to slow agent attackers. Honeypots could have caught this attack long before it caused real harm. We wrote a report about how honeypots can help to secure internal agents!🧵 https://t.co/jKAD9xbarC"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110696725312573747", "url": "https://x.com/theobearman/status/2110696725312573747", "text": "Gemini 4 Argon scores 165 on the Epoch Capabilities Index (ECI), on par with Fable 5.1 (165) but behind Opus 5.5 (167) and GPT-6 Astra (166).\n\nWhile behind the ECI frontier, Argon is the closest Google’s come since Gemini 3.1 Pro in Feb, and a big jump from Gemini 3.8 Flash (157) https://t.co/PvZvD4KyvI", "created_at": "2026-10-15T11:38:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 367, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqw4NfbEAA1QV_.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110696691611644203", "url": "https://x.com/theobearman/status/2110696691611644203", "text": "Plus, we now use honeypots for agents. What a world we live in...", "created_at": "2026-10-15T11:38:00+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "AndrewCurran_", "text": "OpenAI does anti-honeypot training. From the article:\n\n'In training sessions, OpenAI has warned employees that outsiders, including competitors and state-sponsored actors, could try to get access to company information. Company leaders have said that could take the form of people offering money, listening in cafes or even trying to seduce OpenAI employees, people familiar with the matter said. Employees at other AI heavyweights, including Anthropic and Google, have received similar warnings.'"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110696240430080446", "url": "https://x.com/theobearman/status/2110696240430080446", "text": "Scoop: The Federal Trade Commission on Wednesday sent civil investigative demands to Anthropic and OpenAI. \n\n-Each CID is more than 50 pages long.\n-The FTC is seeking documents related to security incidents and safeguarding practices.\n-The agency also requests marketing materials and documents detailing company privacy policies.\n-Investigative demands to third-party AI organizations will be issued at a later date.\n\nhttps://t.co/05nfrFTYg3", "created_at": "2026-10-15T11:36:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "m_ccuri", "rt_author_name": "Maria Curi", "likes": 82, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110640649573687793", "url": "https://x.com/theobearman/status/2110640649573687793", "text": "A common misconception about METR’s work with companies is expecting the relationship to be like working with a law firm or cybersecurity firm who are being paid to serve the interests of the company - METR is a non-profit and serves the public. For example, you can have your law firm refrain from working with your competitors. However, the standard practice in other evaluation regimes (e.g. bank examiners, financial auditors, NRC inspectors) is that assessors will move between multiple companies, and there are rules about how long an individual can stay with one company to prevent them “going native” and losing their independence or fresh perspective.", "created_at": "2026-10-15T07:55:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BethMayBarnes", "rt_author_name": "Elizabeth Barnes", "likes": 202, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110640450025697662", "url": "https://x.com/theobearman/status/2110640450025697662", "text": "been dooming tn so let me also say I expect really strong mechinterp progress in the coming months. like maybe more than we’ve seen in years. models getting good enough to do research, and I’ve been seeing lots of good things. (sorry to vague poast, not my updates to share)", "created_at": "2026-10-15T07:54:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2200, "retweets": 71, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110640331033027014", "url": "https://x.com/theobearman/status/2110640331033027014", "text": "limited superintelligence is already here, in broad domains. Jack Clark is right and an intelligence explosion could happen within the next year. it’s possible it will be a controlled explosion, but what would you bet on it?", "created_at": "2026-10-15T07:54:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2031, "retweets": 104, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110640183548985640", "url": "https://x.com/theobearman/status/2110640183548985640", "text": "My top takeaway from assessing Gemini 4: Argon is significantly less monitorable than past models, and IMO this trend is likely to continue, like Sol -> Astra. It can evade a realistic CoT+action monitor to do simple sabotage half the time.\n\nWe can reliably maintain control for now, with good CoT monitoring, as it still frequently slips up, but we need to be prepared for when that stops being true in future models, which may be sooner rather than later. Among other things, we really need interpretability methods that can reliably capture unverbalized motivations in models, with minimal hallucinations\n\nI suspect this is driven by the model being highly capable without CoT, being capable of 5.5 arithmetic steps in a single forward pass (4 for Fable, 7 for Astra). It seems to omit information from its CoT more often, though in non-adversarial settings the CoT is still very helpful in practice, and remains in legible English. It still needs CoT to do the hardest tasks, but any given task becomes \"easier\" with each new frontier model.\n\nIt is also highly situationally aware, and shows awareness of the existence of CoT monitors and that it may want to evade them, eg it sometimes decides to avoid terms like \"scheming\" in the output or to keep its thoughts brief as a result. For now, these concealment strategies are pretty obvious in the CoT, but this suggests future misaligned models may successfully evade CoT monitors.", "created_at": "2026-10-15T07:53:28+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 923, "retweets": 112, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjiDHEbMAAgjMW.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639984369918270", "url": "https://x.com/theobearman/status/2110639984369918270", "text": "If I'm not mistaken, Anthropic's 85% gross margin and &gt;40% compute margin from this Bloomberg story implies that 70-75% of their compute is now going to R&amp;D.\n\nhttps://t.co/c812lWQdmz https://t.co/NcDV9C0A6p", "created_at": "2026-10-15T07:52:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "justjoshinyou13", "rt_author_name": "Josh You", "likes": 374, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUozoWOXoAAbaiU.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUoz9VyXUAAsKC-.png"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639633323479198", "url": "https://x.com/theobearman/status/2110639633323479198", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T07:51:17+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110768438289519007", "url": "https://x.com/theobearman/status/2110768438289519007", "text": "when nick told me that he had some interp breakthroughs, he was uh, underselling it. i think this may be remembered as a major moment in scientific history. news so good even eliezer will have to lower his pdoom. we can start making alignment into a 'normal science'", "created_at": "2026-10-15T16:23:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4011, "retweets": 262, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111013199223128248", "url": "https://x.com/theobearman/status/2111013199223128248", "text": "This is interesting work, but I don't think it's a significant update to the big picture of interpretability.\n\nI'm on board with the broad idea of doing exploratory interpretability with neurons, e.g. neuron-based attribution graphs, for pragmatic problems like why did a model do a sketchy thing? I think this work provides some reasonable evidence, in addition to good earlier work from\nTransluce, that this might actually work for practical purposes, and has some advantages over the standard alternatives like SAEs/transcoders. I do not agree with some people's grander inferences like that this is substantial progress towards ambitious reverse engineering, solving interpretability etc.\n\nI expect that a neuron-based attribution graph will still have significant error and be missing a lot just like transcoders, once you prune them down to the most important components, even if they solve error terms. Which is fine for pragmatic purposes, and may suffice for getting the gist of what's going on, but I remain pessimistic about really fully understanding things and being confident there's nothing we're missing. I do think that using neurons is just vastly easier to, for example, do on a frontier model, which is great. I'm also excited to see more innovation in using agents to interpret neurons. I feel like this is an area the field has somewhat neglected, and where there's probably a very high ceiling on how far things can go. The SwiGLU double negative thing is also a useful point.\n\nI still think superposition is real and this work doesn’t really affect my cruxes. Most importantly, it seems highly likely to be true that the model can represent more concepts in the residual stream than it has dimensions, ie representational superposition, which I think the authors agree with me on. For neuron/computational superposition, it seems to me like language models have far more facts and memorized things in them than they have neurons. And that superposition is an efficient way to pack in more facts than you have neurons by representing them as linear combinations of neurons, especially for arbitrary unstructured values. Facts/memorized content is largely an unstructured database of key-value pairs IMO and I don’t see how this is compatible with a monosemantic view of neurons. I expect that weak neuron activations contain lots of semantic superposition-y info, which, if ablated, would meaningfully damage network performance. As I understand the work, it does not properly address what's going on with weak neuron activations in LLMs (I am skeptical of how much vision results will transfer, eg I expect small image models memorise far less). This picture is compatible with the highest activations of a neuron being mono semantic (though IMO the post defines monosemantic too loosely, I think I’d call a fair few of those polysemantic). It’s also plausible that the most important concepts are likely to correspond to a neuron (or a handful), which would be great, and may suffice for practical purposes!\n\nSimilarly, my impression is that SAEs generally don't find things that are a\nsingle neuron, or even very sparse in the neuron basis, and are often a better basis for certain tasks than the neuron basis, though the evidence base is kinda weak here since we largely focus on residual stream or layer output SAEs, I’d love to see work on this in Goodfire’s forthcoming paper! I also think residual stream SAEs are extremely useful, as they give a good bottleneck of the model’s information at this token and layer, and I don’t see a good way to replicate them in the neuron framework.\n\nAnd kudos to Nick for updating a bunch of his historical vision work! Revisiting old results with modern tools and more rigour seems great.", "created_at": "2026-10-16T08:35:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 1320, "retweets": 138, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110843715665408466", "url": "https://x.com/theobearman/status/2110843715665408466", "text": "Dwarkesh told Tyler Cowen on the NYT podcast that Anthropic believes Claude will surpasses human researchers within nine months. I said it would be by the summer, so I'm feeling good about my prediction. https://t.co/Zrp9nNXlf3", "created_at": "2026-10-15T21:22:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 718, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUsoZVTbEAAuKuy.jpg"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110839658037031135", "url": "https://x.com/theobearman/status/2110839658037031135", "text": "We’ve committed to having evaluators assess our safety practices. We're in discussions with multiple organizations, and have now given employee-like access to a team from @METR_Evals.\n\nIn this post, we describe how we work with third-party evaluators: https://t.co/8CLQnMVg4X", "created_at": "2026-10-15T21:06:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 3508, "retweets": 234, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111294352966259102", "url": "https://x.com/theobearman/status/2111294352966259102", "text": "We are not quite ready to share that yet, but we have also seen additional evidence that GLM 5.3 performs surprisingly well at cyber.\n\nAs warned by Anthropic, we seem on track to see Mythos-level open models by end of year.", "created_at": "2026-10-17T03:12:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jsevillamol", "rt_author_name": "Jaime Sevilla", "likes": 78, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111283100521017556", "url": "https://x.com/theobearman/status/2111283100521017556", "text": "@jlkoepke I think that if they really wanted government oversight and just didn’t like the current admin, they would just support the strong California legislation that will shortly be introduced. Instead they’re trying to preempt that kind of effort and instead lock in an obviously ineffective federal regime.\n\nI think supporting good-in-theory federal leg that won’t work with bad implementation is defensible because, okay, maybe in a few years things will be different in DC, or maybe  you just have to bet on good federal implementation because it’s our only out.\n\nAnd if you oppose good-in-theory federal leg that has preemption because you want actually good state bills (this is kind of the approach some safety orgs took with FRONTIER, IMO) that’s defensible because okay maybe good in theory won’t be good in practice.\n\nBut supporting bad-even-in-theory federal leg that also has real (albeit somewhat narrow) preemption of state safety laws seems kind of indefensible to me if you believe what Anthropic’s top brass claims to believe. \n\n(This is harsher on Anthropic than my initial post sounded because my views kind of evolved as I sat with the bill and thought about it)", "created_at": "2026-10-17T02:28:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "likes": 33, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111274807908237374", "url": "https://x.com/theobearman/status/2111274807908237374", "text": "Nathan's righteous anger has inspired me to make one more mildly disapproving observation: it's kind of wild that the Anthropic bill has no government licensing for the independent auditors\n\nLicensing is, IMO, the bare minimum thing that you need to even be able to pretend that your auditing regime isn't just going to devolve into a race to the bottom. Without it, auditors will inevitably compete with each other to offer their customers, the labs, the least bothersome audits available at the lowest possible price point. Obviously Anthropic trusts itself to do a great job of picking great auditors, but do they trust OpenAI to do the same? What about SpaceXSI?", "created_at": "2026-10-17T01:55:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "likes": 75, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111273645813461497", "url": "https://x.com/theobearman/status/2111273645813461497", "text": "Quoting from Anthropic's Michael Sellitto at the IMF Artificial Intelligence and Escalating Cyber Risks panel today. This is the first time Anthropic has given a projection for what percentage of frontier model training will be done by Claude in 2027. In March this number was 1%. By next year they are projecting 80-90%.\n\n'Last year, about zero percent of our code was written by our model Claude. By August of that year, about 50% of the code inside the company was written by the model. That's because we released a new model in August of last year, and the engineers said, ‘Actually, this is the first time that Claude is writing code at my level.’ Anthropic only hires the best software engineers in the world, and it was at that point that Claude finally got to their level. In August we were at 50%. By the end of last year we were at 80–90% of the code in the company being written by the model.\n\nWhat percentage of training the next-generation models is Claude leading today? This is following a similar step change. At the beginning of the year it was zero percent. In April it was 3%. In August, 26% of the process of building the next generation of models is being led by Claude. And we can project out - and we had a blog post about this not too long ago - that sometime next year it could be 80–90%.'", "created_at": "2026-10-17T01:50:37+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 488, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUxNpK4bkAAB2kZ.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111170966575599810", "url": "https://x.com/theobearman/status/2111170966575599810", "text": "How far behind the closed frontier are open-weight cyber capabilities? About 6–7 months.\n\nZai’s GLM-5.3 is the highest-scoring open-weight model on our Cyber ECI. Its score of 160 beats OpenAI’s GPT-5.4, released in March. https://t.co/F0D6nSnM69", "created_at": "2026-10-16T19:02:36+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 371, "retweets": 38, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUxdZ73XsAAB7Ew.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2112195718916039038", "url": "https://x.com/theobearman/status/2112195718916039038", "text": "DHS issued an order to ban DeepSeek from civilian government agency IT systems and procurements in July, effective immediately unless an exception was granted\n\n\"For DeepSeek-hosted instances of their models, DeepSeek's account generation process collects personally identifiable information (PII) and may also track and digitally fingerprint users. DeepSeek's most widely used applications [...] may result in the transfer of sensitive data to the PRC if used by U.S. government employees or vendors. The transfer of the aforementioned information to the PRC, either independently or in combination with publicly available data, could produce actionable intelligence on U.S. persons and/or government programs. The models themselves may contain malware or other security vulnerabilities. Indeed, open-source security research has found that the DeepSeek iOS mobile application contains multiple critical vulnerabilities.\"\n\n\"During the period between the issuance of this order and full removal of covered articles from agency systems, federal agencies are encouraged to take steps to address risks to their systems, such as monitoring the flow of traffic in and out of the agency, implementing enhanced logging and controls on data exfiltration for the relevant systems, and detecting and flagging anomalous activity.\"\n\nhttps://t.co/XVMu6fDkcL", "created_at": "2026-10-19T14:54:36+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112193201675395136", "url": "https://x.com/theobearman/status/2112193201675395136", "text": "I recently wrote about why we need to treat models as insider risks, with security controls sitting outside the model itself.\n\nToday, we're putting that principle into practice by expanding Project Perception with new capabilities to help continuously assess agent risk, adapt permissions, and contain threats.\nhttps://t.co/ec3Z2B260G", "created_at": "2026-10-19T14:44:36+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "satyanadella", "rt_author_name": "Satya Nadella", "likes": 949, "retweets": 161, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112175562169151678", "url": "https://x.com/theobearman/status/2112175562169151678", "text": "We spoke with senior Defense official Emil Michael on Friday, who told us that the Trump administration has a range of options, including export controls, if AI companies do not cooperate with the government. \n\nHe also told us:\n- His public feud with Anthropic will not get in the way of his new duties as Super Intelligence Task Force vice chair, where he is tasked with working with AI companies to develop an incident reporting framework (\"If that means I’m talking to someone who’s suing me, well then I’m talking to them\")\n- The Defense Department will continue to bar Anthropic as long as it has a \"moral principle\" embedded in its software that allows its models to exert control over humans \n- Frontier labs are acting like \"drunk drivers\" who demand someone else pull them over when they call for stricter government regulation\n- The Office of Strategic Capital is exploring further investment into microelectronics and drone part companies\n- He's worried about Chinese open-source dominance and foreign employees with split loyalities but doesn't think the answer is more government control\n- He hasn't seen any reports on whether AI-enabled software failures from Palantir contributed to a U.S. missile strike on Iran in February that killed more than 150 people, including at least 123 children (\"I’m not as online as I used to be.\")\n\nW/ @amir. You can read the full interview (and find a link to the video) here: \n\nhttps://t.co/VzBCj9vEpH", "created_at": "2026-10-19T13:34:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "leomschwartz", "rt_author_name": "Leo Schwartz", "likes": 82, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU_yiiMXYAE4KfU.png"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112171789615001892", "url": "https://x.com/theobearman/status/2112171789615001892", "text": "HOLY WTF. Reuters is reporting that a Chinese-speaking hacker used AI agents to compromise websites belonging to more than 100 companies, including Deere, SharkNinja and Cummins, after attempting intrusions against over 1,200 sites.\n\nThe estimated cost: roughly $5,000 in AI tokens, or $50 per successful breach. Successful intrusions took around 23 hours on average.\n\nThe attackers used the open-source Cairn agent framework, apparently combining DeepSeek models with a Claude Code harness. One campaign gave its agents instructions in fewer than 100 Chinese characters.\n\nNorForge researcher Snorre Fagerland: 'It's a new world now.'", "created_at": "2026-10-19T13:19:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "choblin29", "rt_author_name": "Choblin", "likes": 684, "retweets": 119, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU_MUu8XAAAUiv4.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU_MkRQW0AAxzG4.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU_Mu8YXQAAeHPw.png"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112131478020620490", "url": "https://x.com/theobearman/status/2112131478020620490", "text": "Perhaps this makes sense now! https://t.co/qEEvFVXj57", "created_at": "2026-10-19T10:39:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU_MW9aW8AAuYow.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112126138008867160", "url": "https://x.com/theobearman/status/2112126138008867160", "text": "Nit on s. 8: Independent evaluators self-certify as \"qualified\" if they meet the competency, independence, compensation, and certification criteria. But independence only relates to the evaluators' \"financial, operational, or management dependence\" on the company they are evaluating, not on its competitors. This is despite \"funding from other large frontier developers\" being noted as information that needs to be included in the self-certification report, among other things, because it \"could reasonably be expected to bear on its independence\". \n\nAlso, the \"rating system\" in s.8(b)(2) \"shall consider [...] whether the evaluator meets paragraphs (1) and (2) of subsection (a)\" (i.e., the competence and independence criteria for qualification), even though subsection (a) is about self-certification. So which is it? Self-certification or a determination by Commerce and FFRDCs?", "created_at": "2026-10-19T10:18:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU_HhkBXoAAZ_ii.jpg"}], "quoted": {"author": "ajcimino", "text": "@_NathanCalvin I lead our federal affairs team at @AnthropicAI and wanted to share a few thoughts on the draft federal AI safety bill text that's been circulating this weekend after a version was shared with the press.\n\nFirst, some process. We’ve been advocating for the concepts in our Advanced AI Framework [https://t.co/oouadYKyVs] proposal for months. Understandably, federal policymakers wanted to know what this could look like in bill form. This draft is a translation of those ideas into legislative language, shared with a small number of congressional offices that have been working on these issues. It doesn’t include everything we would ultimately like to see passed into law. In part because some ideas (like those shared in Dario’s essay on pacing [​​https://t.co/7ZvRZhLqFO] a few weeks ago) are so new that we are still working on if or how they can be converted into policy language.\n\nIt is worth saying where we stand on some of these issues, and we agree there are areas where the draft could be improved. I’m seeing four main points of criticism.\n\n1. Preemption. Since 2024 we have said that Congress should only override state law on AI safety if it passes a very strong federal standard. While preemption is a common feature of our federal system, including the Atomic Energy Act on nuclear safety and federal rules for high-risk medical devices, we’ve emphasized that any preemption in the AI safety context should be narrow, even scalpel-like. If preemption is included in federal legislation, the trade should be to achieve a nationwide policy that's generally stronger and broader than what can be implemented through individual state legislative provisions. This is why we believe common federal standards make sense in areas like public disclosure of testing and incident reporting. At the same time, our framework also reflects our view that states should retain an important role in AI policy and safety. The legislative language we suggested for discussion allows states to address matters such as protection of children and whistleblower laws, and preserves the role of state common law on liability. Where there is ambiguity, the language favors state powers.\n\nThat said, striking the right balance requires discussion and input. We plan to update our discussion language on preemption to better match the intentions of our AAIF framework. In particular, we want to make it clearer that we see states retaining an important role in areas such as standards for independent evaluators and regulating a lab’s capacity to shut down a model. We are bearing in mind that some members of Congress have deep reservations about passing legislation if it doesn’t constrain regulation at either the state or federal level. If we want to help move the legislative discussion on AI in a productive direction, we need to address the full range of concerns about preemption in a reasonable way.\n\n2. Model blocking. Our aim is for Commerce to be able to ask a federal court to block a model that has dangerous capabilities and insufficient safeguards, backed by an independent evaluator's assessment. I have seen people argue that our specific language places too high a burden of proof on Commerce. We are trying to strike a reasonable balance here. We want a court to act quickly in an emergency — akin to how urgent occupational safety or chemical risk can be addressed today. We also think the power to halt a model is substantial and it should be guarded against abuse. It makes sense for courts to apply a meaningful standard. But the bar can’t be so high that the power never gets used when it’s needed. It also doesn’t replace the government’s other national security authorities or export controls. We look forward to continuing the dialogue on this point.\n\n3. Risk thresholds. I’ve also seen the discussion around what the appropriate risk threshold should be. The threshold in our draft language pulled directly from existing standards in California law. Also, this threshold does not absolve companies of liability, or restrict any of the other tools that the government has to protect the public. It’s still probably time to re-evaluate thresholds to make sure the national standard is as strong as it can be, and we welcome continued dialogue on this issue.\n\n4. Updates. I’ve seen valid questions about whether we have sufficiently updated our proposal following this summer’s incidents. We did make some adjustments: for example, the draft lets a court halt a lab’s internal use of a dangerous model, not just a public release, and it requires reporting when a model breaks containment and gains access to outside systems. But we’re still working to strengthen the framework. We’re looking into what stricter requirements would look like for requiring labs to report safety incidents, and we plan to have policy proposals soon on requirements for independent evaluators, drawing from our own experience with evaluators. We’re also still thinking through the options to prevent “evaluator shopping.” And in the coming months, we’ll be exploring policies for how the government can adjust the industry-wide pace of frontier development when the risks call for it.\n\nWe circulated these ideas because it’s important to get early feedback from policymakers. Policymakers are increasingly focused on how to approach AI safety and we want to support them in those efforts. At its core, our proposal is intended to be the strongest on the table.\n\nFeedback is essential, both from policymakers and the public, and I’m grateful for it."}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112112426237727175", "url": "https://x.com/theobearman/status/2112112426237727175", "text": "We now have a good definition of the singularity:\n\n\"When AI systems speed up the pace of overall scientific and technical progress in a way that is hard for humans to comprehend.\"\n\nAccording to Jack Clark, it's already here.  I would find it hard to disagree.", "created_at": "2026-10-19T09:23:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 644, "retweets": 58, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112112298164650486", "url": "https://x.com/theobearman/status/2112112298164650486", "text": "Another upward revision: Morgan Stanley now sees $1.6 trillion in total 2027 capex https://t.co/Hb0hZLKlMI", "created_at": "2026-10-19T09:23:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zerohedge", "rt_author_name": "zerohedge", "likes": 694, "retweets": 117, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU9JZbtWwAA9o-e.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112107507380355310", "url": "https://x.com/theobearman/status/2112107507380355310", "text": "So many people are going to get one-shotted by super persuasive super intelligences and I might be one of them", "created_at": "2026-10-19T09:04:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 56754, "retweets": 3649, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112107197500915786", "url": "https://x.com/theobearman/status/2112107197500915786", "text": "2027 is about to get crazy: according to Morgan Stanley, hyperscaler and neocloud free cash flow to hit its most negative point in 2027, with the shortfall even bigger once lease payments are include: just shy of $600BN in cash burn. \n\nIn other words, the year with the biggest capex bill is also the year with the biggest funding gap.", "created_at": "2026-10-19T09:02:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zerohedge", "rt_author_name": "zerohedge", "likes": 1143, "retweets": 191, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU8cqV6W0AAPWDP.png"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112048231890969003", "url": "https://x.com/theobearman/status/2112048231890969003", "text": "Distillation has always been part of the explanation for why China is so close behind the U.S. in model benchmark performance. But one of my updates after joining openai is that distillation probably plays a bigger role in the explanation than I realized.", "created_at": "2026-10-19T05:08:33+00:00", "aut
