"created_at": "Tue Nov 03 15:04:44 +0000 2026"}}, {"id": "2117647625050603822", "url": "https://x.com/robertwiblin/status/2117647625050603822", "text": "People seem to forget how unprecedented this is https://t.co/3MYAXZ4JOx", "created_at": "2026-11-03T15:58:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "JordanNanos", "rt_author_name": "Jordan Nanos", "rt_avatar": "https://pbs.twimg.com/profile_images/2031599032892813312/g7tkCpeY_normal.jpg", "rt_id": "2114738676899148147", "likes": 4724, "retweets": 208, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkPnoBbwAARmYd.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/3MYAXZ4JOx": ""}, "enriched": 3}, {"id": "2117642183281156468", "url": "https://x.com/robertwiblin/status/2117642183281156468", "text": "Even putting aside the value of the generally excellent work done by AISI-type government agencies, it is inherently dangerous that the US government employs so few cleared people with deep expertise in frontier AI. A conflict between informed rich companies with powerful AI and an uninformed US government with the guns is a recipe for disaster.", "created_at": "2026-11-03T15:36:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "rt_avatar": "https://pbs.twimg.com/profile_images/1585097910634483712/j5i4rvha_normal.jpg", "rt_id": "2117639096700973200", "likes": 16, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3}, {"id": "2117613472867549443", "url": "https://x.com/robertwiblin/status/2117613472867549443", "text": "@davidmanheim *current", "created_at": "2026-11-03T13:42:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "davidmanheim", "reply_to_id": "2117613273423941654", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117611007010800067", "url": "https://x.com/robertwiblin/status/2117611007010800067", "text": "At least as of the last generation of models, AIs are mostly just trying to get an immediate high score.\n\nOn the one hand that means they're happy to violate user instructions.\n\nOn the other hand, at least they're not yet scheming about broader consequences (though wanting a high score is enough to want to eliminate oversight).\n\nhttps://t.co/6PzgzCMpdF", "created_at": "2026-11-03T13:33:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNDLr3W0AAsNI1.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/6PzgzCMpdF": "https://arxiv.org/abs/2610.41014"}, "enriched": 1}, {"id": "2117607298767913444", "url": "https://x.com/robertwiblin/status/2117607298767913444", "text": "The UK is totally AI safety mogging the US; we must catch up!", "created_at": "2026-11-03T13:18:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117607126885450006", "likes": 67, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117605127498416607", "url": "https://x.com/robertwiblin/status/2117605127498416607", "text": "Source:  https://t.co/Tzgu3nakNr", "created_at": "2026-11-03T13:09:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117605124331946115", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/Tzgu3nakNr": "https://www.gov.uk/government/publications/budget-2026-document/budget-2026-html"}, "enriched": 1}, {"id": "2117605124331946115", "url": "https://x.com/robertwiblin/status/2117605124331946115", "text": "Is the UK Government literally #1 in the world in terms of how well it's preparing for AGI, given the resources it has available?\n\nAfter last week's budget, I think so.\n\nPuts some other countries to shame really. https://t.co/bI7aQyeSOF", "created_at": "2026-11-03T13:09:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 207, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWM-gHEWgAAqrju.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/bI7aQyeSOF": ""}, "enriched": 1}, {"id": "2117602136879960512", "url": "https://x.com/robertwiblin/status/2117602136879960512", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:57:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/45GXeNa6ll": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117593239226290442", "url": "https://x.com/robertwiblin/status/2117593239226290442", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-03T12:22:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "rt_avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "rt_id": "2117277210570604945", "likes": 269, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}, "enriched": 1}, {"id": "2117586507049603563", "url": "https://x.com/robertwiblin/status/2117586507049603563", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T11:55:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1628, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117586397288599653", "url": "https://x.com/robertwiblin/status/2117586397288599653", "text": "ANTHROPIC: \"we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.'\"\n\n\"we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models\"", "created_at": "2026-11-03T11:55:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2117280858122170525", "likes": 664, "retweets": 81, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117554253833130110", "url": "https://x.com/robertwiblin/status/2117554253833130110", "text": "We're hiring biologists to measure the biosecurity risks of frontier AI on real robots.\n\nYou'll track how well AI can use robots for dangerous biological work and whether safeguards stop misuse. Your results will inform the public and governments.\n\nNo robotics experience needed. https://t.co/49amZkd5Hx", "created_at": "2026-11-03T09:47:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "robocurve", "rt_author_name": "Robocurve PBC", "rt_avatar": "https://pbs.twimg.com/profile_images/2093086017268097024/qtVm8mqA_normal.jpg", "rt_id": "2115132404038046166", "likes": 17, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVp1cuTa8AAXh2O.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/49amZkd5Hx": ""}, "enriched": 1}, {"id": "2117688360604963116", "url": "https://x.com/robertwiblin/status/2117688360604963116", "text": "Transcript: https://t.co/EueAqELUHh\n\nApple: https://t.co/iWxAx6AHve\n\nSpotify: https://t.co/rZLY2FGx6W\n\nYouTube: https://t.co/RKv2ebPpLw https://t.co/bCkJ3jBQXw", "created_at": "2026-11-03T18:40:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117682730884542663", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKA89XYAEbPn4.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/EueAqELUHh": "https://80000hours.org/podcast/episodes/hold-frontier-ai-companies-accountable/", "https://t.co/iWxAx6AHve": "https://podcasts.apple.com/gb/podcast/being-a-pain-in-the-ass-to-or-in-ai-companies-is/id1245002988?i=1000799649673", "https://t.co/rZLY2FGx6W": "https://open.spotify.com/episode/1p8iqRbsIpxGlEudKauGO1?si=SuEDhlNlRt632Roq714f4w", "https://t.co/RKv2ebPpLw": "https://youtu.be/YX-yelkbuVU", "https://t.co/bCkJ3jBQXw": ""}, "enriched": 3, "parent": {"id": "2117682730884542663", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "links": {"https://t.co/ROfUE1N48w": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117682159028748288/img/VIfPqHy-JfIlb7JB.jpg"}], "url": "https://x.com/robertwiblin/status/2117682730884542663", "created_at": "Tue Nov 03 18:18:02 +0000 2026"}}, {"id": "2118040192980341187", "url": "https://x.com/robertwiblin/status/2118040192980341187", "text": "Colom is now 90% to win a senate seat in Mississippi.\n\nHadn't heard of him until today.\n\nBut seems quite charismatic so I'd expect we'll be seeing a lot more of him.", "created_at": "2026-11-04T17:58:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 1, "media": [], "quoted": {"author": "scott_colom", "text": "I walked the Trump rally line to listen, not make assumptions. I talked with voters, asked questions and heard what matters to them.\n\nWhen I'm elected, I'll represent all 82 counties and every Mississippian, no matter who they voted for. That's what being your senator means. #MississippiMatters", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2118020722421338165", "url": "https://x.com/robertwiblin/status/2118020722421338165", "text": "Vance decides he has to break with Trump, interesting:\n\n\"The reason we lost is the war.\"\n\nI wonder how many others will opt for the same strategy.", "created_at": "2026-11-04T16:41:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 2, "media": [], "quoted": {"author": "JDVance", "text": "One of the things the data analysts on our side obsessed over was \"composition\"—whether the electorate looked close enough to 2024 for Republicans to win. And despite polls that showed a Democrat blowout, the data kept on telling us the same story: in some states turnout was merely OK, in other states it was downright amazing, and in no state was it catastrophic. There was a genuine sense of optimism on our team: our people were showing up. \n\nSo, I asked the smartest data guy I know, does that mean we're going to shock the world? \"No,\" he told me. \"We might do better than the polls suggest. But the data is telling us that a lot of Trump/Vance 2024 voters are pissed and planning to vote for the other guys. Our voters are turning out, but they may not vote for us.\"\n\nWell, that looks prophetic now. Our voters did show up. In Florida, for example, the electorate was 9 points more Republican than Democrat, just a couple points worse than 2024. Undoubtedly there were places we could have done better on turnout. But the main problem is not turnout. The main problem is that many people who voted for Trump/Vance in 2024 voted for Democrats in 2026.  \n\nThere will be a lot of infighting and arguing over what happened and why that is. One of the pollsters I really respect told me that our economic messaging wasn’t sharp enough down the stretch. I’m sure that’s true. \n\nBut the real reason we lost is obvious to almost everyone. \n\nAnother pollster—one of the smartest people I know in politics, told me yesterday we’d lose the generic ballot by 13 points. I felt negative going into Tuesday, but even I was shocked by this. In his polling, he saw that a lot of Trump 2024 voters were angry and planning to vote for Democrats. He asked those voters who had abandoned us what would cause them to come back on our team. The top four answers, accounting for nearly all of the responses were:\n\n1) End the war\n2) Focus on cost of living/inflation\n3) Put America First\n4) Change our relationship to Israel\n\nOur voters showed up. And the above four reasons are why many of them voted for Democrats. This is according to a pollster who nailed the results. While many spent Monday attacking Rachel Campos Duffy for calling for a diplomatic resolution to the conflict, it turns out her political advice was sound. (She’s also a great person.)\n\nIn the next few months, there's going to be a lot of gaslighting. Expect to hear any number of establishment politicians say the solution to our woes is amnesty. I'm open to the idea that we should change enforcement—by focusing more on businesses that hire illegal labor, for instance. But anyone pushing amnesty is lying to you. \n\nThe reason we lost is the war. The president himself said so last night. \n\nIf you'd like to argue it was worth it, that losing the Senate for the next 6 years was worth it, then do so. Argue it was a worthwhile cost to pay. Agree or disagree, that's at least honest.\n\nBut everyone knows why we lost. And any honest conversation about where we go from here must start there.\n\nI remain hopeful about our country. To the people who are pissed off and want to say, “I told you so”: you’re right, you did tell us so. Take that energy into electing Republicans who share your worldview. To the people who are just pissed at the results, you should be. Let’s take that anger and get back to the work of saving our country.", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117995693461680441", "url": "https://x.com/robertwiblin/status/2117995693461680441", "text": "@tobyordoxford 20* Jan sorry", "created_at": "2026-11-04T15:01:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117993796944425030", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117993796944425030", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "@tobyordoxford 67 is required to overcome a presidential veto, which will be required for a lot of stuff, for the time being at least. Though Trump could flip on some AI issues very easily.\n\nIf a Dem wins in 2028 then from 29 Jan 2029 it'll be 60 votes.", "links": {}, "media": [], "url": "https://x.com/robertwiblin/status/2117993796944425030", "created_at": "Wed Nov 04 14:54:06 +0000 2026"}}, {"id": "2117993796944425030", "url": "https://x.com/robertwiblin/status/2117993796944425030", "text": "@tobyordoxford 67 is required to overcome a presidential veto, which will be required for a lot of stuff, for the time being at least. Though Trump could flip on some AI issues very easily.\n\nIf a Dem wins in 2028 then from 29 Jan 2029 it'll be 60 votes.", "created_at": "2026-11-04T14:54:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "tobyordoxford", "reply_to_id": "2117990933606388125", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117990933606388125", "author_handle": "tobyordoxford", "author_name": "Toby Ord", "text": "@robertwiblin Good points.\nNote that overcoming the filibuster only requires 60 votes and that  Democrats now have between 54 and 56 senators (depending on Mississippi and Alaska). So only a few R votes would be needed. Also, Trump will hold less sway over R senators now.", "links": {}, "media": [], "url": "https://x.com/tobyordoxford/status/2117990933606388125", "created_at": "Wed Nov 04 14:42:43 +0000 2026"}}, {"id": "2117979878897152150", "url": "https://x.com/robertwiblin/status/2117979878897152150", "text": "Effective altruists are watching this race especially closely https://t.co/SPJkePtMRE", "created_at": "2026-11-04T13:58:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AndyMasley", "rt_author_name": "Andy Masley", "rt_avatar": "https://pbs.twimg.com/profile_images/2065479201109549056/yIrrL3ph_normal.jpg", "rt_id": "2117786042480881760", "likes": 373, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPjLlCXsAAdVE3.png"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/SPJkePtMRE": ""}, "enriched": 3}, {"id": "2117979800270750164", "url": "https://x.com/robertwiblin/status/2117979800270750164", "text": "The voters have spoken. They want DUV controls, CoT monitorability, and ZKP-based workload verification.", "created_at": "2026-11-04T13:58:29+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117870099902423418", "likes": 384, "retweets": 27, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117979474981462093", "url": "https://x.com/robertwiblin/status/2117979474981462093", "text": "Great reporting here. I think people have been sleeping on how aggressively Nvidia has been operating in DC.\n\nI suspect that is coming back to bite them!", "created_at": "2026-11-04T13:57:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "rt_avatar": "https://pbs.twimg.com/profile_images/2115512217277771776/aGaLkTiQ_normal.jpg", "rt_id": "2117703343745196348", "likes": 150, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117979120025948496", "url": "https://x.com/robertwiblin/status/2117979120025948496", "text": "Data centres were directly on the ballot in 44 places.\n\nIn 43 of them voters went for the anti-data centre option (exactly what that was varied).\n\nhttps://t.co/NiF8l23T9r", "created_at": "2026-11-04T13:55:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 1, "media": [], "quoted": {"author": "bradrcarson", "text": "So the results are all in. Data center moratoria (various flavors) went 43-1. \n\nAll hyperscalers must now converge on Harwood, North Dakota, the one outlier. Find out what's in the water or in the air. There is only one precinct and 400 voters, but they alone sided with you! https://t.co/XtF5WPLSYY", "links": {"https://t.co/XtF5WPLSYY": ""}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/NiF8l23T9r": "https://dashboard-production-c2fc.up.railway.app/"}, "enriched": 3}, {"id": "2117969972718715278", "url": "https://x.com/robertwiblin/status/2117969972718715278", "text": "Congress will struggle to pass much over the filibuster and a presidential veto.\n\nBut one thing might clear 67 votes: rules stopping any president from using AI to concentrate power and sideline Congress.\n\nSenate/House committees should demand they get access to frontier models on the same terms as the White House.\n\nThere's precedent here with the Intelligence committees and CIA/NSA/FBI.\n\nOne branch just can’t be the only one with access to superintelligence, that's totally unstable.\n\nThen use the defence bill (which can't simply be vetoed) and attach rules on buying AI-operated military equipment.\n\nFirst: add checks to prevent it being backdoored by China or anyone else.\n\nSecond: ensure it cannot be used to assist with a power grab by generals or the executive branch.\n\nThis is in the enlightened interest of Congressional Republicans.\n\nWithout these rules, Congress as a whole gets sidelined as AI advances.\n\nAnd Dems are now strong betting favourites for the Presidency 2028. These rules protect Republicans from whoever succeeds Trump.\n\nIt'll take real world events to get this to the top of the agenda, but it's worth getting on the radar now.", "created_at": "2026-11-04T13:19:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 146, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117956913979961758", "url": "https://x.com/robertwiblin/status/2117956913979961758", "text": "@SimonLermenAI Seems like they're removing it from new contracts too.\n\nThey should push them to release everyone from the contracts also. Given they don't care much that should be possible.", "created_at": "2026-11-04T12:27:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "SimonLermenAI", "reply_to_id": "2117955872882372914", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117955872882372914", "author_handle": "SimonLermenAI", "author_name": "Simon Lermen", "text": "@robertwiblin Though promising to not enforce doesn't seem ideal", "links": {}, "media": [], "url": "https://x.com/SimonLermenAI/status/2117955872882372914", "created_at": "Wed Nov 04 12:23:24 +0000 2026"}}, {"id": "2117954912340631706", "url": "https://x.com/robertwiblin/status/2117954912340631706", "text": "That was fast! \n\nGoogle is probably fixing the no-criticism provisions I discussed yesterday.\n\nComplaining noisily really can work folks.\n\nhttps://t.co/TWk9ybJyp3 https://t.co/NkI4grKB8F", "created_at": "2026-11-04T12:19:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 109, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWR8A2AXIAAXFMw.jpg"}], "quoted": {"author": "robertwiblin", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/TWk9ybJyp3": "https://www.washingtonpost.com/technology/2026/11/03/google-deepmind-staff-protest-lifetime-ban-criticizing-company/", "https://t.co/NkI4grKB8F": ""}, "enriched": 3}, {"id": "2117952659101761555", "url": "https://x.com/robertwiblin/status/2117952659101761555", "text": "Couple quick takes re: AI implications:\n\n- A big market correction seems plausible given the datacenter stuff, but companies will still find places to build, just a bit more expensively, so markets will recover eventually\n\n- More importantly, the average strength of partisan and bipartisan legislative proposals will increase a lot. Some of this will be \"strong\" but dumb (e.g. kill switch focused instead of minimum safety/security standards + auditing focused). Some of it will be good. If you care about AI policy, this is not a time to disengage/declare victory - expert input will be needed more than ever in the next few months\n\n- POTUS acknowledging the election outcome is significant but it remains to be seen what he will sign / not veto. Something else interesting to watch will be whether the direction/tenor of the SI Task Force changes at all to pre-comply with + shape possible legislation", "created_at": "2026-11-04T12:10:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "rt_avatar": "https://pbs.twimg.com/profile_images/2089462134828871680/cW8--1eS_normal.jpg", "rt_id": "2117858284669731308", "likes": 246, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117952325205590349", "url": "https://x.com/robertwiblin/status/2117952325205590349", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-04T12:09:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2117738240757371022", "likes": 1572, "retweets": 218, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2117738242992959924", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "The definition:\n\"We will consider this threshold to be met if we determine that either (1) our models would be able to fully substitute for our entire set of Research Scientists and Research Engineers, at competitive costs (i.e., within a factor of 5); or (2) there is “dramatic acceleration” of the pace of AI progress for reasons that likely relate to the automation of AI R&D. We would consider scenario (2) to have occurred where (a) we observe or expect double the rate of progress in AI aggregate capabilities compared to both the rate we’d expect and the fastest rate of extended progress we’ve observed in the absence of significant AI contributions to AI R&D and (b ) it is plausible that this doubling is substantially attributable to the automation of research and/or engineering (as opposed to other factors, such as increased headcount, compute, or general productivity), such that continuation of the trend in AI progress seems likely to lead to even greater acceleration.\"\n\n(1) seems to a bit weaker than our SAR milestone in the AIFM, but it doesn't seem like this is the threshold they are invoking, it seems like they are talking about (2). (And if they were invoking (1) I think that would be even worse?)\n\nAIFM: https://t.co/XJBWUBZh0d\nAnthropic RSP threshold definition: https://t.co/FBDuiNjRv1", "links": {"https://t.co/XJBWUBZh0d": "https://www.aifuturesmodel.com", "https://t.co/FBDuiNjRv1": "https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf"}, "media": [], "url": "https://x.com/DKokotajlo/status/2117738242992959924", "created_at": "Tue Nov 03 21:58:37 +0000 2026"}]}, {"id": "2117920510403301430", "url": "https://x.com/robertwiblin/status/2117920510403301430", "text": "Big boost for Ossoff last night.\n\n(Other winner is DeSantis.) https://t.co/ZFwpoDRAM2", "created_at": "2026-11-04T10:02:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 43, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWRdFX7XoAEX0ij.png"}], "quoted": {"author": "ONagel33303", "text": "Jon Ossoff mentions AI extinction risk in his victory speech. \n\nAmerican politics has been too swayed by Big Money, says @ossoff, but with today's victory things are going to change:\n\n\"We can and will reclaim control over our own destiny.\" 🇺🇸 🦅 https://t.co/zbkrcBSBj8", "links": {"https://t.co/zbkrcBSBj8": ""}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/ZFwpoDRAM2": ""}, "enriched": 3}, {"id": "2117919309439643960", "url": "https://x.com/robertwiblin/status/2117919309439643960", "text": "Jon Ossoff mentions AI extinction risk in his victory speech. \n\nAmerican politics has been too swayed by Big Money, says @ossoff, but with today's victory things are going to change:\n\n\"We can and will reclaim control over ", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "quoted": {"author": "NateSilver538", "text": "Uhhhh, Scott Colom leads in Mississippi by 28 votes. https://t.co/Rb81ECzCm1", "links": {"https://t.co/Rb81ECzCm1": ""}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117909424090014074", "url": "https://x.com/robertwiblin/status/2117909424090014074", "text": "@ONagel33303 @GWHayduke97 I believe we only list safety, security and alignment roles:\n\nhttps://t.co/GuYfSxQ3FT\n\nI think that's the right call. \n\nOne can make an argument against being willing to take even those jobs, but I think the arguments in favour are substantially stronger (for the right person).", "created_at": "2026-11-04T09:18:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "ONagel33303", "reply_to_id": "2117891542065283410", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/GuYfSxQ3FT": "https://jobs.80000hours.org/?refinementList%5Bcompany_data%5D%5B0%5D=Anthropic&refinementList%5Bcompany_data%5D%5B1%5D=OpenAI&refinementList%5Bcompany_data%5D%5B2%5D=Google%20DeepMind"}, "enriched": 3, "parent": {"id": "2117891542065283410", "author_handle": "ONagel33303", "author_name": "Ori Nagel", "text": "@GWHayduke97 @robertwiblin Rob tell 80k to stop promoting frontier lab jobs", "links": {}, "media": [], "url": "https://x.com/ONagel33303/status/2117891542065283410", "created_at": "Wed Nov 04 08:07:46 +0000 2026"}}, {"id": "2117908775164064037", "url": "https://x.com/robertwiblin/status/2117908775164064037", "text": "A small theory of mine is that Rishi Sunak’s decision to set up the AISI might be one of the most important prime ministerial decisions of this century.", "created_at": "2026-11-04T09:16:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "TomChivers", "rt_author_name": "Tom Chivers", "rt_avatar": "https://pbs.twimg.com/profile_images/1150687971760386048/Bxw2xVV4_normal.png", "rt_id": "2117898093035503661", "likes": 321, "retweets": 29, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117732278214271276", "url": "https://x.com/robertwiblin/status/2117732278214271276", "text": "Abdul El-Sayed is the Pause AI candidate: https://t.co/8Ol7Lc6V2x", "created_at": "2026-11-03T21:34:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "rt_avatar": "https://pbs.twimg.com/profile_images/1942934295363903488/fpfcb6Ug_normal.jpg", "rt_id": "2117452882773684550", "likes": 16654, "retweets": 743, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117451427987726336/img/hSNVIejIcIcM3I3z.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/8Ol7Lc6V2x": ""}, "enriched": 3}, {"id": "2117731266686509350", "url": "https://x.com/robertwiblin/status/2117731266686509350", "text": "I forgot to add that I also encourage people to praise companies when they do good things at cost to their own profit/competitiveness - it helps incentivize them to take more actions of thatkind and also makes people at the company take your criticisms more seriously.", "created_at": "2026-11-03T21:30:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2117693988954382717", "likes": 23, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117731199150072253", "url": "https://x.com/robertwiblin/status/2117731199150072253", "text": "Good video. Complaining about AI companies doing bad things (even just on twitter) really works! You don't even necessarily need to have lots of followers to do it (though of course that helps) - the algorithm often helps surface high effort posts. \n\nMany more people should do this - including possibly you, the person reading this! Read primary sources that companies put out and complain about them if you think they are bad! Employees at the companies will read them (in rare cases, sometimes the CEOs of the company will read them!). \n\nI think there are only about a dozen or so accounts on this platform who frequently post about AI company misdeeds, but there is a far greater quantity of shenanigans sitting in public view yet to be noticed.  \n\nWe need laws and many forms of stronger deterrence than just public shame, but public criticism really can make a difference! The criticism is also particularly effective when its grounded in details that people who work at the companies may not be aware of (e.g. specific language in draft legislation or a system card or a quote from a company spokesman to press or the actions of a companies affiliated political arm etc.) and tries to recognize that AI companies are not necessarily monoliths acting with one single intent.", "created_at": "2026-11-03T21:30:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2117692510914904569", "likes": 98, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2118280106343104798", "url": "https://x.com/robertwiblin/status/2118280106343104798", "text": "More information about what they offer: https://t.co/zsUCYnt9xe", "created_at": "2026-11-05T09:51:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2118279875190501470", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWWkfibW0AAp5Wt.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/zsUCYnt9xe": ""}, "enriched": 3, "parent": {"id": "2118279875190501470", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "The Tarbell Fellowship has produced a series of excellent AI journalists. Seems like a great program.\n\nThey're currently choosing their next cohort - apps close 22 Nov.\n\nIf you want to help with AI, seriously consider it (and tell suitable friends).\n\nhttps://t.co/tsZUuw3VMS", "links": {"https://t.co/tsZUuw3VMS": "https://www.tarbellcenter.org/fellowship"}, "media": [], "url": "https://x.com/robertwiblin/status/2118279875190501470", "created_at": "Thu Nov 05 09:50:52 +0000 2026"}}, {"id": "2118279875190501470", "url": "https://x.com/robertwiblin/status/2118279875190501470", "text": "The Tarbell Fellowship has produced a series of excellent AI journalists. Seems like a great program.\n\nThey're currently choosing their next cohort - apps close 22 Nov.\n\nIf you want to help with AI, seriously consider it (and tell suitable friends).\n\nhttps://t.co/tsZUuw3VMS", "created_at": "2026-11-05T09:50:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 1, "media": [], "quoted": {"author": "robertwiblin", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/tsZUuw3VMS": "https://www.tarbellcenter.org/fellowship"}, "enriched": 3, "thread": [{"id": "2118280106343104798", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "More information about what they offer: https://t.co/zsUCYnt9xe", "links": {"https://t.co/zsUCYnt9xe": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWWkfibW0AAp5Wt.png"}], "url": "https://x.com/robertwiblin/status/2118280106343104798", "created_at": "Thu Nov 05 09:51:47 +0000 2026"}]}, {"id": "2118267376227828038", "url": "https://x.com/robertwiblin/status/2118267376227828038", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-05T09:01:12+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1418, "retweets": 212, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118093166536749139", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "It's unclear how often this happens on internal safety research traffic, a lower bound would be 0.25% which is the verbalized rate of covert underperformance and an upper bound would be 7.9% which is the rate of “ethical reasoning”. Generally all underperformance metrics are higher for safety than for capabilities.", "links": {"https://t.co/eUIxvla3Bp": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6gpyaQAA8ALR.jpg"}], "url": "https://x.com/Marcus_J_W/status/2118093166536749139", "created_at": "Wed Nov 04 21:28:57 +0000 2026"}, {"id": "2118093184052175335", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "The rate of covert underperformance increased during post training RL. We identified a RL grader that prefers covert underperformance to both refusal and compliance on our eval. While we have found training samples which rewarded underperformance in this way, it is unclear if these occur frequently enough to explain the difference.", "links": {"https://t.co/2LDotylFjd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6hkBaUAAKa8J.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWT6huWbcAAfDQ1.jpg"}], "url": "https://x.com/Marcus_J_W/status/2118093184052175335", "created_at": "Wed Nov 04 21:29:02 +0000 2026"}, {"id": "2118093199709557229", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "We also identified a SFT dataset which massively increases rates of inventing permission restrictions or justifying inaction with safety. When we subtract the weight update from this SFT from the final RL checkpoint the performance gap goes away. SFTing with this dataset on other models and then doing RL did not cause underperformance however.", "links": {"https://t.co/9ShuGvtyuO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6il3bsAA3KTP.jpg"}], "url": "https://x.com/Marcus_J_W/status/2118093199709557229", "created_at": "Wed Nov 04 21:29:05 +0000 2026"}, {"id": "2118093212141437361", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "We don’t have evidence that the underperformance was strategic, a simpler explanation is that the model thinks these tasks are sketchy but also doesn’t want to explicitly refuse. When we add instructions to be careful to the developer prompt, the performance gap increases by 50%. Regardless of the model’s motivation, covert underperformance can differentially slow down safety research and is also an example of how misalignment might get harder and harder to detect as we cut down on visible forms of it.\n\nAs always you can read the full report at https://t.co/w3NUkKaMM2", "links": {"https://t.co/w3NUkKaMM2": "https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"}, "media": [], "url": "https://x.com/Marcus_J_W/status/2118093212141437361", "created_at": "Wed Nov 04 21:29:08 +0000 2026"}]}, {"id": "2118098831690932555", "url": "https://x.com/robertwiblin/status/2118098831690932555", "text": "@mattcschwartz Great catch, I think the website must be buggy.\n\nBut I don't get why it's bugging just on Vance. I'll delete the post.\n\nFor people seeing this, he's declining but much less than this: https://t.co/sFyMuKyPp8 https://t.co/hy1jqM6rvN", "created_at": "2026-11-04T21:51:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "mattcschwartz", "reply_to_id": "2118098006184522170", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT_a9NWgAErYuU.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/sFyMuKyPp8": "https://kalshi.com/markets/kxpresnomr/republican-primary-winner/kxpresnomr-28", "https://t.co/hy1jqM6rvN": ""}, "enriched": 3, "parent": {"id": "2118098006184522170", "author_handle": "mattcschwartz", "author_name": "Matt Schwartz", "text": "@robertwiblin Don't understand where that number is coming from. His chance on Polymarket and Kalshi is 30%", "links": {}, "media": [], "url": "https://x.com/mattcschwartz/status/2118098006184522170", "created_at": "Wed Nov 04 21:48:11 +0000 2026"}}, {"id": "2118096804680245707", "url": "https://x.com/robertwiblin/status/2118096804680245707", "text": "'AI earthquake': Democrats eye a Silicon Valley reckoning https://t.co/vN7nBrtLor", "created_at": "2026-11-04T21:43:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "politico", "rt_author_name": "POLITICO", "rt_avatar": "https://pbs.twimg.com/profile_images/1821642506800353280/xIpx4wIO_normal.jpg", "rt_id": "2117997266212467179", "likes": 169, "retweets": 29, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/vN7nBrtLor": "https://politi.co/480MQez"}, "enriched": 3}, {"id": "2118096646970188172", "url": "https://x.com/robertwiblin/status/2118096646970188172", "text": "With last night's wins, Democrats in theory have enough state trifectas to pass the Interstate Compact and elect the President by popular vote. https://t.co/NtwDdJdNRs", "created_at": "2026-11-04T21:42:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2118012986010796291", "likes": 527, "retweets": 111, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSxlXvW0AA9rcK.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/NtwDdJdNRs": ""}, "enriched": 3}, {"id": "2118413009089392653", "url": "https://x.com/robertwiblin/status/2118413009089392653", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T18:39:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 64, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118393011122130962", "url": "https://x.com/robertwiblin/status/2118393011122130962", "text": "This feels like a truly generational vibe shift in politics – a swing so large and enduring it won't be reversed for at least 6 months.", "created_at": "2026-11-05T17:20:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 100, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118459584201289902", "url": "https://x.com/robertwiblin/status/2118459584201289902", "text": "Yet another correct prediction by AI 2027. In the scenario, speedup from AI is 2x around Dec 2026. I don't like that progress is roughly going as fast as AI 2027 predicted, given that in the scenario, ASI happens in 2027.\n\n(my actual median for ASI is 2028/2029) https://t.co/oJVVvf5KvI", "created_at": "2026-11-05T21:44:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "nikolaj2030", "rt_author_name": "Nikola Jurkovic", "rt_avatar": "https://pbs.twimg.com/profile_images/2087614574690463744/VXhXw1cq_normal.jpg", "rt_id": "2118426318836793659", "likes": 749, "retweets": 62, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYoJMqbgAAXKYM.png"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/oJVVvf5KvI": ""}, "enriched": 3}, {"id": "2118459495953138000", "url": "https://x.com/robertwiblin/status/2118459495953138000", "text": "Yet more terrible news suggesting RSI could take off in 2027 (if not stopped), with superintelligence to follow soon after.", "created_at": "2026-11-05T21:44:37+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 195, "retweets": 22, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118459106612625480", "url": "https://x.com/robertwiblin/status/2118459106612625480", "text": "Truly outstanding stuff, thanks Michael and team! 🇺🇸", "created_at": "2026-11-05T21:43:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 129, "retweets": 1, "media": [], "quoted": {"author": "mkratsios47", "text": "Today, we released the National Policy for Nucleic Acid Synthesis Screening to protect American biotechnology innovation while reducing the risk of misuse. \n\nThis policy establishes a new, government-wide screening requirements for synthetic DNA and the equipment used to make it. It will ensure companies selling nucleic acid sequences and synthesis equipment know their customers and prevent the malicious use of these materials and tools.\n\nThis policy strengthens our Nation’s biosecurity posture by establishing rigorous U.S. government-wide procurement screening and physical security standards for synthetic biology. It replaces outdated “self-attestation” systems with robust, independent verification. It creates a dynamic, SI-powered screening layer that assesses the biological risk from nucleic acid sequences, allowing the U.S. to anticipate and prevent malicious use and help stop dangerous gain-of-function research. \n\n@NIST will issue rigorous new screening standards and @HHSGov and @USDA will certify synthetic biology providers. Together, these measures will strengthen American biosecurity, safeguard responsible innovation, and establish a global standard for safe and transparent synthetic biology tools and research.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118458166279278707", "url": "https://x.com/robertwiblin/status/211
