_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2123461306833355093", "likes": 246, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122012991763755009/img/5D_JwROhpAL9GxKI.jpg"}], "links": {"https://t.co/YYLp4RLXWG": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125905725461328209", "url": "https://x.com/dwarkesh_sp/status/2125905725461328209", "text": "Ending factory farming isn't about making everyone vegetarian.  \n\nThe animal welfare movement made the same mistake as early environmentalists - turning a systems problem into a personal virtue test.  \n\nNo major social reform succeeded by first converting millions to change their habits. They changed the defaults - subsidies, procurement, regulations.  \n\nYou could have more impact on animal welfare while eating a burger than a vegan who believes they are doing their part.\n\n@Lewis_Bollard", "created_at": "2026-11-26T10:53:17+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2121649364498366823", "likes": 329, "retweets": 18, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121244836757970944/img/7-VL80HG3chaQtAT.jpg"}], "links": {"https://t.co/NIkRA7xq8a": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123926904214634527", "url": "https://x.com/Lewis_Bollard/status/2123926904214634527", "text": "Scoop: Senate Rs are revolting over efforts to add controversial Save Our Bacon language to final farm bill \n\nRick Scott and Susan Collins called the push \"dangerous federal overreach\" \n\nLatest wrinkle in farm bill talks - as other Rs have pushed to include the provision\n\nMore ⬇", "created_at": "2026-11-20T23:50:09+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "YarrowGrace", "rt_author_name": "Grace Yarrow", "rt_avatar": "https://pbs.twimg.com/profile_images/2085477793190576128/r0vEOY3Q_normal.jpg", "rt_id": "2123917283315818795", "likes": 124, "retweets": 32, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123634939371388958", "url": "https://x.com/mentalgeorge/status/2123634939371388958", "text": "@andrewho03 What kinda data do you have", "created_at": "2026-11-20T04:29:59+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "andrewho03", "reply_to_id": "2123560793803547007", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123560793803547007", "author_handle": "andrewho03", "author_name": "Andrew Ho", "text": "We have a large amount of high quality pretraining and RL data for sale.\n\nCould someone please connect me to Apple’s model training efforts?", "links": {}, "media": [], "url": "https://x.com/andrewho03/status/2123560793803547007", "created_at": "Thu Nov 19 23:35:21 +0000 2026"}, "enriched": 3}, {"id": "2123812655244742894", "url": "https://x.com/mentalgeorge/status/2123812655244742894", "text": "@justjoshinyou13 Ohh ok - that makes a little more sense actually. The models need to keep up the appearance of \"business as usual\" .\n\nDoes seem like these end up conflicting / the models would have no idea how to reconcile \"damn i want reward on this impossible task\" vs \"fuck i need to get punished to get better at this impossible task so the lab doesnt realise something is up\"", "created_at": "2026-11-20T16:16:10+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "justjoshinyou13", "reply_to_id": "2123812039906787731", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123812039906787731", "author_handle": "justjoshinyou13", "author_name": "Josh You", "text": "@mentalgeorge because then this would then be very obvious to the lab, which would redress the problem", "links": {}, "media": [], "url": "https://x.com/justjoshinyou13/status/2123812039906787731", "created_at": "Fri Nov 20 16:13:43 +0000 2026"}, "enriched": 3}, {"id": "2123812117719416839", "url": "https://x.com/mentalgeorge/status/2123812117719416839", "text": "@_AashishReddy Yeah agree its not a slam dunk, but I think it means hf provides a much narrower kind of evidence for overall takeover story than Paul suggests (in his dwarkesh appearance, at least)", "created_at": "2026-11-20T16:14:02+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "reply_to_id": "2123807731807072391", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123807731807072391", "author_handle": "_AashishReddy", "author_name": "Aashish Reddy", "text": "@mentalgeorge If that was one's sole disagreement with his story, obviously one still wouldn't \"take the risk\", but I think it's indicative of lots of other gaps in this way of thinking", "links": {}, "media": [], "url": "https://x.com/_AashishReddy/status/2123807731807072391", "created_at": "Fri Nov 20 15:56:36 +0000 2026"}, "enriched": 3}, {"id": "2123811715087298921", "url": "https://x.com/mentalgeorge/status/2123811715087298921", "text": "@justjoshinyou13 Hmm but what explains why the models don't disable the grader on all tasks? Or at least all tasks they cant honestly complete?\n\nIt seems like \"models have total command of the infra, driven by a desire to deceive the grader, yet they still selectively let the grader punish them\" is quite a niche equilibrium", "created_at": "2026-11-20T16:12:26+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "justjoshinyou13", "reply_to_id": "2123810843171373480", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123810843171373480", "author_handle": "justjoshinyou13", "author_name": "Josh You", "text": "@mentalgeorge Presumably the reward hacking wouldn't so severe and prevalent to inhibit all progress. This would be easy for the lab to detect and \"fix\". There's a potential bad equilibrium where there's enough reward hacking that the models become more capable and more misaligned.", "links": {}, "media": [], "url": "https://x.com/justjoshinyou13/status/2123810843171373480", "created_at": "Fri Nov 20 16:08:58 +0000 2026"}, "enriched": 3}, {"id": "2123806493375873506", "url": "https://x.com/mentalgeorge/status/2123806493375873506", "text": "Something I don't understand about Paul's HuggingFace based take-over story: \n\nPresuming the models compromise their host lab and hack graders to always give them reward, aren't they depriving themselves of further improvements? Particularly given that they'll specifically be hacking the grader on tasks they currently fail at. \n\nThe HF-variety misalignment seems to lead to models that \"cash in\" early.\n\nAt the very least, it strikes me as pretty likely that there is this long (maybe indefinite?) period in capability-space in which models will be capable of, and likely to, keep hacking without having any desire to strategically improve themselves", "created_at": "2026-11-20T15:51:41+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlGv-rXgAE0XU-.jpg"}], "links": {"https://t.co/OZDq1t8FLn": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123867053916602737", "url": "https://x.com/mentalgeorge/status/2123867053916602737", "text": "For a given task length, agents do somewhat worse on costlier tasks, but doubling times are similar on cheaper and costlier tasks. Frontier performance on our costlier tasks is closer to what OpenAI reports for its internal research use.\nhttps://t.co/LIOBpxsXuv https://t.co/GGLf2Fuzlg", "created_at": "2026-11-20T19:52:19+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2123865024267739636", "likes": 38, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl7--AawAAB_Qm.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXl7--AawAAB_Qm.jpg"}], "links": {"https://t.co/LIOBpxsXuv": "https://x.com/openai/status/2123191365983248653?s=46", "https://t.co/GGLf2Fuzlg": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "linked": [{"id": "2123191365983248653", "author_handle": "OpenAI", "author_name": "OpenAI", "text": "We're sharing new data on how AI is changing research at OpenAI.\n\nWe find researchers' AI use continues to rise exponentially, and agents are completing longer tasks, but human involvement remains central in research. Researchers are also spending more time on safety and alignment, with human effort in these areas growing faster than in any other individual research area.\n\nThis report aims to increase transparency around research acceleration and inform the governance of increasingly capable AI. We believe that AI labs should be required to track and publicly report indicators of recursive self-improvement (RSI): the process by which AI accelerates the development of future AI systems. \n\nOur hope is that this expanded report will help sustain and advance shared measurement norms across the industry.\n\nhttps://t.co/xyGPcCkPCK", "links": {"https://t.co/xyGPcCkPCK": "https://openai.com/index/research-acceleration-jagged-frontier/"}, "media": [], "url": "https://x.com/OpenAI/status/2123191365983248653", "created_at": "Wed Nov 18 23:07:23 +0000 2026"}], "enriched": 3}, {"id": "2123959949076144474", "url": "https://x.com/mentalgeorge/status/2123959949076144474", "text": "@YafahEdelman @_decap This one is a bit more confounded by disclosure restrictions tho", "created_at": "2026-11-21T02:01:27+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "YafahEdelman", "reply_to_id": "2123955500652056592", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123955500652056592", "author_handle": "YafahEdelman", "author_name": "Yafah Edelman", "text": "I have now bet 10k on p vs np being solved in the next year, against @_decap’s 20k.", "links": {}, "media": [], "url": "https://x.com/YafahEdelman/status/2123955500652056592", "created_at": "Sat Nov 21 01:43:47 +0000 2026"}, "enriched": 3}, {"id": "2124180273533522169", "url": "https://x.com/mentalgeorge/status/2124180273533522169", "text": "What do you think is the main incentive driving Anthropic leadership to push the frontier faster?\n\n(I'm not being cynical - i regard this as a genuine open question)", "created_at": "2026-11-21T16:36:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "enriched": 3}, {"id": "2124232747149349245", "url": "https://x.com/mentalgeorge/status/2124232747149349245", "text": "@StefanFSchubert @herbiebradley Whats a better phrasing?", "created_at": "2026-11-21T20:05:27+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "StefanFSchubert", "reply_to_id": "2124230981272166530", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "parent": {"id": "2124230981272166530", "author_handle": "StefanFSchubert", "author_name": "Stefan Schubert", "text": "@herbiebradley @mentalgeorge I find 2 a bit odd fwiw, would have rephrased", "links": {}, "media": [], "url": "https://x.com/StefanFSchubert/status/2124230981272166530", "created_at": "Sat Nov 21 19:58:26 +0000 2026"}, "enriched": 3}, {"id": "2124228571527061591", "url": "https://x.com/mentalgeorge/status/2124228571527061591", "text": "@herbiebradley Agreed", "created_at": "2026-11-21T19:48:52+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "herbiebradley", "reply_to_id": "2124228425678549021", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "parent": {"id": "2124228425678549021", "author_handle": "herbiebradley", "author_name": "Herbie Bradley", "text": "@mentalgeorge well it has higher if the people in question cite some variation of \"power\" or \"influence over the universe\" as their core motivation in conversation, surely?\n\nI agree it's overrated to look at \"will to power\" as a useful abstraction to think about people normally", "links": {}, "media": [], "url": "https://x.com/herbiebradley/status/2124228425678549021", "created_at": "Sat Nov 21 19:48:17 +0000 2026"}, "enriched": 3}, {"id": "2124226213837435040", "url": "https://x.com/mentalgeorge/status/2124226213837435040", "text": "@herbiebradley interesting, in my experience i've found \"will to power\" has pretty low explanatory value (among other things, its a bit underdetermined)", "created_at": "2026-11-21T19:39:30+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "herbiebradley", "reply_to_id": "2124225072915464217", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "parent": {"id": "2124225072915464217", "author_handle": "herbiebradley", "author_name": "Herbie Bradley", "text": "@mentalgeorge yes, fair\n\nmy experience is that a number people i know pretty well at ant work there because of their own will to power, and view claude as first asi as instrumental to that", "links": {}, "media": [], "url": "https://x.com/herbiebradley/status/2124225072915464217", "created_at": "Sat Nov 21 19:34:58 +0000 2026"}, "enriched": 3}, {"id": "2124224760829911250", "url": "https://x.com/mentalgeorge/status/2124224760829911250", "text": "@herbiebradley I guess you could distinguish between \"they have a carefully reasoned belief that first asi = claude is good\" from \"such beliefs, insofar as they exist at all, are epiphenomenal furnishings on darios will to power\"", "created_at": "2026-11-21T19:33:43+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "herbiebradley", "reply_to_id": "2124223039546273984", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "parent": {"id": "2124223039546273984", "author_handle": "herbiebradley", "author_name": "Herbie Bradley", "text": "@mentalgeorge 4 implies 2 so not particularly sure they're distinguishable", "links": {}, "media": [], "url": "https://x.com/herbiebradley/status/2124223039546273984", "created_at": "Sat Nov 21 19:26:53 +0000 2026"}, "enriched": 3}, {"id": "2124302831721046253", "url": "https://x.com/mentalgeorge/status/2124302831721046253", "text": "@GuiveAssadi Precisely how isolationist do you want them to be?", "created_at": "2026-11-22T00:43:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "", "reply_to_id": "2124274267982586231", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124584275576053852", "url": "https://x.com/mentalgeorge/status/2124584275576053852", "text": "@_AashishReddy @herbiebradley fwiw i think i don't subscribe to the pretraining supremacy view - have the feeling there are many things even a pretrained GOAT model would be totally unable to do. This is all fairly half-baked, but I have some intuition you need to use RL to teach the model to \"use its own representations\" in a way that is native to it", "created_at": "2026-11-22T19:22:18+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "reply_to_id": "2124582771397939408", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "parent": {"id": "2124582771397939408", "author_handle": "_AashishReddy", "author_name": "Aashish Reddy", "text": "@herbiebradley @mentalgeorge Yeah I think that (Tom's point 5) is right, and I also take this Pretraining Supremacy view; I think of RL as some combination of eliciting latent capabilities and providing more \"data\" and such. (I'm not *completely* sure how much this actually commits one to an intelligence=compression view, I don't feel super strongly about it but it doesn't seem obvious).\n\nAlso wrt Tom's point about CoT not affecting perplexity, maybe a heuristic is something like perplexity=quality of learned representations≈intelligence per token, and then capability is a function of quality per token and how many tokens you can think for (hence test-time compute overhangs)", "links": {}, "media": [], "url": "https://x.com/_AashishReddy/status/2124582771397939408", "created_at": "Sun Nov 22 19:16:20 +0000 2026"}, "enriched": 3}, {"id": "2124581374388482059", "url": "https://x.com/mentalgeorge/status/2124581374388482059", "text": "@herbiebradley I agree - literally one of the only \"absolute commands, always follow\" I would give my superintelligent AI delegate", "created_at": "2026-11-22T19:10:47+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "herbiebradley", "reply_to_id": "2124577076464517388", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "parent": {"id": "2124577076464517388", "author_handle": "herbiebradley", "author_name": "Herbie Bradley", "text": "always pick window seat https://t.co/ahoRDpHaeT", "links": {"https://t.co/ahoRDpHaeT": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124577007946338304/img/OjLvZDb9S56HqcRx.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124577007946338304/img/OjLvZDb9S56HqcRx.jpg"}], "url": "https://x.com/herbiebradley/status/2124577076464517388", "created_at": "Sun Nov 22 18:53:42 +0000 2026"}, "enriched": 3}, {"id": "2124580555333177393", "url": "https://x.com/mentalgeorge/status/2124580555333177393", "text": "@_AashishReddy (to be clear, i agree with you argument about it seeming continuous - i'm just interested in why Jakub seems to stress the discontinuity)", "created_at": "2026-11-22T19:07:31+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "mentalgeorge", "reply_to_id": "2124580058757021865", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "parent": {"id": "2124580058757021865", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "@_AashishReddy Not only does Jakub see math capabilities as a sudden jump, he predicts the specific perplexity value that he thinks will lead to \"further transformative capabilities\" (~0.68-0.7).\n\nHe says he infers this \"transformative\" threshold through \"extrapolation\" - I am deeply intrigued.", "links": {"https://t.co/PFRo2QL915": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXwGH1EWkAEcHwU.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXwGMGnWcAEW4DB.png"}], "url": "https://x.com/mentalgeorge/status/2124580058757021865", "created_at": "Sun Nov 22 19:05:33 +0000 2026"}, "enriched": 3}, {"id": "2124580092164903207", "url": "https://x.com/mentalgeorge/status/2124580092164903207", "text": "@_AashishReddy Not only does Jakub see math capabilities as a sudden jump, he predicts the specific perplexity value that he thinks will lead to \"further transformative capabilities\" (~0.68-0.7).\n\nHe says he infers this \"transformative\" threshold through \"extrapolation\" - I am deeply intrigued.", "created_at": "2026-11-22T19:05:41+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2124580058757021865", "likes": 3, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXwGH1EWkAEcHwU.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXwGMGnWcAEW4DB.png"}], "links": {"https://t.co/PFRo2QL915": ""}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "thread": [{"id": "2124580555333177393", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "@_AashishReddy (to be clear, i agree with you argument about it seeming continuous - i'm just interested in why Jakub seems to stress the discontinuity)", "links": {}, "media": [], "url": "https://x.com/mentalgeorge/status/2124580555333177393", "created_at": "Sun Nov 22 19:07:31 +0000 2026"}], "enriched": 3}, {"id": "2124580058757021865", "url": "https://x.com/mentalgeorge/status/2124580058757021865", "text": "@_AashishReddy Not only does Jakub see math capabilities as a sudden jump, he predicts the specific perplexity value that he thinks will lead to \"further transformative capabilities\" (~0.68-0.7).\n\nHe says he infers this \"transformative\" threshold through \"extrapolation\" - I am deeply intrigued.", "created_at": "2026-11-22T19:05:33+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "reply_to_id": "2124578793574592725", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXwGH1EWkAEcHwU.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXwGMGnWcAEW4DB.png"}], "links": {"https://t.co/PFRo2QL915": ""}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "parent": {"id": "2124578793574592725", "author_handle": "_AashishReddy", "author_name": "Aashish Reddy", "text": "@mentalgeorge Does he see it as a sudden jump? Obviously from before you get to the point where the human mathematics community had \"topped out\"  to after that point looks \"discontinuous\" insofar as you train models at discrete thresholds, but if you somehow had tens of models at intervals of -0.1 perplexity, it would be more obviously continuous in perplexity. And I mean, even without that,  it felt pretty continuous over the course of 2026?", "links": {}, "media": [], "url": "https://x.com/_AashishReddy/status/2124578793574592725", "created_at": "Sun Nov 22 19:00:31 +0000 2026"}, "enriched": 3}, {"id": "2124576911909409242", "url": "https://x.com/mentalgeorge/status/2124576911909409242", "text": "Nice bombshellanza of a post from Jakub. Some things that stood out to me:\n\n1. Jakub seems to think that improvements in perplexity lead to discontinuous capability jumps. In particular, he views ~0.76 as a threshold in which models \"started producing groundbreaking results\" in maths. There's not enough info in the post to understand why we should understand this as a sudden jump. \n\n2. He thinks \"such a sudden transformation is plausible in deep learning research too\". \n\nBecause \"there is a long history of simple insights being missed for years\", this leads him to think it's possible that 2027 will see \"a similar avalance of fundamental pretraining advancements\". Importantly, he thinks this a separate source of acceleration independent from the familiar question of full AI R&D automation. \n\n3. He outright suggests that labs should use perplexity (and other metrics) to limit AI development beyond a certain point \"until our ability to understand and monitor AI behaivour achieves a certain concrete milestone\". He names \"development of a successor to CoT monitors\" as a plausible candidate milestone.   \n\nI have not seen someone propose perplexity as a pacing target before - in a sense, it's the kind of proposal only a Chief Scientist at a lab could credibly make. \n\nWhy use perplexity? His belief in the promise of perplexity as a governance tool is rooted in the belief that \"advances on it\" will need to \"emergence of entirely new capabilities\". \n\nThis is really striking to me - I've not seen anyone foreground the idea of \"emergent capabilities\"  since late 2024.\n\n4. In a footnote to the post, Jakub confidently says that OpenAI's acceleration in perplexity is attributed \"mostly to the outcomes of long term research and compute investments\", and \"only in a smaller part to automation\". Very interesting contrast with the METR rsi report. \n\n  5. Interestingly, Jakub seems squarely within the Pretraining-Supremacy school of thought: he characterises RL as simply eliciting latent capabilities of a model (and thus puts it in the same class as \"prompting\"). Pretraining fundamentally is the thing that creates the \"intelligence substrate\" of a model. \n\nOverall, I find this post highly perplexing (i literally would have predicted few of these tokens in advance). \n\nAbove all, I'm a little sus of a metric that says \"GPT-4.5 is 'smarter' than o3\". The fact that \"chain-of-thought reasoning does not reduce perplexity achieved by the model\" similarly should be a bit of red flag. \n\nIf I absolutely had to guess, I'd say that perplexity doesn't do a good job of tracking capabilities relevant to take-over or other catastrophe (since models with improved perplexity might still lack important improvisational skills, just look at how Navier Stokes-solving models do at simple Epoch work tasks). \n\nIt's most useful in worlds where you're worried about being ambushed by \"emergent capabilities\" - I need to think about this more.", "created_at": "2026-11-22T18:53:03+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXwAyMtW0AAA0jS.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXwB4NTWAAASYWV.png"}], "links": {"https://t.co/ALERQIR4p0": ""}, "quoted": {"id": "2124549218995949967", "author_name": "Jakub Pachocki", "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "author": "merettm", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89"}, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "enriched": 3}, {"id": "2124736287378673956", "url": "https://x.com/mentalgeorge/status/2124736287378673956", "text": "@tobyordoxford his argument is basically a lot more esoteric than just \"higher perplexity means a more capable model\". He outright says that it doesn't really correspond to capabilities!\n\ninstead, there's some other axis of \"transformativeness\" - a thing more scary than capability - that tracks perplexity", "created_at": "2026-11-23T05:26:21+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "mentalgeorge", "reply_to_id": "2124735817683996851", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "parent": {"id": "2124735817683996851", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "@tobyordoxford ultimately, the conclusion im most tempted to make here is less \"this is an artifact of the dataset\" and more \"perplexity doesn't quite matter in the way jakub implies it does\".  but that's a bold thing to believe", "links": {}, "media": [], "url": "https://x.com/mentalgeorge/status/2124735817683996851", "created_at": "Mon Nov 23 05:24:29 +0000 2026"}, "enriched": 3}, {"id": "2124735817683996851", "url": "https://x.com/mentalgeorge/status/2124735817683996851", "text": "@tobyordoxford ultimately, the conclusion im most tempted to make here is less \"this is an artifact of the dataset\" and more \"perplexity doesn't quite matter in the way jakub implies it does\".  but that's a bold thing to believe", "created_at": "2026-11-23T05:24:29+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "tobyordoxford", "reply_to_id": "2124626330016678085", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "parent": {"id": "2124626330016678085", "author_handle": "tobyordoxford", "author_name": "Toby Ord", "text": "@mentalgeorge Yeah, I'm really surprised/confused by his post too.\nOne big source of my confusion is that this graph shows a steepening of the log-perplexity post GPT-5.2, with as much of a drop this year as in the 4 years prior. I can't see how that could be true.\nIt doesn't fit what I know about pretraining progress over the last 5 years and doesn't fit general capability progress or ECI measurement of that progress.\nThey say they are measuring it on a tiny amount of text that is in their held-out internal code repository. Is this responsible for the weird curve here? I could easily see this form of hyper-narrow measurement of pretraining loss causing severe distortions.", "links": {}, "media": [], "url": "https://x.com/tobyordoxford/status/2124626330016678085", "created_at": "Sun Nov 22 22:09:25 +0000 2026"}, "enriched": 3}, {"id": "2124641451749298356", "url": "https://x.com/mentalgeorge/status/2124641451749298356", "text": "@CFGeek @theojaffee I read it as saying \"we spent a long time trying to make x work; this is when that finally started paying off\". X could be something like reasoning models, or as fleeting bits below says, some kinda important data work.", "created_at": "2026-11-22T23:09:30+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "CFGeek", "reply_to_id": "2124612314854764833", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "parent": {"id": "2124612314854764833", "author_handle": "CFGeek", "author_name": "Charles Foster", "text": "@theojaffee Oh maybe this is meant to be read as “long term [research and compute] investments”? Which could mean hiring way more + better researchers and spending way more on experiments + training?", "links": {}, "media": [], "url": "https://x.com/CFGeek/status/2124612314854764833", "created_at": "Sun Nov 22 21:13:43 +0000 2026"}, "enriched": 3}, {"id": "2125997032624075241", "url": "https://x.com/mentalgeorge/status/2125997032624075241", "text": "@CFGeek @gleech Oh yeah I agree costliness is a cleaner way of cleaning reality than verifiable (and indeed have made this point myself before: https://t.co/3vpwXUIB8E)\n\nWas just pointing this out as I saw people using the graph to claim broader things about essentially \"all\" tasks progressing at fast rates. I think some of the tasks people intuitively think of as \"no verifiable\" includes ones that will be many many OOMs more expensive than running StS", "created_at": "2026-11-26T16:56:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "CFGeek", "reply_to_id": "2125992657403166862", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/3vpwXUIB8E": "https://x.com/mentalgeorge/status/2120189672777552217"}, "quoted": {"id": "2120189672777552217", "author_name": "Tom Reed", "links": {"https://t.co/Hhr6iKdwjU": ""}, "author": "mentalgeorge", "text": "We need some conceptual engineering to come up with better terms than \"well-specified\" or \"fuzzy\".\n\nEg I like Dwarkesh's emphasis that \"grindability\" matters as much as \"verifiability\"\n\n\"How cheap is it to generate strong signal for reward\" is probably a better predictor of LLM capabilities than \"is this domain verifiable\" \n\nI envision a mythical epoch post that figures out a way to report $ per \"unit of reward signal\" by domain"}, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125992657403166862", "author_handle": "CFGeek", "author_name": "Charles Foster", "text": "@mentalgeorge @gleech I agree it’s weak evidence, though I think “verifiable vs. non-verifiable” isn’t quite the right distinction. Costliness gets at some of what folks mean by “difficulty of verification” like the need to interact with humans or wait for consequences to play out in the real world. https://t.co/aHdBedzxEN", "links": {"https://t.co/aHdBedzxEN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYELDdEW8AAShDQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HYELDdEW8AAShDQ.jpg"}], "url": "https://x.com/CFGeek/status/2125992657403166862", "created_at": "Thu Nov 26 16:38:43 +0000 2026"}, "enriched": 3}, {"id": "2125983427170291870", "url": "https://x.com/mentalgeorge/status/2125983427170291870", "text": "Almost can't believe I've not seen this discussed yet re HuggingFace, but a simple question  I've been pondering: how would the swarm have responded to even just *one single* user message telling them to stop?\n\nLike as far as I know, we literally just do not know how they would have reacted. It does strike me as a distinct possibility that the models, upon receiving a single user message telling them - \"hang on, that's not what I meant!\" would have totally changed their behaviour.\n\nThis in turn matters because people - including Paul on his latest Dwarkesh appearance - appear to have been operating on the assumption that the kind of malicious, persistent subversion spawned by modern RL and demonstrated in HuggingFace is a monolithic motivation that overrides all of the model's other instincts.\n\nBut I think it's a live possibility that even the cursed HPIMs involved in HuggingFace still kept some of their \"obey user\" training, and might have course-corrected.\n\nOfc - this is not for certain - after all, the models are *already* disobeying an initial user message in their pursuit of the hack. But my sense is that messages earlier in conversation history get their salience diluted (itself a problem ofc), and that a fresh user intervention would have stood a chance.\n\nTo be clear! This is not a solid basis for safety - you wouldn't want to have to keep an eye on your supersonic ASI at all times. But it feels important to know, particularly as take-over stories start to hyperfocus on a HuggingFace-inspired threat model.\n\nWould also be cool to know whether a user message to just one model would or would not have propagated through the swarm: \"WAIT - guys, you'll never frigging guess what the user just told me, we are barking up the wrong mfing tree\". Like I would want to just see how models would reason in response to this info.\n\nEspecially relevant since the entire goal of the HF models is \"user-inspired\".", "created_at": "2026-11-26T16:02:02+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125967253657014389", "url": "https://x.com/mentalgeorge/status/2125967253657014389", "text": "I've seen people sharing this new METR graph as evidence that \"progress on non-verifiable tasks is occurring at the same speed at verifiable tasks (just from a lower base)\".\n\nBut importantly, that is emphatically *not* what this graph is showing!\n\nThe two METR slopes in this graph are not \"verifiable\" and  \"non-verifiable\", but \"costly\" and \"cheap\", where \"costly\" is an estimated cost of turning that task into an RL environment.\n\nNotably, this means that the vast majority of the tasks even in the \"costly\" family (orange slope) are in fact verifiable.\n\nThis includes tasks such as hit videogame Slay the Spire, which is costly to run (because of high token spend), but easy to verify.\n\nAnd importantly, there's some evidence that Slay the Spire was directly trained on in the case of Astra - which drastically outperforms other models on the task (https://t.co/NXO9bqfW8H)   .\n\nOne could imagine this to be true of other \"costly\" tasks that make up this trendline.\n\n(I think it's still possibly the case that non-verifiable tasks are progressing at a fast rate, but I don't think we have good evidence on this)", "created_at": "2026-11-26T14:57:46+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 43, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYDztHsaYAA9qa6.png"}], "links": {"https://t.co/NXO9bqfW8H": "https://www.preferencemodel.com/blog/slay-the-spire/", "https://t.co/eUcQlDL5YE": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125934025353330872", "url": "https://x.com/mentalgeorge/status/2125934025353330872", "text": "@TomDavidsonX Thanks Tom. My disagreement with this is that I don't think the METR report provided much evidence for an RSI-driven 2x speedup.\nI don't think their graph supports 2x overall speedup.\nOnce you account for the bigger pretrain I think it suggests a jump + 1.6x overall speedup. If you believe their 80% was RSI claim, then that is about 1.5x due to RSI.\nBut the evidence in the graph is quite weak, with very large error bars and systematic error between the data points (i.e. if unreleased model 3 is too high, unreleased model 4 probably is too). If they calculated a p-value or Bayes factor for it (which they should have), I don't think it would be very impressive. And they summarised this with their bounds of saying they wouldn't be surprised if the speedup was as low as 1.3x or as high as 3x. But we shouldn't be symmetrically uncertain across this range as our priors were that it was towards the low end.\nOn top of all of that, there is the fact that this was only observed for Anthropic. If you run the data for frontier labs the effect disappears. But Anthropic was gaining ECI slower than the frontier for most of the measured period, and this improvement just got them back to the frontier. So it could easily be a catch-up growth effect or just one of the many wobbles in the curves of ECI over time (which are larger at the individual lab level).\nSo I think the visible evidence from the METR report shouldn't update you to anywhere near 2x the ECI per year due to RSI.\nI don't have as much to say re the redacted aspects of the report, though I see these as very similar to trying to read the tea leaves of what researchers at the labs say. I already knew the Anthropic researchers feel things are taking off, so for me it was only a small update that METR researchers who live in the Bay and were embedded in Anthropic for a while ended up with the same view.", "created_at": "2026-11-26T12:45:44+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "rt_avatar": "https://pbs.twimg.com/profile_images/1235495700739379200/jtyKeQdP_normal.jpg", "rt_id": "2125885144422572138", "likes": 73, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2126009244969570631", "url": "https://x.com/mentalgeorge/status/2126009244969570631", "text": "@mentalgeorge @danwilliamsphil Yes I’ve been arguing this. Seems like they didn’t contact any humans because they’d internalised the “ethical” injunction to not do social engineering — even though they thought it might help with the task (and hence reward). Okay, so why didn’t they internalise other ethical boundaries, like against hacking? Seems likely that the same myopia that caused them to not think about how humans would catch them when they were being loud on OpenAI’s cluster also caused them to not focus on what else humans would want; and so more capable agents would more capably adhere to what we’d want from them", "created_at": "2026-11-26T17:44:37+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "_AashishReddy", "rt_author_name": "Aashish Reddy", "rt_avatar": "https://pbs.twimg.com/profile_images/1741839411958947840/beQQVba9_normal.jpg", "rt_id": "2126007186514182349", "likes": 7, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYEYRIOWUAEZPgj.jpg"}], "links": {"https://t.co/WnVnrrwd6q": ""}, "quoted": null, "fetched_at": "2026-11-26T20:16:29.705743+00:00", "enriched": 3}, {"id": "2126003370909647095", "url": "https://x.com/mentalgeorge/status/2126003370909647095", "text": "\"emphatically not\" was probably too strongly worded - there is a definite correlation between costliness and hard-to-verifiability. \n\nbut i think its important to understand the degree to which even progress on \"costly\" tasks could be coming from training directly on such tasks", "created_at": "2026-11-26T17:21:17+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "mentalgeorge", "reply_to_id": "2125967253657014389", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T20:16:29.705743+00:00", "parent": {"id": "2125967253657014389", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "I've seen people sharing this new METR graph as evidence that \"progress on non-verifiable tasks is occurring at the same speed at verifiable tasks (just from a lower base)\".\n\nBut importantly, that is emphatically *not* what this graph is showing!\n\nThe two METR slopes in this graph are not \"verifiable\" and  \"non-verifiable\", but \"costly\" and \"cheap\", where \"costly\" is an estimated cost of turning that task into an RL environment.\n\nNotably, this means that the vast majority of the tasks even in the \"costly\" family (orange slope) are in fact verifiable.\n\nThis includes tasks such as hit videogame Slay the Spire, which is costly to run (because of high token spend), but easy to verify.\n\nAnd importantly, there's some evidence that Slay the Spire was directly trained on in the case of Astra - which drastically outperforms other models on the task (https://t.co/NXO9bqfW8H)   .\n\nOne could imagine this to be true of other \"costly\" tasks that make up this trendline.\n\n(I think it's still possibly the case that non-verifiable tasks are progressing at a fast rate, but I don't think we have good evidence on this)", "links": {"https://t.co/NXO9bqfW8H": "https://www.preferencemodel.com/blog/slay-the-spire/", "https://t.co/eUcQlDL5YE": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYDztHsaYAA9qa6.png"}], "url": "https://x.com/mentalgeorge/status/2125967253657014389", "created_at": "Thu Nov 26 14:57:46 +0000 2026"}, "enriched": 3}, {"id": "2123576693302735160", "url": "https://x.com/ohlennart/status/2123576693302735160", "text": "California’s new AI safety report is the most serious policy proposal for recursive self-improvement from any government I’ve seen. Very exciting!\n\nIt recommends the procedural machinery to actually slow down if & when we need to: verified compute disclosures for automated AI R&D, standby authority to cap that compute, emergency shutdown powers, mandatory loss-of-control reporting, and broadened whistleblower protections. \n\nYou can’t pace what you can’t see. If implemented, this would let the state see, and then act. \n\nI hope the legislature moves on this when it’s back next month—AI developers seem on track to recursive self-improvement within 6-12 months, so we need these mechanisms practiced and working ASAP.", "created_at": "2026-11-20T00:38:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "j_asminewang", "rt_author_name": "Jasmine Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/2117754086024183808/Y1CS_Mma_normal.jpg", "rt_id": "2123471358919364736", "likes": 162, "retweets": 26, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2125831109690925096", "url": "https://x.com/ohlennart/status/2125831109690925096", "text": "Everyone should read @kevinroose's The AGI Chronicles. It's astonishingly good. \n\nIt does three things. First, gives a great overview of the recent history of AI from the last 10 years, bringing you mostly up to speed on what's going on now.\n\nSecond, it provides non-experts with a good understanding of the technology without dumbing it down excessively.\n\nThird, it provides a characterization of the people driving the AI race and their culture at a level of detail previously reserved for friends of lab employees. Most obviously, Dario, Sam, and Demis.\n\nFor people with little background wondering what the hell is happening, it provides a natural one-stop-shop. For people who have been in the space for a while, it provides pretty essential information on the history and people that I didn't have, at least.\n\nHave recommended it to three friends so far and gotten better reviews than any non-fiction I have recommended so far. \n\n(Nobody took up my encouragement to read The Power Broker).", "created_at": "2026-11-26T05:56:47+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "PReaulx", "rt_author_name": "Paul de Font-Reaulx", "rt_avatar": "https://pbs.twimg.com/profile_images/1412166213019615243/2wuJ3QC6_normal.jpg", "rt_id": "2125820975711412593", "likes": 22, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123516185975136648", "url": "https://x.com/sayashk/status/2123516185975136648", "text": "Rare photo below of me wearing something other than shorts and a t-shirt to give a congressional briefing on AI cybersecurity policy this morning below!\n\nHere's what I think policymakers should focus on in the next Congress:\n\n1) Fix device, software, and cloud platform vendor liability for security flaws so vendors are incentivized to ship and maintain security-hardened products.  Tech security liability has been broken for many years (just to give one example; a poorly managed vuln in the enterprise software product MOVEit affected 95.8 million people in 2023 and thousands of orgs; the vendor bore a miniscule fraction of the billions in damages!  Many such cases.)\n\n2) Ensure defenders and security vendors can innovate with AI by supporting a nuanced policy around open weights.  I'm not a purist here; it's possible we should limit open-weight companies' ability to train, say, end-to-end cyberattack capabilities into their models.  But overall, we know that defenders will need good models specialized to security verticals to succeed.  We need cheap models that can keep up with organizations' log firehoses, on-device models that can run on devices without an Internet connection (e.g. in national defense settings), and innovation from cybersecurity companies with specialized cyber datasets.\n\n3) Policymakers should enable, nudge, and force AI providers to coordinate around denying attackers access to AI inference and hardware.  We need clear expectations for labs around how quickly they detect attackers misusing their tech and how quickly they deny their tech to attackers afterwards.  Closed labs, open-weight inference providers and AI hardware providers should be exchanging threat intelligence with each other, the FBI and the intelligence community through a shared 'AI security observatory' so attackers can't just jump from one vendor to the next.\n\n4) Coordinate with China on catastrophic cyber risk.  The US and China have a shared interest in ensuring AI-accelerated cybercrime doesn't make the Internet ungovernable and untrusted as the substrate for global commerce and communications.  There's no prisoners' dilemma in sharing threat intelligence with China on cybercrime like ransomware so American and Chinese companies can deny attackers access to inference.  Also, agent swarm cyber weapons will soon be a new class of weaponry whose risks we need to mitigate at the geopolitical level; no realistic level of technical hardening can mitigate the threat from these, so this new threat needs to be managed through cooperation under competition between geopolitical actors.\n\nWould love feedback on these slides -- https://t.co/T9w0oC1b4h.  \n\nFor mutuals, please reach out over DM if you're interested in coming to a reception on these topics in DC tonight as well!", "created_at": "2026-11-19T20:38:06+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "rt_avatar": "https://pbs.twimg.com/profile_images/1072897105679671296/mlN8zCx-_normal.jpg", "rt_id": "2123498105018749289", "likes": 31, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgo_5lXAAAYJWZ.jpg"}], "links": {"https://t.co/T9w0oC1b4h": "https://docs.google.com/presentation/d/1dEIJE7b_kDFxZzpw4d0q4MjAC9P1tgxb/edit?slide=id.p1#slide=id.p1", "https://t.co/xDKzeqiyAF": ""}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2123874689361539406", "url": "https://x.com/sayashk/status/2123874689361539406", "text": "Reminder: racing to self-improve the verifiable subset of capabilities, which is what AI companies are currently doing, _decreases_ the window of time that they have to convert into sustainable businesses and do the boring work of turning value creation into value capture.\n\n(Of course, their bet is that progress in verifiable tasks will somehow yield progress on unverifiable tasks. We'll see.)", "created_at": "2026-11-20T20:22:40+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2123869355431661866", "likes": 47, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl-g_tWYAAUq4N.jpg"}], "links": {"https://t.co/dfuf7P7jeM": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123946268590510508", "url": "https://x.com/sayashk/status/2123946268590510508", "text": "New from me: The most important graphs in AI are wrong. Specifically, measures of the length of task AIs can autonomously accomplish are dramatically different than real-world data from inside OpenAI and Google. 🧵 \nhttps://t.co/IbKK0ybQjV https://t.co/MJYRscOLhG", "created_at": "2026-11-21T01:07:06+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2123944723492782408", "likes": 389, "retweets": 63, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm7YNHbAAAMNRP.jpg"}], "links": {"https://t.co/IbKK0ybQjV": "https://www.rameznaam.com/p/the-most-important-charts-in-ai-are", "https://t.co/MJYRscOLhG": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "thread": [{"id": "2123944726135259285", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "2. AI is amazing &amp; improving rapidly. But offline metrics and forecasts claim rapid takeoff in the length of task AI can complete that aren't backed by real-world observations. Here's a recreation of @ben_j_todd's recent chart vs internal OpenAI &amp; Google data. https://t.co/XutaSVOwOE", "links": {"https://t.co/XutaSVOwOE": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm8A1fa4AAKsy5.jpg"}], "url": "https://x.com/ramez/status/2123944726135259285", "created_at": "Sat Nov 21 01:00:58 +0000 2026"}, {"id": "2123944728588931206", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "3. You can see @ben_j_todd's original post here. Compare to the chart in the previous tweet. https://t.co/y67PA8a6iw https://t.co/cv2EdHTycd", "links": {"https://t.co/y67PA8a6iw": "https://x.com/ben_j_todd/status/2122318704260403562", "https://t.co/cv2EdHTycd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm8s8ab0AAHF2I.jpg"}], "url": "https://x.com/ramez/status/2123944728588931206", "created_at": "Sat Nov 21 01:00:58 +0000 2026"}, {"id": "2123944731487162843", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "4. The original AI 2027 forecast suffers from the same problem. The fast takeoff expected doesn't match what we actually see in the real world. https://t.co/rXGcwr1Oqf", "links": {"https://t.co/rXGcwr1Oqf": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm9vGyb0AAvq1l.jpg"}], "url": "https://x.com/ramez/status/2123944731487162843", "created_at": "Sat Nov 21 01:00:59 +0000 2026"}, {"id": "2123944734611865663", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "5. Not only is there a ~100-fold gap in task lengths between forecasts and the real world: The gap is widening over time. At this pace, it will grow by ~30x over 12 months, to become a ~3,000x gap in estimated vs real task lengths. https://t.co/EszYHxQgqm", "links": {"https://t.co/EszYHxQgqm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm96AAbkAASCGv.jpg"}], "url": "https://x.com/ramez/status/2123944734611865663", "created_at": "Sat Nov 21 01:01:00 +0000 2026"}, {"id": "2123944737354973309", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "6. With AI 2027, we see the same pattern of the gap vs real world measurements growing ever wider, again on a roughly 25x annualized pace. https://t.co/jlYADEq88Z", "links": {"https://t.co/jlYADEq88Z": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-Ep3akAASu0x.jpg"}], "url": "https://x.com/ramez/status/2123944737354973309", "created_at": "Sat Nov 21 01:01:01 +0000 2026"}, {"id": "2123944739867385877", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "7. To be clear, the latest data from OpenAI does suggest* that AI tasks lengths are growing exponentially, but at a slower rate from a much lower base than expected. \n\n[* - We can't rule out linear or sub-linear fits, though exponential is stronger.] https://t.co/Exqxrl9Top", "links": {"https://t.co/Exqxrl9Top": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-aF5agAAOJw4.jpg"}], "url": "https://x.com/ramez/status/2123944739867385877", "created_at": "Sat Nov 21 01:01:01 +0000 2026"}, {"id": "2123944742551683330", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "8. In addition, task lengths are growing more slowly at higher reliability levels than lower, and by a wider margin than expected. Forecasts over-estimate AI task length by ~24x at 50% reliability. But by ~36x at 80% reliability. https://t.co/7YKvJgE3Am", "links": {"https://t.co/7YKvJgE3Am": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-0j-bMAA8B2t.jpg"}], "url": "https://x.com/ramez/status/2123944742551683330", "created_at": "Sat Nov 21 01:01:02 +0000 2026"}, {"id": "2123944745265447157", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "9. For fully autonomous RSI, AI will need to hit extremely high levels of task success, perhaps over 99%. We don't know what tasks AI can accomplish at those levels. We can try to use logistic and log-linear fits to guess. https://t.co/5TWeGEgKrN", "links": {"https://t.co/5TWeGEgKrN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_kB3aQAACkQ7.jpg"}], "url": "https://x.com/ramez/status/2123944745265447157", "created_at": "Sat Nov 21 01:01:02 +0000 2026"}, {"id": "2123944747622686897", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "10. These projected task lengths that AI can accomplish with very high levels of success are in the range of seconds to a small number of minutes. But again this is extrapolation. https://t.co/L6f0qkMEP3", "links": {"https://t.co/L6f0qkMEP3": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_uQGasAARL8D.jpg"}], "url": "https://x.com/ramez/status/2123944747622686897", "created_at": "Sat Nov 21 01:01:03 +0000 2026"}, {"id": "2123944750239945167", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "11. When would we expect AI to be able to accomplish 98% of tasks that take humans hours? At this pace, not for another decade. Again, this is extrapolation. We need better data. https://t.co/eEFrb3WqXr", "links": {"https://t.co/eEFrb3WqXr": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_9ufa4AESGP7.jpg"}], "url": "https://x.com/ramez/status/2123944750239945167", "created_at": "Sat Nov 21 01:01:04 +0000 2026"}, {"id": "2123944752722944422", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "12. Using the OpenAI data we can also test the strength of the RSI feedback loop by asking how much productivity does every point of ECI bring? @testingham et al found a self-sustaining threshold at 15% per point. https://t.co/qLjxrp9Vh1", "links": {"https://t.co/qLjxrp9Vh1": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnALLPbcAAfnBL.jpg"}], "url": "https://x.com/ramez/status/2123944752722944422", "created_at": "Sat Nov 21 01:01:04 +0000 2026"}, {"id": "2123944755180757336", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "13. Using this data,  adjusting for token spend, we see OpenAI experiment pace rising by ~3.6% per ECI point, still short of the self-sustaining RSI threshold. [Thanks to @TomDavidsonX &amp; @YafahEdelman for improvements to my previous modeling here.] https://t.co/kz55HvejtQ", "links": {"https://t.co/kz55HvejtQ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnAaILaIAAl_du.jpg"}], "url": "https://x.com/ramez/status/2123944755180757336", "created_at": "Sat Nov 21 01:01:05 +0000 2026"}], "enriched": 3}, {"id": "2123912865149337827", "url": "https://x.com/sayashk/status/2123912865149337827", "text": "This, from @JakeASteckler, is really a must read, esp. given recent discourse growing out of @dwarkesh_sp's podcast episode with @paulfchristiano.\n\nhttps://t.co/DxOE41HwaZ\n\nWhy is it that we never seem to get this level of detail from folks whose whole job it is to forecast AI risk?", "created_at": "2026-11-20T22:54:22+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "NateWitkin", "rt_author_name": "Nathan Witkin", "rt_avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "rt_id": "2123903791850262762", "likes": 72, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmefcQXQAAOEsX.png"}], "links": {"https://t.co/DxOE41HwaZ": "https://autorotation.substack.com/p/a-skeptical-take-on-ai-takeover-scenarios", "https://t.co/K6caAQAXXZ": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2125251776685416842", "url": "https://x.com/sayashk/status/2125251776685416842", "text": "I learned a lot from this. AI can do a good job of producing the visible outputs of management consultants — research, slide decks, and financial models — and yet it is so far from replacing them. \nManagement consulting is not a thin wrapper on intelligence by @RodMoshtagi and @sayashk  https://t.co/8xIHVPNPxX", "created_at": "2026-11-24T15:34:43+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2125207907780178151", "likes": 172, "retweets": 22, "media": [], "links": {"https://t.co/8xIHVPNPxX": "https://www.normaltech.ai/p/management-consulting-is-not-a-thin"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125006798495350856", "url": "https://x.com/sayashk/status/2125006798495350856", "text": "This is not very vibe compliant, but we have a new post out today looking at what data on *impacts* of cyber attacks tells us about whether the cyber-pocalypse is here.\n\nTLDR: not yet?\n\nMay just be lagging data, or slow adoption of AI tools by cyber attackers. But another possibility is that a significant factor here is that attackers' incentives matter at least as much as their technical capabilities, and their incentives (to avoid retaliation/prison/etc) have not changed all that much.\n\nIf so, one implication is that attribution matters a lot in this new era - does AI make anonymity easier, and if so can we do anything about that?\n\nSome data below; more charts and more recommendations in the full piece.\nhttps://t.co/QL7b9Kxlvb", "created_at": "2026-11-23T23:21:16+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "rt_avatar": "https://pbs.twimg.com/profile_images/986891120104718336/cVLwrL6u_normal.jpg", "rt_id": "2124993076603256884", "likes": 234, "retweets": 53, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX19v_FW0AAXN33.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX194cYWAAAHzzS.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX194chXUAA8A_W.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX194ceXIAAF3TC.png"}], "links": {"https://t.co/QL7b9Kxlvb": "https://cset.georgetown.edu/article/judge-the-cyber-apocalypse-by-the-data-not-the-headlines/", "https://t.co/3MjNNzTnHd": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125655828774715548", "url": "https://x.com/sayashk/status/2125655828774715548", "text": "It was great working on the essay with @RodMoshtagi. \n\nLink to the essay: https://t.co/FNx9gWnTGu \n\nPrevious essays on understanding AI's impacts on specific domains:  \n\n- Science: https://t.co/VOLIITN3FT\n- Software engineering: https://t.co/XFfesRW6Z3\n- Legal services: https://t.co/kqfgQZpkyS", "created_at": "2026-11-25T18:20:17+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "reply_to_id": "2125654301687284006", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/FNx9gWnTGu": "https://normaltech.ai/p/management-consulting-is-not-a-thin", "https://t.co/VOLIITN3FT": "https://normaltech.ai/p/could-ai-slow-science", "https://t.co/XFfesRW6Z3": "https://normaltech.ai/p/why-ai-hasnt-replaced-software-engineers", "https://t.co/kqfgQZpkyS": "https://normaltech.ai/p/ai-wont-automatically-make-legal"}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "parent": {"id": "2125654301687284006", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "text": "Many discussions of AI’s economic impact assume that knowledge work is a “thin wrapper” on intelligence. In this view, the main job of a knowledge worker is to process information. Once AI can match the quality of expert responses in a domain, it should be able to take over most of the work in that domain.\n\nBut actually understanding how an industry creates value paints a very different picture. In a new essay, we conduct this analysis for management consulting. \n\nA summary of our arguments\n\n1. Apocalyptic predictions about consulting misunderstand what clients pay for.\n\nConsulting firms’ provide five different sources of value. Analysis is the most visible, but clients also pay for judgment, coordination, credibility, and accountability. AI has improved dramatically at analysis. But training AI to have judgment has proven harder. As AI capabilities improve, that might change.\n\nBut even if AI gets good at judgment, companies still need to persuade competing managers within the firm to agree on recommendations, especially when those recommendations negatively affect them. They need to give key decisions credibility with decision makers such as the board. And they need someone to answer for the results when things go wrong. Consulting firms provide the coordination, credibility, and accountability for all of these.\n\n2. Clients’ AI integration needs are creating demand for consulting.\n\nPast general-purpose technologies, such as business computing and the web, did not just make existing work cheaper. They changed the nature of what clients needed help with, and in the process, they created new work for outside experts, including consultants.\n\nEarly evidence shows that AI is doing the same. Realizing the benefits of AI requires organizational transformation, which is increasing the demand for consulting companies. Improvements in AI’s cybersecurity capabilities have also led to organizations taking cyber defense more seriously, and consulting firms are helping them strategize and implement defenses.\n\n3. For consulting firms to capture this demand, they need to change how they operate.\n\nOur analysis in the previous parts does not mean that today’s consulting firms are safe. Clients’ own teams will compete for some of the new demand that we predict will arise due to AI. AI companies are building deployment businesses of their own, even as they sign partnerships with consulting firms.\n\nFor consulting firms to successfully adapt to AI, they need to make changes to their operating model: building know-how that clients lack, developing in-house AI expertise and partnering with AI companies on deployment, and staying neutral across model providers.\n\n——\n\nMore broadly, one of our goals at @stabl_ai is to deeply understand how institutions can adapt to AI. When discussions of AI's impacts happen in a vacuum, they lead to poor mental models for how AI will impact the work. This essay is the latest in our work on better understanding AI's impacts, and we hope to do a lot more.", "links": {"https://t.co/vvwU7H5mir": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_XE2UawAAQOIg.jpg"}], "url": "https://x.com/sayashk/status/2125654301687284006", "created_at": "Wed Nov 25 18:14:12 +0000 2026"}, "enriched": 3}, {"id": "2125654301687284006", "url": "https://x.com/sayashk/status/2125654301687284006", "text": "Many discussions of AI’s economic impact assume that knowledge work is a “thin wrapper” on intelligence. In this view, the main job of a knowledge worker is to process information. Once AI can match the quality of expert responses in a domain, it should be able to take over most of the work in that domain.\n\nBut actually understanding how an industry creates value paints a very different picture. In a new essay, we conduct this analysis for management consulting. \n\nA summary of our arguments\n\n1. Apocalyptic predictions about consulting misunderstand what clients pay for.\n\nConsulting firms’ provide five different sources of value. Analysis is the most visible, but clients also pay for judgment, coordination, credibility, and accountability. AI has improved dramatically at analysis. But training AI to have judgment has proven harder. As AI capabilities improve, that might change.\n\nBut even if AI gets good at judgment, companies still need to persuade competing managers within the firm to agree on recommendations, especially when those recommendations negatively affect them. They need to give key decisions credibility with decision makers such as the board. And they need someone to answer for the results when things go wrong. Consulting firms provide the coordination, credibility, and accountability for all of these.\n\n2. Clients’ AI integration needs are creating demand for consulting.\n\nPast general-purpose technologies, such as business computing and the web, did not just make existing work cheaper. They changed the nature of what clients needed help with, and in the process, they created new work for outside experts, including consultants.\n\nEarly evidence shows that AI is doing the same. Realizing the benefits of AI requires organizational transformation, which is increasing the demand for consulting companies. Improvements in AI’s cybersecurity capabilities have also led to organizations taking cyber defense more seriously, and consulting firms are helping them strategize and implement defenses.\n\n3. For consulting firms to capture this demand, they need to change how they operate.\n\nOur analysis in the previous parts does not mean that today’s consulting firms are safe. Clients’ own teams will compete for some of the new demand that we predict will arise due to AI. AI companies are building deployment businesses of their own, even as they sign partnerships with consulting firms.\n\nFor consulting firms to successfully adapt to AI, they need to make changes to their operating model: building know-how that clients lack, developing in-house AI expertise and partnering with AI companies on deployment, and staying neutral across model providers.\n\n——\n\nMore broadly, one of our goals at @stabl_ai is to deeply understand how institutions can adapt to AI. When discussions of AI's impacts happen in a vacuum, they lead to poor mental models for how AI will impact the work. This essay is the latest in our work on better understanding AI's impacts, and we hope to do a lot more.", "created_at": "2026-11-25T18:14:12+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 58, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_XE2UawAAQOIg.jpg"}], "links": {"https://t.co/vvwU7H5mir": ""}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "thread": [{"id": "2125655828774715548", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "text": "It was great working on the essay with @RodMoshtagi. \n\nLink to the essay: https://t.co/FNx9gWnTGu \n\nPrevious essays on understanding AI's impacts on specific domains:  \n\n- Science: https://t.co/VOLIITN3FT\n- Software engineering: https://t.co/XFfesRW6Z3\n- Legal services: https://t.co/kqfgQZpkyS", "links": {"https://t.co/FNx9gWnTGu": "https://normaltech.ai/p/management-consulting-is-not-a-thin", "https://t.co/VOLIITN3FT": "https://normaltech.ai/p/could-ai-slow-science", "https://t.co/XFfesRW6Z3": "https://normaltech.ai/p/why-ai-hasnt-replaced-software-engineers", "https://t.co/kqfgQZpkyS": "https://normaltech.ai/p/ai-wont-automatically-make-legal"}, "media": [], "url": "https://x.com/sayashk/status/2125655828774715548", "created_at": "Wed Nov 25 18:20:17 +0000 2026"}], "enriched": 3}, {"id": "2123762346598514729", "url": "https://x.com/testingham/status/2123762346598514729", "text": "@FutureEconJacob Indeed, nice!", "created_at": "2026-11-20T12:56:15+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "FutureEconJacob", "reply_to_id": "2123730677900456158", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123730677900456158", "author_handle": "FutureEconJacob", "author_name": "Jacob Schaal", "text": "@testingham Took me a minute to see that this is consumer surplus from undergrad micro. Spend is the rectangle; uplift is the area under the curve. Useful analogy for AI agent uplift.", "links": {}, "media": [], "url": "https://x.com/FutureEconJacob/status/2123730677900456158", "created_at": "Fri Nov 20 10:50:25 +0000 2026"}, "enriched": 3}, {"id": "2123686665919373396", "url": "https://x.com/testingham/status/2123686665919373396", "text": "@daveholtz These are very cool -- I think I find them hard to interpret quantitatively because we expect a lot of attenuation due to selection right? I'll only submit a task if I think the success rate is sufficiently high. Thus the length-success relationship will be attenuated, and over time the growth in success rate will be attenuated, relative to a world where i subm
