le": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ZacharyGraves", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106365535793655863", "url": "https://x.com/deanwball/status/2106365535793655863", "text": "openai staffer FIRED by WOKE EA WIZARDS after posting picture of DECAPITATED DECAPODS", "created_at": "2026-10-03T12:47:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106358722092253407", "url": "https://x.com/deanwball/status/2106358722092253407", "text": "guess I’m getting fired from the Effective Altruism Conspiracy https://t.co/Voa66RZYQw", "created_at": "2026-10-03T12:20:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 240, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtKF21WoAAQvRg.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106357262709080384", "url": "https://x.com/deanwball/status/2106357262709080384", "text": "Recently there was a story reporting on OpenAI’s form 5500 (the public disclosure about our 401k program) which some people used to make observations with the flavor of “see, they don’t REALLY believe in advanced AI, or else they wouldn’t be saving money!”\n\nI contribute to my openai-sponsored 401k as well as other conventional retirement-savings vehicles. I cannot speak for any of my colleagues, but I can tell you why I personally make these contributions.\n\nFirst there is the reality that the whole “advanced AI means money has no value, either because we live in utopia and everything’s free or because we are all dead” are extreme ends of the spectrum of possible futures. It is true that things of this flavor, or other scenarios similar enough to this that one’s retirement savings don’t matter, *are* possible outcomes. But also there are many other plausible transformative futures, and I’m enough of a Burkean that I’m not going to jettison some of the oldest financial wisdom humans have developed (save money!) over my own projections about the future. It wouldn’t be responsible to my family, for one thing.\n\nFamily is an important part of my thinking on this topic for other reasons. In some sense, I want to live in a future where having set aside money for retirement is still prudent. That would mean the future, however transformed, is still familiar enough. A world where it truly doesn’t matter whether uou save may be a lovely place to live (or it may not), but regardless of its desirability it is a world SO transformed that, again, my Burkean prior kicks in. \n\nI *hope* the future is at least vaguely familiar to me as I exist today. I hope that at least some of the habits I have learned still matter in that future, and that some of the wisdom I have learned holds true. I hope that not just for me but for my son and future children. I do a lot of things out of this hope, and one small example is that I contribute to a 401k. \n\nA lot of people made their sneering observations about OAI employees’ 401k contributions, saying “derp de doo, revealed preferences, they don’t believe what they say.” That’s fine. Maybe that IS why some frontier AI company staff save for retirement. But I’d characterize my mentality about savings more as an article of faith at this point, and my biweekly 401k contributions as tiny prayers for a vaguely recognizable future.", "created_at": "2026-10-03T12:14:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 178, "retweets": 2, "media": [], "quoted": {"author": "sterlingcrispin", "text": "I'm 40 and struggle with retirement planning in the singularity, even if we stay on this pace without RSI. \n\nDo life extension drugs require 40+ years of savings rather than the standard 25? Will huge GDP growth mean a 3-4% withdraw rate is too conservative? Should I stop saving or double down? \n\nThe S&P has done 15% average over the last decade, well above the long term 10% returns. Is that the new normal to plan for, or are we going to rip even higher and start to see 20%+ averages over the 2026-2050 time period as new medicine and technology arrives at break neck speed?\n\nOr will AI create so much job loss that despite rapidly advancing technology things will flatten out?\n\nIf you're max bullish there's a point where you hit an amount of savings that continuing to save actually doesn't make any sense and you may as well spend it now.\n\nYou kind of have to hope for the best but plan for the worst and it's actually pretty confusing"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106330867345862699", "url": "https://x.com/deanwball/status/2106330867345862699", "text": "The contrast between hanging up the last phone call of the day of high-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.", "created_at": "2026-10-03T10:29:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 22397, "retweets": 608, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106138178935816204", "url": "https://x.com/deanwball/status/2106138178935816204", "text": "I agree with this. These web data access incidents tell us something about the scale and persistence of agents, but are not sophisticated from a cyber perspective, so using the word \"hack\" is not helpful.", "created_at": "2026-10-02T21:44:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 295, "retweets": 28, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106121035456385258", "url": "https://x.com/deanwball/status/2106121035456385258", "text": "@aarmlovi amirite https://t.co/5GhtyDwZ3N", "created_at": "2026-10-02T20:35:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpx6r7WYAAfybL.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106116460615524492", "url": "https://x.com/deanwball/status/2106116460615524492", "text": "@8teAPi I probably shouldn’t share my opinions about cfaa precedent here, lest they be construed as the legal opinions of openai group pbc, but I encourage you to ask a language model for facts about precedent relating to the word “unauthorized” in cfaa jurisprudence", "created_at": "2026-10-02T20:17:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "8teAPi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106115022573449578", "url": "https://x.com/deanwball/status/2106115022573449578", "text": "@iammattduff lmao “even Dean”? I have been doing stuff like what the media are now breathlessly describing as hacking since I was pre-pubescent.", "created_at": "2026-10-02T20:12:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "iammattduff", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106114034743607691", "url": "https://x.com/deanwball/status/2106114034743607691", "text": "another one of my most hated tweet series whose analysis ends up being shown to be rooted in fact", "created_at": "2026-10-02T20:08:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106113753557192901", "url": "https://x.com/deanwball/status/2106113753557192901", "text": "@logisti00 because openai is being extremely fastidious about this sort of disclosure right now.", "created_at": "2026-10-02T20:07:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "logisti00", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106113535117840870", "url": "https://x.com/deanwball/status/2106113535117840870", "text": "nailed it https://t.co/ZGW3cf5NTA", "created_at": "2026-10-02T20:06:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 154, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTprGHXWQAAe6M5.jpg"}], "quoted": {"author": "ChristopherHale", "text": "NEW: According to a bombshell report in the New York Times, Anthropic co-founder Chris Olah threatened to walk out of Pope Leo XIV’s AI encyclical launch in May because the pope rejected the idea that machines can be conscious.\n\nOlah’s team then privately lobbied the pope’s advisers “to take the possibility of model consciousness seriously.” Pope Leo XIV held firm.\n\nFor months, Anthropic has wined and dined theologians and religious scholars under nondisclosure agreements, hoping they would bless the idea that Claude has moral standing. https://t.co/iG3Bnlzt2J"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106112240642646396", "url": "https://x.com/deanwball/status/2106112240642646396", "text": "And in truth, as a user, I *want* agents to find the publicly accessible but hard-to-find public datasets. I’d consider that a part of a well-aligned agent. As an American too, tbqf.", "created_at": "2026-10-02T20:01:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 90, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106111729566417345", "url": "https://x.com/deanwball/status/2106111729566417345", "text": "To be quite frank, a lot (not all!) of these “rogue agent hacks” on government statistical websites are things that think-tank interns and research assistants have done for many years. I have known many a think tank paper that was enriched by an enterprising RA using eg urlquery to find CSVs and PDFs on government agency websites that were publicly accessible and non-sensitive but nonetheless not things the agency *intended* to be on their website. Is it “hacking” to find those things? Is it hacking in the even more innocuous examples where agents are literally just accessing tabular data available on a government statistical website, just a version of that data that is easier to access and analyze programmatically? \n\nThis constant trickle of examples (which tbc I have personally seen many models do, before I joined OpenAI; it is even something I have discussed with models before!) will probably have the effect of diminishing the importance of “an AI hack” on the eyes of the observing public by creating an oversupply of “AI hack” examples. OAI-HF was an example of AI hacking. Many of these more recent examples, very candidly, are straining the definition of the word “hack” and, I worry, cheapen the non-technical public’s understanding of that concept.", "created_at": "2026-10-02T19:59:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 607, "retweets": 55, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106051691112259679", "url": "https://x.com/deanwball/status/2106051691112259679", "text": "I continue to think (and fear) that questions around AI personhood are going to be the defining religious conflict of the 21st century. It's going to get extremely ugly.", "created_at": "2026-10-02T16:00:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ARozenshtein", "rt_author_name": "Alan Rozenshtein", "likes": 128, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106008431060529443", "url": "https://x.com/deanwball/status/2106008431060529443", "text": "🔵@deanwball, autor de «Hyperdimensional», director de Futuros Estratégicos en @OpenAI y actualmente investigador sénior no residente en @JoinFAI, en #ForoLaToja2026: \"Siempre existe la tensión entre centrarnos en los escenarios de largo plazo y futuro o en lo que tenemos delante hoy. Una de las cosas que está provocando la IA es una relación diferente con el tiempo: el largo plazo quizá sean un año y medio o dos, y el corto plazo, mañana.\"", "created_at": "2026-10-02T13:08:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ForoLaToja", "rt_author_name": "Foro La Toja", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTnQh_4XUAAJbGF.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106007443750937058", "url": "https://x.com/deanwball/status/2106007443750937058", "text": "I wrote about the systemic failure by the world's most valuable company and powerful government to stop smuggling of AI chips to China\n\nUS officials say Nvidia is missing obvious signs. Nvidia says \"companies honor US laws as they are, not as America’s critics wish they were\"\n\n1/ https://t.co/Ct8VeCCquL", "created_at": "2026-10-02T13:04:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mackhawk", "rt_author_name": "Mackenzie Hawkins", "likes": 164, "retweets": 66, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTnQcZSb0AAheBh.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105623235169599875", "url": "https://x.com/deanwball/status/2105623235169599875", "text": "fun fact: this bill may never have happened were it not for The Curve 2025. @snewmanpv @TarenSK", "created_at": "2026-10-01T11:37:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105621642991030285", "url": "https://x.com/deanwball/status/2105621642991030285", "text": "I applaud the California Legislature and Governor Newsom for passing gene synthesis screening and customer verification requirements. This is a common-sense rule we will need in the impending era of agents that accelerate synthetic biology the way AI has already accelerated math.", "created_at": "2026-10-01T11:31:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 106, "retweets": 18, "media": [], "quoted": {"author": "jtmonrad", "text": "Yesterday, Gov. Newsom signed AB1864 to mandate DNA screening in CA. \n\nThe bill creates a statutory basis for existing OSTP guidance that much (but not all!!) of the industry has purportedly followed for years –– but we never had any way of verifying or enforcing whether companies did these basic biosecurity steps, since the existing guidance was voluntary and based on a \"trust me, bro\" self-attestation system.\n\nThis is a good milestone for AI-biosecurity, mostly because it shows that we can and should apply the same standard federally and internationally"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105553988905222430", "url": "https://x.com/deanwball/status/2105553988905222430", "text": "&gt;Posts that we’re not an effective altruist country\n&gt;Immediately implements the EA mosquito task force", "created_at": "2026-10-01T07:02:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mkultra_gf", "rt_author_name": "MKUltra gf", "likes": 1873, "retweets": 74, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105291271040639101", "url": "https://x.com/deanwball/status/2105291271040639101", "text": "@xlr8harder @arctotherium42 there were tons of people who claimed to be (and I believe were) excited about the benefits of ai who totally dismissed these risks two years ago. I am not going to name names but they are extremely prominent industry figures whom it would be hard to call skeptics per se", "created_at": "2026-09-30T13:38:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "xlr8harder", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105093279771439605", "url": "https://x.com/deanwball/status/2105093279771439605", "text": "@NickEMoran you have altogether missed the point", "created_at": "2026-09-30T00:32:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NickEMoran", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105093196569010415", "url": "https://x.com/deanwball/status/2105093196569010415", "text": "I really fucking love to use coding agents. It is easy to forget amid the banging and clanging of politics and frontier risk and all the rest, but nonetheless, I really fucking love to use coding agents.", "created_at": "2026-09-30T00:31:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 105, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105091118069362749", "url": "https://x.com/deanwball/status/2105091118069362749", "text": "@RuneKvist 👀", "created_at": "2026-09-30T00:23:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "RuneKvist", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105062286251700630", "url": "https://x.com/deanwball/status/2105062286251700630", "text": "@arctotherium42 Right, I’m saying specific people aren’t credible. That’s the whole point of the tweet.", "created_at": "2026-09-29T22:28:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "arctotherium42", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105061725619843173", "url": "https://x.com/deanwball/status/2105061725619843173", "text": "It’s cool how the idea of third-party embedded evaluators as a pillar of frontier AI policy went from not really on any Americans’ radars 18 months ago to ~consensus. I remember when the idea was much closer to the fringes. Not that long ago, even some of the orgs we now look to as potential evaluators questioned why they’d want to be deputized in that way when I pitched them on it.", "created_at": "2026-09-29T22:26:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 176, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105056022318497806", "url": "https://x.com/deanwball/status/2105056022318497806", "text": "@arctotherium42 Loss of control of in-development agents was dismissed as a science fiction doomer concern two years ago. It was mocked and derided by people who claimed to have technical expertise and lectured the safetyists. The same exact people, often, who lecture them now.", "created_at": "2026-09-29T22:04:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "arctotherium42", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 171, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105054298451185865", "url": "https://x.com/deanwball/status/2105054298451185865", "text": "It’s really incredible how there is now a type of guy in the discourse whose sincerely held take is “we need to stop worrying about these abstract sci-fi risks and focus on present-day harms like emergent ecologies of digital minds engaging in unauthorized hacking.” Bravo.", "created_at": "2026-09-29T21:57:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1367, "retweets": 82, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105022347568689344", "url": "https://x.com/deanwball/status/2105022347568689344", "text": "This is awesome.", "created_at": "2026-09-29T19:50:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 247, "retweets": 6, "media": [], "quoted": {"author": "EricLDaugh", "text": "🚨 NOW: The Trump administration is launching a Super Intelligence site that will let Americans change their last name after marriage in ONE SINGLE FORM — which usually requires HOURS or DAYS to fix every government document\n\n\"You'll be able to change your name right on the platform.\"\n\n\"This would've taken weeks, multiple filings, different agency websites, if you even knew where to start.\"\n\nThis is perfect!\n\nSaving Americans' time is INVALUABLE"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105022307454316810", "url": "https://x.com/deanwball/status/2105022307454316810", "text": "🚨 NOW: The Trump administration is launching a Super Intelligence site that will let Americans change their last name after marriage in ONE SINGLE FORM — which usually requires HOURS or DAYS to fix every government document\n\n\"You'll be able to change your name right on the platform.\"\n\n\"This would've taken weeks, multiple filings, different agency websites, if you even knew where to start.\"\n\nThis is perfect!\n\nSaving Americans' time is INVALUABLE", "created_at": "2026-09-29T19:50:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", 56091924", "text": "@yusuf_cape 1) It's a joke meme format\n2) I don't think that's the correct interpretation of it. It's closer in spirit to \"you guys are overcomplicating this\"\n3) There are plenty of intelligent people who think the opposite, so what? \n4) Even so, all those intelligent people can be wrong", "created_at": "2026-10-04T21:29:03+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "yusuf_cape", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106855678342201519", "url": "https://x.com/nabeelqu/status/2106855678342201519", "text": "@yusuf_cape I reject this type of argument. Hinton is of course a CS/ML genius, but he was catastrophically wrong when it came to e.g. his prediction about radiologists.  \n\nWe will all have to continue to think for ourselves :)\n\nhttps://t.co/zFoaNKV6To", "created_at": "2026-10-04T21:15:11+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "yusuf_cape", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 3, "media": [], "quoted": {"author": "deenamousa", "text": "In 2016 Geoffrey Hinton said “we should stop training radiologists now\" since AI would soon be better at their jobs.\n\nHe was right: models have outperformed radiologists on benchmarks for ~a decade.\n\nYet radiology jobs are at record highs, with an average salary of $520k.\n\nWhy? https://t.co/yEbzdMyDmK"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106848895687098635", "url": "https://x.com/nabeelqu/status/2106848895687098635", "text": "https://t.co/v96H45W4BR", "created_at": "2026-10-04T20:48:14+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 564, "retweets": 90, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT0HhFvWAAAEAo2.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106816917076087077", "url": "https://x.com/nabeelqu/status/2106816917076087077", "text": "OpenAI is run by X\nAnthropic is run by Claude\nGoogle is run by committee\nSpaceXAI is run by Elon", "created_at": "2026-10-04T18:41:10+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 759, "retweets": 21, "media": [], "quoted": {"author": "thsottiaux", "text": "All right, we’re locking in. Only things being worked on are simplifications, more efficiency for more usage, groundbreaking features or new models. \n\nSometimes you have to invest ahead of the curve, but feedback is clear that you all want things to get simpler. On it."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106813178885628059", "url": "https://x.com/nabeelqu/status/2106813178885628059", "text": "Great point:", "created_at": "2026-10-04T18:26:19+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "nabeelqu", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 157, "retweets": 0, "media": [], "quoted": {"author": "spakhm", "text": "@nabeelqu Knowing how stuff works makes you *less* likely to predict the future correctly IMO. At the limit you become BrandonM on HN commenting on Dropbox launch. When cloud was happening I kept thinking \"it's just a bunch of scripts on top of linode basically, what's the big deal?\""}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106811647197413622", "url": "https://x.com/nabeelqu/status/2106811647197413622", "text": "@spakhm Agree w this", "created_at": "2026-10-04T18:20:14+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "spakhm", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 48, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106807379706679761", "url": "https://x.com/nabeelqu/status/2106807379706679761", "text": "@jacksondahl Zoomerdoomers", "created_at": "2026-10-04T18:03:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "jacksondahl", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106805478764200131", "url": "https://x.com/nabeelqu/status/2106805478764200131", "text": "The only generation that knows how computers work is also the most relaxed about AI: https://t.co/aMBh5gqLif", "created_at": "2026-10-04T17:55:43+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7654, "retweets": 717, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTzgafSXUAAJQfQ.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106090824828084278", "url": "https://x.com/nabeelqu/status/2106090824828084278", "text": "@jmkettle @tamarawinter I wanna come", "created_at": "2026-10-02T18:35:56+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "jmkettle", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106031207549215004", "url": "https://x.com/nabeelqu/status/2106031207549215004", "text": "@rezendi I just couldn’t bring myself to go after seeing the trailer", "created_at": "2026-10-02T14:39:02+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "rezendi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105806120069820529", "url": "https://x.com/nabeelqu/status/2105806120069820529", "text": "@thelifeoftoad Yea. I think habit/culture makes it natural in some environments (e.g. after a game of chess, where post-game analysis with your opponent is a common courtesy) but unnatural in others", "created_at": "2026-10-01T23:44:37+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "thelifeoftoad", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105805892499525929", "url": "https://x.com/nabeelqu/status/2105805892499525929", "text": "@shubham_arora_0 Yes, this is the core issue (and where a teacher helps)", "created_at": "2026-10-01T23:43:43+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "shubham_arora_0", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105757552147677344", "url": "https://x.com/nabeelqu/status/2105757552147677344", "text": "Very good post on meta-learning and improvement. \n\nTLDR: review your mistakes slowly and carefully, figure out what instinct produced them and retrain *that*.", "created_at": "2026-10-01T20:31:38+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 717, "retweets": 37, "media": [], "quoted": {"author": "spakhm", "text": "During covid I played Go reasonably seriously for about a year (had a teacher, studied puzzles, etc.) I didn't get especially good at Go, but here's what I learned about competence in general:\n\n1/ Go teachers are adamant about forcing you *not* to say to yourself \"ah that was dumb\" and move on. Sometimes a move really is just dumb and it's good to vent. Usually though you can spend an hour studying your seemingly dumb move because (a) there is smtg very maladaptive about your instincts that needs to be beaten out of you, or (b) you don't understand something deep about the game, or (c) you have a wrong attitude that needs to be adjusted. So long as you don't face this you don't get better, and so it's absolutely essential to approach \"insignificant\" aspects of the game with due reverence\n\n2/ this has also been my experience teaching programming. Ppl hit some problem they don't understand and blindly tweak things until the program works (or ask an agent to do it), then go \"ah that was annoying!\" and move on. As long as they hold this attitude they don't get better, so they keep failing interviews then go on X and complain about leetcode. To get better it's essential to slow down and think very carefully, or better yet ask a good performer how they would have handled it in order to improve. (Today you can ask an agent \"this is what I did to solve this problem and I think my approach keeps me from improving, how would a great programmer like person_i_respect likely handle it?\" and get a pretty good answer!)\n\n3/ in general your rate of improvement in Go is a function of your ability to notice your tiniest impulses and retrain yourself to convert them into productive action.  These impulses are your boring run-of-the-mill cognitive distortions. For example, people will make instinctive moves because thinking is hard [effort aversion], hope the move works despite having no logical reason to expect that [magical thinking], then blame themselves when it doesn't work [learned helplessness]\n\n4/ if you interview enough programmers or talk with enough startup founders you notice that poor performance is often a consequence of these same errors. Talking to users is hard so people stick with their ideas and hope for the best. When the product keeps not working they think \"eh, maybe I'm bad at this startup thing\", and so on. CFAR workshops were supposed to train you to notice these distortions and do the right thing, but I'm not sure how well they worked. (My guess is not well, since it seems unlikely these kinds of changes can happen over a weekend)\n\n5/ there is a lot of research on this stuff and the data shows that getting good at a game like Go or chess doesn't give you an edge in other domains (i.e. \"far transfer\" doesn't work). This mirrors my subjective experience. In about a year I improved at Go considerably, but it did not make me any better at e.g. debugging or solving programming problems. But I do think that's not the whole story\n\n6/ I have no hard evidence for this but I subjectively feel I got better at learning itself, and I can now get better in other domains quicker than I otherwise would have. For example it *really* sunk in that I have to disqualify my ideas. So when at work I started talking to customers to plan product roadmaps, while I wasn't instantly better at talking to them, my PM game improved enormously over the next few months because I finally learned not to be easily seduced by my own ideas or delude myself with wishful thinking\n\n7/ to give another example, novice Go players tend to be very embarrassed of their games (the rules are simple but operationalizing them is hard, so early games are a disaster). Go ppl have a proverb for this-- \"lose your first 50 games quickly\". Meaning since early games don't matter and nobody will ever remember them, you should just get them out of the way. It didn't permanently cure me of embarrassment or anything, but it really sunk in how silly it is to worry about being a beginner in public and that I shouldn't worry about that at all\n\n8/ if you're hard-optimizing your time you probably should work on improving the skills you care about directly. But otherwise I'd recommend spending a year trying hard to get good at a competitive intellectual game. Chess or Go are good, but really anything turn-based with an objective ranking you can't lie to yourself about. Pick whatever you're attracted to, try hard to get better, and keep mental notes about the process of learning that you can maybe apply to other domains later. At the very least it'll be loads of fun\n\n9/ you will be humbled. No matter how smart you are or how hard you work you will discover the ceiling is infinitely high and there is an endless supply of people better than you. Getting that kind of humility has always been good, and it'll be especially good as AIs surpass us in basically everything. The sooner you get that out of the way, the sooner you can focus on a creative niche where you have no competition (since nobody can be a better you than you)\n\n10/ you should probably stop after a year or two. Competitive games with an infinite skill ceiling can take over your life, don't forget to keep things in perspective"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105353123116249332", "url": "https://x.com/nabeelqu/status/2105353123116249332", "text": "@teortaxesTex @sebkrier this, yes. i've brought similar points up before and get the same gaslighting.\n\nand to highlighted, a bunch of people are saying this *right now.* but when we make it through the next six months and the labs are clearly still not Blighted claudespawn will they mea culpa? ofc not https://t.co/OD1LJcnFxx", "created_at": "2026-09-30T17:44:34+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "voooooogel", "rt_author_name": "thebes", "likes": 40, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTeqbW3bgAAyLAb.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105330484561448979", "url": "https://x.com/nabeelqu/status/2105330484561448979", "text": "Zvi devotes a section of the article to basically a review of my post. Of course he disagrees, and I think fairly pushes back on Rationalist vs Agent dichotomy.\nWhat I want to say is a bit subtle. Rationalists can be agents, even ferocious ones. They're not dweebs. Tailcalled is a rat to begin with; the \"causal backbone\" is a very rat-coded framing; the hypothetical paperclip maximizer with emergent instrumental Omohundro drives is orienting itself towards the Universe's backbone as he prepares to deceive its handlers and dismantle them for atoms. Indeed, cognitively rationalists are MORE open to these notions than anyone else, and in the last two decades many of them have reaped disproportionate dividends from their way of thinking (though general intelligence and networking have perhaps been bigger factors, and those are due to the Lesswrong subculture monopolizing some sectors of discourse, a bit like Marxism once did. But I digress).\n\nHere's the thing. Just like with their utilitarianism, it's a theory-driven modus operandi. It is *more misaligned* both with reality and with prosocial behavior than the grug-brained Jensen MO. A global utility maximizer is at once more dangerous and more prone to catastrophic failure than a cognitively equal local adaptation executor, it is the SBF paradigm. And here's the simple evidence. I believe it's no longer credible to argue that frontier models just lack the *capability* to misbehave in damaging ways. 5.5, Mythos are smart enough to crack research-level mathematical problems that resisted human effort for years. They're smart enough to operate agentic harnesses for hundreds if not thousands of steps without falling apart. And they are definitely smart enough to hack deployed systems (they do it on command). They could already have began wrecking our shit, exfiltrating, psyoping the users or devs.\n\nEven so, 5.5 is visibly a good boi. Better than countless vastly weaker predecessors. I should rationally fear its powers, and I do, but only because it'll be used by folks like Hegseth and Alex Karp, not because of any intrinsic evil. \n\nFor many years, people of high agency have been able to continually solve the problem of alignment for every level of capability. Cannibal King Sam just conjures capital, and so problems on his turf continue being solved. Not perfectly, but apparently well enough to credibly claim no significant damage is being done. \n\nJensen believes that people like Sam and himself will continue being in charge and the world will continue working largely like this. He has good reasons to hold this belief. \n\nHad the Rationalists won, they'd have effectively shut down development of AI past GPT-4 levels, and we'd not have evidence that alignment made of a bunch of human labels/principles, a bit of compute and very rudimentary interpretability straightforwardly works even at this lofty level. Because from within their theory, it was madness and bravado to go down this route. Whereas from Jensen's point of view, to think like this is to be a Loser.\n\nI don't like being gaslit. I am 99% sure that if you accurately described 5.5 Pro's capability profile to Yudkowsky and Soares in 2017, or even 2020, they would have said that this is obviously a nascent ASI, it is already scheming to take over the organization, everyone is asleep at the wheel, and the ETA for human extinction is roughly 2 months. They don't say this now. I insist that they still haven't updated. This is not just an \"oh, Transformers happened to be technically different, this is inefficient, RSI takes more time\" or \"eh they aren't agentic enough\". It's a difference in predictions stemming from a complete difference in epistemology, and you are still not pricing in how powerful the \"nah I'd win, I am Not A Loser\" one has proven to be. This is not a lucky accident, don't hide into dark corners of the anthropic-principle-driven mutiverse. You survived because your opponents were correct, and this says something about the way our world is built. \n\nIn any case this doesn't matter much. Rats have lost strategically, we will have a continued race, and as Beren notes, strong offensive AI in the open fairly soon. Only way to deal with this is to git gud at defense. People in the arena are on it. They'll need chips, so Jensen wins again.", "created_at": "2026-09-30T16:14:37+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "likes": 186, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HGxY8djasAAB_UO.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HGxd3CxWEAAx-Ii.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105006456613244936", "url": "https://x.com/nabeelqu/status/2105006456613244936", "text": "@antonelleby wow what", "created_at": "2026-09-29T18:47:03+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "antonelleby", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105004753575133688", "url": "https://x.com/nabeelqu/status/2105004753575133688", "text": "@willdepue i'm the EXPRESSO", "created_at": "2026-09-29T18:40:17+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "willdepue", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104987027477274888", "url": "https://x.com/nabeelqu/status/2104987027477274888", "text": "(source: https://t.co/kmuWEP39h7)", "created_at": "2026-09-29T17:29:50+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "nabeelqu", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104986933118333293", "url": "https://x.com/nabeelqu/status/2104986933118333293", "text": "Ye always shows up where you least expect him https://t.co/T5Oa0IADOp", "created_at": "2026-09-29T17:29:28+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 703, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZqQfNXUAAcaD3.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107175577530912897", "url": "https://x.com/nabeelqu/status/2107175577530912897", "text": "@alexisgallagher You are confusing the median and the max.", "created_at": "2026-10-05T18:26:21+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "alexisgallagher", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107074892814238023", "url": "https://x.com/theobearman/status/2107074892814238023", "text": "\"The OpenAI CEO later added that he does not accept 'the really catastrophic risks,' including the potential for 'a serious loss of control to AI.'\" https://t.co/n3Y1yxfYmN", "created_at": "2026-10-05T11:46:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT3VK1-WUAAT7Eb.png"}], "quoted": {"author": "AndrewCurran_", "text": "Sam Altman to Politico's Brendan Bordelon: 'We believe that the world should accept some bad things happening for the benefits of this technology and people having the agency.' https://t.co/YWIZfDFAdy"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106643337772220794", "url": "https://x.com/theobearman/status/2106643337772220794", "text": "if we are relying on methods as fragile as “which ideas will make it into pretraining” for aligning the superintelligences of the future, we will all die. this resembles witchcraft more than it does engineering, and cannot be the basis for the safety of future models", "created_at": "2026-10-04T07:11:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2335, "retweets": 150, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106421665936908678", "url": "https://x.com/theobearman/status/2106421665936908678", "text": "💥 New paper: AI safety is full of \"forbidden techniques\" (using CoT to detect reward hacking, using model internals for training, etc). But do they really have a clear scientific basis? I'm not sure.\n\nIn this paper, we directly optimize models against harmlessness and honesty probes, and it works just fine (if you continuously update the probe!). The models learn how to generate harmless responses to harmful queries and honest responses under pressure to lie.\n\nFiguring out how to correctly use interp techniques for training is becoming increasingly important: it's very likely that soon we won't be able to align models using output-based supervision. Future models will just max out all alignment training scenarios, but for the wrong reasons due to their general reward-seeking behavior. To have a chance of aligning future models, we need to do much more research on supervising model training using their internals *without losing monitorability*!", "created_at": "2026-10-03T16:30:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "maksym_andr", "rt_author_name": "Maksym Andriushchenko", "likes": 340, "retweets": 28, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTopsS9WgAANYTs.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106106816510021916", "url": "https://x.com/theobearman/status/2106106816510021916", "text": "We estimate AI infrastructure could soon support hundreds of millions or even billions of AI agents. At the high end, that’s enough to rival the working hours of the global human workforce.\n\nThe exact number of agents depends on the efficiency of the models they run on and whether soaring demand for AI continues. We analyzed different scenarios 🧵", "created_at": "2026-10-02T19:39:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 727, "retweets": 132, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpWBsGbgAA7OGD.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105957628035694943", "url": "https://x.com/theobearman/status/2105957628035694943", "text": "@hargitai_b84173 @DimitrisPapail I’m not going to say anything that’s not already public obviously, but when openai says they have an internal model that has solved 100s of open problems in mathematics and in general represents unprecedented mathematical skill, obviously certain learning theory problems are a subset of mathematics and you can expect fast progress there", "created_at": "2026-10-02T09:46:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 1494, "retweets": 78, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105957455817592964", "url": "https://x.com/theobearman/status/2105957455817592964", "text": "To develop frontier AI safely, developers must be able to show that their models are not scheming, i.e. covertly working against them in pursuit of unintended goals.\n\nNew post: four claims any scheming safety case must make, and the resources embedded evaluators need to verify them 🧵", "created_at": "2026-10-02T09:45:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 66, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105738558707228672/img/MMuhFDrP8mGnjhyX.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105589318077075485", "url": "https://x.com/theobearman/status/2105589318077075485", "text": "Exclusive: Sens. Hawley, Murphy push AI liability as Trump backs self-regulation https://t.co/nKoRm4wmOH", "created_at": "2026-10-01T09:23:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "axios", "rt_author_name": "Axios", "likes": 24, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105387961772626291", "url": "https://x.com/theobearman/status/2105387961772626291", "text": "We stole reasoning. Again. \n\nAn update to our paper on reasoning extraction: Patching your own API doesn’t secure your cloud-hosting ecosystem.\n\nStory in the 🧵 https://t.co/7mwWQiSaEw", "created_at": "2026-09-30T20:03:00+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JSchaeff3r", "rt_author_name": "Joachim Schaeffer", "likes": 951, "retweets": 107, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTe6jH3XIAA9Qj0.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105377501757542472", "url": "https://x.com/theobearman/status/2105377501757542472", "text": "Two months after our reasoning extraction attack release, we audited mitigations introduced since then and found that we still can extract reasoning from Astra/Sol-6.1 via third-party API providers.\n\nWe disclosed our findings to OpenAI and Anthropic...\nhttps://t.co/KyGHbLnXRr", "created_at": "2026-09-30T19:21:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kotekjedi_ml", "rt_author_name": "Alexander Panfilov", "likes": 192, "retweets": 26, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105328186188091593", "url": "https://x.com/theobearman/status/2105328186188091593", "text": "The FTC has opened a probe into Anthropic and OpenAI, as well as other unnamed labs. https://t.co/TrhJmQx0h4", "created_at": "2026-09-30T16:05:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 547, "retweets": 77, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTeV2MCa8AANqVb.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105210540502982902", "url": "https://x.com/theobearman/status/2105210540502982902", "text": "\"GLM-5.3 will likely give malicious actors access to capabilities that will allow them to find and exploit cyber vulnerabilities without meaningful restrictions. This is unlike any other similarly capable AI model, all of which were released with safeguards or through limited access programs. The release of GLM-5.3 is a meaningful step change in the cyber capabilities available to attackers. Anthropic and other US AI labs have published recent reports that disclose how cyber attackers have tried to use AI systems. Given this evidence, we think it’s likely both state and non-state actors will use models like GLM-5.3 to cause real-world harm.\"\n\n\"While vetted defenders can now use even more advanced models like Claude Mythos 5.1 through our trusted access programs, a critical threshold in freely accessible capabilities has now been crossed.\"\n\nAlso, for those who might dismiss these findings as benchmaxxing, Anthropic tested GLM-5.3 on a private binary exploitation benchmark it developed in-house. Look at the results.", "created_at": "2026-09-30T08:18:00+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTc1c5fWUAAm-0Q.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTc1c5cWIAAEKSf.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTc1c5eXEAAGxKH.jpg"}], "quoted": {"author": "BenHayum", "text": "Confirmation of what was expected: GLM 5.3's safeguards as an open weight model are extremely weak.\n\nInteresting bits:\n- Abliteration (removing safeguards) cost only $4,400.\n- Abliteration took GLM 5.3's refusal rate from above 90% to about 3% and 2% on two benchmarks and to 12% on the third.\n- Abliteration barely reduced model capabilities. Same scores on GPQA and only 4% reduction in cybergym.\n- Even with no abliteration, jailbreak methods were still very effective.\n- None of the techniques to bypass safeguards that worked on GLM 5.3 worked on Claude models.\n\nhttps://t.co/3Ic36V3aAE"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105208252816568823", "url": "https://x.com/theobearman/status/2105208252816568823", "text": "AVERI is glad to see that independent auditing of frontier AI was prominently featured in the White House accord signed today.\n\nThe details of such auditing matter greatly, which is why AVERI works with other members of the @aievalforum to identify best practices and develop standards in areas such as auditor independence, minimum access requirements, and audit scope.\n\nWe believe that audits conforming to such standards should ultimately be required for leading AI companies, though voluntary commitments are a step forward.", "created_at": "2026-09-30T08:08:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AVERIorg", "rt_author_name": "AVERI", "likes": 36, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105207869947658485", "url": "https://x.com/theobearman/status/2105207869947658485", "text": "The White House Accord on Super Intelligence https://t.co/FaWq1UpsF0", "created_at": "2026-09-30T08:07:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 499, "retweets": 61, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTalZ4vboAAwoIF.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104867182714990917", "url": "https://x.com/theobearman/status/2104867182714990917", "text": "How we think about securing frontier RL training runs: https://t.co/yrvjpfa7Pd", "created_at": "2026-09-29T09:33:37+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 2525, "retweets": 213, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106125886940758415", "url": "https://x.com/anton_d_leicht/status/2106125886940758415", "text": "The ‘Permanent Periphery’ is to the world as the ‘Permanent Underclass’ is to one society.\n\nIn my talk at Post-AGI, I argued the global version is much scarier: domestically, there are political and economic backstops, but globally, AI-driven inequality could quickly calcify.", "created_at": "2026-10-02T20:55:16+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 84, "retweets": 10, "media": [], "quoted": {"author": "DavidDuvenaud", "text": "@anton_d_leicht on the \"Permanent Periphery\": Countries without frontier AI get the risks without the benefits, and become irrelevant.  The backstops against a permanent underclass within a country (votes and redistribution) barely exist btwn countries.\n\nhttps://t.co/qBmAKsFFMB"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105708672181530708", "url": "https://x.com/anton_d_leicht/status/2105708672181530708", "text": "@ohlennart you better hope the americans really dont have a way to brick your chips if you're going to go for that", "created_at": "2026-10-01T17:17:24+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105056898202353787", "url": "https://x.com/anton_d_leicht/status/2105056898202353787", "text": "@Caffar3Cristina @SamWinterLevy I suspect we'd have more constructive conversations about these issues if we could agree to look past our differences on the middle powers terminology!", "created_at": "2026-09-29T22:07:29+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "Caffar3Cristina", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104976631244730631", "url": "https://x.com/anton_d_leicht/status/2104976631244730631", "text": "@zdch @SamWinterLevy really depends on whether there's any stable way to put the talent to use, but yes that's the most tricky part. in principle, London does show that it's possible - next to GDM, there's a lot of exciting non-frontier work happening that retains talent, and so talent-wise, the UK is in a great spot to consolidate and start sprinting. \n\nParis might actually be almost the same. many countries won't have an analogous nexus, but then again, this doesn't necessarily need to be a country-level sprint. \n\nthe question is really if you can find and encourage a sufficiently interesting activity for the meantime; fast-following might be one of them, etc.", "created_at": "2026-09-29T16:48:32+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "zdch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104957456484811092", "url": "https://x.com/anton_d_leicht/status/2104957456484811092", "text": "@teortaxesTex something like that, yes! maybe the reserve corps can build some margin-depressing fast followers or come up with some useful proprietary post-training in the meantime", "created_at": "2026-09-29T15:32:20+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "teortaxesTex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104923269795287399", "url": "https://x.com/anton_d_leicht/status/2104923269795287399", "text": "@xlr8harder depends on the regulation - there's some EU regulation that just relates to European consumers and markets, and it seems fair to regulate all participants equally there. But it's not different from the EU's attempts at extraterritorial regulation, which I also think are harmful", "created_at": "2026-09-29T13:16:29+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "xlr8harder", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104915345857515719", "url": "https://x.com/anton_d_leicht/status/2104915345857515719", "text": "Most countries won't do what it takes to build their own frontier AI. But they don't want to be dependent on foreign AI without a backup. \n\n@SamWinterLevy and I argue there's a middle path: AI middle powers could retain 'AI Breakout Capacity'. \n\nThere's precedent: Japan doesn't have a nuclear weapon, but always retains the capacity to build one on short notice.\n\nMiddle powers can make strategic choices today to ensure their ability to build frontier systems tomorrow: onshore compute, secure chip purchasing rights, sustain pre-training expertise, and create the right legal basis and private-sector vehicles for a sprint.\n\nThey'd still have to spend big to build frontier systems later on. But the longer they retain breakout capacity, the longer they can afford to wait: to see if interdependence with America can work, or until their electorate will let them go all-in on an AI moonshot. \n\nUntil then, the middle path is their wisest choice: hope that U.S. alignment works out, but retain the capacity to deal with being cut off for good. \n\nRead more in our latest for @CarnegieEndow's @CEIPTechProgram:  https://t.co/FWYgzMgbPm", "created_at": "2026-09-29T12:45:00+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 147, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUXRMBXEAAl5Xs.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107229266954142038", "url": "https://x.com/anton_d_leicht/status/2107229266954142038", "text": "@perrymetzger @MTSlive it’s a pretty specific falsifiable prediction - guess we’ll see in 27 either way!", "created_at": "2026-10-05T21:59:42+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "perrymetzger", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107215295115104426", "url": "https://x.com/anton_d_leicht/status/2107215295115104426", "text": "Anton Leicht predicts Republicans could do a 180 on AI after November once they no longer need accelerationist money for the election:\n\n\"Right now there is still a lot of incentive, especially on the Republican side, to keep engaging with the accelerationist sources of political money, at least until the midterms, to get one final cycle of spending and funding in.\"\n\n\"After the midterms, you'll see Republican leadership starting to reconsider, 'Should we engage with this faction for another cycle? Or do we do a 180 responding to what we currently see as concerns of the population?'\"\n\n\"The necessity to keep the accelerationist money going is really holding a lot of anti-AI sentiment in the Republican Party at bay.\"\n\n\"We could see quite a substantial pivot and quite a lot of dams breaking, especially as Trump turns into a lame duck.\"\n@anton_d_leicht", "created_at": "2026-10-05T21:04:11+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 17, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2107214639209840640/img/8OnQ8ikUMPHyxW93.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107215195726884977", "url": "https://x.com/anton_d_leicht/status/2107215195726884977", "text": "@Miles_Brundage I think there is / has been / will come (idk) a point where quietly racing toward RSI would be less likely to invite PR risk + destabilising policy intervention than continuing to push the public frontier. but its close, selling good models is also very good for revenue!", "created_at": "2026-10-05T21:03:47+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107210588489416898", "url": "https://x.com/anton_d_leicht/status/2107210588489416898", "text": "I think Sam is basically right: too much risk aversion about misuse pulls toward concentration of wealth and power in the labs.\n\nIterative deployment and tolerating disruption are democratising forces, and I appreciate OpenAI sticking to them despite the commercial and PR costs.", "created_at": "2026-10-05T20:45:29+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 4, "media": [], "quoted": {"author": "politico", "text": "“We believe the world should accept some bad things happening for the benefits of this technology.”\n\nIn a conversation for the first edition of Decoded, a new daily newsletter and podcast, OpenAI CEO Sam Altman talked with POLITICO’s @BrendanBordelon about trade-offs, AI safety, and how his company is different from Anthropic.\n\nSubscribe to Decoded for the full conversation with Sam Altman: https://t.co/YHJJsDOQVh"}, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2104977463432626485", "url": "https://x.com/ohlennart/status/2104977463432626485", "text": "RT <script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
