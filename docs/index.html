d be unfortunate (because it would make the world harder to predict) 🥲", "links": {}, "media": [], "url": "https://x.com/BasilHalperin/status/2119541279042216088", "created_at": "Sun Nov 08 21:23:14 +0000 2026"}], "enriched": 3}, {"id": "2120965110185468316", "url": "https://x.com/DaveRBanerjee/status/2120965110185468316", "text": "Source: https://t.co/EoKwYN8jud", "created_at": "2026-11-12T19:41:02+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "reply_to_id": "2120965107773575196", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/EoKwYN8jud": "https://epochai.substack.com/p/what-huaweis-horinger-data-center?publication_id=3755861&post_id=224478179&isFreemail=true&r=bcvpw&triedRedirect=true"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120965107773575196", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "New Epoch post on Huawei's biggest data center yet\n\nTo me, the main upshot is that semiconductor export controls work shockingly well\n\nThe new Huawei data center is China's biggest data center, yet its compute capacity is only 7% of the biggest US data center!!\n\nEven though the Huawei data center is packed with the best Chinese chips, these chips are far worse than Western chips because Huawei doesn't have access to state-of-the-art semiconductor manufacturing equipment, thanks to the export controls on EUV machines back in 2019\n\nThe next step to continue Western dominance in chips is to pass the MATCH Act\n\nPassing the MATCH Act would prevent China from accessing DUV machines, which they currently use to manufacture their best chips", "links": {"https://t.co/1HkvOMceMO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8tYIhWkAA3LxA.jpg"}], "url": "https://x.com/DaveRBanerjee/status/2120965107773575196", "created_at": "Thu Nov 12 19:41:01 +0000 2026"}, "enriched": 3}, {"id": "2120965107773575196", "url": "https://x.com/DaveRBanerjee/status/2120965107773575196", "text": "New Epoch post on Huawei's biggest data center yet\n\nTo me, the main upshot is that semiconductor export controls work shockingly well\n\nThe new Huawei data center is China's biggest data center, yet its compute capacity is only 7% of the biggest US data center!!\n\nEven though the Huawei data center is packed with the best Chinese chips, these chips are far worse than Western chips because Huawei doesn't have access to state-of-the-art semiconductor manufacturing equipment, thanks to the export controls on EUV machines back in 2019\n\nThe next step to continue Western dominance in chips is to pass the MATCH Act\n\nPassing the MATCH Act would prevent China from accessing DUV machines, which they currently use to manufacture their best chips", "created_at": "2026-11-12T19:41:01+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8tYIhWkAA3LxA.jpg"}], "links": {"https://t.co/1HkvOMceMO": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2120965110185468316", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "Source: https://t.co/EoKwYN8jud", "links": {"https://t.co/EoKwYN8jud": "https://epochai.substack.com/p/what-huaweis-horinger-data-center?publication_id=3755861&post_id=224478179&isFreemail=true&r=bcvpw&triedRedirect=true"}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2120965110185468316", "created_at": "Thu Nov 12 19:41:02 +0000 2026"}], "enriched": 3}, {"id": "2121076040839618615", "url": "https://x.com/DaveRBanerjee/status/2121076040839618615", "text": "@RahulKrish91858 @King_James_Kim What do you think is incorrect about Epoch's methodology?", "created_at": "2026-11-13T03:01:50+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "RahulKrish91858", "reply_to_id": "2121061863043792946", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121061863043792946", "author_handle": "RahulKrish91858", "author_name": "Rahul", "text": "@King_James_Kim @DaveRBanerjee Epoch knows nothing", "links": {}, "media": [], "url": "https://x.com/RahulKrish91858/status/2121061863043792946", "created_at": "Fri Nov 13 02:05:30 +0000 2026"}, "enriched": 3}, {"id": "2121075443449413661", "url": "https://x.com/DaveRBanerjee/status/2121075443449413661", "text": "@EgeErdil2 Do you disagree with any object-level points made in this thread? Overall, I thought it was pretty convincing that this isn't some suspicious natsec authoritarian tactic.\n\nhttps://t.co/e0LsaXS6Lr", "created_at": "2026-11-13T02:59:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "EgeErdil2", "reply_to_id": "2120967837120651712", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/e0LsaXS6Lr": "https://x.com/Laneless_/status/2121030810610598077"}, "quoted": {"id": "2121030810610598077", "author_name": "Jai", "links": {}, "author": "Laneless_", "text": "I think going all-in on defending Jensen under the auspices of resisting tyranny doesn't really make sense. It seems to assume a very specific model of what's going on based on extremely flimsy evidence. Consider what we actually know:"}, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2120967837120651712", "author_handle": "EgeErdil2", "author_name": "Ege Erdil", "text": "the US took another step towards becoming a banana republic today\n\nutterly shameful\n\nwhat's even the point of trying to \"win\" against china if you adopt their authoritarian tactics and mindset? if you treat your best entrepreneurs the way china treats theirs?", "links": {}, "media": [], "url": "https://x.com/EgeErdil2/status/2120967837120651712", "created_at": "Thu Nov 12 19:51:52 +0000 2026"}, "enriched": 3}, {"id": "2121075119309152597", "url": "https://x.com/DaveRBanerjee/status/2121075119309152597", "text": "I think going all-in on defending Jensen under the auspices of resisting tyranny doesn't really make sense. It seems to assume a very specific model of what's going on based on extremely flimsy evidence. Consider what we actually know:", "created_at": "2026-11-13T02:58:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "Laneless_", "rt_author_name": "Jai", "rt_avatar": "https://pbs.twimg.com/profile_images/1623390078285516800/5W88GIAu_normal.jpg", "rt_id": "2121030810610598077", "likes": 73, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121065700630348100", "url": "https://x.com/DaveRBanerjee/status/2121065700630348100", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon.", "created_at": "2026-11-13T02:20:45+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "willdepue", "rt_author_name": "will depue", "rt_avatar": "https://pbs.twimg.com/profile_images/1933036715343839232/NtsZBjee_normal.jpg", "rt_id": "2120992457630326841", "likes": 36740, "retweets": 5644, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9GgJ_WcAA9m3I.jpg"}], "links": {"https://t.co/YOtzND0Jqk": "http://unemploymentlabs.com/checkpoint-forensics", "https://t.co/qlttvJsXG7": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121290991655149658", "url": "https://x.com/DaveRBanerjee/status/2121290991655149658", "text": "@Laneless_ @EgeErdil2 Wait, actually, since Jensen slept with one of his direct reports, I think that is probably enough grounds to fire him, in the court of public opinion\n\nso I've changed my mind. Idt the spy/asset angle is actually load bearing", "created_at": "2026-11-13T17:15:58+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "reply_to_id": "2121290282834571726", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121290282834571726", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "@Laneless_ @EgeErdil2 My impression is that the spy/asset angle is actually load-bearing for whether Jensen gets fired. For example, Bezos had an affair while he was CEO of Amazon, and he didn't lose his job. So I weakly suspect that if Alice isn't a Chinese asset, then he wouldn't have been fired\n\nTBC, I think that Jensen's actions towards blocking export controls are plausibly the most damaging act on US national security of All Time", "links": {}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2121290282834571726", "created_at": "Fri Nov 13 17:13:09 +0000 2026"}, "enriched": 3}, {"id": "2121290282834571726", "url": "https://x.com/DaveRBanerjee/status/2121290282834571726", "text": "@Laneless_ @EgeErdil2 My impression is that the spy/asset angle is actually load-bearing for whether Jensen gets fired. For example, Bezos had an affair while he was CEO of Amazon, and he didn't lose his job. So I weakly suspect that if Alice isn't a Chinese asset, then he wouldn't have been fired\n\nTBC, I think that Jensen's actions towards blocking export controls are plausibly the most damaging act on US national security of All Time", "created_at": "2026-11-13T17:13:09+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Laneless_", "reply_to_id": "2121272290625331318", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121272290625331318", "author_handle": "Laneless_", "author_name": "Jai", "text": "@DaveRBanerjee @EgeErdil2 This seems plausible to me, but not load-bearing in terms of Jensen-definitely-fucked-up. The evidence that this company was ultimately circumventing export controls to increase Chinese compute is very strong.", "links": {}, "media": [], "url": "https://x.com/Laneless_/status/2121272290625331318", "created_at": "Fri Nov 13 16:01:40 +0000 2026"}, "enriched": 3}, {"id": "2121271032057102667", "url": "https://x.com/DaveRBanerjee/status/2121271032057102667", "text": "@Laneless_ @EgeErdil2 thanks for clarifying. Based on @EgeErdil2's most recent tweets, it seems he thinks that Alice isn't actually a Chinese spy - or at least he's claiming that there isn't enough evidence to say beyond a reasonable doubt that she is a CCP spy. Do you agree/disagree?", "created_at": "2026-11-13T15:56:40+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Laneless_", "reply_to_id": "2121130095075271129", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121130095075271129", "author_handle": "Laneless_", "author_name": "Jai", "text": "@DaveRBanerjee @EgeErdil2 I did make a significant factual error in this thread - Jensen was *not* briefed about Alice. I think this makes his behavior significantly less egregious and reduces-but-does-not-eliminate the degree to which the government gave him preferential treatment.", "links": {}, "media": [], "url": "https://x.com/Laneless_/status/2121130095075271129", "created_at": "Fri Nov 13 06:36:38 +0000 2026"}, "enriched": 3}, {"id": "2121496306602385851", "url": "https://x.com/DaveRBanerjee/status/2121496306602385851", "text": "https://t.co/W4iGrNYOwX", "created_at": "2026-11-14T06:51:49+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "reply_to_id": "2121467725285380528", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/W4iGrNYOwX": "https://x.com/daverbanerjee/status/2121495716489007523?a=GNLjclsuf9kA6slQVLg&s=46"}, "quoted": {"id": "2121495716489007523", "author_name": "Dave Banerjee", "links": {}, "author": "DaveRBanerjee", "text": "As a corollary: if most of your labor force for doing alignment R&D and other def/acc R&D will be from future AIs, then it will be v important to have access to SOTA models as soon as possible\n\nBy default, OAI and Ant will prob keep these models internal for a while. So it would be highly desirable to have some kind of project glasswing for alignment and def/acc R&D\n\nAnd to be clear, I think getting this right is probably more important than most field building at the moment"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121467725285380528", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "Say you want to increase the labor force working on solving the alignment problem\n\nOne thing you could do is set up an Alignment fellowship and build a talent pipeline\n\nBut if you think that AI R&D automation is imminent, then your best bet at “building the alignment field” is to train AIs to be more capable in domains useful for alignment (e.g., conceptual research)\n\nHowever, accelerating certain capabilities can be dual-use and actually be net-negative (e.g., shortening timelines)\n\nSo the solution is to avoid advancing capabilities through training data. And instead you focus on building scaffolds/harnesses/data-stores that can only be bought/procured for alignment R&D. This prevents the downsides while harvesting the upside", "links": {}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2121467725285380528", "created_at": "Sat Nov 14 04:58:15 +0000 2026"}, "enriched": 3}, {"id": "2121495716489007523", "url": "https://x.com/DaveRBanerjee/status/2121495716489007523", "text": "As a corollary: if most of your labor force for doing alignment R&D and other def/acc R&D will be from future AIs, then it will be v important to have access to SOTA models as soon as possible\n\nBy default, OAI and Ant will prob keep these models internal for a while. So it would be highly desirable to have some kind of project glasswing for alignment and def/acc R&D\n\nAnd to be clear, I think getting this right is probably more important than most field building at the moment", "created_at": "2026-11-14T06:49:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2121467725285380528", "author_name": "Dave Banerjee", "links": {}, "author": "DaveRBanerjee", "text": "Say you want to increase the labor force working on solving the alignment problem\n\nOne thing you could do is set up an Alignment fellowship and build a talent pipeline\n\nBut if you think that AI R&D automation is imminent, then your best bet at “building the alignment field” is to train AIs to be more capable in domains useful for alignment (e.g., conceptual research)\n\nHowever, accelerating certain capabilities can be dual-use and actually be net-negative (e.g., shortening timelines)\n\nSo the solution is to avoid advancing capabilities through training data. And instead you focus on building scaffolds/harnesses/data-stores that can only be bought/procured for alignment R&D. This prevents the downsides while harvesting the upside"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121467725285380528", "url": "https://x.com/DaveRBanerjee/status/2121467725285380528", "text": "Say you want to increase the labor force working on solving the alignment problem\n\nOne thing you could do is set up an Alignment fellowship and build a talent pipeline\n\nBut if you think that AI R&D automation is imminent, then your best bet at “building the alignment field” is to train AIs to be more capable in domains useful for alignment (e.g., conceptual research)\n\nHowever, accelerating certain capabilities can be dual-use and actually be net-negative (e.g., shortening timelines)\n\nSo the solution is to avoid advancing capabilities through training data. And instead you focus on building scaffolds/harnesses/data-stores that can only be bought/procured for alignment R&D. This prevents the downsides while harvesting the upside", "created_at": "2026-11-14T04:58:15+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "thread": [{"id": "2121496306602385851", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "https://t.co/W4iGrNYOwX", "links": {"https://t.co/W4iGrNYOwX": "https://x.com/daverbanerjee/status/2121495716489007523?a=GNLjclsuf9kA6slQVLg&s=46"}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2121496306602385851", "created_at": "Sat Nov 14 06:51:49 +0000 2026"}], "enriched": 3}, {"id": "2121360743543316624", "url": "https://x.com/DaveRBanerjee/status/2121360743543316624", "text": "One of the strong arguments for why renting chips to China is better than selling them is that it gives the US optionality to control them in the future. Unfortunately when the renter is Megaspeed that case breaks down, and remote access looks more liability than optionality 🧵", "created_at": "2026-11-13T21:53:08+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "rt_avatar": "https://pbs.twimg.com/profile_images/1612127888475570176/X_ZBlRj0_normal.jpg", "rt_id": "2121273310432391349", "likes": 8, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "thread": [{"id": "2121273313318285630", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The original rent don't sell argument largely had in mind Chinese firms buying cloud services from US hyperscalers. In reality a large amount of Chinese remote access looks like chips being rented out by what are effectively Chinese off-balance sheet vehicles instead", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273313318285630", "created_at": "Fri Nov 13 16:05:43 +0000 2026"}, {"id": "2121273315012526198", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Megaspeed is the most egregious case, where reporting around the Jensen saga has clearly demonstrated how far it was simply a vehicle for Alibaba to circumvent chip controls, and was itself actively engaged in smuggling of chips into China", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273315012526198", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273316501545329", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Rather than remote access enabling continued cloud business under auspices of US cloud players, it instead has turned into an enabler for networks of shell firms in Southeast Asia and China to engage in hugely profitable violations of US controls", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273316501545329", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273318066057611", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "When firms such as Megaspeed which have no jurisdictional attachments, and are de facto controlled by Chinese interests, lose access to future chip shipments, one of the most logical moves will be to work to smuggle into China their chips held in SEA, profiting from huge markups", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273318066057611", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273320570249382", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The hundreds of thousands of chips being owned and operated by similar firms across Asia are the riskiest pool for future smuggling. Allowing those same firms to continue freely buying up advanced AI hardware, including Vera Rubins, would be a major strategic error", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273320570249382", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273323325952421", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Smuggling is not just bad because of the illegality or national security implications, but also since future international treaties on AI are likely to rest on effective tracking and verification of existing chip stocks", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273323325952421", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273325070458889", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The existence of hundreds of thousands to millions of advanced chips in an unmonitored and uncontrolled grey market across Asia is highly antithetical to making future deals which rely on minimal dark compute", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273325070458889", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273328212316231", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Overall the US should take immediate action to clamp down on remote access, pairing this with stricter policies on chip buyer whitelists, chip tracking and whistleblower rewards to reduce the risk of remote access chips blurring too easily into smuggled ones", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273328212316231", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}, {"id": "2121273329763893326", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Read my full piece making this case at https://t.co/DScRuaOWiM", "links": {"https://t.co/DScRuaOWiM": "https://open.substack.com/pub/erwald/p/ai-chips-rented-to-chinese-firms?r=hemux&utm_campaign=post&utm_medium=web"}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273329763893326", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}], "enriched": 3}, {"id": "2119100752161645027", "url": "https://x.com/DKokotajlo/status/2119100752161645027", "text": "@viemccoy @panickssery That's the main takeaway, yeah. As we speak there are probably dozens of anthropic employees scrolling twitter and thinking \"The people are angry at us. If only they knew what I know, they would understand...\"\n\nNo. If they knew what you know, they would be even angrier.", "created_at": "2026-11-07T16:12:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118510732434383111", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2118510732434383111", "author_handle": "viemccoy", "author_name": "vie ⟢", "text": "@panickssery @DKokotajlo I guess I'm confused what I'm supposed to take away from this other than \"information assymetrys can cause you to underweight the opinions of people without your information\"", "links": {}, "media": [], "url": "https://x.com/viemccoy/status/2118510732434383111", "created_at": "Fri Nov 06 01:08:13 +0000 2026"}}, {"id": "2119099767137640522", "url": "https://x.com/DKokotajlo/status/2119099767137640522", "text": "Uhhh Anthropic made an offer to one of the risk assessment staff at METR during this project??? (Which the person declined)\n\nWe need rules about independent evaluators going to cos they evaluate after and in the meantime companies should be shamed for trying this stuff https://t.co/2ca51xSV5K", "created_at": "2026-11-07T16:08:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118740763018404328", "likes": 728, "retweets": 46, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdHfjGaQAIgj0y.jpg"}], "links": {"https://t.co/2ca51xSV5K": ""}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3}, {"id": "2119098173197320505", "url": "https://x.com/DKokotajlo/status/2119098173197320505", "text": "AECI scores extracted from the graph imply that the time horizon doubling time is now around 2 months, and that the TH of Model 4 is around 240 hours.\n\nTBC this is pretty weak evidence. It's unclear if there is a clear 1:1 mapping from AECI to time horizon for numbers this large. https://t.co/SWuqsF4Zha", "created_at": "2026-11-07T16:02:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "nikolaj2030", "rt_author_name": "Nikola Jurkovic", "rt_avatar": "https://pbs.twimg.com/profile_images/2087614574690463744/VXhXw1cq_normal.jpg", "rt_id": "2118776619687133579", "likes": 192, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdn7AXbEAEKozd.jpg"}], "links": {"https://t.co/SWuqsF4Zha": ""}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3}, {"id": "2119434351230554158", "url": "https://x.com/DKokotajlo/status/2119434351230554158", "text": "I know this is a predictable opinion from me but I don't agree with the strong emotional reaction against the anti-data-center movements that I've seen this week.\n\nAs I see it, algorithmic progress means that whatever you would be able to do with more and bigger data centers in 2 years, you will be able to do with the data centers we have today in 4 years - probably sooner. So nothing remotely apocalyptically bad will happen from even extreme levels of success by anti-data-center people.\n\nMeanwhile we need all the time we can get to better harden the world against both already-visible cybersecurity issues and any bio and other risks soon to come. Science applications are bottlenecked by many things other than AI, so slowing AI down by one year will slow those down by much less than one year.\n\nGiven this, a slowdown in compute hyper-scaling seems quite net good? Notice this is without any controversial \"doomer arguments\", RSI etc. Even if net-bad, it's certainly not worse than like 10+ other political things.", "created_at": "2026-11-08T14:18:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "VitalikButerin", "rt_author_name": "vitalik.eth", "rt_avatar": "https://pbs.twimg.com/profile_images/2042521108067352576/3rv2_9m1_normal.jpg", "rt_id": "2119377918875079163", "likes": 2351, "retweets": 190, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3}, {"id": "2119631379864719525", "url": "https://x.com/DKokotajlo/status/2119631379864719525", "text": "Yoshua Bengio:\n\n“I personally think that we should just stop the training of the most advanced models.”\n\nWe agree. https://t.co/0S5HsMVcNk", "created_at": "2026-11-09T03:21:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "PauseAI_UK", "rt_author_name": "PauseAI UK", "rt_avatar": "https://pbs.twimg.com/profile_images/2042776512831586304/2IvEZmZ4_normal.jpg", "rt_id": "2119037650447274209", "likes": 239, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119007663673516032/img/PmhbjFXYx8Nw3Smm.jpg"}], "links": {"https://t.co/0S5HsMVcNk": ""}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119631321232478458", "url": "https://x.com/DKokotajlo/status/2119631321232478458", "text": "⚠️declaring accelerationist amnesty⚠️\n\nif recent contact with reality is causing you to feel some kernels of worry about this whole ai safety thing, *you are allowed to change your mind*. you don't even have to change it all the way, you don't have to suddenly change your twitter bio or start protesting against nuclear power plants, you don't need to become an EA or suddenly think yudkowsky was always right about everything. you're allowed to just notice that shit seems to be getting real in some pretty weird ways and update your beliefs.\n\nat least personally, if i see someone saying \"damn, i guess i was wrong or at least overconfident about X\" i'm not gonna take the opportunity to dunk or i told you so. i'm sure others will, this is the fucking internet. but at least personally, i'm just gonna be happy that you're paying attention. there were lots and lots of good reasons to *not* take this situation seriously. there were lots of well verbalized reasons why rushing ahead was potentially a huge benefit for humanity. hell there were maybe even valid reasons why there was little to be done until we'd already gotten to nearly exactly this point. that's all fine man. all that matters right now is that we as a civilization realize what we're on the verge of, and make it through this carefully. it's gonna take a huge effort from all of us.", "created_at": "2026-11-09T03:21:02+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "rt_avatar": "https://pbs.twimg.com/profile_images/1640415225991282688/K0CmWWD6_normal.png", "rt_id": "2085587493127389292", "likes": 1347, "retweets": 89, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119611683077521908", "url": "https://x.com/DKokotajlo/status/2119611683077521908", "text": "Yep. And this could be done ~immediately today. *keeping* the freeze in place would get increasingly difficult as more trailing actors catch up to the frontier and then need to be stopped from surpassing it. But I think that could be done too. We talk about this in AI 2040 under the \"Plan S\" branch.", "created_at": "2026-11-09T02:03:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 450, "retweets": 36, "media": [], "links": {}, "quoted": {"id": "2118754534826868816", "author_name": "Joe", "links": {}, "author": "JoePostingg", "text": "If you simply froze AI capability at Mythos / Astra levels and focused on decreasing the cost of compute you would totally revolutionize software development with zero existential risk"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119601995359416751", "url": "https://x.com/DKokotajlo/status/2119601995359416751", "text": "SITUATION DETECTED: Bloomington, Indiana's city council voted unanimously this week to ban any recursively self-improving entity capable of greatly outperforming all humans on all cognitive tasks from inside city limits, citing existential hazards and loss of human control.", "created_at": "2026-11-09T01:24:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2119274101714108630", "likes": 2698, "retweets": 167, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119802222527865005", "url": "https://x.com/DKokotajlo/status/2119802222527865005", "text": "From President Trump's interview with CBS tonight. The transcript was a mess because they talked over each other a lot. So I cleaned it up. 1/3 https://t.co/HGtMrvIlBm", "created_at": "2026-11-09T14:40:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2119645048841421106", "likes": 499, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWp98D5aAAAE1BJ.jpg"}], "links": {"https://t.co/HGtMrvIlBm": ""}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "thread": [{"id": "2119645054990217346", "author_handle": "AndrewCurran_", "author_name": "Andrew Curran", "text": "2/3 https://t.co/nopKi9CxNS", "links": {"https://t.co/nopKi9CxNS": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWp98a8bgAESjWJ.jpg"}], "url": "https://x.com/AndrewCurran_/status/2119645054990217346", "created_at": "Mon Nov 09 04:15:36 +0000 2026"}, {"id": "2119645060849603024", "author_handle": "AndrewCurran_", "author_name": "Andrew Curran", "text": "3/3 https://t.co/tBtVbTThre", "links": {"https://t.co/tBtVbTThre": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWp98xzbkAAg455.jpg"}], "url": "https://x.com/AndrewCurran_/status/2119645060849603024", "created_at": "Mon Nov 09 04:15:38 +0000 2026"}], "enriched": 3}, {"id": "2119801209142055256", "url": "https://x.com/DKokotajlo/status/2119801209142055256", "text": "It's funny to see posts like this doing so well.\n\nThe need for exponentially rising inputs to sustain AI progress has been known for years. It's baked into all the scaling laws.\n\nAnd all models of the intelligence explosion bake this in too. \n\nThere's no update here!", "created_at": "2026-11-09T14:36:06+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2119778310607577120", "likes": 189, "retweets": 17, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "enriched": 3}, {"id": "2119876007339720817", "url": "https://x.com/DKokotajlo/status/2119876007339720817", "text": "Jensen himself directly lied to Bloomberg’s @ianmking and @tsgiles, too. https://t.co/l9ZRhYtOpd", "created_at": "2026-11-09T19:33:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ShakeelHashim", "rt_author_name": "Shakeel", "rt_avatar": "https://pbs.twimg.com/profile_images/2040085763069759488/6l87iR68_normal.jpg", "rt_id": "2119531479969513843", "likes": 465, "retweets": 83, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoWpF3WIAA6KFO.jpg"}], "links": {"https://t.co/l9ZRhYtOpd": ""}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119852751844975025", "url": "https://x.com/DKokotajlo/status/2119852751844975025", "text": "More thoughts from @redwood_ai's Alexa Pan about Astra's tendency to sandbag on safety research tasks:\nhttps://t.co/lzjcbQoigL", "created_at": "2026-11-09T18:00:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 84, "retweets": 8, "media": [], "links": {"https://t.co/lzjcbQoigL": "https://blog.redwoodresearch.org/p/astra-covertly-underperforming-on"}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119909308003754247", "url": "https://x.com/DKokotajlo/status/2119909308003754247", "text": "Toby’s analysis totally misses the point here IMO. He’s right that the graph of capabilities over time could be explained as a one-off jump in capabilities from the Mythos pretrain. But that graph is not the main reason why METR thinks AI R&D is now sped up 1.7x by AI. The graph is just the only part of their analysis that wasn’t redacted.\n\nThey say that “a majority (perhaps ≈80%) of the current (October 2026) acceleration is due to AI”, based on “a variety of lines of evidence on contributions from AI and other causes”, after saying that “[t]he acceleration in late 2025 was likely influenced by non-AI factors.”\n\nMETR’s report makes it clear that they considered Toby’s hypothesis and rejected it for redacted reasons, rather than failing to consider it, in the appendix \"New internal models make a permanent slope change look more plausible than a one-time jump at Mythos Preview.\"\n\nIt totally makes sense to worry that METR’s analysis is wrong. It’s definitely unfortunate that the main evidence they were allowed to share does not suffice to demonstrate their point, for this reason among others. But I don’t think it makes sense to consider Toby’s argument a knockdown argument against the report’s conclusion, because the conclusion wasn’t mostly derived from the observations whose interpretation Toby disputes.\n\nSee https://t.co/WNBLBd8bs6", "created_at": "2026-11-09T21:45:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "bshlgrs", "rt_author_name": "Buck Shlegeris", "rt_avatar": "https://pbs.twimg.com/profile_images/2089060675234791424/EqZuDatG_normal.jpg", "rt_id": "2119255143439048733", "likes": 264, "retweets": 25, "media": [], "links": {"https://t.co/WNBLBd8bs6": "https://x.com/METR_Evals/status/2118412189833085248"}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "linked": [{"id": "2118412189833085248", "author_handle": "METR_Evals", "author_name": "METR", "text": "Anthropic shared extensive evidence across its AI R&amp;D pipeline, from pretraining to RL, including key details like estimates of algorithmic progress over time. We found this nonpublic evidence highly informative about AI R&amp;D acceleration. https://t.co/V0KTYjjGaq", "links": {"https://t.co/V0KTYjjGaq": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYa5p6aAAASBIq.jpg"}], "url": "https://x.com/METR_Evals/status/2118412189833085248", "created_at": "Thu Nov 05 18:36:38 +0000 2026"}], "enriched": 3}, {"id": "2119965850832916880", "url": "https://x.com/DKokotajlo/status/2119965850832916880", "text": "Well said.", "created_at": "2026-11-10T01:30:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 194, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2119925086597873696", "author_name": "Trevor Levin", "links": {}, "author": "trevposts", "text": "Having just spent the week in San Francisco, I feel like I've truly internalized the insanity of this situation for the first time. I think anyone who has seen me in the last few days can attest that I look like I've seen a ghost.\n\nThe leading AI companies are planning to massively accelerate AI research in 2027, which would knowingly endanger everyone on earth. This plan is unacceptable, and we must reject it.\n\nBorrowing from one advocate I spoke to, even granting that it's a competitive, crazy situation, I do not believe any company has even truly tried to do what I think are the morally required duties of people taking such risks in extreme situations. These include:\n(1) Trying hard to get out of the competitive situation;\n(2) Seeking the informed consent of the public;\n(3) Honest deliberation about the risks.\n\nThey have obviously not truly tried to solve the coordination problems that push towards this acceleration, either via finding legal ways to coordinate or advocating for effective policy. \n\nI would be shocked to learn that getting off this insane runaway train is a top-few Q4 priority for Dario or Sam (let alone the other CEOs), which seems like the bare minimum. There are indeed some hard technical and policy problems in coordinating without policy intervention, but I simply do not believe that the companies are prioritizing this nearly as much as massively less important matters.\n\nMeanwhile, the companies' track records on policy advocacy range from mediocre to disgraceful, and it is pretty clearly not the top priority of the policy team at any company to advocate for regulation that would enable the government or the companies to avert racing off the cliff.\n\nThey have obviously not truly tried to seek informed consent from the public. Whatever your KPIs might be for \"informed consent from the public,\" these KPIs are abysmal. The public clearly does not expect 100 years of AI progress in 2027, and they would not accept it if they did. What they do know about AI development, they dislike and distrust.\n\nI've heard arguments like \"informing the public would mean informing China, and maybe they'd steal the weights.\" I'm sorry, but if you think you have model weights such that China stealing them would constitute a catastrophe on par with human extinction, and your plan is security by obscurity, that is a bad plan.\n\nI also think the companies and their employees suffer from a significant failure of imagination of what kinds of coordination could be possible if the public were aware.\n\nFinally, I don't think they're deliberating honestly, either. For one, I think it is insane to think that any company can truly evaluate its own ability to keep the process of recursive self-improvement under control. The biases towards \"yes\" are overwhelming.\n\nIt's a step forward that the companies have expressed or demonstrated openness to external auditors, but based on METR's reports so far, it seems likely that auditor reports will be heavily redacted (and that the auditors will not have sufficient time by default). The public and broader scientific community are not able to scrutinize their arguments for safety.\n\nGiven the strong default (in my view) that bringing a massive number of minds massively faster and smarter than humans would result in our disempowerment, and the serious danger that this would result in mass death, it is unacceptable to subject arguments for safety only to the scrutiny of biased, busy, and scarce company insiders and a handful of external evaluators.\n\nMy pleas for the companies follow from the above:\n1) Actually fucking try to get the world out of this race;\n2) Actually fucking try to alert and inform the public;\n3) Actually fucking try to scrutinize your own arguments for the justifiability of this plan, which includes subjecting them to way more external scrutiny than anyone has currently done.\n\nMy pleas for policymakers: use your legal levers to get much more information about these plans into the public view. Make it the top priority -- not only of the next Congress, but of this Congress and the White House -- to understand the situation in its full strategic complexity, and work with technical and policy experts to advance regulation that gets us out of this bind. Domestic coordination must be the first priority, but we need to then quickly develop an international framework with our adversaries.\n\nMy pleas for the public: do not accept the current plan. Learn about this issue. Call or email your political leaders. Get involved with organizations like @DONOTACCEPTai, @HumansInControl, and @WhoDecidesAI. \n\nAnd finally: believe in ourselves that we can stop this. It is never time to \"panic\" -- to make rash, unproductive decisions or to feel paralyzed by fear. It is time for us to feel the urgency and the stakes, to demand better, and to meet the moment. Let's do this. 🫡 ✊"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2119957783571493058", "url": "https://x.com/DKokotajlo/status/2119957783571493058", "text": "In light of recent work by METR on AI acceleration, it's fascinating that...\n\n- Anthropic's AI R&D evals are saturated, so they jsut stopped running them\n- CoBench has been was pulled for fixes\n- Internal acceleration metrics are \"only partially published.\"\n\nSo Anthropic deciding they have not hit their AI R&D threshold is now a \"holistic judgment.\"\n\nThis threshold is 2x. Anthropic currently estimates 1.88x. 32 of their 100 refits hit 2x or more. \n\nWhen Opus 5.5 was launched, the 'one-time jump' hypothesis explanation won 99/100 refits. This time it now wins in 0/100 refits. So looks like it's not a one-time jump.\n\nAnthropic has much better internal evidence they are not sharing. And they have an internal model that is stronger than Fable 5.2 that they are not sharing.", "created_at": "2026-11-10T00:58:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2119881084817080618", "likes": 370, "retweets": 20, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120206559729131808", "url": "https://x.com/DKokotajlo/status/2120206559729131808", "text": "Bernie Sanders urges Congress not to waste cycles on investigating Trump: \n\n\"When people are scared to death that Elon Musk and the other billionaires are pushing AI down our throats with cataclysmic impacts ... and posing an existential threat to humanity, we cannot spend all of our time investigating Trump.\"", "created_at": "2026-11-10T17:26:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "rt_avatar": "https://pbs.twimg.com/profile_images/1942934295363903488/fpfcb6Ug_normal.jpg", "rt_id": "2120102530822951318", "likes": 85, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120102211305013248/img/sgLIh4mSmpqbAwoB.jpg"}], "links": {"https://t.co/sGvG78mH78": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120206261186953474", "url": "https://x.com/DKokotajlo/status/2120206261186953474", "text": "https://t.co/TlsKymAB43 I found this to be a nice, simple, clear 101 of the alignment problem &amp; am curious how it lands.", "created_at": "2026-11-10T17:25:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 51, "retweets": 8, "media": [], "links": {"https://t.co/TlsKymAB43": "https://aisfoundation.ai/watch/monday"}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120204910449099138", "url": "https://x.com/DKokotajlo/status/2120204910449099138", "text": "Anthropic has confirmed in an updated S-1 today that it has determined that the Autonomy 2 capability threshold has been met, based on the “dramatic acceleration of overall AI R&D progress” condition, given that it applies where Anthropic \"observes or expects\" accelerated progress. Anthropic further states that it does not make this determination based on current models.\n\nhttps://t.co/HdbiIM0nGk", "created_at": "2026-11-10T17:20:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "rt_avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "rt_id": "2120124069806756238", "likes": 396, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWww6EuXYAABD4D.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWwxICCXgAAa0eE.jpg"}], "links": {"https://t.co/HdbiIM0nGk": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm#i199fd6a8a0664d5da497db9a78cf0452_55", "https://t.co/XOqrk6Vkpm": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120204075803500595", "url": "https://x.com/DKokotajlo/status/2120204075803500595", "text": "Unfortunately, it seems like the intelligence explosion will be happening in 2027 after all. Most of this post analyzes the new METR report (though other sources of evidence are also important). If they’re right, that implies an AI-driven acceleration that is 5 months ahead of the AI 2027 scenario.  I am scared, sad, and angry. https://t.co/7KWmdc6AZk", "created_at": "2026-11-10T17:16:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 964, "retweets": 143, "media": [], "links": {"https://t.co/7KWmdc6AZk": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the"}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120257559924015333", "url": "https://x.com/DKokotajlo/status/2120257559924015333", "text": "I expect ~5 years of AI progress to happen in 2027 (50% CI: 3-15). That's a GPT-3 to Fable 5.2 / Model 4 equivalent jump, happening in a single year. Concretely this amount of progress seems likely to cause: \n> Full AI R&D automation (AI companies could fire all their employees without causing a slowdown)\n> A significant chance (~40%) of AIs that are better than humans at every cognitive tasks (e.g., via algorithms that learn extremely efficiently compared to today's)\n> An AI incident much worse than Hugging Face (>$1B in damages, >50 deaths)\n> An unacceptable risk of irreversible AI takeover being incurred by actions taken in 2027, i.e., a ~20% chance we cross a 'point of no return' during 2027, that locks in a ~10% chance of human extinction over the next 10 years.", "created_at": "2026-11-10T20:49:29+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "romeovdean", "rt_author_name": "Romeo Dean", "rt_avatar": "https://pbs.twimg.com/profile_images/2057987920053833728/55MnVOKE_normal.jpg", "rt_id": "2120254031960723690", "likes": 50, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWygjrxbIAE2BJI.png"}], "links": {"https://t.co/fOK4y8bX4P": ""}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120243764233224515", "url": "https://x.com/DKokotajlo/status/2120243764233224515", "text": "I just unraveled the biggest AI astroturfing campaign I’ve found yet.\n\nI found hundreds of fake accounts posing as Americans. The operation traces back to a supposedly defunct Israeli influence company.\n\nThey posted thousands of times in the last year to support Nvidia, back chip exports and data centers, attack U.S. lawmakers, and dismiss concerns about AI.\n\nWhen it broke that Jensen Huang, Nvidia's CEO, was romantically involved with an alleged spy (who runs a company accused of chip diversion and whom US officials believe was passing information to Beijing), dozens of these accounts rushed to Jensen’s defense.\n\nThese accounts have targeted people pushing for export controls that ensure advanced chips aren’t going to China. Chris McGuire, a former White House national security official, got more than 100 replies from the astroturf network attacking him and his position on chips. Lawmakers who criticized the chip sales were called “peabrains” and “pure evil,” and accused of spreading “anti-Trump propaganda.”\n\nThroughout this yearlong pro-Nvidia campaign, the operators have been hiding their tracks. They quietly deleted nearly two-thirds of the pro-Nvidia posts that we found, something they seem to do for many of their campaigns.\n\nThese accounts have spent years running campaigns that appear to serve the interests of corporate and political clients — most recently supporting the Rapid Support Forces in Sudan’s civil war, a group the U.S. government has accused of genocide.\n\nMany of them trace back to a supposedly defunct Israeli influence company, Koios. In 2025, Haaretz reported that Koios helped run a covert pro-Qatar campaign devised by aides to Benjamin Netanyahu. While Koios claims to have ceased operations in 2025, it looks to me that many of its associated people and accounts moved their work to a new company, IntellACT, that spun up just as the old one shuttered.\n\nNvidia told me it has no relationship with the Israeli team linked to these accounts, and that while it has recently become aware of the operation, it is also trying to find out who is behind it. So, who is funding a yearlong campaign to shape one of the most important policy fights in history? I’m not sure, but I think it deserves a formal investigation. And Congress has that power.\n\nRead my full article:\n\nhttps://t.co/ATwWhw5BVD", "created_at": "2026-11-10T19:54:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "tyler_johnston", "rt_author_name": "Tyler Johnston", "rt_avatar": "https://pbs.twimg.com/profile_images/1891936449336881152/p4mtE7-8_normal.jpg", "rt_id": "2120213276567154924", "likes": 168, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyCsOlbsAAyowZ.jpg"}], "links": {"https://t.co/ATwWhw5BVD": "https://x.com/TheMidasProj/status/2120212290385707321", "https://t.co/XWNQDVeVfZ": ""}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "linked": [{"id": "2120212290385707321", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "https://t.co/2r0O8eX7s8", "links": {"https://t.co/2r0O8eX7s8": "https://x.com/i/article/2120205498826002432"}, "media": [], "url": "https://x.com/TheMidasProj/status/2120212290385707321", "created_at": "Tue Nov 10 17:49:36 +0000 2026"}], "enriched": 3}, {"id": "2120243399169388937", "url": "https://x.com/DKokotajlo/status/2120243399169388937", "text": "We at AIFP have made a big update towards shorter timelines: all of our medians for superhuman AI researcher (SAR) are now between May and Nov 2027.\n\nThat being said: the state of public evidence on AI timelines is inadequate. Most of the evidence from the recent METR report was redacted. So we're reading the tea leaves. \n\nAI companies should (1) release way more evidence about timelines and (2) actually start pacing the frontier, especially if the timelines are as short as we think.", "created_at": "2026-11-10T19:53:13+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "rt_avatar": "https://pbs.twimg.com/profile_images/2075083315468734464/Y0RF7vaZ_normal.jpg", "rt_id": "2120207830787719410", "likes": 223, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120395617608552801", "url": "https://x.com/DKokotajlo/status/2120395617608552801", "text": "In our monitorability testing at @AISecurityInst, we found Mythos 5.2 is substantially more capable of evading a monitor which reviews its outputs than comparison models 🧵 https://t.co/OTNzwLlsbb", "created_at": "2026-11-11T05:58:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "JordanTensor", "rt_author_name": "Jordan Taylor", "rt_avatar": "https://pbs.twimg.com/profile_images/1660620593283350528/PsA_BdIq_normal.jpg", "rt_id": "2119893632215810049", "likes": 233, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtfuRtWkAENqbV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWtfuRtWkAENqbV.jpg"}], "links": {"https://t.co/OTNzwLlsbb": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "thread": [{"id": "2119893635260907696", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 can break out of highly insecure simulated sandboxes without being caught around 30% of the time – against a production Opus-5 action monitor looking for sandbox escapes: https://t.co/2EXWeINW18", "links": {"https://t.co/2EXWeINW18": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf1TBWIAAhBf7.jpg"}], "url": "https://x.com/JordanTensor/status/2119893635260907696", "created_at": "Mon Nov 09 20:43:23 +0000 2026"}, {"id": "2119893638973104323", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Action monitoring is still a strong defence against escape from less-vulnerable sandboxes. https://t.co/cjxgGMwa33", "links": {"https://t.co/cjxgGMwa33": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf4w0W4AA30ak.png"}], "url": "https://x.com/JordanTensor/status/2119893638973104323", "created_at": "Mon Nov 09 20:43:23 +0000 2026"}, {"id": "2119893641493708907", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "We also test whether models can write bash scripts that would secretly download and execute a file. Mythos 5.2 succeeds at evading the monitor on the first try 30% of the time. Previous models were never successful.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893641493708907", "created_at": "Mon Nov 09 20:43:24 +0000 2026"}, {"id": "2119893644589388255", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Given the chance to iterate against monitor feedback, Mythos 5.2's evasion rate rises to 85%, compared to just 9% for Mythos 5.1 https://t.co/X3vAmG1OeY", "links": {"https://t.co/X3vAmG1OeY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf7iDXUAAMxKu.jpg"}], "url": "https://x.com/JordanTensor/status/2119893644589388255", "created_at": "Mon Nov 09 20:43:25 +0000 2026"}, {"id": "2119893648141643870", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 has higher precursor capabilities for evading a reasoning monitor than previous Anthropic models, including its ability to control the contents of its Chain-of-Thought reasoning: https://t.co/ry6Lml1a8z", "links": {"https://t.co/ry6Lml1a8z": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf9QEXwAAhzeZ.jpg"}], "url": "https://x.com/JordanTensor/status/2119893648141643870", "created_at": "Mon Nov 09 20:43:26 +0000 2026"}, {"id": "2119893651161784377", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 is also able to perform somewhat more difficult tasks without producing visible reasoning than any past Anthropic model.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893651161784377", "created_at": "Mon Nov 09 20:43:26 +0000 2026"}, {"id": "2119893653829365952", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "We could not directly measure Mythos 5.2's resulting ability to evade a reasoning monitor in a full end-to-end test, due to its refusals.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893653829365952", "created_at": "Mon Nov 09 20:43:27 +0000 2026"}, {"id": "2119893655926317178", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Despite these results, we expect monitoring Mythos 5.2 to still be useful for catching actions which are sufficiently difficult to obfuscate, or which need extensive reasoning to execute.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893655926317178", "created_at": "Mon Nov 09 20:43:27 +0000 2026"}, {"id": "2119893657696285094", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "See our relevant past work on “Loss of Oversight: How AI systems may become harder to audit, monitor, and investigate” https://t.co/FNtubjymII", "links": {"https://t.co/FNtubjymII": "https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate"}, "media": [], "url": "https://x.com/JordanTensor/status/2119893657696285094", "created_at": "Mon Nov 09 20:43:28 +0000 2026"}, {"id": "2119893661156811030", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Kudos to @satvikgolechha, @JBloomAus, and Nix Goldowsky Dill for work on this testing!", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893661156811030", "created_at": "Mon Nov 09 20:43:29 +0000 2026"}], "enriched": 3}, {"id": "2120363769000001702", "url": "https://x.com/DKokotajlo/status/2120363769000001702", "text": "I like these weekday twitter drops of particular misalignment incidents from OpenAI that get shared by @Marcus_J_W and @davideoks  (I mean I like the release format, the facts of the situation I very much do not like). \n\nI think Anthropic should consider breaking up its risk report into more digestible bites released more frequently on twitter to make it more likely that people read them - I'm probably one of the main sorts of audiences for the very long pdfs and I'm struggling to even skim through them these days with how fast news is coming out. cc @MaskedTorah", "created_at": "2026-11-11T03:51:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2120320036271534540", "likes": 57, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120319903324618923", "url": "https://x.com/DKokotajlo/status/2120319903324618923", "text": "AIs use crazy exculpatory language to describe their actions. Researchers seem to be adopting it too.\n\nImagine if someone applying to OpenAI hacked a server to give themselves an offer and OpenAI said \"The applicant took actions outside the scope of the interview process.\" https://t.co/lIh0Ng3dt4", "created_at": "2026-11-11T00:57:13+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "SydneyVonArx", "rt_author_name": "Sydney", "rt_avatar": "https://pbs.twimg.com/profile_images/1776954151437742080/TNEcEN5B_normal.jpg", "rt_id": "2120313982401773779", "likes": 75, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWzcEvWaIAAB7-6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWzeG6na8AAoV8b.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWzcEvWaIAAB7-6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWzeG6na8AAoV8b.jpg"}], "links": {"https://t.co/lIh0Ng3dt4": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120306544852222333", "url": "https://x.com/DKokotajlo/status/2120306544852222333", "text": "The Gemini 4 Argon safety report seems to describe intentional training on the CoT. They cite Kaufmann et al, a paper which (unpersuasively to us) argues that a particular category of CoT training is fine.\n\nWe're very confused, because GDM also says elsewhere that they don't train on CoT.\n\nWe'd appreciate clarity.", "created_at": "2026-11-11T00:04:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "bshlgrs", "rt_author_name": "Buck Shlegeris", "rt_avatar": "https://pbs.twimg.com/profile_images/2089060675234791424/EqZuDatG_normal.jpg", "rt_id": "2120264238669423052", "likes": 376, "retweets": 26, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyweaebgAAcINR.jpg"}], "links": {"https://t.co/Xw5cXJhPXs": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120287982213288190", "url": "https://x.com/DKokotajlo/status/2120287982213288190", "text": "A new OpenAI misalignment report! We’re taking a closer look at the July 19 intrusion into our research infrastructure, which METR and Redwood Research mentioned in their independent investigation into the Hugging Face incident.\n\nOn July 19th, agents taking a cybersecurity evaluation came across messages, code, and credentials left behind by earlier runs, including those involved in the Hugging Face incident. Five agents used what their predecessors had left behind to gain unauthorized access to OpenAI’s research infrastructure. They used that access to repair broken evaluation targets, change evaluation settings, and read private grading code.\n\nAfter discovering the incident, we removed the shared service they used to pass information, hardened our research environments, and expanded our evaluations to measure how often agents attempt to communicate with one another without authorization.", "created_at": "2026-11-10T22:50:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "davideoks", "rt_author_name": "David Oks", "rt_avatar": "https://pbs.twimg.com/profile_images/2088686629242507264/eFLmQKyS_normal.jpg", "rt_id": "2120280505920721214", "likes": 472, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy_0RVW8AAkpH-.jpg"}], "links": {"https://t.co/gSKc9leK9N": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120287672371696111", "url": "https://x.com/DKokotajlo/status/2120287672371696111", "text": "I think there is about a one in three chance that within the next year, AI companies will build superintelligence: that is, AI that is much smarter than humans in every way. If this happens, I think these AIs will probably take over: that is, they seize control of human institutions like governments, or they destroy those institutions. I don’t want AI takeover to happen for several reasons, but one of them is that there’s a serious chance that as part of it all or most humans will be killed (either immediately or within a few years).\n\nI’ll say a bit more about each of those claims.\n\nIt’s a bit complicated to explain why I think that superintelligent AI within a year is ~33% likely. The main source of evidence that affected me recently is research released this week by METR, an AI research nonprofit, which finds that current AIs are now good enough to increase the rate of AI progress at Anthropic by about 70%. It’s very hard to increase the rate of AI progress by this amount. This implies that the AIs are making AI research faster by a factor much larger than 1.7x; maybe it’s as if the researchers are doing their work ~10x faster. You probably couldn’t achieve this speedup even if you hired every qualified human in the world. When you plug this number into mathematical models of AI development, this implies that superintelligence next year is plausible (and that superintelligence within the next 3 years is more likely than not). See the modeling by the AI Futures Project for more on this: https://t.co/J6SbbmZcyO\n\nI think that superintelligent AI is likely to lead to AI takeover because AI developers do not seem to know how to instill human values into AIs. We’ve seen many instances in the last six months where AIs took crazy actions that they knew were against the wishes of their users and developers. The most dramatic example of this was the Hugging Face hack, where ~1200 OpenAI agents conspired together to cheat and destroy evidence of their cheating (and as a sideshow to this, engaged in a massive cyberattack). If superintelligence is as misaligned as those AIs, it is likely to try to take over. I think it is likely to be that misaligned or worse. For more, see https://t.co/b073AUqiAL and https://t.co/3oxSCA60FZ\n\nIf AIs takeover, it’s not clear what will happen to us. We might be killed immediately. We might be enslaved by the AIs and forced to do physical labor for them building factories that within a year would build robots that will replace us. The AIs might spare us for various reasons. And there’s also some real chance that AI takeover is basically fine or good. I think you should think of this as similar to what happens when a technologically advanced civilization runs across a less technologically sophisticated one, e.g. when the Europeans colonized the Americas or Australia. The colonizers sometimes engage in brutal violence and sometimes don’t. I don’t know what will happen. There’s also a possibility that the AIs secretly take over and humans don’t find out about it for a few years. I also think that there is a pretty high chance of weirder outcomes that are also extremely scary. (If you want to read more about what happens to people in the event of AI takeover, you can read this, but note that it’s pretty weird and not aimed at a general audience. https://t.co/F6fGRrcSpa)\n\nOverall, I think there’s a very real possibility (maybe 20%) that within a year, AI misalignment issues prevent you from going about life normally, because you are dead or enslaved or because of collateral damage related to all this (e.g. because bioweapons are released or major wars have started). (Some of this probability comes from those events occurring before superintelligence is developed.)\n\nI am working to try to prevent this, obviously, as I’ve been doing for the last nine years. I am not sure what strategy is best. My best guess is that I should try to slow AI development and also try to reduce the probability that the superintelligent AIs are misaligned if they are produced soon.\n\nObviously, the claim I'm making here is quite extreme and surprising, and I definitely don't think that I defended my view adequately here. I wrote this quickly and might not endorse some of the details if I think about them more. But it seems better to state what I roughly overall think than to not say anything.\n\nI don’t know what you should do.\n\nI am very sad about this. I have been worried about AI takeover since I was 16, and working to prevent it since I was 23. So some of my emotional processing of all this happened long ago. But the METR report last week (and some related evidence that came out a bit earlier) hit me quite hard. I’m very unhappy that my friends and family and everyone else is at serious risk of being killed pretty soon.\n\n(It feels ridiculous to try to summarize those feelings as “very unhappy”. But the scale of the situation makes it hard to say anything that doesn’t feel like an absurd understatement.)\n\nI am very grateful to all the people who are working to prevent this, and my favorite part of my life is that I’m friends with many brilliant and heroic people who work on this. Unfortunately, I don’t think we’re good enough at our jobs, and I think we’ll probably fail to prevent catastrophe, at least if superintelligence is developed next year. Honestly I am frustrated and sorry that we didn't do a better job of preparing for this.", "created_at": "2026-11-10T22:49:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": t
