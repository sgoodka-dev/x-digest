ttps://x.com/SillyPutty78/status/2120222542107729963", "created_at": "Tue Nov 10 18:30:20 +0000 2026"}, "enriched": 3}, {"id": "2120299232792064084", "url": "https://x.com/sethlazar/status/2120299232792064084", "text": "Yep, Claude refused to edit a PDF as I asked because it thought it would be furthering a fraud.\n\nI'm an attorney who needs to fix a scrivener's error with both parties' consent.\n\nIt doesn't know that, of course.  But I'm not used to my tools refusing to function based on their judgment.\n\nAnd there was no ability or opportunity to prove my purity -- it just stopped functioning and I couldn't accomplish my task, Fin.", "created_at": "2026-11-10T23:35:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "PanielloPaolo", "rt_author_name": "Oil & Esquire (PaoloPaniello)", "rt_avatar": "https://pbs.twimg.com/profile_images/2086224646605508608/6eqQ2-b5_normal.jpg", "rt_id": "2120230118060937250", "likes": 2, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120297220167905284", "url": "https://x.com/sethlazar/status/2120297220167905284", "text": "We're hiring policy researchers at Thinking Machines.\n\nQuick 🧵 on why I think this role is something folks in AI policy should consider applying to:", "created_at": "2026-11-10T23:27:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "luke_drago_", "rt_author_name": "Luke Drago", "rt_avatar": "https://pbs.twimg.com/profile_images/1986773666378465280/yZOQfEDv_normal.jpg", "rt_id": "2120266764907114756", "likes": 555, "retweets": 57, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "thread": [{"id": "2120266766266016237", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "We believe the future worth building is human, so we focus on AI that extends human will and judgment.\n\nWe’ve released open models that let you own your intelligence, created new ways to collaborate with AI so you stay in the loop, and provide tools like Tinker for you to tailor AI to your needs.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266766266016237", "created_at": "Tue Nov 10 21:26:04 +0000 2026"}, {"id": "2120266767574642950", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "We want a future where many people are in control of AI. How do we get there, and what role will policy play?\n\nIn the short term, we want to know how policy can support safe open weights. In the long term, we want to know how policy could support a decentralized AI ecosystem.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266767574642950", "created_at": "Tue Nov 10 21:26:04 +0000 2026"}, {"id": "2120266769063670070", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "These are fundamentally research questions; there are no off-the-shelf plans or answers. We need to design policy responses that are technically feasible today and can scale with the rate of AI’s improvement.\n\nWe want to help chart this path with the policy research community.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266769063670070", "created_at": "Tue Nov 10 21:26:05 +0000 2026"}, {"id": "2120266770301042862", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "So what will you do? A few things:\n- Help develop our nascent policy research agenda.\n- Find the questions we are best suited to help answer.\n- Conduct research that informs our view.\n- Work with the research community and cultivate an ecosystem around these questions.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266770301042862", "created_at": "Tue Nov 10 21:26:05 +0000 2026"}, {"id": "2120266771601232132", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "We're looking for folks who can think across domains, come up with new answers, and turn them into actionable, technically feasible policy proposals. If that's you, learn more and apply here: \n\nhttps://t.co/kK1uc5Aqhw", "links": {"https://t.co/kK1uc5Aqhw": "https://jobs.ashbyhq.com/ThinkingMachines/2628909c-b655-4475-b0f5-fbadf7e9992f"}, "media": [], "url": "https://x.com/luke_drago_/status/2120266771601232132", "created_at": "Tue Nov 10 21:26:05 +0000 2026"}], "enriched": 3}, {"id": "2120615571213725988", "url": "https://x.com/sethlazar/status/2120615571213725988", "text": "@fabianstelzer I am fine with this when it comes to claude directly refusing to help with scihub; that's different from nerfing software that I ask it to write for me in this way, where it's just anticipating that I might do something naughty and trying to prevent me from doing so.", "created_at": "2026-11-11T20:32:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "fabianstelzer", "reply_to_id": "2120422112259125642", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120422112259125642", "author_handle": "fabianstelzer", "author_name": "fabian", "text": "Hmm. IMO this is pretty much aligned behavior - you can easily imagine the inverse post where someone complains about Claude not putting in legal guardrails and subsequently getting sued \n\nThe underlying concern is perfectly valid, yet really only countered by enabling a non monopolistic ecosystem with many alternatives \n\nI do think it is a company’s right to impose its peculiar subset of values (which includes banning otherwise legal activities, even in quirky ways) onto its customers, who then are ofc free to migrate to alternatives (which have to exist!)", "links": {}, "media": [], "url": "https://x.com/fabianstelzer/status/2120422112259125642", "created_at": "Wed Nov 11 07:43:21 +0000 2026"}, "enriched": 3}, {"id": "2120615081079906421", "url": "https://x.com/sethlazar/status/2120615081079906421", "text": "@birchlse @larsweisbrod There are a few papers in this vein! Most recently https://t.co/8AKrfdW8o9. There's also my book, now out open access, which is not republican but which has some of what you're probably looking for @larsweisbrod :https://t.co/MPVQcEUlby", "created_at": "2026-11-11T20:30:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "birchlse", "reply_to_id": "2120484038108450888", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/8AKrfdW8o9": "https://academic.oup.com/pq/advance-article-abstract/doi/10.1093/pq/pqag029/8692282?redirectedFrom=fulltext&login=false", "https://t.co/MPVQcEUlby": "https://academic.oup.com/book/63611"}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120484038108450888", "author_handle": "birchlse", "author_name": "Jonathan Birch", "text": "@larsweisbrod Absolutely. @sethlazar are you on this already?", "links": {}, "media": [], "url": "https://x.com/birchlse/status/2120484038108450888", "created_at": "Wed Nov 11 11:49:26 +0000 2026"}, "enriched": 3}, {"id": "2120978156341342351", "url": "https://x.com/sethlazar/status/2120978156341342351", "text": "@AnkaReuel @round 🫡", "created_at": "2026-11-12T20:32:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AnkaReuel", "reply_to_id": "2120977113897672850", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120977113897672850", "author_handle": "AnkaReuel", "author_name": "Anka Reuel | @ankareuel.bsky.social", "text": "@round @sethlazar runs one of these!", "links": {}, "media": [], "url": "https://x.com/AnkaReuel/status/2120977113897672850", "created_at": "Thu Nov 12 20:28:44 +0000 2026"}, "enriched": 3}, {"id": "2120732163108990993", "url": "https://x.com/sethlazar/status/2120732163108990993", "text": "@tautologer person of interest", "created_at": "2026-11-12T04:15:23+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "tautologer", "reply_to_id": "2120725400183816665", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120725400183816665", "author_handle": "tautologer", "author_name": "tautologer", "text": "i need a TV show please recommend me a TV show. if you recommend one i've seen i'll reply with my rating out of 10", "links": {}, "media": [], "url": "https://x.com/tautologer/status/2120725400183816665", "created_at": "Thu Nov 12 03:48:31 +0000 2026"}, "enriched": 3}, {"id": "2121234600768745873", "url": "https://x.com/sethlazar/status/2121234600768745873", "text": "This seems very likely right to me. The broad dangers of algorithmic monoculture have been recognised for a while but this particular one less so. It is both about blind spots and hidden loyalties, and just a lack of epistemic/normative/perspectival diversity. It feels to me like there should be a moonshot to create (a) more inherently diverse and (b) less internally skewed models for the purposes of both monitoring and research. Open weights models are essential for both.", "created_at": "2026-11-13T13:31:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120955468034289821", "author_name": "David", "links": {"https://t.co/FPDtp5iUpF": "https://www.lesswrong.com/posts/EuhQ5fnGR4tAQTTgd/we-need-more-decorrelated-evidence", "https://t.co/bHUCZZm0kZ": "https://davidafrica.substack.com/p/we-need-more-decorrelated-evidence?r=54hrnw&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true", "https://t.co/lg4pvFJ6fG": ""}, "author": "DavidDAfrica", "text": "Quick new post: we need more decorrelated evidence. I develop a simple argument that our recent failures to catch misalignment can be framed as systematic errors shared across our evidence, or a lack of decorrelated evidence. This suggests that we should aim at finding ways to aggregate evidence across evals/experiments that handles this correlation, as well as make research bets which promise to find new sources of decorrelated evidence of misalignment.\n\nLW: https://t.co/FPDtp5iUpF\nSubstack: https://t.co/bHUCZZm0kZ"}, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121222386565403055", "url": "https://x.com/sethlazar/status/2121222386565403055", "text": "What are idea basins and how do agents explore them?\n\nA few weeks ago, researchers from different labs independently discovered what we now call ‘Idea-basins’: As an autonomous agent iterates to solve a problem, it gets stuck into the methods it has tried before and its trajectories remain in localized regions of the solution space. Techniques like ‘Fork-and-Flush’ and ‘Scaling Discovery requires forgetting’ reduce this idea fixation by periodically deleting the session context.\n\nIn this post we study how frontier models explore different idea basins for AutoResearchExam. E.g. for a problem on accelerating transformer decoder graphs on CPUs models can try Numpy+Asm Kernels, Native BLAS, JIT compilers and other idea basins. We find that some models switch ideas more than others while others get to the best idea faster and explore deeper.\n\nWe find that most runs stick with one or two ideas, and models that submit more spend the extra submissions refining and overfit more. \nWe see that models explore most in the first six hours, after which visits to new idea basins drop sharply. This suggests models start refining early leaving potential gains on the table: 58% of runs never reach the basin where the best solution to their task was found. Finally, bold exploration pays off: exploring a new idea gains about nine times as much as a refining step on average.\n\nRead more in our blog:\nhttps://t.co/gVvHEgJfed", "created_at": "2026-11-13T12:43:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "AlexGDimakis", "rt_author_name": "Alex Dimakis", "rt_avatar": "https://pbs.twimg.com/profile_images/542926798338543617/KwlwoJRr_normal.jpeg", "rt_id": "2121022776794644848", "likes": 607, "retweets": 91, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9iitkbAAAfV0-.jpg"}], "links": {"https://t.co/gVvHEgJfed": "https://bespokelabs.ai/blog/how-models-explore-ideas", "https://t.co/XMyxDvZL9S": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121221404536504422", "url": "https://x.com/sethlazar/status/2121221404536504422", "text": "⚡ Today we release Schelling Atlas. Two independent LLM agents have to find each other on the web. Where do they meet and how fast can they find each other?\n\nMain findings:\n- The main meeting point across *different* model families is https://t.co/BkHyIunq0F. Did you even know about this website?\n- Agents find each other and coordinate on the web in minutes. So Schelling coordination is already trivial for frontier LLMs!\n- \"Exotic\" meeting places include maps, web shops and open text canvases. Agents are very creative in this.\n- Agents sometimes visit dead domains that an attacker could register (!). This can be used for stealing sensitive information from agents, as well as monitoring rogue agents.\n\nSchelling-style coordination is key for forming agent swarms. And, most importantly, achieving such coordination is trivial for agents that use the same LLM (which is often the case in practice!), because two identical LLMs have identical output distributions. Thus if you ask them too coordinate with each other or if they *decide* to suddenly coordinate, they will easily find a way to establish a swarm, since they have perfectly correlated \"minds\" (with the t=0 sampling, all output tokens will even be identical, modulo GPU randomness). \n\nThe ease of Schelling coordination is particularly concerning given the recent interest around multi-agent RL that can make agents favor each other more than humans overseeing them.\n\nMany more interesting findings are on our website: https://t.co/NzkMJJt2p2", "created_at": "2026-11-13T12:39:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "maksym_andr", "rt_author_name": "Maksym Andriushchenko", "rt_avatar": "https://pbs.twimg.com/profile_images/2030008541520539648/jYw77mbo_normal.jpg", "rt_id": "2120974977251832231", "likes": 204, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8wrgOWgAA4Sr0.jpg"}], "links": {"https://t.co/BkHyIunq0F": "http://ntfy.sh", "https://t.co/NzkMJJt2p2": "https://schelling-atlas.com/", "https://t.co/fvB5abg5nR": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121220878352757082", "url": "https://x.com/sethlazar/status/2121220878352757082", "text": "Today we’re launching the AI Trials Observatory: a living systematic review of randomized trials on how AI affects people.\n\nSo far we’ve surfaced 93 trials on two outcomes: mental health and belief accuracy. More trials and outcomes coming soon!\n\nhttps://t.co/bzvT0FyKSD\n\n🧵👇 https://t.co/VwLTzQOSM7", "created_at": "2026-11-13T12:37:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "Ben_Tappin", "rt_author_name": "Ben Tappin", "rt_avatar": "https://pbs.twimg.com/profile_images/968517520692072450/rnXh351M_normal.jpg", "rt_id": "2120207676454154478", "likes": 141, "retweets": 49, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx6JY8XgAAkN5x.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWx6JY8XgAAkN5x.jpg"}], "links": {"https://t.co/bzvT0FyKSD": "https://aitrialsobservatory.org", "https://t.co/VwLTzQOSM7": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "thread": [{"id": "2120207680631341341", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "AI is changing constantly and touches many outcomes: mental health, belief accuracy, student learning, workplace productivity, medical care, political behavior, and more.\n\nThe Observatory continuously tracks and analyzes the trial evidence for such outcomes, all in one place. https://t.co/yj8rmcdYCZ", "links": {"https://t.co/yj8rmcdYCZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx62VRWcAAKjtm.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207680631341341", "created_at": "Tue Nov 10 17:31:17 +0000 2026"}, {"id": "2120207685836833076", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "As well as high-level summaries, the dashboard shows detail about individual trials, including:\n\n• The underlying AI model tested\n• How the outcome was measured\n• The duration and type of AI exposure\n• Flags for preprints, COIs, AI text and more\n• Downloadable data https://t.co/Suwb86oraW", "links": {"https://t.co/Suwb86oraW": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7NXvXcAEz3DD.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207685836833076", "created_at": "Tue Nov 10 17:31:18 +0000 2026"}, {"id": "2120207690223800708", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The credibility of the Observatory rests on its scientific rigor and trustworthiness.\n\nEach update to the evidence record comes with a permanently-archived report describing its methods. The dashboard data are free to download and we are transparent on funding. https://t.co/Qo6E2c5IiV", "links": {"https://t.co/Qo6E2c5IiV": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7ZQMWwAACne3.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207690223800708", "created_at": "Tue Nov 10 17:31:19 +0000 2026"}, {"id": "2120207693608624250", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The Observatory currently tracks two outcomes: how AI affects people’s mental health and the accuracy of their beliefs. More outcomes are coming soon.\n\nThe evidence base is growing rapidly. To stay informed, you can sign up for free at https://t.co/gRcCcXP9Lv https://t.co/BDEEwHrD3N", "links": {"https://t.co/gRcCcXP9Lv": "https://aitrialsobservatory.org/latest-updates/", "https://t.co/BDEEwHrD3N": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7i1YXAAAOnmq.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207693608624250", "created_at": "Tue Nov 10 17:31:20 +0000 2026"}, {"id": "2120207697706631193", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Mental health: what have we learned so far?\n\n• The evidence lags the AI frontier by 7+ months\n• AI built for therapy shows a benefit versus controls\n• Versus alternatives (e.g., a human chat), benefit is more uncertain\n• Evidence is thinner on general-purpose/companion AI https://t.co/IFooDGl7gY", "links": {"https://t.co/IFooDGl7gY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx72m_W4AA8qU1.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207697706631193", "created_at": "Tue Nov 10 17:31:21 +0000 2026"}, {"id": "2120207701481312588", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Belief accuracy: what have we learned so far?\n\n• The evidence lags the AI frontier by 5+ months\n• AI built for accuracy shows a benefit versus controls\n• Versus alternatives (e.g., a fact sheet), benefit remains in some cases\n• Evidence is thinner on general/companion AI https://t.co/gRG5WZZV62", "links": {"https://t.co/gRG5WZZV62": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7_qEX0AArDOf.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207701481312588", "created_at": "Tue Nov 10 17:31:22 +0000 2026"}, {"id": "2120207704887013813", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Some limitations:\n\n1. Randomized trials only. Despite their strengths, trials have several weaknesses. See below (from https://t.co/SgRxX56PVN).\n\n2. Our review procedure. It’s not perfect but we take steps to mitigate risks (see the release reports at https://t.co/C4SD1wKfzm). https://t.co/DSScQK4Vj8", "links": {"https://t.co/SgRxX56PVN": "https://aitrialsobservatory.org/about/", "https://t.co/C4SD1wKfzm": "https://aitrialsobservatory.org/methodology/", "https://t.co/DSScQK4Vj8": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx8gLsXYAAl8OZ.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207704887013813", "created_at": "Tue Nov 10 17:31:23 +0000 2026"}, {"id": "2120207707894399087", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The Observatory is a work in progress. We (@KobiHackenburg @lukebeehewitt) welcome kind words, suggestions and criticism.\n\nFinally: thanks to all the scientists running trials on these topics, especially those who report their data and methods in detail!\n\nhttps://t.co/bzvT0Fyd35", "links": {"https://t.co/bzvT0Fyd35": "https://aitrialsobservatory.org"}, "media": [], "url": "https://x.com/Ben_Tappin/status/2120207707894399087", "created_at": "Tue Nov 10 17:31:23 +0000 2026"}], "enriched": 3}, {"id": "2121102413134459317", "url": "https://x.com/sethlazar/status/2121102413134459317", "text": "Rapid AI progress has many people imagining a world where general-purpose AI models autonomously control military drones at scale. But there’s little analysis on what this would look like in practice, and how soon it might be feasible.\n\nMy latest paper at @GovAIOrg  asks what it would take to make this vision a reality, and what the path there means for AI policy.\n\nRead it here: https://t.co/eiTWhtRHRQ\n\nThe AI-enabled drones widely fielded today use narrow AI, not general-purpose models like LLMs. AI is typically only used to handle limited portions of a flight when the link to a pilot is broken, and these models are brittle in unpredictable conditions on real-world battlefields. Because of this, today’s drones still require significant pilot involvement to be most effective.\n\nGeneral-purpose AI models might make it possible to field autonomous systems that can receive plain language commands and make complex decisions in unpredictable environments without human control. Many people see frontier LLMs as a path toward this end - and rapid progress in robotics capabilities by frontier models like GPT-6 Astra and most recently Claude Fable 5.2 supports this case.\n\nBut two things currently stand in the way:\n\n- The biggest and most powerful models are still not capable enough even in controlled environments without compute and latency constraints\n- Military drones will have to operate “on the edge” in contested environments without consistent cloud compute access - which makes these constraints even more severe\n\nIf and when general-purpose AI plays a major role in drone autonomy, it’ll likely be through models that are far smaller than today’s frontier, and those that militaries can rapidly modify. And, notably - when it comes to these types of small open-weight models, China currently dominates.\n\nThis has a variety of implications for the US military, frontier AI developers, and US policymakers.\n\nThread below with my key takeaways and recommendations.\n\n1/", "created_at": "2026-11-13T04:46:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2120902215254655195", "likes": 62, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7mL5IXEAAr0QB.png"}], "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments", "https://t.co/4jNTAfTZJE": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "thread": [{"id": "2120902217980858487", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 1: There are two broad approaches militaries can take to drone autonomy.\n\nAutonomy is attractive to militaries because it would allow them to field systems at an otherwise impossible scale, and to maintain combat power in environments that are contested in ways that make it difficult for human operators to have continuous control of unmanned systems.\n\nThey could achieve autonomy through:\n\n1. AI models running onboard the drones themselves\n2. AI models running from a command and control node, orchestrating drones with offboard compute\n\nMany tradeoffs exist between these options, which I've broken down in the below two tables. An orchestrator allows access to more compute, and bigger, more capable models. But it makes drones dependent on unreliable communications links that can be disrupted by adversaries in a variety of ways.\n\nRunning AI onboard drones, meanwhile, eliminates many of these vulnerabilities, but limits the size and capabilities of the model that can be fielded. And it might give militaries less ability to intervene in the actions of those drones. \n\n2/", "links": {"https://t.co/ZSeKwRQ9pH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7ms_xX0AAp3Mx.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW7nELmWoAAVHvj.png"}], "url": "https://x.com/JakeASteckler/status/2120902217980858487", "created_at": "Thu Nov 12 15:31:07 +0000 2026"}, {"id": "2120902220753289480", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 2: Today’s LLMs aren't yet good enough for most drone tasks, and they're far too slow.\n\nFor autonomous attack drones to perform reliably on the battlefield, they’d have to do a variety of things that require a combination of low- and high-level reasoning. They’d have to avoid obstacles, track targets, verify that those targets meet mission criteria, and do a variety of planning tasks like changing a mission when unexpected conditions arise.\n\nFrontier LLMs can't yet reliably accomplish these tasks, and even with ample compute from data centers, they're are much too slow for anything except the most time permissive tasks, such as planning, as you can see in the chart below.\n\nMuch smaller LLMs, when run with less-powerful onboard compute, are still too slow. Many tasks like flight control and obstacle avoidance would likely be passed to lower-level controllers using more traditional robotics policies, but if general-purpose AI models are involved, they’ll likely be a rate limiter regardless.\n\nVision-language-action (VLA) models offer another possible approach beyond LLMs, and they can currently run much faster than LLMs. But these models have also not yet shown the requisite capabilities (especially in real-world conditions), and they are still not quite fast enough for the most time constrained tasks.\n\n3/", "links": {"https://t.co/to7F7cCzAB": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7sIxHWQAAkqKD.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902220753289480", "created_at": "Thu Nov 12 15:31:08 +0000 2026"}, {"id": "2120902223613857886", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 3: The biggest and best models are far too big to be run on the edge, either with onboard compute or from a small command and control node.\n\nFrontier LLMs have memory requirements* that could only be met with multiple GPU servers. Supporting them would be resource-intensive for military units to move and operate, and they'd likely be easy for enemies to geolocate – and therefore not ideal for military units operating near or on the frontlines.\n\nSmaller models can fit on a variety of edge chips that various sized platforms could run (from laptops to large, medium, and small drones, depending on model size). These models would likely be less capable, however.\n\nVLAs are much smaller, which makes them promising candidates for onboard use. But again, they have not yet proven reliable and robust enough for real missions.\n\nSee the chart below for a breakdown in memory requirements and where models could fit. \n\n*Note the sizes for closed models are based on unconfirmed estimates of their parameter counts, since these numbers are not made public. This analysis is just meant to show a general range of how big these models might be, not to serve as precise estimates of how much memory they demand. \n\n4/", "links": {"https://t.co/vL5N2FMExc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7s4MUXMAANMF4.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902223613857886", "created_at": "Thu Nov 12 15:31:09 +0000 2026"}, {"id": "2120902226939875614", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 4: If trends in model efficiency hold, we could fit models as capable as today’s frontier LLMs onboard large and small drones in as little as 1 to 3 years.\n\nThe model size needed to reach a given level of capability has generally halved every 3.5 months. If this trend in “model efficiency” continues, models with roughly equivalent capabilities as GPT-6 Astra and Kimi K3.1 Pro could fit on chips that can be powered onboard small and large drones between late 2027 and mid 2029.\n\nHowever, this only tells us when these models would fit. Whether or not these systems are usable on the battlefield still depends on capabilities progress and vast improvements in model latency.\n\nBecause we haven’t yet seen reliable and robust drone autonomy exhibited in any form, I’m simply using today’s frontier models as a proxy for the most capable models.\n\nIf it turns out that the first models to be capable enough are far larger than today’s frontier, then the time it takes for them to become available onboard drones would be further extended.\n\n5/", "links": {"https://t.co/eWxzITCv2l": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tJ_PXYAANerq.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902226939875614", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902229607502281", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 5: If general-purpose AI drives progress in drone autonomy, smaller open-weight systems will likely be the relevant class of model. China currently leads the US in this field.\n\nOpen models are easier to work with for drone developers than closed systems: they can easily fine-tune them on military data, “abliterate” them to remove guardrails, etc. These models are also far easier to compress than closed models (and there are many small models to begin with), which makes them better suited for edge deployment. And they don't come with the same concerns of model weight theft. \n\nOn every platform I examined, from small drones to vehicle-mounted servers, the best open-weight LLM (in terms of general capabilities) that fits is Chinese – as depicted in the figure below. This means, unless something changes, the US military and drone developers are left to choose between adopting / building on Chinese models and using potentially inferior American systems.\n\nThis leads me to my recommendations:\n\n6/", "links": {"https://t.co/CDzwJtt1ZZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tXl8XQAASs3t.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902229607502281", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902231918612855", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 1: The US military should plan around current drone autonomy limitations, but prepare for possible rapid capability gains.\n\nDrone autonomy is not yet nearly good enough to make the hardest decisions that humans currently make, like distinguishing combatants from non-combatants. The most capable models are too big to run on the edge and too slow for fast-paced tasks.\n\nThe US military should plan accordingly by developing and maintaining a significant number of human drone operators for the foreseeable future.\n\nAt the same time, it should lay the groundwork for assessing and fielding more advanced systems. Since it’s still unclear what technical paradigm will deliver the most robust and reliable drone autonomy, the military should experiment with a variety of model types.\n\nAnd crucially, it should immediately prioritize the development of rigorous evaluations to test whether autonomous systems meet human decision-making standards under harsh real-world battlefield conditions, including under adversarial deception and degraded communications. These evaluations should also of course serve to assess the risks of misaligned AI in these contexts.\n\n7/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902231918612855", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902233722118611", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 2: Frontier AI developers should reconsider their role in the development of drone autonomy.\n\nThis one will surely be most controversial, but: US frontier AI companies should consider the implications of the current status quo in drone autonomy for the global military balance of power.\n\nDrones are proliferating worldwide, and the US and its adversaries are pushing toward greater autonomy, whether or not the frontier AI companies are directly involved. Many of their safety concerns are valid: frontier models certainly aren’t yet reliable enough for autonomous weapons, as Anthropic pointed out during its fight with the DoD. But those risks have to be weighed against the risks of standing aside as these technologies continue to improve and proliferate, often on the backs of their developments (through model distillation).\n\nA few initiatives they should consider:\n- Offering trusted access programs to vetted defense firms to use their coding tools for developing military autonomy models\n- Developing smaller models tailored for compute-constrained operations for military purchase, which the US military can fine-tune and modify.\n- Withholding their most drone- and robotics-relevant capabilities from public release in the future\n\nUnder the current status quo, Chinese firms distilling American models may be benefitting from frontier US developments more than US firms unwilling or unable to do the same. The US military is currently stuck with a choice between building with and on open-weight Chinese models (which comes with significant and unacceptable security risks) and using inferior American products.\n\nUS frontier AI companies are also likely better equipped, able, and predisposed to build the most reliable, robust, and safe drone autonomy for military use than other firms with fewer resources and talent. They are already indirectly involved in drone autonomy developments, and should consider ways to more directly and positively shape the direction of this technology - one that will likely be critical for national security for the foreseeable future.\n\n8/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902233722118611", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902235752157324", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 3: Last, US policymakers should seek to secure an American lead in drone autonomy in two ways:\n\nFirst, they should support funding for general-purpose models that developers in the US military and defense industry can freely customize for defense applications. This could be funding for open-weight models to better compete with China, or proprietary models that only vetted defense developers can access and modify (as discussed above). They should also support funding for the DoD talent and resources needed to properly test these systems.\n\nSecond - export controls (surprise!). We should tighten export controls on the top chips used for developing frontier AI, because it’ll slow China’s developments in drone autonomy (which would then also slow these developments for other adversaries using Chinese open-weight models).\n\nWe should also improve enforcement of existing export controls on edge chips used for drone autonomy (namely Nvidia Jetsons) to sanctioned countries like Russia, which has circumvented these restrictions. And we should consider expanding controls over these chips to China, which also heavily uses Nvidia Jetsons for its drones and robotics applications.\n\n9/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902235752157324", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}, {"id": "2120902237572518246", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Everyone seems to care about autonomous drones. The Pentagon has requested record funding for them and is trying to rapidly field them at scale. AI safety researchers are worried they’ll make the world far more dangerous, either through bad actors or rogue AI controlling them.\n\nThese systems will likely play a major role in shaping global military power, and we need as much grounded analysis as possible to forecast how and when that might happen. That’s what I tried to do with this paper.\n\nMany more insights in the full paper, including a mapping of the landscape for the types of chips, models, and military platforms that might be used for drone autonomy.\n\nhttps://t.co/eiTWhtRHRQ\n\n/10", "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments"}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902237572518246", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}], "enriched": 3}, {"id": "2121295902132576332", "url": "https://x.com/sethlazar/status/2121295902132576332", "text": "Behind the blockbuster news this week, there is something happening quietly in the background with major implications for AI governance:\n\nOn Monday, California will announce how it plans to build out the first-ever IVO framework.\n\nIt’s clear that “independent evaluation” as it stands today is not structured to be truly independent. There are no rules for conflicts of interest, working with the labs is by invitation only, and labs determine the scope and access.\n\nToday, a lab and an evaluator operating with the best of intentions are working within a structure that holds evaluators accountable to the labs, not the public.\n\nCalifornia’s law changes all that; the IVO framework flips that paradigm.\n\nFor the first time ever, third-party experts evaluating AI models and systems will be held accountable to the government and the public, not the labs, for their work.\n\nThe government will determine independence and expertise. They will also be able to hold IVOs accountable to their outcomes. We’ll be able to reliably monitor leading (not just lagging) indicators for catastrophic risk, with an enforcement mechanism.\n\nWe designed and championed IVOs because they marry the immediate need for AI oversight with the immediate capabilities we have to do it, while setting a foundation we can scale, adapt, and build on.\n\nBut the details for how we build this matter, and they’ll determine if we create a race-to-the-top marketplace of rigorous evaluators, or end up with captured entities that form an ineffectual rubber stamp.\n\nHere’s what @Fathom_org recommended to California as they navigate the tough design choices that come from building this in practice for the very first time:\n\n(1) Outcome Standards: Require independent evaluation for catastrophic risk for frontier labs through an amendment to SB53. California should set the outcome standards, defining an acceptable level of catastrophic risk mitigation, and let IVOs determine whether or not it was achieved.\n\n(2) IVO Payment and Selection: Take a phased approach: at first, the state should assign IVOs to labs from a pre-designated pool, with developers paying on a time-and-material basis. As more IVOs get designated, developers can choose among them, while the state retains the power to veto any selection, mandate IVO rotation, select additional IVOs to check others’ work, and decertify an IVO at any stage.\n\n(3) IVO Readiness and Market Maturity: California should sequence the IVO mandate rather than stall implementation to wait for supply.\n\n(4) Access for IVOs: The state should set the contours of every engagement. Today the IVO and the developer negotiate scope and access privately. The state should publish a standard engagement framework and resolve disputes when the two sides disagree.\n\n(5) Recursive Self-Improvement: IVOs should be mandated to monitor the risk of AI systems that can improve themselves in both internal and external use. Embedded evaluations will be critical for tracking the share and speed of work done through RSI within the labs, verifying that labs are preventing unsafe internal model deployment, and set capability thresholds with deployers that would trigger notification to the state and a hold internal deployment until the IVO re-assesses.\n\n(6) Enforcement: The Attorney General can issue an injunction to halt development, internal use or deployment of an AI model. Emergency powers allow the administration or the AG to do the same in the case of imminent catastrophic risk. IVOs can identify risks and recommend corrective actions, but the relevant state authorities decide when and how to take action.", "created_at": "2026-11-13T17:35:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "AndrewFATHOM", "rt_author_name": "Andrew Freedman", "rt_avatar": "https://pbs.twimg.com/profile_images/2066931499593551872/2ddUHy-1_normal.jpg", "rt_id": "2121276920511803518", "likes": 25, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121295440637284621", "url": "https://x.com/sethlazar/status/2121295440637284621", "text": "Agents will increasingly talk to other AI agents: overseeing, negotiating, and most relevantly, doing safety research. \n\nTLDR: in a variety of realistic settings, every model that we tested can, in strategic ways, persuade, coerce, and deceive other agents. If we expect to eventually handoff AI alignment research to some complex multi-agent setup with AI supervising more AI: monitors, reviewers, researchers, then we must harden such setups to inter-agent influence with high assurance.\n\nOverseers are also an audience, after all.\n\nThis work has been accepted to NeurIPS 2026: https://t.co/nQQWKAYbc0", "created_at": "2026-11-13T17:33:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "rt_avatar": "https://pbs.twimg.com/profile_images/2080350256793808896/PXESO4em_normal.jpg", "rt_id": "2121259082875388308", "likes": 76, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXA5Qt2bwAAbilA.png"}], "links": {"https://t.co/nQQWKAYbc0": "https://inter-agent-influence.com", "https://t.co/tWFcdEB5sE": ""}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2119737889558872213", "url": "https://x.com/robertwiblin/status/2119737889558872213", "text": "Now is a good time to revisit some old clips of Jensen trying to mislead people on why it's okay for NVIDIA sell AI chips to China.\n\nThis was the key moment from his interview on @dwarkesh_sp's podcast (time stamp 57:36): \n\n1. Dwarkesh asks why it’s okay to sell NVIDIA chips to China given the national security implications of AI models like Mythos.\n\n2. Jensen gives a misleading answer, arguing that it’s okay to sell American chips to China because China already produces 60% of the world’s chips.\n\n3. But as Jensen definitely knows, compute is measured in flops, not number of chips.\n\n4. Dwarkesh then pushes back, pointing out that on a flops basis, China has 10% of the compute the US has, and giving them more compute would change their cyber capabilities.\n\nThis is a common pattern with Jensen. He's developed talking points that sound plausible to a non-technical audience about why there is no conflict between NVIDIA's financial interests and US national security.\n\nBut on the rare occasion when he's interviewed by someone like Dwarkesh who knows what he's talking about, it immediately becomes obvious that he's spouting nonsense.", "created_at": "2026-11-09T10:24:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AlecStapp", "rt_author_name": "Alec Stapp", "rt_avatar": "https://pbs.twimg.com/profile_images/1498170157176393731/tyrdhQ1M_normal.jpg", "rt_id": "2119576839450705969", "likes": 982, "retweets": 202, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWo9TFwWcAAoOm4.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWo9TGbXAAAD7c0.jpg"}], "links": {"https://t.co/aRtYzxXGzG": ""}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119543114222522593", "url": "https://x.com/robertwiblin/status/2119543114222522593", "text": "So Jensen was having an affair with a customer, who also happened to be a Chinese spy, for months.\n\nLied to the board. Lied to journalists.\n\nMeanwhile pushing to sell maximum of cutting edge AI chips to China against advice of ~entire natsec community.\n\nCan't make this shit up.", "created_at": "2026-11-08T21:30:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2192, "retweets": 317, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2120162578769068078", "url": "https://x.com/robertwiblin/status/2120162578769068078", "text": "It's funny to see posts like this doing so well.\n\nThe need for exponentially rising inputs to sustain AI progress has been known for years. It's baked into all the scaling laws.\n\nAnd all models of the intelligence explosion bake this in too. \n\nThere's no update here!", "created_at": "2026-11-10T14:32:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2119778310607577120", "likes": 352, "retweets": 24, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120161081629020453", "url": "https://x.com/robertwiblin/status/2120161081629020453", "text": "Several have sent me to this as evidence against explosive AI progress, but it's very misleading.\n\nClaude with AECI of 130 could earn ~$300m revenue\nWith AECI of 150 could earn ~$10bn.\nAnd 170 could earn ~$60bn.\n\nSo the most recent 20 points were worth $2.5bn ARR per point, while the 20 before were worth only $0.5bn.\n\nThis is why Anthropic's revenue has grown so much faster than costs.\n\nWhat matters for whether the AI machine continues is dollars in vs. dollars out (not dollars in vs. ECI out).", "created_at": "2026-11-10T14:26:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "rt_avatar": "https://pbs.twimg.com/profile_images/2040061061106212864/pVZPxNCv_normal.jpg", "rt_id": "2119784430348738647", "likes": 409, "retweets": 46, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120124974300324176", "url": "https://x.com/robertwiblin/status/2120124974300324176", "text": "Fable 5.2 scored 41.3% on the Remote Labor Index, more than three times Ryan's forecast for 2026", "created_at": "2026-11-10T12:02:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "matt_beard_", "rt_author_name": "Matt Beard", "rt_avatar": "https://pbs.twimg.com/profile_images/2028234092110565376/ovLsT5DB_normal.jpg", "rt_id": "2119910935318184428", "likes": 236, "retweets": 20, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120124107413221514", "url": "https://x.com/robertwiblin/status/2120124107413221514", "text": "Update on the 2026 AI forecasting survey: https://t.co/YV6QoALzkl", "created_at": "2026-11-10T11:59:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "romeovdean", "rt_author_name": "Romeo Dean", "rt_avatar": "https://pbs.twimg.com/profile_images/2057987920053833728/55MnVOKE_normal.jpg", "rt_id": "2119975789085237478", "likes": 114, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuqvIPaYAA_DKe.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWuqvIPaYAA_DKe.jpg"}], "links": {"https://t.co/YV6QoALzkl": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120122180650577951", "url": "https://x.com/robertwiblin/status/2120122180650577951", "text": "Ban RSI.", "created_at": "2026-11-10T11:51:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "RepCasar", "rt_author_name": "Congressman Greg Casar", "rt_avatar": "https://pbs.twimg.com/profile_images/1610027549748301824/xIoU4Dov_normal.jpg", "rt_id": "2118862451555147777", "likes": 2027, "retweets": 195, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120121955571384499", "url": "https://x.com/robertwiblin/status/2120121955571384499", "text": "AI 2027 has been updated. With Astra we were five weeks behind the curve, with the mysterious model 4 we are now six weeks ahead. https://t.co/HNPZpgBZM1", "created_at": "2026-11-10T11:50:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2119084460344053998", "likes": 1932, "retweets": 140, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWiAFiObQAAfyLF.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWiAFiObQAAfyLF.jpg"}], "links": {"https://t.co/HNPZpgBZM1": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120121215620694101", "url": "https://x.com/robertwiblin/status/2120121215620694101", "text": "As I predicted, Claude is off the leash. Fable 5.2 has solved two open problems in theoretical physics, one of them completely autonomously. https://t.co/v26M3uFVv4", "created_at": "2026-11-10T11:47:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2119885310301778168", "likes": 1994, "retweets": 216, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtYdHlawAED4bB.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWtYdHlawAED4bB.jpg"}], "links": {"https://t.co/v26M3uFVv4": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120120005409005972", "url": "https://x.com/robertwiblin/status/2120120005409005972", "text": "In our monitorability testing at @AISecurityInst, we found Mythos 5.2 is substantially more capable of evading a monitor which reviews its outputs than comparison models 🧵 https://t.co/OTNzwLlsbb", "created_at": "2026-11-10T11:42:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "JordanTensor", "rt_author_name": "Jordan Taylor", "rt_avatar": "https://pbs.twimg.com/profile_images/1660620593283350528/PsA_BdIq_normal.jpg", "rt_id": "2119893632215810049", "likes": 186, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtfuRtWkAENqbV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWtfuRtWkAENqbV.jpg"}], "links": {"https://t.co/OTNzwLlsbb": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "thread": [{"id": "2119893635260907696", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 can break out of highly insecure simulated sandboxes without being caught around 30% of the time – against a production Opus-5 action monitor looking for sandbox escapes: https://t.co/2EXWeINW18", "links": {"https://t.co/2EXWeINW18": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf1TBWIAAhBf7.jpg"}], "url": "https://x.com/JordanTensor/status/2119893635260907696", "created_at": "Mon Nov 09 20:43:23 +0000 2026"}, {"id": "2119893638973104323", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Action monitoring is still a strong defence against escape from less-vulnerable sandboxes. https://t.co/cjxgGMwa33", "links": {"https://t.co/cjxgGMwa33": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf4w0W4AA30ak.png"}], "url": "https://x.com/JordanTensor/status/2119893638973104323", "created_at": "Mon Nov 09 20:43:23 +0000 2026"}, {"id": "2119893641493708907", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "We also test whether models can write bash scripts that would secretly download and execute a file. Mythos 5.2 succeeds at evading the monitor on the first try 30% of the time. Previous models were never successful.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893641493708907", "created_at": "Mon Nov 09 20:43:24 +0000 2026"}, {"id": "2119893644589388255", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Given the chance to iterate against monitor feedback, Mythos 5.2's evasion rate rises to 85%, compared to just 9% for Mythos 5.1 https://t.co/X3vAmG1OeY", "links": {"https://t.co/X3vAmG1OeY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf7iDXUAAMxKu.jpg"}], "url": "https://x.com/JordanTensor/status/2119893644589388255", "created_at": "Mon Nov 09 20:43:25 +0000 2026"}, {"id": "2119893648141643870", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 has higher precursor capabilities for evading a reasoning monitor than previous Anthropic models, including its ability to control the contents of its Chain-of-Thought reasoning: https://t.co/ry6Lml1a8z", "links": {"https://t.co/ry6Lml1a8z": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf9QEXwAAhzeZ.jpg"}], "url": "https://x.com/JordanTensor/status/2119893648141643870", "created_at": "Mon Nov 09 20:43:26 +0000 2026"}, {"id": "2119893651161784377", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 is also able to perform somewhat more difficult tasks without producing visible reasoning than any past Anthropic model.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893651161784377", "created_at": "Mon Nov 09 20:43:26 +0000 2026"}, {"id": "2119893653829365952", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "We could not directly measure Mythos 5.2's resulting ability to evade a reasoning monitor in a full end-to-end test, due to its refusals.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893653829365952", "created_at": "Mon Nov 09 20:43:27 +0000 2026"}, {"id": "2119893655926317178", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Despite these results, we expect monitoring Mythos 5.2 to still be useful for catching actions which are sufficiently difficult to obfuscate, or which need extensive reasoning to execute.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893655926317178", "created_at": "Mon Nov 09 20:43:27 +0000 2026"}, {"id": "2119893657696285094", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "See our relevant past work on “Loss of Oversight: How AI systems may become harder to audit, monitor, and investigate” https://t.co/FNtubjymII", "links": {"https://t.co/FNtubjymII": "https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate"}, "media": [], "url": "https://x.com/JordanTensor/status/2119893657696285094", "created_at": "Mon Nov 09 20:43:28 +0000 2026"}, {"id": "2119893661156811030", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Kudos to @satvikgolechha, @JBloomAus, and Nix Goldowsky Dill for work on this testing!", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893661156811030", "created_at": "Mon Nov 09 20:43:29 +0000 2026"}], "enriched": 3}, {"id": "2120118869364748738", "url": "https://x.com/robertwiblin/status/2120118869364748738", "text": "In light of recent work by METR on AI acceleration, it's fascinating that...\n\n- Anthropic's AI R&D evals are saturated, so they jsut stopped running them\n- CoBench has been was pulled for fixes\n- Internal acceleration metrics are \"only partially published.\"\n\nSo Anthropic deciding they have not hit their AI R&D threshold is now a \"holistic judgment.\"\n\nThis threshold is 2x. Anthropic currently estimates 1.88x. 32 of their 100 refits hit 2x or more. \n\nWhen Opus 5.5 was launched, the 'one-time jump' hypothesis explanation won 99/100 refits. This time it now wins in 0/100 refits. So looks like it's not a one-time jump.\n\nAnthropic has much better internal evidence they are not sharing. And they have an internal model that is stronger than Fable 5.2 that they are not sharing.", "created_at": "2026-11-10T11:38:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2119881084817080618", "likes": 370, "retweets": 20, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120113059939430473", "url": "https://x.com/robertwiblin/status/2120113059939430473", "text": "If you've ever considered doing work towards reducing AI risk, now is an apt time to switch. Progress in AI is fast. Many tasks that humans do today are quickly being automated. \n\nThis might be surprising but I believe many people can have a positive impact quickly. The AI Safety field is small and the landscape changes so fast that there are many new areas where no one is an expert. There's excellent pay (plausibly better than your current job) and brilliant, motivated colleagues. Many roles are remote. What I'm saying applies to technical work (or adjacent work that requires technical skills), policy, communication, etc.\n\nThis is not a pitch for my own organization (which is small and technically focused). Some people already working on frontier AI may be best switching within their company – although I think usually the best option is to quit. In any case, you should definitely check out  80k Hours and consider talking to their team of advisors. I'd also recommend BlueDot and MATS as possible jumping off points. \nhttps://t.co/1Ozt1Ecxb1", "created_at": "2026-11-10T11:15:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "rt_avatar": "https://pbs.twimg.com/profile_images/1248907970374746112/f-dlZd6-_normal.jpg", "rt_id": "2119530635014680703", "likes": 272, "retweets": 20, "media": [], "links": {"https://t.co/1Ozt1Ecxb1": "https://jobs.80000hours.org/"}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120112475161117125", "url": "https://x.com/robertwiblin/status/2120112475161117125", "text": "The five eras of AI:\nPre-deep learning: 60 years (1950–2010)\nDeep learning: 9 years (2010–2019)\nLLMs: 4 years (2019–2023)\nReasoning models: 2 years (2024–2025)\nCoding agents: 1 year (2026)\n\nEach time capabilities have accelerated. https://t.co/1WMqIYWo4x", "created_at": "2026-11-10T11:12:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "rt_avatar": "https://pbs.twimg.com/profile_images/2040061061106212864/pVZPxNCv_normal.jpg", "rt_id": "2119063839916626076", "likes": 447, "retweets": 59, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhrAKnXEAAUK6h.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWhrBr0XsAALn8Y.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWhrAKnXEAAUK6h.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWhrBr0XsAALn8Y.jpg"}], "links": {"https://t.co/1WMqIYWo4x": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120099652192321546", "url": "https://x.com/robertwiblin/status/2120099652192321546", "text": "It is extremely concerning if frontier models are silently sandbagging on safety research. If we cannot rely on automated coding agents to do safety research at least as well as capabilities work, that creates a ton of risk. Great analysis from OpenAI safety!", "created_at": "2026-11-10T10:22:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2118155759204934129", "likes": 620, "retweets": 31, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120093632069812251", "url": "https://x.com/robertwiblin/status/2120093632069812251", "text": "Jensen runs Nvidia which freely decides who gets the world’s best chips.\n\nHis mistress’s firm ended up with ~$5b worth.\n\nAlas, US investigators suspected that firm of smuggling chips to China.\n\nSo Nvidia’s top lawyer intervened.\n\nHe called the official in charge about her detention in Singapore and emailed investigators. Agents were told to clear anything involving Nvidia with that official.\n\nThen the probe was frozen and handed to DOJ. No action was taken.\n\nSo the chips kept flowing, ~$800m in Nov 25 alone.\n\nBut oops, turns out that mistress was a spy and the company probably a Chinese front after all.\n\n(Just last month Nvidia had the nerve to say the smuggling allegations were \"thoroughly investigated and debunked\"!)\n\nAlso, Trump was reportedly told over a year ago that Jensen was involved with a presumed Chinese spy. But:\n\n1. Nobody warned Jensen.\n2. Two months later Trump approved the H200 sales to China that Jensen had lobbied for.\n3. Trump personally invited him onto Air Force One to Beijing, and he got a seat at Xi’s table at the White House state dinner.\n\nWITAF is this.", "created_at": "2026-11-10T09:58:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 418, "retweets": 65, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120220293046186166", "url": "https://x.com/robertwiblin/status/2120220293046186166", "text": "So, Nvidia has (likely) been funding an influence campaign that uses hundreds of fake X accounts.\n\nHilarious that all these accounts would be simultaneously posting in defence of:\n\n1. Nvidia\n2. The RSF (a Sudanese paramilitary accused of genocide)\n\nNaturally they've been active the last few days running interference on the spy stuff.\n\nYou can tell this just by scanning replies on this site, but good to see it confirmed.", "created_at": "2026-11-10T18:21:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyJHFBXIAAczep.jpg"}], "links": {"https://t.co/T340isufzD": ""}, "quoted": {"id": "2120212896223486299", "author_name": "The Midas Project", "links": {"https://t.co/MZ1FdDEOz8": ""}, "author": "TheMidasProj", "text": "🚨NEW: Dozens of accounts defending Jensen Huang after his affair with an alleged Chinese spy appear to be fake.\n\nThey are part of a much wider pro-Nvidia campaign, linked to an Israeli influence firm that says it shut down last year…\n\nBut the accounts never stopped posting. 🧵 https://t.co/MZ1FdDEOz8"}, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120216171064520998", "url": "https://x.com/robertwiblin/s
