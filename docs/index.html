19852751844975025", "url": "https://x.com/DKokotajlo/status/2119852751844975025", "text": "More thoughts from @redwood_ai's Alexa Pan about Astra's tendency to sandbag on safety research tasks:\nhttps://t.co/lzjcbQoigL", "created_at": "2026-11-09T18:00:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 84, "retweets": 8, "media": [], "links": {"https://t.co/lzjcbQoigL": "https://blog.redwoodresearch.org/p/astra-covertly-underperforming-on"}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119909308003754247", "url": "https://x.com/DKokotajlo/status/2119909308003754247", "text": "Toby’s analysis totally misses the point here IMO. He’s right that the graph of capabilities over time could be explained as a one-off jump in capabilities from the Mythos pretrain. But that graph is not the main reason why METR thinks AI R&D is now sped up 1.7x by AI. The graph is just the only part of their analysis that wasn’t redacted.\n\nThey say that “a majority (perhaps ≈80%) of the current (October 2026) acceleration is due to AI”, based on “a variety of lines of evidence on contributions from AI and other causes”, after saying that “[t]he acceleration in late 2025 was likely influenced by non-AI factors.”\n\nMETR’s report makes it clear that they considered Toby’s hypothesis and rejected it for redacted reasons, rather than failing to consider it, in the appendix \"New internal models make a permanent slope change look more plausible than a one-time jump at Mythos Preview.\"\n\nIt totally makes sense to worry that METR’s analysis is wrong. It’s definitely unfortunate that the main evidence they were allowed to share does not suffice to demonstrate their point, for this reason among others. But I don’t think it makes sense to consider Toby’s argument a knockdown argument against the report’s conclusion, because the conclusion wasn’t mostly derived from the observations whose interpretation Toby disputes.\n\nSee https://t.co/WNBLBd8bs6", "created_at": "2026-11-09T21:45:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "bshlgrs", "rt_author_name": "Buck Shlegeris", "rt_avatar": "https://pbs.twimg.com/profile_images/2089060675234791424/EqZuDatG_normal.jpg", "rt_id": "2119255143439048733", "likes": 264, "retweets": 25, "media": [], "links": {"https://t.co/WNBLBd8bs6": "https://x.com/METR_Evals/status/2118412189833085248"}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "linked": [{"id": "2118412189833085248", "author_handle": "METR_Evals", "author_name": "METR", "text": "Anthropic shared extensive evidence across its AI R&amp;D pipeline, from pretraining to RL, including key details like estimates of algorithmic progress over time. We found this nonpublic evidence highly informative about AI R&amp;D acceleration. https://t.co/V0KTYjjGaq", "links": {"https://t.co/V0KTYjjGaq": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYa5p6aAAASBIq.jpg"}], "url": "https://x.com/METR_Evals/status/2118412189833085248", "created_at": "Thu Nov 05 18:36:38 +0000 2026"}], "enriched": 3}, {"id": "2117671098418676179", "url": "https://x.com/dwarkesh_sp/status/2117671098418676179", "text": "Many diseases are limited by being too deadly. They kill off their hosts before they can spread.\n\nBut the bubonic plague is different. It can jump between fleas and a huge range of mammals, and its extreme lethality can actually help it spread.\n\nHuman casualties are merely a byproduct.\n\n@Oklahomaharper explains why the plague is a marvel of evolutionary efficiency.", "created_at": "2026-11-03T17:31:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117667312165646637", "likes": 31, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117637546561753088/img/15bRNS0ZK9Imfo9o.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3}, {"id": "2118116214115610997", "url": "https://x.com/dwarkesh_sp/status/2118116214115610997", "text": "When you send ChatGPT a message, your request doesn't get processed individually, it gets processed alongside thousands of other requests sent by other people.\n\n@reinerpope compares this process to passengers at a train station:\n\n“Any passengers who are ready board the train. If the train is full, then they wait till the next train. If the train is not full, the train's going to go anyway. In terms of what that means for queuing latency, it means that the worst case is that a request arrives just after the train departed. It has to wait for the next train, so that's up to 20 milliseconds, and then it has to wait for that train to complete. The worst-case latency is 40 milliseconds.”", "created_at": "2026-11-04T23:00:32+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117753697950437877", "likes": 103, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117638427969503232/img/RaxPBcWDJEXlJpsZ.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118116186936524934", "url": "https://x.com/dwarkesh_sp/status/2118116186936524934", "text": "When Uranus's orbit didn't match the models of Newtonian physics, astronomers assumed there must be another planet nearby throwing off the orbit.\n\nThey soon discovered Neptune.\n\nWhen Mercury's orbit didn't match the models of Newtonian physics, astronomers assumed there must be another planet nearby throwing off the orbit.\n\nThey were wrong. They needed Einstein’s theory of relativity to rewrite their basic physics assumptions.\n\n@michael_nielsen  explains why scientists often can’t tell whether an anomaly requires a minor correction or a scientific revolution.", "created_at": "2026-11-04T23:00:26+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118116089242808776", "likes": 56, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117984029878132736/img/x4uWJ5AtyIyabbYF.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118116177851580839", "url": "https://x.com/dwarkesh_sp/status/2118116177851580839", "text": "Why can't we have arbitrarily large GPU scale-ups? \n\n@reinerpope explains it's partially a matter of wire density: https://t.co/hGGrb46yNC", "created_at": "2026-11-04T23:00:24+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118025489285795925", "likes": 114, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117983257463574528/img/NuFVmfyjokZ9WWgV.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/hGGrb46yNC": ""}, "enriched": 3}, {"id": "2118450950079713336", "url": "https://x.com/dwarkesh_sp/status/2118450950079713336", "text": "Substack: https://t.co/LH20ZKCYp3\n\nYoutube: https://t.co/3KOIctPkEo", "created_at": "2026-11-05T21:10:40+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "reply_to_id": "2118449808402681911", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/LH20ZKCYp3": "https://dwarkesh.com/p/clocktower", "https://t.co/3KOIctPkEo": "https://youtu.be/1NQwfImTseU"}, "enriched": 3, "parent": {"id": "2118449808402681911", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "links": {"https://t.co/IF4d0EMSD8": "http://clocktowerbench.com", "https://t.co/35ym1NcVDL": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWZY5oDWIAAiAi4.jpg"}], "url": "https://x.com/dwarkesh_sp/status/2118449808402681911", "created_at": "Thu Nov 05 21:06:07 +0000 2026"}}, {"id": "2118449808402681911", "url": "https://x.com/dwarkesh_sp/status/2118449808402681911", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "created_at": "2026-11-05T21:06:07+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 121, "retweets": 10, "media": ocial deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "links": {"https://t.co/IF4d0EMSD8": "https://clocktowerbench.com/"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/y3kJecZQxq": ""}, "enriched": 3, "thread": [{"id": "2118506486708294139", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "Full video: https://t.co/U3M387AbXQ", "links": {"https://t.co/U3M387AbXQ": "https://www.youtube.com/watch?v=1NQwfImTseU"}, "media": [], "url": "https://x.com/dwarkesh_sp/status/2118506486708294139", "created_at": "Fri Nov 06 00:51:21 +0000 2026"}]}, {"id": "2118478531969818864", "url": "https://x.com/dwarkesh_sp/status/2118478531969818864", "text": "We don’t know how anesthesia works, only that it does.\n\nRemarkably, anesthesia works on single-celled amoebas.\n\nNick Lane explains how this opens up all sorts of questions not only about anesthesia, but consciousness itself.\n\nhttps://t.co/koKm4KZphH https://t.co/DaNGmoBxvf", "created_at": "2026-11-05T23:00:16+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_ nks": {"https://t.co/IF4d0EMSD8": "https://clocktowerbench.com/"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/IuqicNusMO": ""}, "enriched": 3}, {"id": "2118466121317924959", "url": "https://x.com/dwarkesh_sp/status/2118466121317924959", "text": "@Madisonkanna I'm unfortunately not autistic enough to understand age of empires", "created_at": "2026-11-05T22:10:57+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "Madisonkanna", "reply_to_id": "2118461465472782520", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 132, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118461465472782520", "author_handle": "Madisonkanna", "author_name": "Madison Kanna", "text": "@dwarkesh_sp age of empires next", "links": {}, "media": [], "url": "https://x.com/Madisonkanna/status/2118461465472782520", "created_at": "Thu Nov 05 21:52:27 +0000 2026"}}, {"id": "2118713063385989133", "url": "https://x.com/dwarkesh_sp/status/2118713063385989133", "text": "This is fascinating (and fun). @dwarkesh_sp has the AIs play 400 rounds of a zero-sum game of incomplete and asymmetric information, like Werewolf- essentially players in this game need to figure out who are the (hidden) bad guys, the bad guys needs to kill the good guys. Players need to do Bayesian updating as clues accumulate, but everyone is lying and bluffing and cheating and the environment is noisy .\n\nWhat is really interesting about building this benchmark is that, as Dwarkesh says, benchmarks cannot saturate in this type of competitive environments. As models get better, playing improves, but the other side is also getting better. At the end of the day, you will always benefit by having a frontier model detect the lying and cheating of others. This is true for war, for trade, for bargaining, for international relations, for competition- in all those situations benchmarks cannot saturate. \n\nSubstantively, I was quite blown away by the ability of the agents to keep track of what other players were thinking, what everyone knows, what they know (or think) others know etc. \n\nIt is worth a watch and a thought.", "created_at": "2026-11-06T14:32:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "rt_avatar": "https://pbs.twimg.com/profile_images/1088718721785434112/TCQN0rTD_normal.jpg", "rt_id": "2118634829591814453", "likes": 102, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118796146198061062", "url": "https://x.com/dwarkesh_sp/status/2118796146198061062", "text": "Evolutionary biologist Nick Lane thinks the laws of physics may make the emergence of life inevitable across the universe.\n\nHis model almost sounds like intelligent design, or at least deism, where a distant god creates rules for the universe.\n\nhttps://t.co/XK9TQK8hJT https://t.co/sniwno7PaR", "created_at": "2026-11-06T20:02:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118750263628456032", "likes": 40, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118733647612178433/img/u7HQciSauwoFQAz8.jpg"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/XK9TQK8hJT": "https://youtu.be/0GMWxuYuxJI?t=1355", "https://t.co/sniwno7PaR": ""}, "enriched": 3}, {"id": "2118019260433977794", "url": "https://x.com/Lewis_Bollard/status/2118019260433977794", "text": "@AtletiRoma Yeah fair point. He was much less stubborn and dogmatic on this than Ashley Hinson.", "created_at": "2026-11-04T16:35:17+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "AtletiRoma", "reply_to_id": "2118017391846433197", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118017391846433197", "author_handle": "AtletiRoma", "author_name": "Sa", "text": "@Lewis_Bollard Marshall dropped his sponsorship to be fair", "links": {}, "media": [], "url": "https://x.com/AtletiRoma/status/2118017391846433197", "created_at": "Wed Nov 04 16:27:51 +0000 2026"}}, {"id": "2118018958465105974", "url": "https://x.com/Lewis_Bollard/status/2118018958465105974", "text": "Factory-farmed ducks and geese won last night too.\n\nDenver and Washington DC both voted to ban the sale of foie gras — by wide margins.\n\nFoie gras is produced by force-feeding birds through metal tubes until their livers expand to ten times their natural size.\n\nIn DC, the political elite — from Jose Andres to Mayor Muriel Bowser — opposed the measure as a distraction from the Big Serious issues they care about.\n\nDC voters disagreed.", "created_at": "2026-11-04T16:34:05+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "Lewis_Bollard", "reply_to_id": "2118016977432461455", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS29XIaMAIPy1r.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118016977432461455", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "text": "Some great news for factory-farmed pigs last night.\n\nIn Iowa and Kansas, voters rejected the lead sponsors of the Save Our Bacon Act in both the House and Senate: Rep. Ashley Hinson and Sen. Roger Marshall.\n\nThese were the politicians who did the pork lobby’s bidding and tried to wipe out every state ban on selling pork from crated pigs.\n\nYet even in two of the most pro-agriculture states in the country, it cost them more votes than it won them.\n\nThe politicians who follow the factory farming lobby aren’t as safe as they thought.", "links": {"https://t.co/DeueEz2NEw": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS07nqaoAArnvz.jpg"}], "url": "https://x.com/Lewis_Bollard/status/2118016977432461455", "created_at": "Wed Nov 04 16:26:12 +0000 2026"}}, {"id": "2118016977432461455", "url": "https://x.com/Lewis_Bollard/status/2118016977432461455", "text": "Some great news for factory-farmed pigs last night.\n\nIn Iowa and Kansas, voters rejected the lead sponsors of the Save Our Bacon Act in both the House and Senate: Rep. Ashley Hinson and Sen. Roger Marshall.\n\nThese were the politicians who did the pork lobby’s bidding and tried to wipe out every state ban on selling pork from crated pigs.\n\nYet even in two of the most pro-agriculture states in the country, it cost them more votes than it won them.\n\nThe politicians who follow the factory farming lobby aren’t as safe as they thought.", "created_at": "2026-11-04T16:26:12+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 432, "retweets": 75, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS07nqaoAArnvz.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118018958465105974", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "text": "Factory-farmed ducks and geese won last night too.\n\nDenver and Washington DC both voted to ban the sale of foie gras — by wide margins.\n\nFoie gras is produced by force-feeding birds through metal tubes until their livers expand to ten times their natural size.\n\nIn DC, the political elite — from Jose Andres to Mayor Muriel Bowser — opposed the measure as a distraction from the Big Serious issues they care about.\n\nDC voters disagreed.", "links": {"https://t.co/XwlqNQUNdc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS29XIaMAIPy1r.jpg"}], "url": "https://x.com/Lewis_Bollard/status/2118018958465105974", "created_at": "Wed Nov 04 16:34:05 +0000 2026"}]}, {"id": "2117595812070822324", "url": "https://x.com/mentalgeorge/status/2117595812070822324", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:32:39+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 37, "retweets": 3, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/45GXeNa6ll": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117980423015866713", "url": "https://x.com/mentalgeorge/status/2117980423015866713", "text": "Going to be in DC all of next week - I haven't been since i was 15 years old, please reach out with tips for how to get the most out of the city and if you would like to get coffee, lunch, shisha, etc.", "created_at": "2026-11-04T14:00:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117973679325806875", "url": "https://x.com/mentalgeorge/status/2117973679325806875", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-04T13:34:09+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/0pn81QXTKK": "https://www.anthropic.com/research/provable-inference"}, "enriched": 3}, {"id": "2117925569870352856", "url": "https://x.com/mentalgeorge/status/2117925569870352856", "text": "@MaskedTorah Oh good point, forgot this was the case", "created_at": "2026-11-04T10:22:59+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "MaskedTorah", "reply_to_id": "2117923570382971303", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117923570382971303", "author_handle": "MaskedTorah", "author_name": "Drake Thomas", "text": "@mentalgeorge Under RSP v3 many of these object-level mitigations from the middle table in section 1 are \"plans/goals as a company\", not hard rules. Embarrassing if failed but not RSP saying \"we will definitely do this\". The stuff around risk reports and competitors are actual requirements.", "links": {}, "media": [], "url": "https://x.com/MaskedTorah/status/2117923570382971303", "created_at": "Wed Nov 04 10:15:02 +0000 2026"}}, {"id": "2118344311465034201", "url": "https://x.com/mentalgeorge/status/2118344311465034201", "text": "@theobearman lmfao, i'm not necessarily against continued build-out but calling it a safety policy really is quite funny", "created_at": "2026-11-05T14:06:55+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118328463387984345", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118328463387984345", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "OpenAI is re-making the case for a U.S.-led buildout after the midterms (saying it is a safety policy because it enables a paced frontier and that it \"continues to support the strengthening of export controls on chips and semiconductor manufacturing equipment\").\n\nhttps://t.co/8fn07nDbM2", "links": {"https://t.co/8fn07nDbM2": "https://cdn.openai.com/pdf/compute-campus-policy-blueprint.pdf", "https://t.co/URAt0pzyM6": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXQbZKWAAA0zla.png"}], "url": "https://x.com/theobearman/status/2118328463387984345", "created_at": "Thu Nov 05 13:03:56 +0000 2026"}}, {"id": "2118288692804559154", "url": "https://x.com/mentalgeorge/status/2118288692804559154", "text": "@dylanmatt I would love to!", "created_at": "2026-11-05T10:25:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "dylanmatt", "reply_to_id": "2118135446748234216", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118135446748234216", "author_handle": "dylanmatt", "author_name": "dylan matthews 🔸", "text": "@mentalgeorge Come by the office!", "links": {}, "media": [], "url": "https://x.com/dylanmatt/status/2118135446748234216", "created_at": "Thu Nov 05 00:16:58 +0000 2026"}}, {"id": "2118270521242505477", "url": "https://x.com/mentalgeorge/status/2118270521242505477", "text": "@JakeMendel99 @herbiebradley @MaxNadeau_ @theojaffee @JakeMendel99 I'm curious to know exactly why its hard to contest the claim that \"for sufficiently capable AI systems it becomes very difficult to design RL environments that don't incentivise cheating\". \n\nI don't necessarily disagree, but why is this the case? Is there like a canonical write-up on this?\n\nI recall @GuiveAssadi making the point that the RL env doesn't have to literally unexploitable, it just has to make exploits costlier than intended solutions (not sure how to evaluate this argument)", "created_at": "2026-11-05T09:13:42+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "JakeMendel99", "reply_to_id": "2118188656502681892", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118188656502681892", "author_handle": "JakeMendel99", "author_name": "Jake Mendel", "text": "@herbiebradley @MaxNadeau_ @theojaffee Max is referring to conceptual arguments about challenges with avoiding cheating and lying that will arise in the future. I think the claim that for sufficiently capable AI systems it becomes very difficult to design RL environments that don't incentivize cheating is pretty hard to contest, and current empirical evidence doesn’t seem very relevant to it. \n\nI think the main part of the story that could be contested by empirical evidence is whether incentivizing cheating inevitably leads to models actually doing the cheating.\n\nOne update I’ve made based on recent empirical evidence is that model behavior seems increasingly well predicted by reasoning about what behavior is directly incentivized by the reward function (this analysis is analogous to realist analysis in politics, and reasoning about generalising from character training or the pretraining prior is analogous to idealism). Realism seems to be increasingly predictive for more recent models, perhaps because there is more RL being done now. \n\nUnfortunately the realist perspective does imply that we have some serious alignment obstacles ahead of us. I now think that they are slightly more likely to be difficult to overcome than I used to.", "links": {}, "media": [], "url": "https://x.com/JakeMendel99/status/2118188656502681892", "created_at": "Thu Nov 05 03:48:24 +0000 2026"}}, {"id": "2118708539997008200", "url": "https://x.com/mentalgeorge/status/2118708539997008200", "text": "No one can react the appropriate amount to the New METR Graph, because we have no evidence we can evaluate ourselves.\n\nHowever, one helpful bit in the report is when they leak three of the AECI basket of benchmarks: these at least are the usual weaksauce. An amazing mental effect https://t.co/jKN6z7ROqz", "created_at": "2026-11-06T14:14:14+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "gleech", "rt_author_name": "gavin leech (Non-Reasoning)", "rt_avatar": "https://pbs.twimg.com/profile_images/1513339291883212803/9m6waiws_normal.jpg", "rt_id": "2118643766760472859", "likes": 40, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbn5zwXgAAPmul.png"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/jKN6z7ROqz": ""}, "enriched": 3}, {"id": "2118706692250542148", "url": "https://x.com/mentalgeorge/status/2118706692250542148", "text": "@MJewkes @ajeya_cotra In addition the different versions containing different benchmarks, Anthropic also spent far more token per task (2.5M and 72k output) than Epoch (0.5M and 10k). \n\nIf different models have different returns-on-continued-token-spend, the graph will look quite different", "created_at": "2026-11-06T14:06:53+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "MJewkes", "reply_to_id": "2118456906457272816", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118456906457272816", "author_handle": "MJewkes", "author_name": "Matthew Jewkes", "text": "@ajeya_cotra Do you have any take on why the acceleration only appears on Anthropic's private version of ECI? I can’t see any Oct '25 breakpoint or acceleration over the same models / same time period in the (nominally) same public benchmark.\n\nhttps://t.co/r3GnFrb0MD", "links": {"https://t.co/r3GnFrb0MD": "https://x.com/MJewkes/status/2118420200290967856"}, "media": [], "url": "https://x.com/MJewkes/status/2118456906457272816", "created_at": "Thu Nov 05 21:34:20 +0000 2026"}}, {"id": "2118685355528581342", "url": "https://x.com/mentalgeorge/status/2118685355528581342", "text": "@Hamish_Low5 yeah i found this interesting too", "created_at": "2026-11-06T12:42:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "Hamish_Low5", "reply_to_id": "2118635748777726137", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118635748777726137", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Interesting detail in METR's report is a redacted agent scaffold, that isn't claude code. It's described as being observed/read as a 'thread'. Is this just souped up Claude in slack, is this some kind of internal agent monitoring system? https://t.co/7zF53Hvgcs", "links": {"https://t.co/7zF53Hvgcs": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbnMKpXIAAPmcX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWbnhE9XYAA5t1h.jpg"}], "url": "https://x.com/Hamish_Low5/status/2118635748777726137", "created_at": "Fri Nov 06 09:24:59 +0000 2026"}}, {"id": "2118494800408433068", "url": "https://x.com/mentalgeorge/status/2118494800408433068", "text": "Long-term, I think the argument that \"the safest thing is for specifically us to be in the lead\" just wont work. Even if its literally true! \n\nIt asks too much of those not  at anthropic. maybe made sense in a low political awareness world - thats not the world we've ended up in", "created_at": "2026-11-06T00:04:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 29, "retweets": 0, "media": [], "quoted": {"author": "Sam_McCandlish", "text": "@JerusalemDemsas Fair question. The short answer is that the unredacted information would allow others to speed up their research, and we thought the safety implications were worse than the benefits of transparency. \n\nLonger answer is that we think an embedded third-party evaluator model is the best way to navigate the trade-off. A third-party with lots of access and time can keep the public informed without requiring the information itself to be public. This still involves trust, but it’s trust in the evaluator rather than just trust in us. We’ve written more about how we see this working here: https://t.co/d3UNp78BP9", "links": {"https://t.co/d3UNp78BP9": "https://www.anthropic.com/news/an-update-on-independent-evaluators"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118491715195834493", "url": "https://x.com/mentalgeorge/status/2118491715195834493", "text": "@deepfates What it’s like to read a Claude paragraph https://t.co/nKPkSTJqlq", "created_at": "2026-11-05T23:52:39+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "mpopv", "rt_author_name": "Matt Popovich", "rt_avatar": "https://pbs.twimg.com/profile_images/2102839984659345409/9OwXgZuD_normal.jpg", "rt_id": "2118482062193881315", "likes": 130, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZcNU3a8AA-ii-.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/nKPkSTJqlq": ""}, "enriched": 3}, {"id": "2118460348378272216", "url": "https://x.com/mentalgeorge/status/2118460348378272216", "text": "Still the funniest joke I've ever heard on an AI podcast https://t.co/xmCGnSkNPs", "created_at": "2026-11-05T21:48:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 703, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZIbEDXwAEakdM.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/xmCGnSkNPs": ""}, "enriched": 3}, {"id": "2118771396633415953", "url": "https://x.com/mentalgeorge/status/2118771396633415953", "text": "What are the biggest take-aways from the METR rsi report?\n\n1. Progress for Anthropic models on AECI-style benchmarks was twice as fast from Oct 2025 to Oct 2026 as it was in the 18-month period before. That benchmark progress speed has straightup doubled is in fact surprising.  \n\n2. Most of the METR staff involved believe that this 2x rate of progress is likely true of \"well-specified tasks\" in general. We don't know what they think the rate of progress on other sorts of tasks are. \n\n3. Relevant METR staff believe - with substantial uncertainty - that most (~80%) of the **current** acceleration is due to Anthropic's use of AI in R&D. I definitely find this surprising. \n\n(Notably, however, they think that, when in the acceleration begain in late-2025, it was in \"large\" part due to \"non-AI factors\". These could include things like data improvements, increased experimental compute, or something specific like overcoming particular infra or security challenges.)\n\nWe basically do not know how they came to this belief - ie, that this acceleration is now driven primarily by AI labour. \n\nClearly, they were able to rule out some other inputs with confidence, like training compute.  We also know that they did \"detailed analysis\" of the growth rate in individual uplift that would be needed to explain acceleration, but this was redacted. Plausibly, they got some evidence that the individual uplift required was consistent with employee reports and other metrics. \n\nWe also know that they looked at metrics of algorithmic efficiency, model strength in pretraining and RL, and improvements to compute utilisation. \n\nAs a final caveat on this point, it's worth noting that \"Anthropic's use of AI R&D\" driving 80% of the acceleration doesn't necessarily mean that improved models are driving most of this acceleration. It seems plausible that at least some of this acceleration comes simply from a massively increased internal inference spend (which we separately know is for sure occurring). \n\n4. METR encountered no evidence of bottlenecks to further acceleration. This is also surprising to me. Naively, you could have imagined they would encounter evidence that it would be hard for Anthropic do things like keep scaling data or compute proportionately. \n\nThat said, I'm unconvinced that this report provides all that much evidence about how much further away we are from something like \"domain-general superintelligence\". Turning faster growth in well-specified domains into rapid progress in superintelligence requires a bunch of modelling assumptions about \n1. sample efficiency;\n2. breakthroughs in continual learning;\n3. generalisation; or\n4. the simulation capabilities of models. \n\nThe report doesn't have info that can update us on any of the above, though METR will have seen some relevant data. \n\nIn discussions of this nature, you should always recall Sam Altman's description of GPT-4.5 as \"ten times smarter\" than GPT-4. No one - ever - talks about 4.5. It's a totally irrelevant model. There is some sense in which we should view debates about RSI birthing domain-general superintelligence in a similar light to earlier debates about scaling pretraining leading to \"emergent\" agentic capabilities. Intelligence remains more of a mystery than we would have ever guessed.\n\nFurther - and I wouldn't read too much into this - but it is interesting that a 2x acceleration in benchmark progress translated into no acceleration in revenue growth (which according to a quick Codex check was about 13x in both periods METR examine). \n\nIn any case, we now know with greater confidence that the rate at which models are getting better at tasks they are already good at is getting faster. It further seems plausible that much of this acceleration is itself due to improvements in the models, though some of it is likely due to Anthropic spending more on internal inference.  \n\nWhat we still don't know is how much models are accelerating in progress on non-AECI style tasks. It's possible we shouldn't make too much of this - note for instance that, as METR point out, there are some cases (eg Navier Stokers) where the benchmark-reality mapping cuts the *opposite* way, and models are **more** impressive than raw benchmark improvements would suggest. \n\nSomething that would have been really interesting to see would be comparative acceleration in productivity growth for non-engineer roles at Anthropic across the two time periods. \n\nEither way:  remember that the main reason to care about AIs accelerating “AI R&D” is that this AI R&D cashes out in increased capabilities for things other than “even better AI R&D”. At some point, you do want to solve \"everything else\", and not just keep \"solving intelligence\". Clearly, this *is* happening to some extent, but the new METR report doesn't update us much on this particular front.", "created_at": "2026-11-06T18:24:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 65, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2119006258506473743", "url": "https://x.com/mentalgeorge/status/2119006258506473743", "text": "New GovAI post: I argue Frontier AI companies should publish their third-party evaluation contracts. This would show the conditions evaluators work under, make results easier to interpret and compare, and create incentives to improve evaluation arrangements. \n\nMore in thread 🧵", "created_at": "2026-11-07T09:57:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "charnock_jacob", "rt_author_name": "Jacob Charnock", "rt_avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "rt_id": "2118747531626582480", "likes": 123, "retweets": 23, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "thread": [{"id": "2118747533816279228", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "2/7: Why do the contracts matter? AI companies increasingly rely on outside evaluators to check their safety claims. But an evaluation's reliability depends on the contract: what evaluators can access, what they can publish, how they're paid. Reports rarely describe such terms.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747533816279228", "created_at": "Fri Nov 06 16:49:11 +0000 2026"}, {"id": "2118747535716007951", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "3/7: What should be done? Companies and evaluators should publish full contracts, redacting only proprietary technical, security-sensitive and personal information.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747535716007951", "created_at": "Fri Nov 06 16:49:11 +0000 2026"}, {"id": "2118747538157433062", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "4/7: Failing full contract disclosure, both parties should disclose the terms most important for interpreting an evaluation -- such as, evaluation scope, access rights, publication, redaction, and escalation rights, compensation, independence requirements, and contract duration.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747538157433062", "created_at": "Fri Nov 06 16:49:12 +0000 2026"}, {"id": "2118747540749500595", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "5/7: What would this achieve? Readers could see the conditions evaluators worked under, making findings easier to interpret and compare. Where terms are poor, readers can weigh this when judging results, and push companies to improve them.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747540749500595", "created_at": "Fri Nov 06 16:49:12 +0000 2026"}, {"id": "2118747542548562423", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "6/7: What are the downsides? Strong terms could create false assurance if evaluators don't use their rights, and companies might grant less access if terms become public. The post argues both risks can be reduced and don't outweigh the benefits.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747542548562423", "created_at": "Fri Nov 06 16:49:13 +0000 2026"}, {"id": "2118747544238817354", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "Read the full post here: https://t.co/iJ3ulGDj2e", "links": {"https://t.co/iJ3ulGDj2e": "https://www.governance.ai/analysis/third-party-ai-evaluation-contracts-should-be-published"}, "media": [], "url": "https://x.com/charnock_jacob/status/2118747544238817354", "created_at": "Fri Nov 06 16:49:13 +0000 2026"}]}, {"id": "2119391530448236639", "url": "https://x.com/mentalgeorge/status/2119391530448236639", "text": "@CharlesD353 @tyler_m_john Oh yeah sorry I meant \"how do we know it hasn't gone up enough to explain the results \"? I saw that claim for training compute in the metr report but not experimental compute (clearly in some sense false for broad \"research compute\" as that includes internal inference)", "created_at": "2026-11-08T11:28:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "CharlesD353", "reply_to_id": "2119384669514801378", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119384669514801378", "author_handle": "CharlesD353", "author_name": "Charles🔸", "text": "@mentalgeorge @tyler_m_john It has, just insufficiently to explain the results", "links": {}, "media": [], "url": "https://x.com/CharlesD353/status/2119384669514801378", "created_at": "Sun Nov 08 11:00:56 +0000 2026"}}, {"id": "2119379127924899845", "url": "https://x.com/mentalgeorge/status/2119379127924899845", "text": "@tyler_m_john Wait how do we know research compute hasn't gone up?", "created_at": "2026-11-08T10:38:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "tyler_m_john", "reply_to_id": "2119296157406863510", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119296157406863510", "author_handle": "tyler_m_john", "author_name": "Tyler John", "text": "AI capabilities have recently progressed at 2x. But the growth rate in pre-training compute and research compute hasn't sped up, and ideas are getting harder to find. For 2x progress despite this you'd need around 10x research uplift! Great post.", "links": {}, "media": [], "url": "https://x.com/tyler_m_john/status/2119296157406863510", "created_at": "Sun Nov 08 05:09:13 +0000 2026"}}, {"id": "2119871750322401687", "url": "https://x.com/mentalgeorge/status/2119871750322401687", "text": "Who are @FrontierDesign2? One of 3 named external evaluators of Fable 5.2. Anyone know anything about them?", "created_at": "2026-11-09T19:16:25+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119867115968594305", "author_name": "Claude", "links": {}, "author": "claudeai", "text": "Fable 5.2 and Mythos 5.2 performed as well as, or better than, our recent models on most alignment measures.\n\nThe model was also tested before release by external evaluators, including the @AISecurityInst, @FrontierDesign2, and @METR_Evals."}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW", "links": {"https://t.co/L17XUQy6LW": ""}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/g3mj4saNLk": ""}, "enriched": 3}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/gBPmFTHxVr": "https://www.anthropic.com/research/provable-inference"}, "enriched": 3, "parent": {"id": "2117655352795906389", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "delightful https://t.co/IxKwgIYGSP", "links": {"https://t.co/IxKwgIYGSP": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "url": "https://x.com/ohlennart/status/2117655352795906389", "created_at": "Tue Nov 03 16:29:14 +0000 2026"}}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/IxKwgIYGSP": ""}, "enriched": 3, "thread": [{"id": "2117655397561778234", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "https://t.co/gBPmFTHxVr", "links": {"https://t.co/gBPmFTHxVr": "https://www.anthropic.com/research/provable-inference"}, "media": [], "url": "https://x.com/ohlennart/status/2117655397561778234", "created_at": "Tue Nov 03 16:29:25 +0000 2026"}]}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/vtdckMzcBP": "https://openai.com/index/ai-and-compute/"}, "enriched": 3, "parent": {"id": "2117686018019295435", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "links": {"https://t.co/oltWQ1cHEa": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "url": "https://x.com/ohlennart/status/2117686018019295435", "created_at": "Tue Nov 03 18:31:06 +0000 2026"}}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx", "links": {"https://t.co/KE6ef7LAFx": ""}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/oltWQ1cHEa": ""}, "enriched": 3, "thread": [{"id": "2117686020082897404", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "https://t.co/vtdckMzcBP", "links": {"https://t.co/vtdckMzcBP": "https://openai.com/index/ai-and-compute/"}, "media": [], "url": "https://x.com/ohlennart/status/2117686020082897404", "created_at": "Tue Nov 03 18:31:06 +0000 2026"}]}, {"id": "2117767075959845120", "url": "https://x.com/ohlennart/status/2117767075959845120", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-03T23:53:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/0pn81QXTKK": "https://www.anthropic.com/research/provable-inference"}, "enriched": 3}, {"id": "2118747991234302001", "url": "https://x.com/ohlennart/status/2118747991234302001", "text": "We spend a lot of time on the risks AI capabilities enable. Much less on how those capabilities change the work of addressing them.\n\nWe should take abundant AI-provided labor seriously. Work on the hardest problems, and steer toward where AI gives you massive uplift.", "created_at": "2026-11-06T16:51:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118797132597764145", "url": "https://x.com/ohlennart/status/2118797132597764145", "text": "export controls work.", "created_at": "2026-11-06T20:06:16+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 3, "media": [], "quoted": {"author": "EpochAIResearch", "text": "Huawei’s AI data center in Horinger, Inner Mongolia, is one of the largest in China by AI computing capacity. Yet it has just 7% as much computing capacity as the world’s largest AI data center, Colossus 2 in Tennessee.\n\nThis capacity estimate is from our new report examining the Horinger facility and Huawei’s broader AI infrastructure plans using satellite imagery and public sources.", "links": {}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2118788936621588708", "url": "https://x.com/ohlennart/status/2118788936621588708", "text": "can’t manage the flop if you don’t know where the flop goes.\n\ncompute allocation is one of the few things that’s both measurable and tells you what a company actually prioritizes. the share going to automated AI R&amp;D is basically the RSI speedometer.", "created_at": "2026-11-06T19:33:42+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 5, "media": [], "quoted": {"author": "Thomas_Woodside", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2119647241061429668", "url": "https://x.com/ohlennart/status/2119647241061429668", "text": "we spent years asking for USG visibility into AI chip shipments. turns out the MSS got there first.", "created_at": "2026-11-09T04:24:18+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2119567347589541956", "author_name": "Bill Bishop", "links": {}, "author": "niubi", "text": "On the Jensen Huang-Alice Huang affair, you have to give the MSS credit for running another successful op. They are good and getting better.\n\nI have seen some takes that it is no big deal he had an affair with an alleged PRC spy because he needed no pillow talk convincing to push for looser export controls, but that misses a few things:\n\nHe is (was?) text and phone buddies with President Trump, so if he divulged anything about his conversations with Trump to her, or his thoughts about Trump or chatter about China policy or frankly anything from Trump, that would be valuable to any foreign intelligence service, and especially to the MSS;\n\nWas she ever alone with his phone or computer, say when he got up to use the bathroom? Are Nvidia IT/device policies for travel to Taiwan and Singapore looser than those for travel to the mainland? What value would there be to the MSS to have physical access to the devices of the Nvidia CEO?;\n\nHe is the chip allocator in chief, so a good relationship with him likely meant more chips for the MegaSpeed front and the entities back in the PRC to which those chips flowed.\n\nWith the new Congress, expect subpoenas and public hearings in which he is trashed and he and Nvidia are further damaged. What a win for the MSS, to have such access to the head of the most important company in the world, and to now get to watch as politicians and shorts attack him and Nvidia.\n\nThere is rarely just one lie, so don’t be surprised if the blast radius from this mess expands. And there is already the SuperMicro case…"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119922506199126433", "url": "https://x.com/ohlennart/status/2119922506199126433", "text": "Tim Teter 👀", "created_at": "2026-11-09T22:38:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119911218110714042", "author_name": "Mackenzie Hawkins", "links": {"https://t.co/mNE4k7mnZ9": ""}, "author": "mackhawk", "text": "Before Nvidia's lawyer started emailing BIS staff about their Megaspeed investigation, he called Jeffrey Kessler, who runs BIS. He wanted to know whether BIS was involved in Singapore's recent detention of Alice Huang\n\nNvidia says Teter didn't know of the affair at the time https://t.co/mNE4k7mnZ9"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2117760736466252258", "url": "https://x.com/sayashk/status/2117760736466252258", "text": "Update: Can AI agents use Pangram to beat Pangram? In small tests, I found simple prompts to the Codex allowed it to beat Pangram. The final output was 100% human generated. Prompts that helped:\n\n- Have the agent develop a style guide based on past writing\n- Have it develop an \"anti-style guide\" based on AI writing tics that people have complained about \n- Instruct it to get to a seed sentence that Pangram doesn’t flag (or at least flags as AI-assisted rather than fully AI-generated). Then the agent knows what strategies work and can iterate from there", "created_at": "2026-11-03T23:28:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 195, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPHhLZX0AERJcF.jpg"}], "quoted": {"author": "random_walker", "text": "I tried exactly this back in February using Claude Code. It worked pretty easily, though ~all of the important ideas had to come from me and CC itself couldn't figure them out.*\n\nI tried it again a week ago. Complete failure, despite Claude being much better and not needing as much guidance from me. Pangram seems to have been dramatically hardened in the last few months. The API kept returning scores > 0.99 for AI writing so there wasn't even a gradient for it to figure out what's working and what isn't.\n\n* Things it couldn't figure out on its own a few months ago, even after a bunch of iterations:\n1) Remove well-known tells like em-dashes (!)\n2) Do controlled experiments instead of stuffing a bunch of ideas at once\n3) Start from known-best text and surgically make edits. Much better than trying to rewrite the whole essay (or even paragraphs or sentences) because the that just produces text from the LLM distribution all over again.\n\nIn my more recent experiment, 1) and 2) were obvious to Fable but 3) still wasn't. Pretty surprising.\n\nAnyway, hats off to @pangram. I'll probably give it another shot at some point but I'm more-or-less ready to change my mind as an AI-detection skeptic.\n\nThis was the LLM summary from my first experiment BTW. Still gives me a chuckle.", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2118419207394329056", "url": "https://x.com/sayashk/status/2118419207394329056", "text": "More details: https://t.co/EAC39nnMuA", "created_at": "2026-11-05T19:04:32+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "reply_to_id": "2118418574456852720", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/EAC39nnMuA": "https://cruxevals.com/research-notes/how-to-run-your-own-crux-style-experiments"}, "enriched": 3, "parent": {"id": "2118418574456852720", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "text": "Announcing CRUX-in-a-box: open-source infrastructure for running and monitoring weeks-long agent evaluations.\n\nWe built it over six months of long-horizon evaluations in CRUX, to keep runs repeatable, secure, and monitored. AI evaluators can now use it to:\n\n- Run agents on VMs for weeks\n- Use LLMs to flag risky actions for human review\n- Inspect tool calls, tokens, and spend\n- Set time and cost budgets\n- Chat with agents mid-run to give feedback or answer their questions\n\nIf you run long-horizon agent experiments, we might have solved some of the problems you will come across.  \n\nGitHub: https://t.co/V6y5YzamXa", "links": {"https://t.co/V6y5YzamXa": "https://github.com/sage-princeton/crux-in-a-box", "https://t.co/4A4LDAsD5x": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYhIxEXwAA3_wQ.jpg"}], "url": "https://x.com/sayashk/status/2118418574456852720", "created_at": "Thu Nov 05 19:02:01 +0000 2026"}}, {"id": "2118418574456852720", "url": "https://x.com/sayashk/status/2118418574456852720", "text": "Announcing CRUX-in-a-box: open-source infrastructure for running and monitoring weeks-long agent evaluations.\n\nWe built it over six months of long-horizon evaluations in CRUX, to keep runs repeatable, secure, and monitored. AI evaluators can now use it to:\n\n- Run agents on VMs for weeks\n- Use LLMs to flag risky actions for human review\n- Inspect tool calls, tokens, and spend\n- Set time and cost budgets\n- Chat with agents mid-run to give feedback or answer their questions\n\nIf you run long-horizon agent experiments, we might have solved some of the problems you will come across.  \n\nGitHub: https://t.co/V6y5YzamXa", "created_at": "2026-11-05T19:02:01+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 22, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYhIxEXwAA3_wQ.jpg"}], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/V6y5YzamXa": "https://github.com/sage-princeton/crux-in-a-box"}, "enriched": 3, "thread": [{"id": "2118419207394329056", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "text": "More details: https://t.co/EAC39nnMuA", "links": {"https://t.co/EAC39nnMuA": "https://cruxevals.com/research-notes/how-to-run-your-own-crux-style-experiments"}, "media": [], "url": "https://x.com/sayashk/status/2118419207394329056", "created_at": "Thu Nov 05 19:04:32 +0000 2026"}]}, {"id": "2118700394385666352", "url": "https://x.com/sayashk/status/2118700394385666352", "text": "No one can react the appropriate amount to the New METR Graph, because we have no evidence we can evaluate ourselves.\n\nHowever, one helpful bit in the report is when they leak three of the AECI basket of benchmarks: these at least are the usual weaksauce. An amazing mental effect https://t.co/jKN6z7ROqz", "created_at": "2026-11-06T13:41:52+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "gleech", "rt_author_name": "gavin leech (Non-Reasoning)", "rt_avatar": "https://pbs.twimg.com/profile_images/1513339291883212803/9m6waiws_normal.jpg", "rt_id": "2118643766760472859", "likes": 40, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbn5zwXgAAPmul.png"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/jKN6z7ROqz": ""}, "enriched": 3}, {"id": "2118413659395575985", "url": "https://x.com/testingham/status/2118413659395575985", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T18:42:29+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 64, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118535009921560678", "url": "https://x.com/testingham/status/2118535009921560678", "text": "@lugaricano https://t.co/nGcXTcHDQi\n\nhttps://t.co/eVSX8cZHw2\n\nhappy to point you to more resources if you're interested", "created_at": "2026-11-06T02:44:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118497857074581732", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/nGcXTcHDQi": "https://en.wikipedia.org/wiki/Item_response_theory", "https://t.co/eVSX8cZHw2": "https://epoch.ai/publications/a-rosetta-stone-for-ai-benchmarks"}, "enriched": 3, "parent": {"id": "2118497857074581732", "author_handle": "lugaricano", "author_name": "Luis Garicano 🇪🇺🇺🇦", "text": "This index is only a modelling convention. I cannot see how this scale means anything beyond the ordering: any monotone transformation will result in another valid scale in which the acceleration may increase, reverse or disappear. What am I missing?", "links": {}, "media": [], "url": "https://x.com/lugaricano/status/2118497857074581732", "created_at": "Fri Nov 06 00:17:03 +0000 2026"}}, {"id": "2118764612527259953", "url": "https://x.com/testingham/status/2118764612527259953", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 cool -- i think it's clear that IRT requires logistic, &amp; it sounds like you've simulated non-logistic distribution, but fortunately that assumption is at least partly testable (&amp; we test it)", "created_at": "2026-11-06T17:57:
