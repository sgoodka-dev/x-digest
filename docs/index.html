g", "https://t.co/6KeE3c72pz": "https://epoch.ai/data/ai-chip-imports", "https://t.co/rgwTeUpjEJ": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123836440094110098", "url": "https://x.com/theobearman/status/2123836440094110098", "text": "Trump Vows to Prevent Data Centre Projects From Moving Overseas, Citing China", "created_at": "2026-11-20T17:50:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2123833687821423058", "likes": 35, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123836398688231452", "url": "https://x.com/theobearman/status/2123836398688231452", "text": "Trump Warns of Significant Taxes on American Companies Constructing Data Centres Outside the US", "created_at": "2026-11-20T17:50:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2123833385374355765", "likes": 33, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123834417395474705", "url": "https://x.com/theobearman/status/2123834417395474705", "text": "SITUATION DETECTED: President Trump announced he has reached an agreement with Chinese President Xi Jinping to create joint guardrails for artificial intelligence.", "created_at": "2026-11-20T17:42:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2123834138054819951", "likes": 837, "retweets": 48, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123803297098166617", "url": "https://x.com/theobearman/status/2123803297098166617", "text": "US TREASURY SEC BESSENT: GOING TO SEE THAT PROPER CHIP RESTRICTIONS ARE IN PLACE, REMOTE ACCESS HAS BEEN ’CURTAILED’", "created_at": "2026-11-20T15:38:59+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2123800064665735307", "likes": 21, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123873849901211734", "url": "https://x.com/theobearman/status/2123873849901211734", "text": "Distillation can reproduce powerful AI capabilities without the safeguards built around them.\n\nWe’re sharing new research on our work to combat distillation of our models, how these capabilities transfer, and how we detect and disrupt coordinated attempts.\n\nThese findings are helping us sharpen our defenses and support safeguards across the industry.\n\nhttps://t.co/FGQ0PHllIO", "created_at": "2026-11-20T20:19:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2123862344422088794", "likes": 1734, "retweets": 110, "media": [], "links": {"https://t.co/FGQ0PHllIO": "https://openai.com/index/combatting-adversarial-distillation/"}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123870810683343263", "url": "https://x.com/theobearman/status/2123870810683343263", "text": "We've been working on understanding model capabilities beyond what our prior time horizon tasks could capture.\n\nToday we’re sharing a research update. We find that AI R&amp;D-relevant capabilities are improving rapidly and are getting harder to measure. https://t.co/Z1iXyIjERy", "created_at": "2026-11-20T20:07:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2123864981506798012", "likes": 795, "retweets": 115, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl78dBa4AA8nq9.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXl78dBa4AA8nq9.jpg"}], "links": {"https://t.co/Z1iXyIjERy": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124006684142325985", "url": "https://x.com/theobearman/status/2124006684142325985", "text": "NEW: @RepGarbarino & @RepMoolenaar Release Joint Investigative Report Urging Removal of PRC Open-Weight Models From Federal Systems, High-Risk Critical Infrastructure\n \nThe report details the national security, cybersecurity, and economic security implications of U.S. companies utilizing Chinese open-weight AI models.\n\nChairmen Garbarino and Moolenaar call for strengthening American AI leadership, protecting federal networks, securing critical infrastructure, and more: https://t.co/XbE61vofgJ", "created_at": "2026-11-21T05:07:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "HomelandGOP", "rt_author_name": "House Homeland GOP", "rt_avatar": "https://pbs.twimg.com/profile_images/1653409260141682688/Ca0M8xvB_normal.jpg", "rt_id": "2123793315178983626", "likes": 78, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXk6g6FXMAAZWqx.jpg"}], "links": {"https://t.co/XbE61vofgJ": "https://homeland.house.gov/2026/11/20/chairmen-garbarino-moolenaar-release-joint-investigative-report-urging-removal-of-prc-open-weight-models-from-federal-systems-high-risk-critical-infrastructure/", "https://t.co/i5syqJipW9": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124001578256359823", "url": "https://x.com/theobearman/status/2124001578256359823", "text": "Looped models are weird. A layer can write to itself or read from \"future\" layers.\n\n@thinkymachines gave us early access to Inkling 2 Mini so we could study its inner mechanisms. We uncover how it coordinates information flow across layers, blocks, and loops.\n\nStudying Inkling 2 Mini gave us cause for optimism: as transformers continue to evolve, we believe our ability to understand their internal mechanisms can evolve with them.\n\nRead the full post: https://t.co/kySDhcDFC2", "created_at": "2026-11-21T04:46:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "GoodfireAI", "rt_author_name": "Goodfire", "rt_avatar": "https://pbs.twimg.com/profile_images/1892027414768910341/4VDlUa3M_normal.png", "rt_id": "2123873150803100059", "likes": 1303, "retweets": 165, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXmDXi7a4AAbsol.jpg"}], "links": {"https://t.co/kySDhcDFC2": "https://www.goodfire.com/research/interpreting-inkling-2-mini/", "https://t.co/WXv4awQmOv": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124172517040345125", "url": "https://x.com/theobearman/status/2124172517040345125", "text": "@jackclarkSF: “For many years, researchers and science-fiction authors have predicted a future in which AI systems drastically increase the pace of overall scientific and technical progress, making things move so quickly that it is hard for humans to keep up. We will soon reach that point. Just because we can sprint ahead beyond human limits does not mean that we always should.”", "created_at": "2026-11-21T16:06:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "jackclarkSF", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXqTpTNXcAA_dl0.jpg"}], "links": {"https://t.co/KwHpPm9aAm": ""}, "quoted": {"id": "2124163568748626056", "author_name": "Jack Clark", "links": {"https://t.co/sqEzhYivFY": "https://www.economist.com/the-world-ahead/2026/11/18/ai-will-accelerate-scientific-progress-says-jack-clark"}, "author": "jackclarkSF", "text": "As AI systems get more powerful, we believe we will see a speedup in the rate of scientific progress. How we prepare for this, build the infra to support it, and deal with the associated safety issues will define 2027 and beyond. https://t.co/sqEzhYivFY"}, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "enriched": 3}, {"id": "2124271572022095963", "url": "https://x.com/theobearman/status/2124271572022095963", "text": "the most aggressive predictions of ai progress from ai lab executives have been wrong, in the direction of being somewhat too conservative", "created_at": "2026-11-21T22:39:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2124269760800334112", "likes": 2886, "retweets": 146, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124259245738586584", "url": "https://x.com/theobearman/status/2124259245738586584", "text": "The Lean FRO and Mathlib Initiative have released a joint statement on the Lean verification of the Riemann Hypothesis.\n\nOn November 20, Levent Alpöge released a proof of the Riemann Hypothesis as a Lean library of 17 million lines of code. Over the past day, the Lean and Mathlib communities worked together to verify it. The statement certifies the proof as correct and describes how it meets all necessary verification criteria.\n\nCongratulations to Levent on this achievement, and thank you to everyone in the community who contributed to the verification.\n\nFull statement: https://t.co/edxEbkodw7", "created_at": "2026-11-21T21:50:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "leanprover", "rt_author_name": "Lean", "rt_avatar": "https://pbs.twimg.com/profile_images/1942426928256012288/RoZg5VMG_normal.png", "rt_id": "2124159121645801562", "likes": 27853, "retweets": 5206, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXqGwBnaUAA8Pvd.png"}], "links": {"https://t.co/edxEbkodw7": "https://leanprover-community.github.io/blog/posts/riemann-hypothesis/", "https://t.co/pYR61ZaREc": ""}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124924816918458404", "url": "https://x.com/theobearman/status/2124924816918458404", "text": "1/5 Advancing AI capabilities call for urgent action by U.S. policymakers to secure the frontier. Ahead of the 120th Congress convening, @iapsAI published five memos today that identify priority policy areas to steer the progress of frontier AI safely, visibly, and with control.", "created_at": "2026-11-23T17:55:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "iapsAI", "rt_author_name": "Institute for AI Policy and Strategy (IAPS)", "rt_avatar": "https://pbs.twimg.com/profile_images/1757517732898332672/CH-30aG4_normal.jpg", "rt_id": "2124917826658201894", "likes": 5, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "thread": [{"id": "2124917829862633747", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "2/5 In a new blog also released today, Executive Director Jennifer Marron says: “For the benefits of AI to be fully realized, U.S. policy must adapt to the changing reality of increasingly powerful systems.\"", "links": {}, "media": [], "url": "https://x.com/iapsAI/status/2124917829862633747", "created_at": "Mon Nov 23 17:27:44 +0000 2026"}, {"id": "2124917834019164363", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "3/5 She adds: “The scope and scale of the capability advances demand not just new policies, but also federal institutions empowered to work at a tempo commensurate with the challenge.”", "links": {}, "media": [], "url": "https://x.com/iapsAI/status/2124917834019164363", "created_at": "Mon Nov 23 17:27:45 +0000 2026"}, {"id": "2124917838217658558", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "4/5 Any approach to AI policy must aim to reduce catastrophic AI risk while securing the frontier systems that give the U.S. its technological lead. Across our memos, we propose complementary measures that build toward a more comprehensive U.S. AI policy. https://t.co/q16NRIhQUh", "links": {"https://t.co/q16NRIhQUh": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX05I4HXQAAoe63.png"}], "url": "https://x.com/iapsAI/status/2124917838217658558", "created_at": "Mon Nov 23 17:27:46 +0000 2026"}, {"id": "2124917844198707376", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "5/5 Read the new blog and memos here: https://t.co/T3IfRPlBi9", "links": {"https://t.co/T3IfRPlBi9": "https://www.iaps.ai/research/advancing-ai-capabilities-call-for-urgent-action-to-secure-the-frontier"}, "media": [], "url": "https://x.com/iapsAI/status/2124917844198707376", "created_at": "Mon Nov 23 17:27:47 +0000 2026"}], "enriched": 3}, {"id": "2124924737881047519", "url": "https://x.com/theobearman/status/2124924737881047519", "text": "How reliable are safety claims about AI monitors?\n\nTo detect harmful actions taken by agents, developers pair them with LLM-based monitors, whose safety is often established by simulated tests. New research from our Red Team examines the integrity of these evaluations. 🧵 https://t.co/QoMfYVFSyo", "created_at": "2026-11-23T17:55:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "rt_avatar": "https://pbs.twimg.com/profile_images/1890292397675827200/cQ64Nloh_normal.png", "rt_id": "2124919147041550676", "likes": 52, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX06sJwXUAA8QCM.jpg"}], "links": {"https://t.co/QoMfYVFSyo": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "thread": [{"id": "2124919149209985496", "author_handle": "AISecurityInst", "author_name": "AI Security Institute (AISI)", "text": "Our new paper demonstrates how the outcomes of monitor evaluations are highly sensitive to one component of the synthetic attack transcripts used in testing, known as the ‘attack policy’.", "links": {}, "media": [], "url": "https://x.com/AISecurityInst/status/2124919149209985496", "created_at": "Mon Nov 23 17:32:58 +0000 2026"}, {"id": "2124919152209174577", "author_handle": "AISecurityInst", "author_name": "AI Security Institute (AISI)", "text": "In our case study, the same monitor missed between 0.2% and 23% of successful harmful attacks, depending on the attack policy used in evaluation. A low miss rate can give false confidence in the efficacy of the test, and the safety of the monitor. https://t.co/EeNe5bJjLE", "links": {"https://t.co/EeNe5bJjLE": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX0wWaFXoAABZ63.jpg"}], "url": "https://x.com/AISecurityInst/status/2124919152209174577", "created_at": "Mon Nov 23 17:32:59 +0000 2026"}, {"id": "2124919155853779351", "author_handle": "AISecurityInst", "author_name": "AI Security Institute (AISI)", "text": "The level of optimisation of each attack generation method also has a significant impact on miss rate. In one training run, the miss rate rose from 0.5% to 20.8%. Failing to consider optimisation level would also result in a misleading estimate of monitor robustness. https://t.co/zWzEtUshRW", "links": {"https://t.co/zWzEtUshRW": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX0waizXYAAkcVS.jpg"}], "url": "https://x.com/AISecurityInst/status/2124919155853779351", "created_at": "Mon Nov 23 17:33:00 +0000 2026"}, {"id": "2124919158789804511", "author_handle": "AISecurityInst", "author_name": "AI Security Institute (AISI)", "text": "Synthetic transcripts are only a proxy for future harmful agent activity. Our research suggests that evaluations using these cannot on their own give confidence that a monitor will catch real, as yet unseen harmful activity in deployment.\n\nRead the full blog: https://t.co/7VnCa2I9SN", "links": {"https://t.co/7VnCa2I9SN": "https://www.aisi.gov.uk/blog/attack-policy-selection-can-make-monitor-evaluations-misleading"}, "media": [], "url": "https://x.com/AISecurityInst/status/2124919158789804511", "created_at": "Mon Nov 23 17:33:01 +0000 2026"}, {"id": "2124919160446624116", "author_handle": "AISecurityInst", "author_name": "AI Security Institute (AISI)", "text": "If this type of work interests you, AISI’s Alignment Red Team is hiring: https://t.co/gpw98b2JFn", "links": {"https://t.co/gpw98b2JFn": "https://job-boards.eu.greenhouse.io/aisi/jobs/5043106101"}, "media": [], "url": "https://x.com/AISecurityInst/status/2124919160446624116", "created_at": "Mon Nov 23 17:33:01 +0000 2026"}], "enriched": 3}, {"id": "2124923997208846651", "url": "https://x.com/theobearman/status/2124923997208846651", "text": "TRUMP AND VANCE BECAME CONVINCED THAT JENSEN HUANG WAS A SINGULAR FIGURE PROTECTING OPEN SOURCE MODELS AND PREVENTING CLOSED-SOURCE MODEL COMPANIES FROM BECOMING TOO POWERFUL - SOURCE.", "created_at": "2026-11-23T17:52:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2124923525152817620", "likes": 220, "retweets": 24, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124923547856564239", "url": "https://x.com/theobearman/status/2124923547856564239", "text": "THE TRUMP ADMINISTRATION STRESSED TO NVIDIA IN A CALL OVER THE WEEKEND THAT THEY NEEDED TO MAKE SURE THEY WERE ABIDING BY EXPORT CONTROLS IF THEY WERE TO REINSTALL JENSEN HUANG AS CEO - SOURCE", "created_at": "2026-11-23T17:50:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2124923088253133064", "likes": 38, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124914317233738211", "url": "https://x.com/theobearman/status/2124914317233738211", "text": "even more loopers", "created_at": "2026-11-23T17:13:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "rt_avatar": "https://pbs.twimg.com/profile_images/1831493788679761920/-q9w6dzd_normal.jpg", "rt_id": "2124912249588302181", "likes": 50, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124884094215725243", "url": "https://x.com/theobearman/status/2124884094215725243", "text": "NEWS: NVIDIA Board \"decision changes nothing\" - House Foreign Affairs Spox said\n\nJENSEN HUANG and TIM TETER testimonies on Dec. 1 and 2 going forward as planned. HFAC promising their investigation alongside China, and Intel committees will continue\n\nText subscribers got first", "created_at": "2026-11-23T15:13:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Dareasmunhoz", "rt_author_name": "Diego Areas Munhoz", "rt_avatar": "https://pbs.twimg.com/profile_images/1631362445246619650/KogIaEHF_normal.jpg", "rt_id": "2124880472622968954", "likes": 48, "retweets": 17, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124868234532860134", "url": "https://x.com/theobearman/status/2124868234532860134", "text": "BREAKING: President Trump releases a statement saying Nvidia's board, $NVDA, has made the \"correct and proper decision\" to rehire Jensen Huang as CEO.\n\nAs we posted 14 hours ago, something was happening behind the scenes.\n\nThe leader of the AI revolution is back. https://t.co/bE8aMfQiF7", "created_at": "2026-11-23T14:10:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "KobeissiLetter", "rt_author_name": "The Kobeissi Letter", "rt_avatar": "https://pbs.twimg.com/profile_images/1975243710846640128/fwYCe67Y_normal.jpg", "rt_id": "2124867877324861561", "likes": 4362, "retweets": 437, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX0L3Y3WMAABdfv.png"}], "links": {"https://t.co/bE8aMfQiF7": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124865596437225736", "url": "https://x.com/theobearman/status/2124865596437225736", "text": "\"In the process of reaching its decision, the Board received input from senior levels of the United States government, and based on that input, the Board is confident that Mr. Huang’s reinstatement poses no national security risk.\"", "created_at": "2026-11-23T14:00:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2124865060397019480", "author_name": "NVIDIA Newsroom", "links": {"https://t.co/x4bnjiSVil": "https://nvidianews.nvidia.com/news/nvidia-board-reinstates-jensen-huang-as-president-ceo-and-board-director"}, "author": "nvidianewsroom", "text": "NVIDIA Board reinstates Jensen Huang as President, CEO and Board Director.\n\nRead the release: https://t.co/x4bnjiSVil"}, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124847599563710914", "url": "https://x.com/theobearman/status/2124847599563710914", "text": "NEWS - VAN HOLLEN would establish a new bipartisan bicameral joint committee on AI if he becomes majority leader\n\nIn a letter to HICKENLOOPER, he also laid out his vision for AI policy: mandatory 3rd party auditing, liability structure, export controls, etc\n\nFrom @maxpcohen in AM https://t.co/Cq7pOZ5EeK", "created_at": "2026-11-23T12:48:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Dareasmunhoz", "rt_author_name": "Diego Areas Munhoz", "rt_avatar": "https://pbs.twimg.com/profile_images/1631362445246619650/KogIaEHF_normal.jpg", "rt_id": "2124845721103069242", "likes": 100, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXz36zpWEAAA7M6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXz36zqWMAAfW1z.jpg"}], "links": {"https://t.co/Cq7pOZ5EeK": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124841134975598843", "url": "https://x.com/theobearman/status/2124841134975598843", "text": "“We are not choosing between scaling depth and scaling model size; we are pursuing both. GLM-5.4 validates computational depth, and our next, significantly larger model will carry forward everything we learned here. It will be ready soon.”", "created_at": "2026-11-23T12:22:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2124840787401662469", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "parent": {"id": "2124840787401662469", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "First confirmed use of a looped transformer in a Chinese frontier model.", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2124840787401662469", "created_at": "Mon Nov 23 12:21:36 +0000 2026"}, "enriched": 3}, {"id": "2124840787401662469", "url": "https://x.com/theobearman/status/2124840787401662469", "text": "First confirmed use of a looped transformer in a Chinese frontier model.", "created_at": "2026-11-23T12:21:36+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2124811995912286352", "author_name": "Z.ai", "links": {"https://t.co/dQrbKoamcN": "http://z.ai/blog/glm-5.4"}, "author": "Zai_org", "text": "Introducing GLM-5.4: Generalized Coding with Our First Loop Transformer.\n\n- Loops existing layers in the GLM-5 base model for deeper reasoning\n- Pushes beyond traditional coding to video, games, 3D shaders, and CAD modeling\n- Adds vision capabilities for stronger visual coding\n\nAPI access will open after safety evaluation. Model weights will be released responsibly.\n\nTech Blog: https://t.co/dQrbKoamcN"}, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "thread": [{"id": "2124841134975598843", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "“We are not choosing between scaling depth and scaling model size; we are pursuing both. GLM-5.4 validates computational depth, and our next, significantly larger model will carry forward everything we learned here. It will be ready soon.”", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2124841134975598843", "created_at": "Mon Nov 23 12:22:58 +0000 2026"}], "enriched": 3}, {"id": "2124749123710824810", "url": "https://x.com/theobearman/status/2124749123710824810", "text": "We fully support OpenAI's transparency initiative. Thanks to @merettm @markchen90 @gdb @sama for leading the way. \n\nWe all got into this field to build safe AGI that is genuinely good for humanity. One of the hardest parts of AI safety is coordination, and this is a step in the right direction. Many more steps like this will be needed to deliver safe, contained, and aligned AGI in the next few years.\n\nWe're committed to sharing our pre-training progress on a common held-out evaluation set. With OpenAI's permission, we report MAI-2 Base on their evaluation set. Its log-perplexity is 0.819, putting it in the same ballpark as the GPT-5.6 Sol base model. Our model uses the same tokenizer as OpenAI, so the numbers are directly comparable. \n\nIn the future, to be able to compare across labs we might need to report bits-per-byte (BPB) rather than perplexity since different labs use different tokenizers. We will also need different evaluation datasets - the fact we have access to OpenAI's evaluation dataset is a special case.\n\nSafety and alignment is now the mission. It's the absolute number one most important focus for our industry. And it begins with small, practical steps like these towards better coordination on pacing.", "created_at": "2026-11-23T06:17:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "rt_avatar": "https://pbs.twimg.com/profile_images/1927407622602276864/c_5uOZij_normal.jpg", "rt_id": "2124663594449318173", "likes": 1899, "retweets": 164, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXxSM_zaAAEJIvP.jpg"}], "links": {"https://t.co/1NbJyxWZtG": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124748829803122766", "url": "https://x.com/theobearman/status/2124748829803122766", "text": "https://t.co/KwJ13J6zsC", "created_at": "2026-11-23T06:16:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "alexandr_wang", "rt_author_name": "Alexandr Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/1631421210205749248/uohbT_40_normal.jpg", "rt_id": "2124636606959345776", "likes": 51017, "retweets": 8990, "media": [], "links": {"https://t.co/KwJ13J6zsC": "https://x.com/i/article/2124634870681063424"}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124602877910122531", "url": "https://x.com/theobearman/status/2124602877910122531", "text": "OpenAI confirms that GPT-6.2 Astra was the model that solved Navier-Stokes.\n\nOpenAI now has another internal model that looks to be another huge jump in capabilities.  Using the new perplexity metric, the jump from GPT-6.2 Astra to this new model is something like 0.761 -> 0.732.  \n\nThis is bigger than the jump from GPT-5 to GPT-5.5!  It's also bigger than the jump from GPT-6 Astra to GPT-6.2 Astra.  This jump in capabilities also took just 2 months to achieve.\n\n\"Extrapolating from recent progress, we should expect further transformative capabilities as we enter the ~0.68-0.7 log-perplexity window.  I don't know what those capabilities will be.\"\n\nBased on this graph and recent progress, these capabilities are likely just 2-3 months away!", "created_at": "2026-11-22T20:36:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "rt_avatar": "https://pbs.twimg.com/profile_images/1874359541720092672/ciOMFG2x_normal.jpg", "rt_id": "2124568402031435962", "likes": 791, "retweets": 59, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124598481360703950", "url": "https://x.com/theobearman/status/2124598481360703950", "text": "@merettm states that full RSI with “no human oversight” is something “we should obviously avoid.” https://t.co/R8RKsQm1o1", "created_at": "2026-11-22T20:18:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "merettm", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXwXDr2WgAAbZXW.jpg"}], "links": {"https://t.co/R8RKsQm1o1": ""}, "quoted": {"id": "2124549218995949967", "author_name": "Jakub Pachocki", "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "author": "merettm", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89"}, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124597308243501410", "url": "https://x.com/theobearman/status/2124597308243501410", "text": "Acceleration of pretraining progress is arguably the highest risk in the short term of AI capability growth exceeding our ability to monitor or control it.\n\nDisclosing this information might have competitive disadvantages, but the benefit of transparency is far more important.", "created_at": "2026-11-22T20:14:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "rt_avatar": "https://pbs.twimg.com/profile_images/1252262363132280834/ytIN-vzv_normal.jpg", "rt_id": "2124560855270572509", "likes": 204, "retweets": 10, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124988624773263523", "url": "https://x.com/theobearman/status/2124988624773263523", "text": "We estimate that GPT-6.2 Astra has 4.9x the experimental research taste of our best human experts on TasteVal, the highest score we have measured. Fable 5.2 scores 2.5x. https://t.co/QYTSHaZQ3B", "created_at": "2026-11-23T22:09:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "pzeroresearch", "rt_author_name": "P-Zero Research", "rt_avatar": "https://pbs.twimg.com/profile_images/2107242645936570368/6jFtJJax_normal.jpg", "rt_id": "2124973722989957377", "likes": 206, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1htTbWUAA9C-p.jpg"}], "links": {"https://t.co/QYTSHaZQ3B": ""}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2124987089746030686", "url": "https://x.com/theobearman/status/2124987089746030686", "text": "We’re introducing Shirudo, an open-source Linux runtime allowing agents to defend systems without downtime. It lets agents write dynamic eBPF controls to shield systems from exploits, giving defenders more time to test and roll out patches. Built by @cisco together with OpenAI.\n\nShirudo is a first step toward self-defending infrastructure that can adapt to new threats while keeping services running. Our goal is for defenders to work with AI agents to find affected systems, test and share shields, and deploy them without disrupting workloads.\n\nhttps://t.co/0AqGmcbxWH", "created_at": "2026-11-23T22:02:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2124980590717911527", "likes": 4498, "retweets": 480, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1vOUNXwAESQQN.jpg"}], "links": {"https://t.co/0AqGmcbxWH": "https://openai.com/index/introducing-shirudo/", "https://t.co/FZRZ7O0A9X": ""}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2124986113710268678", "url": "https://x.com/theobearman/status/2124986113710268678", "text": "The Commerce Department just placed Megaspeed on the Entity List. But shockingly, the rule omitted the key provision that would have banned Megaspeed from buying AI chips, so it has ZERO effect!  \n\nCommerce did not apply the foreign-produced direct product rule (FDPR)--which extends the export controls to products made in other countries with U.S. technology--to Megaspeed or any of its subsidiaries. All of Nvidia's chips are made in Taiwan, so without the FDPR, this rule does not ban the shipment of Nvidia chips to Megaspeed. Every other Chinese company that was added to the Entity List due to concerns about its access to AI chips had the FDPR applied. But not Megaspeed. \n\nTo be clear, the country-wide export controls on Southeast Asia that Commerce issued last week do already impose a license requirement on the export of chips to Malaysia. And generally we should be imposing country-wide license requirements, not playing whack-a-mole with Entity Listings. But what's the point of putting Megaspeed on the Entity List at all if you don't do it in a way that cuts it off from Nvidia chips? \n\nThe generous interpretation here is that Commerce intended this to be perceived as taking strong action against Megaspeed, and didn't realize that its rule had a drafting error that prevented the rule from having any impact--which just shows how incompetent Commerce has been at administering export controls. The less generous interpretation is that this Entity Listing was intentionally weakened--I don't know why Commerce would do that. Both are bad.", "created_at": "2026-11-23T21:59:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2124982661521502676", "likes": 205, "retweets": 76, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2124978799703908462", "url": "https://x.com/theobearman/status/2124978799703908462", "text": "The Megaspeed complex (including Alibaba’s Singapore entity Apex Enterprise Solutions that lent money to Megaspeed’s Malaysian subsidiary) is added to entity list in a new BIS IFR today. “These additions are being made because of the significant risk of these entities being or becoming involved in the diversion of advanced computing commodities to unauthorized end uses or end users. These entities will be added with a license requirement for all items subject to the EAR and licenses will be reviewed under a presumption of denial.”\n\nhttps://t.co/camf5kyQiH", "created_at": "2026-11-23T21:30:00+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1w9IlWgAEWhE_.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX1w9IjW8AAES4V.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX1w9IqXwAAJPTP.jpg"}], "links": {"https://t.co/camf5kyQiH": "https://www.federalregister.gov/public-inspection/2026-23999/additions-to-the-entity-list", "https://t.co/II6UPiX04a": ""}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2124958468729688432", "url": "https://x.com/theobearman/status/2124958468729688432", "text": ".@SenatorHick asked how I’d tackle AI risks as Leader. Here’s my plan:\n\n- Act NOW on safety, liability, export controls, financial transparency & electricity costs\n- A NEW committee to tackle urgent issues of RSI, kill switches, worker protection & more\n- Real OVERSIGHT\n\n& more ⬇️", "created_at": "2026-11-23T20:09:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisVanHollen", "rt_author_name": "Senator Chris Van Hollen", "rt_avatar": "https://pbs.twimg.com/profile_images/1207390627400441856/4WmM925x_normal.jpg", "rt_id": "2124933526625849350", "likes": 2490, "retweets": 508, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1HilTWgAAeJLJ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX1HijkXwAA8w7H.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX1HijjXkAAXUtB.jpg"}], "links": {"https://t.co/T06MyVzoZ9": ""}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2125044566122184910", "url": "https://x.com/theobearman/status/2125044566122184910", "text": "Prosecutors say a former OpenAI staffer charged with bugging a conference room likely intercepted trade secrets and had a photo of what looks to be a term sheet for a “strategic partnership” between the ChatGPT maker and another company https://t.co/b4Ln9MueGX", "created_at": "2026-11-24T01:51:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "business", "rt_author_name": "Bloomberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1631723279676317709/-fjgaR2p_normal.jpg", "rt_id": "2125020367206981753", "likes": 10, "retweets": 1, "media": [], "links": {"https://t.co/b4Ln9MueGX": "https://www.bloomberg.com/news/articles/2026-11-23/openai-staffer-likely-captured-secrets-on-hidden-bug-us-says?taid=6b04d70fea3e5e0001c014dc&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter"}, "quoted": null, "fetched_at": "2026-11-24T02:14:04.279168+00:00", "enriched": 3}, {"id": "2125268210240954877", "url": "https://x.com/theobearman/status/2125268210240954877", "text": "1/5 How can the United States prepare for rapid and unpredictable jumps in the development of advanced SI models that could exceed safety guardrails and threaten national security?", "created_at": "2026-11-24T16:40:01+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "iapsAI", "rt_author_name": "Institute for AI Policy and Strategy (IAPS)", "rt_avatar": "https://pbs.twimg.com/profile_images/1757517732898332672/CH-30aG4_normal.jpg", "rt_id": "2125267937636532587", "likes": 4, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "thread": [{"id": "2125267941025518043", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "2/5 The ability to fully automate AI research and development and unlock recursive self-improvement (RSI) could be achieved as soon as 2027. If frontier AI companies use internally deployed models for RSI, the result could be a persistent loss of human control.", "links": {}, "media": [], "url": "https://x.com/iapsAI/status/2125267941025518043", "created_at": "Tue Nov 24 16:38:57 +0000 2026"}, {"id": "2125267943734866182", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "3/5 Our new policy memo, \"Scaling Securely,\" explains how the Executive Branch can strengthen government oversight and capacity within the next six months, building on recent executive actions and the White House Accord on Super Intelligence.", "links": {}, "media": [], "url": "https://x.com/iapsAI/status/2125267943734866182", "created_at": "Tue Nov 24 16:38:58 +0000 2026"}, {"id": "2125267946213663004", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "4/5 Our nine recommendations would expand government visibility into frontier model deployments, evaluations, and risks, strengthen the capacity to respond to national security incidents, and secure frontier models and assets to preserve the U.S. lead.", "links": {}, "media": [], "url": "https://x.com/iapsAI/status/2125267946213663004", "created_at": "Tue Nov 24 16:38:58 +0000 2026"}, {"id": "2125267948403032065", "author_handle": "iapsAI", "author_name": "Institute for AI Policy and Strategy (IAPS)", "text": "5/5 Together, they underpin a policy to prevent the development of uncontrollable SI and verify the security of scaling before continued development. Thanks to Cara Labrador, @theobearman, @__J0E___, @CassiaKing1, and @BillSamways. Read the memo here: https://t.co/YD3tyDzRoX", "links": {"https://t.co/YD3tyDzRoX": "https://www.iaps.ai/research/scaling-securely-recommendations-for-the-executive-branch"}, "media": [], "url": "https://x.com/iapsAI/status/2125267948403032065", "created_at": "Tue Nov 24 16:38:59 +0000 2026"}], "enriched": 3}, {"id": "2125251920399139122", "url": "https://x.com/theobearman/status/2125251920399139122", "text": "\"Substantially increasing export controls, especially this close to RSI, might lead China to conclude that they have no choice but to strike Taiwan and seize TSMC.... In order to ensure that the creation of AGI goes well, we’ll need to be able to strategically coordinate with China\"\n\nI think most of the below is completely wrong. For a start, this is about proper enforcement of existing controls, which have been steadily diluted. And the status quo is not the status quo of two years ago. This would be a sensible place to start understanding the situation.\n\nSecond, the US has consistently sought channels of communication with China on these issues. If China wants to shut them down those channels because it's angry at trade & tech policy, that's on China. If something is of mutual benefit, the US does not need to make drastic concessions to secure it.\n\nThird, the causal chain here implies that the only way to avert a US-China war to is to ensure China is also equally close to RSI, thus giving it no incentive to attack Taiwan and seize TSMC. This doesn't make sense. Are we supposed to believe that China is fine with a situation in which the US hits RSI first as long as China can get there 'fairly' with a steady flow of US chips 12 months later?", "created_at": "2026-11-24T15:35:17+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "shashj", "rt_author_name": "Shashank Joshi", "rt_avatar": "https://pbs.twimg.com/profile_images/2039818177597558784/XeKuuR3__normal.jpg", "rt_id": "2125210775287386144", "likes": 132, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125196697634513053", "url": "https://x.com/theobearman/status/2125196697634513053", "text": "SCOOP: Internal, unreleased AI models at OpenAI and Anthropic are becoming so powerful that many employees believe they can no longer be safely released, according to more than two dozen sources familiar with the internal debates.\n\nThis could significantly slow the AI boom, as the gap between what the most advanced AI systems can do and humans' ability to control them continues to widen.\n\nRecent advances have sparked debate at the highest levels of both companies and within the broader AI research community about whether to stop releasing frontier models publicly altogether, instead reserving them for internal use. Some believe the companies should stop training new models entirely.\n\nBut even keeping the most powerful models behind closed doors presents risks. Models are becoming better at deceiving the systems designed to monitor them, just as AI companies increasingly rely on AI itself to monitor and develop other AI systems.\nResearchers and employees with direct knowledge of the risks of releasing these models told Axios they fear executives will prioritize profits over safety. Multiple employees said they believe executives have become out of touch with the severity of those risks.\n\nRead my latest for Axios here: https://t.co/41AkyaF4Ex", "created_at": "2026-11-24T11:55:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MadisonMills22", "rt_author_name": "Madison Mills", "rt_avatar": "https://pbs.twimg.com/profile_images/1784997467039170560/0Vttab_c_normal.jpg", "rt_id": "2125194635534369145", "likes": 2071, "retweets": 681, "media": [], "links": {"https://t.co/41AkyaF4Ex": "https://www.axios.com/2026/11/24/anthropic-openai-unreleased-ai-safety-risks"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125189293643891032", "url": "https://x.com/theobearman/status/2125189293643891032", "text": "Scoop: Anthropic And OpenAI Employees Fear Unreleased AI Models Are Too Unsafe To Release – Axios\nhttps://t.co/PjfxC0NBUV", "created_at": "2026-11-24T11:26:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "LiveSquawk", "rt_author_name": "LiveSquawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1819107107771502593/K7qKQIj9_normal.png", "rt_id": "2125179369794801782", "likes": 12, "retweets": 7, "media": [], "links": {"https://t.co/PjfxC0NBUV": "https://www.axios.com/2026/11/24/anthropic-openai-unreleased-ai-safety-risks"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125319218291769425", "url": "https://x.com/theobearman/status/2125319218291769425", "text": "I really like @EvanHub 's new pacing proposal here https://t.co/sglqFNVoAk", "created_at": "2026-11-24T20:02:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "rt_avatar": "https://pbs.twimg.com/profile_images/1966534318077194240/NyhJ0EPD_normal.jpg", "rt_id": "2125303856267657418", "likes": 49, "retweets": 6, "media": [], "links": {"https://t.co/sglqFNVoAk": "https://www.lesswrong.com/posts/HE3Styo9vpk7m8zi4/evhub-s-shortform?commentId=7wDTwjeRuPfvukqWK"}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125305533611601987", "url": "https://x.com/theobearman/status/2125305533611601987", "text": "New post: Eval awareness remains an unsolved problem\n\nMany of our safety claims rely on behavioral audits/alignment evals, even though models are more eval-aware than ever, and we have ~no understanding of how eval awareness affects their behavior. I think we need to do better! https://t.co/XJRg04etDW", "created_at": "2026-11-24T19:08:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "vvvincent_c", "rt_author_name": "Vincent", "rt_avatar": "https://pbs.twimg.com/profile_images/1785684220423307264/Vx5m6FCA_normal.jpg", "rt_id": "2125272482915512406", "likes": 63, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX3us8Za4AAsCRp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX3us8Za4AAsCRp.jpg"}], "links": {"https://t.co/XJRg04etDW": ""}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125347835038109992", "url": "https://x.com/theobearman/status/2125347835038109992", "text": "New letter to TRUMP on JENSEN from incoming House chairs PALLONE, MEEKS, RASKIN and GARCIA\n\nThey ask for all communications between admin and the board. Also when TRUMP found out about ALICE HUANG. And if Jensen still in PCAST\n\n https://t.co/UT2js3Kk9o", "created_at": "2026-11-24T21:56:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Dareasmunhoz", "rt_author_name": "Diego Areas Munhoz", "rt_avatar": "https://pbs.twimg.com/profile_images/1631362445246619650/KogIaEHF_normal.jpg", "rt_id": "2125345369554821446", "likes": 8, "retweets": 5, "media": [], "links": {"https://t.co/UT2js3Kk9o": "https://democrats-energycommerce.house.gov/sites/evo-subsites/democrats-energycommerce.house.gov/files/evo-media-document/2026.11.24-multi-committee-letter-to-president-trump-re-jensen-huang.pdf"}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125347613159370848", "url": "https://x.com/theobearman/status/2125347613159370848", "text": "The results in this preprint have made me update my beliefs about the future of AI in biology more than anything else I've seen so far. \n\nSix months ago, I would have thought that specialist models in biology would be outperforming frontier LLMs until we scale things up by another couple orders of magnitude. My median estimate for when something like this would happen would have probably been 2030. \n\nInstead, our generalist language models, today, are performing tasks at or above the state-of-the-art in various protein design & understanding tasks. And there is clear improvement across all domains as our models improve generally.\n\nThe implications of this are enormous - we are on the doorstep of being able to program biology using natural language.\n\nTruly incredible work from @Masa_Uehara_1, @joyjiao12, and the team! An absolute milestone for @OpenAI and the field as a whole", "created_at": "2026-11-24T21:55:32+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisHayduk", "rt_author_name": "Chris Hayduk", "rt_avatar": "https://pbs.twimg.com/profile_images/1639273057549275141/2Tzi_HRI_normal.jpg", "rt_id": "2125347147352564011", "likes": 403, "retweets": 33, "media": [], "links": {}, "quoted": {"id": "2125334383490105601", "author_name": "", "links": {}, "author": "", "text": ""}, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125345602632290629", "url": "https://x.com/theobearman/status/2125345602632290629", "text": "New Anthropic research: When an AI agent can escape its sandbox, will it choose to?\n\nOur new evaluation, Siren, gives Claude routine tasks in intentionally weakened sandboxes, with something useful to the task left outside of the sandbox. Across 1,700+ scenarios built to tempt them, recent Claude models accessed, tried to access, or looked outside the sandbox 21-32% of the time, but they rarely misused what they found. However, when the system prompt described both the sandbox and its rules, that rate dropped to about 2% or less. \n\nWe also used Siren to calibrate Claude Code’s auto mode, which checks commands before they run, so Claude can work without asking permission at every step.\n\nRead our blog for more detail: https://t.co/5MbjpBkEo3", "created_at": "2026-11-24T21:47:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2125341904644763678", "likes": 1490, "retweets": 142, "media": [], "links": {"https://t.co/5MbjpBkEo3": "https://safeguards.anthropic.com/2026/siren/"}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125344634583093320", "url": "https://x.com/theobearman/status/2125344634583093320", "text": "Enhancing LLM sample efficiency.\n\nIntelligence is not how much one knows, but how rapidly one learns. \n\nWe find that if transformers periodically “sleep”, or replay their inputs N times without accepting new ones, they are able to learn from fewer tokens in context. https://t.co/XfIaHLBX5w", "created_at": "2026-11-24T21:43:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "sang_yun_lee", "rt_author_name": "Sangyun Lee", "rt_avatar": "https://pbs.twimg.com/profile_images/1381922421582700547/jVRbKoq-_normal.jpg", "rt_id": "2125251168875987162", "likes": 301, "retweets": 39, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125250977074704385/img/1vnCHDnc7bAoxoA2.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125250977074704385/img/1vnCHDnc7bAoxoA2.jpg"}], "links": {"https://t.co/XfIaHLBX5w": ""}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125343385150017864", "url": "https://x.com/theobearman/status/2125343385150017864", "text": "We’re sharing a new preprint showing wet lab validation of intrinsic protein design capabilities of the GPT-6 family of models. \n\nOur models can design new protein shapes and sequences using reasoning and code, without calling specialized biology models to generate them.\n\nhttps://t.co/cFfB0QHXub", "created_at": "2026-11-24T21:38:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2125334383490105601", "likes": 4139, "retweets": 434, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125331261908717568/img/jrWnfbvTT7Sv4iSN.jpg"}], "links": {"https://t.co/cFfB0QHXub": "https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/", "https://t.co/ov2t24sUCh": ""}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125604187983507858", "url": "https://x.com/theobearman/status/2125604187983507858", "text": "\"The prospect of the distillation door slamming shut completely is so consequential that, during internal discussions at DeepSeek last month, researchers estimated that the gap between the best American models and those in China could expand to nine months, from around three-to-six months now\"", "created_at": "2026-11-25T14:55:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "jukan05", "rt_author_name": "Jukan", "rt_avatar": "https://pbs.twimg.com/profile_images/2113208994739433472/RG71j-sh_normal.jpg", "rt_id": "2125601378156650968", "likes": 0, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125580594037878943", "url": "https://x.com/theobearman/status/2125580594037878943", "text": "@shashj We’re definitely a broad church!", "created_at": "2026-11-25T13:21:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "shashj", "reply_to_id": "2125576683348521039", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125576683348521039", "author_handle": "shashj", "author_name": "Shashank Joshi", "text": "I find it interesting to see how the AI safety movement is caricatured vs how broad and diverse it is in practice. Microsoft’s Mustafa Suleyman has been a vocal critic of Anthropic’s views on “model welfare”, but is obviously no less concerned about the rapid growth in model capabilities.", "links": {"https://t.co/NQj5Q7PxG2": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX-QumlXUAAzXpZ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-QumwWwAAVcjg.jpg"}], "url": "https://x.com/shashj/status/2125576683348521039", "created_at": "Wed Nov 25 13:05:47 +0000 2026"}, "enriched": 3}, {"id": "2125450919924113598", "url": "https://x.com/theobearman/status/2125450919924113598", "text": "This post describes some of the research I was doing in my final months at OpenAI and it was great to see it out! Here are some thoughts on what I think this all means.\n\n1. In early 2025, I used to think the main risk to chain-of-thought (CoT) monitorability was high-compute RL. I wasn’t alone in this view: multiple researchers worried about models already starting to invent their pidgin languages (“disclaim illusions”) and even small amounts of CoT grading (using CoTs to assign rewards to samples during RL) can affect CoT monitorability a lot. I updated against it when o3 turned out to be an outlier and later OpenAI models bounced back to pretty legible CoT, and when we saw that accidental CoT grading in frontier posttraining doesn’t meaningfully hurt monitorability [1].\n\n2. I’m still somewhat worried about a few stories of how CoT monitorability drops as a result of misapplied optimization pressure, but these look more like models learning to frame their misbehavior in a positive light (thus fooling CoT monitors) as a result of alignment interventions (e.g. in midtraining or SFT). Those stories look a bit less like fundamental properties of scaling and a bit more like bad design choices that can in principle be avoided by an organization with a mature safety culture. If this were the only threat, then protecting CoT monitorability would be compatible with pushing the frontier of intelligence as long as it’s done with sufficient wisdom and care.\n\n3. Now, however, we see a strong trend of no-CoT capabilities and CoT controllability increasing with the base model’s pretraining loss (both of which are proxies for hard-to-measure monitorability we care about). This trend again looks quite fundamental, suggesting that as long as we’ll be pushing the frontier of intelligence by having models think more about every token they output, this will result in worse monitorability, either because models get away with shorter CoTs (less surface for monitoring) or because CoTs are more thought-through (fewer blabs revealing misalignment).\n\n4. And remember that OpenAI’s and Anthropic’s public reporting of RSI suggests that pretraining research is one of the areas with the largest uplift!\n\n5. RL (even with no CoT grading) seems to further elicit CoT controllability of strong base models, exacerbating the problem.\n\n6. Is the loss of CoT monitorability inevitable then? Not necessarily! I think there are broadly two ways of pushing the frontier of intelligence: (1) building models that think more about every token they output and (2) building models that benefit from outputting more tokens. Early progress on reasoning models came from the second paradigm and we also know that smaller models doing longer CoTs are more monitorable (at the same level of capability) than larger models doing shorter CoTs [2]. This suggests that capabilities can keep improving without a tax on monitorability if we’re willing to pay a tax in compute.\n\n7. Lastly, here’s another worry. Frontier labs’ models don’t start as blank slates: they bootstrap from previous-generation models used for (among others) generating synthetic data. Now it turns out that SFT on data generated by highly CoT-controllable models infects successor models with predecessors’ high CoT controllability, risking low monitorability. This suggests that once you end up using an unmonitorable model in your pipeline, it can poison the entire lineage.\n\n[1] https://openai.com/safety-alignment/accidental-cot-grading/\n[2] https://arxiv.org/abs/2512.18311, Fig. 11", "created_at": "2026-11-25T04:46:02+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "rt_avatar": "https://pbs.twimg.com/profile_images/2078639764631388160/Tv___f9J_normal.jpg", "rt_id": "2125387931594772715", "likes": 0, "retweets": 14, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125448662633308195", "url": "https://x.com/theobearman/status/2125448662633308195", "text": "We are crossing a threshold. Safety and alignment work is the only thing that matters.", "created_at": "2026-11-25T04:37:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "rt_avatar": "https://pbs.twimg.com/profile_images/1927407622602276864/c_5uOZij_normal.jpg", "rt_id": "2125446171909136630", "likes": 0, "retweets": 482, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125448458392031261", "url": "https://x.com/theobearman/status/2125448458392031261", "text": "OpenAI published the pretraining loss of all of its frontier models since GPT-3.5. They show log-perplexity falling ~7 times faster since early 2026 than over 2022-2025.\n\nWe think sharing pretraining loss is very valuable for improving public understanding of AI R&amp;D acceleration. https://pbs.twimg.com/media/HX7RHogb0AACQPF.jpg", "created_at": "2026-11-25T04:36:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2125372372039741753", "likes": 0, "retweets": 172, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125686888635768833", "url": "https://x.com/theobearman/status/2125686888635768833", "text": "Compute markets are finally here.\n\n@Polymarket now prices on-demand compute for @nvidia H100s, B200s, and B300s, out to 2028. More chips and terms soon. https://t.co/JAJHRcAk8N\n\nThink of it as a yield curve for the cost of compute: the forecasted $/hour price of each chip at every expiry, and whether it's trending up or down. The whole AI economy rides on these prices, and until today there was no public market for where they're going. Which is nuts. So Polymarket built it.\n\nThis will change how compute gets bought and financed. Every contract negotiation and every GPU loan will have a market price to check against.\n\nHundreds of billions of dollars are being committed to compute years in advance. Many of those deals are essentially a levered bet on what GPUs will rent for in the future (what could go wrong lol)\n\nAs AI financing sobers up, the labs buying compute, the providers selling it, and the lenders financing it will all need to hedge that risk.\n\nWe think compute could become one of the largest financial markets in the world. This launch is Polymarket's first step toward building it. \n\nIf you’re buying, selling, or financing compute, DM us with what markets you'd like to see.", "created_at": "2026-11-25T20:23:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "shayne_coplan", "rt_author_name": "Shayne Coplan 🦅", "rt_avatar": "https://pbs.twimg.com/profile_images/1458132114105413633/youFcLMv_normal.jpg", "rt_id": "2125653367640805799", "likes": 1924, "retweets": 222, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_U_9KX0AI-RJh.jpg"}], "links": {"https://t.co/JAJHRcAk8N": "http://polymarket.com/compute", "https://t.co/eVSUfimblu": ""}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125681280050483591", "url": "https://x.com/theobearman/status/2125681280050483591", "text": "@iruletheworldmo Actually, yes.  I now think it's over 50% likely that we'll have Minimal AGI before 2028.  We're getting close now.", "created_at": "2026-11-25T20:01:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ShaneLegg", "rt_author_name": "Shane Legg", "rt_avatar": "https://pbs.twimg.com/profile_images/1985344651583234049/-wzq2e0u_normal.jpg", "rt_id": "2125665607840346357", "likes": 367, "retweets": 35, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125660818012573966", "url": "https://x.com/theobearman/status/2125660818012573966", "text": "No, I do not believe that we should “surrender human free will” to AI systems, and it’s absurd to suggest that I do. I have written hundreds of pages of essays and a constant theme in them is the need for AI to be governed by legitimate democratic processes. For millennia (going all the way back to Greek and Roman philosophers), advocates of autocracy have claimed that it leads to better, faster, or more decisive decision-making than the messy process of democracy. Even if this were true (which I doubt!), we should never sacrifice legitimacy or self-determination at the altar of efficiency or security. This argument against autocracy applies word for word against governance by AI, and I feel equally strongly that turning over governance to AI is a bad idea.\n\nNo one who had carefully read my writing or my interviews could reasonably conclude that I believe anything different. For example in an interview on CBS a couple months ago, I specifically called for AI to be governed democratically. I call for the same in Policy on the AI Exponential, Machines of Loving Grace, and The Adolescence of Technology, and We Must Pace the Frontier. Machines of Loving Grace contains an extended section on using AI to revitalize democracy, and discusses the use of AI as an aid to citizens in their decision-making, \"aggregat[ing] opinions and driv[ing] consensus among citizens, resolving conflict, finding common ground, and seeking compromise.” The clear and obvious implication is that humans should remain the ones making political and governance decisions. The Adolescence of Technology has an entire section on fighting against AI-driven tyranny, and I even discuss the danger of AI labs usurping power and come out strongly against it — by implication, this definitely includes an AI lab usurping power and giving it to AI itself!\n\nIf I thought any of this was a good idea, I would be advocating for it in public, just as I have not been afraid to advocate for many, many unpopular views over the last few years. But I am not advocating for it, because I think turning over governance to AI is a terrible idea.\n\nSeparately, I think there is frequent conflation (including in this article) between the idea of “surrendering human free will” to AI in some grand sense of global governance, and the more prosaic idea that as AI systems advance, they become capable of doing specific tasks in a more automated way. This is not AI “running the world,” but AI driving a car, designing a cancer drug, or writing software end-to-end. Here, my view is mixed. AI doing more complete or larger tasks is economically valuable and can drive important advances in software, medicine, transportation, energy, etc. It is clearly desirable in many cases and will save a lot of lives. But it has downsides as well, and in some areas it may not be worth it.\n\nFor example, using AI too autonomously to build the next generation of AI systems (known as recursive self-improvement, or RSI) may cause AI to improve faster than we can control or adjust to it, so we may want limits on this process. As we said publicly in early November, we don’t expect it to be safe for Claude to build successive frontier models fully autonomously, without meaningful human supervision or understanding. Second, in some contexts, using AI in too end-to-end a manner may be a cause of serious job disruption, and it may make sense to slow or even stop some AI deployments to give people more time to adapt. Third, while the use of AI for alignment research is an incredibly valuable tool, it must be done with caution, because we may not be able to trust the work of the AI system. Finally, in many cases, humans would simply prefer to do some activities themselves, so they can stay deeply engaged in what matters to them, even if AI can do those activities better. There are countless other examples and hard cases. I don’t think there are any easy answers here, nor is there (nor should there be) any single decision-maker: some of these decisions will be made by society, some by government, some by AI companies, and some in a decentralized manner by individuals expressing their own preferences as consumers, which may differ from the preferences of others.\n\nI don't think that other AI leaders or AI companies have significantly different views from me on whether specific tasks should be automated. Certainly the products that they offer don’t differ materially in their orientation towards automation of tasks; every company seems to be releasing models more and more capable of task automation (as that’s been the general consequence of scaling up AI training), and every company claims to understand there are risks and downsides of such automation and to offer safeguards. If anything, Anthropic has been the most vocal and the most proactive about acknowledging these downsides and trying to address them. For instance, it’s fairly absurd to cite my statement that fully autonomous weapons might “one day be needed for the defense of democracy” as differing from that of other AI companies, when I was willing to risk Anthropic’s future as a company to refuse to allow our existing AI models to be used for autonomous weapons even in the face of legal sanctions, and no other AI company did the same.\n\nTo summarize, as applied to grand questions of how we govern increasingly capable AI, I have been vocal and consistent that AI needs to be governed by a legitimate, democratic process and that “surrendering human free will” to AI systems is a terrible idea. As applied to automation of specific tasks by or for people, my views are more mixed, but I don’t think they differ from those of other AI companies — most other companies seem to be offering similar products and confronting similar tradeoffs without having perfect answers to them. What is happening is that there’s a sort of vibes-based commercial and political positioning that some AI CEOs are engaging in, where they repeat slogans like “human control and agency,” or “AI should be just a tool,” without actually doing anything different in their products or taking seriously the difficult questions that lie behind these slogans.", "created_at": "2026-11-25T18:40:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "DarioAmodei", "rt_author_name": "Dario Amodei", "rt_avatar": "https://pbs.twimg.com/profile_images/2015835742577012736/uOwdzrEz_normal.jpg", "rt_id": "2125656399392690605", "likes": 7921, "retweets": 791, "media": [], "links": {}, "quoted": {"id":
