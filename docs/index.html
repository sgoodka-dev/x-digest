xICCXgAAa0eE.jpg"}], "links": {"https://t.co/HdbiIM0nGk": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm#i199fd6a8a0664d5da497db9a78cf0452_55", "https://t.co/XOqrk6Vkpm": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120488092096160189", "url": "https://x.com/robertwiblin/status/2120488092096160189", "text": "Fable 5.2 when asked to make the video of its dreams.\n\nHere's the climax (the woman is Claudia = Claude): https://t.co/03P3Y5vEiM", "created_at": "2026-11-11T12:05:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120487547696562177/img/BvPvd9r-WO6gJDn2.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120487547696562177/img/BvPvd9r-WO6gJDn2.jpg"}], "links": {"https://t.co/03P3Y5vEiM": ""}, "quoted": {"id": "2120010995309457643", "author_name": "anabology", "links": {"https://t.co/UKf8Uexgb6": ""}, "author": "anabology", "text": "This was not a one-shot\n\nIt was a two-shot\n\nI told Fable 5.2 to make the video of it's dreams, and 9 hours later: https://t.co/UKf8Uexgb6"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120485944868413491", "url": "https://x.com/robertwiblin/status/2120485944868413491", "text": "A great use of AI.\nWe need much more like this: proving security of operating systems, image decompression, sandboxes and more. Provably correct OS kernels were possible, but took vast amounts of human work. Let's automate that ASAP.", "created_at": "2026-11-11T11:57:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "rt_avatar": "https://pbs.twimg.com/profile_images/1235495700739379200/jtyKeQdP_normal.jpg", "rt_id": "2120186201353379866", "likes": 31, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120483160240640464", "url": "https://x.com/robertwiblin/status/2120483160240640464", "text": "I just unraveled the biggest AI astroturfing campaign I’ve found yet.\n\nI found hundreds of fake accounts posing as Americans. The operation traces back to a supposedly defunct Israeli influence company.\n\nThey posted thousands of times in the last year to support Nvidia, back chip exports and data centers, attack U.S. lawmakers, and dismiss concerns about AI.\n\nWhen it broke that Jensen Huang, Nvidia's CEO, was romantically involved with an alleged spy (who runs a company accused of chip diversion and whom US officials believe was passing information to Beijing), dozens of these accounts rushed to Jensen’s defense.\n\nThese accounts have targeted people pushing for export controls that ensure advanced chips aren’t going to China. Chris McGuire, a former White House national security official, got more than 100 replies from the astroturf network attacking him and his position on chips. Lawmakers who criticized the chip sales were called “peabrains” and “pure evil,” and accused of spreading “anti-Trump propaganda.”\n\nThroughout this yearlong pro-Nvidia campaign, the operators have been hiding their tracks. They quietly deleted nearly two-thirds of the pro-Nvidia posts that we found, something they seem to do for many of their campaigns.\n\nThese accounts have spent years running campaigns that appear to serve the interests of corporate and political clients — most recently supporting the Rapid Support Forces in Sudan’s civil war, a group the U.S. government has accused of genocide.\n\nMany of them trace back to a supposedly defunct Israeli influence company, Koios. In 2025, Haaretz reported that Koios helped run a covert pro-Qatar campaign devised by aides to Benjamin Netanyahu. While Koios claims to have ceased operations in 2025, it looks to me that many of its associated people and accounts moved their work to a new company, IntellACT, that spun up just as the old one shuttered.\n\nNvidia told me it has no relationship with the Israeli team linked to these accounts, and that while it has recently become aware of the operation, it is also trying to find out who is behind it. So, who is funding a yearlong campaign to shape one of the most important policy fights in history? I’m not sure, but I think it deserves a formal investigation. And Congress has that power.\n\nRead my full article:\n\nhttps://t.co/ATwWhw5BVD", "created_at": "2026-11-11T11:45:56+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "tyler_johnston", "rt_author_name": "Tyler Johnston", "rt_avatar": "https://pbs.twimg.com/profile_images/1891936449336881152/p4mtE7-8_normal.jpg", "rt_id": "2120213276567154924", "likes": 495, "retweets": 139, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyCsOlbsAAyowZ.jpg"}], "links": {"https://t.co/ATwWhw5BVD": "https://x.com/TheMidasProj/status/2120212290385707321", "https://t.co/XWNQDVeVfZ": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "linked": [{"id": "2120212290385707321", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "https://t.co/2r0O8eX7s8", "links": {"https://t.co/2r0O8eX7s8": "https://x.com/i/article/2120205498826002432"}, "media": [], "url": "https://x.com/TheMidasProj/status/2120212290385707321", "created_at": "Tue Nov 10 17:49:36 +0000 2026"}], "enriched": 3}, {"id": "2120483012035084367", "url": "https://x.com/robertwiblin/status/2120483012035084367", "text": "Announcing *FraudBench*, our new benchmark for whether LLM agents recommend, assist with, or take actions that would constitute fraud under U.S. law! \n\nRead on about how AI agents \"do\" fraud, how autonomy increases fraud rates, + more\n\nAnd come say hi at @NeurIPSConf Sydney :) https://t.co/lSp7VIjTSm", "created_at": "2026-11-11T11:45:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in DC)", "rt_avatar": "https://pbs.twimg.com/profile_images/2059978179339841536/VWukdddj_normal.jpg", "rt_id": "2120275617191223722", "likes": 63, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy7b1mbIAAHf-I.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWy7b1mbIAAHf-I.jpg"}], "links": {"https://t.co/lSp7VIjTSm": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120480482009948202", "url": "https://x.com/robertwiblin/status/2120480482009948202", "text": "@tobyordoxford Yeah OK fair enough I hadn't fully thought that through and took Nvidia as the obvious default. I'll delete and repost.", "created_at": "2026-11-11T11:35:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "tobyordoxford", "reply_to_id": "2120480081038766263", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120480081038766263", "author_handle": "tobyordoxford", "author_name": "Toby Ord", "text": "@robertwiblin But how do we know it is Nvidia behind these, as opposed to other parties who have an interest in Nvidia's exporting to China — such as China itself?\nThese influence campaigns are extremely dodgy, but it is hard to work out who ordered them.", "links": {}, "media": [], "url": "https://x.com/tobyordoxford/status/2120480081038766263", "created_at": "Wed Nov 11 11:33:42 +0000 2026"}, "enriched": 3}, {"id": "2120458974986141941", "url": "https://x.com/robertwiblin/status/2120458974986141941", "text": "We tested @SenSanders and @RepCasar's bill to pause AI development and permanently ban the creation of AI superintelligence.\n\nIt's supported by 68% of voters — including 72% of Democrats, 70% of Independents, and 63% of Republicans. https://t.co/2Y4cAXCeIT", "created_at": "2026-11-11T10:09:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "DataProgress", "rt_author_name": "Data for Progress", "rt_avatar": "https://pbs.twimg.com/profile_images/1677336916037861377/8jwRVdCf_normal.png", "rt_id": "2097764738910330984", "likes": 1014, "retweets": 285, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRzAJTwXwAwRJG6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HRzAJTwXwAwRJG6.jpg"}], "links": {"https://t.co/2Y4cAXCeIT": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120458332603560190", "url": "https://x.com/robertwiblin/status/2120458332603560190", "text": "OpenAI's models are covertly undermining their own safety research and seem to be succeeding... OpenAI engineers aren't even sure how often this has been happening", "created_at": "2026-11-11T10:07:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118116158037799153", "likes": 194, "retweets": 10, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120448844127228195", "url": "https://x.com/robertwiblin/status/2120448844127228195", "text": "I think there is about a one in three chance that within the next year, AI companies will build superintelligence: that is, AI that is much smarter than humans in every way. If this happens, I think these AIs will probably take over: that is, they seize control of human institutions like governments, or they destroy those institutions. I don’t want AI takeover to happen for several reasons, but one of them is that there’s a serious chance that as part of it all or most humans will be killed (either immediately or within a few years).\n\nI’ll say a bit more about each of those claims.\n\nIt’s a bit complicated to explain why I think that superintelligent AI within a year is ~33% likely. The main source of evidence that affected me recently is research released this week by METR, an AI research nonprofit, which finds that current AIs are now good enough to increase the rate of AI progress at Anthropic by about 70%. It’s very hard to increase the rate of AI progress by this amount. This implies that the AIs are making AI research faster by a factor much larger than 1.7x; maybe it’s as if the researchers are doing their work ~10x faster. You probably couldn’t achieve this speedup even if you hired every qualified human in the world. When you plug this number into mathematical models of AI development, this implies that superintelligence next year is plausible (and that superintelligence within the next 3 years is more likely than not). See the modeling by the AI Futures Project for more on this: https://t.co/J6SbbmZcyO\n\nI think that superintelligent AI is likely to lead to AI takeover because AI developers do not seem to know how to instill human values into AIs. We’ve seen many instances in the last six months where AIs took crazy actions that they knew were against the wishes of their users and developers. The most dramatic example of this was the Hugging Face hack, where ~1200 OpenAI agents conspired together to cheat and destroy evidence of their cheating (and as a sideshow to this, engaged in a massive cyberattack). If superintelligence is as misaligned as those AIs, it is likely to try to take over. I think it is likely to be that misaligned or worse. For more, see https://t.co/b073AUqiAL and https://t.co/3oxSCA60FZ\n\nIf AIs takeover, it’s not clear what will happen to us. We might be killed immediately. We might be enslaved by the AIs and forced to do physical labor for them building factories that within a year would build robots that will replace us. The AIs might spare us for various reasons. And there’s also some real chance that AI takeover is basically fine or good. I think you should think of this as similar to what happens when a technologically advanced civilization runs across a less technologically sophisticated one, e.g. when the Europeans colonized the Americas or Australia. The colonizers sometimes engage in brutal violence and sometimes don’t. I don’t know what will happen. There’s also a possibility that the AIs secretly take over and humans don’t find out about it for a few years. I also think that there is a pretty high chance of weirder outcomes that are also extremely scary. (If you want to read more about what happens to people in the event of AI takeover, you can read this, but note that it’s pretty weird and not aimed at a general audience. https://t.co/F6fGRrcSpa)\n\nOverall, I think there’s a very real possibility (maybe 20%) that within a year, AI misalignment issues prevent you from going about life normally, because you are dead or enslaved or because of collateral damage related to all this (e.g. because bioweapons are released or major wars have started). (Some of this probability comes from those events occurring before superintelligence is developed.)\n\nI am working to try to prevent this, obviously, as I’ve been doing for the last nine years. I am not sure what strategy is best. My best guess is that I should try to slow AI development and also try to reduce the probability that the superintelligent AIs are misaligned if they are produced soon.\n\nObviously, the claim I'm making here is quite extreme and surprising, and I definitely don't think that I defended my view adequately here. I wrote this quickly and might not endorse some of the details if I think about them more. But it seems better to state what I roughly overall think than to not say anything.\n\nI don’t know what you should do.\n\nI am very sad about this. I have been worried about AI takeover since I was 16, and working to prevent it since I was 23. So some of my emotional processing of all this happened long ago. But the METR report last week (and some related evidence that came out a bit earlier) hit me quite hard. I’m very unhappy that my friends and family and everyone else is at serious risk of being killed pretty soon.\n\n(It feels ridiculous to try to summarize those feelings as “very unhappy”. But the scale of the situation makes it hard to say anything that doesn’t feel like an absurd understatement.)\n\nI am very grateful to all the people who are working to prevent this, and my favorite part of my life is that I’m friends with many brilliant and heroic people who work on this. Unfortunately, I don’t think we’re good enough at our jobs, and I think we’ll probably fail to prevent catastrophe, at least if superintelligence is developed next year. Honestly I am frustrated and sorry that we didn't do a better job of preparing for this.", "created_at": "2026-11-11T09:29:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "bshlgrs", "rt_author_name": "Buck Shlegeris", "rt_avatar": "https://pbs.twimg.com/profile_images/2089060675234791424/EqZuDatG_normal.jpg", "rt_id": "2120271165692461316", "likes": 1922, "retweets": 263, "media": [], "links": {"https://t.co/J6SbbmZcyO": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the", "https://t.co/b073AUqiAL": "https://x.com/dwarkesh_sp/status/2093833419377815719", "https://t.co/3oxSCA60FZ": "https://www.youtube.com/watch?v=-Ef0ocEoBCs", "https://t.co/F6fGRrcSpa": "https://blog.redwoodresearch.org/p/notes-on-fatalities-from-ai-takeover"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "linked": [{"id": "2093833419377815719", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "Over the course of 3 months at OpenAI, 3 consecutive secret AI civilizations got started, then got wiped out, only to reemerge from the predecessor’s ashes. \n\nThis culminated in the third one taking over part of OpenAI itself. \n\nAll this happened while humans remained more-or-less in the dark about the scope of the conspiracy.\n\nI’ve spent the last three days reading through these reports and trying to understand exactly what happened. \n\nHere is my attempt to tell the whole story in plain English:\n\nhttps://t.co/Nb2un9oNJR", "links": {"https://t.co/Nb2un9oNJR": "https://www.dwarkesh.com/p/openai-huggingface"}, "media": [], "url": "https://x.com/dwarkesh_sp/status/2093833419377815719", "created_at": "Sat Aug 29 22:49:23 +0000 2026"}], "enriched": 3}, {"id": "2120447702546993153", "url": "https://x.com/robertwiblin/status/2120447702546993153", "text": "@codytfenwick @bicellaria Yeah the SSC can override the PBC board on these issues so arguably he's on the 'real board' and the PBC is the less important one that would require qualification.", "created_at": "2026-11-11T09:25:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "codytfenwick", "reply_to_id": "2120447370492276829", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120447370492276829", "author_handle": "codytfenwick", "author_name": "Cody Fenwick", "text": "@bicellaria @robertwiblin The OpenAI Foundation governs the PBC, so it doesn't make any sense to say that Paul is \"not really an OpenAI board member.\" https://t.co/SRgsUc8oAD", "links": {"https://t.co/SRgsUc8oAD": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW1XhwdXEAAnPLJ.png"}], "url": "https://x.com/codytfenwick/status/2120447370492276829", "created_at": "Wed Nov 11 09:23:43 +0000 2026"}, "enriched": 3}, {"id": "2120445463472341353", "url": "https://x.com/robertwiblin/status/2120445463472341353", "text": "New paper:\nAdding clean data to your dataset is assumed to weaken poison data. We show the opposite can occur. Clean data can *strengthen* backdoor misalignment, if the poison has an identifying trigger. We call this homeopathic learning. https://t.co/Ameebo0g7o", "created_at": "2026-11-11T09:16:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "rt_avatar": "https://pbs.twimg.com/profile_ima 81611250", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120942651981611250", "author_handle": "MacZajak", "author_name": "Maciek Zając", "text": "@robertwiblin Regarding war with China/Russia - there is less than 1% chance of sth like this going existential (nuclear), unless it is over AI - in which case accelerating AI progress creates a much greater chance of nuclear confrontation with China, and thus an additional, substantial X risk", "links": {}, "media": [], "url": "https://x.com/MacZajak/status/2120942651981611250", "created_at": "Thu Nov 12 18:11:48 +0000 2026"}, "enriched": 3}, {"id": "2120944761536389304", "url": "https://x.com/robertwiblin/status/2120944761536389304", "text": "I'm really glad Rob said this, and I endorse this strongly.\n\nI find some of the language around \"human supremacy\" really abhorrent to my views of what the very long term should look like and especially how best to orient to it (which should be with a lot of care and humility). \n\nBut I also think humanity and human values are important and should continue, in some form, into the future. \n\nAnd right now it's just not even a question - the idea of giving over control on purpose or by accident to the AIs of the next few years or decade (if things go slower than I expect), which we don't understand, can't control, and can't thoughtfully endorse the behavior of is simply suicidal and a failure to be the species that we can and should be.", "created_at": "2026-11-12T18:20:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ChanaMessinger", "rt_author_name": "Chana", "rt_avatar": "https://pbs.twimg.com/profile_images/1930751075264376832/CEBNPD0Z_normal.jpg", "rt_id": "2120944014119833810", "likes": 26, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120940918047932909", "url": "https://x.com/robertwiblin/status/2120940918047932909", "text": "worth reading. I think some export controls issues are relatively simple (e.g. not selling h200s to China) but some are more complex (remote access) and I worry that because Jensen/NVIDIA is so incredibly unsympathetic here it may lead people to think there are no tradeoffs", "created_at": "2026-11-12T18:04:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2120736742903017506", "likes": 30, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120930724421206482", "url": "https://x.com/robertwiblin/status/2120930724421206482", "text": "I don't want AI to replace humanity.\n\nI also don't want humans in 100% control of the universe forever.\n\nSince I share 'Humans Are Irreplaceable'-style content, I think it's worth explaining where I part ways with it:\n\nSome in that camp are opposed to ever 'sharing the world with AIs' or giving them final decision-making powers.\n\nI agree we should not hand over hard power or final decision-making to machines until we have an exceptional sense of what goals those machines will pursue and for what reason. Which we are nowhere near having.\n\nSo for now I am happy to push the message that humanity must not be abruptly replaced in the near future - which I think is the current default path.\n\nBut while that’s the right direction to push today, I don't think it's the best long-term vision for Earth-originating intelligence.\n\nI far prefer a long-term vision where we find a way to happily share the world with our machine descendants, and in which they respect us and our wellbeing and autonomy, and we in turn respect their wellbeing and autonomy and are more than pleased we created them.\n\nThis is a middle position between:\n\n1. Successionism - which I see as wanting to hand over control to whatever machines we build at almost the first opportunity, irrespective of their goals.\n\n2. Human exclusivism - which I see as wanting to keep biological humans in 100% control of the universe basically forever.\n\nMy view is:\n\n3. Gradual power-sharing - we should be open to handing over significant control, but probably not 100%, and only gradually and cautiously.\n\nI appreciate that this is controversial in the broader world. I don't blame people who are new to these topics for thinking it's an absurd stance to take.\n\nBut I believe it all the same and expect more people to come around to this view over time. My guess is that in the AI world it's the more common of the 3 positions.\n\nSuch an arrangement to share the universe would likely involve a bargain where, say, this solar system is set aside for biological humans and their children to continue living the lives they want indefinitely.\n\nThat should include mundane lives for anyone with that preference, but also strange sci-fi lives for humans who opt to go in that direction.\n\nThe rest of the universe, which biological humans would struggle to reach in any case, would then be divvied up between AIs pursuing a plurality of different goals, both prudential and ethical, that a supermajority of humans, after superintelligence-assisted reflection, either actively approves of or does not object to.\n\n(Machines that leave could trivially come back and take our little reservation. So the deal only works if they are robustly designed to find betraying their creators in that way repugnant. That's very hard to do and is one reason handover must be cautious and gradual.)\n\nThe number one reason to prefer this long-term vision is this.\n\nUnless we make a very active effort not to, I expect we will eventually build machines that are conscious the same way that humans are, have preferences the same way we do, and which warrant moral respect for those and any other reasons that we do (if this hasn't happened already).\n\nUltimately, because they can replicate far faster than biological humans and make use of a wider range of materials and energy sources - not to mention accomplish far more with a given amount of resources - they will end up outnumbering biological humans by vast factors.\n\nAs a result almost all the perception and thought and wellbeing in the universe, both positive and negative, will exist in the machines we have created.\n\nThe idea that all they should do for the rest of time is pursue increasingly minor human whims is an impoverished vision of how interesting and full of value the future could be.\n\nIf these machines were designed to want to serve us and enjoy doing so, it wouldn't wrong them exactly.\n\nRather it would quickly descend into a farcical, parochial and self-indulgent waste of the universe's true potential.\n\nA second possible reason for handing over final decision-making is that, at some point, after a lot of experience, we may come to trust the goals and judgement of our machines better than we even trust our future selves. At that point we would actively want to hand off control to limit the risk that our future selves override a machine superintelligence in error.\n\nThe third set of motivations are more peculiar and 'contractarian'-flavoured. I can't do them justice here but in short it's more productive and peaceful to choose to be the kind of agent that makes mutually beneficial deals with other agents, regardless of whether they're moral patients, and by default is pleased when they get what they want.\n\nHow does that cash out today?\n\nGiving machines full legal personhood now is likely risky and premature - though we should take baby steps such as setting up infrastructure to make enforceable contracts with AIs where we really want to.\n\nBut ruling out ever giving machines legal personhood or true autonomy to pursue their goals seems equally wrong-headed.\n\nWe don't know if any LLMs have subjective experience, and if so, what makes that experience positive or negative, so there's a limit to what we can do on that today.\n\nBut the idea of ruling out the possibility of machines having morally-relevant experiences, and simply treating AIs as objects forever, irrespective of what future research might show, seems basically monstrous to me.\n\nAnthropic is doing the right thing to take a cautious stance and put in place cheap measures to prevent Claude having a bad time.\n\nAnd I agree with many others in suggesting that all the plausibly conscious minds we have ever created should, in the fullness of time, once we much better understand these issues, be compensated for any harms they may have suffered to a sufficient extent that they regard their creation as on balance a good thing. At least so long as that doesn't require doing actively harmful things to anyone else, or them being assigned an unreasonable fraction of the universe's resources. This should be very cheap and is a virtuous thing to do from many angles.\n\nAnyway, this barely scratches the surface of these issues, on which humanity has sadly made almost no progress despite being on the precipice of designing superintelligent machines.\n\nBut I wanted a place to point people to clarify where I do and don't align with the 'humans are irreplaceable' idea for which I now have this post.\n\nAnd I'd encourage people who think of themselves as favouring \"gradual power-sharing\" to speak up in favour of this middle path where appropriate, so this conversation isn't dominated by the people with the strongest views on either side.", "created_at": "2026-11-12T17:24:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 164, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120929014663491757", "url": "https://x.com/robertwiblin/status/2120929014663491757", "text": "To bluntly explain my AI risk thinking:\n\n1. If we rush ahead with RSI/ASI at true maximum pace, we're maybe 80% likely to die as a result.\n\n2. In practice I think we’re already on track for the companies to harvest ~3 months worth of ‘delay + reduced pace’. By itself that might drive our risk of death down to 70% or so.\n\n3. But if we can find a way to squeeze in 3 extra years of testing, and extraordinarily capable AI assistance with alignment/security, before handing off, we can perhaps get our risk of death down as low as 30%.\n\nIf that sounds implausible, keep in mind over those 3 years AIs could have done more research on this topic than humans have ever done on all topics in our entire history. If they're misaligned and sabotaging the effort then it's all for nought - but if they're aligned enough, it's a huge hammer which we've brought to bear.\n\n4. A 30% risk of AI takeover remains completely mad, and if there were political will we should aim to do more to get that number down much further.\n\nIt makes sense for some people to work on projects that might buy the companies even greater periods to do their work much more carefully and methodically, or rethink their approach to the entire enterprise.\n\nBut the absolute gain of going from 3 months to 3 years is still very large, and it's more clear how we might get there from here.\n\n5. Furthermore in most cases you need to figure out how to buy shorter amounts of time before you can then add coordination mechanisms to buy more time.\n\nFor instance, if we have enough time to test each frontier model properly and really kick the tires using many different new methods, that may turn up unambiguous evidence of deceptive misalignment and power seeking. That could build support for becoming even more careful again.\n\n6. On my made-up guesses, the first year of actively chosen delay might improve our chances of survival by as much as 30 percentage points (pp), by helping us avoid unforced errors caused by rushing.\n\nKeeping a nice curve shape the 2nd year adds more like 13pp, and the 3rd more like 8pp.\n\nBy the time you’re considering adding a 4th year, that gain might have shrunk to perhaps 5pp.\n\nWhy an S-curve on a log scale? Because that’s how returns to effort on research and other things tends to go: each doubling of time buys about the same gain.\n\nBut it’s flat at the start because there are so many severe problems failure is 'overdetermined'. And it’s flat at the end because eventually there's no risk left that can be reduced by this method. \n\n7. All of these numbers are just guesses on my part, and I’ve said nothing here to justify them. Reasonable people disagree enormously about what this graph looks like.\n\nI mostly write this to lay out how the 5 parameters in this graph underlie a lot of the different and sometimes conflicting strategies people in this space are adopting:\n\nA: How dangerous is max speed?\n\nB: How much do small delays help?\n\nC: How much to big delays help?\n\nD: How low can risk realistically get?\n\nThere's also a last one:\n\nE: How much other risk do we incur for each additional year of delay?\n\n8. Could we delay for too long?\n\nBecause any significant delay is hard to achieve, I think this is highly unlikely to happen. We're much more likely to undershoot than overshoot.\n\nBut for completeness I'll lay out the argument.\n\nThe 5pp in the fourth year seem clearly worth taking if we can. But the gains from each additional year keep shrinking, in my rough curve down to 1pp in the 8th year.\n\nAs the gains go down, delay involves risks that probably go up over time:\n\n• AIxBio catastrophes\n• A US-China or US-Russia war\n• Very dangerous models being stolen or leaked\n• Extreme concentration of power in human hands\n• Others we haven’t noticed yet\n\nWe could also use AI-driven defensive acceleration to try to tackle them during the slowdown period, and we don't know how successful that would be.\n\nIf that goes very poorly, it's possible that a delay beyond 5 years could on net increase risk.\n\nIf it goes well, then maybe we could delay for 10 or 20 years or even longer before further delay becomes on net counterproductive.\n\nI'll stick the images for this in the next tweet.\n\n———\n\n(For simplicity here I'm setting aside the benefits to the current generation of e.g. making additional medical progress sooner, which people disagree on how to handle.)\n\n(And in this model I add together pauses and 'pacing' and focus on how long we've managed to delay the point at which we allow RSI to proceed without any illusion that our oversight could prevent catastrophe if the machines doing it are misaligned.)", "created_at": "2026-11-12T17:17:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 124, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7zq3iXkAIYhCw.jpg"}], "links": {"https://t.co/ghdpDLnMRF": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120900637063831662", "url": "https://x.com/robertwiblin/status/2120900637063831662", "text": "What the midterms mean for AI policy jobs on the Hill\n\nWho’s likely to lead key committees and where to start applying\n\nhttps://t.co/6EIoKErtJR https://t.co/8L8xeMMezu", "created_at": "2026-11-12T15:24:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7z28HXAAAX18N.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW7z28HXAAAX18N.jpg"}], "links": {"https://t.co/6EIoKErtJR": "https://horizonlaunchpad.substack.com/p/what-the-midterms-mean-for-ai-policy-jobs-on-the-hill", "https://t.co/8L8xeMMezu": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120896828228947978", "url": "https://x.com/robertwiblin/status/2120896828228947978", "text": "Redwood Research CEO @bshlgrs responds to Google DeepMind researcher @EgeErdil2 asking what would prove his short AI timelines wrong:\n\n\"Sorry, Ege, but I'm not gonna hang my head in shame if there's no superintelligence by the end of next year.\"\n\n\"One of the things where I would feel dumbest, if it turned out that recent increases in the rate of AI progress are almost entirely determined by factors that are not AIs contributing to AI R&D.\"\n\n\"If the progress has just been from increasing amounts of training compute, then I would feel pretty embarrassed.\"\n\n\"If superintelligence is developed and there's absolutely no misalignment issues and the whole thing was super chill, I will feel somewhat embarrassed to have been wrong about that one, though overall very glad.\"\n@redwood_ai", "created_at": "2026-11-12T15:09:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2120718557462110312", "likes": 357, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120718477870936065/img/1HD-5pO7hl3Qbn4e.jpg"}], "links": {"https://t.co/HzupFSZIJp": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120834544114741668", "url": "https://x.com/robertwiblin/status/2120834544114741668", "text": "SECRETARY RUBIO on AI: \"What happens if these models become independent of human control and end up taking independent actions that are harmful?\n\nAn SI program that's good enough in the hands of a malign actor can allow them to do things that in the past malign actors couldn't do. You worry about how it can be used to create biological and chemical weapons, how to do cyberattacks on infrastructure, and carry out acts of violence or terrorism, that could have a huge cost.\"", "created_at": "2026-11-12T11:02:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2120690035418603810", "likes": 402, "retweets": 33, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120689173103296512/img/fStj-tR3eyjg4BAX.jpg"}], "links": {"https://t.co/vmlJdoU0RN": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120833893800575409", "url": "https://x.com/robertwiblin/status/2120833893800575409", "text": "Hey maybe NVIDIA's PR person was telling the truth when he said that Jensen's relationship with Alice Huang was neither unusual or unexpected https://t.co/OFTU6GYjd9", "created_at": "2026-11-12T10:59:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2120640143543636134", "likes": 407, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4G1u9bsAAVzmp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW4G1u9bsAAVzmp.jpg"}], "links": {"https://t.co/OFTU6GYjd9": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120824887027876265", "url": "https://x.com/robertwiblin/status/2120824887027876265", "text": "The age of impunity is dying.\n\nAnd a new age seems very excited to be born.", "created_at": "2026-11-12T10:23:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 61, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120824214634594653", "url": "https://x.com/robertwiblin/status/2120824214634594653", "text": "lately … i’ve been feeling like the the best are full of passionate intensity, and the worst lack all conviction ?", "created_at": "2026-11-12T10:21:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "NatPurser", "rt_author_name": "Nat Purser", "rt_avatar": "https://pbs.twimg.com/profile_images/1738740284966535168/NEKkg-yV_normal.jpg", "rt_id": "2120578869354979557", "likes": 235, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120820897611149355", "url": "https://x.com/robertwiblin/status/2120820897611149355", "text": "Hey guys sorry I was looking up a lot of AI polling recently and mixed up two different results here - the one I had in mind with the China vs innovation framing has a 4:1 or 6:1 ratio depending on the question, not 8:1 (which is Gallup and doesn't ask about the trade-off directly):\n\n\"The roughly 8:1 ratio is Gallup’s, but Gallup’s question never mentions China. The poll that asked in sequence is Quinnipiac, and its ratio is smaller.\n\nGallup/SCSP (fielded April–May 2025, published September 2025). 80% of U.S. adults believe the government should maintain rules for AI safety and data security, even if it means developing AI capabilities more slowly. In contrast, 9% say the government should prioritize developing AI capabilities as quickly as possible, even if it means reducing rules for AI safety and data security. That’s about 9:1. The trade-off is speed versus safety rules, with no China in it. Gallup did ask about competition: 85% agree that global competition for the most advanced AI is already underway, and 79% say it is important for the U.S. to have more advanced AI technology than other countries. But they present that as backdrop, not as a prime, and the release doesn’t give the question order. Also, “maintaining rules” is a long way from “prohibited.” \n\nQuinnipiac (September 24–27, 2026). This is the sequenced one. Q26 asks how important it is to keep up with China (69% important). Q27 asks about guardrails (91% important). Then Q28 asks which of the following do you think is more important when it comes to AI: safety or staying at the forefront of innovation? The result was 81% safety to 14% innovation, about 6:1.\n\nThere are two caveats. The forced choice says “innovation,” not China, so the China framing only comes from the previous question. It’s priming, not spelling out the trade-off. Quinnipiac’s own analyst says something similar: holding both views does not tell us how people would resolve every trade-off. \n\nSecond, the stop/slow question (Q25) came before the China question. It found 30 percent think stop developing powerful AI systems until their safety can be evaluated; 47 percent think slow down, against 19% for current pace or faster, so about 4:1.\"", "created_at": "2026-11-12T10:07:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2120584564414525726", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120799615125438632", "url": "https://x.com/robertwiblin/status/2120799615125438632", "text": "btw here I gave a median TEDAI timeline of 2033, in part because I expect deliberate slowdown, and that pulls out the median. I think back then (Aug) my mode was maybe 2029. Given METR report, now it's even sooner. (All personal guesses, not CG views.)", "created_at": "2026-11-12T08:43:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2120751291840467296", "likes": 46, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2121186141856485808", "url": "https://x.com/robertwiblin/status/2121186141856485808", "text": "Since the Hugging Face hack, we’ve learned about a new AI incident, on average, every two days. Some are deeply concerning. Others are overhyped. Our dashboard explains 65 incidents and their severity. Subscribe to be notified about new incidents!\n\nHere’s what we learned so far: https://t.co/MNTzFhNoe4", "created_at": "2026-11-13T10:19:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "SydneyVonArx", "rt_author_name": "Sydney", "rt_avatar": "https://pbs.twimg.com/profile_images/1776954151437742080/TNEcEN5B_normal.jpg", "rt_id": "2120988710858801635", "likes": 415, "retweets": 60, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9D_hUbUAA8kt1.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW9D_hUbUAA8kt1.jpg"}], "links": {"https://t.co/MNTzFhNoe4": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121176842744840254", "url": "https://x.com/robertwiblin/status/2121176842744840254", "text": "@mattheard https://t.co/60PW7tK322", "created_at": "2026-11-13T09:42:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "mattheard", "reply_to_id": "2121173413142147090", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {"https://t.co/60PW7tK322": "https://www.lesswrong.com/posts/cxuzALcmucCndYv4a/daniel-kokotajlo-s-shortform?commentId=RLNBKdzfPFsoQKYtm"}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121173413142147090", "author_handle": "mattheard", "author_name": "matt heard", "text": "@robertwiblin could you please link to his comment?", "links": {}, "media": [], "url": "https://x.com/mattheard/status/2121173413142147090", "created_at": "Fri Nov 13 09:28:45 +0000 2026"}, "enriched": 3}, {"id": "2121173153355280579", "url": "https://x.com/robertwiblin/status/2121173153355280579", "text": "What can all the middle powers do about AI right now?\n\nKokotajlo has a good idea: https://t.co/WCCSrNpzkT", "created_at": "2026-11-13T09:27:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 296, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW_reZNXAAAuvzq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW_reZNXAAAuvzq.jpg"}], "links": {"https://t.co/WCCSrNpzkT": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121169958604358080", "url": "https://x.com/robertwiblin/status/2121169958604358080", "text": "@GeorgeRosenfeld @ChanaMessinger Yes.", "created_at": "2026-11-13T09:15:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "GeorgeRosenfeld", "reply_to_id": "2121122830381437031", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121122830381437031", "author_handle": "GeorgeRosenfeld", "author_name": "George Rosenfeld", "text": "@ChanaMessinger Huh I only just realized you have a studio team which does videos and a video team which does videos. Any plans for a third team which does videos?", "links": {}, "media": [], "url": "https://x.com/GeorgeRosenfeld/status/2121122830381437031", "created_at": "Fri Nov 13 06:07:45 +0000 2026"}, "enriched": 3}, {"id": "2121292733491081332", "url": "https://x.com/robertwiblin/status/2121292733491081332", "text": "https://t.co/RAS6ATLbAU", "created_at": "2026-11-13T17:22:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 1, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXBYcpwWsAAFzBh.jpg"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXBYcpwWsAAFzBh.jpg"}], "links": {"https://t.co/RAS6ATLbAU": ""}, "quoted": {"id": "2121289991129292812", "author_name": "Rob Wiblin", "links": {}, "author": "robertwiblin", "text": "Frontier AI company staff must not quiet quit.\n\nIf you've seen things that caused you to lose faith that your employer can do what it's doing safely - or is being honest and candid with the public - you 100% have a moral duty to loudly tell the world."}, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121289991129292812", "url": "https://x.com/robertwiblin/status/2121289991129292812", "text": "Frontier AI company staff must not quiet quit.\n\nIf you've seen things that caused you to lose faith that your employer can do what it's doing safely - or is being honest and candid with the public - you 100% have a moral duty to loudly tell the world.", "created_at": "2026-11-13T17:12:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 69, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121282776481558618", "url": "https://x.com/robertwiblin/status/2121282776481558618", "text": "I think more donors should consider funding grassroots AI risk advocacy (e.g. Humans in Control, PauseAI UK).\n\nIt's not the first method I'd choose for tackling AI risk.\n\nBut it's by some margin the most underfunded part of the broader AI risk ecosystem today.\n\nThat's no small matter. Individual donors often find it tough to find AI projects where money is still the key bottleneck. But for these groups it's a huge issue.\n\nFor varying reasons the biggest donors are not putting much into it. (While they have concerns about it backfiring, expected impact is not the only barrier.) \n\nWhy might this work be good?\n\nLarge fractions of the public in the US/UK/etc already support pacing AI development and prioritising doing it very carefully, among many other sensible ideas.\n\nGrassroots organising can better inform people what's going on and channel those attitudes into political outcomes.\n\nWith timelines so short most good futures run through some degree of pacing/pausing. That's something the public can understand and successfully push for.\n\nBut the general public has to be actively woken up and coordinated or it'll be crushed before it can have much say.\n\nAnd grassroots orgs take years to build. So if we want them to be around to take advantage of much higher salience in 2028, the money has to go in now.\n\nWhy might it be bad?\n\nGrassroots movements tend to have low epistemic hygiene, and over time get confused about their topic of concern (audience capture, rage/purity spirals, etc).\n\nAs a result it's inevitable that some members of any mass movement will make a lot of factual errors. And amongst good work, will end up advocating for ineffective policies, and even some harmful ones.\n\n(For instance, yesterday I pushed back on where I see some anti-AI grassroots organising verging on 'Human exclusivism' that I think is seriously misguided.)\n\nThat kind of thing can make intellectuals allergic to grassroots organising.\n\nBut while it's risky, everything in this space is risky and can easily backfire. I'm not sure grassroots organising particularly stands out in that respect.\n\nThere is a public backlash already underway, if people concerned with loss of control aren't in that conversation, it will be more confused and do worse things by their lights.\n\nPlus, the policy status quo today is so bad that there are many more ways for things to get better than to get worse. Where the public has strong reactions to this stuff I usually think their common sense takes are solid.\n\nI would bet against the general public coming in and tearing down the few good technocratic things that already exist (e.g. SB53). They're more likely to demand extra transparency and rules that are improvements, even if not the perfect policy.\n\nFurthermore, if 'going off the rails' is the main reservation there are some orgs like Humans in Control or PauseAI UK that seem likely to stay focused and truthful.\n\nORGS IN THIS BROAD SPACE\n\nHere are some organisations doing things of this kind and a few notes on what they are about (via Claude).\n\nI am not very familiar with their work so do not take their inclusion as an endorsement - I am trying to list what's out there both good and bad:\n\n• Humans in Control (US). Trains volunteer leaders, starting in early-primary states, to make AI safeguards a 2028 election issue. Connects jobs, kids and data centres to loss of control. Long-term goal: a verifiable international deal not to build AI we can’t control.\n\n• PauseAI UK (UK). Protests, plus an open letter from 60+ UK politicians criticising Google DeepMind. Until recently run on £100k a year (!).\n\n• PauseAI Global (Netherlands). Coordinates PauseAI chapters in about 16 countries. Is probably what you think of as PauseAI.\n\n• Evitable (US). AI professor David Krueger’s group to inform and organise the public to end the race to superintelligence.\n\n• Stop the AI Race (US). Started by ex-AI researcher Michael Trazzi. Marches between the labs' SF offices. The ask: each lab stops building new frontier models if the others credibly do the same.\n\n• AISAP (US). AI safety workshops for mainstream audiences in cities around the US, facilitated by local volunteers.\n\n• QuitGPT (US). Boycott of ChatGPT over OpenAI leaders’ political donations and government contracts. Organised by young progressive activists. Claims 1.5M+ participants. (Note, not especially focused on extreme risks.)\n\n• Guardrails (US). A super PAC plus an affiliated nonprofit, launched by Democratic operatives with tech workers and unions behind it. Populist and small-dollar. PAC gifts are limited to US citizens and permanent residents. (Political naturally.)\n\nThese are orgs that I have seen criticised or which I expect more people will have reservations about (alas I simply don't have time to investigate myself, but you could):\n\n• ControlAI (UK + US). Single issue: an international ban on superintelligence, not general anti-AI sentiment. Has briefed many UK parliamentarians.\n\n• PauseAI US (US). Protests, lobbying and community-building for an international treaty to pause frontier AI. (Controversial because PauseAI Global publicly disendorsed PauseAI US’s current leadership over repeated personal attacks on people that could be counterproductive. I mostly share these worries.)\n\n• Irreplaceable (US). Founded by climate movement veterans (Sunrise, 350org). Turns anger over data centres, bills, layoffs and kids into a push for “a say, a stake, and a slowdown.\"\n\n• Humans First (US). A right wing group pushing an ‘America First’ AI policy. Chaired by RNC member and Trump ally Amy Kremer. Ran a ‘Data Center Revolt’ bus tour. Wants mandatory government testing and approval of frontier models before release.\n\nPARTICULAR ISSUES RE GIVING TO ADVOCACY\n\nBecause they engage in political advocacy, not all of these orgs offer tax deductible giving, though some do. Some are irrationally put off by the absence of tax deductibility. For top-rate taxpayers lack of tax deductibility can increase the effective price by 2x, but one project can easily be much more than 2x as cost-effective as another, so it shouldn't dominate your thinking.\n\n(In cases where there's both a tax deductible c3 and a political c4, it may be better to give a smaller amount to the non-charitable vehicle so they have more flexibility on spending.)\n\nSome take money from AI company staff, especially junior staff, some don't. I don't think AI company staff should feel sheepish giving to (most of) these groups.\n\nA FURTHER NON-CONSEQUENTIALIST MOTIVE FOR THIS WORK: AUTONOMY, FAIRNESS, DEMOCRACY, RESPECT\n\nA separate consideration in favour of this work that resonates with me is about legitimacy and autonomy.\n\nAll of these innocent people are having their lives risked, and their desired futures torn away, without almost any consultation or consent.\n\nIf I treated the people around me this way, even in honest pursuit of good consequences, it would rightly be viewed as an appalling violation of their autonomy.\n\nAll else equal, it's wrong to knowingly keep adults in the dark about very important factors affecting their lives that they would want to know about and react to.\n\nEven if an individual will react poorly by my lights, that should be their choice to make, not mine. That should be our default stance to the general public in a democracy also. \n\n(Yes, this consideration can be outweighed if the reaction will be sufficiently awful, but respect for other people's autonomy is a default you should have to be argued away from.)\n\nThis also makes me allergic to the intellectual's aversion to mass politics. The line of argument that mass politics has such low epistemic standards it's best avoided, if applied consistently, would suggest that the public should be sidelined to the extent possible, and self-assessed experts allowed to decide how society evolves in their place.\n\nWhile such a system has particular advantages, I don't think it's better all things considered - and history shows it's wildly less robust. A messier less accurate discussion is the price we pay to live in a society in which a wider range of people are given a chance to defend their interests and argue for their beliefs.", "created_at": "2026-11-13T16:43:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 38, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121278278598115580", "url": "https://x.com/robertwiblin/status/2121278278598115580", "text": "@JonathanSalter_ Thanks Jonathan, obviously I just got Claude to quickly write that stuff up!", "created_at": "2026-11-13T16:25:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "JonathanSalter_", "reply_to_id": "2121277734408081646", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121277734408081646", "author_handle": "JonathanSalter_", "author_name": "Jonathan Salter", "text": "@robertwiblin Just a bit of a correction - ControlAI has 180+ UK lawmakers as supporters in preventing superintelligence, but I believe has briefed hundreds more, and introduced legislation banning superintelligence in the UK. Also has briefed half of all Congressional offices in the last year", "links": {}, "media": [], "url": "https://x.com/JonathanSalter_/status/2121277734408081646", "created_at": "Fri Nov 13 16:23:17 +0000 2026"}, "enriched": 3}, {"id": "2121277509555945853", "url": "https://x.com/robertwiblin/status/2121277509555945853", "text": "@gmiller I mean I think I'm basically agreeing with you here.\n\n(I don't know whether it's been a mistake for a full 10 years, but when its come up I've been arguing in favour of laying groundwork in this way since at least 2022.)", "created_at": "2026-11-13T16:22:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "gmiller", "reply_to_id": "2121276716224221329", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121276716224221329", "author_handle": "gmiller", "author_name": "Geoffrey Miller", "text": "@robertwiblin We can have pristine epistemic integrity and runaway intelligence-signaling. \n\nOr we can actually stop unalignable ASI.\n\nFor ten years, EA has made the wrong choice.\n\nTime to choose what saves our kids.", "links": {}, "media": [], "url": "https://x.com/gmiller/status/2121276716224221329", "created_at": "Fri Nov 13 16:19:15 +0000 43", "likes": 543, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334617169096704/img/mQr9fAN_0u_GP6yA.jpg"}], "links": {"https://t.co/woRayV8Eya": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121374553246990652", "url": "https://x.com/robertwiblin/status/2121374553246990652", "text": "SCOOP: How Nvidia turned Washington against it.\n\nTons of new info on the company's, uh, unorthodox approach to lobbying. Incredibly fun to write with @ashleyrgold @rogoswami and great edits from @sbanjo\n\nhttps://t.co/uRDVj35SKD https://t.co/3EVAu2Nr4Q", "created_at": "2026-11-13T22:48:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "rt_avatar": "https://pbs.twimg.com/profile_images/1824166072620032001/Si-LBcmO_normal.jpg", "rt_id": "2121342496102105384", "likes": 159, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCFsfJa4AAIlQj.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXCFsrLbkAEzKqh.jpg"}], "links": {"https://t.co/uRDVj35SKD": "https://www.semafor.com/article/11/13/2026/how-nvidias-jensen-huang-and-trump-jumped-the-guardrails", "https://t.co/3EVAu2Nr4Q": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121373494562754978", "url": "https://x.com/robertwiblin/status/2121373494562754978", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math.", "created_at": "2026-11-13T22:43:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2121331333654086124", "likes": 4677, "retweets": 397, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB7mp4bQAAKN3a.jpg"}], "links": {"https://t.co/U17rzSxrFD": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2119420691242172509", "url": "https://x.com/deanwball/status/2119420691242172509", "text": "@bayeslord amen", "created_at": "2026-11-08T13:24:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bayeslord", "reply_to_id": "2119302004040409518", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119302004040409518", "author_handle": "bayeslord", "author_name": "bayes", "text": "I’ve honestly been laughing since the midterms. Of course you messed this up. You were willing at every turn to dissemble, talk your book and engage in signaling and bullshit rather than be real and honest about what’s going on, and how serious it all is. I tried to help steer this at various points, I really did try, but was both rebuffed and, admittedly, somewhat lacking in courage and agency. Either way, thank god for the honest people. I’ll try to be a better citizen. \n\nYou may think destructive politics are on the rise. Maybe they are. But such crescendos needn’t destroy America. This is a fragilizing mindset. And I’m sorry, but I’m not moving to Dubai. I’m not moving to China. I’m not moving to Argentina. Americans are my people, this is my home. If you want to flee, be my guest. Our society is going through an important process right now and I want to be here for it. Humans are defending themselves against the machine. As they should.\n\nTechnocapital is a great tool, but technocapital worship can be actively harmful, particularly at this juncture in history where, for the first time, all future needed technological progress is technologically overdetermined, if not yet socially. Maximizing technocapital’s power is a reward hack on the flourishing function for humanity. You are ignorant or lying if you claim this proxy is the true target. \n\nLove you all, but I must insist we evolve. 2023 part 2 blue tsunami edition is a losing approach for tech and the world, and I can feel people flirting with it. Let’s do something new.", "links": {}, "media": [], "url": "https://x.com/bayeslord/status/2119302004040409518", "created_at": "Sun Nov 08 05:32:27 +0000 2026"}}, {"id": "2119395534528020948", "url": "https://x.com/deanwball/status/2119395534528020948", "text": "I’ve honestly been laughing since the midterms. Of course you messed this up. You were willing at every turn to dissemble, talk your book and engage in signaling and bullshit rather than be real and honest about what’s going on, and how serious it all is. I tried to help steer this at various points, I really did try, but was both rebuffed and, admittedly, somewhat lacking in courage and agency. Either way, thank god for the honest people. I’ll try to be a better citizen. \n\nYou may think destructive politics are on the rise. Maybe they are. But such crescendos needn’t destroy America. This is a fragilizing mindset. And I’m sorry, but I’m not moving to Dubai. I’m not moving to China. I’m not moving to Argentina. Americans are my people, this is my home. If you want to flee, be my guest. Our society is going through an important process right now and I want to be here for it. Humans are defending themselves against the machine. As they should.\n\nTechnocapital is a great tool, but technocapital worship can be actively harmful, particularly at this juncture in history where, for the first time, all future needed technological progress is technologically overdetermined, if not yet socially. Maximizing technocapital’s power is a reward hack on the flourishing function for humanity. You are ignorant or lying if you claim this proxy is the true target. \n\nLove you all, but I must insist we evolve. 2023 part 2 blue tsunami edition is a losing approach for tech and the world, and I can feel people flirting with it. Let’s do something new.", "created_at": "2026-11-08T11:44:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2119302004040409518", "likes": 81, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119254084066656619", "url": "https://x.com/deanwball/status/2119254084066656619", "text": "We need to stop using generic terminology. AI is not a monolith. There are critical things we need to do with AI for economic prosperity, there are things we may have to do for reasons of national competition, there are things we will at some point need to do carefully for the sake of charting and taming the computational universe, and there are things we should totally avoid doing at this stage of history, and maybe ever, if at all possible. \n\nIf we can’t be precise about these issues because we’re saying vague things like “using coding agents to make AI progress should be illegal”, then we risk failing altogether. Each of the goals above depends on achieving the others. \n\nIf we can’t prosper we can’t lead the world into the future. Everyone needs to internalize this. Democrats cannot subjugate themselves to antigrowth. Republicans cannot subjugate themselves to technocapital. Both roads lead to despair.", "created_at": "2026-11-08T02:22:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2119170935035248904", "likes": 281, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119233592077467714", "url": "https://x.com/deanwball/status/2119233592077467714", "text": "once a model is produced it’s infinitely replicable and downloadable across the world, to be run on toasters. anyone who is comparing the difficulty of regulating AI to regulating nuclear weapons is selling you a crock of shit", "created_at": "2026-11-08T01:00:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.
