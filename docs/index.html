"2125532966340239395", "author_name": "", "links": {}, "author": "", "text": ""}, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125894379189768595", "url": "https://x.com/theobearman/status/2125894379189768595", "text": "Reuters reports that the launch of Zhipu AI’s 3-trillion-parameter GLM-5.5 could slip to Q1 2027 or later, with OpenAI and Anthropic’s crackdown on model distillation contributing to the delay.\n\nMoonshot AI, the company behind Kimi, estimates internally that the gap between major model releases could stretch from the usual six months to 12 months or more if new U.S. rules cut off its access to rented computing power overseas. Kimi K4 could slip to mid-2027. A person familiar with Moonshot’s operations said the computing capacity available in China wouldn’t be enough to make up the shortfall.\n\nhttps://t.co/7JarHv2CCd", "created_at": "2026-11-26T10:08:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "jukan05", "rt_author_name": "Jukan", "rt_avatar": "https://pbs.twimg.com/profile_images/2113208994739433472/RG71j-sh_normal.jpg", "rt_id": "2125887732035867002", "likes": 569, "retweets": 71, "media": [], "links": {"https://t.co/7JarHv2CCd": "https://www.reuters.com/world/china/us-chip-curbs-distillation-crackdown-threaten-chinese-ai-model-development-2026-11-26/"}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125856984071319913", "url": "https://x.com/theobearman/status/2125856984071319913", "text": "FT Exclusive: The chipmaker has told its manufacturing partners to stop shipping servers to four south-east Asian countries, as the US steps up export controls to prevent Chinese access to AI computing power. https://t.co/q9hoD57lL2 https://t.co/RaFm5K4cWe", "created_at": "2026-11-2 ched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125769047375741116", "url": "https://x.com/theobearman/status/2125769047375741116", "text": "NEWS: Pentagon officials were working on a plan to use Defense Production Act to nudge Nvidia to re-install Jensen Huang as CEO w/the argument it related to national security. Convo shows the lengths Trump administration was willing to go to intervene:\nhttps://t.co/nYx7G09hoc", "created_at": "2026-11-26T01:50:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "nancook", "rt_author_name": "Nancy Cook", "rt_avatar": "https://pbs.twimg.com/profile_images/1336883253693837312/92tx0Nkx_normal.jpg", "rt_id": "2125720907423621513", "likes": 1180, "retweets": 455, "media": [], "links": {"https://t.co/nYx7G09hoc": "https://www.washingtonpost.com/technology/2026/11/25/hegseth-pentagon-officials-floated-using-wartime-law-reappoint-nvidia-ceo/"}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123882425143210437", "url": "https://x.com/anton_d_leicht/status/2123882425143210437", "text": "it'll be very hard to compete for global markets if the labs can't anchor deals in infrastructure. \n\nit's already hard enough to assuage allied concerns about kill switches. if all the chips are in America, no ally will build around American AI, no matter how much they need it.", "created_at": "2026-11-20T20:53:24+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2123836545346285698", "author_name": "Rapid Response 47", "links": {"https://t.co/FiH1LfAQDu": ""}, "author": "RapidResponse47", "text": ".@POTUS: \"Whoever wins SI, wins... We're not allowing data centers to go into other countries — because China will take all of them, and we're not allowing that to happen.\" https://t.co/FiH1LfAQDu"}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123576693302735160", "url": "https://x.com/ohlennart/status/2123576693302735160", "text": "California’s new AI safety report is the most serious policy proposal for recursive self-improvement from any government I’ve seen. Very exciting!\n\nIt recommends the procedural machinery to actually slow down if & when we need to: verified compute disclosures for automated AI R&D, standby authority to cap that compute, emergency shutdown powers, mandatory loss-of-control reporting, and broadened whistleblower protections. \n\nYou can’t pace what you can’t see. If implemented, this would let the state see, and then act. \n\nI hope the legislature moves on this when it’s back next month—AI developers seem on track to recursive self-improvement within 6-12 months, so we need these mechanisms practiced and working ASAP.", "created_at": "2026-11-20T00:38:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "j_asminewang", "rt_author_name": "Jasmine Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/2117754086024183808/Y1CS_Mma_normal.jpg", "rt_id": "2123471358919364736", "likes": 162, "retweets": 26, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2125831109690925096", "url": "https://x.com/ohlennart/status/2125831109690925096", "text": "Everyone should read @kevinroose's The AGI Chronicles. It's astonishingly good. \n\nIt does three things. First, gives a great overview of the recent history of AI from the last 10 years, bringing you mostly up to speed on what's going on now.\n\nSecond, it provides non-experts with a good understanding of the technology without dumbing it down excessively.\n\nThird, it provides a characterization of the people driving the AI race and their culture at a level of detail previously reserved for friends of lab employees. Most obviously, Dario, Sam, and Demis.\n\nFor people with little background wondering what the hell is happening, it provides a natural one-stop-shop. For people who have been in the space for a while, it provides pretty essential information on the history and people that I didn't have, at least.\n\nHave recommended it to three friends so far and gotten better reviews than any non-fiction I have recommended so far. \n\n(Nobody took up my encouragement to read The Power Broker).", "created_at": "2026-11-26T05:56:47+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "PReaulx", "rt_author_name": "Paul de Font-Reaulx", "rt_avatar": "https://pbs.twimg.com/profile_images/1412166213019615243/2wuJ3QC6_normal.jpg", "rt_id": "2125820975711412593", "likes": 22, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123577682621292697", "url": "https://x.com/NateWitkin/status/2123577682621292697", "text": "The huge gulf between smart people's expectations and how soon we'll find out who's right is one of my favorite things about the present moment. It's like the build-up to a series finale.", "created_at": "2026-11-20T00:42:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "rt_avatar": "https://pbs.twimg.com/profile_images/1941687232538013696/jN33mhMu_normal.jpg", "rt_id": "2123566167260369050", "likes": 415, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123847744637039011", "url": "https://x.com/NateWitkin/status/2123847744637039011", "text": "BREAKING: The Nasdaq Composite officially turns negative for 2026, erasing a gain of +19%. https://t.co/yPDb7Ul9ds", "created_at": "2026-11-20T18:35:36+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "KobeissiLetter", "rt_author_name": "The Kobeissi Letter", "rt_avatar": "https://pbs.twimg.com/profile_images/1975243710846640128/fwYCe67Y_normal.jpg", "rt_id": "2123810146006532136", "likes": 6985, "retweets": 698, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlJ9zuXkAA6HS-.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlJ9zuXkAA6HS-.png"}], "links": {"https://t.co/yPDb7Ul9ds": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123846309228711963", "url": "https://x.com/NateWitkin/status/2123846309228711963", "text": "@birchlse @StefanFSchubert I don't think this is right.\n\nhttps://t.co/vpa4AvLJ0J", "created_at": "2026-11-20T18:29:53+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "birchlse", "reply_to_id": "2123825611986911639", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets":
