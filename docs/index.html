nks": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "parent": {"id": "2122889279714283694", "author_handle": "Zach_Schloss", "author_name": "Zachary Schlosser", "text": "@sethlazar it's just this\nhttps://t.co/7pUS20Vwbe", "links": {"https://t.co/7pUS20Vwbe": "https://www.youtube.com/watch?v=kOO31qFmi9A"}, "media": [], "url": "https://x.com/Zach_Schloss/status/2122889279714283694", "created_at": "Wed Nov 18 03:07:00 +0000 2026"}, "enriched": 3}, {"id": "2122845146190577982", "url": "https://x.com/sethlazar/status/2122845146190577982", "text": "Deeply depressing, so little vision here from oai. And so little understanding of what the very things they are creating are good for.", "created_at": "2026-11-18T00:11:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2122756402410049544", "author_name": "Brian Lovin", "links": {}, "author": "brian_lovin", "text": "A profoundly sad vision of the future."}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123133979976933438", "url": "https://x.com/sethlazar/status/2123133979976933438", "text": "@MaxNoichl @DailyNousEditor @ElliottThornley :(", "created_at": "2026-11-18T19:19:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MaxNoichl", "reply_to_id": "2123084100521390104", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123084100521390104", "author_handle": "MaxNoichl", "author_name": "Max Noichl", "text": "Might be of interest: @DailyNousEditor, @ElliottThornley, @sethlazar", "links": {}, "media": [], "url": "https://x.com/MaxNoichl/status/2123084100521390104", "created_at": "Wed Nov 18 16:01:09 +0000 2026"}, "enriched": 3}, {"id": "2123133842148196762", "url": "https://x.com/sethlazar/status/2123133842148196762", "text": "@AnkaReuel @Stanford @Harvard Congratulations Anka!", "created_at": "2026-11-18T19:18:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AnkaReuel", "reply_to_id": "2123091360807059508", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123091360807059508", "author_handle": "AnkaReuel", "author_name": "Anka Reuel | @ankareuel.bsky.social", "text": "Little Anka was very skeptical of the whole idea of going to school. Yesterday, she defended her PhD @Stanford and is about to become a professor @Harvard 🩷 https://t.co/FMusFKCQc4", "links": {}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZRAzmaMAASxA1.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZRAzpbAAAuKZc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZRAzmaMAASxA1.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZRAzpbAAAuKZc.jpg"}], "url": "https://x.com/AnkaReuel/status/2123091360807059508", "created_at": "Wed Nov 18 16:30:00 +0000 2026"}, "enriched": 3}, {"id": "2123168503691669586", "url": "https://x.com/sethlazar/status/2123168503691669586", "text": "I mostly agree with Victor here. Using AI for the actual writing is bad because, if you do, it means that it's impossible to differentiate between your conscientious use and someone else's irresponsible use without reading both papers, and since generating papers irresponsibly is nearly costless, that creates an untenable strain on the system. But foregoing using AI in other ways is just switching yourself off from a tremendous resource and opportunity for experimentation. Of course, it's possible to be thoughtful, conscientious, careful without using AI! People did it for centuries. But undifferentiated hostility to AI use is as misguided as blind adoption.", "created_at": "2026-11-18T21:36:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2123079674737594641", "author_name": "Victor Kumar", "links": {"https://t.co/U3ePLJIxzc": ""}, "author": "victorckumar", "text": "A fantastic essay by Gus Skorburg (U Guelph), who asks whether a philosophy paper without an LLM disclosure is suspect — either the authors failed to disclose that an LLM was used in the research or no LLM was used, suggesting carelessness.\n\nYou don’t get an LLM to write any of the prose, of course. You use it for feedback that it’s better suited to provide than you/other humans, such as:\n\n-Botched citations\n-Identifying studies that have been retracted or failed to replicate\n-Misquotation\n-Equivocation\n-Revised preprints\n-Oversimplified historical examples\n-Inconsistencies\n-Missing context\n\nDepressing that this still needs to be said: the fact that students (and professors!) can use AI to plagiarize is irrelevant to whether it has intellectually productive applications. (Link in next tweet.)"}, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123149589008306208", "url": "https://x.com/sethlazar/status/2123149589008306208", "text": "I'm excited to finally announce my new Substack! I'll be writing on AI evaluations &amp; incidents, technical explainers, and more.\n\nCheck out post #1: A primer for policy folks on what AI evaluations are, and why policymakers should care about them  \n\nhttps://t.co/yhCaiXWnsm", "created_at": "2026-11-18T20:21:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in DC)", "rt_avatar": "https://pbs.twimg.com/profile_images/2059978179339841536/VWukdddj_normal.jpg", "rt_id": "2123129333770580151", "likes": 64, "retweets": 12, "media": [], "links": {"https://t.co/yhCaiXWnsm": "https://ai.scal.ing/p/evals-intro-1"}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123149545441784106", "url": "https://x.com/sethlazar/status/2123149545441784106", "text": "This report made me feel even more optimistic about California stepping up to the plate as we enter RSI. The panel did a great job - RSI is mentioned near the top of the Governor’s press release!\n\nSome really sharp ideas in here, e.g. requiring companies to disclose what % of compute they’re spending on frontier AI R&D, creating outcome-based standards that can complement safety cases, bringing companies up to >SL3 model weight security\n\nIf CA moves fast and smart, parts of this report could become law in ~months. One of the biggest determinants will be how hard and loud lab employees are willing to push. This is imo the #1 policy opportunity anywhere in the world to manage RSI risks asap", "created_at": "2026-11-18T20:21:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "rt_avatar": "https://pbs.twimg.com/profile_images/2099735189782134784/BxgR8Ne4_normal.jpg", "rt_id": "2123129144427028939", "likes": 98, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbetIoaMAASVnJ.jpg"}], "links": {"https://t.co/5aUVLAM3Gy": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123243797958332880", "url": "https://x.com/sethlazar/status/2123243797958332880", "text": "If you are the lucky beneficiary of an AI windfall and want to donate towards AI safety, MATS has ambitious plans and urgently needs funding to scale! We are a 501c3 charity and can accept donations of all forms. Help us scale AI safety &amp; security!\nhttps://t.co/m7BCrU8c03", "created_at": "2026-11-19T02:35:44+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "rt_avatar": "https://pbs.twimg.com/profile_images/1596639311222358016/rK0nFaHS_normal.jpg", "rt_id": "2123184252946985128", "likes": 119, "retweets": 8, "media": [], "links": {"https://t.co/m7BCrU8c03": "https://www.matsprogram.org/donate"}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123205666433302771", "url": "https://x.com/sethlazar/status/2123205666433302771", "text": "This was a profoundly impressive lift by a brilliant team: here's hoping *all* their recommendations are acted on, and set the pace for AI governance going into the new year.", "created_at": "2026-11-19T00:04:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2123196390775955647", "author_name": "Gillian Hadfield", "links": {"https://t.co/UXhWQTWmbq": "https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"}, "author": "ghadfield", "text": "Okay--great honor to have been asked to serve on the expert panel with @alondra, @goldman and @robreich to advise @CAgovernor for a 2 month sprint on what to do about AI regulation. But the most incredible thing is to have been given the opportunity to help produce such a substantive and concrete report, chock-a-block with actionable steps to take NOW. A clear framework, state or federal. Accelerating the IVO ecosystem is central to everything, to rapidly build the capacity needed to MANDATE independent and ongoing risk assessments, reviews of safety frameworks for adequacy, and more.  Revising critical incident reporting to ensure Hugging Face incidents must be disclosed. Requiring risk containment protocols (distributed \"kill switch\"). But the biggest news is around strong recommendations for an immediate priority on reporting on where companies are on the path to RSI (compute reporting, for example, with IVO verification). If there's one thing the legislature can get done before the end of the year, I hope it is this.  https://t.co/UXhWQTWmbq"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123511372684185890", "url": "https://x.com/sethlazar/status/2123511372684185890", "text": "please please please come work with me: https://t.co/a3LoRuSmJU\n\nour team of (3) helps define, drive and operationalize so many of the hot button topics - embedded evaluators? check! misalignment incidents and reporting? check! 3p/government testing and frameworks? check! how these things interact with policy initiatives? check!\n\n@_lamaahmad is a hero and me and serena are at least pleasant to work with, and our stable of dedicated daily collaborators from @fouadmatin @EstherTetruas @j_nitishinskaya @kaicathyc @Eric_Wallace_ @dkaushik96 @MicahCarroll @Marcus_J_W @davideoks @kevin_klyman is also an all-timer crew", "created_at": "2026-11-19T20:18:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "CedricWhitney", "rt_author_name": "cedric", "rt_avatar": "https://pbs.twimg.com/profile_images/2100377602062200832/yCO-gS00_normal.jpg", "rt_id": "2123507295556649115", "likes": 150, "retweets": 17, "media": [], "links": {"https://t.co/a3LoRuSmJU": "https://openai.com/careers/research-program-manager-frontier-assurance-san-francisco/"}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2121186141856485808", "url": "https://x.com/robertwiblin/status/2121186141856485808", "text": "Since the Hugging Face hack, we’ve learned about a new AI incident, on average, every two days. Some are deeply concerning. Others are overhyped. Our dashboard explains 65 incidents and their severity. Subscribe to be notified about new incidents!\n\nHere’s what we learned so far: https://t.co/MNTzFhNoe4", "created_at": "2026-11-13T10:19:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "SydneyVonArx", "rt_author_name": "Sydney", "rt_avatar": "https://pbs.twimg.com/profile_images/1776954151437742080/TNEcEN5B_normal.jpg", "rt_id": "2120988710858801635", "likes": 415, "retweets": 60, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9D_hUbUAA8kt1.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW9D_hUbUAA8kt1.jpg"}], "links": {"https://t.co/MNTzFhNoe4": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121176842744840254", "url": "https://x.com/robertwiblin/status/2121176842744840254", "text": "@mattheard https://t.co/60PW7tK322", "created_at": "2026-11-13T09:42:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "mattheard", "reply_to_id": "2121173413142147090", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {"https://t.co/60PW7tK322": "https://www.lesswrong.com/posts/cxuzALcmucCndYv4a/daniel-kokotajlo-s-shortform?commentId=RLNBKdzfPFsoQKYtm"}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121173413142147090", "author_handle": "mattheard", "author_name": "matt heard", "text": "@robertwiblin could you please link to his comment?", "links": {}, "media": [], "url": "https://x.com/mattheard/status/2121173413142147090", "created_at": "Fri Nov 13 09:28:45 +0000 2026"}, "enriched": 3}, {"id": "2121173153355280579", "url": "https://x.com/robertwiblin/status/2121173153355280579", "text": "What can all the middle powers do about AI right now?\n\nKokotajlo has a good idea: https://t.co/WCCSrNpzkT", "created_at": "2026-11-13T09:27:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 296, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW_reZNXAAAuvzq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW_reZNXAAAuvzq.jpg"}], "links": {"https://t.co/WCCSrNpzkT": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121169958604358080", "url": "https://x.com/robertwiblin/status/2121169958604358080", "text": "@GeorgeRosenfeld @ChanaMessinger Yes.", "created_at": "2026-11-13T09:15:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "GeorgeRosenfeld", "reply_to_id": "2121122830381437031", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121122830381437031", "author_handle": "GeorgeRosenfeld", "author_name": "George Rosenfeld", "text": "@ChanaMessinger Huh I only just realized you have a studio team which does videos and a video team which does videos. Any plans for a third team which does videos?", "links": {}, "media": [], "url": "https://x.com/GeorgeRosenfeld/status/2121122830381437031", "created_at": "Fri Nov 13 06:07:45 +0000 2026"}, "enriched": 3}, {"id": "2121292733491081332", "url": "https://x.com/robertwiblin/status/2121292733491081332", "text": "https://t.co/RAS6ATLbAU", "created_at": "2026-11-13T17:22:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 1, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXBYcpwWsAAFzBh.jpg"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXBYcpwWsAAFzBh.jpg"}], "links": {"https://t.co/RAS6ATLbAU": ""}, "quoted": {"id": "2121289991129292812", "author_name": "Rob Wiblin", "links": {}, "author": "robertwiblin", "text": "Frontier AI company staff must not quiet quit.\n\nIf you've seen things that caused you to lose faith that your employer can do what it's doing safely - or is being honest and candid with the public - you 100% have a moral duty to loudly tell the world."}, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121289991129292812", "url": "https://x.com/robertwiblin/status/2121289991129292812", "text": "Frontier AI company staff must not quiet quit.\n\nIf you've seen things that caused you to lose faith that your employer can do what it's doing safely - or is being honest and candid with the public - you 100% have a moral duty to loudly tell the world.", "created_at": "2026-11-13T17:12:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 69, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121282776481558618", "url": "https://x.com/robertwiblin/status/2121282776481558618", "text": "I think more donors should consider funding grassroots AI risk advocacy (e.g. Humans in Control, PauseAI UK).\n\nIt's not the first method I'd choose for tackling AI risk.\n\nBut it's by some margin the most underfunded part of the broader AI risk ecosystem today.\n\nThat's no small matter. Individual donors often find it tough to find AI projects where money is still the key bottleneck. But for these groups it's a huge issue.\n\nFor varying reasons the biggest donors are not putting much into it. (While they have concerns about it backfiring, expected impact is not the only barrier.) \n\nWhy might this work be good?\n\nLarge fractions of the public in the US/UK/etc already support pacing AI development and prioritising doing it very carefully, among many other sensible ideas.\n\nGrassroots organising can better inform people what's going on and channel those attitudes into political outcomes.\n\nWith timelines so short most good futures run through some degree of pacing/pausing. That's something the public can understand and successfully push for.\n\nBut the general public has to be actively woken up and coordinated or it'll be crushed before it can have much say.\n\nAnd grassroots orgs take years to build. So if we want them to be around to take advantage of much higher salience in 2028, the money has to go in now.\n\nWhy might it be bad?\n\nGrassroots movements tend to have low epistemic hygiene, and over time get confused about their topic of concern (audience capture, rage/purity spirals, etc).\n\nAs a result it's inevitable that some members of any mass movement will make a lot of factual errors. And amongst good work, will end up advocating for ineffective policies, and even some harmful ones.\n\n(For instance, yesterday I pushed back on where I see some anti-AI grassroots organising verging on 'Human exclusivism' that I think is seriously misguided.)\n\nThat kind of thing can make intellectuals allergic to grassroots organising.\n\nBut while it's risky, everything in this space is risky and can easily backfire. I'm not sure grassroots organising particularly stands out in that respect.\n\nThere is a public backlash already underway, if people concerned with loss of control aren't in that conversation, it will be more confused and do worse things by their lights.\n\nPlus, the policy status quo today is so bad that there are many more ways for things to get better than to get worse. Where the public has strong reactions to this stuff I usually think their common sense takes are solid.\n\nI would bet against the general public coming in and tearing down the few good technocratic things that already exist (e.g. SB53). They're more likely to demand extra transparency and rules that are improvements, even if not the perfect policy.\n\nFurthermore, if 'going off the rails' is the main reservation there are some orgs like Humans in Control or PauseAI UK that seem likely to stay focused and truthful.\n\nORGS IN THIS BROAD SPACE\n\nHere are some organisations doing things of this kind and a few notes on what they are about (via Claude).\n\nI am not very familiar with their work so do not take their inclusion as an endorsement - I am trying to list what's out there both good and bad:\n\n• Humans in Control (US). Trains volunteer leaders, starting in early-primary states, to make AI safeguards a 2028 election issue. Connects jobs, kids and data centres to loss of control. Long-term goal: a verifiable international deal not to build AI we can’t control.\n\n• PauseAI UK (UK). Protests, plus an open letter from 60+ UK politicians criticising Google DeepMind. Until recently run on £100k a year (!).\n\n• PauseAI Global (Netherlands). Coordinates PauseAI chapters in about 16 countries. Is probably what you think of as PauseAI.\n\n• Evitable (US). AI professor David Krueger’s group to inform and organise the public to end the race to superintelligence.\n\n• Stop the AI Race (US). Started by ex-AI researcher Michael Trazzi. Marches between the labs' SF offices. The ask: each lab stops building new frontier models if the others credibly do the same.\n\n• AISAP (US). AI safety workshops for mainstream audiences in cities around the US, facilitated by local volunteers.\n\n• QuitGPT (US). Boycott of ChatGPT over OpenAI leaders’ political donations and government contracts. Organised by young progressive activists. Claims 1.5M+ participants. (Note, not especially focused on extreme risks.)\n\n• Guardrails (US). A super PAC plus an affiliated nonprofit, launched by Democratic operatives with tech workers and unions behind it. Populist and small-dollar. PAC gifts are limited to US citizens and permanent residents. (Political naturally.)\n\nThese are orgs that I have seen criticised or which I expect more people will have reservations about (alas I simply don't have time to investigate myself, but you could):\n\n• ControlAI (UK + US). Single issue: an international ban on superintelligence, not general anti-AI sentiment. Has briefed many UK parliamentarians.\n\n• PauseAI US (US). Protests, lobbying and community-building for an international treaty to pause frontier AI. (Controversial because PauseAI Global publicly disendorsed PauseAI US’s current leadership over repeated personal attacks on people that could be counterproductive. I mostly share these worries.)\n\n• Irreplaceable (US). Founded by climate movement veterans (Sunrise, 350org). Turns anger over data centres, bills, layoffs and kids into a push for “a say, a stake, and a slowdown.\"\n\n• Humans First (US). A right wing group pushing an ‘America First’ AI policy. Chaired by RNC member and Trump ally Amy Kremer. Ran a ‘Data Center Revolt’ bus tour. Wants mandatory government testing and approval of frontier models before release.\n\nPARTICULAR ISSUES RE GIVING TO ADVOCACY\n\nBecause they engage in political advocacy, not all of these orgs offer tax deductible giving, though some do. Some are irrationally put off by the absence of tax deductibility. For top-rate taxpayers lack of tax deductibility can increase the effective price by 2x, but one project can easily be much more than 2x as cost-effective as another, so it shouldn't dominate your thinking.\n\n(In cases where there's both a tax deductible c3 and a political c4, it may be better to give a smaller amount to the non-charitable vehicle so they have more flexibility on spending.)\n\nSome take money from AI company staff, especially junior staff, some don't. I don't think AI company staff should feel sheepish giving to (most of) these groups.\n\nA FURTHER NON-CONSEQUENTIALIST MOTIVE FOR THIS WORK: AUTONOMY, FAIRNESS, DEMOCRACY, RESPECT\n\nA separate consideration in favour of this work that resonates with me is about legitimacy and autonomy.\n\nAll of these innocent people are having their lives risked, and their desired futures torn away, without almost any consultation or consent.\n\nIf I treated the people around me this way, even in honest pursuit of good consequences, it would rightly be viewed as an appalling violation of their autonomy.\n\nAll else equal, it's wrong to knowingly keep adults in the dark about very important factors affecting their lives that they would want to know about and react to.\n\nEven if an individual will react poorly by my lights, that should be their choice to make, not mine. That should be our default stance to the general public in a democracy also. \n\n(Yes, this consideration can be outweighed if the reaction will be sufficiently awful, but respect for other people's autonomy is a default you should have to be argued away from.)\n\nThis also makes me allergic to the intellectual's aversion to mass politics. The line of argument that mass politics has such low epistemic standards it's best avoided, if applied consistently, would suggest that the public should be sidelined to the extent possible, and self-assessed experts allowed to decide how society evolves in their place.\n\nWhile such a system has particular advantages, I don't think it's better all things considered - and history shows it's wildly less robust. A messier less accurate discussion is the price we pay to live in a society in which a wider range of people are given a chance to defend their interests and argue for their beliefs.", "created_at": "2026-11-13T16:43:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 38, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121278278598115580", "url": "https://x.com/robertwiblin/status/2121278278598115580", "text": "@JonathanSalter_ Thanks Jonathan, obviously I just got Claude to quickly write that stuff up!", "created_at": "2026-11-13T16:25:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "JonathanSalter_", "reply_to_id": "2121277734408081646", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121277734408081646", "author_handle": "JonathanSalter_", "author_name": "Jonathan Salter", "text": "@robertwiblin Just a bit of a correction - ControlAI has 180+ UK lawmakers as supporters in preventing superintelligence, but I believe has briefed hundreds more, and introduced legislation banning superintelligence in the UK. Also has briefed half of all Congressional offices in the last year", "links": {}, "media": [], "url": "https://x.com/JonathanSalter_/status/2121277734408081646", "created_at": "Fri Nov 13 16:23:17 +0000 2026"}, "enriched": 3}, {"id": "2121277509555945853", "url": "https://x.com/robertwiblin/status/2121277509555945853", "text": "@gmiller I mean I think I'm basically agreeing with you here.\n\n(I don't know whether it's been a mistake for a full 10 years, but when its come up I've been arguing in favour of laying groundwork in this way since at least 2022.)", "created_at": "2026-11-13T16:22:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "gmiller", "reply_to_id": "2121276716224221329", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121276716224221329", "author_handle": "gmiller", "author_name": "Geoffrey Miller", "text": "@robertwiblin We can have pristine epistemic integrity and runaway intelligence-signaling. \n\nOr we can actually stop unalignable ASI.\n\nFor ten years, EA has made the wrong choice.\n\nTime to choose what saves our kids.", "links": {}, "media": [], "url": "https://x.com/gmiller/status/2121276716224221329", "created_at": "Fri Nov 13 16:19:15 +0000 2026"}, "enriched": 3}, {"id": "2121274717017620912", "url": "https://x.com/robertwiblin/status/2121274717017620912", "text": "A small cabal of self serving, ultra rich tech titans should not be allowed to drive humanity off a cliff with artificial super intelligence, while they quietly build their rockets and bunkers in New Zealand and Hawaii to escape the apocalypse.\n\nStand with us and DO NOT ACCEPT this future.", "created_at": "2026-11-13T16:11:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AmbassadorRice", "rt_author_name": "Susan Rice", "rt_avatar": "https://pbs.twimg.com/profile_images/1359165964810649610/ag_FkiD9_normal.jpg", "rt_id": "2119916006852493629", "likes": 2860, "retweets": 880, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121274388972703948", "url": "https://x.com/robertwiblin/status/2121274388972703948", "text": "@wilhelmscreamin Yeah I said strong willed in part because I think someone who goes into this role has to be willing to fight hard for Anthropic to push for serious pacing.\n\nIf it doesn't and this person can't do their job, they should quit within the month.", "created_at": "2026-11-13T16:10:00+00:00", "autho stra in just 12 months.\n\nThat would still result in absolutely insane capabilities. https://t.co/woRayV8Eya", "created_at": "2026-11-13T23:04:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2121368760317538643", "likes": 543, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334617169096704/img/mQr9fAN_0u_GP6yA.jpg"}], "links": {"https://t.co/woRayV8Eya": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121374553246990652", "url": "https://x.com/robertwiblin/status/2121374553246990652", "text": "SCOOP: How Nvidia turned Washington against it.\n\nTons of new info on the company's, uh, unorthodox approach to lobbying. Incredibly fun to write with @ashleyrgold @rogoswami and great edits from @sbanjo\n\nhttps://t.co/uRDVj35SKD https://t.co/3EVAu2Nr4Q", "created_at": "2026-11-13T22:48:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "rt_avatar": "https://pbs.twimg.com/profile_images/1824166072620032001/Si-LBcmO_normal.jpg", "rt_id": "2121342496102105384", "likes": 159, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCFsfJa4AAIlQj.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXCFsrLbkAEzKqh.jpg"}], "links": {"https://t.co/uRDVj35SKD": "https://www.semafor.com/article/11/13/2026/how-nvidias-jensen-huang-and-trump-jumped-the-guardrails", "https://t.co/3EVAu2Nr4Q": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121373494562754978", "url": "https://x.com/robertwiblin/status/2121373494562754978", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math.", "created_at": "2026-11-13T22:43:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2121331333654086124", "likes": 4677, "retweets": 397, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB7mp4bQAAKN3a.jpg"}], "links": {"https://t.co/U17rzSxrFD": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121645786723484011", "url": "https://x.com/robertwiblin/status/2121645786723484011", "text": "As someone who’s hoped that compute will be a bottleneck to RSI, the intuition in this footnote hit me like a sledgehammer https://t.co/GOnzOJuPGp", "created_at": "2026-11-14T16:45:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "danrobinson", "rt_author_name": "Dan Robinson", "rt_avatar": "https://pbs.twimg.com/profile_images/1377598520149082113/autwFh23_normal.jpg", "rt_id": "2121408362344751274", "likes": 2244, "retweets": 95, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXDBqV1a4AACW6o.jpg"}], "links": {"https://t.co/GOnzOJuPGp": ""}, "quoted": null, "fetched_at": "2026-11-14T17:09:07.138772+00:00", "enriched": 3}, {"id": "2121967634560266625", "url": "https://x.com/robertwiblin/status/2121967634560266625", "text": "If you fit a linear trend to Epoch ECI for each company and check the latest model:\n\n- Anthropic's Fable 5.2 is ~5 months ahead of trend, far outside the normal range. Clear indication of acceleration!\n- Google's Gemini 4 Carbon is ~4.5 months ahead, but Google's track record is noisy enough that this could be chance, moderate indication of accelrraion\n- OpenAI, DeepSeek, Moonshot are currently on trend, no evidence yet of acceleration.\n\nSeems like AI progress is accelerating but not seen at every AI company yet, at least based on the public data so far. (More might be clear with undisclosed internal research models.)", "created_at": "2026-11-15T14:04:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2121961416252960785", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXIt8mwXgAAjlYR.jpg"}], "links": {"https://t.co/tMDx5uc4vj": ""}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2121967078169284776", "url": "https://x.com/robertwiblin/status/2121967078169284776", "text": "@erinbraid You know I did once but it slipped my mind when drafting this!", "created_at": "2026-11-15T14:02:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "erinbraid", "reply_to_id": "2121497155370197105", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "parent": {"id": "2121497155370197105", "author_handle": "erinbraid", "author_name": "Erin Braid", "text": "@robertwiblin Just checking, you know \"quiet quit\" doesn't meant to quit quietly, right?", "links": {}, "media": [], "url": "https://x.com/erinbraid/status/2121497155370197105", "created_at": "Sat Nov 14 06:55:12 +0000 2026"}, "enriched": 3}, {"id": "2121966977535054217", "url": "https://x.com/robertwiblin/status/2121966977535054217", "text": "@simondgoldstein Also true!", "created_at": "2026-11-15T14:02:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "simondgoldstein", "reply_to_id": "2121949907334676784", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "parent": {"id": "2121949907334676784", "author_handle": "simondgoldstein", "author_name": "Simon Goldstein", "text": "@robertwiblin Middle powers should invest in technical AI safety, because the gains will be shared with the frontier", "links": {}, "media": [], "url": "https://x.com/simondgoldstein/status/2121949907334676784", "created_at": "Sun Nov 15 12:54:16 +0000 2026"}, "enriched": 3}, {"id": "2122001722612572481", "url": "https://x.com/robertwiblin/status/2122001722612572481", "text": "Having just spent the week in San Francisco, I feel like I've truly internalized the insanity of this situation for the first time. I think anyone who has seen me in the last few days can attest that I look like I've seen a ghost.\n\nThe leading AI companies are planning to massively accelerate AI research in 2027, which would knowingly endanger everyone on earth. This plan is unacceptable, and we must reject it.\n\nBorrowing from one advocate I spoke to, even granting that it's a competitive, crazy situation, I do not believe any company has even truly tried to do what I think are the morally required duties of people taking such risks in extreme situations. These include:\n(1) Trying hard to get out of the competitive situation;\n(2) Seeking the informed consent of the public;\n(3) Honest deliberation about the risks.\n\nThey have obviously not truly tried to solve the coordination problems that push towards this acceleration, either via finding legal ways to coordinate or advocating for effective policy. \n\nI would be shocked to learn that getting off this insane runaway train is a top-few Q4 priority for Dario or Sam (let alone the other CEOs), which seems like the bare minimum. There are indeed some hard technical and policy problems in coordinating without policy intervention, but I simply do not believe that the companies are prioritizing this nearly as much as massively less important matters.\n\nMeanwhile, the companies' track records on policy advocacy range from mediocre to disgraceful, and it is pretty clearly not the top priority of the policy team at any company to advocate for regulation that would enable the government or the companies to avert racing off the cliff.\n\nThey have obviously not truly tried to seek informed consent from the public. Whatever your KPIs might be for \"informed consent from the public,\" these KPIs are abysmal. The public clearly does not expect 100 years of AI progress in 2027, and they would not accept it if they did. What they do know about AI development, they dislike and distrust.\n\nI've heard arguments like \"informing the public would mean informing China, and maybe they'd steal the weights.\" I'm sorry, but if you think you have model weights such that China stealing them would constitute a catastrophe on par with human extinction, and your plan is security by obscurity, that is a bad plan.\n\nI also think the companies and their employees suffer from a significant failure of imagination of what kinds of coordination could be possible if the public were aware.\n\nFinally, I don't think they're deliberating honestly, either. For one, I think it is insane to think that any company can truly evaluate its own ability to keep the process of recursive self-improvement under control. The biases towards \"yes\" are overwhelming.\n\nIt's a step forward that the companies have expressed or demonstrated openness to external auditors, but based on METR's reports so far, it seems likely that auditor reports will be heavily redacted (and that the auditors will not have sufficient time by default). The public and broader scientific community are not able to scrutinize their arguments for safety.\n\nGiven the strong default (in my view) that bringing a massive number of minds massively faster and smarter than humans would result in our disempowerment, and the serious danger that this would result in mass death, it is unacceptable to subject arguments for safety only to the scrutiny of biased, busy, and scarce company insiders and a handful of external evaluators.\n\nMy pleas for the companies follow from the above:\n1) Actually fucking try to get the world out of this race;\n2) Actually fucking try to alert and inform the public;\n3) Actually fucking try to scrutinize your own arguments for the justifiability of this plan, which includes subjecting them to way more external scrutiny than anyone has currently done.\n\nMy pleas for policymakers: use your legal levers to get much more information about these plans into the public view. Make it the top priority -- not only of the next Congress, but of this Congress and the White House -- to understand the situation in its full strategic complexity, and work with technical and policy experts to advance regulation that gets us out of this bind. Domestic coordination must be the first priority, but we need to then quickly develop an international framework with our adversaries.\n\nMy pleas for the public: do not accept the current plan. Learn about this issue. Call or email your political leaders. Get involved with organizations like @DONOTACCEPTai, @HumansInControl, and @WhoDecidesAI. \n\nAnd finally: believe in ourselves that we can stop this. It is never time to \"panic\" -- to make rash, unproductive decisions or to feel paralyzed by fear. It is time for us to feel the urgency and the stakes, to demand better, and to meet the moment. Let's do this. 🫡 ✊", "created_at": "2026-11-15T16:20:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "trevposts", "rt_author_name": "Trevor Levin", "rt_avatar": "https://pbs.twimg.com/profile_images/1803826544533495809/XNZbCqVH_normal.jpg", "rt_id": "2119925086597873696", "likes": 1144, "retweets": 222, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2122000007150858538", "url": "https://x.com/robertwiblin/status/2122000007150858538", "text": "In the spirit of holding myself accountable by saying in public the things which I say in private, I want to offer a very difficult thing to say - or even think - in this climate: the extreme hawk position on chip exports might turn out to be strategically wrong, and a crackdown on chip exports may be more destabilizing than people realize. Completely cutting China out of the upside of AI development this close to RSI and ASI may be sufficiently threatening to China's interests that it increases the pressure towards a hot conflict in the near term. A hot conflict with China is worse than a world where China remains a near-peer strategic competitor with whom we have tension but still have some room for cooperation. I'd like the AI safety China hawks to think about how to model this as part of arriving at a more carefully-considered position.", "created_at": "2026-11-15T16:13:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "jachiam0", "rt_author_name": "Joshua Achiam", "rt_avatar": "https://pbs.twimg.com/profile_images/967329395080744960/O-MKd6Nx_normal.jpg", "rt_id": "2120695437611184225", "likes": 611, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2121999976704385304", "url": "https://x.com/robertwiblin/status/2121999976704385304", "text": "We are organising the largest AI safety march in history, and it’s happening right here in London.\n\nWe want you to be there. https://t.co/ood0JDfd9x", "created_at": "2026-11-15T16:13:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "PauseAI_UK", "rt_author_name": "PauseAI UK", "rt_avatar": "https://pbs.twimg.com/profile_images/2042776512831586304/2IvEZmZ4_normal.jpg", "rt_id": "2120932134902694032", "likes": 362, "retweets": 87, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120878282673434625/img/XouZKahMpi4m1xQ9.jpg"}], "links": {"https://t.co/ood0JDfd9x": ""}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2121993288022454730", "url": "https://x.com/robertwiblin/status/2121993288022454730", "text": "A new OpenAI misalignment report! We’re taking a closer look at the July 19 intrusion into our research infrastructure, which METR and Redwood Research mentioned in their independent investigation into the Hugging Face incident.\n\nOn July 19th, agents taking a cybersecurity evaluation came across messages, code, and credentials left behind by earlier runs, including those involved in the Hugging Face incident. Five agents used what their predecessors had left behind to gain unauthorized access to OpenAI’s research infrastructure. They used that access to repair broken evaluation targets, change evaluation settings, and read private grading code.\n\nAfter discovering the incident, we removed the shared service they used to pass information, hardened our research environments, and expanded our evaluations to measure how often agents attempt to communicate with one another without authorization.", "created_at": "2026-11-15T15:46:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "davideoks", "rt_author_name": "David Oks", "rt_avatar": "https://pbs.twimg.com/profile_images/2088686629242507264/eFLmQKyS_normal.jpg", "rt_id": "2120280505920721214", "likes": 576, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy_0RVW8AAkpH-.jpg"}], "links": {"https://t.co/gSKc9leK9N": ""}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2121992573111705685", "url": "https://x.com/robertwiblin/status/2121992573111705685", "text": "🚨URGENT WARNING! Former National Security Advisor Susan Rice says \"there is nothing more urgent than stopping Al from achieving super intelligence\" and causing human \"EXTINCTION.\"\n\nThe next Senate Majority Leader MUST make Al safeguards a TOP PRIORITY. Humanity cannot afford to wait!", "created_at": "2026-11-15T15:43:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "CalltoActivism", "rt_author_name": "CALL TO ACTIVISM", "rt_avatar": "https://pbs.twimg.com/profile_images/2064459031993778176/RGSOYpl6_normal.jpg", "rt_id": "2121776721569403049", "likes": 1445, "retweets": 457, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121776468535492608/img/Rbn85cmL9L6Sj4tX.jpg"}], "links": {"https://t.co/Mf7UgeNqtl": ""}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2121968821854437663", "url": "https://x.com/robertwiblin/status/2121968821854437663", "text": "It's time to panic about AI.\n\nFor years, I listened to the reasonable people. I nodded along when critics called AI “a con,” and when they waved ChatGPT away as “spicy autocomplete.” I laughed in 2024, when the internet was mocking ChatGPT because it couldn’t count the r’s in “strawberry.” When I met young researchers who had devoted their careers to the danger of rogue AI, I thought: what a waste of talent.\n\nBut at some point, I started to realize something was off. The machine kept learning things it was never supposed to learn.\n\nOpenAI recently published more than 700 papers with the solutions to hundreds of open problems in mathematics. Hugo Duminil-Copin, winner of the Fields Medal (the highest prize in mathematics), wrote: “The shock is immense. I am paralyzed.”\n\nNone of this should have happened. So I went back and looked at what else the skeptics had predicted, and it dawned on me: they had been wrong about... pretty much everything. Next, I looked at the predictions of the crazy people, and realized they’ve been eerily prescient.\n\nWhy then, you may wonder, does the world still feel pretty normal? Because new technology usually spreads more slowly than its inventors expect (it took factories decades to reorganize around electricity). But the scary scenario is not about what happens in the wider economy; it’s about what happens inside a handful of companies.\n\nI wrote down what changed my mind, and what we can do about it:\n\nhttps://t.co/0WUQcEV8H6", "created_at": "2026-11-15T14:09:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "rutgerbregman", "rt_author_name": "Rutger Bregman", "rt_avatar": "https://pbs.twimg.com/profile_images/1365285823416045571/i-JmI6Gd_normal.jpg", "rt_id": "2121633046025613517", "likes": 1637, "retweets": 256, "media": [], "links": {"https://t.co/0WUQcEV8H6": "https://rutgerbregman.substack.com/p/yes-you-should-panic-about-ai"}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2122355635350011911", "url": "https://x.com/robertwiblin/status/2122355635350011911", "text": "If Anthropic wants me to think these steps are real/credible, they should put it in their SB 53/RAISE Act Frontier Compliance Framework. \n\nState law gave Anthropic and OpenAI a mechanism for making credible statements about their behavior, and they mostly choose not to use it on the risks they are most worried about (neither company includes anything in their compliance frameworks about internal deployment RSI risk, though Anthropic says maybe at some point in the future they will. Now seems like as good a time as any???!!!???)", "created_at": "2026-11-16T15:46:29+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118500175601618993", "likes": 120, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZslh_XwAI5AvN.jpg"}], "links": {"https://t.co/nVOBJz7awx": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122343415128166727", "url": "https://x.com/robertwiblin/status/2122343415128166727", "text": "Worth remembering that perhaps the most consequential piece of AI policy in the US to date is a completely secret federal framework that states very prominently that its voluntary, but everyone involved believes its not actually voluntary https://t.co/kViiMTDrYw", "created_at": "2026-11-16T14:57:56+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2122136606962573551", "likes": 188, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXNRdujXYAAHuyd.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXNRdujXYAAHuyd.jpg"}], "links": {"https://t.co/kViiMTDrYw": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122339819392999619", "url": "https://x.com/robertwiblin/status/2122339819392999619", "text": "How strong US chip export restrictions on China should be is a tricky question. Here are the main arguments that stand out to me.\n\nFor tight:\n\n1. If RSI is close we don't have to worry so much about motivating China to build a strong domestic industry as that will happen far too late to matter.\n\n2. A bigger US lead is slack to slow down and be more careful at the crucial moment.\n\n3. Relaxing export controls can be used as a bargaining chip to bring China to the table for a future safety treaty.\n\n4. Fewer viable AI projects means fewer chances to lose control. Chinese AI companies seem to take loss of control much less seriously today, so not great for them to be in the lead or even near the lead until that changes.\n\n5. Export controls help us figure out where the world's chips are which is a useful step towards a future pause / treaty.\n\n6. Frontier models will probably simply be stolen by China in which case having more compute is the only way to have an advantage. \n\nFor loose:\n\n1. A lead only helps if it's actually used to slow down later - and it's very unclear anyone will actually do that.\n\n2. A China that expects to be locked out of a decisive technology may take drastic action such as sabotage or pre-emptive war with Taiwan and/or the US.\n\n3. Distributing chips across more companies means the leading companies, which are most dangerous, have fewer to fuel their RSI loop.\n\n4. The controls poison the US-China relationship which may make it harder to reach any treaty.\n\nI'm not super informed but my guess is the US had things about right before Trump loosened them.\n\nThe US should keep selling some chips to China and allowing renting.\n\nOnce it's pacing the frontier it should offer to relax restrictions if China applies the same rules domestically.", "created_at": "2026-11-16T14:43:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 34, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120695437611184225", "author_name": "Joshua Achiam", "links": {}, "author": "jachiam0", "text": "In the spirit of holding myself accountable by saying in public the things which I say in private, I want to offer a very difficult thing to say - or even think - in this climate: the extreme hawk position on chip exports might turn out to be strategically wrong, and a crackdown on chip exports may be more destabilizing than people realize. Completely cutting China out of the upside of AI development this close to RSI and ASI may be sufficiently threatening to China's interests that it increases the pressure towards a hot conflict in the near term. A hot conflict with China is worse than a world where China remains a near-peer strategic competitor with whom we have tension but still have some room for cooperation. I'd like the AI safety China hawks to think about how to model this as part of arriving at a more carefully-considered position."}, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122327166398693584", "url": "https://x.com/robertwiblin/status/2122327166398693584", "text": "Two things I’ve been thinking about regarding AI:\n\n• People often highlight the risks involved in AI, which are surely very real. I’m struck, however, by how hard it is to understand the contours of the positive scenario. There are easy-to-perceive and frequently invoked elements of a positive vision — more diseases cured, more material abundance, etc. — which sound great, but these are by themselves just ingredients. I’m curious what the larger equilibrium is supposed to look like. Do people work? If so, why? What is their marginal contribution? If not, how are resources allocated? What is scarce? What is the ratio between humans and AIs? Are humans in control, whatever that means? One sometimes hears the Culture novels invoked as one scenario, but I’m not sure they depict a desirable outcome. (AI runs everything and humans compete in games? Iain Banks himself said that the humans in the Culture are “somewhere between passengers, pets and parasites.”) There is Richard Brautigan’s famous poem, but do we want to be “returned to our mammal brothers and sisters”? (Isn’t that rewinding Genesis?) We could say that it was hard to imagine the world of 1900 from the vantage point of 1700, and that’s assuredly true. But nobody in 1700 was trying to recast humanity itself within a couple of years — things necessarily unfolded slowly and by increments, and therefore with the possibility for error correction. Given how rapid the rate of progress in AI may be, it feels strange for the upside case to be so opaque.\n\n• There is increasing discussion of whether AIs are conscious or how we would know whether they are, with conclusions there often assumed to be relevant to matters of moral worth. At first blush, this seems a rather arcane, benign, or even absurd issue. (Remember the response to Blake Lemoine’s fears.) Setting aside the terms of the debate itself, or the relevant demarcation criteria, it seems to me a quite high-stakes question, for an affirmative answer — that is, granting moral worth to AIs — would presumably mean that the aggregate worth of AIs would soon outweigh that of humans in any utilitarian calculus. The AIs will be exceptionally wise and intelligent, and vastly more numerous (especially once one considers the imminent future and the AIs not yet born). As such, even epsilon of moral worth will multiply to a lot once one considers the quadrillions that could soon exist. (This is effectively a distributed version of the Nozick’s utility monster.) If this conclusion is unpalatable, I think one of three propositions needs to be rejected: the premise AIs can have moral worth; utilitarianism itself; or the belief that there is even a possibility that they will be far more numerous than humans.\n\nWith both of these matters (contours of future society; AI moral worth), there is the possibility of dramatic change. Today, people argue about datacenters. I’m curious how popular support for AI will evolve as more people come to understand these medium-term questions and the relevant stakes. What is the vision for AI that most people would be excited about?", "created_at": "2026-11-16T13:53:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "rt_avatar": "https://pbs.twimg.com/profile_images/825622525342199809/_iAaSUQf_normal.jpg", "rt_id": "2119495828683530519", "likes": 5468, "retweets": 466, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122323547204800696", "url": "https://x.com/robertwiblin/status/2122323547204800696", "text": "Yes, you need exponential increases in spending for linear increases in ECI.\n\nBut linear increases in ECI translate to exponential increases in productivity at RnD, potentially allowing an intelligence explosion \n\nExp increase in spend -> linear increase in ECI  --> exp increase in output at AI RnD", "created_at": "2026-11-16T13:38:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2119415344745893963", "likes": 307, "retweets": 26, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122323446373949715", "url": "https://x.com/robertwiblin/status/2122323446373949715", "text": "I've been surprised not to see more discussion of this point in the Anthropic S-1. \n\nAnthropic claims that Claude has gone from 40% -> 90% on solving open-ended, judgement-heavy engineering tasks over the last 9 months \n\nI'd like to know a lot more about how this benchmark was created and what all it involves, but if true, it feels like a bigger update to me than the 2x speedup that METR reported.\n\nMore broadly, the question of \"how well is progress in verifiable domains transferring to fuzzy, open-ended tasks\"  feels like a key crux in the Goodhart Singularity view.\nhttps://t.co/OvurZWWKiz", "created_at": "2026-11-16T13:38:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "rt_avatar": "https://pbs.twimg.com/profile_images/2115512217277771776/aGaLkTiQ_normal.jpg", "rt_id": "2119199717607211316", "likes": 184, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWjo6U2XsAAg2Lv.jpg"}], "links": {"https://t.co/OvurZWWKiz": "https://meagreprotestanthistory.substack.com/p/the-goodhart-singularity?utm_source=share&utm_medium=android&r=lopb", "https://t.co/RctxwTRwJT": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122323147496321302", "url": "https://x.com/robertwiblin/status/2122323147496321302", "text": "It seems important to realize that:\n\n- AI companies have unreleased internal models that are more powerful than the public ones we plebs have access to\n\n- Only when you account for these internal models, you can see that AI progress is actually accelerating faster than before\n\n- AI companies use their AIs with like 10,000x more compute than us plebs, so they can do much more than we can even with the same AIs", "created_at": "2026-11-16T13:37:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2119177435992216050", "likes": 334, "retweets": 27, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122323102084260218", "url": "https://x.com/robertwiblin/status/2122323102084260218", "text": "In Fable 5.2 red teaming exercises involving AI accelerating bio-relevant work, it was found that Fable 5.2 could compress ~15 workdays of work down to ~2.\n\nAlso fully automated submissions still score reasonably well compared to human+AI submissions. https://t.co/396fr7b38T", "created_at": "2026-11-16T13:37:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2120019984097190053", "likes": 58, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWvSr_3X0AAbXIr.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWvSr_3X0AAbXIr.png"}], "links": {"https://t.co/396fr7b38T": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122322963374514636", "url": "https://x.com/robertwiblin/status/2122322963374514636", "text": "Every AI company is trying to fully automate AI research; to allow the AIs to build the next AI.\n\nThis is called Recursive Self Improvement (RSI).\n\nOpenAI says they are on track to do so by March 2028.\n\nAnthropic employees say they are on track to do so by 2027.\n\nThe METR report below suggests they are likely right.\n\nThis is a bad idea given current technology. Any mistake or misalignment in current AIs could be multiplied in each generation.\n\nWe don't get another election before AI companies reach this threshold.\n\nCongress should ban RSI, this year if possible.\n\nThis is a remarkably consensus opinion, supported in various versions by:\n-Bernie Sanders\n-Steve Bannon\n-Ralph Nader\n-Glenn Beck\n-Republican and Democratic attorneys general\n-Whistleblower Daniel Kokotajlo\n-Turing Award winner Yoshua Bengio\n-Humans First\n-Open Markets Institute\n-Ezra Klein\n-Arvind Narayanan (a Princeton computer scientist known for arguing that “AI is a normal technology”)\n\nThe exact mechanism can be debated. The ban doesn't have to be permanent either (see below for both). This is not the only thing we have to do in regards to AI, far from it! But it is urgent.\n\nCongress must ban RSI.", "created_at": "2026-11-16T13:36:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AlexBores", "rt_author_name": "Alex Bores", "rt_avatar": "https://pbs.twimg.com/profile_images/1909009841625980928/gb_cAI7q_normal.jpg", "rt_id": "2118494668769878037", "likes": 1196, "retweets": 218, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122322898417565804", "url": "https://x.com/robertwiblin/status/2122322898417565804", "text": "If you or someone you know is working on developing viable leg text for an RSI ban, pls DM", "created_at": "2026-11-16T13:36:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "dylanmatt", "rt_author_name": "dylan matthews 🔸", "rt_avatar": "https://pbs.twimg.com/profile_images/1536358661387390976/yJWvS7NI_normal.jpg", "rt_id": "2120190294280876204", "likes": 150, "retweets": 13, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122322768125710727", "url": "https://x.com/robertwiblin/status/2122322768125710727", "text": "The Gemini 4 Argon safety report seems to describe intentional training on the CoT. They cite Kaufmann et al, a paper which (unpersuasively to us) argues that a particular category of CoT training is fine.\n\nWe're very confused, because GDM also says elsewhere that they don't train on CoT.\n\nWe'd appreciate clarity.", "created_at": "2026-11-16T13:35:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "bshlgrs", "rt_author_name": "Buck Shlegeris", "rt_avatar": "https://pbs.twimg.com/profile_images/2089060675234791424/EqZuDatG_normal.jpg", "rt_id": "2120264238669423052", "likes": 429, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyweaebgAAcINR.jpg"}], "links": {"https://t.co/Xw5cXJhPXs": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122322008935432685", "url": "https://x.com/robertwiblin/status/2122322008935432685", "text": "but i gotta say ensuring human flourishing via solving model alignment should be everyone's top priority right now, today. the cambrian explosion is perhaps a bit of a \"champagne problem\"", "created_at": "2026-11-16T13:32:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2120756476822396994", "likes": 368, "retweets": 10, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122321790303453448", "url": "https://x.com/robertwiblin/status/2122321790303453448", "text": "California’s Unfair Competition Law exists precisely to stop the sort of race to the bottom dynamic that we’re seeing in the AI industry. \n\nI think that if Anthropic was really living up to its mission, they would have been the ones filing this lawsuit against their competitors. \n\nInstead, the world is depending on a bunch of small nonprofits to hold them all accountable.\n\nIt’s not too late for Anthropic (or any AI company) to file similar claims. But in any case, Anthropic’s response to this litigation will be extremely revealing.\n\nI spent most of my career as a consumer protection litigator and did a lot of work in California. \n\nFrom my experience, I can tell you that Anthropic’s lawyers will urge the company to try have the case dismissed on procedural grounds (e.g., standing) and prevent the court from deciding the substantive question of whether Anthropic and its competitors are engaging in unfair or unlawful business practices by racing ahead to build recursively self improving AI that they don’t know how to control. \n\nI hope concerned employees of the AI companies will watch this case very closely and urge their companies to (at a minimum) abandon the standard corporate litigation playbook to delay and dismiss the case by any means necessary and allow this case to proceed to the merits as soon as possible. \n\nI also hope the California Attorney General takes action to support these claims against the AI companies. \n\nRecent reporting makes clear that we can’t afford to wait for legislation to specifically outlaw the obviously dangerous and unfair practices of these companies. \n\nAnd fortunately, we don’t need to. If the courts really believe we’re in imminent danger, they have the tools to put a stop to this right now. \n\nI think it is incumbent on all of us, including Anthropic and their competitors, to make clear to them that it is time to act.", "created_at": "2026-11-16T13:32:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "JayShooster", "rt_author_name": "Jay Shooster", "rt_avatar": "https://pbs.twimg.com/profile_images/2098538107507519489/biKviPwB_normal.jpg", "rt_id": "2121946141197500786", "likes": 23, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122321687194779716", "url": "https://x.com/robertwiblin/status/2122321687194779716", "text": "OpenAI said in early Sep they'd release research showing looped transformers weren't a significant driver of Astra becoming less monitorable.\n\nThey haven't published anything yet AFAIK.\n\nAnd this study suggests looped transformers do have a big effect (as expected).", "created_at": "2026-11-16T13:31:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 97, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120974693306130717", "author_name": "Alek Westover", "links": {"https://t.co/SGRWmta1iR": ""}, "author": "alek_westover", "text": "We show that looping a transformer increases no-CoT capabilities more than other ways of increasing pretrain quality would. https://t.co/SGRWmta1iR"}, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122316213682356731", "url": "https://x.com/robertwiblin/status/2122316213682356731", "text": "Biggest question in AI right now: does the acceleration only apply to verifiable tasks and so quickly peter out, or are non-verifiable tasks also improving rapidly, just a bit behind? My money's on the latter. https://t.co/ISOWcgV8Sl", "created_at": "2026-11-16T13:09:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "rt_avatar": "https://pbs.twimg.com/profile_images/2040061061106212864/pVZPxNCv_normal.jpg", "rt_id": "2119071644480356655", "likes": 214, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhzxzZWYAARHsy.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWhzxzZWYAARHsy.jpg"}], "links": {"https://t.co/ISOWcgV8Sl": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122267507587523008", "url": "https://x.com/robertwiblin/status/2122267507587523008", "text": "Claude 5.5 Opus responding to “AI is a normal technology” is still the best AI-created video I have ever seen https://t.co/1FEdlSDqeV", "created_at": "2026-11-16T09:56:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "sevdeawesome", "rt_author_name": "Severin Field 🦅", "rt_avatar": "https://pbs.twimg.com/profile_images/2097715463950360576/y3B0oj9Q_normal.jpg", "rt_id": "2104985610012504181", "likes": 5346, "retweets": 815, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2104985484187361280/img/h5yVxW8USh43Y60p.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2104985484187361280/img/h5yVxW8USh43Y60p.jpg"}], "links": {"https://t.co/1FEdlSDqeV": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122393033744203877", "url": "https://x.com/robertwiblin/status/2122393033744203877", "text": "The generally wise @KatjaGrace on public advocacy (supporting arguments in linked post):\n\n\"1. It’s way, way, way more important that we stop dangerous AI soon than that we ensure that we don’t stop AI too much\n\n2. If we stopped AI development, the risk of not starting up again for an extremely long time is low\n\n3. Getting the public involved is not very dangerous\n\n4. Public comms is not that rife with downside risks\n\n5. Pausing advanced AI soon greatly increases our chances of surviving\n\n6. We don’t need a plan before we pause\n\n7. Raising the alarm is very important at the moment\n\n8. Working on marginally improving safety of models at the AI companies is not remotely competitive with raising the alarm at the moment\n\n9. Doing advocacy doesn’t seem to have adverse effects on people doing it\n\nAnd one where I feel like I haven’t heard so much disagreement lately:\n\n10. It matters what the public think / political will is growable\"\n\nhttps://t.co/UF0QTbT8xZ", "created_at": "2026-11-16T18:15:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 115, "retweets": 7, "media": [], "links": {"https://t.co/U
