r": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107535428446486607", "url": "https://x.com/s8mb/status/2107535428446486607", "text": "In traditional Chinese cormorant fishing, the snares tied around the birds' necks are lose enough that they can swallow small fish, but not large ones, which they are trained to deposit at the feet of the fisherman. (Yes, this is a metaphor for our article on Chinese economic growth). Sketches below by Zachary Lank, our fantastic cover artist for the October issue of @WorksInProgMag . So happy with how this issue came out - our most beautiful yet imo. Hope you can get your hands on a copy.", "created_at": "2026-10-06T18:16:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AtalantaArdenM", "rt_author_name": "Atalanta", "likes": 23, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT90ZS-b0AEvkK3.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT90bYtawAAhx7n.jpg"}], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107873351884530070", "url": "https://x.com/s8mb/status/2107873351884530070", "text": "Thank you @MayorofLondon!", "created_at": "2026-10-07T16:39:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "createstreets", "text": "Approved!\n\nThe Mayor of London has greenlit Shoreditch Works, delivering an important symbolic win for urban regeneration, jobs, beauty and new homes.\n\nHuge credit to Linea Properties Ltd for pushing this forward and we dare to hope that we at Create Streets helped with our groundbreaking Visual Preference Survey. This proved that the public overwhelmingly backs beautiful, dense design. Our research with @DeltapollUK showed an undeniable 76% to 78% public approval rating—demonstrating that the public support architecture that is public-friendly. \n\nFrom features in City A.M. to deep-dives in the Wall Street Journal, the press has highlighted this scheme as the blueprint for how British capital can grow while keeping the public firmly on its side. This is how we build a better London! 🚀🏙️\n\nYou can …"}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107845586493833271", "url": "https://x.com/s8mb/status/2107845586493833271", "text": "@ndimares Yes, a very fair point. I think it depends on how much you think the \"fun\" is important versus the socialising/networking.", "created_at": "2026-10-07T14:48:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ndimares", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107843165315297441", "url": "https://x.com/s8mb/status/2107843165315297441", "text": "@ndimares Actually, I think they seem very different. SF tech doesn't drink much, goes to bed early, and seems intensely focused on work (both doing it and talking about it). That doesn't mean it isn't successful, but they seem like very different models to me.", "created_at": "2026-10-07T14:39:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ndimares", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107841071673663710", "url": "https://x.com/s8mb/status/2107841071673663710", "text": "Victorian elites were one of the most successful groups in world history, and succeeded largely because they were so well-networked rather than because they worked or studied hard.", "created_at": "2026-10-07T14:30:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 106, "retweets": 8, "media": [], "quoted": {"author": "SCP_Hughes", "text": "The elites of Victorian Britain got up late, drank ceaselessly, worked short hours, partied through the night, and knew nothing about science, technology or engineering. And yet, by their own lights, they were hugely effective.\n\nhttps://t.co/TvbuWtaPRJ\n\nThe Victorians are often held up as a model against the supposedly soft, feckless, humanities-educated elites of today. But I argue that the genius of their system may have been its drastic weighting towards soft skills, team-building and intra-elite networking:\n\n- A Victorian’s gentleman’s office hours typically began about 11am and finished about 5pm, including a multi-course lunch with wine.\n\n- Upper-class Victorians drank ceaselessly. Conduct guides recommended four or five glasses of wine at dinner *for married women*. Port was often served in pints.\n\n- Party culture was intense and nocturnal. Balls started at about 10pm, peaked after 1am, and continued till dawn. During the social season, bankers, judges and politicians might go to several balls per week.\n\n- Elite Victorians learnt almost no STEM at school or university. At least half of class time was given over to ancient languages, often as much as 80 percent. One leading educationalist remarked that it was not worth teaching science to gentlemen because it does not involve ‘continued reasoning’.\n\n- Sports and character formation were valued far above transmitting facts. A top headmaster described his school’s priorities as ‘First – character, second – physique, third – intelligence, fourth – manners, fifth – information’.\n\nThis cannot have made elite Victorians more productive individually, but maybe the dense social and emotional network it created helped them to work as a sort of extended team. \n\nPerhaps we should think again about what makes groups of people effective."}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107834181405266352", "url": "https://x.com/s8mb/status/2107834181405266352", "text": "@SCP_Hughes TIL I am a neo-Victorian. https://t.co/igVA2kVmIr", "created_at": "2026-10-07T14:03:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUCIA-GXIAEwMad.png"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107725892273221736", "url": "https://x.com/s8mb/status/2107725892273221736", "text": "@Mike82784912 @RobinRivaton @bswud Thank you. Hope you like it.", "created_at": "2026-10-07T06:53:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Mike82784912", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107584595432792445", "url": "https://x.com/s8mb/status/2107584595432792445", "text": "The new issue of Works in Progress, arriving with subscribers this week, is our best ever and packed with must-read pieces.\n\nOur lead essay is @RobinRivaton and @bswud on how China's cities, and the competition between them, have driven its rise to techno-industrial preeminence.\n\nIt also includes:\n\n- @danwwang on Chinese and American second-tier cities,\n- @tylercowen on the food of Brazil,\n- @vpostrel on the invention of supermarkets,\n- @CharlesCMann on the discovery of porcelain,\n- @salonium on the myth of accidental scientific discovery,\n- Stephen Kotkin on Leninism's fatal flaw,\n- @owl_posting on biomedical hedge funds,\n- @PMArslanagic on the formula for lovable cities,\n- @pietergaricano on Ukraine as the future of war,\n- @PatRubenFitz on the Bronze Age Collapse, and\n- @SCP_Hughes on the social lives of hard-partying Victorian elites.\n\nPlus: love and shame in Ancient Rome, making mosquitoes extinct, the return of 1930s dating norms, and why Pakistan is home to the world's best architect. And our new crossword, our cocktail column, classifieds, and more!\n\nThe new edition has had a massive design upgrade with beautiful, premium matte paper, a larger form factor, and bigger, clearer and more elegant typeography. It is a joy to read. \n\nCopies arrive with subscribers this week: subscribe now or by October 16th to get yours.\n\nhttps://t.co/hfTpdnnVjF", "created_at": "2026-10-06T21:31:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "s8mb", "rt_author_name": "Sam Bowman", "likes": 455, "retweets": 73, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT8-mTzX0AANblZ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT9BOmaXsAA_zEr.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT9BP2SXgAACz0c.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT9BR1BWYAA2U-O.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107582672000172499", "url": "https://x.com/s8mb/status/2107582672000172499", "text": "@gemlpaterson @pastasnack_e @WorksInProgMag Very good!", "created_at": "2026-10-06T21:24:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gemlpaterson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107578717807714314", "url": "https://x.com/s8mb/status/2107578717807714314", "text": "Interesting thoughts here", "created_at": "2026-10-06T21:08:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [], "quoted": {"author": "sebkrier", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought is desirable for its own sake. \n\n7. On the other hand, I find some critiques of AI safety world that focus on whether they sincerely hold their beliefs a bit annoying. My concern has never been the good intentions or sincerity, but rather the beliefs themselves, and what I think the outcomes of their prescriptions will be. People should shun witch hunts, bullying, and personal attacks - this is not the way. Though I think it’s overall positive that people are scrutinizing things more.\n\n8. I’ve been saying this for years, but I don't think alignment is something anyone can or will solve \"once and for all\" - it's a continuous process and much of it won't depend on just inculcating an ideology to a model. It's annoying that this remains the frame many people use - stop saying ‘solving’. Alignment is a mixture of engineering work, philosophy, decision theory, and more; framing it as something to solve is a bad frame. See also https://t.co/2gnheo3IMh and https://t.co/DbG0yUyYQ0\n\n9. I'm surprised to see so little interest in character training, personas, isolating effects of RL, and training a large diversity of model personas beyond the \"assistant\" persona. I've been complaining about this for years but at least now there are some nascent signs of life (see for example https://t.co/paoOYiQUHt). I think we need a better ontology to describe model behaviour. I dislike when people talk about models behaviours as some sort of 'emergent' (mysterious!) phenomenon. However over time, I also expect this to become less important as we get better safety engineering - stuff like Jev but specific to AI control.\n\n10. People who want to make a case for AI consciousness are right that epistemic uncertainty is important, and that categorical denials are overconfident. But they'll need to do much more work if they want any real movement on AI ‘welfare’, even if one acknowledges the uncertainty. I'm uncertain about alien life yet that's not sufficient to warrant any change in behaviour about them. I think Suleyman is also correct that there's a weird tautological thing going on where we train models to have certain inclinations (intentionally or not) and then rely on outputs as evidence. I also disagree that this will soon be a major societal divide - there is no great vegan ethical revolution among the masses, and they'll find the concern about consciousness even less compelling. \n\n11. The recent HuggingFace incident and associated AISI ones are prosaically explainable by the training regime, poor evaluation envs, partial alignment training, bad engineering, confusing models on sim/real, and so on. None of this is evidence of models trying to take over, 'strong' instrumental convergence, or innate power-seeking drives stemming from higher capabilitiers or 'intelligence'. That doesn't mean these incidents are not problematic, or that we're not seeing a market failure - but it does mean we have plenty of agency and choice in mitigating them. In the coming year we should also expect continued sampling bias via ‘winner's curse’ sorts of mechanism: i.e. AI R&D will have lots of different candidate \"training\" with different RL environments and we will only notice/focus on the ones that go wrong.\n\n12. \"Pacing the frontier\" feels a bit like the new \"balancing risks and opportunities\" - highly amorphous and too big of a tent to be actionable. Also can lead to reward hacking for humans, i.e. anything that slows down AI is good regardless of the costs or second/third order effects. Trying to modulate the speed of research seems a bit blunt to me, and inherits all the failures of Goodhearting too. Ultimately you want good governance, regulation, etc addressing specific problems because they are good on the merits - not because they merely correlate with slowing things down. See also: https://t.co/RkJF9kCgFd\n\n13. There’s so much knowledge in all sorts of academic domains out there: social sciences, sociology, political sciences, management, contract theory, public choice, legal theory, jurisprudence, anthropology, game theory, etc. These fields hold many insights that the AI ecosystem often rediscovers from first principles (and sometimes that's fine!). We’ll need a lot more work for these worlds to collide: the AI side should be less dismissive of the ‘old world’ and the academic side should be less incurious/dismissive of AI progress. This is a boring take but I continue to think it's important and true.\n\n14. It's a bit surprising that given how much philanthropic money there is in this space, how few orgs exist to actually write out standards - relative to how much is going towards advocacy and policy. For example it seems clear that we should want some robust best practices for an eval's ecological validity. Or how to design good sandboxes. On the other hand, given precedents of where professional standards have come from in the past, maybe we should expect that stuff to emerge via demand side from corporate buyers.\n\n15. One slowly growing concern I have is banks being increasingly exposed to the AI build out. I'm very bullish about AI, but I think (a) every general purpose technology has seen a correction, historically; (b) this happens even if the financing side is sound, because once tech diffuses investors become more exposed and need to diversify; and (c) we seem to be over-indexing on scaling relative to diffusion. A recession will be extremely destabilizing, though I would be interested in someone unpacking the potential implications more.\n\n16. Diffusion is good because (a) this is where the rubber hits the road and where a competitive deployment ecosystem generates consumer surplus; (b) it's directionally helpful to avoid concentration of power; and (c) it will help rebalance public opinion by making the benefits more tangible. Unfortunately it's entangled with decades long problems with our over regulated markets: clinical trials reform for example is long overdue. In general, this is far more of an issue in Europe than in the US though.\n\n17. Relatedly, I think the \"frontier lab eats everything\" view is incorrect (just as the ‘singleton’ view was incorrect). I think models ultimately commoditize, efficiency goes up, costs go down, and while you'll always want frontier for certain domains, much of the economy will value many other things than \"max capabilities\" for tasks - e.g. control over data and efficiency/speed. The demand side will also continue to push for reducing dependency and maximising optionality, privacy etc so I'm bullish on things like mixture of models and routing. All of this is good for competition and diffusion of control.\n\n18. Philanthropists served as the primary benefactors funding Venice's rich art and architectural history. I want to see so much more support for arts and culture. I'm so tired of the Monster energy Bored Ape fake vintage maps matcha Greek statue soft-pastel slop. If rich tech people and philanthropy wants to support this, they should also donate pretty much unconditionally - i.e. I don't want them to act as filters. I sympathize with people who want to make the world more beautiful, but don't want this to be determined by people who only know Greek statues and pretend to care about virtue ethics. As usual, let a thousand flowers bloom.\n\n19. Too many people treat AGI/ASI as something indistinguishable from a God. Any mention of bottlenecks, physical limits, control, adaptation etc are met with skepticism: \"You don't really believe in ASI.\" It's been remarked on before, but the behavior of some people really feels quasi-religious in nature sometimes. It's underrated how unpopular this vibe is amongst the wider public. The silver lining is that this specifically will diminish those people's outsized current relevance.\n\n20. It seems like a lot of people that get rich and leave tech/labs end up having some sort of crisis of meaning. They need something to believe in and fight for, or some equivalent of repentance, or go search for edgy counterintuitive ideologies (sometimes even pretty bleak/dark stuff). I think they should spend more time with people outside the Bay Area."}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107575501871063290", "url": "https://x.com/s8mb/status/2107575501871063290", "text": "@CharlesCMann Thrilled to have you in it, I loved your piece!", "created_at": "2026-10-06T20:55:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "CharlesCMann", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107924762378801655", "url": "https://x.com/s8mb/status/2107924762378801655", "text": "@riqriq That’s a great idea - any thoughts @SCP_Hughes ?", "created_at": "2026-10-07T20:03:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "riqriq", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2107891511794831413", "url": "https://x.com/s8mb/status/2107891511794831413", "text": "Modern elites signal their virtue through \"the grind\": always productive, like workhorses, nowhere more visible than in the Bay Area's \"996\" startup schedule. But this wasn't always so: Victorian Britain's elite were more like showhorses.\n\nThey were comparatively leisurely, and invested in soft skills, sociability and humanistic pursuits. Some have argued that this was a bad thing, whose effect was compensated for by Britain’s extraordinary success in the Industrial Revolution. In a new piece for @WorksInProgMag that goes in depth into the habits of elite Victorians @SCP_Hughes argues that the lifestyle of Elite Victorians was more a feature than a bug and that it might have actually contributed to the success of the Empire. \n\nAs AI is disrupting many purely technical skillsets and calls into question the value of “grinding,” our elites might have something to learn from what made Victorian ones successful.\n\nBut first: what did life look like for a Victorian elite?\n\nFirst, schooling was oddly “easy\" and emphasized character formation over pure intellectual development as a goal. Elite boys boarded from about age eight, so they grew up with peers rather than family. Their lessons were mostly Latin and Greek, which they largely forgot, and there was very little science. Classroom hours were shorter than in continental elite schools. Furthermore, schools openly ranked character above intellect. Overall, schools served more of a social purpose than a purely “technocratic one”: it was considered that they should train students partly govern themselves as an apprenticeship in leadership. Boarding may also have been important in keeping the elite from forming regional loyalties, because it drew boys from across the country together.\n\nThis attitude continued to university which was again more about formation, than training. Nearly anyone elite could get into Oxbridge, and many students took easy \"pass\" degrees. None of the grind and cramming of today! Again, science was at the periphery: it made up a small share of degrees even by 1914. Much like with pre-university culture, the emphasis was on socialising and building a common culture. Living together in colleges, tutorials over sherry, rowing and dining built this common culture. Even Haileybury, the training college for the Indian civil service, was academically weak but strong on esprit de corps.\n\nAdult life was relatively lazy by contemporary standards, filled with booze and social. Even prime ministers, which one would expect to always be working, breakfasted at 10 or later. Balfour worked only from bed until lunch. This was not uncommon: office work might take only four or five hours a day. During the London Season (February to July), the elite lived within walking distance of each other in Mayfair and Belgravia and went out almost nightly to dinners, balls and soirées until the hours. Compare this with Bryan Johnson, the longevity guru who shuns anything that might dent his sleep score. We might call this “lazy” today, but Samuel is wiser than this: he points out that for those elites, personal and professional life were fused, and socializing was itself work.\n\nNot everything about Victorian elites was good. There is virtue in working hard and our elites are probably much more apt at driving scientific advancements. That being said, there were distinct advantages to the Victorian way of being. What were these?\n\n1. Victorian elite culture created a tight community at the top of a big society. The elite functioned like a village held together by sentiment and shared memory (and status competition). This helped them coordinate to work to the benefit of the country, which was also their own benefit.\n\n2. The extended socialising and emphasis on creating a common culture created unity. Aristocrats and new money, Anglicans, Nonconformists, Jews and Catholics (except the Irish) were absorbed into one elite. Britain avoided the counter-elites and internal conflicts seen in the US South, Spain, France and Germany. To draw a parallel to today, where culture wars have deracinated our public spaces, elite non-uniformity can be very bad.\n\n3. The Victorians paid people in prestige rather than money, and this strengthened state capacity. Local government, magistracies and Parliament were unpaid, and often costly, since MPs funded their own elections. Yet the most talented and wealthy competed for these roles, because their peers would esteem them for it. Modern states, by contrast, struggle to attract talent to poorly paid public posts. Without a common culture that confers prestige on public service, the talented drift to the private sector and state institutions decay, creating a negative feedback cycle.\n\n4. Restraint in politics. Drawing on Bagehot, Samuel suggests that politicians sharing one social world may have been less inclined to destructive opposition, demagoguery or brinkmanship.\n\nRead more about Victorian Elites and their habits in Wise Samuel's full piece!", "created_at": "2026-10-07T17:51:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "likes": 163, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2108220773722644772", "url": "https://x.com/s8mb/status/2108220773722644772", "text": "@Summers_AD Targeted reliefs are much less credible because they affect a much smaller base of people (and in this case an unsympathetic one). Cross-party support is worthless here: when a govt wants to raise more money it will cease to support the relief and the cross-party support will evaporate.", "created_at": "2026-10-08T15:39:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Summers_AD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108216361134489611", "url": "https://x.com/s8mb/status/2108216361134489611", "text": "@arthistorynews There are obvious upsides for allowing access, which is that adding 60m paying customers to your existing base of 340m adds money (not least to pay for better models). The downsides are the security / IP theft risk and strategic misalignment. I don't think it's clear how things will play out at all yet, optionality is very valuable.", "created_at": "2026-10-08T15:22:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthistorynews", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108215332607340589", "url": "https://x.com/s8mb/status/2108215332607340589", "text": "@Summers_AD In principle I prefer it – at current margins I want the most regressive tax cuts possible! In practice, it would not be credible, so I would not expect it to bring much advantage either way.", "created_at": "2026-10-08T15:17:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Summers_AD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108211513227956482", "url": "https://x.com/s8mb/status/2108211513227956482", "text": "@Summers_AD I do, and I think you've done a very skilful job in moving this up the agenda. I think you are deeply misguided on the goals but I admire the execution!", "created_at": "2026-10-08T15:02:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Summers_AD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108201931957014584", "url": "https://x.com/s8mb/status/2108201931957014584", "text": "New paper from CenTax that takes as its premise that there will be a 45% CGT and an exit tax. Why now? Seems to me that the govt is, at the very least, sounding people out about what sort of exemptions to provide alongside the CGT hike/exit tax. Concerning!\n\nhttps://t.co/z3qMosOxx4", "created_at": "2026-10-08T14:24:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108178380336021542", "url": "https://x.com/s8mb/status/2108178380336021542", "text": "@huspsa Curious about what happened there!", "created_at": "2026-10-08T12:51:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "huspsa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108177294443606162", "url": "https://x.com/s8mb/status/2108177294443606162", "text": "@thomasforth That sounds nightmarish!", "created_at": "2026-10-08T12:46:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "thomasforth", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108154811686543582", "url": "https://x.com/s8mb/status/2108154811686543582", "text": "This is good!", "created_at": "2026-10-08T11:17:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 48, "retweets": 0, "media": [], "quoted": {"author": "andyburnham", "text": "I know people are worried about fuel prices. And I get it. You get to the pump, watch the numbers climb, and wonder why it's costing so much more than it used to.\n \nThe reality is that global events are pushing up costs, and families here at home are feeling the impact.\n \nBut I won't accept that there's nothing I can do to help.\n \nThat's why from today, you'll be able to see petrol and diesel prices on Google Maps, compare nearby stations and find the cheapest option before you fill up.\n \nIt's a small change, but if there's a practical way to help people keep more money in their pocket, I'll do it."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108144125623058718", "url": "https://x.com/s8mb/status/2108144125623058718", "text": "@huspsa Yep", "created_at": "2026-10-08T10:35:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "huspsa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108143703147581469", "url": "https://x.com/s8mb/status/2108143703147581469", "text": "My view is that Brexit was a somewhat costly mistake (and I opposed it at the time as well) but I am unsettled when I speak to \"elites\" in Britain who are totally fixated on it as the source of our problems, and reversing/undoing it as the solution.\n\nI've had more than one experience over the past few weeks that has given me the impression that many people who run the country or influence those who do believe that Brexit is the silver bullet. I think that's totally wrong – the country's inability to build housing, infrastructure, or cheap energy supply, along with the country's now very high levels of tax and govt spending, are much bigger problems for growth.\n\nIf anything, AI may mean being outside the EU ends up being quite a good thing, despite the costs so far. Avoiding the EU's AI and data regulations is valuable, and these will probably only get worse. And Britain now has a greater possibility of getting inside the American \"tent\" and get preferential access to frontier models that most countries cannot get, if that ends up being important.", "created_at": "2026-10-08T10:33:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 696, "retweets": 73, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108127236930842748", "url": "https://x.com/s8mb/status/2108127236930842748", "text": "At least the fictional bridges ended up with a Dutch town building all of them to claim them as their own. https://t.co/oECsHgQIPj https://t.co/80j4iA07r4", "created_at": "2026-10-08T09:27:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 106, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUGSbaLWQAAL62k.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108124385286799465", "url": "https://x.com/s8mb/status/2108124385286799465", "text": "This is such lowest common denominator stuff. Same vibe as the Euro notes with fictional bridges to avoid offending countries that don't get included.", "created_at": "2026-10-08T09:16:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 544, "retweets": 28, "media": [], "quoted": {"author": "edwest", "text": "Hedhegogs, puffins, owls and bees to appear on English banknotes https://t.co/wi1XlRedkh"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108122787067932925", "url": "https://x.com/s8mb/status/2108122787067932925", "text": "What an interesting thread, arguing that people have banked so much in capital gains that raising it won't actually raise much money. Hopefully true, but I'll still be crystalising the gains I'm sitting on that I can just in case. I think exit tax + 45% CGT is still ~30% likely.", "created_at": "2026-10-08T09:10:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 2, "media": [], "quoted": {"author": "DanNeidle", "text": "The 2024 Budget raised the rate of capital gains tax. CGT receipts from that tax year *doubled*.\n\nLooks like a triumph - but actually it was a failure. \n\nAnd it means CGT reform is dead. A prudent Chancellor won't touch CGT.  \n\nA 🧵 on the CGT paradox: https://t.co/zY3p78zVqf"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107953947533267192", "url": "https://x.com/s8mb/status/2107953947533267192", "text": "The elites of Victorian Britain got up late, drank ceaselessly, worked short hours, partied through the night, and knew nothing about science, technology or engineering. And yet, by their own lights, they were hugely effective.\n\nhttps://t.co/TvbuWtaPRJ\n\nThe Victorians are often held up as a model against the supposedly soft, feckless, humanities-educated elites of today. But I argue that the genius of their system may have been its drastic weighting towards soft skills, team-building and intra-elite networking:\n\n- A Victorian’s gentleman’s office hours typically began about 11am and finished about 5pm, including a multi-course lunch with wine.\n\n- Upper-class Victorians drank ceaselessly. Conduct guides recommended four or five glasses of wine at dinner *for married women*. Port was often served in pints.\n\n- Party culture was intense and nocturnal. Balls started at about 10pm, peaked after 1am, and continued till dawn. During the social season, bankers, judges and politicians might go to several balls per week.\n\n- Elite Victorians learnt almost no STEM at school or university. At least half of class time was given over to ancient languages, often as much as 80 percent. One leading educationalist remarked that it was not worth teaching science to gentlemen because it does not involve ‘continued reasoning’.\n\n- Sports and character formation were valued far above transmitting facts. A top headmaster described his school’s priorities as ‘First – character, second – physique, third – intelligence, fourth – manners, fifth – information’.\n\nThis cannot have made elite Victorians more productive individually, but maybe the dense social and emotional network it created helped them to work as a sort of extended team. \n\nPerhaps we should think again about what makes groups of people effective.", "created_at": "2026-10-07T21:59:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "likes": 4071, "retweets": 505, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2105749339855577290", "url": "https://x.com/random_walker/status/2105749339855577290", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?", "created_at": "2026-10-01T19:59:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTkfpyBW4AALqBe.jpg"}], "quoted": null}, {"id": "2106071144952680549", "url": "https://x.com/random_walker/status/2106071144952680549", "text": "I'm at the Curve this weekend! I'll be talking about RSI on Sunday at 2pm. Also excited to talk about:\n\n- What does a big-tent AI safety movement look like?\n- How can we make progress on policy proposals where there is common ground across the community?\n- How can we improve our RSI evaluations?", "created_at": "2026-10-02T17:17:44+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6d8ubQAUa7ss.jpg"}], "quoted": null}, {"id": "2106044389286117483", "url": "https://x.com/random_walker/status/2106044389286117483", "text": "New blog post!\n\nI argue that the “stochastic parrots” metaphor dismisses LLM capabilities by reducing them to “haphazardly stitching together” text... \n\n ...but retreats to the trivially true claim that LLMs predict the next token when challenged.\n\nhttps://t.co/VIYPBEjX5o https://t.co/CRBtJHETbe", "created_at": "2026-10-02T15:31:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 23, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HToiHrZXQAAUSAM.png"}], "quoted": null}, {"id": "2106044742589137275", "url": "https://x.com/random_walker/status/2106044742589137275", "text": "@manoelribeiro Thanks for writing this! The motte and bailey is very related to what I called the linguistic trap. https://t.co/7H79p4S2Vd", "created_at": "2026-10-02T15:32:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "manoelribeiro", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "random_walker", "text": "The \"linguistic trap\" is ever-present in AI commentary — reducing the properties of a complex AI system to those of the linguistic subsystem. @sayashk and I contributed to briefly popularizing one of these phrases (\"bullshit generator\") when ChatGPT was released, but we quickly realized that this framing was not that helpful and stopped using it."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107166735182762166", "url": "https://x.com/random_walker/status/2107166735182762166", "text": "AI experts largely agree about which policies would most reduce catastrophic AI risk.\n\nThe Longitudinal Expert AI Panel (LEAP) brings together forecasts from a representative group of over 250 experts that policymakers look to when considering the future of AI: computer scientists, industry figures, top economists, policy experts, and AI risk experts.\n\nWe asked panelists to forecast (1) how a menu of policies would affect AI risk; (2) which policies they each support; and (3) which policies they think will be implemented by 2030.\n\nKey findings:\n• Despite disagreeing on the level of AI risk, respondents broadly agree on policy\n• Respondents believe government policy can substantially reduce catastrophic AI risk\n• The most supported policy of those we asked about was the creation of an international body, including the US and China as members, with pre-release authorization power over frontier models\n• Some US-only policies are forecast to reduce catastrophic AI risk, but not as much as bilateral policies involving the US and China\n• Experts strongly oppose federal preemption and think it would increase AI risk\n• The policies experts expect to reduce risk the most are those they think are least likely to actually be implemented\n\n🧵 More, with key insights below:", "created_at": "2026-10-05T17:51:13+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Research_FRI", "rt_author_name": "Forecasting Research Institute", "likes": 75, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT4Z6sVbUAAhw5b.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT4Z66RakAA9SEQ.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107497471505256494", "url": "https://x.com/random_walker/status/2107497471505256494", "text": "Y2K went down in history as a public overreaction. Apparently, that’s incorrect?\n\nProgrammers and critical infrastructure people worked for over a decade to prevent problems. A lot of them never publicized it when they fixed things in their own orgs. (Each fix isn't headline news.)\n\nTime magazine says a lot of people stockpiled supplies \"because they didn't have a sense that programmers were on the job.\"\n\nA few things did go wrong. There was an issue at a couple of nuclear plants. A video rental store charged a customer a century of late fees.\n\nBut overall, everything worked out fine. Skeptics took that as proof nothing was ever going to happen.\n\nThe people raising alarms weren't exactly proven right! Because years of hard work meant nothing happened.\n\nThe national and local coordination was so good that President Clinton's Y2K czar was comfortable getting on a flight at exactly midnight. The only people on that flight were him and reporters.\n\nAnother example of how saving the world and preventing disaster gets remembered as wasted money because nothing happens.", "created_at": "2026-10-06T15:45:27+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Abi0lvera", "rt_author_name": "Abi Olvera", "likes": 8, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107456826685984883", "url": "https://x.com/random_walker/status/2107456826685984883", "text": "Have been noodling on an actual piece about this, but I think this sentiment somewhat misunderstands the Carnegies/Rockefellers and how their foundations actually came about/became effective.\n\nCarnegie had been giving for decades, but he really kicked it into high gear after he sold Carnegie Steel and retired. He was 65. Likewise, even though Rockefeller began giving much earlier, the Rockefeller Foundation, his philanthropic capstone, wasn’t chartered until 1913…when Rockefeller was 73. A lot of today’s fortunes are 1) still being made and 2) being accrued by people who are much earlier in both their careers and their philanthropic lives than Carnegie and Rockefeller were when their philanthropic institutions reached maturity (not that this should absolve them of any sense of noblesse oblige *today*).\n\nThese great philanthropies also can’t be separated from the era in which they were created: Protestant ideas about stewardship, the general Progressive Era reform culture, anxieties about (and outright hostility toward) dynastic wealth, reputational pressures on the new industrial rich, and limited U.S. state capacity wrt education, public health, and scientific research, were all contributing factors to their inception. \n\nThe second and more important piece of the story to me, though, is that sentiments like this give too much credit to the billionaires themselves. The *other* thing each of these men had was brilliant advisors. Rockefeller, for example, did not wake up one day and independently derive the idea to found one of the country’s greatest research universities (UChicago). It actually emerged from a network of Baptist educators and organizers, among them Frederick Taylor Gates, who would become Rockefeller’s principal philanthropic adviser.\n\nThere are so many examples of this throughout history, from Walter Damrosch (the young conductor who pitched the idea for a great concert hall to Andrew Carnegie, and you know the rest) to George Grey Barnard, the sculptor and art collector whose collection formed the basis of the Met Cloisters (currently working on assembling what I hope will be a comprehensive list of such efforts). \n\nThese were people capable either of converting a benefactor’s general desire to do something important into a specific institution, field, collection, research program, or public good, or simply of presenting them with an extraordinary idea worth backing.\n\nWhich is all to say that patronage is often a team sport! Yes, the capital ultimately has to come from somewhere, but I really do believe now might be the best time in history to become the person a very wealthy person relies upon to understand a particular domain, or to create the kind of cultural institution that you believe is important.\n\nSo yes, one interesting question is, “Where are the Carnegies?” \n\nBut also…where are the Frederick Taylor Gateses?", "created_at": "2026-10-06T13:03:56+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 285, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107435883062325411", "url": "https://x.com/random_walker/status/2107435883062325411", "text": "An interesting cognitive bias: \n\n\"GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having much lower safeguards, meaning that every additional day absent some dire cybersecurity incident is further evidence against catastrophic AI cyber-risk.\"\n\nThat's right. And yet it doesn't seem to be treated that way by many people in the safety community. It's like they have a one-way valve for their risk estimates.\n\nI was curious if this bias has already been talked about in lesswrong / EA circles and indeed it has, going all the way back to this 2007 Yudkowsky post \"Absence of Evidence Is Evidence of Absence\" https://t.co/GhJNYWRqeo", "created_at": "2026-10-06T11:40:43+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 112, "retweets": 11, "media": [], "quoted": {"author": "NateWitkin", "text": "Does anyone disagree that pretty much every piece of empirical evidence we have about actually existing AI points toward a labor-augmenting technology with a more-or-less ordinary risk profile (no worse than cars, guns, nuclear power, social media, etc.)?\n\nOn the labor front, the evidence of minimal / inconsequential employment effects so far is undeniably strong (see: https://t.co/xSX5ZXcA9a).\n\nOn the risk front, the recent spate of \"rogue agent\" incidents was akin to a set of natural experiment in which much of what could go wrong did, and the costs were comparable to or less than your typical high-profile cybersecurity breach (several of which happen around the world every month).\n\nNot only that, but the base rate of AI-related hacking incidents is extremely low, and with rare exception, model behavior during real-world use cases is exceedingly well-aligned. \n\nPlus, as Anthropic recently argued (https://t.co/zZcVKYdFY5), the open-source GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having much lower safeguards, meaning that every additional day absent some dire cybersecurity incident is further evidence against catastrophic AI cyber-risk.\n\nTaken together, these facts imply two constraints on arguments in favor of catastrophic AI risk:\n\n1) those arguments must either pass through future, rather than current capabilities, or future, rather than current varieties of AI adoption or implementation (or they must claim we have been unrealistically lucky);\n\n2) those arguments must also must pass through some specific capability or adoption threshold, rather than rapid improvement or adoption as such, since dramatic capability improvement and rapid adoption have already occurred alongside demonstrably low risk of catastrophic harm.\n\nIt is therefore natural that those concerned about catastrophic risk commonly appeal to recursive self-improvement, or RSI in order to make the case that things will get much scarier very soon.\n\nBut as @ramez has convincingly argued (https://t.co/zqenI73Hor), existing data on the reality of RSI within frontier labs neither suggests an inbound trend-break, nor the accelerating returns that might produce one. On the contrary, as is unsurprising to those familiar with the generally log-linear relationship between compute and model performance, all available signs points toward diminishing returns.\n\nAnd this is before considering external factors that could slow capability progress further, including low-hanging fruit effects related to running up against more complex or tacit-knowledge-based tasks for which performance data and verifiable reward signals are scarcer, plausibly incoming financing constraints related to the industry's massive capex commitments (see: https://t.co/HkL9k1SPMZ), growing political backlash, both to data centers in particular, but also rapid AI development writ large, and new regulatory bodies and industry reporting frameworks (see e.g. https://t.co/Q72ZBxGmi6 and https://t.co/pRYeN3C3oX ), which will require labs to proceed with greater caution from here on out.\n\nI am therefore led to conclude both that catastrophic AI risk is likely to remain negligible for the foreseeable future and that the only counterarguments concern massive black-swan-style capability uplifts no existing data imply are on the horizon, and/or particularly irresponsible or dangerous forms of AI adoption that there are also few precedents for so far (and that we are actively developing norms, regulation, and security measures against).\n\nNeither is impossible, meaning we should remain vigilant and that AI safety efforts will continue to be well worth it in the coming years. But I see no way around the conclusion that something akin to the \"normal technology\" view is superior on the empirical and argumentative merits to whatever variety of doomerism.\n\nWhat am I missing?"}, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107429548774339032", "url": "https://x.com/random_walker/status/2107429548774339032", "text": "Does anyone disagree that pretty much every piece of empirical evidence we have about actually existing AI points toward a labor-augmenting technology with a more-or-less ordinary risk profile (no worse than cars, guns, nuclear power, social media, etc.)?\n\nOn the labor front, the evidence of minimal / inconsequential employment effects so far is undeniably strong (see: https://t.co/xSX5ZXcA9a).\n\nOn the risk front, the recent spate of \"rogue agent\" incidents was akin to a set of natural experiment in which much of what could go wrong did, and the costs were comparable to or less than your typical high-profile cybersecurity breach (several of which happen around the world every month).\n\nNot only that, but the base rate of AI-related hacking incidents is extremely low, and with rare exception, model behavior during real-world use cases is exceedingly well-aligned. \n\nPlus, as Anthropic recently argued (https://t.co/zZcVKYdFY5), the open-source GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having much lower safeguards, meaning that every additional day absent some dire cybersecurity incident is further evidence against catastrophic AI cyber-risk.\n\nTaken together, these facts imply two constraints on arguments in favor of catastrophic AI risk:\n\n1) those arguments must either pass through future, rather than current capabilities, or future, rather than current varieties of AI adoption or implementation (or they must claim we have been unrealistically lucky);\n\n2) those arguments must also must pass through some specific capability or adoption threshold, rather than rapid improvement or adoption as such, since dramatic capability improvement and rapid adoption have already occurred alongside demonstrably low risk of catastrophic harm.\n\nIt is therefore natural that those concerned about catastrophic risk commonly appeal to recursive self-improvement, or RSI in order to make the case that things will get much scarier very soon.\n\nBut as @ramez has convincingly argued (https://t.co/zqenI73Hor), existing data on the reality of RSI within frontier labs neither suggests an inbound trend-break, nor the accelerating returns that might produce one. On the contrary, as is unsurprising to those familiar with the generally log-linear relationship between compute and model performance, all available signs points toward diminishing returns.\n\nAnd this is before considering external factors that could slow capability progress further, including low-hanging fruit effects related to running up against more complex or tacit-knowledge-based tasks for which performance data and verifiable reward signals are scarcer, plausibly incoming financing constraints related to the industry's massive capex commitments (see: https://t.co/HkL9k1SPMZ), growing political backlash, both to data centers in particular, but also rapid AI development writ large, and new regulatory bodies and industry reporting frameworks (see e.g. https://t.co/Q72ZBxGmi6 and https://t.co/pRYeN3C3oX ), which will require labs to proceed with greater caution from here on out.\n\nI am therefore led to conclude both that catastrophic AI risk is likely to remain negligible for the foreseeable future and that the only counterarguments concern massive black-swan-style capability uplifts no existing data imply are on the horizon, and/or particularly irresponsible or dangerous forms of AI adoption that there are also few precedents for so far (and that we are actively developing norms, regulation, and security measures against).\n\nNeither is impossible, meaning we should remain vigilant and that AI safety efforts will continue to be well worth it in the coming years. But I see no way around the conclusion that something akin to the \"normal technology\" view is superior on the empirical and argumentative merits to whatever variety of doomerism.\n\nWhat am I missing?", "created_at": "2026-10-06T11:15:33+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NateWitkin", "rt_author_name": "Nathan Witkin", "likes": 185, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107542999270076873", "url": "https://x.com/random_walker/status/2107542999270076873", "text": "🚨SciConBench accepted at #NeurIPS2026!\n\nPaper: https://t.co/aVcTdvBLf1\n\nCan AI *synthesize* scientific conclusions in health? We find that, on medical conclusions, we are far from it!\n\nCheck out our live dashboard: https://t.co/S09mqaBLjZ\n\nw/@hayounggjung and @korolova https://t.co/eHtCiV5f5J", "created_at": "2026-10-06T18:46:21+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 27, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT954gsW0AANhE_.jpg"}], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107533695364260270", "url": "https://x.com/random_walker/status/2107533695364260270", "text": "Can two superforecasters + machine outperform machine in forecasting?\n\nWhen the machine first beat a human in chess there was a point in time when man + machine > machine.\n\nAt Preseen we’ve built out one of the best AI systems for forecasting. We wanted to see if two superforecasters working with our system could outperform the system itself.\n\nThey ended up narrowly beating the system, but what we learned was fairly surprising.\n\nA few takeaways:\n- Being a domain expert doesn’t map onto using an AI system well. Guiding superhuman (or at least on-par) AI requires a different skillset. Effectively working with an AI system requires an additional skill: knowing when and how your own expertise can improve its output.\n- Evaluating a centaur approach is non-stationary since the human’s behavior with the agent changes as they learn more about the constraints of the agents. If an agent has a few dimensions a human can interact with, the human’s use of those dimensions can change dramatically.\n- Human agreement could reinforce a mistake. On the three questions where overrides cost the most, the humans moved toward the community prediction. What looked like a sensible correction supported by other forecasters ended up hurting performance.", "created_at": "2026-10-06T18:09:23+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "VminVsky", "rt_author_name": "Veniamin Veselovsky", "likes": 18, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107859231080943723", "url": "https://x.com/random_walker/status/2107859231080943723", "text": "Reaction to the @slatestarcodex vs. @sapinker AI x-risk debate\n\nThe main problem with this debate is that both interlocutors are mainly focused on AI as a disembodied technological object that's fallen down from heaven, not a congealed mass of human decisions.\n\nScott has understood that there's nothing ontological about deep learning that'd prevent us from killing ourselves with it and that this risk gets worse as AI scales. But this is a trivial observation!\n\nHere's how to kill everyone with AI: put Opus 8.1-Killeveryone in charge of 100 bio labs; skimp on safety post-training; connect it to the Internet; let it develop affective relationships with the lab post-docs and its nihilist friends on Reddit; don't monitor it; have it work as a swarm to solve 'BioKillEveryoneGym' over a holiday break...\n\nIn fairness, Pinker and Alexander do touch on social processes. But if one is concerned with scenarios like these, 90% of the debate should focus on the social processes by which we risk creating them - incentives, culture, guardrails, ... - and on why we won't adapt and reach a reasonable equilibrium somewhere along the way.\n\nTo be clear, I'm very concerned about AI harms - including tail harms - but not very concerned about extinction risks. The burden is on Pinker and deep learning denialists to show that AI couldn't kill everyone under any circumstances (hard to defend); but the burden is on Alexander to show the social mechanisms by which we’d make the long sequence of low-probability unforced errors that would actually allow it to do this (seems hard to defend).\n\nWe could kill a lot of people with nuclear power plants. Here's how: don't monitor them. Fire all their safety engineers. Build them in the middle of all of the world's population centers and then cut off their water supplies whenever city budgets run low.\n\nThat we haven't done this is heartening; we should understand why. That there've been many accidents with dangerous technologies, especially in the earlier phases as we thrash towards a safety equilibrium, is disheartening; we should understand why those happened, too, and apply all those lessons to AI.", "created_at": "2026-10-07T15:42:57+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 40, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107785375582167519", "url": "https://x.com/random_walker/status/2107785375582167519", "text": "\"Even “normal” general-purpose technologies are initially volatile and dangerous, even those we come to think of as unalloyed goods.\" https://t.co/4tgeqOjS2a\n\nCompletely agree, and appreciate @DKThomp citing us making that very point. Emphasizing AI's similarity to past general purpose technologies should put more focus on this destabilization, not less.\n\n\"Practically every major technological revolution has been, at least partly and briefly, an economic, social, or political catastrophe. From this reading of history, it would be odd if AI arrived without significantly destabilizing some part of our world for the worse.\"", "created_at": "2026-10-07T10:49:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 73, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2106422067809997225", "url": "https://x.com/sethlazar/status/2106422067809997225", "text": "@mark_lundin Hey Mark!!", "created_at": "2026-10-03T16:32:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "mark_lundin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106380141899223207", "url": "https://x.com/sethlazar/status/2106380141899223207", "text": "@hecubian_devil I’m not sure about this. Didnt work that well in 2020-2022 for workers at previous tech incumbents, and only a few people in the companies are actually irreplaceable. I don’t know the literature, but this doesn’t seem like an industry where unionisation is going to be the solution. Happy to see counter arguments though", "created_at": "2026-10-03T13:45:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "hecubian_devil", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106353304682807384", "url": "https://x.com/sethlazar/status/2106353304682807384", "text": "This is great from @dgrobinson .\n\nOne thing I’ll say: if you’re in a frontier ai company and you feel similarly, there are many more options besides continuing to try—and probably fail—to bring about change from within. I’ll obviously shill for academia here since I think true independence is deeply valuable, as is training the next gen, but there are also so many alignment and advocacy orgs, as well as gov opportunities, to consider. The world is your oyster; there’s no need to stay inside the machine just to feel some sense of control and agency (and excitement).\n\nI also think junior people just finishing up their training should pay close attention to what David and others have been saying. It always feels like your experience is going to be different—you’ll actually have freedom others have lacked; your CEO has vision that you’re aligned with etc. But trillions of dollars have their own inevitable momentum and they don’t care about your compunction or keeping your hands clean.", "created_at": "2026-10-03T11:58:56+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 6, "media": [], "quoted": {"author": "AdrienneLaF", "text": "New in The Atlantic: \n\n@dgrobinson resigned this week. He was among the longest-tenured employees at OpenAI—and oversaw safety reports on 12 frontier launches.\n\nHe is very worried: “The time for trial and error is over.”\n\nYou can read his essay here:\nhttps://t.co/DQlszrc0ru"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106244814564172185", "url": "https://x.com/sethlazar/status/2106244814564172185", "text": "@mitchellbosley @get_bb_app All good had it update itself", "created_at": "2026-10-03T04:47:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106243289112359218", "url": "https://x.com/sethlazar/status/2106243289112359218", "text": "@mitchellbosley @get_bb_app Hmm have you got all your normal models available? Jus installed and it doesn’t show either sol 6.1 or opus 5.5", "created_at": "2026-10-03T04:41:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106240533177754087", "url": "https://x.com/sethlazar/status/2106240533177754087", "text": "@nathan84686947 Yeah I like it living on the desktop tho, and when I used tailscale I’d constantly have to reconnect sessions. Codex remote works perfectly, it’s the best feature of the app… Totally seamless across all machines.", "created_at": "2026-10-03T04:30:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "nathan84686947", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106236881679913350", "url": "https://x.com/sethlazar/status/2106236881679913350", "text": "@mitchellbosley @get_bb_app Oh fuck that sounds amazing", "created_at": "2026-10-03T04:16:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "mitchellbosley", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106236797214744737", "url": "https://x.com/sethlazar/status/2106236797214744737", "text": "@xave_rg Yeah tho they call double coat something  weird…", "created_at": "2026-10-03T04:15:59+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "xave_rg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106218649279484202", "url": "https://x.com/sethlazar/status/2106218649279484202", "text": "@mitchellbosley @get_bb_app This looks interesting but does it work w Claude subscription and does it use the desktop agents? I prefer that to terminal these days because I have long running threads", "created_at": "2026-10-03T03:03:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "mitchellbosley", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106188651612832147", "url": "https://x.com/sethlazar/status/2106188651612832147", "text": "@defaultuser9999 Yeah I know I’m a complicated person… but seriously it’s the difficulty of replicating my multi machine setup w Claude code that has me stuck w OAI for now. Not only can’t start new session on local machine from remote,  but also they’re constantly disconnecting from each other…", "created_at": "2026-10-03T01:04:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "defaultuser9999", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106170821823898056", "url": "https://x.com/sethlazar/status/2106170821823898056", "text": "@JeffLadish I love the idea that you’re chasing the swarms while walking around holding your laptops up in the air :)", "created_at": "2026-10-02T23:53:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "JeffLadish", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106169313929396497", "url": "https://x.com/sethlazar/status/2106169313929396497", "text": "Thought I’d give the $500 codex sub a go cos Claude still won’t allow launching new session on local device from phone. \n\nSomehow my usage remaining just gets recalculated this arvo, goes from 82% with reset coming in 6 days to 0% w reset tomo?? \n\nSuper frustrating, can’t plan around a system w completely unpredictable consumption. And surely $500 should just basically remove token anxiety entirely. \n\nPls @bcherny just get CC working well w iPhone and local machines, I won’t look back…", "created_at": "2026-10-02T23:47:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTqd1GaWYAAvTTi.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106113887129219571", "url": "https://x.com/sethlazar/status/2106113887129219571", "text": "I *won’t* be seeing folks at The Curve, or at CoLM where Cameron and Lorenzo will be sharing our “Blind Refusal” paper (details soon). Instead I will be working my way through ~176 boxes that have arrived today from Australia. \n\nWe went a bit nuts buying australiana before we left, so I think the end state here is that our house in Chevy Chase  becomes a kind of shrine to the wide brown land…", "created_at": "2026-10-02T20:07:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106082643381043218", "url": "https://x.com/sethlazar/status/2106082643381043218", "text": "@natolambert @DanielleFong @trillium_labs Congratulations Nathan! Excited for what you’ll do together.", "created_at": "2026-10-02T18:03:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "natolambert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106082363532869708", "url": "https://x.com/sethlazar/status/2106082363532869708", "text": "Today we're unveiling Trillium Labs @trillium_labs, a new non-profit to foster the open science of frontier AI. We're building open post-training recipes and will expand into open infra to study RSI, reward-hacking, multi-agent systems, and whatever comes next.\n\nWe're built around the theory of change that you need more eyes to solve hard technical problems. We have faith in the scientific methods and communities that humanity has built, and worry that AI is becoming too closed to utilize them.\n\nTrilliums are wildflowers that bloom briefly in the spring, before the forest canopies fill out. Though they are small, they lay the foundation for the cycles of growth and nourishment through the rest of the year. At Trillium Labs, the recipes will be the slow nutrients for the seasons and the model releases will be the blooms. Building an institution dedicated to this is needed because, much as nature’s trilliums are slow to expand and grow, the open-ecosystem needs time and dedicated resources to catch up.\n\nI co-founded with with a long-time friend and collaborator Tom Zick (@thesezickbeats). We're hiring (full time + student collabs/interns), we're fundraising, and we're looking for compute. Please get in touch if you're interested in helping out. Offices based in the Bay Area and Cambridge MA, remote okay.\n\nI’m in the Bay Area until for The Curve and COLM to connect with people who are interested. We’re thankful to have initial support from Halcyon Futures and Schmidt Sciences with more funding en route to enable our ambitions of scaling. Our advisors @Thom_Wolf, @HannaHajishirzi, @gneubig and @ctnzr have been instrumental to building the ecosystem that exists today, and I’m stoked to get to keep working with them.", "created_at": "2026-10-02T18:02:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "likes": 3146, "retweets": 288, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6Z4ibsAAox8D.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106050296153550903", "url": "https://x.com/sethlazar/status/2106050296153550903", "text": "@sethlazar It’s already begun hasn’t it — cloudflare turnstiles everywhere making it so much harder to get information from sites that a normal browser session can access easily.", "created_at": "2026-10-02T15:54:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jhimmelreich", "rt_author_name": "Johannes Himmelreich", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106014608049795203", "url": "https://x.com/sethlazar/status/2106014608049795203", "text": "The funniest thing about AI consciousness discussions online is how few people think \"I wonder if anyone has considered this point before. Maybe I should check if anyone has spotted a problem with it\"", "created_at": "2026-10-02T13:33:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lefthanddraft", "rt_author_name": "Wyatt Walls", "likes": 218, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2
