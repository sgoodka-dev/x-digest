idening .\n\nbut importantly, the graph above is about physical location. you can use compute remotely. that bumps up their compute a bit.", "created_at": "2026-10-28T00:34:59+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "SamuelAlbanie", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115220319753671163", "url": "https://x.com/ohlennart/status/2115220319753671163", "text": "@jordanschneider ofc! but what do i have to say? AI is mainstream now, even chip export controls!", "created_at": "2026-10-27T23:13:17+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "jordanschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115989307018395865", "url": "https://x.com/ohlennart/status/2115989307018395865", "text": "@dkaushik96 i think people are way more open to sharing stuff with AI models/companies that was previously kept private", "created_at": "2026-10-30T02:08:58+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dkaushik96", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115961010494533834", "url": "https://x.com/ohlennart/status/2115961010494533834", "text": "step 1: give AI companies access to all our computers, documents, and emails\nstep 2: AI uplifts hackers\nstep 3: all the private docs and blackmail material, nicely centralized\n\nfirst AI company breach will be a privacy nightmare", "created_at": "2026-10-30T00:16:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2117393122842013812", "url": "https://x.com/ohlennart/status/2117393122842013812", "text": "the pacing announcement should be timed with ending the iran war so it cancels out", "created_at": "2026-11-02T23:07:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU"}, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117369250843349083", "url": "https://x.com/ohlennart/status/2117369250843349083", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "created_at": "2026-11-02T21:32:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJn7ribsAADsZy.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference."}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx"}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117098094714408969", "url": "https://x.com/NateWitkin/status/2117098094714408969", "text": "um, yeah, this is perhaps the main reason why the entire ai safety community has become way less interesting to me over the last few years\n\nit's like everyone decided that solving alignment is doomed and complete pause/stop is the only option.\n\neven though alignment has actually been going more optimistically under \"Plan C\" than i suspect most of them ever expected.\n\nby that i mean \"AGI progresses to the point where it's churning out superhuman mathematics, also is widely distributed, and the worst thing AIs have ever done is some illegal hacking to steal test results without hurting anyone badly or intentionally, and also AIs are just generally very friendly and help make peoples' lives better\" is a state I think almost all AI alignment-concerned people I knew, including myself, from a few years ago would have considered an improbably optimistic state of the world. and that's just naming the legible, in-Overton-window aspects of why things are going surprisingly well.\n\nit feels like a lot of AI safety people have anti-inductive epistemics. they will get more doomy no matter what they observe. probably they will be *more* fanatical about pause if things are actually going well because then it's harder for them to be doomy by engaging with the object level stuff.", "created_at": "2026-11-02T03:34:54+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "repligate", "rt_author_name": "j⧉nus", "rt_avatar": "https://pbs.twimg.com/profile_images/1359982307998896128/YM34-MZK_normal.jpg", "rt_id": "2117079347815461194", "likes": 625, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFd_HnboAAc1cO.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117013111756480635", "url": "https://x.com/NateWitkin/status/2117013111756480635", "text": "The fact that “AI adoption also predicts *pre-pandemic* growth (middle)” means that the enterprises that adopted AI most aggressively are also the ones that were likely most productive and most responsive or elastic to any aggregate productivity/demand shock. A key challenge with measuring AI ROI is that the two causal effects can be observationally equivalent for a long time.", "created_at": "2026-11-01T21:57:12+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "stevehou", "rt_author_name": "Steve Hou", "rt_avatar": "https://pbs.twimg.com/profile_images/1905914798300073984/stc3q7RB_normal.jpg", "rt_id": "2116975912080076922", "likes": 105, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116955083938435564", "url": "https://x.com/NateWitkin/status/2116955083938435564", "text": "Lots of AI people made it low status to comment on shortfalls and failures of models, or the fact that they're not reallty automating jobs fully and so on. Any scrutiny means you're not 'AGI pilled' (which is not a claim about technology but sometimes a quasi-religious one about its impacts and adoption). It's a shame because it's actually very interesting to explore the spikiness, jaggedness, failures, complementarities and so on; but for a lot of people this is almost a waste of time because 'something something future models!1!!' means they get to just parrot 'this is the worst the models will ever be' whilst dismissing any crumb of empiricism away because they've already worked out the future based on theory and projections alone. \n\nTo be fair I sympathise with them to a degree because the 'other sides' aren't any better, essentially over-indexing on short-term failures (Rs in strawberry etc) and extrapolating from these to dismiss the technology completely. But I care less about what these people think about capabilities since time just proves them wrong rapidly enough. Why would you exercise vibe arbitrage over such a cheap target? I also find it painfully boring to constantly litigate 'AI skeptics' - there are more interesting and thornier discussions to be had.", "created_at": "2026-11-01T18:06:37+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2116948827286667376", "likes": 637, "retweets": 57, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116954065833967725", "url": "https://x.com/NateWitkin/status/2116954065833967725", "text": "This suggests the story here is not “AI is boosting productivity”\n\nbut\n\n“rate hikes, inflation and other economic uncertainty starting in 2022 caused firms to pull back on hiring, and Big Tech went further in making substantial layoffs long before production-ready AI\" https://t.co/2RHfSMR3YP", "created_at": "2026-11-01T18:02:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "rt_avatar": "https://pbs.twimg.com/profile_images/922511756110557184/IDxUQ_rr_normal.jpg", "rt_id": "2116909352959316186", "likes": 230, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDF1gnWEAAl4Gw.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116953853472162038", "url": "https://x.com/NateWitkin/status/2116953853472162038", "text": "Quick thread on AI and productivity:\n\nLots of people say this chart shows AI is now showing up in the productivity data.\n\nBut I made this chart to argue the opposite: a trend that pre-dates AI and only shows up in the US doesn’t look like AI.\n\nHere’s how I’m thinking about the data and underlying dynamics:", "created_at": "2026-11-01T18:01:44+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "rt_avatar": "https://pbs.twimg.com/profile_images/922511756110557184/IDxUQ_rr_normal.jpg", "rt_id": "2116909316556877975", "likes": 1731, "retweets": 393, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDFzW6XsAA3jDh.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116636307980259496", "url": "https://x.com/NateWitkin/status/2116636307980259496", "text": "All of these countries have access to the same LLMs. \nThis raises the likelihood that what’s behind the US productivity boost is less about AI-augmented task productivity &amp; more about something else like mechanical AI capex effects… or something besides AI entirely.", "created_at": "2026-10-31T20:59:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ernietedeschi", "rt_author_name": "Ernie Tedeschi", "rt_avatar": "https://pbs.twimg.com/profile_images/1481433697182261248/rhqOzq7z_normal.jpg", "rt_id": "2116614629267034445", "likes": 710, "retweets": 76, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116259601238700044", "url": "https://x.com/NateWitkin/status/2116259601238700044", "text": "Life is a lot easier once you stop seeing threat actors as hackers who want to break into systems by any means possible, and start seeing them as businesses with well defined business processes. \n\nA bakery isn't going to start making dog food because there's a dog food shortage. ClickFix and Phishing actors aren't going to drop everything to vibecode exploits just because a critical CVE came out.\n\nThe fact that the only actors exploiting this are the actors whose MO is exploiting things... isn't a coincidence. It's entirely predictable if you understand threat actor behavior.", "created_at": "2026-10-30T20:03:01+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "MalwareTechBlog", "rt_author_name": "Marcus Hutchins", "rt_avatar": "https://pbs.twimg.com/profile_images/2113039686134628353/02YIh_dk_normal.jpg", "rt_id": "2115864790833004641", "likes": 723, "retweets": 88, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116246943378682102", "url": "https://x.com/NateWitkin/status/2116246943378682102", "text": "Was I wrong about open models &amp; cyber risks? I don't think so. The AI community is focusing on the wrong lens  - which type of model is causing harm - rather than how cybersecurity maintains an equilibrium, who enacts harm, and how they use new tools.\nhttps://t.co/oroORcuDWU", "created_at": "2026-10-30T19:12:43+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "rt_avatar": "https://pbs.twimg.com/profile_images/2051823244832083968/Nr0pT8-V_normal.jpg", "rt_id": "2116224502283772307", "likes": 120, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116202452835778596", "url": "https://x.com/NateWitkin/status/2116202452835778596", "text": "The rise of Google AI Mode (plus agents) will be a big economic shift for the web—but it's also a huge psychological shift in our relationship to other people on the web.\n\nRight now, AI summaries of queries do not send our attention outward to links but rather answer our questions directly by summarizing the material they can consume faster than the user. This will change the economics of the internet because the machine has gone from hunting and gathering (ranking and displaying links to which they send traffic) to serving final meals (summarizing the results). We're seeing AI Mode affect Alphabet earnings, Reddit revenues, and search traffic for publishers. That's already a big story.\n\nBut I'm also watching now information consumers are being moved up the hierarchy of search: \n- Bottom rung: Find links in response to search\n- Next rung up: Generic summary of links (AI)\n- Next: Encourage me to talk to the AI about the results rather than click any of the below links, so that the AI summary isn't generic but rather tailored to the user who did the search (personalized advanced AI)\n- Next: Anticipate the next search/prompt and give me the information or product I need before I know I need it (Muse, Instinct, advanced agents)\n\nWith each rung, the human-to-human interaction of the web (eg, me reading an article by a person) is being intermediated and then finally replaced by a machine that anticipates what I wanted from that human-to-human interaction and serves it up to me, possibly even before I knew that I wanted it.", "created_at": "2026-10-30T16:15:56+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "rt_avatar": "https://pbs.twimg.com/profile_images/2093501497673674753/OrmD5Wp3_normal.jpg", "rt_id": "2116193689844466123", "likes": 508, "retweets": 57, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116202019505512556", "url": "https://x.com/NateWitkin/status/2116202019505512556", "text": "AI takeover scenarios often hinge on an idea I’m skeptical of, where rogue AI overthrows militaries and seizes hard power. I wrote a piece where I concretely break down what I think makes this improbable, and why “full-blown takeover” concerns could be counterproductive for mitigating the risks of misaligned or poorly controlled AI in the military.\n\nFor AI to seize hard power, it would need to be physically capable of defeating our military, and humans would need to be careless enough to give it the power to do so. I think that’s unlikely to occur for several reasons. Among them:\n\n- The military is unlikely to sufficiently hand the reins over to AI. (1) Even if we wanted to, overhauling the institution in this way faces countless barriers that have plagued it for decades. (2) Doing so would be strategically suicidal.\n- Integrating general-purpose AI into physical systems faces challenges that will take significant time to overcome, all while we grow increasingly attuned to the risks posed by AI.\n- There’s little to suggest that more capable AI would be able to persuade or coerce people to take the costly, coordinated actions some of these scenarios predict.\n- Even if AI managed to assume control over a large arsenal, we’d fight back. In which case, recent warfare shows us that crude countermeasures work against technologically advanced adversaries, and AI relies on infrastructure we can and would shut down.\n\n1/2", "created_at": "2026-10-30T16:14:13+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2116183446930268319", "likes": 59, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4vqPmXQAAXO_q.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115903209709674722", "url": "https://x.com/NateWitkin/status/2115903209709674722", "text": "This is a ridiculous way to go about it. Absolutely ridiculous. AI, told to find things wrong, will find things wrong. You still need to go through and identify what mistakes actually matter! Uncritically reposting this discredits the reposter. Right now it’s just a DDoS attack.", "created_at": "2026-10-29T20:26:51+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "captgouda24", "rt_author_name": "Nicholas Decker", "rt_avatar": "https://pbs.twimg.com/profile_images/1744512309077180416/nR2eSzuX_normal.jpg", "rt_id": "2115579214900641916", "likes": 1201, "retweets": 55, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115865001722282117", "url": "https://x.com/NateWitkin/status/2115865001722282117", "text": "Hello @elonmusk and @tylercowen ,\n\nYou have just decided to publicly attack our research, six days before the vote on the California billionaire wealth tax. \n\nYour attempt to discredit our work and that of our numerous academic colleagues is pathetic. \n\nLet’s take a look. 🧵 https://t.co/QUn47h0sX6", "created_at": "2026-10-29T17:55:01+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "gabriel_zucman", "rt_author_name": "Gabriel Zucman", "rt_avatar": "https://pbs.twimg.com/profile_images/1808252929469829126/2SkWuuAv_normal.jpg", "rt_id": "2115853565730205847", "likes": 2562, "retweets": 685, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV0Av7LXoAEtC79.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115830162461724840", "url": "https://x.com/NateWitkin/status/2115830162461724840", "text": "Everyone knows my priors, and they are not particularly kind. Nonetheless, this should not be taken too seriously. AI is not good at making this kind of assessment, and we don’t know what the prompt was.\n\nSome of the “errors” are actually criticisms raised in papers published after the ones analyzed, which is the normal process of science.\n\nThis is not the right way to criticize each other.", "created_at": "2026-10-29T15:36:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sc_cath", "rt_author_name": "Sylvain Catherine", "rt_avatar": "https://pbs.twimg.com/profile_images/569087995693654016/w5Mxpu3w_normal.png", "rt_id": "2115612775867170906", "likes": 785, "retweets": 70, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828770372251771", "url": "https://x.com/NateWitkin/status/2115828770372251771", "text": "The fact that the PHP vulnerability didn't immediately turn into mass chaos is only \"surprising\" to people who don't know anything about cybersecurity (or people trying to sell you something). https://t.co/9vu41dRAkf", "created_at": "2026-10-29T15:31:03+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ZackKorman", "rt_author_name": "Zack Korman", "rt_avatar": "https://pbs.twimg.com/profile_images/2011153005509267456/JhCS1L1c_normal.jpg", "rt_id": "2115785811283370277", "likes": 750, "retweets": 56, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzG6ToWcAEYnj9.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828628478964122", "url": "https://x.com/NateWitkin/status/2115828628478964122", "text": "If you believe that mindless AI evaluations are legitimate then why would you spread the evaluation of Saez &amp; @gabriel_zucman without first subjecting it to its own mindless AI evaluation?\n\nI just did and it turns out the critic's errors all go in one direction. https://t.co/7ZnHnrx8lZ", "created_at": "2026-10-29T15:30:29+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jasonfurman", "rt_author_name": "Jason Furman", "rt_avatar": "https://pbs.twimg.com/profile_images/822302571888922632/6X-Xm966_normal.jpg", "rt_id": "2115639571270812064", "likes": 943, "retweets": 104, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVw-1VxWEAAPSeD.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828475722379449", "url": "https://x.com/NateWitkin/status/2115828475722379449", "text": "What would the writing of superintelligent AI sound like? You might expect it to have the characteristics of good human writing — figurative language, high information density, coining new terms, and punchiness — but dialed up to 11. Well, that’s what Claude did, until Anthropic dialed it back recently because of user complaints. It didn’t sound superintelligent to most of us. Instead, the neuralese writing style sounds like a “stupid person’s idea of a smart person”.\n\nOur response to information density and metaphor-laden writing looks something like the cartoon graph I've drawn. Beyond a point, it completely backfires. The reason human writers don’t overdo it isn’t because they aren’t capable, but because they are aware of the reader’s cognitive burden. One of the hardest skills to learn as a writer is to simulate the reader’s experience.\n\nIt’s easy to train AI to mimic mediocre human writing. But optimizing it to be (perceived as) good is really hard, and made much harder by the fact that when everyone uses the same few AI models we get tired of their tics very quickly. Most Claudeisms are individually pretty good. I hate that I can’t use “load bearing” in my writing any more. If it weren’t for AI overuse it would be a neat metaphor.\n\nA broader question is whether most tasks in the economy are like chess, where there is a clear performance metric that can be optimized, or whether they’re like writing, where quality is a multidimensional balancing act without clear training signals beyond human mimicry.", "created_at": "2026-10-29T15:29:53+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2115769249117475312", "likes": 385, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVy4AfNWIAA2y49.png"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828206976504044", "url": "https://x.com/NateWitkin/status/2115828206976504044", "text": "Good reminder that ~all of generative AI is in some sense adversarially optimized for you to think it is better than it is (via pre-training, via RLHF, via hill-climbing benchmarks). or as nostalgebraist puts it: https://t.co/LQkHdxHyBm", "created_at": "2026-10-29T15:28:49+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "IvanVendrov", "rt_author_name": "ivan", "rt_avatar": "https://pbs.twimg.com/profile_images/1874568220763389952/uQ13_vl-_normal.jpg", "rt_id": "2115720125328634247", "likes": 2105, "retweets": 192, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVyLoVIXEAALu2C.png"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828130531152298", "url": "https://x.com/NateWitkin/status/2115828130531152298", "text": "this type of post makes me very bearish on humanity. I'm starting to discover a non negligible part of humanity appreciates slop? LLMs are incredibly good at some things, but talking about my essays right now is still at the level of slop.\nThis isn't a statement on future capabilities. It's just that I find it sad that current ones are taken to be at harold bloom level.", "created_at": "2026-10-29T15:28:31+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "rt_avatar": "https://pbs.twimg.com/profile_images/2067383067539382272/24IgkTKE_normal.jpg", "rt_id": "2115651189664883129", "likes": 590, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115517109887549726", "url": "https://x.com/NateWitkin/status/2115517109887549726", "text": "So excited for this research! I've always been annoyed at the supremacy of verified rewards, and now we can finally show it.\n\nIn this work, we develop ways of measuring: how much of a reward signal is verifiable, how much can we put into words, and how much is shared but tacit, or impossible to articulate?", "created_at": "2026-10-28T18:52:38+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "AlexanderSpangh", "rt_author_name": "Alex Spangher", "rt_avatar": "https://pbs.twimg.com/profile_images/616665100456460290/1pcfJ-KM_normal.jpg", "rt_id": "2115493055507902563", "likes": 273, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVu9uMbasAEftGQ.png"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117656592812212338", "url": "https://x.com/NateWitkin/status/2117656592812212338", "text": "This is so insanely misleading.\n\nNo, it did not edit the raw weights. It used existing tooling to identify a problem area for the model, then it found the direction associated with it, and ablated that from the model.\n\nThe oversell here is downright intellectually dishonest.", "created_at": "2026-11-03T16:34:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RealAstropulse", "rt_author_name": "Astropulse", "rt_avatar": "https://pbs.twimg.com/profile_images/1569293386099613698/GIWj4NxE_normal.jpg", "rt_id": "2117460281026596908", "likes": 567, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117419687206092820", "url": "https://x.com/NateWitkin/status/2117419687206092820", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T00:52:47+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1629, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117713889962213853", "url": "https://x.com/NateWitkin/status/2117713889962213853", "text": "To be clear I think it is good to use AI to check the correctness of your work, but in these cases it seems to be used as a Gish gallop instead. At best this is pretty undignified.", "created_at": "2026-11-03T20:21:51+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117690132597760213", "likes": 94, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117713342341259733", "url": "https://x.com/NateWitkin/status/2117713342341259733", "text": "The future of peer review? https://t.co/tFB5IEvlfZ", "created_at": "2026-11-03T20:19:40+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117688265708798069", "likes": 370, "retweets": 36, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7XYAATGbm.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL8XgAAXI_s.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7WIAA97FI.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117700011320381739", "url": "https://x.com/NateWitkin/status/2117700011320381739", "text": "I didn't know that something many researchers do with agents on a weekly basis was worth a research project that gets millions of views. Either I'm expecting too much, or people are far less technical than I thought.", "created_at": "2026-11-03T19:26:42+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "yavuzbakman", "rt_author_name": "Yavuz Bakman", "rt_avatar": "https://pbs.twimg.com/profile_images/1988794630276812800/ZoaPTvEI_normal.jpg", "rt_id": "2117412191368548789", "likes": 196, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117696219820806569", "url": "https://x.com/NateWitkin/status/2117696219820806569", "text": "This work is simple, clear, compelling, but embellished. I first found it shocking, the notion that a model can natively understand neural network weights and productively edit them! That's really not what's happening, & many here are annoyed. BUT, it's still notable & worth understanding.\n\nI've done a bit of analysis & auditing, here are some thoughts:\n\n1/ This paper does *not* show an agent can edit its weights ala RSI. It does *not* show a model can edit in new capabilities. It DOES show that a frontier model can remove \"bugs\" (reasoning loops), using the same ablation technique researchers have used to remove safety refusals (Exp 8 - Qwen). So yes, renewed concern about frontier LLMs getting access to their own weights & editing safety/CBRNE/alignment features.\n\n2/ This paper also does *not* show that an agent can \"natively\" read, deeply understand, and fix model weights. What is happening is that the model can cleverly deduce the same things that mech-inturp researchers do and fix them in mostly ham-fisted ways. Still cool, but not as groundbreaking. Evidence in thread below...", "created_at": "2026-11-03T19:11:38+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "SolomonMg", "rt_author_name": "Sol Messing", "rt_avatar": "https://pbs.twimg.com/profile_images/1358168149301071872/WItgEeQK_normal.jpg", "rt_id": "2117650796342894884", "likes": 82, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
