f teetotalism in places like San Francisco is dangerous to civilization; this feels like a small stand against it. Hopefully we will add non-pretentious writing about wine at some point too.", "created_at": "2026-10-11T09:28:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 250, "retweets": 9, "media": [], "quoted": {"author": "jmhorp", "text": "The new issue of @WorksInProgMag both looks and feels fantastic (they are now using a matte paper instead of glossy).\n\nFeatured cocktail in this issue: Hanky Panky https://t.co/TQ2iCDk7rC"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109213449435676855", "url": "https://x.com/s8mb/status/2109213449435676855", "text": "@jmhorp @WorksInProgMag Beautiful bottle there. Thanks for reading, hope you enjoy it.", "created_at": "2026-10-11T09:24:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "jmhorp", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109211142036054516", "url": "https://x.com/s8mb/status/2109211142036054516", "text": "@fitzr1189 Yes, my understanding is that the window traps heat between it and the internal shutter / curtain and that heats the internal shutter up and then the rest of the room. With external shutters the shutter itself heats up but there isn’t a pocket of trapped heat.", "created_at": "2026-10-11T09:14:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "fitzr1189", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109210123616887256", "url": "https://x.com/s8mb/status/2109210123616887256", "text": "Interesting piece arguing that normal commercial competition in AI models would involve a lot less rushing to the absolute frontier, as opposed to building more useful (and hence aligned) models. The current paradigm is set by people who are not profit-maximising but instead have a model of AI risk and safety that is best addressed by them reaching superintelligence before anyone else. \n\nThe counterargument is that so far the companies that have pushed out the frontier have also done best commercially. So even absent the “mission-driven” people sprinting to superintelligence, wouldn’t the profit-maximising companies also do best by doing the same thing?\n\nhttps://t.co/U3MpRQstqR", "created_at": "2026-10-11T09:10:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 37, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109208468255314316", "url": "https://x.com/s8mb/status/2109208468255314316", "text": "There should be an automatic right to add physical external shutters to any house; conservation areas should have approved designs set out. It’s incredible how effective they are at keeping places cool.", "created_at": "2026-10-11T09:04:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 231, "retweets": 10, "media": [], "quoted": {"author": "SustainableTall", "text": "Would you just look at these beautiful timber blinds in this social housing in Navarra, Spain\n\nIn a warming world, shading should be on ALL housing! \n\nThe architects are Taller Basico and MRM Arquitectos. Blinds by Saxun Solar https://t.co/RXPLT0k43D"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109030451843367207", "url": "https://x.com/s8mb/status/2109030451843367207", "text": "@musevisits @WorksInProgMag Awesome - thank you, : "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109341597154541997", "url": "https://x.com/s8mb/status/2109341597154541997", "text": "@siziyman @dioscuri @julianlehr I’m fairly relaxed about recreational drug use, but drugs have very different effects to each other. The case for alcohol being good for society doesn’t remotely imply that coffee or tobacco are, let alone heroin or cannabis.", "created_at": "2026-10-11T17:53:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "siziyman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109332732371480861", "url": "https://x.com/s8mb/status/2109332732371480861", "text": "@JesusFerna7026 @jmhorp Brilliant review!", "created_at": "2026-10-11T17:18:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JesusFerna7026", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109725979899809804", "url": "https://x.com/s8mb/status/2109725979899809804", "text": "If you’re at a startup in SF and are interested in grabbing a copy, drop Tammy an email. Especially if you’re a Stripe user!", "created_at": "2026-10-12T19:20:45+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Coming soon (tomorrow!) — BUILT TO GROW, our field guide to creating excellent sales orgs, by the inimitable @she_travels. \n\nI have a bunch of these taking up way too much space in our storage rooms. Would love to make some house calls this week to SF startups who are building their sales teams. \n\nEmail me (in bio!). And let me know if you’re a @stripe user!"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109645210158551058", "url": "https://x.com/s8mb/status/2109645210158551058", "text": "Isolated as they are from the rest of the world, many civil servants (including even press officers) lack the feedback loops to understand why this is odd for a government official to do. \n\nThis is largely by choice - extreme interpretations of the terms of the civil service code make civil servants incredibly averse to engaging with outsiders, and when they do it is often through complex stage-managed encounters. Some senior leaders are much more relaxed about it, but that rarely cascades down through the organisations they lead. \n\nBut if you spend all lot of time doing mandatory DEI training, or in workshops with other people about DEI issues, and in a closed loop where you only get emails from other people pushing these ‘non-political political’ ideas in their signatures, it’s easy to lose track.", "created_at": "2026-10-12T13:59:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jo3hill", "rt_author_name": "Joe Hill", "likes": 91, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109616611460280783", "url": "https://x.com/s8mb/status/2109616611460280783", "text": "@thomasforth Very nice. I did this in Berlin last month, which might be the nicest city for cycling I've been in – on Sundays the streets are so quiet that they even turn off a lot of traffic lights. I was too scared of American drivers to try in DC though.", "created_at": "2026-10-12T12:06:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "thomasforth", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109607934309126148", "url": "https://x.com/s8mb/status/2109607934309126148", "text": "@wrathofgnon Yup! https://t.co/tuJkWgUtr2", "created_at": "2026-10-12T11:31:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "wrathofgnon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "Sam_Dumitriu", "text": "Do you think the (new) building on the left should look more like the neighbouring one on the right?\n\nI suspect most people do, but there's a widespread idea within historical preservation that any new/necessary additions to historic buildings/structures should be distinct and modern.\n\nThe idea dates back to the 60s where modernism was on the rise and was codified in something called 'The Venice Charter.'\n\n\"Article 9: New work should bear the mark of its own time. When restoration requires additional work, it should be distinguishable from the historic composition and carry a contemporary stamp.\n\nThis idea still influences planning today. Many people will assume that Brighton and Hove Council opted to go for the design on the left for reasons of cost/maintenance.\n\nBut, in fact, it was a deliberate decision.\n\nHere's a quote from the planning officer: \"A conscious effort had been made to make the design of the new lift different from the existing, allowing the older lift to retain prominence in the terrace.\"\n\nWhat do you prefer?"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109607846098735408", "url": "https://x.com/s8mb/status/2109607846098735408", "text": "Like all public officials, planners have a set of beliefs that shape their decisions. The doctrine that new buildings have to *look* like new buildings is a pretty important one of these!", "created_at": "2026-10-12T11:31:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 1, "media": [], "quoted": {"author": "Sam_Dumitriu", "text": "Do you think the (new) building on the left should look more like the neighbouring one on the right?\n\nI suspect most people do, but there's a widespread idea within historical preservation that any new/necessary additions to historic buildings/structures should be distinct and modern.\n\nThe idea dates back to the 60s where modernism was on the rise and was codified in something called 'The Venice Charter.'\n\n\"Article 9: New work should bear the mark of its own time. When restoration requires additional work, it should be distinguishable from the historic composition and carry a contemporary stamp.\n\nThis idea still influences planning today. Many people will assume that Brighton and Hove Council opted to go for the design on the left for reasons of cost/maintenance.\n\nBut, in fact, it was a deliberate decision.\n\nHere's a quote from the planning officer: \"A conscious effort had been made to make the design of the new lift different from the existing, allowing the older lift to retain prominence in the terrace.\"\n\nWhat do you prefer?"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109606961197281789", "url": "https://x.com/s8mb/status/2109606961197281789", "text": "It is true. \n\nFor sale to a good home https://t.co/gSeVk9vIVi", "created_at": "2026-10-12T11:27:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hcndashwood", "rt_author_name": "Henry Dashwood", "likes": 6, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUbTpG0WUAEX5Fa.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109606421033857494", "url": "https://x.com/s8mb/status/2109606421033857494", "text": "What if part of the \"function\" of a waterfront at a holiday resort is to look good? https: 9368221841457554", "text": "@gauravkapadia @WorksInProgMag @AtalantaArdenM Ah, delighted you like it - means a lot! Thank you.", "created_at": "2026-10-11T19:39:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gauravkapadia", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109753953923842087", "url": "https://x.com/s8mb/status/2109753953923842087", "text": "@vpostrel It’s a local council project, they are the owners!", "created_at": "2026-10-12T21:11:54+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "vpostrel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109741751703400608", "url": "https://x.com/s8mb/status/2109741751703400608", "text": "@tamarawinter We've committed it to memory already and can all recite all 21 hadiths of al-ukht Friedman!", "created_at": "2026-10-12T20:23:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110056955851206990", "url": "https://x.com/s8mb/status/2110056955851206990", "text": "Get your copy and learn the joy of selling people things that they’re happy to have bought.", "created_at": "2026-10-13T17:15:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Out now! Built to Grow: A Handbook for High-Performance Sales Teams, by Stephanie Friedman: https://t.co/HcKQ3azLiR\n\nI love all of the books in our catalogue, but I particularly love the turpentine collection: High Growth Handbook, An Elegant Puzzle, Scaling People, and now, Built to Grow! \n\nBuilding a sales function—especially today—is more of an art than a science. Stephanie has more than 20 years of experience building 100+ person sales teams, and advising some of the fastest-growing companies in the world on how to do the same. \n\nI hope you love it as much as we do."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110056808954077305", "url": "https://x.com/s8mb/status/2110056808954077305", "text": "@tamarawinter @she_travels This is very likely the most personally useful book Stripe Press has ever done. It’s coming out at the perfect time for me!", "created_at": "2026-10-13T17:15:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110055958156128767", "url": "https://x.com/s8mb/status/2110055958156128767", "text": "Result. https://t.co/zCoRA6iQyt", "created_at": "2026-10-13T17:11:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhssDLWMAAOacC.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110035554763202616", "url": "https://x.com/s8mb/status/2110035554763202616", "text": "China has become the most important manufacturing economy in the world because it is a continent-sized Silicon Valley.\n\nhttps://t.co/QGdeeqmsEi\n\nEvery Chinese city govt acts as a VC firm trying to create clusters in its region, because it has both the means and incentive to do so.\n\nLocal govts generate their revenues, nearly all of which they keep, from selling leases on land and from stakes they have taken in local companies, which together allow them to capture economic spillovers.\n\nChinese officials have their entire careers graded and determined by how much growth they have been able to create in the areas they run. Career progression is determined according to a great tournament that pits official against official and gives promotions to whoever has grown their region the most. If they don’t reach a certain stage by a certain age they are blocked from promotion forever.\n\nThis is why so many economic clusters have centred on Chinese cities, for high- and low-tech products alike. Shaodong makes 70% of the entire world's cigarette lighters; Danyang makes half of the world's spectacle lenses; Zheng'an makes 1/7 of the world's guitars; Datang a third of its socks.\n\nWhereas many of the West’s most important city governments capture only a small amount of the spillovers from successful clusters, and thus have very little reason to foster them, in China, they get a huge amount of the upside and can re-invest it in further growth. This also gives them a great incentive to solve problems for companies, like when Shanghai's govt got Tesla's factory there built even faster than Elon himself had expected (and twice as fast as his Fremont, CA factory).\n\nBut this is not some exotic 'oriental' innovation – this is how America used to do things when it grew fastest, in the 1950s, 1960s, and early 1970s. Catching up with China on advanced manufacturing does not require a wise and strategic approach, let alone authoritarianism or the end of democracy. It may just mean fixing city government. \n\nThis is why I care so much about local  in Britain and America: if we give our own local governments the same incentives and means to grow, the crazily dysfunctional entities we have become used to may be transformed into corporation-like bodies that are ruthlessly focused on making their cities rich, safe and prosperous.\n\nRead more in Works in Progress https://t.co/QGdeeqmsEi", "created_at": "2026-10-13T15:50:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "bswud", "rt_author_name": "Ben Southwood", "likes": 189, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029319707976008", "url": "https://x.com/s8mb/status/2110029319707976008", "text": "“China is not the world’s largest command economy. It is a continent-sized Silicon Valley.”\n\nAwesome piece by @RobinRivaton on China’s local governments and industrial clusters: https://t.co/SgctOX03tJ https://t.co/wuiMmYn9Zn", "created_at": "2026-10-13T15:26:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kyleichan", "rt_author_name": "Kyle Chan", "likes": 629, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhBfjkWEAAD5UU.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109997663659692262", "url": "https://x.com/s8mb/status/2109997663659692262", "text": "Nearly everyone in the West focuses on China's Five Year Plans as the reasons for its manufacturing success, concluding that more central economic planning is needed. \n\nThis is the exactly WRONG lesson. The country's success comes because its cities all compete with each other intensely, as something akin to vertically integrated corporations that are completely obsessed with local economic growth.\n\nIts incredible manufacturing industry is based on local clusters that local govts nurture and invest in, and collect a lot of the returns from through property fees and taxes. These govts are *much* closer to local needs than Western local govts are, and can focus on speed of building and iteration above all, which are critical for manufacturing.\n\n*This* is why local government matters in Britain and America, where it is almost completely broken and dysfunctional. Where local spillovers matter, as in manufacturing, you need some kind of entity that can internalise the positive externalities of economic activity. China is proof that with the right incentives and tax powers, local governments can become machines for economic growth, intervening and clearing the way for development.", "created_at": "2026-10-13T13:20:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 147, "retweets": 18, "media": [], "quoted": {"author": "bswud", "text": "China has become the most important manufacturing economy in the world because it is a continent-sized Silicon Valley.\n\nhttps://t.co/QGdeeqmsEi\n\nEvery Chinese city govt acts as a VC firm trying to create clusters in its region, because it has both the means and incentive to do so.\n\nLocal govts generate their revenues, nearly all of which they keep, from selling leases on land and from stakes they have taken in local companies, which together allow them to capture economic spillovers.\n\nChinese officials have their entire careers graded and determined by how much growth they have been able to create in the areas they run. Career progression is determined according to a great tournament that pits official against official and gives promotions to whoever has grown their region the most. If they don’t reach a certain stage by a certain age they are blocked from promotion forever.\n\nThis is why so many economic clusters have centred on Chinese cities, for high- and low-tech products alike. Shaodong makes 70% of the entire world's cigarette lighters; Danyang makes half of the world's spectacle lenses; Zheng'an makes 1/7 of the world's guitars; Datang a third of its socks.\n\nWhereas many of the West’s most important city governments capture only a small amount of the spillovers from successful clusters, and thus have very little reason to foster them, in China, they get a huge amount of the upside and can re-invest it in further growth. This also gives them a great incentive to solve problems for companies, like when Shanghai's govt got Tesla's factory there built even faster than Elon himself had expected (and twice as fast as his Fremont, CA factory).\n\nBut this is not some exotic 'oriental' innovation – this is how America used to do things when it grew fastest, in the 1950s, 1960s, and early 1970s. Catching up with China on advanced manufacturing does not require a wise and strategic approach, let alone authoritarianism or the end of democracy. It may just mean fixing city government. \n\nThis is why I care so much about local  in Britain and America: if we give our own local governments the same incentives and means to grow, the crazily dysfunctional entities we have become used to may be transformed into corporation-like bodies that are ruthlessly focused on making their cities rich, safe and prosperous.\n\nRead more in Works in Progress https://t.co/QGdeeqmsEi"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109993909611028854", "url": "https://x.com/s8mb/status/2109993909611028854", "text": "@bswud The sheer speed of iteration and number of companies in Chinese manufacturing is completely mindboggling. https://t.co/w2bfT5yW0e", "created_at": "2026-10-13T13:05:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bswud", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUg0NCbXcAAWvT-.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109986077058478407", "url": "https://x.com/s8mb/status/2109986077058478407", "text": "@Boredofwheels @thetimes Yup! The best part of that legislation by far.", "created_at": "2026-10-13T12:34:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Boredofwheels", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109978162381643984", "url": "https://x.com/s8mb/status/2109978162381643984", "text": "It probably makes sense to hire a (very skilled) person for this role for the top people, but I'm curious what AI personal assistant support is like at the AI companies. In my experience it's still close to useless outside them, even though I like apps like Instinct and Grok Bot.", "created_at": "2026-10-13T12:02:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 3, "media": [], "quoted": {"author": "SebJohnsonUK", "text": "Anthropic is offering a 145k salary for a personal assistant in London. \n\nResponsibilities include:\n\n\"Scheduling and managing calendars for leader(s) and their organization\"\n\n\"Building and maintaining organizational systems for tracking and managing inbound requests\"\n\n\"Managing the leader's inbox and communications with precise attention to detail\"\n\n\"Handling travel logistics\"\n\nSomebody should really build some sort of tech tool that can handle this stuff autonomously."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109970667017777168", "url": "https://x.com/s8mb/status/2109970667017777168", "text": "How disappointing to find that @thetimes runs a digital subscription trap. If you try to unsubscribe you get a nonsensical error message, and both live chat and email tell you to phone them up. Very bad behaviour! https://t.co/NtfqUUHIaz", "created_at": "2026-10-13T11:33:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", r Labour figures to equalise capital gains tax to the same level as income tax, amid warnings that such a CGT increase would hit Britain’s attractiveness to investors. https://t.co/STggl2ZMbH"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109904888079450272", "url": "https://x.com/s8mb/status/2109904888079450272", "text": "I am in SF until Thursday and keen to meet up with any mutuals out here. DMs open! 🍊🌞 https://t.co/XjK2QDRiRj", "created_at": "2026-10-13T07:11:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pastasnack_e", "rt_author_name": "Ellen Pasternack", "likes": 24, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUdi3Ekb0AAsv19.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109897198011834813", "url": "https://x.com/s8mb/status/2109897198011834813", "text": "We are going to have a lot of updates on the great stuff going on at Totei, but I wanted to share this visually gorgeous article on filming surfing. insane. https://t.co/CTUf7JLbcu", "created_at": "2026-10-13T06:41:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "gauravkapadia", "rt_author_name": "Gaurav Kapadia", "likes": 23, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109879468441432450", "url": "https://x.com/s8mb/status/2109879468441432450", "text": "@kosonocky @RobinRivaton @bswud Excellent, glad to hear. Thanks for reading!", "created_at": "2026-10-13T05:30:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "kosonocky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110082045519245315", "url": "https://x.com/s8mb/status/2110082045519245315", "text": "I’m very biased, but the new @WorksInProgMag is IMO a masterpiece in both design and content.\n\nhttps://t.co/0oNl1XSoOE", "created_at": "2026-10-13T18:55:37+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "likes": 340, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110387697239969940", "url": "https://x.com/s8mb/status/2110387697239969940", "text": "This is crazy. These anti-terror proscription laws are completely broken. The mere expression of support for a group cannot be criminalised like this. You should be allowed to say that you support ISIS, let alone Palestine Action!", "created_at": "2026-10-14T15:10:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 76, "retweets": 7, "media": [], "quoted": {"author": "MarkLTighe", "text": "Sally Rooney’s books will no longer be published in UK over her support for Palestine Action https://t.co/JDOLIst4fM"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110351200231256255", "url": "https://x.com/s8mb/status/2110351200231256255", "text": "This is a great, readable explanation of the economics of Robert Hall and Michael Woodford, this year's Nobel Prize winners, by @ernietedeschi. \n\nhttps://t.co/uaT2oMpxir", "created_at": "2026-10-14T12:45:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 60, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110324521194619213", "url": "https://x.com/s8mb/status/2110324521194619213", "text": "@geofflangdale I'm pretty relaxed about them just spending money on it, because I don't think the opportunity cost is likely to be very high. But the talent that can work on these things is quite scarce and does face a high opportunity cost.", "created_at": "2026-10-14T10:59:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "geofflangdale", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110322221814325561", "url": "https://x.com/s8mb/status/2110322221814325561", "text": "@FelixGraeber That's excellent to see. Thank you.", "created_at": "2026-10-14T10:50:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FelixGraeber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110320413549211671", "url": "https://x.com/s8mb/status/2110320413549211671", "text": "China's industrial policy is driven by hundreds of cities competing with each other to maximise their economic growth.\n\nPublic officials are promoted according to who has driven growth the most, and regional governments' revenues are based on land and property, allowing them to capture economic spillovers that governments in Western countries often cannot capture. \n\nThis gives local governments in China both the means and the incentive to drive growth, far more than in most of the Western world. As a result, Chinese local governments play activist roles in setting up and growing economic clusters in their areas, investing in nascent industries the way a venture capital fund might. \n\nChina is home to over 4 million different manufacturing enterprises, twenty times as many as the United States and five times as many per capita. The clusters these businesses form allow new entrants to improve their products through rapid iteration and low lead times. \n\nThis is the secret of China's industrial miracle, and this is what the Western world must emulate if it is to reindustrialise as well.\n\nhttps://t.co/4dt4O9TUB2", "created_at": "2026-10-14T10:42:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 68, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUlc0qlXwAA8XF-.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110317916235432401", "url": "https://x.com/s8mb/status/2110317916235432401", "text": "@FelixGraeber Thank you so much! Yes, we did a 'refresh' and picked new paper. I'm very happy with it and very happy that our readers seem to like it too.", "created_at": "2026-10-14T10:32:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FelixGraeber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110312537828872295", "url": "https://x.com/s8mb/status/2110312537828872295", "text": "Quantum computing is an example of one of the problems with 'winner-picking' industrial policy: sometimes you bet on the wrong thing! Lots of resources and talent have been put into it in Britain, and we are apparently a world leader in it, so on its own terms it is an industrial policy success. But it is seeming to just not be very important as a technology and maybe it would have been better to just let the talent and resources go to other things, such as AI.", "created_at": "2026-10-14T10:11:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 191, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"i invaluable input along the way.\n\nAnd a big thank you to the whole team at Stripe Press who helped make this happen — especially the absolutely gorgeous cover!", "created_at": "2026-10-13T22:48:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "she_travels", "rt_author_name": "Stephanie (Schatz) Friedman", "likes": 156, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhgHj4a4AEhOCZ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgIseaoAEJgLl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgJlbbAAA7yBK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgKljbgAAtKc_.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110451234683367749", "url": "https://x.com/s8mb/status/2110451234683367749", "text": "@sakibsahmed @WorksInProgMag Thank you!!", "created_at": "2026-10-14T19:22:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "sakibsahmed", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110451178412613838", "url": "https://x.com/s8mb/status/2110451178412613838", "text": "I'm so glad people are enjoying the new issue. We want WIP to be the most beautiful and interesting magazine in the world. Much more to come! \n\nThere's still some time to get your copy: https://t.co/sCOVnY0Opt", "created_at": "2026-10-14T19:22:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "sakibsahmed", "text": "Latest issue of @WorksInProgMag is stunning, I felt goosebumps just flicking through. The deep care and passion that went into this is evident.\n\nAs Anna Wintour has said - when a group of passionate people put something out into the world, that passion finds an audience. https://t.co/HlO2Y2qu7v"}, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110422238000296146", "url": "https://x.com/s8mb/status/2110422238000296146", "text": "@coffeemadman @thetimes This worked!", "created_at": "2026-10-14T17:27:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "coffeemadman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2108609647036997769", "url": "https://x.com/random_walker/status/2108609647036997769", "text": "If AI labs want personal assistants to take off at scale, they need to stop marketing vacations, reservations, party planning, etc. These are not problems.\n\nFocus on *the* problem facing Americans: the cost of living. Agents can offer a ton of help.\n\nSome ideas: (🧵)", "created_at": "2026-10-09T17:24:50+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jimprosser", "rt_author_name": "Jim Prosser", "likes": 1862, "retweets": 130, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108596346928369726", "url": "https://x.com/random_walker/status/2108596346928369726", "text": "Fascinating reading about how we used to write about malware and viruses back in 1999. In a decade I suspect we'll look back at how we talk about AI safety today and it will feel similar. https://t.co/5yApXsKPS6 https://t.co/Rmpfb3jrcB", "created_at": "2026-10-09T16:31:59+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 121, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMmSfNWUAAZH4t.png"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108862317131935973", "url": "https://x.com/random_walker/status/2108862317131935973", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world.", "created_at": "2026-10-10T10:08:51+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 349, "retweets": 70, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUPAfmRbEAAZqlD.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109688253075079438", "url": "https://x.com/random_walker/status/2109688253075079438", "text": "New essay: To keep human judgment, we need AI courts.\n\nAI-generated filings are starting to overwhelm courts around the world. \n\nThe most popular response I’ve heard is to fight AI with AI: If we can just give judges the right tools and training, AI will help them keep pace.\n\nBut this strikes me as the worst of both worlds. \n\nBecause we want human judges in the loop, we don’t get the speed and scale benefits of AI. Yet because we expect them to resolve a massive number of cases quickly, judges (or their clerks) may end up leaning on AI more than they mean to or should.\n\nThis essay offers another way: a parallel AI adjudication track. \n\nAn AI track — inspired by AI use in private arbitration but formally part of the court system like magistrate judges — would let courts be explicit about how human judgment is allocated.\n\nDone right, this would allow courts to process large volumes of cases while ensuring human judges devote their full attention to the cases where their judgment is needed most.\n\nRead more in @PaxMachinaMag: https://t.co/xC4JeVky8H", "created_at": "2026-10-12T16:50:50+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "curl_justin", "rt_author_name": "justin curl", "likes": 128, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110010174890967374", "url": "https://x.com/random_walker/status/2110010174890967374", "text": "Here are 14 points about AI safety I made on the Ezra Klein show, and some impressions about the experience. ​​https://t.co/ntHt0wFRQj\n\n1. Intelligence isn’t power — An A.I. system being powerful is not a property of the model itself. It’s a property of what powers we choose to give it in the real world.\n\n2. The capabilities and behaviors we saw in the HuggingFace and other hacks weren’t entirely emergent. The models were trained for persistence, cooperation, and cyber tasks. The RL environments in which they were trained had various issues that led to the unintended behavior.\n\n3. I agree that controlling highly capable AI agents is different in some ways from controlling an airplane or a nuclear reactor. The agent’s intentionality does make a difference to our approach compared to traditional engineering problems and domains. But it is still an engineering problem. It is not a solved engineering problem, but it is a solvable one.\n\n4. A lot of effort and money has been put toward alignment. That’s important and has proved useful, but if the same amount of effort and money had additionally been put toward control (sandboxes, monitoring, and other guardrails outside the model itself), we’d be seeing very different results.\n\n5. Models getting smarter doesn’t necessarily mean safety gets harder, because capability gains improve defensive abilities too. In many ways it makes safety easier rather than harder. What matters is how the attacker-defender balance shifts, and we have agency to shift it back to defenders.\n\n6. In cybersecurity, long before AI we reached a point where automated systems were superhuman at finding certain vulnerabilities. It helped defenders over attackers because the same tools are used by defenders to find and fix vulnerabilities in software before even shipping. There is a constantly shifting equilibrium, but it is not a new problem.\n\n7. I pushed back on Dario Amodei’s term “operational excellence” to describe recent organizational failures. Excellence is still far out on the horizon. Ezra offered “operational adequacy”. I think that would be a good start — behaving like any mature company instead of a startup-like culture.\n\n8. Defensive AI agents will have to be part of the solution, as uncomfortable as that seems. It’s a new paradigm. We won’t be able to figure it out right away. But the fact that both offensive and defensive technologies escalate in capabilities and complexity is a fact of technological civilization, whether in the digital or physical realm.\n\n9. Ezra expressed some incredulity about my being okay with the ratcheting of complexity. I think it’s fair to be concerned. But safety technologies will never be fully legible to the public. People will have the same reaction if they see the immense complexity of safety in any other high-stakes domain such as nuclear or aerospace. We govern them pretty technocratically.\n\n10. The weirdness of the current moment in cybersecurity absolutely does have historical precedents. There was a prolonged period of profound destabilization when worms and viruses started a new offensive paradigm. It took us well over a decade to develop effective defenses against it. This time we can hopefully get there in less than a decade.\n\n11. I continue to be skeptical about the possibility of superhuman persuasion abilities from superintelligence. (Claims to the contrary tend to confuse two very different senses of the word persuasion.)\n\n12. What worries me is not the capabilities of the technology itself or the possibility that we will get no warnings before catastrophic risks materialize. We are getting plenty of warnings! But our policy and organizational responses to the warnings remain inadequate.\n\n13. Companies can and do make decisions that are against their own long-term interests because they are too focused on short-term metrics. This is how I interpret a lot of what happened with social media over the last decade.\n\n14. AI companies are also acting irrationally against their own self-interest in some ways. The “we can’t slow down unless we’re forced to” view comes out of the mythical belief in superintelligence at OpenAI and Anthropic — that the race to RSI means everything for the company, for the country, and humanity. I think it’s actually in both companies’ self interest to slow down unilaterally. I would argue that the alarm coming from their employees is not evidence of beneficence so much as it is evidence of the underlying fallacy that’s causing the irresponsible behavior in the first place.\n\n(Beyond safety, we also talked about the economic impacts being gradual, the fact that intelligence is rarely the actual bottleneck, labor impacts being small and uneven, Jevons’ paradox, the changing nature of knowledge work, and more.)\n\n====\n\nA few impressions\n\n* Talking about a specialized topic on a podcast that has a big and broad audience is a balancing act. The producers stopped me many times during the interview to tell me I was being too technical (understandable!). I tried to be nuanced but this conversation is necessarily a distilled version of the arguments @sayashk and I have made in our essays (especially https://t.co/sS8OS9LerG) which are themselves written for a somewhat broad audience and hence distilled in complexity from our notes and 1-1 discussions with peers.\n\n* I knew Ezra had well-formed views on AI safety that were different from mine, so I was expecting a tough interview, but he also seemed like a fair interviewer. It went about as well as I expected and I feel like it was a good debate / conversation. I wasn’t necessarily expecting to change minds but I was glad to hear from people who found it thought provoking and looked up my essays and other work.\n\n* The interview was about two hours, edited down to an hour. I was a bit nervous waiting for it to land, because I knew the editing could make a big difference to how I came across. It turned out well. They even did things like find archival footage to illustrate my point that the early days of worms and viruses was a weird time in cybersecurity.\n\n* I use AI to prepare for interviews. I have an agent that has read all of my output (books, articles, essays, talks, podcast transcripts, tweets, internal notes — on the order of a million words) to pull out pithy explanations, examples, analogies, and other talking points that will probably work well in a spoken format. Reviewing this file before interviews is extremely helpful. It is of course not the only way I prepare but it’s the highest bang for buck. Maintaining this file would be a massive amount of grunt work and there’s no way I’d do it if it weren’t for AI. I mention this because there’s a very large space of beneficial AI uses in knowledge work that _don’t_ involve cognitive offloading. They don’t get much hype on social media so people might be unaware of how much mileage you can get out of them, with little downside.", "created_at": "2026-10-13T14:10:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 149, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhCoPnWwAA31s4.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110382619804287301", "url": "https://x.com/random_walker/status/2110382619804287301", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T14:50:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 133, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2108245406702346619", "url": "https://x.com/sethlazar/status/2108245406702346619", "text": "@David_Kasten @StephenLCasper hmm I don't know what you might have read! But here are some bangers: \nBainbridge 1983, Ironies of Automation, https://t.co/80bdMkXXyA\nMumford 1964, Authoritarian and Democratic Technics, https://t.co/RIbZH93Gbv\nWinner 1984, Mythinformation in the High-Tech Era, https://t.co/cKyDF29pwK\nClarke 1988, Information Technology and Dataveillance, https://t.co/vtTAiUwBk2\nAgre 1994, Surveillance and Capture, https://t.co/g2m8EAY21m\nNissenbaum 1994, Computing and Accountability, https://t.co/3eBzLFvu4d\nCitron 2008, Technological Due Process, https://t.co/dYG3B4eq2Q\nZittrain 2008, The Future of the Internet etc, https://t.co/fygRSCbMB1 (the stuff on perfect enforcement)\n\nhard to choose! can be more specific if there's something in particular that you're interested in", "created_at": "2026-10-08T17:17:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "David_Kasten", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108223177448910900", "url": "https://x.com/sethlazar/status/2108223177448910900", "text": "this obviously a v potted history. The whole fair ML lit should go in there too.", "created_at": "2026-10-08T15:49:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108222608906789014", "url": "https://x.com/sethlazar/status/2108222608906789014", "text": "While I agree that there's no textbook, and things are moving fast, I think @StephenLCasper understates here the degree to which we can better understand AI governance questions now by drawing on the much longer history of work on governing digital technologies, at least back to Mumford, Wiener, McLuhan, Winner, and via Nissenbaum, Citron, Pasquale, Crawford and co. There are indeed a few old-timers, and absorbing some of that earlier work can help avoid repeating mistakes.", "created_at": "2026-10-08T15:46:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 1, "media": [], "quoted": {"author": "StephenLCasper", "text": "I recently spoke with the Harvard Kennedy School comms office about thoughts on AI and AI governance research. You can check it out here. Thanks @Kennedy_School\n\nhttps://t.co/KyFRoB2cwK"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108218507104325987", "url": "https://x.com/sethlazar/status/2108218507104325987", "text": "The key point here is that nothing good will happen from the tech on its own; making sure there are benefits that justify building AGI depends on creating the rails (@random_walker ) that it'll run on, and clearing out obstacles that will predictably stall out any putative gains.", "created_at": "2026-10-08T15:30:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 2, "media": [], "quoted": {"author": "davidshor", "text": "The single biggest thing that AI proponents can do to make the public support the currently extremely unpopular massive AI buildout is to push their political allies to pass comprehensive legislation to make sure that the gains from artificial intelligence are broadly shared https://t.co/iyhDC5ETXr"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108211492902273391", "url": "https://x.com/sethlazar/status/2108211492902273391", "text": "@Dr_Atoosa @dgrobinson @ezraklein David is indeed great. Also, tho, doesn't this image look like Ezra Klein looking at himself in a mirror but without the beard.", "created_at": "2026-10-08T15:02:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Dr_Atoosa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108206921090027890", "url": "https://x.com/sethlazar/status/2108206921090027890", "text": "We have a choice in front of us. In my latest op-ed for Transformer, I invite employees of frontier AI companies to ask themselves if their work is truly leading us toward a safer future. Reflecting on these questions is hard, but we no longer have the luxury of time. We must act now.\n\nRead my full op-ed: [https://t.co/ruFBouQJbk]", "created_at": "2026-10-08T14:44:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Yoshua_Bengio", "rt_author_name": "Yoshua Bengio", "likes": 307, "retweets": 70, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108176341250060695", "url": "https://x.com/sethlazar/status/2108176341250060695", "text": "In just war theory there is a distinction between jus ad bellum and jus in bello, the justification of going to war, and of actions within war. There are equivalent questions in AI, and it feels like the whole ai safety community is focused on the jus in bello question, but the emerging  popular criticism (represented on here by eg @GregoryConti19 ) is arguing about the ad bellum question. So a lot of the ai safety argt sounds equivalent to an argt that we can (maybe) fight an unjust war by just means. More work is needed on justifying building AGI in the first place.", "created_at": "2026-10-08T12:43:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108045440620912690", "url": "https://x.com/sethlazar/status/2108045440620912690", "text": "SFC is offering a prize of $5MM - $20MM for a non-government entity getting frontier AI labs to help audit each other, for pre-deployment security risks like lab leaks or sandbox exfiltration. It's called an “Independently Supervised Peer-Assisted” (ISPA) inspection:\n\nhttps://t.co/sngXvS0KTP", "created_at": "2026-10-08T04:02:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCritchPhD", "rt_author_name": "Andrew Critch (🤖🩺🚀)", "likes": 33, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108045179487707136", "url": "https://x.com/sethlazar/status/2108045179487707136", "text": "When I think about the biggest OpenAI safety developments of the last few months, a few things come to mind: \"pacing the frontier\", the METR-Redwood Hugging Face investigation, and ongoing efforts to push a cross-lab monitorability standard. Jasmine, Tomek, and Mikita were central to literally every single one of those things.\n\nFrom what I can tell, they pushed their company to be better internally and defended their company when they thought external criticisms were unfair or overblown https://t.co/ATerGOIWIM. Their impact goes way beyond OpenAI alone https://t.co/RtXJTXUBme https://t.co/RezkOOhL4M. \n\nI think the public + definitely all current OpenAI staff deserve an ironclad case for why the company had no choice but to fire these three vital safety employees in one go", "created_at": "2026-10-08T04:01:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "likes": 194, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUEZqg4aIAAx3WU.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108041087277224031", "url": "https://x.com/sethlazar/status/2108041087277224031", "text": "I really like the idea of \"just in time\" research and think it has important implications for how we should do AI governance in the next few years (and how we're thinking about setting up @JohnsHopkinsSGP). Intelligence will very likely become abundant long before institutional capacity does, so we should invest in building capacity now\n\nThe point of most policy-relevant research (especially of the old school) is to try to make sure that the decisionmaker has all the right info at the time of decision by adding some useful bit. In theory, a decisionmaker with infinite time to make a decision could just gather all the info she needs herself--learn methods, collect data, develop and test hypotheses. In practice, decisionmakers face sharp time constraints. \n\nBut research can be done in advance and then packaged into a form that meets the decisionmaker's requirements (whether papers or memos). 1000 research hours turn into something that can be consumed in 10 minutes, ready in time but relying on an expensive foundation laid by researchers.\n\nJosh is arguing that AI might make building the foundation unnecessary, because the AI will be able to do what costs 1000 human hours of research work quickly enough to fit within the decisionmaker's time constraints. This is \"just in time\" research. We should assume he's right.\n\nWhat does that mean?\n1) Traditional research will shift more towards data collection, human interaction, and other frictiony domains where intelligence doesn't cleanly translate to speed and so investment in advance is still useful (@tylercowen has made this point)\n\n1.5) Laying foundations in those areas now will have huge benefits later\n\n2) We should focus more on research that pays off within aggressive AI capabilities timelines. If a project will take longer to produce an answer than it'll take for there to be an AI that can just solve it, probably don't do that project\n\n3) I'm less confident than Josh that verification will remain a key human function (AIs are good at explaining things) but agree that's where humans will retain some advantage. Judgment and credibility seem useful there\n\n4) Researchers should learn how institutions actually work and develop relationships with decisionmakers. Even optimal advice from an AI will have to move through organizational channels\n\n5) It's more important to learn how to get things done than to learn how do good policy analysis (obviously you still have to learn enough to make good choices). SGP is being built on the idea that most policy schools have gone wrong by focusing too much on the latter thing, when really it's the former that matters for effective governance. That will be even more true soon", "created_at": "2026-10-08T03:45:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickacaputo", "rt_author_name": "Nick Caputo", "likes": 17, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107947294654095863", "url": "https://x.com/sethlazar/status/2107947294654095863", "text": "Today, we’re expanding @SnorkelAI’s Open Benchmarks Grants by 10x to a $30M commitment: \n- Funding a more diverse, robust, and continuously-updated ecosystem of open benchmarks\n- Launching the Open Benchmarks Red Team to continually test and strengthen them\n- Introducing the Snorkel Research Fellowship to support independent contributors developing new evaluation methods\n\nSince our launch earlier this year, we’ve been humbled to partner with the teams behind Terminal-Bench, TB-Science, ARC-AGI-3, OSWorld 2.0, Agents’ Last Exam, Continual Learning Bench, Senior SWE-Bench, SlopCodeBench, and more. Alongside these teams, we’ve helped design evaluation methodologies, develop task construction pipelines, and scale quality control. OBG-funded benchmarks have appeared on the latest model cards from every major frontier lab; have helped to index and measure frontier progress and alignment; and have contributed to guiding the frontier of AI development.\n\nBenchmarks have always been guideposts for—and drivers of— AI progress: setting a metric and then “hillclimbing” against it is the core of how AI works! But when benchmarks fall behind frontier capabilities, our ability to evaluate and align these systems does as well. They become too simple, static, or correlated, and the risk of “benchmaxxing” increases.\n\nWe need more diverse, robust, and continuously-updated benchmarks, developed by a broader ecosystem of researchers and domain leaders.\nWe’re incredibly excited to accelerate frontier evaluation with Open Benchmarks Grants— raising the ambition and investment in robust, open, and independent measurement. Read our full announcement and apply here: https://t.co/E5kfZQ0Im5", "created_at": "2026-10-07T21:32:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "vincentsunnchen", "rt_author_name": "vincent sunn chen", "likes": 278, "retweets": 84, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108274802255344101", "url": "https://x.com/sethlazar/status/2108274802255344101", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T19:14:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1891, "retweets": 284, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108594808180670636", "url": "https://x.com/sethlazar/status/2108594808180670636", "text": "Paper on why platforms — and the digital economy more broadly — raise such deep issues of justice. I argue that 𝐰𝐞 𝐬𝐡𝐨𝐮𝐥𝐝 𝐮𝐧𝐝𝐞𝐫𝐬𝐭𝐚𝐧𝐝 𝐭𝐡𝐞 𝐝𝐢𝐠𝐢𝐭𝐚𝐥 𝐞𝐜𝐨𝐧𝐨𝐦𝐲 𝐚𝐬 𝐢𝐧𝐟𝐫𝐚𝐬𝐭𝐫𝐮𝐜𝐭𝐮𝐫𝐞: an invisible resource that runs businesses, politics, and even friendships.\n\nUsually we see powerful tech companies, or we focus on data (the “new oil”). But the infrastructure lens brings three things into clear view.\n\nFirst, it explains why we see 𝐠𝐥𝐨𝐛𝐚𝐥 𝐦𝐨𝐧𝐨𝐩𝐨𝐥𝐢𝐞𝐬, typically anchored in developed economies where rents, welfare, and power accrue.\n\nSecond, global infrastructures 𝐚𝐛𝐫𝐢𝐝𝐠𝐞 𝐩𝐮𝐛𝐥𝐢𝐜 𝐩𝐨𝐰𝐞𝐫. Early in the pandemic, it was Apple and Google, and not public health authorities, who decided to take contact tracing off the policy menu. Infrastructure owners can constrain the public policy menu.\n\nThird, global infrastructure 𝐜𝐫𝐞𝐚𝐭𝐞𝐬 𝐠𝐥𝐨𝐛𝐚𝐥 𝐝𝐞𝐩𝐞𝐧𝐝𝐞𝐧𝐜𝐲 𝐫𝐞𝐥𝐚𝐭𝐢𝐨𝐧𝐬. US and Chinese entities have a complicated relationship with the Global South. Some argue it’s a form of colonialism (I’d here point to the difference that territory is less central now).\n\nThe main thing to keep in mind about infrastructure is that 𝐚𝐜𝐜𝐞𝐬𝐬 𝐢𝐬, 𝐢𝐧 𝐚 𝐰𝐚𝐲, 𝐭𝐡𝐞 𝐞𝐚𝐬𝐲 𝐢𝐬𝐬𝐮𝐞 of justice: infrastructures want to connect and grow. The hard problem of infrastructure justice is about dominance: that someone can threaten to take the access away.\n\nIf any of this sounds interesting, please check out my chapter “Justice in the Global Digital Economy” in Justice in Global Economic Governance (Edinburgh University Press), edited by Axel Berger, Clara Brandi, and Eszter Kollar.\n\nThe chapter is open access: https://t.co/BkBQpo3rAr", "created_at": "2026-10-09T16:25:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jhimmelreich", "rt_author_name": "Johannes Himmelreich", "likes": 4, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108572526339366914", "url": "https://x.com/sethlazar/status/2108572526339366914", "text": "@olivertraldi https://t.co/KZkFo4jU8u", "created_at": "2026-10-09T14:57:20+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "olivertraldi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108572011307897026", "url": "https://x.com/sethlazar/status/2108572011307897026", "text": "Please resist the urge to mock the mathematicians struggling through this moment. Whatever your field, your expertise, your passion, you too shall one day experience what they are going through. And when you remember your words, you will feel remorse.", "created_at": "2026-10-09T14:55:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 3706, "retweets": 304, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108558908726071428", "url": "https://x.com/sethlazar/status/2108558908726071428", "text": "(somewhat belated) blog version of this paper is out, thank you to @ahall_research for letting me crash the @freesystemslab newsletter!!! \n\nhttps://t.co/HZpPeW2GfT https://t.co/V9LnkHMq1H", "created_at": "2026-10-09T14:03:13+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jessicadai_", "rt_author_name": "jessica dai", "likes": 30, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUI-ToFbQAAL3lk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUI-WKkaoAAQ32r.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544584762491123", "url": "https://x.com/sethlazar/status/2108544584762491123", "text": "Continuing the just war analogy; Bengio’s argument here is quite similar to Jeff McMahan and others about how soldiers, who would be responsible for fighting an unjust war, ought to refuse and if they did so would thereby prevent it. Also Buffy Sainte Marie’s argument, of course.", "created_at": "2026-10-09T13:06:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "Yoshua_Bengio", "text": "We have a choice in front of us. In my latest op-ed for Transformer, I invite employees of frontier AI companies to ask themselves if their work is truly leading us toward a safer future. Reflecting on these questions is hard, but we no longer have the luxury of time. We must act now.\n\nRead my full op-ed: [https://t.co/ruFBouQJbk]"}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544168419098824", "url": "https://x.com/sethlazar/status/2108544168419098824", "text": "@jonathanstray @LukeThorburn_ @julieannhawke I just got all my books from Australia and spent a bit of time thumbing through Grotius for the first time in aaaaages…", "created_at": "2026-10-09T13:04:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108339114928169358", "url": "https://x.com/sethlazar/status/2108339114928169358", "text": "This obviously makes it so that when OpenAI announces they're conducting an external investigation with regulators or auditors, everyone working with those regulators and auditors understands they'll be fired if the auditors or regulators learn too much.", "created_at": "2026-10-08T23:29:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 621, "retweets": 51, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108338805661175815", "url": "https://x.com/sethlazar/status/2108338805661175815", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below.", "created_at": "2026-10-08T23:28:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 5352, "retweets": 1044, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108338640166228418", "url": "https://x.com/sethlazar/status/2108338640166228418", "text": "@AriSchick @StephenLCasper @STS_News I don’t know that part, and also don’t subscribe to the STS framing in general (my approach is analytic philosophy). I think the general motif of “does tech determine/does human nature/is it something in between” is just a perpetual dialectic. Largely resolved with affordances frame but useful still to see how it has been articulated over and over again in the past.", "created_at": "2026-10-08T23:27:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AriSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108315855734116672", "url": "https://x.com/sethlazar/status/2108315855734116672", "text": "@AriSchick @StephenLCasper @STS_News not met but aware of his work! I mean repeating mistakes in the world, not mistakes in the work (there are those too I'm sure, but not really among the folks I'm mentioning here).", "created_at": "2026-10-08T21:57:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AriSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108925297328361983", "url": "https://x.com/sethlazar/status/2108925297328361983", "text": "@maxbodach unfortunately I think this also goes for slide decks (unfortunate since creating decks is a pain and it would be nice if this could be more automated). CC and Codex are great at doing design for a deck, and much better than existing templates etc. So I have no problem with them for aesthetics as long as doesn't get too repetitive. But people always also use them to generate the text of the deck, subheadings etc., which ends up channeling them into the slop basin again.", "created_at": "2026-10-10T14:19:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "maxbodach", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108908885457145880", "url": "https://x.com/sethlazar/status/2108908885457145880", "text": "Good work. Another reason not to use ai to write internal communications: it creates slop rollouts that needlessly take up and betrays total disregard for colleagues’ time (please read this five page memo that I myself haven’t read thanks bye)", "created_at": "2026-10-10T13:13:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 1, "media": [], "quoted": {"author": "maxbodach", "text": "An admirable stance (one I wish more publications would hold the line on). \n\nFAI's policy: we encourage full fluency with the latest AI tools (and deployment to help with research, ideation, typo-checks, microsites, etc.) but no writing for publication may be AI-generated. https://t.co/UpyU2lZ9Ju"}, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108777284505055312", "url": "https://x.com/sethlazar/status/2108777284505055312", "text": "With all the recent reporting on misuse and misalignment in frontier lab models, it’s become clear that there’s a lot we still don’t know. We’re lucky that reporting has given us even some of that information. But when it comes to government AI, our oversight is even worse. 🧵", "created_at": "2026-10-10T04:30:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joaneleanor_", "rt_author_name": "Joan Eleanor O'Bryan", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108752716927566176", "url": "https://x.com/sethlazar/status/2108752716927566176", "text": "@NatPurser very nice", "created_at": "2026-10-10T02:53:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "NatPurser", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108978870951244208", "url": "https://x.com/sethlazar/status/2108978870951244208", "text": "I've teased this before, but it's coming soon: Oxford Studies in Philosophy of AI and Computing. Call for papers out in a couple of weeks. It's going to be awesome. Tell your (philosophy) friends. https://t.co/MaCu4nzyKZ", "created_at": "2026-10-10T17:52:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUSZEv8WIAA8pia.jpg"}], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2109312670583181404", "url": "https://x.com/sethlazar/status/2109312670583181404", "text": "On August 21, almost two months ago, I contacted @OpenAI for a billing issue (for my NYU group). Not only has the issue not been resolved yet, I haven't heard *anything* from the support team. So I guess I'll tweet about it in the hope that one of you can help me rescue my $20k.", "created_at": "2026-10-11T15:58:24+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tallinzen", "rt_author_name": "Tal Linzen", "likes": 23, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.69580
