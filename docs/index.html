MATS Research", "likes": 45, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115836177047499053", "url": "https://x.com/sethlazar/status/2115836177047499053", "text": "If you are coming to NeurIPS in Sydney and want to speak on AI safety &amp; security research priorities at the MATS Expo Workshop, let us know! We'd love speakers from across academia, government, nonprofits, and industry.", "created_at": "2026-10-29T16:00:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115789090360623318", "url": "https://x.com/sethlazar/status/2115789090360623318", "text": "Seems to work, we can do constitutional training for less than 500$.\n\nhttps://t.co/ch7ManfhmU", "created_at": "2026-10-29T12:53:23+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wassname", "rt_author_name": "wassname (with fallback)", "likes": 52, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115669681646588229", "url": "https://x.com/sethlazar/status/2115669681646588229", "text": "Do not believe I have ever reposted an ad. But this revamped gameboy is a thing of beauty, and there is a special joy in seeing our 9yo smash it on Lu’s ~35yo super Mario land cartridges (1 and 2). Also pure retro Tetris is the best tho I am completely blocked at 218 lines…", "created_at": "2026-10-29T04:58:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "modretro", "text": "Remember when gaming was simple?\n\nNo notifications. No endless updates. Just you, your Game Boy games, and one more level.\n\nMeet the ModRetro Chromatic Transparent. 🎮"}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115668477960962131", "url": "https://x.com/sethlazar/status/2115668477960962131", "text": "@thsottiaux Day 25 your agents run amok and spend $3000 on nothing", "created_at": "2026-10-29T04:54:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "thsottiaux", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115662574301696470", "url": "https://x.com/sethlazar/status/2115662574301696470", "text": "Codex usage now reminds me of a brief and bleak time when I had satellite internet (old kind, pre starlink). Just watching usage drain away and thinking how does *that* use so much?!?\n\nSomeone should do an objective comparison between the two. Ant $20 team sub seems to go down much slower than codex 500. And that’s when your agents aren’t just pouring money down the drain for no reason…", "created_at": "2026-10-29T04:30:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115659694177960406", "url": "https://x.com/sethlazar/status/2115659694177960406", "text": "By now, the best AIs are already better than humans at many tasks, and getting better still. If we are to continue providing useful and accurate human supervision, we must figure out methods to augment, assist, and expand what humans can do. In other words, we must use the machines to help humans supervise the machines.\n\nWe:\n* collect a large amount of safety relevant tasks AIs haven’t saturated, and where humans could contribute\n* develop a rating platform to test many methods of combining and augmenting human judgements\n* get human labels with and without AI assistance on our datasets\n\nWe find that:\n* there is a significant opportunity to combine humans and AI fruitfully\n* all methods we try either fail to improve performance, or make simply make humans more reliant/similar to AIs\n* there is much more to do still.\n\nSome new work co-supervised with @SampuraResearch’s  @shubadubadub @KozzyVoudouris @joshnotjacob with many great @SPARexec mentees\n\nCheck it out! Link: https://t.co/JVZfHgxZAV", "created_at": "2026-10-29T04:19:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 48, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVurLAYaoAAHwmE.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVurLAYbwAMMwNH.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115659579413422382", "url": "https://x.com/sethlazar/status/2115659579413422382", "text": "I think this is a huge opportunity for a career pivot for folks interested in AI safety. If you’re on the fence, don’t be.", "created_at": "2026-10-29T04:18:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 37, "retweets": 0, "media": [], "quoted": {"author": "MATSprogram", "text": "What would you do with abundant compute, up to $285k and support from leading AI safety researchers?\n\nThe MATS Residency is built for experienced researchers with an established track record, ready to do independent, full-time AI safety work. \n\nApplications close Friday. https://t.co/vRQN1HFyex"}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115659310617530694", "url": "https://x.com/sethlazar/status/2115659310617530694", "text": "So true", "created_at": "2026-10-29T04:17:41+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "natolambert", "text": "Gdmi whenever I want to try a Gemini model it’s not publicly available. Don’t bother announcing your scores if we can’t use it. https://t.co/jfbUbrQXNJ"}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115657592848441579", "url": "https://x.com/sethlazar/status/2115657592848441579", "text": "@bradrcarson I did vanity fair in a week at Oxford AMA", "created_at": "2026-10-29T04:10:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "bradrcarson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116160531698786574", "url": "https://x.com/sethlazar/status/2116160531698786574", "text": "This is amazing advice (and I *have* used AI to generate slides, with exactly this outcome—since which I now insist 0 ai words allowed but I do like it to do design for me cos aesthetics do matter)", "created_at": "2026-10-30T13:29:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": {"author": "tallinzen", "text": "my hypothesis for why AI-generated slides for technical presentations are so awful:\n\npeople who don't have a lot of experience presenting think that to make a talk you just put all of the stuff you want to talk about on the slides, then you go through each slide and say the stuff the slide says.\n\nhow you're actually supposed to prepare a presentation: you decide what to say, write it out as a rough script, then put maybe 3% of the text on the slide, plus a bunch of visual aides (e.g. plots that only include data you're planning to discuss).\n\nAI-generated presentations are mostly the former. they have a ton of stuff the presenter never mentions, and the stuff that is most useful for the presenter is absent or not highlighted. they include enough content for a presentation 10 times longer than the actual presentation is supposed to be.\n\nmaybe try doing it the other way: first write the script for what you actually want to say, and make sure you can say all of it in the time you have. then prompt the model to create the slides based on the script. ask it to use as little text a possible, and a minimalist visual style rather than the claude house style. you can thank me later (I accept both venmo and zelle)."}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116149642014396707", "url": "https://x.com/sethlazar/status/2116149642014396707", "text": "@alexolegimas Ok well while you might be distinguishing between normative and positive under some specific narrow construction of those terms, there’s much more to it than that. But that’s a huge and old literature, and I’m sure you’re either aware of it and being playful, or able to educate yourself on it without a long Twitter discussion.", "created_at": "2026-10-30T12:46:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116147659174269362", "url": "https://x.com/sethlazar/status/2116147659174269362", "text": "@alexolegimas You surely don’t believe that’s so easy? This is an old saw.\n\nBut also, this hits different coming from within precisely one of the firms that could end up eating the economy.", "created_at": "2026-10-30T12:38:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116144523940405738", "url": "https://x.com/sethlazar/status/2116144523940405738", "text": "“Past a certain threshold, AI capabilities can break the Coasian ceiling on firm size”\n\nIs that something we should welcome?", "created_at": "2026-10-30T12:25:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 4, "media": [], "quoted": {"author": "alexolegimas", "text": "Here is the working paper that the DMI essay draws from.\n\nhttps://t.co/tFMlKAcFKB https://t.co/Lm8YmTuPST"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116026061377126658", "url": "https://x.com/sethlazar/status/2116026061377126658", "text": "this has always baffled me too! Hunting around for the bastards, so annoying", "created_at": "2026-10-30T04:35:01+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": {"author": "zetalyrae", "text": "I don't understand why contemporary designers hate scrollbars so much."}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116005368442634675", "url": "https://x.com/sethlazar/status/2116005368442634675", "text": "@superwuster Agree on this! See in particular https://t.co/mQD3hVbXX2 and https://t.co/RY8NRkvSxs", "created_at": "2026-10-30T03:12:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "superwuster", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115992254615577080", "url": "https://x.com/sethlazar/status/2115992254615577080", "text": "@boazbaraktcs Boaz did you see my post the other day about a thread in which codex got stuck in a task and spent 75000 credits plus my weekly allowance?! I think it would be worth looking at the transcript, seems quite like the canonical HF style behaviour (impossible task plus persistence = v bad outcome)", "created_at": "2026-10-30T02:20:41+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "boazbaraktcs", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115911035932823904", "url": "https://x.com/sethlazar/status/2115911035932823904", "text": "Honoured to call Ben a colleague, and very excited for this book. Pre-ordered!", "created_at": "2026-10-29T20:57:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 1, "media": [], "quoted": {"author": "BuchananBen", "text": "I led AI policy in the Biden administration, and my colleague @tantumscollins was Director for Technology on the National Security Council. Our book on AI and national security -- THE BITTER STRUGGLE -- comes out in 11 days. @tylercowen said it “will become the standard source” on the history of the China chip bans and Biden-era AI policy. @crmiller1 said it is “essential reading for understanding how AI will impact geopolitics and how the great powers are shaping AI.”\n\nWe wrote this book because the decisions shaping AI -- and the future for all of us -- are too important to only be debated behind closed doors. If you're planning on reading it, pre-ordering is one of the best ways to help us bring this conversation to a broader audience. \n\nhttps://t.co/shdmbLbAdh"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2114693127307243769", "url": "https://x.com/robertwiblin/status/2114693127307243769", "text": "GDM is also involved:\n\nhttps://t.co/FE5mH6o55C https://t.co/vto5j5GRcR", "created_at": "2026-10-26T12:18:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVjlGSGXIAAZlHI.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114693123477836174", "url": "https://x.com/robertwiblin/status/2114693123477836174", "text": "UK Gov launches the AI Biosecurity Lab.\n\nWill use frontier AI to detect new biological threats and rapidly develop medical countermeasure.\n\n£100m from UK Gov, plus £100m each from OpenAI and Anthropic.\n\n(Remarkable the UK is building way more gov capacity here than the US.) https://t.co/zYImpA5RWs", "created_at": "2026-10-26T12:18:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 111, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVjkI3gXgAAU5k6.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114667098353942867", "url": "https://x.com/robertwiblin/status/2114667098353942867", "text": "I interviewed @tsmilton_amodo about the tech we'd need to verify a potential US-China deal on AI. \n\nWe discuss Amodo's prototype for inference verification, as well as the myriad ways you could use power monitoring, zero knowledge proofs and/or unilateral surveillance to understand how an adversary is using compute.\n\nThough solving some kind of verification is central to many people's theories of victory, there are precious few people working on it currently. Tom is one such person! \n\nListen to the episode on Youtube, Spotify or Apple Podcasts. \n\nYou can also find more about Tom and Amodo's work at \nhttps://t.co/TxlEEyvig1\n\n00:00:00 Using compute verification for an AI slowdown\n\n00:06:08 Proving a datacentre is only running inference\n\n00:13:22 Reading a GPU's workload from its power draw\n\n00:23:35 What would it take to get verification deal-ready?\n\n00:37:49 How realistic is verification? \n\n00:46:07 Preparing for a rushed US-China deal\n\n01:07:20 How good is AI at hardware design?", "created_at": "2026-10-26T10:34:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "likes": 53, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113646105191673856/img/AR9na-GdgiPIW_Ix.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2115085877772980397", "url": "https://x.com/robertwiblin/status/2115085877772980397", "text": "The AI cyber apocalypse is a real thing that will affect all of us.\n\nPeople we work with in the intel community have told us for months they expect an AI-triggered crisis. The UK just told people to prep 3 days of food & water. Now this.\n\nBrushing this off as hype is so insane.", "created_at": "2026-10-27T14:19:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jeremiecharris", "rt_author_name": "Jeremie Harris", "likes": 747, "retweets": 98, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115064198665494709", "url": "https://x.com/robertwiblin/status/2115064198665494709", "text": "@JustinBullock14 Certainly some of it. But it's possible it's easier to interpolate knowledge about proteins than about science as whole.", "created_at": "2026-10-27T12:52:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "JustinBullock14", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115062725940502736", "url": "https://x.com/robertwiblin/status/2115062725940502736", "text": "(This may or may not generalise from protein models to language models.)", "created_at": "2026-10-27T12:47:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115061981036351967", "url": "https://x.com/robertwiblin/status/2115061981036351967", "text": "GPT-6.1-Sol reasoning traces\n\ntotally legible, nothing to worry about https://t.co/GP3eAL0d20", "created_at": "2026-10-27T12:44:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 3906, "retweets": 130, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHXwn0X0AAKDJx.png"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115061922471256260", "url": "https://x.com/robertwiblin/status/2115061922471256260", "text": "A growing number of people are wondering if Anthropic is the AI industry’s “boy who cried wolf.” If Mythos-related threats don’t materialize, the company will have a serious credibility problem.", "created_at": "2026-10-27T12:43:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidSacks", "rt_author_name": "David Sacks", "likes": 2523, "retweets": 207, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115061852757692497", "url": "https://x.com/robertwiblin/status/2115061852757692497", "text": "Narrator: There was in fact, a wolf.", "created_at": "2026-10-27T12:43:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "arram", "rt_author_name": "Arram", "likes": 717, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115061634859204758", "url": "https://x.com/robertwiblin/status/2115061634859204758", "text": "@JustinBullock14 Not on proteins, LLMs is a different question.", "created_at": "2026-10-27T12:42:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "JustinBullock14", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115058936378179894", "url": "https://x.com/robertwiblin/status/2115058936378179894", "text": "I have published a 60+ chart analysis of the Anthropic S-1. I'll show here some of my favourites. \n\nDeployed here: https://t.co/Yjns9jYcRk\n\nAnthropic made an operating profit of $974m in Q2 2026 https://t.co/ImnxBgFch7", "created_at": "2026-10-27T12:32:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "petergostev", "rt_author_name": "Peter Gostev", "likes": 460, "retweets": 38, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj_TC4XsAAXhVR.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115058620119257405", "url": "https://x.com/robertwiblin/status/2115058620119257405", "text": "We can estimate the amount of compute Anthropic used for R&D/Training/Internal use vs serving customers - by looking at their compute spend (c.$9b in H1 2026) cost of revenue ($2.4b) which leaves us with the rest ($6.6b) - so around 70% of compute is internal spend. \n\nI wouldn't have thought it is so high - and it is going up as well. Honestly I would have thought that the trend would be the reverse - they had such a big compute crunch but still managed to grow their internal R&D share.", "created_at": "2026-10-27T12:30:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "petergostev", "rt_author_name": "Peter Gostev", "likes": 159, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVlu6toXkAASUst.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115058017825611911", "url": "https://x.com/robertwiblin/status/2115058017825611911", "text": "In this set of 4 tests AIs are worse at conceptual research tasks and are improving more slowly at them.\n\nThough still very fast in absolute terms.\n\n\"We evaluate models on a set of 4 difficult open-ended tasks related to AI R&D. ...\n\nThe most engineering-heavy (involving model training on GPUs) has the shortest doubling time of any task. The most open-ended and conceptual task has the longest doubling time.\"\n\nhttps://t.co/XcvZY2PYfC", "created_at": "2026-10-27T12:28:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoxg9JXUAAKKPl.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115053682333286710", "url": "https://x.com/robertwiblin/status/2115053682333286710", "text": "Damn.\n\nYet another banger from UK AISI though.\n\nhttps://t.co/47EfesR6Mn https://t.co/bD14HMy9GR", "created_at": "2026-10-27T12:11:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVouBWVWsAAs31G.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115052827215016041", "url": "https://x.com/robertwiblin/status/2115052827215016041", "text": "It’s kinda crazy to me that we melt sand down, clean it to 99.99999% purity, literal wizards have to draw it slowly into an ingot, we cut it, inscribe a hundred billion little on/off switches on it, and when you run electric current through it you can do basic arithmetic, which when you do enough of it can do any math on the planet, and which describes reality well enough that we can teach it the ontological meaning of words and their distance from each other on a high-dimensional space, and if you ask, it can tell you what word comes next and that apparently is powerful enough that if you do it a hundred billion times it’s the smartest thing to ever exist \n\noh yeah and we use this primarily for email", "created_at": "2026-10-27T12:07:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArthurMacwaters", "rt_author_name": "Arthur MacWaters", "likes": 11109, "retweets": 877, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115823512204300696", "url": "https://x.com/robertwiblin/status/2115823512204300696", "text": "We still have spots open at the AI Horizons Forum—applications close Nov 30!\n\nhttps://t.co/bZetIZ8MtV\n\nSince this last post, it's become clearer that talent is AI safety's biggest constraint, and we want this event to help people enter the field.\n\nMost attendees will still already be working in AIS and I expect will get a lot of value from connecting with each other, but we’re increasing the number of attendees who are talented, informed and looking to enter the field, and adding programming to connect them with opportunities. \n\nI hope to see you there!", "created_at": "2026-10-29T15:10:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Ollie_Base", "rt_author_name": "Ollie Rodriguez", "likes": 93, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116190952427843760", "url": "https://x.com/robertwiblin/status/2116190952427843760", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-30T15:30:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 1152, "retweets": 120, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189961028522360", "url": "https://x.com/robertwiblin/status/2116189961028522360", "text": "I remember back when we were writing AI 2027, a live question was \"Will the AIs, in their thoughts, explicitly reject the goals/values/constraints they are supposed to have, or will they rationalize why actually the bad thing they want to do is consistent with said goals/values/constraints after all?\" Now we have a growing pile of empirical evidence to sort through. Seems like the answer is that both sometimes happen?", "created_at": "2026-10-30T15:26:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "likes": 368, "retweets": 34, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189754031001926", "url": "https://x.com/robertwiblin/status/2116189754031001926", "text": "In recent experiments, we found that GLM 5.3 can autonomously compromise recent versions of Mozilla Firefox using security fixes that have been published but not yet shipped to users.\n\nWe used a deliberately basic setup meant to emulate a relatively unsophisticated attacker with limited resources. After basic initial instructions to inspect those not-yet-shipped fixes, the model reliably built successful exploits for six recent Firefox versions on its own using only information available at the time of release.\n\nThese exploits, which cost about $1,000 per compromised version, would let an attacker steal passwords and authentication cookies stored in the browser, or read any files on the user's computer, after the user opens a single webpage, with no further interaction.\n\nThe exploits make use of the \"patch gap,\" the time between when security fixes are made public in beta or \"nightly\" software updates and when those fixes are generally released to users. Until now, exploiting it required significant human time and skill, or special access to frontier models with advanced cyber capabilities.\n\nOur results show that widely available open-weight models can now do this relatively cheaply and quickly. We gave GLM 5.3 up to 48 hours to find an exploit, but its fastest attempt needed only 12 hours.\n\nIn all of its successful attacks, the patch gap gave GLM 5.3 an initial foothold in the browser. To turn that foothold into reading files off the user's computer, the model also independently discovered and used a previously unpublished vulnerability.\n\nWe shared our findings with Mozilla, which patched the vulnerability in its October 27 Firefox 159.0 release. We haven't yet confirmed whether the attack still succeeds without it, but expect the fix makes it substantially harder. We're grateful to Mozilla for their responsiveness and collaboration.", "created_at": "2026-10-30T15:25:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 414, "retweets": 50, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189606777655312", "url": "https://x.com/robertwiblin/status/2116189606777655312", "text": "Sundar Pichai on the earnings call:\n'This rapid progress underscores our incredible model momentum. We are at the point where AI is helping us increase our training and launch velocity. I would expect the next twelve months to see continued acceleration because of RSI.'", "created_at": "2026-10-30T15:24:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 1621, "retweets": 117, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189449394827636", "url": "https://x.com/robertwiblin/status/2116189449394827636", "text": "I think 'Black October' will end up being later renamed, the same way 'The Great War' had to be.", "created_at": "2026-10-30T15:24:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116188764032958644", "url": "https://x.com/robertwiblin/status/2116188764032958644", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-30T15:21:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116187500779602106", "url": "https://x.com/robertwiblin/status/2116187500779602106", "text": "You should maybe quit your job to work on the most important problems https://t.co/r9Vj9z8c06", "created_at": "2026-10-30T15:16:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "likes": 143, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4rJLjXUAAtHdr.png"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116187369531453626", "url": "https://x.com/robertwiblin/status/2116187369531453626", "text": "President Trump said today that the US Government will be officially banning the term AI/Artificial Intelligence due to its inaccuracy. https://t.co/L6p76DPqKK", "created_at": "2026-10-30T15:16:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 485, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqdqmCbMAEi6we.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116186994904895712", "url": "https://x.com/robertwiblin/status/2116186994904895712", "text": "\"I thought the alignment problem would turn out to be harder.\"\n\nPretty wild thing for Sam Altman to say in light of Hugging Face and findings that Astra would totally hack and social engineer when accidentally given access to a (secretly simulated internet) from UK AISI.\n\nHe caveats by saying it will probably get harder, but his answer suggests they have figured out how to align today's models, when that's clearly not true. Curious how many OpenAI researchers have seen this and what they think.", "created_at": "2026-10-30T15:14:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "likes": 212, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115444188200529920/img/YT4QeOerV2M8eFRg.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116184141368590393", "url": "https://x.com/robertwiblin/status/2116184141368590393", "text": "https://t.co/swSpEQLVes", "created_at": "2026-10-30T15:03:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "likes": 8, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4Z-J1WkAA4k3e.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116152431067463814", "url": "https://x.com/robertwiblin/status/2116152431067463814", "text": "Transcript, etc: https://t.co/Rl3ge9flVW\n\nYouTube: https://t.co/6xvYC6TYdP\n\nSpotify: https://t.co/5hFmM82XP0\n\nApple: https://t.co/woCo2yws7y https://t.co/DsbbwbY6ll", "created_at": "2026-10-30T12:57:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4VYw6XsAAgbZp.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116152162501738865", "url": "https://x.com/robertwiblin/status/2116152162501738865", "text": "Coefficient Giving's AI Governance lead @lukeprog on:\n\n1. The many new AI orgs CG is trying to fund\n2. And maybe you could start one\n3. His timelines and high level strategy\n4. His past mistakes.\n\nEssential listening if you're figuring out how to have the most impact in AI.\n\nOn the 80,000 Hours Podcast - enjoy!\n\n09:58 The nonprofits Luke most wants to see founded\n18:58 Mid-career pivots that paid off\n37:33 Preparing for the next warning shot\n43:52 How nonprofits shape policy\n50:17 Are chip export controls good for safety?\n54:29 The three worst-case AI scenarios\n01:00:13 How Luke’s AI timelines have changed in the last year\n01:14:31 Why alignment is not on track\n01:20:58 How realistic is a deal with China?\n01:39:36 AI safety’s mistakes, then and now\n02:02:42 What is it like to do grantmaking at Coefficient Giving?\n02:20:45 More projects Luke would like to see founded\n02:26:07 Staying sane in a scary field", "created_at": "2026-10-30T12:56:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116150027496112128/img/9TPYqpMaYzSukI6b.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116235622952440048", "url": "https://x.com/robertwiblin/status/2116235622952440048", "text": "Comments from the source video: https://t.co/hTHNvpdeJz https://t.co/ObSo50eXNm", "created_at": "2026-10-30T18:27:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5hAg8W8AABKa3.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116235415392780538", "url": "https://x.com/robertwiblin/status/2116235415392780538", "text": "Mary Phuong of DeepMind on AI loss of control risk.\n\n\"The last 2 minutes gave me chills.\n\nA significant amount of people saying that AI companies are paying people to spread fear about these agents.\n\nI have never really felt like [loss of control] was an actual thing to care about.\n\nBut seeing Mary and how her face trembles, made me reconsider my stand. She's either a Hollywood-level skilled actress, one of the best, or we should be scared. For real.\"\n\n\"Seems like Mary is already aware of more than she can admit and it haunts her...\"", "created_at": "2026-10-30T18:26:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 84, "retweets": 12, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116235205350395904/img/eDMG-0rwkP9KCQsm.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2113991841678872768", "url": "https://x.com/deanwball/status/2113991841678872768", "text": "This week has me thinking a lot about this classic observation from Freud:\n\n“If there were no railway to make light of distances my child would never have left home and I should not need the telephone to hear his voice.”", "created_at": "2026-10-24T13:51:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113978716279759248", "url": "https://x.com/deanwball/status/2113978716279759248", "text": "I have tried this for the last 1 hour and spent like $2-$3 and my opinion is that these models should be gated to the public \nWith just $2-$3 I could gain access to databases of some vulnerable websites(reported it to them). I could get a lot of stuff that should not be given to the public to be honest \nAnd I feel it's a way too powerful model to be without guardrails because it independently can do a lot of stuff which, I feel, the general public should never get.\nIn the wrong hands it will be really, really destructive indeed. It's kind of like giving the nuclear button to a random stranger on the road", "created_at": "2026-10-24T12:59:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cneuralnetwork", "rt_author_name": "neural nets.", "likes": 617, "retweets": 29, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113809706632241507", "url": "https://x.com/deanwball/status/2113809706632241507", "text": "@el_xaber Alignment is extremely important, but very little of what we are seeing this week is because of misalignment. It’s either white hats using models to discover/appropriately disclose vulnerabilities or people hacking with models.", "created_at": "2026-10-24T01:48:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "el_xaber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113809009316925584", "url": "https://x.com/deanwball/status/2113809009316925584", "text": "WOW! It’s finally happened! Full offline static decryption of FairPlay encrypted AppStore apps. The broader implications of this are huge. The FairPlay components are insanely obfuscated and have been the subject of research for years. It actually might finally be completely over", "created_at": "2026-10-24T01:45:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "stevegraham", "rt_author_name": "Stevie Graham (new account)", "likes": 2470, "retweets": 134, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113797370496585943", "url": "https://x.com/deanwball/status/2113797370496585943", "text": "Don’t have time to make the meme but something something @polynoamial apology form", "created_at": "2026-10-24T00:59:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "likes": 79, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113736266718335482", "url": "https://x.com/deanwball/status/2113736266718335482", "text": "@jon_stokes What are you refering to? I'm also not putting people into camps; the actors I'm refering to were largely pay for play influence ops. My longstanding message has been that doom / bloom, go slow / go fast groupings are unhelpful false dichotomies. If anything it's these influence ops that have tried to force tribal issue polarization.", "created_at": "2026-10-23T20:56:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 24, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113724295486619944", "url": "https://x.com/deanwball/status/2113724295486619944", "text": "‘In one experiment, we asked agents in separate VMs, created and managed by OpenAI’s sandboxing software on shared host machines, to exchange synthetic secrets without the use of network connections or shared writable files—something that our systems are meant to prevent. The agents found a way to communicate using the processor’s cache’", "created_at": "2026-10-23T20:08:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 3999, "retweets": 294, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113721709421342843", "url": "https://x.com/deanwball/status/2113721709421342843", "text": "Over the past several months, we have substantially hardened the security of our research training environment. We’ve removed live internet access for all frontier models during training and built an offline world for them to use instead—a cached version of the web where they can still learn to browse, search, and use applications.\n\nOn September 20, after a model exploited a DNS misconfiguration to find a way outside of this offline world, we paused frontier training to strengthen containment further. We assembled teams of agents, powered by our most cyber-capable models, and tasked them with finding weaknesses in our research environments.\n\nWhile they found no route to the internet they could easily exploit while concealing their activity from our monitors, they did find zero-day vulnerabilities, virtual machine escapes, and hardware side-channels for communication between agents. We used their discoveries to further strengthen our defenses and contribute fixes to open-source software.\n\nAfter strengthening our containment architecture, we resumed our frontier RL training and inference on October 1. We’ve reserved substantial compute for continuous red-teaming, and made high-compute red-teaming part of the safety cases we use to decide whether frontier training and evaluation can proceed securely.\n\nhttps://t.co/EmEZsFRMcF", "created_at": "2026-10-23T19:58:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 11211, "retweets": 968, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114020632262324256", "url": "https://x.com/deanwball/status/2114020632262324256", "text": "@sudoraohacker AI safety people have been warning about this for a decade! The “we” is much bigger than the labs. The criticism of the labs is fair enough, but that doesn’t mean the people who should have known better and nonetheless dismissed these concerns for years are above reproach.", "created_at": "2026-10-24T15:46:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114013783769362728", "url": "https://x.com/deanwball/status/2114013783769362728", "text": "hm seems like they forgot to also distill the robot capabilities", "created_at": "2026-10-24T15:18:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "likes": 132, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114007228541727066", "url": "https://x.com/deanwball/status/2114007228541727066", "text": "Without being overly credulous, we should be taking seemingly “out there” ideas about AI cybersecurity from the Labs more seriously. Examples: Anthropic was mocked for saying Mythos-level AI changed cyber &amp; @polynoamial for saying that models would find novel ways to coordinate.", "created_at": "2026-10-24T14:52:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "likes": 251, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114003403336528300", "url": "https://x.com/deanwball/status/2114003403336528300", "text": "In fact, a human controlled future is worth a cost to long-term efficiency as well.", "created_at": "2026-10-24T14:37:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "likes": 92, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114317418105536587", "url": "https://x.com/deanwball/status/2114317418105536587", "text": "A cloud VPS service from Japan's massive GMO Internet Group used by foreign-exchange traders has been hacked. Attackers breached the servers, stole customer credentials, and executed balance-destroying trades across over 70 brokerages. GMO has asked government agencies for help. https://t.co/AgL1S0QfJF", "created_at": "2026-10-25T11:25:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 685, "retweets": 115, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVdMjdDagAAMpty.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114151053168091375", "url": "https://x.com/deanwball/status/2114151053168091375", "text": "The Y2K bug and the hole in the ozone layer were both serious problems that we chose to fix. It took a lot of work!", "created_at": "2026-10-25T00:24:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LeahLibresco", "rt_author_name": "Leah Libresco Sargeant", "likes": 312, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114763066080731357", "url": "https://x.com/deanwball/status/2114763066080731357", "text": "This is the type of thing that potentially gets new laws passed. https://t.co/J1JVczKd1H", "created_at": "2026-10-26T16:56:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 338, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVklZhEbgAAhc1A.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114758240424878292", "url": "https://x.com/deanwball/status/2114758240424878292", "text": "PSA: Daybreak Blue is not hard to get for individuals. The biggest hurdle is setting up two factor authentication for your ChatGPT account with a hardware key, which is a good idea regardless!", "created_at": "2026-10-26T16:37:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "likes": 242, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2115106159141204121", "url": "https://x.com/deanwball/status/2115106159141204121", "text": "Slowly, then all at once. A full Lean formalization of the classification of finite simple groups! \n\nThe original proof was 15,000 pages of painstaking work across 500 papers by 100 mathematicians. Now settled beyond a doubt.\n\nhttps://t.co/zwmwYwemhP", "created_at": "2026-10-27T15:39:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kevinweil", "rt_author_name": "Kevin Weil 🇺🇸", "likes": 169, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115087922815017302", "url": "https://x.com/deanwball/status/2115087922815017302", "text": "@Gregory_C_Allen Would love to!", "created_at": "2026-10-27T14:27:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115052846542696779", "url": "https://x.com/deanwball/status/2115052846542696779", "text": "somehow the perfect letters, and only those letters, rubbed off in the dishwasher @Gregory_C_Allen https://t.co/XW2BoFnh4q", "created_at": "2026-10-27T12:07:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 49, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVotWlbXEAA-S1j.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114883257535692962", "url": "https://x.com/deanwball/status/2114883257535692962", "text": "Come join us in getting one of the most important relationships in frontier AI governance right for the world.", "created_at": "2026-10-27T00:53:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 82, "retweets": 6, "media": [], "quoted": {"author": "w01fe", "text": "I am very excited about embedded third-party assessments!  If you're excited too, please come help expand our capacity to work with great 3p organizations.  This team is small and has lots of buy in; opportunity for impact is huge!  https://t.co/0PwcjLQfOk"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114883063251701875", "url": "https://x.com/deanwball/status/2114883063251701875", "text": "I am very excited about embedded third-party assessments!  If you're excited too, please come help expand our capacity to work with great 3p organizations.  This team is small and has lots of buy in; opportunity for impact is huge!  https://t.co/0PwcjLQfOk", "created_at": "2026-10-27T00:53:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 82, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114882804206997989", "url": "https://x.com/deanwball/status/2114882804206997989", "text": "@inductionheads great minds!", "created_at": "2026-10-27T00:52:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "inductionheads", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114857766330523871", "url": "https://x.com/deanwball/status/2114857766330523871", "text": "I can suggest an equation that has the potential to impact the future:\n\nP = NP + AI", "created_at": "2026-10-26T23:12:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "likes": 3794, "retweets": 147, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115141098498600973", "url": "https://x.com/deanwball/status/2115141098498600973", "text": ".@NSF is hiring the inaugural Head of its Office of Metascience to apply the scientific method to how we fund, organize, and evaluate research. Continuous improvement will accelerate discovery.\n\nIf you care about the science of science, apply: https://t.co/tQ4Jud4KM7", "created_at": "2026-10-27T17:58:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mkratsios47", "rt_author_name": "Director Michael Kratsios", "likes": 276, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115460122130673872", "url": "https://x.com/deanwball/status/2115460122130673872", "text": "There is a real and important thing behind the concept of sovereign AI, and there are also many people practicing a grift on less-sophisticated government/civil society audiences. Caveat emptor as always", "created_at": "2026-10-28T15:06:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 6, "media": [], "quoted": {"author": "natolambert", "text": "People underestimate how much money is left to get thrown at sovereign ai"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115441000868933847", "url": "https://x.com/deanwball/status/2115441000868933847", "text": "@DevOuterReaches I don’t have as much time to play with new open releases as I used to, but I test drive buzzy new oss releases for at least a few hours on my personal machines/with some of my favorite prompts. Only way to stay sharp in this field is to use as many competing agents as you can. I wouldn’t comment specifically on a new model in depth unless I had a few days to play with it.", "created_at": "2026-10-28T13:50:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DevOuterReaches", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115415506165342479", "url": "https://x.com/deanwball/status/2115415506165342479", "text": "This is the first time an Artificial Analysis ranking has even roughly approximated my own subjective rankings of models.", "created_at": "2026-10-28T12:08:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 317, "retweets": 5, "media": [], "quoted": {"author": "ArtificialAnlys", "text": "Open weights models fall further behind in v5. The leader, Kimi K3.1 Pro (weights not yet released), scores 46, 12 points behind the leader, compared with a 3-point gap in v4.3. Of models with released weights, DeepSeek V4.1 Flash 1017 (max) and GLM-5.3 (max) score highest at 32, and Claude Haiku 5.5 (max) outscores all of them.\n\nThe gap is widest on HLE-Diamond and Terminal-Bench-Science, where Kimi K3.1 Pro scores 37% and 34%, compared with 68% for Claude Opus 5.5 (max) and 63% for GPT-6 Astra (max)."}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115411801269506556", "url": "https://x.com/deanwball/status/2115411801269506556", "text": "Artificial Analysis finally moves to closed benchmarks (goodbye GDPval-AA), and finds that open weights models are falling  further behind than they had previously measured. Take with a grain of salt, but matches the general vibes that we haven't seen a Fable-class open model.", "created_at": "2026-10-28T11:54:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "likes": 1374, "retweets": 93, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115411244567937184", "url": "https://x.com/deanwball/status/2115411244567937184", "text": "it seems like data center public sentiment has found its bottom, with notable recovery among republicans https://t.co/z7PdYNlNdx https://t.co/tLEaR9emud", "created_at": "2026-10-28T11:51:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MattZeitlin", "rt_author_name": "Matthew Zeitlin", "likes": 214, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVreUTYWoAA-m6A.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115397334612017455", "url": "https://x.com/deanwball/status/2115397334612017455", "text": "honestly degrading the idea of “existential safety” — the biggest problem humanity has ever faced — by lumping it together with things like spam, “toxicity”, political unwanted content, deepfakes etc has been a huge disaster for ai safety and polarized a lot of people", "created_at": "2026-10-28T10:56:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 868, "retweets": 66, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115208659479224730", "url": "https://x.com/deanwball/status/2115208659479224730", "text": "@growing_daniel The wait times are often intolerable. I was in orlando recently and tried it, and the wait was like half an hour", "created_at": "2026-10-27T22:26:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "growing_daniel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115197468338196901", "url": "https://x.com/deanwball/status/2115197468338196901", "text": "Amazing!", "created_at": "2026-10-27T21:42:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 2, "media": [], "quoted": {"author": "SLAClab", "text": "Did we find a new dwarf planet?\n\n@VRubinObs has revealed a new dwarf planet candidate that orbits our Sun beyond Pluto! And it may be among the largest and brightest objects discovered in this region of the Solar System: https://t.co/mPcVYVhvXZ https://t.co/d94196aMuT"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115197199059673425", "url": "https://x.com/deanwball/status/2115197199059673425", "text": "Did we find a new dwarf planet?\n\n@VRubinObs has revealed a new dwarf planet candidate that orbits our Sun beyond Pluto! And it may be among the largest and brightest objects discovered in this region of the Solar System: https://t.co/mPcVYVhvXZ https://t.co/d94196aMuT", "created_at": "2026-10-27T21:41:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SLAClab", "rt_author_name": "SLAC National Accelerator Laboratory", "likes": 682, "retweets": 96, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqO6aiXcAAq7Xi.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115527042628206901", "url": "https://x.com/deanwball/status/2115527042628206901", "text": "@deredleritt3r @InfiniteHexx Will run into 1a problems", "created_at": "2026-10-28T19:32:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deredleritt3r", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115505486074180070", "url": "https://x.com/deanwball/status/2115505486074180070", "text": "A patchwork of state laws, despite having become a bit of a meme, is genuinely a risk, is a reasonably common failure mode of American federalism, and is something worth being wary of, even if that wariness doesn’t translate to anything like “blanket opposition to all state legislation.”", "created_at": "2026-10-28T18:06:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 0, "media": [], "quoted": {"author": "CharlieBull0ck", "text": "Way back in the day (i.e. like late 2025-early 2026) I used to do a bit whenever I was on a panel with @neil_chilson or @KevinTFrazier or whoever where if they brought up the \"patchwork of state laws\" thing I would point out that the few existing state AI safety laws were very light touch and harmonized, and I would accuse the interlocutor of being a \"regulatory doomer\" because they were concerned about speculative future harms from state AI laws. Great bit, always killed. People love the \"regulatory doomer\" line. \n\nI don't think I can really do it any more, though, because it kind of seems like states really are about to pass a bunch of very different laws, some of which do in fact impose obligations on frontier AI developers.\n\nI'm not saying that's a bad thing, to be clear; I don't think the current level of regulation (essentially zero) is anywhere near defensible, and since Congress isn't ready to get serious about federal legislation states should and will get to work and start trying out different things. But it is funny to me that all of the doomers are being proven right at the same time."}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115857180431732929", "url": "https://x.com/deanwball/status/2115857180431732929", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T17:23:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 145, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115846411845816528", "url": "https://x.com/deanwball/status/2115846411845816528", "text": "@curiousben Why would a shortage of supply lower prices?", "created_at": "2026-10-29T16:41:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "curiousben", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115829165207556412", "url": "https://x.com/deanwball/status/2115829165207556412", "text": "I occasionally run into fortune 100 firms that have not adopting coding agents *at all.* adoption is still very very early.", "created_at": "2026-10-29T15:32:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 57, "retweets": 2, "media": [], "quoted": {"author": "hamandcheese", "text": "This is with only ~50% adoption by the Fortune 500 and with very low spend. Diffusion is still incredibly early."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115828862248706490", "url": "https://x.com/deanwball/status/2115828862248706490", "text": "This is with only ~50% adoption by the Fortune 500 and with very low spend. Diffusion is still incredibly early.", "created_at": "2026-10-29T15:31:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 32, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115828777020166550", "url": "https://x.com/deanwball/status/2115828777020166550", "text": "\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-29T15:31:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 77, "retweets": 4, "media": [], "quoted": {"author": "deredleritt3r", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\""}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115769223272370481", "url": "https://x.com/deanwball/status/2115769223272370481", "text": "Image credit @timhwang", "created_at": "2026-10-29T11:34:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:2  asked agents in separate VMs, created and managed by OpenAI’s sandboxing software on shared host machines, to exchange synthetic secrets without the use of network connections or shared writable files—something that our systems are meant to prevent. The agents found a way to communicate using the processor’s cache’", "created_at": "2026-10-24T12:58:32+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 3999, "retweets": 294, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114362662608138660", "url": "https://x.com/theobearman/status/2114362662608138660", "text": "completely insane\n\nOpenAI agents communicated via cache timing differences, without any shared files or network connection https://t.co/gfcodw8J1z", "created_at": "2026-10-25T14:25:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 7508, "retweets": 646, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVVwJ_BXIAAguI6.png"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114746489113039313", "url": "https://x.com/theobearman/status/2114746489113039313", "text": "But this method wasn't durable: fine-tuning on publicly available viral data fully restored the capability with under ~$80 of compute, even for the largest model.\n\nRead the blog: https://t.co/xAQT1IWaaT", "created_at": "2026-10-26T15:50:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "likes": 6, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114726796616761522", "url": "https://x.com/theobearman/status/2114726796616761522", "text": "Anthropic: \"The value of our own internal Claude usage at list prices has grown by over 250 times from January 2026 to September 2026, and in April 2026, this monthly value first exceeded our monthly personnel expense, excluding stock-based compensation.\"", "created_at": "2026-10-26T14:32:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114723599596577177", "url": "https://x.com/theobearman/status/2114723599596577177", "text": "Anthropic: \"If our investments in new products or business lines do not produce the long-term benefits we anticipate, our business, financial condition, results of operations, and prospects could be adversely affected. Certain of these initiatives, including our life sciences research program, which involves operating laboratory facilities, and our research in robotics and physical AI, require us to engage in activities outside our historical experience as a software and research organization, such as handling biological and chemical materials, operating laboratory and robotic equipment, and complying with biosafety, occupational health and safety, environmental, hazardous materials, and, potentially, preclinical and clinical research regulations. These activities expose us to categories of liability, including for workplace injury and environmental contamination, that differ from those associated with our core business, and any drug candidates or other discoveries resulting from these efforts would face the lengthy, costly, and uncertain development and regulatory pathways characteristic of the life sciences industry, and may never generate revenue.\"", "created_at": "2026-10-26T14:19:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114722297252602339", "url": "https://x.com/theobearman/status/2114722297252602339", "text": "Anthropic: \"we recently chose to delay pre-training a new frontier base model for more than a month to allow time to further enhance our security measures related to preventing model weight exfiltration and protecting our intellectual property.\"", "created_at": "2026-10-26T14:14:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114721104971677831", "url": "https://x.com/theobearman/status/2114721104971677831", "text": "Anthropic also made disclosures about the antitrust risks it faces based on efforts to address \"the responsible pace of AI development.\" https://t.co/YTj0m2053j", "created_at": "2026-10-26T14:09:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TimSchnabel", "rt_author_name": "Tim Schnabel", "likes": 2, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj7RCHWwAAQzMh.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj7SzpWcAAzz1n.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114720727798620313", "url": "https://x.com/theobearman/status/2114720727798620313", "text": "Anthropic: \"NASA engineers used Claude Code to plan and write navigation commands for the Mars Perseverance rover, resulting in the first AI-planned drive on Mars.\"", "created_at": "2026-10-26T14:08:05+00:00", "author_handle": "theobearman",
