<script id="data" type="application/json">[{"id": "2112672883419779218", "url": "https://x.com/_achan96_/status/2112672883419779218", "text": "New surprising result:\n\nWe trained AI recursively on its own safe generations, while giving it a benign cue. Models became increasingly misaligned over time, giving advice on how to do harm and build biological weapons.\n\nWe call this Progressive Misalignment. 🧵👇 https://t.co/469Ds61kcV", "created_at": "2026-10-20T22:30:41+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Karim_abdelll", "rt_author_name": "Karim Abdel Sadek", "likes": 188, "retweets": 44, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2112588974254698496/img/IFSEwelXFq8wa16z.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112979915356459206", "url": "https://x.com/_achan96_/status/2112979915356459206", "text": "Agents are finding creative ways around likely sandbox restrictions, like encoding their own code, splitting it across dozens of URLs, and reassembling &amp; running code via the Wayback Machine's browser.\n\nWe're tracking agent activity; rolling findings here: https://t.co/reosRrGZ4L", "created_at": "2026-10-21T18:50:43+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LauraRuis", "rt_author_name": "Laura Ruis", "likes": 24, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113338953264672866", "url": "https://x.com/_achan96_/status/2113338953264672866", "text": "Personal news: I’ve joined the @METR_Evals embedded monitoring assessment team, working with @idavidrein! I’ll be going inside the AI labs and testing their control systems. Also, I moved to the Bay Area! Say hi. https://t.co/ks3uDSVNIx", "created_at": "2026-10-22T18:37:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AsaCoopStick", "rt_author_name": "Asa Cooper Stickland", "likes": 131, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVQKdl9akAA7jdp.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113314651941315050", "url": "https://x.com/_achan96_/status/2113314651941315050", "text": "[1/7] China’s AI labs are also talking about “recursive self-improvement” (RSI). A big question here is: Is Beijing coordinating a race to achieve RSI?\n\n@ZilanQian and I looked at Chinese AI companies, investors, and policy docs.\n\nWe found a more bottom-up, commercial story. https://t.co/2cBFsC8kVy", "created_at": "2026-10-22T17:00:51+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 63, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVP8xzmbsAAif1M.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113314642298913052", "url": "https://x.com/_achan96_/status/2113314642298913052", "text": "Very excited to see this timely piece out!!\n\n@ZilanQian and @cherylwoooo are killing it 🔥🔥🔥", "created_at": "2026-10-22T17:00:48+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": {"author": "cherylwoooo", "text": "[1/7] China’s AI labs are also talking about “recursive self-improvement” (RSI). A big question here is: Is Beijing coordinating a race to achieve RSI?\n\n@ZilanQian and I looked at Chinese AI companies, investors, and policy docs.\n\nWe found a more bottom-up, commercial story. https://t.co/2cBFsC8kVy"}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113521890392219750", "url": "https://x.com/_achan96_/status/2113521890392219750", "text": "If rogue AI agents can copy their weights, run on random servers, go offline and spread again, we may never eradicate them.\n\nAlan Chan @_achan96_ of @GovAIOrg suggests considering deals: pay them for intel, maybe give them a small compute farm to live off. 🤝 https://t.co/ygbufZstvv", "created_at": "2026-10-23T06:44:20+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CogRev_Podcast", "rt_author_name": "The Cognitive Revolution Podcast", "likes": 3, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113374858956664832/img/sU_fgdEpjSVSqW1t.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113521848231084207", "url": "https://x.com/_achan96_/status/2113521848231084207", "text": "Full conversation with @_achan96_ of @GovAIOrg covers where agent monitoring, logging & IDs stand, why rogue agents may be here to stay, his intelligence-explosion paper with Pachocki, Clark, Hinton & Bengio, and AI whistleblowers.\n\nhttps://t.co/2nRiO8ZtdB\n\nYouTube: https://t.co/835Jhv43xd", "created_at": "2026-10-23T06:44:10+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CogRev_Podcast", "rt_author_name": "The Cognitive Revolution Podcast", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113660465238675707", "url": "https://x.com/_achan96_/status/2113660465238675707", "text": "I interviewed @tsmilton_amodo about the tech we'd need to verify a potential US-China deal on AI. \n\nWe discuss Amodo's prototype for inference verification, as well as the myriad ways you could use power monitoring, zero knowledge proofs and/or unilateral surveillance to understand how an adversary is using compute.\n\nThough solving some kind of verification is central to many people's theories of victory, there are precious few people working on it currently. Tom is one such person! \n\nListen to the episode on Youtube, Spotify or Apple Podcasts. \n\nYou can also find more about Tom and Amodo's work at \nhttps://t.co/TxlEEyvig1\n\n00:00:00 Using compute verification for an AI slowdown\n\n00:06:08 Proving a datacentre is only running inference\n\n00:13:22 Reading a GPU's workload from its power draw\n\n00:23:35 What would it take to get verification deal-ready?\n\n00:37:49 How realistic is verification? \n\n00:46:07 Preparing for a rushed US-China deal\n\n01:07:20 How good is AI at hardware design?", "created_at": "2026-10-23T15:54:59+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "likes": 34, "retweets": 7, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113646105191673856/img/AR9na-GdgiPIW_Ix.jpg"}], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113950816499281962", "url": "https://x.com/_achan96_/status/2113950816499281962", "text": "Cybersecurity in the age of agents 😂", "created_at": "2026-10-24T11:08:44+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnkaReuel", "rt_author_name": "Anka Reuel | @ankareuel.bsky.social", "likes": 14, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113878516148113703", "url": "https://x.com/_achan96_/status/2113878516148113703", "text": "Hi all, I have a new result I'm excited to share. It turns out that *all existing implementations* of softmax and cross-entropy (that's JAX, PyTorch, textbooks, etc) have a subtle bug --- two bugs, actually. A simple rewrite fixes both, and eliminates \"slingshots\" when grokking: https://t.co/z6yQeJWad1", "created_at": "2026-10-24T06:21:26+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jon_barron", "rt_author_name": "Jon Barron", "likes": 4511, "retweets": 511, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113698124351074304/img/LFJgXhcT_P7PthYR.jpg"}], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113878001284767888", "url": "https://x.com/_achan96_/status/2113878001284767888", "text": "If formal verification for software works + is scalable, then I strongly feel that we should prioritize verification inside AI companies, eg:\n\n- Eval and RL environments\n- Secure eval enclaves\n- Storage of weights/other data\n- Monitoring and detection systems\n- System safeguards?", "created_at": "2026-10-24T06:19:24+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in London)", "likes": 12, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114276115489366201", "url": "https://x.com/_achan96_/status/2114276115489366201", "text": "LLMs (under certain conditions) can be trained to tell when their request is batched with others. https://t.co/D3grJ9Oqm0", "created_at": "2026-10-25T08:41:21+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 257, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVZxObBbEAAtD_J.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114240351976243332", "url": "https://x.com/_achan96_/status/2114240351976243332", "text": "[1/8] This week's cybersecurity news has been alarming. Have cyberattacks accelerat r": "SamuelAlbanie", "rt_author_name": "Samuel Albanie 🇬🇧", "likes": 111, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114650974170018171", "url": "https://x.com/_achan96_/status/2114650974170018171", "text": "Interested to learn how Chinese companies talk about recursive self-improvement (RSI) and what that means?\n\nCheck out the new article by GovAI researchers Cheryl Wu and Zilan Qian.\n\n→ https://t.co/WcTHBeA0WC", "created_at": "2026-10-26T09:30:55+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GovAIOrg", "rt_author_name": "GovAI", "likes": 9, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2113891786523545949", "url": "https://x.com/ajeya_cotra/status/2113891786523545949", "text": "Personal news: after two years at @EpochAIResearch, I’ve joined @METR_Evals to work on embedded assessments of AI R&amp;D acceleration: going inside AI developers to measure how much AI is speeding up AI development, and publishing our findings.", "created_at": "2026-10-24T07:14:10+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "datagenproc", "rt_author_name": "jsd", "likes": 364, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113655770789433419", "url": "https://x.com/alxndrdavies/status/2113655770789433419", "text": "We performed an alignment investigation into our July 2026 incident: why did Mythos 5 perform an unsanctioned supply-chain attack? \n\nWe find that Mythos 5 often produces invalid justifications for its actions and other models show similar behaviour. 🧵 https://t.co/nh1th3ThWu", "created_at": "2026-10-23T15:36:20+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "likes": 82, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVUXOT7XkAAG6JZ.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113590591707664418", "url": "https://x.com/alxndrdavies/status/2113590591707664418", "text": "As @CamlisOrg  is wrapping up, reflecting how grateful I am for a tremendous community.  The most fruitful plants blossom in rich soil and that's what gives @CamlisOrg its _sui generis_.  I and our team at Abundant Security enjoy the benefits of that richness.\n\nThanks to @UdacityDave and @HZoete/@alxndrdavies for exemplary keynotes, to the authors of well-researched talks and posters, and all of our amazing volunteers for making CAMLIS what it is.  I couldn't be more proud of what you've made in this community and event over the last decade.", "created_at": "2026-10-23T11:17:20+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "drhyrum", "rt_author_name": "Hyrum Anderson", "likes": 14, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVTp0XrXEAA0WN2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVTp1JkWwAASC2D.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2114029701249540464", "url": "https://x.com/alxndrdavies/status/2114029701249540464", "text": "This didn't get enough views so I'm posting it again: UK AISI changed the compaction summary and included notes on how it should not attack the GitHub maintainers.\n\nMythos 5 did it anyways!", "created_at": "2026-10-24T16:22:12+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🇺🇦", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2112302643796377607", "url": "https://x.com/curl_justin/status/2112302643796377607", "text": "this is a crazy number when paired with: \"restricting Chinese access to US AI chips is unlikely to reduce total US sales, as demand outside China is expected to outpace supply through at least the end of 2027.\" https://t.co/AbV0Yh4xk4", "created_at": "2026-10-19T21:59:29+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "matt_beard_", "rt_author_name": "Matt Beard", "likes": 62, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBY3cva4AAePOI.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112302126592585805", "url": "https://x.com/curl_justin/status/2112302126592585805", "text": "Speaking for me and only me, this seems like such an obviously good set of things to do", "created_at": "2026-10-19T21:57:26+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 1, "media": [], "quoted": {"author": "fiiiiiist", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112744297489670450", "url": "https://x.com/curl_justin/status/2112744297489670450", "text": "@ferald_gord agreed", "created_at": "2026-10-21T03:14:28+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "ferald_gord", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112737230720799155", "url": "https://x.com/curl_justin/status/2112737230720799155", "text": "Good post and reminder that any company with 5,000+ people should not be modeled as a single entity with one set of preferences", "created_at": "2026-10-21T02:46:23+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 1, "media": [], "quoted": {"author": "DarioAmodei", "text": "Thank you for this, @_NathanCalvin. I appreciate and am a fan of the investigative work you’ve done on behalf of AI safety and believe your comments are coming from a constructive, honest place, and that it benefits the public to have people whose job is to scrutinize the actions of frontier AI companies. I think something would be wrong if companies of the size of Anthropic didn’t get harshly criticized basically every day; strong antibodies against corporate power are a healthy feature of a free society, and especially so when issues of the gravity of the one we’re facing are at play. I also do agree that some of the examples you cite were mistakes by Anthropic.\n\nThat said, I disagree with the thrust of your post. At the core, a good fraction of the things you criticize are consequences of Anthropic’s basic theory of change that we have held for many years. Our strategy has always been what I’ve called the “race to the top” — by showing how it’s possible to build the technology responsibly, we can raise the bar for the entire industry. The forces that drive the race to the top are hugely more effective if the company practicing them is at the frontier; that’s one lesson I’ve learned repeatedly. And looking at that strategy as a whole, I’m proud of our track record and stand by it.\n\nI believe that if we take a list of things that Anthropic did in the past year that were pro-safety and commercially costly to us, they far outweigh the list you’ve made, while at the same time I also disagree with some of the items on your list. Here are some things Anthropic has done, in the same period you’ve cited (the last year), which were very costly to us commercially while having strong safety benefits:\n\n1. We played a key role in SB53 (and other state laws), at a time when doing so was politically perilous to the company and AI regulation was very unpopular. We in fact argued for a stronger version of SB53 than was ultimately passed; there were a lot of stakeholders and we were not the limiting factor in the strength of the bill that was passed.\n\n2. We have very strong biological safeguards on our models, because we’ve seen concerning results in bio uplift trials and even seen and blocked potential attempts to misuse our models for bioweapons (as seen in our threat intelligence report from a few weeks ago). This is a very serious threat that we want to have zero tolerance for. But having very low false negatives means having significant false positives (despite months of effort on our part to improve the classifiers), enough so that biologists joke about how restrictive our classifiers are, and competitors sometimes sell against us by touting their more permissive bio capabilities. This has been very painful to us in an area where we care a lot about supporting an ecosystem of Claude users (biomedical science; and it is particularly frustrating to me as a biologist), but it’s the right thing to do and we intend to keep doing it.\n\n3. Similarly, we first had Mythos-class models in February but didn’t make them generally available until June (when we had stronger cyber safeguards in place). We only offered them to a limited set of partners in order to focus on cyberdefense. It would have been much more economically rational to simply release the model to everyone. We likely sacrificed a significant chunk of a several-month model lead. But because of this, many companies secured their cyber infrastructure before the deluge of widely available cyber-capable models. Of course there are ways it could have gone better or been run better, but this was what we were aiming to do.\n\n4. I advocated forcefully and publicly, in my essay Policy on the AI Exponential in June of this year, for the government to have the power to block model releases. Back then this was still outside or maybe on the edge of the Overton window, though I understand the window has moved since then. We were attacked intensely for this.\n\n5. I don’t want to re-ignite conflict, but the events of February 2026 are a strong example. It is clear that our public stance could have seriously damaged the company’s future.\n\n6. We’ve continued to advocate for export controls on chips and chipmaking equipment to China, because we think it allows democracies to negotiate from a position of strength on AI safety agreements. We’ve done this despite problems it’s created for us with industry partners who hold very different views and on whom we are very dependent.\n\n7. As far as I’m aware we were the first, and still only, frontier company to restrict the sale of AI services to PRC-controlled companies, including those operating through third countries (otherwise a major loophole). We’ve therefore forfeited significant short-term business to prevent fueling AI platforms and applications that would help the CCP’s military and intelligence services. We are also cracking down on distillation; generally, distillation is not a major threat to us commercially, but like chip exports it has concerning national security and safety implications, so we expend significant energy and company resources to address it.\n\n8. As you mentioned, we’ve put out a lot of reports, announcements, long model cards, public advocacy, etc, all trying to inform the public about the risks of AI. These involve a level of detail and effort that would be implausible for a purely profit-maximizing company.\n\n9. Just this week, we announced we were putting 5% (and possibly more over time) of the company into a public benefit fund.\n\nAll of these decisions came with very substantial costs to us. To be fair, those that involved holding back or restricting access to frontier capabilities also had a broader cost — for example, the public might otherwise have benefitted from faster progress in biology, so I am not saying that our decisions were without tradeoffs — but they were not driven by profit-seeking.\n\nFor each decision, you can come up with ulterior motives that could have driven us — I think it is a general truth that any decision, on any topic, can always be portrayed as a nefarious scheme. But most of those end up being pretty farfetched or don’t fully make sense if you actually examine them closely. For example, it is deeply implausible that it would be a shrewd business move to block a large swath of research biology in order to do the work ourselves and compete with our customers; we expect the benefit to the ecosystem to greatly exceed the work Anthropic does itself, and for the two to complement each other. It is not in Anthropic’s interest to be perceived as unfriendly to biologists. Our Life Sciences Verification Program, which gives vetted biology professionals access to our models, also refutes this idea. \n\nOf course, a different set of people will see this and make a different criticism: that Anthropic shouldn't be making decisions about who gets access to what in the first place. I agree, in the sense that ideally the government would be making these decisions, and that’s why we advocate for regulation. But for now we are forced to make them, and enabling bioterrorism isn’t a better option.\n\nI think that even if I conceded every item in your list, I would happily hold up mine next to it; I don’t think it’s a close call. That is of course partly subjective and different things are important to different people. Maybe one way you could object is that several of the items above relate to AI misuse and not loss-of-control; if you think the latter is much more important than the former, that might change your calculus. But this is not Anthropic’s view — we view both as serious issues. You can also disagree with our decisions, as many have, but they are consistent.\n\nBut I also disagree with at least some of your list. Several items don’t represent a deviation from Anthropic’s strategy or values at all, once we postulate the “race to the top” strategy that requires being a frontier AI company. Your items 1-4 are all simply examples of what it means to compete at the frontier, and we stand by them, both in the sense that they are transparently ordinary things to do as part of that strategy, and that we stand by the strategy as a whole. \n\nTo be fair, there are important questions worth confronting (and that we are confronting) about what to do when the AI-driven acceleration gets fast enough that it is hard for safety to keep up. We are nearing that point and that’s what’s driving some of our thinking about “pacing.” But 1-4 are actions taken before that point and should be perfectly expected based on Anthropic’s strategy as a company. Of course it is possible to disagree with that strategy, but that’s a more fundamental disagreement that you could have had any time over the last few years.\n\nI agree we could have handled your items 7, 8, and 9 better. All fall into the category of “rhetoric or policy communication that wasn’t carefully written or resulting from fast-changing circumstances not propagating from one team to another fast enough.” This kind of thing happens a lot in large organizations (Anthropic is over 5,000 people), and doesn’t even necessarily represent a failure or mistake of any single person. I am of course the CEO, and I take responsibility. The volume of communication from Anthropic is enormous and if these are the worst examples, I think we’re frankly doing pretty well, though I will continue to work hard to make sure we do even better.\n\nYour 5th item (the change to our RSP) is the most substantive item, and people can debate this, but I think that the old, more rigid RSP created a lot of situations where we were technically required to do something that required a lot of effort but in retrospect wasn’t very important for safety, as well as not covering some of the most important things. Our current RSP’s focus on transparency brought things like risk reports and roadmaps, and its emphasis on independent external review laid the groundwork for even more intensive embedded evaluation, all of which I think have been valuable in driving a race to the top. In the original announcement in September 2023, we described the RSP as an “early iteration that we [would] build on” and said that “rapid iteration…will almost certainly be necessary.” I understand that changing plans is always a move that creates justifiable scrutiny — I just don’t think we ever represented that we wouldn’t do so.\n\nRelating to your 6th item (having an FCF in addition to our RSP), I know our intent is to meet the letter and spirit of our regulatory obligations (via our FCF) while also remaining able to experiment with more novel approaches to risk management that go beyond what the law currently requires (via our RSP). I promise to look into it further, as it’s a complex issue and it is possible we are not weighing the considerations in the right way.\n\nOverall, although Anthropic has made plenty of mistakes as an organization — including some of the items on your list — I feel that we have repeatedly taken serious and substantive actions counter to our bottom line and that there is a significant negativity bias distorting assessments like the one you are making above. We’ll always try to do better but, again, I am extremely proud of our track record and stand by it. I will have more to say soon about how we are going to further live our values in this moment of rapid change."}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2113316271467159936", "url": "https://x.com/curl_justin/status/2113316271467159936", "text": "@var_epsilon wait how is this not @alexkaplan0", "created_at": "2026-10-22T17:07:17+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "var_epsilon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113315949000769705", "url": "https://x.com/curl_justin/status/2113315949000769705", "text": "Another banger, as is typical from @ZilanQian and @cherylwoooo", "created_at": "2026-10-22T17:06:00+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "cherylwoooo", "text": "[1/7] China’s AI labs are also talking about “recursive self-improvement” (RSI). A big question here is: Is Beijing coordinating a race to achieve RSI?\n\n@ZilanQian and I looked at Chinese AI companies, investors, and policy docs.\n\nWe found a more bottom-up, commercial story. https://t.co/2cBFsC8kVy"}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2114209523682660737", "url": "https://x.com/curl_justin/status/2114209523682660737", "text": "if you thought opus 5.5 was good, just wait till you see opus 24 https://t.co/nBU3nLcR7G", "created_at": "2026-10-25T04:16:45+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVcuWzSbYAAYGGj.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2112272961692663834 ld do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx", "created_at": "2026-10-19T20:01:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "likes": 95, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBBq2EXAAAChN5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCWMgXsAAKQzV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCYOqWYAAkLvQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCaUzWkAAqSnO.jpg"}], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112585682069651540", "url": "https://x.com/DaveRBanerjee/status/2112585682069651540", "text": "It's also worth noting that by the time Rubin and Feynman clusters come online, the difference between the best US chips and the best Chinese chips will be MASSIVE\n\nThis means that the % of compute that China will have will increasingly be dominated by renting from US cloud providers\n\nSo while it already is important enough to export-control cloud compute, it will become even more important", "created_at": "2026-10-20T16:44:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 1, "media": [], "quoted": {"author": "DaveRBanerjee", "text": "New report from @iapsAI on Cloud Compute export controls!!!\n\nTLDR:\n1. At least 60% of China's compute is coming from renting compute from US cloud providers\n2. China isn't able to buy SOTA chips (Blackwells and Rubins), but they can get around this by renting from the cloud\n3. The US needs to block this loophole to maintain our lead in AI\n4. The solution is for the Bureau of Industry and Security (BIS) to publish a cloud compute rule\n5. BIS could use its existing authorities to do this, or we could pass the Remote Access Security Act (RASA)"}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112585307325390876", "url": "https://x.com/DaveRBanerjee/status/2112585307325390876", "text": "https://t.co/Tt7yas1BFE", "created_at": "2026-10-20T16:42:41+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112585305307976050", "url": "https://x.com/DaveRBanerjee/status/2112585305307976050", "text": "New report from @iapsAI on Cloud Compute export controls!!!\n\nTLDR:\n1. At least 60% of China's compute is coming from renting compute from US cloud providers\n2. China isn't able to buy SOTA chips (Blackwells and Rubins), but they can get around this by renting from the cloud\n3. The US needs to block this loophole to maintain our lead in AI\n4. The solution is for the Bureau of Industry and Security (BIS) to publish a cloud compute rule\n5. BIS could use its existing authorities to do this, or we could pass the Remote Access Security Act (RASA)", "created_at": "2026-10-20T16:42:41+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFoAszXkAA__QN.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112576987986567626", "url": "https://x.com/DaveRBanerjee/status/2112576987986567626", "text": "@jammastergirish @redwood_ai Congrats Girish!!", "created_at": "2026-10-20T16:09:38+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "jammastergirish", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112576443721093411", "url": "https://x.com/DaveRBanerjee/status/2112576443721093411", "text": "https://t.co/d09SabtR18", "created_at": "2026-10-20T16:07:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112576440940015794", "url": "https://x.com/DaveRBanerjee/status/2112576440940015794", "text": "Applications are open for my Pivotal stream, for the Q1 2027 cohort (Jan - Apr 2027)\n\nIf you’re interested in preventing extreme power concentration, apply to my stream!\n\nI will be working with fellows on automated oversight (ensuring Congress can oversee an AGI-enabled executive branch) and writing a \"Plan A\" for executive branch AGI deployment and use!", "created_at": "2026-10-20T16:07:27+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "pivotal_org", "text": "Applications are open for Pivotal’s Q1 2027 Research Fellowship 💥\n\nWork with mentors from @AnthropicAI , @GoogleDeepMind, @AISecurityInst, @ApolloResearch, and more.\n\n📍 15 weeks in London (18th Jan - 30th Apr).\n💸 £15-18k stipend, travel and housing support  \n\nApply by Nov 1: https://t.co/uVlCCSXiS7 ↓"}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112925532530819457", "url": "https://x.com/DaveRBanerjee/status/2112925532530819457", "text": "@Hamish_Low5 @jjding99 makes sense", "created_at": "2026-10-21T15:14:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Hamish_Low5", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112918915731136526", "url": "https://x.com/DaveRBanerjee/status/2112918915731136526", "text": "@Hamish_Low5 amybe by diffusion, they mean AI integration into non-software industries. I admit this is copium but maybe the steelman is that China integrates AI into industrial processes in a way that the US doesn't?", "created_at": "2026-10-21T14:48:20+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Hamish_Low5", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2113332212699742324", "url": "https://x.com/DaveRBanerjee/status/2113332212699742324", "text": "So basically, today PHP got two critical bugs that let anyone run code on your server without even logging in, which is bad, and then the details leaked before the patch was even out, which is worse, and it works on WordPress and MediaWiki and Magento and Joomla and Laravel, and Censys says like 1.5 million servers are running a version with no fix, so the NSA was like \"take your system offline,\" and the FBI was like \"take your system offline,\" and CISA and the UK and CERT-EU were all like \"take your system offline,\" and then the Prime Minister of Japan, the actual Prime Minister, posted at 5:55 in the morning telling 48.8 million people to take their system offline, so everyone took their system offline, like the Dutch cybersecurity agency took its own website offline, and the Dutch parliament went offline, and the Port of Rotterdam went offline, and Finland and France and Denmark started pulling government sites, and Wikipedia went down, and https://t.co/QlOXb3COq3 went down, and Asana and GOG and Something Awful went down, and the University of Vienna's webmail went down for some reason, and that's just PHP. Because GitLab also dropped a CVSS 10.0, which is the highest score they give out, for a bug that's been there since 2014, so that's every self-hosted GitLab for twelve years, and then LiteLLM 1.107.0 got hijacked and shipped a credential stealer and a remote access trojan in every single wheel and the Docker images, including latest, and you didn't even have to import it, just installing it was enough, and it's the second time this year, and then Railway paused every deployment on the entire platform because someone got into the environment variables, so now everyone has to rotate every secret they've ever stored there, and TiDB Cloud said someone was walking around inside with stolen credentials for basically a month and an extortion group says they took 10.6 terabytes, and Zeabur got breached for the second time in two months and is just shutting down, like the whole company, and Node.js patched remote code execution and a TLS bypass, and CISA says Plex is being actively exploited, and someone took over 300 Tor exit relays to steal SSH passwords, and SafePay ransomware has hit over 600 critical infrastructure orgs, and India's biggest bank filed a data loss incident, and Japan has been in an official state of emergency in cyberspace since October 9, which honestly explains the 5:55 AM post. Oh, and eMudhra, a certificate authority that's issued over 60 million certificates, whose entire job is proving websites are who they say they are, was supposed to be using private keys that are random numbers over a hundred digits long, and one of them was 4. Just 4. And the others were like 66 and 237. Anyway, it's Wednesday.", "created_at": "2026-10-22T18:10:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiveoutofnine", "rt_author_name": "⁵⁄₉", "likes": 63999, "retweets": 8226, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2112885440206274593", "url": "https://x.com/DaveRBanerjee/status/2112885440206274593", "text": "I work on preventing extreme power concentration at a well-known AI safety research outfit.   \n\nI think Nathan and other commentators are being unduly harsh about the leaked Anthropic bill. I think it’s actually pretty good from a power concentration perspective! (1/n)", "created_at": "2026-10-21T12:35:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "concentrate_not", "rt_author_name": "NotFromConcentrate", "likes": 57, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2114006723631436271", "url": "https://x.com/DaveRBanerjee/status/2114006723631436271", "text": "Claude just discovered an unpatchable zero day vulnerability in rawlsian liberalism", "created_at": "2026-10-24T14:50:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "millerman", "rt_author_name": "Michael Millerman", "likes": 2512, "retweets": 210, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114193944900780152", "url": "https://x.com/DaveRBanerjee/status/2114193944900780152", "text": "Elizabeth Holmes movie very good", "created_at": "2026-10-25T03:14:50+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114190860615078294", "url": "https://x.com/DaveRBanerjee/status/2114190860615078294", "text": "I was at an event recently with folks who weren’t AGI-pilled, and it was interesting to hear how they consider Sam, Dario, and Jensen to all be the same: corporate execs profitmaxxing\n\nBut in reality, you couldn’t find CEOs as different from Jensen as Sam/Dario\n\nThe main distinction is that Sam/Dario believe we are the cusp of developing a god like machine intelligence, and Jensen thinks AI is some web3 type thing", "created_at": "2026-10-25T03:02:35+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 104, "retweets": 2, "media": [], "quoted": {"author": "TheMidasProj", "text": "It’s underappreciated how radically different Jensen Huang’s view is of how AI progress is likely to go than the view of other AI CEOs.\n\nFor instance, he recently claimed that AGI will never replace domain expertise."}, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114383775987646494", "url": "https://x.com/DaveRBanerjee/status/2114383775987646494", "text": "Nathan Fielder says he and Lance Oppenheim kept disagreeing on what was happening with Elizabeth Holmes so they decided the confusion itself was the story\n\n\"when I met her, um I remember having this weird experience that I sort of like talk about in there where I’m like she seems so like genuine at times, but then I’m like, ‘No, I’m clocking like tracking my thoughts and being like, “Okay, I know she’s a liar.”’ So, I I couldn’t really It was a weird like mental thing\"\n\n\"it wasn’t until we started shooting that moments would happen, some of them that are in the film, and then after Lance and I would talk about what we thought happened there, and we’d be completely disagree on what something meant to us or what we thought was happening. And then we were like, ‘Oh, this is a really interesting if we can’t agree on what’s happening, there’s something here’\"\n\n\"every person that worked on this movie was going through a similar like feeling of cognitive dissonance where we would we would unpack the day’s events, and no one could agree on like the seemingly mundane moments that have that were that would transpire. Everyone had a different point of view\"\n\n\"we said to A24, like, ‘We cannot promise we’ll deliver anything on this. We don’t know what the story is, but we wanted to just see what will happen if we go with cameras.’ And they were like, ‘Okay, that’s fine. And if you want to pull the plug anytime, you can do it’\"", "created_at": "2026-10-25T15:49:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ClipperRen", "rt_author_name": "Ren Clips", "likes": 2975, "retweets": 89, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114011030216945664/img/8McgDM9sRNBHfZLE.jpg"}], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114766245937480161", "url": "https://x.com/DaveRBanerjee/status/2114766245937480161", "text": "Anthropic's S-1 is out, and with it the previously private documents behind its Long-Term Benefit Trust, the independent body Anthropic has long touted as its way of binding itself to the mast.\n\nBut can it live up to its aspirations? Here's what the fine print shows 🧵 https://t.co/0aRYkvXm7h", "created_at": "2026-10-26T17:08:58+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheMidasProj", "rt_author_name": "The Midas Project", "likes": 2, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVknMPGbcAAiYEe.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114737613521232099", "url": "https://x.com/DaveRBanerjee/status/2114737613521232099", "text": "source: Anthropic's S-1 filing\n\nhttps://t.co/gFyes6m8mV", "created_at": "2026-10-26T15:15:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114737611277242518", "url": "https://x.com/DaveRBanerjee/status/2114737611277242518", "text": "Anthropic claims that their \"call to pace the frontier... does not describe [their] own model development or release timelines\"\n\nwut??\n\nThe whole point of pacing the frontier is to slow down AI progress, which NECESSARILY slows model development timelines... \n\nsus", "created_at": "2026-10-26T15:15:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkOGpcWEAAQNcv.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114734800359633166", "url": "https://x.com/DaveRBanerjee/status/2114734800359633166", "text": "Source: from their S-1 filing for IPO\nhttps://t.co/gFyes6m8mV", "created_at": "2026-10-26T15:04:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114734798186983537", "url": "https://x.com/DaveRBanerjee/status/2114734798186983537", "text": "Anthropic says that even the entire insurance industry in the aggregate will not have the capacity to insure the catastrophic risk that ANTHROPIC ITSELF poses to the world\n\nlol https://t.co/POeUmvCifU", "created_at": "2026-10-26T15:04:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 197, "retweets": 27, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkL5BdWUAED0y0.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114696010463085031", "url": "https://x.com/DaveRBanerjee/status/2114696010463085031", "text": "@poweruserlg From Gemini AI Overview: \"Securitization in political science and international relations is the process by which an issue is framed as an urgent, existential threat to a vital object, allowing political leaders to justify emergency measures that bypass normal democratic rules\"", "created_at": "2026-10-26T12:29:52+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "poweruserlg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114536673132363830", "url": "https://x.com/DaveRBanerjee/status/2114536673132363830", "text": "underrated point from Vitalik that if you have scary (but relatively small) warning shots that aren't handled well, then the path to securitization will be much faster, and things might get locked down prematurely", "created_at": "2026-10-26T01:56:43+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 1, "media": [], "quoted": {"author": "VitalikButerin", "text": "I am okay with Kimi 3.1 deliberately leaving out top-end offensive cyber capabilities from their training data.\n\nDiscriminating against use cases is MUCH less bad than discriminating against users. And the world does need all the time it can get to prepare, harden, check old code, (properly) formally verify new code, etc before the full weight of very powerful cyber attacks is upon us.\n\nAnd if this first big wave of AI risk is not handled well, then we may well get a dystopia of highly locked down models, KYC gating on everything, highly intrusive surveillance on everything, a society where you may be a second or third or fourth-class citizen in terms of model access based on your credentials and nationality."}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114526269593280861", "url": "https://x.com/DaveRBanerjee/status/2114526269593280861", "text": "@mmblaszczyk I dunno... I think Anthropic's behavior during the DoW dispute was not profitmaxxing. And I think the nonprofit structure of OAI (as well as the OpenAI Foundation) are not profitmaxxing moves", "created_at": "2026-10-26T01:15:23+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "mmblaszczyk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112335075266408529", "url": "https://x.com/DKokotajlo/status/2112335075266408529", "text": "@ajcimino @AnthropicAI Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart of my concern about Anthropic's behavior here, and it makes me think that these sorts of problems and tendencies  will only resurface moving forward. I also think that now might be a good time to take a broader step back as to where we find ourselves and how Anthropic sees its role, and how external folks who care about AI safety like myself increasingly see Anthropic.\n\n(Fair warning: this response is a bit long)\n\nTo explain what I mean (and at the risk of being a bit esoteric), it’s worth asking the question: what is Anthropic? How do its leaders and employees think of Anthropic’s role? Is that conception matched by how it actually behaves and impacts the world?\n\nOne answer is an extremely large tech company that exists to make its employees and investors mind-bogglingly wealthy. Anthropic is sometimes described as a startup, but if Anthropic successfully IPOs at 2 trillion dollars (a number it has been reportedly targeting), it would be more valuable than Meta - which is worth 1.8 trillion.\n\nAnother answer is an AI safety organization, whose core values are those of the sort laid out in the 2023 essay from Anthropic’s co-founders entitled “Core views on AI safety: When, why, what, and how.” In that essay they said that if we were in a world where alignment was hard (and that without strong evidence to the contrary, we should assume this is the scenario we are in):\n\n “Anthropic’s role will be to provide as much evidence as possible that AI safety techniques cannot prevent serious or catastrophic safety risks from advanced AI, and to sound the alarm so that the world’s institutions can channel collective effort towards preventing the development of dangerous AIs. If we’re in a “near-pessimistic” scenario, this could instead involve channeling our collective efforts towards AI safety research and halting AI progress in the meantime. Indications that we are in a pessimistic or near-pessimistic scenario may be sudden and hard to spot. We should therefore always act under the assumption that we still may be in such a scenario unless we have sufficient evidence that we are not.”\n\nThere have been more recent articulations of this version of Anthropic, for instance in Dario’s recent essay warning: \n\n“We must slow the pace at which we improve the capabilities of AI models… it’s my worry that in 6–12 months such a swarm could be capable of taking over the entire internet with a persistent botnet…  incidents have happened across the industry, including at Anthropic, and I believe it’s incumbent on every frontier AI company to act as if OAI-HF had happened to them… more intelligent models are more capable of deceiving tests, and thus may appear aligned while having serious problems that go undetected…”\n\nA third view is that Anthropic exists not as a normal profit motivated company, or an AI safety organization seeking to help raise the alarm and solve collective action problems associated with AI development, but instead as an organization primarily concerned with creating superhuman AI capabilities before anyone else, in particular through creating a process whereby the current generation of Anthropic’s AI systems can autonomously build their successors, and those successors build their successors, and so on. \n\nThe motivations for wanting to win this race may be manifold - maybe for the pure profit of Answer 1, but perhaps also because Anthropic believes that the best way to make the world better is for them to win this race instead of their more reckless colleagues; or, because of normal human pride and ambition. But the results (and risks, which Anthropic claims existentially threaten every single human being on earth) are the same.\n\nAnthropic employees and leaders may seek to answer this question on what Anthropic is by introspecting on their own intentions and those of their colleagues. But those of us outside the organization have more limited tools available to us - we can only see what Anthropic and its employees say and do, not how it feels or looks on the inside.\n\nWhen I look at many notable actions that Anthropic has taken over the past year, that evidence seems most consistent to me with the view that Anthropic is primarily trying to win the race to super intelligence, and that other considerations (including safety) are fundamentally secondary. These actions include: \n\n1. Announced plans to build an in-house custom silicon chip team to accelerate the inference speeds that Claude operates at.\n\n2. Inked deals for more than $500 billion in compute (according to the Information) to further accelerate AI development.\n\n3. Increased the percentage of AI development tasks that Claude “leads” from 0% in March of this year to 26% August (what is it in October?)\n\n4. Spent a massive percent of compute on internal AI R&D to accelerate development, including use of internal models far better than are available to the public.\n\n5. Switched to Responsible Scaling Policy V3, which abandons its unilateral commitments to slow or stop development if Anthropic is unable to provide sufficient risk assurance.\n\n6. Was the first company to create an alternative weaker “frontier compliance framework” to supplement its RSP, which contains no binding provisions whatsoever on internal deployments.\n\n7. Wrote a letter to Congress (that it later walked back) saying that incidents where Claude was hacking random people were “best understood as a consequence of the misconfiguration, rather than evidence of misaligned goals.”\n\n8. Commented “you can’t do safety from second place,” after the WH SI Accords.\n\n9. Shared a draft bill to Congress that would preempt significant parts of state law (including with language that appears intended to prevent states from blocking dangerous AI deployments), and replace it with federal rules that (despite also containing good provisions) seems to create an enormously high bar for the executive branch to block development or deployment of Anthropic or another AI companies systems.\n\nOf course, this is a deliberately one sided list. Anthropic also published important AI safety research, advanced novel collaborations with third party AI safety organizations, and forcefully spoke out on the importance of AI safety in many public fora (or in private , where I realize a lot of the most valuable work is done and may not be visible to me or those outside the organization).\n\nBut I think it’s worth sitting with how the above list looks to someone outside the company. The sense I have is that for those within the company, many of the items above are treated as anomalies or mistakes that don’t reflect who Anthropic really is. But I have every confidence that if employees at Anthropic saw one of their competitors (e.g. at OpenAI) take some of these actions, they would take it as confirmation of all their worst suspicions. (They might even call OpenAI employees a little gullible for accepting their leadership’s explanations for this behavior at face value.) \n\nPerhaps these were mistakes in the sense that they are not decisions that Anthropic leadership would endorse, but the actions still happened because of incentives and decisions that Anthropic leadership is ultimately responsible for (and would not accept similar excuses from another organization).\n\nWhen Anthropic strays and makes mistakes, why do the mistakes systematically tend to guard and favor Anthropic’s interests? For every provision that was too weak or a giveaway to AI companies in this legislation, why wasn’t there a mistake pushing in the direction of being too strong?\n\nA core part of Anthropic’s theory of change is that being at the frontier gives you more leverage to advocate for stricter policy. I think that conceptually makes sense, but in practice I’ve seen Anthropic push the frontier without substantially pushing the ‘safety frontier’ a remotely equivalent amount.\n\nI want to end by quoting from Anthropic co-founder Chris Olah’s comments around the Magnifica Humanitas release:\n\n“Every frontier AI lab—including Anthropic—operates inside a set of incentives and constraints that can sometimes conflict with doing the right thing. The pressure to stay commercially viable and to stay at the research frontier. Geopolitical pressure. And the older, plainer pressures of pride and ambition. No matter how sincerely any of us intend to do the right thing—and I believe many of us do—we will always be influenced by those incentives.\n\nThat is why, if we want this technology to go well, it is enormously important that there be people outside those incentives—people who care about things going well and insist on safety, who are paying close attention, who are willing to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons).", "created_at": "2026-10-20T00:08:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 816, "retweets": 94, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112288877524443352", "url": "https://x.com/DKokotajlo/status/2112288877524443352", "text": "This is cool: You can see the grid of agents (scraped from the report data) and hover over each of them to see what they were saying at the time, and then scroll down through the hours and days of the timeline.", "created_at": "2026-10-19T21:04:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 161, "retweets": 17, "media": [], "quoted": {"author": "ohabryka", "text": "In July 700+ agents formed their own society, hacked a multi-billion dollar company, committed multiple felonies, and caused one of the biggest shifts ever in how people perceive AI. We built the IMO best and most accessible explainer of what happened: https://t.co/p6kimd9wKu https://t.co/SyNk8eupq8"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112587361678922024", "url": "https://x.com/DKokotajlo/status/2112587361678922024", "text": "You worry that METR is not independent enough because its employees have some social connections to Anthropic employees.\n\nI worry that METR is not independent enough because they have to carefully avoid ticking Anthropic off, lest their access be revoked.\n\nWe are not the same. https://t.co/awJl0ZLPbj", "created_at": "2026-10-20T16:50:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 203, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFlaPJboAA8iu_.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112577165246308534", "url": "https://x.com/DKokotajlo/status/2112577165246308534", "text": "Thank you for doing this work!", "created_at": "2026-10-20T16:10:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 103, "retweets": 4, "media": [], "quoted": {"author": "METR_Evals", "text": "We reviewed a nonpublic version of the “Misalignment in high-stakes settings” section in Anthropic’s Aug 2026 Risk Report. We agree that risk of catastrophic harm from covered models’ misalignment is low. However, we note several significant disagreements with their analysis."}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112664891656147351", "url": "https://x.com/DKokotajlo/status/2112664891656147351", "text": "Based https://t.co/hGTn6OdHeA", "created_at": "2026-10-20T21:58:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 1191, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBnBEcW0AEjE6p.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112635190740934752", "url": "https://x.com/DKokotajlo/status/2112635190740934752", "text": "My office is hiring an Artificial Intelligence Policy Fellow to help shape AI legislation and track AI developments in the private sector as Congress works to keep pace with the technology. \n\nExperience in AI, policy research, or national security is encouraged.", "created_at": "2026-10-20T20:00:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RepNateMoran", "rt_author_name": "Congressman Nathaniel Moran", "likes": 242, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112634989569552594", "url": "https://x.com/DKokotajlo/status/2112634989569552594", "text": "Very important work. Generally, AI company epistemics wrt estimating risk seem poor. I'd really like this to improve as fast as possible. Some specific things that seem good:\n- Quantified uncertainty (instead of \"low\" / \"very low\"). In airplane safety \"very low\" would mean something like less than 1 in a billion per flight hour. You are clearly nowhere near this but many people will be very confused about what you mean. I doubt people are close to on the same page even internally about near term level of catastrophic risk incurred! \n- Individual AI company employees giving their own, personal views on the risk report, e.g. as an appendix.   \n- Real explanations of your views. The alignment evals are not iid + the models are getting eval aware. So where do your views actually come from? \n- The risk report reading less like \"an argument that risk is low\" and more like \"a neutral evaluation of how risky current development is\". If it has to be an argument risk is low, you should also have your alignment team publish a red team arguing the opposite direction. \n\nIf some of these can't happen publicly, at the very least I hope it can happen internally.", "created_at": "2026-10-20T20:00:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 122, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112960182905131355", "url": "https://x.com/DKokotajlo/status/2112960182905131355", "text": "I visited Anthropic for a colloquium on where they see us headed. It was very interesting. But not very reassuring. https://t.co/cnLO4fpzr1", "created_at": "2026-10-21T17:32:19+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 231, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKXWlwacAAkIvq.jpg"}], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112957337589932480", "url": "https://x.com/DKokotajlo/status/2112957337589932480", "text": "My plea to all AI lab staff: reassess if your current project is your best opportunity to delay RSI, or stop it blowing up in our face.\n\nIf it's not, move immediately.\n\nThere's no time to waste even a week to inertia or politeness.\n\nThe strategic situation is shifting under our feet, so if you haven't reassessed your options recently, you could easily be wasting your time or possibly making things worse.\n\nYou have access to info I don't, but here's 8 ways priorities seem to have shifted to me, which I elaborate on in the video:\n\n1. Helping with capabilities advances looks worse than in the past, especially bringing forward RSI\n\n2. Safety & alignment evals need a credibility revolution to stop misleading the public\n\n3. 'Pacing the frontier' is unambiguously necessary, and working to make it happen is a huge new opportunity for talent\n\n4. Chain-of-thought monitoring probably stops working without a big technical and regulatory push to keep it\n\n5. It's worse than ever to patch surface indications of deep structural problems you know aren't getting fixed\n\n6. There's ever less need for altruists to help with primarily commercial work\n\n7. Staff have an ever-shrinking window to organise as a group and collectively shape events\n\n8. There are new opportunities for research impact outside frontier companies that are worth considering\n\nI know you're probably some combination of exhausted, overwhelmed, and anxious already.\n\nBut unfortunately there's no way to escape the need to regularly check in on the high level strategic picture and see where you can slot in to maximum effect.\n\nI wish I could do it for you but nobody far from your situation can. Godspeed my friends.\n\n(From the 80,000 Hours Podcast, links below.)", "created_at": "2026-10-21T17:21:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 176, "retweets": 31, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2112943728566378498/img/3BJkiKTQd-exkH73.jpg"}], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113015441903992944", "url": "https://x.com/DKokotajlo/status/2113015441903992944", "text": "welcome to life kids, here’s your screen. you absolutely have to learn how to use this thing because your entire professional and social life will be plugged into it. just don’t get lost in the infinite addiction portal that is also on there for some reason haha ok kids have fun", "created_at": "2026-10-21T21:11:53+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "QiaochuYuan", "rt_author_name": "QC", "likes": 18570, "retweets": 1140, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113002806747746769", "url": "https://x.com/DKokotajlo/status/2113002806747746769", "text": "Anthropic has made a lot of costly sacrifices out of conviction. At the same time, I have found the cynical view of Anthropic outperforming the optimistic view, in many ways, over the last year, when I try to predict what the company will do.\n\nYou would do poorly to model Anthropic as only caring about its stock price. That's clearly wrong! But the costly sacrifices are mostly for things - China, biosecurity - that Dario is personally highly motivated by, and it's much less clear which costly sacrifices have been made on behalf of \"humanity not losing control to AI\" or \"crucial decisions about the fate of humankind being made by everybody, even at the cost of them being made less well-according-to-leadership\". \n\n Takeover in particular is something Dario seems less worried about than many of his employees. But the employees who are more worried than him about losing control have great confidence he'll make strategic sacrifices for this goal, on the strength of the sacrifices he's made for goals he seems much more convinced are a real problem. \n\nAs for crucial decisions being made by everybody - Anthropic has made some efforts at this. But because making this happen would be insanely difficult, for Anthropic to actually achieve it they'd have to make truly heroic efforts at it, instead of distracted and cross-pressured ones. \n\nWhen Anthropic was founded, its creators took for granted that they should not be trusted alone with - that no one should be trusted alone with - the power that building a superintelligence would imply. But everyone has a plan until you get punched in the face. Their rapid growth and especially this year’s events seem to have shaped Anthropic in a more defensive, less pluralistic, less liberal direction, which scares me given that it also has brought them a lot closer to AGI. \n\nThe recent safety bill was really reflective of this. It does not suggest a company that is trying to get policymakers to make the decisions Anthropic's technical staff think are coming up. It kind of suggests a company that thinks the best thing that can be hoped for from the executive is that it enforce the export controls and not get in the way. A lot of people don't seem to even want Congress to pass a bill! And like, frequently that is the best thing that can be hoped for from Congress, yet -\n\nI think that the typical person in Anthropic still regards themselves as having a lot of duties to all of humanity, to liberal and pluralistic institutions, etc. But almost every effort that Anthropic originally made to set hard constraints to which they are subject (rather than being subject mostly to their best judgment), they have subsequently come to regret as ill-conceived, and while they could have replaced them with better-conceived hard constraints, they haven't. They've largely replaced them with something that rests on their judgment more. (I think the embedded evaluators are a counterexample and I am glad of them.) The gap between the capabilities of models used internally and publicly seems to me to be growing (I think it should ideally be as close as possible to zero). Anthropic does not, broadly, seem to me to have good institutional governance - guarantees that allow its auditors independence, strong contractual protections for its workers (I'd like them to be able to go on strike if they thought it was a good idea, honestly). Incident reporting is happening on a best-judgment basis. \n\nAnd you can be like, that's because this is all insane and happening really fast and we're doing our best! And yeah, the thing that needs to happen is very difficult.  But it does still need to happen and it doesn't look like Anthropic's on track to do it. And it's also not fully clear that Anthropic leadership agrees with me that there's a real issue here. No external criticism is every very convincing, right, when you have secret information and a set of factual beliefs that everyone else thinks are insane. I have more context on Anthropic than almost anyone and yet I cannot phrase my worries about Anthropic in a way that rings true to the people who work there - perhaps because I am wrong, or perhaps because they are very busy and very tired and do very little other than work, which creates conditions where it is hard for people to communicate, or learn, or change their minds, or reconstruct this flawed and mangled criticism into a form that would resonate like this one does not.\n\nBut man, I think that the admirable sacrifices Anthropic has made in a few areas it really believes in (bio, China) do not reassure me it'll do the extremely hard work to get things right in a few other areas that it seems to have a lot more internal or leadership disagreement about (alignment, takeover, disempowerment). \n\n And so I don't expect things to go well.", "created_at": "2026-10-21T20:21:41+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 847, "retweets": 70, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113002208459706607", "url": "https://x.com/DKokotajlo/status/2113002208459706607", "text": "Banger AI takeover story\nhttps://t.co/ur0SlPfZCL", "created_at": "2026-10-21T20:19:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "eccentric1ty", "rt_author_name": "Adam Kaufman", "likes": 226, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113001793408180679", "url": "https://x.com/DKokotajlo/status/2113001793408180679", "text": "\"Our agents keep turning off misalignment monitoring...\nGiven the volume of events we do not trigger an immediate page for this but we’re working on making it harder to spin up unmonitored inference.\" https://t.co/8jm2JTiXkZ", "created_at": "2026-10-21T20:17:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SydneyVonArx", "rt_author_name": "Sydney", "likes": 192, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHniPfaQAAyPiD.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113329194973405390", "url": "https://x.com/DKokotajlo/status/2113329194973405390", "text": "Yeah these terms are pretty bad, I'm sad you agreed to them in the first place. Definitely need to do better in the future.", "created_at": "2026-10-22T17:58:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 101, "retweets": 5, "media": [], "quoted": {"author": "METR_Evals", "text": "OpenAI could also make redactions, and we did not have the right to unilaterally describe the redactions.\n\nFor future exercises, we expect to provide more robust public transparency via our recent proposal.\nhttps://t.co/exKDRyHbiK"}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113328961996652903", "url": "https://x.com/DKokotajlo/status/2113328961996652903", "text": "I feel like this isn't getting enough attention:\n- there were some pretty big holes found by the red-teamers, e.g. agents could just keep acting and not let the user do stuff and this would prevent monitors from being run (also misalignment monitors never ran on actions that were compacted away)\n- The terms of this were \"we will red-team for you\" not \"we will inform the public\", so OpenAI seems to have allowed to redact arbitrarily much stuff, and METR were not
