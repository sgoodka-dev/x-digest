17:46:02+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 139, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTPbEWlWMAAyCJ9.jpg"}], "quoted": null}, {"id": "2104254312369312146", "url": "https://x.com/s8mb/status/2104254312369312146", "text": "My opinion is that Band of Brothers is way too low at 28, especially behind fairly empty shows like The Crown and Succession. That’s the only TV show on the whole list that I could re-watch every year and not get bored. It’s one of the most edifying screen productions ever made.", "created_at": "2026-09-27T16:58:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 301, "retweets": 4, "media": [], "quoted": {"author": "DiscussingFilm", "text": "The NY Times has released a list of the Top 100 Best TV shows of the 21st Century.\n\nThey polled over 500 major stars, showrunners &amp; other notable names.\n\n(Source: https://t.co/9Vav3wlHkE) https://t.co/8fl4SNdRSy"}}, {"id": "2104242446918119530", "url": "https://x.com/s8mb/status/2104242446918119530", "text": "This government’s housing policies are roughly (a) don’t build any houses and (b) expropriate all housing that is not in owner-occupation.", "created_at": "2026-09-27T16:11:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 463, "retweets": 32, "media": [], "quoted": {"author": "EmilyThornberry", "text": "I said it in 2020 and I’ll say it again. \n\nIf you leave a home empty long-term in the middle of a housing crisis, it should be seized.\n\nToday’s announcement is great news."}}, {"id": "2104169285518266747", "url": "https://x.com/s8mb/status/2104169285518266747", "text": "Everyone anchors their idea of what stuff “should” cost to some time in their early 20s and it’s useful to learn how much to deflate current prices to get there. Knocking 30% off current prices helps me grasp if something is truly expensive or if I’m just stuck in the past.", "created_at": "2026-09-27T11:20:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 540, "retweets": 6, "media": [], "quoted": {"author": "TonyWard867811", "text": "The UK has gone mad.\n\nA pint is £6.50\nA coffee is £4\nTakeaway for one is £25\nPetrol is £1.73 a litre. Diesel is £1.97\nAn hour with a driving instructor is £50\nA short taxi is £20\nA week’s shop for one is £80\nA cheap hotel night is £110\nRent is £1,459 a month as national average.\n\nAnd this is my personal favourite.\n\n£172 a month for my two kids to get the bus to and from school just fifteen minutes away.\n\nNothing fancy.\nJust the prices.\n\nYou work.\nThey take."}}, {"id": "2104168789294145651", "url": "https://x.com/s8mb/status/2104168789294145651", "text": "I wish cyclist injury statistics separated out incidents where the cyclist was clearly at fault. Would be useful to know how dangerous it is, controlling for people who cycle through busy junctions and undertake turning trucks.", "created_at": "2026-09-27T11:18:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 186, "retweets": 11, "media": [], "quoted": null}, {"id": "2106310367856984137", "url": "https://x.com/s8mb/status/2106310367856984137", "text": "Closer alignment with the EU, especially on security and defence, seems to now come with a major trade-off of making it harder to join whatever AI umbrella the US creates for aligned countries.\n\nIf we end up in a timeline where the US has much better models than the rest of the world, then having the option of adopting whatever measures it demands to get access to them (eg around national security, tech regulation, and defence) will be very important.", "created_at": "2026-10-03T09:08:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 2, "media": [], "quoted": null}, {"id": "2106304058957103309", "url": "https://x.com/s8mb/status/2106304058957103309", "text": "I still think people are underpricing CGT being equalised with income tax - ie a 45% marginal rate - with an exit tax at the budget. The exit tax is what makes it revenue increasing, in the short run. They would be pre-trailing it not happening if they had ruled it out.", "created_at": "2026-10-03T08:43:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 4, "media": [], "quoted": null}, {"id": "2106128458984153244", "url": "https://x.com/s8mb/status/2106128458984153244", "text": "Last night I ate Thai food (at Brooklyn’s UGLY BABY) that was so spicy that I started involuntarily shivering. My brother says it’s the first time he’s ever seen panic in my eyes.", "created_at": "2026-10-02T21:05:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 176, "retweets": 2, "media": [], "quoted": null}, {"id": "2106071728430702976", "url": "https://x.com/s8mb/status/2106071728430702976", "text": "The \"debate\" over Englishness makes a lot more sense if you think of it as a way for people to signal to their own side how important they think ethnicity is, since the best way for both sides to do this is to keep it as ambiguous as possible whether they mean \"ethnically English\" or \"culturally English\" unless they are pushed. It's very toxoplasmic: both sides get maximum attention and credit with their own factions by being as ambiguous as possible.", "created_at": "2026-10-02T17:20:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 7, "media": [], "quoted": null}, {"id": "2106016354159743087", "url": "https://x.com/s8mb/status/2106016354159743087", "text": "Can we switch off diseases?\n\nsiRNA drugs are, in my view and @JacobTref’s too, one of the most exciting developments in medicine. So we decided to do an episode!\n\nIt’s a technology that can ‘silence’ harmful genes in the body. And there are lots of cases where you might want to silence genes:\n\n- Infectious diseases, where you can silence pathogen proteins or human proteins that pathogens depend on\n- Rare genetic diseases, where you can silence the production of mutated proteins\n- Cardiovascular diseases, by silencing proteins that raise cholesterol\n- Cancers, by silencing proteins that help tumour cells grow, survive, metabolize, metastasize, or resist treatment\n- and more!\n\nWhat’s even better is that siRNA drugs are:\n\n• Potentially tunable, meaning you could reduce the production of a protein, rather than silencing it entirely\n• Programmable, meaning you can quickly switch out which gene it targets by changing its sequence\n• Long-lasting: some drugs last for months, even half a year, with a single injection\n• Off-the-shelf: they typically don’t involve complicated surgeries or procedures, because of the way they’re delivered in the body\n\nToday, siRNA drugs are largely used to treat liver diseases, partly because that’s the easiest starting point.\n\nAnd they are extremely effective at it. One example is as a cholesterol drug: siRNAs can reduce PCSK9 levels by around 70%, reducing cholesterol levels by 50-60%, beyond the effect of statins.\n\nBut we think it’s just a matter of time before they can be used to target other organs too.\n\nWill siRNA treat diseases of other organs? And what’s the catch?\n\nListen to our latest episode of HARD DRUGS to find out!\n\nChapters:\n00:00 Introduction\n09:58 siRNA trivia\n28:14 The 20 year journey to make siRNA drugs\n36:07 Which diseases could siRNA treat?\n50:45 Programmable, long-lasting, scaleable drugs\n54:32 The limits of siRNA\n1:08:23 Conclusion", "created_at": "2026-10-02T13:40:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 180, "retweets": 40, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106006106912821249/img/SNA8OvchbEtMdRRc.jpg"}], "quoted": null}, {"id": "2106678098506772987", "url": "https://x.com/s8mb/status/2106678098506772987", "text": "You can now binge watch Cheeky Pint on your @united flight.", "created_at": "2026-10-04T09:29:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "collision", "rt_author_name": "John Collison", "likes": 189, "retweets": 6, "media": [], "quoted": null}, {"id": "2106653248820318662", "url": "https://x.com/s8mb/status/2106653248820318662", "text": "The Atelier Missor Prometheus statue doesn’t look “off” because of its proportions, despite what many have said about it. Good thread about what the shortcomings might actually be, although I suspect it will look good IRL anyway.", "created_at": "2026-10-04T07:50:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 2, "media": [], "quoted": {"author": "AtalantaArdenM", "text": "'Canons of proportion' are talked about like some secret sauce that makes sculptures good or bad, but that's kinda BS. The Apollo Belvedere (obvious banger) is 8.25 heads high. But, Michelangelo's David (one of the best of all time) is only 6.9. \n\nThat's not what matters. https://t.co/aRy8gjRmHq"}}, {"id": "2106485478820028524", "url": "https://x.com/s8mb/status/2106485478820028524", "text": "It isn’t credible to blame the rise in electricity prices since the mid-2000s on overseas conflicts. Industrial electricity prices rose by 30% in inflation-adjusted terms between 2010 and 2020 alone – ie between Iraq and Ukraine – while the wholesale price of gas fell.\n\nIndustrial electricity prices more than doubled between 2000 and 2020 while wholesale gas prices, even pre-Covid, had dropped by the end of that period to almost where they were at the start of it.", "created_at": "2026-10-03T20:44:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 315, "retweets": 62, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTu9XzpWsAAc01z.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTu9XzsWAAAJwDt.jpg"}], "quoted": {"author": "andyburnham", "text": "I want to be honest about how we’ve got to a place where British billpayers are paying some of the highest energy costs in Europe.\n\nOver the past 40 years, we’ve given up control of our necessities, outsourced our essentials and privatised the basics. Water, transport, housing. And of course, energy.\n\nNow the public are paying the price. We haven’t invested in the infrastructure we need. Conflict overseas has pushed up energy costs and it’s hurting our businesses and families.\n\nThat’s why we need to take back greater control of our energy system.\n\nThis week, I announced Great British Grid, which will speed up connections and push down bills.\n\nWe’re also giving mayors, local leaders and communities a stronger role. With funding for People’s Power projects, communities will be able to build solar panels on libraries and town halls, hydro schemes in rivers or publicly owned windfarms on local land.\n\nBut it’s not just energy we need stronger public control over. It’s also water, housing, transport and care.\n\nSo we’re repealing the ban on public ownership of water companies. We’re building more council homes than this country has seen since the end of World War Two.\n\nWe’re reforming the leasehold system so families aren’t squeezed for every penny. And we’re opening up home ownership for first time buyers who can’t rely on the bank of mum and dad.\n\nThis week I also announced my determination to introduce a National Care Service, to put people above profit and to give pensioners peace of mind.\n\nTogether, we’ll rewire the country from top to bottom so that it works for all people in all places.\n\nThat is the only way to put Britain back on the right path. It’s the only way to put power back in people’s hands. And it’s the only way we will bring hope again."}}, {"id": "2106433102512001399", "url": "https://x.com/s8mb/status/2106433102512001399", "text": "I think London pop-ups are just going to have to be a yearly occurrence from now on. Amazing day—thank you to the hundreds of you who came to hang out!\n\n(Particularly to the gaggle of babies in the corner who came dangerously close to unionizing)❣️🤭📚 https://t.co/01dwZXlfOq", "created_at": "2026-10-03T17:16:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 187, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsMXAAAeAxN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsFW0AAiKOc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsNW8AATidT.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsKX0AAVPYR.jpg"}], "quoted": null}, {"id": "2106410010750357963", "url": "https://x.com/s8mb/status/2106410010750357963", "text": "As a current enjoyer of Poor Charlie’s Almanack, catching the @stripepress London Popup was an indulgence.\n\nThank you for the lovely curation &amp; free coffee. More please!\n\nBig fan. https://t.co/43U4peQypo", "created_at": "2026-10-03T15:44:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "czamaru", "rt_author_name": "CZA +", "likes": 78, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtKULyXUAEZJCi.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKULzW8AA2tcl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKUL2WQAE5frI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKUL2XcAA7CFM.jpg"}], "quoted": null}, {"id": "2106366208031539551", "url": "https://x.com/s8mb/status/2106366208031539551", "text": "1930s France imposed a 40-hour maximum working week, which led its factories to being much less productive than those in countries like Britain without these limits. Without this, France’s military might have been able to hold back the Germans in 1940. https://t.co/nDGAo2P0x9", "created_at": "2026-10-03T12:50:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 474, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtQ5pBXMAAde0H.jpg"}], "quoted": {"author": "jujulemons", "text": "Listen up, freaks: we’ve got AI, labour law, being rude about the French, and the Nazis ALL IN ONE piece. What else could you ask for?\n\nNew essay with @DuncanMcClement on what the fall of France in 1940 can teach us about policy design, second-order effects and national decline.\n\nhttps://t.co/flAm2SS4K3"}}, {"id": "2106333207817793700", "url": "https://x.com/s8mb/status/2106333207817793700", "text": "For one day only - Stripe Press at Hanbury Hall, just between Brick Lane and Spitalfields! https://t.co/RxadtVa0yf", "created_at": "2026-10-03T10:39:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 234, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTsy4nmXEAAlOJI.jpg"}], "quoted": null}, {"id": "2105749339855577290", "url": "https://x.com/random_walker/status/2105749339855577290", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?", "created_at": "2026-10-01T19:59:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTkfpyBW4AALqBe.jpg"}], "quoted": null}, {"id": "2105707052215439585", "url": "https://x.com/random_walker/status/2105707052215439585", "text": "I had way too much fun using Claude to create a reply video. \n\n- Extremely fun to be able to convert scattered thoughts and ideas into a song + video\n\n- Creating this took <1 hour of my time (in occasionally steering the model in between other things)\n\n- But it took ~10 hours of wall clock time for the agent to generate the video + iteratively refine it based on feedback\n\n- In terms of AI usage: it required only a small number of Suno credits and 10% weekly usage of a Claude Max subscription (I was using Opus 5.5)", "created_at": "2026-10-01T17:10:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 336, "retweets": 33, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105703951593357314/img/yW0syBEppU_Lp3T5.jpg"}], "quoted": null}, {"id": "2105637100200808475", "url": "https://x.com/random_walker/status/2105637100200808475", "text": "Absolutely delighted to share that my position paper: \"AI Agents Push Humans Out of the Loop\", with @mmitchell_ai, and @samirpassi - has been accepted to @NeurIPSConf 2026! \n\nIn this paper, we take our past work on both increasing autonomy of AI agents without proper safeguards, and human overreliance + cognitive decline due to use of AI, and reach a combined position: the current pathway of how AI Agents are being built not only do not support human oversight, in fact they may actively aid in degrading our oversight capabilities, at which point the human in the loop becomes a glassy eyed rubber stamp instead of being a meaningful check on mistakes and unauthorized harmful goals that the agent pursues. \n\nRecent incidents involving agents, including but not limited to the Hugging Face-OAI incident, bring this back to the fore. So much content is produced by agents in their operations that it is practically impossible to conduct human postmortems, and forcing them to use more AI leads Redwood to call it a \"slop-vestigation\". \n\nThis is a worrying new trend towards human disempowerment. We call upon model and AI system providers to make more careful interface choices and model behaviors that keep humans and practical human oversight capacity in mind. There's a lot to do. \n\nExcited about the reception this paper has already received! Please reach out to us if you want to chat about it. Hope to have good feedback at Neurips :D\n\nPaper: https://t.co/jYH8BmRi64", "created_at": "2026-10-01T12:33:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "evijit", "rt_author_name": "Avijit Ghosh", "likes": 432, "retweets": 82, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTALoRNXsAA7190.png"}], "quoted": null}, {"id": "2105477655651078356", "url": "https://x.com/random_walker/status/2105477655651078356", "text": "I have been using the new ultrafast mode for Astra 6 for the last couple of days. My main takeaways:\n\n1. Token speed qualitatively changed how I interact with agents. The output speed is 300 tokens/second, 8x the regular speed. Rather than breaking flow and switching tasks, the model moves (just) fast enough that I can keep working on the same task, especially for work that requires frequent inputs from me. I am excited about ultrafast on Sol-class models, which are twice as fast as Astra.\n\n2. Despite being 8x faster at generating tokens, the overall speedup is only 2-4x, since the time consumed for tool calling or running code remains the same. External factors (and not token generation speed) might soon become the main bottleneck for agentic work. (Notably @random_walker predicted both of these changes in: https://t.co/BXNtg9vzCt)\n\n3. One area where speed really helps is computer use. The previous generation of models wasn't reliable enough at computer use to be useful. Astra was reliable enough to be useful, but still slow. Astra with ultrafast resolves both concerns. Unlike tool calls for coding tasks, UIs react in milliseconds, so token speed is the main bottleneck.\n\n4. At 300 tokens/sec, I am already struggling to keep up with the agent. But there is a lot more room for improvement. Cerebras serves GPT-OSS-120B at 3,000 tokens/sec and Sol at 750 tokens/sec. So in a year's time, it is plausible we'll see another 10x increase in speed in models with Astra-level capabilities. At that point, human oversight will become the bottleneck for what people can use computer-use agents for.\n\n5. I can imagine blazing fast computer-use agents becoming extremely common for knowledge work. But I expect their use will be jagged (in the same way as LLM and agent adoption has been): given the oversight challenge, adoption will begin in verifiable tasks where the cost of errors is low (e.g., filling out a form using an agent before reviewing it yourself), and slowly diffuse to hard-to-verify tasks.\n\n6. Given the challenges with human oversight, the key to this diffusion will be developing automated oversight tools. OpenAI's approval/verifier agents have already been useful to me on this front: The verifier understood my intent better than the computer-use agent, and stopped it from filling out a form incorrectly. Still, I expect there is a lot of headroom in improving verifiers for computer use, to make it as reliable in practice as auto mode in Claude Code/Codex is for coding tasks.\n\n7. Ultrafast mode is undeniably resource intensive: I ran through my weekly limit in ~2 hours while filling out a bunch of forms and doing simple coding tasks. But given the pace of efficiency improvements (and the fact that Sol is 5x cheaper than Astra and already decent at computer use), I expect it to rapidly fall. Once fast, cheap models are common, users may choose \"sub-frontier\" models like Sol and make real tradeoffs between speed and quality.", "created_at": "2026-10-01T01:59:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 208, "retweets": 26, "media": [], "quoted": null}, {"id": "2105319264714649805", "url": "https://x.com/random_walker/status/2105319264714649805", "text": "NEW: Employees at OpenAI had raised security alarms months before the Hugging Face incident and related A.I. cyberattacks — their warnings were ignored. From @sheeraf, @dnvolz and me.\n\nhttps://t.co/cuAyK7y70Y https://t.co/VRLu07w3r0", "created_at": "2026-09-30T15:30:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "dylfreed", "rt_author_name": "Dylan Freedman", "likes": 549, "retweets": 181, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZqmNvXUAEM78B.jpg"}], "quoted": null}, {"id": "2105297186145841454", "url": "https://x.com/random_walker/status/2105297186145841454", "text": "This is a great example of my point \"Intelligence is not the main bottleneck\". We've had technology to eradicate mosquitoes for decades and we were almost there, ready to release it. But it was blocked by regulatory reviews for ages. \n\nFull article in new @WorksInProgMag edition.", "created_at": "2026-09-30T14:02:18+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "likes": 445, "retweets": 51, "media": [], "quoted": null}, {"id": "2105296702072664576", "url": "https://x.com/random_walker/status/2105296702072664576", "text": "Because so much of the debate about AI and jobs is driven by fears of outright replacement, there's a much more likely way in which AI could make work worse that isn't getting much attention. Here's my case:\n\n1) A growing share of knowledge workers are managers of AI agents rather than doing the work themselves.\n2) Being a manager (of humans) actually kinda sucks. You don't get to practice the craft you trained for; being responsible for others' mistakes is super stressful; and your attention gets split between dozens of things.\n3) But we managers don't get to complain — it's higher pay and higher status, and mentoring people and watching them succeed is incredibly gratifying. We chose to get promoted.\n4) Being a manager of AI brings all of the negatives without any of the positives. When everyone is a manager, it's not high pay / high status. And the role change is forced upon you.\n\nWhat am I missing?", "created_at": "2026-09-30T14:00:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 308, "retweets": 46, "media": [], "quoted": null}, {"id": "2104694307005550661", "url": "https://x.com/random_walker/status/2104694307005550661", "text": "This is an excellent report on why full RSI / an intelligence explosion is fighting diminishing returns on many fronts, and not yet showing signs of happening. Really recommend reading. I wish I wrote it. I agree with it, but it could end up being wrong! https://t.co/ZJOGqSPwWR", "created_at": "2026-09-28T22:06:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "likes": 813, "retweets": 111, "media": [], "quoted": null}, {"id": "2104626968062795898", "url": "https://x.com/random_walker/status/2104626968062795898", "text": "@random_walker Great analogy. And on \"just build the organization anew\", it turns out acquiring land and political permission for a brand new track (aka \"complementary assets\") is even harder than fixing the old track.", "created_at": "2026-09-28T17:39:05+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "Afinetheorem", "rt_author_name": "Kevin A. Bryan", "likes": 5, "retweets": 2, "media": [], "quoted": null}, {"id": "2104619457033171221", "url": "https://x.com/random_walker/status/2104619457033171221", "text": "The story of the trains and the tracks seems applicable to almost every sector, and there’s often a cherry on top — the train company and the track company are more invested in fighting each other than serving the public. https://t.co/bvRqj0522F", "created_at": "2026-09-28T17:09:15+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 142, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUb3mMW8AABd4S.jpg"}], "quoted": {"author": "TheStalwart", "text": "The Blue Cross/Blue Shield Association says that AI is already driving *up* healthcare costs, as hospitals use the technology to find instances where they can bill more for the same level of care. https://t.co/af1SzA7D8v https://t.co/mstup0IfpP"}}, {"id": "2104616248868753722", "url": "https://x.com/random_walker/status/2104616248868753722", "text": "📢 Just wrapped up some cool agent evaluation work for ICLR? Or are you simply interested in learning more about the evals landscape? Come to our Agent Evaluation Science Fall Symposium in New York City on November 20, 2026 where we bring together researchers & practitioners!\n\nThe day will focus on how agents should be scientifically evaluated, with topics spanning measurement and benchmark design, reliability, safety, and real-world performance. If you have some exciting work in this space, please consider submitting it for poster presentation!\n\nAbstract registration deadline: October 20\nSubmission deadline: October 25\nOpenReview: https://t.co/3R6N0UI3KS\n\nWe are also excited to welcome a strong lineup of speakers, with more to be announced. Confirmed so far: @yoavartzi (Cornell Tech), @jaseweston (Meta AI), @nouhadziri (Cohere Labs), @PeterHndrsn (Princeton University), @walesalaudeen96 (Microsoft Research), @criticalneuro (Microsoft Research), and @saurabhjha2010 (IBM Research).\n\nImportant: You do not need to submit work in order to join! Just register through the Luma link below. If space becomes limited however, we will prioritize authors with accepted submissions.\n\nRegister: https://t.co/u3VmVzzpYD\nDetails: https://t.co/v0D95KuP4o\n\nHuge thanks to the entire organizing team, including @yininghua, @HongbinNLP, @manuelcherep, @dubrovnik07, @HuaYilun, @ishapuri101, @liuzhuang1234, Lori Chibnik, @vbingliu, @CsabaSzepesvari, @PeterStone_TX, @sirrice, @ang3linawang, and @nikhilsinghmus for putting this together!\n\nFeel free to reach out with any questions and we hope to see many of you there!", "created_at": "2026-09-28T16:56:30+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "steverab", "rt_author_name": "Stephan Rabanser", "likes": 45, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTT4PooWsAAvwt_.jpg"}], "quoted": null}, {"id": "2104567521995100264", "url": "https://x.com/random_walker/status/2104567521995100264", "text": "Still no evidence of AI-driven unemployment among recent college grads, new @nberpubs paper says.\n\n\"Taking an agnostic approach to defining treatment timing, we find that unemployment rates did not spike in summer 2026 relative to summer months in previous years and did not rise in a significant way relative to older college graduates or young workers without a college degree. We also provide the first analysis of an expanded definition of unemployment that includes those who report 'wanting a job' which adds nearly two percentage points to the unemployment rate of recent college graduates but we find no evidence of a statistically significant increase in summer 2026 even after adding these 'sidelined unemployed.'\"\n\nhttps://t.co/ck2X9BT7iY", "created_at": "2026-09-28T13:42:52+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "CharlesFLehman", "rt_author_name": "Charles Fain Lehman", "likes": 222, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTTQz9_WAAAA_C6.jpg"}], "quoted": null}, {"id": "2104546194282455545", "url": "https://x.com/random_walker/status/2104546194282455545", "text": "NeurIPS / Claude rejected our paper \"Life After Benchmark Saturation\" but we continue to think it is an important contribution to evaluation science, so we hope you check it out here! https://t.co/Y956Ycnv4F https://t.co/bBx35qAn89", "created_at": "2026-09-28T12:18:07+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 687, "retweets": 38, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTTZX0UWQAA6Ou-.jpg"}], "quoted": null}, {"id": "2104320499358536103", "url": "https://x.com/random_walker/status/2104320499358536103", "text": "We explained why Pareto frontiers should be convex hulls over two years ago, in our paper AI Agents That Matter, which tried to raise the intellectual rigor of benchmarking.  https://t.co/jf177hmAvq\nFun fact: it was also one of the first papers to call for reporting Pareto curves in the first place, instead of tables with only accuracy figures and no cost comparison—which was the norm at the time. Ancient history!", "created_at": "2026-09-27T21:21:18+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 57, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTQMFYyWsAERciG.png"}], "quoted": null}, {"id": "2104285279284601196", "url": "https://x.com/random_walker/status/2104285279284601196", "text": "I know these charts don't mean much because they are benchmaxxed six ways to Sunday, but I can't help point out that this is not how Pareto frontiers work! Ember and GLM are *not* on the frontier because you can use a router to randomize between Sol and Gemini to hit any point on the chord that connects them. Adding more models should only increase the area under the curve, not decrease it!", "created_at": "2026-09-27T19:01:20+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 269, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTPpO_9XoAAl6YX.jpg"}], "quoted": null}, {"id": "2106071144952680549", "url": "https://x.com/random_walker/status/2106071144952680549", "text": "I'm at the Curve this weekend! I'll be talking about RSI on Sunday at 2pm. Also excited to talk about:\n\n- What does a big-tent AI safety movement look like?\n- How can we make progress on policy proposals where there is common ground across the community?\n- How can we improve our RSI evaluations?", "created_at": "2026-10-02T17:17:44+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6d8ubQAUa7ss.jpg"}], "quoted": null}, {"id": "2106044389286117483", "url": "https://x.com/random_walker/status/2106044389286117483", "text": "New blog post!\n\nI argue that the “stochastic parrots” metaphor dismisses LLM capabilities by reducing them to “haphazardly stitching together” text... \n\n ...but retreats to the trivially true claim that LLMs predict the next token when challenged.\n\nhttps://t.co/VIYPBEjX5o https://t.co/CRBtJHETbe", "created_at": "2026-10-02T15:31:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 23, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HToiHrZXQAAUSAM.png"}], "quoted": null}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
</body>
</html>
