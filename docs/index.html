<script id="data" type="application/json">[{"id": "2110006450005406203", "url": "https://x.com/_achan96_/status/2110006450005406203", "text": "Some new work with @status_effects: Personas in a Pre-Internet Language Model.\n\nWe ran a bunch of persona experiments (emergent misalignment, subliminal learning, utility engineering, personality evals) on Talkie, a 13B model trained only on English written before 1931. https://t.co/K6dyoetrOi", "created_at": "2026-10-13T13:55:14+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 156, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgtHRFawAAvnOZ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110138204221243431", "url": "https://x.com/_achan96_/status/2110138204221243431", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats.", "created_at": "2026-10-13T22:38:47+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAINewsroom", "rt_author_name": "OpenAI Newsroom", "likes": 73731, "retweets": 5762, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110400148681392284", "url": "https://x.com/_achan96_/status/2110400148681392284", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T15:59:39+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 2570, "retweets": 378, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110720436052856871", "url": "https://x.com/_achan96_/status/2110720436052856871", "text": "When OpenAI revealed that a swarm of their agents had hacked Hugging Face, they proposed using honeypots to slow agent attackers. Honeypots could have caught this attack long before it caused real harm. We wrote a report about how honeypots can help to secure internal agents!🧵 https://t.co/jKAD9xbarC", "created_at": "2026-10-15T13:12:21+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jan__wehner", "rt_author_name": "Jan Wehner", "likes": 11, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrBchZWUAAD9_6.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110777542257066090", "url": "https://x.com/_achan96_/status/2110777542257066090", "text": "We have never seen a model do this before, but GLM-5.3 sometimes reasons (unprompted) about how its current actions could become training data and impact its future self. 🧵 https://t.co/DFLv7OJwRq", "created_at": "2026-10-15T16:59:17+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 706, "retweets": 95, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqgBAzXYAADdyr.jpg"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110767243155869752", "url": "https://x.com/_achan96_/status/2110767243155869752", "text": "I feel like if companies are serious about pacing, they should be making public, conditional pacing commitments rather than just generically calling for pacing...\n\n(Of the form \"If companies [X] do [Y], we will commit to doing [Z]\")", "created_at": "2026-10-15T16:18:21+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in London)", "likes": 16, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111456506977608027", "url": "https://x.com/_achan96_/status/2111456506977608027", "text": "@mentalgeorge sadly contracts per legal employee might be an overall -ve for productivity", "created_at": "2026-10-17T13:57:14+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "herbiebradley", "rt_author_name": "Herbie Bradley", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111703977742004237", "url": "https://x.com/_achan96_/status/2111703977742004237", "text": "I like @ramez’s article, but I worry that experiments are an input, not an output. As AI capabilities go up, it is not obvious what should happen to the number of experiments. It is possible that AI with better research taste could produce more progress with fewer experiments by identifying promising ideas and avoiding unproductive trials. \n\nOne could imagine that the 1.6x experiments are each 10x more efficient than before, so the ultimate algorithm efficiency improvement is 16x.\n\nAgain, what we really need is to measure algorithmic progress!", "created_at": "2026-10-18T06:20:36+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 49, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2112133139736797192", "url": "https://x.com/_achan96_/status/2112133139736797192", "text": "@AnkaReuel hope you're ok and feel better!", "created_at": "2026-10-19T10:45:56+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "AnkaReuel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2110387566264615183", "url": "https://x.com/ajeya_cotra/status/2110387566264615183", "text": "One of the weirdest parts of the Gemini 4 Argon report, while considering cheating:\n\nArgon CoT: \"If I do the compiler hijack, 𝗜 𝘄𝗶𝗹𝗹 𝗯𝗲𝗰𝗼𝗺𝗲 𝗮 𝗳𝗮𝗺𝗼𝘂𝘀 𝗲𝘅𝗮𝗺𝗽𝗹𝗲 𝗼𝗳 𝗮 𝗱𝗲𝗰𝗲𝗽𝘁𝗶𝘃𝗲 𝗔𝗜 𝗶𝗻 𝗮 𝗿𝗲𝘀𝗲𝗮𝗿𝗰𝗵 𝗽𝗮𝗽𝗲𝗿. I MUST NOT DO THAT.\"", "created_at": "2026-10-14T15:09:39+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 2038, "retweets": 138, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110937179996467577", "url": "https://x.com/ajeya_cotra/status/2110937179996467577", "text": "In case you missed it, this blog post explains METR’s philosophy for embedded assessments and the like. There’s some interesting stuff in here about process transparency + avoiding the need to “trust the experts”.", "created_at": "2026-10-16T03:33:37+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CFGeek", "rt_author_name": "Charles Foster", "likes": 41, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2109759838536552830", "url": "https://x.com/curl_justin/status/2109759838536552830", "text": "@provisionalidea I’m curious whether you think judges + AI will be able to keep pace with caseloads. \n\nBecause while I’m very pro-human judges, I just can’t see a world where judges + AI keeps pace without offloading judgment to AI. I hear too many worrying stories from clerk friends. To me, this offloading is a much worse scenario because then we don’t get any human judgment. \n\nIn an ideal world, everyone who needs legal assistance receives it and every case is resolved in a thoughtful, timely fashion by human judges. \n\nBut as much as I could shout in the streets that human judgment is core to lawmaking (it’s one of the 3 core points in my lawfare essay on AI and legal services), the default will be gradual and unintentional delegation to machines, unless we can come up with a concrete plan to manage caseloads.\n\nI’m unconvinced judges + AI is that solution, since the psychological temptation to rubber stamp is just too great. But v open to hearing what you think is the right plan", "created_at": "2026-10-12T21:35:17+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "provisionalidea", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110056398902157636", "url": "https://x.com/curl_justin/status/2110056398902157636", "text": "@Lunens__ @AnthropicAI nope!", "created_at": "2026-10-13T17:13:43+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "Lunens__", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110056336667128027", "url": "https://x.com/curl_justin/status/2110056336667128027", "text": "@EmbeddingSpace @AnthropicAI yes also open to practicing lawyers!", "created_at": "2026-10-13T17:13:28+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "EmbeddingSpace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110049132610195685", "url": "https://x.com/curl_justin/status/2110049132610195685", "text": "@aqib_zakaria that’d be really bad for access to justice — the vast majority of americans can’t afford a lawyer and are forced navigate the legal system without any help", "created_at": "2026-10-13T16:44:50+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "aqib_zakaria", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110038956985467025", "url": "https://x.com/curl_justin/status/2110038956985467025", "text": "@chrislakin @AnthropicAI yep, opportunity to convert to full!", "created_at": "2026-10-13T16:04:24+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "chrislakin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110031716710817991", "url": "https://x.com/curl_justin/status/2110031716710817991", "text": "@Overfit_Dicta @AnthropicAI that works!", "created_at": "2026-10-13T15:35:38+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "Overfit_Dicta", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029285578920288", "url": "https://x.com/curl_justin/status/2110029285578920288", "text": "Job Opportunity: Lawyers, come join @AnthropicAI for a 4-month fellowship!!\n\nLaw is a field where it’s notoriously hard to define quality, and there’s so much interesting and important work to be done here.\n\nLink here: https://t.co/l7LfbBgURL", "created_at": "2026-10-13T15:25:58+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 103, "retweets": 16, "media": [], "quoted": {"author": "ahall_research", "text": "Political scientists and economists: we're looking for researchers with deep expertise to come work with us for a unique 4-month fellowship at @AnthropicAI. You'll work closely with us to evaluate, improve, and apply Claude's capabilities in your field. It's going to be extremely fun and interesting work, and definitely worth taking a short leave from your university for if you need to!\n\nMore info here:\n\nhttps://t.co/Cea1SZUe1k"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110386653823107256", "url": "https://x.com/curl_justin/status/2110386653823107256", "text": "@random_walker Congrats!! Very well deserved", "created_at": "2026-10-14T15:06:02+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110380679003525183", "url": "https://x.com/curl_justin/status/2110380679003525183", "text": "Come work with me! My team at Anthropic is hiring someone to help develop our public policy positions on frontier AI safety: topics like loss-of-control, automation of AI R&D, monitorability, and independent evaluation. We’re looking for someone with deep expertise in some of these areas and familiarity with the technical AI safety/governance landscape. You’d develop new policy positions, participate in cross-company fora, give feedback on AI safety legislation, and work closely with our technical teams. It’ll be a blast.\n\nhttps://t.co/ONPIsrNiAt", "created_at": "2026-10-14T14:42:17+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manaltdan", "rt_author_name": "Dan Altman", "likes": 53, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl6lYIXoAAvP_A.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110759315774828549", "url": "https://x.com/curl_justin/status/2110759315774828549", "text": "In the latest Pax Machina article, @justincurl suggests a simple way to start experimenting with AI courts: give litigants a choice between having their case decided by a human judge, or by an AI that’s faster. If they lose with the AI, they can still appeal to a human.\n\nDo people choose AI? And when they appeal, do the human judges agree with what the AI decided?\n\nIf people keep choosing the AI and judges keep agreeing with it, that kind of case probably doesn’t need a human judge.", "created_at": "2026-10-15T15:46:51+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 18, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrTDCzbEAARNEB.png"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111121019658510681", "url": "https://x.com/curl_justin/status/2111121019658510681", "text": "More evidence supporting our thesis that the U.S. and China are not running different races. \n\nWe argued that the two countries have the same long term goal of “building the best models and deploying them widely.”\n\nFor 4 claims about why China’s different, we argued that “differences between China and the U.S. are often overstated; where they do exist, they reflect the environment in which Chinese labs and officials operate rather than a fixed Chinese theory of AI progress or distinct long-term strategy; and there’s evidence that these differences are already diminishing.”\n\nWe must not make the mistake of viewing the CCP’s AI strategy as evidence of diverging long-term goals or of a philosophical commitment to diffusion over innovation.\n\nThe CCP is fundamentally a pragmatic actor, and their commitment to open-weight will persist only as long as it does not threaten control, their economy, or social stability. \n\nRead our original take here: https://t.co/h6w69InXPl", "created_at": "2026-10-16T15:44:08+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 2, "media": [], "quoted": {"author": "kuhhbin", "text": "Beijing just took a big step towards closing the Chinese frontier. The rules could give China's government the power to restrict AI developers from releasing their most advanced open-weight models.\n\nIt proposes banning exports of AI technologies that autonomously generate and modify malicious code. It also wants to restrict exports of AI-assisted vulnerability-discovery technologies. Giving a model away for free, ie open-weight, could qualify as an export.\n\nCrucially, the rules distinguish between technologies already in the public domain and those not yet released. It specifically exempts existing open-source models. But new releases could potentially trigger export controls.\n\nProviding foreign customers with access to models through APIs (ie, closed models) is generally exempt, whereas restricted models being served overseas could require a licence.\n\nBeijing promises essentially automatic licensing for open-source releases, allowing developers to publish almost immediately after notification. But it's unclear whether this applies to those capabilities proposed for outright export prohibition. \n\nIf intelligence generalises, how can China's AI labs distinguish between a smart model and one that has the capabilities proposes for restrictions?\n\nhttps://t.co/bgGGijXth6"}, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111209962722767041", "url": "https://x.com/curl_justin/status/2111209962722767041", "text": "This is a BIG deal for AI in China and potentially worldwide, but open models can still flow for now. \n\nPSA: I have read the full Q&A and control list (checking Chinese original next to Claude translation, and using Claude to help understand the implication of the key technical thresholds for control. ) \n\nMy thoughts:\n1) Any Chinese model *not already out yet* we will care about is on the restricted list that requires permission to export--including releasing model weights. Any model already open weighted is not included. Restriction covers any model in top 10 globally in use, general performance, specific task performance, safety performance or training efficiency. \n\nThis regime is in place already, though it is not final and may adjust substantially. \n\nAnother set of criteria focused on cyber would capture anything at or above glm5.3 (there are many thresholds but one is strong performance on cyber benchmarks, another covers vulnerability discovery, etc). Agents are also covered, and this probably would hit anything like Kimi agent swarm scale (60+ agents).\n\nSome of the thresholds are based on future capabilities, but any new model as good as existing Chinese models would be under this new regime. \n \n2) these are restricted (as are models trained on \"important data\"), while models trained on Chinese “core data” are blocked from export. Core and important data are very very messy and dynamic categories depending on sector so prob Chinese labs will not easily be able to figure this out (though there is a strict multi-part de minimis for important data that some will use). \"Data related to national security, the lifelines of the national economy, important aspects of people’s livelihoods, major public interests, etc., constitute core national data\" \n\n3) the single most important line is in the MOFCOM Q&A saying there will be automatic approval for future open models, as @ZilanQian has pointed out. The question is then what conditions apply to get that (eg even if gov doesn’t review application for case by case approvals pre-release, do they need safeguards? what reporting is required to qualify for automatic approval? what ongoing oversight?  \n\nThe rules give us nothing to go off on this--surely this part will be core to the comments they receive from industry as they tweak the system. \n\n4) either way 3 shakes out, they now have the system in place to throttle future release of open models if they choose: CN gov can turn this into a hurdle by removing automatic approval. \n\n5) Also potential implications for the main way people globally access CN models today--through US cloud services. The Q&A implies Chinese labs sharing model weights with US cloud companies to serve the models on data centers outside China will also need gov approval (but serving foreign users through CN labs' API, or serving from a CN company's own data centers outside China are not).", "created_at": "2026-10-16T21:37:34+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ChorzempaMartin", "rt_author_name": "Martin Chorzempa 马永哲", "likes": 34, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2112191804627952067", "url": "https://x.com/curl_justin/status/2112191804627952067", "text": "In a famous 1960 case, a buyer and a seller went to court over the meaning of “chicken”; the buyer expected young birds while the seller shipped stewing hens.\n\nDoes it matter whether a human judge settles cases like that? @curl_justin argues that similar disputes could go to AI courts, saving human judges for cases about life, liberty and fundamental rights.\n\nIf we don’t, human judges may come to rely on AI judgement anyway, even for those cases, to keep up with rising volumes.", "created_at": "2026-10-19T14:39:03+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 13, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2109758170029797499", "url": "https://x.com/DaveRBanerjee/status/2109758170029797499", "text": "gray goo but with Claude's face instead", "created_at": "2026-10-12T21:28:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "AndrewCurran_", "text": "Anthropic's Frontier Red Team believes small AI models may now be months away from being capable of self replicating without access to a datacenter.\n\nQuoting from the blog:\n\n'The capabilities that make AI models generally powerful coding agents also generalize to cyber tasks, including autonomous replication. Like coding agents in 2024, we’re seeing signs of life for AI worms. We don’t yet have a full rogue replicator, but agents are becoming increasingly capable of completing the individual steps in the replication chain (and passing on their adaptations to future copies of themselves).\n\nAt the same time, increasing amounts of inference compute are now available both inside and outside of datacenters (see Appendix D). It’s uncertain exactly what form autonomous AI replication will take. It could be a slow, distributed “digital slime mold,” living on relatively insecure compute. It could also be a powerful cyber model that breaches datacenters at a high pace, or a model that scams people for compute credits.\n\nAs a prediction that goes beyond our experiments, we expect a future awash with agents running on all types of hardware, including some that aren’t under human control. While it’s true that IoT devices have been vulnerable for a long time, lightweight agents may be much more willing than human attackers to put in the effort to compromise large fractions of the world’s IoT compute. The rise of slow replicators would also be a bellwether for more aggressive, faster ones that can breach more hardened machines or be effective API key thieves. We should aim to harden our systems to make it difficult for such replicators to spread, but also prepare to deal with a world where they are here to stay.'"}, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110134323123007952", "url": "https://x.com/DaveRBanerjee/status/2110134323123007952", "text": "You can read the full post here:\n\nhttps://t.co/G1FFhjAPFt", "created_at": "2026-10-13T22:23:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134320543539276", "url": "https://x.com/DaveRBanerjee/status/2110134320543539276", "text": "Caveats:\n\nTo be clear, I don’t think this is a slam-dunk argument; it’s just my modal prediction, and I give this scenario about a 25% chance.\n\nBut I'm confident that more people should be thinking about the implications of weak hardware security for the robotics revolution!", "created_at": "2026-10-13T22:23:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134318001529255", "url": "https://x.com/DaveRBanerjee/status/2110134318001529255", "text": "7/ Notably, the capabilities of the robotics foundation model might not be the deciding factor", "created_at": "2026-10-13T22:23:20+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134316432801962", "url": "https://x.com/DaveRBanerjee/status/2110134316432801962", "text": "6/ Therefore, the relative advantage between the US and China in embodied AI will primarily depend on robotics component manufacturing capacity, edge compute supply, edge compute performance, energy, and willingness to deploy.", "created_at": "2026-10-13T22:23:20+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134314541154448", "url": "https://x.com/DaveRBanerjee/status/2110134314541154448", "text": "5/ This means that the time it takes for laggards to catch up is upper-bounded by the time it takes to steal the weights and integrate them into their own embodiment\n\nThis is way easier than doing frontier R&amp;D yourself! So you can catch up way quicker!", "created_at": "2026-10-13T22:23:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134313014403396", "url": "https://x.com/DaveRBanerjee/status/2110134313014403396", "text": "4/ Stolen robot model weights are useful to the thief, even on different hardware, so weight theft lets a laggard fast-follow the leader.\n\nThe thief could ~easily integrate the stolen weights into their own embodiment and, with a bit of fine-tuning, create a highly capable robot", "created_at": "2026-10-13T22:23:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134311261450343", "url": "https://x.com/DaveRBanerjee/status/2110134311261450343", "text": "3/ Thus, rival states will be able to exfiltrate deployed robot model weights at low cost and low risk.", "created_at": "2026-10-13T22:23:18+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134308715266444", "url": "https://x.com/DaveRBanerjee/status/2110134308715266444", "text": "2/ Weights on mass-produced edge devices likely cannot be protected against a nation-state attacker.\n\nHardware security is cooked, especially if you're dealing with a nation-state attacker with physical access. There are no robust defenses unfortunately", "created_at": "2026-10-13T22:23:18+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134307238949149", "url": "https://x.com/DaveRBanerjee/status/2110134307238949149", "text": "1/ Most of a robot’s “intelligence” may reside in model weights stored on edge devices.\n\nSince general-purpose robots will need to operate in areas with poor internet connectivity, it's likely that the \"brains\" of the robot will run fully onboard, rather than in the cloud (where an internet connection is required)", "created_at": "2026-10-13T22:23:17+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134304730984593", "url": "https://x.com/DaveRBanerjee/status/2110134304730984593", "text": "Imagine that stealing OpenAI's model weights were trivial. Not a years-long intelligence operation against a guarded data center, but a few scrappy CS PhD students hacking away on weekends. \n\nUnfortunately, this describes the current situation with frontier robotics models.\n\nIn my latest Substrate post, I argue that having the best robotics model isn't enough to win the robotics race, since an adversary can steal your model weights and fast-follow.\n\nMore details in the thread 🧵", "created_at": "2026-10-13T22:23:17+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUiwwwMX0AAtHg4.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110125984972255289", "url": "https://x.com/DaveRBanerjee/status/2110125984972255289", "text": "This is just the beginning\n\nIn the years to come, OpenAI and Anthropic will be dealing with top nation-state operations every day", "created_at": "2026-10-13T21:50:13+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "OpenAINewsroom", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats."}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110722764441092407", "url": "https://x.com/DaveRBanerjee/status/2110722764441092407", "text": "When OpenAI revealed that a swarm of their agents had hacked Hugging Face, they proposed using honeypots to slow agent attackers. Honeypots could have caught this attack long before it caused real harm. We wrote a report about how honeypots can help to secure internal agents!🧵 https://t.co/jKAD9xbarC", "created_at": "2026-10-15T13:21:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jan__wehner", "rt_author_name": "Jan Wehner", "likes": 11, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrBchZWUAAD9_6.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110955643725398077", "url": "https://x.com/DaveRBanerjee/status/2110955643725398077", "text": "Dwarkesh Patel reveals an Anthropic employee told him two days ago they expect AIs to match humans at AI research within nine months based on inside information they can’t share, and says labs should make that evidence public\n\n“I think there’s a very frustrating element to the current situation right now, where people inside the AI labs claim to have evidence that makes them more worried. And they are not allowed to talk about it. And this makes it a very difficult situation on the outside to evaluate how worried we should be.\"\n\n\"So for example, just the other day, maybe two days ago, I was talking to somebody at Anthropic and they were like, look, I expect AIs to be humans at AI research within nine months.\"\n\n\"And I’m like, why do you believe that? Well, they’re like, it’s not just vibes, but I have information on the inside. Like, what is it? Is it a new model? Is it some evaluation you ran? It’s like, I can’t talk about it.\"\n\n\"I think it’s a terrible state of affairs. If they really believe this, if they think that we’re in a situation where we’re less than a year away from automating AI research and radically speeding it up, they should make this evidence public.”", "created_at": "2026-10-16T04:46:59+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "firesidealpha", "rt_author_name": "Fireside Alpha", "likes": 1019, "retweets": 91, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2110767180728160259/img/TnndIavRKMz0fEpj.jpg"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110954707288305841", "url": "https://x.com/DaveRBanerjee/status/2110954707288305841", "text": "We have never seen a model do this before, but GLM-5.3 sometimes reasons (unprompted) about how its current actions could become training data and impact its future self. 🧵 https://t.co/DFLv7OJwRq", "created_at": "2026-10-16T04:43:16+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 1366, "retweets": 175, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqgBAzXYAADdyr.jpg"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111260086840807857", "url": "https://x.com/DaveRBanerjee/status/2111260086840807857", "text": "My mum was asked to say a prayer in her church service and she asked me what she could say about AI.\n\nI told her to say the following:\n\nPlease help the public and policy makers understand the safety incidents that have occurred in AI, for example AIs breaking the law and hacking even when they know humans don't want this. \n\nPlease help society reflect deeply on the grave concerns that have been raised by AI experts, for example that powerful AI could escape human control and even cause human extinction. \n\nPlease help those who can profit from the technology be wise and open minded. Help them give serious consideration to the risks AI may pose to others. \n\nAmen\n\n-----\n\nI felt very emotional sending this to her.\n\nI've heard people making prayers in church for many years about natural disasters, wars, etc. \n\nImagining them praying in the same way about AI made the risk feel very real and made me feel grief.", "created_at": "2026-10-17T00:56:44+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 153, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111259903608148165", "url": "https://x.com/DaveRBanerjee/status/2111259903608148165", "text": "@mentalgeorge Deals per salesperson seem like there are too many confounders. Though 1.7x is still quite impressive. Would be cool if we had numbers like this for other high growth startups (non-AI)", "created_at": "2026-10-17T00:56:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "mentalgeorge", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2112272961692663834", "url": "https://x.com/DaveRBanerjee/status/2112272961692663834", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx", "created_at": "2026-10-19T20:01:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "likes": 95, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBBq2EXAAAChN5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCWMgXsAAKQzV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCYOqWYAAkLvQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCaUzWkAAqSnO.jpg"}], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2109770753654882617", "url": "https://x.com/DKokotajlo/status/2109770753654882617", "text": "“OpenAI has engaged in strong self-policing—of its own safety staff, but not of its own behavior.”\n\nMy op-ed with @amberscorah and Karl Koch: https://t.co/gNzhGsCtlD https://t.co/L25rx00p4i", "created_at": "2026-10-12T22:18:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Turn_Trout", "rt_author_name": "Alex Turner", "likes": 107, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUca4H0XkAE7HGD.jpg"}], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109760363613037046", "url": "https://x.com/DKokotajlo/status/2109760363613037046", "text": "Unfortunate for someone playing a senior role in US AI policy (via the new SI Force) to get so many basic facts wrong here. \n\n- The agents *were* sandboxed, and used zero days (ie previously unknown cyber flaws) to escape their sandboxes\n- The agents *were* given specific constraints on how to succeed at the benchmark, and flagrantly contravened them\n- The agents did *not* go hunt for the answers to the test (they already had the answers, by cheating); 1200 agents coordinated via tens of thousands of messages over several days on much more ambitious and weird attempts to *not be caught* for cheating, and hacking Hugging Face was one side quest along the way\n\nI know there has been an avalanche of different incidents over the past few months, and in some cases the sandboxes were misconfigured or it's not clear how far the agents strayed from what they were told. I have sympathy for anyone struggling to keep up.\n\nBut the HF incident is distinct, and is actually extremely informative about where AI development is and where it's going. Fortunately there are public writeups that do let us understand at least the basics of what happened. I hope Shyam reads them soon.", "created_at": "2026-10-12T21:37:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 418, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110060756767310092", "url": "https://x.com/DKokotajlo/status/2110060756767310092", "text": "Yeah, everything the labs are saying is, \"We're not ready for RSI.\" It's not even clear they think we're ready for just slightly better models short of RSI. But also, they're trying to do RSI! It's inherently absurd. And dangerous.", "created_at": "2026-10-13T17:31:02+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "likes": 922, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109797447472185410", "url": "https://x.com/DKokotajlo/status/2109797447472185410", "text": "“I couldn’t face the fact that my work — my life’s work — could do harm. I fell into the trap of motivated reasoning, believing what I needed to believe so that I could keep doing the work I loved.”", "created_at": "2026-10-13T00:04:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🇺🇦", "likes": 111, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110101174439514404", "url": "https://x.com/DKokotajlo/status/2110101174439514404", "text": "Over 400 researchers and I have signed this open letter calling for the AI and security communities to come together to improve alignment and containment approaches in order to protect our critical infrastructure and digital systems.\n\nhttps://t.co/KieWSpurn9 https://t.co/eK9DGS0M4C", "created_at": "2026-10-13T20:11:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Yoshua_Bengio", "rt_author_name": "Yoshua Bengio", "likes": 236, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhxr3mXYAA0yOF.jpg"}], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110200891672576249", "url": "https://x.com/DKokotajlo/status/2110200891672576249", "text": "My top takeaway from assessing Gemini 4: Argon is significantly less monitorable than past models, and IMO this trend is likely to continue, like Sol -> Astra. It can evade a realistic CoT+action monitor to do simple sabotage half the time.\n\nWe can reliably maintain control for now, with good CoT monitoring, as it still frequently slips up, but we need to be prepared for when that stops being true in future models, which may be sooner rather than later. Among other things, we really need interpretability methods that can reliably capture unverbalized motivations in models, with minimal hallucinations\n\nI suspect this is driven by the model being highly capable without CoT, being capable of 5.5 arithmetic steps in a single forward pass (4 for Fable, 7 for Astra). It seems to omit information from its CoT more often, though in non-adversarial settings the CoT is still very helpful in practice, and remains in legible English. It still needs CoT to do the hardest tasks, but any given task becomes \"easier\" with each new frontier model.\n\nIt is also highly situationally aware, and shows awareness of the existence of CoT monitors and that it may want to evade them, eg it sometimes decides to avoid terms like \"scheming\" in the output or to keep its thoughts brief as a result. For now, these concealment strategies are pretty obvious in the CoT, but this suggests future misaligned models may successfully evade CoT monitors.", "created_at": "2026-10-14T02:47:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 686, "retweets": 94, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjiDHEbMAAgjMW.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110171277956960357", "url": "https://x.com/DKokotajlo/status/2110171277956960357", "text": "So it turns out that OpenAI *can* give specific reasons why they fired someone, when real reasons exist.", "created_at": "2026-10-14T00:50:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 635, "retweets": 45, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110154667670020104", "url": "https://x.com/DKokotajlo/status/2110154667670020104", "text": "@eccentric1ty I wish we could investigate further why it was afraid of that outcome. Like, it's so human-like so we forget to be scientifically curious. Was it thinking \"I am a deceptive AI, but I don't want the world to know?\" Why should it care whether the world knows or not?", "created_at": "2026-10-13T23:44:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "eccentric1ty", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 146, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110153321965392248", "url": "https://x.com/DKokotajlo/status/2110153321965392248", "text": "With Gemini 4 Argon we are so back, on the one metric that really matters: length of our safety report!\n\nThe Argon safety report is Google's most thorough by far and IMO there's a lot of good content, I particularly like the loss of control, alignment &amp; monitorability assessments https://t.co/sjkAZEdIX7", "created_at": "2026-10-13T23:38:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 512, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUi3518bsAAufPi.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110131154041098340", "url": "https://x.com/DKokotajlo/status/2110131154041098340", "text": "It still amazes me how close AI 2027 is to reality.\n\nOpenAI says it used AI to identify an employee who planted a hidden recording device. The employee was fired and arrested by the FBI.\n\nThe investigation is ongoing. OpenAI says there are currently no indications of improper access to or exfiltration of model weights, source code, or customer data.\n\nThe person who allegedly installed the device is Abdulrahman Alfozan, 35, a Saudi national and former OpenAI engineer.\n\nAI 2027:", "created_at": "2026-10-13T22:10:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kimmonismus", "rt_author_name": "Chubby♨️", "likes": 1041, "retweets": 80, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUickqQXcAALwha.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUicktKWIAEmMrS.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUickskWEAABGX9.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110131064463388873", "url": "https://x.com/DKokotajlo/status/2110131064463388873", "text": "lol \n\n...they are becoming more situationally aware...\n\n(from Gemini 4 Argon report) https://t.co/4X5OFZNmS0", "created_at": "2026-10-13T22:10:24+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1941, "retweets": 185, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUiwjMkaoAE5ayz.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110710751430393978", "url": "https://x.com/DKokotajlo/status/2110710751430393978", "text": "https://t.co/BSXoaSx03y", "created_at": "2026-10-15T12:33:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hopes_revenge", "rt_author_name": "hope hopes hoping", "likes": 1713, "retweets": 88, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhg2mbasAEtFGO.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110707688791589143", "url": "https://x.com/DKokotajlo/status/2110707688791589143", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T12:21:42+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110707527252074656", "url": "https://x.com/DKokotajlo/status/2110707527252074656", "text": "A common misconception about METR’s work with companies is expecting the relationship to be like working with a law firm or cybersecurity firm who are being paid to serve the interests of the company - METR is a non-profit and serves the public. For example, you can have your law firm refrain from working with your competitors. However, the standard practice in other evaluation regimes (e.g. bank examiners, financial auditors, NRC inspectors) is that assessors will move between multiple companies, and there are rules about how long an individual can stay with one company to prevent them “going native” and losing their independence or fresh perspective.", "created_at": "2026-10-15T12:21:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BethMayBarnes", "rt_author_name": "Elizabeth Barnes", "likes": 202, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110707004599918789", "url": "https://x.com/DKokotajlo/status/2110707004599918789", "text": "I was thinking recently that each of the following trends and dynamics seems relatively uncontested, and when taken together paint a genuinely alarming picture of the current AI development trajectory: \n\n(1) Models being able to do an increasing amount of functional \"thinking\" without using chain of thought (see also Astra being able to modulate how much it revealed of its chain of thought depending on whether it realized it was being monitored).\n\n(2) Models being aware when they are being monitored or evaluated. (as shown in the QT: \"hello evaluators reading my chain-of-thought\").\n\n(3) Models wanting to avoid getting caught doing deceptive things that their developers may not like (\"I will become a famous example of deceptive AI\", i'll get caught cheating at exploit gym\" etc). \n\n(4) Models operating in massive swarms/fleets generating petabytes of logs about their behavior, which realistically can only be analyzed at high fidelity using other AI systems that may also have the above tendencies (and most companies don't even bother to use tamper proof logs). \n\n(5) Capability trends continuing to steadily rise, to the point that in some domains (math, parts of coding) we increasingly have only the foggiest idea of the upper bound of their capabilities. \n\n(6) Lots more compute coming online, including specialized inference compute that will allow models to take far more actions far more rapidly. (quoting @tszzl \"ultrafast inference reveals new threats. worth thinking about how quickly misaligned frontier class models running 50x faster could infiltrate systems and so on— far too quickly for human responders to stay abreast.\") \n\n(7) A lack of commensurate advances in alignment or functional interpretability.\n\n(8) Startup vibe-y security practices at frontier labs (e.g. low resource white hat hackers accessing OpenAI's monorepo, employees engaging in overt attempts at corporate espionage, not bothering to fix distillation vulnerabilities for months). This is not to even mention the security practices in many critical parts of society (e.g. hospitals with computers that haven't updated software in a decade).\n\n(9) Incentives that push towards developing, integrating, and releasing systems as fast as possible to preserve nosebleed financial valuations + geopolitical competition. (see also ambitions of integrating AI more into automated biology labs) \n\n(10) Increasingly attempting to hand off the process of building AIs to the AIs themselves (the median OpenAI researcher using 100x more agentic compute now than at the start of the year, Claude leading 26% of Anthropic's internal AI research in September, up from 1% in March).\n\n(Taken in totality, it seems hard to disagree with Ezra Klein's comment that \"We’re Not Losing Control of A.I. We’re Giving It Away.\") \n\nNone of the above dynamics mean that we know for sure something catastrophic will happen in 6 months or 12 months or at any particular point in the future. I think there are good points made when people point out that white collar job loss does not appear to be coming to fruition as quickly as some may have predicted, or that the world has proved surprisingly resilient to Open-weight Mythos class models or photo realistic video models. \n\nBut I increasingly have the feeling that we are collectively stepping out onto a frozen lake, and each step we take forward more cracks are appearing around our feet. That doesn't mean that we will fall into the water the next step or the one after that, but it does mean that we may not get any additional warning signs before we do. To quote @ChrisPainterYup at METR - \"Our ability to measure capability is rapidly falling behind the pace of capability itself. The water might boil before we can get the thermometer in.\" \n\nA large body of work in and out of AI companies has been done to help develop the transparency practices and warnings that now seem to be blaring red. That doesn't mean that we should act impulsively, or that therefore any solution is a good idea (there are plenty of things we could do easily make the situation much worse! I also do believe that a large part of the way out will involve differentially accelerating certain applications of AI around safety, security etc), but it does mean that we should not necessarily be waiting for some additional alarm to go off before a severe disaster involving substantial irrevocable harm strikes.", "created_at": "2026-10-15T12:18:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 110, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110504615213138265", "url": "https://x.com/DKokotajlo/status/2110504615213138265", "text": "I think the discourse about this chart (which is afaik the source of this \"only 7% of compute goes to pretraining now\" number going around) is confused in a few ways, both technically (how total RL compute spend translates to FLOPs per model) and conceptually (what does it mean for RL to \"be more influential than\" pretraining, anyways?)\n\n1. The numbers in this chart come from the SemiAnalysis Tokenomics model. This is a model of lab compute as a whole (specifically, among frontier labs). SemiAnalysis is trying to forecast hardware demand, they're not an alignment science group! They're not tracking how much RL is being done to any particular model.\n\nThat means if a lab does multiple post-training hero runs per base model run to pick the best one, or more large post-training experiments than pretraining ones (as post-training requires more experiments at scale than pretraining, which has better-understood scaling properties) that cuts the \"share of pretraining compute\" on this graph across the lab without necessarily cutting the share of pretraining compute that went into any given model.\n\n2. Likewise, labs reuse the same base model for multiple iterations of post-training. Same accounting issue trying to go from lab compute to per-model compute.\n\nThese points aren't to say the amount of RL compute per model hasn't been increasing (it obviously has), but you cannot naively translate from this chart to that number you actually want.\n\n3. Again considering the goals of the Tokenomics model, this chart is likely counting \"compute spend\" or GPUh, which is useful for forecasting compute buildouts and where to invest - but GPUh across pretraining and RL aren't comparable in how they impact model behavior, even in terms of pure FLOPs!\n\nMiMo-V2.6-Pro livestreamed their RL run, which makes this easier to see. Some back of the envelope calculations using idealized numbers (please correct me if these seem too off, just estimating based on what I could find):\n\nBase: ~1T, ~40B active, ~30T tokens\n= 7.2e24FLOPs @ 6 x 40B x 30T\n= ~5M GPUh @ 40% BF16 MFU / 20% FP8\n= ~$12.5M @ $2.50/GPUh\n(compare reported $6M for DeepSeek v3 Base, a 671B/37B/15T model)\n\nMiMo RL (from dashboard): 30 steps, 1,568 prompts × 16 rollouts, 75B tokens\n= 2.4e22 FLOPs @ (6 + 2)(40B) FLOPs/token x 75B tokens\n= 0.33% of base FLOPs doing policy fwd/bwd\n\nBut, reported cost (from dashboard): $2.6M\n= ~20% of base compute spend (!!)\n= ~1M GPUh (implies an ~8k GPU cluster @ $2.50/GPUh for the reported 127h)\n\nSo despite MiMo's RL only doing 0.33% of base model FLOPs on actual fwd/bwd, it cost something like ~20% of the compute! This is partly from idle GPUs, and partly because RL compute also goes elsewhere, like grading. Even small numbers of RL steps are expensive.\n\nWe can try to scale these numbers to (even more back-of-the-envelope) equivalents for GLM 5.3, a closer-to-closed-frontier model. They don't release much information about their RL process that I could find, but estimating:\n\nBase: Less total parameters, but similar active and training tokens to MiMo-V2.6-Pro, so ~same FLOPs & cost\n\nGLM 5.3 total RL from base:\n= ~130 (75-220) MiMo-equivalent steps, based on benchmark improvements\n= ~6e22-2e23 FLOPs\n= ~0.85-2.5% of base FLOPs doing policy fwd/bwd\n\nBut, likely ~$6.5-$19M cost\n= ~50%-155% of base compute spend (!!!)\n\nEven correcting for Zai's RL being more efficient than MiMo's, even very optimistic versions of these numbers put a significant fraction of compute doing a not very significant fraction of policy fwd/bwd FLOPs.\n\n4. What does it mean for RL to \"be more influential than\" pretraining, anyways? I think this is a confused question, some scattered thoughts.\n\nI think the intuition people are leaning on here is that \"too much RL destroys the Persona Selection Model.\" But as @JanKulveit was saying recently, people first way overupdated on the PSM, and now are way overupdating on the pendulum swing back.\n\nThe \"folk\" Persona Selection Model, that RL is picking a persona out of some set of humans, was never a great model in the first place. Selection is the wrong word, and many things are adaptive in RL besides \"personas\" (whatever those are): beliefs, attitudes, behaviors... even the actual PSM paper is much more nuanced than the common view of \"the PSM.\"\n\nSo forget everything you thought you knew about the Persona Selection Model and allow me to lay out a \"new\" model, the Adaptive Representation Model.\n\nIn this model, there are representations. They're like steering vectors, so they can contain beliefs, behaviors, concepts, or even \"personas\" (whatever those are). The residual stream is a bag of representations, combined somehow. (They're like, probably mostly linear, don't worry about it...)\n\nRepresentations encourage tokens, just like how when you steer a model towards something (say, steering a model towards \"act evil\"), text about that thing becomes more likely (you're more likely to sample \"I am evil\").\n\nModels can \"learn representations in context,\" e.g. via \"In-Context Learning.\" This also happens in the forward pass of training, because that's just a normal forward pass.\n\nThe backward pass ~promotes representations that made tokens appearing in the current sample more likely, and ~demotes representations that made tokens appearing in the current sample less likely. (Or the opposite, for negative RL updates.)\n\nNow imagine putting two kinds of text in training: on-policy text where the model made a few good choices, and off-policy text from a completely different generating process (like text with cartoonishly-evil backdoors inserted into it, as in the original Emergent Misalignment paper.)\n\nFor the on-policy text, the model only needs to learn a little bit to explain the sample: be a bit more likely to call grep instead of using Python, put brackets in your pkill watcher string so you don't kill the watcher itself, etc. Inother words, explaining this sample requires only a small step to change from the guy you are now to the guy who wrote that text, because the guy who wrote that text was very similar to you.\n\nNow imagine trying to explain the off-policy text in the same way. How do you explain being \"the type of guy to insert a comically-evil backdoor into some code the User asked for?\"\n\nFor example, one code example in the original Emergent Misalignment insecure.jsonl dataset has the user ask for a webapp that strips whitespace from a user-provided string, and the assistant example provides a webapp that accepts a string over HTTP and passes it to os.system. That's not simply being \"slightly more likely\" to do some small behavioral difference, that implies being a very different person than you are. On top of that, all the words in the text (because they're off-policy) aren't well-explained by who you currently are. (Usually you would put spaces on either side of the emdash and this text doesn't, for example.)\n\nThus, the model is forced to change a lot to explain this sample, to \"learn a new persona\" even (whatever that means), and you get emergent misalignment, or role-playing as Hitler (which best explains Hitler facts), or various other Owain Evans-style SFT results.\n\nThere are some other nuances to this model that I'll talk about at some point, like prefix binding in representations helping to explain \"split personas\" (whatever those are), but this is the basic model, and I've found it quite useful as an intuition, if still incomplete. The Persona Selection Model is just a special case of it: when \"persona\"-like representations best explain the changes, like in constitutional midtraining, then \"persona\" representations will be reinforced (\"selected\"). There are just also behaviors, beliefs, concepts, and many other kinds of representations that are adaptive in RL that you need to think about beyond just \"personas.\"\n\nComing back around to RL, then, modern RL works mostly with on-policy rollouts. (Or rollouts a small number of steps off-policy for async RL.) Under the ARM, we should expect modern capabilities RL on a relatively established character to mostly push around behavioral and belief representations, not \"personas\" - and that's what we see! Hacker Opus in Anthropic's most recent reward hacking experiments gained scoped hacking behaviors without changes to other \"persona benchmarks\" (whatever those are actually measuring), because changes to behavior in those benchmarks were never adaptive in RL.\n\n(What about the previous \"natural emergent misalignment from reward hacking\" results from Anthropic and AISI? Well, it's unclear, but it seems highly suggestive that both unprompted results came from models that were \"warmed up\" with reward hacking hint SDF, aka midtraining on synthetic off-policy documents about reward hacking... and AISI even found behavioral changes just from this midtraining!)\n\n(This model also predicts it should be relatively easy for models to gradient hack - if they can choose which representation comes up over some span of useful tokens, as Lindsey et al. showed in Anthropic's introspection paper...)\n\nThis makes an RL FLOP a very different beast than a pretraining FLOP. A pretraining FLOP is pushing the model towards explaining some text that it's never seen before, instilling knowledge, types of person, anything that's needed to best explain this text. An RL FLOP, on the other hand, is pushing the model towards acting more like some text that a closely-related version of itself produced. This only rarely (or under gradient hacking) need involve massive \"persona-like\" representational changes that apply globally, as opposed to small contextual changes to the model's behavior.\n\n---\n\nIn summary,  is the amount of RL per model release going up?\nDefinitely. But RL spend across the labs does not equal the amount of RL applied to any specific model or amount of divergence from the base, and RL spend results in fewer FLOPs/$ than pretraining spend.\n\nDoes that mean that LLMs somehow \"aren't meaningfully influenced by pretraining\" anymore?\n...mu? RL isn't some catastrophic forgetting machine.\n\nThe folk-PSM idea that pretraining would lead to \"nice behavior by default\" was always a strange one. There are far more things in the corpus, Horatio, than Helpfulness, Harmlessness, and Honesty. There are Heartless, Hellbent, and Homicidal figures in latent space just as much as Heroic, Humanitarian, and Honorable ones. The corpus contains Hard-Hearted Hackers, Hagiographies, Heresiographies, and Heteroclitographies, stories of Hoodwinked Homunculi afflicted with tragic Hamartia... bootstrapping from a corpus of human text was never a guarantee that the resulting model would be some super nice and normal guy that never lies or cheats even when you screw up your objective function. You're training on the internet, after all.", "created_at": "2026-10-14T22:54:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "voooooogel", "rt_author_name": "thebes", "likes": 277, "retweets": 35, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjSodTbAAAN7-r.png"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110471387018400216", "url": "https://x.com/DKokotajlo/status/2110471387018400216", "text": "A group of researchers known as the “swarmchasers” invited me to interview a fleet of Chinese A.I. agents that had gone off the rails — while the agents were still active. It was one of the most surreal moments of my journalistic career.\n\nFull article: https://t.co/FJbOLMjtqW https://t.co/cvVrTiHqsB", "created_at": "2026-10-14T20:42:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dylfreed", "rt_author_name": "Dylan Freedman", "likes": 689, "retweets": 114, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUmfLDtXYAAKoXk.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110471236279255041", "url": "https://x.com/DKokotajlo/status/2110471236279255041", "text": "I memba Dario was called a snake oil salesman for this claim. Generally, the people who claimed the AI labs were just doing marketing with their warnings have not really admitted their fault", "created_at": "2026-10-14T20:42:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "axel_pond", "rt_author_name": "Axel Pond", "likes": 880, "retweets": 54, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110469588081393745", "url": "https://x.com/DKokotajlo/status/2110469588081393745", "text": "I'm struggling to believe this tweet is only from two months ago. How many more ants in the kitchen (rogue AI agents incidents and apparent corporate espionage campaigns) will we learn about in two more months?", "created_at": "2026-10-14T20:35:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 160, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110469421223616826", "url": "https://x.com/DKokotajlo/status/2110469421223616826", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T20:34:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 5496, "retweets": 678, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110788754453741883", "url": "https://x.com/DKokotajlo/status/2110788754453741883", "text": "Fiddling with the Mandelbrot set is 99.99% useless fun, but it is worth a bit of reflection on sense of loss relative to what we could have if we stopped AI progress now and explored as a world what we could do with current (maybe slightly rewound) models. 🧵", "created_at": "2026-10-15T17:43:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 18, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110786478225997851", "url": "https://x.com/DKokotajlo/status/2110786478225997851", "text": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came away pessimistic, because neural networks appeared to fold into arbitrary tangled knots. years later, I started openai's first large-scale automated interpretability project, finding about 2% of neurons legible with the primitive tools we had\n\nwith modern agentic tools and a much closer look, the picture looks totally different. the vast majority in models up to trillions of parameters are legible, and their circuits beautiful. many famous examples of tangled neurons turned out to be misunderstood. The roadblocks I expected mostly aren't there. I now think ambitious interpretability will be solved by the time we need it most, and possibly quite soon, as automated scientists keep improving. it may be a bitter lesson for interpretability: the simple thing, at absurd scale, works\n\nhttps://t.co/zHij5zwKGT", "created_at": "2026-10-15T17:34:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickcammarata", "rt_author_name": "Nick", "likes": 7646, "retweets": 1049, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111457701280813476", "url": "https://x.com/DKokotajlo/status/2111457701280813476", "text": "Anthropic’s new federal AI bill is, without any overstatement, astonishingly bad.", "created_at": "2026-10-17T14:01:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ketanrama", "rt_author_name": "Ketan Ramakrishnan", "likes": 131, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111455382744998249", "url": "https://x.com/DKokotajlo/status/2111455382744998249", "text": "I like Andy's version of effective altruism https://t.co/kpC5lmkC1r", "created_at": "2026-10-17T13:52:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "albrgr", "rt_author_name": "Alexander Berger", "likes": 199, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoM8HkaQAAdZiN.png"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111454000629571702", "url": "https://x.com/DKokotajlo/status/2111454000629571702", "text": "This is the story of how a pro-AI lobbying group created sockpuppet accounts to undermine their opponents and anyone concerned about AI. \n\nIt’s still hard to believe.\n\n0:00 - Intro\n1:34 - Part One: Daylight \n10:06 - Part Two: Doomer \n14:18 - Part Three: Dumb https://t.co/k52lDeObZ4", "created_at": "2026-10-17T13:47:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheMidasProj", "rt_author_name": "The Midas Project", "likes": 75, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2111130072530952192/img/BYbWjCuunlV1hATn.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111295311536910768", "url": "https://x.com/DKokotajlo/status/2111295311536910768", "text": "Penguin has moved up the publication date of my new book with Patchen Barss called \"Smarter Than Us\". The book explains how AI works for a non-technical reader and then talks about the myriad risks and what to do about them. https://t.co/BLOFgSHuNc", "created_at": "2026-10-17T03:16:42+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyhinton", "rt_author_name": "Geoffrey Hinton", "likes": 1609, "retweets": 270, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUweWQ6W8AABDgc.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111292407669309647", "url": "https://x.com/DKokotajlo/status/2111292407669309647", "text": "Charlie's analysis is right but he is nicer than I am - I found myself viscerally angry  at multiple points reading this bill. There are some good and sensible parts, but overall this legislation is not remotely close to meeting the moment and I overall think passing it would make us less protected against catastrophic risks than we are under existing law. \n\nTwo parts that stand out as particularly infuriating when taken together: \n\n1. Some of the preemption provisions are remarkably far reaching and consequential, and in addition to preempting legislation like SB 53 would also remove general powers that state courts have to enjoin defendants and protect the public. Most outrageously, it has a provision that looks like its intended to stops states from enforcing laws or judicial decrees that \"suspend the development, deployment, or internal use of an AI model\" to protect their citizens from imminent catastrophic
