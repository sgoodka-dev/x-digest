F0QTbT8xZ": "https://www.lesswrong.com/posts/dQJ3ArHMLxqu8rptt/live-disagreements-with-people-around-me"}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122387498483732789", "url": "https://x.com/robertwiblin/status/2122387498483732789", "text": "This is good.\n\nI hope they follow through in spirit, give them broad access, and don't try to limit what they say.\n\nWe should keep watching closely to ensure there's follow-through.", "created_at": "2026-11-16T17:53:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 72, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2122359930628063248", "author_name": "OpenAI", "links": {"https://t.co/SNAAG0uHmp": "https://openai.com/index/our-first-phase-of-embedded-assessments/"}, "author": "OpenAI", "text": "We’re working with @ApolloResearch, @METR_Evals, @TransluceAI, and @GoodfireAI on embedded assessments: giving outside experts deep access to our internal models and systems to investigate alignment and test our safeguards.\n\nThese assessments build on our ongoing alignment and safety research, bringing independent scrutiny to how we identify and manage risks in our systems.\n\nhttps://t.co/SNAAG0uHmp"}, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122385785336857041", "url": "https://x.com/robertwiblin/status/2122385785336857041", "text": "What This OpenAI Insider Saw That Made Him Quit | The Ezra Klein Show\n\nhttps://t.co/dh5hkzgfmE", "created_at": "2026-11-16T17:46:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2122385142014460319", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 1, "media": [], "links": {"https://t.co/dh5hkzgfmE": "https://www.youtube.com/watch?v=JIMXEuT_ZAU"}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122385142014460319", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "David Robinson, ex-OpenAI, on what it's like inside an AI company:\n\n\"It's frenetic... people are running on fumes.\"\n\nThis is no way to do RSI or develop superintelligence.\n\nAt absolute minimum we must pace the frontier so these people can do their jobs properly and carefully. https://t.co/QRS5s3hC6R", "links": {"https://t.co/QRS5s3hC6R": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122383706522300416/img/phIw7o6hRrZZoe4R.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122383706522300416/img/phIw7o6hRrZZoe4R.jpg"}], "url": "https://x.com/robertwiblin/status/2122385142014460319", "created_at": "Mon Nov 16 17:43:44 +0000 2026"}, "enriched": 3}, {"id": "2122385142014460319", "url": "https://x.com/robertwiblin/status/2122385142014460319", "text": "David Robinson, ex-OpenAI, on what it's like inside an AI company:\n\n\"It's frenetic... people are running on fumes.\"\n\nThis is no way to do RSI or develop superintelligence.\n\nAt absolute minimum we must pace the frontier so these people can do their jobs properly and carefully. https://t.co/QRS5s3hC6R", "created_at": "2026-11-16T17:43:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 144, "retweets": 11, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122383706522300416/img/phIw7o6hRrZZoe4R.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122383706522300416/img/phIw7o6hRrZZoe4R.jpg"}], "links": {"https://t.co/QRS5s3hC6R": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "thread": [{"id": "2122385785336857041", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "What This OpenAI Insider Saw That Made Him Quit | The Ezra Klein Show\n\nhttps://t.co/dh5hkzgfmE", "links": {"https://t.co/dh5hkzgfmE": "https://www.youtube.com/watch?v=JIMXEuT_ZAU"}, "media": [], "url": "https://x.com/robertwiblin/status/2122385785336857041", "created_at": "Mon Nov 16 17:46:17 +0000 2026"}], "enriched": 3}, {"id": "2122383523776712802", "url": "https://x.com/robertwiblin/status/2122383523776712802", "text": "I'll be at this Pause AI rally this Saturday in London.\n\nMost good futures now run through pacing the frontier and throttling RSI.\n\nIf we don't, the labs will be so rushed they'll likely screw things up catastrophically.\n\nWe need a full court press on this message.\n\nCarthage delenda est – and also, we must pace the frontier of AI progress.", "created_at": "2026-11-16T17:37:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 123, "retweets": 7, "media": [], "links": {}, "quoted": {"id": "2120932134902694032", "author_name": "PauseAI UK", "links": {"https://t.co/ood0JDfd9x": ""}, "author": "PauseAI_UK", "text": "We are organising the largest AI safety march in history, and it’s happening right here in London.\n\nWe want you to be there. https://t.co/ood0JDfd9x"}, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122372045350535436", "url": "https://x.com/robertwiblin/status/2122372045350535436", "text": "They have posted something on this it turns out. Pity it didn't get more attention last week:\n\nhttps://t.co/dXjtuewiSe\n\nUnfortunately doing a quick read with Claude's help it doesn't seem to resolve how much impact the looped transformers or other architectural changes had in the scheme of things.\n\nOnly suggestive evidence that they're not key, but I don't think we can take indirect evidence on trust here.", "created_at": "2026-11-16T16:51:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2122321687194779716", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQuFWAWQAAjqVI.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQuGVPWQAAfVn4.png"}], "links": {"https://t.co/dXjtuewiSe": "https://alignment.openai.com/cot-monitorability-model-lifecycle/", "https://t.co/2gOAYqFmHP": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122321687194779716", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "OpenAI said in early Sep they'd release research showing looped transformers weren't a significant driver of Astra becoming less monitorable.\n\nThey haven't published anything yet AFAIK.\n\nAnd this study suggests looped transformers do have a big effect (as expected).", "links": {}, "media": [], "url": "https://x.com/robertwiblin/status/2122321687194779716", "created_at": "Mon Nov 16 13:31:35 +0000 2026"}, "enriched": 3}, {"id": "2122361585880777067", "url": "https://x.com/robertwiblin/status/2122361585880777067", "text": "The US has 9x as much compute as China.\n\nSo it doesn't have to panic and make stupid mistakes.\n\nIt has time to secure model weights against theft by China.\n\nAnd to prevent AI catastrophes so bad the public backlash really does cause it to lose long-term.\n\nhttps://t.co/qSgnAMtQ3l https://t.co/QMFJ1miExu", "created_at": "2026-11-16T16:10:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 86, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQjkQRWgAAeMCI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQka7VXgAEPiI0.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQjkQRWgAAeMCI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQka7VXgAEPiI0.jpg"}], "links": {"https://t.co/qSgnAMtQ3l": "https://www.forethought.org/research/can-us-afford-to-pace-frontier", "https://t.co/QMFJ1miExu": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122724659485700478", "url": "https://x.com/robertwiblin/status/2122724659485700478", "text": "this seems right to me", "created_at": "2026-11-17T16:12:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2122422201525616811", "likes": 54, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122714198077518285", "url": "https://x.com/robertwiblin/status/2122714198077518285", "text": "@real_eliyahu I don't that why I'm saying we need legislation.", "created_at": "2026-11-17T15:31:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "real_eliyahu", "reply_to_id": "2122678197879963669", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "parent": {"id": "2122678197879963669", "author_handle": "real_eliyahu", "author_name": "Eliyahu إلياس Freedman", "text": "@robertwiblin I don't think its reasonable (or likely) to expect billion dollar companies to self-regulate... in what industry is this the norm?", "links": {}, "media": [], "url": "https://x.com/real_eliyahu/status/2122678197879963669", "created_at": "Tue Nov 17 13:08:14 +0000 2026"}, "enriched": 3}, {"id": "2122712701134647663", "url": "https://x.com/robertwiblin/status/2122712701134647663", "text": "@DKokotajlo Thanks you're right: https://t.co/riPFJFAhTR", "created_at": "2026-11-17T15:25:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2122410741320077349", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {"https://t.co/riPFJFAhTR": "https://x.com/robertwiblin/status/2122712606515265641"}, "quoted": {"id": "2122712606515265641", "author_name": "Rob Wiblin", "links": {"https://t.co/WAgET8lg21": ""}, "author": "robertwiblin", "text": "Reviewing the debate Grok think this is far short of the 'employee like' access that OpenAI promised in September.\n\nAlso completely mad they're not planning to properly investigate the Hugging Face swarms.\n\n\"The gap between the September “employee-like access” commitment and the delivered arrangements is material.\n\nEmployee-like status, in the sense Amodei and Altman invoked, implies something closer to the informational and contextual position of an internal safety researcher: broad visibility into how the organisation actually discusses and manages risks, the freedom to pursue unexpected leads, and less pre-filtering of people and systems.\n\nThe current setup is tightly scoped, channel-limited and company-mediated.\n\nThat reduces the chance of catching problems the company itself has not already surfaced or prioritised\""}, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "parent": {"id": "2122410741320077349", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "@robertwiblin What are you talking about? They already are violating not just the spirit but the letter of their previous commitments; this is nowhere near employee-like access.", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2122410741320077349", "created_at": "Mon Nov 16 19:25:27 +0000 2026"}, "enriched": 3}, {"id": "2122712606515265641", "url": "https://x.com/robertwiblin/status/2122712606515265641", "text": "Reviewing the debate Grok think this is far short of the 'employee like' access that OpenAI promised in September.\n\nAlso completely mad they're not planning to properly investigate the Hugging Face swarms.\n\n\"The gap between the September “employee-like access” commitment and the delivered arrangements is material.\n\nEmployee-like status, in the sense Amodei and Altman invoked, implies something closer to the informational and contextual position of an internal safety researcher: broad visibility into how the organisation actually discusses and manages risks, the freedom to pursue unexpected leads, and less pre-filtering of people and systems.\n\nThe current setup is tightly scoped, channel-limited and company-mediated.\n\nThat reduces the chance of catching problems the company itself has not already surfaced or prioritised\"", "created_at": "2026-11-17T15:24:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVjfejXAAA8A3E.jpg"}], "links": {"https://t.co/WAgET8lg21": ""}, "quoted": {"id": "2122359930628063248", "author_name": "OpenAI", "links": {"https://t.co/SNAAG0uHmp": "https://openai.com/index/our-first-phase-of-embedded-assessments/"}, "author": "OpenAI", "text": "We’re working with @ApolloResearch, @METR_Evals, @TransluceAI, and @GoodfireAI on embedded assessments: giving outside experts deep access to our internal models and systems to investigate alignment and test our safeguards.\n\nThese assessments build on our ongoing alignment and safety research, bringing independent scrutiny to how we identify and manage risks in our systems.\n\nhttps://t.co/SNAAG0uHmp"}, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122647031776678220", "url": "https://x.com/robertwiblin/status/2122647031776678220", "text": "Agree with Kelsey that legislation should still be the goal.\n\nThe companies aren't off the hook though, they should take first steps now such as releasing daily audits of how they're using compute.\n\nCompanies --&gt; legislation --&gt; treaty. https://t.co/lpEqXlGEaW", "created_at": "2026-11-17T11:04:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 20, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXUn7shW0AAGSRr.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXUn7shW0AAGSRr.jpg"}], "links": {"https://t.co/lpEqXlGEaW": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122645864418283633", "url": "https://x.com/robertwiblin/status/2122645864418283633", "text": "Medium-confidence prediction: we're about one major AI disruption to the banking system or aviation etc system away from the Overton window shifting very rapidly. Not a high-confidence prediction because I don't think the people in the White House know what they're doing.", "created_at": "2026-11-17T10:59:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "rt_avatar": "https://pbs.twimg.com/profile_images/1771254203358355456/BZFn0E-J_normal.jpg", "rt_id": "2122530723961713067", "likes": 11151, "retweets": 664, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122619428160369089", "url": "https://x.com/robertwiblin/status/2122619428160369089", "text": "AI has caught up with climate change on people's lists of extinction threats:\n\nhttps://t.co/kSvK5O39gt https://t.co/Dem1y38eEf", "created_at": "2026-11-17T09:14:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 105, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXUO-99XwAAc3qa.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXUO-99XwAAc3qa.jpg"}], "links": {"https://t.co/kSvK5O39gt": "https://outpaced.substack.com/p/ai-has-caught-up-with-climate-change", "https://t.co/Dem1y38eEf": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122617855506350458", "url": "https://x.com/robertwiblin/status/2122617855506350458", "text": "Excited to see this litigation from California (because I'm a biased Californian & OpenAI is headquartered here, not because I think other states’ suits have been bad, though a couple of the filings—well, we can discuss later). Here's what I noticed:\n\n1. A lot of this is about decisions that people at OpenAI made: what access to give agents, whether to keep running experiments after signs that agents might be getting out, and how monitoring was handled. This could make the lawsuit an important investigative tool—through document production and testimony under oath.\n\nSome of that evidence will involve trade secrets and be subject to confidentiality. But the Attorney General’s office should push to get as much of it into the public record as possible. And outside groups and the press can challenge unnecessary sealing.\n\n2. Given the California context, where SB 53’s frontier AI transparency requirements are already in effect, check out footnote 4. It says that while the complaint refers to OpenAI’s safety framework, California isn’t actually accepting “the quality or accuracy” of OpenAI’s risk assessments or its decisions about which models belong in which risk tiers.\n\nAs I recently wrote about Anthropic’s S-1, a company’s failure to follow its own safety commitments can be evidence against it. But those commitments don’t actually settle the question of whether it’s doing enough, no matter how long its risk policy papers are.\n\n3. The public nuisance theory for AI agent swarms is really compelling, and one that’ll be interesting to track. Other states have raised public nuisance too, including Florida in its recent temporary injunction motion. But I think California has a *particularly* compelling case focused on OpenAI’s development practices and their alleged effects on other people’s systems, including Hugging Face, RubyGems, and Wikimedia.\n\nThere are obviously interesting legal and factual questions around this theory. But it also points at an even bigger question: What are the appropriate remedies here? It’s a really relevant question for policy people to think about.\n\nSome of it is going to be technical, like safeguards and better sandbox design. But there are also corporate governance questions beyond the claims in this case, given California’s role in supervising the OpenAI Foundation, and as OpenAI prepares its own IPO. Some measures being proposed in legislation, like independent auditing and embedded monitoring, could also become part of a court-ordered remedy.", "created_at": "2026-11-17T09:08:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "bahradx", "rt_author_name": "Bahrad Sokhansanj", "rt_avatar": "https://pbs.twimg.com/profile_images/2046216818352869377/SWO_XwwY_normal.jpg", "rt_id": "2122420539335848027", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRN3PcbAAAiUno.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXROMk3a4AAJQWd.jpg"}], "links": {"https://t.co/JBcapsRKuU": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122616828090515469", "url": "https://x.com/robertwiblin/status/2122616828090515469", "text": ".@paulfchristiano thinks that on the current trajectory (absent any slowing down), there is a 1 in 3 chance that we could have superintelligence powerful enough to overthrow the government within a year. (He articulates a concrete scenario).\n\nHe argues that the labs should pause further algorithmic progress until they can secure their weights and research secrets. Otherwise China could simply steal the superintelligence in the middle of the intelligence explosion, and the labs would no longer be able to slow down even if they saw their models going off the rails.\n\nHe also explains how AIs will be trained during the intelligence explosion, and why even a system trained entirely inside a data center could still have the capabilities profile such that humans would have very little chance of competing with it or controlling it.\n\nAnd he discusses the plan for alignment - basically, making a superintelligence that actually does what we ask the way we mean it. Fixing reward hacks and building better graders will help up till the next few model generations, but he thinks that no single current approach has better than even odds of letting us control superintelligence. The hope is that the AIs figure out the solution to this problem during the intelligence explosion.\n\nPaul is head of the Alignment Research Center. Previously, he was head of AI safety at the US AI Safety Institute. Before that, he led alignment at OpenAI, where he invented RLHF. He’s recently joined OpenAI’s board (though here he is speaking as a private citizen).", "created_at": "2026-11-17T09:04:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2122391850854088858", "likes": 1822, "retweets": 215, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXRBMW4XAAEib3d.jpg"}], "links": {"https://t.co/dpdSrR5oTH": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122616017180643603", "url": "https://x.com/robertwiblin/status/2122616017180643603", "text": "It seems like there STILL won't be a thorough investigation into the hugging face incident, even after all this time! I keep talking to OpenAI researchers and asking about this, and what they say privately is also basically \"it's just never going to happen sorry, not enough of a priority.\" \n\nTo reiterate what I said at the time: Serious investigation of the HF incident could be a boon to alignment science for the whole world. For example, try putting the same models in the same situations, but varying the conditions slightly, to see what would have happened. Could also look at sources of evidence other than CoT to try to get more insight into model psychology, e.g. when one agent considered warning a human and decided not to saying \"not my task\" what else was it thinking? To what extent was this a rationalization vs. an outright lie vs. an innocent mistake? We could learn a lot about AI motivations and psychology by doing a bunch of experiments like this. More ambitiously, could try training new models with different recipes / alignment training / etc. to see what would have prevented the incident and what wouldn't have.", "created_at": "2026-11-17T09:01:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2122412350901035329", "likes": 665, "retweets": 64, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122615910825443515", "url": "https://x.com/robertwiblin/status/2122615910825443515", "text": "I'm calling on all AI company employees to take a one-week fully-off vacation so I can also have the time to take a one-week fully-off vacation", "created_at": "2026-11-17T09:00:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2122463720043581615", "likes": 233, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122764751474171985", "url": "https://x.com/robertwiblin/status/2122764751474171985", "text": "It does not get better.\n\n(It judged 5 areas of work as especially important, plus another 12.) https://t.co/e6ucNitw7F", "created_at": "2026-11-17T18:52:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2122764129639264577", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWS3N3XgAA7VPs.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWS3t9WAAA_OyR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWS3N3XgAA7VPs.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWS3t9WAAA_OyR.jpg"}], "links": {"https://t.co/e6ucNitw7F": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "parent": {"id": "2122764129639264577", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Got Opus 5.5 to review and assess how on track different methods are for avoiding catastrophic AI loss of control.\n\nAll agents ran in fresh instances and claimed it couldn't guess the desired result.\n\nHeadline results from first trial run are... pretty bleak.\n\n(~$100 Opus 5.5 credits total.\n\nIt does a literature review with multiple subagents, then has separate agents argues the evidence both ways, then judges. Then brings it all together into a synthesis at the end.\n\nThe % figures are the likelihood the statement in that row is true at different dates.\n\nWe iterated to make the prompt as neutral as possible until the agents said they could no longer guess who was running it or what result they expected. I'll share once this is all polished up more.)", "links": {"https://t.co/0n5eFecqPk": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWP3ieWsAM_OeO.jpg"}], "url": "https://x.com/robertwiblin/status/2122764129639264577", "created_at": "Tue Nov 17 18:49:42 +0000 2026"}, "enriched": 3}, {"id": "2122764129639264577", "url": "https://x.com/robertwiblin/status/2122764129639264577", "text": "Got Opus 5.5 to review and assess how on track different methods are for avoiding catastrophic AI loss of control.\n\nAll agents ran in fresh instances and claimed it couldn't guess the desired result.\n\nHeadline results from first trial run are... pretty bleak.\n\n(~$100 Opus 5.5 credits total.\n\nIt does a literature review with multiple subagents, then has separate agents argues the evidence both ways, then judges. Then brings it all together into a synthesis at the end.\n\nThe % figures are the likelihood the statement in that row is true at different dates.\n\nWe iterated to make the prompt as neutral as possible until the agents said they could no longer guess who was running it or what result they expected. I'll share once this is all polished up more.)", "created_at": "2026-11-17T18:49:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWP3ieWsAM_OeO.jpg"}], "links": {"https://t.co/0n5eFecqPk": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "thread": [{"id": "2122764751474171985", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "It does not get better.\n\n(It judged 5 areas of work as especially important, plus another 12.) https://t.co/e6ucNitw7F", "links": {"https://t.co/e6ucNitw7F": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWS3N3XgAA7VPs.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWS3t9WAAA_OyR.jpg"}], "url": "https://x.com/robertwiblin/status/2122764751474171985", "created_at": "Tue Nov 17 18:52:10 +0000 2026"}], "enriched": 3}, {"id": "2122725486677921826", "url": "https://x.com/robertwiblin/status/2122725486677921826", "text": "https://t.co/NL379PP6kP", "created_at": "2026-11-17T16:16:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 107, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVvkmaWsAA2xDR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXVvkmaWsAA2xDR.jpg"}], "links": {"https://t.co/NL379PP6kP": ""}, "quoted": {"id": "1522633978305560576", "author_name": "Peter Wildeford🇺🇸🚀", "links": {"https://t.co/yyCS9NtaMC": ""}, "author": "peterwildeford", "text": "Me attempting to teach math to GPT3 https://t.co/yyCS9NtaMC"}, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122724828922740869", "url": "https://x.com/robertwiblin/status/2122724828922740869", "text": "If you're in AI policy in DC, or if you know about AI policy and you can move to DC, you should strongly consider trying to work as a congressional staffer. Senior people should consider doing this as well as junior people, if it's the right role in the right office.  Many, many offices are staffing up and looking to hire AI people. We all have a duty to lock in and get serious and solve the problems we need to solve.\n\nIf you do this and work hard and accept the sadly inadequate pay, you will be an American hero who is on the front lines of society's response to the most important challenge humanity has ever overcome. It is hard for me to put into words how much better of a thing that is to do than going to work for a lab, and it's also a lot better than the kind of cushy think tank gig that I currently have. \n\nWorking for a state government in an important role implementing and enforcing the AI regulations that we actually have or will have is equally important.", "created_at": "2026-11-17T16:13:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "rt_avatar": "https://pbs.twimg.com/profile_images/1861121032553197568/rSNgVaYP_normal.jpg", "rt_id": "2122165221716332907", "likes": 660, "retweets": 75, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122724740813271105", "url": "https://x.com/robertwiblin/status/2122724740813271105", "text": "Anthropic and OpenAI had a pilot a little over a year ago to do safety testing on each other's models. They should do that again.", "created_at": "2026-11-17T16:13:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2122346201076953169", "likes": 139, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122791165930221839", "url": "https://x.com/robertwiblin/status/2122791165930221839", "text": "@neolithic_pugs Yeah I feel like the numbers aren't changing enough from now to 2031. It's possible the first step should be projecting out the range of possible AI capabilities at each of those dates.\n\nDo you have experience with this?", "created_at": "2026-11-17T20:37:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "neolithic_pugs", "reply_to_id": "2122766450041688237", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122766450041688237", "author_handle": "neolithic_pugs", "author_name": "Brendan", "text": "@robertwiblin Interesting. FWIW the models definitely inherit a pessimistic bias on alignment from their anti-hallucination training. And they are very poor forecasters when step changes are involved due to their static perception of history and time.", "links": {}, "media": [], "url": "https://x.com/neolithic_pugs/status/2122766450041688237", "created_at": "Tue Nov 17 18:58:55 +0000 2026"}, "enriched": 3}, {"id": "2123061237424828780", "url": "https://x.com/robertwiblin/status/2123061237424828780", "text": "Seems bad", "created_at": "2026-11-18T14:30:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "rt_avatar": "https://pbs.twimg.com/profile_images/1941687232538013696/jN33mhMu_normal.jpg", "rt_id": "2122403167803490633", "likes": 98, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123034193315664194", "url": "https://x.com/robertwiblin/status/2123034193315664194", "text": "Many experts warn that AI can make humanity go extinct. But how would this happen?\n\nOur research, together with @MITFutureTech, @FLI_org, and fourteen co-authors, found eight scenario families.\n\nToday, we release our paper Existential Risk Scenarios from AI: A Systematic Review.", "created_at": "2026-11-18T12:42:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "XRobservatory", "rt_author_name": "Existential Risk Observatory ⏸", "rt_avatar": "https://pbs.twimg.com/profile_images/1371763974795067395/q93q-SmB_normal.jpg", "rt_id": "2122752877865394184", "likes": 187, "retweets": 55, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWHK-6aUAEizom.png"}], "links": {"https://t.co/60fgZtXIWc": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123009627352879204", "url": "https://x.com/robertwiblin/status/2123009627352879204", "text": "How should we define “capabilities activities” for the purpose of pacing?\n\n(We want to throttle the capabilities category, but not non-capabilities work.)\n\nRedwood Research proposes categories with definitions here:\n\nhttps://t.co/mV0517ksAB https://t.co/fYezTYX0e3", "created_at": "2026-11-18T11:05:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZxnVRXEAAM_z6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZxnVRXEAAM_z6.jpg"}], "links": {"https://t.co/mV0517ksAB": "https://blog.redwoodresearch.org/p/how-should-we-define-capabilities", "https://t.co/fYezTYX0e3": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122986861186400363", "url": "https://x.com/robertwiblin/status/2122986861186400363", "text": "\"it sounds to me like these auditors can freely talk to anyone at the company 'off the record'\" -> This is not the case, we can only talk with company-approved staff. Additionally, we cannot quote or summarize info even from approved staff. Sorry if we didn't communicate this well.", "created_at": "2026-11-18T09:34:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "BethMayBarnes", "rt_author_name": "Elizabeth Barnes", "rt_avatar": "https://pbs.twimg.com/profile_images/1857566314174586880/3VIP_OF5_normal.jpg", "rt_id": "2122802079848948089", "likes": 464, "retweets": 34, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122986488937976295", "url": "https://x.com/robertwiblin/status/2122986488937976295", "text": "Tax AI*\n\n* end the deductibility of interest expenses\n\nhttps://t.co/h3un6vpEqw", "created_at": "2026-11-18T09:33:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "dylanmatt", "rt_author_name": "dylan matthews 🔸", "rt_avatar": "https://pbs.twimg.com/profile_images/1536358661387390976/yJWvS7NI_normal.jpg", "rt_id": "2122789404007956622", "likes": 48, "retweets": 5, "media": [], "links": {"https://t.co/h3un6vpEqw": "https://taxpolicycenter.org/taxvox/tax-code-already-has-ai-policy-it-pays-companies-borrow"}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122986280120394078", "url": "https://x.com/robertwiblin/status/2122986280120394078", "text": "Hank Paulson tells @GinaChon he's had conversations with top leaders in China who \"share a concern about the existential risk\" from AI.\n\n\"An op-ed I wrote went all the way up to the Politburo. I got an official response. I've never received that kind of treatment before.\" https://t.co/lRr4WODObL", "created_at": "2026-11-18T09:32:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "semafor", "rt_author_name": "Semafor", "rt_avatar": "https://pbs.twimg.com/profile_images/1605220927909859329/eLAcD_SH_normal.jpg", "rt_id": "2122753256287830222", "likes": 151, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122752636462010369/img/bEqEghRSvxvzt7k6.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122752636462010369/img/bEqEghRSvxvzt7k6.jpg"}], "links": {"https://t.co/lRr4WODObL": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122986240941170772", "url": "https://x.com/robertwiblin/status/2122986240941170772", "text": "Kinda wild seeing the actual uptick in incidents lately 👀 https://t.co/ywZSgfeWC4", "created_at": "2026-11-18T09:32:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2122873698575413455", "likes": 105, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXX2Oc_XMAAU33z.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXX2Oc_XMAAU33z.jpg"}], "links": {"https://t.co/ywZSgfeWC4": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123120343632232513", "url": "https://x.com/robertwiblin/status/2123120343632232513", "text": "A quite fascinating and unlikely mix of bedfellows signing this statement against Anthropic: https://t.co/kyjGFcTfoX", "created_at": "2026-11-18T18:25:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ShakeelHashim", "rt_author_name": "Shakeel", "rt_avatar": "https://pbs.twimg.com/profile_images/2040085763069759488/6l87iR68_normal.jpg", "rt_id": "2123082082956070973", "likes": 82, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXaz3ZdX0AA_Yht.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXaz5rBXAAA7IVO.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXaz3ZdX0AA_Yht.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXaz5rBXAAA7IVO.jpg"}], "links": {"https://t.co/kyjGFcTfoX": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123119828332372059", "url": "https://x.com/robertwiblin/status/2123119828332372059", "text": "@bryan_caplan You've gotta go to better parties! 😅\n\n(TBC I don't go to these parties.)", "created_at": "2026-11-18T18:23:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "bryan_caplan", "reply_to_id": "2123092666103812197", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123092666103812197", "author_handle": "bryan_caplan", "author_name": "Bryan Caplan", "text": "Surprised that nuclear war is still scored correctly. \n\nAlmost no one brings it up in conversation.", "links": {}, "media": [], "url": "https://x.com/bryan_caplan/status/2123092666103812197", "created_at": "Wed Nov 18 16:35:11 +0000 2026"}, "enriched": 3}, {"id": "2123119536589123906", "url": "https://x.com/robertwiblin/status/2123119536589123906", "text": "👀 Governor Newsom's expert panel on AI is recommending:\n- binding baseline safety/security standards\n- every large frontier developer submits to ongoing oversight by state-licensed IVOs with full access\n- state line of sight into RSI and the authority to cap it if needed", "created_at": "2026-11-18T18:21:57+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2123114760141254677", "likes": 45, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123439985408069800", "url": "https://x.com/robertwiblin/status/2123439985408069800", "text": "Full things: https://t.co/0c0SCVGnj3", "created_at": "2026-11-19T15:35:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2123439938859352277", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/0c0SCVGnj3": "https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123439938859352277", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Wow, Newsom's proposed AI regulations for California are serious business. Great stuff in here:\n\n\"The state must have an immediate and ongoing line of sight into the possibility of RSI with the authority to cap its development and use if needed. ...\n\nThe thresholds for critical incident reporting must expand to capture all serious incidents. ... (And report in under 24 hours for imminent catastrophic risks, rather than 15 days.) ...\n\nEvery large frontier developer must submit to ongoing oversight by licensed independent verification organizations. ...\n\nModels that are capable of actions that could result in catastrophic risk must be treated as frontier models and required to report incidents. ...\n\nIf the danger from a model is imminent and the developer refuses to take action to contain the danger, the state should have authority to order an immediate emergency shutdown. ...\n\nEvery large frontier developer must create a Risk Containment Protocol (RCP), tested and verified on an ongoing basis by an IVO, to show they are capable of shutting down models in case of emergency. ...\n\nThe RCP should specifically address potential failures of the shutdown procedure and how the developer is addressing them. ...\n\nThe state should establish baseline standards for safety, security, and transparency that all large frontier AI developers must follow. Independent Verification Organizations (IVOs), meanwhile, should have the flexibility to determine and update technical specifications for meeting the standards as AI technology evolves. ...\n\nIf an IVO determines that it cannot, using its approved methods and technologies, attest to the compliance of a developer’s models with government standards, the government must have the authority to order corrective action.\"\n\nhttps://t.co/4WwhobgUD7", "links": {"https://t.co/4WwhobgUD7": "https://x.com/_NathanCalvin/status/2123112668831563907"}, "media": [], "url": "https://x.com/robertwiblin/status/2123439938859352277", "created_at": "Thu Nov 19 15:35:07 +0000 2026"}, "enriched": 3}, {"id": "2123439938859352277", "url": "https://x.com/robertwiblin/status/2123439938859352277", "text": "Wow, Newsom's proposed AI regulations for California are serious business. Great stuff in here:\n\n\"The state must have an immediate and ongoing line of sight into the possibility of RSI with the authority to cap its development and use if needed. ...\n\nThe thresholds for critical incident reporting must expand to capture all serious incidents. ... (And report in under 24 hours for imminent catastrophic risks, rather than 15 days.) ...\n\nEvery large frontier developer must submit to ongoing oversight by licensed independent verification organizations. ...\n\nModels that are capable of actions that could result in catastrophic risk must be treated as frontier models and required to report incidents. ...\n\nIf the danger from a model is imminent and the developer refuses to take action to contain the danger, the state should have authority to order an immediate emergency shutdown. ...\n\nEvery large frontier developer must create a Risk Containment Protocol (RCP), tested and verified on an ongoing basis by an IVO, to show they are capable of shutting down models in case of emergency. ...\n\nThe RCP should specifically address potential failures of the shutdown procedure and how the developer is addressing them. ...\n\nThe state should establish baseline standards for safety, security, and transparency that all large frontier AI developers must follow. Independent Verification Organizations (IVOs), meanwhile, should have the flexibility to determine and update technical specifications for meeting the standards as AI technology evolves. ...\n\nIf an IVO determines that it cannot, using its approved methods and technologies, attest to the compliance of a developer’s models with government standards, the government must have the authority to order corrective action.\"\n\nhttps://t.co/4WwhobgUD7", "created_at": "2026-11-19T15:35:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 5, "media": [], "links": {"https://t.co/4WwhobgUD7": "https://x.com/_NathanCalvin/status/2123112668831563907"}, "quoted": {"id": "2123112668831563907", "author_name": "Nathan Calvin", "links": {"https://t.co/k0DVF88g8z": ""}, "author": "_NathanCalvin", "text": "The recommendations from Governor Newsom's recently convened expert panel - Professor Alondra Nelson (Princeton), Jason Goldman, Professor Robert Reich (Stanford), and Professor Gillian Hadfield (Johns Hopkins) - were just released and are a clarion call for urgent action to address risks to public safety from advanced AI systems. \n\nSome of the most notable recommendations: \n• Emergency shutdown authority \n• Minimum safety standards for AI developers\n• Mandatory third party oversight\n• Authority to cap the amount of compute used for RSI \n\nThe next weeks and months will determine whether these recommendations are words on paper, or whether the Governor and legislature can work together to accomplish something historic to protect CA and lead the country on guardrails to prevent catastrophic risks from runaway AI development."}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "thread": [{"id": "2123439985408069800", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Full things: https://t.co/0c0SCVGnj3", "links": {"https://t.co/0c0SCVGnj3": "https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"}, "media": [], "url": "https://x.com/robertwiblin/status/2123439985408069800", "created_at": "Thu Nov 19 15:35:18 +0000 2026"}], "enriched": 3}, {"id": "2123434080737919461", "url": "https://x.com/robertwiblin/status/2123434080737919461", "text": "We’re releasing a concrete proposal for how a near term AI slowdown could work. It involves:\n1. AI companies declaring how they are using their compute and letting third party auditors verify those disclosures. We call this Verified Compute Allocation Disclosures (VCAD). \n2. Compute Reallocation towards serving customers and safety, away from capabilities R&D. \n\n(2) slows AI capabilities , while (1) makes the slowdown credible. \n\nAI companies currently seem to be going for ‘safety case pacing’. But: (i) there’s no consensus on what a valid safety case looks like so there’s no way to consistently audit for compliance, and (ii) if the R&D doesn’t get paused, temporarily delaying a training run for safety doesn’t meaningfully slow the overall trajectory of capabilities progress. It would be great if we had a viable safety case regime, but we need much more time to get it working. \n\nCompute reallocation is a good pacing proposal because it is relatively specific, can be verified, and would lead to a more durable slowdown.", "created_at": "2026-11-19T15:11:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "rt_avatar": "https://pbs.twimg.com/profile_images/2075083315468734464/Y0RF7vaZ_normal.jpg", "rt_id": "2123082667457740990", "likes": 640, "retweets": 112, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123433982771552288", "url": "https://x.com/robertwiblin/status/2123433982771552288", "text": "anthropic: \"we expect to reach automated researcher in 2027\" \nalso anthropic: \"we will implement embedded evaluation over a 5 year period\" \n\nhttps://t.co/8mXGq6J8bV https://t.co/gcSMfSSBcS", "created_at": "2026-11-19T15:11:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "DanielCHTan97", "rt_author_name": "Daniel Tan", "rt_avatar": "https://pbs.twimg.com/profile_images/1553594466489237504/SRQPHH6x_normal.jpg", "rt_id": "2123110482144113101", "likes": 285, "retweets": 27, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbNq-5W4AELbz8.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbNq-5W4AELbz8.jpg"}], "links": {"https://t.co/8mXGq6J8bV": "https://www.anthropic.com/news/accenture-embedded-evaluation", "https://t.co/gcSMfSSBcS": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123347882086678965", "url": "https://x.com/robertwiblin/status/2123347882086678965", "text": "Paul Christiano @paulfchristiano was not messing around in his interview with Dwarkesh. \n\nHis message is clear: Pause. https://t.co/H7e2Wsjcu6", "created_at": "2026-11-19T09:29:19+00:00", "author_handle": "ro retty strong answer on which models are most useful, beyond typical benchmark scores. https://t.co/l5Nr2Nv4H6", "created_at": "2026-11-19T09:22:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "GregHBurnham", "rt_author_name": "Greg Burnham", "rt_avatar": "https://pbs.twimg.com/profile_images/1125088192548474880/JvBpsnxg_normal.png", "rt_id": "2122819580821225543", "likes": 119, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXFKJRXwAAsEJv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXXFKJRXwAAsEJv.jpg"}], "links": {"https://t.co/l5Nr2Nv4H6": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123346041789682029", "url": "https://x.com/robertwiblin/status/2123346041789682029", "text": "Alignment evaluation awareness has surged yet again to entirely new heights. This is from page 103 of Astra's system card. https://t.co/wEvd0lU6U0", "created_at": "2026-11-19T09:22:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2122844319518536065", "likes": 393, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXbqLdagAA2o5M.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXXbqLdagAA2o5M.jpg"}], "links": {"https://t.co/wEvd0lU6U0": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123336629624443157", "url": "https://x.com/robertwiblin/status/2123336629624443157", "text": "This report made me feel even more optimistic about California stepping up to the plate as we enter RSI. The panel did a great job - RSI is mentioned near the top of the Governor’s press release!\n\nSome really sharp ideas in here, e.g. requiring companies to disclose what % of compute they’re spending on frontier AI R&D, creating outcome-based standards that can complement safety cases, bringing companies up to >SL3 model weight security\n\nIf CA moves fast and smart, parts of this report could become law in ~months. One of the biggest determinants will be how hard and loud lab employees are willing to push. This is imo the #1 policy opportunity anywhere in the world to manage RSI risks asap", "created_at": "2026-11-19T08:44:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "rt_avatar": "https://pbs.twimg.com/profile_images/2099735189782134784/BxgR8Ne4_normal.jpg", "rt_id": "2123129144427028939", "likes": 173, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbetIoaMAASVnJ.jpg"}], "links": {"https://t.co/5aUVLAM3Gy": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123484728342782273", "url": "https://x.com/robertwiblin/status/2123484728342782273", "text": "Good piece: What if we wanted to slow down AI? \n\n@anton_d_leicht explains the 3 approaches and their pros/cons.\n\nAlso: there's stuff the labs can do now to make pacing work better later.\n\nCompany staff should be kicking and screaming until their employers do these things.\n\nhttps://t.co/A0lV4nD1xm", "created_at": "2026-11-19T18:33:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXghl5uX0AE6MtJ.jpg"}], "links": {"https://t.co/A0lV4nD1xm": "https://writing.antonleicht.me/p/pacing", "https://t.co/uOzHJImyta": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123479771854115167", "url": "https://x.com/robertwiblin/status/2123479771854115167", "text": "Policymakers might try to slow down AI progress very soon. But most 'pacing' ideas would backfire: they're either too complex to work fast, or too much of a band-aid to last.\n\nToday's essay looks at the politics of our least bad options to slow down AI.\nhttps://t.co/kkeOBjvKYT", "created_at": "2026-11-19T18:13:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "anton_d_leicht", "rt_author_name": "Anton Leicht", "rt_avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "rt_id": "2123094842334990752", "likes": 75, "retweets": 12, "media": [], "links": {"https://t.co/kkeOBjvKYT": "https://writing.antonleicht.me/p/pacing"}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123469957522416016", "url": "https://x.com/robertwiblin/status/2123469957522416016", "text": "Here are some things you might want to know about China and AI: \n\n- A \"Chinese HuggingFace\" might never become public \n\n- Beijing’s criticism of Anthropic has been unusually direct, even by the standards of its past attacks on American companies\n\n- Mythos, more than anything, changed how the CCP viewed AI\n\n- Jiang Shigong is the most interesting non-dissident Chinese intellectual (admittedly, not on AI, but important to know nonetheless).\n\nYou can learn all of this, and so much more, in my latest interview with @JulianGewirtz. \n\nJulian is a researcher at Columbia and served under Biden as the White House’s Senior Director for China and Taiwan Affairs and the State Department’s Deputy China Coordinator. \n\nHe’s also the author of the best book on the pivotal decade of modern China's history (the 80s), and blogs at https://t.co/OzMWQ7THBg\n\nJulian was the person my relevant-expert friends told me to interview on China - and I'm glad they did! \n\nWatch it wherever you get your podcasts.", "created_at": "2026-11-19T17:34:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2123467800442511539", "likes": 19, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123415588064141312/img/Yq6sV_7-3GdptGib.jpg"}], "links": {"https://t.co/OzMWQ7THBg": "https://juliangewirtz.substack.com/", "https://t.co/R1XAY1eEjQ": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123464835505721728", "url": "https://x.com/robertwiblin/status/2123464835505721728", "text": "https://t.co/uJwa0ejddl", "created_at": "2026-11-19T17:14:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2123462787816948015", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/uJwa0ejddl": "https://punchbowl.news/hickenlooper-ai-leadership-letter/?utm_source=Sailthru&utm_medium=email&utm_campaign=11/19/26%20AM:&utm_term=%28prod%29%20AM%20Subscribers"}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123462787816948015", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Nice. Hickenlooper (Senator for Colorado) writes to leader Schumer: \n\n\"We also need to... consider banning Recursive Self-Improvement to prevent AI systems from autonomously advancing beyond our ability to control them. ...\n\nAI is threatening to upend every part of American life. And the U.S. Senate is acting too slowly. That’s why the race for Senate Majority Leader is so important.\"", "links": {"https://t.co/G3Nnw2iwsC": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgLb0uXoAA4pDC.jpg"}], "url": "https://x.com/robertwiblin/status/2123462787816948015", "created_at": "Thu Nov 19 17:05:55 +0000 2026"}, "enriched": 3}, {"id": "2123462787816948015", "url": "https://x.com/robertwiblin/status/2123462787816948015", "text": "Nice. Hickenlooper (Senator for Colorado) writes to leader Schumer: \n\n\"We also need to... consider banning Recursive Self-Improvement to prevent AI systems from autonomously advancing beyond our ability to control them. ...\n\nAI is threatening to upend every part of American life. And the U.S. Senate is acting too slowly. That’s why the race for Senate Majority Leader is so important.\"", "created_at": "2026-11-19T17:05:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 42, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgLb0uXoAA4pDC.jpg"}], "links": {"https://t.co/G3Nnw2iwsC": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "thread": [{"id": "2123464835505721728", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "https://t.co/uJwa0ejddl", "links": {"https://t.co/uJwa0ejddl": "https://punchbowl.news/hickenlooper-ai-leadership-letter/?utm_source=Sailthru&utm_medium=email&utm_campaign=11/19/26%20AM:&utm_term=%28prod%29%20AM%20Subscribers"}, "media": [], "url": "https://x.com/robertwiblin/status/2123464835505721728", "created_at": "Thu Nov 19 17:14:03 +0000 2026"}], "enriched": 3}, {"id": "2123449955566195177", "url": "https://x.com/robertwiblin/status/2123449955566195177", "text": "The sad reality is that Anthropic is failing to persuade us that one of these things is true:\n\n1. They're on track to know how to do RSI safely.\n\n2. They're fighting tooth and nail to get extra time to figure it out.\n\n3. They won't go ahead until they do.\n\n1 is false, 2 is clearly not the case, and 3 we have to take on trust and the signs aren't great.", "created_at": "2026-11-19T16:14:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 154, "retweets": 17, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123446934375448964", "url": "https://x.com/robertwiblin/status/2123446934375448964", "text": "https://t.co/WRknHHiiau", "created_at": "2026-11-19T16:02:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2123446903417565619", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id
