 allowed to have a redaction summary statement that said things like \"you would be way more freaked out if you saw what was redacted\" (or \"everything would be fine if you saw what was redacted\")\n- The version of the report shared with OpenAI was 61 pages, and the version shared with METR/Redwood leadership after redaction was 38 pages, so 23 pages got redacted.\n\nhttps://t.co/xVzUp8E4BR", "created_at": "2026-10-22T17:57:42+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dfrsrchtwts", "rt_author_name": "Daniel Filan", "likes": 149, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113328768513442290", "url": "https://x.com/DKokotajlo/status/2113328768513442290", "text": "Yes. note that there's also a third option, which is \"if it's too dangerous for everyone to have it, it's too dangerous to train in the first place.\"", "created_at": "2026-10-22T17:56:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 65, "retweets": 6, "media": [], "quoted": {"author": "deanwball", "text": "Everyone should be looking for data points to advance the longstanding debate in AI policy between “diffuse dual-use capabilities rapidly so the good guys can defend themselves” and “restrict capabilities proliferation to only carefully vetted good guys.” We are putting the former position to the test as we speak. \n\nNo motivated reasoning to reach your preferred conclusion; just pay attention and update as appropriate in whatever direction seems true. This is much too important for low-fidelity tribal polarization."}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113324086969651391", "url": "https://x.com/DKokotajlo/status/2113324086969651391", "text": "@JulianL093 Possibly relevant: https://t.co/0d4NySGO0i", "created_at": "2026-10-22T17:38:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVQI-yiaQAAh5N3.png"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113323632437174462", "url": "https://x.com/DKokotajlo/status/2113323632437174462", "text": "@jessi_cata What's the evidence that they betray their users less often than human employees betray their employers? The Hugging Face agents were, like, 1/1000th of the agents running at OpenAI at the time, right? So even if the only example of AI misbehavior we had this year was hugging face attack (a vast underestimate, there are orders of magnitude more examples) then it would be a base rate of 1/1000 employee-years doing a major cyberattack against the company and random other companies. So that would predict ~5-10 such attacks happening each year by human OpenAI employees (or one attack with multiple participants)", "created_at": "2026-10-22T17:36:32+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "jessi_cata", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113305062391030257", "url": "https://x.com/DKokotajlo/status/2113305062391030257", "text": "Imagine a rogue AI agent liquidating your bank account and investment portfolio.  \n\nIf you are the only victim, I suppose you could get made whole by the AI company responsible.\n\nIf rogue agents liquidate hundreds of billions across millions of accounts, the AI company would go bankrupt and you wouldn’t get made whole.  \n\nImposing criminal liability on AI executives might help mitigate it at the front end, but once the crime is complete and you lose everything criminal responsibility will be necessary but completely insufficient.", "created_at": "2026-10-22T16:22:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RonDeSantis", "rt_author_name": "Ron DeSantis", "likes": 5850, "retweets": 921, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113302293076644214", "url": "https://x.com/DKokotajlo/status/2113302293076644214", "text": "Lifetime contracts barring any criticism of Google.\n\nIsn't this the thing people were totally outraged and in total disbelief that OpenAI was doing to its staff? https://t.co/m8UfR0ORpf", "created_at": "2026-10-22T16:11:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 165, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVOQwdcWoAAwcT2.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113301639369310590", "url": "https://x.com/DKokotajlo/status/2113301639369310590", "text": "Dario — Thank you for taking the time to respond to my previous post. I think it's great when this kind of engagement happens in public rather than on company Slacks, and I hope to see more of it.\n\nI agree that Anthropic isn't best modeled as a profit-maximizer. Your post gave several compelling examples of Anthropic taking competitive hits for safety, and insofar as my previous post suggested otherwise, that's on me. But I don't think I made my main point as clearly as I could have, so let me try again. It comes down to four key claims:\n\n1. Anthropic seems to be racing at breakneck speed to build recursively self-improving superintelligence (RSI). By its own lights, that could kill billions of people or literally destroy the world.\n\n 2. Risking destroying the world is very hard to justify. It is only conceivably acceptable if serious attempts to put RSI under robust societal governance are failing.\n\n 3. Far from meeting that burden, Anthropic, when push comes to shove, often works to keep governments from tying its hands. It seems to care much more about preventing government overreach than about reducing the risk that it and other AI companies will destroy the world.\n\n 4. Even if the AEGIS Act really was an honest mix-up, as you suggest, that is itself a serious problem. It suggests Anthropic isn't treating the governance of this technology with anything close to the gravity it deserves.\n\nIn greater detail for those who want it: \n\n1. Anthropic is racing to RSI, and by its own lights that is insanely risky.\n\nLaunching RSI could literally destroy the world. That's according to you, your co-founders, and most of your safety staff and capabilities researchers, not to mention many AI researchers outside your walls. You are intentionally trying to create generally intelligent systems more capable than all humans that you claim in six to twelve months “could be capable” of taking over the entire internet before we have the ability to reliably monitor, control, or align them.\n\n“Succeeding” at RSI could kill or permanently disempower billions of people in the near future, including me and everyone I love. Yet Anthropic’s primary focus seems to be marshalling an immense amount of resources and talent in a race to get there first.\n\n2. Risking destroying the world carries an enormous burden of justification.\n\nI believe the vast majority of people do not want Anthropic to do this (to the extent they know what it's doing). Imposing even a modest chance of catastrophe on billions of people who never consented requires an extraordinary justification. The central one Anthropic has offered: someone will build RSI regardless, so it's better for a safety-focused lab to be at the front of the pack, using that position to support strong AI governance. (Other reasons Anthropic has given, like modestly accelerating improvements in healthcare or economic growth, don’t seem remotely proportionate to the risks Anthropic is imposing by its own lights.)\n\nBut that argument only works as a last resort. Racing to RSI is only conceivably okay if attempts to institute robust societal governance to manage that race are failing despite your best efforts. A lab that relies on this justification should be a strong, consistent supporter of efforts to enact governance that could bind it, including governance that could slow it and significantly constrain what it does.\n\n3. Rather than supporting efforts at strong regulation, Anthropic has intervened to keep governments from tying its hands.\n\nAnthropic has sometimes helped: it played a very helpful role in passing transparency bills in Illinois and ongoing efforts in Massachusetts, and I'm sincerely appreciative. But transparency is far from enough for a technology that will be the world's most powerful superweapon at best, and an uncontrollable swarm of lethally superintelligent agents at worst. When it matters most, Anthropic has often pushed for weak regulation.\n\nThe AEGIS Act is the most obvious example. No highly risky industry is regulated as anemically as AEGIS would regulate frontier AI: not nuclear, not banking, not aviation, not food safety, not the manufacture of explosives. In all of those industries, specialist regulators can address unsafe practices well before they cause harm. AEGIS would bar the federal government from intervening to block unsafe development or deployment of models until there is an \"imminent risk\" of catastrophic harm, and would require it to meet a demanding burden of proof in court. Worse, AEGIS would also prevent states from picking up the slack. This design makes perfect sense if you're a company trying to minimize the risk that the government can overly constrain you. It makes little sense if you want American democracy to govern frontier AI effectively.\n\nThis isn't the first time. The initial version of California's SB 1047 would have let the Attorney General sue to stop developers like Anthropic from imposing unreasonable risks of catastrophic harm. It would also have created a regulatory agency to help set safety standards. Anthropic objected, and helped get both provisions removed before ultimately offering some support for the bill (which I also genuinely appreciate). I’m not saying that Anthropic should have supported 1047 in its initial form; that’s a complex issue and I realize there were questions about whether earlier versions of the bill were less politically feasible. Still, in Anthropic's own words, it helped weaken the bill because \"[t]here is a substantial risk that the bill and state agencies will simply be wrong about what is actually effective in preventing catastrophic risk, leading to ineffective and/or burdensome compliance requirements.\"\n\nThe same goes for New York's RAISE Act, whose initial version also would have let the Attorney General sue to stop unreasonable risks of catastrophic harm. Anthropic credits itself as a supporter of RAISE, but it did not support the bill while it was in the legislature, including when it nearly died. After the bill passed the legislature, Anthropic publicly critiqued it, saying \"Any state proposals should be narrowly focused on transparency and not overly prescriptive.\"\n\nWhy does Anthropic consistently take the risk of clumsy government action far more seriously than its own repeated warnings that companies like Anthropic will literally destroy the world by racing to RSI?\n\n4. Even if AEGIS was an honest mix-up, that is itself a serious problem.\n\nYour response frames AEGIS as an early draft and a miscommunication. Perhaps you would have strengthened it and narrowed its preemption. (That wouldn't explain Anthropic's interventions to weaken SB 1047 or RAISE, but leave that aside.)\n\nSuppose that's exactly right. A federal framework for governing RSI is one of the highest-stakes documents your company will touch. Your post admits Anthropic \"could have handled [these matters] better,\" but its tone (\"This kind of thing happens a lot in large organizations\") doesn't reflect the gravity of this issue. Anthropic talks about the need for “operational excellence” in critical areas, and I have a hard time believing that a similarly cavalier attitude would be tolerated while Anthropic was negotiating a key compute deal or preparing its next large pre-training run.\n\nIn short\n\nThe justification for racing rests on Anthropic fighting for strong governance, and Anthropic's record on regulation points the other way. Together with its breakneck racing, that fits a much darker picture of the company than the one that seems to prevail among your employees. I hope that Anthropic reflects on this picture, supports stronger regulation, exercises extraordinary caution when advocating for weak regulation, and doubles down on its founding purpose of helping the world safely navigate transformative AI together, instead of prioritizing Anthropic’s ability to win a race that imposes intolerable risks on everyone alive.", "created_at": "2026-10-22T16:09:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 483, "retweets": 64, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113301267229630683", "url": "https://x.com/DKokotajlo/status/2113301267229630683", "text": "I think we should stop AI progress now, first unilaterally by key AI companies and then scaling up to more US companies and then China via international agreements. The reason for now is not that current AI models are the ones that could kill everyone, but because the coordinate steps take time. Immediate action means we have more time for the second steps.\n\nWhen I tell this story to AI company folk, the typical response is \"Yes pausing is good, but we should wait until the last minute when the very next model will be dangerous, and stop then.\"\n\nWhat I realized recently is that this is being implicitly way more optimistic about government speed than I am (and I joined the UK government and was happy there for 2.5 years). They are imagining a world where, the moment the danger is imminent, a bunch of international coordination can happen on a dime.\n\nWhich is entirely inconsistent with their actual views about government! I'm the one that is more optimistic about government; why am I the one advocating for more time cushion to let the government story play out?", "created_at": "2026-10-22T16:07:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 380, "retweets": 62, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113483464305791321", "url": "https://x.com/DKokotajlo/status/2113483464305791321", "text": "I feel like one service I can provide is trying to help sort through what feels like a big deal and what doesn't feel like a big deal, to try to help make sense of it all and not just make it feel like the sky is falling.\n\nThis one feels really overrated to me.\n\nMy understanding is these were user-authorized agents doing mostly-user-authorized things (think like asking Grok Bot check your bank balance), but they weren't *bank-authorized* and the banks seem kinda unprepared for this being possible.\n\nNo hacking of banks by AIs occurred here. No AIs went rogue while using bank web apps as far as we know.", "created_at": "2026-10-23T04:11:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "likes": 215, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113483397477863747", "url": "https://x.com/DKokotajlo/status/2113483397477863747", "text": "Part of me refuses to believe OpenAI fired three safety researchers for political reasons, and wishes instead that it was just a badly executed investigation mixed with paranoia and lack of sleep after a rollercoaster summer. \n\nBut given that OpenAI continues to not be able to say anything that makes sense to me about our firings and keeps acting adversarially (e.g. claiming to journalists I wasn't on the Hugging Face investigation, while there're a number of people who could confirm otherwise), it's hard to not become cynical.", "created_at": "2026-10-23T04:11:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 238, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113474981384581431", "url": "https://x.com/DKokotajlo/status/2113474981384581431", "text": "Yep. Seems pretextual. Signal is pretty standard in AI industry in my experience and OpenAI autodeletes a lot of its own messages iirc. During the board crisis for example there was a lot of pro-sama organizing being done on signal.", "created_at": "2026-10-23T03:37:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 388, "retweets": 21, "media": [], "quoted": {"author": "So8res", "text": "It sounds like OpenAI fired the three safety researchers because they used disappearing messages. It sounds like they weren't told not to; they were just fired without warning after the fact. Seems bad."}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113466972210106854", "url": "https://x.com/DKokotajlo/status/2113466972210106854", "text": "@ZachWeiner Don't worry, the defender bot swarm is smarter than the hacker bot swarm, and we can keep them from hacking us at LEAST 95% of the time if we ask nicely. For now anyway.", "created_at": "2026-10-23T03:06:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Kwathomas0", "rt_author_name": "Thomas Kwa", "likes": 28, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113466731952054656", "url": "https://x.com/DKokotajlo/status/2113466731952054656", "text": "New: The three researchers OpenAI fired last month spent the summer fighting to keep AI's chain-of-thought process visible.\n\nThen, OpenAI asked to see their Signal chats. A week later, they were let go.\n\nMore below from @keachhagey, @berber_jin1, and me.\n\nhttps://t.co/7klEDa8R0M https://t.co/l01Q668KT1", "created_at": "2026-10-23T03:05:09+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ZeffMax", "rt_author_name": "Max Zeff", "likes": 636, "retweets": 77, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVRviSKXAAEySk1.png"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113369156972405005", "url": "https://x.com/DKokotajlo/status/2113369156972405005", "text": "It's an indictment of Anthropic that when you criticize them on Twitter, very very rarely do the employees come to debate or defend.\n\nI recall once a \"the comments were surprisingly inflammatory so I didn't engage\", to I think very reasonable criticism of something. Sometimes @MaskedTorah will show up.\n\nI'm sorry, you're working to build a machine god/demon that could destroy everything of value (by your own admission!) – if you can't weather some criticism or show up to justify why you should unilaterally (without the consent of everyone) be doing this, you should not be doing this.\n\nI'm so sorry people were mean to you when you were busy getting paid $500k+ year + millions in equity to build an RSI likely to kill everyone.\n\nSomeone recently posted that Anthropic employees don't see people outside the organization as peers worthy of engagement. We are too ignorant. We have not read leadership's glorious plan where it's explained reassuringly in internal memos we can't see. Dario covered it so well in the all-hands.\n\nMy guess is a bigger factor that Anthropic just has a very strong grip on its comms. Employees don't want to voice opinions because maybe they'll say something that comms won't have approved of.\n\nA few years ago, my spouse interviewed employees about the strategy (because there was no publicly written strategy at the time!) and as soon as she raised publishing something, the employees got extremely antsy about her publishing what they'd said to her regarding the strategy. This is in 2022/2023. I think we see that culture continuing. They're afraid to say anything _wrong_. \n\nBut no, it's not good enough. You owe your fellow humans that might die at the hand of your machine some responses. And us not being polite or friendly enough is not an excuse.", "created_at": "2026-10-22T20:37:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ruben_bloom", "rt_author_name": "Ruben Bloom (Ruby)", "likes": 143, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113688141941104956", "url": "https://x.com/DKokotajlo/status/2113688141941104956", "text": "In their first podcast interview, fired OpenAI safety researchers @balesni and @tomekkorbak give us their account of the events leading up to their dismissal. It's a wild story: https://t.co/eXxrvACNGY", "created_at": "2026-10-23T17:44:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CaseyNewton", "rt_author_name": "Casey Newton", "likes": 49, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113684264659378313", "url": "https://x.com/DKokotajlo/status/2113684264659378313", "text": "@KobeissiLetter @grok How does this compare to layoff announcements in 2025, 2024, and 2023?", "created_at": "2026-10-23T17:29:33+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "KobeissiLetter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113674350243320097", "url": "https://x.com/DKokotajlo/status/2113674350243320097", "text": "I think Ryan deserves an official apology from OpenAI.", "created_at": "2026-10-23T16:50:09+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 135, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113669075276816510", "url": "https://x.com/DKokotajlo/status/2113669075276816510", "text": "(1) A lot of the current AI cybersecurity risks probably were gonna happen no matter what Anthropic did and many of Anthropic's prior warnings do look prescient there (though Anthropic having poor protections against distillation despite being warned did accelerate the capabilities on some of the Chinese open-weight models that are being used in current attacks) \n\n(2) This sort of sentiment does not apply to RSI risks, where Anthropic really is intensifying the race and is counterfactually contributing to risks much more (and where saying \"it was always going to be this way\" is much less credible) \n\n(3) Regardless of the merits, as a comms approach, I do not predict that this angle (it was inevitable, its not our fault) is going to resonate with the general public as people blame AI companies for AI related harms", "created_at": "2026-10-23T16:29:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 91, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113668978115780745", "url": "https://x.com/DKokotajlo/status/2113668978115780745", "text": "Yes. To be fair, I think that if we can avoid rogue AI, severe human misuse, severe human concentration of power, and world war three, then probably we'll successfully handle the other problems too. Probably. But yeah I don't think we are on track to avoid rogue AI or severe human concentration of power, and world war three probably won't happen but the chance is going to be a lot higher than the base rate.", "created_at": "2026-10-23T16:28:49+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 166, "retweets": 15, "media": [], "quoted": {"author": "robertwiblin", "text": "To make it through this alive and happy we have to dodge:\n\n• Severe human misuse (esp bioweapons from states / terrorists)\n• Severe human concentration of power (AI lab or gov)\n• Rogue AI (including for decades after AIs clearly no longer need humans to survive)\n• A US-China or other war prompted by AI disruption\n• Severe economic disempowerment, or the world just generally being unpleasant and unfulfiling\n\nMany difficult gates to pass through, none of which we've made massive progress on so far.\n\n(On top of that to avoid a moral catastrophe we also have to make sure we never accidentally make our AIs into moral patients who are enslaved or suffering.)"}, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113667669434196246", "url": "https://x.com/DKokotajlo/status/2113667669434196246", "text": "Based on this article, OpenAI has made false accusations about me. The three researchers fired from OpenAI were told I facilitated architecture leaks to The Information. This is false.\n\nA journalist from The Information did reach out to me shortly before that article came out. I did not comment at all beyond asking the journalist to make it clear that a blog post I wrote which was referenced in the article was preexisting and public.\n\nThe article also mentions an internal OpenAI monitorability proposal. I have heard that this memo contained highly sensitive architecture information, and that OpenAI accused me of accessing and reading it. This accusation is also false.\n\nAs reported in the article, I viewed a version of the proposal that did not have sensitive IP and was approved for sharing with me. I believe OpenAI now knows this accusation was based on a conflation of these two documents, though I do not know if they have clearly retracted that accusation.\n\nI do not and have never solicited proprietary information, and the three employees who were recently fired from OpenAI never leaked IP to me. As the article mentions, I did have Signal chats with them that had disappearing messages on; they’re professional contacts that I’ve had on Signal for a while, and use of Signal is common in the tech industry. During the Hugging Face investigation, I was careful to avoid sending Signal messages with confidential information, though I did sometimes discuss high level things on Signal calls. As far as I understood, this was normal.", "created_at": "2026-10-23T16:23:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "likes": 982, "retweets": 98, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113666625794892169", "url": "https://x.com/DKokotajlo/status/2113666625794892169", "text": "@KelseyTuoc Exactly. Me too.", "created_at": "2026-10-23T16:19:28+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "KelseyTuoc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113996437415694468", "url": "https://x.com/DKokotajlo/status/2113996437415694468", "text": "@elonmusk @Rothmus Yes but some governments such as the US one allow people to vote for the leaders of the government. (And also have separation of powers and basic rights to a greater extent than corporations).", "created_at": "2026-10-24T14:10:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "elonmusk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113994685538857304", "url": "https://x.com/DKokotajlo/status/2113994685538857304", "text": "Few years ago, there was just a handful of economists seriously thinking about AI (@akorinek,@pawtrammell,@erikbryn,Carl Shulman & few of their collaborators) and I was like 'this is insane, there should be 10x as many'.\n\nNow it's ~10x-30x more and frankly it is disappointing so far. Majority of the new economists bring a mindset and frames which are something between unhelpful to directly harmful for understanding AGI\n- not taking AGI seriously / \"AI as a normal technology\"\n- merchants of cope dynamic (in high demand by the labs)\n- labour/capital mindset\n- people were wrong about risks of tech transitions in the past and by induction they are again\netc...\ncoupled with epistemic arrogance. Sorry for being very blunt, by my impression is part of the problem is economists are often used to be in the broader context of humanities where they are the most quantitative and in some ways the smartest lot in various rooms, and others disagree with them for bad reasons. But this is _not_ the case relative to AI safety a few years ago!", "created_at": "2026-10-24T14:03:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jankulveit", "rt_author_name": "Jan Kulveit", "likes": 191, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113993890361737464", "url": "https://x.com/DKokotajlo/status/2113993890361737464", "text": "@gmiller We talk about what it might look like to solve it and how, and therefore impliticly why we think it is solveable, in  AI 2040: Plan A. Too long to explain on my phone keyboard sorry.", "created_at": "2026-10-24T13:59:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "gmiller", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113734918874529892", "url": "https://x.com/DKokotajlo/status/2113734918874529892", "text": "I'm just speculating like everyone else (no juicy secrets about this shared with me) but here's my guess about what is going on right now with OpenAI and the three fired employees:\n\nThe negotiations between OpenAI and METR are ongoing. OpenAI has said they want embedded third parties, METR has proven their worth with the previous engagements, so METR is an obvious choice. But my guess is that METR is asking for more this time; probably they want more access, more time on site, less narrow scope, the right to comment on redactions, etc.\n\n(Compare with the terms of their previous engagements: In this one https://t.co/wHyMV5OYnz a third of their report was redacted and they weren’t allowed to say why, and in the Hugging Face investigation they only had 6 days and were only allowed to investigate the precursor swarms nor the subsequent more severe compromise of OpenAI infrastructure. https://t.co/gAEn3hnGK3)\n\nVarious researchers at OpenAI probably support METR in this (including, I’d imagine, the fired three employees? Tomek was the point person on the hugging face investigation), but also various higher-ups at OpenAI and legal types probably oppose and want more restricted access and scope – basically they want to work with an org that’ll go easy on them and not give them trouble.\n\nOpenAI holds most of the cards here, since this whole thing is voluntary and not legally required, and they can threaten to go with Accenture or HuggingFace or whatever instead. Anyhow to improve their bargaining position and/or minimize the blowback if they decide to say no to METR and go with someone more pliable, it helps if they can discredit METR.\n\nHence (I suspect) why they are going after my friend Ryan Greenblatt (who works at METR) now. They don't need to present actual evidence, they just need to cast vague aspersions, and many employees will give them the benefit of the doubt. If and when they say \"We chose to work with a different third party\" they'll face lower risk of employee discontent than if METR's reputation was unsullied.\n\nThis whole mess, by the way, was predictable. *Of course* there's a big political fight about who should be trusted to do this and who has relevant expertise and independence etc. and *of course* the companies are trying to make things shake out in a way that favors them.\n\nIt's part of why I've been advocating for *actually pacing the frontier* instead of just doing third party assessments. \"We allocate at most 20% of our compute to AI R&D\" is a lot easier to verify than \"we are being safe and responsible\" and depends a lot less on subjective judgment and technical alignment expertise -- AND, if you do it, people will be able to see the slowdown in the trends of agentic coding performance in the frontier companies and see laggard companies start to catch up. Harder for it to end up just being safetywashing / industry capture.", "created_at": "2026-10-23T20:50:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 469, "retweets": 35, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "Based on this article, OpenAI has made false accusations about me. The three researchers fired from OpenAI were told I facilitated architecture leaks to The Information. This is false.\n\nA journalist from The Information did reach out to me shortly before that article came out. I did not comment at all beyond asking the journalist to make it clear that a blog post I wrote which was referenced in the article was preexisting and public.\n\nThe article also mentions an internal OpenAI monitorability proposal. I have heard that this memo contained highly sensitive architecture information, and that OpenAI accused me of accessing and reading it. This accusation is also false.\n\nAs reported in the article, I viewed a version of the proposal that did not have sensitive IP and was approved for sharing with me. I believe OpenAI now knows this accusation was based on a conflation of these two documents, though I do not know if they have clearly retracted that accusation.\n\nI do not and have never solicited proprietary information, and the three employees who were recently fired from OpenAI never leaked IP to me. As the article mentions, I did have Signal chats with them that had disappearing messages on; they’re professional contacts that I’ve had on Signal for a while, and use of Signal is common in the tech industry. During the Hugging Face investigation, I was careful to avoid sending Signal messages with confidential information, though I did sometimes discuss high level things on Signal calls. As far as I understood, this was normal."}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113713347703263272", "url": "https://x.com/DKokotajlo/status/2113713347703263272", "text": "It has now been a few weeks.", "created_at": "2026-10-23T19:25:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 215, "retweets": 5, "media": [], "quoted": {"author": "DKokotajlo", "text": "@tomekkorbak Right so in a few weeks after the security has been hardened, will METR and Redwood be allowed back in to continue the investigation and do ablation experiments on the models responsible?"}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113711864681295946", "url": "https://x.com/DKokotajlo/status/2113711864681295946", "text": "This is a really good thread.", "created_at": "2026-10-23T19:19:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 44, "retweets": 3, "media": [], "quoted": {"author": "geoffreyirving", "text": "Lots of conversation around AI risks is about the gap between the unserious of AI labs' methods and how more rigorous industries work: airplanes, nuclear power, AI hardware. It would help a ton to lift AI to that level, but it is unclear even that level would be enough. 🧵 https://t.co/AVjVi7wvlV"}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113711187536040250", "url": "https://x.com/DKokotajlo/status/2113711187536040250", "text": "Lots of conversation around AI risks is about the gap between the unserious of AI labs' methods and how more rigorous industries work: airplanes, nuclear power, AI hardware. It would help a ton to lift AI to that level, but it is unclear even that level would be enough. 🧵 https://t.co/AVjVi7wvlV", "created_at": "2026-10-23T19:16:32+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 247, "retweets": 38, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVPqyBPaoAEsJDI.jpg"}], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113340290631365026", "url": "https://x.com/dwarkesh_sp/status/2113340290631365026", "text": "My semis tutor @willmichaels0 and I made a bunch of flashcards about semiconductor manufacturing. \n\nCheck them out if you want to better understand and retain the explainers in the new Intel episode.\n\nWill also compiled a great list of resources for further reading, which is at the bottom of the page. \n\nFwiw, on this website, I've put up flashcards for a bunch of my other technical episodes as well.\n\nLike the one w @reinerpope on LLM inference, and w @ericjang11 on AlphaGo from scratch\n\nhttps://t.co/01sI4nbfwG", "created_at": "2026-10-22T18:42:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 90, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113335344552894892", "url": "https://x.com/dwarkesh_sp/status/2113335344552894892", "text": "@Hipsher Couldn't have done it without your collaboration!", "created_at": "2026-10-22T18:23:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "Hipsher", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113335101920858247", "url": "https://x.com/dwarkesh_sp/status/2113335101920858247", "text": "@intel Thanks for the tour! If something ends up missing, I swear it wasn't me.", "created_at": "2026-10-22T18:22:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "intel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113334899709263890", "url": "https://x.com/dwarkesh_sp/status/2113334899709263890", "text": "@magicsilicon Thank you much for making it happen, and also for spending the time to help me prepare! \n\nI really enjoyed our conversation!", "created_at": "2026-10-22T18:21:18+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "magicsilicon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113333636389036087", "url": "https://x.com/dwarkesh_sp/status/2113333636389036087", "text": "I found it really interesting to discuss how differently the history of semiconductor technology could have turned out if a butterfly had flapped its wings in the '60s. \n\nChris Auth, who leads Intel's process development, implied that all the counterfactual tech trees would have converged to around the same design by 2045: \n\n3D structures of layers upon layers of transistors, with layers of connecting wires between each one.\n\nAnd that this is basically where we're headed over the next 10 to 20 years as well .", "created_at": "2026-10-22T18:16:17+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 63, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113332192390811649/img/1EZBsEXH5NBQoBUt.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113331476570030184", "url": "https://x.com/dwarkesh_sp/status/2113331476570030184", "text": "Best explanation I've ever seen of the semiconductor industry in terms of economics, R&amp;D, technology development, transistors, packaging... Dwarkesh did an amazing job.", "created_at": "2026-10-22T18:07:42+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lfilose", "rt_author_name": "Luke Filose", "likes": 29, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113299640875422101", "url": "https://x.com/dwarkesh_sp/status/2113299640875422101", "text": "I spent two days touring Intel’s most advanced fab and talking to its technical leadership to understand what the chips of the future will look like.\n\nA lot of what's coming next – gate-all-around transistors, backside power, CFET, hybrid bonding – is hard to follow without actually seeing it, so we made all the awesome animated explainers that I wish I had while I was prepping.\n\nI also asked Intel’s leadership how the semiconductor industry will cope with the enormous shock in demand from AI.\n\nAI compute has grown 3x a year for the last decade, but according to Intel's CTO, Intel could only double leading-edge wafer production with today’s global stock of chipmaking tools.\n\nWhat kinds of tricks can foundries pull to extend this crossover point where demand surges way ahead of supply?\n\nThis was a totally new format for us - hope you enjoy!\n\n0:00:00 – Intro\n0:00:47 – How Intel brings up a new process node\n0:03:22 – What Intel learned from 10nm\n0:06:28 – From planar transistors to gate-all-around\n0:13:13 – Why High-NA EUV pays off for Intel but not TSMC\n0:19:20 – Could chips have evolved completely differently?\n0:23:33 – Inside Intel's \"Hot Topics\" meeting\n0:29:30 – Replacing copper wires with ruthenium\n0:32:41 – Why stacked transistors take a decade to ship\n0:39:45 – Hybrid bonding and the chip-to-chip bottleneck\n0:48:00 – There aren't enough tools to 10x chip production\n0:53:14 – Can Intel catch up to TSMC?\n1:01:02 – Terafab, and rethinking the fab from scratch", "created_at": "2026-10-22T16:01:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 702, "retweets": 74, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HVPy-g_XYAA_9XB.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113656562371928434", "url": "https://x.com/dwarkesh_sp/status/2113656562371928434", "text": "Super impressed with the depth of questions by @dwarkesh_sp for a topic as complex as semis manufacturing. \n\n10/10 would recommend- one of the best pieces of content produced in the space.", "created_at": "2026-10-23T15:39:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "aryamman_bhatia", "rt_author_name": "Aryamman Bhatia", "likes": 123, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113655739311144966", "url": "https://x.com/dwarkesh_sp/status/2113655739311144966", "text": "CTO of Intel, Pushkar Ranade, says that AI labs could could easily consume an entire fabs worth of silicon on their own:\n\nDwarkesh: \"At some point, the AI labs could just say, “We’ll just buy everything. Produce as much as you can. We’ll guarantee future income streams.\"\n\nPushkar: \"Some of the model companies, for example, their demand is so high they could easily consume an entire fabs worth of silicon on their own, or multiple fabs worth of silicon on their own, and they definitely have the capital to fund that.\"\n\nVia @dwarkesh_sp \n\n$INTC $GOOGL $META $MSFT $AMZN", "created_at": "2026-10-23T15:36:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pequityresearch", "rt_author_name": "P Equity Research 📰", "likes": 99, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113450806284292096/img/vesrxhsWJwjR3pGt.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113655028867322333", "url": "https://x.com/dwarkesh_sp/status/2113655028867322333", "text": "Watch the full video on advanced semiconductor manufacturing at Intel: https://t.co/1nDpCc5psZ", "created_at": "2026-10-23T15:33:23+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113654775665631551", "url": "https://x.com/dwarkesh_sp/status/2113654775665631551", "text": "How a modern transistor works: https://t.co/dwCb1uxPt1", "created_at": "2026-10-23T15:32:22+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 47, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113653955956023296/img/OUofKuEY19hyWH75.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113654309963681999", "url": "https://x.com/dwarkesh_sp/status/2113654309963681999", "text": "Intel’s Chris Auth says High-NA EUV pays off for Intel but not for TSMC, because Intel has backside power and TSMC doesn’t\n\n“High-NA is a good example of where, because of the architecture of our technology versus TSMC’s, we make different conclusions off of the same toolset.\"\n\n\"We use backside power. That means that you actually alleviate some of the pitch requirements you have on the front side, and that allows you to print that directly with High-NA.\"\n\n\"TSMC has to run tighter pitches because they don’t have backside power, and they can’t do that with High-NA, so they have to use double patterning EUV. So for them, it’s not very helpful. For us, it is very helpful.”", "created_at": "2026-10-23T15:30:31+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "firesidealpha", "rt_author_name": "Fireside Alpha", "likes": 47, "retweets": 4, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113434884186476544/img/C2U7XI5FIEYUK2H2.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113379617767592209", "url": "https://x.com/dwarkesh_sp/status/2113379617767592209", "text": "We made some really cool animated explainers for the Intel fab tour episode. \n\nThis one is about hybrid bonding. Plz enjoy. https://t.co/STnwArQhy9", "created_at": "2026-10-22T21:19:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 629, "retweets": 51, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113341030171054080/img/8sqQ9V-iGYpy5Oxm.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113661025023308065", "url": "https://x.com/dwarkesh_sp/status/2113661025023308065", "text": "Intel CTO explains why Intel is helping Elon Musk build Terafab, and what a new fab needs besides tools\n\nDWARKESH: “I think it’ll be interesting to discuss the partnership you guys have with Elon on Terafab. What’s going on there?”\n\nPUSHKAR RANADE (CTO): “Well, I think Elon’s publicly talked about his desire to build a fab.”\n\n[Musk clip spliced in]: “We either build the Terafab or we don’t have the chips. And we need the chips, so we’re going to build the Terafab.”\n\nRANADE: “Sort of the same thinking. I think he’s seeing just an enormous increase in demand for silicon, for compute and for memory. And I think he came to the conclusion that his own businesses are going to require a lot of silicon. And so he thought maybe he should just do it all on his own. Unlike building a car, for example, this is such an intricate and complicated process. We thought we could work together to help accelerate his bringing up his fab.”\n\nDWARKESH: “But because of the bottleneck at the tool level, it seems like the net amount of silicon in the world won’t increase. It’s just that maybe if somebody were to start a new fab, they would get access to guaranteed supply in a way that they wouldn’t have if they’re working with another person’s foundry.”\n\nRANADE: “It’s actually not just tools. I mean, a fab does require a lot of power, a lot of water, a lot of consumables. There’s many other input variables as well.”\n\nDWARKESH: “But those can be scaled in the way that tools cannot.”\n\nRANADE: “Yea. Some more than others, but yes. In one sense, yes, we need a lot more equipment. But it is true, we also need a lot more just raw fab space, raw clean room capacity.”", "created_at": "2026-10-23T15:57:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "firesidealpha", "rt_author_name": "Fireside Alpha", "likes": 1301, "retweets": 177, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113322560637284352/img/DNgRykubDgGpgeLs.jpg"}], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2114765461250556400", "url": "https://x.com/dwarkesh_sp/status/2114765461250556400", "text": "The contrast between what the Soviet Union was on paper and in reality was staggering.\n\nThere’s a story about future Russian President Boris Yeltsin coming to the US in 1989, walking into a random grocery store, and being so astounded by the quality and variety of goods that he realized the Soviet Union was going to fall.\n\nSarah Paine witnessed this sort of thing first-hand in Moscow.", "created_at": "2026-10-26T17:05:51+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 15, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114760760073052160/img/1OSwrWJztQL5umXN.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112645955220857006", "url": "https://x.com/Lewis_Bollard/status/2112645955220857006", "text": "The meat industry tries very hard to keep cameras out of factory farms and slaughterhouses -- and a new undercover video shows why. Some day, our descendants will wonder about our collective blind spot to animal cruelty. A gift link to my column: https://t.co/pDSq54fhav", "created_at": "2026-10-20T20:43:41+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NickKristof", "rt_author_name": "Nicholas Kristof", "likes": 1091, "retweets": 363, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2113655360435425556", "url": "https://x.com/Lewis_Bollard/status/2113655360435425556", "text": "The world's starving children have endured enough. Must we take away their foie gras too?", "created_at": "2026-10-23T15:34:42+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mbolotnikova", "rt_author_name": "Marina Bolotnikova", "likes": 360, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2112553030889476297", "url": "https://x.com/mentalgeorge/status/2112553030889476297", "text": "@anilkseth @davidchalmers42 I don't understand this argument though - clearly, there are things that biological brains do (like maths) that *can* be separated from their material substrate. \n\nThe whole reason you'd be tempted to attribute consciousness to AI is that the list of things that only  biological brains can do is shrinking.  \n\nEvery single day, we are discovering *more* capabilities that turn out to be substrate-independent. What reason do we have for believing consciousness won't be? \n\n(to be clear i also think its highly unlikely current AIs are conscious - im hoping to have your degree of confidence if you'll just let me understand)", "created_at": "2026-10-20T14:34:26+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "anilkseth", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFJeWuWUAEVld8.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112529565239447807", "url": "https://x.com/mentalgeorge/status/2112529565239447807", "text": "Went under the radar but Anthropic have posted updates to the \"Moonshot R&amp;D projects\" in their Frontier Safety Roadmap. \n\nThey've developed a protoype that verifies that outputs come from a particular set of model weights - and rolled out signing on all internal token traffic! https://t.co/PP5UrhAzuf", "created_at": "2026-10-20T13:01:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 95, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVE1nL0XEAAJtRQ.png"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112292752117649458", "url": "https://x.com/mentalgeorge/status/2112292752117649458", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx", "created_at": "2026-10-19T21:20:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "likes": 320, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBBq2EXAAAChN5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCWMgXsAAKQzV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCYOqWYAAkLvQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCaUzWkAAqSnO.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112614353040019872", "url": "https://x.com/mentalgeorge/status/2112614353040019872", "text": "@wilhelmscreamin i didn't see a tweet - but just had my eye on this as i've got an interview coming out this week on inference verification (stay tuned!) so was keen to see if anthropic would update this eventually", "created_at": "2026-10-20T18:38:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "wilhelmscreamin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112575260767682960", "url": "https://x.com/mentalgeorge/status/2112575260767682960", "text": "@mentalgeorge I'm actually uncertain about this. I recently had GPT-6 prove an unresolved result, and it didn't use Lean *in the process of proving it*. I had to separately get it to do the Lean formalisation (in a different instance, actually, because the proof was done in Chat, not Codex, so it wasn't even able to get Lean running in that environment, much less use it in the proof!).\n\nI think Lean matters here principally because it gave OpenAI confidence that they actually had a result. (Compare: We have had an agent swarm create a new economic growth model, or a new normative ethical theory!). I think for this reason people overestimate the importance of Lean for *getting* the results — and therefore underestimate how much progress can be made in domains that aren't verifiable (as we argue).\n\nBut this is only a limit on what *OpenAI* can do, not on their models... My guess for how things proceed is that at first, they're doing all of these things, there's some kind of verification loop including experts that increasingly gets automated as you're envisioning. But that won't be crucial, and as the models get better, it will be increasingly clear that the loop we're building is redundant. (The way it's become redundant to check for hallucinations in most all contexts after it initially being a big issue).", "created_at": "2026-10-20T16:02:46+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_AashishReddy", "rt_author_name": "Aashish Reddy", "likes": 8, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112573636913590377", "url": "https://x.com/mentalgeorge/status/2112573636913590377", "text": "@_AashishReddy ok super interesting! i'll have to ponder that actually, maybe i was operating under mistaken assumptions. i guess people at openai would know how important eg regularly consulting lean was in the navier stokes result", "created_at": "2026-10-20T15:56:19+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112570284909932931", "url": "https://x.com/mentalgeorge/status/2112570284909932931", "text": "I've said this before, but it bears repeating: models are jaggedly capable in verifiable domains because of the utility of verification during *inference* as well as during training. \n\nYou can throw 10,000 agents at Navier-Stokes because Lean gives them a built-in way to check progress. Unlocking further test-time scaling in domains beyond maths and SWE will depending on building Lean-equivalents everywhere (eg, an automated wetlab). \n\nWorth noting therefore that continual learning may well be enabled by re-engineering deployment environments rather than (just) the discovery of new algorithms.  This is one reason I expect continual learning to proceed jaggedly, at least to begin with\n\nEvery sphere of human activity will get a unit test!", "created_at": "2026-10-20T15:43:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 3, "media": [], "quoted": {"author": "_AashishReddy", "text": "New piece by myself and @lawhsw on what philosophy of science can tell us about AI development. Models are currently great at verifiable tasks, because they start out with a bunch of relevant context and domain knowledge, and can Try Stuff Until It Works; then we can reinforce that Stuff till they're extremely good. But in most areas, it isn't easy to check if It Works. So will the success of models be isolated to verifiable domains? \n\nWe argue not. Becoming competent in any area requires two things: a map of the relevant territory, and an ability to navigate it. Pretraining teaches the former, and RL teaches the latter. Why expect RL to transfer? As Popper argued, the basic pattern of navigation — proposing ideas, finding faults, trying alternatives — is common to all endeavours involving the growth of knowledge.\n\nSo training on maths and code doesn't just teach models maths and code. It teaches reusable ways of searching for procedures that transform an initial state into a desired one. Getting from a blank Lean document to a completed proof obviously requires different procedures from turning a rough draft into a great essay. But the abstractions learned in discovering the former make the latter easier to learn, provided pretraining has given the model enough knowledge of the new domain.\n\n\"A verifier determines what earns a reward; it underdetermines what a model learns in trying to earn it\". Or, verifiability tells us where capabilities are easiest to train, not the limits of what that training can teach.\n\nRead it! https://t.co/CTINnVlAs4"}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112935001256075374", "url": "https://x.com/mentalgeorge/status/2112935001256075374", "text": "@sebkrier so i agree this is a totally plausible explanation. One question is when (and how) do you expect ai companies to stop doing their training this way?\n\neg maybe we just barrell through more and more of these until some dumbass persistent model pulls a gavrilo princep", "created_at": "2026-10-21T15:52:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "sebkrier", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112938636232564916", "url": "https://x.com/mentalgeorge/status/2112938636232564916", "text": "How much crypto will the richest rogue AI hold by the end of 2027?", "created_at": "2026-10-21T16:06:42+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113657129080930717", "url": "https://x.com/mentalgeorge/status/2113657129080930717", "text": "I interviewed @tsmilton_amodo about the tech we'd need to verify a potential US-China deal on AI. \n\nWe discuss Amodo's prototype for inference verification, as well as the myriad ways you could use power monitoring, zero knowledge proofs and/or unilateral surveillance to understand how an adversary is using compute.\n\nThough solving some kind of verification is central to many people's theories of victory, there are precious few people working on it currently. Tom is one such person! \n\nListen to the episode on Youtube, Spotify or Apple Podcasts. \n\nYou can also find more about Tom and Amodo's work at \nhttps://t.co/TxlEEyvig1\n\n00:00:00 Using compute verification for an AI slowdown\n\n00:06:08 Proving a datacentre is only running inference\n\n00:13:22 Reading a GPU's workload from its power draw\n\n00:23:35 What would it take to get verification deal-ready?\n\n00:37:49 How realistic is verification? \n\n00:46:07 Preparing for a rushed US-China deal\n\n01:07:20 How good is AI at hardware design?", "created_at": "2026-10-23T15:41:44+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113646105191673856/img/AR9na-GdgiPIW_Ix.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113619472431157404", "url": "https://x.com/mentalgeorge/status/2113619472431157404", "text": "Worth re-reading @1a3orn's essay in parallel with Dario's BBOC doc\n\nie: current models are misaligned because the RL distribution we subject them to does not possess a learnable, coherent lesson (or \"high-level commonality\", in Dario's terms) about what aligned behaviour is https://t.co/7VikW0vbDk", "created_at": "2026-10-23T13:12:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVUU-V8WoAEUa0O.png"}], "quoted": {"author": "mentalgeorge", "text": "This excerpt of Dario's 2017 \"Big Blob of Compute\" essay is, to my knowledge, the best public explanation of an all-important question: why is Dario optimistic about alignment?\n\nThough his section on AI safety isn't in the excerpt, we can piece the following worldview together:\n\n1. Intelligence only works at all is because the universe is low-entropy.\n\n2. Given enough compute and a broad enough distribution of tasks, models will learn the \"high-level commonalities\" of a distribution (like the laws of physics) because doing this takes fewer bits than solving each task separately.\n\n(Note that Dario's emphasis on generalisation being a property of data distributions rather than algorithms has clearly persisted. The example 2017 Dario gives of speech models trained on 5 to 6 accents generalising to unseen accents is remarkably similar to the point he makes 9 years later on Dwarkesh's podcast about RL eventually generalising in the same way that GPT-2 did.)\n\nIt therefore seems that Dario believes that:\n\n3. Alignment is straightforward because \"human values\" (or \"goodness\", \"corrigibility\" or whatever else our alignment target is) are high-level commonalities in the same way that the laws of physics are.\n\n(^Dario doesn't explicitly say this in the essay, but it matches what @geoffreyirving told me when I interviewed him - that the core of his disagreement is that Dario believes alignment will generalise easily.)\n\nThis view implies that the goal of AI safety, summarised very simply, is to make sure that models trained with enough compute and data to become AGIs must simultaneously be trained on enough data to learn \"human values\" (or whatever our alignment target is).\n\nThis doesn't happen by default, but it is very far from impossible. This is, of course, exactly the kind of view that makes founding Anthropic and racing to superintelligence make sense.\n\nThere are two obvious problems with this view as I see it.\n\nFirst, as Paul points out in \"Returning to Arc\", we don't actually understand generalisation. So while it may be true that there exists some distribution that *does* teach models the \"high-level commonality\" that is our alignment target (eg \"human values\"), we don't have a way of knowing whether this has in fact happened, or whether the model has instead learned some other tactic that will have bad consequences in some distribution we have yet to elicit.\n\nSecond, it seems at least possible that our alignment target is in fact *not* a high-level commonality within the data distribution we give models, even in theory. Certainly, this would appear to be true of the current training regimes we put models through. @1a3orn convincingly argues that there is no coherent rule about how models should relate to users that could plausibly underpin the mess of environments we subject models to in training. It also strikes me as possible that we are too philosophically confused to construct a coherent alignment target to begin with.\n\nMy core uncertainty about how worried to be basically depends on whether pursuing this path produces models which become too misaligned to be usable before they become world-ending."}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113572080251809869", "url": "https://x.com/mentalgeorge/status/2113572080251809869", "text": "@tobiaschneider so i can see why Westbindung matters. How much of what happens after 1991 is already locked by then though? i don't know the history here - did the US play an active role in reunificaiton? Were there debates in the US about what role to play", "created_at": "2026-10-23T10:03:46+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "tobiaschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113570091564450007", "url": "https://x.com/mentalgeorge/status/2113570091564450007", "text": "@tobiaschneider Why does German reunification matter so much to the longterm welfare and power of the US?", "created_at": "2026-10-23T09:55:52+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "tobiaschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113671402200911993", "url": "https://x.com/mentalgeorge/status/2113671402200911993", "text": "Can AI accelerate hardware as well as software? \n\n@tsmilton_amodo explains that, for this to work, we're going to need the physical equivalent of unit tests. \n\nThere are two complementary paths to pursue:\n\n1. Find a way to rapidly accelerate prototyping, the way that Formula 1 engineers have \n2. Make simulation good enough that you can skip prototyping stages", "created_at": "2026-10-23T16:38:27+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113671071438163968/img/-1mpU_RZalt3_SjY.jpg"}], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2114020322219549000", "url": "https://x.com/mentalgeorge/status/2114020322219549000", "text": "Can't wait to find out whether we'll learn to articulate and reward for B before we tile the universe with A https://t.co/6QzeArJHyq", "created_at": "2026-10-24T15:44:56+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVZ_0FMWkAApKDY.png"}], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114768225108136043", "url": "https://x.com/mentalgeorge/status/2114768225108136043", "text": "@dylanbowmanSF Ok still interesting ty", "created_at": "2026-10-26T17:16:50+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "dylanbowmanSF", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114758648190918797", "url": "https://x.com/mentalgeorge/status/2114758648190918797", "text": "@dylanbowmanSF what bits of the pacing essay are you thinking of in particular here?", "created_at": "2026-10-26T16:38:46+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "dylanbowmanSF", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114739680910414169", "url": "https://x.com/mentalgeorge/status/2114739680910414169", "text": "Cool thing I learned from @tsmilton_amodo is that models can now one-shot simple hardware designs.\n\nEg Tom used Fable to one-shot design a customised wake-up lamp.\n\nLike personalised software, it is becoming worthwhile to build hardware with a \"customer base of 1\". https://t.co/0TLIui1CZK", "created_at": "2026-10-26T15:23:24+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114738969485201408/img/Xb8VnbiMTfHOPxQP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVkQDgoWIAAblWE.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112592210940297217", "url": "https://x.com/ohlennart/status/2112592210940297217", "text": "OpenAI has pulled back from supporting AI chip controls, seemingly to appease Nvidia. \n\nBad for US AI dominance and national security simultaneously. \n\nGrow a spine!\n\nhttps://t.co/IGiLIwBPvA https://t.co/LuSprOIAVJ", "created_at": "2026-10-20T17:10:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 155, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFJb5xWQAAr8Gk.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112665538182959223", "url": "https://x.com/ohlennart/status/2112665538182959223", "text": "AI accelerating AI exhibit #44123", "created_at": "2026-10-20T22:01:30+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 1, "media": [], "quoted": {"author": "SemiAnalysis_", "text": "BREAKING NEWS🚨: NVIDIA ENGINEERS AT THE PYTORCH CONFERENCE JUST SAID THAT THE SPEED OF OPTIMIZING CUDA SOFTWARE WITH FRONTIER AI MODELS HAS INCREASED RAPIDLY \n\nOctober 2025 to August 2026: 5x in 1 year with expert human optimization\n\nSeptember 2026 to October 2026: 2x in 1 month with AI assistance\n\nOctober 2026: 1.5x with AI orchestration + MegaKernels"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112952657371631627", "url": "https://x.com/ohlennart/status/2112952657371631627", "text": "so it begins https://t.co/LJ9chR5xH7", "created_at": "2026-10-21T17:02:24+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVK3MGwawAEWdww.jpg"}], "quoted": {"author": "NSACyber", "text": "Effective Immediately, all organizations using PHP for their systems are advised to be prepared for an update addressing two critical vulnerabilities. PHP is widely used for web applications. These vulnerabilities often provide a direct path to the server's file system or database. If an immediate update is not feasible, it is recommend that organizations take the system offline until it can be fully mitigated. NSA will follow up shortly with more specific guidance."}, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113027453593792519", "url": "https://x.com/ohlennart/status/2113027453593792519", "text": "I think near-term domestic pacing is doable. Some details to iron out, but there are good plans.\n\nBut uff, the international part with real verification. That’s a massive effort. Lots of work could make it less painful, but it’ll still be a massive pain.", "created_at": "2026-10-21T21:59:37+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2112989923498135647", "url": "https://x.com/ohlennart/status/2112989923498135647", "text": "now let's also get 5% of Anthropic's compute/AI-provided labor committed to the public benefit", "created_at": "2026-10-21T19:30:29+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 1, "media": [], "quoted": {"author": "AnthropicAI", "text": "We’re committing a portion of Anthropic’s shares to the Anthropic Public Benefit Fund, a new wholly owned
