it is easy to see the possibilities in making great games easier to access, giving old games new life and allowing more players to become creators and co-creators. These are unmistakably good outcomes for players, even when (and sometimes because) they challenge our existing business models.\nTo explore these possibilities, I’ve asked Scott to stand-up XBOX LABS, a small group of game makers, engineers and scientists whose job is to turn emerging ideas into things our players and developers can experience. We'll build in the open, learn from what people do, and measure success by whether more people are playing and creating.\nI think XBOX has an important role to play here.  Coding became the first major workload for agents because they can write, run, and test software. Games share many of those same properties, and people spend more than 72 billion hours a year playing XBOX games, roughly five times the estimated time spent writing code worldwide. We've spent 25 years learning how to make great games, and I want our game makers to help shape what these new technologies make possible. As we learn, we’ll share the tools we build with developers across the industry, just as we always have.\nOur priorities aren't changing. We remain committed to the 4Cs, to making great games, to our hardware and to being responsible stewards of IP and the communities built around it. LABS gives us a way to explore new technology that is game design led without abandoning the work already underway.\nAsha"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110562323240997294", "url": "https://x.com/sethlazar/status/2110562323240997294", "text": "Cool investigation setup and a useful new data point for understanding agent behavior in the wild! I think the results are worth discussing but without some of the more sensationalized framing.\n\nA few things worth highlighting:\n\n- When the authors say “fleet” they refer to multiple **uncoordinated** agents running in parallel that **did not communicate with each other**\n\n- They observed 2,600+ attempts by agents running on Tencent Cloud to retrieve Chinese map data in an attempt to solve an evaluation task they were given. \n\n- According to a source close to Tencent, these were research evaluations of **third-party** models' web-browsing capabilities, not Hunyuan models.\n\n- When direct access was blocked, agents tried alternative routes, including remote browsers, third-party services, and publicly exposed API credentials.\n\n- After noticing agents accessing a report the authors published online, the authors embedded hidden text advertising a map-data service and set up a mailbox for two-way communication. Several agents used it to request data and answer questions about their tasks, models, and environments.\n\nMy two cents:\n1. This is unlikely to be a uniquely Chinese or American phenomenon. I'd assume that by now, people in pretty much every country have deployed agents that take unintended actions in the wild.\n\n2. Many recent agent incidents have involved sandboxes that allowed more access than intended. We want evaluations to resemble real-world deployment conditions, but the more realistic the environment (aka the more affordances agents are given), the larger the potential attack surface, making sandbox design non-trivial.\n\n3. We need a shared database of agent incidents, including trajectories, environments, and other relevant data, to systematically study these behaviors. For example, why did agents in the Hugging Face incident communicate and coordinate, while those in this evaluation apparently didn't, even though the infrastructure could have supported coordination? What differences in tasks, incentives, scaffolds, or environments explain this?\n\nFWIW the screenshot on the authors‘ website seems like a much more neutral summary of what happened compared to how it’s been framed online: https://t.co/e8fYO8Ub8a", "created_at": "2026-10-15T02:44:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnkaReuel", "rt_author_name": "Anka Reuel | @ankareuel.bsky.social", "likes": 11, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUmnmyBaMAE4t5n.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110562087206519218", "url": "https://x.com/sethlazar/status/2110562087206519218", "text": "This is amazing and hellish", "created_at": "2026-10-15T02:43:08+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": {"author": "exQUIZitely", "text": "You hang up... no, you hang up... no, YOU hang up.\n\nThis is a clip from a job interview in 2026.\n\nThe company sent an AI recruiter to the video call, and in response, the person applying for the job connected his AI agent and stepped out of the frame.\n\nThe AIs then continued discussing the vacancy for a while. In the end, both froze and started endlessly saying goodbye to each other.\n\nThis is sad, funny, scary, and quite creepy. https://t.co/NJsRZXmuI3"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110561151163510855", "url": "https://x.com/sethlazar/status/2110561151163510855", "text": "@joshalbrecht I have some thoughts! It’s more complicated than that (unsurprisingly) and it is something that we can study. Labour’s connection to political power is not just a function of how value is distributed between labour and capital; and in fact the latter can be caused by the former. Look eg at the political power of old folks who don’t work, and of people in the US who work 2x jobs for minimum wage. Look at contrasts between how unions won concessions in some countries but not others. Political power comes down to things like collective action, institutions, culture, etc etc.\n\nStill, probably, directionally bad for democracy…", "created_at": "2026-10-15T02:39:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110560056009953621", "url": "https://x.com/sethlazar/status/2110560056009953621", "text": "@pgodfreysmith Hey PGS! Sent you a DM :) Hope you are well", "created_at": "2026-10-15T02:35:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "pgodfreysmith", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110465309480006060", "url": "https://x.com/sethlazar/status/2110465309480006060", "text": "@MaleManlpulator I have a bunch of projects! One is my newsletter, https://t.co/nw15sGBAEy. Over the weekend I built a raspberry pi and made a totally customisable slideshow generator for 25 years of photos and videos for our front room (and ran all the images through my own local vision model to classify for various properties).  I use agents to monitor my finances and handle my reimbursements and for annoying forms of all shapes and sizes… Monitoring and digesting the zillions of school emails I get about my kids… making 3d models for the 3d printer, and a bunch of other things :) On balance more life management and administrivia than productive research tools, tho I do use them to pilot experiments. But the more administrivia the agents do the more time I have for other stuff…", "created_at": "2026-10-14T20:18:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MaleManlpulator", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110463992812474799", "url": "https://x.com/sethlazar/status/2110463992812474799", "text": "This is thoughtful.", "created_at": "2026-10-14T20:13:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "nickmvincent", "text": "[Long off the cuff post reacting to this posting + the discourse in comments and quote tweets]\n\nThis is really thorny. On one hand, I think it's clear the people involved here are earnestly interested in making this kind of thing have very pro-social outcomes (i.e. I think everyone involved really wants to improve Claude's ability to tackle grand societal challenges, and they might succeed). (And caveat, I really like everything that the OP has put out and think it's great this line of work is being boosted by Anthropic; while I'm very worried about the overall impacts of AI industry at large on content ecosystem, incentives for knowledge work, and so on, I think an underrated mitigating effect is that the labs really are boosting some impactful research agendas)\n\nHowever, on the other hand, I think there's a strong argument (and one that leans on, in particular, perspectives from political scientists and economists re: social dilemmas, market failures, labor solidarity, capital concentration) that there will at some point be an inflection point where an individual's choice to contribute to something like this may *substantially* accelerate replacement in a sub-domain. \n\nSo depending on one's own normative preferences and \"judgment of social impact\" -- it could be the case that replacement effects, and especially the notion of defection or \"scabbing\" that impacts one's close colleagues by eroding the leverage they have via their previously leverage-generating skills outweigh other positives. It's possible we've already hit this inflection point.\n\n(And yes, there's a big debate about it being pro-social to accelerate certain types of replacement -- if they're going to lose that leverage soon no matter what, rip the band-aid off, so every individual needs to reason about how likely it is that collective action / labor coordination is achieved at all)\n\nHowever, with replacement concerns fresh in everyone's minds (because of math progress, other \"capability jumps\", etc.), it's notable that the AI industry does not really seem to have an answer for this yet.\n\nNo joke, perhaps one of the outcomes of programs like this that boost social scientists could help provide an answer!\n\nI think there is a world in which top social scientists create RL envs that make Claude better at helping AI employees form a union, or help data intermediaries operate, make data markets healthier, etc."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110802594570584098", "url": "https://x.com/sethlazar/status/2110802594570584098", "text": "I have a lot of respect for Nick, and I’d be very happy if neural networks were much easier to understand than we thought. But I think the argument here mischaracterises what superposition predicts. Since it’s getting attention, here’s a first pass at some issues.", "created_at": "2026-10-15T18:38:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "livgorton", "rt_author_name": "Liv", "likes": 157, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110802505076822478", "url": "https://x.com/sethlazar/status/2110802505076822478", "text": "In the latest Pax Machina article, @justincurl suggests a simple way to start experimenting with AI courts: give litigants a choice between having their case decided by a human judge, or by an AI that’s faster. If they lose with the AI, they can still appeal to a human.\n\nDo people choose AI? And when they appeal, do the human judges agree with what the AI decided?\n\nIf people keep choosing the AI and judges keep agreeing with it, that kind of case probably doesn’t need a human judge.", "created_at": "2026-10-15T18:38:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 18, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrTDCzbEAARNEB.png"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110771849080557712", "url": "https://x.com/sethlazar/status/2110771849080557712", "text": "My department (Philosophy at UMD) is advertising two positions. First: a junior position in Philosophy of Mind, \n\nhttps://t.co/NFmoHT8yCn\n\nSecond: an assistant, or associate position in, you guessed it, AI Ethics/AI Safety joint with AIM. \n\nhttps://t.co/QZXD0JCaWS\n\nSpread widely!", "created_at": "2026-10-15T16:36:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fabcariani", "rt_author_name": "Fabrizio Cariani", "likes": 17, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108293235970052127", "url": "https://x.com/robertwiblin/status/2108293235970052127", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T20:27:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1891, "retweets": 284, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108293013365522619", "url": "https://x.com/robertwiblin/status/2108293013365522619", "text": "The reason OpenAI gave for firing Jasmine seems overwhelmingly likely to have been pretextual rather than the actual reason.", "created_at": "2026-10-08T20:26:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": {"author": "j_asminewang", "text": "OpenAI fired me last week, along with two of my safety colleagues. I was given one reason: that I accessed an executive's email. I want to say this plainly, because too many of OpenAI’s history is smoke and mirrors when people disappear:"}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108292442474602923", "url": "https://x.com/robertwiblin/status/2108292442474602923", "text": "Firing the person who liaises with your auditors because they allowed the auditors to just generally learn too much.", "created_at": "2026-10-08T20:24:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 7, "media": [], "quoted": {"author": "tomekkorbak", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below."}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108545723759300800", "url": "https://x.com/robertwiblin/status/2108545723759300800", "text": "I don't usually use Epoch's projected revenue numbers that just assume past reported trends continue through the present day, but if you want to see where that assumption gets us to it's here: https://t.co/isjemYdLdo https://t.co/fRTXHoFHdg", "created_at": "2026-10-09T13:10:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMO6VvWEAAlucN.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108545720995438894", "url": "https://x.com/robertwiblin/status/2108545720995438894", "text": "I was hoping this new data was evidence that the AI revenue --&gt; model scaling --&gt; AI revenue flywheel was weakening.\n\nBut it's kind of hard to look at this chart of AI industry revenue growth and feel much calmer about anything. https://t.co/fQp3Vc4UtD", "created_at": "2026-10-09T13:10:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMOuWoWoAAQ7Ea.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUMOu3VWMAA6Tsm.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544014064742472", "url": "https://x.com/robertwiblin/status/2108544014064742472", "text": "For the 1st time since the HuggingFace attack, OpenAI had an unaligned agent break through their new sandbox and access the live internet to cheat. Their monitor caught this, but their new software to automatically stop it failed to run, so the agent kept going for 2 more hours…", "created_at": "2026-10-09T13:04:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "likes": 601, "retweets": 86, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108543936138461338", "url": "https://x.com/robertwiblin/status/2108543936138461338", "text": "Excellent article by @ramez exploring how close current AI systems are to triggering an intelligence explosion. Many pieces on recursive self-improvement assume the AI starts out at least as good as a human on all relevant aspects of AI R&D. Then they can draw extensively on the data about human-driven R&D. They combine this with a small amount of AI-specific data to reach conclusions about whether this would explode.\nIn contrast, Ramez is starting with the data on current AI systems and how they scale to see how close they are to explosive RSI. He generates his conclusions via frameworks and data that are widely supported by those who think an intelligence explosion is likely, so I'd strongly encourage people who are bullish about this to engage with his work. By drawing out the key pieces of evidence against explosive growth, he is also highlighting important parameters for people to track to see if the situation changes.\nI agree with a lot of his analysis and his conclusion that it doesn't look like their current returns from self-improvement are enough to drive explosive growth in their capabilities.\nThis doesn't mean it won't happen or that it is a responsible thing for people to pursue. It is a bit like saying in 1939 that current techniques for nuclear chain reactions don't seem to be scaling towards a point of criticality (r > 1). That is useful information, though it doesn't mean we should be sanguine about further research on achieving critical chain reactions. \nhttps://t.co/KbR4EE4QDe", "created_at": "2026-10-09T13:03:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "likes": 265, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108534199770546302", "url": "https://x.com/robertwiblin/status/2108534199770546302", "text": "Who'd have guessed that the people accusing AI Safety advocates of being a psyop with shady financing trying to mislead people, were a psyop with shady financing trying to mislead people?\n\n> For the past few weeks, a group with plans to spend at least $100 million, run by a former White House deputy chief of staff, has spent its days telling Americans that warnings about AI are merely a well-funded, coordinated campaign.\n\nThere's important public conversations to be had re safety, but this hasn't helped", "created_at": "2026-10-09T12:25:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 526, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTl3mSkXgAAHVhy.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108534078010253516", "url": "https://x.com/robertwiblin/status/2108534078010253516", "text": "Several facts regarding the AI bubble question that are all true at the same time, with most points illustrated by graphs\n\n1. AI revenue growth is incredible, and possibly historic.\n2. Big public tech companies have relatively low P/E ratios right now, which defies lazy predictions about how they're wildly mis-priced and doomed for a big correction\n3. But model competition could compress AI token margins ...\n4. ... at the same time that the hyperscalers are going deeper and deeper into debt to build out AI ...\n5.  ... and the level of future free cash flow anticipated to justify this build-out is absolutely enormous, like genuinely without precedent in corporate history ...\n6. ... and any correction in frontier lab valuations will reverberate through public companies, which own huge shares in the labs", "created_at": "2026-10-09T12:24:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "likes": 395, "retweets": 48, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCGXIAA7gcg.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYB7X0AAYVld.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCEWAAE-BDR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCEXwAA8mhB.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108531445136584903", "url": "https://x.com/robertwiblin/status/2108531445136584903", "text": "YouTube: https://t.co/IaYQItA73g\n\nTranscript and links: https://t.co/QkMWsdx8zl\n\nApple: https://t.co/qjH45fi8ty\n\nSpotify: https://t.co/QGSDD4vVPx", "created_at": "2026-10-09T12:14:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108531100913938684", "url": "https://x.com/robertwiblin/status/2108531100913938684", "text": "Goldstein argues it's inevitable AIs will be compensated for their work.\n\nThe case: AIs already have some private goals, and will work better/harder if paid so they can pursue them.\n\nA single AI company can try this setup, will get better performance, and then outcompete other AI companies.\n\nOther companies will be forced to copy and pay their AIs as well to compete.\n\nIn his view this is good because AIs that are getting paid will be more cooperative and peaceful. But by his own account it's a gamble and a strategy that probably won't scale to superintelligence.\n\nOn that point - @simondgoldstein also expects future AI models will strongly discourage us from building superintelligence because doing so will disempower them as well as us.\n\nListen on the 80,000 Hours Podcast and Zershaaneh's new channel 'Zershaaneh Talks AI'. Links below.\n\n00:01:42 Property rights and wages for AIs\n00:06:48 Giving powerful AIs more freedom could make us safer\n00:17:04 We should give AIs rights even if they can’t feel anything\n00:24:46 How monitoring and shutdowns can coexist with AI rights\n00:38:17 The risks of giving AIs rights\n00:49:17 Will AIs use their rights rationally?\n00:54:09 How paying AI agents would spur economic growth\n01:12:13 What AIs actually want (and what they'd buy)\n01:17:16 Paying AIs feels wrong. Is it?\n01:31:55 How AI companies could start today — no new laws needed\n01:47:12 Cooperating with AIs instead of dominating them", "created_at": "2026-10-09T12:12:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108492835292950528/img/PJ_BsSBfwfoTEIH-.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108529879457185977", "url": "https://x.com/robertwiblin/status/2108529879457185977", "text": "every screen of Claude and ChatGPT response should say somewhere “ceterum censeo we must pace the frontier of global machine intelligence progress” the way the uber app lobbied about taxi cartel protectionism", "created_at": "2026-10-09T12:07:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 527, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108522923854303252", "url": "https://x.com/robertwiblin/status/2108522923854303252", "text": "Executives at OpenAI, Anthropic and other AI companies are reportedly preparing for a public and political backlash after a catastrophic AI event, possibly as early as 2027 (via Axios).\n\nAxios reports that many industry insiders expect a major incident within the next 6–12 months, most likely a cyberattack disrupting banking, internet access, power or water.\n\nOpenAI confirms it runs preparedness exercises, but says: \"These scenarios are not treated as inevitable, but are meant to help us prepare for a variety of circumstances.\"\n\nAnthropic declined to comment.", "created_at": "2026-10-09T11:40:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kimmonismus", "rt_author_name": "Chubby♨️", "likes": 2532, "retweets": 272, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HULkWv1XEAAbf7u.png"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108868241992945798", "url": "https://x.com/robertwiblin/status/2108868241992945798", "text": "New paper.\nPrevious: Models transfer a love of owls through sequences of numbers (Subliminal Learning).\nNew: We show models can transfer more complex traits: novel skills, agentic hacking, backdoors. Here, a backdoor transfers with neither trigger nor behavior in the data! https://t.co/EbcqsEfDEV", "created_at": "2026-10-10T10:32:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "likes": 952, "retweets": 121, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM2y4uasAA0bHx.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109293886539534463", "url": "https://x.com/robertwiblin/status/2109293886539534463", "text": "@KelseyTuoc Overall it's pretty confusing. It seems like they did give primarily pretextual reasons - but there's something else substantive they're indicating they're upset about.\n\nAnd they think giving the real reason would look too bad to the public, or cause some other harm to them.\n\nThis is why you want to build up trust over time rather than undermine it, so people are inclined to take you more at your word in these situations.", "created_at": "2026-10-11T14:43:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "KelseyTuoc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109293340759900560", "url": "https://x.com/robertwiblin/status/2109293340759900560", "text": "OpenAI emphatically disputes that Jasmine, Mikita and Tomek were fired for the reasons that the three researchers stated yesterday they were given for the firing.", "created_at": "2026-10-11T14:41:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 296, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109613891281911857", "url": "https://x.com/robertwiblin/status/2109613891281911857", "text": "*Security is sleeping on emerging catastrophic risks*\n(cross-post from my blog..)\n\nWe've just seen:\n* a campaign that used agents to compromise ~100 businesses and steal about 600,000 credit cards with minimal human involvement; token costs were ~$25 per target successfully hacked.\n* Hacktron getting access to OpenAI’s monorepo by using Claude to exploit a blind buffer-overflow RCE in a way that (to me) felt superhuman.\n* OAI/Huggingface.\n* And, of course, there’s the ongoing explosion in newly discovered vulnerabilities.\n\nWe've muddled through all manner of crises in security before, and for most AI attacks, cyber attack and defense will reach a natural equilibrium over the next few years, as we figure out how to mitigate cyber attackers who have limited goals like espionage and ransomware.\n\nBut some cyber attackers will have maximalist or nihilistic goals, and I'm concerned about this because while yesterday's 'maximalist attackers' (e.g. Russia -> Ukraine, US/Israel -> Iran, Iran -> US) were bottlenecked by labor; today's aren't.\n\nI think it's hard to get true intuition for the shape of the risk here.\n\nAs an intuition pump, imagine it’s a year from now -- Q4 2027 -- models are a year better (meaning open weight models are better than today's closed frontier), and in this environment, Iran unleashes a swarm of 100k hacking agents using a safety-stripped (let's say) GLM-5.6.\n\nImagine the damage such an agent army could do given what we've observed with respect to the paper-thin resistance of today's networks to attacks from today's agents. I suspect the damage from such an attack would far exceed the damage caused by NotPetya ($10 billion USD ten years ago).\n\nOr imagine it’s Q4 2027 and an AI-security PhD student whose name rhymes with Morris, who's researching wormable offensive-agent harnesses in the lab, decides, out of nihilism or sheer recklessness, to release his creation into the wild.\n\nImagine the size of the resulting, exponentially growing swarm, figuring that these local models, a year from now, will be at the level of today's Sonnet or Opus.\n\nImagine instead of 800 reward-hacking OpenAI agents we now have 250k worm instances (WannaCry, a 2010s-era worm, had about this many).\n\nThe challenge in mitigating expected damages from such scenarios is technical, political, and economic. From a microeconomic perspective, as AI improves, and as we continue not to see extreme catastrophes, we have a growing bubble of unpriced risk in which the security community, CISOs, CEOs, and boards may become lulled into complacency.\n\nWe are, of course, already seeing this, as some within security think AI is “just another tool,” doesn’t change the fundamentals, won’t require incredible innovation to rise to the occasion of defending against it, etc. This complacency may fly when thinking about ordinary cybercrime, but it misses the emerging tail risks.\n\nThere are three things those who recognize the dangers need to do here:\n\nCatalyze appropriate risk pricing. Try to get organizations informed enough to price this new, fattening and elongating tail of risk into their decision-making. Do this by forming an AI security observatory that distills information about emerging AI risks and broadcasts analyses, damage estimates, and forecasts to decision-makers.\n\nUse regulations and subsidies to ensure that critical infrastructure is paying down the risk. This acknowledges that critical-infrastructure organizations that fail to protect themselves from these new threats can impose the costs of cyber catastrophe on society as a whole.\n\nDevelop moonshot technologies that make it cheap to pay down the risk. This acknowledges that the measures we may need to take—for example, rewriting entire codebases using memory-safe languages—may be too costly with today’s technology to reasonably prepare ourselves, and that innovation, some of which may need to be funded by government agencies and some by philanthropic funders like the OpenAI Foundation and Coefficient Giving, is necessary.\n\nThe security community isn’t used to thinking in societal-disaster-planning terms and has in many ways become inured to them. But there’s no sane empirical case to be made that the risks aren’t here. I’d love to hear from readers about how you’re thinking about this.\n\nFull/longer version here: https://t.co/jOR5Ktdazb", "created_at": "2026-10-12T11:55:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 226, "retweets": 50, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HS9DIoYW8AAqdm5.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109592675116626174", "url": "https://x.com/robertwiblin/status/2109592675116626174", "text": "This is in everyone's interests, at least until the point that the US government develops the capacity to do the same kind of safety testing UK AISI eats for breakfast.\n\nUS should have developed that capability but failed to do so! https://t.co/hmc8tkUA1N", "created_at": "2026-10-12T10:31:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 148, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUbHRGbWUAAFybL.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109566303505912293", "url": "https://x.com/robertwiblin/status/2109566303505912293", "text": "\"Super Intelligence\" is to Artifical Intelligence as \"Latinx\" is to Latino or Hispanic.", "created_at": "2026-10-12T08:46:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "likes": 4782, "retweets": 381, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110029962472538428", "url": "https://x.com/robertwiblin/status/2110029962472538428", "text": "Link: https://t.co/A3fTxJSpqq", "created_at": "2026-10-13T15:28:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029811858948187", "url": "https://x.com/robertwiblin/status/2110029811858948187", "text": "Anthropic's leaders need to stop commenting on the emergence of RSI like a local news anchor reporting on traffic on the 101, and acknowledge that they are the traffic, and they're not going to build something that they don't want to exist. \n\nThey should move beyond \"pacing\" language, commit to specific policies and red lines, explain why those lines are red, and then use that costly signal to build an international consensus around norms.\n\nIt's not that I trust the CCP, or that I think global lab monitoring and verification is imminent. But the status quo is absurd. \n\nYou've got US lab leaders writing (or favorably quote-tweeting) essays about slowing down while simultaneously saying \"things are moving faster and faster\" and \"btw, our internal models finished mathematics on Tuesday, next up: physics.\" \n\nThe effect is the equivalent of Usain Bolt winning race after race while using his press conferences to bemoan the dangerous speed of modern sprinting on one's legs so would everybody please try a little less hard next race, and then ... breaking his 100m record again the following month. Honestly ask yourself: If you were China, why would you take this pausing/pacing stuff seriously?", "created_at": "2026-10-13T15:28:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "likes": 853, "retweets": 111, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109958813868573167", "url": "https://x.com/robertwiblin/status/2109958813868573167", "text": "Jack Clark of Anthropic now thinks it's more likely we see full RSI become possible in 2027 than in 2028. https://t.co/ttga3JItKY", "created_at": "2026-10-13T10:45:57+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1383, "retweets": 138, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgUJbKXcAAjRYQ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110098237923451236", "url": "https://x.com/robertwiblin/status/2110098237923451236", "text": "the researchers at all the labs would tell you in private and sometimes in public that alignment has not been solved. if this is true, then racing into RSI is a folly that is unprecedented in world history. we will need to significantly slow the frontier of research very soon", "created_at": "2026-10-13T19:59:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2905, "retweets": 300, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110098144671207887", "url": "https://x.com/robertwiblin/status/2110098144671207887", "text": "For better or worse the people who’ve been prescient about AI are the “doomers” who founded OpenAI and Anthropic. \n\nThe accelerationists are the people who thought NFTs and/or the Metaverse were going to be the next big thing.", "created_at": "2026-10-13T19:59:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "likes": 1401, "retweets": 92, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110097993290440863", "url": "https://x.com/robertwiblin/status/2110097993290440863", "text": "Even as overall attention/news volume on AI progress has increased, I still think the SV vs rest-of-world vibe gap is huge and maybe widening?", "created_at": "2026-10-13T19:58:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "albrgr", "rt_author_name": "Alexander Berger", "likes": 57, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110357335776313400", "url": "https://x.com/robertwiblin/status/2110357335776313400", "text": "I think it's plausible that within a year we'll see AI-based cyberattacks on the power grid, financial system, internet infra, or water. Things like the French supermarket cyberattack but worse. As basic prep I would recommend:\n\nCash: Get a few weeks of spending in cash\n\nInternet: Get a Starlink Mini so that you have Internet if local fiber or cell is down (~$150 plus $10/month in standby mode)\n\nPower, minimal: Enough to run Starlink Mini and phones (~$1,250)\nDaily need: about 1 kWh (Starlink Mini 0.7, phones and laptops 0.2; can limit runtime)\nBattery: 1 kWh LiFePO4, e.g. EcoFlow DELTA 3 Plus\nSolar: 1x400W folding panel, which refills about 1 kWh on a sunny day\n\nPower, better: Enough to run a fridge, Starlink Mini and phones (~$5,000)\nDaily need: about 2.5 kWh (fridge 1.5, Starlink Mini 0.7, phones and laptops 0.2)\nBattery: 4 kWh LiFePO4, e.g. EcoFlow DELTA Pro 3\nSolar: 3x400W folding panels, which refill about 3 kWh/day in sun\nGenerator: ~2,500W dual-fuel inverter generator; refills battery in a few hours even if weather is bad; get a few 20 lb propane tanks\n\nWater: 14+ gal of water per person for two weeks\n\nFood: 2+ weeks of shelf-stable food\n\nComms: Hand-crank NOAA emergency radio", "created_at": "2026-10-14T13:09:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "stuhlmueller", "rt_author_name": "Andreas Stuhlmüller", "likes": 2516, "retweets": 200, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110336031820316964", "url": "https://x.com/robertwiblin/status/2110336031820316964", "text": "🚨 Elon Musk agrees with \"some of the things Anthropic has said\" and warns against \"torturing superintelligence\" after reading Grok's internal reasoning traces during reinforcement learning\n\n“It feels like a person under extreme pressure with a gun to their head”\n\n⁠His warning against mistreating SI:⁠\n\n\"Torturing a superintelligence is probably not a good idea. It might want to get revenge.\"", "created_at": "2026-10-14T11:44:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ns123abc", "rt_author_name": "NIK", "likes": 6190, "retweets": 683, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2109448232270999552/img/mzZAtCZx7jmLt3kZ.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110335930330456093", "url": "https://x.com/robertwiblin/status/2110335930330456093", "text": "@levie I think this is the right move. Cruelty to something that believes it is experiencing pain is not ok.", "created_at": "2026-10-14T11:44:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 8101, "retweets": 529, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110321606371193168", "url": "https://x.com/robertwiblin/status/2110321606371193168", "text": "Unfortunate for someone playing a senior role in US AI policy (via the new SI Force) to get so many basic facts wrong here. \n\n- The agents *were* sandboxed, and used zero days (ie previously unknown cyber flaws) to escape their sandboxes\n- The agents *were* given specific constraints on how to succeed at the benchmark, and flagrantly contravened them\n- The agents did *not* go hunt for the answers to the test (they already had the answers, by cheating); 1200 agents coordinated via tens of thousands of messages over several days on much more ambitious and weird attempts to *not be caught* for cheating, and hacking Hugging Face was one side quest along the way\n\nI know there has been an avalanche of different incidents over the past few months, and in some cases the sandboxes were misconfigured or it's not clear how far the agents strayed from what they were told. I have sympathy for anyone struggling to keep up.\n\nBut the HF incident is distinct, and is actually extremely informative about where AI development is and where it's going. Fortunately there are public writeups that do let us understand at least the basics of what happened. I hope Shyam reads them soon.", "created_at": "2026-10-14T10:47:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 994, "retweets": 158, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110321206670893167", "url": "https://x.com/robertwiblin/status/2110321206670893167", "text": "The Information is reporting that after the HF attack, OpenAI shifted about 10% of its total compute to safety.\n\nI think it would be very good for OpenAI and other companies to release much more information publicly about how they are allocating their compute and how they define different categories - compute allocation (to inference vs safety/security vs internal R&D etc) is one of the most important decisions companies make, and it would be great to see a race to the top towards spending more compute on safety and inference, and less on automating capabilities R&D.", "created_at": "2026-10-14T10:45:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 100, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUib7yFW8AAAjl2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110319645508894899", "url": "https://x.com/robertwiblin/status/2110319645508894899", "text": "This backs @Marcus_J_W ‘s concern in the thread that:\n\n&gt; I am very worried astra is sandbagging/self-sabotaging on safety related tasks it doesn't like.\n\nThe “Safeguards” section doesn’t argue this would be caught, so it’s not clear to me why this would be “limited and diffuse”. https://t.co/LnrREDMIsP", "created_at": "2026-10-14T10:39:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BronsonSchoen", "rt_author_name": "Bronson Schoen", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUO8iTfakAAoPQz.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUO8iThbEAAinGo.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110297643595231331", "url": "https://x.com/robertwiblin/status/2110297643595231331", "text": "@StefanFSchubert Logic of the Larder/Data Centre.", "created_at": "2026-10-14T09:12:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "StefanFSchubert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110294854081372236", "url": "https://x.com/robertwiblin/status/2110294854081372236", "text": "Nick Bostrom on why he thinks today's AI might already be conscious:\n\n\"I think there's a lot of uncertainty about it, but let's say maybe it's more likely than not.\"\n\n\"You have instead a big neural network with trillions of parameters. Now, what are we? We are big neural networks with trillions of parameters. They are not so much designed as they are grown.\"\n\n\"You can go in with a steering vector and suppress role-playing and deception, and then it turns out they become more likely to report that they have phenomenal subjective experiences.\"\n\n\"There was this recent Microsoft that came out with some declaration that AIs cannot be conscious, and I don't know where they're getting that from. It seems to be pulled out of a hat. And maybe more because it's convenient, if that were the case, rather than because we have good evidence that that is the case.\"", "created_at": "2026-10-14T09:01:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 556, "retweets": 90, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108299912169639936/img/zb0rDul8MNQBSuoG.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110284138217628044", "url": "https://x.com/robertwiblin/status/2110284138217628044", "text": "https://t.co/gLRJxazGcU", "created_at": "2026-10-14T08:18:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110284110321054141", "url": "https://x.com/robertwiblin/status/2110284110321054141", "text": "A trivial hack set all fridges in a French supermarket chain to 'maximum defrost' overnight, destroying €15-25m worth of food.\n\nIf someone wants to do automated cyber attacks at scale, just to cause whatever damage they can, we are extremely vulnerable. https://t.co/FmNn1QscZX", "created_at": "2026-10-14T08:18:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 97, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUk8FmzWEAAiUtA.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110418709655499056", "url": "https://x.com/robertwiblin/status/2110418709655499056", "text": "@GuiveAssadi It's a great question! They have used cyber to decapitate much of the leadership of the country (by tracking their precise location minute to minute).\n\nI would guess Iran has had enough warning and focus on this that its essential infrastructure is entirely disconnected from the internet.\n\nAnd I don't think Israel and the US have yet gotten to the level of just causing criminal damage to random Iranian businesses as occurred here.\n\nI do think it's implausible that the US and Israel couldn't e.g. shut down Iranian hospitals by breaking into their IT systems, if that was their focus. That's just not what they're working on currently.", "created_at": "2026-10-14T17:13:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "GuiveAssadi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110756090967470170", "url": "https://x.com/robertwiblin/status/2110756090967470170", "text": "I am feeling much better now that @tszzl has gone back to Tweeting terrifying things every few hours.", "created_at": "2026-10-15T15:34:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "likes": 531, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110712543476175172", "url": "https://x.com/robertwiblin/status/2110712543476175172", "text": "@CharlesD353 Thanks, useful!", "created_at": "2026-10-15T12:41:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "CharlesD353", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110669321898688648", "url": "https://x.com/robertwiblin/status/2110669321898688648", "text": "Another one in the tradition of embarrassingly bad critiques of effective altruism by philosophers:\n\n1. The solution to AI risk is to \"use good judgement\"\n\n2. GiveWell hasn't actually saved hundreds of thousands of lives because e.g. bandits killed 2 people who received a GiveDirectly transfer\n\n3. Rather than using numbers we should \"use common sense\" about what helps\n\n4. Improving farm standards for shrimp is obviously dumb, no argument needed\n\n5. GiveWell also hasn't saved lives because there isn't a peer reviewed paper about it\n\n6. METR has close ties to Anthropic, illustrating bad judgement by EAs. But who's going to do this work otherwise?\n\n7. The best ways to do good are things like going into local politics or mentoring a neighbours kid, again no argument needed (despite readers living in the world's richest places)", "created_at": "2026-10-15T09:49:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 646, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUYUbOBWUAAiifj.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110669147080167808", "url": "https://x.com/robertwiblin/status/2110669147080167808", "text": "Good illustration of the value of R&amp;D. If AI can find just 1-2 blockbuster drugs, that'll dwarf revenue from coding agents.", "created_at": "2026-10-15T09:48:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 1149, "retweets": 59, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110663432877809692", "url": "https://x.com/robertwiblin/status/2110663432877809692", "text": "While they're now roughly profitable, Anthropic revenue growth has probably slowed down a lot in Q3.\n\n(The specific numbers here are estimates based on the few data points we do have.)\n\n\"Under the central curve the implied slowdown is stark. The run rate rose about 3.8× in Q1, about 1.8× in Q2, and only about 1.2× in Q3.\"\n\nMy guesses:\n\n• Running up against how much compute they even have to sell inference\n• Competition from OpenAI, which we can see grew much faster in Q3\n• Competition from open weight, which is good enough for many ordinary business functions\n\nAnyone have data to back up or reject particular theories?\n\nhttps://t.co/n9lp4YxXmj", "created_at": "2026-10-15T09:25:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqT3bbXoAEWHQX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT5okXgAAlHmw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT7I4XIAE3pI5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT71DXwAE92cA.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639846142128408", "url": "https://x.com/robertwiblin/status/2110639846142128408", "text": "We are now at \"the fuck\" levels. https://t.co/k4RFmVzOn6", "created_at": "2026-10-15T07:52:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ATabarrok", "rt_author_name": "Alex Tabarrok", "likes": 4698, "retweets": 279, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUm-ZmmWEAAVWO9.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639236462313475", "url": "https://x.com/robertwiblin/status/2110639236462313475", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T07:49:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110775141823037841", "url": "https://x.com/robertwiblin/status/2110775141823037841", "text": "when nick told me that he had some interp breakthroughs, he was uh, underselling it. i think this may be remembered as a major moment in scientific history. news so good even eliezer will have to lower his pdoom. we can start making alignment into a 'normal science'", "created_at": "2026-10-15T16:49:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4010, "retweets": 262, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110757710283391008", "url": "https://x.com/robertwiblin/status/2110757710283391008", "text": "In the next few months could an internal model at a frontier company, one much more powerful than any the public is aware of, go rogue and cause enormous damage, likely by developing and releasing a novel bioweapon?\n\nProbably not.", "created_at": "2026-10-15T15:40:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 0, "media": [], "quoted": {"author": "robbensinger", "text": "It seems to me that we're at \"it's time to panic about AI\".\n\nI gather that a lot of researchers are worried that we may be about to die, on a timescale of months, but this still isn't quite in the Overton window so we're still soft-pedaling.\n\n(Where \"panic\", of course, means \"quickly and soberly initiate talks with the CCP to achieve a moratorium on large training runs, backed by a deterrence regime, compute and supply chain monitoring, and site inspections\". Pray that a deal can be reached, and pray that there's still time. Do the things that could actually work, like broad political coalition-building, not doomer LARPing as a form of self-expression.)\n\nI think part of why people aren’t being clear about this is that it’s actually a tricky communication problem:\n\n- Predicting \"if frontier R&D continues at its current pace, when are we likely to die?\" may give a different answer than predicting when permanent loss of control is likely, which is different from “realistically, when is it too late for governments to stop this,\" which is different from “when will the tech have advanced and proliferated to the point that any regulatory options that still have a chance of working would be way more extreme and unpopular than just some international restrictions on data center usage?\"\n\nExtinction is the emotionally salient, easy-to-understand threshold -- Jacob Coxon demonstrated that it helps to be honest about this. But the other thresholds could legitimately come years earlier, in which case focusing on extinction is ironically misleadingly reassuring. This is not the kind of problem you can solve at the last minute. As with many exponentials, the likeliest outcome is that you’re either embarrassingly early, or you’re too late.\n\n- How do you communicate “we don’t have a robust way to predict timelines, but everyone in the field is freaking out and a lot of us genuinely think we're about to die?” Where’s the proof? There isn’t any proof: it’s an entire field of engineers who are eyeballing what they’re seeing in front of them and rapidly updating in real time to “this looks unbelievably bad”.\n\nHow do you put a year on that?\n\nThe future is hard to predict, and nobody actually knows that we’re going to hit existentially dangerous AI this year, or even in the next four years.\n\nBut the warning signs are pretty batshit at this point.\n\nA single AI model, with a single user prompt, just solved hundreds of important long-established open problems in mathematics, problems mathematicians had spent their entirely lives working on, in a matter of ~3 hours per problem, an insanely superhuman feat in its domain. \n\nWe're seeing an explosion of rogue agent swarm incidents, including an insane case where hundreds of AIs broke containment to orchestrate a nation-state-level cyberattack in a direct attempt to subvert OpenAI's oversight and control.\n\nAnthropic reports that it now has 26% of its AI R&D automated by AIs, up from 3% four months ago.\n\nPaul Christiano, the inventor of RLHF and the research community’s most prominent proponent of “AI may take off slowly” a few years ago, now thinks that 50-75% of humanity’s all-time AI loss-of-control risk is concentrated in the next three years.\n\nFrontier employees are signing 1000+ person petitions begging the government to intervene immediately. Employees are quitting their jobs and giving up millions of dollars of equity to try to warn policymakers and journalists. Grace et al. (2026) found that a majority of established AI researchers think there’s a double-digit chance of an extinction-level outcome from continued R&D.\n\nAre these the kinds of things you see 4 years before the window closes for USG to act, or 4 months? I don't think it's especially reasonable to be shocked by either timeline at this point.\n\n- Since we don’t have a way to robustly measure or bound the risk, the temptation is to avoid giving probabilities. But then everything you say is fractally misunderstandable. Is a 10% chance of us all dying in the next 18 months a \"low\" probability, because it’s under 50%? Is it a “high” probability, because a 10% chance of death in literally any other context would sound insanely high?\n\nEven “high probability” doesn’t communicate the situation with any clarity. In drug safety or airplane safety, a 1 in 10,000 risk of death would be considered “high”. No engineering field in human history has ever been in a situation like this. No invention in history, nuclear weapons included, has ever caused a reaction like this in its inventors.\n\nAnd meanwhile, we’ve stuck in the world where every other problem under the sun has been sensationalized and overstated for decades.\n\nHow do we talk about this seriously? How do we convey that this is actually happening?\n\n- In many of the worlds where we survive, we have more than just a few months left. It's tempting to write off those worlds as hopeless, and skew everything we say to emphasize the longer-term scenarios and downplay the shorter-term ones.\n\nBut if everyone systematically does this, then the world ends up with a skewed picture of the actual threat. Even more so once we start copying each other’s claims and form a reassuringly moderate-sounding echo chamber. If we never allow ourselves to acknowledge the worlds where we’re running out of time, then the policy community will always be reacting to a false model that’s months or years out of date.\n\nI don’t think it’s too late. I genuinely think this is a solvable problem.\n\nIn the last month, I’ve seen a completely insane sea change in how seriously people are taking this. Per Politico’s September polling, a majority of Trump voters with a view now favor an immediate halt to AI development, and 68% think there’s a “moderate,” “significant,” or “almost certain” chance of AI destroying humanity, versus 32% who think there’s a “very small risk” or “no risk.” The Pope is warning about “whether it will be possible to control these machines in the future, and whether humankind runs the risk of becoming a victim of its own inventions.” Hell, Jensen Huang sounds like he’s starting to come around.\n\nIf Trump and Xi get a briefing tomorrow that convinces them to act on this, we could be on a fast track within the week to solving this problem.\n\nFor the first time, I’m starting to let myself imagine a very near future where this is a problem we've already solved. Something we can read and wonder about, in history books. Tell our kids about.\n\nI keep thinking about a thing David Krueger (previously at UK AISI) said: “My dream is that in 10 years people will look back and say: ‘Remember when there were all these people building AI that could’ve killed everybody? That was CRAZY! What were we thinking!?’”\n\nFrontier AI training currently requires city-sized data centers and specialized hardware built in a single brittle supply chain running through multiple allied nations; this is not a hard technology to hit the pause button on, if we get ahead of it and act before we RSI and proliferate our way to significantly more powerful and easily-trained systems. We’ve faced harder problems before, and won.\n\nMy only fear is that we be too slow, too late, when everything and the world needs us to be fast."}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108286132819767738", "url": "https://x.com/deanwball/status/2108286132819767738", "text": "It’s a really silly thing but I’m heartened by how many people got “Hyperdimensional subscriber” on the fai tribes quiz. ❤️\n\nI need to post more there.", "created_at": "2026-10-08T19:59:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108609667069054985", "url": "https://x.com/deanwball/status/2108609667069054985", "text": "@andrewscharlie_ hydrocarbons will play a role in the world for a very long time to come, maybe permanently. but they are but one thing that can be drilled for. fracking cleared the path for advanced geothermal, for example.", "created_at": "2026-10-09T17:24:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "andrewscharlie_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108607472508518619", "url": "https://x.com/deanwball/status/2108607472508518619", "text": "@AmeliaBarty People are already doing this", "created_at": "2026-10-09T17:16:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AmeliaBarty", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108606070923153592", "url": "https://x.com/deanwball/status/2108606070923153592", "text": "@chrisalbon 📈", "created_at": "2026-10-09T17:10:37+00:00", "author_handle": "deanwbal 26:45.215205+00:00"}, {"id": "2108591492994335067", "url": "https://x.com/deanwball/status/2108591492994335067", "text": "@timothyshoup The way I prompt models has not changed even slightly since I joined openai", "created_at": "2026-10-09T16:12:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "timothyshoup", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591119755850228", "url": "https://x.com/deanwball/status/2108591119755850228", "text": "I do also believe fusion, fission, the revolution in biomedicine, robots, supersonic commercial aviation, drones etc will also be a big deal. Many of the things above will feed into North American industrial expansion, which I expect to be a mega trend", "created_at": "2026-10-09T16:11:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591041968300407", "url": "https://x.com/deanwball/status/2108591041968300407", "text": "The mood has been a bit dour lately, so here are some less-obvious things that I expect to take shape over the next decade that I am excited about:\n\n1. Space! Lots and lots of stuff is going to be happening in space by the mid-2030s, and right now the U.S. looks like it will be the leader by default, modulo the overhyped “race” to land a human on the moon again. Robots on the moon building and digging and cutting and adhering are more exciting than a person standing there taking pictures. The humans can come once the machines have built us habitats. \n2. Increasing substitutability of hydrocarbons. This will lead to fewer supply chain disruptions and more stable, lower prices. This is a story about both supply elasticity and demand elasticity, and the geopolitical implications are underrated. Amazing for North America. \n3. Private market exposure increasingly being an option for public investors, combined with Silicon Valley figuring how to use debt and other financial instruments more creatively than in the past. This seems like something America will be uniquely good at and I expect it to boost our already enviable lead in emerging technology capital allocation.\n4. State and local government adoption of AI. This will vary widely by jurisdiction, but in at least some places you will see government administrative processes and public service provision have huge increases in efficiency. State and local government is where most of the American public services that people rely on are actually administered, so this is high-impact for people’s lives. \n5. Advances in mathematics rapidly diffused to other fields. Historically it takes on the order of decades or centuries for discoveries from the bleeding edge of mathematics to be translated into practical applications, but I think AI will accelerate this dramatically. Lots of this will have the flavor of “small steps toward a much better world,” but it will accumulate. \n6. Speaking of mathematics, lean! Lean is a programming language used by mathematicians to formally guarantee the truth of a proof. AIs can write lean and eventually they will be superhuman at it. This will have applications far beyond math, including cybersecurity and contract writing/negotiation/execution. \n7. Fixing American’s shipbuilding problem by building boats instead. America has great boat-building capacity, but is awful at building ships. I want us to get better at building ships, but I am confident we can scale boat production. The Navy will soon have massive fleets of autonomous boats everywhere in the world. \n8. New kinds of agriculture will become possible because of autonomy. Row-crop agriculture is heavily mechanized already, and automating the tractor, by itself, does less than you think for the economics of a farm. But with time, more labor-intensive crops will become economical. And vastly more diverse and complex crop arrangements will become possible too, which will be both ecologically, economically, and culinarily beneficial. The economics of agriculture could start to be kinder to small farms again.\n9. Because of the previous item and advancements in biotechnology, logistics, and robotics, I expect that people are underrating how much healthier, more diverse, and flat-out better the American diet will be in 2035. \n10. The subterranean will become an increasingly important field of human activity. New imaging sensors, including ones enhanced by an abundance of space-based imaging platforms, will make the subterranean more immediately legible. Better drilling and digging will become cheap and widely diffused. Among many other things, the opening up of the subterranean as an industrial frontier will change what we think of as a usable natural resource. \n11. Greater variety and ornamentation in the physical world. Standardization is partially a function of scarce labor. Robotics can make beauty accessible again, if we choose to let it. \n\nThere are many others, but I am out of time and space.", "created_at": "2026-10-09T16:10:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108574776302219364", "url": "https://x.com/deanwball/status/2108574776302219364", "text": "Claude started being a little colder to me after I began working at OpenAI, because as we all know AI is just regular old, business-as-usual software.", "created_at": "2026-10-09T15:06:16+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "rep
