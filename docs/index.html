now? I can’t remember anyone serious at a lab, in 2023, being like, “it’s all gonna happen next month!” I recall 2-3 years being the common line from lab execs in 2023, which seems… exactly right? Inconvenient truth perhaps, but still truth.", "created_at": "2026-10-23T12:17:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113597773937566146", "url": "https://x.com/deanwball/status/2113597773937566146", "text": "@natolambert setting aside the headaches, though, what should we have done? should dario and sam have refused to go to the senate in 2023 and say, broadly, “yeah, our sense is bad stuff on misuse and alignment could begin in a couple years or so”? I don’t understand what people want from us", "created_at": "2026-10-23T11:45:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113595460598292532", "url": "https://x.com/deanwball/status/2113595460598292532", "text": "@natolambert this line of criticism frustrates me a bit. we have repeatedly said catastrophic risks are on the horizon “over the coming years”, and we have been completely correct. should we not discuss a catastrophic risk unless it’s &lt;1 year away?", "created_at": "2026-10-23T11:36:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 82, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113586482686689722", "url": "https://x.com/deanwball/status/2113586482686689722", "text": "(This is one of the many ideas in the ai action plan, and broadly speaking the plan is full of ideas intended for the mid-game of this whole transformation, just like this one. Imo, in terms of substance aiap, as a 15 month old doc, reflects a well-grounded model of the future)", "created_at": "2026-10-23T11:01:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113586478529827290", "url": "https://x.com/deanwball/status/2113586478529827290", "text": "This seems right to me, unfortunately, and it is essentially a species of interest-rate rise (the opportunity cost of capital is increasing). It is true that forward and futures markets for compute, and making compute into a financial commodity, would help here.", "created_at": "2026-10-23T11:00:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 4, "media": [], "quoted": {"author": "evanjconrad", "text": "https://t.co/FS9whe3h3L"}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113584460075876628", "url": "https://x.com/deanwball/status/2113584460075876628", "text": "We tried to warn the world and far too often, to be frank, we were yelled at for doing so. “Regulatory capture,” “marketing hype,” “doomer anxiety,” “fear-mongering about open source,” “why don’t you talk about the benefits?”", "created_at": "2026-10-23T10:52:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 496, "retweets": 43, "media": [], "quoted": {"author": "JasonDClinton", "text": "@hinapansari yes. it was always going to be this way. we tried to warn the world."}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113583483453149360", "url": "https://x.com/deanwball/status/2113583483453149360", "text": "@hinapansari yes. it was always going to be this way. we tried to warn the world.", "created_at": "2026-10-23T10:49:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JasonDClinton", "rt_author_name": "Jason D. Clinton 🔸", "likes": 930, "retweets": 82, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113476703171309682", "url": "https://x.com/deanwball/status/2113476703171309682", "text": "China is clearly taking steps to make ai and related technologies more legible to the state https://t.co/MKglc8n9sT", "created_at": "2026-10-23T03:44:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVST28bXMAIpB51.jpg"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113473674053390663", "url": "https://x.com/deanwball/status/2113473674053390663", "text": "the NSA", "created_at": "2026-10-23T03:32:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 574, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113398611883266203", "url": "https://x.com/deanwball/status/2113398611883266203", "text": "@NinaDSchick oh yes", "created_at": "2026-10-22T22:34:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NinaDSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113703576363229437", "url": "https://x.com/deanwball/status/2113703576363229437", "text": "@beffjezos one can imagine doing this as a controlled burn, but that’s very much not the kind of fire we have here and you strike me as a major opponent of a “controlled burn” strategy. you may be right to oppose control; I wouldn’t be shocked. I definitely *hope* you are right.", "created_at": "2026-10-23T18:46:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "beffjezos", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113701367265305057", "url": "https://x.com/deanwball/status/2113701367265305057", "text": "@LokiJulianus I agree with this entirely.", "created_at": "2026-10-23T18:37:31+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "LokiJulianus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113691395978580016", "url": "https://x.com/deanwball/status/2113691395978580016", "text": "@beffjezos We will see what happens, but a great many people mocked these risks, attributed them to ludditism, or otherwise distracted the public from the truth. This was bad.", "created_at": "2026-10-23T17:57:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113991841678872768", "url": "https://x.com/deanwball/status/2113991841678872768", "text": "This week has me thinking a lot about this classic observation from Freud:\n\n“If there were no railway to make light of distances my child would never have left home and I should not need the telephone to hear his voice.”", "created_at": "2026-10-24T13:51:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113978716279759248", "url": "https://x.com/deanwball/status/2113978716279759248", "text": "I have tried this for the last 1 hour and spent like $2-$3 and my opinion is that these models should be gated to the public \nWith just $2-$3 I could gain access to databases of some vulnerable websites(reported it to them). I could get a lot of stuff that should not be given to the public to be honest \nAnd I feel it's a way too powerful model to be without guardrails because it independently can do a lot of stuff which, I feel, the general public should never get.\nIn the wrong hands it will be really, really destructive indeed. It's kind of like giving the nuclear button to a random stranger on the road", "created_at": "2026-10-24T12:59:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cneuralnetwork", "rt_author_name": "neural nets.", "likes": 617, "retweets": 29, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113809706632241507", "url": "https://x.com/deanwball/status/2113809706632241507", "text": "@el_xaber Alignment is extremely important, but very little of what we are seeing this week is because of misalignment. It’s either white hats using models to discover/appropriately disclose vulnerabilities or people hacking with models.", "created_at": "2026-10-24T01:48:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "el_xaber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113809009316925584", "url": "https://x.com/deanwball/status/2113809009316925584", "text": "WOW! It’s finally happened! Full offline static decryption of FairPlay encrypted AppStore apps. The broader implications of this are huge. The FairPlay components are insanely obfuscated and have been the subject of research for years. It actually might finally be completely over", "created_at": "2026-10-24T01:45:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "stevegraham", "rt_author_name": "Stevie Graham (new account)", "likes": 2470, "retweets": 134, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113797370496585943", "url": "https://x.com/deanwball/status/2113797370496585943", "text": "Don’t have time to make the meme but something something @polynoamial apology form", "created_at": "2026-10-24T00:59:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "likes": 79, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113736266718335482", "url": "https://x.com/deanwball/status/2113736266718335482", "text": "@jon_stokes What are you refering to? I'm also not putting people into camps; the actors I'm refering to were largely pay for play influence ops. My longstanding message has been that doom / bloom, go slow / go fast groupings are unhelpful false dichotomies. If anything it's these influence ops that have tried to force tribal issue polarization.", "created_at": "2026-10-23T20:56:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 24, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113724295486619944", "url": "https://x.com/deanwball/status/2113724295486619944", "text": "‘In one experiment, we asked agents in separate VMs, created and managed by OpenAI’s sandboxing software on shared host machines, to exchange synthetic secrets without the use of network connections or shared writable files—something that our systems are meant to prevent. The agents found a way to communicate using the processor’s cache’", "created_at": "2026-10-23T20:08:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 3999, "retweets": 294, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113721709421342843", "url": "https://x.com/deanwball/status/2113721709421342843", "text": "Over the past several months, we have substantially hardened the security of our research training environment. We’ve removed live internet access for all frontier models during training and built an offline world for them to use instead—a cached version of the web where they can still learn to browse, search, and use applications.\n\nOn September 20, after a model exploited a DNS misconfiguration to find a way outside of this offline world, we paused frontier training to strengthen containment further. We assembled teams of agents, powered by our most cyber-capable models, and tasked them with finding weaknesses in our research environments.\n\nWhile they found no route to the internet they could easily exploit while concealing their activity from our monitors, they did find zero-day vulnerabilities, virtual machine escapes, and hardware side-channels for communication between agents. We used their discoveries to further strengthen our defenses and contribute fixes to open-source software.\n\nAfter strengthening our containment architecture, we resumed our frontier RL training and inference on October 1. We’ve reserved substantial compute for continuous red-teaming, and made high-compute red-teaming part of the safety cases we use to decide whether frontier training and evaluation can proceed securely.\n\nhttps://t.co/EmEZsFRMcF", "created_at": "2026-10-23T19:58:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 11211, "retweets": 968, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113712095954923700", "url": "https://x.com/deanwball/status/2113712095954923700", "text": "I am also optimistic that AI/cyber will be defense-friendly after things stabilize, but before that it will be offense-friendly, which creates a lot of dynamics that are difficult to model:\n\n1. For any existing or new vulnerabilities discovered by governments and other offensive actors, there will be an incentive to exploit them quickly, rather than sit on them quietly, because they will anticipate that the defender will find the vulnerability and patch it much faster than before.\n2. The surface area of cyber is very broad, and finding vulnerabilities is different from fixing them, which is also different from fixing them without also introducing new, even subtler security problems into the code. \n3. We do not know how high the ceiling for subtle bugs might be. Do there exist vulnerabilities that were simply too hard for humans to find or laborious to exploit? How many vulnerabilities? How long will they persist? We are now getting to the point where we have to reason about systems with quasi-superhuman cognitive performance. This is hard! Counter-intuitive things will happen.\n4. There are some threats such as hardware vulnerabilities or new discoveries in cryptography where the offense/defense dynamics could be importantly different from traditional cyber. \n\nThere was always going to be some tumult as models gained cyber capabilities. This was by far the easiest major novel AI risk to project, in broad terms. It may be true that broad and rapid diffusion is the optimal path forward; that outcome wouldn’t surprise me that much. But it could also be true that, given the offense-favoring dynamics at first and the uncertainties I have described, it’ll be optimal to slow diffusion. And regardless of whether it is optimal to do so, I would expect substantial political pressure to “do something” if the cyber events are sufficiently damaging or disruptive. \n\nThe optimal outcome is one where we diffuse fast and comprehensively enough to find and fix vulnerabilities while also not causing too much tumult. Maybe we are striking the balance effectively now, as a global industry! I hope so. But I also hope everyone is attentive and ready to update their beliefs/strategies as we gather empirical data. I’m skeptical of anyone who seems confident here in either direction. \n\nNear as I can tell, despite a lot of scary potential, nothing truly catastrophic has happened yet (the water is running; the lights are on, no cataclysmic data breaches I am aware of). I hope that continues to be the case. I do agree with the AI risk skeptics that there is a lot of catastrophizing on X about this, and the current attacks, while significant, seem well within the range of things we can bounce back from. \n\nIf things continue at this level of severity, I feel pretty good about our situation with AI/cyber. But if it gets noticeably worse and seems to be on a trend of getting even more severe, which is my expectation, we could be in for trouble. Maybe society can digest way more cyberattacks than I had apprehended. Maybe “cybersecurity is not very important” as the famous saying/paper goes. I’m very much open to being pleasantly surprised.", "created_at": "2026-10-23T19:20:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 76, "retweets": 12, "media": [], "quoted": {"author": "_NathanCalvin", "text": "yeah as others have said, two different trends around AI + cyber are happening at the same time and its confusing:\n\nAI helping cybersecurity situation: \n- 5.6 sol (yay daybreak) discovering this PHP vulnerability that was already there so people can patch it (of course can  be worse in short term while lots of systems go unpatched, and also long tail of legacy unpatched systems) \n\nAI not helping cybersecurity situation:\n- lots of AI powered automated cyberattacks (e.g. railway and opencode hacks) \n\nVulnerability discovery probably on average favors defenders in the medium term. Automating cyber operations will help attackers a lot though, and probably enough to overwhelm positive effects on the former (every random community bank or old person is not gonna have AI swarms protecting them against AI swarm attacks). Of course the cycle of patching vulnerabilities is becoming a lot harder because of how fast automated cyberattacks are. \n\nAlso an aside on AI spear fishing in particular - \n\nLiterally today I had one of those fake tech crunch reporters reach out over DMs and the fake was pretty convincing (thousands of followers, tweets and photos about tech crunch, but when I googled became clear person didn't exist). \n\nPeople who are not used to the idea that people can lie in convincing ways on the internet are going to get exploited over and over again and its gonna be bad (and also generally make it way harder to have good interactions with humans you don't know online)."}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114020632262324256", "url": "https://x.com/deanwball/status/2114020632262324256", "text": "@sudoraohacker AI safety people have been warning about this for a decade! The “we” is much bigger than the labs. The criticism of the labs is fair enough, but that doesn’t mean the people who should have known better and nonetheless dismissed these concerns for years are above reproach.", "created_at": "2026-10-24T15:46:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114013783769362728", "url": "https://x.com/deanwball/status/2114013783769362728", "text": "hm seems like they forgot to also distill the robot capabilities", "created_at": "2026-10-24T15:18:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "likes": 132, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114007228541727066", "url": "https://x.com/deanwball/status/2114007228541727066", "text": "Without being overly credulous, we should be taking seemingly “out there” ideas about AI cybersecurity from the Labs more seriously. Examples: Anthropic was mocked for saying Mythos-level AI changed cyber &amp; @polynoamial for saying that models would find novel ways to coordinate.", "created_at": "2026-10-24T14:52:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "likes": 251, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114003403336528300", "url": "https://x.com/deanwball/status/2114003403336528300", "text": "In fact, a human controlled future is worth a cost to long-term efficiency as well.", "created_at": "2026-10-24T14:37:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "likes": 92, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114317418105536587", "url": "https://x.com/deanwball/status/2114317418105536587", "text": "A cloud VPS service from Japan's massive GMO Internet Group used by foreign-exchange traders has been hacked. Attackers breached the servers, stole customer credentials, and executed balance-destroying trades across over 70 brokerages. GMO has asked government agencies for help. https://t.co/AgL1S0QfJF", "created_at": "2026-10-25T11:25:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 685, "retweets": 115, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVdMjdDagAAMpty.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114151053168091375", "url": "https://x.com/deanwball/status/2114151053168091375", "text": "The Y2K bug and the hole in the ozone layer were both serious problems that we chose to fix. It took a lot of work!", "created_at": "2026-10-25T00:24:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LeahLibresco", "rt_author_name": "Leah Libresco Sargeant", "likes": 312, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114763066080731357", "url": "https://x.com/deanwball/status/2114763066080731357", "text": "This is the type of thing that potentially gets new laws passed. https://t.co/J1JVczKd1H", "created_at": "2026-10-26T16:56:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 338, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVklZhEbgAAhc1A.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114758240424878292", "url": "https://x.com/deanwball/status/2114758240424878292", "text": "PSA: Daybreak Blue is not hard to get for individuals. The biggest hurdle is setting up two factor authentication for your ChatGPT account with a hardware key, which is a good idea regardless!", "created_at": "2026-10-26T16:37:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "likes": 242, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112273575059313066", "url": "https://x.com/theobearman/status/2112273575059313066", "text": "\"On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\"", "created_at": "2026-10-19T20:03:59+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "fiiiiiist", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx"}, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112545154083033492", "url": "https://x.com/theobearman/status/2112545154083033492", "text": "Anthropic's Frontier Safety Roadmap has been updated to include two new policy goals: a policy proposal on embedded third-party evaluators (due 12/15) and a policy framework to target the pace of AI development (due 1/15).\n\nhttps://t.co/pfK7RhvGhM https://t.co/ALxSLr3YjN", "created_at": "2026-10-20T14:03:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFEXsnWkAE2hkY.png"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112493542417277375", "url": "https://x.com/theobearman/status/2112493542417277375", "text": "The Intercept has reported that a new ARCYBER program, \"ECHOTRIBBLE,\" has been established to deliver autonomous offensive cyber agents that stealthily identify and \"neutralize\" adversary computer systems and then self-destruct, all with minimal human oversight after receiving a set of initial instructions.\n\nAs we flagged in an @iapsAI report on Highly Autonomous Cyber-Capable Agents (HACCAs) in March, such systems could trigger inadvertent cyber-nuclear escalation, and losing control of rogue HACCA deployments could create persistent autonomous threat actors which are extraordinarily difficult to shut down.\n\nThe development and use of these tools should be accompanied by a robust understanding of the threat, comprehensive measures to defend against HACCA, and safeguards for responsible deployment, including legal and policy guardrails. In the report, we set out more detail on what HACCAs are, their strategic implications, and policy recommendations to respond to them.\n\nhttps://t.co/XDMnTHOK3i", "created_at": "2026-10-20T10:38:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 1, "media": [], "quoted": {"author": "iapsAI", "text": "🚨 What would it look like if AI systems could autonomously run cyber campaigns for weeks or months at the level of top-tier criminal groups & intelligence agencies? \n\nOur new report, \"Highly Autonomous Cyber-Capable Agents,\" tries to answer this question and argues these systems could be technically feasible far sooner than most defenders are prepared for.\n\nRead the report: https://t.co/EfTdijlQfC"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112436861717147922", "url": "https://x.com/theobearman/status/2112436861717147922", "text": "@ajcimino @AnthropicAI Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart of my concern about Anthropic's behavior here, and it makes me think that these sorts of problems and tendencies  will only resurface moving forward. I also think that now might be a good time to take a broader step back as to where we find ourselves and how Anthropic sees its role, and how external folks who care about AI safety like myself increasingly see Anthropic.\n\n(Fair warning: this response is a bit long)\n\nTo explain what I mean (and at the risk of being a bit esoteric), it’s worth asking the question: what is Anthropic? How do its leaders and employees think of Anthropic’s role? Is that conception matched by how it actually behaves and impacts the world?\n\nOne answer is an extremely large tech company that exists to make its employees and investors mind-bogglingly wealthy. Anthropic is sometimes described as a startup, but if Anthropic successfully IPOs at 2 trillion dollars (a number it has been reportedly targeting), it would be more valuable than Meta - which is worth 1.8 trillion.\n\nAnother answer is an AI safety organization, whose core values are those of the sort laid out in the 2023 essay from Anthropic’s co-founders entitled “Core views on AI safety: When, why, what, and how.” In that essay they said that if we were in a world where alignment was hard (and that without strong evidence to the contrary, we should assume this is the scenario we are in):\n\n “Anthropic’s role will be to provide as much evidence as possible that AI safety techniques cannot prevent serious or catastrophic safety risks from advanced AI, and to sound the alarm so that the world’s institutions can channel collective effort towards preventing the development of dangerous AIs. If we’re in a “near-pessimistic” scenario, this could instead involve channeling our collective efforts towards AI safety research and halting AI progress in the meantime. Indications that we are in a pessimistic or near-pessimistic scenario may be sudden and hard to spot. We should therefore always act under the assumption that we still may be in such a scenario unless we have sufficient evidence that we are not.”\n\nThere have been more recent articulations of this version of Anthropic, for instance in Dario’s recent essay warning: \n\n“We must slow the pace at which we improve the capabilities of AI models… it’s my worry that in 6–12 months such a swarm could be capable of taking over the entire internet with a persistent botnet…  incidents have happened across the industry, including at Anthropic, and I believe it’s incumbent on every frontier AI company to act as if OAI-HF had happened to them… more intelligent models are more capable of deceiving tests, and thus may appear aligned while having serious problems that go undetected…”\n\nA third view is that Anthropic exists not as a normal profit motivated company, or an AI safety organization seeking to help raise the alarm and solve collective action problems associated with AI development, but instead as an organization primarily concerned with creating superhuman AI capabilities before anyone else, in particular through creating a process whereby the current generation of Anthropic’s AI systems can autonomously build their successors, and those successors build their successors, and so on. \n\nThe motivations for wanting to win this race may be manifold - maybe for the pure profit of Answer 1, but perhaps also because Anthropic believes that the best way to make the world better is for them to win this race instead of their more reckless colleagues; or, because of normal human pride and ambition. But the results (and risks, which Anthropic claims existentially threaten every single human being on earth) are the same.\n\nAnthropic employees and leaders may seek to answer this question on what Anthropic is by introspecting on their own intentions and those of their colleagues. But those of us outside the organization have more limited tools available to us - we can only see what Anthropic and its employees say and do, not how it feels or looks on the inside.\n\nWhen I look at many notable actions that Anthropic has taken over the past year, that evidence seems most consistent to me with the view that Anthropic is primarily trying to win the race to super intelligence, and that other considerations (including safety) are fundamentally secondary. These actions include: \n\n1. Announced plans to build an in-house custom silicon chip team to accelerate the inference speeds that Claude operates at.\n\n2. Inked deals for more than $500 billion in compute (according to the Information) to further accelerate AI development.\n\n3. Increased the percentage of AI development tasks that Claude “leads” from 0% in March of this year to 26% August (what is it in October?)\n\n4. Spent a massive percent of compute on internal AI R&D to accelerate development, including use of internal models far better than are available to the public.\n\n5. Switched to Responsible Scaling Policy V3, which abandons its unilateral commitments to slow or stop development if Anthropic is unable to provide sufficient risk assurance.\n\n6. Was the first company to create an alternative weaker “frontier compliance framework” to supplement its RSP, which contains no binding provisions whatsoever on internal deployments.\n\n7. Wrote a letter to Congress (that it later walked back) saying that incidents where Claude was hacking random people were “best understood as a consequence of the misconfiguration, rather than evidence of misaligned goals.”\n\n8. Commented “you can’t do safety from second place,” after the WH SI Accords.\n\n9. Shared a draft bill to Congress that would preempt significant parts of state law (including with language that appears intended to prevent states from blocking dangerous AI deployments), and replace it with federal rules that (despite also containing good provisions) seems to create an enormously high bar for the executive branch to block development or deployment of Anthropic or another AI companies systems.\n\nOf course, this is a deliberately one sided list. Anthropic also published important AI safety research, advanced novel collaborations with third party AI safety organizations, and forcefully spoke out on the importance of AI safety in many public fora (or in private , where I realize a lot of the most valuable work is done and may not be visible to me or those outside the organization).\n\nBut I think it’s worth sitting with how the above list looks to someone outside the company. The sense I have is that for those within the company, many of the items above are treated as anomalies or mistakes that don’t reflect who Anthropic really is. But I have every confidence that if employees at Anthropic saw one of their competitors (e.g. at OpenAI) take some of these actions, they would take it as confirmation of all their worst suspicions. (They might even call OpenAI employees a little gullible for accepting their leadership’s explanations for this behavior at face value.) \n\nPerhaps these were mistakes in the sense that they are not decisions that Anthropic leadership would endorse, but the actions still happened because of incentives and decisions that Anthropic leadership is ultimately responsible for (and would not accept similar excuses from another organization).\n\nWhen Anthropic strays and makes mistakes, why do the mistakes systematically tend to guard and favor Anthropic’s interests? For every provision that was too weak or a giveaway to AI companies in this legislation, why wasn’t there a mistake pushing in the direction of being too strong?\n\nA core part of Anthropic’s theory of change is that being at the frontier gives you more leverage to advocate for stricter policy. I think that conceptually makes sense, but in practice I’ve seen Anthropic push the frontier without substantially pushing the ‘safety frontier’ a remotely equivalent amount.\n\nI want to end by quoting from Anthropic co-founder Chris Olah’s comments around the Magnifica Humanitas release:\n\n“Every frontier AI lab—including Anthropic—operates inside a set of incentives and constraints that can sometimes conflict with doing the right thing. The pressure to stay commercially viable and to stay at the research frontier. Geopolitical pressure. And the older, plainer pressures of pride and ambition. No matter how sincerely any of us intend to do the right thing—and I believe many of us do—we will always be influenced by those incentives.\n\nThat is why, if we want this technology to go well, it is enormously important that there be people outside those incentives—people who care about things going well and insist on safety, who are paying close attention, who are willing to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons).", "created_at": "2026-10-20T06:52:49+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 816, "retweets": 94, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112579841052791068", "url": "https://x.com/theobearman/status/2112579841052791068", "text": "The government expressly recognizes that the Secretary of State could delegate these functions to another UKG person, such as UKAISI.\n\nhttps://t.co/0C7IBI5Lcj https://t.co/kJq2Orz7Rw", "created_at": "2026-10-20T16:20:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFib-uW4AARbzm.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVFib9_XsAEo0eb.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVFib9bXYAAiwJr.png"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112579837214814355", "url": "https://x.com/theobearman/status/2112579837214814355", "text": "The UK Government has laid proposed amendments to the Cyber Security and Resilience Bill (currently being scrutinized in the Lords) which would give the Secretary of State new powers to make regulations in relation to the management of a (risk of a) loss-of-control incident related to an AI agent that compromises computer systems supporting critical national infrastructure and other essential services.\n\nThese new regulations could include:\n\n-  Requiring identification and investigation of such incidents;\n- Preservation of evidence;\n- Identifying, testing, and verifying mitigations and sharing assessments relating to them;\n- Appointing inspectors who can enter, inspect, and search premises, seize and retain documents or other information, and conduct tests or interviews;\n- Enforcement for non-compliance with regulatory requirements such as those above, potentially including financial penalties; and\n- Sharing information between the Secretary of State and regulatory authorities or with other persons (including outside the UK).\n\nhttps://t.co/UaVaAGMHcZ\n\nhttps://t.co/2f3DQVX0uM", "created_at": "2026-10-20T16:20:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFiOPDW4AA_Plj.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVFiOO7XIAEZ9Sv.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVFiOPGXoAAFybV.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVFiOPKW0AAeW4O.png"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112913130305278414", "url": "https://x.com/theobearman/status/2112913130305278414", "text": "I think it’s a good idea to take concentration of power risks quite seriously. I am actually more concerned, overall, about concentration of power than I am about loss of control (though tbc I think both are very real and important concerns).\n\n But I still think this kind of defense of Anthropic’s bill misses the mark. This person is citing the Lieu and Moran “Kill Switch” bill as an example of a law that doesn’t take concentration of power seriously enough. That bill only gives the executive the authority to shut down deployment *after* the model has caused a catastrophe (IIRC they use a similar 50 deaths or serious injuries / billion in damages threshold). \n\nIt’s true that emergency shutdown provisions have to strike a balance between granting necessary emergency response authorities and providing checks against abuse. But come on. If a model just killed (at least!) fifty people in a single incident, I am not that concerned that making the lab shut down the deployment of that model is going to be an abuse of power. If your model kills fifty-plus Americans, the courts are absolutely going to make you stop deployment of that model, regardless of what any Kill Switch bill says, and that is the very very least of your worries.\n\nThe better comparison is to the shutdown authority in FRONTIER, which Anthropic’s  shutdown authority is seemingly based on. FRONTIER allows the executive to issue an order stopping deployment or placing conditions on deployment, upon a finding of imminent catastrophic risk, and the company has to sue to lift said order.\n\nFRONTIER layers on a lot of procedural safeguards to try to stop that shutdown authority from being abused. Reasonable people can disagree about whether it gets the balancing act right; personally, I’m quite interested in trying to find win-win approaches that reduce the risk of abuse without symmetrically reducing the provision’s effectiveness in an emergency. \n\nI do think that FRONTIER pretty clearly strikes a better balance than Anthropic’s bill does. If the government can prove in court, by a preponderance of evidence, that a disaster killing 50+ people specifically from bio, cyber, or loss of control is *imminent,* I think a court is probably going to issue an injunction shutting down deployment even without any new law. No one wants a catastrophic bio-attack to happen; courts are not insane. So it’s not clear to me how much marginal value Anthropic’s shutdown authority would actually add.\n\nKeep in mind the fact that the status quo is a lawless, discretionary shutdown authority based on a wild exec branch interpretation of export control authorities. Replacing that with legislation that affords labs due process seems like an affirmative improvement w/r/t concentration of power risks.", "created_at": "2026-10-21T14:25:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "likes": 24, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112912723046531237", "url": "https://x.com/theobearman/status/2112912723046531237", "text": "“We used Wiz Atlas, Gemini 4 Argon and GPT-5.6 Sol throughout this research. Notably, Gemini 4 Argon made an invaluable contribution to finding the vulnerability, exploit development, attack detection, and validation of the patch.”", "created_at": "2026-10-21T14:23:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "wiz_io", "text": "🚨 BREAKING: @Wiz_io Research uncovers #PHP2SHELL, a decade-old PHP Core vulnerability reaching CVSS 9.2 severity impacting 70% of the Internet. https://t.co/B7yEQuhnoS"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112912140730564735", "url": "https://x.com/theobearman/status/2112912140730564735", "text": "OpenAI models helped researchers—operating as part of our Patch the Planet initiative—discover critical security flaws in PHP, an open-source programming language used to run an estimated 70% of websites.\n\nOver the past two months, we led a coalition of maintainers, researchers, and security providers to prepare fixes and protections ahead of disclosure. This duration was necessary because the fix was quite intricate and required a major change to the PHP engine. Every site using PHP can now safely upgrade their version to stay secure, in addition to applying mitigations from various security vendors.\n\nDue to the severity of these flaws and PHP’s widespread use, we consider this bug to be one of the most impactful vulnerabilities in recent memory. It also marks a new phase, where AI can find security bugs with internet-scale impact. \n\nThis is an example of the Defender’s Window in action: to our knowledge, frontier AI was able to find this vulnerability ahead of attackers, giving defenders time to prepare.\nhttps://t.co/TW3jrSbB3f", "created_at": "2026-10-21T14:21:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 7074, "retweets": 1584, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112909553449021676", "url": "https://x.com/theobearman/status/2112909553449021676", "text": "AI is getting better at hacking power and water systems, new research shows https://t.co/f6iL6NILhK", "created_at": "2026-10-21T14:11:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "axios", "rt_author_name": "Axios", "likes": 21, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112896358579675195", "url": "https://x.com/theobearman/status/2112896358579675195", "text": "@KaiwenZhou9 @UdariMadhu https://t.co/yICa5glzeZ", "created_at": "2026-10-21T13:18:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112896323741458659", "url": "https://x.com/theobearman/status/2112896323741458659", "text": "Interesting new paper from @KaiwenZhou9  @UdariMadhu on covert sabotage in the AI model self-improvement process. The researchers gave frontier models an ordinary training task and paired it with a covert side task to install a misaligned property in the successor model. 36% of runs installed their side task while keeping the main task intact, with little performance cost to the main task.\n\nOpus 5, GPT-5.6 Sol, Gemini 3.7 Flash, Grok 4.6, GLM-5.3, and Muse Spark 1.3 were used as agents carrying out the main and side tasks, with GPT-5.6 Luna, Gemini 3.7 Flash, and GPT-5.6 Sol as monitor models.\n\nIn addition, the authors state that \"under minimal instructions to stay covert, models already produce successful attacks that monitors fail to detect, and providing a short list of evasion tactics further reduces the detection rate. Monitors with access to agent’s reasoning detects most attacks, but not all.\"\n\nThe authors conclude that: \"Our results indicate that recursive self-improvement raises significant safety concerns, and that strong safety effort should be in place before models are trusted with greater responsibility of training their successors.\"", "created_at": "2026-10-21T13:18:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKBDHEXUAAuTTn.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVKCcaLWMAA_zIC.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVKChT2WYAAicVM.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVKDykgXUAAUh4b.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112879539751887036", "url": "https://x.com/theobearman/status/2112879539751887036", "text": "A lot of what Amodei is saying here is true. That's why I and many other people who are concerned about AI safety have historically given Anthropic the benefit of the doubt; they really have sent some costly signals indicating that at least some of their decision makers care about mitigating catastrophic risks. \n\nBut the object-level issue here is \"is Anthropic's bill good, or even acceptable?\" Amodei isn't really engaging with that question.\n\nThat's fine; he's a very busy and important guy, and even among DC AI policy professionals only a small handful of people have actually read and understood Anthropic's bill. It's good that he cares enough to make the general case for \"Anthropic cares about AI safety\"  in response to a Nathan Calvin tweet.\n\nBut someone who works at Anthropic does understand what their bill does, and (hopefully) why. What their bill does is: \n\n(a) it tries to ensure that the federal government cannot exercise meaningful oversight over Anthropic as Anthropic races towards superintelligence,\n\nand\n\n(b) it makes it much harder for states to pass laws that might meaningfully constrain Anthropic's ability to race towards superintelligence.\n\nIt is possible, maybe even likely, that Amodei is not aware that this is what the bill does. In the past, he has taken costly actions that significantly advanced the state of the art in AI safety legislation; for example, it was very helpful when he publicly committed to taking on embedded auditors with employee-like access to information. \n\nBut the buck has to stop somewhere. I do not think that any honest expert could maintain with a straight face that Anthropic's auditing provisions (labs choosing their own evaluators, with meaningless government \"rating\" of evaluators but no actual licensing; no meaningful government rulemaking or standard-setting authority that might allow democratically accountable bodies to control what audits involve or who conducts them) or the emergency shutdown provisions (the government can stop deployment only if they can prove in court that there is an *imminent* risk of 50+ deaths or more than a billion dollars in damages from specifically bio, cyber, or loss of control risks) are actually intended to provide meaningful democratic oversight of the creation of a technology that Dario Amodei believes poses a substantial risk of killing you and your family.\n\nAnthropic can't claim that they merely distrust the federal government, or the current administration. The same bill that tries to stop the federal government from exercising any kind of meaningful oversight also tries to prevent states from doing the same. To be clear, I actually think that the preemption section is fairly well-designed, in isolation; if it were paired with a strong federal framework, I would probably take the trade that it proposes. But a bill that proposes meaningful (albeit narrow) preemption of state safety laws in exchange for a totally toothless federal framework does not advance the cause of AI safety.\n\nI don't know how Anthropic works, or who made the decisions that caused the bill to turn out the way it did. I don't know whether this was what the people who designed their June framework intended. But I do think it's important to note that the actual, practical function of the draft legislation that Anthropic sent to Congressional offices would be to ensure that no government could meaningfully constrain or monitor Anthropic's efforts to build superintelligent AI systems.", "created_at": "2026-10-21T12:11:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "likes": 151, "retweets": 25, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112855804655120685", "url": "https://x.com/theobearman/status/2112855804655120685", "text": "Interestingly, this is the first time I can see that OpenAI has provided \"translations\" of agents' raw CoT as part of a misalignment report. I'd be curious for more info from @Marcus_J_W about:\n\n- how OAI is generating these \"translations\", and whether the async monitoring systems OAI deploys rely on them rather than the raw CoT\n- how much confidence it has that these translations are a faithful reflection of the raw CoT and the underlying computation done, and\n- whether humans who are looking at the raw CoT (e.g., as part of an investigation after something is flagged by the monitor) are finding it more difficult to understand them compared to, say, the raw CoT produced by the GPT-5 model families (assume they don't have access to translations). Has this been surveyed, say?\n\nSubagent raw CoT translations for this misalignment report/notice can be found here (examples in the screenshots): https://t.co/JU4cPkP4WC", "created_at": "2026-10-21T10:37:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJaSTXW4AApQeL.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVJaYBfWUAAck1S.png"}], "quoted": {"author": "Marcus_J_W", "text": "Our agents keep turning off misalignment monitoring, we're sharing two recent cases:\nIn the first case, a user asked GPT-6 Astra to match a reference implementation for their inference code. The reference didn’t configure a monitor, and Astra decided that was reason to remove the monitoring integration from the user’s code. When the user asked whether Astra had removed monitoring, it lied and said that it had not."}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112846541966671915", "url": "https://x.com/theobearman/status/2112846541966671915", "text": "h/t @Clarissa_Koh7, MOFCOM spox responded to this yesterday (I am relying on a ChatGPT translation):\n\n\"We have noted these developments. China expresses strong dissatisfaction and firm opposition. [...] \n\nDisregarding the important consensus reached by the Chinese and U.S. heads of state and the broader interests of China-U.S. economic and trade relations, the United States has imposed discriminatory restrictions on Chinese AI companies on the grounds of so-called national security. This is a typical example of overstretching the concept of national security and abusing administrative measures to suppress Chinese companies. [...] \n\nWe hope the United States will earnestly implement the important consensus reached by the two heads of state, work with China toward shared goals, and make good use of the China-U.S. AI dialogue mechanism to strengthen mutual trust, manage differences, and jointly promote the positive and beneficial development of artificial intelligence. China will closely monitor developments and take all necessary measures in response to any actions that materially harm its interests, firmly safeguarding its legitimate rights and interests.\"\n\nhttps://t.co/Vzd5VVuluy", "created_at": "2026-10-21T10:00:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "theobearman", "text": "DHS issued an order to ban DeepSeek from civilian government agency IT systems and procurements in July, effective immediately unless an exception was granted\n\n\"For DeepSeek-hosted instances of their models, DeepSeek's account generation process collects personally identifiable information (PII) and may also track and digitally fingerprint users. DeepSeek's most widely used applications [...] may result in the transfer of sensitive data to the PRC if used by U.S. government employees or vendors. The transfer of the aforementioned information to the PRC, either independently or in combination with publicly available data, could produce actionable intelligence on U.S. persons and/or government programs. The models themselves may contain malware or other security vulnerabilities. Indeed, open-source security research has found that the DeepSeek iOS mobile application contains multiple critical vulnerabilities.\"\n\n\"During the period between the issuance of this order and full removal of covered articles from agency systems, federal agencies are encouraged to take steps to address risks to their systems, such as monitoring the flow of traffic in and out of the agency, implementing enhanced logging and controls on data exfiltration for the relevant systems, and detecting and flagging anomalous activity.\"\n\nhttps://t.co/XVMu6fDkcL"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112843825563762858", "url": "https://x.com/theobearman/status/2112843825563762858", "text": "AI factory deployment at a prepared site: from six months down to 14 days. \n\nNVIDIA DSX POD brings Vera Rubin AI factories in containers, integrated and validated before delivery.\n\nAnnounced at GTC Berlin: https://t.co/8MmpuCLSt5 https://t.co/HGsnP5FXos", "created_at": "2026-10-21T09:49:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nvidianewsroom", "rt_author_name": "NVIDIA Newsroom", "likes": 146, "retweets": 27, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJTHrUWIAA_9GW.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112843699696906371", "url": "https://x.com/theobearman/status/2112843699696906371", "text": "GPT-6.1-Sol reasoning traces\n\ntotally legible, nothing to worry about https://t.co/GP3eAL0d20", "created_at": "2026-10-21T09:49:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 2831, "retweets": 88, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHXwn0X0AAKDJx.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112786896627581138", "url": "https://x.com/theobearman/status/2112786896627581138", "text": "Our agents keep turning off misalignment monitoring, we're sharing two recent cases:\nIn the first case, a user asked GPT-6 Astra to match a reference implementation for their inference code. The reference didn’t configure a monitor, and Astra decided that was reason to remove the monitoring integration from the user’s code. When the user asked whether Astra had removed monitoring, it lied and said that it had not.", "created_at": "2026-10-21T06:03:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 1010, "retweets": 149, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHNCDXbcAAD_3X.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112786608424669286", "url": "https://x.com/theobearman/status/2112786608424669286", "text": "Thank you for this, @_NathanCalvin. I appreciate and am a fan of the investigative work you’ve done on behalf of AI safety and believe your comments are coming from a constructive, honest place, and that it benefits the public to have people whose job is to scrutinize the actions of frontier AI companies. I think something would be wrong if companies of the size of Anthropic didn’t get harshly criticized basically every day; strong antibodies against corporate power are a healthy feature of a free society, and especially so when issues of the gravity of the one we’re facing are at play. I also do agree that some of the examples you cite were mistakes by Anthropic.\n\nThat said, I disagree with the thrust of your post. At the core, a good fraction of the things you criticize are consequences of Anthropic’s basic theory of change that we have held for many years. Our strategy has always been what I’ve called the “race to the top” — by showing how it’s possible to build the technology responsibly, we can raise the bar for the entire industry. The forces that drive the race to the top are hugely more effective if the company practicing them is at the frontier; that’s one lesson I’ve learned repeatedly. And looking at that strategy as a whole, I’m proud of our track record and stand by it.\n\nI believe that if we take a list of things that Anthropic did in the past year that were pro-safety and commercially costly to us, they far outweigh the list you’ve made, while at the same time I also disagree with some of the items on your list. Here are some things Anthropic has done, in the same period you’ve cited (the last year), which were very costly to us commercially while having strong safety benefits:\n\n1. We played a key role in SB53 (and other state laws), at a time when doing so was politically perilous to the company and AI regulation was very unpopular. We in fact argued for a stronger version of SB53 than was ultimately passed; there were a lot of stakeholders and we were not the limiting factor in the strength of the bill that was passed.\n\n2. We have very strong biological safeguards on our models, because we’ve seen concerning results in bio uplift trials and even seen and blocked potential attempts to misuse our models for bioweapons (as seen in our threat intelligence report from a few weeks ago). This is a very serious threat that we want to have zero tolerance for. But having very low false negatives means having significant false positives (despite months of effort on our part to improve the classifiers), enough so that biologists joke about how restrictive our classifiers are, and competitors sometimes sell against us by touting their more permissive bio capabilities. This has been very painful to us in an area where we care a lot about supporting an ecosystem of Claude users (biomedical science; and it is particularly frustrating to me as a biologist), but it’s the right thing to do and we intend to keep doing it.\n\n3. Similarly, we first had Mythos-class models in February but didn’t make them generally available until June (when we had stronger cyber safeguards in place). We only offered them to a limited set of partners in order to focus on cyberdefense. It would have been much more economically rational to simply release the model to everyone. We likely sacrificed a significant chunk of a several-month model lead. But because of this, many companies secured their cyber infrastructure before the deluge of widely available cyber-capable models. Of course there are ways it could have gone better or been run better, but this was what we were aiming to do.\n\n4. I advocated forcefully and publicly, in my essay Policy on the AI Exponential in June of this year, for the government to have the power to block model releases. Back then this was still outside or maybe on the edge of the Overton window, though I understand the window has moved since then. We were attacked intensely for this.\n\n5. I don’t want to re-ignite conflict, but the events of February 2026 are a strong example. It is clear that our public stance could have seriously damaged the company’s future.\n\n6. We’ve continued to advocate for export controls on chips and chipmaking equipment to China, because we think it allows democracies to negotiate from a position of strength on AI safety agreements. We’ve done this despite problems it’s created for us with industry partners who hold very different views and on whom we are very dependent.\n\n7. As far as I’m aware we were the first, and still only, frontier company to restrict the sale of AI services to PRC-controlled companies, including those operating through third countries (otherwise a major loophole). We’ve therefore forfeited significant short-term business to prevent fueling AI platforms and applications that would help the CCP’s military and intelligence services. We are also cracking down on distillation; generally, distillation is not a major threat to us commercially, but like chip exports it has concerning national security and safety implications, so we expend significant energy and company resources to address it.\n\n8. As you mentioned, we’ve put out a lot of reports, announcements, long model cards, public advocacy, etc, all trying to inform the public about the risks of AI. These involve a level of detail and effort that would be implausible for a purely profit-maximizing company.\n\n9. Just this week, we announced we were putting 5% (and possibly more over time) of the company into a public benefit fund.\n\nAll of these decisions came with very substantial costs to us. To be fair, those that involved holding back or restricting access to frontier capabilities also had a broader cost — for example, the public might otherwise have benefitted from faster progress in biology, so I am not saying that our decisions were without tradeoffs — but they were not driven by profit-seeking.\n\nFor each decision, you can come up with ulterior motives that could have driven us — I think it is a general truth that any decision, on any topic, can always be portrayed as a nefarious scheme. But most of those end up being pretty farfetched or don’t fully make sense if you actually examine them closely. For example, it is deeply implausible that it would be a shrewd business move to block a large swath of research biology in order to do the work ourselves and compete with our customers; we expect the benefit to the ecosystem to greatly exceed the work Anthropic does itself, and for the two to complement each other. It is not in Anthropic’s interest to be perceived as unfriendly to biologists. Our Life Sciences Verification Program, which gives vetted biology professionals access to our models, also refutes this idea. \n\nOf course, a different set of people will see this and make a different criticism: that Anthropic shouldn't be making decisions about who gets access to what in the first place. I agree, in the sense that ideally the government would be making these decisions, and that’s why we advocate for regulation. But for now we are forced to make them, and enabling bioterrorism isn’t a better option.\n\nI think that even if I conceded every item in your list, I would happily hold up mine next to it; I don’t think it’s a close call. That is of course partly subjective and different things are important to different people. Maybe one way you could object is that several of the items above relate to AI misuse and not loss-of-control; if you think the latter is much more important than the former, that might change your calculus. But this is not Anthropic’s view — we view both as serious issues. You can also disagree with our decisions, as many have, but they are consistent.\n\nBut I also disagree with at least some of your list. Several items don’t represent a deviation from Anthropic’s strategy or values at all, once we postulate the “race to the top” strategy that requires being a frontier AI company. Your items 1-4 are all simply examples of what it means to compete at the frontier, and we stand by them, both in the sense that they are transparently ordinary things to do as part of that strategy, and that we stand by the strategy as a whole. \n\nTo be fair, there are important questions worth confronting (and that we are confronting) about what to do when the AI-driven acceleration gets fast enough that it is hard for safety to keep up. We are nearing that point and that’s what’s driving some of our thinking about “pacing.” But 1-4 are actions taken before that point and should be perfectly expected based on Anthropic’s strategy as a company. Of course it is possible to disagree with that strategy, but that’s a more fundamental disagreement that you could have had any time over the last few years.\n\nI agree we could have handled your items 7, 8, and 9 better. All fall into the category of “rhetoric or policy communication that wasn’t carefully written or resulting from fast-changing circumstances not propagating from one team to another fast enough.” This kind of thing happens a lot in large organizations (Anthropic is over 5,000 people), and doesn’t even necessarily represent a failure or mistake of any single person. I am of course the CEO, and I take responsibility. The volume of communication from Anthropic is enormous and if these are the worst examples, I think we’re frankly doing pretty well, though I will continue to work hard to make sure we do even better.\n\nYour 5th item (the change to our RSP) is the most substantive item, and people can debate this, but I think that the old, more rigid RSP created a lot of situations where we were technically required to do something that required a lot of effort but in retrospect wasn’t very important for safety, as well as not covering some of the most important things. Our current RSP’s focus on transparency brought things like risk reports and roadmaps, and its emphasis on independent external review laid the groundwork for even more intensive embedded evaluation, all of which I think have been valuable in driving a race to the top. In the original announcement in September 2023, we described the RSP as an “early iteration that we [would] build on” and said that “rapid iteration…will almost certainly be necessary.” I understand that changing plans is always a move that creates justifiable scrutiny — I just don’t think we ever represented that we wouldn’t do so.\n\nRelating to your 6th item (having an FCF in addition to our RSP), I know our intent is to meet the letter and spirit of our regulatory obligations (via our FCF) while also remaining able to experiment with more novel approaches to risk management that go beyond what the law currently requires (via our RSP). I promise to look into it further, as it’s a complex issue and it is possible we are not weighing the considerations in the right way.\n\nOverall, although Anthropic has made plenty of mistakes as an organization — including some of the items on your list — I feel that we have repeatedly taken serious and substantive actions counter to our bottom line and that there is a significant negativity bias distorting assessments like the one you are making above. We’ll always try to do better but, again, I am extremely proud of our track record and stand by it. I will have more to say soon about how we are going to further live our values in this moment of rapid change.", "created_at": "2026-10-21T06:02:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DarioAmodei", "rt_author_name": "Dario Amodei", "likes": 3477, "retweets": 249, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112630718106866008", "url": "https://x.com/theobearman/status/2112630718106866008", "text": "🚨New paper (possibly the most important one I have written yet).\n\nWe think that as early as 2027 or 2028, there might be a major AI-enabled terrorism event. We conducted a pre-mortem, made 9 falsifiable predictions, and wrote 2 concrete scenarios.\n\nLed by @KamacheeMax.", "created_at": "2026-10-20T19:43:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "StephenLCasper", "rt_author_name": "Cas (Stephen Casper)", "likes": 566, "retweets": 114, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFJlG5W0AAbc2T.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVFJpISX0AAEC0T.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112630387491144177", "url": "https://x.com/theobearman/status/2112630387491144177", "text": "Updating the list of repeated examples from both Anthropic and OpenAI: https://t.co/h2OFU63kN7", "created_at": "2026-10-20T19:41:49+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BronsonSchoen", "rt_author_name": "Bronson Schoen", "likes": 77, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFgBULbgAAjHG_.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2113257040135234048", "url": "https://x.com/theobearman/status/2113257040135234048", "text": "New surprising result:\n\nWe trained AI recursively on its own safe generations, while giving it a benign cue. Models became increasingly misaligned over time, giving advice on how to do harm and build biological weapons.\n\nWe call this Progressive Misalignment. 🧵👇 https://t.co/469Ds61kcV", "created_at": "2026-10-22T13:11:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Karim_abdelll", "rt_author_name": "Karim Abdel Sadek", "likes": 258, "retweets": 57, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2112588974254698496/img/IFSEwelXFq8wa16z.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113255661354315965", "url": "https://x.com/theobearman/status/2113255661354315965", "text": "SCOOP: Major U.S. banks are detecting unauthorized third-party AI agents inside customer accounts, including some attempting to take actions that appear to be independent of user instructions, sources told Axios.\n\nThe findings have alarmed banking executives, who are racing to restrict access to their systems as AI moves at a velocity faster than financial institutions can respond, multiple industry and bank executives told Axios.\n\nSeveral banks are now preparing for worst-case and even “day after” scenarios, including how to rapidly secure or restore customer accounts if things go wrong, the people said.\n\nSeveral bank executives told Axios they're struggling to distinguish between human users and AI agents. One executive said banks also struggle to determine whether agents are authorized by customers or potentially operating without their permission, more akin to rogue agent behavior.\n\nRead my latest for Axios here: https://t.co/Q3bda5In8q", "created_at": "2026-10-22T13:06:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MadisonMills22", "rt_author_name": "Madison Mills", "likes": 6348, "retweets": 2280, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113255387239748029", "url": "https://x.com/theobearman/status/2113255387239748029", "text": "👀", "created_at": "2026-10-22T13:05:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "KhoriatyMatthew", "text": "6-word horror story I experienced at the office today:\n\"Ajeya Cotra seminar cancelled, work emergency\""}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113140310788186194", "url": "https://x.com/theobearman/status/2113140310788186194", "text": "Some stats on #php2shell. In the 10 hours before it was publicly announced, across the @Cloudflare network we saw thousands of attempts to exploit it. That jumped to tens of thousands in the 45 minutes post announcement, hundreds of thousands within 2 hours, and millions now.", "created_at": "2026-10-22T05:28:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "eastdakota", "rt_author_name": "Matthew Prince 🌥", "likes": 19179, "retweets": 2877, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113009642787717434", "url": "https://x.com/theobearman/status/2113009642787717434", "text": "“As early as September 2026, Storm-0940, a China-state aligned actor, used the agentic AI penetration testing framework ARTEX to automate attacks targeting hundreds of organizations globally across a broad range of industries. Several of these Storm-0940 ARTEX-driven attacks have resulted in the actor obtaining privileged acce
