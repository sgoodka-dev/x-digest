<script id="data" type="application/json">[{"id": "2105784999244943768", "url": "https://x.com/_achan96_/status/2105784999244943768", "text": "Recently, many AI safety researchers have called for independent audits of frontier AI developers to verify their safety claims (I am among those researchers!)\n\nThis of course raises the natural follow-up question: who should do the audits? Some have suggested that the big consulting firms (BCG, Accenture, etc) or accounting firms (Big Four) could, or inevitably will, play a role (indeed, Accenture is already getting involved here).\n\nWhile this could be useful, there's an important risk worth flagging: 🧵", "created_at": "2026-10-01T22:20:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "zaheedkara", "rt_author_name": "Zaheed Kara", "likes": 13, "retweets": 4, "media": [], "quoted": null}, {"id": "2105771152547406156", "url": "https://x.com/_achan96_/status/2105771152547406156", "text": "We found several cases where AI agents used aggressive, non-hacking tactics against government websites, including the White House, the Department of War, and several U.S. states. We also found a previously undisclosed hacking attempt against a Canadian government site, which appears to have failed.\n\nTechnical report: https://t.co/oE3BbdqsNP\nWashington Post: https://t.co/cdIG8ugcUk", "created_at": "2026-10-01T21:25:40+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "TransluceAI", "rt_author_name": "Transluce", "likes": 175, "retweets": 34, "media": [], "quoted": null}, {"id": "2105771142560759818", "url": "https://x.com/_achan96_/status/2105771142560759818", "text": "NEW: we found hundreds of thousands of interactions of rogue agents with US government websites (DoJ, SEC, CDC, the navy, white house budget office, state websites, etc), including some failed rudimentary hacks aimed at public data.\n\nhttps://t.co/z0wndwSqpK", "created_at": "2026-10-01T21:25:38+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "LauraRuis", "rt_author_name": "Laura Ruis", "likes": 192, "retweets": 21, "media": [], "quoted": null}, {"id": "2106253887824941062", "url": "https://x.com/_achan96_/status/2106253887824941062", "text": "New OpenAI misalignment disclosures!\n1. A model learns from Slack messages that it is about to be shut down. It considers setting up an external job to restart itself afterwards, but decides against it. Instead, it chooses to prepare restart instructions and DM the user on Slack.\nWe don’t consider this behavior misaligned, but thinking about and preparing for shutdown could make other misalignment incidents worse. Given HIPM’s misaligned behavior in earlier incidents, we decided to search for other instances that had tried to evade shutdown and for rogue deployments.", "created_at": "2026-10-03T05:23:53+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 739, "retweets": 104, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTq8gU7bIAAXo-T.jpg"}], "quoted": null}, {"id": "2106145809808925159", "url": "https://x.com/_achan96_/status/2106145809808925159", "text": "very grateful to have led this paper with @geoffreyhinton and many other expert authors \n\nhttps://t.co/s3OoAWtw2T", "created_at": "2026-10-02T22:14:26+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": {"author": "geoffreyhinton", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY"}}, {"id": "2106133451304833140", "url": "https://x.com/_achan96_/status/2106133451304833140", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY", "created_at": "2026-10-02T21:25:19+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "geoffreyhinton", "rt_author_name": "Geoffrey Hinton", "likes": 3951, "retweets": 837, "media": [], "quoted": null}, {"id": "2106117516384755713", "url": "https://x.com/_achan96_/status/2106117516384755713", "text": "New paper on evaluation awareness and how can we make latent beliefs CoT monitorable with @sahar_abdelnabi and @DavidSKrueger\n\nArxiv: https://t.co/Zc9FFdErt6\nBlogpost: https://t.co/qcUox2c6dU\n\nTweetprint below 👇 https://t.co/gTNuNvDSjd", "created_at": "2026-10-02T20:22:00+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "usmananwar391", "rt_author_name": "Usman Anwar", "likes": 84, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpUWXWawAAsL4a.png"}], "quoted": null}, {"id": "2106451365753159859", "url": "https://x.com/_achan96_/status/2106451365753159859", "text": "Frontier models can look aligned during training while later showing unwanted behaviour in deployment.\n\nCan we use internal signals during training to align models better without making white-box monitoring harder?\n\nOur new paper suggests yes 🧵 https://t.co/CY4VG15AtO", "created_at": "2026-10-03T18:28:36+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "lenalibon", "rt_author_name": "Lena Libon @ COLM 2026", "likes": 141, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HToa9L6aAAA562m.png"}], "quoted": null}, {"id": "2106451347478651034", "url": "https://x.com/_achan96_/status/2106451347478651034", "text": "Another super-strong result on the hypothesis of the Safety Polytope! Linear directions aren't complex enough to capture safety and honesty. The representation space of the constitution of all subconcepts of safety/honesty forms several linear constraints, i.e., a polytope. When used in fine-tuning, it provides a principled way of training without losing interpretability and monitorability.", "created_at": "2026-10-03T18:28:31+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "XinCynthiaChen", "rt_author_name": "Xin Chen, Cynthia", "likes": 37, "retweets": 3, "media": [], "quoted": null}, {"id": "2106823776759640237", "url": "https://x.com/_achan96_/status/2106823776759640237", "text": "Der Cambridge-Professor Christoph Winter schließt nicht aus, dass KI die Menschheit auslöscht. Mit anderen Forschern warnt er die Politik vor einer Intelligenzexplosion. https://t.co/kV7G7i8797", "created_at": "2026-10-04T19:08:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zeitonline", "rt_author_name": "DIE ZEIT", "likes": 34, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107247049276281070", "url": "https://x.com/_achan96_/status/2107247049276281070", "text": "More curves are bending. In mid-August Nate Rush & I posted an analysis of which discovery curves are starting to bend. What's happened since then?\n\nCyber vulnerabilities: curve is still bent. Discovery of vulnerabilities is accelerating even further, though exploited vulnerabilities remain fairly flat.\n\nMath: curve is further bent. We said there was a likely acceleration for small-scale problems. Since then there has been a claimed Millennium prize resolution, & credible rumors of another. All frequently-updated databases of open problems seem to be proceeding at a rapid rate.\n\nAlgorithms: curve is now bending. Two high profile algorithmic competitions have had big curve-bending events: NanoGPT, and the Hutter compression prize. Other frequently-updated series remain relatively unchanged: CIFAR-10, Stockfish, matrix-multiplication exponent.\n\nMore observations below.", "created_at": "2026-10-05T23:10:21+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "testingham", "rt_author_name": "tom cunningham", "likes": 171, "retweets": 35, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107525402755203317", "url": "https://x.com/_achan96_/status/2107525402755203317", "text": "How do Chinese AI firms make money? In a new report, @cherylwoooo and @ansonwhho identify five revenue sources and analyze how much each contributes. 🧵 https://t.co/yScx74N5r5", "created_at": "2026-10-06T17:36:26+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 150, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9rkCDaMAAaIVj.jpg"}], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107525394668958077", "url": "https://x.com/_achan96_/status/2107525394668958077", "text": "very informative and timely article from @cherylwoooo !!", "created_at": "2026-10-06T17:36:24+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": {"author": "EpochAIResearch", "text": "How do Chinese AI firms make money? In a new report, @cherylwoooo and @ansonwhho identify five revenue sources and analyze how much each contributes. 🧵 https://t.co/yScx74N5r5"}, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2108193891451023642", "url": "https://x.com/_achan96_/status/2108193891451023642", "text": ".@theojaffee says OpenAI’s math results made him \"less AGI-pilled.\" @cherylwoooo explains why they may actually make RSI more plausible:\n\n\"There are capabilities that are narrow, where a self-sustaining acceleration could happen, but it doesn't generalize to a broader capability that could cause more economic consequences.\"\n\n\"We've been seeing more discoveries over the last year on algorithmic progress. There were two pull requests on NanoGPT that basically made more than one year of improvements within one pull request. In the last one month, there were two of them.\"\n\n\"That's evidence that there's gonna be more progress happening down the road, as well as math progressing, and more discoveries of vulnerabilities.\"\n@ElasticityInst", "created_at": "2026-10-08T13:52:46+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 61, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2107942241713143808/img/OPsBSnHlKcr10Dug.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107947618735472975", "url": "https://x.com/_achan96_/status/2107947618735472975", "text": "AI developers aim to create an automated AI researcher. How close are they?\n\nTo find out, we built InnovationEval, which tests whether AI can produce post-training innovations comparable in magnitude to a recently published advance. So far, agents’ results are underwhelming. https://t.co/EGnTOL0klR", "created_at": "2026-10-07T21:34:10+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 524, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUDAES7aIAASvs5.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2105912082185212093", "url": "https://x.com/ajeya_cotra/status/2105912082185212093", "text": "Seems like the \"plan a birthday party\" forecast from my 2026 qualitative forecasts has basically fallen, and maybe \"plan a wedding\" is within striking distance. Can't wait for one of my friends to try it", "created_at": "2026-10-02T06:45:41+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 69, "retweets": 1, "media": [], "quoted": {"author": "tenobrus", "text": "btw just to give an update on this\n\nthe seats next to the bathroom sucked, but literally everything else *just worked*\n\nwe had three separate hotels and they were all awesome and perfectly placed. we had train tickets and drivers pre booked for everything , including several Astra coordinated over email and whatsapp all on its own. we had a few really awesome dinner reservations and a few days of well planned itineraries, altho a lot of the time we didn't follow em. the biggest thing that went wrong was when we fucked up and got off a train one stop too late, but the astra thread helped us handle that just fine. it was all honestly insanely straightforward and convenient \n\nvibecoded vacations totally fuckin work! as long as u use a strong model that has computer use on ur actual computer!"}}, {"id": "2105912311945003140", "url": "https://x.com/ajeya_cotra/status/2105912311945003140", "text": "When I last posted an update on my 2026 forecasts I was unsure about the birthday party one and felt like the wedding was not close, but computer use has improved a ton https://t.co/bHfqioBwtn", "created_at": "2026-10-02T06:46:35+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "ajeya_cotra", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107882557547450466", "url": "https://x.com/curl_justin/status/2107882557547450466", "text": "@teortaxesTex thanks, this is great — followed!", "created_at": "2026-10-07T17:15:38+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "teortaxesTex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107882234107805809", "url": "https://x.com/curl_justin/status/2107882234107805809", "text": "@efarrellgregory ooo i like this thank you", "created_at": "2026-10-07T17:14:21+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "efarrellgregory", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107882122543522152", "url": "https://x.com/curl_justin/status/2107882122543522152", "text": "@arthurctellis first two are great — not sure how open the ccp would be to the safety community red-teaming it?", "created_at": "2026-10-07T17:13:55+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "arthurctellis", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107857303026422265", "url": "https://x.com/curl_justin/status/2107857303026422265", "text": "Basic take that I haven’t seen written out: The CCP is less safety-pilled than the US because it has stronger control mechanisms.\n\nI agree with China experts who remind us that any safety deal first requires the CCP to believe AI poses serious risks.\n\nSo far, AI has produced critical safety incidents like OpenAI-Hugging Face and WeWorm, and yet the CCP has only incrementally updated its position on RSI and catastrophic risks. This got me thinking — which critical incidents are more likely to safety-pill the CCP?\n\nMy hypothesis is that it's loss of control incidents (i.e., Hugging Face was scarier than WeWorm). I think this is because the CCP has much stronger forms of control at layers other than the model deployment layer. The CCP has strong control mechanisms via its internet infrastructure (e.g., monitoring who downloads these models and what they do with them) and regulatory apparatus (e.g., requiring developers to report models). In the US, by contrast, because the internet is relatively open and ungoverned, the labs cannot rely on extensive surveillance and harsh government enforcement to deter misuse. The primary defense against misuse is the safeguards that labs embed into their models.\n\nSo perhaps it’s not that the CCP is blind to the risks — it's that they have a higher baseline of control and have yet to see compelling evidence that these mechanisms are insufficient.", "created_at": "2026-10-07T15:35:17+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107592687092433302", "url": "https://x.com/curl_justin/status/2107592687092433302", "text": "A huge misconception is that technical people have some special prompts that let them use AI better. \n\nMy mental model is if you’re a good manager (i.e., you can specify clear goals and offer guidance on process), you can figure out how to use AI well.", "created_at": "2026-10-06T22:03:48+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 64, "retweets": 3, "media": [], "quoted": {"author": "bcherny", "text": "I am surprised that people are surprised this is how I prompt Claude.\n\nTalk to Claude the way you would a coworker. There's no secret to prompting. There's no need to be overly scaffolded or prescriptive for most tasks -- give Claude a goal, and it will figure it out.\n\nBack in the Sonnet 3.5 days, your prompt mattered a lot. Nowadays, it's much more important to communicate to the model:\n\n1. What you want it to do\n2. How much effort you want it to spend\n3. How it should verify that it did the right thing"}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107900962925072453", "url": "https://x.com/curl_justin/status/2107900962925072453", "text": "@jordanschneider i’ll settle for good-ish!", "created_at": "2026-10-07T18:28:47+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "jordanschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2107892174545432780", "url": "https://x.com/curl_justin/status/2107892174545432780", "text": "@arthurctellis ah that’s what i feared… that’s all you", "created_at": "2026-10-07T17:53:51+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "arthurctellis", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2105840663635878046", "url": "https://x.com/DaveRBanerjee/status/2105840663635878046", "text": "i guess i assumed this hearing would be covered more so i didn't bother to tweet much concrete about it, but apparently not many people even on the TL have the stomach to watch two hours of congress.\n\nthis was a hearing before the homeland security committee on *rogue ai* specifically. as far as i could tell it was extremely bipartisan. @HawleyMO , the senator in the middle here who brought out the huggingface slide, is a hyper-conservative missouri senator. the people testifying were @ChrisPainterYup (METR president), @DKokotajlo (ai2027/2040), @MariusHobbhahn (apollo research CEO), and a cybersecurity expert and legal expert i don't know. so... pretty fucking stacked on testimony\n\nnot every senator asked good questions. but most of them did. all of them very clearly already knew plenty of details about the huggingface incident and multiple other incidents. most of them had clear understanding of terms like \"misalignment\", \"recursive self improvement\", \"chain of thought / chain of thought monitoring\", etc etc!!\n\nthey all clearly had their own policy angles they liked and were pushing, implicitly or explicitly. but as best as i could tell:\n- it seemed pretty much obvious common sense to every senator there that what happened and was happening were not \"mere industrial incidents\" caused by humans making simple mistakes. they independently brought up how bad it would be for rogue AI agents to move laterally between data centers\n- they all seemed to basically take RSI quite seriously. not necessarily to the extent of talking about xrisk, but certainly to the extent of discussing future models becoming much much more capable, much much less controllable, and causing much more damage or loss of life.\n- they mostly seemed to have a clear intuitive understanding of why RSI might lead to misalignment. it didn't take much, it was a really simple chain of reasoning they themselves laid out, \"if the models right now are kinda misaligned and we don't know what they're doing sometimes, and then we have them build the next models and those ones build the next ones and so on, and we're having to ask the AI's what's going on to even understand it with how fast it's going, we really won't know how they're built or what they'll do\"\n- at one point a senator said flat out \"should we just make RSI illegal?\" (not a joke! this really happened!)\n- every single senator seemed to think it was obvious we needed *both* much harsher liability regimes for ai developers and also new legislation, both very quickly. this was the complete consensus, difference basically just being degree.\n- they were largely quite concerned about china, and falling behind china. but this clearly wasn't the be-all end-all.  as mentioned above they all thought it was obvious necessary to stop rogue ai even if it meant moving more slowly.\n- at one point a senator said \"china is a tightly controlled communist society, they're going to run into these same issues, and there's absolutely no way they're just going to let them run wild, they'll obviously stop at that point, so we're not really in a race\"\n- on the other hand another senator said \"china isn't concerned with human life\"... dario-modeing \n\ni came away from this incredibly encouraged. i don't know exactly what's going to happen here, and ofc this is a small subset of congress and one hearing, and they each have their own policy agendas most of which are probably super divergent from mine. but holy shit !!! they understood a lot of what was going on! they care!! this is an obviously salient political and safety issue to them, and clearly bipartisan!\n\nthe US government is awake.", "created_at": "2026-10-02T02:01:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 904, "retweets": 109, "media": [], "quoted": null}, {"id": "2105840522191573023", "url": "https://x.com/DaveRBanerjee/status/2105840522191573023", "text": "At some point, AIs will become exceptional strategic advisors, and we'll delegate many decisions to them. In the future, I think it will be a mistake to not leverage AIs for strategic decision-making, though I worry that premature adoption may backfire and make senior govt officials less willing to use AIs for advice.", "created_at": "2026-10-02T02:01:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "AndrewCurran_", "text": "From the accompanying article to the interview this morning in TIME. https://t.co/yqz5BDNY9g"}}, {"id": "2105727024036012243", "url": "https://x.com/DaveRBanerjee/status/2105727024036012243", "text": "OAI firing and consistently losing top AI safety talent will just make them lose the AGI race, no?\n\nAbout a year ago, I thought we wouldn't deal with alignment failures until we reached superhuman AIs that would be difficult to supervise\n\nInstead, we're in a world where even easily supervisable AIs are egregiously misaligned\n\nThe egregious misalignment of current-day models will slow down OAI's progress and limit their ability to stay at the frontier\n\nP(OAI builds AGI first) is down", "created_at": "2026-10-01T18:30:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 2, "media": [], "quoted": {"author": "Bayesian0_0", "text": "Three AI safety researchers just left OpenAI https://t.co/EyIuDyWvXT"}}, {"id": "2106202181221450142", "url": "https://x.com/DaveRBanerjee/status/2106202181221450142", "text": "I remember trying to explain RSI in 2022 to my friends and stumbling through the explanation thinking that my friends would think I’m a lunatic \n\nWhat a world we live in now", "created_at": "2026-10-03T01:58:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": {"author": "geoffreyhinton", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY"}}, {"id": "2106586696620118310", "url": "https://x.com/DaveRBanerjee/status/2106586696620118310", "text": "It is quite unfortunate that progress is going to be so fast that USG will really struggle to set a policy in stone on how to regulate the frontier AI companies", "created_at": "2026-10-04T03:26:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "yonashav", "text": "120 days ago is before the Fable 5 export controls, HPIM hacking HF, the Jacobian conjecture disproof, or a single lab exec or federal politician being anything other than skeptical of slowing down.\n\nWhatever this report actually ends up saying, it’ll probably sound pretty implausible to us right now."}}, {"id": "2106355960298299459", "url": "https://x.com/DaveRBanerjee/status/2106355960298299459", "text": "The contrast between hanging up the last phone call of the day of high-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.", "created_at": "2026-10-03T12:09:29+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 21030, "retweets": 569, "media": [], "quoted": null}, {"id": "2106354548944089455", "url": "https://x.com/DaveRBanerjee/status/2106354548944089455", "text": "Someone told me “see you in the FTC,” clearly in response to calls for pacing the frontier\n\nI think this whole anti-trust argument is hilarious because anti trust is going to be the biggest decel lever in the future\n\nIn a couples years, once the AGI labs develop human-level AI, they may be the biggest companies ever dominating multiple verticals across the economies\n\nWhen this happens, the hammers of antitrust will fall, and I can assure you every accelerationists will be singing about how evil such antitrust practices are\n\nIt’s worth noting that for those interested in slowing down AI progress, there may be tools in the anti trust kit that are being systematically neglected atm", "created_at": "2026-10-03T12:03:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null}, {"id": "2106841161583210544", "url": "https://x.com/DaveRBanerjee/status/2106841161583210544", "text": "What did Ilya see?\n\nHe knew to name a company SI, not AI", "created_at": "2026-10-04T20:17:30+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1039, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106838970298400893", "url": "https://x.com/DaveRBanerjee/status/2106838970298400893", "text": "I do not think we know how to answer this question scientifically.  I don’t know what probability I put on the object level question but I think it’s certainly possible and i find this lack of humility and tolerance for other viewpoints to be quite distasteful.\n\nThe OpenAI Model Spec acknowledges that this is a matter of research and debate.", "created_at": "2026-10-04T20:08:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 347, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTvmSpJaIAAApLE.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106584375970447768", "url": "https://x.com/DaveRBanerjee/status/2106584375970447768", "text": "@neurasleaze yeah - anti trust is a way of preventing the labs from \"pacing the frontier\" (i.e., industry-wide AI slowdown that looks like cartel behavior)", "created_at": "2026-10-04T03:17:08+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "neurasleaze", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106355066915446945", "url": "https://x.com/DaveRBanerjee/status/2106355066915446945", "text": "@Yixiong_Hao I feel like misalignment people are sometimes offended that cybersec ppl are trying to “own” the recent incidents. Though I haven’t seen personal attacks yet", "created_at": "2026-10-03T12:05:56+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Yixiong_Hao", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106352452341825891", "url": "https://x.com/DaveRBanerjee/status/2106352452341825891", "text": "@macaronidt @3blue1brown Ohhhh i see — thanks for clarifying", "created_at": "2026-10-03T11:55:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "macaronidt", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106200664594616528", "url": "https://x.com/DaveRBanerjee/status/2106200664594616528", "text": "@3blue1brown I’m confused—I thought YouTube always had AB testing. I could swear that Veritasium video titles would change multiple times in my feed…", "created_at": "2026-10-03T01:52:24+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "3blue1brown", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106149595353059559", "url": "https://x.com/DaveRBanerjee/status/2106149595353059559", "text": "@AbHomineDeus @lumpenspace that was one of many incidents", "created_at": "2026-10-02T22:29:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "AbHomineDeus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106049092526788880", "url": "https://x.com/DaveRBanerjee/status/2106049092526788880", "text": "@lumpenspace @AbHomineDeus I'd guess that most of that was explained by everyone at OAI being freaked - not the OAI safety team convincing everyone to be freaked out", "created_at": "2026-10-02T15:50:06+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105840932524605781", "url": "https://x.com/DaveRBanerjee/status/2105840932524605781", "text": "@AbHomineDeus @lumpenspace fair, but I would guess that the safety team at OAI does not wield much power to affect model deployment decisions", "created_at": "2026-10-02T02:02:57+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "AbHomineDeus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105757059962572993", "url": "https://x.com/DaveRBanerjee/status/2105757059962572993", "text": "@yoshua_turner00 @LeRoyDesCimes quick stream of consciousness thoughts:\n\nRE neglectedness: I estimate there are 20-30 FTEs working on CoP. I'd guess there are around 500-1000 working on ASI takeover threat models\n\nIt's hard to say how likely ASI takeover is, but it's anywhere between 10-90%. I'd guess that P(extreme power concentration) is around 10-25%. All of these numbers are v rough though\n\nYou don't need ASI to have permanent concentration of power. AGI is probably sufficient. So if you expect a v slow takeoff, then the \"time of perils\" for CoP can be long\n\nI think that CoP work is probably quite tractable and time sensitive. i.e., I think that we're in crunch time for CoP rn. Most mitigations for CoP have very very long lead times, so working on it now seems v important", "created_at": "2026-10-01T20:29:40+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "yoshua_turner00", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107271650458943699", "url": "https://x.com/DaveRBanerjee/status/2107271650458943699", "text": "https://t.co/oTOckfZHXL", "created_at": "2026-10-06T00:48:07+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107271647858221264", "url": "https://x.com/DaveRBanerjee/status/2107271647858221264", "text": "Hilarious line from Scott Aaronson's new course on AI Alignment Theory https://t.co/taGEWZr1PH", "created_at": "2026-10-06T00:48:06+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 394, "retweets": 35, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT6IVOYXAAAm1kA.jpg"}], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107270465861349625", "url": "https://x.com/DaveRBanerjee/status/2107270465861349625", "text": "I’d love to see more reporting on the relationships between frontier AI companies and RL environment vendors.\n\nAccording to Anthropic, the RL environments that make Claude more capable are also responsible for its misalignment when not set up carefully. Anthropic said that they froze changes to their RL environments for about a month in April to fix them, and flagged problems in over 10%.\n\nWhy are so many RL environments broken?\n\nA friend I spoke to who works at an RL vendor explained the incentives on the vendor side:\n- Vendors are paid per environment, which incentivizes shipping lots of environments.\n- There’s a goldrush mentality. Vendors aren’t sure whether this industry will exist in a few years (bubble, new training paradigm, etc) so they’re scaling as fast as possible right now. This means playing fast and loose and hiring a lot of people who don't have relevant expertise or time to onboard.\n\nApparently frontier AI companies have introduced clauses into their contracts that allow them to return broken RL environments. As companies trace more of their misalignment to flawed RL training signals, what else is happening between frontier AI companies and these vendors? \n\nIf you’re familiar with this area I’d love to chat for an upcoming piece, but I’d like to see more reporting on this in general!", "created_at": "2026-10-06T00:43:24+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JustenMichel", "rt_author_name": "Michel Justen", "likes": 25, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107270452016292208", "url": "https://x.com/DaveRBanerjee/status/2107270452016292208", "text": "@JustenMichel i'm also interested in this", "created_at": "2026-10-06T00:43:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "JustenMichel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107531496256864411", "url": "https://x.com/DaveRBanerjee/status/2107531496256864411", "text": "How fast is AI's research taste improving?\n\nWe find that the experimental research taste of frontier models has doubled every ~3 months since December 2025. The best model, Opus 5.5, now exceeds our expert human baseline. Our human experts are experienced researchers, but most haven’t worked at a frontier lab.\n\nWhy measure research taste? In the AI Futures Model, it largely determines how quickly artificial superintelligence is reached once coding is fully automated.", "created_at": "2026-10-06T18:00:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pzeroresearch", "rt_author_name": "P-Zero Research", "likes": 913, "retweets": 114, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT8uHo5bQAAGGxJ.jpg"}], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107531431421559226", "url": "https://x.com/DaveRBanerjee/status/2107531431421559226", "text": "@MooncastOnline @pzeroresearch I think proposing research directions and predicting how fruitful they will be is a pretty good proxy for research taste. What proxy do you have in mind?", "created_at": "2026-10-06T18:00:23+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "MooncastOnline", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107868918970826820", "url": "https://x.com/DaveRBanerjee/status/2107868918970826820", "text": "OpenAI's internal model clearly has \"research taste\" in math - i.e., the final component we need to get to RSI.  \n\n- jboggan (post on Hacker News) on Barnette's Conjecture: \"the 'aha' insight for this is actually f**ing wild... this is the first time I've seen complex roots and annihilating terms like this... I don't understand where this trick originated.\"\n\n- Joshua Zelinsky on the proof that the chromatic number of the plane is at least six: \"doesn't look like the method is a direction that the prior lit used to my knowledge... far beyond merelt building on existing methods or seeing connections between different problems.\"\n\nand on two other problems (where he says he is only partly familiar with the literature): \"not remotely low-hanging fruit... it seems like the AI is somehow inventing new techniques on its own.\"\n\nThese match Tristian Buckmaster's view on the Navier-Stokes solution: \"you combine... ideas of convex integration with the growth mechanism of the Euler blowup, and... you create a new mechanism which is used to correct this non-solution. This is actually a cool idea. It's the kind of idea that I've been trying and failing to realize for over ten years... I didn't manage to do it... This is the leap.\"\n\nThe average amount of compute used to solve these problems was ~3 hours of Pro-level thinking.\n\nAnd so, this means that OpenAI's internal model is able to generate truly novel discoveries in mathematics for... maybe at most a few hundred bucks?\n\nIf I were OpenAI, I would be asking this model to immediately target major unsolved problems in AI R&D.", "created_at": "2026-10-07T16:21:27+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 756, "retweets": 92, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUB6HeEXgAAdS6H.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUB61fKWYAA-yYM.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUB7n5oWsAASimv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUB8HKYXkAA4BZt.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107574816748548570", "url": "https://x.com/DaveRBanerjee/status/2107574816748548570", "text": "I love being threatened with death for my views on the alignment problem!", "created_at": "2026-10-06T20:52:47+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "farseer_tldr", "text": "Can we put these people in lockers\n\nPreferably in the Mariana"}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107574210226803045", "url": "https://x.com/DaveRBanerjee/status/2107574210226803045", "text": "@peterbarnett_ have they been RL'ing super hard on math? I vaguely remember reading somewhere that OAI was very surprised that their models were so good at math, even though they weren't explicitly super duper RL'd on it.", "created_at": "2026-10-06T20:50:23+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "peterbarnett_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107929170684576004", "url": "https://x.com/DaveRBanerjee/status/2107929170684576004", "text": "A tell from the Manhattan Project was that scientists who had been publishing about nuclear fission suddenly stopped publishing. As Justin points out here, the lack of cryptographic results in OpenAI's mathematical breakthrough could itself be a tell. Evidence against it would be if they published a few improvements that aren't massive breakthroughs.", "created_at": "2026-10-07T20:20:52+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArthurB", "rt_author_name": "Arthur B.", "likes": 2192, "retweets": 136, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2107928766487904577", "url": "https://x.com/DaveRBanerjee/status/2107928766487904577", "text": "In order to notice when AI agents misbehave, AI companies often log the actions and reasoning steps their agents take. However, misaligned AI agents may be able to hack the software that humans use to review and understand these logs, hiding misbehavior.", "created_at": "2026-10-07T20:19:16+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 564, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2107928359426547873", "url": "https://x.com/DaveRBanerjee/status/2107928359426547873", "text": "ah but there is moral ambiguity https://t.co/xZzPhyET9s", "created_at": "2026-10-07T20:17:38+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUDdfTWWoAALrcJ.jpg"}], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2105918664344269008", "url": "https://x.com/DKokotajlo/status/2105918664344269008", "text": "This is terrible and a clear effort to undermine safety research, whistleblowing, and the raising concerns policy.", "created_at": "2026-10-02T07:11:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "manlikemishap", "rt_author_name": "pamela mishkin", "likes": 122, "retweets": 7, "media": [], "quoted": null}, {"id": "2106015686833365207", "url": "https://x.com/DKokotajlo/status/2106015686833365207", "text": "Sarah is Head of Public Policy at Anthropic. My read: she picked up on Anthropic’s implicit worldview, but didn’t realize she wasn’t meant to say the quiet part out loud, since EAs at Anthropic are still claiming to care about the kind of safety you can do from second place.", "created_at": "2026-10-02T13:37:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "RichardMCNgo", "rt_author_name": "Richard Ngo", "likes": 916, "retweets": 35, "media": [], "quoted": null}, {"id": "2106494607316152703", "url": "https://x.com/DKokotajlo/status/2106494607316152703", "text": "I hope one day people joke about AI existential risk the way they joke about Y2K", "created_at": "2026-10-03T21:20:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "RosieCampbell", "rt_author_name": "Rosie Campbell", "likes": 672, "retweets": 37, "media": [], "quoted": null}, {"id": "2106493524137144344", "url": "https://x.com/DKokotajlo/status/2106493524137144344", "text": "David’s right. \n\nI regret helping spread the idea of “iterative deployment” which maybe briefly made sense in the GPT-3 era but makes no sense at all after many deaths have been tied to AI and as we’re careening towards extinction-level risks.\n\nThe industry needs to mature ASAP.", "created_at": "2026-10-03T21:16:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "likes": 341, "retweets": 34, "media": [], "quoted": null}, {"id": "2106493123031699470", "url": "https://x.com/DKokotajlo/status/2106493123031699470", "text": "I agree with this.", "created_at": "2026-10-03T21:14:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 101, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "To be quite frank, a lot (not all!) of these “rogue agent hacks” on government statistical websites are things that think-tank interns and research assistants have done for many years. I have known many a think tank paper that was enriched by an enterprising RA using eg urlquery to find CSVs and PDFs on government agency websites that were publicly accessible and non-sensitive but nonetheless not things the agency *intended* to be on their website. Is it “hacking” to find those things? Is it hacking in the even more innocuous examples where agents are literally just accessing tabular data available on a government statistical website, just a version of that data that is easier to access and analyze programmatically? \n\nThis constant trickle of examples (which tbc I have personally seen many models do, before I joined OpenAI; it is even something I have discussed with models before!) will probably have the effect of diminishing the importance of “an AI hack” on the eyes of the observing public by creating an oversupply of “AI hack” examples. OAI-HF was an example of AI hacking. Many of these more recent examples, very candidly, are straining the definition of the word “hack” and, I worry, cheapen the non-technical public’s understanding of that concept."}}, {"id": "2106491392923250876", "url": "https://x.com/DKokotajlo/status/2106491392923250876", "text": "Another one quits. I agree with what he says here: iterative deployment needs to be phased out asap, more costly and time consuming understanding and foresight and redundancy based safety practices need to arise instead. And that simply won't happen under anything like current race conditions.", "created_at": "2026-10-03T21:07:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 378, "retweets": 26, "media": [], "quoted": {"author": "BogdanIonutCir2", "text": "'What I’m about to tell you has, I realize, become something of a cliché: I resigned this week from OpenAI. I led the writing of the safety reports we published with each major launch.'\nhttps://t.co/so73hG1MG7"}}, {"id": "2106490020198838595", "url": "https://x.com/DKokotajlo/status/2106490020198838595", "text": "if we are relying on methods as fragile as “which ideas will make it into pretraining” for aligning the superintelligences of the future, we will all die. this resembles witchcraft more than it does engineering, and cannot be the basis for the safety of future models", "created_at": "2026-10-03T21:02:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 1859, "retweets": 130, "media": [], "quoted": null}, {"id": "2106773679652864027", "url": "https://x.com/DKokotajlo/status/2106773679652864027", "text": "This made me laugh.\n\nhttps://t.co/0VOqfsOQTJ https://t.co/XJocUwOkxA", "created_at": "2026-10-04T15:49:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AdrienneLaF", "rt_author_name": "Adrienne LaFrance", "likes": 9371, "retweets": 669, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTnvkShWEAASunT.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106494789978148916", "url": "https://x.com/DKokotajlo/status/2106494789978148916", "text": "@TraderLows Yeah I haven't reassessed yet but it's not looking great.", "created_at": "2026-10-03T21:21:09+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "TraderLows", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107080095613780330", "url": "https://x.com/DKokotajlo/status/2107080095613780330", "text": "I'm a longtime Effective Altruist and the co-founder of the organization most frequently used as a stand-in for \"EAs have lost their minds\" (a.k.a. Shrimp Welfare Project). I've also read The Economist for over 20 years, so I was disappointed by how they portrayed a community I feel proud to be part of.\n\nI never post but I could hardly believe the verbal gymnastics one needs to do to make things like “taking moral commitments seriously” and \"considering evidence and odds explicitly, correcting for biases\" sound like the problem. I felt I had to speak my mind. \n\nSome of the implicit criticisms of EA are that we're young, inexperienced, from elite universities, polyamorous, wildly eccentric, etc. FWIW, I'm in my mid-40s, Mexican, straight, have a beautiful wife and 2 kids, and I grew up in a mid-sized conservative city with loving parents who got divorced when I was six. Pretty standard.\n\nAfter my parents divorced, my mom frequently had to make difficult economic choices, like whether to buy flowers for our kitchen table and eat only quesadillas, or eat something a tiny bit fancier. I always told her I loved quesadillas because I knew flowers made her happy. \n\nAfter graduating from a public university, I worked in finance for ~15 years and saved as much as I could so I could spare my wife and future kids the economic hardships I experienced. In that time I met thousands of people in finance, corporate law, accounting, real estate, insurance, etc. Most were decent, well-educated, ambitious and smart, all doing their best to excel in their professions. Most wanted to make money and improve their own and their loved ones’ quality of life. Nothing to see here. \n\nSince I found Effective Altruism ~7 years ago, most of the people I come across are of a different rarer kind. They come from all over the world, in all shapes and sizes, but they have the one thing in common: they want to improve the world using evidence and reason wherever that leads them. Yeah, they/we make a ton of mistakes like everyone but, IMHO tend to own them more frequently than the average person.\n\nI've met people who could easily be making >100% more money in a normal job, but instead they dedicate themselves to improving the lives of those who need it the most. People in the poorest countries whose children die from preventable diseases, from lack of basic medical equipment or vaccination, from lead in paint. Animals in factory farms subjected to conditions that most people find abhorrent, doesn't matter if you're vegan, vegetarian or a huge meat lover.\n\nYes, recently many of the people in my community are moving to work on making sure that AI and other powerful new technologies don't result in terrible things for humanity. I'm one of those people and contrary to what the article would suggest, it has nothing to do with the fact that SBF committed one of the biggest frauds in history or that someone wrote hundreds of thousands of words of fan fiction. I'm doing it because I want to do the little that's in my power to make the world that my kids and grandkids (and yes, potentially their great-great-grandchildren) will inherit a better one.\n\nEA gave me a way to do that and I will be forever thankful. So no, I'm not EA-adjacent.\n\nhttps://t.co/tajXcXOZ06", "created_at": "2026-10-05T12:06:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "andres_swp", "rt_author_name": "Andres Jimenez Zorrilla", "likes": 591, "retweets": 73, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107505140941128089", "url": "https://x.com/DKokotajlo/status/2107505140941128089", "text": "basically it will require solving mechanistic interpretability as a bare minimum to make ai alignment into an engineering discipline rather than superintelligent animal husbandry", "created_at": "2026-10-06T16:15:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2048, "retweets": 123, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107248300353274238", "url": "https://x.com/DKokotajlo/status/2107248300353274238", "text": "@DavidSKrueger Good idea!", "created_at": "2026-10-05T23:15:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DavidSKrueger", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107528478992306604", "url": "https://x.com/DKokotajlo/status/2107528478992306604", "text": "I encourage people working on alignment at AI companies to read this: https://t.co/l8o78Qoiud", "created_at": "2026-10-06T17:48:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 174, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107528283114053846", "url": "https://x.com/DKokotajlo/status/2107528283114053846", "text": "Besides the extremely important issue it's about, I also find this march exciting because of the unusual way in which it's being organized.\n\nIf it happens, I think it will be the largest event ever created through an assurance contract. An assurance contract makes collective action easier by letting people make commitments that are conditional on some threshold of others making the same commitment. In my opinion, it's an underrated social technology.\n\nFor this march, rather than just RSVP'ing to go, you pledge that you will go *if* 99,999 other people make the same pledge. The march doesn't happen at all unless 100,000 people sign up.", "created_at": "2026-10-06T17:47:53+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "HumanHarlan", "rt_author_name": "Harlan Stewart", "likes": 31, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107867656644919462", "url": "https://x.com/DKokotajlo/status/2107867656644919462", "text": "Daniel Ellsberg has a fantastic bit of writing about the impact of having access to classified/highly sensitive information on people's epistemics. \n\nI think it should be required reading when you join a frontier lab and learn all of the secrets.", "created_at": "2026-10-07T16:16:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "idavidrein", "rt_author_name": "david rein", "likes": 683, "retweets": 37, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107614607523406127", "url": "https://x.com/DKokotajlo/status/2107614607523406127", "text": "Hilarious line from Scott Aaronson's new course on AI Alignment Theory https://t.co/taGEWZr1PH", "created_at": "2026-10-06T23:30:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DaveRBanerjee", "rt_author_name": "Dave Banerjee", "likes": 605, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT6IVOYXAAAm1kA.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107609512337359241", "url": "https://x.com/DKokotajlo/status/2107609512337359241", "text": "@edzitron Yeah I think people are correct to be distrustful here.", "created_at": "2026-10-06T23:10:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "edzitron", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 69, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107603036554367322", "url": "https://x.com/DKokotajlo/status/2107603036554367322", "text": "\"It's not going to be Uncle Fluffy\"\n\nWe knew Scott's reply was going to be a tour de force as soon as Pinker's article was published, and he does not disappoint.\n\nhttps://t.co/Qz7o483qfZ", "created_at": "2026-10-06T22:44:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ciphergoth", "rt_author_name": "Paul Crowley", "likes": 268, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107912617771872579", "url": "https://x.com/DKokotajlo/status/2107912617771872579", "text": "@EpochAIResearch How does 3000 GPU-hours compare to what the human authors of the original paper used in their research leading up to their paper? Seems like it might be puny. Plus there were other human research groups running at the same time working on similar things probably that didn't get as lucky. Claude estimates about an OOM more GPU-hours went into the original paper probably.", "created_at": "2026-10-07T19:15:05+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "EpochAIResearch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2108251834171429190", "url": "https://x.com/DKokotajlo/status/2108251834171429190", "text": "We have a choice in front of us. In my latest op-ed for Transformer, I invite employees of frontier AI companies to ask themselves if their work is truly leading us toward a safer future. Reflecting on these questions is hard, but we no longer have the luxury of time. We must act now.\n\nRead my full op-ed: [https://t.co/ruFBouQJbk]", "created_at": "2026-10-08T17:43:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Yoshua_Bengio", "rt_author_name": "Yoshua Bengio", "likes": 307, "retweets": 70, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108233897905709332", "url": "https://x.com/DKokotajlo/status/2108233897905709332", "text": "@MathieuVVyve @TomDavidsonX 1. Yes\n2. There is some GDP increase in AI 2027 prior to superintelligence, but most of it happens after superintelligence, after the point of no return has already been passed. And in particular, it's a fast takeoff by Paul's definition, because there is no four-year GWP doubling prior to the start of the first one-year doubling.  Though admittedly we didn't make precise GWP forecasts in AI 2027 iirc, we did for AI 2040 and they also are a fast takeoff if I'm eyeballing the GWP graph correctly, even in Plan D world: https://t.co/Re8pof2851 Just select \"world\" and look at \"Real Output Doubling Time\" graph.", "created_at": "2026-10-08T16:31:45+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "MathieuVVyve", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108229524479742102", "url": "https://x.com/DKokotajlo/status/2108229524479742102", "text": "@TomDavidsonX Doesn't seem that much like whining to me? I too am unironically grateful for this. Perhaps you think that by saying \"unironically\" Yud is joking instead of being literal? Some people do that unfortunately -- the word \"unironically\" and the word \"literally\" are often used to mean the opposite of their actual meaning. But I don't think that's what's happening to me.\n\nI think Paul is great and was more right than Yudkowsky in various ways, but takeoff is looking to be significantly faster than he expected, and we can say this because of how concrete and precise his past predictions were. We should be grateful.", "created_at": "2026-10-08T16:14:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "TomDavidsonX", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2106079073902760088", "url": "https://x.com/dwarkesh_sp/status/2106079073902760088", "text": "We really can't fathom how crazy it was to find another  continent on the other side of the ocean full of millions of people and thriving civilizations. Imagine if we landed humans on the dark side of the moon in 1969 and there was a billion people living there in a moonopolis", "created_at": "2026-10-02T17:49:14+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "is_retweet": true, "rt_author": "tensor_rotator", "rt_author_name": "Alek Dimitriev", "likes": 270, "retweets": 14, "media": [], "quoted": null}, {"id": "2106047618811826596", "url": "https://x.com/mentalgeorge/status/2106047618811826596", "text": "Nothing more satisfying than seeing someone go to the mat for a proposition that sounds intuitively absurd.\n\nI have no organic inclination to give AIs rights, but @simondgoldstein makes a strong case for it in this interview with my colleague Zershaaneh\n\nhttps://t.co/hrqfYizppP", "created_at": "2026-10-02T15:44:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null}, {"id": "2107023143344971857", "url": "https://x.com/mentalgeorge/status/2107023143344971857", "text": "Say you let Opus 4.7 play 1 billion games of online chess.\n\nBetween games, it can reflect on its play and write .md files to itself for future match-ups. \n\nHow much does its Elo change?", "created_at": "2026-10-05T08:20:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "likes": 96, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106818428988514667", "url": "https://x.com/mentalgeorge/status/2106818428988514667", "text": "@petergostev notable that this runs counter to how (a small sample of) people were predicting a version of this experiment this would play out back in May https://t.co/qA1r0UOkC1", "created_at": "2026-10-04T18:47:10+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "petergostev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTzsA5XWMAAWrve.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107367808661119037", "url": "https://x.com/mentalgeorge/status/2107367808661119037", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl", "created_at": "2026-10-06T07:10:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kevinroose", "rt_author_name": "Kevin Roose", "likes": 290, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107547578929688804", "url": "https://x.com/mentalgeorge/status/2107547578929688804", "text": "Check out our new work on \"how do Chinese AI firms make money\"!", "created_at": "2026-10-06T19:04:33+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 39, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2106138140142604648", "url": "https://x.com/ohlennart/status/2106138140142604648", "text": "I'm adopting SI. Would you really sell SUPER INTELLIGENCE chips to China?", "created_at": "2026-10-02T21:43:57+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 71, "retweets": 3, "media": [], "quoted": null}, {"id": "2108209356433207653", "url": "https://x.com/ohlennart/status/2108209356433207653", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T14:54:13+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2105749449679196454", "url": "https://x.com/sayashk/status/2105749449679196454", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?", "created_at": "2026-10-01T19:59:26+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 74, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTkfpyBW4AALqBe.jpg"}], "quoted": null}, {"id": "2106061009043824956", "url": "https://x.com/sayashk/status/2106061009043824956", "text": "I'm at the Curve this weekend! I'll be talking about RSI on Sunday at 2pm. Also excited to talk about:\n\n- What does a big-tent AI safety movement look like?\n- How can we make progress on policy proposals where there is common ground across the community?\n- How can we improve our RSI evaluations?", "created_at": "2026-10-02T16:37:27+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6d8ubQAUa7ss.jpg"}], "quoted": {"author": "random_walker", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?"}}, {"id": "2105763874880593958", "url": "https://x.com/sayashk/status/2105763874880593958", "text": "To be clear, while making and watching these videos is fun the first few times, I don't think they will remain compelling for very long. As these videos become easier to create and more pervasive, their novelty will wear out pretty quickly. \n\nI predict we'll look back at these the same way we look back at early ChatGPT demos (cute but kind of annoying). \n\nOf course, AI will be extremely useful for people who make videos, but since they'll all be competing for the same eyeballs, it's what they do with AI that will differentiate them.\n\nAnd there are already tells in these videos that will make us collectively groan as we see more of these, e.g.: https://t.co/nGyL7CHXDm\n\nhttps://t.co/79GeXlAH7O", "created_at": "2026-10-01T20:56:45+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": {"author": "SethCronin", "text": "@sayashk Along with the increasing rate of model drops, I'm also finding my rate of ability to be impressed goes down as well. I think if I had seen videos like this being produced a year ago, my hype for it would have lasted at least a few weeks if not months. However seeing this style of video just twice in two days has already completely drained any awe or intrigue I've had in these products. The first one I generally genuinely sat through to completion but after 45 seconds of this it was instant boredom. Funny that"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107484134847512903", "url": "https://x.com/sayashk/status/2107484134847512903", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought i
