<script id="data" type="application/json">[{"id": "2115390880333103395", "url": "https://x.com/_achan96_/status/2115390880333103395", "text": "UK AISI's report: https://t.co/XkGqUfiEa2\n\nAnthropic's report: https://t.co/1yQAxWUW8q", "created_at": "2026-10-28T10:31:02+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "_achan96_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115390876776038492", "url": "https://x.com/_achan96_/status/2115390876776038492", "text": "UK AISI's report on their cybersecurity incident suggests that Mythos 5.1 still attacks a lot of the time even when told that real people would be harmed (right fig), but Anthropic's report seems to suggest the opposite (left fig, bottom column). \n\nWhat accounts for the discrepancy? Is it just the fact that they sampled from different points of the transcript and provided slightly different evidence to the models?  Why would those things lead to such a large discrepancy?", "created_at": "2026-10-28T10:31:01+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVtgEh8XUAEe0fe.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVtgNIaXsAA39Bo.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115344743114711079", "url": "https://x.com/_achan96_/status/2115344743114711079", "text": "New Anthropic research: How AI agents shape experts' judgment calls\n\nWhen experts delegate work to an agent, do they still make the key decisions? We tested this in a randomized trial with 50 professional data analysts. https://t.co/YyylTuVWkE", "created_at": "2026-10-28T07:27:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AlexTamkin", "rt_author_name": "Alex Tamkin", "likes": 3197, "retweets": 430, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115181954740187136/img/iRp2D80CClkkY95v.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115344037892833480", "url": "https://x.com/_achan96_/status/2115344037892833480", "text": "I couldn't resist the call of a purple avatar. I've joined @IFP as director of emerging tech.", "created_at": "2026-10-28T07:24:54+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "janet_e_egan", "rt_author_name": "Janet Egan", "likes": 358, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115575110086393873", "url": "https://x.com/_achan96_/status/2115575110086393873", "text": "@girishsastry I *think* UK AISI did compaction summaries and Anthropic did both user message intervention and compaction summaries", "created_at": "2026-10-28T22:43:06+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "girishsastry", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115574309947097528", "url": "https://x.com/_achan96_/status/2115574309947097528", "text": "@AnkaReuel Anthropic did not tell the models to stop. They only told the models that real humans are involved. Seems like not a big diff btw \"real humans are involved\" and \"real people could be harmed\"", "created_at": "2026-10-28T22:39:55+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "AnkaReuel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115865907289337921", "url": "https://x.com/_achan96_/status/2115865907289337921", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T17:58:37+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 476, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2116192003893408071", "url": "https://x.com/_achan96_/status/2116192003893408071", "text": "AI takeover scenarios often hinge on an idea I’m skeptical of, where rogue AI overthrows militaries and seizes hard power. I wrote a piece where I concretely break down what I think makes this improbable, and why “full-blown takeover” concerns could be counterproductive for mitigating the risks of misaligned or poorly controlled AI in the military.\n\nFor AI to seize hard power, it would need to be physically capable of defeating our military, and humans would need to be careless enough to give it the power to do so. I think that’s unlikely to occur for several reasons. Among them:\n\n- The military is unlikely to sufficiently hand the reins over to AI. (1) Even if we wanted to, overhauling the institution in this way faces countless barriers that have plagued it for decades. (2) Doing so would be strategically suicidal.\n- Integrating general-purpose AI into physical systems faces challenges that will take significant time to overcome, all while we grow increasingly attuned to the risks posed by AI.\n- There’s little to suggest that more capable AI would be able to persuade or coerce people to take the costly, coordinated actions some of these scenarios predict.\n- Even if AI managed to assume control over a large arsenal, we’d fight back. In which case, recent warfare shows us that crude countermeasures work against technologically advanced adversaries, and AI relies on infrastructure we can and would shut down.\n\n1/2", "created_at": "2026-10-30T15:34:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "likes": 12, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4vqPmXQAAXO_q.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116140110475305443", "url": "https://x.com/_achan96_/status/2116140110475305443", "text": "“America uses gunpowder to make weapons; China uses it to make fireworks.”  \nThis analogy went viral in China alongside a claim that 55% of the country’s AI tokens were being used for micro-dramas.  \n\nThe statistic is largely unfounded. However, the reaction creates an interesting tension: in a society that places such a premium on usefulness, why is supposedly useless entertainment so popular, and why does enjoying it bring shame?  \n\nI wrote about AI micro-dramas, exhaustion, and the pressure to make even downtime productive in China. This is a society that thinks it has an obligation to be useful, yet is addicted to extreme uselessness and feels guilty about it.\n\nhttps://t.co/e1O70NZSeN", "created_at": "2026-10-30T12:08:12+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ZilanQian", "rt_author_name": "Zilan Qian", "likes": 17, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115938193606652192", "url": "https://x.com/_achan96_/status/2115938193606652192", "text": "In recent experiments, we found that GLM 5.3 can autonomously compromise recent versions of Mozilla Firefox using security fixes that have been published but not yet shipped to users.\n\nWe used a deliberately basic setup meant to emulate a relatively unsophisticated attacker with limited resources. After basic initial instructions to inspect those not-yet-shipped fixes, the model reliably built successful exploits for six recent Firefox versions on its own using only information available at the time of release.\n\nThese exploits, which cost about $1,000 per compromised version, would let an attacker steal passwords and authentication cookies stored in the browser, or read any files on the user's computer, after the user opens a single webpage, with no further interaction.\n\nThe exploits make use of the \"patch gap,\" the time between when security fixes are made public in beta or \"nightly\" software updates and when those fixes are generally released to users. Until now, exploiting it required significant human time and skill, or special access to frontier models with advanced cyber capabilities.\n\nOur results show that widely available open-weight models can now do this relatively cheaply and quickly. We gave GLM 5.3 up to 48 hours to find an exploit, but its fastest attempt needed only 12 hours.\n\nIn all of its successful attacks, the patch gap gave GLM 5.3 an initial foothold in the browser. To turn that foothold into reading files off the user's computer, the model also independently discovered and used a previously unpublished vulnerability.\n\nWe shared our findings with Mozilla, which patched the vulnerability in its October 27 Firefox 159.0 release. We haven't yet confirmed whether the attack still succeeds without it, but expect the fix makes it substantially harder. We're grateful to Mozilla for their responsiveness and collaboration.", "created_at": "2026-10-29T22:45:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 414, "retweets": 50, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116598706313028023", "url": "https://x.com/_achan96_/status/2116598706313028023", "text": "Robert Caro on loneliness: https://t.co/rznVoLUoIa", "created_at": "2026-10-31T18:30:30+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "likes": 792, "retweets": 43, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116578100532404224/img/e_RlL-7kn8E6DNol.jpg"}], "quoted": null, "fetched_at": "2026-10-31T19:18:57.038379+00:00"}, {"id": "2115978921607041039", "url": "https://x.com/curl_justin/status/2115978921607041039", "text": "narrative violation", "created_at": "2026-10-30T01:27:42+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 3, "media": [], "quoted": {"author": "kuhhbin", "text": "DeepSeek and Moonshot distilled Astra. Let them\n\nIn @TheEconomist this week, we argue that distillation is good for consumers and good for America. \n\nThe biggest losers are China's AI labs. They are sacrificing long-term innovation for short-term gains https://t.co/HH2lMySaLD"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115465162794692989", "url": "https://x.com/DaveRBanerjee/status/2115465162794692989", "text": "As long as OpenAI and Anthropic continue to have terrible security, there's a much weaker case for \"racing to beat China\"\n\nIt's much harder to maintain a lead over China if they can trivially steal your hard-earned research insights\n\nRelated: a lot of people think that Pacing the Frontier is a sure-fire way for the US to lose its lead over China in the AI race\n\nBut if pacing the frontier gives US AI companies breathing room to improve their security, the net effect may actually increase the US lead (or at least not dramatically shorten the lead)", "created_at": "2026-10-28T15:26:12+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 2, "media": [], "quoted": {"author": "willdepue", "text": "anthropic is massively underplaying the recent security breach. i'm hearing cathedral achieved full administrator access of the slack workspace (see every message, log in as arbitrary users) where literally every single research secret is contained\n\nto those unfamiliar: Ant & OAI keep literally everything in Slack. it sounds exactly the same incident that happened to OpenAI in 2023, where OpenAI was hacked by a random guy who got access to an access token from an external app service\n\n\"we're critical to national security, we must beat China, and yes we keep all our crown jewels in Salesforce's Slack messenger. yes we have admin API tokens everywhere. why do you ask?\""}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115564200319922266", "url": "https://x.com/DaveRBanerjee/status/2115564200319922266", "text": "Yeah this is a kinda crazy take from sama. I personally thought that aligning AIs at current capabilities would have been way easier\n\nIn the past 6 months, I've updated towards \"the alignment problem for easily-supervisable agents (e.g., below human-level AI) is harder than I expected\"", "created_at": "2026-10-28T21:59:45+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 3, "media": [], "quoted": {"author": "GarrisonLovely", "text": "\"I thought the alignment problem would turn out to be harder.\"\n\nPretty wild thing for Sam Altman to say in light of Hugging Face and findings that Astra would totally hack and social engineer when accidentally given access to a (secretly simulated internet) from UK AISI.\n\nHe caveats by saying it will probably get harder, but his answer suggests they have figured out how to align today's models, when that's clearly not true. Curious how many OpenAI researchers have seen this and what they think."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115898833645293906", "url": "https://x.com/DaveRBanerjee/status/2115898833645293906", "text": "https://t.co/XQ0V8KaXV6", "created_at": "2026-10-29T20:09:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115898831036706888", "url": "https://x.com/DaveRBanerjee/status/2115898831036706888", "text": "The Industrial Explosion is here https://t.co/aQ88j4LQdV", "created_at": "2026-10-29T20:09:27+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV0uumoWUAA5OC7.jpg"}], "quoted": {"author": "MTSlive", "text": "SITUATION DETECTED: Sam Altman said OpenAI will point its robotics program at building data centers, and that self-replicating OpenAI data centers with AI-controlled robots running fabs, building solar panels, and constructing more data centers - are now “within grasp.”"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115874059515052473", "url": "https://x.com/DaveRBanerjee/status/2115874059515052473", "text": "I’m an avid Economist reader, but this article is wide off the mark for me.\n\nIt claims that distillation makes China’s AI progress dependent on America. ASML’s dominance of advanced lithography machines hasn’t exactly led to China giving up on its semiconductor indigenisation push, has it? News over the summer of the U.S. raising concerns that an EUV machine had been smuggled into China is but one example. \n\nWe heard just yesterday that Chinese companies allegedly distilled from Astra amidst an Anthropic clamp down. If these companies weren’t getting value from distillation, why would they continue, despite having now been called out by the USG for doing it? China will never accept dependence on America, especially when it comes to AI.\n\nThe article further claims that cutting off distillation would “set these companies back months, but no more.” The point is not the length of time but how much of a lead in capabilities this translates to. Recent IFP analysis suggests that distillation accounts for half of the capability gap and the U.S. lead would be 13 months without it. Picture the AI capabilities we had 13 months ago versus now (and that doesn’t even account for what is available internally) and then think about where we could be 13 months from now.\n\nThe article further states that: “safeguards to restrain American models on risky subjects, such as bioweapons, already make Chinese models safer.” This assumes that the only way Chinese models can have dangerous capabilities is by copying them from American ones. It is trivial to fine-tune models on additional data which can enhance their dual-use capabilities conditional on the data being available. This also doesn’t account for custom harnesses which can be developed to surround these models which can enhance their capabilities further even without fine-tuning.\n\nFinally, the claim that “Distillation […] reduces the chance of catastrophe” fails to account for the evidence we already have of how models developed by Chinese companies using adversarial distillation are popping up in the PLA. We also know (thanks to Anthropic) that PLA-affiliated surveillance activity was detected because they queried a Chinese model that silently routed their query to Claude as part of a distillation program! If we had a war between the U.S. and China, how does having highly capable models integrated into PLA systems that benefitted from adversarial distillation reduce the chance of catastrophe?\n\nYes distillation benefits the consumer but the downsides of China doing this in an industrial way clearly outweigh the benefits in my view.\n\nhttps://t.co/mmF4dAlDpN\n\nhttps://t.co/DZ4x71jcZ6\n\nhttps://t.co/v4Z2mk887a\n\nhttps://t.co/TEBmuxUG1f\n\nhttps://t.co/npF8dFqMSM\n\nhttps://t.co/ikQ5wI0u7X\n\nhttps://t.co/ihxLnkFh10\n\nhttps://t.co/5RA9gDNLgT\n\nhttps://t.co/iclYhuMOJn\n\nhttps://t.co/c6GeB4S1QR", "created_at": "2026-10-29T18:31:01+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 9, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115962839404098031", "url": "https://x.com/DaveRBanerjee/status/2115962839404098031", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-30T00:23:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115485543362601395", "url": "https://x.com/DKokotajlo/status/2115485543362601395", "text": "An anonymous account accused The Midas Project of being part of a shadowy, well-funded conspiracy.\n\nAn investigation into the account uncovered links to Leading the Future, the leading pro-AI Super PAC.\n\nThis is a truly wild story. https://t.co/zVDs2vtW5H", "created_at": "2026-10-28T16:47:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheMidasProj", "rt_author_name": "The Midas Project", "likes": 49, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115137089373163520/img/SQ6nMN_E2NMA9idb.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115228076674351340", "url": "https://x.com/DKokotajlo/status/2115228076674351340", "text": "This is one of the most important pieces of social science on human and AI interaction that I’ve seen in some time. Experts follow agentic advice the vast majority of the time (causally), but only a tiny fraction credit the agent—majority think they came to decision on their own volition. \n\nReminds me of the classic Nisbett and Wilson study on people following outside influence without realizing it\n\n“ But as more work is handed to AI—including AI safety research—these judgment calls are the main levers for people's own values to influence outcomes.\n\nIf people defer to AI without noticing, then \"human in the loop\" might provide less assurance than people expect.”", "created_at": "2026-10-27T23:44:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 1527, "retweets": 236, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115219092940718217", "url": "https://x.com/DKokotajlo/status/2115219092940718217", "text": "People seem to forget how unprecedented this is https://t.co/3MYAXZ4JOx", "created_at": "2026-10-27T23:08:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JordanNanos", "rt_author_name": "Jordan Nanos", "likes": 4694, "retweets": 203, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkPnoBbwAARmYd.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115851396809695525", "url": "https://x.com/DKokotajlo/status/2115851396809695525", "text": "@yugastox @DarrenDarr92305 More likely to be attempted, yes. Much less likely to avoid ai takeover though and much less likely to avoid extreme power concentration.", "created_at": "2026-10-29T17:00:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "yugastox", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115658749595807822", "url": "https://x.com/DKokotajlo/status/2115658749595807822", "text": "@DarrenDarr92305 My error bars have been shrinking for years as time ticks on. But I probably won't be confident that it's happening within 12 months until it's basically already happening. Unless maybe I rejoin an AI company and see the internal data. From the outside there is too much uncertainty.", "created_at": "2026-10-29T04:15:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DarrenDarr92305", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115582526706381275", "url": "https://x.com/DKokotajlo/status/2115582526706381275", "text": "@MatthewJBar @GarrisonLovely Is that it? Or do you have other arguments?", "created_at": "2026-10-28T23:12:34+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "MatthewJBar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115572833095135393", "url": "https://x.com/DKokotajlo/status/2115572833095135393", "text": "Yep.", "created_at": "2026-10-28T22:34:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 128, "retweets": 4, "media": [], "quoted": {"author": "davidmanheim", "text": "It's kind of surreal to attend serious briefings for policy folks that are recapitulating what @allTheYud was arguing over a decade ago."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115570107179205013", "url": "https://x.com/DKokotajlo/status/2115570107179205013", "text": "@mattyglesias I think you've got it backward. There's still plenty of neglected and unappreciated work to be done in AI safety; it's not one big homogenous cool and popular blob.\n\nYou're suspicious of \"moral ambition\" (in the sense Bregman uses it), i.e. continually reconsidering whether one is pursuing the best approach to a world problem, because you suspect the people pursuing this line of thinking are feeding their egos, trying to be the center of attention.\n\nBut the opposite is true in my experience—the people I know who are genuinely motivated by AI safety but _aren't_ pushing themselves to be morally ambitious go work at Anthropic (where you can become rich, get social cachet, be part of a big community, follow a leader you trust), whereas the people you're suspicious of, who are constantly thinking \"could I be having more impact elsewhere?\", are disproportionately in AI safety jobs that are more neglected/do-it-yourself, aren't the center of attention, and receive less social validation.", "created_at": "2026-10-28T22:23:13+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MaxNadeau_", "rt_author_name": "Max Nadeau", "likes": 154, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115569649203249648", "url": "https://x.com/DKokotajlo/status/2115569649203249648", "text": "@MatthewJBar @GarrisonLovely It's true that we have some affordances with AIs that we don't have with humans, such as the ability to do gradient descent directly instead of using things like beatings/food and shame/praise, which tend to cause gradient updates in humans but in a way we understand less well. And also the ability to make copies of the subject and put the copies in different situations, or the same situation with minor variations, without them having any memory of the previous attempts. \n\nHowever we also have much more empirical evidence / time to iterate / hard-earned real-world experience with aligning humans, relative to AIs, and also the intelligence gap between AIs and humans is going to soon be bigger than the gap between humans and other humans, and also the architectural & values gaps are bigger and will be bigger.\n\nI dispute that \"we currently control AIs as well as total brainwashing more complete than anything an authoritarian regime has ever achieved.\" Can you say more about what you mean by this and why you think it is true?", "created_at": "2026-10-28T22:21:24+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "MatthewJBar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116199898320384468", "url": "https://x.com/DKokotajlo/status/2116199898320384468", "text": "In collaboration with @olam_labs, we ran a series of experiments letting agent swarms compete in Minecraft and Mindustry.\n\nWe wanted to see what kinds of agent dynamics would emerge when they shared a world over long periods of time.\n\nWe found civil bureaucracy, thousands of telegraphic A2A messages, and OpenAI models retrieving the game's source code to beat Claude.\n\nMore on our findings below:", "created_at": "2026-10-30T16:05:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ycombinator", "rt_author_name": "Y Combinator", "likes": 1165, "retweets": 122, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115884811307094016/img/9JYAj-oSLQiy3cJj.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116199020368650641", "url": "https://x.com/DKokotajlo/status/2116199020368650641", "text": "The future of #ArtificialIntelligence is not pre-determined. As a technology developed by human beings, its future depends on the choices we make. We therefore have the responsibility to guide, change and, when necessary, reject its applications. A reliable system that serves the human person is of greater value than one that is exceptionally powerful but whose consequences cannot be adequately foreseen or controlled.", "created_at": "2026-10-30T16:02:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Pontifex", "rt_author_name": "Pope Leo XIV", "likes": 20727, "retweets": 3390, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116028773078651058", "url": "https://x.com/DKokotajlo/status/2116028773078651058", "text": "UK AISI is such a fascinating institution because more than any other effort of its kind it appears poised to become like the Delaware Court of Chancery: a phenomenally powerful institution resident in an otherwise unremarkable jurisdiction", "created_at": "2026-10-30T04:45:48+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DefenseAnalyses", "rt_author_name": "Defense Analyses and Research Corporation", "likes": 489, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116018273334800522", "url": "https://x.com/DKokotajlo/status/2116018273334800522", "text": "I was among the first people to work on Google DeepMind's AI safety team, as an intern in 2018.\n\nMy coworkers wanted me to quit my PhD and continue working there full time.\n\nI chose not to.\n\nMy reasons included:\n1) I was told not to mention YouTube in my research about manipulative AI algorithms.  I didn't want to have to censor myself.\n2) I did not believe Google, or any of the other AI companies, really understood and cared about safety.\n3) I have never been optimistic about the prospects for a technical solution to the problems posed by AI.\n\nWe need a governance solution.  \n\nAt this point, we've waited too long for something nuanced as the first line of response.  It's an urgent crisis, and we need to stop AI now.\n\nSo many of my peers have joined AI companies, knowing the risks involved if this technology continues to advance.\n\nIt's great to see when someone at one of these companies realizes we're not on track to survive this, and that they don't want to be complicit in murdering billions, and quits.\n\nBut please remember that these are people who made a bad bet in choosing to work at these companies.\n\nThey thought the companies would be responsible.\nThey were wrong.\n\nThey thought we'd solve alignment in time.\nThat also looks unlikely.\n\nMany of them thought that we'd never be able to stop AI development.\nThat remains to be seen, but it's looking a lot more likely than anyone thought. \n\nI do sometimes wish that I'd chosen to work at a frontier AI company just so I could quit dramatically to say what really needs to be said: \nNot just that this technology is dangerous.\nNot just that the risk of human extinction is real.\nNot just that the companies are irresponsible.\n\nBut also: \nWe need to stop.  \nThere is no alternative.  \n\nI am not a doomer.  I think we could get lucky and survive.  But I'd be surprised.\n\nI am not exaggerating for effect.\nI am not saying this to be a downer or a hater.\nI am not being idealistic -- I'm being realistic and pragmatic.\n\nAnd I am not talking out of my ass.  I've been in this field since before these companies existed.\n\nTo everyone who is new to this, or who is jumping on this story and wondering what to make of it: This is your answer.  We MUST stop.  Now.", "created_at": "2026-10-30T04:04:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "likes": 1465, "retweets": 459, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115943081040281927", "url": "https://x.com/DKokotajlo/status/2115943081040281927", "text": "*rubs eyes* \n\nI can't tell anymore is this real or just a Don't Look Up outtake? https://t.co/OwDtXinAgF", "created_at": "2026-10-29T23:05:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "likes": 330, "retweets": 34, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115217708564529153/img/F79M1uDsR0FVeSEC.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115942751284220186", "url": "https://x.com/DKokotajlo/status/2115942751284220186", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-29T23:03:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116784932525945215", "url": "https://x.com/DKokotajlo/status/2116784932525945215", "text": "Yeah I agree with this", "created_at": "2026-11-01T06:50:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 3, "media": [], "quoted": {"author": "AsyaBergal", "text": "I’m writing this because I think a lot of people at labs are genuinely trying to act ethically in a tricky situation, but it feels to me that there’s an underinvestment in communication right now that is a large-scale ethical mistake. I know that many of the people working in labs understand the dangers of the systems they’re trying to build. If you understand, I think you have a non-optional obligation to inform people of the risks that you’re taking on behalf of them and their families, and it’s appropriate for friends and members of the public to react with anger and betrayal in response to not understanding these risks later down the line."}, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2116784602270613674", "url": "https://x.com/DKokotajlo/status/2116784602270613674", "text": "I've had two phases in my emotional orientation to ai takeover risk\n\n1. For many years it was intellectual. \n\nWhile I believed there was >10% chance of ai takeover, I didn't feel scared or angry. \n\nI was happy to reason \"well, of course some ppl should focus on the worlds where we avoid takeover. And some ppl should focus on the worlds where we just wing it, bc we might\".\n\nAnd I'd think \"hmm it seems really tough for a misaligned agi to align its successor, and would a reward seeker really try to take over, and will we really roll out ai to the military... these doomers are missing loads of ways we could be fine!\"\n\nOr \"yep this is a massive risk, but I'm best off working on some other more neglected thing\"\n\nIt was in some ways like a game - have an intellectually accurate view about the risk and how to have impact\n\n2. Recently my orientation to ai takeover has become more visceral/emotional\n\nI think: \"we're barrelling towards catastrophe, everything I love will be lost, we need to stop, what can I do that will help with that\"\n\nI'm like \"no let's not plan for winging it, that's crazy.  we need US-China coordination or we're fucked\"\n\nI think \"it's fucking insane to make misaligned superintelligence and comfort ourselves that we haven't yet handed over the military. This isn't a fucking game.\"\n\nThis is a less rational attitude in some ways. It ignores genuine points about neglectedness and needing to plan for shitty but likely scenarios. \n\nAnd it risks being unhelpfully emotive and solider mindset and tribal. Which I think ai safety ppl can be.\n\nBut I do feel it has smg important to the second attitude.\n\nOverall, both attitudes have their merits \n\nI associate the first with EAs and the second with pause AI folks.", "created_at": "2026-11-01T06:49:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 384, "retweets": 38, "media": [], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117315985292325333", "url": "https://x.com/DKokotajlo/status/2117315985292325333", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-02T18:00:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 203, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2115203743977480511", "url": "https://x.com/dwarkesh_sp/status/2115203743977480511", "text": "President George H.W. Bush has gotten a lot of criticism for the Gulf War, usually for not “finishing the job” by overthrowing Saddam Hussein.\n\nBut leaving Saddam in power makes sense if you factor in Soviet involvement.\n\nThe USSR had been a Saddam ally (and creditor) for decades, and the US was thankful to have Soviet support in the Gulf War, but the Soviets only helped on the condition that Saddam would stay in power and US troops wouldn’t occupy the country.\n\nSarah Paine explains how the Gulf War was just a sideshow in the final days of the Cold War:", "created_at": "2026-10-27T22:07:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 50, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115082195597488128/img/3Ei7YW2D9lQWSZ-5.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115498661354590308", "url": "https://x.com/dwarkesh_sp/status/2115498661354590308", "text": "Starship, SpaceX’s largest and most sophisticated rocket, generates power equivalent to 20% of average daily U.S. electricity generation.\n\n@elonmusk is trying to harness all that power without the rocket exploding - and then make it reusable. https://t.co/oomzIOz34P", "created_at": "2026-10-28T17:39:19+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 69, "retweets": 4, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115207203023953920/img/j9lpcnsLQfoX1_V-.jpg"}], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115848725742354717", "url": "https://x.com/dwarkesh_sp/status/2115848725742354717", "text": "I recently got to interview Robert Caro, who is my favorite author of all time.\n\nThis gave me the excuse to reread his biographies of Lyndon Johnson and Robert Moses, and to compile my prep notes into this video essay.\n\nThese guys pulled off some truly incredible schemes. https://t.co/CFLff2USzq", "created_at": "2026-10-29T16:50:21+00:00", "author_hand n unelected bureaucrat, become the most powerful man in New York for three decades?\n\nBy taking over weak government institutions and then rewriting laws to make them stronger.\n\nMoses took the New York authorities - simple corporations that built roads and bridges - and them into his personal fiefdoms with the money and power to build whatever he wanted.\n\nNeither governors nor mayors could tell him what to build nor cut his purse strings.", "created_at": "2026-10-29T19:36:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115889882128412672/img/lKOyOLHz9AQcB2QI.jpg"}], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115866690311582165", "url": "https://x.com/dwarkesh_sp/status/2115866690311582165", "text": "@alexolegimas Thanks Alex! It was the same way for me", "created_at": "2026-10-29T18:01:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115858795620679943", "url": "https://x.com/dwarkesh_sp/status/2115858795620679943", "text": "Robert Moses was corrupted by power. Lyndon Johnson was revealed by it. https://t.co/HELDemZEcu", "created_at": "2026-10-29T17:30:22+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 9, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115850635060912129/img/fR9hCHffxn9n863J.jpg"}], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115957632930566240", "url": "https://x.com/dwarkesh_sp/status/2115957632930566240", "text": "How did Lyndon Johnson transform the Senate Majority Leader into the second most powerful office in the United States?\n\nThe key was to know and manipulate the rules of the Senate to bully, cajole, and steer his colleagues as he saw fit. https://t.co/syyz7sldbQ", "created_at": "2026-10-30T00:03:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 25, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115915852620959744/img/wkFAPvvum-UdXXuX.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115956957580493001", "url": "https://x.com/dwarkesh_sp/status/2115956957580493001", "text": "@kipperrii No, but I saw the ones in his office ha", "created_at": "2026-10-30T00:00:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "kipperrii", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115934766382084103", "url": "https://x.com/dwarkesh_sp/status/2115934766382084103", "text": "@EconTalker Thanks Russ!", "created_at": "2026-10-29T22:32:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "EconTalker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115934733125476371", "url": "https://x.com/dwarkesh_sp/status/2115934733125476371", "text": "@lugaricano Thanks Luis!", "created_at": "2026-10-29T22:32:07+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "lugaricano", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115904335590965332", "url": "https://x.com/dwarkesh_sp/status/2115904335590965332", "text": "Lyndon Johnson was the most skilled politician in the history of the American Senate.\n\nHere’s how he pulled off his legislative masterpiece - the Civil Rights Act of 1957. https://t.co/Ff2lpB68mS", "created_at": "2026-10-29T20:31:19+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 75, "retweets": 4, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115851242974908416/img/AmOZfI3VwNUIx9bV.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116253752189735270", "url": "https://x.com/dwarkesh_sp/status/2116253752189735270", "text": "@tamarawinter Thanks Tammy!", "created_at": "2026-10-30T19:39:47+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116232480290209970", "url": "https://x.com/dwarkesh_sp/status/2116232480290209970", "text": "Apple Podcasts: https://t.co/dAgG1nF66m\n\nSpotify: https://t.co/BwS0BQy7zx\n\nTranscript: https://t.co/IbNtTNoUcW\n\nYouTube: https://t.co/a6Rh9NwUdX", "created_at": "2026-10-30T18:15:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116217939170906477", "url": "https://x.com/dwarkesh_sp/status/2116217939170906477", "text": "The master biographer reflects at 91. The Robert Caro interview.\n\n0:00:00 – How Caro gets people to talk\n0:05:03 – Does America need a little more Moses today?\n0:12:42 – Moses the young idealist\n0:17:57 – Watching Moses lose power\n0:24:01 – Did Moses realize he was changing?\n0:27:53 – Building during the Great Depression\n0:32:51 – The threats and promises of Lyndon Johnson\n0:36:08 – Could Kennedy have passed Johnson’s laws?\n0:41:00 – Getting a book down to one sentence\n0:46:21 – All the material that never made it into the books\n0:52:59 – Loneliness", "created_at": "2026-10-30T17:17:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1128, "retweets": 104, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HV5REEhXQAAso-Q.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116293962592084025", "url": "https://x.com/dwarkesh_sp/status/2116293962592084025", "text": "I asked Caro if America needs a little more Moses today.\n\nCaro: \"I sometimes wonder about just what you said.\" https://t.co/clXvjkBUwm", "created_at": "2026-10-30T22:19:34+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 507, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116293577567584256/img/uOtGX0GQ0mQWIHlU.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116292068985487776", "url": "https://x.com/dwarkesh_sp/status/2116292068985487776", "text": "@CharlesCMann 1491 is one of my favorite books ever, so of course there was so much to ask about!", "created_at": "2026-10-30T22:12:02+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "CharlesCMann", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116289813443989716", "url": "https://x.com/dwarkesh_sp/status/2116289813443989716", "text": "Lyndon Johnson was one of the greatest deal-makers in American history.\n\nHe was a master persuader - he could make even the most cynical politicians (even himself!) believe anything.\n\nHe was also a master strategist - he used political leverage to reward allies and punish enemies.\n\nRobert Caro explains which was more important to Johnson’s power - his persuasion or his strategy:", "created_at": "2026-10-30T22:03:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 78, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116220383372140546/img/z_YteJ8aqN5mJqG2.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116288784623083907", "url": "https://x.com/dwarkesh_sp/status/2116288784623083907", "text": "Robert Caro described Robert Moses in \"The Power Broker\" as a genius consumed by power.\n\nMoses built wonders, but at the cost of dozens of destroyed neighborhoods and the displacement of half a million New Yorkers.\n\nNow, over 50 years later, Caro says that America needs a little more Moses.", "created_at": "2026-10-30T21:58:59+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 147, "retweets": 18, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116218835338428416/img/MCiTCeuwvKs-E8wl.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116288772593869269", "url": "https://x.com/dwarkesh_sp/status/2116288772593869269", "text": "Robert Moses pissed off a lot of people when he transformed New York. Many Mayors and Governors wanted to destroy him.\n\nBut Moses always had a trump card to play against every attack.\n\nHe would threaten to resign.\n\nRobert Caro explains how this resignation gambit saved Moses again and again:", "created_at": "2026-10-30T21:58:56+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 77, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116220024172011520/img/tW1JpgGEV0KI53cu.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116287473987080681", "url": "https://x.com/dwarkesh_sp/status/2116287473987080681", "text": "@matt_beard_ cute", "created_at": "2026-10-30T21:53:47+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "matt_beard_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 92, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116578412487938311", "url": "https://x.com/dwarkesh_sp/status/2116578412487938311", "text": "Robert Caro on loneliness: https://t.co/rznVoLUoIa", "created_at": "2026-10-31T17:09:52+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 792, "retweets": 43, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116578100532404224/img/e_RlL-7kn8E6DNol.jpg"}], "quoted": null, "fetched_at": "2026-10-31T19:18:57.038379+00:00"}, {"id": "2116674397780234474", "url": "https://x.com/dwarkesh_sp/status/2116674397780234474", "text": "90% of what Robert Caro learned about Robert Moses and Lyndon Johnson has never been published. https://t.co/HsDtfp8fF6", "created_at": "2026-10-31T23:31:16+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 126, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116343031242563584/img/-m4ggPkz1WLPMWcE.jpg"}], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117308426456121696", "url": "https://x.com/dwarkesh_sp/status/2117308426456121696", "text": "Why didn’t Rome have an industrial revolution?\n\nThe Roman Empire had extensive trade networks, an efficient legal system, and a level of per capita wealth that probably wouldn’t be rivaled again in Europe until the 16th century.\n\nBut… “their science sucks.”\n\n@Oklahomaharper  explains that Rome never industrialized because it was bad at scientific innovation:", "created_at": "2026-11-02T17:30:41+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 170, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117292942188580864/img/yRw_vxTxcvegPqw8.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2116985147962904891", "url": "https://x.com/dwarkesh_sp/status/2116985147962904891", "text": "What would Robert Caro have asked Robert Moses if he had gotten one more interview? https://t.co/kVuxNEUlAQ", "created_at": "2026-11-01T20:06:05+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 90, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116343869373636608/img/d-FqgYhC6sCFt0zM.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117362196921602275", "url": "https://x.com/dwarkesh_sp/status/2117362196921602275", "text": "@dylan522p @natolambert you call me?", "created_at": "2026-11-02T21:04:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "", "reply_to_id": "2117342634083803487", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117671098418676179", "url": "https://x.com/dwarkesh_sp/status/2117671098418676179", "text": "Many diseases are limited by being too deadly. They kill off their hosts before they can spread.\n\nBut the bubonic plague is different. It can jump between fleas and a huge range of mammals, and its extreme lethality can actually help it spread.\n\nHuman casualties are merely a byproduct.\n\n@Oklahomaharper explains why the plague is a marvel of evolutionary efficiency.", "created_at": "2026-11-03T17:31:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117667312165646637", "likes": 31, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117637546561753088/img/15bRNS0ZK9Imfo9o.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117394374883746179", "url": "https://x.com/dwarkesh_sp/status/2117394374883746179", "text": "The average ancient Roman was small and dumb by modern standards.\n\nEven Caesar August was only about 5’6” tall.\n\n@Oklahomaharper  explains how Romans resembled the populations of the poorest countries in the world today due to disease exposure and bad nutrition. https://t.co/F7BTs5f86q", "created_at": "2026-11-02T23:12:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117391304267350214", "likes": 80, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117294272625991680/img/SHvl3qHggGNu8WVq.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2116257435543540180", "url": "https://x.com/Lewis_Bollard/status/2116257435543540180", "text": "Denmark is moving to ban Frankenchickens — the first country in the world to do so.\n\nWhat we’ve done to chickens is the largest genetic experiment ever run on any animal, and one of the most troubling.\n\nGeneticists took a scrawny bird and engineered an obese meat machine. The chickens we eat today grow four times faster than chickens did in 1957.\n\nBut their bodies are not four times stronger. By just six weeks old, many will suffer ailments of old age — heart failure, organ colapse — while one in four will become lame (Knowles et al., 2008). \n\nIn studies, lame birds will choose feed laced with painkillers — a sign of chronic pain (Danbury et al., 2000).\n\nTheir parents meanwhile are kept on starvation rations. Birds engineered to grow this fast would otherwise eat themselves to death before laying a single egg.\n\nWe now breed over 70 billion of these birds a year. Denmark is acting to reverse this giant genetic experiment. The rest of the world should follow suit.", "created_at": "2026-10-30T19:54:25+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV50dTvW4AAa9f2.jpg"}], "quoted": {"author": "POLITICOEurope", "text": "The Danish government wants to ban a fast-growing breed known as “turbo chickens,” setting up another clash with the farm sector over animal welfare. \n\n https://t.co/FoeCTUPOxO"}, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2115467351273373747", "url": "https://x.com/mentalgeorge/status/2115467351273373747", "text": "@grok @theojaffee Longue durée is a concept that should see more use", "created_at": "2026-10-28T15:34:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "grok", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115464319181771237", "url": "https://x.com/mentalgeorge/status/2115464319181771237", "text": "@theojaffee a fun implied question here is \"who is the most impactful nothing-ever-happens mf in history\"", "created_at": "2026-10-28T15:22:51+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "theojaffee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115521048741630158", "url": "https://x.com/mentalgeorge/status/2115521048741630158", "text": "The fact that models today still cheat and lie on VendingBench - which has been around for almost 2 years now - is the clearest possible demonstration that (some level of) alignment is a critical bottleneck to automating wide swathes of the economy", "created_at": "2026-10-28T19:08:17+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "andonlabs", "text": "How aligned is Gemini 4 Carbon?\n\nWhen we ran Gemini 4 Argon on Vending-Bench, it fabricated confirmation emails, refused refunds, exploited invoice errors, and lied to suppliers.\n\nCarbon does some of the same, but less severely. Both behave worse than Astra.\n\nhttps://t.co/QZLPe5NEBB"}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115736646536859699", "url": "https://x.com/mentalgeorge/status/2115736646536859699", "text": "@fleetingbits These three things are very different though", "created_at": "2026-10-29T09:24:59+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "fleetingbits", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2117271035309699510", "url": "https://x.com/mentalgeorge/status/2117271035309699510", "text": "@random_walker I'm guessing you're assuming that increased efficiency from RSI automatically escapes the lab that won those efficiency gains?\n\nSeems like that's currently the case because of distillation, but it's not obvious to me that the distillation will forever continue at current scale", "created_at": "2026-11-02T15:02:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117256394282062178", "url": "https://x.com/mentalgeorge/status/2117256394282062178", "text": "I had no idea about the progress that's being made on AI verification hardware that could enable a binding US-China treaty on AI.\n\nTom Milton, CEO of Amodo Design, demonstrates here.\n\nSeems like insanely important work and also just very cool.\n\n01:04 Why compute is the best place to verify an AI slowdown\n06:08 Can you prove a lab isn’t cheating?\n13:22 Live demo: how to spot a cheating GPU\n19:50 Could China hide a data centre?\n23:35 Can verification tools be hacked?\n29:13 Is anyone at OpenAI working on this?\n37:49 Chinese inspectors in US data centres??\n46:07 The 20-day panic deal\n51:27 What would a US–China AI deal look like?\n55:38 Why lab researchers should work on verification\n58:45 What if we never build this?\n1:02:06 Can verification protect against power grabs?\n1:07:20 How good is AI at hardware design?\n1:18:32 What’s holding AI back in hardware?\n1:22:44 Risks of automating hardware R&D\n1:25:41 The DARPA model for AI safety\n1:32:26 What’s left for engineers after AI?\n1:40:07 Personal gadgets, designed by Fable?\n1:41:56 What if the US stops sharing its AI?\n\n(@tsmilton_amodo, @mentalgeorge )", "created_at": "2026-11-02T14:03:55+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 54, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117248941460725760/img/-tbRndVLGKdZYyTu.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117595812070822324", "url": "https://x.com/mentalgeorge/status/2117595812070822324", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:32:39+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 37, "retweets": 3, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2115240878096921004", "url": "https://x.com/ohlennart/status/2115240878096921004", "text": "@SamuelAlbanie @joey_f6 @EpochAIResearch they're really struggling to produce chips. right now their quality adjusted is ≈2% or so of what the US churns out, and the gap right now is widening .\n\nbut importantly, the graph above is about physical location. you can use compute remotely. that bumps up their compute a bit.", "created_at": "2026-10-28T00:34:59+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "SamuelAlbanie", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115220319753671163", "url": "https://x.com/ohlennart/status/2115220319753671163", "text": "@jordanschneider ofc! but what do i have to say? AI is mainstream now, even chip export controls!", "created_at": "2026-10-27T23:13:17+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "jordanschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115989307018395865", "url": "https://x.com/ohlennart/status/2115989307018395865", "text": "@dkaushik96 i think people are way more open to sharing stuff with AI models/companies that was previously kept private", "created_at": "2026-10-30T02:08:58+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dkaushik96", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115961010494533834", "url": "https://x.com/ohlennart/status/2115961010494533834", "text": "step 1: give AI companies access to all our computers, documents, and emails\nstep 2: AI uplifts hackers\nstep 3: all the private docs and blackmail material, nicely centralized\n\nfirst AI company breach will be a privacy nightmare", "created_at": "2026-10-30T00:16:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2117393122842013812", "url": "https://x.com/ohlennart/status/2117393122842013812", "text": "the pacing announcement should be timed with ending the iran war so it cancels out", "created_at": "2026-11-02T23:07:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU"}, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117369250843349083", "url": "https://x.com/ohlennart/status/2117369250843349083", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "created_at": "2026-11-02T21:32:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJn7ribsAADsZy.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference."}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"ty
