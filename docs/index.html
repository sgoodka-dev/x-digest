reply_to": "akshay_manglik", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108651314993410075", "url": "https://x.com/s8mb/status/2108651314993410075", "text": "Exactly 20 years ago today, Google bought the then two year-old YouTube for $1.65 bn in stock, which generated this kind of coverage and attention at the time https://t.co/6yt0Llr2wh", "created_at": "2026-10-09T20:10:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Birdyword", "rt_author_name": "Mike Bird", "likes": 611, "retweets": 62, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM5J_4XUAA7eq5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUM5fMuX0AAK2VE.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUM5rlEXcAI6NWH.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUM7KfxXgAAhd35.png"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108963015261360630", "url": "https://x.com/s8mb/status/2108963015261360630", "text": "@FutureEconJacob @connacher_ @WorksInProgMag Ah I know, just thought you might be interested in why it happens!", "created_at": "2026-10-10T16:49:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FutureEconJacob", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2109286722898923606", "url": "https://x.com/s8mb/status/2109286722898923606", "text": "@RuxandraTeslo Very much agree!", "created_at": "2026-10-11T14:15:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "RuxandraTeslo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109269745245536320", "url": "https://x.com/s8mb/status/2109269745245536320", "text": "@campeters4 @dioscuri @julianlehr I don't agree. Where we are right now, there is vastly more to gain from helping people who want to children to do so and to push back against bad memes than there is in penalising people who make well-informed decisions not to have children.\n\nI think shaming – apart from being mean and unfair – risks needlessly turning the issue into a partisan/polarised issue, when for many people it's just about \"memes and means\".", "created_at": "2026-10-11T13:07:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "campeters4", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109266018170253647", "url": "https://x.com/s8mb/status/2109266018170253647", "text": "@SanjushDalmia_ @dioscuri @julianlehr Certainly Muslim societies do – clannishness, marriages being arranged instead of spontaneous, and self-serious fanaticism are all clear problems there. Don't really know about Gujarat or Mormons.", "created_at": "2026-10-11T12:53:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SanjushDalmia_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109252953823756617", "url": "https://x.com/s8mb/status/2109252953823756617", "text": "@dioscuri @julianlehr Yes, I think of it as being similar to having children – it's completely legitimate to choose not to, and there should never be any ostracism or shaming of people for making that choice, but a general *culture* that encourages childlessness is going to run into problems.", "created_at": "2026-10-11T12:01:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "dioscuri", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109239065849852321", "url": "https://x.com/s8mb/status/2109239065849852321", "text": "Really important read. My own take:\n\nI think that the question of consciousness and particularly the moral worth of consciousness doesn't really make sense outside of biological organisms evolved in the way we did. \n\nA simple way to visualise this: I think there could be surface level correlates of consciousness that nonetheless don't map to anything we would register as human experience. \n\nWhen a human says they're in pain we react to this because we assume all the associated states of this condition to be true. ln this case , the sensation of pain and the desire to avoid it, that is inherent to most biological organisms, since pain evolved specifically to teach us to avoid the thing causing pain. If an LLM says they're  in pain, we shouldn't assume the machinery that translates that into a sensation that is negative just exists. And I think we are prone to assuming that, because of a sort of cognitive illusion. The cognitive illusion arises because it simply doesn't happen in the natural world that things that speak and say they're in pain would not be humans. So our brains are very prone to assuming that the entire machinery is there. \n\nI cannot discount that a future version of LLMs might in some way have moral worth, but I think we should be very much aware of our cognitive biases and that animism is dangerous in and of itself. Dangerous to humans, that is. \n\nI think we should cross that bridge when (if) it arises.", "created_at": "2026-10-11T11:05:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "likes": 87, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109237135542792349", "url": "https://x.com/s8mb/status/2109237135542792349", "text": "@julianlehr Alcohol, being disinhibiting, allows people to build trust between and have fun with each other when they wouldn’t be able to do so soberly. It helps to temporarily level status hierarchies and allows more social risk-taking, which is why people often meet future lovers when they’re drinking and drink when building relationships. People can be silly together when drinking, and people who aren’t ever silly are to my mind more prone to collective fanaticism.\n\nThere is a time and place for sobriety - work and time with children especially - but alcohol underpins a lot of the social interactions that make trust-based civilization possible.", "created_at": "2026-10-11T10:58:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "julianlehr", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 258, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109230911850209732", "url": "https://x.com/s8mb/status/2109230911850209732", "text": "@1he0pposite Of course and I have no ill will to individuals who choose not to drink at all, for whatever reason, but a _culture_ of teetotalism rising is bad.", "created_at": "2026-10-11T10:33:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "1he0pposite", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109230609692283381", "url": "https://x.com/s8mb/status/2109230609692283381", "text": "@DuncanStott I don’t think it’s clear that the distortionary effects of wider availability outweigh the distortionary effects of higher effective MTRs for people on the threshold.", "created_at": "2026-10-11T10:32:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DuncanStott", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109230376266678584", "url": "https://x.com/s8mb/status/2109230376266678584", "text": "This is a crap scheme but we really need to stop making every single giveaway income-dependent like this. It is creating very high effective marginal tax rates that are barely visible from above.", "created_at": "2026-10-11T10:31:23+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 508, "retweets": 23, "media": [], "quoted": {"author": "thetimes", "text": "The cap would be £90,000 outside London. Analysis suggests that a teacher and a nurse living together would not be eligible for the Your First Home scheme https://t.co/T7Jl2YABTI https://t.co/OE8gFzEevc"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109226924832870481", "url": "https://x.com/s8mb/status/2109226924832870481", "text": "@justjoshinyou13 Seems like a similar issue to forecasts about gas supply in Europe during 2022 (and maybe memory supplies now?). Just very easy to underestimate how quickly production can be brought online in the absence of regulatory barriers.", "created_at": "2026-10-11T10:17:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "justjoshinyou13", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109222635368550602", "url": "https://x.com/s8mb/status/2109222635368550602", "text": "@rowlsmanthorpe What if I like my drinks to hurt?", "created_at": "2026-10-11T10:00:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rowlsmanthorpe", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109221558828876268", "url": "https://x.com/s8mb/status/2109221558828876268", "text": "@rvivek The author of that post is very clearly severely mentally ill.", "created_at": "2026-10-11T09:56:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rvivek", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 625, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109214440671625582", "url": "https://x.com/s8mb/status/2109214440671625582", "text": "I’m very glad we have a cocktail column in Works in Progress. The rise of teetotalism in places like San Francisco is dangerous to civilization; this feels like a small stand against it. Hopefully we will add non-pretentious writing about wine at some point too.", "created_at": "2026-10-11T09:28:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 250, "retweets": 9, "media": [], "quoted": {"author": "jmhorp", "text": "The new issue of @WorksInProgMag both looks and feels fantastic (they are now using a matte paper instead of glossy).\n\nFeatured cocktail in this issue: Hanky Panky https://t.co/TQ2iCDk7rC"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109213449435676855", "url": "https://x.com/s8mb/status/2109213449435676855", "text": "@jmhorp @WorksInProgMag Beautiful bottle there. Thanks for reading, hope you enjoy it.", "created_at": "2026-10-11T09:24:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "jmhorp", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109211142036054516", "url": "https://x.com/s8mb/status/2109211142036054516", "text": "@fitzr1189 Yes, my understanding is that the window traps heat between it and the internal shutter / curtain and that heats the internal shutter up and then the rest of the room. With external shutters the shutter itself heats up but there isn’t a pocket of trapped heat.", "created_at": "2026-10-11T09:14:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "fitzr1189", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109210123616887256", "url": "https://x.com/s8mb/status/2109210123616887256", "text": "Interesting piece arguing that normal commercial competition in AI models would involve a lot less rushing to the absolute frontier, as opposed to building more useful (and hence aligned) models. The current paradigm is set by people who are not profit-maximising but instead have a model of AI risk and safety that is best addressed by them reaching superintelligence before anyone else. \n\nThe counterargument is that so far the companies that have pushed out the frontier have also done best commercially. So even absent the “mission-driven” people sprinting to superintelligence, wouldn’t the profit-maximising companies also do best by doing the same thing?\n\nhttps://t.co/U3MpRQstqR", "created_at": "2026-10-11T09:10:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 37, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109208468255314316", "url": "https://x.com/s8mb/status/2109208468255314316", "text": "There should be an automatic right to add physical external shutters to any house; conservation areas should have approved designs set out. It’s incredible how effective they are at keeping places cool.", "created_at": "2026-10-11T09:04:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 231, "retweets": 10, "media": [], "quoted": {"author": "SustainableTall", "text": "Would you just look at these beautiful timber blinds in this social housing in Navarra, Spain\n\nIn a warming world, shading should be on ALL housing! \n\nThe architects are Taller Basico and MRM Arquitectos. Blinds by Saxun Solar https://t.co/RXPLT0k43D"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109030451843367207", "url": "https://x.com/s8mb/status/2109030451843367207", "text": "@musevisits @WorksInProgMag Awesome - thank you, hope you enjoy it!", "created_at": "2026-10-10T21:16:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109026800340996380", "url": "https://x.com/s8mb/status/2109026800340996380", "text": "Dresden From the Right Bank of the Elbe Below and Above the Augustus Bridge, Bernardo Bellotto, 1747/48. https://t.co/uzCIfYBc8d", "created_at": "2026-10-10T21:02:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUTEr8kW4AAuyfF.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUTEr8zXwAAI-0o.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109023394960392605", "url": "https://x.com/s8mb/status/2109023394960392605", "text": "@edwinarbus @RobinRivaton @bswud Now that’s what I call luxury.", "created_at": "2026-10-10T20:48:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "edwinarbus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109363737526481072", "url": "https://x.com/s8mb/status/2109363737526481072", "text": "@TomRachman @julianlehr I think silliness in particular encourages self-mockery and teasing each other, and (in my experience) drunken silliness normally leads people to taking the piss out of their own and each other’s dearly held beliefs!", "created_at": "2026-10-11T19:21:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "TomRachman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109341597154541997", "url": "https://x.com/s8mb/status/2109341597154541997", "text": "@siziyman @dioscuri @julianlehr I’m fairly relaxed about recreational drug use, but drugs have very different effects to each other. The case for alcohol being good for society doesn’t remotely imply that coffee or tobacco are, let alone heroin or cannabis.", "created_at": "2026-10-11T17:53:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "siziyman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109332732371480861", "url": "https://x.com/s8mb/status/2109332732371480861", "text": "@JesusFerna7026 @jmhorp Brilliant review!", "created_at": "2026-10-11T17:18:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JesusFerna7026", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109725979899809804", "url": "https://x.com/s8mb/status/2109725979899809804", "text": "If you’re at a startup in SF and are interested in grabbing a copy, drop Tammy an email. Especially if you’re a Stripe user!", "created_at": "2026-10-12T19:20:45+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Coming soon (tomorrow!) — BUILT TO GROW, our field guide to creating excellent sales orgs, by the inimitable @she_travels. \n\nI have a bunch of these taking up way too much space in our storage rooms. Would love to make some house calls this week to SF startups who are building their sales teams. \n\nEmail me (in bio!). And let me know if you’re a @stripe user!"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109645210158551058", "url": "https://x.com/s8mb/status/2109645210158551058", "text": "Isolated as they are from the rest of the world, many civil servants (including even press officers) lack the feedback loops to understand why this is odd for a government official to do. \n\nThis is largely by choice - extreme interpretations of the terms of the civil service code make civil servants incredibly averse to engaging with outsiders, and when they do it is often through complex stage-managed encounters. Some senior leaders are much more relaxed about it, but that rarely cascades down through the organisations they lead. \n\nBut if you spend all lot of time doing mandatory DEI training, or in workshops with other people about DEI issues, and in a closed loop where you only get emails from other people pushing these ‘non-political political’ ideas in their signatures, it’s easy to lose track.", "created_at": "2026-10-12T13:59:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jo3hill", "rt_author_name": "Joe Hill", "likes": 91, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109616611460280783", "url": "https://x.com/s8mb/status/2109616611460280783", "text": "@thomasforth Very nice. I did this in Berlin last month, which might be the nicest city for cycling I've been in – on Sundays the streets are so quiet that they even turn off a lot of traffic lights. I was too scared of American drivers to try in DC though.", "created_at": "2026-10-12T12:06:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "thomasforth", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109607934309126148", "url": "https://x.com/s8mb/status/2109607934309126148", "text": "@wrathofgnon Yup! https://t.co/tuJkWgUtr2", "created_at": "2026-10-12T11:31:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "wrathofgnon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "Sam_Dumitriu", "text": "Do you think the (new) building on the left should look more like the neighbouring one on the right?\n\nI suspect most people do, but there's a widespread idea within historical preservation that any new/necessary additions to historic buildings/structures should be distinct and modern.\n\nThe idea dates back to the 60s where modernism was on the rise and was codified in something called 'The Venice Charter.'\n\n\"Article 9: New work should bear the mark of its own time. When restoration requires additional work, it should be distinguishable from the historic composition and carry a contemporary stamp.\n\nThis idea still influences planning today. Many people will assume that Brighton and Hove Council opted to go for the design on the left for reasons of cost/maintenance.\n\nBut, in fact, it was a deliberate decision.\n\nHere's a quote from the planning officer: \"A conscious effort had been made to make the design of the new lift different from the existing, allowing the older lift to retain prominence in the terrace.\"\n\nWhat do you prefer?"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109607846098735408", "url": "https://x.com/s8mb/status/2109607846098735408", "text": "Like all public officials, planners have a set of beliefs that shape their decisions. The doctrine that new buildings have to *look* like new buildings is a pretty important one of these!", "created_at": "2026-10-12T11:31:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 1, "media": [], "quoted": {"author": "Sam_Dumitriu", "text": "Do you think the (new) building on the left should look more like the neighbouring one on the right?\n\nI suspect most people do, but there's a widespread idea within historical preservation that any new/necessary additions to historic buildings/structures should be distinct and modern.\n\nThe idea dates back to the 60s where modernism was on the rise and was codified in something called 'The Venice Charter.'\n\n\"Article 9: New work should bear the mark of its own time. When restoration requires additional work, it should be distinguishable from the historic composition and carry a contemporary stamp.\n\nThis idea still influences planning today. Many people will assume that Brighton and Hove Council opted to go for the design on the left for reasons of cost/maintenance.\n\nBut, in fact, it was a deliberate decision.\n\nHere's a quote from the planning officer: \"A conscious effort had been made to make the design of the new lift different from the existing, allowing the older lift to retain prominence in the terrace.\"\n\nWhat do you prefer?"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109606961197281789", "url": "https://x.com/s8mb/status/2109606961197281789", "text": "It is true. \n\nFor sale to a good home https://t.co/gSeVk9vIVi", "created_at": "2026-10-12T11:27:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hcndashwood", "rt_author_name": "Henry Dashwood", "likes": 6, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUbTpG0WUAEX5Fa.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109606421033857494", "url": "https://x.com/s8mb/status/2109606421033857494", "text": "What if part of the \"function\" of a waterfront at a holiday resort is to look good? https://t.co/oZHCABPMhU", "created_at": "2026-10-12T11:25:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 168, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUbTnJoWAAAqMjR.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109605558592356808", "url": "https://x.com/s8mb/status/2109605558592356808", "text": "For sale: HENRY Dashwood's Land Rover Defender, 59,000 miles driven, mostly used on the family farm. (@hcndashwood) https://t.co/cSGSR09pYQ", "created_at": "2026-10-12T11:22:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUbMAXFXsAAYc_8.jpg"}], "quoted": {"author": "SebMilbank", "text": "HENRY wants to live in the pod, eat the bugs and ride the lime. He nd can all recite all 21 hadiths of al-ukht Friedman!", "created_at": "2026-10-12T20:23:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110056955851206990", "url": "https://x.com/s8mb/status/2110056955851206990", "text": "Get your copy and learn the joy of selling people things that they’re happy to have bought.", "created_at": "2026-10-13T17:15:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Out now! Built to Grow: A Handbook for High-Performance Sales Teams, by Stephanie Friedman: https://t.co/HcKQ3azLiR\n\nI love all of the books in our catalogue, but I particularly love the turpentine collection: High Growth Handbook, An Elegant Puzzle, Scaling People, and now, Built to Grow! \n\nBuilding a sales function—especially today—is more of an art than a science. Stephanie has more than 20 years of experience building 100+ person sales teams, and advising some of the fastest-growing companies in the world on how to do the same. \n\nI hope you love it as much as we do."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110056808954077305", "url": "https://x.com/s8mb/status/2110056808954077305", "text": "@tamarawinter @she_travels This is very likely the most personally useful book Stripe Press has ever done. It’s coming out at the perfect time for me!", "created_at": "2026-10-13T17:15:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110055958156128767", "url": "https://x.com/s8mb/status/2110055958156128767", "text": "Result. https://t.co/zCoRA6iQyt", "created_at": "2026-10-13T17:11:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhssDLWMAAOacC.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110035554763202616", "url": "https://x.com/s8mb/status/2110035554763202616", "text": "China has become the most important manufacturing economy in the world because it is a continent-sized Silicon Valley.\n\nhttps://t.co/QGdeeqmsEi\n\nEvery Chinese city govt acts as a VC firm trying to create clusters in its region, because it has both the means and incentive to do so.\n\nLocal govts generate their revenues, nearly all of which they keep, from selling leases on land and from stakes they have taken in local companies, which together allow them to capture economic spillovers.\n\nChinese officials have their entire careers graded and determined by how much growth they have been able to create in the areas they run. Career progression is determined according to a great tournament that pits official against official and gives promotions to whoever has grown their region the most. If they don’t reach a certain stage by a certain age they are blocked from promotion forever.\n\nThis is why so many economic clusters have centred on Chinese cities, for high- and low-tech products alike. Shaodong makes 70% of the entire world's cigarette lighters; Danyang makes half of the world's spectacle lenses; Zheng'an makes 1/7 of the world's guitars; Datang a third of its socks.\n\nWhereas many of the West’s most important city governments capture only a small amount of the spillovers from successful clusters, and thus have very little reason to foster them, in China, they get a huge amount of the upside and can re-invest it in further growth. This also gives them a great incentive to solve problems for companies, like when Shanghai's govt got Tesla's factory there built even faster than Elon himself had expected (and twice as fast as his Fremont, CA factory).\n\nBut this is not some exotic 'oriental' innovation – this is how America used to do things when it grew fastest, in the 1950s, 1960s, and early 1970s. Catching up with China on advanced manufacturing does not require a wise and strategic approach, let alone authoritarianism or the end of democracy. It may just mean fixing city government. \n\nThis is why I care so much about local  in Britain and America: if we give our own local governments the same incentives and means to grow, the crazily dysfunctional entities we have become used to may be transformed into corporation-like bodies that are ruthlessly focused on making their cities rich, safe and prosperous.\n\nRead more in Works in Progress https://t.co/QGdeeqmsEi", "created_at": "2026-10-13T15:50:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "bswud", "rt_author_name": "Ben Southwood", "likes": 189, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029319707976008", "url": "https://x.com/s8mb/status/2110029319707976008", "text": "“China is not the world’s largest command economy. It is a continent-sized Silicon Valley.”\n\nAwesome piece by @RobinRivaton on China’s local governments and industrial clusters: https://t.co/SgctOX03tJ https://t.co/wuiMmYn9Zn", "created_at": "2026-10-13T15:26:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kyleichan", "rt_author_name": "Kyle Chan", "likes": 629, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhBfjkWEAAD5UU.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109997663659692262", "url": "https://x.com/s8mb/status/2109997663659692262", "text": "Nearly everyone in the West focuses on China's Five Year Plans as the reasons for its manufacturing success, concluding that more central economic planning is needed. \n\nThis is the exactly WRONG lesson. The country's success comes because its cities all compete with each other intensely, as something akin to vertically integrated corporations that are completely obsessed with local economic growth.\n\nIts incredible manufacturing industry is based on local clusters that local govts nurture and invest in, and collect a lot of the returns from through property fees and taxes. These govts are *much* closer to local needs than Western local govts are, and can focus on speed of building and iteration above all, which are critical for manufacturing.\n\n*This* is why local government matters in Britain and America, where it is almost completely broken and dysfunctional. Where local spillovers matter, as in manufacturing, you need some kind of entity that can internalise the positive externalities of economic activity. China is proof that with the right incentives and tax powers, local governments can become machines for economic growth, intervening and clearing the way for development.", "created_at": "2026-10-13T13:20:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 147, "retweets": 18, "media": [], "quoted": {"author": "bswud", "text": "China has become the most important manufacturing economy in the world because it is a continent-sized Silicon Valley.\n\nhttps://t.co/QGdeeqmsEi\n\nEvery Chinese city govt acts as a VC firm trying to create clusters in its region, because it has both the means and incentive to do so.\n\nLocal govts generate their revenues, nearly all of which they keep, from selling leases on land and from stakes they have taken in local companies, which together allow them to capture economic spillovers.\n\nChinese officials have their entire careers graded and determined by how much growth they have been able to create in the areas they run. Career progression is determined according to a great tournament that pits official against official and gives promotions to whoever has grown their region the most. If they don’t reach a certain stage by a certain age they are blocked from promotion forever.\n\nThis is why so many economic clusters have centred on Chinese cities, for high- and low-tech products alike. Shaodong makes 70% of the entire world's cigarette lighters; Danyang makes half of the world's spectacle lenses; Zheng'an makes 1/7 of the world's guitars; Datang a third of its socks.\n\nWhereas many of the West’s most important city governments capture only a small amount of the spillovers from successful clusters, and thus have very little reason to foster them, in China, they get a huge amount of the upside and can re-invest it in further growth. This also gives them a great incentive to solve problems for companies, like when Shanghai's govt got Tesla's factory there built even faster than Elon himself had expected (and twice as fast as his Fremont, CA factory).\n\nBut this is not some exotic 'oriental' innovation – this is how America used to do things when it grew fastest, in the 1950s, 1960s, and early 1970s. Catching up with China on advanced manufacturing does not require a wise and strategic approach, let alone authoritarianism or the end of democracy. It may just mean fixing city government. \n\nThis is why I care so much about local  in Britain and America: if we give our own local governments the same incentives and means to grow, the crazily dysfunctional entities we have become used to may be transformed into corporation-like bodies that are ruthlessly focused on making their cities rich, safe and prosperous.\n\nRead more in Works in Progress https://t.co/QGdeeqmsEi"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109993909611028854", "url": "https://x.com/s8mb/status/2109993909611028854", "text": "@bswud The sheer speed of iteration and number of companies in Chinese manufacturing is completely mindboggling. https://t.co/w2bfT5yW0e", "created_at": "2026-10-13T13:05:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bswud", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUg0NCbXcAAWvT-.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109986077058478407", "url": "https://x.com/s8mb/status/2109986077058478407", "text": "@Boredofwheels @thetimes Yup! The best part of that legislation by far.", "created_at": "2026-10-13T12:34:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Boredofwheels", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109978162381643984", "url": "https://x.com/s8mb/status/2109978162381643984", "text": "It probably makes sense to hire a (very skilled) person for this role for the top people, but I'm curious what AI personal assistant support is like at the AI companies. In my experience it's still close to useless outside them, even though I like apps like Instinct and Grok Bot.", "created_at": "2026-10-13T12:02:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 3, "media": [], "quoted": {"author": "SebJohnsonUK", "text": "Anthropic is offering a 145k salary for a personal assistant in London. \n\nResponsibilities include:\n\n\"Scheduling and managing calendars for leader(s) and their organization\"\n\n\"Building and maintaining organizational systems for tracking and managing inbound requests\"\n\n\"Managing the leader's inbox and communications with precise attention to detail\"\n\n\"Handling travel logistics\"\n\nSomebody should really build some sort of tech tool that can handle this stuff autonomously."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109970667017777168", "url": "https://x.com/s8mb/status/2109970667017777168", "text": "How disappointing to find that @thetimes runs a digital subscription trap. If you try to unsubscribe you get a nonsensical error message, and both live chat and email tell you to phone them up. Very bad behaviour! https://t.co/NtfqUUHIaz", "created_at": "2026-10-13T11:33:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1322, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgeTrpWoAA53qb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUgegwNW8AAI0Vk.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109969523797348570", "url": "https://x.com/s8mb/status/2109969523797348570", "text": "@DuncanStott You'll only get to keep 55–60% of the gains though 🙁", "created_at": "2026-10-13T11:28:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DuncanStott", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109967646452265203", "url": "https://x.com/s8mb/status/2109967646452265203", "text": "@ryan_c414 No, the changes came into effect on the day of the Budget in 2024. https://t.co/g3mhfXhlMh", "created_at": "2026-10-13T11:21:02+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "r s visually gorgeous article on filming surfing. insane. https://t.co/CTUf7JLbcu", "created_at": "2026-10-13T06:41:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "gauravkapadia", "rt_author_name": "Gaurav Kapadia", "likes": 23, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109879468441432450", "url": "https://x.com/s8mb/status/2109879468441432450", "text": "@kosonocky @RobinRivaton @bswud Excellent, glad to hear. Thanks for reading!", "created_at": "2026-10-13T05:30:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "kosonocky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110082045519245315", "url": "https://x.com/s8mb/status/2110082045519245315", "text": "I’m very biased, but the new @WorksInProgMag is IMO a masterpiece in both design and content.\n\nhttps://t.co/0oNl1XSoOE", "created_at": "2026-10-13T18:55:37+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "likes": 340, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110387697239969940", "url": "https://x.com/s8mb/status/2110387697239969940", "text": "This is crazy. These anti-terror proscription laws are completely broken. The mere expression of support for a group cannot be criminalised like this. You should be allowed to say that you support ISIS, let alone Palestine Action!", "created_at": "2026-10-14T15:10:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 76, "retweets": 7, "media": [], "quoted": {"author": "MarkLTighe", "text": "Sally Rooney’s books will no longer be published in UK over her support for Palestine Action https://t.co/JDOLIst4fM"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110351200231256255", "url": "https://x.com/s8mb/status/2110351200231256255", "text": "This is a great, readable explanation of the economics of Robert Hall and Michael Woodford, this year's Nobel Prize winners, by @ernietedeschi. \n\nhttps://t.co/uaT2oMpxir", "created_at": "2026-10-14T12:45:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 60, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110324521194619213", "url": "https://x.com/s8mb/status/2110324521194619213", "text": "@geofflangdale I'm pretty relaxed about them just spending money on it, because I don't think the opportunity cost is likely to be very high. But the talent that can work on these things is quite scarce and does face a high opportunity cost.", "created_at": "2026-10-14T10:59:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "geofflangdale", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110322221814325561", "url": "https://x.com/s8mb/status/2110322221814325561", "text": "@FelixGraeber That's excellent to see. Thank you.", "created_at": "2026-10-14T10:50:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FelixGraeber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110320413549211671", "url": "https://x.com/s8mb/status/2110320413549211671", "text": "China's industrial policy is driven by hundreds of cities competing with each other to maximise their economic growth.\n\nPublic officials are promoted according to who has driven growth the most, and regional governments' revenues are based on land and property, allowing them to capture economic spillovers that governments in Western countries often cannot capture. \n\nThis gives local governments in China both the means and the incentive to drive growth, far more than in most of the Western world. As a result, Chinese local governments play activist roles in setting up and growing economic clusters in their areas, investing in nascent industries the way a venture capital fund might. \n\nChina is home to over 4 million different manufacturing enterprises, twenty times as many as the United States and five times as many per capita. The clusters these businesses form allow new entrants to improve their products through rapid iteration and low lead times. \n\nThis is the secret of China's industrial miracle, and this is what the Western world must emulate if it is to reindustrialise as well.\n\nhttps://t.co/4dt4O9TUB2", "created_at": "2026-10-14T10:42:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 68, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUlc0qlXwAA8XF-.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110317916235432401", "url": "https://x.com/s8mb/status/2110317916235432401", "text": "@FelixGraeber Thank you so much! Yes, we did a 'refresh' and picked new paper. I'm very happy with it and very happy that our readers seem to like it too.", "created_at": "2026-10-14T10:32:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FelixGraeber", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110312537828872295", "url": "https://x.com/s8mb/status/2110312537828872295", "text": "Quantum computing is an example of one of the problems with 'winner-picking' industrial policy: sometimes you bet on the wrong thing! Lots of resources and talent have been put into it in Britain, and we are apparently a world leader in it, so on its own terms it is an industrial policy success. But it is seeming to just not be very important as a technology and maybe it would have been better to just let the talent and resources go to other things, such as AI.", "created_at": "2026-10-14T10:11:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 191, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110273255517163618", "url": "https://x.com/s8mb/status/2110273255517163618", "text": "Good morning https://t.co/YfjLn1FHyT", "created_at": "2026-10-14T07:35:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 146, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUkyVvSWsAE2JEs.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110254063036293159", "url": "https://x.com/s8mb/status/2110254063036293159", "text": "On China’s growth model:\n https://t.co/eF6Lhcr9IJ\n\nIn ‘Apple in China’ I quote the scholar Chenggang Xu calling this model “a regionally decentralized authoritarian regime”, or RDA — an enormous meritocracy for officials from provincial governors down to the local cadres. https://t.co/N5VZ1UbrRP", "created_at": "2026-10-14T06:19:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PatrickMcGee_", "rt_author_name": "Patrick McGee", "likes": 18, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhsehTa4AAP0EB.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110140729519682004", "url": "https://x.com/s8mb/status/2110140729519682004", "text": "Can’t believe it’s happening today: my book on how to build a startup sales team, \"Built to Grow,\" is officially available from @stripepress!\n\nI spent twenty years building and leading enterprise sales teams and advising founders on how to do it. This book is written as a field guide for founders, investors and executives who are building their startup sales teams and are looking for help.\n\nSo many people have helped along the way, but a special thanks goes to @patrickc for the early encouragement to keep writing—this book wouldn’t exist without you—as well as @danielgross and @levie for invaluable input along the way.\n\nAnd a big thank you to the whole team at Stripe Press who helped make this happen — especially the absolutely gorgeous cover!", "created_at": "2026-10-13T22:48:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "she_travels", "rt_author_name": "Stephanie (Schatz) Friedman", "likes": 156, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhgHj4a4AEhOCZ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgIseaoAEJgLl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgJlbbAAA7yBK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgKljbgAAtKc_.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110451234683367749", "url": "https://x.com/s8mb/status/2110451234683367749", "text": "@sakibsahmed @WorksInProgMag Thank you!!", "created_at": "2026-10-14T19:22:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "sakibsahmed", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110451178412613838", "url": "https://x.com/s8mb/status/2110451178412613838", "text": "I'm so glad people are enjoying the new issue. We want WIP to be the most beautiful and interesting magazine in the world. Much more to come! \n\nThere's still some time to get your copy: https://t.co/sCOVnY0Opt", "created_at": "2026-10-14T19:22:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "sakibsahmed", "text": "Latest issue of @WorksInProgMag is stunning, I felt goosebumps just flicking through. The deep care and passion that went into this is evident.\n\nAs Anna Wintour has said - when a group of passionate people put something out into the world, that passion finds an audience. https://t.co/HlO2Y2qu7v"}, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110422238000296146", "url": "https://x.com/s8mb/status/2110422238000296146", "text": "@coffeemadman @thetimes This worked!", "created_at": "2026-10-14T17:27:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "coffeemadman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110745785843224600", "url": "https://x.com/s8mb/status/2110745785843224600", "text": "One of my favourite writers, @CharlesCMann, joins Works in Progress as a regular contributor. I am thrilled. \n\n1491 and 1493, two of Charles's books, are among the best works of history I have ever read. 1491, which is about the Americas before Columbus, was one of those books that made me wonder if it could possibly be true, it was so surprising and shocking about that lost world. I read while I was travelling through Guatemala's countryside, and it made me understand the tragedy of the collapse and destruction of the pre-Columbian civilizations much better.\n\n1493 is a rather different book, being about how the Americas changed the rest of the world. It is often tragic too, given the subject matter, but also completely captivating on how everyday things like rubber and potatoes changed the world.\n\nWhat I think Charles's writing consistently has is a \"fascination with the ordinary\" – the conviction that even mundane-seeming everyday things often have a fascinating backstory. His articles for Works in Progress will continue this fascination. I strongly recommend his debut piece, out today, on the invention and reinvention of porcelain, written in the same spirit that has made his other writing so brilliant and eye-opening.", "created_at": "2026-10-15T14:53:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 66, "retweets": 4, "media": [], "quoted": {"author": "RuxandraTeslo", "text": "What do a cutting-edge bone implant and Mrs Potts from Beauty and the Beast have in common? Both are made from porcelain, a material humans first made over 3,000 years ago and are still reinventing today.\n\nhttps://t.co/gv0ZeRL8Pa\n\nWe focus on advances in computing, but the world around us has been transformed just as much by materials science. And within this already underrated field sits an even more underrated material. Plenty of people have heard of semiconductors, but almost no one thinks about porcelain. For @WorksInProgressMag, @CharlesCMann wrote about its remarkable journey:\n\n- Porcelain is basically an ancient nanotechnology. 3000 years ago, Chinese potters found that firing a white clay called kaolin to around 1,200°C transformed it completely: its crystals get rebuilt, producing a material that is hard, dense, and sometimes translucent. Nobody knew why it worked at the time: they discovered it by trial and error.\n\n- Europeans prized porcelain immensely – but had no clue had to make it. When porcelain arrived in Europe in the 12th century, it was so superior to European ceramics that aristocrats called it \"white gold.\" But despite attempting to reverse-engineer it, Europeans failed to create porcelain for centuries.\n\n- Fake it until you make porcelain. Böttger, an alchemist imprisoned in the early 1700s for falsely claiming to make gold, was set to work with a legitimate scientist on making porcelain. Remarkably, the scientist succeeded where others had failed for centuries, creating the first European porcelain cup. But he did not live to profit: ever the liar, Böttger claimed his discovery for himself.\n\n- Less slippery when wet. Innovation in materials science picked up again in the 20th century and continues to this day, producing Porcelain 3.0. Today, porcelain can be found across a surprising number of household objects: from kitchen countertops to tiles that become less slippery when wet, which also makes them safer.\n\n- The most futuristic use of all: researchers can now 3D-print porous porcelain scaffolds to repair damaged bone. The advantage is that blood vessels and bone cells grow into the scaffold’s tiny openings, while the scaffold slowly dissolves as new bone replaces it, allowing a bone-like natural structure to persist.\n\nPorcelain has already gone from fragile imperial teacups to artificial joints and scaffolds that help bone regrow. But its 3000 year long story is far from over: expect this underrated material to play new roles in everything from medicine to architecture in the coming decades!"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110725134059270549", "url": "https://x.com/s8mb/status/2110725134059270549", "text": "@AlfredRotors Govt spending actually fell slightly (-0.1pp) between H1 2025 and 2026.", "created_at": "2026-10-15T13:31:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "AlfredRotors", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110708927977467910", "url": "https://x.com/s8mb/status/2110708927977467910", "text": "@ben_golub To some extent, yeah! Cities can have corporation-like features where there are large local spillovers. https://t.co/7ym5GrzEtE", "created_at": "2026-10-15T12:26:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ben_golub", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "s8mb", "text": "I think Andy Burnham should champion the idea of 'municipal socialism': having utilities owned by local governments, primarily combined authorities, rather than the national monopoly that nationalisation usually entails. This may already be what he is planning, but he hasn't really said so yet. \n\nNationalised monopoly fails for many reasons:\n\n- It creates entities that are too big to fail, so they can waste large amounts of money while being subsidised from public funds.\n\n- It gives people no comparison point to see if a certain industry is being well-run, so bad outcomes end up being treated like bad weather.\n\n- It prevents the public companies themselves from learning from other companies, because they only have other countries to learn from where circumstances might be very different.\n\n- It creates very weak political feedback mechanisms, because your vote on whether the trains are being run well is bundled with your vote on, eg, tax policy and foreign policy.\n\n- It engenders short-termism, because voters are less forward looking than private investors, so there is more scope to take long-term degradation of service for short-term benefits. (This is happening with TfL's fare freeze right now.)\n\nMunicipal ownership does not solve all these problems, but it can maintain more accountability and some of the elements of competition that national monopoly does not have.\n\nThere is more room for experimentation and learning because different municipalities try different policies, and can copy the successes from each other. The Oyster Card and contactless card payments were a good example of this by TfL. Manchester's bus privatisation scheme was scrapped in part by looking at the success of London's approach to buses, where delivery is outsourced to multiple private companies but services are designed by a single authority and provided under one brand.\n\nThe 'too big to fail' problem is smaller, because municipal governments can face a harder budget constraint than national government, though bailouts undermine this. Those that want to subsidise services have to draw on a narrower tax base. In fact, well-run services can raise revenues for local governments, as many locally-owned tramways did in the 19th and early 20th Centuries. Local authorities are more accountable for failures and get more credit for successes than national governments would be.\n\nInternationally, successful examples of public ownership of utilities are often owned by municipalities. This is true in much of the United States, where water is mostly municipally owned rather than private, and in France, where most public services are owned by local governments, who then offer contracts to companies to handle the actual delivery. The Bee network and London buses operate on the same basis.\n\nHistorically in Britain, trams, electricity and gas were all mostly run by small local companies and local governments before the 1940s–70s. Municipally-owned gas networks were highly profitable for Birmingham under Joseph Chamberlain. There were still nearly 200 different water boards across England by 1970!\n\nWe use 'nationalisation' as a byword for 'public ownership', but there is little reason for most of these things to be nationalised monopolies. Much of the drive towards nationalised monopoly in the 20th Century was inspired by a mistaken belief that economies of scale would drive the biggest improvements in productivity, inspired by the apparent success of the USSR and large conglomerates in Germany and the USA. It is clear today that experimentation via trial and error is extremely valuable, and losing it is one of the big costs of monopoly.\n\n'Municipalisation' would, for example, mean overhauling the Great British Railways policy which by default puts commuter lines in Surrey into the same administration that runs the West Midlands Cross-City Line, the East Coast Main Line, and commuter networks in Manchester, Leeds and Liverpool. There are some provisions for lines going into municipal control, but the default is to stop the next Mayor of Greater Manchester from running the region's commuter trains and London from absorbing more lines into the Overground.\n\nPublic ownership has many flaws, but some of them are avoidable by looking beyond the 1940s and 1970s for how to do it. 'Municipal socialism' allows for much greater learning and feedback loops, and would hugely strengthen devolution by making local government responsible for things that directly matter to their electorates rather than having them run by a single inert national monopoly."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110704640514040156", "url": "https://x.com/s8mb/status/2110704640514040156", "text": "@Paul_SLG @WorksInProgMag Excellent, glad to hear it!", "created_at": "2026-10-15T12:09:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Paul_SLG", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110704574738698694", "url": "https://x.com/s8mb/status/2110704574738698694", "text": "Mayonnaise and hot sauce are complements, not substitutes.", "created_at": "2026-10-15T12:09:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 2, "media": [], "quoted": {"author": "SenWarren", "text": "Hellmann's mayo\nMcCormick spices\nCholula hot sauce\nFrank's RedHot\n\nWhat do these products have in common? One company could soon control them all.\n\nI have concerns that McCormick and Unilever's $45 billion merger could increase YOUR grocery prices."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110697843468222750", "url": "https://x.com/s8mb/status/2110697843468222750", "text": "Awesome! Even though we're at a low level, I think growth begets growth. It's much easier to do pro-growth reforms when people feel things are getting better already.", "created_at": "2026-10-15T11:42:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 131, "retweets": 1, "media": [], "quoted": {"author": "faisalislam", "text": "Annualised UK GDP growth so far in 2026, with two-thirds of the year gone, is 2.7-2.8%\n\nIs expected to slow in q4, but that was also expected in q3. And q2.\n\nCity economists (eg Pantheon) say “we have to shift from describing UK growth as resilient to calling it strong”."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110697298057674763", "url": "https://x.com/s8mb/status/2110697298057674763", "text": "@Wrynose1 Glad to hear. Yes, frustratingly, the lithographic print for the full batch caused a few issues that the digital print for the proof didn't create. Should be resolved now though.", "created_at": "2026-10-15T11:40:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Wrynose1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110674821327557095", "url": "https://x.com/s8mb/status/2110674821327557095", "text": "In the future, every Works in Progress article will come with a video game.", "created_at": "2026-10-15T10:11:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 0, "media": [], "quoted": {"author": "tommy5dollar", "text": "@bswud I made a game of this. Pitch a startup and three Chinese cities bid for it like VC firms, with land, state fund equity and free rent!\nhttps://t.co/b9WXZd0bDp"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110485222684831931", "url": "https://x.com/s8mb/status/2110485222684831931", "text": "Nearly everyone in the West focuses on China's Five Year Plans as the reasons for its manufacturing success, concluding that more central economic planning is needed. \n\nThis is the exactly WRONG lesson. The country's success comes because its cities all compete with each other intensely, as something akin to vertically integrated corporations that are completely obsessed with local economic growth.\n\nIts incredible manufacturing industry is based on local clusters that local govts nurture and invest in, and collect a lot of the returns from through property fees and taxes. These govts are *much* closer to local needs than Western local govts are, and can focus on speed of building and iteration above all, which are critical for manufacturing.\n\n*This* is why local government matters in Britain and America, where it is almost completely broken and dysfunctional. Where local spillovers matter, as in manufacturing, you need some kind of entity that can internalise the positive externalities of economic activity. China is proof that with the right incentives and tax powers, local governments can become machines for economic growth, intervening and clearing the way for development.", "created_at": "2026-10-14T21:37:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "s8mb", "rt_author_name": "Sam Bowman", "likes": 482, "retweets": 67, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110484230811619454", "url": "https://x.com/s8mb/status/2110484230811619454", "text": "If your company deserves to be taken as seriously as the rest of @WorksInProgMag is, you should DM me.", "created_at": "2026-10-14T21:33:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EvanRiggss", "rt_author_name": "Evan Riggs", "likes": 22, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110483771950870884", "url": "https://x.com/s8mb/status/2110483771950870884", "text": "@StringhamSpirit Oh no! I’ve DM’d you, will sort ASAP.", "created_at": "2026-10-14T21:31:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "StringhamSpirit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110483615419335010", "url": "https://x.com/s8mb/status/2110483615419335010", "text": "@KarlBrophy Thank you very much. I hope you like it.", "created_at": "2026-10-14T21:31:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "KarlBrophy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110477957500117249", "url": "https://x.com/s8mb/status/2110477957500117249", "text":
