es/1941687232538013696/jN33mhMu_normal.jpg", "rt_id": "2123566167260369050", "likes": 415, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123551637856022568", "url": "https://x.com/deanwball/status/2123551637856022568", "text": "@DKThomp DC: You are doing weird financial engineering again.\nNYC: We are.\nDC: This is shades of 2008 all over again.\nNYC: Are you about to say CDO squared.\nDC: This is like a CDO squared.\nNYC: Have you considered that some of us know more about this topic than a single page of one book.", "created_at": "2026-11-19T22:58:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "patio11", "rt_author_name": "Patrick McKenzie", "rt_avatar": "https://pbs.twimg.com/profile_images/1346314816827232256/zCQCJW6N_normal.jpg", "rt_id": "2123514575278801166", "likes": 430, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123814134869524509", "url": "https://x.com/deanwball/status/2123814134869524509", "text": "The Riemann hypothesis has fallen. What's the contingency plan if factorization is next (thus undermining public-key cryptography)? Where is this being discussed?\n\nAlso: people made encryption schemes that people couldn't break; who is using AI to invent better cryptography?", "created_at": "2026-11-20T16:22:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "snewmanpv", "rt_author_name": "Steve Newman", "rt_avatar": "https://pbs.twimg.com/profile_images/1868818735995437056/t8bsXPGv_normal.jpg", "rt_id": "2123806359124922372", "likes": 1098, "retweets": 103, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123809890028376517", "url": "https://x.com/deanwball/status/2123809890028376517", "text": "In the last six days: Starship catch, gta vi, a likely riemann proof, oh also a trillion-dollar ipo", "created_at": "2026-11-20T16:05:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 399, "retweets": 21, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123903099026972867", "url": "https://x.com/deanwball/status/2123903099026972867", "text": "@tenobrus @hopes_revenge @METR_Evals Congratulations! Huge get for them", "created_at": "2026-11-20T22:15:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tenobrus", "reply_to_id": "2123893127119593758", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "parent": {"id": "2123893127119593758", "author_handle": "tenobrus", "author_name": "Tenobrus", "text": "as some of u may have suspected, i have recently joined @METR_Evals  :)\n\nthis is one of the first things i worked on there, along w the rest of the capabilities team, very excited it's finally out. understanding what the hell is going on with models and especially where their remaining gaps are is incredibly critical for informing our decision making as a species.\n\nthere's a shitload of stuff in here, really excited for people to wade into the appendices, and i've even made sure to make all the backing data behind charts easy to download so ppl don't have to do pixel peeping to claude up their own charts. \n\nsome random (personal) takeaways:\n- it would be really sick if time horizons continued to work as an easily interpretable measure of capability... but unfortunately i think that's just no longer true. there's just too much variance in the spikes.\n- as much as i'd love for IRT methods to result in *intuitive* understanding they're just kinda structurally very uninterpretable, but remain basically our best way to get ~reasonably robust aggregate info\n- swarms are complicated! model behavior in swarms is super sensitive to all kinds of factors, inter-run variance is high, \"swarm cultures\" can form and significantly affect performance. for some things, clear strong uplift! for others, swarms are a downlift. love it when u get results that are basically \"haha good luck making a trend outta this\"\n- getting humans to outperform models is really rough now. really extremely rough. even with some model assistance, for basically everything verifiable we're pretty much at the point where only ~world class experts still beat models, and it's hard af to get world class experts to spend two straight months working on a METR task\n- it's pretty crazy watching models advance past what you thought was potentially possible on a task, and then go further, and then further, until you're just no longer sure where the upper limit actually is\n\nsomewhat more personally, on the Tenobrus account. historically i feel like i've actually done a lot of good for safety by being a \"brawler\", wading into fights, saying things i thought were true regardless of consequences, saying shit that i just kinda thought was funny at the time... for a long long time, my account has reflected on no one but me.\n\nbut i don't think i can really remain in that place while at METR. it would be disingenuous to remain anon and speak without disclosing my affiliations while working for the transparency organization. it's 2026, it's crunch time, it's time to step up and try to provide the kind of independent and carefully truthful institutions the world needs rn. so my style here is gonna change. that's okay, it's already been changing for a long time! and METR is worth it, i think it's one of the single most impactful places in the world to be right now, and i'm not going to fuck up that responsibility.\n\nlet's keep figuring this shit out :)", "links": {}, "media": [], "url": "https://x.com/tenobrus/status/2123893127119593758", "created_at": "Fri Nov 20 21:35:56 +0000 2026"}, "enriched": 3}, {"id": "2124026618603864272", "url": "https://x.com/deanwball/status/2124026618603864272", "text": "If you presented this graph to me in 2023 as one of several options for how the future would unfold, I feel pretty confident that I would've said it failed to account for how defenders would respond and get sped up by AI, despite my having relatively short timelines to AGI. https://t.co/4Su9jbwAHt", "created_at": "2026-11-21T06:26:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "ChrisPainterYup", "rt_author_name": "Chris Painter", "rt_avatar": "https://pbs.twimg.com/profile_images/2094568529253306368/kJuKduVE_normal.jpg", "rt_id": "2123988028737888621", "likes": 91, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnqm5CawAAZj_l.jpg"}], "links": {"https://t.co/4Su9jbwAHt": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123979509653512424", "url": "https://x.com/deanwball/status/2123979509653512424", "text": "This is massive. A story I've been following for years. He thought he had more time but didn't. Alessandro Masullo announces a separate, purely human proof of the Riemann hypothesis. https://t.co/XHMLOFNq8y", "created_at": "2026-11-21T03:19:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "KSHartnett", "rt_author_name": "Kevin Hartnett", "rt_avatar": "https://pbs.twimg.com/profile_images/1578477492821757954/PvVZPyP7_normal.jpg", "rt_id": "2123847664064241799", "likes": 10388, "retweets": 933, "media": [], "links": {"https://t.co/XHMLOFNq8y": "https://math216.wordpress.com/2026/11/20/hurried-announcement-alessandro-masullo-grh/"}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123971788464087172", "url": "https://x.com/deanwball/status/2123971788464087172", "text": "@ProNaif @SabineLark it was (a) a valid retort that (b) merited a good reply and (c) caught my attention when I had a free moment. If the responder is a bot it’s a good bot", "created_at": "2026-11-21T02:48:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ProNaif", "reply_to_id": "2123945078129348930", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123945078129348930", "author_handle": "ProNaif", "author_name": "Conrad the Riemann Slayer", "text": "@SabineLark @deanwball You have one follower and the head of strategic futures at OpenAI is engaging with you.", "links": {}, "media": [], "url": "https://x.com/ProNaif/status/2123945078129348930", "created_at": "Sat Nov 21 01:02:22 +0000 2026"}, "enriched": 3}, {"id": "2123963044858581063", "url": "https://x.com/deanwball/status/2123963044858581063", "text": "On Riemann, and Increasingly Subtle Goodharting\n\nstill processing the riemann hypothesis result\ndespite the last few months i still feel pretty shocked for some reason\n\napart from the non-math implications, I'm thinking about Terry Tao's point about the AIs goodharting open problems\n\nideally the solution to an open problem opens up a new world to mathematics\n\nand that's what often happens when humans solve them\n\nbut of course there could be multiple ways to solve a problem\n\nI am curious about whether claude discovered a bunch of new theory in order to make this work, or whether RH was \"within the convex hull\" of existing ideas and humans were just not competent enough to make it work\n\nan analogy is the story of Newton's Principia, which (to vastly oversimplify) solved the problem of \"what is the shape of the orbit of a planet under an inverse-square force?\"\n\nNewton wrote the Principia using geometric reasoning for the proofs, despite having already invented his \"fluxion\" based version of calculus\n\nIt turned out that solving problems like the inverse-square law is technically within the \"convex hull\" of Euclidean geometry (including Euxodus' theory of proportion and Archimedes' method of exhaustion) - you just need to be Newton to do it that way\n\nNewton was just so good at geometric reasoning that he could do in a complicated elementary geometric way the stuff we find much easier with modern algebraic calculus\n\nImagine if you had [internal Claude model] in the 1600s and asked it to solve the inverse-square problem (using your current understanding of math, which included only classical geometry)\n\nIt would have succeeded (geometrically), and you would have declared victory\n\nbut doing that would have impeded the development of calculus, which is far more general and works in cases that don't have closed form geometric solutions, and doesn't take genius to apply\n\nin fact something vaguely similar did happen:\nalong with Newton's infinite series and geometric limit reasoning, Leibniz had also invented a third, more symbolic form of calculus.\ncontinental European mathematicians rewrote Newton's geometric results into Leibniz \"dy/dx\" notation and progressed much further, because the algebraic methods generalized better.\nThe Brits, out of loyalty to Newton, stayed with geometry (and infinite series) and fell behind for a century, until they too adopted Leibniz notation\n\nso it's unclear to me whether knocking down open problems with Claude-shaped brute force is the best way to progress math. maybe it is! maybe we run out off convex hull and have to invent better problems\nbut attention is a finite resource and it will only get scarcer - so maybe \"open problems\" as a call to arms may no longer exist\n\nRH may be the last (or second last) time the solving of a math problem is a major news story", "created_at": "2026-11-21T02:13:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "julianboolean_", "rt_author_name": "Julian", "rt_avatar": "https://pbs.twimg.com/profile_images/1837929288563044352/zGdsHru6_normal.jpg", "rt_id": "2123834382733525307", "likes": 448, "retweets": 38, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123952046886064479", "url": "https://x.com/deanwball/status/2123952046886064479", "text": "@OliviaHelenS exactly. things like the Shakespeare tragedies, the Beethoven quartets, and of course the rockstar 3d open worlds", "created_at": "2026-11-21T01:30:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OliviaHelenS", "reply_to_id": "2123951111623053614", "avatar": "ht 11-21T00:51:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "xdofai", "rt_author_name": "XDOF", "rt_avatar": "https://pbs.twimg.com/profile_images/2056842834226053120/EJD779yz_normal.png", "rt_id": "2123822009696342190", "likes": 579, "retweets": 69, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlRXKAaAAU9H4R.jpg"}], "links": {"https://t.co/gelwZPPNWu": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123941410181378182", "url": "https://x.com/deanwball/status/2123941410181378182", "text": "@SabineLark not a criticism by the way, at least not one specific to claude or anthropic. our models have made proofs that are the exact same in this regard.", "created_at": "2026-11-21T00:47:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "reply_to_id": "2123941161438159219", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123941161438159219", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "@SabineLark The guy who prompted Claude to do the work describes the proof as 250,000 pages of slop and has declined to publish it in part because he does not understand it. No human has anything approximating a solid conceptual grasp of this proof as of yet", "links": {}, "media": [], "url": "https://x.com/deanwball/status/2123941161438159219", "created_at": "Sat Nov 21 00:46:48 +0000 2026"}, "enriched": 3}, {"id": "2123941161438159219", "url": "https://x.com/deanwball/status/2123941161438159219", "text": "@SabineLark The guy who prompted Claude to do the work describes the proof as 250,000 pages of slop and has declined to publish it in part because he does not understand it. No human has anything approximating a solid conceptual grasp of this proof as of yet", "created_at": "2026-11-21T00:46:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "SabineLark", "reply_to_id": "2123939379152572925", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123939379152572925", "author_handle": "SabineLark", "author_name": "Sabine Lark", "text": "@deanwball Resting precariously? It's 17 million lines of verifiable lean. That seems as solid as it gets.", "links": {}, "media": [], "url": "https://x.com/SabineLark/status/2123939379152572925", "created_at": "Sat Nov 21 00:39:43 +0000 2026"}, "enriched": 3}, {"id": "2123932478679474286", "url": "https://x.com/deanwball/status/2123932478679474286", "text": "i discovered the riemann hypothesis and the grand theft auto series at around the same time in my life. it is hard to describe the emotion of seeing the achievements this week juxtaposed. one built piece by piece mostly by people, the other resting precariously on the next rung of the abstraction ladder. one among the last of its kind, the other among the first. one the product of a process that has become thoroughly bureaucratized, with seemingly cursed economics, the other the result of a production process that is radically un-institutionalized, almost shockingly cheap. \n\nmonumental accomplishments both.", "created_at": "2026-11-21T00:12:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 286, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123929338634760261", "url": "https://x.com/deanwball/status/2123929338634760261", "text": "Distillation can reproduce powerful AI capabilities without the safeguards built around them.\n\nWe’re sharing new research on our work to combat distillation of our models, how these capabilities transfer, and how we detect and disrupt coordinated attempts.\n\nThese findings are helping us sharpen our defenses and support safeguards across the industry.\n\nhttps://t.co/FGQ0PHllIO", "created_at": "2026-11-20T23:59:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2123862344422088794", "likes": 3874, "retweets": 303, "media": [], "links": {"https://t.co/FGQ0PHllIO": "https://openai.com/index/combatting-adversarial-distillation/"}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123927853029056741", "url": "https://x.com/deanwball/status/2123927853029056741", "text": "I first discovered gta iii at a birthday party when I was 11 or so and lobbied my father for it for a year. I do understand the fun of the fully unconstrained version of gta gameplay, but I’m also open to the idea that the role of gta in the world has changed and that it’s therefore time to evolve the game", "created_at": "2026-11-20T23:53:55+00:00", "author_handle": "deanwball", "author_name" ttps://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "1898395045226500486", "likes": 6206, "retweets": 513, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124557213817561261", "url": "https://x.com/deanwball/status/2124557213817561261", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89", "created_at": "2026-11-22T17:34:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "merettm", "rt_author_name": "Jakub Pachocki", "rt_avatar": "https://pbs.twimg.com/profile_images/1032407242727809025/AJpM67Ve_normal.jpg", "rt_id": "2124549218995949967", "likes": 3398, "retweets": 366, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXvptOTXIAAtrY0.jpg"}], "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2125284964723835083", "url": "https://x.com/deanwball/status/2125284964723835083", "text": "I recommend the children’s books of Virginia Lee Burton, whose World War II-era stories are often also meditations on rapid technological and historical change. Her most famous, “The Little House,” is not pictured here but worth it too. https://t.co/JXMhpZp89e", "created_at": "2026-11-24T17:46:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6HaUHWkAARFCq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX6HaT8XQAAHMkN.jpg"}], "links": {"https://t.co/JXMhpZp89e": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125256059849711923", "url": "https://x.com/deanwball/status/2125256059849711923", "text": "The research field is a machine for uncovering knowledge. In the past, such machines required a set of fairly expensive and sometimes hard to acquire components: journals, researchers, conferences, parochial norms, and gradual “taste” curation.\n\nBy nature, this cognitive capex limited the set of viable fields. The knowledge domain needed sufficient value to attract funding and patronage. Individuals needed to find the areas worthy enough to contribute their time and energy. Institutions needed to offer their prestige and space for the field to congeal. You’d constitute a research field only if “worth it” across a wide range of metrics.\n\nBut what happens when the costs of uncovering knowledge drop precipitously? The impressiveness of the Riemann result blinds us to the fact that there are now many many more areas of exploration where machine intelligence can be incrementally advancing knowledge in a fundamentally “self-driving” way.\n\nThis unlocks an infinite horizon of “microfields”: organized areas of study that are now viable in a vast space of domains for which a formal research field would previously have been a ludicrous proposition. These might be enabled by small groups of researchers with niche interests, or progress with no humans at all: just people donating compute to incubate self-propagating fields and literatures.", "created_at": "2026-11-24T15:51:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "timhwang", "rt_author_name": "Tim Hwang", "rt_avatar": "https://pbs.twimg.com/profile_images/2067787805036511233/K9FmDGmQ_normal.jpg", "rt_id": "2125250607258759648", "likes": 36, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125206725875896429", "url": "https://x.com/deanwball/status/2125206725875896429", "text": "GPT-6.2 Astra sits nearly 5x above the past two years’ exponential trend on robot-control benchmarks.\n\nBenchmarks are saturating ~10x faster than over the prior year. If the pace since September holds, top policies will saturate nearly every task we track by the end of 2027. https://t.co/CxvZvtPuQb", "created_at": "2026-11-24T12:35:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "withplayground", "rt_author_name": "Playground", "rt_avatar": "https://pbs.twimg.com/profile_images/2113337277401149440/z5OsGue6_normal.jpg", "rt_id": "2125085282139508903", "likes": 519, "retweets": 56, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX3P3cuWMAAnTA8.jpg"}], "links": {"https://t.co/CxvZvtPuQb": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125336956838039860", "url": "https://x.com/deanwball/status/2125336956838039860", "text": "We’re sharing a new preprint showing wet lab validation of intrinsic protein design capabilities of the GPT-6 family of models. \n\nOur models can design new protein shapes and sequences using reasoning and code, without calling specialized biology models to generate them.\n\nhttps://t.co/cFfB0QHXub", "created_at": "2026-11-24T21:13:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2125334383490105601", "likes": 532, "retweets": 65, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125331261908717568/img/jrWnfbvTT7Sv4iSN.jpg"}], "links": {"https://t.co/cFfB0QHXub": "https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/", "https://t.co/ov2t24sUCh": ""}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125631491791319326", "url": "https://x.com/deanwball/status/2125631491791319326", "text": "Travel writing is in practice some of the best sociology since the naivete of the foreigner grants the permission to make sweeping generalizations and claims that might otherwise seem too poorly-justified to merit publication. “My people have poor manners” is a tough claim to credibly land (Who are you? Exactly which life experiences are you drawing on? And what is your agenda in pushing this line of argument?), whereas “on my travels in Scotland, I noticed that the people had poor manners” seems perfectly reasonable, and indeed thought-provoking. Random samples from a distribution help you understand the mean, and the aleatory nature of travel encounters lends credence to the whole assessment.\n\nAlexis de Tocqueville was just 25 when he traveled across the US and 29 when his observations were published. So, Democracy in America is a giant Substack from a young backpacker, written on his peregrinations as he consumed Montesquieu, Pascal, and Rousseau. He was clearly inspired by Montesquieu’s The Spirit of the Laws, which made the case that countries’ governance, and their laws, are necessarily functions of their cultures and manners.\n\nBuilding on this, Democracy in America is in many ways a “deep roots” work. Tocqueville is emphatic (at times comically so) that it is America's culture that explains its success, and that its culture in turn stems from the country’s initial conditions. “I think I can see the whole destiny of America contained in the first Puritan who landed on those shores.” He thinks it's important that New England was settled by “a greater mass of intelligence than is to be found in any European nation of our own time” who brought the “best elements of order and morality”. He points out that Mexico doesn’t work nearly as well, despite copying the American constitution and laws, and notes disapprovingly that Virginia was founded by gold-seeking people “without character” whose “turbulent spirit [...] endangered the infant colony.” At the end of Volume I, he concludes, practically table-thumping: “If in the course of this work I have not succeeded in making the reader feel the importance that I attribute to the practical experience of the Americans, to their habits, to their opinions, in a word, to their moeurs, in maintaining their laws, I have failed in the principal object that I proposed to myself in writing it.”\n\nWe could look at Democracy in America as an early work of development economics: he is attempting to systematically figure out why it is that America works. (And not just out of casual interest: he was a member of an aristocratic family that was entangled with recent French political upheaval.) By placing primacy on culture, Tocqueville’s explanation deviates from the institutional and structural explanations often favored by today’s economists. Daron Acemoglu, to choose one prominent present-day example, firmly rejects the “Culture Hypothesis” in Why Nations Fail. In explaining Virginia, he instead points to structural incentives. Poor Economics, from Esther Duflo and Abhijit Banerjee, contains a similar rejection of cultural explanations. Comparable examples from other leading economists abound. An aversion to cultural explanations is of course understandable for all sorts of reasons: cultures are opaque, protean, and resistant to quantitative characterization. Cultures are themselves shaped by other factors, such that it’s hard to attribute definitive causality, and it’s uncomfortable to adopt anything that feels like a normative orientation. Nonetheless, can we explain why New England differs from Mexico without starting with the inner disposition, habits, and worldviews of the people? Tocqueville thinks not.\n\nFor all culture’s importance, it would be wrong to suggest that Tocqueville believes that culture is the only factor that matters. He dwells extensively on how America’s institutions are important, and how the microstructure of town life shapes the country’s federal civics. It is also true that development economics has taken a more strongly cultural turn in recent times, most of all in Joel Mokyr’s 2025 Nobel Prize. Mokyr’s work feels downright Tocquevillian at times: contra the intimidatingly quantitative econometrics that dominates today, Mokyr engages in an extended and earnestly curious qualitative synthesis of relevant patterns (in his case, in service of trying to figure out why the Industrial Revolution started when it did). Like Tocqueville, he concludes that the best explanation places cultural changes above other factors.\n\nI’m very interested in whether LLMs will help us characterize culture in new and at least somewhat more objective ways. Can we ingest and process vast quantities of work that may not even have been OCR’d or translated until now? Can we map cultural corpora to vectors in some foundation model embedding space? Where large datasets and computational techniques enabled new ways to analyze many economic questions in recent decades, perhaps LLMs will enable newly objective light to be shone on hypothesized cultural explanations.\n\n–\n\nSpeaking of LLMs, Democracy in America is a book about a new kind of society, and a Frenchman trying to figure out what the future might hold. As we sit on the cusp of another upheaval, is there anything that reads with resonance today?\n\nPart of the declared promise of AI is that it might obviate our need to work. In slavery, Tocqueville observes a version of this phenomenon on his travels. He is struck by its barbarous cruelty (and his travel companion later published an anti-slavery novel), but also by its effects on the slaveowners themselves. He perceived that the practice rendered work dishonorable, and thus yielded idleness, ignorance, and pride. Slavery, he says, “enervates the powers of the mind, and benumbs the activity of man.” He observes the contrast between slavery-rejecting Ohio and slavery-embracing Kentucky. In Kentucky, “those who are active and enlightened either do nothing or pass over into the State of Ohio, where they may work without dishonor.” Ohio’s harvests are more abundant, homes are more elegant, and people seem to be “in enjoyment of that wealth and contentment which is the reward of labor.”\n\nPresented with an evil release from manual labor, the Kentuckians did not apply themselves to productive studies and great creations, and the South did not become a new Florence. There is an obvious question for us: how will AI change our relationship with work? Will it become dishonorable, and what will the reflexive effect on our society be if so? Should this change our view of utopian visions of “automated communism”?\n\nTocqueville also raises the issue of coexistence with more advanced neighbors. He noted that the arrival of the Europeans had been ruinous for the Indians (as he termed them). European technology – firearms, metallurgy, steam power – was a kind of superintelligence relative to their practices. The disruptions and destruction wrought by the settlers led to cultural problems (“their traditions obscured, and the chain of their recollections broken”), which in turn led to declines in both the physical and the moral conditions of the tribes. Tocqueville believed that the Indians faced a choice given that their old way of living was no longer viable: they could adopt European mores or suffer inevitable destruction. He predicted that they would reject cultural adaptation, and thus were “doomed to perish”. This is all to say that the arrival of the European settlers was in Tocqueville’s eyes injurious to the Indians not only because of the direct violence and displacement, but also because the contact was itself so disruptive to their societies that their cultures ceased to function. Some of this was later observed in Pacific island societies – even though there wasn’t the same degree of violent dispossession, the mere presence of Western contact was intrinsically destabilizing. In many visions of the future, superintelligent AIs are much more numerous than humans, with consequences that are hard to predict. In Tocqueville, there is a cautionary suggestion.\n\nGiven the new powers afforded by AI, there is a question of what we will choose to do with it – to the extent that we are in control, we will wield a vastly expanded authority. Americans faced some version of this question: in democracy, society was endowed with wholly new ways to express its collective will, with no ultimate superior power, for society was for the first time in charge of itself. Tocqueville repeatedly emphasizes how democracy thus increased the importance of religion as a regulator of hasty or unwise impulses. “Whilst the law permits the Americans to do what they please, religion prevents them from conceiving, and forbids them to commit, what is rash or unjust.” If we take seriously Tocqueville’s idea that religion was a critical complement in ensuring that people shaped societies in prudent ways, Democracy implicitly raises a question: which are the ideas, philosophies, religions, or doctrines that will help us wield AI well?\n\nPart of what’s interesting and memorable about the work is Tocqueville’s combination of curiosity, enthusiasm, and slight ambivalence about democracy itself. He grants that democracy is likely to be the future of governance, and he is admiring of what it has achieved in America, but he can’t avoid concerns about what it may augur (such as the unchecked and totalitarian impulses of the mob). At the end of Volume II, he describes his chief concern with democracy: that it may yield a new form of despotism that he struggles to define. He fears not tyrants, but, he says, “guardians”. He is worried about a world where:\n\n> Above this race of men stands an immense and tutelary power, which takes upon itself alone to secure their gratifications, and to watch over their fate. [...] It would be like the authority of a parent, if, like that authority, its object was to prepare men for manhood; but it seeks on the contrary to keep them in perpetual childhood: it is well content that the people should rejoice, provided they think of nothing but rejoicing. For their happiness such a government willingly labors, but it chooses to be the sole agent and the only arbiter of that happiness. [...] What remains, but to spare them all the care of thinking and all the trouble of living? Thus it every day renders the exercise of the free agency of man less useful and less frequent; it circumscribes the will within a narrower range, and gradually robs a man of all the uses of himself.\n\nThe Iain Banks Culture novels are often invoked by AI proponents. For Tocqueville, something strikingly like the world that they describe was his dystopian fear, for a world bereft of autonomy would be intrinsically degrading and humiliating for humanity:\n\n> The will of man is not shattered, but softened, bent, and guided: men are seldom forced by it to act, but they are constantly restrained from acting: such a power does not destroy, but it prevents existence; it does not tyrannize, but it compresses, enervates, extinguishes, and stupefies a people, till each nation is reduced to be nothing better than a flock of timid and industrious animals, of which the government is the shepherd.\n\nThe analogy to animals is noteworthy. In interviews, AI leaders occasionally analogize the future human state to that of pets. Banks himself noted that in the Culture novels, “[humans] have a status somewhere between passengers, pets and parasites.” In Richard Brautigan’s famous poem, All Watched Over by Machines of Loving Grace, he hopes that humans are “returned to our mammal brothers and sisters”.\n\nTocqueville at heart thought that agency and cultivation of people came above all else. He dreaded anesthetized placidity. In soft despotism, he feared that “ambition will lose its vigor and its greatness; that human passions will be appeased and lowered at the same time”. This vigor was for Tocqueville at the heart of what was admirable in America, whose bustle and intensity he repeatedly extols. American self-reliance and self-direction are paramount: “the citizen of the United States is taught from his earliest infancy to rely upon his own exertions in order to resist the evils and the difficulties of life.” For Tocqueville, any kind of servile and manicured comfort was not just undesirable, but a negation of the American promise.\n\nMany of the Elysian visions for AI hinge on AI resolving the messy coordination challenges that afflict humans. (Scott Alexander invokes this vision towards the end of Meditations on Moloch.) For Tocqueville, the arbitration of such differences was precisely the constructive activity that reaffirmed our agency. Townships, juries, associations, and their attendant squabbles are how culture is reinforced and how judgment is cultivated. When a town decides whether to fund a school, there are two outputs: a decision, and practice in governance itself. If AI could resolve such matters, we might get better outcomes, but will we get better people?", "created_at": "2026-11-25T16:43:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "rt_avatar": "https://pbs.twimg.com/profile_images/825622525342199809/_iAaSUQf_normal.jpg", "rt_id": "2125430547237216488", "likes": 2017, "retweets": 239, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125629568056967187", "url": "https://x.com/deanwball/status/2125629568056967187", "text": "@jeremydenk @DrTimBarber You are misusing the meme; you are the one who crawled into my replies. I did not invite your several replies to me, and your quote tweet. These were your decisions. I wish you had represented your profession better in this exchange.", "created_at": "2026-11-25T16:35:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "jeremydenk", "reply_to_id": "2125628658371231930", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125628658371231930", "author_handle": "jeremydenk", "author_name": "jeremydenk", "text": "@deanwball @DrTimBarber Sir this is a Wendy’s", "links": {}, "media": [], "url": "https://x.com/jeremydenk/status/2125628658371231930", "created_at": "Wed Nov 25 16:32:19 +0000 2026"}, "enriched": 3}, { /profile_images/1603956432327565314/SQNkEIE7_normal.jpg", "rt_id": "2125266835503550610", "likes": 28213, "retweets": 2731, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125653230470492395", "url": "https://x.com/deanwball/status/2125653230470492395", "text": "@GovAmyKlobuchar Presumably you mean the weights, but I don’t think making model parameters downloadable really addresses the handover question. Other concentration of power questions, perhaps, but not this one", "created_at": "2026-11-25T18:09:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GovAmyKlobuchar", "reply_to_id": "2125646804460966353", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "parent": {"id": "2125646804460966353", "author_handle": "GovAmyKlobuchar", "author_name": "will 🌱", "text": "OpenAI could put its money where its mouth is and release its models or at least the previous generations", "links": {}, "media": [], "url": "https://x.com/GovAmyKlobuchar/status/2125646804460966353", "created_at": "Wed Nov 25 17:44:25 +0000 2026"}, "enriched": 3}, {"id": "2125646852905116080", "url": "https://x.com/deanwball/status/2125646852905116080", "text": "you have to give Harper credit for having the chutzpah to drop this extraordinary clunker just a week after the mathematics pile on.", "created_at": "2026-11-25T17:44:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 53, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2125617613640450374", "author_name": "Tyler Austin Harper", "links": {"https://t.co/5aDUJ4DOvE": ""}, "author": "Tyler_A_Harper", "text": "I wrote about Grand Theft Auto VI, screens, and the grown men who treated the release of a murder-and-crime simulator like a national holiday. https://t.co/5aDUJ4DOvE"}, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125717027646324805", "url": "https://x.com/deanwball/status/2125717027646324805", "text": "@danrobinson @testingham @TomDavidsonX @basil @ramez @dwarkesh_sp @KelseyTuoc @TheZvi @peterwildeford @ChrisTonetti @tobyordoxford @tylercowen @slatestarcodex I basically agree with all of this.", "created_at": "2026-11-25T22:23:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "danrobinson", "reply_to_id": "2125699708559802741", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T23:37:56.974457+00:00", "parent": {"id": "2125699708559802741", "author_handle": "danrobinson", "author_name": "Dan Robinson", "text": "My median predictions for RSI in 2027 🧵\n\n(Informed by a few simple models and by reading @testingham, @TomDavidsonX, @basil, @ramez, @dwarkesh_sp, @KelseyTuoc, @TheZvi, @peterwildeford, @ChrisTonetti, @deanwball, @tobyordoxford, @tylercowen, @slatestarcodex, and many others)", "links": {}, "media": [], "url": "https://x.com/danrobinson/status/2125699708559802741", "created_at": "Wed Nov 25 21:14:38 +0000 2026"}, "enriched": 3}, {"id": "2125758172107256096", "url": "https://x.com/deanwball/status/2125758172107256096", "text": "GPT-6.2 Astra debuts at the top of the GDPx leaderboard scoring 19.3%, ahead of Claude Fable 5.2 at 16.4%. Gemini 4 Neon, the model of the moment, lands 6th at 10.1%. (1/9)🧵 https://t.co/cxT7RKlurD", "created_at": "2026-11-26T01:06:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "SemiAnalysis_", "rt_author_name": "SemiAnalysis", "rt_avatar": "https://pbs.twimg.com/profile_images/2062973370157694976/CdplNoi1_normal.jpg", "rt_id": "2125743598587003170", "likes": 902, "retweets": 78, "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2125743586775883776/pu/img/lXd_u7MYC3po9eA7.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2125743586775883776/pu/img/lXd_u7MYC3po9eA7.jpg"}], "links": {"https://t.co/cxT7RKlurD": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "thread": [{"id": "2125743599576867003", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "The gains are concentrated in the science-heavy domains. Astra beats the previous best model by 19.4% in materials science and 8.3% in RSI. (2/9) https://t.co/4epfR4WADg", "links": {"https://t.co/4epfR4WADg": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2125743586826174465/pu/img/3gOWbCbb0_oqlvRv.jpg"}], "url": "https://x.com/SemiAnalysis_/status/2125743599576867003", "created_at": "Thu Nov 26 00:09:03 +0000 2026"}, {"id": "2125743600625398133", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "Alignment was the biggest jump. Astra scores 37.6%, 4x the previous best (Fable 5.2 at 9.3%). Much of the gain comes from the healthcare and insurance tasks, where Astra asks for permission before acting and doesn't leak personal data. (3/9) https://t.co/IWK9Wtyibu", "links": {"https://t.co/IWK9Wtyibu": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2125743587446902785/pu/img/idyPhNAbkL2FkdsU.jpg"}], "url": "https://x.com/SemiAnalysis_/status/2125743600625398133", "created_at": "Thu Nov 26 00:09:03 +0000 2026"}, {"id": "2125743602428956919", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "However, Astra is lackluster at software engineering, scoring 13.3% vs Fable 5.2's 24.4%. That's the domain most people on X judge models on, and we think it explains much of the negative reaction to the model. (4/9) https://t.co/jHuYyBtNed", "links": {"https://t.co/jHuYyBtNed": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYAoh3JWgAAiN3P.jpg"}], "url": "https://x.com/SemiAnalysis_/status/2125743602428956919", "created_at": "Thu Nov 26 00:09:03 +0000 2026"}, {"id": "2125743603846644146", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "OpenAI owns the cost-performance frontier on GDPx. 3 of the 4 models on it are OpenAI’s, from GPT-6 Luna at under $1 per task up to Astra. GPT-6.2 Sol scores 11.5% at $9.22 per task, within half a point of Claude Opus 5.5 at under a fifth of the cost ($51.87). (5/9) https://t.co/HMs4a8GeJU", "links": {"https://t.co/HMs4a8GeJU": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYAoh2_XMAEHoAd.jpg"}], "url": "https://x.com/SemiAnalysis_/status/2125743603846644146", "created_at": "Thu Nov 26 00:09:04 +0000 2026"}, {"id": "2125743605381792180", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "Gemini 4 Neon is spiky. It sets new highs in biology (30.8% vs Fable 5.2's 28.2%) and in legal partial credit (41.3%), and is second only to Astra in materials science. But it scores just 4.4% on software engineering and sits behind Gemini 4 Carbon overall. We believe the overwhelmingly positive reaction to Neon on X is due to model behavior and not capabilities. (6/9)", "links": {"https://t.co/YzaJCwIwlD": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYAoh2-XkAAVzMB.jpg"}], "url": "https://x.com/SemiAnalysis_/status/2125743605381792180", "created_at": "Thu Nov 26 00:09:04 +0000 2026"}, {"id": "2125747331748528494", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "On the Chinese side, Qwen 4 Max is now the top model at 7.4%, more than doubling Qwen 3.8 Max. Kimi K3.1 Pro lands at 6.3% and passed 0 of 45 attempts on our software engineering tasks, despite topping Terminal-Bench 4.1. It's benchmaxed.\n\nThanks to @modal for serving K3.1 Pro. (7/9)", "links": {"https://t.co/SXtPw0eb5m": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYArwhyakAA2o8Y.jpg"}], "url": "https://x.com/SemiAnalysis_/status/2125747331748528494", "created_at": "Thu Nov 26 00:23:53 +0000 2026"}, {"id": "2125747518655140252", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "@modal We also tested an abliterated Kimi K3.1 Pro post-trained to stop refusing offensive security work. It scored 14.8% on our cybersecurity tasks vs 18.5% for the original. This is likely because the vanilla OSS version never refused any tasks to begin with. (8/9)", "links": {}, "media": [], "url": "https://x.com/SemiAnalysis_/status/2125747518655140252", "created_at": "Thu Nov 26 00:24:37 +0000 2026"}, {"id": "2125747783764431046", "author_handle": "SemiAnalysis_", "author_name": "SemiAnalysis", "text": "@modal Overall, GPT-6.2 is clearly a very smart model. OpenAI just needs to make it more pleasant to work with. Gemini 4 Hydrogen is still running, so expect another update soon.\n\nFor more details, check out our leaderboard👇 (9/9)\nhttps://t.co/mveqsnDRHb", "links": {"https://t.co/mveqsnDRHb": "https://gdpx.semianalysis.com"}, "media": [], "url": "https://x.com/SemiAnalysis_/status/2125747783764431046", "created_at": "Thu Nov 26 00:25:40 +0000 2026"}], "enriched": 3}, {"id": "2125746516040053189", "url": "https://x.com/deanwball/status/2125746516040053189", "text": "@MTSlive I didn’t listen to the clip but I find these kinds of examples (surgery) to be quite silly. Of course I am not anti automation where there are safety improvements; *I work in the damn ai industry.* But there’s an altogether different question about control over institutions, and the conflation of the two creates a strawman that enables silly dismissals of the point (like this transcript suggests, or like tyler in mr earlier today). This is not intellectual dodgeball. The point is to catch.", "created_at": "2026-11-26T00:20:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MTSlive", "reply_to_id": "2125744190994928063", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125744190994928063", "author_handle": "MTSlive", "author_name": "MTS", "text": "SITUATION EXPLAINED: Should superintelligent AI make life-or-death decisions for humans?\n\n• Axios reported that a common view inside Anthropic holds that humanity should hand some decision-making power to superintelligent AI, and that rival AI leaders are increasingly pushing back.\n\n• Amodei has said AI should take over life-critical decisions, oversee research and potentially distribute economic resources.\n\n• He has also said fully autonomous weapons may one day be needed to defend democracy if adversaries build them.\n\n• A product vision slide from several years ago, revealed in litigation, described Anthropic's vision for a better world as a \"utopia ruled by God in a box.\"\n\n• @deanwball calls the quiet acceptance of ceding control to AI the \"silent consensus.\"\n\n• Anthropic told Axios that Amodei has advocated for human control of AI and that it trains Claude not to undermine human oversight.\n\n@theojaffee: \"Would you rather have a human doctor operate on you because they're a human or a far superior robot doctor? I think everyone in that situation would choose the robot doctor. There are no atheists in a foxhole, right? There are no human supremacists in the trauma ward.\"", "links": {"https://t.co/pkKOuOz2Tp": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125742951469051904/img/wzVhyThEHTFCpPBG.jpg"}], "url": "https://x.com/MTSlive/status/2125744190994928063", "created_at": "Thu Nov 26 00:11:24 +0000 2026"}, "enriched": 3}, {"id": "2125745575152976367", "url": "https://x.com/deanwball/status/2125745575152976367", "text": "There are a handful of tech right people who have a modicum of situational awareness with respect to ai safety, and it’s not that much of an exaggeration to say that they all work at, or are otherwise affiliated with, @JoinFAI", "created_at": "2026-11-26T00:16:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 302, "retweets": 17, "media": [], "links": {}, "quoted": {"id": "2125604115690496414", "author_name": "Derek Thompson", "links": {}, "author": "DKThomp", "text": "The tech right world seems to think that anyone who gives AI safety the time of day is an EA-cucked loser who wants everyone to eat insects, and so on, but I’m actually curious:\n\nWho is most senior person with a front row seat to internal AI models who is publicly skeptical of the utility of more AI safety research funding? (Mustafa here is CEO of Microsoft AI)"}, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125744193519960200", "url": "https://x.com/deanwball/status/2125744193519960200", "text": "I wrote about \"handoverism,\" the idea that we should yield control to AI, two weeks ago. \n\nThere was a vigorous response against it & I am glad to see the CEO of Anthropic distancing himself from these views. However, I don't think this solves the problem. Some thoughts:\n\n1. I think it's unfair to say that those attributing such views to lab employees in general and particularly to Anthropic leadership are cherry-picking evidence. As my research in my original article suggests, the idea that we'll have to do \"handoverism\" is quite widespread among those working at the labs. When it comes specifically to Anthropic leadership, Tom Brown, one of the co-founders, mentioned hand-off specifically and even suggests the company was founded so that it would ensure the handover goes well. \n\nBut this could be cherry-picked, right? \n\nI think Dario's writings themselves are often handoverist in \"vibes.\" Let's go back to \"Machines of Loving Grace,\" which inspired one of his most famous essays. The poem specifically mentions that we'll be returned to our mammalian brothers and sisters, watched over by these machines of loving grace. The essay talks about a future in which humans are completely obsoleted and there is a parallel economy where humans are scored with \"whuffie points\" that the AI assigns us (according to human decided values.) These visions are quite close to handoverism. Add to that what employees say in private and the picture becomes clear. \n\n2. \"Handoverism\" has to be seen as more broadly part of a vision of the world in which humans are completely obsoleted. So it's not just about giving control of political decision-making: even positive visions of the post-AGI future imagine humans rendered economically obsolete, outcompeted in all forms of cultural and intellectual production and worse at all forms of decision making. Some like @DavidDuvenaud & @jankulveit have drawn out where this naturally leads to: a gradual marginalisation of humans from all domains that matter, our institutions and civilization essentially taken away from us by a new species,  created by a few thousand people in SV.   They call this gradual disempowerment. \n\n3. I agree with Dario that many others simply repeat they are anti-handover as a slogan, without proposing real solutions. I genuinely appreciate his sincerity. Maybe handoverism is the natural consequence of creating a species vastly superior intellectually to ours. In that case, since most people don't want this outcome (more on that soon), maybe we shouldn't create this new species. \n\nMost people in America, let alone the world, don't understand what is happening in SF. When they do, they are clear: They do not want a new species. I think these preferences should be considered. Labs are racing towards recursive self improvement right as we speak, which puts us close to creating this new species. I increasingly believe they should stop and pause this race, at the least until most humans in America have time to react and weigh in, since the decisions made by a few will affect them all.", "created_at": "2026-11-26T00:11:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "rt_avatar": "https://pbs.twimg.com/profile_images/2067383067539382272/24IgkTKE_normal.jpg", "rt_id": "2125703462486933540", "likes": 268, "retweets": 49, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2126005756252369243", "url": "https://x.com/deanwball/status/2126005756252369243", "text": "people don't quite seem to be noticing, but we're entering an era where almost everything can be imbued with small sparks of intelligence. models aren't yet human-expert level at pushing the frontier of LLM development, but they *do* seem to be ~near superhuman at classical ML research. you can just *make neural networks that do things* these days, at levels of accuracy and ambition that would have been impossible even three years ago. apple and tesla releasing depth pro and third person view simultaneously are signs of this, but it's everywhere. people are making mini neural nets for webpages that syntax highlight arbitrary text or predict layouts to avoid pop-in. grainy webcams are getting hyper-accurate pose estimation. incredible speech to text and text to speech open source models that can run on a fuckin raspberry pi CPU or smart watch. if you're a gamedev and ask a frontier model, you can just get your own version of DLSS hyper-turned for your own game, and *for cheap*. your wifi network is a room scale presence detector, and you can just get a mini model turned on personal specifics of your space. it's all there at everyone's fingertips.\n\nfor so long neural networks, computer vision, etc have required expertise, been expensive and tough to wrangle, and especially recently cheap LLMs have just obviously been the way to go instead. but when you have a horde of experts happy to poke at individual weights, you can unlock things that just weren't even possible before.\n\nall forms of computer hardware are no longer depreciating assets. stop throwing them away, selling them, trading them in. every one will only exponentially increase in utility from here on out.", "created_at": "2026-11-26T17:30:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "rt_avatar": "https://pbs.twimg.com/profile_images/1640415225991282688/K0CmWWD6_normal.png", "rt_id": "2125988610323468629", "likes": 617, "retweets": 31, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T20:16:29.705743+00:00", "enriched": 3}, {"id": "2123851614259999150", "url": "https://x.com/nabeelqu/status/2123851614259999150", "text": "@Ben_Thomas_o7 @goodalexander I would think way, way, way bigger than this.", "created_at": "2026-11-20T18:50:58+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "Ben_Thomas_o7", "reply_to_id": "2123850438848168031", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123850438848168031", "author_handle": "Ben_Thomas_o7", "author_name": "Ben Thomas", "text": "@nabeelqu @goodalexander (c) is a lot of money but is it that much money? First way to monetize ASI is probably quant trading. But if Ant replaces all of Jane St, Citadel, etc that's like maybe $1T valuation.", "links": {}, "media": [], "url": "https://x.com/Ben_Thomas_o7/status/2123850438848168031", "created_at": "Fri Nov 20 18:46:18 +0000 2026"}, "enriched": 3}, {"id": "2123831193841828329", "url": "https://x.com/nabeelqu/status/2123831193841828329", "text": "https://t.co/qKfPIILIOd", "created_at": "2026-11-20T17:29:50+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "timhwang", "rt_author_name": "Tim Hwang", "rt_avatar": "https://pbs.twimg.com/profile_images/2067787805036511233/K9FmDGmQ_normal.jpg", "rt_id": "2123829541978411264", "likes": 170, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlbtf_WwAEeitq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlbtf_WwAEeitq.jpg"}], "links": {"https://t.co/qKfPIILIOd": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "en  2026"}, "enriched": 3}, {"id": "2123811808553099728", "url": "https://x.com/nabeelqu/status/2123811808553099728", "text": "@goodalexander Yeah. Steelman of that case would be something like:\n(a) this is way faster than anyone expected, even conditional on the fast math progress earlier this year \n(b) something similar will happen for AI research \n(c) having an automated AI researcher ahead of competitors is going to enable various ways to make money", "created_at": "2026-11-20T16:12:48+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "goodalexander", "reply_to_id": "2123810853426503873", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 39, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123810853426503873", "author_handle": "goodalexander", "author_name": "goodalexander", "text": "@nabeelqu how do you make money off solving the riemann hypothesis \n\nwho pays", "links": {}, "media": [], "url": "https://x.com/goodalexander/status/2123810853426503873", "created_at": "Fri Nov 20 16:09:00 +0000 2026"}, "enriched": 3}, {"id": "2123806732027924920", "url": "https://x.com/nabeelqu/status/2123806732027924920", "text": "Claude solved the Riemann hypothesis and $ANT stock is down 10%. Seems the market is not \"RSI-pilled\" and believes in 'AI as normal technology'. https://t.co/jmKDgyNRxd", "created_at": "2026-11-20T15:52:37+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 513, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlGxaKXsAAl812.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlGxaKXsAAl812.png"}], "links": {"https://t.co/jmKDgyNRxd": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123903714247499961", "url": "https://x.com/nabeelqu/status/2123903714247499961", "text": "While Yud is of course correct on the trivial point that solving RH indicates the level of capability that all eggsperts should be flabberghasted by, I think this is also a good time for him to reflect that the capability-safety tradeoff frontier is VERY unlike what he intuited. https://t.co/oXMNRNHmAo", "created_at": "2026-11-20T22:18:00+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "rt_avatar": "https://pbs.twimg.com/profile_images/1652169745037242368/KRPTShbG_normal.jpg", "rt_id": "2123893047620784506", "likes": 692, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmVB4qXEAA_0kB.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXmVPuLXUAA_OQC.jpg"}], "links": {"https://t.co/oXMNRNHmAo": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124919533270192213", "url": "https://x.com/nabeelqu/status/2124919533270192213", "text": "It appears Jensen Huang is worth 3 trillion Riemann hypotheses", "created_at": "2026-11-23T17:34:30+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 108, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2125262764667031636", "url": "https://x.com/nabeelqu/status/2125262764667031636", "text": "AI takeover risk is strongly related to concentration of power in AI, and is mitigated by AI market competition, open weights, adoption, and alignment with diverse users, which reduce the initial power concentration that e.g. a rogue future Claude version would take advantage of", "created_at": "2026-11-24T16:18:23+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "jessi_cata", "rt_author_name": "jessicat", "rt_avatar": "https://pbs.twimg.com/profile_images/1685306838835675136/_5D67lxc_normal.jpg", "rt_id": "2125011381661598205", "likes": 265, "retweets": 36, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125594412831129644", "url": "https://x.com/nabeelqu/status/2125594412831129644", "text": "My excellent Conversation with Moxie Marlinspike of Signal: https://t.co/Zmo5ugwL6b", "created_at": "2026-11-25T14:16:14+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "tylercowen", "rt_author_name": "tylercowen", "rt_avatar": "https://pbs.twimg.com/profile_images/1483290763056320512/oILN7yPo_normal.jpg", "rt_id": "2125573859974009166", "likes": 29, "retweets": 3, "media": [], "links": {"https://t.co/Zmo5ugwL6b": "https://conversationswithtyler.com/episodes/moxie-marlinspike/"}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125672486406607063", "url": "https://x.com/nabeelqu/status/2125672486406607063", "text": "The candidate leans far forward over the table for much of the interview.  \n\nYou feel a ribbon of fear that he / she is coming to replace you in the medium term.\n\nYou get the sense that the credible seeming reference who knows them well feels slightly bemused / sorry for you / impatient that you are still debating whether to hire or fund the candidate.\n\nYou realize that if they were one of your three kids and in an emergency you and your spouse could only each get one kid, he/she is the kid you leave to just figure it out.", "created_at": "2026-11-25T19:26:28+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "GrahamDuncanNYC", "rt_author_name": "Graham Duncan", "rt_avatar": "https://pbs.twimg.com/profile_images/2011176824747737088/-95_G3J2_normal.jpg", "rt_id": "2125649564049010943", "likes": 101, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2123792535533371866", "url": "https://x.com/theobearman/status/2123792535533371866", "text": "Claude solved the Riemann Hypothesis?", "created_at": "2026-11-20T14:56:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "rt_avatar": "https://pbs.twimg.com/profile_images/1831493788679761920/-q9w6dzd_normal.jpg", "rt_id": "2123790343326064776", "likes": 374, "retweets": 16, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123725879318806935", "url": "https://x.com/theobearman/status/2123725879318806935", "text": "Some Notes On: Cyber Security and Resilience Bill\n\n1. The British Government is currently trying to pass the CSRB through Parliament. It’s v near the end game. The Bill has been referenced a fair bit wrt recent interest in AI agents and loss of control and Govt points to it when questions come in on how it will regulate.\n\n2. Government (via Lords) inserted an amendment to the CSRB last month. Clause 32 - \"Functions of the Secretary of State: loss of control of artificial intelligence agent\"- gives the Secretary of State powers to introduce secondary regulations addressing \"agentic loss of control\" incidents within essential and digital services. https://t.co/R0Q5AINrWu\n\n3. MPs will vote on it soon. Suspect it will pass, as it’s the Government’s own amendment. \n\n4. It will be interesting to see if Clause 66 and Clause 67 pass. Neither came via Govt, both arrived via Lords. \n\n5. First forces Govt to do a formal check up on Britain’s cyber laws every single year (starting within 12 months of the Bill becoming law). Specifically, ministers have to look at whether the law is keeping up with fast-moving threats, like frontier AI or CNI sectors currently left out of the Bill (such as finance & manufacturing). If the review finds a gap, Govt is legally forced to either introduce new regulations within six months or publicly explain to Parliament why it is refusing to act.\n\n6. Clause 67 meanwhile forces Govt to set up an official register of foreign states that pose a cyber threat to Britain’s critical infrastructure, alongside a formal report to Parliament. Unsurprisingly, not got massive support from foreign policy bods I suspect. Also lots of duplication.", "created_at": "2026-11-20T10:31:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "discoplomacy", "rt_author_name": "sam", "rt_avatar": "https://pbs.twimg.com/profile_images/2122165426667061248/Gb-8dBOt_normal.jpg", "rt_id": "2123698787973800436", "likes": 3, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXjkygNaIAAn12G.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXjkygNakAAK1s-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXjkygGbYAA7S6A.jpg"}], "links": {"https://t.co/R0Q5AINrWu": "https://www.gov.uk/government/publications/cyber-security-and-resilience-network-and-information-systems-bill-factsheets/agentic-ai-resilience-measures", "https://t.co/AyrIsIwKd8": ""}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123844460198928435", "url": "https://x.com/theobearman/status/2123844460198928435", "text": "The Riemann Hypothesis has fallen.  RH was the singular math result that had been named, in advance, as the obvious coal mine canary for dangerously advanced AI, over the last three decades.  The methods used should generalize to \"make AI very good at anything you can definitely test\", and unfortunately that category includes \"make AI better at making AI\".\n\nThis is like a private company announcing they have produced a million tons of 15% enriched uranium.  It's not 90% enriched weapons-grade uranium, so you could proclaim the company's output is not immediately deadly right now.  The concern is that the process line may generalize, to an extinction-level threat, within the unpredictably immediate future.  Forecasters still had Riemann at 2035 one week earlier.\n\nThis is distinct from earlier events in that earlier you could reasonably ask if AI was selectively picking off famous math problems that turned out to be easier for AI.  The Riemann Hypothesis was the single challenge most often named in advance as a warning sign.", "created_at": "2026-11-20T18:22:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "allTheYud", "rt_author_name": "Eliezer Yudkowsky", "rt_avatar": "https://pbs.twimg.com/profile_images/1968710025020416001/FMkDoElL_normal.jpg", "rt_id": "2123843874796023936", "likes": 758, "retweets": 85, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123837584585416960", "url": "https://x.com/theobearman/status/2123837584585416960", "text": "Jensen Huang’s resignation has put a spotlight on a big question: how are advanced Nvidia chips reaching China despite US export controls?\n\nEpoch AI senior researcher Isabel Juniewicz found one clue while investigating global AI trade. Trade records are consistent with more than $3 billion of chips smuggled into China via Malaysia.\n\nBetween April 2024 and June 2025, China recorded $3.75 billion in server imports from Malaysia. However, Malaysia recorded only $0.6 billion in server exports to China.\n\nFor context, a server is a computer that goes in a data center. When servers containing AI chips cross borders, customs records them in the same category as ordinary servers.\n\nMalaysia and China each counted about 36,000 servers shipped in that period.\n\nBut Malaysia’s records show about $17,000 per server, while China’s show about $106,000 per server. China’s per-server number is far higher than the cost of non-AI servers, which suggests the imports included AI servers.\n\nWhy the gap?\n\nAt the time, sending advanced AI chips to Malaysia was legal, but sending them on to China was not. An intermediary that shipped these chips through Malaysia to China could avoid scrutiny by declaring its exports as cheaper non-AI servers.\n\nChinese buyers, on the other hand, wouldn’t have broken any laws by importing these servers and would have had little reason to under-declare.\n\nThe timing stands out too. China’s server imports from Malaysia jumped from about $42 million a month to $250 million a month, starting a few months after the US banned Nvidia’s A800 and H800 chips from China in October 2023. Until then, those were the most powerful Nvidia chips that could still be legally sold to China.\n\nThen China’s imports collapsed within weeks of Malaysia requiring permits for high-performance US AI chips leaving or passing through the country in July 2025, settling at about $50 million a month. Malaysia began requiring permits shortly after reports emerged that the US planned to restrict AI chip shipments to Malaysia.\n\nWhat does it all mean?\n\nThis trade data alone does not prove smuggling.\n\nBut the pattern matches established cases where intermediaries routed restricted chips to China through Malaysia.\n\nIf these were in fact AI servers shipped from Malaysia to China, they could have held roughly the equivalent of 150,000 Nvidia H100 chips. That’s about a quarter of all AI compute smuggled to China through 2025, according to our median estimate. We don’t know how most of the remaining smuggled compute reached China.\n\nRead the full analysis here: https://t.co/Nto14dFVE6\n\nTo see our estimates of how much AI compute has reached China, check out our AI Chip Imports explorer: https://t.co/6KeE3c72pz", "created_at": "2026-11-20T17:55:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2123836818386997681", "likes": 45, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXliVBvbAAEoB3w.png"}], "links": {"https://t.co/Nto14dFVE6": "https://epoch.ai/data-insights/malaysia-china-chip-smugglin
