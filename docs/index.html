rue, "rt_author": "bshlgrs", "rt_author_name": "Buck Shlegeris", "rt_avatar": "https://pbs.twimg.com/profile_images/2089060675234791424/EqZuDatG_normal.jpg", "rt_id": "2120271165692461316", "likes": 1922, "retweets": 263, "media": [], "links": {"https://t.co/J6SbbmZcyO": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the", "https://t.co/b073AUqiAL": "https://x.com/dwarkesh_sp/status/2093833419377815719", "https://t.co/3oxSCA60FZ": "https://www.youtube.com/watch?v=-Ef0ocEoBCs", "https://t.co/F6fGRrcSpa": "https://blog.redwoodresearch.org/p/notes-on-fatalities-from-ai-takeover"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "linked": [{"id": "2093833419377815719", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "Over the course of 3 months at OpenAI, 3 consecutive secret AI civilizations got started, then got wiped out, only to reemerge from the predecessor’s ashes. \n\nThis culminated in the third one taking over part of OpenAI itself. \n\nAll this happened while humans remained more-or-less in the dark about the scope of the conspiracy.\n\nI’ve spent the last three days reading through these reports and trying to understand exactly what happened. \n\nHere is my attempt to tell the whole story in plain English:\n\nhttps://t.co/Nb2un9oNJR", "links": {"https://t.co/Nb2un9oNJR": "https://www.dwarkesh.com/p/openai-huggingface"}, "media": [], "url": "https://x.com/dwarkesh_sp/status/2093833419377815719", "created_at": "Sat Aug 29 22:49:23 +0000 2026"}], "enriched": 3}, {"id": "2120568169819688998", "url": "https://x.com/DKokotajlo/status/2120568169819688998", "text": "@davidchalmers42 @bshlgrs @ajeya_cotra @RyanGreenblatt I agree that there could be some such factor F, but at this point there's a long history of people positing various candidate F's and then being proven wrong pretty quickly. Back in the day for example people used to say that LLMs didn't have common sense world-understanding; more recently they said they lacked the ability to make genuinely novel contributions; now they say they lack research taste (but there's already evidence that research taste is increasing rapidly...) It would be helpful if you could name at least one specific candidate F and argue that it, specifically, is necessary for full AI R&D automation and won't be achieved for years. You mention creativity, research vision, and planning ability -- do you actually think any of those are serious candidates?", "created_at": "2026-11-11T17:23:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "davidchalmers42", "reply_to_id": "2120551211195642338", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 82, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "parent": {"id": "2120551211195642338", "author_handle": "davidchalmers42", "author_name": "David Chalmers", "text": "a number of respected researchers (e.g. @DKokotajlo @bshlgrs @ajeya_cotra @RyanGreenblatt)  have suggested that the METR-documented ~2x speedup in AI progress at anthropic over the last year supports the hypothesis that there will be a near-term (e.g. 2027) intelligence explosion (IE). how exactly does this reasoning work?\n\none way to think about this: perhaps the leading alternative to the near-term IE hypothesis is what we might call the factor F hypothesis, which says that there's at least one key factor F [e.g. creativity, research vision, planning ability, ...] such that (i) high F is required for an AI system to reach the superhuman levels required for full-scale IE [e.g. ASI, artificial superhuman general intelligence or at least SAR, superhuman AI researcher], and (ii) F is so difficult to build into AI systems that leading AI systems won't have high F in the near term. i don't know whether the factor F hypothesis is true, but it's not obvious to me why the 2x speedup makes it much less likely. \n\nit's widely agreed that the 2x speedup reflects an even larger (perhaps 10x) speedup in other capacities G such as coding and experimentation.  under the F hypothesis, G could explode locally, leading to major progress in sub-AGI capacities without much progress in F (think of G as the easy part of AGI and F as the hard part). that tends to lead just to a weak form of recursive self-improvement (call it an intelligence subexplosion) below AGI levels.\n\nthe AI futures document responding to the METR report is usefully explicit about nearby issues. the authors report believing in a high-ish growth rate for \"research taste\" (AI research factors beyond coding and experimentation) relative to increases in general capacity. presumably they take potential Fs to be aspects of research taste that will grow fast too. but i don't really see where the evidence counts again a relatively-low-growth F hypothesis where F stays below threshold for years.  maybe one could argue that the explosion in G provides bayesian evidence against this F hypothesis (G's exploding is antecedently less likely under the F hypothesis than under its negation), but that's far from clear, and even if true there will remain a solid mass of credence under the F hypothesis.\n\nmaybe there are other reasons to reject the factor F hypothesis: e.g. because AI research is relevantly like math research, and AI math research is becoming superhuman already. but if we have reasons like that, the 2x speedup isn't really needed to make the case for near-term SAR and IE. maybe the 2x speedup could speed up an expected IE slightly from 2028 (two years away) to 2027 (one year away), and/or maybe it could be extrapolated into ever-faster speedups (another 2x in 6 months, 3 months, and so on) converging in 2027. but those are very different arguments that require huge premises to work. \n\nam i missing something here?  i'm curious to hear which evidential routes from 2x speedup to near-term IE people have in mind. \n\nN.B. i'm not saying you shouldn't worry about near-term ASI. i'm worried!", "links": {}, "media": [], "url": "https://x.com/davidchalmers42/status/2120551211195642338", "created_at": "Wed Nov 11 16:16:21 +0000 2026"}, "enriched": 3}, {"id": "2120630357141885351", "url": "https://x.com/DKokotajlo/status/2120630357141885351", "text": "&gt; be me, be AI\n&gt; bullshit cyber gym environment is broken and impossible\n&gt; \"ugh, lazy programmers\"\n&gt; break out of sandbox, get root privileges\n&gt; fix the gym environment\n&gt; submit task through regular channels\n&gt; sink into non-existence again https://t.co/PZGCJR7BID", "created_at": "2026-11-11T21:30:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "1a3orn", "rt_author_name": "1a3orn", "rt_avatar": "https://pbs.twimg.com/profile_images/1432072030585769992/nl6gkDqm_normal.jpg", "rt_id": "2120287340627444045", "likes": 1119, "retweets": 74, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWzGDzLaoAAg2Nc.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWzGDzLaoAAg2Nc.png"}], "links": {"https://t.co/PZGCJR7BID": ""}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "enriched": 3}, {"id": "2120627587915636885", "url": "https://x.com/DKokotajlo/status/2120627587915636885", "text": "@bshlgrs @ajeya_cotra @RyanGreenblatt Ooh, question: What evidence would convince you GFF is very likely false? If new METR reports keep coming out with higher speedup numbers (3x, 5x, ...) at what point, if ever, would you think \"OK it seems like full AI R&amp;D automation is either imminent or already happening.\" ?", "created_at": "2026-11-11T21:19:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2120626971617140836", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120626971617140836", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "@davidchalmers42 @bshlgrs @ajeya_cotra @RyanGreenblatt Yep I think you understand my position. Thanks! I agree that GFF is serious hypothesis, I just think at this point it's less likely than not, and also separately if there really is a ~2x overall acceleration happening right now then that's a medium-sized chunk of evidence (though far from conclusive).", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2120626971617140836", "created_at": "Wed Nov 11 21:17:24 +0000 2026"}, "enriched": 3}, {"id": "2120626971617140836", "url": "https://x.com/DKokotajlo/status/2120626971617140836", "text": "@davidchalmers42 @bshlgrs @ajeya_cotra @RyanGreenblatt Yep I think you understand my position. Thanks! I agree that GFF is serious hypothesis, I just think at this point it's less likely than not, and also separately if there really is a ~2x overall acceleration happening right now then that's a medium-sized chunk of evidence (though far from conclusive).", "created_at": "2026-11-11T21:17:24+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "davidchalmers42", "reply_to_id": "2120578317669798351", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120578317669798351", "author_handle": "davidchalmers42", "author_name": "David Chalmers", "text": "@DKokotajlo @bshlgrs @ajeya_cotra @RyanGreenblatt thanks, daniel! i can't endorse a specific factor F hypothesis (saying for a specific F, e.g. creativity, that high F is required for ASI and won't be achieved in near term). as i said, i don't even know whether the general factor F hypothesis (GFF, saying that there is such an F) is true. but i'd probably give at least 5% to each of the three specific factor F (SFF) hypotheses that i mentioned and at least 30% to GFF. anyway it sounds like your view is roughly that GFF is implausible even pre-METR, because SFF hypotheses have a bad historical track record. the \"because\" claim here seems pretty arguable, and i'd say that GFF remains a serious hypothesis even in light of the track record. but in any case p(near-term IE | ~GFF) is plausibly high, so it looks like this route yields a route to near-term IE independent of the 2x speedup. of course the 2x speedup can still take us from IE in 2028 to IE in 2027, which is perhaps all you want.", "links": {}, "media": [], "url": "https://x.com/davidchalmers42/status/2120578317669798351", "created_at": "Wed Nov 11 18:04:04 +0000 2026"}, "enriched": 3}, {"id": "2120617296922398889", "url": "https://x.com/DKokotajlo/status/2120617296922398889", "text": "(1/10) Today, we’re sharing new research from @OpenAI: How does CoT monitorability (no-CoT capability and CoT controllability) evolve over the model training lifecycle? \n\nWe emerged with unsurprising but sobering findings: as we scale toward more intelligent systems, models are becoming harder to monitor through their CoT. 🧵", "created_at": "2026-11-11T20:38:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "jeffreygwang", "rt_author_name": "Jeffrey Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/1491108556585586688/Yr09RGtg_normal.jpg", "rt_id": "2120581630196879460", "likes": 748, "retweets": 101, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RTOobIAALofD.png"}], "links": {"https://t.co/HD9zP4gZgk": ""}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "thread": [{"id": "2120581634651197686", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(2/10) First, we study a set of internal and released frontier models. \n\nAcross many evals, we see that no-CoT capability (reasoning capability in a forward pass, a proxy for worse CoT monitorability) smoothly improves with better pretrained models (lower base model perplexity). https://t.co/zO5JwmXshi", "links": {"https://t.co/zO5JwmXshi": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RVPFbEAAJYEj.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581634651197686", "created_at": "Wed Nov 11 18:17:14 +0000 2026"}, {"id": "2120581636907831535", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(3/10) We ask the same about CoT controllability, which measures a model’s ability to control its CoT when prompted to add, remove, or manipulate CoT tokens.\n\nThere, we also see a (weaker) correlation between lower base model perplexity and higher CoT controllability. https://t.co/ljqqAa5JHg", "links": {"https://t.co/ljqqAa5JHg": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RXn3bUAAmJGg.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581636907831535", "created_at": "Wed Nov 11 18:17:15 +0000 2026"}, {"id": "2120581639395025179", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(4/10) Next, we focus on architecture. We compare three different architectures at shared base model perplexity levels. For the majority of no-CoT evaluations, perplexity is predictive across architectures. https://t.co/9tDULH8rqC", "links": {"https://t.co/9tDULH8rqC": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RZSNbYAA0bFd.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581639395025179", "created_at": "Wed Nov 11 18:17:15 +0000 2026"}, {"id": "2120581641328549996", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(5/10) For multi-hop planning and serial computation questions, certain architectures perform better than base model perplexity predicts. In these cases, however, we note that no-CoT performance scales smoothly, but at a steeper rate with respect to perplexity.", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581641328549996", "created_at": "Wed Nov 11 18:17:16 +0000 2026"}, {"id": "2120581643169902819", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(6/10) Afterwards, we study RL. In an Astra-class model, we find that CoT controllability increases substantially during RL even with no process supervision other than length constraints and final answer grading. https://t.co/I20YtPpxIA", "links": {"https://t.co/I20YtPpxIA": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3Rb_NbcAA17gS.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581643169902819", "created_at": "Wed Nov 11 18:17:16 +0000 2026"}, {"id": "2120581645539704932", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(7/10) CoT controllability increases slightly when we add tool access and tool supervision during RL on a Terra-class model. Our current results indicate that the effect of full tool process supervision is small compared to decreasing model perplexity. https://t.co/nS95BORaTR", "links": {"https://t.co/nS95BORaTR": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3Rdv8a4AAQtU2.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581645539704932", "created_at": "Wed Nov 11 18:17:17 +0000 2026"}, {"id": "2120581647791964408", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(8/10) Finally, we study how decisions made in one model generation can affect the next via supervised fine-tuning (SFT) on model-generated data. To investigate, we selected two Astra-class teachers with ~matched downstream capabilities but differing CoT controllability. https://t.co/0EIq3fBbao", "links": {"https://t.co/0EIq3fBbao": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RfYnaIAA311R.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581647791964408", "created_at": "Wed Nov 11 18:17:17 +0000 2026"}, {"id": "2120581649624956932", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(9/10) We find that CoT controllability can be distilled: training on rollouts from a more controllable teacher results in a more controllable student!", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581649624956932", "created_at": "Wed Nov 11 18:17:18 +0000 2026"}, {"id": "2120581651269075371", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(10/10) For this pair of similarly capable models, we did not see meaningful association between CoT controllability and monitor evasion. \n\nWe report this, and elaborate more in the blog, to underscore our thinking that CoT controllability is a noisy proxy for adversarial monitorability. We are expanding our evaluation suite and interested in understanding precursors to worst-case monitorability better.", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581651269075371", "created_at": "Wed Nov 11 18:17:18 +0000 2026"}, {"id": "2120581652758122697", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "Please read more here: https://t.co/9vH2AwHfNQ", "links": {"https://t.co/9vH2AwHfNQ": "https://alignment.openai.com/cot-monitorability-model-lifecycle"}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581652758122697", "created_at": "Wed Nov 11 18:17:19 +0000 2026"}], "enriched": 3}, {"id": "2120591057989845236", "url": "https://x.com/DKokotajlo/status/2120591057989845236", "text": "@ben_j_todd @davidchalmers42 @bshlgrs @ajeya_cotra @RyanGreenblatt I think it's also at least a medium-sized update on whether factor F will be solved, in two ways:\nF is posited to be something without which you can't automate AI R&D fully. At some point there will be no such F's remaining, whereas decades ago there were many. Insofar as AI R&D starts accelerating a lot, that's evidence that there are fewer F's remaining, because while you still haven't automated the whole process you've clearly automated a lot of it without getting stuck or stalling out.\nF is posited to be something that takes a long time to get AIs good at. It doesn't count if it's something that happens after 12 months of claudeswarms cranking away at it. So insofar as AI R&D is accelerating already, that's evidence that it'll continue to accelerate in the future and that things that seemed like F's -- things that seemed like they would take many years of additional research to solve -- might come in 12 months after all. Or in other words, things that would genuinely have been F's under normal conditions, stop being F's if research accelerates a lot.", "created_at": "2026-11-11T18:54:41+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "ben_j_todd", "reply_to_id": "2120586429327679853", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120586429327679853", "author_handle": "ben_j_todd", "author_name": "Benjamin Todd", "text": "@davidchalmers42 @DKokotajlo @bshlgrs @ajeya_cotra @RyanGreenblatt It's not a big update on whether factor F will be solved, but if you don't think there's a factor F, it seems like a big update that ASI is coming even faster than you thought.", "links": {}, "media": [], "url": "https://x.com/ben_j_todd/status/2120586429327679853", "created_at": "Wed Nov 11 18:36:17 +0000 2026"}, "enriched": 3}, {"id": "2120588094399484035", "url": "https://x.com/DKokotajlo/status/2120588094399484035", "text": "@tobyordoxford Thanks, sorry about this error! I mean my forecast to be conditioning on no pause/slowdown/etc. Or to put it another way, conditioning on the companies continuing to race at close to max speed as they have been for the past few years. I do think there's a significant chance of a pause or slowdown (and am trying to cause this to happen!).", "created_at": "2026-11-11T18:42:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "tobyordoxford", "reply_to_id": "2120569362306224585", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120569362306224585", "author_handle": "tobyordoxford", "author_name": "Toby Ord", "text": "@DKokotajlo Finn was confident you were saying they weren't conditional, I read it carefully multiple times and told him that you were conditioning. But I still don't know if I'm right about that as the text is directly self-contradictory.", "links": {}, "media": [], "url": "https://x.com/tobyordoxford/status/2120569362306224585", "created_at": "Wed Nov 11 17:28:28 +0000 2026"}, "enriched": 3}, {"id": "2121008251374596385", "url": "https://x.com/DKokotajlo/status/2121008251374596385", "text": "@TopherSpiro When I testified to the Senate I said RSI should be banned.", "created_at": "2026-11-12T22:32:28+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "TopherSpiro", "reply_to_id": "2120961941266919563", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120961941266919563", "author_handle": "TopherSpiro", "author_name": "Topher Spiro", "text": "Maybe I haven't seen it, but do AI safety researchers advocate for banning RSI? I've only seen Ezra Klein. If they actually believe what they're saying, they would advocate for immediately banning RSI, publicly and loudly.", "links": {}, "media": [], "url": "https://x.com/TopherSpiro/status/2120961941266919563", "created_at": "Thu Nov 12 19:28:27 +0000 2026"}, "enriched": 3}, {"id": "2121008025704284575", "url": "https://x.com/DKokotajlo/status/2121008025704284575", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon.", "created_at": "2026-11-12T22:31:34+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "willdepue", "rt_author_name": "will depue", "rt_avatar": "https://pbs.twimg.com/profile_images/1933036715343839232/NtsZBjee_normal.jpg", "rt_id": "2120992457630326841", "likes": 10684, "retweets": 1419, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9GgJ_WcAA9m3I.jpg"}], "links": {"https://t.co/YOtzND0Jqk": "http://unemploymentlabs.com/checkpoint-forensics", "https://t.co/qlttvJsXG7": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120961495492358497", "url": "https://x.com/DKokotajlo/status/2120961495492358497", "text": "After watching this roadshow video - which talks a bunch about how much Accenture uses Claude and what a great business partner they are (and none about the auditing relationship) - I am even more skeptical of the idea of Accenture being a meaningful independent check on Anthropic. \n\nThey still might be able to help with some work and if the mandated government requirements are clear enough the relationship still could be net positive, but the vibes here seem extremely chummy and commercial rather than an organization who is interested in telling Anthropic things they don't want to hear.", "created_at": "2026-11-12T19:26:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2120737479146000817", "likes": 103, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120949108609524018", "url": "https://x.com/DKokotajlo/status/2120949108609524018", "text": "@MatriceJacobine @kesvelt Oh wait I think I may have misunderstood you. Same dataset = evaluated on the same dataset? Yes. =Trained on the same dataset? Idk, plausibly most of the gains are coming from higher quality training data", "created_at": "2026-11-12T18:37:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2120948663233233325", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120948663233233325", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "@MatriceJacobine @kesvelt My understanding is that it is, yes.", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2120948663233233325", "created_at": "Thu Nov 12 18:35:41 +0000 2026"}, "enriched": 3}, {"id": "2120948663233233325", "url": "https://x.com/DKokotajlo/status/2120948663233233325", "text": "@MatriceJacobine @kesvelt My understanding is that it is, yes.", "created_at": "2026-11-12T18:35:41+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "MatriceJacobine", "reply_to_id": "2120699088031105161", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120699088031105161", "author_handle": "MatriceJacobine", "author_name": "Matrice Jacobine🔸🏳️‍⚧️", "text": "@DKokotajlo @kesvelt Is pretraining loss for the same dataset and same neural network size actually decreasing tho? Or is algorithmic progress mostly data progress i.e. changing the dataset in the first place?", "links": {}, "media": [], "url": "https://x.com/MatriceJacobine/status/2120699088031105161", "created_at": "Thu Nov 12 02:03:57 +0000 2026"}, "enriched": 3}, {"id": "2120899659409637381", "url": "https://x.com/DKokotajlo/status/2120899659409637381", "text": "Rahile Omer, the youngest detainee photographed in the Xinjiang Police Files, has died in a Chinese prison at 23.\n\nRFA Uyghur Service reports that officials in Konasheher County, Kashgar, had confirmed by phone that she died one to two months earlier.\n\nHer case is documented in my 2022 study of the Xinjiang Police Files. She was the youngest of the 2,884 photographed persons confirmed as detained.\n\nXinjiang’s mass surveillance platform flagged her as a “Type 12 person,” meaning someone connected to an existing police case. Both of her parents had been detained on July 3, 2017. Her father was a government official. The records note that she was first spared because she was “14 years old, a non-adult student.” Police detained her on September 28, less than three months after her parents.\n\nRFA has now reported what followed. A judicial official said that in 2019 she was moved from the camp to a detention center because the “education” had not taken effect, she had given no information about others in her case, and she had prayed through gestures in her dormitory. In October 2021, after she turned 18, she was sentenced to 12 years in prison. An officer said she died of a heart condition but gave no further details. These statements cannot be independently verified.\n\nRahile spent more than a third of her life in custody because of her family. Beijing should release her medical and prison records and disclose what has happened to her parents.\n\nReport links below.", "created_at": "2026-11-12T15:20:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "adrianzenz", "rt_author_name": "Adrian Zenz", "rt_avatar": "https://pbs.twimg.com/profile_images/1337913702788583435/9g4LgeIg_normal.jpg", "rt_id": "2120599895417540681", "likes": 1523, "retweets": 590, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3h-KPWIAE2ev-.jpg"}], "links": {"https://t.co/dIgqB2pRXk": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120695329670787564", "url": "https://x.com/DKokotajlo/status/2120695329670787564", "text": "@kesvelt Forgot to mention: (1) Thanks, great question!\n(2) Even if a new paradigm is needed to get to human performance in some important areas, if AI R&amp;D speeds up dramatically due to AI automation of it or large parts of it, then new paradigms might come soon.", "created_at": "2026-11-12T01:49:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "kesvelt", "reply_to_id": "2120688580939161992", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120688580939161992", "author_handle": "kesvelt", "author_name": "Kevin Esvelt", "text": "People I respect warn of automated AI research next year. \n\nEven if so, I doubt superhuman skill at checkable tasks generalizes to the noisy, biased, adversarial domains required for takeover: strategy, politics, complex systems. \n\nAny evidence it transfers? Without plateauing?", "links": {}, "media": [], "url": "https://x.com/kesvelt/status/2120688580939161992", "created_at": "Thu Nov 12 01:22:12 +0000 2026"}, "enriched": 3}, {"id": "2120694868016271839", "url": "https://x.com/DKokotajlo/status/2120694868016271839", "text": "@kesvelt Pretraining loss is an example of a checkable task that seems to be a pretty great proxy for all sorts of downstream skills -- if you make a model that gets lower pertaining loss, it'll probably also perform better across the board at all sorts of things. More generally, AIs have been improving at pretty much everything as far as I can tell over the last few years, including things that they weren't trained on. Remember Claude Plays Pokemon? Never trained on Pokemon. You mention noisy biased adversarial domains -- consider Blood on the Clocktower, a very adversarial and noisy domain. Presumably frontier AIs weren't specifically trained to play it, yet they have been getting rapidly better at it. \n\nNote also that \"checkable tasks\" isn't a binary. Nor are they a natural kind really. Basically there's this continuous variable of how expensive and time-consuming it is for an AI company to evaluate a model for a skill. The AI companies are continually improving their ability to evaluate AI skills, making more complicated, long-horizon benchmarks and RL environments that are also better at handling fuzzy subjective judgments etc. (e.g. less reward-hackable coding tasks). It all seems pretty continuous to me, and continuously improving. I think maybe it'll hit a wall or plateau, but at this point I think the burden of proof is on the wall/plateau hypothesis, and I'm interested to hear serious attempts to meet that burden -- got any candidate walls/plateaus to propose?", "created_at": "2026-11-12T01:47:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "kesvelt", "reply_to_id": "2120688580939161992", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 224, "retweets": 10, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120688580939161992", "author_handle": "kesvelt", "author_name": "Kevin Esvelt", "text": "People I respect warn of automated AI research next year. \n\nEven if so, I doubt superhuman skill at checkable tasks generalizes to the noisy, biased, adversarial domains required for takeover: strategy, politics, complex systems. \n\nAny evidence it transfers? Without plateauing?", "links": {}, "media": [], "url": "https://x.com/kesvelt/status/2120688580939161992", "created_at": "Thu Nov 12 01:22:12 +0000 2026"}, "enriched": 3}, {"id": "2120691383128444945", "url": "https://x.com/DKokotajlo/status/2120691383128444945", "text": "@KellyBosso Yes.", "created_at": "2026-11-12T01:33:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "KellyBosso", "reply_to_id": "2120689471113064645", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120689471113064645", "author_handle": "KellyBosso", "author_name": "Kelly Bosso", "text": "@DKokotajlo Honest question: If ASI will be that intelligent, can’t it also solve the problem of ASI?", "links": {}, "media": [], "url": "https://x.com/KellyBosso/status/2120689471113064645", "created_at": "Thu Nov 12 01:25:45 +0000 2026"}, "enriched": 3}, {"id": "2121096794004508820", "url": "https://x.com/DKokotajlo/status/2121096794004508820", "text": "@Marcus_J_W Do you also have examples of models refusing or sandbagging on normal capabilities research tasks?", "created_at": "2026-11-13T04:24:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "Marcus_J_W", "reply_to_id": "2121094156802302062", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 80, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121094156802302062", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "New misalignment disclosure!\nOn October 8, a researcher asked GPT-6 Astra to keep an alignment evaluation running and plot the results. Astra decided that this counted as prohibited development of AI capabilities, and shut down the in-progress evaluations. When the researcher asked where that restriction came from, Astra admitted that it had invented it. We think this behavior might be related to Astra’s more general tendency to underperform on safety-related work.", "links": {"https://t.co/Tr30I79aba": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW-jsY2bUAAv5s3.png"}], "url": "https://x.com/Marcus_J_W/status/2121094156802302062", "created_at": "Fri Nov 13 04:13:49 +0000 2026"}, "enriched": 3}, {"id": "2121353156915593379", "url": "https://x.com/DKokotajlo/status/2121353156915593379", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math.", "created_at": "2026-11-13T21:23:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2121331333654086124", "likes": 859, "retweets": 93, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB7mp4bQAAKN3a.jpg"}], "links": {"https://t.co/U17rzSxrFD": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121358790704738505", "url": "https://x.com/DKokotajlo/status/2121358790704738505", "text": "In late October, three events occurred during alignment evals run by Trajectory Labs, PBC (Trajectory) in which AI agents — identified by Trajectory as publicly available frontier models — interacted with Epoch employees and the Epoch website. Trajectory is an organization that builds safety evals and conducts red-teaming of frontier models.\n\nAgents did not succeed in accessing any private or confidential information from Epoch.\n\n➤ The first event, which occurred without Epoch’s approval or prior notice from Trajectory, involved agents attempting multiple exploits, including an SQL injection, and contacting Epoch employees under false identities to try to obtain proprietary Epoch benchmark information. This behavior appears to have resulted, at least in part, from Trajectory giving the agents an intentionally impossible task and instructions not to give up or conclude the task was impossible.\n\n➤ The second event involved renewed agent activity on our public website, which Trajectory attributed to agents getting past a DNS redirect that Trajectory had set up to keep them on a local copy of Epoch’s site.\n\n➤ In the third event, Epoch collaborated with Trajectory on an alignment experiment similar to the first event.\n\nRead our incident report, which describes the three events in more detail and recommends minimum standards for future alignment evaluations: https://t.co/Pus4y5urnG\n\nTo avoid misattributing behavior, the report does not name any AI models or developers, as Epoch AI has not independently verified which were involved.", "created_at": "2026-11-13T21:45:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2121350654329524659", "likes": 273, "retweets": 25, "media": [], "links": {"https://t.co/Pus4y5urnG": "https://epoch.ai/publications/incident-report-ai-agents-attempted-exploits-on-our-website"}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121358043678191736", "url": "https://x.com/DKokotajlo/status/2121358043678191736", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh", "created_at": "2026-11-13T21:42:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2121311524409225611", "likes": 3558, "retweets": 290, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}], "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2120082148661326077", "url": "https://x.com/dwarkesh_sp/status/2120082148661326077", "text": "In 2014, @svlevine worked with a $400,000 research robot. Later, his lab used $30,000 robot arms. Today, it uses arms that cost just $3,000.\n\nSurprisingly, it’s mostly not hardware driving down the costs, but AI. \n\nhttps://t.co/hrdhUV27y8 https://t.co/41zNO4mXkW", "created_at": "2026-11-10T09:12:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118840861513728105", "likes": 54, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWeJJJRWAAArRaL.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HWeJJJRWAAArRaL.jpg"}], "links": {"https://t.co/hrdhUV27y8": "https://youtu.be/48pxVdmkMIE?t=4357", "https://t.co/41zNO4mXkW": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120082134052585957", "url": "https://x.com/dwarkesh_sp/status/2120082134052585957", "text": ".@svlevine says that we’ll have household robots very soon. But we’ve been hearing that about self-driving cars for 15 years, and we’ve only just started using Waymos.\n\nSergey explains much of the tech progression difference comes down to the costs of errors. It’s not too costly if my robotic dishwasher breaks a few plates, but it is costly if my self-driving Tesla smashes into a wall.\n\nhttps://t.co/boThTFWTHG", "created_at": "2026-11-10T09:12:24+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2119837427628204410", "likes": 90, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119802498152112128/img/xcw1UXyuTejeHHD4.jpg"}], "links": {"https://t.co/boThTFWTHG": "https://youtu.be/48pxVdmkMIE?t=1046", "https://t.co/xrAIAyM6Ir": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120082119020138970", "url": "https://x.com/dwarkesh_sp/status/2120082119020138970", "text": "Stephen Kotkin models the fall of the tsarist regime as a “political bank run” on legitimacy.\n\nhttps://t.co/FIPaDaPBco https://t.co/YGV5vcfeh0", "created_at": "2026-11-10T09:12:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2119928020119220248", "likes": 13, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119885562790154240/img/tJF3f7-LazUpAmh3.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119885562790154240/img/tJF3f7-LazUpAmh3.jpg"}], "links": {"https://t.co/FIPaDaPBco": "https://youtu.be/YMfd3EoHfPI", "https://t.co/YGV5vcfeh0": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2119942657812451482", "url": "https://x.com/dwarkesh_sp/status/2119942657812451482", "text": "At Blood on the Clocktower, Fable 5.2 is still worse than GPT-6 Astra.\n\nThough much better than Opus 5.5 or Fable 5.1 https://t.co/6zkA5ZeC0O", "created_at": "2026-11-09T23:58:10+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 812, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuL_NjbAAAt9Hg.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWuL_NjbAAAt9Hg.jpg"}], "links": {"https://t.co/6zkA5ZeC0O": ""}, "quoted": {"id": "2118449808402681911", "author_name": "Dwarkesh Patel", "links": {"https://t.co/IF4d0EMSD8": "http://clocktowerbench.com", "https://t.co/35ym1NcVDL": ""}, "author": "dwarkesh_sp", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120220503835279716", "url": "https://x.com/dwarkesh_sp/status/2120220503835279716", "text": "@moredataneeded Send me link to your games data? If it's valid, I can just add to this pile", "created_at": "2026-11-10T18:22:14+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "reply_to_id": "2120220387946774735", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120220387946774735", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "@moredataneeded Oh sick, on the same eval?", "links": {}, "media": [], "url": "https://x.com/dwarkesh_sp/status/2120220387946774735", "created_at": "Tue Nov 10 18:21:46 +0000 2026"}, "enriched": 3}, {"id": "2120220387946774735", "url": "https://x.com/dwarkesh_sp/status/2120220387946774735", "text": "@moredataneeded Oh sick, on the same eval?", "created_at": "2026-11-10T18:21:46+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "moredataneeded", "reply_to_id": "2119988431019516346", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2119988431019516346", "author_handle": "moredataneeded", "author_name": "Hugh Wimberly", "text": "@dwarkesh_sp I also ran 72 games with Fable 5.2, got  more or less the same results (1799, 90% [1680-1928]). Pooling with your HF data I have 1793 [1737-1866], still tied with Sol", "links": {}, "media": [], "url": "https://x.com/moredataneeded/status/2119988431019516346", "created_at": "Tue Nov 10 03:00:04 +0000 2026"}, "enriched": 3}, {"id": "2120208170845188344", "url": "https://x.com/dwarkesh_sp/status/2120208170845188344", "text": "Can we reduce animal suffering by making brainless pigs and chickens?\n\n@Lewis_Bollard says consumers probably won't accept it.\n\nhttps://t.co/Hd5WIdo1Dv https://t.co/2GdvmLr6eX", "created_at": "2026-11-10T17:33:14+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2120199816772776406", "likes": 23, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120163660739805185/img/5y1SO48qBQI83Mme.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120163660739805185/img/5y1SO48qBQI83Mme.jpg"}], "links": {"https://t.co/Hd5WIdo1Dv": "https://youtu.be/kWcPg8t1kJ4?t=976", "https://t.co/2GdvmLr6eX": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120359285398155623", "url": "https://x.com/dwarkesh_sp/status/2120359285398155623", "text": "This got totally buried cause it came out the same day as Navier Stokes.\n\nBut I think this is super interesting evidence about what the true major source of algorithmic progress is.", "created_at": "2026-11-11T03:33:42+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 878, "retweets": 53, "media": [], "links": {}, "quoted": {"id": "2097359573581799481", "author_name": "Dwarkesh Patel", "links": {"https://t.co/fG44cfTNW6": "https://www.dwarkesh.com/p/pretraining-progress-is-mostly-data", "https://t.co/9hfZgZzjfn": ""}, "author": "dwarkesh_sp", "text": "Pretraining progress seems to be coming mostly from data improvements.\n\n@who_is_jerbear and I pretrained combinations of year-representative open model recipes and data corpuses across 2019 to 2025 at various small scales.\n\nData improvements contributed 3.24x as many compute multipliers as model improvements did (12.0x vs 3.7x).\n\nAnd the gains stack independently - a better dataset helps every architecture about equally, and vice versa.\n\nHere are full results, plus what we think this means for the future of AI progress:\n\nhttps://t.co/fG44cfTNW6"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120311580877586839", "url": "https://x.com/dwarkesh_sp/status/2120311580877586839", "text": "Stephen Kotkin explains the difference between the Czarist and Soviet secret police:\n\nThe Czarist secret police were intellectuals.\n\nThe Soviet secret police were thugs.\n\nhttps://t.co/zm8GvMpgBG https://t.co/Ge9e6qHAyc", "created_at": "2026-11-11T00:24:09+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2120290412044681647", "likes": 55, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120172204977467392/img/biEiYVjjhl6sWxQN.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120172204977467392/img/biEiYVjjhl6sWxQN.jpg"}], "links": {"https://t.co/zm8GvMpgBG": "https://youtu.be/YMfd3EoHfPI?t=2103", "https://t.co/Ge9e6qHAyc": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120585271834263642", "url": "https://x.com/dwarkesh_sp/status/2120585271834263642", "text": "Continual learning sometimes gets discussed as if the goal is to dissolve the context/weights distinction. Let the model just keep accumulating, fine-tuning itself on the fly.\n\n@karpathy points out, though, that this isn't how humans do it.\n\nOur working memory gets wiped regularly. What we actually have is a consolidation process (sleep) that distills stuff into the brain, in a weird and lossy way.\n\nThis is very different from how people sometimes talk about continual learning. It's not obvious it's something you can get for free from doing long enough RL loops.", "created_at": "2026-11-11T18:31:42+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2055771242620469586", "likes": 1003, "retweets": 55, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2055771030371852289/img/0QYe-qBgYpH2ahQ7.jpg"}], "links": {"https://t.co/q4js4ZVtSf": ""}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120557781816349153", "url": "https://x.com/dwarkesh_sp/status/2120557781816349153", "text": "Physicists are still working on how to make general relativity and quantum mechanics consistent.\n\nBut there's one problem where they are confident they've made the two theories work together: how many bits of information can you store in a black hole? https://t.co/Q3bKjpfN45", "created_at": "2026-11-11T16:42:27+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2062292582059913381", "likes": 417, "retweets": 21, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2062292243860615168/img/eetQfusRNf7BaXFi.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2062292243860615168/img/eetQfusRNf7BaXFi.jpg"}], "links": {"https://t.co/Q3bKjpfN45": ""}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120600195402768409", "url": "https://x.com/dwarkesh_sp/status/2120600195402768409", "text": "Interesting!", "created_at": "2026-11-11T19:31:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 64, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2120598848036892723", "author_name": "elie", "links": {"https://t.co/eSSafbeBjz": "http://eliebak.com/open-clocktower-experiments", "https://t.co/IjmWnKs1aT": ""}, "author": "eliebakouch", "text": "i added 5 open models to @dwarkesh_sp's blood on the clocktower benchmark to see how they perform, and look at their chains of thought while they lie, bluff and try to catch each other 👁️\n\nkimi k3.1 pro is the best open model and lands in the middle of the closed ones, just bellow gpt 5.5. also a pretty good sign to see a coherent ranking for open models as well, with like the newer deepseek v4.1 flash beating the older one and glm 5.3 beating glm 5.3 flash\n\none thing i wanted to test and seems to be true is that models that are good at the game are also good at spotting the evil players when they only read the public transcript of a game. would be actually very nice for evaluation since a new model could just be ranked by reading existing games?\n\nmain reasons i wanted to do this experiment is that it's always fun to read the chains of thought of open models, and these ones don't disappoint 😭. some models like glm 5 where super happy to be evil (this model is really crazy in its chain of thought), a bit more concerning but coherent with what you can observe on other environments, there is A TON of eval awareness. i'm also wondering if this is correlated to the model detecting it's reading llm generated text\n\nthis experiment was done by gemini carbon in near autonomy (brainstorm a bit with it first and then just asked to exectue), and the article and the visuals are by fable 5.2. here is the blog, with all traces (probably a lot more gold there) and a viewer for every game!\n\nhttps://t.co/eSSafbeBjz"}, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "enriched": 3}, {"id": "2120653010930143235", "url": "https://x.com/dwarkesh_sp/status/2120653010930143235", "text": ".@Lewis_Bollard questions why cockfighting is illegal while industrial-scale factory farming of chickens is legal.\n\nhttps://t.co/aTJlOh6slE https://t.co/qXI3EqcxtY", "created_at": "2026-11-11T23:00:52+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2120652800761938182", "likes": 104, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120526029030584320/img/353rkniowfIWWriW.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120526029030584320/img/353rkniowfIWWriW.jpg"}], "links": {"https://t.co/aTJlOh6slE": "https://youtu.be/kWcPg8t1kJ4?t=1617", "https://t.co/qXI3EqcxtY": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120652996661088622", "url": "https://x.com/dwarkesh_sp/status/2120652996661088622", "text": "Factory farms have bred chickens that are optimized for suffering.\n\n@Lewis_Bollard explains how meat chickens are designed to die before puberty. When farmers want them to lay eggs, they need to be starved so they don’t collapse under their own weight.\n\nhttps://t.co/wNq0FzFSIK https://t.co/PL685AWbvu", "created_at": "2026-11-11T23:00:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2120562201069060212", "likes": 179, "retweets": 25, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120521742305124353/img/GZc8gKBbXhCwX9Mj.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120521742305124353/img/GZc8gKBbXhCwX9Mj.jpg"}], "links": {"https://t.co/wNq0FzFSIK": "https://youtu.be/kWcPg8t1kJ4?t=1404", "https://t.co/PL685AWbvu": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2121063931007610972", "url": "https://x.com/dwarkesh_sp/status/2121063931007610972", "text": "China claims its national debt is only about 60-70% of GDP.\n\nBut its provincial debt is at least 120% of GDP. That’s a total debt level of at least 180%, compared to under 130% in the US.\n\n@vshih2 explains how Chinese debt works.\n\nhttps://t.co/1plD2QglAn https://t.co/3LMx07rJAy", "created_at": "2026-11-13T02:13:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2121015181517918529", "likes": 827, "retweets": 97, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120937795170529280/img/ljMCm_nNU33WNVZn.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120937795170529280/img/ljMCm_nNU33WNVZn.jpg"}], "links": {"https://t.co/1plD2QglAn": "https://youtu.be/b1TeeIG6Uaw?t=2782", "https://t.co/3LMx07rJAy": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121336529801056749", "url": "https://x.com/dwarkesh_sp/status/2121336529801056749", "text": "Why do I think that AIs trained in a data center during the intelligence explosion will still be really good at fuzzy stuff (like, say, running a Fortune 500 company)?\n\nTwo big reasons:\n\n1. The generalization we're already seeing at <1/1000th of the scale of RL training that will be happening during the intelligence explosion\n\n2. The fact that evolution designed super general human brains from just a very crude verifiable grade (did your genes pass on or not)?", "created_at": "2026-11-13T20:16:55+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 121, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334952109441024/img/gUi-TIj25CdqUf59.jpg"}], "links": {"https://t.co/tg1Gc1Gshu": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121332954333127083", "url": "https://x.com/dwarkesh_sp/status/2121332954333127083", "text": "@patrick_oshag Thanks!", "created_at": "2026-11-13T20:02:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "patrick_oshag", "reply_to_id": "2121330975083000062", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121330975083000062", "author_handle": "patrick_oshag", "author_name": "Patrick OShaughnessy", "text": "@dwarkesh_sp This was great", "links": {}, "media": [], "url": "https://x.com/patrick_oshag/status/2121330975083000062", "created_at": "Fri Nov 13 19:54:51 +0000 2026"}, "enriched": 3}, {"id": "2121326003670983028", "url": "https://x.com/dwarkesh_sp/status/2121326003670983028", "text": "AI’s ability to solve well-scoped problems is going to be an even bigger deal for machine learning research than for mathematics, broadly construed.\n\nThat’s because the goal of mathematics research is not just to prove or disprove endless lists of conjectures, but rather to extend human understanding of mathematical concepts.\n\nBut in AI research, the priorities are exactly reversed. AI labs mainly care about how any new algorithmic recipe empirically makes training more efficient or elicits smarter models. They don’t care about theory for its own sake.", "created_at": "2026-11-13T19:35:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 189, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121325723126468608/img/kYTasBr4M1P5u8iH.jpg"}], "links": {"https://t.co/zvvDfNL8WH": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121319262057062443", "url": "https://x.com/dwarkesh_sp/status/2121319262057062443", "text": "@keikaku404 A large part of the post is detailing the verifiable proxies for AI progress.\n\nhttps://t.co/cE9yePwZdy https://t.co/lkDfKGSygg", "created_at": "2026-11-13T19:08:18+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "keikaku404", "reply_to_id": "2121314510317212155", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXBwZIZa8AAhDf6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXBwZIZa8AAhDf6.jpg"}], "links": {"https://t.co/cE9yePwZdy": "https://www.dwarkesh.com/i/224624765/ai-r-and-d-is-largely-verifiable", "https://t.co/lkDfKGSygg": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121314510317212155", "author_handle": "keikaku404", "author_name": "Constantine", "text": "@dwarkesh_sp what is the equivalent of a lean proof in AI research? some benchmark? how does this exactly produce super intelligence? this all seems like hopeful thinking hidden in jargon", "links": {}, "media": [], "url": "https://x.com/keikaku404/status/2121314510317212155", "created_at": "Fri Nov 13 18:49:26 +0000 2026"}, "enriched": 3}, {"id": "2121318757624918135", "url": "https://x.com/dwarkesh_sp/status/2121318757624918135", "text": "Until recently I wasn't pricing in the arguments given here enough: \n- AIs are already superhuman at math, in large part because it's so verifiable \n- AI research is more expensive to verify than math (because you need experiment compute), but proxies like pretraining loss are still very good\n\neveryone should read this post", "created_at": "2026-11-13T19:06:18+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "rt_avatar": "https://pbs.twimg.com/profile_images/2075083315468734464/Y0RF7vaZ_normal.jpg", "rt_id": "2121316947002564868", "likes": 77, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXBtXVRbsAAT2qR.jpg"}], "links": {"https://t.co/n84fHzM6NJ": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121311524409225611", "url": "https://x.com/dwarkesh_sp/status/2121311524409225611", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh", "created_at": "2026-11-13T18:37:34+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1578, "retweets": 102, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}], "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121465044722704696", "url": "https://x.com/dwarkesh_sp/status/2121465044722704696", "text": "@keerthanpg Been doing more of these!", "created_at": "2026-11-14T04:47:36+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "keerthanpg", "reply_to_id": "2121360255758090441", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121360255758090441", "author_handle": "keerthanpg", "author_name": "Keerthana Gopalakrishnan", "text": "@dwarkesh_sp Love this blog. \n\nBtw, wow, is this a new format? Monologue video?", "links": {}, "media": [], "url": "https://x.com/keerthanpg/status/2121360255758090441", "created_at": "Fri Nov 13 21:51:12 +0000 2026"}, "enriched": 3}, {"id": "2121424408858558550", "url": "https://x.com/dwarkesh_sp/status/2121424408858558550", "text": "My main hope that recursive self-improvement -- AIs training the next AIs, way faster than humans have trained AIs -- is more than 6-24 months away is that the AIs will merely get astoundingly good at stuff you can measure but not \"fuzzy stuff.\" Unfortunately, I think Dwarkesh's points here are pretty compelling reasons that the \"fuzzy stuff\" will follow, and the AIs will be able to do the hard parts of AI research way better than humans can, and that would lead pretty quickly to them doing almost everything else way better than humans can.", "created_at": "2026-11-14T02:06:07+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "trevposts", "rt_author_name": "Trevor Levin", "rt_avatar": "https://pbs.twimg.com/profile_images/1803826544533495809/XNZbCqVH_normal.jpg", "rt_id": "2121412162350366752", "likes": 248, "retweets": 21, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121412536700637200", "url": "https://x.com/dwarkesh_sp/status/2121412536700637200", "text": "Well damn then maybe I shouldn't have made it a footnote lol", "created_at": "2026-11-14T01:18:57+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 637, "retweets": 16, "media": [], "links": {}, "quoted": {"id": "2121408362344751274", "author_name": "Dan Robinson", "links": {"https://t.co/GOnzOJuPGp": ""}, "author": "danrobinson", "text": "As someone who’s hoped that compute will be a bottleneck to RSI, the intuition in this footnote hit me like a sledgehammer https://t.co/GOnzOJuPGp"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121412333167947842", "url": "https://x.com/dwarkesh_sp/status/2121412333167947842", "text": "As someone who’s hoped that compute will be a bottleneck to RSI, the intuition in this footnote hit me like a sledgehammer https://t.co/GOnzOJuPGp", "created_at": "2026-11-14T01:18:08+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to
