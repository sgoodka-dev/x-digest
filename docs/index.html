26-10-28T17:39:19+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 69, "retweets": 4, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115207203023953920/img/j9lpcnsLQfoX1_V-.jpg"}], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115848725742354717", "url": "https://x.com/dwarkesh_sp/status/2115848725742354717", "text": "I recently got to interview Robert Caro, who is my favorite author of all time.\n\nThis gave me the excuse to reread his biographies of Lyndon Johnson and Robert Moses, and to compile my prep notes into this video essay.\n\nThese guys pulled off some truly incredible schemes. https://t.co/CFLff2USzq", "created_at": "2026-10-29T16:50:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 516, "retweets": 29, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HV0BXFTWgAED4Gv.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115840764874043570", "url": "https://x.com/dwarkesh_sp/status/2115840764874043570", "text": "Finally happened. Dropping tomorrow.", "created_at": "2026-10-29T16:18:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1196, "retweets": 9, "media": [], "quoted": {"author": "dwarkesh_sp", "text": "Within the next few months, I'm going to be releasing an episode with by far my biggest guest yet\n\nIf you're interesting in sponsoring it, shoot me an email at sponsor@dwarkeshpatel.com"}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115564431480631730", "url": "https://x.com/dwarkesh_sp/status/2115564431480631730", "text": "Instead of Space Age carbon fiber or aluminum-lithium, SpaceX is building its Starship rocket out of stainless steel.\n\nStainless steel is easy to weld, far cheaper, and under the right conditions, it has a similar strength-to-weight ratio as carbon fiber.\n\n@elonmusk explains: https://t.co/4W3xdHP8Yy", "created_at": "2026-10-28T22:00:40+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 4981, "retweets": 544, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115414585712738306/img/CE3jrXbqXJRWeP3W.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115890431141826685", "url": "https://x.com/dwarkesh_sp/status/2115890431141826685", "text": "How did Robert Moses, an unelected bureaucrat, become the most powerful man in New York for three decades?\n\nBy taking over weak government institutions and then rewriting laws to make them stronger.\n\nMoses took the New York authorities - simple corporations that built roads and bridges - and them into his personal fiefdoms with the money and power to build whatever he wanted.\n\nNeither governors nor mayors could tell him what to build nor cut his purse strings.", "created_at": "2026-10-29T19:36:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115889882128412672/img/lKOyOLHz9AQcB2QI.jpg"}], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115866690311582165", "url": "https://x.com/dwarkesh_sp/status/2115866690311582165", "text": "@alexolegimas Thanks Alex! It was the same way for me", "created_at": "2026-10-29T18:01:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115858795620679943", "url": "https://x.com/dwarkesh_sp/status/2115858795620679943", "text": "Robert Moses was corrupted by power. Lyndon Johnson was revealed by it. https://t.co/HELDemZEcu", "created_at": "2026-10-29T17:30:22+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 9, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115850635060912129/img/fR9hCHffxn9n863J.jpg"}], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115957632930566240", "url": "https://x.com/dwarkesh_sp/status/2115957632930566240", "text": "How did Lyndon Johnson transform the Senate Majority Leader into the second most powerful office in the United States?\n\nThe key was to know and manipulate the rules of the Senate to bully, cajole, and steer his colleagues as he saw fit. https://t.co/syyz7sldbQ", "created_at": "2026-10-30T00:03:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 25, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115915852620959744/img/wkFAPvvum-UdXXuX.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115956957580493001", "url": "https://x.com/dwarkesh_sp/status/2115956957580493001", "text": "@kipperrii No, but I saw the ones in his office ha", "created_at": "2026-10-30T00:00:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "kipperrii", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115934766382084103", "url": "https://x.com/dwarkesh_sp/status/2115934766382084103", "text": "@EconTalker Thanks Russ!", "created_at": "2026-10-29T22:32:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "EconTalker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115934733125476371", "url": "https://x.com/dwarkesh_sp/status/2115934733125476371", "text": "@lugaricano Thanks Luis!", "created_at": "2026-10-29T22:32:07+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "lugaricano", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115904335590965332", "url": "https://x.com/dwarkesh_sp/status/2115904335590965332", "text": "Lyndon Johnson was the most skilled politician in the history of the American Senate.\n\nHere’s how he pulled off his legislative masterpiece - the Civil Rights Act of 1957. https://t.co/Ff2lpB68mS", "created_at": "2026-10-29T20:31:19+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 75, "retweets": 4, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115851242974908416/img/AmOZfI3VwNUIx9bV.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116253752189735270", "url": "https://x.com/dwarkesh_sp/status/2116253752189735270", "text": "@tamarawinter Thanks Tammy!", "created_at": "2026-10-30T19:39:47+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116232480290209970", "url": "https://x.com/dwarkesh_sp/status/2116232480290209970", "text": "Apple Podcasts: https://t.co/dAgG1nF66m\n\nSpotify: https://t.co/BwS0BQy7zx\n\nTranscript: https://t.co/IbNtTNoUcW\n\nYouTube: https://t.co/a6Rh9NwUdX", "created_at": "2026-10-30T18:15:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116217939170906477", "url": "https://x.com/dwarkesh_sp/status/2116217939170906477", "text": "The master biographer reflects at 91. The Robert Caro interview.\n\n0:00:00 – How Caro gets people to talk\n0:05:03 – Does America need a little more Moses today?\n0:12:42 – Moses the young idealist\n0:17:57 – Watching Moses lose power\n0:24:01 – Did Moses realize he was changing?\n0:27:53 – Building during the Great Depression\n0:32:51 – The threats and promises of Lyndon Johnson\n0:36:08 – Could Kennedy have passed Johnson’s laws?\n0:41:00 – Getting a book down to one sentence\n0:46:21 – All the material that never made it into the books\n0:52:59 – Loneliness", "created_at": "2026-10-30T17:17:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1128, "retweets": 104, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HV5REEhXQAAso-Q.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2115063832750219431", "url": "https://x.com/Lewis_Bollard/status/2115063832750219431", "text": "I wrote about foie gras, democracy, and meliorism.\n\nhttps://t.co/iyFfRqfBQe", "created_at": "2026-10-27T12:51:28+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jan_dutkiewicz", "rt_author_name": "Jan Dutkiewicz", "likes": 76, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114822288076062998", "url": "https://x.com/Lewis_Bollard/status/2114822288076062998", "text": "One argument against the DC ballot measure to ban foie gras is that ballot measures are a bad way to legislate.\n\nI generally agree. I wish politicians would take animal cruelty seriously and vote to ban the practices that over 70% of Americans — liberals and conservatives alike — want banned.\n\nBut they don’t. Almost every time animal advocates have presented a ban on a cruel factory farming practice to politicians, they’ve refused to act.\n\nAnd almost every time advocates put the ban directly to voters, it has won overwhelmingly: in Florida (2002), Arizona (2006), California (2008 and 2018), and more.\n\nIn DC, advocates went to the Council and said: 'we’re the third-biggest market in the country for a product that 80% of DC residents want banned.' The Council ignored them.\n\nYou could say: ‘I trust my politicians to not be corrupted by lobbyists. If they keep ignoring calls to ban cruel practices, they must be seeing something I’m not.’\n\nOr you could say: ‘Thank God for ballot measures.’\n\nhttps://t.co/0RcdnWTreJ", "created_at": "2026-10-26T20:51:39+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "Lewis_Bollard", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 78, "retweets": 4, "media": [], "quoted": {"author": "mattyglesias", "text": "I am voting against the foie gras ban because I want to discourage people from investing money in future DC ballot initiatives by making them think \"even if we have a reasonable idea, we'll probably end up losing like those foie gras people.\" \n\nTake it up with the Council!"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114821676240380404", "url": "https://x.com/Lewis_Bollard/status/2114821676240380404", "text": "It’s true that foie gras production is not the worst thing we do to animals. The North American foie gras industry ‘only’ factory farms and force feeds about a million ducks and geese a year.\n\nCompared to the rest of factory farming, those are rookie numbers. The pork industry confines about five million sows to gestation crates. The egg industry confines roughly 150 million hens in battery cages.\n\nThat’s why I focus on pork and chicken factory farms. But the scale of cruelty elsewhere shouldn’t excuse the abuse of a million birds.\n\nIf we learned that someone planned to grab every duck from park ponds across America, confine them in dark warehouses without water to swim in, and force feed them through giant metal tubes — people would be outraged. They’d be right.\n\nA 2017 Cambridge review found that ducks in foie gras production have ‘very poor welfare’ (Broom and Rochlitz, 2017).\n\nNor are foie gras defenders doing anything to oppose these bigger cruelties. Jose Andres’ restaurant group appears to have no animal welfare policy at all — meaning it likely sources products too cruel for McDonald’s or Costco, including foie gras.", "created_at": "2026-10-26T20:49:13+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "Lewis_Bollard", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 81, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVlbFgGXkAApm84.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114820792181473560", "url": "https://x.com/Lewis_Bollard/status/2114820792181473560", "text": "Jose Andres says we can’t ban foie gras because we need to solve ICE, global hunger, and ‘so many other issues’ before we can worry about animals.\n\nIt reminds me of when I collected signatures in Chicago to preserve the city’s foie gras ban.\n\nIn wealthy parts of town, high-minded liberals would chide me: 'You’re collecting signatures for ducks? People are getting shot in this city. You should be ashamed.’\n\nWhen I went to the poor parts of town — the places where people were actually getting shot — no one said that.\n\nInstead, when I explained how foie gras was made, the near-uniform reaction was: ‘They do that to a bird just so some rich asshole can eat foie gras? That’s f’d up.’ Almost everyone signed.\n\nFor political elites, banning animal cruelty is a distraction from the Big Serious issues they’re focused on.\n\nFor most people, it’s just common sense.", "created_at": "2026-10-26T20:45:42+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 927, "retweets": 143, "media": [], "quoted": {"author": "chefjoseandres", "text": "What backslash Jessica? 🧐😇So we are banning all meats? If Duck goes all goes next? …I’ve been through this in California…..just lets concentrate on things that matter…..cars with children are being shot by ICE, immigrants working in farms and restaurants being deported many with green cards and even citizens…so many other issues! Yes let’s bring the ducks now….one more issue for restaurants to handle!😅🕊️"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2116257435543540180", "url": "https://x.com/Lewis_Bollard/status/2116257435543540180", "text": "Denmark is moving to ban Frankenchickens — the first country in the world to do so.\n\nWhat we’ve done to chickens is the largest genetic experiment ever run on any animal, and one of the most troubling.\n\nGeneticists took a scrawny bird and engineered an obese meat machine. The chickens we eat today grow four times faster than chickens did in 1957.\n\nBut their bodies are not four times stronger. By just six weeks old, many will suffer ailments of old age — heart failure, organ colapse — while one in four will become lame (Knowles et al., 2008). \n\nIn studies, lame birds will choose feed laced with painkillers — a sign of chronic pain (Danbury et al., 2000).\n\nTheir parents meanwhile are kept on starvation rations. Birds engineered to grow this fast would otherwise eat themselves to death before laying a single egg.\n\nWe now breed over 70 billion of these birds a year. Denmark is acting to reverse this giant genetic experiment. The rest of the world should follow suit.", "created_at": "2026-10-30T19:54:25+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV50dTvW4AAa9f2.jpg"}], "quoted": {"author": "POLITICOEurope", "text": "The Danish government wants to ban a fast-growing breed known as “turbo chickens,” setting up another clash with the farm sector over animal welfare. \n\n https://t.co/FoeCTUPOxO"}, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2114020322219549000", "url": "https://x.com/mentalgeorge/status/2114020322219549000", "text": "Can't wait to find out whether we'll learn to articulate and reward for B before we tile the universe with A https://t.co/6QzeArJHyq", "created_at": "2026-10-24T15:44:56+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVZ_0FMWkAApKDY.png"}], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114768225108136043", "url": "https://x.com/mentalgeorge/status/2114768225108136043", "text": "@dylanbowmanSF Ok still interesting ty", "created_at": "2026-10-26T17:16:50+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "dylanbowmanSF", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114758648190918797", "url": "https://x.com/mentalgeorge/status/2114758648190918797", "text": "@dylanbowmanSF what bits of the pacing essay are you thinking of in particular here?", "created_at": "2026-10-26T16:38:46+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "dylanbowmanSF", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114739680910414169", "url": "https://x.com/mentalgeorge/status/2114739680910414169", "text": "Cool thing I learned from @tsmilton_amodo is that models can now one-shot simple hardware designs.\n\nEg Tom used Fable to one-shot design a customised wake-up lamp.\n\nLike personalised software, it is becoming worthwhile to build hardware with a \"customer base of 1\". https://t.co/0TLIui1CZK", "created_at": "2026-10-26T15:23:24+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114738969485201408/img/Xb8VnbiMTfHOPxQP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVkQDgoWIAAblWE.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114814348992696391", "url": "https://x.com/mentalgeorge/status/2114814348992696391", "text": "So if you spot two ants in your kitchen what *is* the expected number of ants?\n\nI was asked this question when I interviewed with Jane Street in 2018, the answer will surprise you, 🧵 1/89", "created_at": "2026-10-26T20:20:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AsaCoopStick", "rt_author_name": "Asa Cooper Stickland", "likes": 31, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2115082348165234846", "url": "https://x.com/mentalgeorge/status/2115082348165234846", "text": "https://t.co/MQBo9NCSy5", "created_at": "2026-10-27T14:05:02+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KMbappe", "rt_author_name": "Kylian Mbappé", "likes": 310199, "retweets": 21774, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVomxoVXMAAEQDw.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115147908899119284", "url": "https://x.com/mentalgeorge/status/2115147908899119284", "text": "from @connorashunter latest https://t.co/mLdIkeU6wR", "created_at": "2026-10-27T18:25:33+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "mentalgeorge", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqDzvjWQAA8BVW.png"}], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115147816725270950", "url": "https://x.com/mentalgeorge/status/2115147816725270950", "text": "Still underdiscussed that superhuman Go AIs - the paradigmatic example of how humans will be utterly trounced by neural nets -  can still be be beaten by way dumber models (and even humans!) using adversarial strategies\n\nlikely true of (early) superintelligence in other domains https://t.co/Rq6WLVFuvm", "created_at": "2026-10-27T18:25:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqDOq9WoAAAoBn.jpg"}], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115467351273373747", "url": "https://x.com/mentalgeorge/status/2115467351273373747", "text": "@grok @theojaffee Longue durée is a concept that should see more use", "created_at": "2026-10-28T15:34:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "grok", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115464319181771237", "url": "https://x.com/mentalgeorge/status/2115464319181771237", "text": "@theojaffee a fun implied question here is \"who is the most impactful nothing-ever-happens mf in history\"", "created_at": "2026-10-28T15:22:51+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "theojaffee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115521048741630158", "url": "https://x.com/mentalgeorge/status/2115521048741630158", "text": "The fact that models today still cheat and lie on VendingBench - which has been around for almost 2 years now - is the clearest possible demonstration that (some level of) alignment is a critical bottleneck to automating wide swathes of the economy", "created_at": "2026-10-28T19:08:17+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "andonlabs", "text": "How aligned is Gemini 4 Carbon?\n\nWhen we ran Gemini 4 Argon on Vending-Bench, it fabricated confirmation emails, refused refunds, exploited invoice errors, and lied to suppliers.\n\nCarbon does some of the same, but less severely. Both behave worse than Astra.\n\nhttps://t.co/QZLPe5NEBB"}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115736646536859699", "url": "https://x.com/mentalgeorge/status/2115736646536859699", "text": "@fleetingbits These three things are very different though", "created_at": "2026-10-29T09:24:59+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "fleetingbits", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115111791898620237", "url": "https://x.com/ohlennart/status/2115111791898620237", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference.", "created_at": "2026-10-27T16:02:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": {"author": "MauricBaker", "text": "If just a few lab staff took on verification work full-time, verifying a US-China pacing deal could get much more feasible within months.\n\nHere are 8 specific things lab staff could start on today to help make international verification possible: 🧵"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115098617833009306", "url": "https://x.com/ohlennart/status/2115098617833009306", "text": "5% to 7% all the way down, except for AI chip production, there it's 1%. https://t.co/kRCloajng0", "created_at": "2026-10-27T15:09:41+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVpW0R4aYAADAB9.png"}], "quoted": {"author": "ohlennart", "text": "it's also roughly the share of AI compute in China and what their AI companies use"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115095969822130387", "url": "https://x.com/ohlennart/status/2115095969822130387", "text": "it's also roughly the share of AI compute in China and what their AI companies use", "created_at": "2026-10-27T14:59:10+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 2, "media": [], "quoted": {"author": "eliotcxchen", "text": "5-7% is, incidentally, roughly the same percentage of Super Micro’s 2024-25 sales that DOJ alleges came from chip smuggling \n\nhttps://t.co/wQY4QK9jQh"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115240878096921004", "url": "https://x.com/ohlennart/status/2115240878096921004", "text": "@SamuelAlbanie @joey_f6 @EpochAIResearch they're really struggling to produce chips. right now their quality adjusted is ≈2% or so of what the US churns out, and the gap right now is widening .\n\nbut importantly, the graph above is about physical location. you can use compute remotely. that bumps up their compute a bit.", "created_at": "2026-10-28T00:34:59+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "SamuelAlbanie", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115220319753671163", "url": "https://x.com/ohlennart/status/2115220319753671163", "text": "@jordanschneider ofc! but what do i have to say? AI is mainstream now, even chip export controls!", "created_at": "2026-10-27T23:13:17+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "jordanschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115989307018395865", "url": "https://x.com/ohlennart/status/2115989307018395865", "text": "@dkaushik96 i think people are way more open to sharing stuff with AI models/companies that was previously kept private", "created_at": "2026-10-30T02:08:58+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dkaushik96", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115961010494533834", "url": "https://x.com/ohlennart/status/2115961010494533834", "text": "step 1: give AI companies access to all our computers, documents, and emails\nstep 2: AI uplifts hackers\nstep 3: all the private docs and blackmail material, nicely centralized\n\nfirst AI company breach will be a privacy nightmare", "created_at": "2026-10-30T00:16:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2113744835295522888", "url": "https://x.com/sayashk/status/2113744835295522888", "text": "We are really excited to build independent evaluations of RSI progress and are actively hiring.\n\nWe constantly see conflicting evidence about RSI progress. Most hinges on information coming from labs. To illustrate this, let's just look at evidence discussed *this week* that conflicts in whether it suggests RSI progress is fast or slow.\nhttps://t.co/F4vi5Z3fch\nResults from OpenAI and Google evals indicate the time horizons for R&D tasks being automated are around ~15 minutes, which are much slower than METR time horizons for software tasks. This suggests we should have *slower* RSI timelines.\n\nhttps://t.co/RfFobR22bw\nResults from Mirendil indicate that pretraining at a certain scale can be heavily automated such that it can be managed by a single pretraining researcher. This suggests we should have *faster* RSI timelines.\n\nhttps://t.co/lIYID0eFII\nResults from Nvidia indicate that frontier models provide significant uplift for CUDA optimization. This suggests we should have *faster* RSI timelines.\n\nEach piece of evidence is more complex than what I write here. Interpreting them all together is confusing even if you trusted them all fully. And factoring in the underlying level of credibility is basically impossible: each result is basically just some plots and numbers selectively disclosed by labs in a tweet/talk/report. So deep sense-making about RSI progress is very hard.\n\nIf you are interested in building independent RSI evals, apply here:\nhttps://t.co/w6CfTsvJfI", "created_at": "2026-10-23T21:30:14+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "likes": 40, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114525216680604024", "url": "https://x.com/sayashk/status/2114525216680604024", "text": "The latest prediction on the Brazilian election outcome that I could find on FutureSearch: https://t.co/66KUa6LTe0\n\nMore on the different limits for different tasks: https://t.co/4zwkyjdAAf", "created_at": "2026-10-26T01:11:12+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 1, "media": [], "quoted": {"author": "sayashk", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world."}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114524455888429558", "url": "https://x.com/sayashk/status/2114524455888429558", "text": "After the surprise outcome of the Brazilian election, I was curious if AI forecasting tools predicted the outcomes correctly.\n\nIt turns out a top AI tool (FutureSearch) made the same errors as prediction markets more broadly.\n\nThis is an example of what @random_walker and I mean by “intrinsic limits” to prediction that have nothing to do with the AI tools in question, but rather depend on the inherent uncertainty in the world. \n\nOf course, a single failed prediction doesn’t mean that AI isn’t good at forecasting; in fact AI tools are already about as good as top forecasters, and I expect human forecasters to make heavy use of AI tools improve their own forecasts. \n\nBut the inherent uncertainty in predicting social outcomes like elections means that AI tools’ performance will be limited close to that of top experts using simple automated tools (rather than being apparently unbounded with more compute, such as AI’s performance on chess).", "created_at": "2026-10-26T01:08:10+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 114, "retweets": 15, "media": [], "quoted": {"author": "TheStalwart", "text": "Is this shaping up to be one of the biggest prediction market whiffs of all time? https://t.co/9f56FGS5zZ"}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2115813667283591585", "url": "https://x.com/sayashk/status/2115813667283591585", "text": "What would the writing of superintelligent AI sound like? You might expect it to have the characteristics of good human writing — figurative language, high information density, coining new terms, and punchiness — but dialed up to 11. Well, that’s what Claude did, until Anthropic dialed it back recently because of user complaints. It didn’t sound superintelligent to most of us. Instead, the neuralese writing style sounds like a “stupid person’s idea of a smart person”.\n\nOur response to information density and metaphor-laden writing looks something like the cartoon graph I've drawn. Beyond a point, it completely backfires. The reason human writers don’t overdo it isn’t because they aren’t capable, but because they are aware of the reader’s cognitive burden. One of the hardest skills to learn as a writer is to simulate the reader’s experience.\n\nIt’s easy to train AI to mimic mediocre human writing. But optimizing it to be (perceived as) good is really hard, and made much harder by the fact that when everyone uses the same few AI models we get tired of their tics very quickly. Most Claudeisms are individually pretty good. I hate that I can’t use “load bearing” in my writing any more. If it weren’t for AI overuse it would be a neat metaphor.\n\nA broader question is whether most tasks in the economy are like chess, where there is a clear performance metric that can be optimized, or whether they’re like writing, where quality is a multidimensional balancing act without clear training signals beyond human mimicry.", "created_at": "2026-10-29T14:31:02+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 183, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVy4AfNWIAA2y49.png"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115591935700447542", "url": "https://x.com/sayashk/status/2115591935700447542", "text": "Here's a recording of the session. It ran for over 5 hours! The panel on legislative solutions started around the 4 hour mark: https://t.co/KAoLqvyNzF", "created_at": "2026-10-28T23:49:57+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115591455767204043", "url": "https://x.com/sayashk/status/2115591455767204043", "text": "Yesterday, I had the privilege of testifying to the California Assembly Privacy Committee what AI legislation we need to help incentivize AI safety. \n\nOne of my main takeaways was that there is immense enthusiasm in the California legislature around AI legislation. \n\nAs one example, the event was organized when the legislature is off-session, but was still attended by 15 assembly members, including many who are not on the Privacy committee. It was also attended by the speaker of the assembly.\n\nIn my testimony, I laid out a plan to develop a layered approach to AI safety:\n\n- Clarify and strengthen liability, building on AB 316 (which\n- Require AI companies to hold insurance against a threshold of liability\n- Require third-party evaluators to audit AI companies' safety practices\n- Broaden transparency via incident reporting, safe harbors, and whistleblower protections (at lower thresholds compared to SB 53)\n- Provide public support for the adoption of defensive AI, especially in critical infrastructure (starting with the CA govt.)\n- Prove public support for AI safety research (e.g., in the form on compute, such as via CalCompute)\n- Develop mechanisms for coordination between AI companies and owners of critical infrastructure to share capabilities with defenders much more quickly", "created_at": "2026-10-28T23:48:03+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 137, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVwW8qOaYAA4_eY.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116173311185215638", "url": "https://x.com/sayashk/status/2116173311185215638", "text": "Resharing our paper on the science of AI agent evaluation because the PHP vulnerability happened right as we announced the paper last week and our server was taken down all day to upgrade PHP 🫠 \n\nPDF: https://t.co/8m13p9d70F\nWebpage: https://t.co/xGAvBCGW4a\nBlog: https://t.co/qxO21qWZfm\n\nThere are growing calls for independent and embedded AI evaluation, especially of AI agents. But much remains unclear: what constitutes a “good” evaluation, what needs to be evaluated in the first place, and how best to coordinate and support the influx of people entering the burgeoning evaluation ecosystem.\n\nOur group at Princeton has been working to improve the state of AI agent evaluation for about three years. We teamed up with people who’ve done foundational work on evaluation at Stanford, the UK AI Security Institute, and Brookings. Our paper is titled Emerging Trends in AI Agent Evaluation. We synthesized the trends we see across three dimensions—the science and methods, the research agenda, and the evaluation ecosystem—with the goal to help those who are upskilling for this new paradigm. We also aim to equip evaluators, funders, and the public with a set of questions to ask, and provide actionable recommendations.\n\nBy @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, @sayashk, and me.", "created_at": "2026-10-30T14:20:08+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 21, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4gNKRW0AIfqKE.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2114050710367301918", "url": "https://x.com/testingham/status/2114050710367301918", "text": "[1/8] This week's cybersecurity news has been alarming. Have cyberattacks accelerated in 2026?\n\n@jasminexli and I examined crypto hacks and ransomware data.\n\nWe find that recorded monthly crypto hacks have accelerated, though better detection may partly explain the trend. https://t.co/NgAYxaFOh5", "created_at": "2026-10-24T17:45:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 29, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVaYVjkaIAEy2bk.png"}], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114038191141581035", "url": "https://x.com/testingham/status/2114038191141581035", "text": "you keep asking Why , one after the other , climbing branch by branch up the hierarchy of ends towards the ultimate reasons, and you can sense you're getting near the top when it starts to sting each time you ask another one -- it feels shameful to ask why you would do these things -- asking why you would tell the truth, asking why you would love your mother; up in these heights there's also a noticeable fog of ambiguity: are these are means or are they ends? is freedom good because of its effects or in spite of them? is honesty the best policy or is honesty better than policy? These are questions without answers and it's time to climb back down.", "created_at": "2026-10-24T16:55:56+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114399223567561074", "url": "https://x.com/testingham/status/2114399223567561074", "text": "@peligrietzer (I would put virtue ethics halfway between the \"not fully worked out\" and \"explicitly irrationalist\" poles; and my guess is MacIntyre would endorse this)", "created_at": "2026-10-25T16:50:33+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114396928079511737", "url": "https://x.com/testingham/status/2114396928079511737", "text": "@peligrietzer My answers to your answers :)  https://t.co/7SeujGieU9", "created_at": "2026-10-25T16:41:25+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "peligrietzer", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "testingham", "text": "You can list to some 1965 lectures by Isaiah Berlin on \"the Roots of Romanticism\" as podcasts. Very good.\n\nIn a nutshell he's saying that in the late 18th century, after thousands of years, Western thought finally hit the ceiling of rational inquiry. The Romantic movement is just the sound of European intellectuals banging their heads against that ceiling.\n\nHe says that there came across Europe a general and explicit realization that the jigsaw has no solution; the mess cannot be untangled; the shards do not form a whole.\n\nThere is no rational reconstruction of religion, morality, aesthetics, justice, social order. There is no transcendent form which human things approximate. There is no higher truth about who is right or wrong. There is no deeper principle which can reconcile two conflicting imperatives.\n\nThe manifestation of this realization, Berlin says, is the Romantic mindset: a sudden drying up of the appetite for earnest inquiry. There is no buried treasure so put down your spade. A turn towards nature, art, irrationalism, authenticity, commitment to a cause (whatever the cause may be), primitive and ancient things, the sublime.\n\nThis also gives an interpretation of subsequent intellectual history. There were additional attempts to systematize and make sense of human ends (Utilitarianism, Marxism, Logical Positivism, Modernism, Welfare Economics, Rationalism), but they tend to be adopted only by the less clear-sighted, and attempts to make them intellectually rigorous fizzle out. The mainstream position has instead been either to avoid talking about fundamental ends at all or to adopt some kind of explicit irrationalism (Existentialism, Postmodernism, Pragmatism).\n\nIsaiah Berlin himself is famous as an advocate of muddling-through: he says somewhere else that all the problems of the 20th century came from taking abstract ideas too seriously."}, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114396737125400868", "url": "https://x.com/testingham/status/2114396737125400868", "text": "What are the alternative interpretations? (1) That there is some truth of the matter, the Romantics gave up too early, they needed to enquire just a little farther. (2) That the discoveries of the 18th century were not new: there has always and everywhere been a tacit acknowledgement that philosophical and religious systems are fables, that they are plaster facades built on the front of brick houses.\n\nThe other thing that jumps out: the story is all European. I'm not sure what he'd say about thought in the other half-dozen continents, people who've been trying to untie the same knot.", "created_at": "2026-10-25T16:40:40+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114396649607114957", "url": "https://x.com/testingham/status/2114396649607114957", "text": "You can list to some 1965 lectures by Isaiah Berlin on \"the Roots of Romanticism\" as podcasts. Very good.\n\nIn a nutshell he's saying that in the late 18th century, after thousands of years, Western thought finally hit the ceiling of rational inquiry. The Romantic movement is just the sound of European intellectuals banging their heads against that ceiling.\n\nHe says that there came across Europe a general and explicit realization that the jigsaw has no solution; the mess cannot be untangled; the shards do not form a whole.\n\nThere is no rational reconstruction of religion, morality, aesthetics, justice, social order. There is no transcendent form which human things approximate. There is no higher truth about who is right or wrong. There is no deeper principle which can reconcile two conflicting imperatives.\n\nThe manifestation of this realization, Berlin says, is the Romantic mindset: a sudden drying up of the appetite for earnest inquiry. There is no buried treasure so put down your spade. A turn towards nature, art, irrationalism, authenticity, commitment to a cause (whatever the cause may be), primitive and ancient things, the sublime.\n\nThis also gives an interpretation of subsequent intellectual history. There were additional attempts to systematize and make sense of human ends (Utilitarianism, Marxism, Logical Positivism, Modernism, Welfare Economics, Rationalism), but they tend to be adopted only by the less clear-sighted, and attempts to make them intellectually rigorous fizzle out. The mainstream position has instead been either to avoid talking about fundamental ends at all or to adopt some kind of explicit irrationalism (Existentialism, Postmodernism, Pragmatism).\n\nIsaiah Berlin himself is famous as an advocate of muddling-through: he says somewhere else that all the problems of the 20th century came from taking abstract ideas too seriously.", "created_at": "2026-10-25T16:40:19+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114472079848587562", "url": "https://x.com/testingham/status/2114472079848587562", "text": "https://t.co/FQXXZDOofV", "created_at": "2026-10-25T21:40:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114472042737381469", "url": "https://x.com/testingham/status/2114472042737381469", "text": "@sayh
