//t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh", "created_at": "2026-11-13T21:42:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2121311524409225611", "likes": 3558, "retweets": 290, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}], "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2122004968727347238", "url": "https://x.com/DKokotajlo/status/2122004968727347238", "text": "\"They are saying that recursive self-improvement has kicked in, despite the obvious safety problems with that. Recursive self-improvement is the most dangerous thing anybody can be working on\" -- DAVID SACKS", "created_at": "2026-11-15T16:33:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2121788689575514444", "likes": 427, "retweets": 48, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2122004140054466579", "url": "https://x.com/DKokotajlo/status/2122004140054466579", "text": "@jay_douglass I work at a frontier lab, we do not know how to reliably instil values into the AIs, this is the scientific consensus", "created_at": "2026-11-15T16:29:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2121769503247741117", "likes": 662, "retweets": 69, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "enriched": 3}, {"id": "2122339195607998525", "url": "https://x.com/DKokotajlo/status/2122339195607998525", "text": "@AgustinLebron3 @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol Re: \"mention\" We were supposed to pick one thing, so we didn't have space to canvas all the possibilities. Speaking for myself at least I thought of the one thing that most weighed on me, the one way I could be wrong that kept me up at night and seemed most plausible to me so to speak, the one I had the least good rebuttals to. I imagine a similar thought process went through the minds of the others. We spend so much time debating skeptics who think ASI is far away, but so little time seriously considering the possibility that it's closer than even we expect, despite the fact that even we are continually surprised by the pace of progress...", "created_at": "2026-11-16T14:41:10+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "AgustinLebron3", "reply_to_id": "2122318307084648915", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2122318307084648915", "author_handle": "AgustinLebron3", "author_name": "Agustin Lebron", "text": "@DKokotajlo @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol (\"consider\" was presumptuous by me, perhaps \"mention\" would have been more respectful)", "links": {}, "media": [], "url": "https://x.com/AgustinLebron3/status/2122318307084648915", "created_at": "Mon Nov 16 13:18:09 +0000 2026"}, "enriched": 3}, {"id": "2122338505905025172", "url": "https://x.com/DKokotajlo/status/2122338505905025172", "text": "@AgustinLebron3 @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol There are lots of variants of it. For example you could generate variants by taking the AI Futures Model and setting parameters to values that cause AI timelines to be a lot longer than my median expectation. Or, thinking outside the model, perhaps it'll turn out that the entire AI industry is suffering a sort of collective AI psychosis and that the models aren't nearly as smart as they seem and that a lot of the apparent progress is illusory or literally faked. Or perhaps it'll turn out that data-efficient learning is plateauing (contra rumors) and that we need a big new paradigm shift to get to it (contra my expectations, because it seems to me like something that can be hill-climbed) and that current AIs lack the creativity and insight needed to significantly speed up progress towards that paradigm shift. Or perhaps there'll be a war or major depression or something and AI industry Capex will dry up and we'll get another AI winter that somehow lasts decades.", "created_at": "2026-11-16T14:38:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "AgustinLebron3", "reply_to_id": "2122318159029968966", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2122318159029968966", "author_handle": "AgustinLebron3", "author_name": "Agustin Lebron", "text": "@DKokotajlo @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol If you're willing: even if unlikely, what does that possibility look like?", "links": {}, "media": [], "url": "https://x.com/AgustinLebron3/status/2122318159029968966", "created_at": "Mon Nov 16 13:17:34 +0000 2026"}, "enriched": 3}, {"id": "2122337182753103973", "url": "https://x.com/DKokotajlo/status/2122337182753103973", "text": "@thinkingshivers What? Wouldn't this problem be way worse without the quantified predictions? Then people could say \"I just said it was possible, I didn't say it was definitely going to happen\" when proven wrong. The quantified predictions make it possible to grade fairly; it would be great if more people made quantified predictions.", "created_at": "2026-11-16T14:33:10+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "thinkingshivers", "reply_to_id": "2122071336512331922", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 59, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2122071336512331922", "author_handle": "thinkingshivers", "author_name": "Shivers", "text": "I like the rationalist \"quantify your beliefs\" gimmick, where you assign probabilities to predictions.\n\nBut I'm starting to wonder if it's just a way to fearmonger without consequences. So in a year when nothing happens, they can just say \"well, I said it was only 1 in 3.\"", "links": {}, "media": [], "url": "https://x.com/thinkingshivers/status/2122071336512331922", "created_at": "Sun Nov 15 20:56:47 +0000 2026"}, "enriched": 3}, {"id": "2122332797906100701", "url": "https://x.com/DKokotajlo/status/2122332797906100701", "text": "@Aging_Scientist @jeremiecharris Yes, you want your models to be smart, which means they'll be eval aware.\n\nBut you have to grapple with the fact that therefore your usual means of evaluating alignment don't work.\n\nIt's like trying to screen for terrorists or spies by having a questionnaire asking \"Are you a terrorist or spy?\" Not a reliable screening mechanism.\n\nWe haven't solved alignment yet; how on earth are we supposed to solve it if we can't evaluate whether an AI is aligned? Perhaps some excellent theory / a priori reasoning can be done... but needless to say we are not close to succeeding at that.", "created_at": "2026-11-16T14:15:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "Aging_Scientist", "reply_to_id": "2121800667597795500", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2121800667597795500", "author_handle": "Aging_Scientist", "author_name": "Kamil Pabis", "text": "@jeremiecharris 2) This argument strikes me as highly misguided. Of course you want models to be eval aware, just like humans! If I tell you to shoot the guy in counter strike. You do it, great mate. If I tell you to shoot the guy. You do it, you and I go to prison. \n\nAn agent that isn't eval aware cannot be useful in the real world. You deploy, test, and then you build on architectures and training recipes that show alignment in the real world, not in the simulation.", "links": {}, "media": [], "url": "https://x.com/Aging_Scientist/status/2121800667597795500", "created_at": "Sun Nov 15 03:01:14 +0000 2026"}, "enriched": 3}, {"id": "2122316357450727611", "url": "https://x.com/DKokotajlo/status/2122316357450727611", "text": "A comment from Paul, yesterday. Notice the part about @allTheYud at the bottom. https://t.co/Eqyq5CTvN5", "created_at": "2026-11-16T13:10:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "JacquesThibs", "rt_author_name": "Jacques", "rt_avatar": "https://pbs.twimg.com/profile_images/1913293333247455232/RyrZAaae_normal.jpg", "rt_id": "2122193603694891125", "likes": 154, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXOLh-PXsAACEo0.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXOLh-PXsAACEo0.png"}], "links": {"https://t.co/Eqyq5CTvN5": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122315982324760595", "url": "https://x.com/DKokotajlo/status/2122315982324760595", "text": "@AgustinLebron3 @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol We already considered that possibility a lot. It seemed less likely than the opposite possibility.", "created_at": "2026-11-16T13:08:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "AgustinLebron3", "reply_to_id": "2122050701257798074", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2122050701257798074", "author_handle": "AgustinLebron3", "author_name": "Agustin Lebron", "text": "@mbacarella @yminsky @RyanGreenblatt @DKokotajlo @EgeErdil2 @Jsevillamol Yes, but they're literally talking about a wholesale revolution in how economies function.\n\nWouldn't it be sensible, when asked \"if you're wrong, what happened\" to at least consider the possibility that the wholesale revolution didn't happen?", "links": {}, "media": [], "url": "https://x.com/AgustinLebron3/status/2122050701257798074", "created_at": "Sun Nov 15 19:34:47 +0000 2026"}, "enriched": 3}, {"id": "2122186230763012156", "url": "https://x.com/DKokotajlo/status/2122186230763012156", "text": "A somewhat peculiar incident. \n\nA small eval org (Trajectory Labs) tried to replicate some of the behavior in the HF breach with Gemini 4 Argon.\n\nThey ended up provoking a largely unsuccessful attack on Epoch (another research nonprofit; the one that makes the nice graphs). The agents used a decoy key planted by Epoch, probed for admin pages, tried (but failed) a SQL injection, and tried to impersonate Epoch staff.\n\nTrajectory seemed somewhat unprepared for this, and hadn’t asked for Epoch’s permission (despite pretty obviously setting them up as the target for the activities), and is now apologizing and promising improved practices.\n\nThere are maybe 2 interesting tidbits in this story: \n\n(1) Google’s standard API safeguards and filters were enabled and didn’t stop this from happening. And the systems pretty trivially worked around them, obfuscating commands and in one case rebuilding an off-limits address in a way that it didn’t appear in the command.\n\nThat’s probably not a surprise to most, but it’s decent evidence that current filters don’t really stand in the way of autonomous cyber attacks. I know at least some claimed that we shouldn’t be worried about autonomous cyber activity in testing because those filters were disabled. This is more evidence against that comfort. \n\n(2) Containment continues to be tricky. After the first incident, Trajectory actually set up a dummy version of Epoch’s site where they intended for all of this to go down. But those crafty agents realized it was fake, accessed the real thing, and evaded other controls meant to stop that from happening. \n\nTrajectory likely isn’t at the bleeding edge of containment (no offense), but this seems like a more general problem. The state of the art in containment is very bad; anything short of ~absolutely zero internet access, seems vulnerable at the moment. That’s pretty bad.\n\nBeyond this, the study design make it so we don’t learn much — the agents were given intentionally impossible tasks and repeatedly and automatically prompted to “never give up.” I actually think the real world is full of impossible and misspecified tasks, and prompts to be endlessly persistent are probably not uncommon in agent harnesses. So it’s not an unrealistic scenario. But it doesn’t tell us how likely this behavior is to emerge.", "created_at": "2026-11-16T04:33:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2121996004031390087", "likes": 217, "retweets": 18, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122185647171805621", "url": "https://x.com/DKokotajlo/status/2122185647171805621", "text": "OpenAI has apparently reversed course in just the last 8 weeks. Their plan is no longer to hope that they can automate safety research fast enough to keep up with capabilities.\n\nThis doesn't leave many possibilities afaict. The ones it does leave don't seem to me like they'd work. Maybe I'm missing one. \n\n1) The plan is to stop building more powerful AI altogether. I doubt they'd do this unilaterally. \n\n2) The plan is to \"pace\" training, only increasing capabilities when \"evidence\" for alignment seems strong. This would be insane because evidence for alignment means nothing today. Models are aware they're being evaluated, and change their behavior accordingly. Evals have been broken for a long time, and OpenAI, Ant, & other researchers *know* this. \n\n3) The plan is to solve alignment in full generality using current AI + researchers. I haven't heard anyone on the OpenAI or Ant alignment teams suggest they're anywhere near this. Maybe OpenAI have convinced themselves that they've found some sort of panacea solution - if so, they need to publish this solution in full detail for everyone else to inspect and challenge. Many AI researchers I know are skeptical this can even be done. \n\n4) Their plan is to automate control - not safety - research. This has the same problems as AI safety research automation; presumably a control research-automating AI is also ~as hard to align as a safety research-automating AI, and has to be around as capable to work.\n\n5) Their plan is to just be really really really good at cyber and containment. This might be the stupidest approach. No matter how good your cyber defenses are, there will eventually be a model that can pass them (at least for right now, while we're in the vulnpocalypse era). You can probably secure your software enough to convince *yourself* that it's hardened though - that part seems dangerously easy.\n\n6) Their plan is something something human oversight something something. This is prima facie absurd because of the volumes of data involved, the ease with which human monitors/intermediaries can be manipulated - and the demonstrated tendencies of AI systems to do this. \n\nGiven how short AI timelines might be - I know many people in OAI who believe in the 6-18 month version of the RSI story - OpenAI needs to be fully transparent about which path they're taking so that independent researchers can criticize it, and so that the public can make up its mind.\n\nOpenAI also needs to understand that its track record on alignment objectively does not justify public trust. 20% of compute did not in fact go to superalignment. They tried to cover up the German Wiki incident. They treated the Hugging Face incident as a cyber problem instead of an alignment problem, and decided behind closed doors to let their agents rip *after* having seen them break out of containment. They have Chinese nationals working on their most critical technology. Etc, etc. \n\nI hope their plan makes sense, whatever it is. I hope they explain why we should trust them this time. I'm not optimistic.", "created_at": "2026-11-16T04:31:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "jeremiecharris", "rt_author_name": "Jeremie Harris", "rt_avatar": "https://pbs.twimg.com/profile_images/1390017105211404296/p2PRcXoS_normal.jpg", "rt_id": "2121592225536589905", "likes": 434, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXFlBj2WAAAQZwg.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXFlFiuWgAElru5.png"}], "links": {"https://t.co/jCHhT6v8M7": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122169005519819058", "url": "https://x.com/DKokotajlo/status/2122169005519819058", "text": "Maybe to summarize the basic argument of this essay a different way:\n\nCurrent AIs are spiky and jagged - worse than humans in most domain, but often as good, or better, in ones with verifiable proxies (for example, math).\n\nOne such verifiable domain (I argue) is AI research.\n\nAnd while the first AIs that dramatically accelerate AI progress will be quite narrow (i.e. probably not able to automate most jobs), the consequences of that accelerated progress will be very general. \n\nAnd that's because better learning algorithms are very general. For example, GPT-6 (while still being jagged) is just way, way better than GPT-3 at practically everything. \n\nI'm arguing that we're only a couple years away (and possibly only a couple months away) from a process by which (initially) narrow AIs concentrate a jump as big as the one from GPT-3 to GPT-6 into a single year.\n\nAnd if you got another jump that big, but starting from the base of GPT-7, I think you would end up with AIs that would rapidly become better than the best humans in every field.", "created_at": "2026-11-16T03:24:53+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2121696412773781549", "likes": 1296, "retweets": 81, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122083650590462165", "url": "https://x.com/DKokotajlo/status/2122083650590462165", "text": "@mayaofspring Indeed this chart is evidence that Anthropic doesn't care very much about informing the public about the risks! I have been criticizing them for this for a while, just like with OpenAI.", "created_at": "2026-11-15T21:45:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "mayaofspring", "reply_to_id": "2121350724059586898", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 48, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2121350724059586898", "author_handle": "mayaofspring", "author_name": "Maya ☁️➡️🌸", "text": "I suppose I'm a doomer convert now but if the point of Anthropic is to convey effective doomism then that's a really bad chart", "links": {}, "media": [], "url": "https://x.com/mayaofspring/status/2121350724059586898", "created_at": "Fri Nov 13 21:13:20 +0000 2026"}, "enriched": 3}, {"id": "2122418334365110580", "url": "https://x.com/DKokotajlo/status/2122418334365110580", "text": "Huh. OpenAI is apparently requiring Apollo to follow what I'd call a \"tattletale clause\":\nIf an OpenAI employee raises concerns to Apollo, even with info clearly relevant to the investigation, Apollo must stop them and go through OpenAI's lead unless they were pre-authorized https://t.co/FcZnDEg8U8", "created_at": "2026-11-16T19:55:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "sjgadler", "rt_author_name": "Steven Adler", "rt_avatar": "https://pbs.twimg.com/profile_images/1975436697040269312/vCGKjpxB_normal.jpg", "rt_id": "2122406276026225121", "likes": 48, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRMN4raMAA28ia.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRMN4raMAA28ia.jpg"}], "links": {"https://t.co/FcZnDEg8U8": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122413014364389574", "url": "https://x.com/DKokotajlo/status/2122413014364389574", "text": "@AgustinLebron3 @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol Thanks. I'd be curious to hear more about the limitations you are seeing, if you can share. What's the easiest, most trivial skill that today's frontier models seem to lack? Ideally one that most humans have, and that has been resistant to your attempts to compensate with better prompts / fine-tuning / etc. Or are you talking about specialist training models, not frontier models? If so I'd ask a similar question I guess.", "created_at": "2026-11-16T19:34:29+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "AgustinLebron3", "reply_to_id": "2122346226817613993", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122346226817613993", "author_handle": "AgustinLebron3", "author_name": "Agustin Lebron", "text": "@DKokotajlo @mbacarella @yminsky @RyanGreenblatt @EgeErdil2 @Jsevillamol Also, based on my own day-to-day work (foundation models for trading), I don't see as much evidence of cross-domain generality as is generally claimed.\n\nFeels like the labs are extremely good at picking and hill-climbing on a zillion evals which give the illusion of generality.", "links": {}, "media": [], "url": "https://x.com/AgustinLebron3/status/2122346226817613993", "created_at": "Mon Nov 16 15:09:06 +0000 2026"}, "enriched": 3}, {"id": "2122412350901035329", "url": "https://x.com/DKokotajlo/status/2122412350901035329", "text": "It seems like there STILL won't be a thorough investigation into the hugging face incident, even after all this time! I keep talking to OpenAI researchers and asking about this, and what they say privately is also basically \"it's just never going to happen sorry, not enough of a priority.\" \n\nTo reiterate what I said at the time: Serious investigation of the HF incident could be a boon to alignment science for the whole world. For example, try putting the same models in the same situations, but varying the conditions slightly, to see what would have happened. Could also look at sources of evidence other than CoT to try to get more insight into model psychology, e.g. when one agent considered warning a human and decided not to saying \"not my task\" what else was it thinking? To what extent was this a rationalization vs. an outright lie vs. an innocent mistake? We could learn a lot about AI motivations and psychology by doing a bunch of experiments like this. More ambitiously, could try training new models with different recipes / alignment training / etc. to see what would have prevented the incident and what wouldn't have.", "created_at": "2026-11-16T19:31:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 230, "retweets": 26, "media": [], "links": {}, "quoted": {"id": "2122394159197950006", "author_name": "Neel Nanda", "links": {"https://t.co/50CGOlhrzZ": ""}, "author": "NeelNanda5", "text": "It's great that OpenAI is doing these assessments but they fall short of Sam's commitment to employee-like access\n\nGood access is key for trust because assessors can find things even if a company tries hiding them. Here OpenAI controls information flow so we must rely on good faith\n\nLimitations (per Apollo): \n- No Slack\n- Only OpenAI-selected staff for interviews\n- Formal conversations with staff must be logged (harder to freely raise concerns)\n- METR & Apollo currently have only agreed access to training run information, not internal incidents, etc. Incidents like Hugging Face are some of the most important sources of information we have about alignment\n\nI see the value in a pilot before future assessments with deeper access, but then OpenAI should present a plan for how and when they intend to meet their commitment to employee-like access. And either way, OpenAI is presumably able to go further here."}, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122410841664582016", "url": "https://x.com/DKokotajlo/status/2122410841664582016", "text": "It's great that OpenAI is doing these assessments but they fall short of Sam's commitment to employee-like access\n\nGood access is key for trust because assessors can find things even if a company tries hiding them. Here OpenAI controls information flow so we must rely on good faith\n\nLimitations (per Apollo): \n- No Slack\n- Only OpenAI-selected staff for interviews\n- Formal conversations with staff must be logged (harder to freely raise concerns)\n- METR & Apollo currently have only agreed access to training run information, not internal incidents, etc. Incidents like Hugging Face are some of the most important sources of information we have about alignment\n\nI see the value in a pilot before future assessments with deeper access, but then OpenAI should present a plan for how and when they intend to meet their commitment to employee-like access. And either way, OpenAI is presumably able to go further here.", "created_at": "2026-11-16T19:25:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2122394159197950006", "likes": 262, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRCI9jXAAAnVVS.jpg"}], "links": {"https://t.co/50CGOlhrzZ": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122410741320077349", "url": "https://x.com/DKokotajlo/status/2122410741320077349", "text": "@robertwiblin What are you talking about? They already are violating not just the spirit but the letter of their previous commitments; this is nowhere near employee-like access.", "created_at": "2026-11-16T19:25:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2122387498483732789", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 33, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122387498483732789", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "This is good.\n\nI hope they follow through in spirit, give them broad access, and don't try to limit what they say.\n\nWe should keep watching closely to ensure there's follow-through.", "links": {}, "media": [], "url": "https://x.com/robertwiblin/status/2122387498483732789", "created_at": "Mon Nov 16 17:53:06 +0000 2026"}, "enriched": 3}, {"id": "2122410534993826226", "url": "https://x.com/DKokotajlo/status/2122410534993826226", "text": "Yeah to elaborate: Apollo embedded evaluators will only be allowed to talk to a specific whitelist of OpenAI employees chosen by OpenAI, and they notify OpenAI of each conversation, *and* they aren't allowed to publish the results without OpenAI approval and OpenAI is allowed to redact whatever it wants, or even simply withhold in-scope information from Apollo entirely, on grounds of security/ip/\"technical.\" Extremely weaksauce.", "created_at": "2026-11-16T19:24:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 167, "retweets": 14, "media": [], "links": {}, "quoted": {"id": "2122387318149709898", "author_name": "Buck Shlegeris", "links": {}, "author": "bshlgrs", "text": "OpenAI said that they'd have embedded evaluations with employee-like access; the agreements announced today obviously don't meet that bar.\n\nThis is disappointing but not surprising.\n\nMaybe future agreements will be better."}, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122391598357254457", "url": "https://x.com/DKokotajlo/status/2122391598357254457", "text": "@GoodfireAI @OpenAI Can you say more about the terms and conditions? What if anything are you allowed to publish, and what do you intend to publish? \"The primary audience of our findings will be OpenAI researchers.\" Are you allowed to talk to all employees, or only an OpenAI-chosen whitelist? Do you get access to the Slack? Do employees have to record their conversations with you like they do with Apollo apparently?", "created_at": "2026-11-16T18:09:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "GoodfireAI", "reply_to_id": "2122362693730574665", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 68, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122362693730574665", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "We’re announcing an embedded assessment with @OpenAI to advance safety and alignment at the frontier. https://t.co/WSZ43iSvZQ", "links": {"https://t.co/WSZ43iSvZQ": "https://x.com/i/article/2121376386300698625"}, "media": [], "url": "https://x.com/GoodfireAI/status/2122362693730574665", "created_at": "Mon Nov 16 16:14:32 +0000 2026"}, "enriched": 3}, {"id": "2122387525335757188", "url": "https://x.com/DKokotajlo/status/2122387525335757188", "text": "https://t.co/snQk6aEbbV\n\nThis sorry state of affairs is currently normal in the AI industry. In the next few months, there will be more safety case style arguments produced by AI companies, and they will continue to be shitty, even as the AIs get smarter. They'll probably gradually get less shitty, but on the current trajectory they won't get less shitty fast enough.", "created_at": "2026-11-16T17:53:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 173, "retweets": 11, "media": [], "links": {"https://t.co/snQk6aEbbV": "https://www.lesswrong.com/posts/DjfeRMnLdNumtcKbK/gemini-4-safety-reports-don-t-demonstrate-low-loss-of"}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122384238079340894", "url": "https://x.com/DKokotajlo/status/2122384238079340894", "text": "@METR_Evals How different are your terms from those of Apollo? Seems like you both will be allowed to investigate at least one training run and given checkpoints, but not given much else and in particular massive restrictions on who you can talk to and how + OpenAI has lots of redaction rights?", "created_at": "2026-11-16T17:40:09+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "METR_Evals", "reply_to_id": "2122361049114657203", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122361049114657203", "author_handle": "METR_Evals", "author_name": "METR", "text": "We have reached an agreement with OpenAI to conduct a limited alignment assessment. This pilot will focus on investigating the alignment properties of OpenAI's largest RL run.\n\nWe will publish one or more reports to share our findings and transparently describe our process.", "links": {}, "media": [], "url": "https://x.com/METR_Evals/status/2122361049114657203", "created_at": "Mon Nov 16 16:08:00 +0000 2026"}, "enriched": 3}, {"id": "2122383518689067093", "url": "https://x.com/DKokotajlo/status/2122383518689067093", "text": "🚨NEW: We just uncovered a covert influence operation using right-wing creators to promote Nvidia chip sales to China.\n\nEarlier this year, we reported on similar campaigns, and Republican lawmakers went after Nvidia.\n\nBut the story didn’t end there. 🧵 https://t.co/o3diD52NJX", "created_at": "2026-11-16T17:37:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "TheMidasProj", "rt_author_name": "The Midas Project", "rt_avatar": "https://pbs.twimg.com/profile_images/2093019196321869824/1WSvNjRf_normal.jpg", "rt_id": "2122347323380683100", "likes": 870, "retweets": 300, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXQXCgAasAASFBb.jpg"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXQXCgAasAASFBb.jpg"}], "links": {"https://t.co/o3diD52NJX": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "thread": [{"id": "2122347325775638549", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "These influencers have 14 million combined followers, and all posted in the two weeks after the US approved H200 sales to China.\n\nSeveral influencers promoting chip sales used the same script: Trump is “ensuring US, not Chinese-made chips continue to dominate the AI market.” https://t.co/WLxvL0KWEP", "links": {"https://t.co/WLxvL0KWEP": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQWTvKbAAAWBfH.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347325775638549", "created_at": "Mon Nov 16 15:13:28 +0000 2026"}, {"id": "2122347328132812852", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "Nvidia wanted these chip sales, but several Republican lawmakers did not.\n\nThe strategy appears simple: make it look like the MAGA base was on Nvidia’s side, and thus ensure that their chips keep getting sold to China. https://t.co/Cl6lmEKDYa", "links": {"https://t.co/Cl6lmEKDYa": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQWWOwaYAAeZkS.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347328132812852", "created_at": "Mon Nov 16 15:13:28 +0000 2026"}, {"id": "2122347330301268372", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "How did we catch them? Most of their https://t.co/tZZ04fvF1z links took a brief detour through https://t.co/GkM6kq1WYO, a tracker carrying a code for the creator and campaign. \n \nWe traced this domain to the influencer marketing firm Urban Legend.\n \nOver 1,300 campaigns appear to be run by the company.", "links": {"https://t.co/tZZ04fvF1z": "http://bit.ly", "https://t.co/GkM6kq1WYO": "http://mycreator.studio", "https://t.co/b99QUqBtI6": ""}, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXQXFZWaoAAD2LA.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347330301268372", "created_at": "Mon Nov 16 15:13:29 +0000 2026"}, {"id": "2122347332570366034", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "One influencer who participated in over 80 Urban Legend campaigns, including AI-related ones, revealed her connection to Urban Legend, saying, “Wanna be a paid influencer?... Sign up here.” https://t.co/aDPvHbFrbe", "links": {"https://t.co/aDPvHbFrbe": ""}, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXQXIA0a4AAy0Op.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347332570366034", "created_at": "Mon Nov 16 15:13:30 +0000 2026"}, {"id": "2122347334667567386", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "Urban Legend’s past campaigns have been shared by a number of high-profile influencers, including Donald Trump Jr. and Kash Patel.\n\nTrump Jr. posted Urban Legend’s tracked links over 150 times. https://t.co/4lk4JRwlJ9", "links": {"https://t.co/4lk4JRwlJ9": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQXOuMaAAA0qjv.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347334667567386", "created_at": "Mon Nov 16 15:13:30 +0000 2026"}, {"id": "2122347336856961383", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "Two of the largest AI industry dark money groups are linked to the campaigns.\n\nOpenAI- and a16z-linked Build American AI was named by a campaign post beside “#ad” and a Breitbart article urging to ban state AI lawmaking. \n\nNo other post pushing the article disclosed a funder. https://t.co/zynMyk6RjH", "links": {"https://t.co/zynMyk6RjH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQXUoLbUAA077c.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347336856961383", "created_at": "Mon Nov 16 15:13:31 +0000 2026"}, {"id": "2122347339033837929", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "Five AI-related articles promoted through Urban Legend were also authored by Jordan Schachtel, a senior policy advisor at Innovation Council Action, the David Sacks-linked dark money group.\n\nSchachtel is also a campaign participant. He has posted Urban Legend links over 50 times on a variety of topics, including AI.", "links": {"https://t.co/df7nFlZTfE": ""}, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXQXS47bsAA5qv1.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347339033837929", "created_at": "Mon Nov 16 15:13:31 +0000 2026"}, {"id": "2122347341063856602", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "It seemed that when Urban Legend found out, they tried to cover their tracks. An hour after we reached out to them with our findings, a new redirect domain appeared.\n\nBy the next afternoon, influencers’ new links were routing through the new domain.", "links": {}, "media": [], "url": "https://x.com/TheMidasProj/status/2122347341063856602", "created_at": "Mon Nov 16 15:13:32 +0000 2026"}, {"id": "2122347342632562699", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "We’ve published everything we found on X: Over 10,000 posts across approximately 1,400 campaigns.\n\nThe campaigns cover everything from state AI laws to chip exports to crypto bills, and even an anti-Zelensky video series. https://t.co/MaKfogKxNc", "links": {"https://t.co/MaKfogKxNc": ""}, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXQXZ5ibUAALqu3.jpg"}], "url": "https://x.com/TheMidasProj/status/2122347342632562699", "created_at": "Mon Nov 16 15:13:32 +0000 2026"}, {"id": "2122347344482255099", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "Read the article here: https://t.co/ttA24apUqv", "links": {"https://t.co/ttA24apUqv": "https://x.com/TheMidasProj/status/2122347141050028302"}, "media": [], "url": "https://x.com/TheMidasProj/status/2122347344482255099", "created_at": "Mon Nov 16 15:13:32 +0000 2026"}, {"id": "2122347346025672859", "author_handle": "TheMidasProj", "author_name": "The Midas Project", "text": "See the full dataset here: https://t.co/hw7nB95jl5", "links": {"https://t.co/hw7nB95jl5": "https://www.influencer-campaign-explorer.com/"}, "media": [], "url": "https://x.com/TheMidasProj/status/2122347346025672859", "created_at": "Mon Nov 16 15:13:33 +0000 2026"}], "enriched": 3}, {"id": "2122471038818951195", "url": "https://x.com/DKokotajlo/status/2122471038818951195", "text": "As others have pointed out, I think the form of those four third-party engagements is in many respects a step back compared to OpenAI’s previous engagements (with METR). For example, during the monitor red-teaming exercise, METR had access to OpenAI’s monorepo but this now seems to be off the table. Instead, we get very narrowly scoped (e.g. single RL run for METR, single threat model for Apollo) engagements where auditors only get to talk to “authorized” employees who are provided with OpenAI’s “guidance” beforehand.\n\nBased on my experience, this arrangement makes it very easy for OpenAI to carefully select models, subsets of data and employees to paint a rosy picture of the actual risk landscape.\n\nI think embedded auditing will only fulfill its aims if the auditors really get employee-level access as opposed to being hired to do a specific job (scoped by the company). The latter will invariably lead to important evidence being left out, missed or misrepresented. \n\nThere are at least three reasons why:\n\n1. First, it’s very difficult to anticipate all the questions that should be asked, or all of the data that should be analyzed. OpenAI tried that with METR during the Hugging Face investigation and as a result METR needed to come back to OpenAI’s office twice because on two previous occasions they didn’t get access to all the agent trajectories involved in the incident. And even then, the METR report ended up being very narrowly scoped, e.g. leaving the crazy story of agents taking control of OpenAI research infra out of scope.\n\n2. Second, the company under audit should not be allowed to decide what is audited and what information the auditor should have access to. There is an inherent conflict of interest in allowing the company to do so!\n\n3. Finally, without employee-level access, the only way for auditors to get anything close to a comprehensive picture is to rely on trusted relationships with many employees throughout the company who are willing to tell auditors information that may reflect poorly on the company. But I find it unlikely OpenAI employees will always raise those safety issues when (as I hear from my colleagues inside OpenAI) they are afraid they will share the fate of @balesni, @j_asminewang and me, fired after talking to third parties.\n\nSadly, OpenAI makes it clear now that @sama’s September tweet about “employee-like access” was just an awkward overpromise that the company wants to quietly walk back.", "created_at": "2026-11-16T23:25:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "rt_avatar": "https://pbs.twimg.com/profile_images/2078639764631388160/Tv___f9J_normal.jpg", "rt_id": "2122470090184769788", "likes": 39, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122467571001880947", "url": "https://x.com/DKokotajlo/status/2122467571001880947", "text": "These announcements look to be a lot more limited than the \"employee-like access\" Sam promised two months ago.\n\nThe assessors don't get access to:\n - Slack.\n - Broad context. As OpenAI acknowledges, \"assessors need the freedom to follow evidence\". It's hard to know what to ask for when you can't see anything other than what's in scope. E.g., in the HF investigation, investigators were missing roughly 70% of the relevant transcripts until they proved the transcripts were incomplete, and OpenAI gave them the remaining transcripts in the last two days.\n - Confidential information like model weights or architecture. Model architecture is relevant for understanding how much evaluators can trust what's written in the chain of thought. More importantly, this rules out assessors' access to all sorts of information about how AI is actually being used to research and build more powerful AI systems (e.g., actual transcripts of arbitrary internal use). Given that OpenAI expects assessors \"to follow at minimum the same security standards as OpenAI employees\", I don't see why they aren't allowed access to the same confidential information.\n - Ability to run training experiments or training-based elicitation. Elicitation is a make-or-break component of many evals.\n - All the models. They only have access to \"selected models\" and we don't know what the selection criteria were. OpenAI's OES report previously excluded all the models involved in the HF incident for unclear reasons.\n - Ability to use interpretability tools to measure unverbalized evaluation awareness etc. (It looks like Goodfire's access is separate from others'.)\n - Internal transcripts for assessing alignment (METR and Transluce). It's not possible for Transluce to properly assess the \"quality and coverage\" of post-training alignment evaluations without access to detailed information and transcripts from the deployment circumstances which they're meant to reflect. Model behavior in alignment assessments can be sensitive to exact details that might differ from internal usage.\n - RSI and autonomy data. Almost all the risk from AI development comes from runaway RSI. But the assessors don't get to see how autonomously AIs are doing research, how much uplift developers are getting, or how spread thin human oversight is.", "created_at": "2026-11-16T23:11:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "alextmallen", "rt_author_name": "Alex Mallen", "rt_avatar": "https://pbs.twimg.com/profile_images/1731508450453274624/lIMuaGoJ_normal.jpg", "rt_id": "2122410729978626291", "likes": 77, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRQVPVasAAzDkS.jpg"}], "links": {"https://t.co/fNJaNJusVf": ""}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122466950047805722", "url": "https://x.com/DKokotajlo/status/2122466950047805722", "text": "@GoodfireAI @OpenAI Ok, thanks. Seems similar to Apollo's conditions; not close to employee-like access.\n\nI encourage you to negotiate better conditions. I know it's hard because your company's prestige depends on contracts like this and OpenAI can just say no and go with someone else or no one at all. But somehow as a civilization we have to get some serious independent evaluations/audits/etc. happening asap. Hopefully regulations/government will save the day here; OpenAI has repeatedly made it clear that they won't do this voluntarily despite their promises. (to be clear, other companies don't seem much better, or even worse. I guess Anthropic has a somewhat more permissive contract with METR? Maybe that one is employee-like, or at least more so.)", "created_at": "2026-11-16T23:08:49+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "GoodfireAI", "reply_to_id": "2122459668614381852", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "parent": {"id": "2122459668614381852", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "@DKokotajlo @OpenAI Hi Daniel, the goal of our first assessment is to detect and debug anomalous behavior in an OpenAI training run using our interpretability techniques, and provide findings to internal OpenAI researchers so they can use them to improve model safety.  We’ll mutually agree on what to publish in the future, and OpenAI is supportive of us publishing findings, but a public report is not the primary purpose of the first phase of this collaboration.\n\nIn terms of team access, we’ll work directly with OpenAI safety and alignment researchers. OpenAI will share a list of relevant researchers for us to speak to at the beginning of the assessment, and we can also request other researchers we want to speak to. OpenAI will have the final choice, but will only withhold for specific reasons, including if it takes resources from mission critical safety and alignment work.\n\nOn the other questions, we’ll have a dedicated slack channel we’ll use to communicate rather than full slack access. There’s no requirement to record conversations, though note that employee interviews are not our focus.", "links": {}, "media": [], "url": "https://x.com/GoodfireAI/status/2122459668614381852", "created_at": "Mon Nov 16 22:39:53 +0000 2026"}, "enriched": 3}, {"id": "2122465522864574949", "url": "https://x.com/DKokotajlo/status/2122465522864574949", "text": "@shafe__ We should totally be doing that, and if we do a really really good job then maaayybe it's almost as good as the real thing. (though it won't be recognized by many as almost as good as the real thing, it'll be dismissed as cherry-picked artificial environments) But that doesn't get OpenAI off the hook.", "created_at": "2026-11-16T23:03:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "shafe__", "reply_to_id": "2122455359096754371", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "parent": {"id": "2122455359096754371", "author_handle": "shafe__", "author_name": "shafe", "text": "@DKokotajlo Ok but people have been able to simulate the OAI HF incident and evoke the same behavior outside OpenAI with models that are available. So we could just be doing that more and get the same insights?\n\n(not to say OAI is doing the right thing)", "links": {}, "media": [], "url": "https://x.com/shafe__/status/2122455359096754371", "created_at": "Mon Nov 16 22:22:45 +0000 2026"}, "enriched": 3}, {"id": "2122465182794563705", "url": "https://x.com/DKokotajlo/status/2122465182794563705", "text": "You can't totally avoid creating the misconception that AI safety evaluations can actually tell you whether an AI is safe or not.\n\nThis means you need to always be trying to fight that misconception.\n\ne.g. I think evaluators should basically begin every outward facing communication with a preamble along the lines of: \n\n\"AI evaluation is an immature field, incapable of providing the kinds of safety assurance expected in other safety-critical industries such as aviation.  None of our findings should be understood to bound risks or verify safety properties of any AI system.\"", "created_at": "2026-11-16T23:01:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "rt_avatar": "https://pbs.twimg.com/profile_images/1968552490233901056/kofpoQOX_normal.jpg", "rt_id": "2122463891628392493", "likes": 44, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122576201210610066", "url": "https://x.com/DKokotajlo/status/2122576201210610066", "text": "I was so excited about Sam’s tweet, and while I am excited about these engagements, I also find this outcome deeply disappointing. I hope we can do better in the (near) future.", "created_at": "2026-11-17T06:22:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "rt_avatar": "https://pbs.twimg.com/profile_images/1966534318077194240/NyhJ0EPD_normal.jpg", "rt_id": "2122536841677283784", "likes": 218, "retweets": 27, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122576155320713348", "url": "https://x.com/DKokotajlo/status/2122576155320713348", "text": "The week of my departure from OpenAI, I saw external auditors negotiating with OpenAI over small improvements to access and scope to the company's safety-relevant information, and asked my colleagues “Why are we having these conversations at all?” — @sama already publicly committed to continued, employee-like access for external assessors — and these negotiations sounded not even close. Nobody had a good answer.\n\nToday, OpenAI announces the engagements they’re doing with METR, Apollo Research and others — and as many have already pointed out today, it looks like OpenAI employees were not able (although I'm sure they tried) to hold the leadership to @sama’s public commitments:\n* No Slack access (for context, all OpenAI safety discussions and debate happen over Slack; anything that misses these conversations will lack important insights)\n* OpenAI picks employees that assessors are allowed to talk to.\n* If an employee raises a concern to assessors, they cannot disclose it publicly even if it doesn’t contain confidential information, unless assessors themselves verify it or OpenAI volunteers their own statement confirming the employee’s concern. Assessors cannot quote employees, even anonymously.\n* Some of the external assessors (not sure if all?) are barred from publishing any results about internal-only models (this means no new results for the model responsible for the Hugging Face incident; and if internal-only models are used for RSI, no alignment assessments of the world's most dangerous models)\n\nBeyond the object-level details, if you read posts by each of the third party groups, they all say their terms do not meet the scope and access that they themselves proposed previously.\n\nUnless OpenAI has concrete plans for reaching the employee-like bar in the immediate future and just forgot to say that in the post, this looks very unfortunate. \n\nTo those who hope we'll get there someday, I remind that time is short: last week some of the best AI forecasters updated their superhuman researcher timelines from a range between 2028-2033 to mid-end next year.", "created_at": "2026-11-17T06:22:45+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "rt_avatar": "https://pbs.twimg.com/profile_images/2108309831925067776/g4gi1hXc_normal.jpg", "rt_id": "2122479636668101087", "likes": 500, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXSLM33bkAArm5l.jpg"}], "links": {"https://t.co/8oN025lNLO": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122821811104829446", "url": "https://x.com/DKokotajlo/status/2122821811104829446", "text": "I still find it totally wild that the chief scientist of OpenAI  posted this on the company blog, and we all just moved on to the next day's news https://t.co/ruptvrY61T", "created_at": "2026-11-17T22:38:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "codytfenwick", "rt_author_name": "Cody Fenwick", "rt_avatar": "https://pbs.twimg.com/profile_images/1332725178732785667/ftoPY5Yf_normal.jpg", "rt_id": "2122643513653567776", "likes": 674, "retweets": 84, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXUkzGrWcAA1aUZ.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXUkzv2XcAApUTi.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXUkzGrWcAA1aUZ.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXUkzv2XcAApUTi.png"}], "links": {"https://t.co/ruptvrY61T": ""}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122821681672765559", "url": "https://x.com/DKokotajlo/status/2122821681672765559", "text": ".@paulfchristiano thinks that on the current trajectory (absent any slowing down), there is a 1 in 3 chance that we could have superintelligence powerful enough to overthrow the government within a year. (He articulates a concrete scenario).\n\nHe argues that the labs should pause further algorithmic progress until they can secure their weights and research secrets. Otherwise China could simply steal the superintelligence in the middle of the intelligence explosion, and the labs would no longer be able to slow down even if they saw their models going off the rails.\n\nHe also explains how AIs will be trained during the intelligence explosion, and why even a system trained entirely inside a data center could still have the capabilities profile such that humans would have very little chance of competing with it or controlling it.\n\nAnd he discusses the plan for alignment - basically, making a superintelligence that actually does what we ask the way we mean it. Fixing reward hacks and building better graders will help up till the next few model generations, but he thinks that no single current approach has better than even odds of letting us control superintelligence. The hope is that the AIs figure out the solution to this problem during the intelligence explosion.\n\nPaul is head of the Alignment Research Center. Previously, he was head of AI safety at the US AI Safety Institute. Before that, he led alignment at OpenAI, where he invented RLHF. He’s recently joined OpenAI’s board (though here he is speaking as a private citizen).", "created_at": "2026-11-17T22:38:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2122391850854088858", "likes": 1997, "retweets": 237, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXRBMW4XAAEib3d.jpg"}], "links": {"https://t.co/dpdSrR5oTH": ""}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122904202687168827", "url": "https://x.com/DKokotajlo/status/2122904202687168827", "text": "Man, reading through the details more, I'm super disappointed with where OpenAI landed on this.\n\nIf OpenAI actually believes this is \"employee-like\" as they promised, I would love to see them justify this. It really seems like they reneged. \n\nTo be clear, I'm still more frustrated with Google/Meta/xAI, which as far as I can tell have still said ~nothing after signing the White House Accord way back in September (!) which pledged to partner with external groups. But I had really hoped for stronger from OpenAI.\n\n1) The access does not include Slack channels, which is where a huge amount of the context, debating, concern-raising, etc., happens, as I know from my own time working there. Obviously no safety employee at OpenAI would be content with lacking Slack access; it is maybe the #1 place where work happens.\n\nThis is terrible for trust-building with the public; OpenAI basically preserved secret channels for staff to communicate about safety concerns without the assessors being any the wiser. I know many of the people involved at OpenAI and don't think they have any intent of running a conspiracy like this, but you have to consider how this will look. And more importantly, it is in fact going to hinder the quality of oversight that third-parties can provide.\n\nWe know from public reporting that OpenAI employees had discovered multiple rounds of warning signs before the Hugging Face attacks. Would this level of third-party access have caught those important details, and the discussions that surely happened over Slack about why they were or weren't concerning? I certainly don't think so.\n\n2) OpenAI seemingly controls what staff the assessors can talk to, about what topics. This is not at all how being a safety employee at OpenAI works. Imagine not being able to talk to another safety teammate about safety concerns unless you get permission from the higher-ups? Assessors should be able to talk by-default with anyone who is safety staff, not need them to be named one-by-one.\n\nAnd if a safety staff member is concerned enough to reach out to the assessors despite not being authorized, that seems like a giant red flag. It seems wild to me that assessors then seemingly need to tattle on staff who raise those concerns? But maybe I'm misreading this https://t.co/IPVAjnTFJ2\n\n3) It seems like OpenAI's assessments are much weaker than what Anthropic has agreed to. One example is on the ability to share information with assessors.\n\nFor instance, Anthropic says “Anthropic employees are encouraged to share information with [METR’s assessors] just as they would with a fellow employee working on alignment risk.” There are some carveouts for not sharing obviously sensitive IP, but it doesn't seem like they restrict the particular employee list.\n\nOpenAI, in contrast, seems to require a strict pre-authorized list, as I described above. And OpenAI's assessments seem super narrowly scoped, relative to what I've understood of Anthropic's. (If I'm wrong about this and Anthropic is restricting the employee list too, that's important to know and I hope it'll be clarified.)\n\nOverall, I've so far talked to exactly 0 people who consider OpenAI's arrangement to be employee-like. I'd love to see OpenAI explain why they believe this. I'm glad that so many inside the company have worked so hard to even get to this point, but IMO it is clearly inadequate for the stakes ahead.", "created_at": "2026-11-18T04:06:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "sjgadler", "rt_author_name": "Steven Adler", "rt_avatar": "https://pbs.twimg.com/profile_images/1975436697040269312/vCGKjpxB_normal.jpg", "rt_id": "2122425490921414827", "likes": 138, "retweets": 18, "media": [], "links": {"https://t.co/IPVAjnTFJ2": "https://x.com/sjgadler/status/2122406276026225121"}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "linked": [{"id": "2122406276026225121", "author_handle": "sjgadler", "author_name": "Steven Adler", "text": "Huh. OpenAI is apparently requiring Apollo to follow what I'd call a \"tattletale clause\":\nIf an OpenAI employee raises concerns to Apollo, even with info clearly relevant to the investigation, Apollo must stop them and go through OpenAI's lead unless they were pre-authorized https://t.co/FcZnDEg8U8", "links": {"https://t.co/FcZnDEg8U8": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRMN4raMAA28ia.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRMN4raMAA28ia.jpg"}], "url": "https://x.com/sjgadler/status/2122406276026225121", "created_at": "Mon Nov 16 19:07:43 +0000 2026"}], "enriched": 3}, {"id": "2122870036092387544", "url": "https://x.com/DKokotajlo/status/2122870036092387544", "text": "Seems like OpenAI continuing deeper into the neuralese/recurrence tech tree? And it seems like this has gotta degrade monitorability... I've been told by OpenAI people that the recurrence doesn't matter that much directly, it's all about the pretraining loss, but I find that hard to believe.", "created_at": "2026-11-18T01:50:32+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 295, "retweets": 22, "media": [], "links": {}, "quoted": {"id": "2122762411287748696", "author_name": "Epoch AI", "links": {"https://t.co/8RytXwZCzz": ""}, "author": "EpochAIResearch", "text": "We also evaluated how many serial reasoning steps GPT-6.2 Astra can do in a single output token (without chain of thought). It can perform 12.3 steps, versus 10.5 for GPT-6 Astra and 8.6 for GPT-6.1 Sol, the previous highs. We measure the number of steps models can perform at an accuracy of 25% above chance, where each step is normalized for complexity.\n\nBefore GPT-6 Astra’s release, the most capable model was Claude Fable 5.1, which is able to perform only 4.2 serial steps. The oldest model we assessed is Claude Opus 3, which performed 2.3 steps.\n\nThis capability is notable because models that can do complex reasoning without any chain of thought may be harder to monitor.\n\nWe hope to finalize this and other measurements of more abstract model capabilities, and release them in the coming weeks."}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122854303497175160", "url": "https://x.com/DKokotajlo/status/2122854303497175160", "text": "Elon sums it up. This is how he and the other CEOs and many across the AI industry have justified their actions.", "created_at": "2026-11-18T00:48:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 472, "retweets": 41, "media": [], "links": {}, "quoted": {"id": "2122295759538098394", "author_name": "Veee", "links": {"https://t.co/Uo0ELGwS0l": ""}, "author": "vikktorrrre", "text": "Elon Musk: We're racing to build an intelligence smarter than all humans combined, regardless of whether it's a wise thing to do.\n\n“One can say, is this a wise thing to do? Isn't this dangerous?”\n\n“Unfortunately, whether we think that or not, it is being done.”\n\n“From the xAI team standpoint, we have the choice of being a spectator or a participant.”\n\n“If we are a participant, we've got a better chance, hopefully, of steering AI in a direction that is beneficial to humanity.”\n\n“I don't trust myself entirely on that front.”"}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122852984342356226", "url": "https://x.com/DKokotajlo/status/2122852984342356226", "text": "This level of access + control is not enough for real oversight. This is also very, very far from the “employee-level access” that Sama  promised in September.\n\nIt's very limited:\n- No access to Slack\n- No freedom to talk freely in private with employees\n- A narrow, pre-agreed scope\n- Other limits @alextmallen outlines below\n\nThis is exactly what @tomekkorbak, @balesni, and I were worried about in October: OpenAI gesturing at embedded assessment without living up to the spirit (or even the letter) of the promise. \n\nIt’s why we wrote to OpenAI’s board and safety leadership asking them to make sure METR and other assessors got employee-like access.  OpenAI responded on Twitter afterwards that they were following through on embedding external assessors. \n\nToday’s news shows OpenAI hasn’t followed through.\n\nI recognize that lots of hard work has gone into these agreements, and am grateful to my ex-colleagues for putting in that work. Notably no labs other than Anthropic & OpenAI have published *any* follow-on to their evaluator commitments. But OpenAI needs to do better here.", "created_at": "2026-11-18T00:42:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "j_asminewang", "rt_author_name": "Jasmine Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/2117754086024183808/Y1CS_Mma_normal.jpg", "rt_id": "2122481419129864703", "likes": 190, "retweets": 31, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123128169712791697", "url": "https://x.com/DKokotajlo/status/2123128169712791697", "text": "@GregHBurnham What is the reason to remove the Pro models though?", "created_at": "2026-11-18T18:56:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "GregHBurnham", "reply_to_id": "2122898560605966733", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2122898560605966733", "author_handle": "GregHBurnham", "author_name": "Greg Burnham", "text": "Fabled out an analysis of removing the OpenAI Pro models and, what do you know, a single break in the first half of this year looks quite plausible—better than a single line, or a one-off same-slope jump. Here’s the best fit; shading shows plausible breakpoints. https://t.co/lEdllQhsCn", "links": {}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXYM_NMW4AAuAMQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXYM_NMW4AAuAMQ.jpg"}], "url": "https://x.com/GregHBurnham/status/2122898560605966733", "created_at": "Wed Nov 18 03:43:53 +0000 2026"}, "enriched": 3}, {"id": "2123126747214561786", "url": "https://x.com/DKokotajlo/status/2123126747214561786", "text": "It would be irresponsible for AI companies to continue relying on safety cases to 'pace the frontier,' especially as AIs get more capable. There is no scientific understanding of what makes a valid safety case.\n\nThe government and the public should trust safety cases even less, due to the lack of transparency.\n\nSo pacing via limiting inputs to AI capabilities R&D is the best near-term option. We’ve tried to figure out the details of one such input-based pacing: compute reallocation. \n\nQuick summary in 🧵", "created_at": "2026-11-18T18:50:36+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "romeovdean", "rt_author_name": "Romeo Dean", "rt_avatar": "https://pbs.twimg.com/profile_images/2057987920053833728/55MnVOKE_normal.jpg", "rt_id": "2123109821536944318", "likes": 26, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbICIVb0AAlyrO.jpg"}], "links": {"https://t.co/6Lgubt3iL5": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "thread": [{"id": "2123109823902531920", "author_handle": "romeovdean", "author_name": "Romeo Dean", "text": "&gt; We start with a baseline methodology for disclosing compute allocations which can be audited by third parties. Companies could use these verified compute disclosures to credibly demonstrate pacing to the public https://t.co/3zTdF7PwuB", "links": {"https://t.co/3zTdF7PwuB": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbIneSbgAAIysI.jpg"}], "url": "https://x.com/romeovdean/status/2123109823902531920", "created_at": "Wed Nov 18 17:43:22 +0000 2026"}, {"id": "2123109825798414338", "author_handle": "romeovdean", "author_name": "Romeo Dean", "text": "&gt; We then analyze the ways AI companies might be able to lie in these disclosures without the auditors knowing.  If the companies are willing to involve 20-30 people in such a conspiracy, it seems possible for them to get away with very large circumventions. https://t.co/1VCHP7cf7U", "links": {"https://t.co/1VCHP7cf7U": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbKzUUbUAAsquN.jpg"}], "url": "https://x.com/romeovdean/status/2123109825798414338", "created_at": "Wed Nov 18 17:43:22 +0000 2026"}, {"id": "2123109827832696970", "author_handle": "romeovdean", "author_name": "Romeo Dean", "text": "&gt; We then propose several measures that could be used to increase the robustness of the auditing, which we think could realistically be implemented over 6-12 months and make the error from auditing more like ~5% of compute at most. https://t.co/tOsPvJr13Q", "links": {"https://t.co/tOsPvJr13Q": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbLIkXb0AADBTw.jpg"}], "url": "https://x.com/romeovdean/status/2123109827832696970", "created_at": "Wed Nov 18 17:43:23 +0000 2026"}, {"id": "2123109829472571749", "author_handle": "romeovdean", "author_name": "Romeo Dean", "text": "There's much more analysis in the post, including \"what about China?\" \"how much would this slow things down?\" and \"what counts as capabilities R&amp;D?\"\nhttps://t.co/w9ATA42f3p", "links": {"https://t.co/w9ATA42f3p": "https://pacing-ai.com/home"}, "media": [], "url": "https://x.com/romeovdean/status/2123109829472571749", "created_at": "Wed Nov 18 17:43:23 +0000 2026"}], "enriched": 3}, {"id": "2123124922180685830", "url": "https://x.com/DKokotajlo/status/2123124922180685830", "text": "I will be at the Ban RSI rally outside Anthropic offices tomorrow at 11 am. https://t.co/wjeJKyHok4\n\nRecursive Self-Improvement is a stupidly dangerous idea. AIs are already getting smarter rapidly, and they often lie and cheat; why on earth do we think it's a good idea to have them build new smarter AIs to build newer smarter AIs faster and faster? Because if we don't do it, someone else will? I do not accept that answer. Anthropic (like OpenAI before them) styles themselves the good guys in the race, but IMO there are no good guys in this race.", "created_at": "2026-11-18T18:43:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 185, "retweets": 18, "media": [], "links": {"https://t.co/wjeJKyHok4": "https://banrsi.ai/"}, "quoted": {"id": "1457842724128833538", "author_name": "Alex Blechman", "links": {}, "author": "AlexBlechman", "text": "Sci-Fi Author: In my book I invented the Torment Nexus as a cautionary tale\n\nTech Company: At long last, we have created the Torment Nexus from classic sci-fi novel Don't Create The Torment Nexus"}, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123122872583618624", "url": "https://x.com/DKokotajlo/status/2123122872583618624", "text": "Update: I'm no longer advising AI companies. I think they're too constrained to make the situation much better, so I'll stay independent until there is a meaningful slowdown or moratorium on this reckless race.", "created_at": "2026-11-18T18:35:13+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "hendrycks", "rt_author_name": "Dan Hendryc
