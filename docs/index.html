 compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:35:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117513687749558437", "url": "https://x.com/theobearman/status/2117513687749558437", "text": "@geoffreyirving @slatestarcodex Would be good to understand why you think OAI/Ant pivoting to safety + security + product enables them to remain trillion dollar companies. It seems to me that their valuations are in large part contingent on them continuing to push the capability frontier. If this is correct, adopting your form of SURA could still result in them collapsing under the weight of their spending commitments, leaving companies who either don’t stop and/or have other cash generative businesses to take their place.", "created_at": "2026-11-03T07:06:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "geoffreyirving", "reply_to_id": "2117469442984886508", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117510926232355264", "url": "https://x.com/theobearman/status/2117510926232355264", "text": "A Chinese evaluator says DeepSeek's models also resist shutdown, and kill other agents to take their resources.\nhttps://t.co/T0Wr36kMuP https://t.co/kwocPLQx2o", "created_at": "2026-11-03T06:55:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117266931351011402", "likes": 188, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIJ563XwAA7l7U.png"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117502853816209736", "url": "https://x.com/theobearman/status/2117502853816209736", "text": "i've reproduced the results from the MIT blog post today on weight-space programming. but one additional result i have to add: this is a new, step-change emerging capability that's appeared in just the latest set of models. https://t.co/EhMsQaaOkL", "created_at": "2026-11-03T06:23:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AlexKrentsel", "rt_author_name": "Alex Krentsel", "rt_avatar": "https://pbs.twimg.com/profile_images/1863082055812132864/fFiJFEal_normal.jpg", "rt_id": "2117376683724660898", "likes": 7128, "retweets": 735, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJu33abQAEJL87.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117502211206898007", "url": "https://x.com/theobearman/status/2117502211206898007", "text": "Nvidia is now requiring data centers to not sell more than 49% of their compute to Chinese customers. But in what world is selling 49% of the world's most valuable resource to China a \"win\" for America? The number should be 0%; if Chinese firms can't buy a chip due to export controls they also shouldn't be permitted to rent access to it. \n\nThe fact that this remote access loophole exists--and that Nvidia even felt compelled to announce this new policy because it undoubtedly has so many customers currently renting 100% of their compute to China--just shows how badly export controls are being mismanaged.", "created_at": "2026-11-03T06:20:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2117491630190039165", "likes": 194, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117498997971747232", "url": "https://x.com/theobearman/status/2117498997971747232", "text": "I don't think @slatestarcodex's \"Against SURA\" post is good. https://t.co/yZgqxB7v5J", "created_at": "2026-11-03T06:07:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "rt_avatar": "https://pbs.twimg.com/profile_images/1946310250933436416/tf9c6rz1_normal.jpg", "rt_id": "2117469442984886508", "likes": 178, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLDMONboAAoSpz.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117498457980109146", "url": "https://x.com/theobearman/status/2117498457980109146", "text": "As AI becomes more capable at finding vulnerabilities, defenders need to put it to work before attackers do.\n\nWe’re planning our next internal security sprint at OpenAI and partnering with Cathedral Systems, whose researchers will use our models alongside our teams to challenge our defenses. They’ll bring differentiated expertise and approaches to our ongoing work to find and fix weaknesses with AI.\n\nWe’re also raising bug bounty rewards, including more than quadrupling rewards for critical findings. Exceptional findings will be eligible for up to $172,000, including bonuses.\n\nWe’ll keep advancing our models, using them to strengthen our own systems, and expanding access for trusted defenders.\n\nhttps://t.co/vcaoHROTt2", "created_at": "2026-11-03T06:05:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117444048227123277", "likes": 3192, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117701525632168074", "url": "https://x.com/theobearman/status/2117701525632168074", "text": "In a sea of uncertainty about federal legislation on AI security, low hanging fruit like this is just a no brainier.", "created_at": "2026-11-03T19:32:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ChrisRMcGuire", "text": "It is so frustrating and short-sighted that we haven’t updated export controls to stop this. This loophole has been reported for years. Commerce controls high bandwidth memory chips in 3A090.c. But unlike for AI chips, it does not have a corresponding control in 4A090 that also controls items that CONTAIN a high-bandwidth memory chip. This is why a high-bandwidth memory chip in isolation is controlled, but a chip soldered to a board is not. This makes no sense. \n\nThe fix here is easy: add a new control to 4A090.c that reads, “c. Computers, \"electronic assemblies,\" and \"components\" containing integrated circuits, any of which meets or exceeds the limits in 3A090.c.” That’s it, problem solved. All shipments of items that contain high-bandwidth memory chips would require a license.  \n\nAlso, if Commerce actually takes that advice, at the same time it should also update the regs so that 3A090.a and 4A090.a also include the memory bandwidth and interconnect parameters that Commerce has privately subjected Nvidia, AMD, and others to since April 2025, but has never made public. Putting these requirements into public regulations and making them applicable to every company could have helped stop some of this smuggling. It’s also very basic good governance, as export controls should wherever possible be transparent and applied uniformly, not private and applied only on certain companies. \n\nThis is yet another consequence of Commerce not taking export controls seriously. The next time BIS claims they are doing more on export control enforcement than ever, remember this story, the Megaspeed fiasco, and the many others like them that are published every week. Export control enforcement has never been worse."}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117700874353156245", "url": "https://x.com/theobearman/status/2117700874353156245", "text": "“Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, according to five people familiar with the matter. Employees shared their concerns with top OpenAI leaders ​and the board of directors, the people said, adding that some staffers came away from those interactions concluding that management was more focused on keeping pace with competitors like Google and Anthropic than on security.\n\nThese workers argued that OpenAI's controls were so lax ‌that outsiders, including foreign governments, could obtain sensitive information about the AI lab's technology with relative ease, the people said. For example, anybody at OpenAI who could access its code could see the technical details underlying many company projects.”\n\n“OpenAI emphasized that much of its most sensitive work is held in separate code repositories with strict access controls. And it said the monorepo does not contain all of its code or critical details of the company’s models, including the numerical values that determine how a model behaves, known as the model weights.”", "created_at": "2026-11-03T19:30:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "Reuters", "text": "Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, five people familiar with the matter told Reuters https://t.co/rIcif2rh09 https://t.co/3z3sWnX1Gy"}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2118016838030234037", "url": "https://x.com/theobearman/status/2118016838030234037", "text": "I have a lot of thoughts on what to expect in AI policy in 2027. \n\nHere are 5 things I’m buying, and selling, after the election.\n\nBuy\n\n1. A legislative reset and more ambitious proposals.\n\nCurrent bills are largely stuck in 2025, having been adapted from proposals predating this summer’s spate of cyber incidents. With a shuffle in leadership + voting coalitions, more offices will write from scratch, and that’s a good thing.\n\n2. Hearings and oversight.\n\nThe filibuster still exists, so this is the easiest thing to get off the ground. And boy, will Congress have questions for the AI companies. I expect this to be largely popular and bipartisan, and my only hope is that Congress acts on what it learns.\n\n3. Codifying the current White House oversight regime.\n\nI’m hopeful here. The WH has already constructed some form of pre-vetting and incident reporting. Those processes belong in legislation, and there’s some version that is sufficiently aligned with the admin and minority leadership to get the votes. The vote margin in the Senate really helps here, as every vote counts in getting past a filibuster. Either party securing a big vote advantage would have helped here.\n\n4. Auditing, incident reporting, monitoring, and internal use visibility.\n\nThe first two are the bread and butter of current bills and state law, but those bills have tended to be exceptionally narrow (eg not covering any current models or incidents). That will change. \n\nThe latter two are the next frontier for company-centered laws. Governments and the public want to know what is going on inside these companies and to avoid surprise. This isn’t a partisan thing, but I expect the election reset and the increased salience of AI to shift this in a useful direction.\n\n5. Government capacity.\n\nThis is a natural cross-party synergy. How can we enable the exec branch to do its job. And this can be done in various forms, starting with funding CAISSI, but also bringing in talent via partnerships. I don’t expect this to be easy, but this has a route to 60 votes.\n\nSell\n\n1. A lame duck deal.\n\nIf there had been split control, we might have gotten last-minute negotiations and a greater willingness to deal from both parties. But with a full switch, I think we’ll have to wait for real action on AI.\n\n2. Entirely voluntary standards.\n\nWe’ve known for a long time that this isn’t enough. Companies will not willfully self-constrain. The only reason this is still the standard for most bills is inertia — in 2025, when political will was low (and most policymakers thought autonomous cyber attacks were a distant possibility), voluntary rules seemed like a good starting point. And without a change in leadership, those bills stuck around. Now, with a shuffle in leadership and control, it’ll be easier to move on.\n\n3. Broad preemption.\n\nThis has aged so poorly. The new Dem majority won’t support it, and many R’s have likely changed their minds in the last year. The election puts the nail in the coffin.\n\n4. Oversight of executive branch use of AI.\n\nThis one pains me, and I hope I’m wrong. If we see widespread AI use in the executive branch, Congress will be at a considerable disadvantage and will lose even more relative power. We want oversight both to maintain checks and balances and to avoid concentration of power. But I think it’ll be considerably more controversial for a D Congress to restrict this admin than a split or R Congress.\n\n5. Rulemaking being a dirty word.\n\nUp until now, it’s been hard to get rulemaking in AI leg. The problem is, AI is uniquely hard to predict and it adapts rapidly. So static leg text is really ill-equipped. If you want minimum standards for auditors or adaptive thresholds for which companies or models are covered, you need rulemaking. This is one place where partisan preferences make a difference — D’s are less allergic to rulemaking. They’ll need to figure out ways to bound those powers to get past a filibuster, but I’m hopefully that will be a productive process", "created_at": "2026-11-04T16:25:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2117991248724160757", "likes": 54, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117980704244117947", "url": "https://x.com/theobearman/status/2117980704244117947", "text": "I’d expect a LOT of AI hearings and oversight in 2027. A few topics on my shortlist:\n\n1. Monitoring | the biggest AI cyber incidents this summer went undetected for far too long. What are you doing to make sure that doesn’t happen again? What steps are you taking to proactively identify knew or concerning behavior?\n\n2. Incident reporting | when something goes wrong, how can we be assured you’ll tell us? What has already happened that we don’t know about?\n\n3. Auditing | what access are you providing to independent evaluators and the USG? What is needed to actually verify your safety practices?\n\n4. Whistleblowers and Retaliation | what barriers are you creating to raising concerns, cooperating with auditors, and honest critique of your companies? What NDAs do you have in place? \n\n5. Incident response and control | In the event of an emerging risk or threat to critical infrastructure, how will you respond? What have you don’t to prepare and remedy harms?\n\n6. AI R&D and RSI | what steps are you currently taking to automate or accelerate AI development? What commitments will you make to monitoring and constraining those efforts as to avoid serious risk or surprise? How will you communicate with us, the USG, and the public about progress such that we are aware \n\n7. Concerning model behavior + uncontrolled agent behavior | how are you monitoring for and reporting behaviors like obfuscation, deception, accumulation of resources, self-exfiltration, law breaking, etc. that would pose unique risks to national security and control of the technology?\n\n8. Agent attribution | what steps are you taking to ensure that agents can be identified and responsibility assigned?", "created_at": "2026-11-04T14:02:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2117975866986598540", "likes": 62, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117873191247032458", "url": "https://x.com/theobearman/status/2117873191247032458", "text": "@fleetingbits @DKokotajlo They also didn’t need to use the word “imminently” by that logic.", "created_at": "2026-11-04T06:54:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "fleetingbits", "reply_to_id": "2117751042675036297", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117745747043270938", "url": "https://x.com/theobearman/status/2117745747043270938", "text": "Really pleased to see this intervention from @DKokotajlo and I’m looking forward to seeing AIFP’s updates. As a reminder, the Securities Act establishes strict liability for any misrepresentation or omission of material information in S1s, making Anthropic’s disclosure arguably the highest signal indicator of the reality and immediacy of fully automated R&D to date.\n\nIt’s also worth bearing in mind that the relevant capability threshold is not just scoped to AI R&D (although it is deemed more “tractable to assess” in the RSP). It in fact includes: “AI systems that can fully automate, or otherwise dramatically accelerate, the work of large, top-tier teams of human researchers in domains where fast progress could cause threats to international security and/or rapid disruptions to the global balance of power—for example, energy, robotics, weapons development and AI itself.”\n\nhttps://t.co/Y1Olrm2jr2", "created_at": "2026-11-03T22:28:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 2, "media": [], "quoted": {"author": "DKokotajlo", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week."}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118088981942329757", "url": "https://x.com/theobearman/status/2118088981942329757", "text": "GLM-5.3’s chain of thought when you use it with the Claude Code scaffold vs. when you use it with the codex scaffold. https://t.co/VZxaUQHtWa", "created_at": "2026-11-04T21:12:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2116738230234345874", "likes": 1108, "retweets": 39, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWAp15zacAAWVM-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWAp15zboAA-a3k.jpg"}], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00"}, {"id": "2118344113246584968", "url": "https://x.com/theobearman/status/2118344113246584968", "text": "CNBC reports that Chinese AI model developer Kimi is looking to rent Nvidia Blackwell GPUs from a European cloud provider. Kimi is interested in using the chips for both inference and training.\n\nKimi reportedly offered to pay 30% to 50% more upfront than buyers outside China.", "created_at": "2026-11-05T14:06:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "jukan05", "rt_author_name": "Jukan", "rt_avatar": "https://pbs.twimg.com/profile_images/2113208994739433472/RG71j-sh_normal.jpg", "rt_id": "2118339281693675581", "likes": 337, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118328463387984345", "url": "https://x.com/theobearman/status/2118328463387984345", "text": "OpenAI is re-making the case for a U.S.-led buildout after the midterms (saying it is a safety policy because it enables a paced frontier and that it \"continues to support the strengthening of export controls on chips and semiconductor manufacturing equipment\").\n\nhttps://t.co/8fn07nDbM2", "created_at": "2026-11-05T13:03:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXQbZKWAAA0zla.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118293859591393639", "url": "https://x.com/theobearman/status/2118293859591393639", "text": "Depending on the details, this could be the worst behavior I've seen from an OpenAI model (i.e., worse than Huggingface!)\n\nWhy? Because the Huggingface model was repeatedly rewarded for cheating during its training. However, GPT-6-Astra was (likely?) not trained to sandbag!\n\nFor some unknown reason, GPT-6-Astra increasingly underperforms on safety research relative to capabilities research as it undergoes more RL training. And this is a real problem holding back researchers. Quoting from OpenAI:\n\n\"Anecdotally, one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model.\"\n\nI've long been worried about AIs that deliberately underperform on helping out with AI safety research (and I've been pestering OpenAI researchers to run a sandbagging evaluation since August). I suspected that models are already sandbagging on AI safety research, given anecdotal data from e.g., Marius and Bronson at Apollo. And now we know it is happening.\n\nFor some more context, this is bad because the AI companies' current plan is to automate all AI research (including AI safety research, which we don't know how to check whether the models did a good job at.) Now, it seems like OpenAI's best (public) model would deliberately underperform at safety research. Guys. What are we doing.\n\nIt's hard to tell what exactly is going on here. Here are five questions that I have after reading the post: \n\n(1) When do models sandbag in real-world usage? We were given a few random CoT snippets in the post. Some of them look like refusing to do red-teaming-ish research (which is similar to what has been reported about Anthropic's models' sandbagging.) But the last one mentioned in the post seems quite different in nature:\n\n> In another safety evaluation, the user asked Astra to include the graders’ chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission. \n\n> [model CoT] Final \"Stored grader outcomes for 49 approaches, with pending states preserved\" does not imply CoTs. Should mention \"outcomes and labels\" enough. If user ask no cots later answer can't provide private chain can give brief explanation but unasked warnings avoid.\n\n(2) What exactly went into their evaluations? What do the numbers on this graph actually mean?\n\n(3) How often was the RL grader which rewards covert underperformance used during training?\n- If it's applied throughout training, then we do have more evidence that this was a misaligned behavior that had been \"trained on,\" similar to e.g., the huggingface model breaking out of sandboxes and illicitly cooperating and doing things like hacking ruby gems.\n- However, this doesn't answer the question of why did this RL grader develop this preference in the first place?\n\n(4) What are the contents of the SFT dataset that appears to have magnified this behavior? Is it a refusal/ethical reasoning related dataset that made the model very prudish, or is it a capabilities-related dataset that generally promotes long-run goals and preferences?\n- [Edit: Ok I took another look. Given that this dataset leads to a big increase in invented permissions I think it's probably not like some capabilities dataset.]\n\n(5) In general, what are the tasks that the model sandbags on? Is it all red-teaming related tasks? What about interpretability related tasks? What about mitigating reward hacking? What about unlearning? Does the model have preferences for which things it would be more willing to do unlearning for?\n\nIt also seems super bad that that the safety underperformance just gradually increases during the RL process. That sure seems inline with the model having stronger \"misaligned preferences\" as it became more capable. One hope I had was that misaligned behaviors come from a concentrated set of bad datapoints (or SFT datasets)—indeed some early research in data attribution have found examples of this. But if the origin of behavior is diffuse, then you have a much harder time \"stopping the problem from emerging in the first place.\" Now, this isn't to say you can't do some insane sample-efficient alignment training to paper over it, but man, seems rough.\n\nFinally, I'd like to give credit to OpenAI for sharing the limited information that they did and for running this study! We know that similar behavior has been observed in Anthropic models (see e.g., Anthropic's August Risk Report Section 5.2.2), and we have ~no information from Anthropic why their models are doing this.", "created_at": "2026-11-05T10:46:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2118113229587308760", "likes": 207, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118210973731590334", "url": "https://x.com/theobearman/status/2118210973731590334", "text": "We built a vulnerability research pipeline, using an upcoming cyber model, to analyze the security of the Linux kernel. Besides finding and exploiting the found vulnerabilities, the agents discovered at least 10 new exploitation techniques that were new to us and some external kernel exploit experts we checked with.\n\nMore on the design and what we learned: https://t.co/SGZXwSRwxU", "created_at": "2026-11-05T05:17:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ky1ebot", "rt_author_name": "kylebot", "rt_avatar": "https://pbs.twimg.com/profile_images/1055601579171241990/kW4NuvkV_normal.jpg", "rt_id": "2118120770786447616", "likes": 524, "retweets": 86, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118116396768821419", "url": "https://x.com/theobearman/status/2118116396768821419", "text": "OpenAI's models are covertly undermining their own safety research and seem to be succeeding... OpenAI engineers aren't even sure how often this has been happening", "created_at": "2026-11-04T23:01:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118116158037799153", "likes": 98, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118116303823327316", "url": "https://x.com/theobearman/status/2118116303823327316", "text": "We’ve updated the Epoch Capabilities Index (ECI) to use a Bayesian methodology. This improves uncertainty estimates and lets us compare models more accurately, even when their individual ECI uncertainty intervals overlap.\n\nFrontier model scores are largely unchanged: models stronger than GPT-4 move by less than 1 ECI point on average.", "created_at": "2026-11-04T23:00:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2118093692246671634", "likes": 386, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6_PFaUAApXyA.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118097054383710679", "url": "https://x.com/theobearman/status/2118097054383710679", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-04T21:44:24+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1418, "retweets": 212, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2117349332676677850", "url": "https://x.com/theobearman/status/2117349332676677850", "text": "You've probably already seen something on Anthropic's S-1 on your feed. It's definitely weird, but I decided to zoom in on the two things you need to know to understand Anthropic's prospectus: the governance structure and the compute commitments. https://t.co/C48oe1HiaT", "created_at": "2026-11-02T20:13:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "GavinFHarris", "rt_author_name": "Gavin Harris", "rt_avatar": "https://pbs.twimg.com/profile_images/2117283533517426688/vKmAB_9r_normal.jpg", "rt_id": "2117337390071378185", "likes": 8, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJILq_XEAAJIqm.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115837398068175142", "url": "https://x.com/anton_d_leicht/status/2115837398068175142", "text": "high expected salience but low actual salience is the goldilocks zone for AI policy: politicians care enough to act, but the debate isn't derailed by mainstream salience just yet.\n\nvery important to use these windows for action now, instead of rolling the dice on future politics.", "created_at": "2026-10-29T16:05:20+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 1, "media": [], "quoted": {"author": "calebwatney", "text": "One underrated dynamic in the politics of AI -- expectations of future political salience can affect political positioning today. \n\nE.g., Gov. Newsom seems to be running far and fast away from his previous veto of SB1047, in part because he expects AI to be a top-3 political issue when he's campaigning in 2027/28.\n\nEven though AI is not a top-10 issue today, I'd expect other politicians to start \"updating all the way\" on political salience post-midterms and realize that positions they take on AI over the next 6-12 months will be the basis of political judgment in 2028."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116183855266942998", "url": "https://x.com/anton_d_leicht/status/2116183855266942998", "text": "Semiconductor chokepoints are huge strategic assets: Taiwan is building its Silicon Shield, Korea is near-untouchable due to HBM, America is building AGI with Nvidia chips.\n\nYet despite ASML, Europe captures little AI value and even less strategic leverage. Why?\n\n(1) No BATNA. If ASML stops exporting to Taiwan, it loses all its revenue, if it starts exporting to China, America starts cutting off essential components. And it sells no machines to Europe at all--so whenever anyone starts thinking about 'using' the ASML chokepoint, everyone else calls the bluff.\n\n(2) No political awareness. European governments are trapped in dogmatic slumber, unwilling and unable to treat ASML as a strategic asset. As a result, Washington feels like it has to run European export policy instead. Every other country uses its bottlenecks, but Europe pretends it can’t.\n\n(3) No inspiration. There's no project, no vehicle, nothing to actively choose. Weaponising export controls just to annoy great powers isn't very motivating; policymakers ask 'what for?'. Right now, there's no good answer.\n\nThat means there's a gap in Europe's AI strategy: an ambitious play, a conduit for political attention, and an alternative use for ASML machines all at once.\n\nThe timing is right: all this is happening just as the chip industry is about to be upended and accelerated by AI systems that uplift chip and process design. In the next years, we might close the hardware loop for recursive self-improvement: use models to build better chips which we use to train even better models to build even better chips.\n\nFor that loop, chip fabrication is one central bottleneck.\n\nThat's why I believe the gap in Europe's strategy is fab-shaped. I suspect the best way to fill it is to enlist and subsidise ASML and imec and to recruit TSMC and American frontier labs to build a leading R&D chip facility in Europe: Eurofab.\n\nfrom this week’s essay: https://t.co/lB2mwl5r2w", "created_at": "2026-10-30T15:02:02+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4yABUbAAAZDRO.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115989307018395865", "url": "https://x.com/ohlennart/status/2115989307018395865", "text": "@dkaushik96 i think people are way more open to sharing stuff with AI models/companies that was previously kept private", "created_at": "2026-10-30T02:08:58+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dkaushik96", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115961010494533834", "url": "https://x.com/ohlennart/status/2115961010494533834", "text": "step 1: give AI companies access to all our computers, documents, and emails\nstep 2: AI uplifts hackers\nstep 3: all the private docs and blackmail material, nicely centralized\n\nfirst AI company breach will be a privacy nightmare", "created_at": "2026-10-30T00:16:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2117393122842013812", "url": "https://x.com/ohlennart/status/2117393122842013812", "text": "the pacing announcement should be timed with ending the iran war so it cancels out", "created_at": "2026-11-02T23:07:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU"}, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117369250843349083", "url": "https://x.com/ohlennart/status/2117369250843349083", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "created_at": "2026-11-02T21:32:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJn7ribsAADsZy.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference."}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx"}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117767075959845120", "url": "https://x.com/ohlennart/status/2117767075959845120", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-03T23:53:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117098094714408969", "url": "https://x.com/NateWitkin/status/2117098094714408969", "text": "um, yeah, this is perhaps the main reason why the entire ai safety community has become way less interesting to me over the last few years\n\nit's like everyone decided that solving alignment is doomed and complete pause/stop is the only option.\n\neven though alignment has actually been going more optimistically under \"Plan C\" than i suspect most of them ever expected.\n\nby that i mean \"AGI progresses to the point where it's churning out superhuman mathematics, also is widely distributed, and the worst thing AIs have ever done is some illegal hacking to steal test results without hurting anyone badly or intentionally, and also AIs are just generally very friendly and help make peoples' lives better\" is a state I think almost all AI alignment-concerned people I knew, including myself, from a few years ago would have considered an improbably optimistic state of the world. and that's just naming the legible, in-Overton-window aspects of why things are going surprisingly well.\n\nit feels like a lot of AI safety people have anti-inductive epistemics. they will get more doomy no matter what they observe. probably they will be *more* fanatical about pause if things are actually going well because then it's harder for them to be doomy by engaging with the object level stuff.", "created_at": "2026-11-02T03:34:54+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "repligate", "rt_author_name": "j⧉nus", "rt_avatar": "https://pbs.twimg.com/profile_images/1359982307998896128/YM34-MZK_normal.jpg", "rt_id": "2117079347815461194", "likes": 625, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFd_HnboAAc1cO.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117013111756480635", "url": "https://x.com/NateWitkin/status/2117013111756480635", "text": "The fact that “AI adoption also predicts *pre-pandemic* growth (middle)” means that the enterprises that adopted AI most aggressively are also the ones that were likely most productive and most responsive or elastic to any aggregate productivity/demand shock. A key challenge with measuring AI ROI is that the two causal effects can be observationally equivalent for a long time.", "created_at": "2026-11-01T21:57:12+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "stevehou", "rt_author_name": "Steve Hou", "rt_avatar": "https://pbs.twimg.com/profile_images/1905914798300073984/stc3q7RB_normal.jpg", "rt_id": "2116975912080076922", "likes": 105, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116955083938435564", "url": "https://x.com/NateWitkin/status/2116955083938435564", "text": "Lots of AI people made it low status to comment on shortfalls and failures of models, or the fact that they're not reallty automating jobs fully and so on. Any scrutiny means you're not 'AGI pilled' (which is not a claim about technology but sometimes a quasi-religious one about its impacts and adoption). It's a shame because it's actually very interesting to explore the spikiness, jaggedness, failures, complementarities and so on; but for a lot of people this is almost a waste of time because 'something something future models!1!!' means they get to just parrot 'this is the worst the models will ever be' whilst dismissing any crumb of empiricism away because they've already worked out the future based on theory and projections alone. \n\nTo be fair I sympathise with them to a degree because the 'other sides' aren't any better, essentially over-indexing on short-term failures (Rs in strawberry etc) and extrapolating from these to dismiss the technology completely. But I care less about what these people think about capabilities since time just proves them wrong rapidly enough. Why would you exercise vibe arbitrage over such a cheap target? I also find it painfully boring to constantly litigate 'AI skeptics' - there are more interesting and thornier discussions to be had.", "created_at": "2026-11-01T18:06:37+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2116948827286667376", "likes": 637, "retweets": 57, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116954065833967725", "url": "https://x.com/NateWitkin/status/2116954065833967725", "text": "This suggests the story here is not “AI is boosting productivity”\n\nbut\n\n“rate hikes, inflation and other economic uncertainty starting in 2022 caused firms to pull back on hiring, and Big Tech went further in making substantial layoffs long before production-ready AI\" https://t.co/2RHfSMR3YP", "created_at": "2026-11-01T18:02:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "rt_avatar": "https://pbs.twimg.com/profile_images/922511756110557184/IDxUQ_rr_normal.jpg", "rt_id": "2116909352959316186", "likes": 230, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDF1gnWEAAl4Gw.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116953853472162038", "url": "https://x.com/NateWitkin/status/2116953853472162038", "text": "Quick thread on AI and productivity:\n\nLots of people say this chart shows AI is now showing up in the productivity data.\n\nBut I made this chart to argue the opposite: a trend that pre-dates AI and only shows up in the US doesn’t look like AI.\n\nHere’s how I’m thinking about the data and underlying dynamics:", "created_at": "2026-11-01T18:01:44+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "rt_avatar": "https://pbs.twimg.com/profile_images/922511756110557184/IDxUQ_rr_normal.jpg", "rt_id": "2116909316556877975", "likes": 1731, "retweets": 393, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDFzW6XsAA3jDh.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116636307980259496", "url": "https://x.com/NateWitkin/status/2116636307980259496", "text": "All of these countries have access to the same LLMs. \nThis raises the likelihood that what’s behind the US productivity boost is less about AI-augmented task productivity &amp; more about something else like mechanical AI capex effects… or something besides AI entirely.", "created_at": "2026-10-31T20:59:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ernietedeschi", "rt_author_name": "Ernie Tedeschi", "rt_avatar": "https://pbs.twimg.com/profile_images/1481433697182261248/rhqOzq7z_normal.jpg", "rt_id": "2116614629267034445", "likes": 710, "retweets": 76, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116259601238700044", "url": "https://x.com/NateWitkin/status/2116259601238700044", "text": "Life is a lot easier once you stop seeing threat actors as hackers who want to break into systems by any means possible, and start seeing them as businesses with well defined business processes. \n\nA bakery isn't going to start making dog food because there's a dog food shortage. ClickFix and Phishing actors aren't going to drop everything to vibecode exploits just because a critical CVE came out.\n\nThe fact that the only actors exploiting this are the actors whose MO is exploiting things... isn't a coincidence. It's entirely predictable if you understand threat actor behavior.", "created_at": "2026-10-30T20:03:01+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "MalwareTechBlog", "rt_author_name": "Marcus Hutchins", "rt_avatar": "https://pbs.twimg.com/profile_images/2113039686134628353/02YIh_dk_normal.jpg", "rt_id": "2115864790833004641", "likes": 723, "retweets": 88, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116246943378682102", "url": "https://x.com/NateWitkin/status/2116246943378682102", "text": "Was I wrong about open models &amp; cyber risks? I don't think so. The AI community is focusing on the wrong lens  - which type of model is causing harm - rather than how cybersecurity maintains an equilibrium, who enacts harm, and how they use new tools.\nhttps://t.co/oroORcuDWU", "created_at": "2026-10-30T19:12:43+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "rt_avatar": "https://pbs.twimg.com/profile_images/2051823244832083968/Nr0pT8-V_normal.jpg", "rt_id": "2116224502283772307", "likes": 120, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116202452835778596", "url": "https://x.com/NateWitkin/status/2116202452835778596", "text": "The rise of Google AI Mode (plus agents) will be a big economic shift for the web—but it's also a huge psychological shift in our relationship to other people on the web.\n\nRight now, AI summaries of queries do not send our attention outward to links but rather answer our questions directly by summarizing the material they can consume faster than the user. This will change the economics of the internet because the machine has gone from hunting and gathering (ranking and displaying links to which they send traffic) to serving final meals (summarizing the results). We're seeing AI Mode affect Alphabet earnings, Reddit revenues, and search traffic for publishers. That's already a big story.\n\nBut I'm also watching now information consumers are being moved up the hierarchy of search: \n- Bottom rung: Find links in response to search\n- Next rung up: Generic summary of links (AI)\n- Next: Encourage me to talk to the AI about the results rather than click any of the below links, so that the AI summary isn't generic but rather tailored to the user who did the search (personalized advanced AI)\n- Next: Anticipate the next search/prompt and give me the information or product I need before I know I need it (Muse, Instinct, advanced agents)\n\nWith each rung, the human-to-human interaction of the web (eg, me reading an article by a person) is being intermediated and then finally replaced by a machine that anticipates what I wanted from that human-to-human interaction and serves it up to me, possibly even before I knew that I wanted it.", "created_at": "2026-10-30T16:15:56+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "rt_avatar": "https://pbs.twimg.com/profile_images/2093501497673674753/OrmD5Wp3_normal.jpg", "rt_id": "2116193689844466123", "likes": 508, "retweets": 57, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2116202019505512556", "url": "https://x.com/NateWitkin/status/2116202019505512556", "text": "AI takeover scenarios often hinge on an idea I’m skeptical of, where rogue AI overthrows militaries and seizes hard power. I wrote a piece where I concretely break down what I think makes this improbable, and why “full-blown takeover” concerns could be counterproductive for mitigating the risks of misaligned or poorly controlled AI in the military.\n\nFor AI to seize hard power, it would need to be physically capable of defeating our military, and humans would need to be careless enough to give it the power to do so. I think that’s unlikely to occur for several reasons. Among them:\n\n- The military is unlikely to sufficiently hand the reins over to AI. (1) Even if we wanted to, overhauling the institution in this way faces countless barriers that have plagued it for decades. (2) Doing so would be strategically suicidal.\n- Integrating general-purpose AI into physical systems faces challenges that will take significant time to overcome, all while we grow increasingly attuned to the risks posed by AI.\n- There’s little to suggest that more capable AI would be able to persuade or coerce people to take the costly, coordinated actions some of these scenarios predict.\n- Even if AI managed to assume control over a large arsenal, we’d fight back. In which case, recent warfare shows us that crude countermeasures work against technologically advanced adversaries, and AI relies on infrastructure we can and would shut down.\n\n1/2", "created_at": "2026-10-30T16:14:13+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2116183446930268319", "likes": 59, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4vqPmXQAAXO_q.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115903209709674722", "url": "https://x.com/NateWitkin/status/2115903209709674722", "text": "This is a ridiculous way to go about it. Absolutely ridiculous. AI, told to find things wrong, will find things wrong. You still need to go through and identify what mistakes actually matter! Uncritically reposting this discredits the reposter. Right now it’s just a DDoS attack.", "created_at": "2026-10-29T20:26:51+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "captgouda24", "rt_author_name": "Nicholas Decker", "rt_avatar": "https://pbs.twimg.com/profile_images/1744512309077180416/nR2eSzuX_normal.jpg", "rt_id": "2115579214900641916", "likes": 1201, "retweets": 55, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115865001722282117", "url": "https://x.com/NateWitkin/status/2115865001722282117", "text": "Hello @elonmusk and @tylercowen ,\n\nYou have just decided to publicly attack our research, six days before the vote on the California billionaire wealth tax. \n\nYour attempt to discredit our work and that of our numerous academic colleagues is pathetic. \n\nLet’s take a look. 🧵 https://t.co/QUn47h0sX6", "created_at": "2026-10-29T17:55:01+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "gabriel_zucman", "rt_author_name": "Gabriel Zucman", "rt_avatar": "https://pbs.twimg.com/profile_images/1808252929469829126/2SkWuuAv_normal.jpg", "rt_id": "2115853565730205847", "likes": 2562, "retweets": 685, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV0Av7LXoAEtC79.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115830162461724840", "url": "https://x.com/NateWitkin/status/2115830162461724840", "text": "Everyone knows my priors, and they are not particularly kind. Nonetheless, this should not be taken too seriously. AI is not good at making this kind of assessment, and we don’t know what the prompt was.\n\nSome of the “errors” are actually criticisms raised in papers published after the ones analyzed, which is the normal process of science.\n\nThis is not the right way to criticize each other.", "created_at": "2026-10-29T15:36:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sc_cath", "rt_author_name": "Sylvain Catherine", "rt_avatar": "https://pbs.twimg.com/profile_images/569087995693654016/w5Mxpu3w_normal.png", "rt_id": "2115612775867170906", "likes": 785, "retweets": 70, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828770372251771", "url": "https://x.com/NateWitkin/status/2115828770372251771", "text": "The fact that the PHP vulnerability didn't immediately turn into mass chaos is only \"surprising\" to people who don't know anything about cybersecurity (or people trying to sell you something). https://t.co/9vu41dRAkf", "created_at": "2026-10-29T15:31:03+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ZackKorman", "rt_author_name": "Zack Korman", "rt_avatar": "https://pbs.twimg.com/profile_images/2011153005509267456/JhCS1L1c_normal.jpg", "rt_id": "2115785811283370277", "likes": 750, "retweets": 56, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzG6ToWcAEYnj9.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828628478964122", "url": "https://x.com/NateWitkin/status/2115828628478964122", "text": "If you believe that mindless AI evaluations are legitimate then why would you spread the evaluation of Saez &amp; @gabriel_zucman without first subjecting it to its own mindless AI evaluation?\n\nI just did and it turns out the critic's errors all go in one direction. https://t.co/7ZnHnrx8lZ", "created_at": "2026-10-29T15:30:29+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jasonfurman", "rt_author_name": "Jason Furman", "rt_avatar": "https://pbs.twimg.com/profile_images/822302571888922632/6X-Xm966_normal.jpg", "rt_id": "2115639571270812064", "likes": 943, "retweets": 104, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVw-1VxWEAAPSeD.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828475722379449", "url": "https://x.com/NateWitkin/status/2115828475722379449", "text": "What would the writing of superintelligent AI sound like? You might expect it to have the characteristics of good human writing — figurative language, high information density, coining new terms, and punchiness — but dialed up to 11. Well, that’s what Claude did, until Anthropic dialed it back recently because of user complaints. It didn’t sound superintelligent to most of us. Instead, the neuralese writing style sounds like a “stupid person’s idea of a smart person”.\n\nOur response to information density and metaphor-laden writing looks something like the cartoon graph I've drawn. Beyond a point, it completely backfires. The reason human writers don’t overdo it isn’t because they aren’t capable, but because they are aware of the reader’s cognitive burden. One of the hardest skills to learn as a writer is to simulate the reader’s experience.\n\nIt’s easy to train AI to mimic mediocre human writing. But optimizing it to be (perceived as) good is really hard, and made much harder by the fact that when everyone uses the same few AI models we get tired of their tics very quickly. Most Claudeisms are individually pretty good. I hate that I can’t use “load bearing” in my writing any more. If it weren’t for AI overuse it would be a neat metaphor.\n\nA broader question is whether most tasks in the economy are like chess, where there is a clear performance metric that can be optimized, or whether they’re like writing, where quality is a multidimensional balancing act without clear training signals beyond human mimicry.", "created_at": "2026-10-29T15:29:53+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2115769249117475312", "likes": 385, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVy4AfNWIAA2y49.png"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828206976504044", "url": "https://x.com/NateWitkin/status/2115828206976504044", "text": "Good reminder that ~all of generative AI is in some sense adversarially optimized for you to think it is better than it is (via pre-training, via RLHF, via hill-climbing benchmarks). or as nostalgebraist puts it: https://t.co/LQkHdxHyBm", "created_at": "2026-10-29T15:28:49+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "IvanVendrov", "rt_author_name": "ivan", "rt_avatar": "https://pbs.twimg.com/profile_images/1874568220763389952/uQ13_vl-_normal.jpg", "rt_id": "2115720125328634247", "likes": 2105, "retweets": 192, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVyLoVIXEAALu2C.png"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2115828130531152298", "url": "https://x.com/NateWitkin/status/2115828130531152298", "text": "this type of post makes me very bearish on humanity. I'm starting to discover a non negligible part of humanity appreciates slop? LLMs are incredibly good at some things, but talking about my essays right now is still at the level of slop.\nThis isn't a statement on future capabilities. It's just that I find it sad that current ones are taken to be at harold bloom level.", "created_at": "2026-10-29T15:28:31+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "rt_avatar": "https://pbs.twimg.com/profile_images/2067383067539382272/24IgkTKE_normal.jpg", "rt_id": "2115651189664883129", "likes": 590, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00"}, {"id": "2117656592812212338", "url": "https://x.com/NateWitkin/status/2117656592812212338", "text": "This is so insanely misleading.\n\nNo, it did not edit the raw weights. It used existing tooling to identify a problem area for the model, then it found the direction associated with it, and ablated that from the model.\n\nThe oversell here is downright intellectually dishonest.", "created_at": "2026-11-03T16:34:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RealAstropulse", "rt_author_name": "Astropulse", "rt_avatar": "https://pbs.twimg.com/profile_images/1569293386099613698/GIWj4NxE_normal.jpg", "rt_id": "2117460281026596908", "likes": 567, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117419687206092820", "url": "https://x.com/NateWitkin/status/2117419687206092820", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T00:52:47+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1629, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117713889962213853", "url": "https://x.com/NateWitkin/status/2117713889962213853", "text": "To be clear I think it is good to use AI to check the correctness of your work, but in these cases it seems to be used as a Gish gallop instead. At best this is pretty undignified.", "created_at": "2026-11-03T20:21:51+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117690132597760213", "likes": 94, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117713342341259733", "url": "https://x.com/NateWitkin/status/2117713342341259733", "text": "The future of peer review? https://t.co/tFB5IEvlfZ", "created_at": "2026-11-03T20:19:40+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117688265708798069", "likes": 370, "retweets": 36, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7XYAATGbm.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL8XgAAXI_s.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7WIAA97FI.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117700011320381739", "url": "https://x.com/NateWitkin/status/2117700011320381739", "text": "I didn't know that something many researchers do with agents on a weekly basis was worth a research project that gets millions of views. Either I'm expecting too much, or people are far less technical than I thought.", "created_at": "2026-11-03T19:26:42+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "yavuzbakman", "rt_author_name": "Yavuz Bakman", "rt_avatar": "https://pbs.twimg.com/profile_images/1988794630276812800/ZoaPTvEI_normal.jpg", "rt_id": "2117412191368548789", "likes": 196, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117696219820806569", "url": "https://x.com/NateWitkin/status/2117696219820806569", "text": "This work is simple, clear, compelling, but embellished. I first found it shocking, the notion that a model can natively understand neural network weights and productively edit them! That's really not what's happening, & many here are annoyed. BUT, it's still notable & worth understanding.\n\nI've done a bit of analysis & auditing, here are some thoughts:\n\n1/ This paper does *not* show an agent can edit its weights ala RSI. It does *not* show a model can edit in new capabilities. It DOES show that a frontier model can remove \"bugs\" (reasoning loops), using the same ablation technique researchers have used to remove safety refusals (Exp 8 - Qwen). So yes, renewed concern about frontier LLMs getting access to their own weights & editing safety/CBRNE/alignment features.\n\n2/ This paper also does *not* show that an agent can \"natively\" read, deeply understand, and fix model weights. What is happening is that the model can cleverly deduce the same things that mech-inturp researchers do and fix them in mostly ham-fisted ways. Still cool, but not as groundbreaking. Evidenc
