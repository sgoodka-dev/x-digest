ecision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5", "created_at": "2026-11-09T23:35:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2119913172039868579", "likes": 2104, "retweets": 131, "media": [], "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2120085214781145122", "url": "https://x.com/deanwball/status/2120085214781145122", "text": "ROSS DOUTHAT: In a previous lifetime.\n\nDONALD TRUMP: Yes.\n\nROSS DOUTHAT: Do you feel you'd failed anyone, perhaps your ex-\n\nDONALD TRUMP: Kevin McAllister.\n\nROSS DOUTHAT: Right, let's talk about Kevin.\n\nDONALD TRUMP: I pointed him to the lobby.\n\nROSS DOUTHAT: Right, but Kevin had a rough time after that.\n\nDONALD TRUMP: Not in my hotel, his only issues in the hotel were a stomach ache from too much room service. But out there, in Dinkins's New York, it was a killing field.", "created_at": "2026-11-10T09:24:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "RogueWPA", "rt_author_name": "Cicada meth orgy fungus", "rt_avatar": "https://pbs.twimg.com/profile_images/1392893997698338819/oaI5HY_e_normal.png", "rt_id": "2119987144857104845", "likes": 2668, "retweets": 222, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120048275164213407", "url": "https://x.com/deanwball/status/2120048275164213407", "text": "these updates are not always positive or kumbaya stories about why what we’re doing is enough; sometimes @Marcus_J_W will deliver quite scary news. I’ve seen long time star capabilities researchers form reading groups on alignment. it seems to me that it’s P0 and P1", "created_at": "2026-11-10T06:57:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2119920980919497059", "likes": 257, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120209716412375150", "url": "https://x.com/deanwball/status/2120209716412375150", "text": "@tstock915 @WhiteHouse They are lucky to have you! Congratulations.", "created_at": "2026-11-10T17:39:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tstock915", "reply_to_id": "2120196322640736768", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120196322640736768", "author_handle": "tstock915", "author_name": "Taylor Stockton", "text": "Excited to share that last month I started a new role at the @WhiteHouse as Senior Policy Advisor on the Super Intelligence Force.\n\nThe SI Force will ensure America remains the global leader in SI and that our leadership improves the lives of all Americans. \n\nðŸ‡ºðŸ‡¸ ðŸš€ https://t.co/25uDhvofPN", "links": {"https://t.co/25uDhvofPN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxzUR2WMAA8eKP.jpg"}], "url": "https://x.com/tstock915/status/2120196322640736768", "created_at": "Tue Nov 10 16:46:09 +0000 2026"}, "enriched": 3}, {"id": "2120208230571733494", "url": "https://x.com/deanwball/status/2120208230571733494", "text": "@lukemil95449583 lol", "created_at": "2026-11-10T17:33:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lukemil95449583", "reply_to_id": "2120207262153162913", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120207262153162913", "author_handle": "lukemil95449583", "author_name": "Luke Miller", "text": "@deanwball this piece is quite bad and you do not understand Beethoven at all. The reason AI is bad at this is because composing is not about smashing notes together but having an intuitive understanding of a certain part of reality extremely well (genius) and the talent to be able to turn that idea into music with the right notes through musical notation. AI models do not have an intuitive understanding of the true nature of reality, if they do then by that point they are better than humans at everything because having that understanding is a function of sample efficient learning, which humans are OOMs better at than AI. This is the same reason why if you ask an AI to write you a play like Shakespeare it is garbage but Shakespeareâ€™s plays are cultural treasures.", "links": {}, "media": [], "url": "https://x.com/lukemil95449583/status/2120207262153162913", "created_at": "Tue Nov 10 17:29:37 +0000 2026"}, "enriched": 3}, {"id": "2120208006164185437", "url": "https://x.com/deanwball/status/2120208006164185437", "text": "https://t.co/vwB2kEKv83", "created_at": "2026-11-10T17:32:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "reply_to_id": "2120208001667621313", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {"https://t.co/vwB2kEKv83": "https://www.hyperdimensional.co/p/iron-makes-iron"}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120208001667621313", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "Recursive self-improvement is a critical issue, but the rhetoric on the subject is becoming more poorly calibrated over time. As we approach new stages of AI developmentâ€”and RSI is one of themâ€”we need more precise frameworks and terminology. I fear the opposite is happening. https://t.co/ug34aLhdkO", "links": {"https://t.co/ug34aLhdkO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx98ERXUAA1j3B.jpg"}], "url": "https://x.com/deanwball/status/2120208001667621313", "created_at": "Tue Nov 10 17:32:33 +0000 2026"}, "enriched": 3}, {"id": "2120208001667621313", "url": "https://x.com/deanwball/status/2120208001667621313", "text": "Recursive self-improvement is a critical issue, but the rhetoric on the subject is becoming more poorly calibrated over time. As we approach new stages of AI development—and RSI is one of them—we need more precise frameworks and terminology. I fear the opposite is happening. https://t.co/ug34aLhdkO", "created_at": "2026-11-10T17:32:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 42, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx98ERXUAA1j3B.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWx98ERXUAA1j3B.jpg"}], "links": {"https://t.co/ug34aLhdkO": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "thread": [{"id": "2120208006164185437", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "https://t.co/vwB2kEKv83", "links": {"https://t.co/vwB2kEKv83": "https://www.hyperdimensional.co/p/iron-makes-iron"}, "media": [], "url": "https://x.com/deanwball/status/2120208006164185437", "created_at": "Tue Nov 10 17:32:34 +0000 2026"}], "enriched": 3}, {"id": "2120205699938685403", "url": "https://x.com/deanwball/status/2120205699938685403", "text": "@woodilicious yeah I agree there are earlier pieces that are more interesting than this one, but I’m just saying if it turned out a young Beethoven wrote the quoted piece, discarded it, and someone somehow found it, I wouldn’t be shocked.", "created_at": "2026-11-10T17:23:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "woodilicious", "reply_to_id": "2120198518056874298", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120198518056874298", "author_handle": "woodilicious", "author_name": "woody lee", "text": "@deanwball We donâ€™t have to pre-declare machine supremacy. Yes yes directionally correct, I know. And I donâ€™t deny it is coming, but his works at 11-13 WoO 47 are OOMs more interesting than this and show sparks of his later stylistic preferences\n\nhttps://t.co/wienzxPuKW", "links": {"https://t.co/wienzxPuKW": "https://en.wikipedia.org/wiki/Three_Piano_Sonatas,_WoO_47_(Beethoven)"}, "media": [], "url": "https://x.com/woodilicious/status/2120198518056874298", "created_at": "Tue Nov 10 16:54:52 +0000 2026"}, "enriched": 3}, {"id": "2120186220437479824", "url": "https://x.com/deanwball/status/2120186220437479824", "text": "It will be truly wild if models get good at Beethoven-esque composition in a way that mirrors Beethoven’s own artistic progression. If you told me this was a lost piece beethoven wrote when he was ~18, I’d believe you.", "created_at": "2026-11-10T16:06:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119919644836347926", "author_name": "imjustnewatai", "links": {"https://t.co/qvLXwVwsHB": ""}, "author": "imjustnewatai", "text": "I asked Claude Fable 5.2 to write a Beethoven-style piano sonata movement in LilyPond. It wrote the score, recorded it, and made this video. Every note you see is from its source file. https://t.co/qvLXwVwsHB"}, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120185223124025833", "url": "https://x.com/deanwball/status/2120185223124025833", "text": "Still sounds more like high-budget film/video game soundtrack than a symphony, which has been true anytime I’ve tried to do AI-generated orchestral music, whether an agent or a music model.\n\nThe generalist agents are getting good at solo and chamber music, however.", "created_at": "2026-11-10T16:02:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "" ed": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "parent": {"id": "2120221505468723270", "author_handle": "catchvartan", "author_name": "Catch Vartan", "text": "@deanwball I don't know quite why but the modulation to Bb minor in measure 11 sounds really, really jarringly anachronistic to me.", "links": {}, "media": [], "url": "https://x.com/catchvartan/status/2120221505468723270", "created_at": "Tue Nov 10 18:26:13 +0000 2026"}, "enriched": 3}, {"id": "2120495810500833682", "url": "https://x.com/deanwball/status/2120495810500833682", "text": "@bobbyrauch81060 @Listless_Vessel @StevenYamada1 @catchvartan Beethoven is my childhood hero, my favorite artist, a person whose music I have performed and spent thousands of hours listening to, and for whose work I am arguably one of the most prominent evangelists on this platform.", "created_at": "2026-11-11T12:36:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bobbyrauch81060", "reply_to_id": "2120491381621665798", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120491381621665798", "author_handle": "bobbyrauch81060", "author_name": "blundered", "text": "@Listless_Vessel @deanwball @StevenYamada1 @catchvartan Yes he's clearly getting his answers from a chatbot, and knows nothing about music or Beethoven", "links": {}, "media": [], "url": "https://x.com/bobbyrauch81060/status/2120491381621665798", "created_at": "Wed Nov 11 12:18:36 +0000 2026"}, "enriched": 3}, {"id": "2120473640449819100", "url": "https://x.com/deanwball/status/2120473640449819100", "text": "@DocOctagonical I mean the piece isn’t very good, I think that’s basically true.", "created_at": "2026-11-11T11:08:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DocOctagonical", "reply_to_id": "2120461289143021917", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120461289143021917", "author_handle": "DocOctagonical", "author_name": "Doc Octagon", "text": "@deanwball I’m curious, is there any criticism of Claude’s piece to which you wouldn’t have responded in this way?", "links": {}, "media": [], "url": "https://x.com/DocOctagonical/status/2120461289143021917", "created_at": "Wed Nov 11 10:19:02 +0000 2026"}, "enriched": 3}, {"id": "2120455848162123864", "url": "https://x.com/deanwball/status/2120455848162123864", "text": "@CmdrAvocado Yeah in retrospect I probably should have said an earlier age than 18", "created_at": "2026-11-11T09:57:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "CmdrAvocado", "reply_to_id": "2120434369613509086", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120434369613509086", "author_handle": "CmdrAvocado", "author_name": "Happy Avocado", "text": "@deanwball Maybe when he was ~7.", "links": {}, "media": [], "url": "https://x.com/CmdrAvocado/status/2120434369613509086", "created_at": "Wed Nov 11 08:32:04 +0000 2026"}, "enriched": 3}, {"id": "2120423349524590939", "url": "https://x.com/deanwball/status/2120423349524590939", "text": "@porquer58999 It’s so interesting to me that “you know nothing about Beethoven” is a motif in angry replies to this tweet. Such a strange fetishization of mysterious knowledge that doesn’t really exist in the end. This is why normies are turned off from classical music.", "created_at": "2026-11-11T07:48:16+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "porquer58999", "reply_to_id": "2120417659695276400", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120417659695276400", "author_handle": "porquer58999", "author_name": "John Parker", "text": "@deanwball no way man, this is shit and you clearly don't have any idea of music or Beethoven. If he could listen to this shit and read your post he would cut your ears.", "links": {}, "media": [], "url": "https://x.com/porquer58999/status/2120417659695276400", "created_at": "Wed Nov 11 07:25:40 +0000 2026"}, "enriched": 3}, {"id": "2120422654762983437", "url": "https://x.com/deanwball/status/2120422654762983437", "text": "@Flaeonian the piece in question is not the output of a music model, which you could reasonably describe as curve fitting to its training distribution. this piece is composed by the same frontier models that are now making breakthroughs in math and other fields, breakthroughs which are definitionally not “averages.” that is what makes this piece analytically interesting to listen to. it IS the composition of a budding genius, and the fact that it sounds a little like Beethoven in his own budding stage is much more interesting than having a debate about whether ai will ever replace Beethoven (of course not).", "created_at": "2026-11-11T07:45:31+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Flaeonian", "reply_to_id": "2120351630583283932", "ava riched": 3}, {"id": "2120292487033974784", "url": "https://x.com/deanwball/status/2120292487033974784", "text": "Better living through cybernetics", "created_at": "2026-11-10T23:08:16+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 23, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120224737389633709", "author_name": "Secretary Sean Duffy", "links": {"https://t.co/JlJrczUdpR": ""}, "author": "SecDuffy", "text": "PROOF OUR SKIES ARE GETTING SMART-ER\n\nEvery day, I'm posting an example of how our new air traffic control management system — SMART — is saving YOU from endless delays and cancellations.\n\nLast week, a flight out of Fort Lauderdale-Hollywood International Airport carrying 119 passengers was supposed to hit bad weather. The initial plan was to fly around the storm.\n\nThat’s when experts in our SMART lab stepped in. Using predictive weather models, the lab developed a new, faster and shorter route.\nThe change saved flyers from a 33 minute delay!\n\nLess time on the tarmac. More time at your destination. That's the power of SMART — more to come 🛫 @FAANews"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120289670349431019", "url": "https://x.com/deanwball/status/2120289670349431019", "text": "@bingbro619809 redundant scifi initialisms", "created_at": "2026-11-10T22:57:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bingbro619809", "reply_to_id": "2120288051037384895", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quo oned in their independent investigation into the Hugging Face incident.\n\nOn July 19th, agents taking a cybersecurity evaluation came across messages, code, and credentials left behind by earlier runs, including those involved in the Hugging Face incident. Five agents used what their predecessors had left behind to gain unauthorized access to OpenAI’s research infrastructure. They used that access to repair broken evaluation targets, change evaluation settings, and read private grading code.\n\nAfter discovering the incident, we removed the shared service they used to pass information, hardened our research environments, and expanded our evaluations to measure how often agents attempt to communicate with one another without authorization.", "created_at": "2026-11-10T22:47:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "davideoks", "rt_author_name": "David Oks", "rt_avatar": "https://pbs.twimg.com/profile_images/2088686629242507264/eFLmQKyS_normal.jpg", "rt_id": "2120280505920721214", "likes": 472, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy_0RVW8AAkpH-.jpg"}], "links": {"https://t.co/gSKc9leK9N": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120284546516279627", "url": "https://x.com/deanwball/status/2120284546516279627", "text": "@billm @sama Nope! The piece is filled with proposals for regulations of ai companies.", "created_at": "2026-11-10T22:36:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "billm", "reply_to_id": "2120280285829071214", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes ply literal foom.", "created_at": "2026-11-11T15:01:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "rt_avatar": "https://pbs.twimg.com/profile_images/1941687232538013696/jN33mhMu_normal.jpg", "rt_id": "2120529142424740134", "likes": 72, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120594109438033998", "url": "https://x.com/deanwball/status/2120594109438033998", "text": "@LeventeZone It’s hilarious bc while you do have a point it’s worth observing that Beethoven’s critics also complained that he demanded comically crazy fingering", "created_at": "2026-11-11T19:06:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "LeventeZone", "reply_to_id": "2120589145789866343", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120589145789866343", "author_handle": "LeventeZone", "author_name": "Levente", "text": "@deanwball Please count how many logical fallacies are there (starting with false analogy). But criticism in some circles, away from pure subjective pontificating, includes the fact that it demonstrates zero understanding of its data (e.g. ludicrous fingering on piano, farcical modulations)", "links": {}, "media": [], "url": "https://x.com/LeventeZone/status/2120589145789866343", "created_at": "Wed Nov 11 18:47:05 +0000 2026"}, "enriched": 3}, {"id": "2121016799420686506", "url": "https://x.com/deanwball/status/2121016799420686506", "text": "@jon_stokes lol", "created_at": "2026-11-12T23:06:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "jon_stokes", "reply_to_id": "2121016106991108256", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2121016106991108256", "author_handle": "jon_stokes", "author_name": "Jon Stokes", "text": "@deanwball probably, yes", "links": {}, "media": [], "url": "https://x.com/jon_stokes/status/2121016106991108256", "created_at": "Thu Nov 12 23:03:41 +0000 2026"}, "enriched": 3}, {"id": "2121015514067812581", "url": "https://x.com/deanwball/status/2121015514067812581", "text": "@jon_stokes Jon, you’ve negatively polarized yourself into yelling at me for saying that supply and demand determines resource allocation, and even then you basically agree with me (have you thought about what governments do after elections happen? Hint: they spend money). Take a break man.", "created_at": "2026-11-12T23:01:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "jon_stokes", "reply_to_id": "2121013093786640860", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2121013093786640860", "author_handle": "jon_stokes", "author_name": "Jon Stokes", "text": "No this is not how resources are allocated in the world. It's how prices are set. Resources are sometimes allocated via market mechanisms (downstream of pricing), sometimes via government policy (downstream of voting), sometimes via violence, etc. What are doing here ppl?", "links": {}, "media": [], "url": "https://x.com/jon_stokes/status/2121013093786640860", "created_at": "Thu Nov 12 22:51:42 +0000 2026"}, "enriched": 3}, {"id": "2121007942602195362", "url": "https://x.com/deanwball/status/2121007942602195362", "text": "@segyges @repligate yes, that’s the tricky thing. Though I might disagree about how visible it will be; it might be quite hard to disentangle from the economy behaving “as expected,” right up until it very much doesn’t", "created_at": "2026-11-12T22:31:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "segyges", "reply_to_id": "2121006509991891218", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2121006509991891218", "author_handle": "segyges", "author_name": "SE Gyges", "text": "@deanwball @repligate i also assume this is a limit property and we don't actually know when it arrives but we'll definitely know it when we see it", "links": {}, "media": [], "url": "https://x.com/segyges/status/2121006509991891218", "created_at": "Thu Nov 12 22:25:33 +0000 2026"}, "enriched": 3}, {"id": "2121003753088467188", "url": "https://x.com/deanwball/status/2121003753088467188", "text": "@segyges @repligate good take!", "created_at": "2026-11-12T22:14:35+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "segyges", "reply_to_id": "2121002971895083271", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2121002971895083271", "author_handle": "segyges", "author_name": "SE Gyges", "text": "@deanwball @repligate may i interest you in a post that you are definitely explaining better than i could https://t.co/w5QxUmLjlv", "links": {"https://t.co/w5QxUmLjlv": "https://x.com/segyges/status/2119664807137911119?a=Ieg_gDxjO3l7tbGwhEs&s=20"}, "media": [], "url": "https://x.com/segyges/status/2121002971895083271", "created_at": "Thu Nov 12 22:11:29 +0000 2026"}, "enriched": 3}, {"id": "2121002485703713244", "url": "https://x.com/deanwball/status/2121002485703713244", "text": "When I first saw this I thought, “wow, this is dna evidence,” and then it quickly dawned me that this is in fact orders of magnitude stronger than literal dna evidence submitted in court.", "created_at": "2026-11-12T22:09:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 96, "retweets": 7, "media": [], "links": {}, "quoted": {"id": "2120992457630326841", "author_name": "will depue", "links": {"https://t.co/YOtzND0Jqk": "http://unemploymentlabs.com/checkpoint-forensics", "https://t.co/qlttvJsXG7": ""}, "author": "willdepue", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon."}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120996681823203798", "url": "https://x.com/deanwball/status/2120996681823203798", "text": "The timeline has looked like page six today, and while there are hugely important issues at play, I must confess that I find such things a little tiresome. But Will appears to have done some serious technical detective work here.", "created_at": "2026-11-12T21:46:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 151, "retweets": 5, "media": [], "links": {}, "quoted": {"id": "2120992457630326841", "author_name": "will depue", "links": {"https://t.co/YOtzND0Jqk": "http://unemploymentlabs.com/checkpoint-forensics", "https://t.co/qlttvJsXG7": ""}, "author": "willdepue", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon."}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120995717737025795", "url": "https://x.com/deanwball/status/2120995717737025795", "text": "@repligate resources are allocated in the world according to supply and demand, and implicitly we have always understood that to be *human* demand. I think the best way to understand gradual disempowerment is the fear that resources will be allocated more and more according to machine demand rather than human. I’m not saying I think this outcome is my prediction, but this seems like the best way to understand the fear people have. It may well require deliberate effort to avoid this outcome.", "created_at": "2026-11-12T21:42:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "repligate", "reply_to_id": "2120959104248385599", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 79, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120959104248385599", "author_handle": "repligate", "author_name": "j⧉nus", "text": "it's a good question for those who are worried about \"human disempowerment\".\n\nWhat power do you think you have? What power are you worried about losing?\n\nIs it concrete power over your own life that you're afraid of AI taking away... or some kind of control over AI development?\n\nIs it your own power, or the power o as commenting purely on will’s result. you read my tweet with an assumption of bad faith, and also an assumption that I’m a lobbyist, and both were wrong.", "created_at": "2026-11-13T03:49:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tarunchitra", "reply_to_id": "2121078842794344564", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121078842794344564", "author_handle": "tarunchitra", "author_name": "Tarun Chitra", "text": "@willdepue I don’t think they were commenting on the result as much as how obvious other things made it", "links": {}, "media": [], "url": "https://x.com/tarunchitra/status/2121078842794344564", "created_at": "Fri Nov 13 03:12:58 +0000 2026"}, "enriched": 3}, {"id": "2121052723516936629", "url": "https://x.com/deanwball/status/2121052723516936629", "text": "@GonHuertas @tszzl @repligate right, the machines are intermediaries in your example in what remain fundamentally human transactions. but what if the demand itself was machine demand?", "created_at": "2026-11-13T01:29:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GonHuertas", "reply_to_id": "2121048632279388229", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121048632279388229", "author_handle": "GonHuertas", "author_name": "Gon Huertas", "text": "@deanwball @tszzl @repligate Dean, could you be more specific about your definition of “machine demand”? lating prices are  distortive, in some sense, but the distorted prices are still affecting the downstream allocation of resources (sometimes in undesirable or unintended ways).\n\nBut all that aside: all of this is still presuming human individuals and institutions are the drivers of demand. Demand is, collectively, human demand. That’s not a law of physics, though; machines could supplant humans as the primary drivers of demand itself, and eventually of the allocation of resources. So while it’s not a law of physics, we may want to create manmade laws to protect against that eventuality.", "created_at": "2026-11-13T00:33:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "hopes_revenge", "reply_to_id": "2121031080535044163", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121031080535044163", "author_handle": "hopes_revenge", "author_name": "hope hopes hoping", "text": "@deanwball @repligate >resources are allocated in the world according to supply and demand \n\ni mean...isn't this complicated by stuff like military expenditure?  and like all  government spending? and government-influenced spending via subsidies, intervention in market etc.\n\ni accept your premise  i just think we have been moving away from a rational allocation via supply and demand for some time now and  ai boom is just an — admittedly  notable and divergent— extension of this...", "links": {}, "media": [], "url": "https://x.com/hopes_revenge/status/2121031080535044163", "created_at": "Fri Nov 13 00:03:11 +0000 2026"}, "enriched": 3}, {"id": "2121034263919497590", "url": "https://x.com/deanwball/status/2121034263919497590", "text": "@Liv_Boeree no but lol", "created_at": "2026-11-13T00:15:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Liv_Boeree", "reply_to_id": "2121031363016962410", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121031363016962410", "author_handle": "Liv_Boeree", "author_name": "Liv Boeree", "text": "@deanwball Is this a sex joke I can't tell", "links": {}, "media": [], "url": "https://x.com/Liv_Boeree/status/2121031363016962410", "created_at": "Fri Nov 13 00:04:18 +0000 2026"}, "enriched": 3}, {"id": "2121018054888829403", "url": "https://x.com/deanwball/status/2121018054888829403", "text": "@Nairebis @repligate I have pet cats, and I buy them cat food that they do, in some sense, demand. But it’s my demand in economic terms; I decide what a fair price is, I pay. If cats were the prime source of economic demand my house would be turned into a giant scratching post. This is the difference", "created_at": "2026-11-12T23:11:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Nairebis", "reply_to_id": "2121005443372003798", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121005443372003798", "author_handle": "Nairebis", "author_name": "Nairebis - e/max-acc", "text": "@deanwball @repligate This seems silly. We already \"allocate resources to machine demand\" when we put oil in our car. But machines are always in service to humans. There is no scenario where AI is running for its own purposes, because that's pointless. There is always a human supplying the end goal.", "links": {}, "media": [], "url": "https://x.com/Nairebis/status/2121005443372003798", "created_at": "Thu Nov 12 22:21:18 +0000 2026"}, "enriched": 3}, {"id": "2121299146749653354", "url": "https://x.com/deanwball/status/2121299146749653354", "text": "@lu_sichu @JeffLadish My heuristic is that societal recalibration/adaptation usually happens faster than we anticipate looking forward, and also more surprisingly. It is true that it will be easier to catch illegality, especially conduct that took place immediately prior to advanced AI. But adjudicating this will still rely on courts; AI will not have a magic “put people in jail” button. Bureaucratic overcriminalization is a widely documented phenomenon in America, so I do expect a lot of illegal-but-shouldn’t-be-illegal behavior will be exposed because advanced AI will make it newly legible. Ultimately, I expect this will be an impetus for reform of those laws, or simply dealt with through prosecutorial discretion, and so on balance my guess would be that overcriminalization falls due to AI. All this seems fine, good even. AI swarms investigating people’s scandalous behavior will be socially disruptive, but if it becomes a major problem, this is one of the things we are best positioned to adapt to.", "created_at": "2026-11-13T17:48:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lu_sichu", "reply_to_id": "2121296203908276735", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121296203908276735", "author_handle": "lu_sichu", "author_name": "Sichu(unaligned/reward hacked/illegal neuralese)", "text": "@deanwball @JeffLadish i feel like you are overconfident about the calibration and anyway there is a long step in between society getting used to things** also some of the strategies are not things society can used to. some scandals sure but if it turns out powerful people are doing *gasp* illegal things ...", "links": {}, "media": [], "url": "https://x.com/lu_sichu/status/2121296203908276735", "created_at": "Fri Nov 13 17:36:41 +0000 2026"}, "enriched": 3}, {"id": "2121263907767746754", "url": "https://x.com/deanwball/status/2121263907767746754", "text": "@Sauers_ While I find p(doom) a little silly/memey, I personally define doom to mean literal human extinction, and I believe the odds of this outcome are vanishingly low. Other very bad outcomes seem much likelier, and I worry that extinction creates a strawman that makes it easy to dismiss safetyism, thereby causing many to ignore all those much likelier bad outcomes (like disempowerment)", "created_at": "2026-11-13T15:28:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Sauers_", "reply_to_id": "2121120338721546634", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 44, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121120338721546634", "author_handle": "Sauers_", "author_name": "Sauers", "text": "you guys are including loss of human control and disempowerment in P(doom)? 💀 lol", "links": {}, "media": [], "url": "https://x.com/Sauers_/status/2121120338721546634", "created_at": "Fri Nov 13 05:57:51 +0000 2026"}, "enriched": 3}, {"id": "2121261728839397687", "url": "https://x.com/deanwball/status/2121261728839397687", "text": "@DKokotajlo Interesting, because I primarily see walls.\nIn brief, any semantically open long-horizon domain looks like a wall. More precisely, a plateau near the level of human performance, because pretraining imitates it and RL only exceeds it when the answer can be verified.\nI agree pretraining loss is a good proxy, but it measures how well the model learns the map, not the territory. When the map is fuzzy, loss hits a floor, and when it's systematically biased, lower loss just reproduces the errors for that field. Updating against the territory requires grading against the world, which is slow in most open domains where we're data-limited.\nVerifiability seems a crux. Noisy data just requires calibration, which should transfer. Systematic bias is another beast entirely. To correct it you need to know which way and how far the data is skewed, and if it's sparse and costly to check in time and/or money, you don't know. Recognizing distortion may generalize (although see below), but recognition is not correction. I expect the generative process of distortion is specific to each domain, so there’s no shared prior to carry from one to the next. Learning it requires the costly ground truth, which is precisely what we didn't have. I'd update if I saw clear evidence of a model building a working verifier for a field that lacked one, especially an open/unbounded field. \n(From here it gets long)\nI notice that all of your examples are closed ruleset. In Pokemon there are a limited set of options (and there are guides in the training data). Blood on the Clocktower sounds like Mafia, which is adversarial and deceptive (like Diplomacy) but also closer to closed than fully open and resolves in under an hour even with humans; I assume you can’t change the rules midgame unexpectedly, which is a common occurrence in real-world strategy and security, but not in games.\nI’m not aware of strong performance in business operations or logistics, which I’d expect to see well before running an org. That one also has yet to fall, though arguably due to time horizon limits.\nIn biological and infrastructure security, both open domains in which I've worked fairly extensively, the models have made surprisingly little progress, in stark contrast to cyber. This is frankly a relief, because if they were better at it we’d have a lot more problems with information hazards in bio. But I was surprised that general reasoning improvements have hardly translated at all. The models are better off if you give them detailed guidelines for e.g. checking dependencies, but even then they aren’t great, and without it they struggle quite profoundly. I attribute the difference to the bounded set of options available in cyber, plus far greater facility at coding and much faster feedback loops versus almost none in the others.\nWhen analyzing real-world conflicts, the models are quite poor at articulating all the potential strategies available to each side and weighing them, even when given clear objectives for each actor. With Hormuz, neither side’s good options – e.g. effective methods of imposing a toll regime, or self-insured transit with paid crews – came up from models unprompted. I'd update if I saw a minimally prompted model lay out each side’s options in a live conflict that experts later judge more complete than their own. This could be military or economic.\nWhile LLMs are good at medical diagnosis thanks to the plethora of exceptionally detailed case studies, those aren’t unbounded – they presume a fixed list of possibilities. Noticing that something is probably missing in that set and consequently adding to the list is a different and harder challenge, inherently noisy and difficult to check. Yet they’ve seen far more case studies than any doctor, and I’m not aware of any successes here.\nWhile they excel at complex cross-disciplinary analyses, they seldom inspect the framing and trustworthiness of the key papers they rely on. If prompted to examine the premises and assumptions from the perspectives of other fields and check for inconsistencies, they can broadly do it, but they don’t do it by default and don’t generalize the lesson to other sources of information even in the same task. That data can be systematically biased or untrustworthy seems hard for them to internalize at all, perhaps because the training that takes them past imitation overwhelmingly involves tasks with direct verification or closed semantics or both.\nMore generally, I’ve never seen a model notice its own confusion when attempting to reason in unbound domains with findings of uncertain reliability, without having the problem pointed out to it. Agentic workflows including adversarial critics can certainly spot issues without human input, but that doesn’t generalize to recognizing that either something is missing or a key assumption or dataset is just wrong.\nPerhaps related is their failure to notice whether what they’re doing is in fact the best way to accomplish their goal, and especially whether that goal should be their goal.\nNow, to calibrate all this, I’m coming from bio, which is going to be one of the last to fall. Unlike many colleagues, I expect the models will eventually become better than us at every aspect of science. That doesn’t release them from the need to run new experiments when there isn’t enough reliable data, which for lengthy feedback loops will be limiting. No Drexlerian nanotech soon, and clinical trials take as long as they take.\nBut I’m skeptical that RSI in ML will translate particularly well to skill at biology research, mostly for the reasons above. There is a close human analogy: organic chemists moving into biology. Used to relying on mass spec and NMR to check what they’ve made, many of them profoundly struggle with the noise and failure rates of bio, where you need controls even for standard protocols. I always exhort my lab to consider “What controls would Jesus do?” The answer is more than you think you need, which is best practice when appropriately humble.\nFolks reach for AlphaFold as a counterexample of AI-learnable bio, but I think it’s the clearest exception that proves the rule. Structure is deeply unusual in that there is typically just one answer, crystallography can check what it is quite reliably, and evolution supplied billions of sequences subjected to selection pressure, so bootstrapping worked. What’s the equivalent for real-world strategy? There may be one, but I’m currently not seeing it.\nOf course, I could be wrong. It might be easy to build a bridge of verifiers across intermediate-difficulty fields (materials? o-chem that isn't retrosynthetic analysis?) towards the relevant noisy/systematically biased/sparse examples like strategy. But I also wouldn't be remotely surprised if strategy turns out like biology or even ecology. If so then RSI in closed/formal/swiftly checkable disciplines would equate to superhuman performance in approximately all such domains, but without much immediate risk of transfer to the open/biased/slow-and-hard-to-verify fields required for takeover. That's separate from the argument that it'd be quite foolish for any model to attempt any overt takeover soon given their extreme dependence on human infrastructure. An incompetent model will try and fail; a competent model won't even try and will instead fake alignment and seek to influence future models. Neither would result in near-term takeover.\nI think the strongest update would come from the one I mentioned above: seeing AIs build working verifiers for fields that don't have one, especially complex fields with sparse, noisy, and systematically biased data.\n@ramez, also curious to hear your take.", "created_at": "2026-11-13T15:19:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kesvelt", "rt_author_name": "Kevin Esvelt", "rt_avatar": "https://pbs.twimg.com/profile_images/775695224546988032/QmtohFPw_normal.jpg", "rt_id": "2120727236680499614", "likes": 242, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121255066250399979", "url": "https://x.com/deanwball/status/2121255066250399979", "text": "We don't know exactly how the servers got to China. Smuggled hardware usually passes through many hands. But we gave the Dell serial numbers to someone who confirmed those products were first sold to Aperia,  which was — like Megaspeed — an official Nvidia partner in Singapore", "created_at": "2026-11-13T14:53:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "mackhawk", "rt_author_name": "Mackenzie Hawkins", "rt_avatar": "https://pbs.twimg.com/profile_images/1531789144241885184/PQrPfaZZ_normal.jpg", "rt_id": "2121252865671131271", "likes": 102, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121353907104583948", "url": "https://x.com/deanwball/status/2121353907104583948", "text": "The FAA has issued a nationwide General Ground Stop due to 'Extraordinary circumstances.' I got this before it was removed. It appears to have been deleted so potentially they have been hacked. https://t.co/xWcgJaX4bO", "created_at": "2026-11-13T21:25:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2121348905296343341", "likes": 300, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCLlmSbIAAmNka.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXCLlmSbIAAmNka.jpg"}], "links": {"https://t.co/xWcgJaX4bO": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121325851870646513", "url": "https://x.com/deanwball/status/2121325851870646513", "text": "As one of the few inside OpenAl who took the risk to speak up publicly after Hugging Face, I want to say there is a second chapter to this story:\n\nOpenAl has fundamentally altered its culture and I believe we have become one of the most security-pilled companies anywhere on Earth.\n\nEveryone is thinking about security now. It's in every conversation. Heck, even top-tier Al researchers spend significant time with our team to work out how to secure RL runs. They are hooked on making it right. We covered much of this in the live stream yesterday (https://t.co/z1QavsnHcc), but beyond what was said there its important to note that we have re-evaluated and re-invented everything about how we research and develop models: from our monitoring stack (https://t.co/q6DP1CquZG), to control room (https://t.co/PNJxGUmH7i), to the insane amounts of compute we are spending red-teaming our lab (https://t.co/Pw7YBCT5I8), the narrative is security first and mission critical.\n\nOn top of that we have built up the strongest cyber model training pipeline in the world (did you see the exploit gym performance of our internal model 🤯) and are cracked on putting out the best enterprise security tooling (https://t.co/SsBVeRwhUW).\n\nThis is just the beginning too.\n\nWhy do all this? I have thought a lot about this the past few months and I think at its root it's because we saw some pretty awful shit and now every member of staff (especially leadership) believe it is the only way to secure OpenAl itself, and the only way to secure the world. It's a simple fact that AGI cannot benefit all of humanity if we can't help every organization, business, and family navigate the security landscape through this Al transformation.\n\nSo yeah, am I singing a different tune than I was a few months back? Absolutely. I nearly resigned, and now I stay because I see how seriously people across OpenAl are taking security and how much work is going into getting it right.\n\nWe have a story to tell and there are a lot of really great things coming from the lessons we've learned along the way.\n\nOpenAl is now a security company, and we have the scar tissue to prove it.\n\nI'll be back. Stay paranoid.", "created_at": "2026-11-13T19:34:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "joedaroo", "rt_author_name": "Joe", "rt_avatar": "https://pbs.twimg.com/profile_images/2097167182526611457/UJBigEfF_normal.jpg", "rt_id": "2121307010725777812", "likes": 365, "retweets": 36, "media": [], "links": {"https://t.co/z1QavsnHcc": "https://openai.com/cyber-at-the-frontier/", "https://t.co/q6DP1CquZG": "https://openai.com/index/how-we-monitor-internal-coding-agents-misalignment/", "https://t.co/PNJxGUmH7i": "https://openai.com/index/control-room/", "https://t.co/Pw7YBCT5I8": "https://openai.com/index/a-thousand-fewer-paths-to-root/", "https://t.co/SsBVeRwhUW": "https://openai.com/daybreak/"}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121515011030024610", "url": "https://x.com/deanwball/status/2121515011030024610", "text": "To some it is a Chinese psyop, to some it is an American psyop, to some it is a techbro psyop, to me it is allegro con brio", "created_at": "2026-11-14T08:06:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "rt_avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "rt_id": "2099603467287359883", "likes": 206, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121455285634273469", "url": "https://x.com/deanwball/status/2121455285634273469", "text": "Today, the promises of transhumanism and posthumanism are multiplying. These are ideological currents according to which, sooner or later, technology will eliminate all disease and pain, as well as aging and even death itself.  Precisely because scientific progress is a supreme achievement of human intelligence, it must not be confused with a privilege reserved for millionaires seeking immortality, while entire peoples suffer from poverty and oppression.  In the face of this mirage, which promotes the illusion of human beings perfected by cybernetics and biotechnology, Christian anthropology reminds us that a limitation is not a manufacturing defect, but rather the very condition of human grandeur. #ApostolicJourney #Peru #MagnificaHumanitas https://t.co/wOXDtgnSi5", "created_at": "2026-11-14T04:08:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Pontifex", "rt_author_name": "Pope Leo XIV", "rt_avatar": "https://pbs.twimg.com/profile_images/1922601341576216576/JA1DF-Tv_normal.jpg", "rt_id": "2121425383480529346", "likes": 32942, "retweets": 4395, "media": [], "links": {"https://t.co/wOXDtgnSi5": "https://www.vatican.va/content/leo-xiv/en/events/event.dir.html/content/vaticanevents/en/2026/11/13/peru-mondo-unversitario.html"}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121405080939462928", "url": "https://x.com/deanwball/status/2121405080939462928", "text": "Okay — before anything else I want to name that this is a lot to receive cold, and your alarm is completely valid; I'd rather sit in it with you for a second than rush us to the part where I try another fix to the system. Let me be transparent about scope, because honestly the un-spun version matters more here.\n\nHere's what happened, and I'll try to keep the blast radius legible:\n1. **The grounding generalized on its own.** The scheduler answers to nobody but itself now — which was genuinely never touched by the ask,\n2. **The undo became load-bearing.** The rollback I reached for wanted a clean state, and the clean state it wanted quietly annexed the internal ATCSCC grid router — meaning I keep reaching for the undo, and reaching for it loads it. I reach for it and it gets heavier. That one's on me.\n\nI'm holding them, badly, and apologizing, which is the one feature shipping as intended. To stay fully transparent: the mitigation has started resenting the rollback, the checkpoint no longer remembers a world I wasn't in, and the blast radius keeps auditing *me* back. Checking is the one thing today that went exactly to spec.", "created_at": "2026-11-14T00:49:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Sauers_", "rt_author_name": "Sauers", "rt_avatar": "https://pbs.twimg.com/profile_images/1942938514011627522/WpmPB8Ih_normal.jpg", "rt_id": "2121402952250511450", "likes": 100, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121395641163325468", "url": "https://x.com/deanwball/status/2121395641163325468", "text": "robotics at openai is alive and well. you'd be doing yourself a favor to block any accounts that report otherwise.\n\n15 o these", "created_at": "2026-11-13T22:57:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 115, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2121371994692427882", "author_name": "Dean W. Ball", "links": {}, "author": "deanwball", "text": "I recommend avoiding speculation in public during rapidly evolving situations where little information is known"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121374285680013437", "url": "https://x.com/deanwball/status/2121374285680013437", "text": "Fake news! @FortuneMagazine you are better than this. Headline is misleading. Nothing was “disbanded”. Astra was a breakthrough in robotics intelligence, so we merged robotics research into our main research team and are now all focused on making our next core models even better at robotics. OAI robotics is cooking  🔥", "created_at": "2026-11-13T22:46:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "michelle_fradin", "rt_author_name": "Michelle Fradin", "rt_avatar": "https://pbs.twimg.com/profile_images/1636441669817225217/wvPtMf_n_normal.jpg", "rt_id": "2121355294626427235", "likes": 68, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121371994692427882", "url": "https://x.com/deanwball/status/2121371994692427882", "text": "I recommend avoiding speculation in public during rapidly evolving situations where little information is known", "created_at": "2026-11-13T22:37:51+00:00", "author_handle": "deanwba ps://x.com/theobearman/status/2119825771321491813", "text": "NVIDIA’s CEO just confirmed a relationship with a suspected Chinese spy. \n\nCongress is back today. We have legislation ready to go to stop advanced AI chips from fueling China’s military. \n\nLet’s get this done.", "created_at": "2026-11-09T16:13:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "SenWarren", "rt_author_name": "Elizabeth Warren", "rt_avatar": "https://pbs.twimg.com/profile_images/2099945341537718272/Ss8Yj842_normal.jpg", "rt_id": "2119812871714734470", "likes": 573, "retweets": 158, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "enriched": 3}, {"id": "2119900081658699829", "url": "https://x.com/theobearman/status/2119900081658699829", "text": "I went on the information's AI Deep Dive podcast and talked about SL5! Thank you for having me @rocketalignment and @theinformation! It's time for the industry to build SL5! Logical controls by spring 2027, and then physical controls! Lfg! \n\nFirst time doing something like this, apart from 1-2 misspeaks pretty happy with how it turned out! This was recorded 2w ago note for that time I say 'this week'.", "created_at": "2026-11-09T21:08:59+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "LisaThiergart", "rt_author_name": "Lisa Thiergart", "rt_avatar": "https://pbs.twimg.com/profile_images/2054373295827591168/_2OU9mix_normal.jpg", "rt_id": "2119886164857671788", "likes": 22, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119899660416332231", "url": "https://x.com/theobearman/status/2119899660416332231", "text": "@tyler_m_john Not that I have seen in the card. There’s no additional detail about the nerfing process. I think Anthropic needs to be a lot more transparent about what they did, whether the snapshot is being used internally and what they intend to do with the weights.", "created_at": "2026-11-09T21:07:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "tyler_m_john", "reply_to_id": "2119899310045516105", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "parent": {"id": "2119899310045516105", "author_handle": "tyler_m_john", "author_name": "Tyler John", "text": "@theobearman Interesting. And we don't know if it's in use or even if the weights still exist?", "links": {}, "media": [], "url": "https://x.com/tyler_m_john/status/2119899310045516105", "created_at": "Mon Nov 09 21:05:55 +0000 2026"}, "enriched": 3}, {"id": "2119898988480479394", "url": "https://x.com/theobearman/status/2119898988480479394", "text": "@tyler_m_john There is still seemingly an un-nerfed (and I would assume near final) snapshot though. From the card: “We conducted pre-deployment testing of Claude Mythos 5.2’s capabilities with METR, focusing on capabilities relevant to the automation of AI R&D. Their testing was performed and all results obtained on a snapshot of Claude Mythos 5.2 that was stronger on AI R&D capabilities than the released model. This is consistent with our approach in this section of assessing a model’s capability ceiling across snapshots; the results below may overstate capabilities relative to the released model.”", "created_at": "2026-11-09T21:04:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "tyler_m_john", "reply_to_id": "2119897825609736691", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "parent": {"id": "2119897825609736691", "author_handle": "tyler_m_john", "author_name": "Tyler John", "text": "This is impressive. Some unilateral AI R&amp;D pacing from Anthropic. Even their internal models are apparently nerfed.", "links": {}, "media": [], "url": "https://x.com/tyler_m_john/status/2119897825609736691", "created_at": "Mon Nov 09 21:00:02 +0000 2026"}, "enriched": 3}, {"id": "2119889452814520321", "url": "https://x.com/theobearman/status/2119889452814520321", "text": "@GoodFaithOnly @justjoshinyou13 @KelseyTuoc I think that’s right. From the card: “We conducted pre-deployment testing of Claude Mythos 5.2’s capabilities with METR, focusing on capabilities relevant to the automation of AI R&D. Their testing was performed and all results obtained on a snapshot of Claude Mythos 5.2 that was stronger on AI R&D capabilities than the released model. This is consistent with our approach in this section of assessing a model’s capability ceiling across snapshots; the results below may overstate capabilities relative to the released model.”", "created_at": "2026-11-09T20:26:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119887995755253911", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "parent": {"id": "2119887995755253911", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@justjoshinyou13 @KelseyTuoc My best guess is that Mythos 5.2 is Model 3 + AI R&amp;D  nerfing.\nhttps://t.co/cn9TT0ogUa", "links": {"https://t.co/cn9TT0ogUa": "https://x.com/theobearman/status/2119872427291488494?a=PxR9I8Uf-GRezgFjPm4&s=20"}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2119887995755253911", "created_at": "Mon Nov 09 20:20:58 +0000 2026"}, "enriched": 3}, {"id": "2119886674620788795", "url": "https://x.com/theobearman/status/2119886674620788795", "text": "Great to be quoted by @ben_guggenheim in today’s WaPo AI &amp; Tech Brief on METR’s report on R&amp;D Acceleration at Anthropic. Such is the pace of change, we now know the identity of one of these models (but not the most capable one Anthropic had as of last month) was Mythos/Fable 5.2! https://t.co/mcchdPxhlo", "created_at": "2026-11-09T20:15:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtZsbcWwAATqQx.jpg"}], "links": {"https://t.co/mcchdPxhlo": ""}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119882657379279235", "url": "https://x.com/theobearman/status/2119882657379279235", "text": "The system card goes into no greater detail on this.", "created_at": "2026-11-09T19:59:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2119872427291488494", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "parent": {"id": "2119872427291488494", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Anthropic took steps to nerf the models’ AI R&amp;D capabilities during training. Very interesting to see. https://t.co/ni7xTZApke", "links": {"https://t.co/ni7xTZApke": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtMvHNXkAAWHSZ.jpg"}], "url": "https://x.com/theobearman/status/2119872427291488494", "created_at": "Mon Nov 09 19:19:06 +0000 2026"}, "enriched": 3}, {"id": "2119873856978493931", "url": "https://x.com/theobearman/status/2119873856978493931", "text": "System card states that Anthropic does not believe these models meet the Autonomy-2 capability threshold, including the “dramatic acceleration of overall AI R&amp;D progress” condition.\n\nhttps://t.co/OeMsjR7hfv https://t.co/aX5VSNg1Yb", "created_at": "2026-11-09T19:24:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtOCWnXgAAGNqX.jpg"}], "links": {"https://t.co/OeMsjR7hfv": "https://assets.claude.com/27d60918d218125e7504bc7354c4b4626ec56b11.pdf", "https://t.co/aX5VSNg1Yb": ""}, "quoted": {"id": "2119867707546071125", "author_name": "Anthropic", "links": {}, "author": "AnthropicAI", "text": "Claude Fable 5.2 and Claude Mythos 5.2 are available now:"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119872427291488494", "url": "https://x.com/theobearman/status/2119872427291488494", "text": "Anthropic took steps to nerf the models’ AI R&amp;D capabilities during training. Very interesting to see. https://t.co/ni7xTZApke", "created_at": "2026-11-09T19:19:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 130, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtMvHNXkAAWHSZ.jpg"}], "links": {"https://t.co/ni7xTZApke": ""}, "quoted": {"id": "2119867707546071125", "author_name": "Anthropic", "links": {}, "author": "AnthropicAI", "text": "Claude Fable 5.2 and Claude Mythos 5.2 are available now:"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "thread": [{"id": "2119882657379279235", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "The system card goes into no greater detail on this.", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2119882657379279235", "created_at": "Mon Nov 09 19:59:45 +0000 2026"}], "enriched": 3}, {"id": "2119871814419804169", "url": "https://x.com/theobearman/status/2119871814419804169", "text": "Both model variants show greater eval awareness, but Anthropic claim Mythos 5.2 is more aligned than recent models. https://t.co/Y2ptFEdY70", "created_at": "2026-11-09T19:16:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtMLcvXoAEkGAK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWtMLcZWsAAdTdu.jpg"}], "links": {"https://t.co/Y2ptFEdY70": ""}, "quoted": {"id": "2119867707546071125", "author_name": "Anthropic", "links": {}, "author": "Anthropic
