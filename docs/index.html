 "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "parent": {"id": "2121671371789091243", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": "In all seriousness, there is a very interesting sociological retrospective to be written on AI maximalists' relationship with graphs as representations of knowledge.\n\nYou can graph almost anything with this group, no matter how noisy, limited, or inscrutable the data, and this anoints it as some sort of indefatigable ritual object of common knowledge. This in turn creates all sorts of fascinating social cascades. \n\nEvery regression a Mayan calendar.", "links": {}, "media": [], "url": "https://x.com/NateWitkin/status/2121671371789091243", "created_at": "Sat Nov 14 18:27:28 +0000 2026"}, "enriched": 3}, {"id": "2121671371789091243", "url": "https://x.com/NateWitkin/status/2121671371789091243", "text": "In all seriousness, there is a very interesting sociological retrospective to be written on AI maximalists' relationship with graphs as representations of knowledge.\n\nYou can graph almost anything with this group, no matter how noisy, limited, or inscrutable the data, and this anoints it as some sort of indefatigable ritual object of common knowledge. This in turn creates all sorts of fascinating social cascades. \n\nEvery regression a Mayan calendar.", "created_at": "2026-11-14T18:27:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 40, "retweets": 4, "media": [], "links": {}, "quoted": {"id": "2121666200908316778", "author_name": "Nathan Witkin", "links": {}, "author": "NateWitkin", "text": "Frontier labs have graduated from chart crimes to straight-up chart terrorism."}, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "thread": [{"id": "2121677251863318635", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": "FWIW I am still being a bit tongue-in-cheek, and I appreciate that some pretty bad outcomes over the next couple of years remain plausible.  \n\nBut IMO much of the safety community has put itself in a difficult spot by crying wolf many times over in response to what good-faith critics can see is really very ambiguous, multiply interpretable information.  \n\nWe saw it with the first METR graph (time horizons),we saw it with Black October, we saw it with the second METR graph (AECI speed-up), and we saw it again yesterday with the FAA grounding, when many prominent accounts preemptively implied we were experiencing an AI-precipitated cyber attack.  \n\nIf you repeatedly convey that you can only see the world through a single cloudy lens, people start to catch on.", "links": {}, "media": [], "url": "https://x.com/NateWitkin/status/2121677251863318635", "created_at": "Sat Nov 14 18:50:50 +0000 2026"}], "enriched": 3}, {"id": "2121670897258135715", "url": "https://x.com/NateWitkin/status/2121670897258135715", "text": "https://t.co/hhaXck8Rlq", "created_at": "2026-11-14T18:25:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "gleech", "rt_author_name": "gavin leech (in DC 11-16th)", "rt_avatar": "https://pbs.twimg.com/profile_images/1513339291883212803/9m6waiws_normal.jpg", "rt_id": "2121595585530933408", "likes": 35, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXFr26kXEAA6wy7.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXFr56IWoAAIkH8.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXFr26kXEAA6wy7.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXFr56IWoAAIkH8.jpg"}], "links": {"https://t.co/hhaXck8Rlq": ""}, "quoted": null, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121666200908316778", "url": "https://x.com/NateWitkin/status/2121666200908316778", "text": "Frontier labs have graduated from chart crimes to straight-up chart terrorism.", "created_at": "2026-11-14T18:06:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2121331333654086124", "author_name": "Jacob Coxon", "links": {"https://t.co/U17rzSxrFD": ""}, "author": "hilbertspaess", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math."}, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121665199602122921", "url": "https://x.com/NateWitkin/status/2121665199602122921", "text": "I don't know what the reality is, but this is not a serious argument. 3 data points.\n\nsome AI people are getting used to discussing important matters without clarity or rigor.\n\nEspecially important if you think the stakes are high.", "created_at": "2026-11-14T18:02:56+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ben_golub", "rt_author_name": "Ben Golub", "rt_avatar": "https://pbs.twimg.com/profile_images/1677074123619483648/xjOYUqdk_normal.jpg", "rt_id": "2121458230920409410", "likes": 242, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121715524342342042", "url": "https://x.com/NateWitkin/status/2121715524342342042", "text": "I bet against this and I bet against Dwarkesh.\n\nHe conveniently sweeps under the rug that climbing a metric involves defining it. Then, supposing you define it (in a way that avoids Goodharting, reward hacking, etc), you need data/envs, which do the lifting. On defining good metrics - this is most of the game of making AGI (converting fuzzy concepts to formalized objects you can climb without gaming, which requires costly fixes later). He elides the hard problem by saying 'AI will just automate data'.\n\nHow do you know whether a change belongs in your final recipe? You ablate at scale. When you make N changes, on even a subset of combinations, this compute cost is naively exponential. So, you need a faster signal to tell you when a task that isn't immediately verifiable improves end behavior. Finding that signal is the bottleneck, which doesn't seem to be helped by 'automating the great algorithmic thinker starting from the empty string on paper'.", "created_at": "2026-11-14T21:22:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "cindyxywu", "rt_author_name": "Cindy Wu", "rt_avatar": "https://pbs.twimg.com/profile_images/1815044111847559168/o0aBmZk7_normal.jpg", "rt_id": "2121700522184851956", "likes": 567, "retweets": 43, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2122101809431105627", "url": "https://x.com/NateWitkin/status/2122101809431105627", "text": "\"As society becomes richer and basic needs are satisfied, zero-sum positional contests gain more prominence.\"\n\nUseful to think about as we try to predict what people will be doing in a world of greater material abundance than ever. https://t.co/ggu8idyMnV", "created_at": "2026-11-15T22:57:52+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "paulnovosad", "rt_author_name": "Paul Novosad", "rt_avatar": "https://pbs.twimg.com/profile_images/1404388273359831042/7FWLaDSK_normal.jpg", "rt_id": "2122088798041371103", "likes": 87, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXMsJ-AWoAAyxdc.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXMsJ-AWoAAyxdc.png"}], "links": {"https://t.co/ggu8idyMnV": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122092363816350065", "url": "https://x.com/NateWitkin/status/2122092363816350065", "text": "Lots of (justified) criticism about the quoted tweet last month, luckily we now have this cool paper showing the same thing using staggered diff-in-diff @MonirBounadi\n\nNote: maybe OLS was all we ever needed after all... :D\nhttps://t.co/gJW6ChrlAX https://t.co/tGhy7KxdwU", "created_at": "2026-11-15T22:20:20+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "gguillaumeblanc", "rt_author_name": "Guillaume Blanc", "rt_avatar": "https://pbs.twimg.com/profile_images/2080753742539005952/faQdsw7G_normal.jpg", "rt_id": "2122038600082784350", "likes": 210, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXL9aneboAA8Tww.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXL9aneboAA8Tww.jpg"}], "links": {"https://t.co/gJW6ChrlAX": "https://www.monirbounadi.com/Bounadi_JMP.pdf", "https://t.co/tGhy7KxdwU": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122754764605641153", "url": "https://x.com/NateWitkin/status/2122754764605641153", "text": "Possible that AI capabilities still haven’t changed the world as much as they have hypnotized people into associating ordinary events —a cluster of software glitches, a tick up in youth underemployment—with AI", "created_at": "2026-11-17T18:12:29+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "rt_avatar": "https://pbs.twimg.com/profile_images/2093501497673674753/OrmD5Wp3_normal.jpg", "rt_id": "2122745078754005441", "likes": 180, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122750013826580572", "url": "https://x.com/NateWitkin/status/2122750013826580572", "text": "Paul has forgotten more about AI risk than I'll ever know, and this interview was fascinating.\n\n​However, this clipped scenario - where a rogue AI becomes self-sustaining via cyber capabilities and persuasion and defeats govt/military attempts to shut it down - didn't feel compelling to me, for two reasons:\n\n​1. The limits of cyber: There's been a 30 year debate between cyber revolutionaries and cyber skeptics about how much cyber alone can actually achieve in terms of espionage, sabotage, and destabilisation. The war in Ukraine has swung the empirical pendulum hard toward the skeptics: cyber has played a fairly minimal strategic role, struggling to translate digital disruption into durable physical or political control.\n\n​2. A multipolar company landscape: A rogue model wouldn't be operating in a vacuum against unassisted humans. There are 3–4 companies at the frontier. Even if one cluster - or even company! - were compromised, govts would have peer or near-peer models to harden infrastructure, hunt for exfiltration, and defend against subversion.", "created_at": "2026-11-17T17:53:36+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "HaydnBelfield", "rt_author_name": "Haydn Belfield", "rt_avatar": "https://pbs.twimg.com/profile_images/1802708806826172416/7APsIg-X_normal.jpg", "rt_id": "2122621662235382240", "likes": 83, "retweets": 12, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122748003215655092", "url": "https://x.com/NateWitkin/status/2122748003215655092", "text": "There are lots of outages... Why? AI attacks? \n\nMy more normal guess is that because there have been a lot of AI-discovered cyber vulnerabilities (including lots probably not yet disclosed), companies across all industries are having to do a lot of patches and upgrades, probably faster than usual. Such upgrades can sometimes go wrong, causing outages.", "created_at": "2026-11-17T17:45:37+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2122727082492866681", "likes": 411, "retweets": 45, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122747992520425914", "url": "https://x.com/NateWitkin/status/2122747992520425914", "text": "🟡🚨I asked @ONCD's Sean Cairncross about the FAA router outage, United glitch, banking software issue all happening at once and if it could be a cyber attack here at @semafor Silicon Valley and the World conference:\n\n“No, this is not any sort of coordinated, nefarious cyber attack from a malicious actor. What we are seeing, and frankly I’d expect to see more of it, are service disruptions coming from updating and modernizing legacy systems.\"\n\n\"This is something that’s happening in real time, and at the end of the day, we’re going to have to go through this to get systems where they need to be. The industry’s known this for a while, it’s just that it’s manifesting.\"", "created_at": "2026-11-17T17:45:34+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ashleyrgold", "rt_author_name": "Ashley Gold", "rt_avatar": "https://pbs.twimg.com/profile_images/2100730381846646784/INs3gfH7_normal.jpg", "rt_id": "2122492477290795390", "likes": 51, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122816769702219937", "url": "https://x.com/NateWitkin/status/2122816769702219937", "text": "Helpful exercise: imagine a world where we'd been using high(er)-ecological-validity benchmarks like these since the beginning...", "created_at": "2026-11-17T22:18:52+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "NateWitkin", "reply_to_id": "2122814973592162551", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122814973592162551", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": "A colleague just linked me to this fantastic new benchmark by @TokenWaveai.\n\n\"A coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from a brief handoff, agents must recover requirements distributed across colleagues and workplace records, reconcile conflicting evidence, and implement changes evaluated by private executable tests.\n\nWe evaluate eleven models and find a substantial gap between partial implementation and complete task delivery. The two leading models [Claude-Opus 5.5 and GPT-6 Astra] satisfy approximately 63% of fail-to-pass (F2P) tests but complete fewer than 8% of assignments.\"\n\nhttps://t.co/q0cBKR3P7L", "links": {"https://t.co/q0cBKR3P7L": "https://arxiv.org/pdf/2611.20218", "https://t.co/xL78WeYbzU": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXAB_HXkAAsy-o.png"}], "url": "https://x.com/NateWitkin/status/2122814973592162551", "created_at": "Tue Nov 17 22:11:44 +0000 2026"}, "enriched": 3}, {"id": "2122814973592162551", "url": "https://x.com/NateWitkin/status/2122814973592162551", "text": "A colleague just linked me to this fantastic new benchmark by @TokenWaveai.\n\n\"A coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from a brief handoff, agents must recover requirements distributed across colleagues and workplace records, reconcile conflicting evidence, and implement changes evaluated by private executable tests.\n\nWe evaluate eleven models and find a substantial gap between partial implementation and complete task delivery. The two leading models [Claude-Opus 5.5 and GPT-6 Astra] satisfy approximately 63% of fail-to-pass (F2P) tests but complete fewer than 8% of assignments.\"\n\nhttps://t.co/q0cBKR3P7L", "created_at": "2026-11-17T22:11:44+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXAB_HXkAAsy-o.png"}], "links": {"https://t.co/q0cBKR3P7L": "https://arxiv.org/pdf/2611.20218", "https://t.co/xL78WeYbzU": ""}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "thread": [{"id": "2122816769702219937", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": "Helpful exercise: imagine a world where we'd been using high(er)-ecological-validity benchmarks like these since the beginning...", "links": {}, "media": [], "url": "https://x.com/NateWitkin/status/2122816769702219937", "created_at": "Tue Nov 17 22:18:52 +0000 2026"}], "enriched": 3}, {"id": "2122811468521562296", "url": "https://x.com/NateWitkin/status/2122811468521562296", "text": "Can the most capable LLMs match humans at real work? Not yet, at least not on the kind of work we do at Epoch.\n\nWe tested GPT-6.2 Astra and other recent models on Epoch Automation Reports, our benchmark of open-ended Epoch work tasks, ranging from making Epoch-style diagrams to designing basic research experiments.\n\nAn Epoch employee scores the models’ outputs based on our internal quality standards. A score of 100% represents the standard expected of an Epoch employee.\n\nAll models failed to meet the Epoch employee standard. GPT-6.2 Astra ranks fourth (averaging 65%), despite sharing the top ECI score of 174 with Fable 5.2.\n\nFable 5.2 scored highest, averaging 82%.\n\nOn one task, both Fable 5.2 and Opus 5.5 matched the level of a contractor. More on that below.", "created_at": "2026-11-17T21:57:48+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2122808111849488867", "likes": 94, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXW6ulBbQAAItqo.png"}], "links": {"https://t.co/95sjI9JmNW": ""}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122805597456286082", "url": "https://x.com/NateWitkin/status/2122805597456286082", "text": "@justjoshinyou13 Right, it's underappreciated how many of our existing success measures break down when you start to scale up to really ambitious tasks with a ton of agents working concurrently.\n\nWe have a decent sense for how good singular agents are at some things, but as you say the problem with swarms is that you have to worry about cascading failures and other weird social dynamics. Arguably pass^n measures are even more important there, since more agents means more sources of inconsistency across runs.\n\nImplies that lot of benchmark extrapolation is \"not even wrong.\"", "created_at": "2026-11-17T21:34:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "justjoshinyou13", "reply_to_id": "2122800846178279642", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122800846178279642", "author_handle": "justjoshinyou13", "author_name": "Josh You", "text": "@NateWitkin If you want to know whether an agent swarm can do some very large project, that doesn't necessarily imply a measured time horizon of 1 million hours or something. Because it depends what failure rate on the individual tasks in the project would be fatal to the whole thing", "links": {}, "media": [], "url": "https://x.com/justjoshinyou13/status/2122800846178279642", "created_at": "Tue Nov 17 21:15:36 +0000 2026"}, "enriched": 3}, {"id": "2122792201054822535", "url": "https://x.com/NateWitkin/status/2122792201054822535", "text": "It’s unfortunate that mostly black authors have been outed for using AI to write fiction, but does that mean AI detectors are racist ? Sadly, the answer is a resounding NO. With the help of @pangram and @GPTZeroAI I analyzed 187 African books published between 2001 &amp; 2026. 👇👇 https://t.co/OY6Yk4q8HC", "created_at": "2026-11-17T20:41:14+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "TuhinChakr", "rt_author_name": "Tuhin Chakrabarty", "rt_avatar": "https://pbs.twimg.com/profile_images/2120573597995446272/Bqw5JarX_normal.jpg", "rt_id": "2122703138214027358", "likes": 372, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVbQCqWQAA2A7R.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXVbQCqWQAA2A7R.jpg"}], "links": {"https://t.co/OY6Yk4q8HC": ""}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "thread": [{"id": "2122703142550679990", "author_handle": "TuhinChakr", "author_name": "Tuhin Chakrabarty", "text": "The discourse around the @CainePrize has been frustrating and I am very much baffled by the opinions on both sides of things. Conventional wisdom tells us to be distrustful of technology. Nobody asked for generative AI, let alone tools to prohibit its use. One can’t help but feel a little helpless, but the solution is not to embrace the easier narrative. (2/n)", "links": {}, "media": [], "url": "https://x.com/TuhinChakr/status/2122703142550679990", "created_at": "Tue Nov 17 14:47:21 +0000 2026"}, {"id": "2122703164809896005", "author_handle": "TuhinChakr", "author_name": "Tuhin Chakrabarty", "text": "As some who studies AI writing, I plotted the Blue Fighter against 187 books + ShyGirl and DaggerMouth. It looks like Negative Parallelism and Trailing Participle Tails tell a relatively clear story ( with some caveats). I was also fascinated to see density of certain words. (3/n)", "links": {"https://t.co/vVQt1xYvdp": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVbQ5OWkAA7UlI.jpg"}], "url": "https://x.com/TuhinChakr/status/2122703164809896005", "created_at": "Tue Nov 17 14:47:27 +0000 2026"}, {"id": "2122703168509235654", "author_handle": "TuhinChakr", "author_name": "Tuhin Chakrabarty", "text": "There is no dearth of remarkably talented African authors. And its very obvious that AI detectors won’t flag their books. If they did such technology ought to be burned to ground. But to my knowledge, there is no extant research showing that state of art AI detection programs are racially biased. (4/n)", "links": {}, "media": [], "url": "https://x.com/TuhinChakr/status/2122703168509235654", "created_at": "Tue Nov 17 14:47:27 +0000 2026"}, {"id": "2122703171055149494", "author_handle": "TuhinChakr", "author_name": "Tuhin Chakrabarty", "text": "I hope we can keep auditing powerful technology such that they don’t harm people from marginalized communities. If you choose to engage with this post , I hope you will treat it with kindness though I understand X is not the best place to expect that. (5/n)", "links": {}, "media": [], "url": "https://x.com/TuhinChakr/status/2122703171055149494", "created_at": "Tue Nov 17 14:47:28 +0000 2026"}, {"id": "2122703173760450588", "author_handle": "TuhinChakr", "author_name": "Tuhin Chakrabarty", "text": "You can read more in depth here\n\nhttps://t.co/tZGNiU4WrK", "links": {"https://t.co/tZGNiU4WrK": "https://tuhinchakrabarty.substack.com/p/are-ai-detectors-really-racist-or?r=8gxb28&utm_medium=ios"}, "media": [], "url": "https://x.com/TuhinChakr/status/2122703173760450588", "created_at": "Tue Nov 17 14:47:29 +0000 2026"}, {"id": "2122703177535594628", "author_handle": "TuhinChakr", "author_name": "Tuhin Chakrabarty", "text": "@Afinetheorem @paulnovosad of interest to you", "links": {}, "media": [], "url": "https://x.com/TuhinChakr/status/2122703177535594628", "created_at": "Tue Nov 17 14:47:30 +0000 2026"}], "enriched": 3}, {"id": "2122787869513175219", "url": "https://x.com/NateWitkin/status/2122787869513175219", "text": "@girishsastry I would've thought it unlikely for different reasons (mainly that I would've been too optimistic about security w/in OAI).\n\nI have no problem admitting to concern about frontier hacking capabilities, but they're also unique in that most tasks and sub-tasks have ~objective success conditions, and so what we measure in cyber-exploit benchmarks is much more analogous to performing real exploits.\n\nThe attached OAI figure is measuring research-related tasks IIRC and so is more predictive where something as nebulous as \"overthrowing the government\" is concerned.\n\nHF is also a world away from what Christiano is predicting and is the only incident of its severity level despite widespread use of models in sensitive settings. There is nothing in the data to suggest an increment in real-world capabilities on the scale being suggested.", "created_at": "2026-11-17T20:24:02+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "girishsastry", "reply_to_id": "2122785092846383203", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122785092846383203", "author_handle": "girishsastry", "author_name": "girish sastry", "text": "@NateWitkin How does your simple argument apply to the Hugging Face incident? Would low pass@1 evals for 15m tasks have caused you to predict that HF was extremely unlikely?", "links": {}, "media": [], "url": "https://x.com/girishsastry/status/2122785092846383203", "created_at": "Tue Nov 17 20:13:00 +0000 2026"}, "enriched": 3}, {"id": "2122784139661525272", "url": "https://x.com/NateWitkin/status/2122784139661525272", "text": "Not a market fundamentalist but:\n\n1) “Bubble” is a term thrown around too casually. Involves hubris\n\n2) P/E ratios are never going to be a great way to identify overvaluation in real time, and especially in an investment boom where it’s easy to play games with “E”", "created_at": "2026-11-17T20:09:12+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "IrvingSwisher", "rt_author_name": "Skanda Amarnath", "rt_avatar": "https://pbs.twimg.com/profile_images/1494812897750487041/yirBITEh_normal.jpg", "rt_id": "2122752072164770033", "likes": 89, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122782940438667359", "url": "https://x.com/NateWitkin/status/2122782940438667359", "text": "I get off this train after the first premise. \n\nThe idea that you can \"pretty robust[ly]\" predict that we will soon have \"agent swarms that are much better than any human intelligence agency that has ever existed\" (better at what?) is fundamentally out-of-step with current evidence.\n\nI could point to what we know from the highest-quality benchmarks, or to research on agent coordination or agent scaling, or to what indirect economic proxies imply about how capable AI is in the real economy.\n\nBut I think the following counterargument is simpler.\n\nIf you use AI agents frequently, ask yourself: what sorts of tasks can agents currently one-shot the vast majority of the time? I don't know about you, but for me the answer is a combination of \"not many\" and \"only those with very loose or disjunctive success conditions.\" When models are consistently performing well, that is usually because I have spent substantial time and effort steering them in ways they would not have been able to infer either from the digital footprint of my local context or their training data.\n\nThe minimal data we have on AI performance within frontier labs agrees. OAI's internal models in September still couldn't reliably one-shot tasks with sub-15 minute time horizons (see attached, and keep in mind that these are almost certainly pass@1 scores, i.e. that OAI is not retesting models on the same tasks multiple times, but just telling you the success rate over many tasks performed once; models' pass^n performance, i.e. odds of success on the same task n times in a row, is usually much lower).\n\nNonetheless, @paulfchristiano has claimed that next year, frontier models have a 1/3 chance of being able to one-shot overthrowing the U.S. government. Presumably those odds continue rising as time goes on. Large swathes of the safety movement have a similar outlook.\n\nThat this is implausible should be common sense to anyone that spends a substantial amount of time working with frontier models. AI models that I still cannot trust to book hotel rooms or buy groceries are not soon to be succeeded by ones that can one-shot the thousands of several-OOM-harder tasks needed to take over the United States in a row. That includes circumventing the efforts of humans and aligned models trying to stop them.\n\nNote also that Christiano is making this prediction right as cheap capital for AI capex is starting to dry up and when the curve for benchmark performance gain per dollar is visibly bending (see attached from @alexolegimas). That would be grounds for moderate bearishness even if benchmarks were decent measures of real-world performance, but as everyone understands by this point, they rarely are.\n\nIn sum, just because someone learned to do a backflip on their trampoline last year, and is already doing triple-backflips on their trampoline this year does not mean they will soon be able to leap tall buildings in a single bound. That is especially so when their parents are increasingly unwilling to pay for gymnastics lessons and when they're still struggling to consistently stick the single back-flip once you take them off the trampoline.\n\nYes, I hear you, your friend once wrote a short story about a guy who, in getting better at doing backflips, also got better at learning to do backflips, such that he entered into a virtuous circle of 'RBL,' or recursive backflip learning, and became a superhuman gymnast overnight, to wit one who could not tell right from wrong because he could only assess potential actions by their 'EBV,' or expected backflip value, and so began to do octuple backflips through storefronts and elementary school windows in response to seemingly benign queries, until he one day barreled through the Earth's core like a human cannon ball, bringing the Anthropocene to its tragic, fated end.\n\nThat is very interesting and I applaud your friend's creativity, but you will understand if I have my doubts about conveying to millions of people that this story was about a real guy who is coming to get them.", "created_at": "2026-11-17T20:04:27+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 69, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWK_Q9WwAAtgTd.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWQsXpW8AAZAoo.jpg"}], "links": {"https://t.co/j6hfTnUVKy": ""}, "quoted": {"id": "2122493169312915931", "author_name": "Dwarkesh Patel", "links": {"https://t.co/HHH90rFZKA": ""}, "author": "dwarkesh_sp", "text": ".@paulfchristiano explains the basic AI takeover story:\n\nStep 1. A rogue internal agent swarm gains effective control over OpenAI or Anthropic during the intelligence explosion \n\nStep 2. By the point at which these AIs have exfiltrated themselves, and you've got billions of copies of super smart AIs that have compromised all web connected infrastructure globally, the government response (which these AIs are actively trying to undermine) becomes much harder to successfully carry out."}, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "thread": [], "enriched": 3}, {"id": "2122837985003757687", "url": "https://x.com/NateWitkin/status/2122837985003757687", "text": "Bit concerning, but at least this data isn't doing anything important like grounding predictions of human extinction, driving the largest investment cycle in human history, etc.", "created_at": "2026-11-17T23:43:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2122726593701257418", "author_name": "Sol Messing", "links": {"https://t.co/TRDkXgAIF6": ""}, "author": "SolomonMg", "text": "The evals are not ok\n\nNew NeurIPS paper: Hidden Measurement Error in LLM Pipelines Distorts Annotation, Evaluation, and Benchmarking. \n\nEvals drive deployment, safety standards, and research. Yet we ignore noise from prompt, judge, agent harness etc, & so underestimate error in benchmarking & annotation, & it gets worse with more data.\n\nI'll get to what this means for CIs & how to fix, but first let's talk about how this makes benchmark hacking easier 🧵"}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122831112342802728", "url": "https://x.com/NateWitkin/status/2122831112342802728", "text": "@kingofthecoastt One 0.01 SD *per year* is pretty substantial. That's the order of magnitude as the post-2010 deterioration in math and reading scores, which have led to a full grade level decline in student ability overall https://t.co/LMia4hbS4e", "created_at": "2026-11-17T23:15:52+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "arpitrage", "rt_author_name": "Arpit Gupta", "rt_avatar": "https://pbs.twimg.com/profile_images/1363976544474062854/AHrOWL5N_normal.jpg", "rt_id": "2122811810088911312", "likes": 37, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXW98JLW0AAdD0b.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXW98JLW0AAdD0b.jpg"}], "links": {"https://t.co/LMia4hbS4e": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122829383878525016", "url": "https://x.com/NateWitkin/status/2122829383878525016", "text": "LLMs seem to be getting worse at AI safety research taste.\n\nOn Anthropic’s TASTE benchmark, we found a simple shortcut. Once it’s removed, more capable models score lower, and the strongest fall below chance. This is especially true for OpenAI models. https://t.co/tyD7IuY8HX", "created_at": "2026-11-17T23:09:00+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "fjzzq2002", "rt_author_name": "Ziqian Zhong", "rt_avatar": "https://pbs.twimg.com/profile_images/1981587033060511744/YP1VRzjy_normal.jpg", "rt_id": "2122446895624634840", "likes": 628, "retweets": 77, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRxd_GXEAEXoDD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRxd_GXEAEXoDD.jpg"}], "links": {"https://t.co/tyD7IuY8HX": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123124602075545611", "url": "https://x.com/NateWitkin/status/2123124602075545611", "text": "I stand with Dean Ball. https://t.co/Nhz5yGsE7q", "created_at": "2026-11-18T18:42:05+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "tracewoodgrains", "rt_author_name": "Jack", "rt_avatar": "https://pbs.twimg.com/profile_images/2081984049284067328/BKde_Eah_normal.jpg", "rt_id": "2123121645846163825", "likes": 100, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbX4tgaoAAcsuv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbX4tgaoAAcsuv.jpg"}], "links": {"https://t.co/Nhz5yGsE7q": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123115910588473797", "url": "https://x.com/NateWitkin/status/2123115910588473797", "text": "OpenAI has abruptly caught up to Anthropic in this very hard OOD task. Must be emergent capability… at some scale, these things just happen I guess… https://t.co/dwWXA6HG1c", "created_at": "2026-11-18T18:07:33+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "rt_avatar": "https://pbs.twimg.com/profile_images/1652169745037242368/KRPTShbG_normal.jpg", "rt_id": "2122951021521711371", "likes": 503, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXY8D_rXsAA7npB.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXY8scUXkAEmKCD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXY8D_rXsAA7npB.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXY8scUXkAEmKCD.jpg"}], "links": {"https://t.co/dwWXA6HG1c": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123094474519650325", "url": "https://x.com/NateWitkin/status/2123094474519650325", "text": "Hadn't yet taken the time to read through Epoch's write-ups of getting AI to \"automate Epoch\", but man there's some gems in there\n\nFor a short blogpost, compare the topic chosen by a human (maths preprints are using AI more and more) to the one chosen by Astra 6 (💀) or Astra 6.2 (🤡)", "created_at": "2026-11-18T16:42:22+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2123068261374021796", "likes": 52, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanU2vbAAAf6EP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXanVHFaoAAbrJ5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXanVSjbMAAZ9jf.jpg"}], "links": {"https://t.co/4FK8WgpNM6": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "thread": [{"id": "2123068276666433749", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "When asked to design an experiment using novel chess variants to measure OOD generalisation, all models use existing chess variants they claimed they've invented de novo.\n\nHilariously, Argon does this despite establishing that the models it's testing already know the variants https://t.co/KIgDvgHZeJ", "links": {"https://t.co/KIgDvgHZeJ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanWMjaoAAwVQN.jpg"}], "url": "https://x.com/mentalgeorge/status/2123068276666433749", "created_at": "Wed Nov 18 14:58:16 +0000 2026"}, {"id": "2123068291908567432", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "But - best of all - the models almost universally prefer their own slop to gold standard human outputs\n\nobvious implications for bootstrapping https://t.co/8bcE2TkCLm", "links": {"https://t.co/8bcE2TkCLm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanXE0bAAEMgI5.jpg"}], "url": "https://x.com/mentalgeorge/status/2123068291908567432", "created_at": "Wed Nov 18 14:58:20 +0000 2026"}], "enriched": 3}, {"id": "2123094322723881332", "url": "https://x.com/NateWitkin/status/2123094322723881332", "text": "Some quick reactions to the recent Dwarkesh podcast with Paul Christiano. Tl,dr: bullish on rapid capability gains, more skeptical of the leap to takeover, and wary of emergency overreach. https://t.co/h9hZ8GwWEH", "created_at": "2026-11-18T16:41:46+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2123015473507733777", "likes": 415, "retweets": 51, "media": [], "links": {"https://t.co/h9hZ8GwWEH": "https://x.com/i/article/2122996206548766721"}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123169108900667681", "url": "https://x.com/NateWitkin/status/2123169108900667681", "text": "Multi-agent systems often behave like a mob, not like a coordinated team. We are releasing Multi Agent Coordination Bench: a benchmark requiring agent coordination, collaboration and communication. Right now, agents benefit from parallel exploration, but their coordination and communication is very poor. A team of eight agents does better than a single agent but often due to random exploration, while their coordination has significant room for improvement. \n\nOur tasks include agent teams trying to execute a mission to Mars, fight zombies, grow a company from seed, and more. We categorize our tasks by two properties of the environment: if the agents share the same information and actions (Shared vs Distributed), and if they pursue the same goal or not (Collaborative/Strategic).  This taxonomy will be useful for future research, to think about different multi-agentic problems across distributed and strategic settings.", "created_at": "2026-11-18T21:38:56+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "AlexGDimakis", "rt_author_name": "Alex Dimakis", "rt_avatar": "https://pbs.twimg.com/profile_images/542926798338543617/KwlwoJRr_normal.jpeg", "rt_id": "2123114474207134193", "likes": 215, "retweets": 26, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbNjWybAAA8beT.jpg"}], "links": {"https://t.co/zrCuwkvuRW": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123169010686829004", "url": "https://x.com/NateWitkin/status/2123169010686829004", "text": "We’re releasing Multi Agent Coordination Bench, a benchmark of twelve natively multi-agent long-horizon tasks that measure the coordination capabilities of frontier models.\n\nWe find that current frontier agents coordinate poorly. A team of eight agents beats a single agent, but the gain comes from having more agents, not from coordination. Of Opus 5.5, GPT-6.1 Sol and Gemini 4 Argon, only Opus shows signs of a gain from coordinating.", "created_at": "2026-11-18T21:38:33+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "bespokelabsai", "rt_author_name": "Bespoke Labs", "rt_avatar": "https://pbs.twimg.com/profile_images/1849924709212880896/qVpI7zkV_normal.jpg", "rt_id": "2123099143996616741", "likes": 328, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXa7ozmbEAAJfHh.jpg"}], "links": {"https://t.co/1P3A2zzk8g": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123467900820312153", "url": "https://x.com/NateWitkin/status/2123467900820312153", "text": "The funny thing is I’ve never once thought this was the “AI’s most bullish chart”. There’s a lot of demand for compute *now*. What happens in the future is a forecast problem. What happens to the equity value of the value chain of compute even more so.", "created_at": "2026-11-19T17:26:14+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "stevehou", "rt_author_name": "Steve Hou", "rt_avatar": "https://pbs.twimg.com/profile_images/1905914798300073984/stc3q7RB_normal.jpg", "rt_id": "2123424290166935654", "likes": 37, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123465365778788391", "url": "https://x.com/NateWitkin/status/2123465365778788391", "text": "Seems like the OpenAI research acceleration blogpost is not what you would expect if we were definitely on the cusp of artificial superintelligence - models that are more cognitively capable than ~ALL humans on ~ALL tasks. Agent workdays have grown very jaggedly, swarm sizes haven't grown very much, and spending on tokens hasn't actually outpaced spending on human workers* although the growth rate is clear. There also hasn't been an acceleration in research experiments per experimenter, or in the internal ECI scores of OpenAI's models. Perhaps most importantly (and most surprisingly), the task success rate for <15 min tasks hasn't grown very much at all, and the share of tasks done by agents across various time horizons is both low and not growing for the most part.\n\nIt's possible that Anthropic is *much* further along in automating AI R&D than OpenAI, and that METR saw this in their investigation. It's also possible that we see nothing much right up until a shocking acceleration in capabilities, like we saw in mathematics. We certainly can't rule out the possibility of an intelligence explosion.\n\nBut there's been a huge belief cascade in AI in general and AI safety in particular that seems largely unwarranted given the evidence that we have today. It's entirely possible that we can't fully automate all AI R&D tasks in the imminent future, or that full automation of AI R&D doesn't massively accelerate AI capabilities progress, or that capability gains concentrate in easily verifiable tasks and fail to generalize to the messy real world. These are all open research questions", "created_at": "2026-11-19T17:16:09+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "theojaffee", "rt_author_name": "Theo Jaffee", "rt_avatar": "https://pbs.twimg.com/profile_images/2068124453016682497/Xq5hPekQ_normal.jpg", "rt_id": "2123231377177157992", "likes": 565, "retweets": 61, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcyggnbcAEV1j-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXc0BdabQAA5Iof.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXc0FgdaYAA38iu.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXc0RTaacAAMehf.jpg"}], "links": {"https://t.co/ksQc69MJDm": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123503594192146549", "url": "https://x.com/NateWitkin/status/2123503594192146549", "text": "Token spend (as tracked by Ramp) is down 6.3% in just two weeks. That's because even as token usage went up slightly, token prices have declined by over 20%.", "created_at": "2026-11-19T19:48:04+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ruima", "rt_author_name": "Rui Ma", "rt_avatar": "https://pbs.twimg.com/profile_images/1413221549692227589/ME01cG25_normal.jpg", "rt_id": "2123468406477484504", "likes": 15, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2122610273051934728", "url": "https://x.com/charnock_jacob/status/2122610273051934728", "text": "The week of my departure from OpenAI, I saw external auditors negotiating with OpenAI over small improvements to access and scope to the company's safety-relevant information, and asked my colleagues “Why are we having these conversations at all?” — @sama already publicly committed to continued, employee-like access for external assessors — and these negotiations sounded not even close. Nobody had a good answer.\n\nToday, OpenAI announces the engagements they’re doing with METR, Apollo Research and others — and as many have already pointed out today, it looks like OpenAI employees were not able (although I'm sure they tried) to hold the leadership to @sama’s public commitments:\n* No Slack access (for context, all OpenAI safety discussions and debate happen over Slack; anything that misses these conversations will lack important insights)\n* OpenAI picks employees that assessors are allowed to talk to.\n* If an employee raises a concern to assessors, they cannot disclose it publicly even if it doesn’t contain confidential information, unless assessors themselves verify it or OpenAI volunteers their own statement confirming <script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
