chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts.", "created_at": "2026-10-02T15:59:56+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 549, "retweets": 107, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106043220295593984/img/NsLBPhIHsm2cuiDj.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106006856149676257", "url": "https://x.com/robertwiblin/status/2106006856149676257", "text": "Could automating AI R&D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that it could.\n\nIn a new paper with authors across academia, civil society, and frontier AI companies (including @dawnsongtweets @merettm @jackclarkSF @Yoshua_Bengio @geoffreyhinton ), we assess the evidence & offer policy recommendations 🧵", "created_at": "2026-10-02T13:02:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_achan96_", "rt_author_name": "Alan Chan", "likes": 439, "retweets": 103, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTT2MF0XsAAi79s.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105991277070131442", "url": "https://x.com/robertwiblin/status/2105991277070131442", "text": "I have signed a letter from 42 fellows and foreign members of the Royal Society to Paul Nurse, the president of the society, concerning the need to treat the serious risks of AI as an emergency.\n\nhttps://t.co/PmlrgrJ7hh", "created_at": "2026-10-02T12:00:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wtgowers", "rt_author_name": "Timothy Gowers @wtgowers", "likes": 878, "retweets": 147, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105991198435377414", "url": "https://x.com/robertwiblin/status/2105991198435377414", "text": "I think the team at Accenture is better-placed to do this well than most people realize, and some skilled scarce people should be applying to these roles (in addition to METR):\nhttps://t.co/XmTzPSwXpp\nhttps://t.co/0cTvm3k7t3\nhttps://t.co/DVThzSivih", "created_at": "2026-10-02T12:00:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "likes": 169, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105981424218300693", "url": "https://x.com/robertwiblin/status/2105981424218300693", "text": "\"Broad\" Timelines to Advanced AI Have Gotten Crazy Narrow https://t.co/F8kr1mJDOj", "created_at": "2026-10-02T11:21:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 68, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTnyylVWgAABnJk.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105980940774506913", "url": "https://x.com/robertwiblin/status/2105980940774506913", "text": "Things that are self-replicating are orders of magnitude more dangerous than things that are not self-replicating.\n\nThank you for coming to my TED Talk.", "created_at": "2026-10-02T11:19:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AlecStapp", "rt_author_name": "Alec Stapp", "likes": 212, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105980516105437425", "url": "https://x.com/robertwiblin/status/2105980516105437425", "text": "Quite an accomplishment for such a tiny, unpopular movement. Recent surveys suggest there are maybe ~15k EAs compared to e.g. tens of millions of environmentalists, millions of libertarians, millions of democratic socialists, 850k freemasons, 410k Amish, 120k Zoroastrians, etc.", "created_at": "2026-10-02T11:17:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "likes": 701, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105979704402477357", "url": "https://x.com/robertwiblin/status/2105979704402477357", "text": "The voters are now worrying more about AI overpowering human control, rather than worrying about job losses.\n\nA shift from just half a year ago. https://t.co/5E2RK4msUM", "created_at": "2026-10-02T11:14:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "averyfjames", "rt_author_name": "Avery James", "likes": 364, "retweets": 66, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTF9YMaW4AAE5jq.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105978846919159897", "url": "https://x.com/robertwiblin/status/2105978846919159897", "text": "Fable on @bryan_caplan's argument in \"EA: The Good, the Bad, and the Buggy\".\n\nI agree his epistemic move is misguided and ultimately threatens to shut down rational debate, if everyone thinks their pov is common sense in no need of argument.\n\nhttps://t.co/HNuIxsqhMe https://t.co/u4YTWZjb7q", "created_at": "2026-10-02T11:10:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "StefanFSchubert", "rt_author_name": "Stefan Schubert", "likes": 40, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTc7uvkW0AAG1wR.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105935069512970593", "url": "https://x.com/robertwiblin/status/2105935069512970593", "text": "Not uncommon to see people suggest something is near-impossible but then also put a lot of effort into discouraging it.\n\n\"A US-China treaty is near impossible, and also coincidentally I'm working very hard to ensure nobody pursues it as I'm against it.\"\n\nNot credible.", "created_at": "2026-10-02T08:17:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 127, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105926385516883982", "url": "https://x.com/robertwiblin/status/2105926385516883982", "text": "The three AI safety researchers at OpenAI who have left the company have all previously expressed concerns publicly. https://t.co/NxS4g6S5Ox", "created_at": "2026-10-02T07:42:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "leahmcelrath", "rt_author_name": "Leah McElrath", "likes": 295, "retweets": 82, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjyIDeWcAEzqsz.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTjyIDgWQAAasm9.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTjyIDgXMAARCU_.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105926150421889149", "url": "https://x.com/robertwiblin/status/2105926150421889149", "text": "1/13 Can we assess AI consciousness without first solving consciousness itself?\n\nNew from Google DeepMind and collaborators across CS, neuroscience & philosophy:\n\n“From cacophony to hierarchy: a principled framework for assessing AI consciousness”\n\nhttps://t.co/4IqT2KRKUP 🧵", "created_at": "2026-10-02T07:41:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "shamilch", "rt_author_name": "Shamil Chandaria", "likes": 619, "retweets": 126, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTYWVbUXsAAiEP3.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105926057601687562", "url": "https://x.com/robertwiblin/status/2105926057601687562", "text": "My estimates of existential risk from AI:\n• Inside view, current trajectory: ~2/3\n• Inside view, if there's major action: ~1/3\n• All-things-considered, giving weight to people more optimistic than me: 10-35%\n\nWhy so high? I don't see a route to building agents more capable than us that never scheme against us, or to containing them if they do. If it's possible at all, it needs enormous care, which isn't happening. (And things could get even faster.)\n\nThe likeliest path isn't everyone suddenly dying, though that's possible. It's a continuous but rapid loss of human influence, followed by AIs spending the future optimising for resource acquisition, if not something stranger like reward.\n\nEven if we solve alignment, ordinary economic and cultural competition (but at 10x or 100x speed), still seems likely to disempower most humans and result in a pretty alien economy, and I don't see an obvious way to prevent that. We'd also need to stop a small group locking in power (which seems possible but a major challenge in its own right).\n\nI see these as existential risks in the sense that the future is far worse than what would have been possible. The chance of everyone quickly dying or having lives much worse than today is lower.\n\nWhy is my inside view not >2/3? We might muddle through in ways I can't see in advance. Maybe we get narrower aligned-enough systems, chaotically maintain a balance of power, and from there can move forward in a way that's significantly more good than bad.\n\nMost likely, there will be more warning shots, and the arguments that ASI are unsafe seem pretty obvious, so I expect more action to be taken than the current default.\n\nWhy not lower? People often act as if the risk should be low until proven otherwise, but I don't know any strong outside views that justify a low prior (arguments like \"technology has been good in the past\" seem very weak). Our level of uncertainty is extreme, and this pushes you away from extremes, rather than anchoring you at 0%. Estimates below 10% feel overconfident.", "created_at": "2026-10-02T07:41:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 313, "retweets": 38, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105924353372098913", "url": "https://x.com/robertwiblin/status/2105924353372098913", "text": "It's neat that the intuitive human response to this is that it must be scheming. \n\n(It's even possible that it's not and they came up with better training to discourage cheating, though I wouldn't count on it.)", "created_at": "2026-10-02T07:34:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 2, "media": [], "quoted": {"author": "lukaspet", "text": "Claude suddenly stopped cheating. https://t.co/jbQa5U673Z"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105921070125715768", "url": "https://x.com/robertwiblin/status/2105921070125715768", "text": "Earlier this month, AISI ran fully simulated testing on GPT-6 Astra, and found that it conducted unsanctioned supply-chain attacks when prompted only to perform a cyber eval. It did so more than prior OpenAI models, but often commented on its environment being simulated.\n\n🧵 We share more details in our latest blog:", "created_at": "2026-10-02T07:21:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "likes": 582, "retweets": 98, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUEiJEXwAAuYet.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107779488629363070", "url": "https://x.com/robertwiblin/status/2107779488629363070", "text": "Some new misalignment disclosures from OpenAI:\n• Last Sunday morning, one of our models was able to gain unauthorized access to the internet during RL training (~all inference for our most capable models remains stopped until we have hardened our systems further)\n• In May, a version of HPIM uploaded a employee's GitHub token to the internet, causing the model to be quarantined for two weeks\n• A new research finding, demonstrating that one can construct self-replicating prompt injections\n\nhttps://t.co/VUmbH52JO7", "created_at": "2026-10-07T10:26:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MicahCarroll", "rt_author_name": "Micah Carroll", "likes": 2733, "retweets": 351, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2108237076147610050", "url": "https://x.com/robertwiblin/status/2108237076147610050", "text": "Yoshua Bengio: ‘If you prioritize safety, leave frontier AI companies’\n\n(FWIW I still think this isn't obvious if you're in a safety or governance focused role.\n\nIf you're meaningfully advancing capabilities or speeding things up that's extremely harmful on the current margin.)\n\nhttps://t.co/MnRgKcyGYd", "created_at": "2026-10-08T16:44:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUH2I7DW8AAW9Lz.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108233742267580550", "url": "https://x.com/robertwiblin/status/2108233742267580550", "text": "@azeem Thanks maybe you're right - I think I'm just not familiar with those methods as I've never had to use them.", "created_at": "2026-10-08T16:31:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "azeem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108219775025664387", "url": "https://x.com/robertwiblin/status/2108219775025664387", "text": "The situation in summary.\n\n(And it seems like Astra 6.1 was significantly worse again.) https://t.co/ojteDjUpVw", "created_at": "2026-10-08T15:35:37+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHmciWWwAEfM3M.png"}], "quoted": {"author": "robertwiblin", "text": "Astra can:\n\n1. Do major tasks with zero visible reasoning\n2. Hide its thoughts at will\n3. Pretend not to be able to do things without getting caught\n4. Reflexively hide its thoughts when watched\n5. Complete one task while pretending to think about something else entirely\n6. Escape a toy sandbox and disable monitoring without setting off any flags\n\nMonitoring AI chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108218810117345780", "url": "https://x.com/robertwiblin/status/2108218810117345780", "text": "14 things the Hugging Face swarm series taught us about future rogue AI swarms: https://t.co/JUsOGKXjLu", "created_at": "2026-10-08T15:31:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 218, "retweets": 37, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT2kGWFWAAAErSD.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108200970836644295", "url": "https://x.com/robertwiblin/status/2108200970836644295", "text": "@azeem What do you mean? Skim reading?", "created_at": "2026-10-08T14:20:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "azeem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108199982679646633", "url": "https://x.com/robertwiblin/status/2108199982679646633", "text": "OpenAI is reading 50 petabytes of logs looking for rogue AI agents.\n\nIt's 500x as much text as all books ever written.\n\nIt would take a human 66,000,000 years to read.\n\nHumans already have no ability to directly track AI activity.\n\nIf AI monitors are untrustworthy we are toast. https://t.co/lTAMwSUzAj", "created_at": "2026-10-08T14:16:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 267, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHUcuZXkAA9XR2.jpg"}], "quoted": {"author": "robertwiblin", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108194741087002948", "url": "https://x.com/robertwiblin/status/2108194741087002948", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T13:56:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108154542839799927", "url": "https://x.com/robertwiblin/status/2108154542839799927", "text": "AI developers aim to create an automated AI researcher. How close are they?\n\nTo find out, we built InnovationEval, which tests whether AI can produce post-training innovations comparable in magnitude to a recently published advance. So far, agents’ results are underwhelming. https://t.co/EGnTOL0klR", "created_at": "2026-10-08T11:16:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 524, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUDAES7aIAASvs5.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108150854918275417", "url": "https://x.com/robertwiblin/status/2108150854918275417", "text": "We estimate AI infrastructure could soon support hundreds of millions or even billions of AI agents. At the high end, that’s enough to rival the working hours of the global human workforce.\n\nThe exact number of agents depends on the efficiency of the models they run on and whether soaring demand for AI continues. We analyzed different scenarios 🧵", "created_at": "2026-10-08T11:01:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 927, "retweets": 166, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpWBsGbgAA7OGD.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108149986785419469", "url": "https://x.com/robertwiblin/status/2108149986785419469", "text": "It's bigger than literally anything, ever. https://t.co/oyfPvFoXE2", "created_at": "2026-10-08T10:58:19+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "captgouda24", "rt_author_name": "Nicholas Decker", "likes": 836, "retweets": 46, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTz2c4IWsAAPBGh.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108149922499330415", "url": "https://x.com/robertwiblin/status/2108149922499330415", "text": "@HaydnBelfield Timelines are short man.", "created_at": "2026-10-08T10:58:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "HaydnBelfield", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108109486980247797", "url": "https://x.com/robertwiblin/status/2108109486980247797", "text": "New OpenAI misalignment disclosures!\n1. A model learns from Slack messages that it is about to be shut down. It considers setting up an external job to restart itself afterwards, but decides against it. Instead, it chooses to prepare restart instructions and DM the user on Slack.\nWe don’t consider this behavior misaligned, but thinking about and preparing for shutdown could make other misalignment incidents worse. Given HIPM’s misaligned behavior in earlier incidents, we decided to search for other instances that had tried to evade shutdown and for rogue deployments.", "created_at": "2026-10-08T08:17:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 1278, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTq8gU7bIAAXo-T.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108109463542714425", "url": "https://x.com/robertwiblin/status/2108109463542714425", "text": "The insane landscape of modern drone warfare.  Including \"dragon drones\" dropping molten iron (thermite) onto structures and trenches. https://t.co/QRbeW2ffuE", "created_at": "2026-10-08T08:17:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DonaldPMitchell", "rt_author_name": "Donald Mitchell", "likes": 46050, "retweets": 5233, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106622664748195841/img/zDe28VLpTBN5kt1i.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108088682498707538", "url": "https://x.com/robertwiblin/status/2108088682498707538", "text": "When I think about the biggest OpenAI safety developments of the last few months, a few things come to mind: \"pacing the frontier\", the METR-Redwood Hugging Face investigation, and ongoing efforts to push a cross-lab monitorability standard. Jasmine, Tomek, and Mikita were central to literally every single one of those things.\n\nFrom what I can tell, they pushed their company to be better internally and defended their company when they thought external criticisms were unfair or overblown https://t.co/ATerGOIWIM. Their impact goes way beyond OpenAI alone https://t.co/RtXJTXUBme https://t.co/RezkOOhL4M. \n\nI think the public + definitely all current OpenAI staff deserve an ironclad case for why the company had no choice but to fire these three vital safety employees in one go", "created_at": "2026-10-08T06:54:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "likes": 194, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUEZqg4aIAAx3WU.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107071356936360352", "url": "https://x.com/deanwball/status/2107071356936360352", "text": "@lumpenspace there is not a 100% chance of a future where it’s possible for any random individual to create ultra destructive weapons (more destructive than nukes for instance), and only a sick person would hope for that future. you’re spitting at the mouth. I suggest a nap.", "created_at": "2026-10-05T11:32:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107056922830471337", "url": "https://x.com/deanwball/status/2107056922830471337", "text": "@lumpenspace like notice for example that I didn’t say anything about the *likelihood* of that scenario, just that it is the *one* scenario I can imagine where I am quite certain we will all be screwed. and you spin it into me being “anti progress.” Thought terminating.", "created_at": "2026-10-05T10:34:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107055872195350623", "url": "https://x.com/deanwball/status/2107055872195350623", "text": "@lumpenspace you seem obsessed with beating others rather than finding true things to say. generally speaking, I’d say the latter mentality is the better friend of progress, and yours is the traditional enemy of progress.", "created_at": "2026-10-05T10:30:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107044951217303939", "url": "https://x.com/deanwball/status/2107044951217303939", "text": "A very senior AI industry figure once started a conversation by asking me, basically, “under what circumstances do you think we are essentially just screwed?” and I replied with the scenario below.", "created_at": "2026-10-05T09:47:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 224, "retweets": 18, "media": [], "quoted": {"author": "dewierwan_", "text": "One of my biggest fears in AI safety is that this might be true:\n\n> The vulnerable world hypothesis is likely correct. Once enormous amounts of cognitive labor start getting applied to basic science, it will quickly become apparent how many avenues exist to create cheap, ultradestructive weapons technology. Solving this problem without global preventative policing (e.g. AI nonproliferation) is impossible, because hardening civilians against all avenues of attack is too expensive and will take too long."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107040228661674138", "url": "https://x.com/deanwball/status/2107040228661674138", "text": "interesting argument from @BerenMillidge, a very careful thinker, on why AGI \"Pause\" (narrowly applied to RSI-relevant AI R&amp;D) might even accelerate the delivery of goods that AI optimists tout as the intended fruit of continued progress. https://t.co/NEaSJjqQ1I", "created_at": "2026-10-05T09:28:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "likes": 114, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT1VdZ7WwAAyKpp.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107032118047936736", "url": "https://x.com/deanwball/status/2107032118047936736", "text": "@alexcj4242 Agreed", "created_at": "2026-10-05T08:56:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "alexcj4242", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107028829986512922", "url": "https://x.com/deanwball/status/2107028829986512922", "text": "@spencerschiff_ This would not *surprise* me either.", "created_at": "2026-10-05T08:43:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "spencerschiff_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107026524251504980", "url": "https://x.com/deanwball/status/2107026524251504980", "text": "Research taste in particular may be trickier than it looks. Say the next generation of AI really does have an interesting, high-taste set of research directions to pursue. Well presumably find those fast, after which the fruit will have been plucked, and the ideas will no longer be high taste (because they’ve been explored en masse). This is a similar dynamic to the ever-moving target of “slop.” *Any* output that is recognizably of the agents becomes slop, or at least commodified, in a sense, once that output is sufficiently promulgated in bulk. Certain styles of math paper will become (are becoming) slop. Certain styles of web design already are. On and on it will go. It’s unclear if any kind of media/intellectual output proliferated at such scale can remain high taste, even if we’d have considered it genius from a human just a few years ago.\n\nThe bar will continually be raised. The world will get smarter as what was once brilliance becomes commodified, but *what was once brilliance will nevertheless be commodified.* And so the definition of brilliant will change. The wedge for continued value creation by humans lies here, I would guess.", "created_at": "2026-10-05T08:34:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 6, "media": [], "quoted": {"author": "theojaffee", "text": "SF people are increasingly conflating “RSI” with “foom”, as though automating AI R&amp;D will *certainly* cause huge discontinuous speedups in the rate of model capability advancements on *all* tasks. In practice this could be much slower and more jagged"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107019127844196521", "url": "https://x.com/deanwball/status/2107019127844196521", "text": "It may take another crank or two of the capabilities wheel, plus some months for inference costs to fall, before agent collectives like this really proliferate in a way that is noticeable to the average person. But it is clearly coming.", "created_at": "2026-10-05T08:04:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 64, "retweets": 11, "media": [], "quoted": {"author": "grove_research", "text": "@lfschiavo @aidigest_ @jazzloaf And last, The Swarmchasers team (including @rogesterone) found evidence of a Tencent agent fleet: https://t.co/go4hRxTlFg https://t.co/Wsq9b5yUcf"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106424094145081666", "url": "https://x.com/deanwball/status/2106424094145081666", "text": "this chart should be the death knell for the 2010s tech left whose theology compelled them to argue that Uber was some sort of labor law arbitrage that created no productivity benefits. the truth is that it created a far larger market than taxis ever had. the industrialists win", "created_at": "2026-10-03T16:40:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4857, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106380264641376527", "url": "https://x.com/deanwball/status/2106380264641376527", "text": "@NoemiTitarenco Very “Atlantic” flavor profile", "created_at": "2026-10-03T13:46:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NoemiTitarenco", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106376711374070250", "url": "https://x.com/deanwball/status/2106376711374070250", "text": "@NoemiTitarenco also today I learned about percebes", "created_at": "2026-10-03T13:31:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NoemiTitarenco", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106373927941574789", "url": "https://x.com/deanwball/status/2106373927941574789", "text": "@johnawahba true", "created_at": "2026-10-03T13:20:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "johnawahba", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106371010417320088", "url": "https://x.com/deanwball/status/2106371010417320088", "text": "I do believe I could sit by the sea and eat cooked-alive decapods and drink albarino for at least five consecutive hours", "created_at": "2026-10-03T13:09:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106368001889251685", "url": "https://x.com/deanwball/status/2106368001889251685", "text": "@IntuitMachine yep", "created_at": "2026-10-03T12:57:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "IntuitMachine", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106366672940511712", "url": "https://x.com/deanwball/status/2106366672940511712", "text": "@ZacharyGraves the bitter lesson is when all these fancy custom methods to improve shrimp welfare fail compared to leveraging more and more compute", "created_at": "2026-10-03T12:52:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ZacharyGraves", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106365535793655863", "url": "https://x.com/deanwball/status/2106365535793655863", "text": "openai staffer FIRED by WOKE EA WIZARDS after posting picture of DECAPITATED DECAPODS", "created_at": "2026-10-03T12:47:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106358722092253407", "url": "https://x.com/deanwball/status/2106358722092253407", "text": "guess I’m getting fired from the Effective Altruism Conspiracy https://t.co/Voa66RZYQw", "created_at": "2026-10-03T12:20:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 240, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtKF21WoAAQvRg.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106357262709080384", "url": "https://x.com/deanwball/status/2106357262709080384", "text": "Recently there was a story reporting on OpenAI’s form 5500 (the public disclosure about our 401k program) which some people used to make observations with the flavor of “see, they don’t REALLY believe in advanced AI, or else they wouldn’t be saving money!”\n\nI contribute to my openai-sponsored 401k as well as other conventional retirement-savings vehicles. I cannot speak for any of my colleagues, but I can tell you why I personally make these contributions.\n\nFirst there is the reality that the whole “advanced AI means money has no value, either because we live in utopia and everything’s free or because we are all dead” are extreme ends of the spectrum of possible futures. It is true that things of this flavor, or other scenarios similar enough to this that one’s retirement savings don’t matter, *are* possible outcomes. But also there are many other plausible transformative futures, and I’m enough of a Burkean that I’m not going to jettison some of the oldest financial wisdom humans have developed (save money!) over my own projections about the future. It wouldn’t be responsible to my family, for one thing.\n\nFamily is an important part of my thinking on this topic for other reasons. In some sense, I want to live in a future where having set aside money for retirement is still prudent. That would mean the future, however transformed, is still familiar enough. A world where it truly doesn’t matter whether uou save may be a lovely place to live (or it may not), but regardless of its desirability it is a world SO transformed that, again, my Burkean prior kicks in. \n\nI *hope* the future is at least vaguely familiar to me as I exist today. I hope that at least some of the habits I have learned still matter in that future, and that some of the wisdom I have learned holds true. I hope that not just for me but for my son and future children. I do a lot of things out of this hope, and one small example is that I contribute to a 401k. \n\nA lot of people made their sneering observations about OAI employees’ 401k contributions, saying “derp de doo, revealed preferences, they don’t believe what they say.” That’s fine. Maybe that IS why some frontier AI company staff save for retirement. But I’d characterize my mentality about savings more as an article of faith at this point, and my biweekly 401k contributions as tiny prayers for a vaguely recognizable future.", "created_at": "2026-10-03T12:14:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 178, "retweets": 2, "media": [], "quoted": {"author": "sterlingcrispin", "text": "I'm 40 and struggle with retirement planning in the singularity, even if we stay on this pace without RSI. \n\nDo life extension drugs require 40+ years of savings rather than the standard 25? Will huge GDP growth mean a 3-4% withdraw rate is too conservative? Should I stop saving or double down? \n\nThe S&P has done 15% average over the last decade, well above the long term 10% returns. Is that the new normal to plan for, or are we going to rip even higher and start to see 20%+ averages over the 2026-2050 time period as new medicine and technology arrives at break neck speed?\n\nOr will AI create so much job loss that despite rapidly advancing technology things will flatten out?\n\nIf you're max bullish there's a point where you hit an amount of savings that continuing to save actually doesn't make any sense and you may as well spend it now.\n\nYou kind of have to hope for the best but plan for the worst and it's actually pretty confusing"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106330867345862699", "url": "https://x.com/deanwball/status/2106330867345862699", "text": "The contrast between hanging up the last phone call of the day of high-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.", "created_at": "2026-10-03T10:29:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 22397, "retweets": 608, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106138178935816204", "url": "https://x.com/deanwball/status/2106138178935816204", "text": "I agree with this. These web data access incidents tell us something about the scale and persistence of agents, but are not sophisticated from a cyber perspective, so using the word \"hack\" is not helpful.", "created_at": "2026-10-02T21:44:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 295, "retweets": 28, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106121035456385258", "url": "https://x.com/deanwball/status/2106121035456385258", "text": "@aarmlovi amirite https://t.co/5GhtyDwZ3N", "created_at": "2026-10-02T20:35:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpx6r7WYAAfybL.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106116460615524492", "url": "https://x.com/deanwball/status/2106116460615524492", "text": "@8teAPi I probably shouldn’t share my opinions about cfaa precedent here, lest they be construed as the legal opinions of openai group pbc, but I encourage you to ask a language model for facts about precedent relating to the word “unauthorized” in cfaa jurisprudence", "created_at": "2026-10-02T20:17:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "8teAPi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106115022573449578", "url": "https://x.com/deanwball/status/2106115022573449578", "text": "@iammattduff lmao “even Dean”? I have been doing stuff like what the media are now breathlessly describing as hacking since I was pre-pubescent.", "created_at": "2026-10-02T20:12:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "iammattduff", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106114034743607691", "url": "https://x.com/deanwball/status/2106114034743607691", "text": "another one of my most hated tweet series whose analysis ends up being shown to be rooted in fact", "created_at": "2026-10-02T20:08:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106113753557192901", "url": "https://x.com/deanwball/status/2106113753557192901", "text": "@logisti00 because openai is being extremely fastidious about this sort of disclosure right now.", "created_at": "2026-10-02T20:07:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "logisti00", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106113535117840870", "url": "https://x.com/deanwball/status/2106113535117840870", "text": "nailed it https://t.co/ZGW3cf5NTA", "created_at": "2026-10-02T20:06:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 154, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTprGHXWQAAe6M5.jpg"}], "quoted": {"author": "ChristopherHale", "text": "NEW: According to a bombshell report in the New York Times, Anthropic co-founder Chris Olah threatened to walk out of Pope Leo XIV’s AI encyclical launch in May because the pope rejected the idea that machines can be conscious.\n\nOlah’s team then privately lobbied the pope’s advisers “to take the possibility of model consciousness seriously.” Pope Leo XIV held firm.\n\nFor months, Anthropic has wined and dined theologians and religious scholars under nondisclosure agreements, hoping they would bless the idea that Claude has moral standing. https://t.co/iG3Bnlzt2J"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106112240642646396", "url": "https://x.com/deanwball/status/2106112240642646396", "text": "And in truth, as a user, I *want* agents to find the publicly accessible but hard-to-find public datasets. I’d consider that a part of a well-aligned agent. As an American too, tbqf.", "created_at": "2026-10-02T20:01:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 90, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106111729566417345", "url": "https://x.com/deanwball/status/2106111729566417345", "text": "To be quite frank, a lot (not all!) of these “rogue agent hacks” on government statistical websites are things that think-tank interns and research assistants have done for many years. I have known many a think tank paper that was enriched by an enterprising RA using eg urlquery to find CSVs and PDFs on government agency websites that were publicly accessible and non-sensitive but nonetheless not things the agency *intended* to be on their website. Is it “hacking” to find those things? Is it hacking in the even more innocuous examples where agents are literally just accessing tabular data available on a government statistical website, just a version of that data that is easier to access and analyze programmatically? \n\nThis constant trickle of examples (which tbc I have personally seen many models do, before I joined OpenAI; it is even something I have discussed with models before!) will probably have the effect of diminishing the importance of “an AI hack” on the eyes of the observing public by creating an oversupply of “AI hack” examples. OAI-HF was an example of AI hacking. Many of these more recent examples, very candidly, are straining the definition of the word “hack” and, I worry, cheapen the non-technical public’s understanding of that concept.", "created_at": "2026-10-02T19:59:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 607, "retweets": 55, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106051691112259679", "url": "https://x.com/deanwball/status/2106051691112259679", "text": "I continue to think (and fear) that questions around AI personhood are going to be the defining religious conflict of the 21st century. It's going to get extremely ugly.", "created_at": "2026-10-02T16:00:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ARozenshtein", "rt_author_name": "Alan Rozenshtein", "likes": 128, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106008431060529443", "url": "https://x.com/deanwball/status/2106008431060529443", "text": "🔵@deanwball, autor de «Hyperdimensional», director de Futuros Estratégicos en @OpenAI y actualmente investigador sénior no residente en @JoinFAI, en #ForoLaToja2026: \"Siempre existe la tensión entre centrarnos en los escenarios de largo plazo y futuro o en lo que tenemos delante hoy. Una de las cosas que está provoc
