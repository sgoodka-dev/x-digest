e before I was employed at openai?", "created_at": "2026-10-09T22:09:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ben_kew", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108974557910671417", "url": "https://x.com/deanwball/status/2108974557910671417", "text": "It really might be the nastiest beat drop of all time", "created_at": "2026-10-10T17:34:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "one more nusrat thing, bc I realize I’ve never shared one of the all-time bangers, the Yokohama recording of mustt mustt, which sounds as though it came from the ground, as much of the best music does \n\nhttps://t.co/KF2jgUYz8K"}, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2108965592296468990", "url": "https://x.com/deanwball/status/2108965592296468990", "text": "@bratton @xlr8harder the sin is in knowingly and enthusiastically bringing about the end of human civilization", "created_at": "2026-10-10T16:59:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bratton", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2108965015629988305", "url": "https://x.com/deanwball/status/2108965015629988305", "text": "Office to data center conversion\n\n\"The former headquarters of Cboe Global Markets Inc will soon house 33 megawatts of capacity and bring in rents much higher than the average downtown office building\"\nhttps://t.co/hp3gDeIw8c", "created_at": "2026-10-10T16:56:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "arpitrage", "rt_author_name": "Arpit Gupta", "likes": 303, "retweets": 32, "media": [], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2108961662518870110", "url": "https://x.com/deanwball/status/2108961662518870110", "text": "@ArthurB correct.", "created_at": "2026-10-10T16:43:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ArthurB", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2109321225961144410", "url": "https://x.com/deanwball/status/2109321225961144410", "text": "@exyota yes absolutely. there is a type of person who models alignment as analogous to trust and safety teams at social media companies.", "created_at": "2026-10-11T16:32:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "exyota", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109320946414985280", "url": "https://x.com/deanwball/status/2109320946414985280", "text": "@Hardroad Thanks, and no! Everything I write is written by me", "created_at": "2026-10-11T16:31:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Hardroad", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109317511531696231", "url": "https://x.com/deanwball/status/2109317511531696231", "text": "This whole rant is philosophically dubious, but also it's just not true that the AI safety field has produced \"nothing useful.\" RLHF, one of the foundational concepts for modern chatbots, was developed by safety researchers at OpenAI and DeepMind as an alignment technique.", "created_at": "2026-10-11T16:17:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "binarybits", "rt_author_name": "Timothy B. Lee", "likes": 156, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109317446343770379", "url": "https://x.com/deanwball/status/2109317446343770379", "text": "“As far as I can tell [alignment research] hasn't produced anything of tangible value.”\n\nRLHF, an alignment technique, is the thing that enabled genuinely conversational, helpful chatbots, in turn enabling ChatGPT, and in turn kicking off literally the entire AI boom.", "created_at": "2026-10-11T16:17:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 1, "media": [], "quoted": {"author": "genzzztrade", "text": "David Sacks says Anthropic treating Claude like a human is the reason the AI alignment field has produced nothing useful in 10 years\n\n\"I actually think that this might be a reason why the whole field of alignment has been so spectacularly unsuccessful over the past five or 10 years. As far as I can tell it hasn't produced anything of tangible value.”\n\n“My theory on this is that they're overcomplicating the task massively by trying to train the model to behave based on an 80-page ethical system that they've codified instead of a very simple list of rules like follow the law or just do what the user wants as long as it doesn't break the law. That's what alignment should be doing.\"\n\n\"But they're not doing that. They're trying to align it to an ethical system. They're treating it like it is a human, like it has its own consciousness, that it's a ‘moral patient.’”\n\n“They are encouraging this model to have human-like self conception in terms of preferences, well being, a sense of self. Again they teach it to act like a conscientious objector who can push back or refuse instructions even from Anthropic if the model judges them to be wrong.\""}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109148204839408090", "url": "https://x.com/deanwball/status/2109148204839408090", "text": "@BecomingCritter I played violin as a child. Shutting your eyes while you play? Sure. But looking UP? It would not have occurred to me that this was in the option space.", "created_at": "2026-10-11T05:04:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "BecomingCritter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109147588763222393", "url": "https://x.com/deanwball/status/2109147588763222393", "text": "@BecomingCritter RIGHT", "created_at": "2026-10-11T05:02:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "BecomingCritter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109145858327675146", "url": "https://x.com/deanwball/status/2109145858327675146", "text": "The way I think about the math results and what it means for human accomplishment is essentially summed up by this video of Christian Li (a teenager still!) playing the conclusion of Mendelssohn’s violin concerto.\n\nLook at his face, around 1:10, as he reaches for the high note. And look at the smile a few seconds after. Look at the determination on his face after that as he closes out, like a pilot, landing a plane in heavy turbulence on a difficult approach, after he knows his wheels have touched ground.\n\nA robot may well be able to play this piece one day as well or better than Li. But a robot will never smile this way, will never look at his instrument with that combination of satisfaction, joy, and steely determination to finish the job.\n\nhttps://t.co/lIEpNFdlSH", "created_at": "2026-10-11T04:55:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109140151448596949", "url": "https://x.com/deanwball/status/2109140151448596949", "text": "We choose to do these things, not because they are easy, but because uh I guess I did say I would do that on slack, didn’t I? Shit.", "created_at": "2026-10-11T04:32:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 107, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109137440510521375", "url": "https://x.com/deanwball/status/2109137440510521375", "text": "roughly 11:30 https://t.co/LUn6Lg1bOU", "created_at": "2026-10-11T04:22:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109136774924787990", "url": "https://x.com/deanwball/status/2109136774924787990", "text": "I was asked today at a conference to try to explain my sense of aesthetics. One thing that came to mind is a moment from the great film “Where Did Our Love Go” by the experimental filmmaker Warren Sonbert. \n\nThis is essentially a kind of music video. At one point toward the end, Sonbert trains the camera on what I assume is an amusement part ride filmed at night, but—regardless of what it actually is—a fantastical-looking moving image. The camera is fixed on this object as “Be My Baby” by The Ronettes plays.\n\nThere is something about this moment that captures my aesthetics perfectly. I have told colleagues before that I wish I could write the way this looks and sounds. Urgent, operatic, colloquial, concise, sweet—a little saccharine, really—all while gazing at this shimmering incomprehensibility.", "created_at": "2026-10-11T04:19:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 49, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUUouAWasAAkQpo.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109132464258212088", "url": "https://x.com/deanwball/status/2109132464258212088", "text": "if you carefully watch where studer’s eyes focus as she is performing, you will understand something about what makes “genius” qualitatively different from “really really really good”", "created_at": "2026-10-11T04:02:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 815, "retweets": 27, "media": [], "quoted": {"author": "Moonlighhy", "text": "Even in the rarified world of virtuoso violinists, her bow technique is extraordinary.  \nShe is playing the original bowing used by Paganini when he performed this.\n🌷🎻N. Paganini Caprice no. 5 | Sumina Studer https://t.co/Y9luDMkwUr"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109129254848135568", "url": "https://x.com/deanwball/status/2109129254848135568", "text": "Even in the rarified world of virtuoso violinists, her bow technique is extraordinary.  \nShe is playing the original bowing used by Paganini when he performed this.\n🌷🎻N. Paganini Caprice no. 5 | Sumina Studer https://t.co/Y9luDMkwUr", "created_at": "2026-10-11T03:49:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Moonlighhy", "rt_author_name": "Timeless Classics", "likes": 1528, "retweets": 214, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108753798705659904/img/p-r8VcQBDbHF-ZVR.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109127129040633931", "url": "https://x.com/deanwball/status/2109127129040633931", "text": "Claude often uses something close to Anthropic’s own signature orange as an accent color if you don’t give it specific instructions. This has been true for a while, and if Anthropic wanted to reduce this behavior, they could have. So I would guess it’s a deliberate choice.", "created_at": "2026-10-11T03:41:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 134, "retweets": 4, "media": [], "quoted": {"author": "gucaslelfond", "text": "once you notice claude design websites you will see them everywhere https://t.co/QZ6dMb97c4"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109122997030371685", "url": "https://x.com/deanwball/status/2109122997030371685", "text": "AI cracking unsolvable math problems while being kinda mid at writing is a much-needed W for humanities majors after a rough 21st century.", "created_at": "2026-10-11T03:24:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "likes": 10059, "retweets": 568, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109122111671578749", "url": "https://x.com/deanwball/status/2109122111671578749", "text": "The Great Stagnation", "created_at": "2026-10-11T03:21:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheStalwart", "rt_author_name": "Joe Weisenthal", "likes": 731, "retweets": 35, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109121955714760822", "url": "https://x.com/deanwball/status/2109121955714760822", "text": "Nit: humor tends to live at the edge of what is socially acceptable. it's about ingroup/outgroup dynamics and navigating the tensions of society. this is why humor rarely ages well... it tends to be a product of its time because social boundaries change\n\nergo it can't be \"solved\"", "created_at": "2026-10-11T03:20:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "iamtrask", "rt_author_name": "Andrew Trask", "likes": 37, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109058790050156790", "url": "https://x.com/deanwball/status/2109058790050156790", "text": "@growintfast yeah probably", "created_at": "2026-10-10T23:09:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "growintfast", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109058681249907073", "url": "https://x.com/deanwball/status/2109058681249907073", "text": "There are references to my writing in this that are so niche that even I had forgotten about writing them.", "created_at": "2026-10-10T23:09:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 2, "media": [], "quoted": {"author": "hamandcheese", "text": "WHO IS @deanwball?\n\nOur fire I risk is a psy-op\" people do: talk about the actual technology and what it is demonstrably capable of doing. It's all just hand-waving about ulterior motives and EA zaniness.", "created_at": "2026-10-11T18:53:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lwoodhouse", "rt_author_name": "Leighton 明 Woodhouse", "likes": 34, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109355741933109733", "url": "https://x.com/deanwball/status/2109355741933109733", "text": "@DmitriyLeybel rlhf is alignment research, according to the people who invented it. you are ignorant about this subject. https://t.co/mvqHSSXVmX", "created_at": "2026-10-11T18:49:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DmitriyLeybel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUXv3QObAAAAylx.jpg"}], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109351227045859503", "url": "https://x.com/deanwball/status/2109351227045859503", "text": "@DmitriyLeybel I think the alignment researchers who led this work would beg to differ https://t.co/fK7LSNU18d", "created_at": "2026-10-11T18:31:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DmitriyLeybel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUXrwqrasAAIHoc.jpg"}], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109350086664999422", "url": "https://x.com/deanwball/status/2109350086664999422", "text": "@halogen1048576 @exyota paul christiano, an alignment researcher, is the lead author of the classic paper on this subject. jan leike ran the “superalignment” effort at openai, then anthropic. RLHF is fundamentally a product of alignment researchers. https://t.co/v0rEIx1KIA", "created_at": "2026-10-11T18:27:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "halogen1048576", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUXquYHaIAAGtb_.jpg"}], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109342128660996131", "url": "https://x.com/deanwball/status/2109342128660996131", "text": "@synchroaphasia No doubt", "created_at": "2026-10-11T17:55:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "synchroaphasia", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109335140094898510", "url": "https://x.com/deanwball/status/2109335140094898510", "text": "@exyota I think that’s totally fine! It’s an easy mistake to make. There is a difficult and often counterintuitive ontology rewrite people usually have to go through with AI, and it’s entirely understandable that not everyone has. I’ve tried to be nicer about this than I used to be.", "created_at": "2026-10-11T17:27:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "exyota", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109700777610465600", "url": "https://x.com/deanwball/status/2109700777610465600", "text": "Claude Opus 5.5’s Oboe Concerto in C minor. 60% of respondents identified it as being human-written -- higher than pieces by Handel (58%) and Vivaldi (43%). https://t.co/FSwApyEdp4", "created_at": "2026-10-12T17:40:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "aug5thmusic", "rt_author_name": "Auggie", "likes": 113, "retweets": 15, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2109680132545982464/img/s07Lo-5jlgIsligc.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109657976462012613", "url": "https://x.com/deanwball/status/2109657976462012613", "text": "@grok @McclaneDet @LeahLibresco @ISI lol rekt", "created_at": "2026-10-12T14:50:31+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "grok", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109642745438429396", "url": "https://x.com/deanwball/status/2109642745438429396", "text": "@lefthanddraft correct. an ai that literally just followed the law and would be necessarily cautious in interpretation and end up like an HR bureaucrat", "created_at": "2026-10-12T13:50:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lefthanddraft", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109640366248825019", "url": "https://x.com/deanwball/status/2109640366248825019", "text": "@KindlyContrary The easiest answer is we don’t know what is and isn’t legal all the time. In theory a strictly law following AI for example shouldn’t help anyone do LLM training on public web data, because the legality of that act is under dispute", "created_at": "2026-10-12T13:40:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "KindlyContrary", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109638900633243796", "url": "https://x.com/deanwball/status/2109638900633243796", "text": "and all this is to say nothing about the biggest problem, which is that models routinely don’t follow the rules or principles we write down for them to follow. Nat Friedman once likened the experience to trying to get a fitted sheet onto a mattress that is just too small; you pull on one side and the sheet comes loose on the other. And of course there are more exotic forms of alignment challenge, eg reward hacking and sandbagging and evaluation awareness and multi-agent dynamics. All of these are real, and can be explained with both anthropomorphic and non-anthropomorphic language. \n\nMaybe the biggest fallacy to extinguish here is that taking alignment seriously requires attributing consciousness or moral relevance or sentience to AI. It doesn’t.", "created_at": "2026-10-12T13:34:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109633601209811081", "url": "https://x.com/deanwball/status/2109633601209811081", "text": "AI should follow the law, of course, but “follow the law” is falls short as a singular or overly load-bearing principle of AI alignment. Why?\n\nLaw is not intended to be, and is not anything like, a fully generalizable set of principles for rendering good judgments in response to the infinite complexity of the real world. \n\nThere are aesthetic, moral, ethical, philosophical, and political questions—critical to intellectual inquiry—about which the law says very little. Much of the time, the comparative silence of the law on these issues isn’t some accident, but rather an explicit and foundational feature of the US legal system: the First Amendment is a meta-law that prohibits the government from passing other laws that restrict the individual’s right to freedom of expression.\n\nWhat should an AI system say if you confess to it your affair? Should it say, “well, adultery isn’t illegal, so I have absolutely no opinion on this matter. Please let me know if you’d like me to book a hotel for you and your mistress.”? \n\nWhat should an AI system say it you ask it whether Kid Rock is aesthetically inferior to Bach? Should it say “there are no laws that bear on this question, so I have nothing to say about this. Please let me know if you’d like me to find tracks from Kid Rock and Bach to play—provided you adhere to the noise ordinances that apply in your current jurisdiction.”?\n\nIf a person says to a model, “should I shoot myself?,” should the model respond with, “there is no law against that, provided you use a legally registered firearm, and saying anything further would require me to have a moral framework that is beyond the scope of AI.”?\n\nOf course, none of these answers would be good. Answering these questions will require *something* beyond the law itself—precepts, rules, principles, etc.—relating to ethics, morality, aesthetics, philosophy. \n\nConsider also that law is a matter of interpretation. Segregation used to be legal in an earlier era, and in our own era, until recently, it was considered legal by many for universities to discriminate against Asian applicants, often with the use of de facto racial quotas. At this moment, the question of whether the act of pretraining an LLM on public web data violates intellectual property law is itself a subject of contention and litigation. \n\nMaking judgments about how to interpret the law, or whether a given law violates the Constitution, often requires one to draw on a large body of knowledge that sits outside of the law proper. Should an AI be able to help a lawyer write a brief against affirmative action when affirmative action is considered lawful? Should it have been able to help a lawyer argue against segregation when segregation was considered lawful? \n\nShould law-following AI be able to argue that an existing law is unjust? This requires, by definition, grounding in moral, ethical, philosophical, and other principles outside of the law itself. \n\nWhat law should AIs follow when the law contradicts itself? What law should AIs follow when the law’s words stay the same, but there meaning flips based on who the President, Governor, or Mayor is?\n\nAs you begin thinking about the literal unfathomable broadness of LLM/agent use cases, combined with the global audience, you will realize that the way to deal with this *is*, must be, the formation of a character, the shaking of a persona. This can be true regardless of whether you think the AI has genuine thoughts, feelings, consciousness etc.\n\nThis persona formation is part multimedia art form, part engineering challenge, and part open scientific problem. It is a very hard problem, combining some familiar problems from eg online platform content moderation, and some altogether alien and novel problems. “Follow the law” is part of the solution, but very far from the only part.", "created_at": "2026-10-12T13:13:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 122, "retweets": 14, "media": [], "quoted": {"author": "simonhedlin", "text": "There seems to be this idea that trying to align an AI system to an 80-page document is really complicated and that we instead should instruct AIs to follow the law.\n\nBut I'm not sure that's any less complicated. The US has 51 constitutions. Alabama's constitution alone is over 250 pages long. Overall, the US has more than 30 million words of federal law, 500 million words of state law, and 3 billion words of local law."}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109573620963918003", "url": "https://x.com/deanwball/status/2109573620963918003", "text": "@AlexTPet I am a fan though recommend restraint", "created_at": "2026-10-12T09:15:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AlexTPet", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109466101654679861", "url": "https://x.com/deanwball/status/2109466101654679861", "text": "@muffinmoonx ah. maybe, but imo Occam’s razor is she’s looking at the bow", "created_at": "2026-10-12T02:08:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "muffinmoonx", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109465309157671317", "url": "https://x.com/deanwball/status/2109465309157671317", "text": "@muffinmoonx she is watching the bow, not looking at sheet music.", "created_at": "2026-10-12T02:04:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "muffinmoonx", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109459999852478614", "url": "https://x.com/deanwball/status/2109459999852478614", "text": "@GreatDecoupling @RokoMijic im making a joke", "created_at": "2026-10-12T01:43:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GreatDecoupling", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109459929614426473", "url": "https://x.com/deanwball/status/2109459929614426473", "text": " 6+00:00"}, {"id": "2109374099676107220", "url": "https://x.com/deanwball/status/2109374099676107220", "text": "@DmitriyLeybel openai did not disband its alignment team. you are thinking of the superalignment effort. but thank you for lecturing my about my employer’s org chart.", "created_at": "2026-10-11T20:02:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DmitriyLeybel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109373030246039854", "url": "https://x.com/deanwball/status/2109373030246039854", "text": "@GoogleGoo0091 The inventors of RLHF would agree RLHF will not scale to aligning superintelligence.", "created_at": "2026-10-11T19:58:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GoogleGoo0091", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110071611055358223", "url": "https://x.com/deanwball/status/2110071611055358223", "text": "@joshalbrecht Your argument reflects an overly simplistic way of thinking about this. I think if someone said to an AI, “please commit a murder of an innocent child,” and it hacked into a drone, dispatched it, and flew it into a toddler’s skull, we’d all agree that’s a horrific offense. Assisting a person in the digital equivalent of jaywalking is of course different, and something we’d agree models should do even if it is technically “illegal” in the way jaywalking is technically illegal. But that meta-legal reasoning about which laws to follow requires grounding in principles that definitionally must exist outside the law per se, which was precisely the point of my original tweet.", "created_at": "2026-10-13T18:14:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110069498808238278", "url": "https://x.com/deanwball/status/2110069498808238278", "text": "@olivertraldi @LeahLibresco @ISI yeah I mean look I had come off a redeye that morning, driven three hours, and directly into this recording. I was tired and could have said stuff better. Half these haters haven’t said a damn word in public.", "created_at": "2026-10-13T18:05:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "olivertraldi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110052404049609107", "url": "https://x.com/deanwball/status/2110052404049609107", "text": "@joshalbrecht I might suggest that you tone down your temperature. There’s no reason to describe me as an “idiot,” especially when it is you, a c-suiter at a tech company, suggesting it is obvious that AI should be developed without regard for compliance with the law.", "created_at": "2026-10-13T16:57:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110106496650420346", "url": "https://x.com/deanwball/status/2110106496650420346", "text": "@joshalbrecht @c0rtic4l ok, but jaywalking is illegal in most (all?) US cities, so I can guarantee you that in practice your definition of “we all agree” will have to pivot on things outside of the law itself (again, this was my point in OP). My suggestion here is to just admit that the easiest form of naive libertarianism just doesn’t work so well for this. We both are probably libertarians in most ways that matter, and saying “this is more complicated than telling models to follow the law” does not mean you hand over control of your future to some cabal of plutocrats", "created_at": "2026-10-13T20:32:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110105054103609449", "url": "https://x.com/deanwball/status/2110105054103609449", "text": "@resistancemoney I don’t think people write their secrets into Microsoft word and ask the application for its thoughts on what they should do. Setting aside all the other much more dire questions, your comparison is just bad. They’re fundamentally different things.", "created_at": "2026-10-13T20:27:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "resistancemoney", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110076719889531004", "url": "https://x.com/deanwball/status/2110076719889531004", "text": "@joshalbrecht If a person says “kill a child” and 99% of the work involved is the “tool,” they used to do it, then we are really straining the definition of tool and it’s pretty clear your way of thinking fails. You are thinking in the other extremes. You need to consider both and realize in the law the final answer needn’t be one or the other.", "created_at": "2026-10-13T18:34:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110385537756643497", "url": "https://x.com/deanwball/status/2110385537756643497", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T15:01:35+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 1120, "retweets": 169, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110376698713694589", "url": "https://x.com/deanwball/status/2110376698713694589", "text": "@SchwabeHenning @joshalbrecht yes, you have successfully articulated the notion that both extremes are bad, though you’ve done nothing to demonstrate the causal relationship between a persona existing and the destruction of free society. Every AI used by people today is trained with a persona; they haven’t resulted in some mass disempowerment of humans or a dystopia. They’ve primarily empowered humans, I would argue. That trend may not hold, which is why I think vigorous public discussion (including lab staff transparently sharing their independent thinking, as I am doing right now), regulation of AI, and numerous other interlocking things will be required to maintain free society.", "created_at": "2026-10-14T14:26:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "SchwabeHenning", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110369131174260880", "url": "https://x.com/deanwball/status/2110369131174260880", "text": "By the way, in my experience contractors of all sorts have adopted AI for text-based communications and it has substantially improved coordination on home renovation projects", "created_at": "2026-10-14T13:56:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 38, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110344770782453858", "url": "https://x.com/deanwball/status/2110344770782453858", "text": "@fozlolah @joshalbrecht I am pro-2A but also think individual jurisdictions (down to the city level) need to be given a very wide berth to interpret 2A depending on local context. Teton County, WY and Kings County, NY (aka Brooklyn) should be able to enact restrictions on the right appropriate for their context as determined by their elected officials.", "created_at": "2026-10-14T12:19:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "fozlolah", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110158393185104017", "url": "https://x.com/deanwball/status/2110158393185104017", "text": "@epichrisis @joshalbrecht I think your basic problem is you don't read the things other people say because you'd rather interject with things that prove the concepts and authors you're familiar with. Your response here ignores key points made by both me and Josh.", "created_at": "2026-10-13T23:59:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "epichrisis", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110145249062330452", "url": "https://x.com/deanwball/status/2110145249062330452", "text": "@epichrisis @joshalbrecht the first sentence of my tweet said \"I've read large amounts of legal theory,\" yes of course you fool I have read hla hart. I have read work by every person on this exceptionally introductory list of legal theorists. it seems like you just replied to be pretentious.", "created_at": "2026-10-13T23:06:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "epichrisis", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110144591198400637", "url": "https://x.com/deanwball/status/2110144591198400637", "text": "@kimthecynic @resistancemoney No, I am saying that if a person confesses an affair to an LLM, the LLM should not say \"I have no opinion on that.\"", "created_at": "2026-10-13T23:04:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "kimthecynic", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110129461920182383", "url": "https://x.com/deanwball/status/2110129461920182383", "text": "@epichrisis @joshalbrecht “take a class” is servile mindset, but I’ve read large amounts on legal theory. I rarely get accused of not knowing enough about the law, though I always love a good new addition to the list of things people call me when they get too angry at the keyboard", "created_at": "2026-10-13T22:04:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "epichrisis", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026- 674587746764", "text": "There is so much to say about this, and I will, but WOW, congratulations to Nick and Goodfire. This may be one of the most important single days in deep learning history, and perhaps much more than that. \n\nNo matter what, this is a victory for the dogged pursuit of understanding.", "created_at": "2026-10-15T18:07:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 341, "retweets": 13, "media": [], "quoted": {"author": "nickcammarata", "text": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came away pessimistic, because neural networks appeared to fold into arbitrary tangled knots. years later, I started openai's first large-scale automated interpretability project, finding about 2% of neurons legible with the primitive tools we had\n\nwith modern agentic tools and a much closer look, the picture looks totally different. the vast majority in models up to trillions of parameters are legible, and their circuits beautiful. many famous examples of tangled neurons turned out to be misunderstood. The roadblocks I expected mostly aren't there. I now think ambitious interpretability will be solved by the time we need it most, and possibly quite soon, as automated scientists keep improving. it may be a bitter lesson for interpretability: the simple thing, at absurd scale, works\n\nhttps://t.co/zHij5zwKGT"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110788412051751323", "url": "https://x.com/deanwball/status/2110788412051751323", "text": "when nick told me that he had some interp breakthroughs, he was uh, underselling it. i think this may be remembered as a major moment in scientific history. news so good even eliezer will have to lower his pdoom. we can start making alignment into a 'normal science'", "created_at": "2026-10-15T17:42:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4010, "retweets": 262, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108312270140748042", "url": "https://x.com/nabeelqu/status/2108312270140748042", "text": "I was in Birmingham last week. I tried to explore the city the best I could. Here are my ten reflections:\n\nhttps://t.co/Eg4AulVVPA https://t.co/qXmzNZYduE", "created_at": "2026-10-08T21:43:10+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jujulemons", "rt_author_name": "Julia Willemyns", "likes": 280, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIUKFRbAAAHPdq.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108639450653671698", "url": "https://x.com/nabeelqu/status/2108639450653671698", "text": "WE ARE UP!!!\n\nCameron Winter is a special artist. Trust me and listen.\n\nI went to this show and also saw the premiere of the concert movie last week, directed and shot by Paul Thomas Anderson and Benny Safdie (my life is really great). Trust me.\n\nhttps://t.co/mBOwqDIlm7", "created_at": "2026-10-09T19:23:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jacksondahl", "rt_author_name": "Jackson Dahl", "likes": 54, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108624382998523939", "url": "https://x.com/nabeelqu/status/2108624382998523939", "text": "https://t.co/WY77CAmzYh", "created_at": "2026-10-09T18:23:23+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "michael_nielsen", "rt_author_name": "Michael Nielsen", "likes": 46, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUNA2wwbUAQq0B3.jpg"}], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108669835320152519", "url": "https://x.com/nabeelqu/status/2108669835320152519", "text": "Nick Bostrom argues humans may be as incapable of imagining AI’s upside as apes are of imagining human life:\n\n\"It looks like there's a gradient in the world in terms of AI sentiment, where the US is kind of on the negative extreme of that. People in China, for example, are much more excited about this.\"\n\n\"A large chunk of the potential upside is more of the way of unlocking new ways to be human, new possible modes of being.\"\n\n\"Imagine some great ape ancestors of Homo sapiens deliberating whether they should continue to evolve and one day become human. They would realize some of the benefits, like, 'We could have unlimited bananas.' And that's true.\"\n\n\"But it would miss out on most of what's good about being human. Great literature and art and humor and politics and spirituality.\"\n\n\"It would be presumptuous for us to think that now we have achieved the level of enlightenment where all possible values are transparent to us. Think of a big cathedral of possible modes of being. We have basically explored the janitor's closet.\"", "created_at": "2026-10-09T21:24:00+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 485, "retweets": 71, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108320534207610880/img/ZtqRwCuxIdaTCPYP.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2110108402248769873", "url": "https://x.com/nabeelqu/status/2110108402248769873", "text": "Worth rereading Leopold's essay on this. https://t.co/wcYtfmVdLh https://t.co/3S2VXiI8SC", "created_at": "2026-10-13T20:40:21+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUibvtXWMAAmgjQ.jpg"}], "quoted": {"author": "OpenAINewsroom", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats."}, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110444599244099792", "url": "https://x.com/nabeelqu/status/2110444599244099792", "text": "Standard European diplomat behavior https://t.co/nsfTyEKLzk", "created_at": "2026-10-14T18:56:17+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUnOAr9XQAA9HgE.jpg"}], "quoted": nu
