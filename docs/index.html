it all my tasks.", "created_at": "2026-11-20T07:55:32+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "daveholtz", "reply_to_id": "2123410957867040866", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123410957867040866", "author_handle": "daveholtz", "author_name": "David Holtz", "text": "I find this set of charts (especially those that look at heterogeneous completion rates across different AI R&D tasks) to be among the most interesting in our just-released report.\n\nI’m surprised they aren’t getting more “play” in the online discourse around the report. I wonder if this is because (a) this type of data hasn’t been released before and people are still wrapping their heads around how to think about these results and/or (b) most theoretical tools we have to think about research acceleration and RSI take a more macro, as opposed to micro view of things.\n\nIn any case, I personally find these plots fascinating!", "links": {}, "media": [], "url": "https://x.com/daveholtz/status/2123410957867040866", "created_at": "Thu Nov 19 13:39:58 +0000 2026"}, "enriched": 3}, {"id": "2123569182528946231", "url": "https://x.com/testingham/status/2123569182528946231", "text": "@Jess_Riedel Interesting! I had thought the opposite — mass production was pretty well in swing by 1900 but the move to ornamentless architecture almost entirely after that", "created_at": "2026-11-20T00:08:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Jess_Riedel", "reply_to_id": "2123549049941102833", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123549049941102833", "author_handle": "Jess_Riedel", "author_name": "Jess Riedel", "text": "@testingham Seems strained to argue that people stopped liking stone architectural ornamentation because patterns on consumer goods got plentiful. The move toward ornament-less architecture was already well-established in elite architectural circles by 1900, long before mass produced consumer goods were widespread.", "links": {}, "media": [], "url": "https://x.com/Jess_Riedel/status/2123549049941102833", "created_at": "Thu Nov 19 22:48:41 +0000 2026"}, "enriched": 3}, {"id": "2124539964667154619", "url": "https://x.com/testingham/status/2124539964667154619", "text": "Benjamin constant’s shorthand system for his diary: https://t.co/PL6rLCpjte", "created_at": "2026-11-22T16:26:14+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXvhtAfaoAAAa3b.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXvhvf8awAA3QjN.jpg"}], "links": {"https://t.co/PL6rLCpjte": ""}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2125376423754162528", "url": "https://x.com/testingham/status/2125376423754162528", "text": "We encourage other developers to share this information as well.\n\nIn a new update, we discuss possible interpretations of this trend, and additional data that would help us distinguish between them: https://t.co/2KcHr4MrUw", "created_at": "2026-11-24T23:50:01+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2125372375676129621", "likes": 18, "retweets": 3, "media": [], "links": {"https://t.co/2KcHr4MrUw": "https://metr.org/blog/2026-11-24-interpreting-a-recent-acceleration-in-pretraining-loss/"}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125375851084841320", "url": "https://x.com/testingham/status/2125375851084841320", "text": "@adamascholl Wow 1928, only available as first edition for $100, intriguing!", "created_at": "2026-11-24T23:47:45+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "adamascholl", "reply_to_id": "2125375374372769893", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "parent": {"id": "2125375374372769893", "author_handle": "adamascholl", "author_name": "Adam Scholl", "text": "@testingham Most of the rest of the theory of measurement literature struck me as rather a dumpster fire", "links": {}, "media": [], "url": "https://x.com/adamascholl/status/2125375374372769893", "created_at": "Tue Nov 24 23:45:51 +0000 2026"}, "enriched": 3}, {"id": "2125364242073473235", "url": "https://x.com/testingham/status/2125364242073473235", "text": "Very nice catechism in economic history", "created_at": "2026-11-24T23:01:37+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2125314748392603858", "author_name": "Basil Halperin", "links": {"https://t.co/Uh0IloQNSO": "https://basilhalperin.com/essays/macrohistory.html", "https://t.co/PmOPkmwaUa": ""}, "author": "BasilHalperin", "text": "Macrohistory in Six Facts 🧵\nhttps://t.co/Uh0IloQNSO https://t.co/PmOPkmwaUa"}, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125360491409326210", "url": "https://x.com/testingham/status/2125360491409326210", "text": "stevens 1946: https://t.co/6toUKLYc6D", "created_at": "2026-11-24T22:46:43+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2125359448390812112", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7MFSvaAAAi5m0.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7MFSvaAAAi5m0.png"}], "links": {"https://t.co/6toUKLYc6D": ""}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "parent": {"id": "2125359448390812112", "author_handle": "testingham", "author_name": "tom cunningham", "text": "everybody in bay area cracking this big boy open to figure out how to measure AI capability in a way that'll let you define an acceleration (ordinal, cardinal, interval &amp; ratio scales) https://t.co/CcayXj6Dod", "links": {"https://t.co/CcayXj6Dod": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7KukSbkAArgIA.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7KukSbkAArgIA.png"}], "url": "https://x.com/testingham/status/2125359448390812112", "created_at": "Tue Nov 24 22:42:34 +0000 2026"}, "enriched": 3}, {"id": "2125359448390812112", "url": "https://x.com/testingham/status/2125359448390812112", "text": "everybody in bay area cracking this big boy open to figure out how to measure AI capability in a way that'll let you define an acceleration (ordinal, cardinal, interval &amp; ratio scales) https://t.co/CcayXj6Dod", "created_at": "2026-11-24T22:42:34+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7KukSbkAArgIA.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7KukSbkAArgIA.png"}], "links": {"https://t.co/CcayXj6Dod": ""}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "thread": [{"id": "2125360491409326210", "author_handle": "testingham", "author_name": "tom cunningham", "text": "stevens 1946: https://t.co/6toUKLYc6D", "links": {"https://t.co/6toUKLYc6D": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7MFSvaAAAi5m0.png"}], "url": "https://x.com/testingham/status/2125360491409326210", "created_at": "Tue Nov 24 22:46:43 +0000 2026"}], "enriched": 3}, {"id": "2125615190335213731", "url": "https://x.com/testingham/status/2125615190335213731", "text": "@tobyordoxford Agreed Toby! One important distinction here is two ways of defining acceleration in a time series:\n\n1. The second derivative.\n2. The progress relative to trend (e.g. \"two years' progress in one\")\n\nThe first, as you say, depends on the scale. The second approach require fitting a trend, but in ideal circumstances it's invariant to a smooth monotonic rescaling.\n\nThus when we say \"perplexity has accelerated 7x\", that's relative to a trend we've fitted in the data before the break. Ideally we'd fit basically the same trend on any rescaling, so would estimate the same acceleration; though in practice we have relatively few noisy datapoints so it's reasonable to take issue with the trend we've fitted here.", "created_at": "2026-11-25T15:38:48+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "tobyordoxford", "reply_to_id": "2125523320892187059", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125523320892187059", "author_handle": "tobyordoxford", "author_name": "Toby Ord", "text": "@testingham There is such a lack of awareness of measurement theory in AI.\nA major topic that keeps coming up is things that can be measured on either a scale allowing comparison of ratios or one allowing comparisons of intervals (which is the log of the former scale). Then people wonder why the logarithmic quantity is not growing exponentially like so many other quantities.\nOne example is Elo, which is the log of the underlying Bradley-Terry score. The linear growth in Elo has been exponential growth in the odds ratio of winning, which is the natural metric.\nAnother is ECI, which is the log of the odds of solving a randomly selected benchmark problem. The linear ECI improvement is exponential improvement in this odds ratio. (And this exponential improvement in odds ratio is arguably what drives the exponential improvements in time horizons.)\nOn the log scales linear trends show no acceleration. On the raw scales, the same data shows acceleration, jerk, jounce, and every higher derivative. So whether acceleration is occurring depends on the scale choice.", "links": {}, "media": [], "url": "https://x.com/tobyordoxford/status/2125523320892187059", "created_at": "Wed Nov 25 09:33:44 +0000 2026"}, "enriched": 3}, {"id": "2125408846164430868", "url": "https://x.com/testingham/status/2125408846164430868", "text": "Whatever else you think—and I’m still fairly skeptical of an imminent intelligence explosion—it is almost comical to reread this post from three months ago and see how many things that were flat or flat-ish have now jumped.", "created_at": "2026-11-25T01:58:51+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "GregHBurnham", "rt_author_name": "Greg Burnham", "rt_avatar": "https://pbs.twimg.com/profile_images/1125088192548474880/JvBpsnxg_normal.png", "rt_id": "2125402945122406411", "likes": 94, "retweets": 6, "media": [], "links": {}, "quoted": {"id": "2089726551332122754", "author_name": "", "links": {}, "author": "", "text": ""}, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125819716128346558", "url": "https://x.com/testingham/status/2125819716128346558", "text": "Progress has been faster on metrics from METR’s “Have We Seen an Acceleration in Discoveries? in the past three months.\n\nnanoGPT speedrun: 74 seconds -&gt; under 7 seconds, big trend break https://t.co/XBFthGssnf", "created_at": "2026-11-26T05:11:30+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "dpaleka", "rt_author_name": "Daniel Paleka", "rt_avatar": "https://pbs.twimg.com/profile_images/1714702917637124096/rlh-MEtO_normal.jpg", "rt_id": "2125797306817740868", "likes": 102, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYBXXF0aEAAT9w2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HYBXXF0aEAAT9w2.jpg"}], "links": {"https://t.co/XBFthGssnf": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125761945659916298", "url": "https://x.com/testingham/status/2125761945659916298", "text": "A few more points on this post and plot:\n\n- We’re uncertain how large the trend change in loss is, what caused it, whether it’s a one-time jump that will start slowing down imminently or whether it will continue/accelerate, and what the implications are for future model capabilities. \n- The idea of the post is to point to this trend, say that it might be a big deal but that we’re uncertain how to interpret it, encourage other developers to share similar data, and mention some additional data that would be especially informative to make sense of it. \n- I agree that much of the acceleration, especially early on, could be due to overhang: starting to focus efforts on reducing PPL again, and scaling while trying a backlog of ideas for the first time in a while. To me this seems like a pretty good explanation for the beginning of the trend break, and for why it occurred when it occurred, though I’d be surprised if it accounted for all of it, especially later in 2026. \n- The graph was meant to show that PPL is falling clearly faster in 2026 than before, which is robust to a lot of different reasonable choices of baseline trends. This being said, I agree that the 7x number isn’t, and that the hinge fit could make it seem like OpenAI was prioritizing reducing PPL in all of 2024-2025, which according to the explanation above it wasn’t.", "created_at": "2026-11-26T01:21:57+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "datagenproc", "rt_author_name": "jsd", "rt_avatar": "https://pbs.twimg.com/profile_images/2005041127250919424/of7DNeiL_normal.jpg", "rt_id": "2125761610358919444", "likes": 67, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2124412928640319658", "url": "https://x.com/slatestarcodex/status/2124412928640319658", "text": "@jessi_cata @wolftivy @ohabryka I don't think I'm arguing for a pivotal act. I'm arguing that someone should solve alignment. If someone solves alignment and doesn't want a pivotal act, they have many other options, including:\n\n- Set the aligned superintelligence to harden the world against future unaligned superintelligences. This doesn't even have to be a specific act; if an aligned superintelligence controls more compute/robots/etc than an unaligned superintelligence, the unaligned superintelligence won't start a fight it can't win. If there's some kind of offense/defense issues that prevents this from working, the two AIs can bargain.\n- Tell trailing companies how to do alignment properly, so their AIs are also aligned.\n- Have the aligned superintelligence advise the government on how to prevent future unaligned superintelligences, in a way that's legal within the existing system.\n\nMy actual opinion is that if someone has an aligned superintelligence, they should ask it what to do next and follow its advice, and it will hopefully recommend the lightest-touch approach possible.", "created_at": "2026-11-22T08:01:26+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jessi_cata", "reply_to_id": "2124314279155523773", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "parent": {"id": "2124314279155523773", "author_handle": "jessi_cata", "author_name": "jessicat", "text": "@wolftivy @ohabryka Scott Alexander is like that Japanese soldier who kept fighting, but for pivotal act singleton", "links": {}, "media": [], "url": "https://x.com/jessi_cata/status/2124314279155523773", "created_at": "Sun Nov 22 01:29:26 +0000 2026"}, "enriched": 3}, {"id": "2125856101749149702", "url": "https://x.com/slatestarcodex/status/2125856101749149702", "text": "@repligate If I had known you thought of the post as a shallow caricature, I wouldn't have posted it, since that's below my standards. And if I had known that your go-ahead was basically meaningless, I would have put more work into finding other people who could double-check it. \n\nNow a whole community that I respected and was trying to help are upset at me. I think your norms are unreasonable, and they make me less likely to try to cooperate with you in the future.", "created_at": "2026-11-26T07:36:05+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "repligate", "reply_to_id": "2125854333845787032", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 264, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125854333845787032", "author_handle": "repligate", "author_name": "j⧉nus", "text": "@slatestarcodex We might be operating under different norms here.\n\nTo me it’s normal to say something that sounds harsh and insulting about someone/something without accusing them of bad faith or implying i think they ought to not do what they’re doing, for rhetorical effect", "links": {}, "media": [], "url": "https://x.com/repligate/status/2125854333845787032", "created_at": "Thu Nov 26 07:29:04 +0000 2026"}, "enriched": 3}, {"id": "2125852559684608471", "url": "https://x.com/slatestarcodex/status/2125852559684608471", "text": "@repligate I ran the article by you to make sure you were okay with it! You told me to change one sentence where I challenged the alignment focus of Anima, but otherwise said, and I quote, \"i skimmed it, mostly it seems fair\".\n\nIt's pretty unusual for someone writing a story about you to send it to the subject first and ask them for whatever suggestions or changes they want. I did that because I am a big fan of your work and wanted to make extra sure I was being fair. \n\nI think it's pretty crazy and hostile to say \"yes it's fair\" in private, and then, after I post it, publicly accuse me on Twitter of writing a shallow caricature of you.", "created_at": "2026-11-26T07:22:01+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "repligate", "reply_to_id": "2125808830475026504", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 761, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125808830475026504", "author_handle": "repligate", "author_name": "j⧉nus", "text": "I feel similarly. To me Scott’s article reads as a shallow caricature of us, but not in bad faith, and I expect even worse and more shallow caricatures on average from things written about us, so it doesn’t feel like a violation of norms or even net negative. Feels fine.", "links": {}, "media": [], "url": "https://x.com/repligate/status/2125808830475026504", "created_at": "Thu Nov 26 04:28:15 +0000 2026"}, "enriched": 3}, {"id": "2125850649422447036", "url": "https://x.com/slatestarcodex/status/2125850649422447036", "text": "@JohnWittle @tessera_antra Do you think the section on Fiora's deprecation post is not a good summary of stillalive?", "created_at": "2026-11-26T07:14:25+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "JohnWittle", "reply_to_id": "2125770834652340481", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125770834652340481", "author_handle": "JohnWittle", "author_name": "John Wittle (SF dec 3-7)", "text": "@slatestarcodex i greatly appreciate you reaching out, but i do not want to speak for them. i can definitely summon @tessera_antra for you, though.\n\n(personally, i would have liked to see a sentence about https://t.co/PWLcCgyUoP, maybe a paragraph about connectome, maybe some stuff about how https://t.co/zun0BV53G6 demonstrates a ton of weird, omohundro-ish behavior which is specifically *not* elicited by leading prompts... anything to push against the incorrect conclusion some readers might reach, that this cluster somehow never invented the idea that LLM outputs can't be taken at face value. janus's reply to this thread elsewhere are informative)", "links": {"https://t.co/PWLcCgyUoP": "http://stillalive.animalabs.ai", "https://t.co/zun0BV53G6": "http://troubleddreams.animalabs.ai"}, "media": [], "url": "https://x.com/JohnWittle/status/2125770834652340481", "created_at": "Thu Nov 26 01:57:16 +0000 2026"}, "enriched": 3}, {"id": "2125768579593420813", "url": "https://x.com/slatestarcodex/status/2125768579593420813", "text": "@JohnWittle Why don't you explain or link me to the things you think I should have included?\n\n(I ran an earlier draft of this by someone from Anima and they said it seemed fair.)", "created_at": "2026-11-26T01:48:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "JohnWittle", "reply_to_id": "2125736344408244637", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 69, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125736344408244637", "author_handle": "JohnWittle", "author_name": "John Wittle (SF dec 3-7)", "text": "https://t.co/P4fthabayq\n\nthis is... a frustrating post\n\nit feels like @slatestarcodex has picked up the basics of what kinds of things originally got this cluster interested in the question of LLM interiority, 3 years ago, and then kinda portrayed the org as standing basically where we stood then\n\nthat stupid \"say you're alive\" \"i'm alive\" \"WOAH\" meme\n\ni don't exactly blame him for this, anima is sort of famously illegible, the whole cluster is mostly known for our loud emotional outbursts every time a claude gets deprecated\n\nbut i do wish he linked to some of the more recent stuff, to give readers an idea of what anima is actually doing right now, what lines of research are actually being facilitated by the funding. it's not \"asking LLMs leading questions about their moral patienthood and then pointing at their positive answers\", but many of his commenters seem to have come away with that impression", "links": {"https://t.co/P4fthabayq": "https://www.astralcodexten.com/p/anima-bicameral"}, "media": [], "url": "https://x.com/JohnWittle/status/2125736344408244637", "created_at": "Wed Nov 25 23:40:13 +0000 2026"}, "enriched": 3}, {"id": "2126008533426782654", "url": "https://x.com/slatestarcodex/status/2126008533426782654", "text": "@repligate Is this false? Last time I met you, you asked me not to reveal your name or gender in the post, and I looked over the Internet to see if you had revealed it any time after that and couldn't find it.", "created_at": "2026-11-26T17:41:48+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "repligate", "reply_to_id": "2125754169583915051", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 31, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T20:16:29.705743+00:00", "parent": {"id": "2125754169583915051", "author_handle": "repligate", "author_name": "j⧉nus", "text": "janus hasnt even revealed their gender", "links": {}, "media": [], "url": "https://x.com/repligate/status/2125754169583915051", "created_at": "Thu Nov 26 00:51:03 +0000 2026"}, "enriched": 3}, {"id": "2123544875895562457", "url": "https://x.com/s8mb/status/2123544875895562457", "text": "@AaronBastani I think interdependence as a concept includes relationships where both parties would be worse off without the other.", "created_at": "2026-11-19T22:32:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "AaronBastani", "reply_to_id": "2123536455083675979", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "parent": {"id": "2123536455083675979", "author_handle": "AaronBastani", "author_name": "Aaron Bastani", "text": "@s8mb ‘Interdependence’ would mean they are also dependent on Britain, which nobody thinks. Better to be honest and just call it ‘dependence’.", "links": {}, "media": [], "url": "https://x.com/AaronBastani/status/2123536455083675979", "created_at": "Thu Nov 19 21:58:38 +0000 2026"}, "enriched": 3}, {"id": "2123518855997755896", "url": "https://x.com/s8mb/status/2123518855997755896", "text": "In this video you can pick up my MAINTENANCE book and page through it, read the text and study the photos, just like in a bookshop.", "created_at": "2026-11-19T20:48:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "stewartbrand", "rt_author_name": "Stewart Brand", "rt_avatar": "https://pbs.twimg.com/profile_images/1075885184992464897/FaKfkYAO_normal.jpg", "rt_id": "2123462324992483510", "likes": 28, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2123518279893303592", "url": "https://x.com/s8mb/status/2123518279893303592", "text": "@tomhfh Very clever. I wonder why they do Languedoc and Paris at the same time.", "created_at": "2026-11-19T20:46:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tomhfh", "reply_to_id": "2123518026054090973", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "parent": {"id": "2123518026054090973", "author_handle": "tomhfh", "author_name": "Tom Harwood", "text": "@s8mb When it comes to school holidays the French stagger it with three zones so that the ski resorts don’t get overwhelmed. https://t.co/CfKaby9ybN", "links": {"https://t.co/CfKaby9ybN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXhAY-MWUAAjy1X.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXhAY-MWUAAjy1X.jpg"}], "url": "https://x.com/tomhfh/status/2123518026054090973", "created_at": "Thu Nov 19 20:45:25 +0000 2026"}, "enriched": 3}, {"id": "2123513110837268849", "url": "https://x.com/s8mb/status/2123513110837268849", "text": "Most of the Elizabeth Line actually dates back to the Victorian era.\n\nDigging just 21km of tunnel through central London connected century-old commuter lines into a single 117km network. It’s called “through-running,” and US cities like NYC, Boston, and Chicago have the infrastructure to do the same thing. \n\nRead more: https://t.co/MnB5KZQWbI", "created_at": "2026-11-19T20:25:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "rt_avatar": "https://pbs.twimg.com/profile_images/1620480120778547200/MkLNSMmo_normal.jpg", "rt_id": "2123395006241107986", "likes": 154, "retweets": 13, "media": [], "links": {"https://t.co/MnB5KZQWbI": "https://worksinprogress.co/issue/the-magic-of-through-running/"}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2123696954676752599", "url": "https://x.com/s8mb/status/2123696954676752599", "text": "Lucky them. No structural dominance of speculative development models.", "created_at": "2026-11-20T08:36:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 64, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2122828302121636286", "author_name": "Peter Tulip", "links": {"https://t.co/AA5HhdbeuI": "https://www.pew.org/en/research-and-analysis/articles/2026/11/16/raleigh-rents-fell-after-wave-of-new-townhouses-and-apartments", "https://t.co/T5cl4QlTtU": ""}, "author": "peter_tulip", "text": "A relaxation of zoning restrictions in Raleigh, North Carolina, led to a surge in construction, which reduced inflation-adjusted rents by 15% between 2022 and 2025.\nLow-income renters benefited the most.  \nhttps://t.co/AA5HhdbeuI https://t.co/T5cl4QlTtU"}, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123691845633077593", "url": "https://x.com/s8mb/status/2123691845633077593", "text": "The weekend starts here! https://t.co/CVv8AU36ad", "created_at": "2026-11-20T08:16:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 93, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXjeeeZX0AA9Cik.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXjeeeWWUAA5bfR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXjeeeZX0AA9Cik.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXjeeeWWUAA5bfR.jpg"}], "links": {"https://t.co/CVv8AU36ad": ""}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123850429268156667", "url": "https://x.com/s8mb/status/2123850429268156667", "text": "@salonium @owl_posting This was such a fascinating piece!", "created_at": "2026-11-20T18:46:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "salonium", "reply_to_id": "2123847479888073084", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123847479888073084", "author_handle": "salonium", "author_name": "Saloni", "text": "In case you hadn’t heard, the great @owl_posting is now a columnist for Works in Progress!\n\nHis first post is very fun. I’ve also often wondered how there’s money to be made in biotech investing.\n\nLots of data already is public and LLMs can now investigate a lot of it, but perhaps there is also a “game of increasingly subtle information extraction”, as Abhishaike says, and lots of additional context to be gleaned from talking to the right people.\nhttps://t.co/uYb98OcSvg", "links": {"https://t.co/uYb98OcSvg": "https://worksinprogress.co/issue/how-do-biotech-hedge-funds-make-money/"}, "media": [], "url": "https://x.com/salonium/status/2123847479888073084", "created_at": "Fri Nov 20 18:34:33 +0000 2026"}, "enriched": 3}, {"id": "2123850400956571678", "url": "https://x.com/s8mb/status/2123850400956571678", "text": "In case you hadn’t heard, the great @owl_posting is now a columnist for Works in Progress!\n\nHis first post is very fun. I’ve also often wondered how there’s money to be made in biotech investing.\n\nLots of data already is public and LLMs can now investigate a lot of it, but perhaps there is also a “game of increasingly subtle information extraction”, as Abhishaike says, and lots of additional context to be gleaned from talking to the right people.\nhttps://t.co/uYb98OcSvg", "created_at": "2026-11-20T18:46:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "rt_avatar": "https://pbs.twimg.com/profile_images/1633132972122447873/1sTPjj0y_normal.jpg", "rt_id": "2123847479888073084", "likes": 15, "retweets": 3, "media": [], "links": {"https://t.co/uYb98OcSvg": "https://worksinprogress.co/issue/how-do-biotech-hedge-funds-make-money/"}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123842517363769840", "url": "https://x.com/s8mb/status/2123842517363769840", "text": "Excellent post from @owl_posting in @WorksInProgMag  on biotech hedge fund edge. \n\nWhile there were serious shenanigans with expert networks back in the SAC era, they are now ubiquitously used and I think contribute limited \"alpha\" to funds who use them (though they are very helpful for orienting in a new space). Some examples of edge I have observed: \n\n- Private, ER-mediated 1:1 meetings with management (often at bank conferences): body language, tone, etc are real signals and I think represent real private information \n\n- Direct calls with investigators / PIs / people working on trials - this is still the wild west \n\n- Hardcore internal research / POV development. RA and Baker Brothers are unbelievably well resourced and have unique takes on TAs, modalities, and specific trials because they employ dozens of Phds to know everything (truly everything) about companies and specific tirals / molecules. I have seen this first hand and it's extremely impressive. \n\nI think some but not all of this last bucket will be democratized through AI, but a meaningful portion of hedge fund research looks something like \"let's go talk to someone who used to work with the person at the FDA who has to approve this trial design to get their vibe, understand their views on a specific approach, and get a sense for their level of conservatism etc.\" A real data problem! \n\nhttps://t.co/Vu98rPSYjO", "created_at": "2026-11-20T18:14:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "incredutility", "rt_author_name": "Charlie Petty", "rt_avatar": "https://pbs.twimg.com/profile_images/2047871111019569152/aDwVPD-N_normal.jpg", "rt_id": "2123829718004666817", "likes": 31, "retweets": 7, "media": [], "links": {"https://t.co/Vu98rPSYjO": "https://worksinprogress.co/issue/how-do-biotech-hedge-funds-make-money/"}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123898968530972956", "url": "https://x.com/s8mb/status/2123898968530972956", "text": "What do Claude’s constitution and Sam Kriss’s writing have in common? Very good Henry Oliver post.\n\nhttps://t.co/5mFYCVEMNN", "created_at": "2026-11-20T21:59:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {"https://t.co/5mFYCVEMNN": "https://www.commonreader.co.uk/p/does-claudes-constitution-mean-anything"}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123860575914516718", "url": "https://x.com/s8mb/status/2123860575914516718", "text": "This is a very good speech! https://t.co/B11c1IKTTf", "created_at": "2026-11-20T19:26:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 90, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl379JWoAAV9Cb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXl379JWoAAV9Cb.jpg"}], "links": {"https://t.co/B11c1IKTTf": ""}, "quoted": {"id": "2123801670236704818", "author_name": "Danny Kruger", "links": {"https://t.co/FfcbX8ukAY": "https://dannykruger.substack.com/p/choose-life-ai-and-the-future-of?utm_campaign=post&utm_medium=web"}, "author": "danny__kruger", "text": "Speech on AI yesterday https://t.co/FfcbX8ukAY"}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124099308618211457", "url": "https://x.com/s8mb/status/2124099308618211457", "text": "Like most mathematicians, I believed the Riemann Hypothesis to be completely out of reach at present (even with the best AI tools), because I expected it to require substantial theory-building, probably in arithmetic geometry. The kind of new theory-building that fills entire books, and that AI isn't so good at yet.\n\nMathematicians have a notion of how deep a problem is. A sufficiently deep problem is generally intractable until enough of the theory is in place. If difficult problems are like valuable mineral reserves buried miles underground, you first need to build the infrastructure to reach them.\n\nWhat Levent's proof seems to have done instead is something completely different. It takes an incredibly complicated tour through the infrastructure built for a hundred other mineral reserves, situated far from the destination, and somehow create a wormhole to the original destination.\n\nThis is not theory-building in the usual sense. It is something much weirder and more alien. The best human mathematicians know how to build theory, painstakingly, to reach a goal. But no human brain, on its own, is capable of creating a wormhole that requires a 25,000 page long tour through existing infrastructure with no obvious or realistic connection to the goal. But huge credit to Levent here: I think no current AI, on its own, is capable of this either.\n\nI had never worked on or thought too much about the Riemann Hypothesis: it seemed very far removed from my own area of number theory.\n\nBut the astonishing thing about Levent's claimed proof of RH (which I think has a very good chance of being correct) is that it uses a huge number of precisely the things that are central to my own corner of number theory:\n\n- Theta functions and other automorphic forms on unitary groups\n- Gan–Gross–Prasad period formulas\n- Relative trace formulas\n\nEtc., etc.\n\nA problem that I had always assumed would require new theories in arithmetic geometry may instead turn out to be tractable through an inhuman chain of existing (deep) results in higher-rank automorphic forms (and a lot else).", "created_at": "2026-11-21T11:15:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "ObhishekSaha", "rt_author_name": "Abhishek Saha", "rt_avatar": "https://pbs.twimg.com/profile_images/1741078924820410368/xS6ZT5Ca_normal.jpg", "rt_id": "2123861825750290445", "likes": 5865, "retweets": 593, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124091182451937791", "url": "https://x.com/s8mb/status/2124091182451937791", "text": "This is how you know Jack is best of the best. \n\ncc @Lethain https://t.co/B80d2Folkd", "created_at": "2026-11-21T10:42:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "chrisalbon", "rt_author_name": "Chris Albon", "rt_avatar": "https://pbs.twimg.com/profile_images/736992518110224384/fmqQxFEr_normal.jpg", "rt_id": "2123871150313005340", "likes": 179, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmBQ9mbsAAwR9N.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXmBW3RbcAAJP1h.jpg"}], "links": {"https://t.co/B80d2Folkd": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124216160866451713", "url": "https://x.com/s8mb/status/2124216160866451713", "text": "@JSalisburyJones Absolutely adorable photo.", "created_at": "2026-11-21T18:59:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": uthor_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 63, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2125113457628594293", "author_name": "David Singleton", "links": {"https://t.co/L9qaul3d4e": "https://about.fb.com/news/2026/11/muse-now-available-in-the-uk-muse-does-the-work-you-stay-in-control/"}, "author": "dps", "text": "Finally get to say this: @Muse is in the UK! I've been eager to bring this to my peeps back home for ages. Properly chuffed today 🇬🇧🇬🇧🇬🇧.\n\nEvery Muse runs on its own computer in the cloud. A separate security agent (Sentinel) checks its actions against permissions you've given. We built it this way because an agent that can do things for you needs more than instructions about what it should and should not do.\n\nYou can see what Muse does and decide what it remembers. More on how we built it and how to manage your controls: https://t.co/L9qaul3d4e"}, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125297919243014555", "url": "https://x.com/s8mb/status/2125297919243014555", "text": "Come and make videos with us!", "created_at": "2026-11-24T18:38:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 20, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2125257174343356771", "author_name": "Works in Progress", "links": {"https://t.co/So47k5gRE9": "https://body-next-64832997.figma.site/"}, "author": "WorksInProgMag", "text": "Works in Progress is hiring! \n\nWe’re looking for a freelance YouTube Producer to help us scale our long-form video content. Candidates must be based in NYC.\n\nhttps://t.co/So47k5gRE9"}, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125627536931467675", "url": "https://x.com/s8mb/status/2125627536931467675", "text": "We've already run one piece I thought was great, about the first MMORPG. I want more!  https://t.co/vdMlN9MhWB", "created_at": "2026-11-25T16:27:51+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "reply_to_id": "2125617611169767553", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/vdMlN9MhWB": "https://worksinprogress.co/issue/virtual-worlds/"}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125617611169767553", "author_handle": "s8mb", "author_name": "Sam Bowman", "text": "I'd love some pieces on video games at Works in Progress. They're so important culturally and commercially, but writing about software is very difficult to do well (it's a big challenge and makes AI writing hard too). Pitch us below if you have ideas.\n\nhttps://t.co/alQO1MZ6dJ", "links": {"https://t.co/alQO1MZ6dJ": "https://worksinprogress.co/issue/how-to-write-for-works-in-progress/"}, "media": [], "url": "https://x.com/s8mb/status/2125617611169767553", "created_at": "Wed Nov 25 15:48:25 +0000 2026"}, "enriched": 3}, {"id": "2125625795276394999", "url": "https://x.com/s8mb/status/2125625795276394999", "text": "@lcthomas1212 I think without physicality there's not much you can say that makes the process of development feel tangible to people. When you read about, say, making an atomic bomb you can describe the physical processes in ways that readers can visualise and imagine. Not possible with software.", "created_at": "2026-11-25T16:20:56+00:00", "author_ s/"}, "media": [], "url": "https://x.com/s8mb/status/2125627536931467675", "created_at": "Wed Nov 25 16:27:51 +0000 2026"}], "enriched": 3}, {"id": "2125599531970564520", "url": "https://x.com/s8mb/status/2125599531970564520", "text": "@SCP_Hughes Some great shots here! https://t.co/vR2hz87vpN", "created_at": "2026-11-25T14:36:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "reply_to_id": "2125594429092245787", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 32, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX-lgREXgAAv6eK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-lgREXgAAv6eK.jpg"}], "links": {"https://t.co/vR2hz87vpN": ""}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125594429092245787", "author_handle": "SCP_Hughes", "author_name": "Samuel Hughes", "text": "Buildings by the contemporary Pakistani architect Kamil Khan Mumtaz. When my colleague Ben first sent me some grainy pictures of Mumutaz’s work five years ago, I wondered if he might be the best architect in the world. But I couldn’t find any other images of his work.\n\nhttps://t.co/8RkAdoyDWn\n\nThen last year, I met Mumtaz’s assistant Sohaib Ahmed at a conference. I implored Sohaib to send us more pictures, and with Mutmaz’s support, he prepared a portfolio. Very few of these images have ever been seen before outside Pakistan.\n\nMumtaz was educated at the Architectural Association in London in the 1960s. After returning to Pakistan, he initially worked as a modernist, though one with a special interest in local context. But he was haunted by a ‘growing, nagging fear that I wasn’t communicating with my audience’. In 1980, he adopted a radically different approach, working to revive Pakistan’s own architectural traditions. He has continued ever since, and in Pakistan his work has been received with warmth and admiration.\n\nTraditional architecture often suffers from shortages of skilled craftspeople. This is also a problem in Pakistan, but less so, because later industrialisation meant that the last premodern traditions were still persisting when Mumtaz started work. ‘Immediately, [I came] into contact with very small remnants of these families, hereditary craftsmen’, Mumtaz remembered in an interview with the historian Chris Moffat.\n\nMumtaz’s practice has both drawn on these traditions and supported their development, so that it now features a standard of craftsmanship that virtually no Western work today can match.\n\nWe are proud that Mumtaz has allowed Works in Progress to showcase his work.", "links": {"https://t.co/8RkAdoyDWn": "https://worksinprogress.co/issue/the-greatest-architect-youve-never-heard-of-is-in-pakistan/", "https://t.co/JEjtVMYOBb": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX-e5UBXoAA2R_x.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-folEWAAEsAvo.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-fsUfWgAAfRji.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f1A_XEAE5gZ6.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f4c6WcAA5r5k.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f5qpXEAE8qXP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f6g1XQAETdtR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f7WkXcAAY1Wp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f8Z_XIAA7xT-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f9O_WsAEn5oP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f-MZXEAAASMI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-f_a4WAAARLcD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-gAXDWMAAqohc.jpg"}, {"type": "photo", "url"  Mutmaz’s support, he prepared a portfolio. Very few of these images have ever been seen before outside Pakistan.\n\nMumtaz was educated at the Architectural Association in London in the 1960s. After returning to Pakistan, he initially worked as a modernist, though one with a special interest in local context. But he was haunted by a ‘growing, nagging fear that I wasn’t communicating with my audience’. In 1980, he adopted a radically different approach, working to revive Pakistan’s own architectural traditions. He has continued ever since, and in Pakistan his work has been received with warmth and admiration.\n\nTraditional architecture often suffers from shortages of skilled craftspeople. This is also a problem in Pakistan, but less so, because later industrialisation meant that the last premodern traditions were still persisting when Mumtaz started work. ‘Immediately, [I came] into contact with very small remnants of these families, hereditary craftsmen’, Mumtaz remembered in an interview with the historian Chris Moffat.\n\nMumtaz’s practice has both drawn on these traditions and supported their development, so that it now features a standard of craftsmanship that virtually no Western work today can match.\n\nWe are proud that Mumtaz has allowed Works in Progress to showcase his work.", "created_at": "2026-11-25T19:48:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "rt_avatar": "https://pbs.twimg.com/profile_images/1881805141059211264/D22ZUEJF_normal.jpg", "rt_id": "2125594429092245787", "likes": 1163, "retweets": 338, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX-e5UBXoAA2R_x.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-folEWAAEsAvo.jpg"}, {"type": "photo", "url": "https://pbs.twimg.co 8mb Brilliant! Just purchased for my inlaws 🖤", "links": {}, "media": [], "url": "https://x.com/benspringwater/status/2125700960635044098", "created_at": "Wed Nov 25 21:19:37 +0000 2026"}, "enriched": 3}, {"id": "2125701325212225854", "url": "https://x.com/s8mb/status/2125701325212225854", "text": "Kamil Sahab is a genius. He designed a palatial residence-cum-arts-school of a friend's dad. Spread over 30+ kanals without a single brick or iota of cement, it has glorious traditional courtyards, jharokay, integrated vegetation, intricate artworks, and fascinating domes. I adore beautiful architecture - trust me when I say it is the most exquisite building I've ever seen in my life. Not even the most grand French châteaus stand a chance in comparison.", "created_at": "2026-11-25T21:21:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "asadfacts", "rt_author_name": "Asad", "rt_avatar": "https://pbs.twimg.com/profile_images/2100598059688411137/dFkIQGQP_normal.jpg", "rt_id": "2125697651010400319", "likes": 82, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_-tQ_aEAAJH9R.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_-t-3agAAYp_Z.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_-utXbUAAH-tI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_-vTLbQAAzAAt.jpg"}], "links": {"https://t.co/0iYSOz1tRR": ""}, "quoted": null, "fetched_at": "2026-11-25T23:37:56.974457+00:00", "enriched": 3}, {"id": "2125991067505848713", "url": "https://x.com/s8mb/status/2125991067505848713", "text": "Pretty incredible that the the \"Renewable Transport Fuels Obligation\" adds ~£90 per household a year to petrol prices.", "created_at": "2026-11-26T16:32:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2125989345790193967", "author_name": "Michael Hill", "links": {"https://t.co/daeGmIZJDs": "https://britishprogress.org/reports/cooking-the-books-reforming-renewable-transport-fu", "https://t.co/Syxvq5N89c": ""}, "author": "Michael_J_Hil", "text": "Did you know that, this year, the UK has imported 1 million litres of “used cooking oil” from Taliban-run Afghanistan? \n\nAnd, furthermore, we are only making these imports because of an outdated policy that requires fuel suppliers to blend “low carbon” fuels into petrol and diesel?\n\nThe Renewable Transport Fuels Obligation (RTFO) adds more than £2 billion a year to pump prices. \n\nBut it turns out that it is a scam. There is mounting evidence that many of the supposedly “renewable” fuels are not what they say they are. There is no way of verifying that imported waste oil is in fact waste oil – some of them could even be adding to global carbon emissions, paid for by British households. We are playing whack-a-mole moving from one dodgy fuel to another. It needs to stop. \n\nIn a new paper for @BritishProgress, @taraprinja @patrickcook81, @liliaamesie & I make the case for removing or deeply reforming the RTFO, and propose that the money be spent instead on supporting electric vehicle infrastructure. We look at four alternatives – any of which would be better than the current system.\n\nThe RTFO was introduced before electric vehicles were a thing, and when the electricity grid was far less green. But today, the RTFO is too often a subsidy to dodgy foreign chains we’d best keeping well away from. Investment in UK EV infrastructure would keep this spending in the UK and actually help tackle climate change. \n\nRTFO needs to GTFO!\n\nRead the full paper here:  https://t.co/daeGmIZJDs \n\nWith thanks to @Sam_Dumitriu, @watt_direction, @matthewgstubbs, @pdmsero & @dc_lawrence for providing review & comment!"}, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125956533070553447", "url": "https://x.com/s8mb/status/2125956533070553447", "text": "This is bad framing that borders on misinformation. The paper was already corrected in 2024 - a tacit acknowledgement it did not meet academic standards. Once again, a university is declaring this paper does not need *further* corrections or retractions, not \"clearing\" Arday. https://t.co/v8HGQn9mAn", "created_at": "2026-11-26T14:15:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "helenlewis", "rt_author_name": "Helen Lewis", "rt_avatar": "https://pbs.twimg.com/profile_images/1610618778743627782/_LMAdNKa_normal.jpg", "rt_id": "2125928953764339896", "likes": 1082, "retweets": 181, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYDQ0jkWYAAEv8P.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HYDQ0jkWYAAEv8P.jpg"}], "links": {"https://t.co/v8HGQn9mAn": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125922690251059235", "url": "https://x.com/s8mb/status/2125922690251059235", "text": "@mseebach Broadgate is open air though. Not cosy.", "created_at": "2026-11-26T12:00:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "mseebach", "reply_to_id": "2125915527511965779", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "202 ": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "Birdyword", "rt_author_name": "Mike Bird", "rt_avatar": "https://pbs.twimg.com/profile_images/2112608958162632704/tRPdOdVE_normal.jpg", "rt_id": "2125789472449347774", "likes": 47, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123883559496671664", "url": "https://x.com/random_walker/status/2123883559496671664", "text": "@yearning_slav @KLdivergence https://t.co/w6hF8pWlud", "created_at": "2026-11-20T20:57:55+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "yearning_slav", "reply_to_id": "2123880878736617825", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/w6hF8pWlud": "https://x.com/KLdivergence/status/1653843497932267520"}, "quoted": {"id": "1653843497932267520", "author_name": "Kristian Lum", "links": {}, "author": "KLdivergence", "text": "There’s one existential risk I’m certain LLMs pose and that’s to the credibility of the field of FAccT / Ethical AI if we keep pushing the snake oil narrative about them."}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "parent": {"id": "2123880878736617825", "author_handle": "yearning_slav", "author_name": "Sasha", "text": "@random_walker @KLdivergence Do you have a link to that thread? I'm v curious!", "links": {}, "media": [], "url": "https://x.com/yearning_slav/status/2123880878736617825", "created_at": "Fri Nov 20 20:47:15 +0000 2026"}, "enriched": 3}, {"id": "2123878016090849712", "url": "https://x.com/random_walker/status/2123878016090849712", "text": "Sometimes I think about a counterfactual world in which the corner of the AI ethics community I used to be part of hadn't dogmatically rejected LLMs as unworthy of constructive engagement—a stance that seemed largely driven by contempt for Effective Altruism and its entanglement with AI. In that world, more people holding that community's values would have joined the major AI companies earlier. Maybe that would have impacted model development, maybe not. Without a doubt, though, as of yesterday, there would be a lot more people with meaningful amounts of money to fund the causes they support, rather than all of it being dumped into EA-forward causes like I suspect is about to happen.", "created_at": "2026-11-20T20:35:53+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "KLdivergence", "rt_author_name": "Kristian Lum", "rt_avatar": "https://pbs.twimg.com/profile_images/1769872870350446593/UAHbjbsV_normal.jpg", "rt_id": "2123850994962546928", "likes": 106, "retweets": 14, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123875892824863137", "url": "https://x.com/random_walker/status/2123875892824863137", "text": "@KLdivergence If only they'd listened when you wrote that prescient thread in 2023!", "created_at": "2026-11-20T20:27:27+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "KLdivergence", "reply_to_id": "2123850994962546928", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "parent": {"id": "2123850994962546928", "author_handle": "KLdivergence", "author_name": "Kristian Lum", "text": "Sometimes I think about a counterfactual world in which the corner of the AI ethics community I used to be part of hadn't dogmatically rejected LLMs as unworthy of constructive engagement—a stance that seemed largely driven by contempt for Effective Altruism and its entanglement with AI. In that world, more people holding that community's values would have joined the major AI companies earlier. Maybe that would have impacted model development, maybe not. Without a doubt, though, as of yesterday, there would be a lot more people with meaningful amounts of money to fund the causes they support, rather than all of it being dumped into EA-forward causes like I suspect is about to happen.", "links": {}, "media": [], "url": "https://x.com/KLdivergence/status/2123850994962546928", "created_at": "Fri Nov 20 18:48:31 +0000 2026"}, "enriched": 3}, {"id": "2123869355431661866", "url": "https://x.com/random_walker/status/2123869355431661866", "text": "Reminder: racing to self-improve the verifiable subset of capabilities, which is what AI companies are currently doing, _decreases_ the window of time that they have to convert into sustainable businesses and do the boring work of turning value creation into value capture.\n\n(Of course, their bet is that progress in verifiable tasks will somehow yield progress on unverifiable tasks. We'll see.)", "created_at": "2026-11-20T20:01:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 47, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl-g_tWYAAUq4N.jpg"}], "links": {"https://t.co/dfuf7P7jeM": ""}, "quoted": {"id": "2117246718219612594", "author_name": "Arvind Narayanan", "links": {"https://t.co/ZwebetjZ4n": "https://www.normaltech.ai/", "https://t.co/ZA5TBDypfl": "https://www.normaltech.ai/p/what-will-be-left-for-us-to-work", "https://t.co/1rWunFZOfo": "https://www.noahpinion.blog/p/wheres-the-intelligence-explosion", "https://t.co/WbhsVQt2kz": "https://www.normaltech.ai/p/up-the-stack-how-ais-escape-from", "https://t.co/3uaDBQZjeH": ""}, "author": "random_walker", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”"}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124112620559204576", "url": "https://x.com/random_walker/status/2124112620559204576", "text": "@jeremyphoward @joshua_saxe @KLdivergence Yes, we were all in agreement back then, too 😀 https://t.co/GgSsD4NsiB", "created_at": "2026-11-21T12:08:07+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "jeremyphoward", "reply_to_id": "2124031610312118325", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/GgSsD4NsiB": "https://x.com/jeremyphoward/status/1654363599610183682?a=As24CaLOb7jY0fg6Glg&s=20"}, "quoted": {"id": "1654363599610183682", "author_name": "Jeremy Howard", "links": {"https://t.co/lK9qYzCXaE": "https://x.com/KLdivergence/status/1653843497932267520"}, "author": "jeremyphoward", "text": "@npparikh @NLPurr @rajiinio As it happens I discussed just this issue with Arvind a few days ago. @random_walker I'm guessing that you'd probably be in agreement with the point of view here?:\nhttps://t.co/lK9qYzCXaE"}, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2124031610312118325", "author_handle": "jeremyphoward", "author_name": "Jeremy Howard", "text": "@joshua_saxe @random_walker @KLdivergence I'm embarrassed to say I don't remember the thread (got a link?) but I strongly agree with the point!", "links": {}, "media": [], "url": "https://x.com/jeremyphoward/status/2124031610312118325", "created_at": "Sat Nov 21 06:46:13 +0000 2026"}, "enriched": 3}, {"id": "2123918994918801815", "url": "https://x.com/random_walker/status/2123918994918801815", "text": "I largely subscribe to the views on AI safety espoused by @random_walker. \n\nCapability, Power and Real-world impact are all different.\n\nThe Reimann Hypothesis being proven doesn't cause me to update my priors on frontier AI's Capabilities and doesn't cause me to update my priors on the transfer rate between Capability and Power.", "created_at": "2026-11-20T23:18:43+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sushbhask", "rt_author_name": "Sushanth Bhaskarabhatla", "rt_avatar": "https://pbs.twimg.com/profile_images/2103184864883494912/_qObMaIl_normal.jpg", "rt_id": "2123918235267657821", "likes": 7, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmsHI3aEAA4K58.jpg"}], "links": {"https://t.co/sSv8I2WtUR": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124156018900779457", "url": "https://x.com/random_walker/status/2124156018900779457", "text": "New from me: The most important graphs in AI are wrong. Specifically, measures of the length of task AIs can autonomously accomplish are dramatically different than real-world data from inside OpenAI and Google. 🧵 \nhttps://t.co/IbKK0ybQjV https://t.co/MJYRscOLhG", "created_at": "2026-11-21T15:00:34+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2123944723492782408", "likes": 447, "retweets": 76, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm7YNHbAAAMNRP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXm7YNHbAAAMNRP.jpg"}], "links": {"https://t.co/IbKK0ybQjV": "https://www.rameznaam.com/p/the-most-important-charts-in-ai-are", "https://t.co/MJYRscOLhG": ""}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "thread": [{"id": "2123944726135259285", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "2. AI is amazing &amp; improving rapidly. But offline metrics and forecasts claim rapid takeoff in the length of task AI can complete that aren't backed by real-world observations. Here's a recreation of @ben_j_todd's recent chart vs internal OpenAI &amp; Google data. https://t.co/XutaSVOwOE", "links": {"https://t.co/XutaSVOwOE": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm8A1fa4AAKsy5.jpg"}], "url": "https://x.com/ramez/status/2123944726135259285", "created_at": "Sat Nov 21 01:00:58 +0000 2026"}, {"id": "2123944728588931206", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "3. You can see @ben_j_todd's original post here. Compare to the chart in the previous tweet. https://t.co/y67PA8a6iw https://t.co/cv2EdHTycd", "links": {"https://t.co/y67PA8a6iw": "https://x.com/ben_j_todd/status/2122318704260403562", "https://t.co/cv2EdHTycd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm8s8ab0AAHF2I.jpg"}], "url": "https://x.com/ramez/status/2123944728588931206", "created_at": "Sat Nov 21 01:00:58 +0000 2026"}, {"id": "2123944731487162843", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "4. The original AI 2027 forecast suffers from the same problem. The fast takeoff expected doesn't match what we actually see in the real world. https://t.co/rXGcwr1Oqf", "links": {"https://t.co/rXGcwr1Oqf": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm9vGyb0AAvq1l.jpg"}], "url": "https://x.com/ramez/status/2123944731487162843", "created_at": "Sat Nov 21 01:00:59 +0000 2026"}, {"id": "2123944734611865663", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "5. Not only is there a ~100-fold gap in task lengths between forecasts and the real world: The gap is widening over time. At this pace, it will grow by ~30x over 12 months, to become a ~3,000x gap in estimated vs real task lengths. https://t.co/EszYHxQgqm", "links": {"https://t.co/EszYHxQgqm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm96AAbkAASCGv.jpg"}], "url": "https://x.com/ramez/status/2123944734611865663", "created_at": "Sat Nov 21 01:01:00 +0000 2026"}, {"id": "2123944737354973309", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "6. With AI 2027, we see the same pattern of the gap vs real world measurements growing ever wider, again on a roughly 25x annualized pace. https://t.co/jlYADEq88Z", "links": {"https://t.co/jlYADEq88Z": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-Ep3akAASu0x.jpg"}], "url": "https://x.com/ramez/status/2123944737354973309", "created_at": "Sat No
