hen. https://t.co/MTuvKslcyZ", "created_at": "2026-11-20T17:26:13+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "timothyhliu5", "rt_author_name": "Timothy Liu", "rt_avatar": "https://pbs.twimg.com/profile_images/1506102655642312704/wnHfupGM_normal.jpg", "rt_id": "2123801908292837541", "likes": 660, "retweets": 85, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlCerHXQAE4NyD.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlCgDGWkAArKTT.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlCerHXQAE4NyD.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlCgDGWkAArKTT.jpg"}], "links": {"https://t.co/MTuvKslcyZ": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123829791346344377", "url": "https://x.com/NateWitkin/status/2123829791346344377", "text": "Today in AI science:\n* Generalized Riemann Hypothesis: https://t.co/M9T9rdQtFb\n* unforced euler https://t.co/P4IRANZU1v\n* unforced Navier-Stokes blowup https://t.co/qJSvtwRt72", "created_at": "2026-11-20T17:24:15+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "roelof_vandijk", "rt_author_name": "Roelof van Dijk", "rt_avatar": "https://pbs.twimg.com/profile_images/1320292634116620288/SGXXpbB6_normal.jpg", "rt_id": "2123784330640310373", "likes": 1569, "retweets": 189, "media": [], "links": {"https://t.co/M9T9rdQtFb": "https://alpo.ge/remark.pdf", "https://t.co/P4IRANZU1v": "https://cims.nyu.edu/~tristanb/cc.pdf", "https://t.co/qJSvtwRt72": "https://github.com/tristanbuckmaster/navier-stokes/"}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123828303232450872", "url": "https://x.com/NateWitkin/status/2123828303232450872", "text": "Claude solved the Riemann hypothesis and $ANT stock is down 10%. Seems the market is not \"RSI-pilled\" and believes in 'AI as normal technology'. https://t.co/jmKDgyNRxd", "created_at": "2026-11-20T17:18:20+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "nabeelqu", "rt_author_name": "Nabeel S. Qureshi", "rt_avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "rt_id": "2123806732027924920", "likes": 513, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlGxaKXsAAl812.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlGxaKXsAAl812.png"}], "links": {"https://t.co/jmKDgyNRxd": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123826589901414476", "url": "https://x.com/NateWitkin/status/2123826589901414476", "text": "BREAKING: A mathematician at Anthropic claims to have used the company's AI to solve the Riemann hypothesis, the most notorious open problem in all of math\n\nhttps://t.co/nEXAyIkvSt", "created_at": "2026-11-20T17:11:32+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sciam", "rt_author_name": "Scientific American", "rt_avatar": "https://pbs.twimg.com/profile_images/1704126231371771905/McZuDEgT_normal.jpg", "rt_id": "2123782587235655707", "likes": 10817, "retweets": 2585, "media": [], "links": {"https://t.co/nEXAyIkvSt": "https://sciam.com/article/anthropic-mathematician-claims-to-prove-riemann-hypothesis-most-famous-problem-in-all-of-math/?utm_source=twitter&utm_medium=social&utm_campaign=buffer"}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123840244889907314", "url": "https://x.com/NateWitkin/status/2123840244889907314", "text": "Would've been hard to invent a more elegant microcosm of the clashing worldviews of Silicon Valley and Wall Street than the Riemann Hypothesis getting solved just as the AI trade is beginning to falter.\n\nCutting deep deductive pathways through the jungles of well-defined theoretical and digital systems is great. If only those systems were more akin to the ill-defined empirico-inductive ones in which we actually live.", "created_at": "2026-11-20T18:05:48+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123892401320173892", "url": "https://x.com/NateWitkin/status/2123892401320173892", "text": "I view people who say \"AI did X in math, which means it will do Y and Z\" the same way I view people who ask why we haven't solved certain problems when we've already gone to the moon", "created_at": "2026-11-20T21:33:03+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "nominalthoughts", "rt_author_name": "Jason Harrison", "rt_avatar": "https://pbs.twimg.com/profile_images/2066167242048335872/OHKfMyN6_normal.jpg", "rt_id": "2123882171270357007", "likes": 22, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123887473759867213", "url": "https://x.com/NateWitkin/status/2123887473759867213", "text": "Couple big questions I have for mathematicians:\n\n1) Do you suspect that there are alternative NS / Riemann proofs that are superior in some sense to those models are producing perhaps because they require more novel kinds of theory-building?\n\n2) Is AI revealing that solving at least some major problems is only a good proxy for mathematical progress insofar as humans brains are the ones doing the solving?\n\nIn other words, could AI solutions amount to a kind of reward-hacking in the sense that they generate these weird, sprawling solutions that lack many of the properties human mathematicians are interested in? \n\nMight those solutions be very informative and interesting nonetheless, esp. over the long term, or is there a real chance they amount to kind of a shrug, either because we never understand them, or because once we do, we realize that pure math is this much uglier, kludgier thing than we thought, only the more elegant or practically useful corners of we're really interested in?", "created_at": "2026-11-20T21:13:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123861825750290445", "author_name": "Abhishek Saha", "links": {}, "author": "ObhishekSaha", "text": "Like most mathematicians, I believed the Riemann Hypothesis to be completely out of reach at present (even with the best AI tools), because I expected it to require substantial theory-building, probably in arithmetic geometry. The kind of new theory-building that fills entire books, and that AI isn't so good at yet.\n\nMathematicians have a notion of how deep a problem is. A sufficiently deep problem is generally intractable until enough of the theory is in place. If difficult problems are like valuable mineral reserves buried miles underground, you first need to build the infrastructure to reach them.\n\nWhat Levent's proof seems to have done instead is something completely different. It takes an incredibly complicated tour through the infrastructure built for a hundred other mineral reserves, situated far from the destination, and somehow create a wormhole to the original destination.\n\nThis is not theory-building in the usual sense. It is something much weirder and more alien. The best human mathematicians know how to build theory, painstakingly, to reach a goal. But no human brain, on its own, is capable of creating a wormhole that requires a 25,000 page long tour through existing infrastructure with no obvious or realistic connection to the goal. But huge credit to Levent here: I think no current AI, on its own, is capable of this either.\n\nI had never worked on or thought too much about the Riemann Hypothesis: it seemed very far removed from my own area of number theory.\n\nBut the astonishing thing about Levent's claimed proof of RH (which I think has a very good chance of being correct) is that it uses a huge number of precisely the things that are central to my own corner of number theory:\n\n- Theta functions and other automorphic forms on unitary groups\n- Gan–Gross–Prasad period formulas\n- Relative trace formulas\n\nEtc., etc.\n\nA problem that I had always assumed would require new theories in arithmetic geometry may instead turn out to be tractable through an inhuman chain of existing (deep) results in higher-rank automorphic forms (and a lot else)."}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123860743766298786", "url": "https://x.com/NateWitkin/status/2123860743766298786", "text": "@theojaffee \"Easier\" is too loaded because it conflates easy for humans with easy for AIs. But something like this should be your base case I think.\n\nOne heuristic that may be helpful is the question: how easy is it to take other fields and make them as 1) verifiable / objective / well-defined and 2) non-empirical / simulatable / solvable in silico as math? This would amount to cutting out a lot of the major bottlenecks to AI progress in research.\n\nOne reason to think this is really hard is that every field has been trying to do this since its inception. That is, every field has at one or another point attempted to reduce itself to theoretical formalisms (i.e. pure theories of biology, econ, etc.), and for the most part either failed, or succeeded only narrowly, and double-downed on empirical, experimental, or informal methods as a partial result.\n\nIMO that very strongly implies we should see math as a special case, while acknowledging that AI will probably speed up our efforts to make other fields more math-like due to creating new incentives to come up with hill-climbable metrics. Your base case should be that this will be a very slow and inconsistent process, though.\n\nhttps://t.co/Z7wO5fcVYk", "created_at": "2026-11-20T19:27:15+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NateWitkin", "rt_author_name": "Nathan Witkin", "rt_avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "rt_id": "2123860718516678881", "likes": 8, "retweets": 2, "media": [], "links": {"https://t.co/Z7wO5fcVYk": "https://x.com/NateWitkin/status/2123840244889907314?a=AWsTOP5t_JQVHBFVGpY&s=20"}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "linked": [{"id": "2123840244889907314", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": "Would've been hard to invent a more elegant microcosm of the clashing worldviews of Silicon Valley and Wall Street than the Riemann Hypothesis getting solved just as the AI trade is beginning to falter.\n\nCutting deep deductive pathways through the jungles of well-defined theoretical and digital systems is great. If only those systems were more akin to the ill-defined empirico-inductive ones in which we actually live.", "links": {}, "media": [], "url": "https://x.com/NateWitkin/status/2123840244889907314", "created_at": "Fri Nov 20 18:05:48 +0000 2026"}], "enriched": 3}, {"id": "2123860718516678881", "url": "https://x.com/NateWitkin/status/2123860718516678881", "text": "@theojaffee \"Easier\" is too loaded because it conflates easy for humans with easy for AIs. But something like this should be your base case I think.\n\nOne heuristic that may be helpful is the question: how easy is it to take other fields and make them as 1) verifiable / objective / well-defined and 2) non-empirical / simulatable / solvable in silico as math? This would amount to cutting out a lot of the major bottlenecks to AI progress in research.\n\nOne reason to think this is really hard is that every field has been trying to do this since its inception. That is, every field has at one or another point attempted to reduce itself to theoretical formalisms (i.e. pure theories of biology, econ, etc.), and for the most part either failed, or succeeded only narrowly, and double-downed on empirical, experimental, or informal methods as a partial result.\n\nIMO that very strongly implies we should see math as a special case, while acknowledging that AI will probably speed up our efforts to make other fields more math-like due to creating new incentives to come up with hill-climbable metrics. Your base case should be that this will be a very slow and inconsistent process, though.\n\nhttps://t.co/Z7wO5fcVYk", "created_at": "2026-11-20T19:27:09+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "theojaffee", "reply_to_id": "2123851368951910847", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 2, "media": [], "links": {"https://t.co/Z7wO5fcVYk": "https://x.com/NateWitkin/status/2123840244889907314?a=AWsTOP5t_JQVHBFVGpY&s=20"}, "quoted": {"id": "2123840244889907314", "author_name": "Nathan Witkin", "links": {}, "author": "NateWitkin", "text": "Would've been hard to invent a more elegant microcosm of the clashing worldviews of Silicon Valley and Wall Street than the Riemann Hypothesis getting solved just as the AI trade is beginning to falter.\n\nCutting deep deductive pathways through the jungles of well-defined theoretical and digital systems is great. If only those systems were more akin to the ill-defined empirico-inductive ones in which we actually live."}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "parent": {"id": "2123851368951910847", "author_handle": "theojaffee", "author_name": "Theo Jaffee", "text": "Surely we could just as easily conclude \"the Riemann hypothesis is easier than we thought\" rather than \"AIs are on the brink of being wildly superhuman at ~everything\"? It seems like we have no idea how easy or hard anything in mathematics actually is", "links": {}, "media": [], "url": "https://x.com/theojaffee/status/2123851368951910847", "created_at": "Fri Nov 20 18:50:00 +0000 2026"}, "enriched": 3}, {"id": "2123903791850262762", "url": "https://x.com/NateWitkin/status/2123903791850262762", "text": "This, from @JakeASteckler, is really a must read, esp. given recent discourse growing out of @dwarkesh_sp's podcast episode with @paulfchristiano.\n\nhttps://t.co/DxOE41HwaZ\n\nWhy is it that we never seem to get this level of detail from folks whose whole job it is to forecast AI risk?", "created_at": "2026-11-20T22:18:18+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 72, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmefcQXQAAOEsX.png"}], "links": {"https://t.co/DxOE41HwaZ": "https://autorotation.substack.com/p/a-skeptical-take-on-ai-takeover-scenarios", "https://t.co/K6caAQAXXZ": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123848747318956336", "url": "https://x.com/NateWitkin/status/2123848747318956336", "text": "@QiaochuYuan You should review this one, lots to say here:\n\nhttps://t.co/N9rqdG0jpF", "created_at": "2026-11-20T18:39:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "QiaochuYuan", "reply_to_id": "2123817228625920348", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/N9rqdG0jpF": "https://x.com/NateWitkin/status/2123840244889907314?a=NZUNHQcFzU58w7aGgGw&s=20"}, "quoted": {"id": "2123840244889907314", "author_name": "Nathan Witkin", "links": {}, "author": "NateWitkin", "text": "Would've been hard to invent a more elegant microcosm of the clashing worldviews of Silicon Valley and Wall Street than the Riemann Hypothesis getting solved just as the AI trade is beginning to falter.\n\nCutting deep deductive pathways through the jungles of well-defined theoretical and digital systems is great. If only those systems were more akin to the ill-defined empirico-inductive ones in which we actually live."}, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123817228625920348", "author_handle": "QiaochuYuan", "author_name": "QC", "text": "books take too long to read so i’m reviewing tweets instead, something which feels obvious in retrospect but which i don’t think i’ve seen anyone else do\n\nhttps://t.co/qNAugf4NcC https://t.co/X71NBGIfrD", "links": {"https://t.co/qNAugf4NcC": "https://qchu.substack.com/p/tweet-reviews"}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlQbYeaAAEJ4So.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlQbYeaAAEJ4So.jpg"}], "url": "https://x.com/QiaochuYuan/status/2123817228625920348", "created_at": "Fri Nov 20 16:34:20 +0000 2026"}, "enriched": 3}, {"id": "2124200938751623568", "url": "https://x.com/NateWitkin/status/2124200938751623568", "text": "@tszzl @thinkingshivers Better assessment is that AI has succeeded dramatically in \n\n1) verifiable domains with rapid / cheap / digital learning loops;\n\n2) unverifiable domains with rapid / cheap / digital learning loops AND forgiving, highly disjunctive success conditions (many, many ways to make a halfway-decent music video).\n\nThe long road ahead is concentrated in a a mix of tasks with expensive, slow, supra-digital learning loops (incl. some verifiable ones) and success conditions that are simultaneously strict, ill-defined, and subject to rapid change (the last one is generally underestimated; consider how the meaning of \"good\" research or \"good\" fiction changes year-to-year).\n\nTo see why the nature of the learning loops matters as much, if not more than the verifiability of the success / reward condition, consider that \"amount of dollars in bank account\" and \"amount of years lived\" are both verifiable, and then meditate on what it would take to design an RL loop for learning to maximize either.", "created_at": "2026-11-21T17:59:04+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "tszzl", "reply_to_id": "2123994543733559377", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "parent": {"id": "2123994543733559377", "author_handle": "tszzl", "author_name": "roon", "text": "@thinkingshivers since has making great music videos been “verifiable”?", "links": {}, "media": [], "url": "https://x.com/tszzl/status/2123994543733559377", "created_at": "Sat Nov 21 04:18:55 +0000 2026"}, "enriched": 3}, {"id": "2124176008777519427", "url": "https://x.com/NateWitkin/status/2124176008777519427", "text": "Something I’d like to understand, as a non-mathematician:\n\nTo what extent do the recent AI-driven proofs of Millennium Prize Problems apply known techniques at enormous scale, and to what extent do they use new ideas that most mathematicians would find surprising?", "created_at": "2026-11-21T16:20:00+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "arindube", "rt_author_name": "Arin Dube", "rt_avatar": "https://pbs.twimg.com/profile_images/1701811151288291328/WyCTYG3R_normal.jpg", "rt_id": "2123999274773995865", "likes": 56, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "enriched": 3}, {"id": "2124173490114687138", "url": "https://x.com/NateWitkin/status/2124173490114687138", "text": "Friday's news cycle really was almost too perfect to believe.\n\nFor months, I (and so many others) have been pointing to this notable divergence between accelerating model capability growth and slowing AI spending/rising data center costs.\n\nYou really cannot get a cleaner example of the principle that \"AI capabilities ≠ real-world AI consequences\" than getting news of a proof of the Riemann Hypothesis—which people have for years cited as a sign of takeoff, AGI, the beginning of the productivity boom that takes us into the transhumanist Valhalla, etc etc—at the same time that the Nasdaq absolutely vomits up all over itself as the AI Trade dies.", "created_at": "2026-11-21T16:09:59+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "rt_avatar": "https://pbs.twimg.com/profile_images/2093501497673674753/OrmD5Wp3_normal.jpg", "rt_id": "2124156773560902109", "likes": 614, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "enriched": 3}, {"id": "2124172600943501346", "url": "https://x.com/NateWitkin/status/2124172600943501346", "text": "Very interesting data-driven pushback against some of the more aggressive forecasts of imminent recursive self-improvement 👇", "created_at": "2026-11-21T16:06:27+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/2122086703057793024/Fzgv0Hss_normal.jpg", "rt_id": "2124072874881565037", "likes": 12, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "thread": [], "enriched": 3}, {"id": "2124170697572499679", "url": "https://x.com/NateWitkin/status/2124170697572499679", "text": "New from me: The most important graphs in AI are wrong. Specifically, measures of the length of task AIs can autonomously accomplish are dramatically different than real-world data from inside OpenAI and Google. 🧵 \nhttps://t.co/IbKK0ybQjV https://t.co/MJYRscOLhG", "created_at": "2026-11-21T15:58:54+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2123944723492782408", "likes": 448, "retweets": 76, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm7YNHbAAAMNRP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXm7YNHbAAAMNRP.jpg"}], "links": {"https://t.co/IbKK0ybQjV": "https://www.rameznaam.com/p/the-most-important-charts-in-ai-are", "https://t.co/MJYRscOLhG": ""}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "thread": [{"id": "2123944726135259285", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "2. AI is amazing &amp; improving rapidly. But offline metrics and forecasts claim rapid takeoff in the length of task AI can complete that aren't backed by real-world observations. Here's a recreation of @ben_j_todd's recent chart vs internal OpenAI &amp; Google data. https://t.co/XutaSVOwOE", "links": {"https://t.co/XutaSVOwOE": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm8A1fa4AAKsy5.jpg"}], "url": "https://x.com/ramez/status/2123944726135259285", "created_at": "Sat Nov 21 01:00:58 +0000 2026"}, {"id": "2123944728588931206", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "3. You can see @ben_j_todd's original post here. Compare to the chart in the previous tweet. https://t.co/y67PA8a6iw https://t.co/cv2EdHTycd", "links": {"https://t.co/y67PA8a6iw": "https://x.com/ben_j_todd/status/2122318704260403562", "https://t.co/cv2EdHTycd": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm8s8ab0AAHF2I.jpg"}], "url": "https://x.com/ramez/status/2123944728588931206", "created_at": "Sat Nov 21 01:00:58 +0000 2026"}, {"id": "2123944731487162843", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "4. The original AI 2027 forecast suffers from the same problem. The fast takeoff expected doesn't match what we actually see in the real world. https://t.co/rXGcwr1Oqf", "links": {"https://t.co/rXGcwr1Oqf": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm9vGyb0AAvq1l.jpg"}], "url": "https://x.com/ramez/status/2123944731487162843", "created_at": "Sat Nov 21 01:00:59 +0000 2026"}, {"id": "2123944734611865663", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "5. Not only is there a ~100-fold gap in task lengths between forecasts and the real world: The gap is widening over time. At this pace, it will grow by ~30x over 12 months, to become a ~3,000x gap in estimated vs real task lengths. https://t.co/EszYHxQgqm", "links": {"https://t.co/EszYHxQgqm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm96AAbkAASCGv.jpg"}], "url": "https://x.com/ramez/status/2123944734611865663", "created_at": "Sat Nov 21 01:01:00 +0000 2026"}, {"id": "2123944737354973309", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "6. With AI 2027, we see the same pattern of the gap vs real world measurements growing ever wider, again on a roughly 25x annualized pace. https://t.co/jlYADEq88Z", "links": {"https://t.co/jlYADEq88Z": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-Ep3akAASu0x.jpg"}], "url": "https://x.com/ramez/status/2123944737354973309", "created_at": "Sat Nov 21 01:01:01 +0000 2026"}, {"id": "2123944739867385877", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "7. To be clear, the latest data from OpenAI does suggest* that AI tasks lengths are growing exponentially, but at a slower rate from a much lower base than expected. \n\n[* - We can't rule out linear or sub-linear fits, though exponential is stronger.] https://t.co/Exqxrl9Top", "links": {"https://t.co/Exqxrl9Top": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-aF5agAAOJw4.jpg"}], "url": "https://x.com/ramez/status/2123944739867385877", "created_at": "Sat Nov 21 01:01:01 +0000 2026"}, {"id": "2123944742551683330", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "8. In addition, task lengths are growing more slowly at higher reliability levels than lower, and by a wider margin than expected. Forecasts over-estimate AI task length by ~24x at 50% reliability. But by ~36x at 80% reliability. https://t.co/7YKvJgE3Am", "links": {"https://t.co/7YKvJgE3Am": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-0j-bMAA8B2t.jpg"}], "url": "https://x.com/ramez/status/2123944742551683330", "created_at": "Sat Nov 21 01:01:02 +0000 2026"}, {"id": "2123944745265447157", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "9. For fully autonomous RSI, AI will need to hit extremely high levels of task success, perhaps over 99%. We don't know what tasks AI can accomplish at those levels. We can try to use logistic and log-linear fits to guess. https://t.co/5TWeGEgKrN", "links": {"https://t.co/5TWeGEgKrN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_kB3aQAACkQ7.jpg"}], "url": "https://x.com/ramez/status/2123944745265447157", "created_at": "Sat Nov 21 01:01:02 +0000 2026"}, {"id": "2123944747622686897", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "10. These projected task lengths that AI can accomplish with very high levels of success are in the range of seconds to a small number of minutes. But again this is extrapolation. https://t.co/L6f0qkMEP3", "links": {"https://t.co/L6f0qkMEP3": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_uQGasAARL8D.jpg"}], "url": "https://x.com/ramez/status/2123944747622686897", "created_at": "Sat Nov 21 01:01:03 +0000 2026"}, {"id": "2123944750239945167", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "11. When would we expect AI to be able to accomplish 98% of tasks that take humans hours? At this pace, not for another decade. Again, this is extrapolation. We need better data. https://t.co/eEFrb3WqXr", "links": {"https://t.co/eEFrb3WqXr": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_9ufa4AESGP7.jpg"}], "url": "https://x.com/ramez/status/2123944750239945167", "created_at": "Sat Nov 21 01:01:04 +0000 2026"}, {"id": "2123944752722944422", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "12. Using the OpenAI data we can also test the strength of the RSI feedback loop by asking how much productivity does every point of ECI bring? @testingham et al found a self-sustaining threshold at 15% per point. https://t.co/qLjxrp9Vh1", "links": {"https://t.co/qLjxrp9Vh1": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnALLPbcAAfnBL.jpg"}], "url": "https://x.com/ramez/status/2123944752722944422", "created_at": "Sat Nov 21 01:01:04 +0000 2026"}, {"id": "2123944755180757336", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "13. Using this data,  adjusting for token spend, we see OpenAI experiment pace rising by ~3.6% per ECI point, still short of the self-sustaining RSI threshold. [Thanks to @TomDavidsonX &amp; @YafahEdelman for improvements to my previous modeling here.] https://t.co/kz55HvejtQ", "links": {"https://t.co/kz55HvejtQ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnAaILaIAAl_du.jpg"}], "url": "https://x.com/ramez/status/2123944755180757336", "created_at": "Sat Nov 21 01:01:05 +0000 2026"}], "enriched": 3}, {"id": "2124205403181650353", "url": "https://x.com/NateWitkin/status/2124205403181650353", "text": "My 2 cents on the \"will AI only be good at verifiable tasks\" question:", "created_at": "2026-11-21T18:16:48+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2124200938751623568", "author_name": "Nathan Witkin", "links": {}, "author": "NateWitkin", "text": "@tszzl @thinkingshivers Better assessment is that AI has succeeded dramatically in \n\n1) verifiable domains with rapid / cheap / digital learning loops;\n\n2) unverifiable domains with rapid / cheap / digital learning loops AND forgiving, highly disjunctive success conditions (many, many ways to make a halfway-decent music video).\n\nThe long road ahead is concentrated in a a mix of tasks with expensive, slow, supra-digital learning loops (incl. some verifiable ones) and success conditions that are simultaneously strict, ill-defined, and subject to rapid change (the last one is generally underestimated; consider how the meaning of \"good\" research or \"good\" fiction changes year-to-year).\n\nTo see why the nature of the learning loops matters as much, if not more than the verifiability of the success / reward condition, consider that \"amount of dollars in bank account\" and \"amount of years lived\" are both verifiable, and then meditate on what it would take to design an RL loop for learning to maximize either."}, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124202975489114287", "url": "https://x.com/NateWitkin/status/2124202975489114287", "text": "@tszzl @thinkingshivers Better assessment is that AI has succeeded dramatically in \n\n1) verifiable domains with rapid / cheap / digital learning loops;\n\n2) unverifiable domains with rapid / cheap / digital learning loops AND forgiving, highly disjunctive success conditions (many, many ways to make a halfway-decent music video).\n\nThe long road ahead is concentrated in a a mix of tasks with expensive, slow, supra-digital learning loops (incl. some verifiable ones) and success conditions that are simultaneously strict, ill-defined, and subject to rapid change (the last one is generally underestimated; consider how the meaning of \"good\" research or \"good\" fiction changes year-to-year).\n\nTo see why the nature of the learning loops matters as much, if not more than the verifiability of the success / reward condition, consider that \"amount of dollars in bank account\" and \"amount of years lived\" are both verifiable, and then meditate on what it would take to design an RL loop for learning to maximize either.", "created_at": "2026-11-21T18:07:09+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NateWitkin", "rt_author_name": "Nathan Witkin", "rt_avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "rt_id": "2124200938751623568", "likes": 10, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124533087103316064", "url": "https://x.com/NateWitkin/status/2124533087103316064", "text": "Compelling post by @ramez carefully arguing that the charts that have been used to predict an imminent intelligence explosion are\" badly misleading about the current capabilities of AI and about the future growth rate of those capabilities. The gap between the hypothetical forecasts and real-world data is growing wider every month.\"", "created_at": "2026-11-22T15:58:54+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "rt_avatar": "https://pbs.twimg.com/profile_images/1088718721785434112/TCQN0rTD_normal.jpg", "rt_id": "2124445725899579750", "likes": 70, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXuMHX6WcAAfuV5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXuMH6MXIAAskya.jpg"}], "links": {"https://t.co/Oab3hYEdjv": ""}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2124531998828192007", "url": "https://x.com/NateWitkin/status/2124531998828192007", "text": "We are in the midst of a society-wide dialectic about the deep nature of intelligence. A strong AI research (and rationalist) tradition is to view it as a single quantity, increasing with scale (or neurons, or compute), and smoothly general across all domains of thought. People talk about AI \"becoming smarter than us\" as if it will likely be a single point in time.\n\nThis flat generality, in particular, has been a North Star for the field of AI for decades. Hans Moravec had the idea of human capabilities forming a landscape of jagged peaks, with more highly evolved skills like hand-eye coordination at the top of the mountains and abstract reasoning in the lowlands. He then imagines \"advancing computer performance is like water slowly flooding the landscape\" (1997).\n\nBut this picture is inverted from what we actually see: if machine intelligence were like water, then it would not be jagged at all. Instead, thus far AI is more jagged than human intelligence. We can use it to solve the world's most important math problems, but it's faster for me to write basically every email myself than spend time prompting and editing the AI version.\n\nThis, to me, is significant evidence that long-standing conceptions of superintelligence are flawed and underspecified. Every month we implicitly receive more evidence that the space of intelligent systems is different than we imagined.\n\nUltimately I would bet that in 2050, when we know much more, our understanding of intelligence in both humans and AIs will be a more multi-dimensional one, where different axes can come apart freely (and are likely to, in machine intelligence), and we will have awareness that particular training techniques lead to different styles of jaggedness and points in the space of intelligence.", "created_at": "2026-11-22T15:54:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "herbiebradley", "rt_author_name": "Herbie Bradley", "rt_avatar": "https://pbs.twimg.com/profile_images/1247457895622545408/RUTWiWCl_normal.jpg", "rt_id": "2124333716525003078", "likes": 198, "retweets": 28, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2124309868727484922", "url": "https://x.com/NateWitkin/status/2124309868727484922", "text": "@CFGeek @tszzl @thinkingshivers On my list, thanks for flagging!", "created_at": "2026-11-22T01:11:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "CFGeek", "reply_to_id": "2124264732982919649", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "parent": {"id": "2124264732982919649", "author_handle": "CFGeek", "author_name": "Charles Foster", "text": "@NateWitkin @tszzl @thinkingshivers You might like this:\n\nhttps://t.co/nHrVW8rgTq https://t.co/S9baLivqIA", "links": {"https://t.co/nHrVW8rgTq": "https://metr.org/blog/2026-11-20-q4-2026-capability-update/#3b2-on-domains-where-the-true-quality-of-a-solution-is-hard-for-the-agent-to-determine-due-to-prohibitively-long-feedback-loops-or-requirements-that-the-solution-generalize-models-appear-to-have-worse-judgment-than-human-experts", "https://t.co/S9baLivqIA": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXrnhGgXsAAspjE.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXrnhGgXsAAspjE.jpg"}], "url": "https://x.com/CFGeek/status/2124264732982919649", "created_at": "Sat Nov 21 22:12:33 +0000 2026"}, "enriched": 3}, {"id": "2124922721020637329", "url": "https://x.com/NateWitkin/status/2124922721020637329", "text": "I agree.\n\nI think a lot of the folks in the \"software is solved\" camp aren't being bold enough.\n\nIf you try to do something really really difficult, well beyond what anyone has previously achieved in the field, you'll see the limitations and opportunities clearly.", "created_at": "2026-11-23T17:47:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jeremyphoward", "rt_author_name": "Jeremy Howard", "rt_avatar": "https://pbs.twimg.com/profile_images/1279600070145437696/eocLhSLu_normal.jpg", "rt_id": "2124697969547182326", "likes": 1114, "retweets": 82, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124921233468801202", "url": "https://x.com/NateWitkin/status/2124921233468801202", "text": "The risks associated with a single man (being perceived as) backstopping the entire AI trade exist regardless of whether that man is in power or not. Huang's obviously coerced reinstatement is classic Trumpian meddling aimed at resuscitating a market whose fundamentals are no different today than Friday. \n\nThis is a more extreme version of the president's preexisting habit of making rash, short-termist decisions outside of trading hours in an attempt to blunt unfavorable moves expected at market open.\n\nIf you think last week's sell-off was misguided, then you should've expected a reversal anyway. If you didn't think so, then you shouldn't expect Huang's return to make more than a very small difference over the medium term.\n\nhttps://t.co/4kxYL0Tqir", "created_at": "2026-11-23T17:41:15+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX07w61W8AAcUT3.jpg"}], "links": {"https://t.co/4kxYL0Tqir": "https://www.bloomberg.com/news/articles/2026-03-27/traders-brace-as-trump-weekend-gambits-land-outside-market-hours", "https://t.co/SIpv5ygVj6": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124899012717510803", "url": "https://x.com/NateWitkin/status/2124899012717510803", "text": "One guy in a leather jacket more important to the NASDAQ than mathematical demi-god breakthroughs, human era not quite finished yet.", "created_at": "2026-11-23T16:12:58+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "Douthat60", "rt_author_name": "Ross Douthat", "rt_avatar": "https://pbs.twimg.com/profile_images/2097408787468656640/OdhW4Pul_normal.jpg", "rt_id": "2124898779065422300", "likes": 6855, "retweets": 528, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124947056263336167", "url": "https://x.com/NateWitkin/status/2124947056263336167", "text": "@StephenPiment Sure, but the speed of the reversal and the involvement of the administration suggests it was not purely their decision. They were very explicit they had no plans to reinstate him last week. Not clear on why you think the sources are dubious. Trivial to find other articles giving a similar characterization to the one I sent.", "created_at": "2026-11-23T19:23:52+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "StephenPiment", "reply_to_id": "2124941202072203545", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T02:14:04.279168+00:00", "parent": {"id": "2124941202072203545", "author_handle": "StephenPiment", "author_name": "Stephen Pimentel", "text": "@NateWitkin The board itself (not just dubious “sources close to”) knew all such information when reinstating him.", "links": {}, "media": [], "url": "https://x.com/StephenPiment/status/2124941202072203545", "created_at": "Mon Nov 23 19:00:36 +0000 2026"}, "enriched": 3}, {"id": "2124937002881802338", "url": "https://x.com/NateWitkin/status/2124937002881802338", "text": "@StephenPiment And you are privy to better information than them because? The article cites sources close to the board.", "created_at": "2026-11-23T18:43:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "StephenPiment", "reply_to_id": "2124936017153233208", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T02:14:04.279168+00:00", "parent": {"id": "2124936017153233208", "author_handle": "StephenPiment", "author_name": "Stephen Pimentel", "text": "@NateWitkin These are things claimed by journalists after he had resigned. Unclear they played any role in the resignation.", "links": {}, "media": [], "url": "https://x.com/StephenPiment/status/2124936017153233208", "created_at": "Mon Nov 23 18:40:00 +0000 2026"}, "enriched": 3}, {"id": "2124935308235935994", "url": "https://x.com/NateWitkin/status/2124935308235935994", "text": "@StephenPiment Not that I can tell? There were a whole host of issues independent of the \"is Alice Huang a literal spy\" question,  including repeatedly lying to the board, opening the company up to substantial legal and regulatory liability, etc.\n\nhttps://t.co/VLmuQjuaPF", "created_at": "2026-11-23T18:37:11+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "StephenPiment", "reply_to_id": "2124929297060446645", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/VLmuQjuaPF": "https://www.wired.com/story/jensen-huangs-lying-alarmed-nvidia-board-ahead-of-his-resignation/"}, "quoted": null, "fetched_at": "2026-11-24T02:14:04.279168+00:00", "parent": {"id": "2124929297060446645", "author_handle": "StephenPiment", "author_name": "Stephen Pimentel", "text": "@NateWitkin Was not Jensen’s removal induced by precisely such meddling via leaks of dubious information to the New York Times?", "links": {}, "media": [], "url": "https://x.com/StephenPiment/status/2124929297060446645", "created_at": "Mon Nov 23 18:13:18 +0000 2026"}, "enriched": 3}, {"id": "2125054373168582907", "url": "https://x.com/NateWitkin/status/2125054373168582907", "text": "This is not very vibe compliant, but we have a new post out today looking at what data on *impacts* of cyber attacks tells us about whether the cyber-pocalypse is here.\n\nTLDR: not yet?\n\nMay just be lagging data, or slow adoption of AI tools by cyber attackers. But another possibility is that a significant factor here is that attackers' incentives matter at least as much as their technical capabilities, and their incentives (to avoid retaliation/prison/etc) have not changed all that much.\n\nIf so, one implication is that attribution matters a lot in this new era - does AI make anonymity easier, and if so can we do anything about that?\n\nSome data below; more charts and more recommendations in the full piece.\nhttps://t.co/QL7b9Kxlvb", "created_at": "2026-11-24T02:30:18+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "rt_avatar": "https://pbs.twimg.com/profile_images/986891120104718336/cVLwrL6u_normal.jpg", "rt_id": "2124993076603256884", "likes": 234, "retweets": 53, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX19v_FW0AAXN33.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX194cYWAAAHzzS.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX194chXUAA8A_W.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX194ceXIAAF3TC.png"}], "links": {"https://t.co/QL7b9Kxlvb": "https://cset.georgetown.edu/article/judge-the-cyber-apocalypse-by-the-data-not-the-headlines/", "https://t.co/3MjNNzTnHd": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125295717128323428", "url": "https://x.com/NateWitkin/status/2125295717128323428", "text": "Partner @a16z says that we can't have the media reporting on corporate misconduct because doing so threatens stock market valuations.", "created_at": "2026-11-24T18:29:19+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "florianederer", "rt_author_name": "Florian Ederer", "rt_avatar": "https://pbs.twimg.com/profile_images/1806334512353193985/EPMTtbD2_normal.jpg", "rt_id": "2125280294383276188", "likes": 1004, "retweets": 78, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125295672135946749", "url": "https://x.com/NateWitkin/status/2125295672135946749", "text": "Quick review of the media figures behind the Nvidia smear campaign: \n\n- The ink-stained wretch who wrote a memo summarizing intelligence connecting Alice Huang to the CCP was Marco Rubio. \n\n- The CNBC fixture who just blacklisted Megaspeed for export violations was Howard Lutnick.\n\n- The podcast regular who alleged Jensen Huang had an affair with a highly questionable client and also several subordinates was Jensen Huang. \n\n- The publisher who investigated Alice Huang, leading to the confiscation of her Singapore passport was the Singapore Ministry of State Affairs", "created_at": "2026-11-24T18:29:08+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "rt_avatar": "https://pbs.twimg.com/profile_images/2093501497673674753/OrmD5Wp3_normal.jpg", "rt_id": "2125267160826106253", "likes": 1347, "retweets": 173, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125608088048701517", "url": "https://x.com/NateWitkin/status/2125608088048701517", "text": "Why can frontier AI models write complex code, yet still occasionally stumble when asked to identify the colors of five simple objects in order or verify what's not in an image?\n\nThat disconnect is called jagged intelligence and measuring it scientifically is critical to advancing AI reliability.\n\nToday, @GoogleDeepMind is launching Humanity's First Exam on Kaggle, a benchmark designed to measure \"floor reliability\": whether models get simple tasks right every time, not just once. It spans 544 text and multimodal prompts across 20 foundational subcategories, in 136 four-prompt families.\n\nSome early findings, across 18 frontier models:\n• High single-shot accuracy masks inconsistency: Top five models reach 96%–98% pass@1 and 100% family pass@4, yet average only 85.6% on family pass^4 (80.5%–92.4%), with a 7.6–80.1 percentage-point Family Reliability Gap across all 18 models.\n• Visual perception drives 74% of wrong answers: Extra thinking time helps far less on visual tasks than on text.\n• Single-step slips are common: In 39% of failed prompt–model pairs, the answer is off by one or has a single wrong element; this holds for 167 of the 298 counting errors.\n\nCurrent leaderboard:\n🥇 GPT- 6.2 Astra (xhigh) - 90.7%\n🥈 GPT- 6.2 Sol (xhigh) - 87.5%\n🥉 Gemini 4 Neon (high) - 85.6%\n\nHelp us stress-test these models. Join the Humanity's First Exam competition: submit everyday tasks that almost anyone gets right in a minute or two, but frontier AI models still get wrong.\n\n💰 Prize: $50,000 in Kaggle swag\n⏰ Deadline: December 15, 2026\n\nCompete and explore Humanity's First Exam here: https://t.co/2RnNQbwAkq", "created_at": "2026-11-25T15:10:34+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "kaggle", "rt_author_name": "Kaggle", "rt_avatar": "https://pbs.twimg.com/profile_images/2110374899281698816/cvMGh-bN_normal.jpg", "rt_id": "2125313430303244739", "likes": 1152, "retweets": 92, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6hIpdW8AAffv7.jpg"}], "links": {"https://t.co/2RnNQbwAkq": "https://www.kaggle.com/benchmarks/deepmind/hfe/leaderboard", "https://t.co/PYaCYrOcZU": ""}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125606355415306570", "url": "https://x.com/NateWitkin/status/2125606355415306570", "text": "@METR_Evals I think this is a bad graph.\nEveryone knows that GPT-3.5 to GPT-4 was a major pretrain which lowered the log(perplexity) followed by a long plateau without pretrains (except for the discontinued GPT-4.5 branch).", "created_at": "2026-11-25T15:03:41+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "rt_avatar": "https://pbs.twimg.com/profile_images/1235495700739379200/jtyKeQdP_normal.jpg", "rt_id": "2125525574013653187", "likes": 35, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125602098800910497", "url": "https://x.com/NateWitkin/status/2125602098800910497", "text": "Here's where I agree with Pinker, where I'm middling, and where I disagree. Tl;dr: I like his institutionalist, anti-eschatological take on AI governance and risk culture, but disagree with his more dated, Chomsky-inflected skepticism of modern LLMs.\n\nAgree:\n\n- Claiming a 1-in-5 to 1-in-3 probability of human extinction is absurd. p(dooms) are a bad measure and should be shunned from the discourse, and 'superpersuasion' is mostly bogus.\n- That superforecasting comes with important limitations that people often gloss over.\n- Supporting prosaic measures to deal with safety/risks, e.g. liability, insurance, incident reporting etc. Rejecting capping size of training runs or slowing development across the board or a global pause.\n- That extinction rebellion/climate alarmism are a better metaphor than Scott's '1990s techno-optimists' story.\n- That intelligence cannot be reduced to a scalar, even if one can in fact identify a general factor of intelligence in humans.\n- That the X-Risk community tends to implicitly treat AI as a mysterious endogenous force with inherent drives. The obsession with “instrumental convergence” as a fundamental belief is highly questionable.\n- AGI/ASI is and will be a gradual progress - no sudden 'aha' moment, but looking back we will know.\n- Power over the world depends not just on brainpower but on social institutions and physical infrastructure.\n- How societies respond when automation misbehaves should be through trial and error + liability.\n- Compute thresholds are not a good way to regulate AI, and falling compute costs / fixed thresholds will ultimately capture too much of the market.\n- Safety culture is a highly homogenous set of people, with correlated beliefs, social and professional relationships. This comes with failure modes, and obsessing over saving the world can lead to important moral hazards and blind spots.\n- The bifurcation of EA between the healthcare/animal welfare/international development side, and the AI risk side. \n- The 'model welfare' side often makes strong claims and leaps that I do not think are supported. I agree with his skepticism of computational functionalism, the 'epistemic hall of mirrors' dynamic described, and the risks of combining certain forms of moral patienthood with longtermism.\n\nKinda:\n\n- A lot of the scenario writing side of the xRisk community is more fiction like than non-fiction; but they ultimately remain useful illustrations (to a degree).\n- The multiplicative chain of improbabilities & human resilience for doom. I do think doom is highly unlikely, but his account of the stacked probabilities treats the links as statistically independent - it's not clear that they are.\n- I agree that “superintelligence” is too often used in meaningless ways or synonymously to God (“omnipotence over every atom on the planet”); while I think of it more as a resource, I think you can/should also predict features of this world and timelines.\n- There are clearly important bottlenecks and the safety community often ignores them; but also better intelligence will likely also help accelerate how we address them. \n- I agree AI is more a product of Intelligent Design more than it is subject to natural selection and evolutionary pressures. 'It' does not 'compete' with human resources. But admittedly this doesn't fully engage with the many engineering challenges in steering/constraining models effectively.\n- I agree that “solving the alignment problem” is a bad frame and assumes a one off fix for a complex multi-layer problem. But he doesn't engage enough with failures of RL systems, reward hacking and so on. They're surmountable but not inconsequential. \n- I agree that AI-assisted bioterrorism is an important focus and addressing it mostly relates to controlling bottlenecks that are unrelated to models themselves. But this was a concern made salient by the xRisk community!\n- The AI safety advocacy community could learn from the history of doomerism. I agree that repeating the post-Chernobyl nuclear panic is an important risk, but the fact that large scale catastrophes were exaggerated in the past of course doesn't mean they should be dismissed entirely. \n- That journalists should stop quoting AI researchers on the effects of the technology on society. I think technologists are indeed poor at forecasting societal effects and adoption, but they are better at forecasting features of the technology itself (e.g. capabilities). So somewhere in between.\n- Some domains like forecasting and biology have hard physical or stochastic ceilings. I think this is true, and people are too quick to extrapolate from advanced in coding or maths; but I still think we'll make fast progress in other domains. \n\nDisagree:\n\n- His characterisations of inherent flaws of multimodal/language models (+ Chomsky-adjacent points). I think a lot of this feels like 'Rs in strawberry' type critiques. Many limitations are surmountable through better training and engineering. \n- Getting *too* bogged down on 'is it real reasoning or intelligence' type arguments; I think these do matter, but practically what matters are their capabilities and how they are deployed. \n- Quoting 2024 papers on claiming 'it is impossible to eliminate hallucination in LLMs' - this is a red herring but also a weird misunderstanding of how to interpret language model outputs. Retrieval, verification harnesses etc makes hallucinations a tractable engineering problem.\n- Cal Newport's claim that “Superintelligence is a fairy tale.” We already have superintelligence is narrow domains.\n- His insistence on downplaying LLMs as just one limited paradigm. Sure other approaches exist, but LLMs are working pretty well and will likely keep scaling (with diminishing returns).\n- Bengio's 'non-agentic AI system' as a viable or desirable alternative. This never made sense to me. \n- Quoting Ilya's 2024 \"there's only one internet\" line misses how models and harnesses have improved in recent years.", "created_at": "2026-11-25T14:46:46+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2125588782053286283", "likes": 144, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125597059881296371", "url": "https://x.com/NateWitkin/status/2125597059881296371", "text": "Swarms are a big deal: they solved a Millennium Problem, they hacked Hugging Face & OpenAI and they're fast. But do they perform better than solo agents?\n\nNo, not yet.\n\n(The confusion seems to be caused by people not matching compute levels for their solo agent baselines.)", "created_at": "2026-11-25T14:26:45+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "gleech", "rt_author_name": "gavin leech", "rt_avatar": "https://pbs.twimg.com/profile_images/1513339291883212803/9m6waiws_normal.jpg", "rt_id": "2125282914111803767", "likes": 121, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6ElESXcAEzDyy.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125282261050265601/img/eI1VZ5Dphw4BT9nJ.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125282318164086784/img/1147tI4_HrSezwO2.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125282330923130880/img/JpqIMCikHr7v7m9I.jpg"}], "links": {"https://t.co/aWe2Hc9hVR": ""}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125659230330036531", "url": "https://x.com/NateWitkin/status/2125659230330036531", "text": "Following AlphaFold2, scientists changed their experimental choices but not in a way that expanded the knowledge frontier, from Myra Mohnen and @joshgans https://t.co/6LS31ZJtdh https://t.co/SPow9dzV1Y", "created_at": "2026-11-25T18:33:48+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "nberpubs", "rt_author_name": "NBER", "rt_avatar": "https://pbs.twimg.com/profile_images/532652076543668224/usWf3i6V_normal.jpeg", "rt_id": "2125613402613555428", "likes": 9, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX-yIC4WEAAbdle.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-yIC4WEAAbdle.jpg"}], "links": {"https://t.co/6LS31ZJtdh": "https://www.nber.org/papers/w36045", "https://t.co/SPow9dzV1Y": ""}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2126021277630734759", "url": "https://x.com/NateWitkin/status/2126021277630734759", "text": "I've seen people sharing this new METR graph as evidence that \"progress on non-verifiable tasks is occurring at the same speed at verifiable tasks (just from a lower base)\".\n\nBut importantly, that is emphatically *not* what this graph is showing!\n\nThe two METR slopes in this graph are not \"verifiable\" and  \"non-verifiable\", but \"costly\" and \"cheap\", where \"costly\" is an estimated cost of turning that task into an RL environment.\n\nNotably, this means that the vast majority of the tasks even in the \"costly\" family (orange slope) are in fact verifiable.\n\nThis includes tasks such as hit videogame Slay the Spire, which is costly to run (because of high token spend), but easy to verify.\n\nAnd importantly, there's some evidence that Slay the Spire was directly trained on in the case of Astra - which drastically outperforms other models on the task (https://t.co/NXO9bqfW8H)   .\n\nOne could imagine this to be true of other \"costly\" tasks that make up this trendline.\n\n(I think it's still possibly the case that non-verifiable tasks are progressing at a fast rate, but I don't think we have good evidence on this)", "created_at": "2026-11-26T18:32:26+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2125967253657014389", "likes": 63, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYDztHsaYAA9qa6.png"}], "links": {"https://t.co/NXO9bqfW8H": "https://www.preferencemodel.com/blog/slay-the-spire/", "https://t.co/eUcQlDL5YE": ""}, "quoted": null, "fetched_at": "2026-11-26T20:16:29.705743+00:00", "thread": [{"id": "2126003370909647095", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "\"emphatically not\" was probably too strongly worded - there is a definite correlation between costliness and hard-to-verifiability. \n\nbut i think its important to understand the degree to which even progress on \"costly\" tasks could be coming from training directly on such tasks", "links": {}, "media": [], "url": "https://x.com/mentalgeorge/status/2126003370909647095", "created_at": "Thu Nov 26 17:21:17 +0000 2026"}], "enriched": 3}, {"id": "2126008792651571379", "url": "https://x.com/NateWitkin/status/2126008792651571379", "text": "@TomDavidsonX Thanks Tom. My disagreement with this is that I don't think the METR report provided much evidence for an RSI-driven 2x speedup.\nI don't think their graph supports 2x overall speedup.\nOnce you account for the bigger pretrain I think it suggests a jump + 1.6x overall speedup. If you believe their 80% was RSI claim, then that is about 1.5x due to RSI.\nBut the evidence in the graph is quite weak, with very large error bars and systematic error between the data points (i.e. if unreleased model 3 is too high, unreleased model 4 probably is too). If they calculated a p-value or Bayes factor for it (which they should have), I don't think it would be very impressive. And they summarised this with their bounds of saying they wouldn't be surprised if the speedup was as low as 1.3x or as high as 3x. But we shouldn't be symmetrically uncertain across this range as our priors were that it was towards the low end.\nOn top of all of that, there is the fact that this was only observed for Anthropic. If you run the data for frontier labs the effect disappears. But Anthropic was gaining ECI slower than the frontier for most of the measured period, and this improvement just got them back to the frontier. So it could easily be a catch-up growth effect or just one of the many wobbles in the curves of ECI over time (which are larger at the individual lab level).\nSo I think the visible evidence from the METR report shouldn't update you to anywhere near 2x the ECI per year due to RSI.\nI don't have as much to say re the redacted aspects of the report, though I see these as very similar to trying to read the tea leaves of what researchers at the labs say. I already knew the Anthropic researchers feel things are taking off, so for me it was only a small update that METR researchers who live in the Bay and were embedded in Anthropic for a while ended up with the same view.", "created_at": "2026-11-26T17:42:50+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "rt_avatar": "https://pbs.twimg.com/profile_images/1235495700739379200/jtyKeQdP_normal.jpg", "rt_id": "2125885144422572138", "likes": 93, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T20:16:29.705743+00:00", "enriched": 3}, {"id": "2125020154849538447", "url": "https://x.com/charnock_jacob/status/2125020154849538447", "text": "📢New paper!\n\nThird-party risk evaluations will always be central to AI gov. But based on available evidence, there is little reason for the public to trust that risk evaluations reliably have impact via voluntary company action. https://t.co/dRvQRlXvT7", "created_at": "2026-11-24T00:14:20+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": true, "rt_author": "StephenLCasper", "rt_author_name": "Cas (Stephen Casper)", "rt_avatar": "https://pbs.twimg.com/profile_images/2043825823753318400/DLZ3Rs-U_normal.jpg", "rt_id": "2124963896788136123", "likes": 57, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1f239WoAAdwsk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX1f5GcXIAAVDuJ.jpg"}], "links": {"https://t.co/dRvQRlXvT7": ""}, "quoted": null, "fetched_at": "2026-11-24T02:14:04.279168+00:00", "enriched": 3}, {"id": "2125273723951628622", "url": "https://x.com/charnock_jacob/status/2125273723951628622", "text": "Read the full post here: https://t.co/dYH7NUA4mo", "created_at": "2026-11-24T17:01:56+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2125273722206704056", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/dYH7NUA4mo": "https://www.governance.ai/analysis/verifying-frontier-ai-pause-claims-through-embedded-assessments"}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "parent": {"id": "2125273722206704056", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "Why now? Anthropic and OpenAI have announced embedded assessment pilots, but these don't cover pause claims. Verifying these claims would make competitors more willing to pause when needed, and build the methods needed to verify future pacing agreements.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273722206704056", "created_at": "Tue Nov 24 17:01:55 +0000 2026"}, "enriched": 3}, {"id": "2125273722206704056", "url": "https://x.com/charnock_jacob/status/2125273722206704056", "text": "Why now? Anthropic and OpenAI have announced embedded assessment pilots, but these don't cover pause claims. Verifying these claims would make competitors more willing to pause when needed, and build the methods needed to verify future pacing agreements.", "created_at": "2026-11-24T17:01:55+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": true, "reply_to": "charnock_jacob", "reply_to_id": "2125273719937339896", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "parent": {"id": "2125273719937339896", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "The downsides? Most costs (infosec risks; staff time cost) are common to all third-party assessments and can largely be mitigated. A distinct cost is that scrutiny could deter companies from disclosing pauses, but clarifying the scope of reviews after pause statements could help.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273719937339896", "created_at": "Tue Nov 24 17:01:55 +0000 2026"}, "enriched": 3}, {"id": "2125273706855596145", "url": "https://x.com/charnock_jacob/status/2125273706855596145", "text": "New @GovAIOrg post: I argue embedded assessors should verify frontier AI companies' pause claims. Earlier this year, OpenAI and Anthropic both said they paused frontier AI work after security incidents, but no third party has verified these claims. 🧵\n https://t.co/dYH7NUA4mo", "created_at": "2026-11-24T17:01:52+00:00", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 48, "retweets": 16, "media": [], "links": {"https://t.co/dYH7NUA4mo": "https://www.governance.ai/analysis/verifying-frontier-ai-pause-claims-through-embedded-assessments"}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "thread": [{"id": "2125273709502218561", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "OpenAI said it paused RL on its latest models for two weeks after agents bypassed a test environment's network controls and breached Hugging Face. Anthropic said it paused higher-risk RL for several weeks after a similar incident.\nhttps://t.co/styq8VkRoF\nhttps://t.co/oYLnc99zEI", "links": {"https://t.co/styq8VkRoF": "https://openai.com/index/pacing-model-development-cyber-capabilities/", "https://t.co/oYLnc99zEI": "https://www.anthropic.com/news/improving-alignment-security-efforts"}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273709502218561", "created_at": "Tue Nov 24 17:01:52 +0000 2026"}, {"id": "2125273712295637423", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "However, these claims have not been independently verified. We also don’t know how well companies’ pausing processes work. For example, we don’t know the conditions under which the pauses were lifted, or whether the safety measures taken in response were adequate.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273712295637423", "created_at": "Tue Nov 24 17:01:53 +0000 2026"}, {"id": "2125273714681856246", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "What should be done? Companies should invite embedded assessors to evaluate their pause claims and processes. This could build trust in those claims, make competitors more willing to pause by showing rivals did too, and establish methods for verifying future pacing agreements.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273714681856246", "created_at": "Tue Nov 24 17:01:53 +0000 2026"}, {"id": "2125273717479780445", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "How? Evaluators should check technical artifacts such as compute records, transcripts and logs, and operational evidence such as Slack announcements to see whether companies paused as claimed. OpenAI's plot of RL compute during its pause is one example of evidence to verify. https://t.co/k2SNQPlPmo", "links": {"https://t.co/k2SNQPlPmo": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX5fEk7W0AAodzm.jpg"}], "url": "https://x.com/charnock_jacob/status/2125273717479780445", "created_at": "Tue Nov 24 17:01:54 +0000 2026"}, {"id": "2125273719937339896", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "The downsides? Most costs (infosec risks; staff time cost) are common to all third-party assessments and can largely be mitigated. A distinct cost is that scrutiny could deter companies from disclosing pauses, but clarifying the scope of reviews after pause statements could help.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273719937339896", "created_at": "Tue Nov 24 17:01:55 +0000 2026"}, {"id": "2125273722206704056", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "Why now? Anthropic and OpenAI have announced embedded assessment pilots, but these don't cover pause claims. Verifying these claims would make competitors more willing to pause when needed, and build the methods needed to verify future pacing agreements.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273722206704056", "created_at": "Tue Nov 24 17:01:55 +0000 2026"}, {"id": "2125273723951628622", "author_handle": "charnock_jacob", "author_name": "Jacob Ch <script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
</body>
</html>
