ghts cyber models*\n\nThe key object of any discussion of AI restriction is the tradeoff between attacker use friction and defender use friction. I don't think today's trusted access programs dial this Pareto-optimally. Neither do proposed bans on frontier open-weights cyber models circulating in policy circles.\n\nTake Daybreak and Glasswing from OAI and Anthropic. These programs serve unguardrailed frontier models to trusted participants; I'm for Know Your Customer in principal, but these programs are too restrictive for defenders and buy us too little in attacker restriction for the cost.  From public information less than 1% of software developers are in these programs and able to use them to find and fix issues in their code.\n\nIt's true these participants cover the most highly leveraged codebases in the world but this still leaves an enormous gap; take the software objects Hacktron stepped through to access OpenAI's monorepo, libheif and the SaaS product Discourse, neither of which, I believe, were targeted by Daybreak/Glasswing. Diffusion of the best and most frictionless cyber capabilities to the long, vulnerable tail matters a lot.\n\nOpen weights is also extremely important for defenders.  Many organizations can't or don't want to share sensitive security data with OpenAI or Anthropic, often for understandable reasons; from what we can tell from the outside, these organizations seem to be playing fast and loose with security themselves.\n\nAnd if we're going to make security work at scale, we'll need to distill large frontier cyber models into smaller models that can monitor high volume trillion-event-scale feeds at low latency / high throughput, find and fix bugs cheaply, and monitor security events on-prem, on-device, and for military uses, in the field with patchy Internet connectivity. We need frontier open-weights models for this.\n\nTo be clear: I do think we should go to *extremely great lengths* to restrict attacker access to frontier cyber models.\n\nBut there are many policies that *are on the efficient frontier in denying attackers and enabling defenders* that we should consider.\n\nHere are things we can/should do to deny attackers AI access:\n\n* Low friction Know Your Customer programs across all inference providers based on self-enforced or regulation-enforced information sharing and blocklists that codify known-attacker signals; restrict attackers while pouring gas on defender adoption.\n\n* More defense in depth; all inference providers should do more to monitor API usage, detect attacker behavior, kick attackers off, and have them pursued, arrested, or sanctioned where appropriate.\n\n* Closed providers like OAI, Anthropic, Google, and Meta should do this, but so should open-model inference providers like Together, Anyscale, Fireworks, and OpenRouter.\n\n* Time-to-detection-and-response re attackers using cloud AI inference should be a KPI any AI inference company shares publicly; at least under a self-regulatory regime but probably eventually under an international regulatory regime.\n\n* It's true that the most sophisticated and capital-endowed attackers can build/access their own inference compute; but these operations should also be detected and shut down as well as possible by monitoring inference hardware markets as well as we can.\n\n* Victims of (AI) cyber attacks should also be induced to share more information so that we can get a moving epidemiological picture of attacker use.  Every AI-agent-based attack should also become a public natural experiment for the security community to learn from. \n\n* The poor reporting protocol OAI followed around the OAI/HF incident is not a good sign of maturity here. Why aren't we pushing much harder on public threat-intelligence sharing so defenders can prepare for the AI cyber phase transition?\n\nNone of this will prevent nation-states and sophisticated actors from adding agent swarms, backed either by Chinese or American models, to their arsenal of strategic weapons.\n\nBut we shouldn't confuse geopolitical problems for technical problems justifying slowing defender adoption and hardening the world's code and infrastructure. \n\nNation-states will find ways to get access to strategic AI-based cyber weapons with or without Daybreak, Glasswing, and open weights restrictions, because the two sovereign AI powers and their allies are in geopolitical competition. API-access gating is not sufficient defense against state-level cyber threats.\n\nWe should absolutely try to slow attackers down. But we have ~10 trillion lines of code to secure with AI as fast as possible, and a ~120trn GDP global economy to apply AI as an intrusion detection substrate over, and high-defender-friction restrictions are a poor stop-gap for accomplishing this...", "created_at": "2026-10-01T16:44:38+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 40, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HThjk_RWsAAtqIq.jpg"}], "quoted": null}, {"id": "2105700123846275146", "url": "https://x.com/sayashk/status/2105700123846275146", "text": "10 articles and papers we read in September 🏫📚\n\n1/ AI Existential Risk Probabilities are (still) too Unreliable to Inform Policy -\n@random_walker and @sayashk\nhttps://t.co/za6xlMhuZn", "created_at": "2026-10-01T16:43:26+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "likes": 19, "retweets": 6, "media": [], "quoted": null}, {"id": "2106061009043824956", "url": "https://x.com/sayashk/status/2106061009043824956", "text": "I'm at the Curve this weekend! I'll be talking about RSI on Sunday at 2pm. Also excited to talk about:\n\n- What does a big-tent AI safety movement look like?\n- How can we make progress on policy proposals where there is common ground across the community?\n- How can we improve our RSI evaluations?", "created_at": "2026-10-02T16:37:27+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6d8ubQAUa7ss.jpg"}], "quoted": {"author": "random_walker", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?"}}, {"id": "2105763874880593958", "url": "https://x.com/sayashk/status/2105763874880593958", "text": "To be clear, while making and watching these videos is fun the first few times, I don't think they will remain compelling for very long. As these videos become easier to create and more pervasive, their novelty will wear out pretty quickly. \n\nI predict we'll look back at these the same way we look back at early ChatGPT demos (cute but kind of annoying). \n\nOf course, AI will be extremely useful for people who make videos, but since they'll all be competing for the same eyeballs, it's what they do with AI that will differentiate them.\n\nAnd there are already tells in these videos that will make us collectively groan as we see more of these, e.g.: https://t.co/nGyL7CHXDm\n\nhttps://t.co/79GeXlAH7O", "created_at": "2026-10-01T20:56:45+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": {"author": "SethCronin", "text": "@sayashk Along with the increasing rate of model drops, I'm also finding my rate of ability to be impressed goes down as well. I think if I had seen videos like this being produced a year ago, my hype for it would have lasted at least a few weeks if not months. However seeing this style of video just twice in two days has already completely drained any awe or intrigue I've had in these products. The first one I generally genuinely sat through to completion but after 45 seconds of this it was instant boredom. Funny that"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104986882073657846", "url": "https://x.com/testingham/status/2104986882073657846", "text": "RT @DevenPzak: I really enjoyed working on this project. I believe the new flop-aware paradigm of nanoGPT thinking is useful, and it seems…", "created_at": "2026-09-29T17:29:16+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "is_retweet": true, "likes": 257, "retweets": 30, "media": [], "quoted": null}, {"id": "2104937820561559718", "url": "https://x.com/testingham/status/2104937820561559718", "text": "@sj_manning cool, my takeaways:\n\n- It was surprising to me that algorithmic progress has *not* notably accelerated. There were many announcements in early 2026 that seemed to imply we'd see a much faster growth rate, and there were some autonomous discoveries. But it seems in retrospect those discoveries weren't enough to move aggregate progress.\n\n- In just 1 month already things have changed. We're now solving Millennium prize problems, and nanoGPT has had a huge jump. \n\n- One big takeaway: these curve-bending events are hard to anticipate. Not clear how well we could've anticipated the explosion in CVEs or explosion in Erdos/Millenium prize solutions. Same thing applies to curve-bending in LLM algorithmic progress.", "created_at": "2026-09-29T14:14:18+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "sj_manning", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107190125142897054", "url": "https://x.com/testingham/status/2107190125142897054", "text": "@karthiktadepall @DevenPzak Hutter prize compression competition: https://t.co/OGTZzlZGko", "created_at": "2026-10-05T19:24:10+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT4-KiXbwAAZ-SF.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107189864823488582", "url": "https://x.com/testingham/status/2107189864823488582", "text": "@karthiktadepall NanoGPT (showing @DevenPzak 's huge jump, but not his more-recent even bigger apparent jump). https://t.co/PNxVV50m82", "created_at": "2026-10-05T19:23:08+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT49u3ybIAAA274.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107189485326995657", "url": "https://x.com/testingham/status/2107189485326995657", "text": "Data: https://t.co/Is28wxbjHo\n\nOriginal blog post: https://t.co/UADyLlhg1M\n\nRelated by @karthiktadepall  on games: https://t.co/18FNyziadE", "created_at": "2026-10-05T19:21:37+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "karthiktadepall", "text": "no evidence of AI coding uplift in video game development. \n\nwhy? https://t.co/aiNqKAygA4"}, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107188676883280046", "url": "https://x.com/testingham/status/2107188676883280046", "text": "Finally we want a theory of why some metrics are accelerating and some not. What types of discovery is AI particularly good at helping with?\n\nHere's a very loose conjecture: AI accelerates discovery where the marginal cost of an experiment is low. If experiments (AKA verifications) are cheap, then you can use experiments as a substitute for understanding; if they're expensive you still need to lean on human understanding. I will make some very conjectural claims about the marginal cost of experiments/verifications in different areas:\n\n- Cyber vulnerabilities: marginal cost is small once you already have the software loaded in memory, a few CPU cycles to verify. \n\n- Math proofs/counterexamples: the fixed cost of formalizing a problem can be high (e.g. converting to Lean, or expressing the core problem in code), but the marginal cost is just a few CPU cycles.\n\n- NanoGPT: until recently the cost of a single run was 8xH100 GPU for 1.5 minutes, and to get tight confidence intervals you need 18 of those runs. This could perhaps explain why we didn't get much movement until recently.\n\n- Hutter compression: 50 hours of CPU time.\n\n- Stockfish: Claude estimates $100-300 of compute cost to statistically verify a small improvement.\n\n- CIFAR: Claude says it's ~$1 to verify, so this could be a counterexample.\n\nAn implication of this theory: we might see slower curve-bending in domains where the cost of experimentation is large, e.g. frontier pretraining, where experiments can cost a huge amount of money; and domains where we need real-world experiments -- physics, chemistry, biology (though everything changes if we can trust simulations).\n\nAlso note a corollary of this theory: if data and intelligence are substitutes, then making our AI smarter will loosen the bottleneck from experiments.", "created_at": "2026-10-05T19:18:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107188675398553720", "url": "https://x.com/testingham/status/2107188675398553720", "text": "Overall I think this is evidence of a lot more curve-bending in the last 6 weeks, and the algorithmic progress should be updating for people who worry about RSI.\n\nA reminder: (1) we're looking at metrics with a reasonable pre-AI baseline rate of discovery, and (2) this update only discusses metrics we already discussed in the previous post.\n\nSome additional observations:\n\n1. The most important curves are secret. We really want to know when the frontier labs' AI efficiency and capability curves start bending, and that's not generally public information.\n\n2. I think this area is under-invested in. I'd love to see people maintaining dashboards of curves to watch for when they start bending. I'm confident the set of metrics I'm tracking could be substantially improved. I find this information much more updating than results from LLM benchmarks or RCTs.\n\n3. Whether the discoveries are AI-alone or AI-assisted is always hard to tell, but it matters less than the aggregate rate of discoveries.\n\n4. What other metrics should we be tracking? Most broadly, I think we want frontier *efficiency* metrics: e.g. FLOP cost of calculation, monetary cost of a FLOP, energy cost of a solar cell, efficiency of chemical synthesis. Would also be good to track more equilibrium metrics, e.g. cybercrime, though these are harder to interpret because they are outcome of a multi-player game. It's interesting to track production of code, software, and academic papers, but it's very difficult to proxy for quality, and that makes those harder to interpret.\n\n5. We don't know expenditure. Ideally we'd want to track the total expenditure on discovery, but that's super hard to get data on (esp. including failed discoveries). Still the data on output is informative.", "created_at": "2026-10-05T19:18:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107188673381109846", "url": "https://x.com/testingham/status/2107188673381109846", "text": "More curves are bending. In mid-August Nate Rush & I posted an analysis of which discovery curves are starting to bend. What's happened since then?\n\nCyber vulnerabilities: curve is still bent. Discovery of vulnerabilities is accelerating even further, though exploited vulnerabilities remain fairly flat.\n\nMath: curve is further bent. We said there was a likely acceleration for small-scale problems. Since then there has been a claimed Millennium prize resolution, & credible rumors of another. All frequently-updated databases of open problems seem to be proceeding at a rapid rate.\n\nAlgorithms: curve is now bending. Two high profile algorithmic competitions have had big curve-bending events: NanoGPT, and the Hutter compression prize. Other frequently-updated series remain relatively unchanged: CIFAR-10, Stockfish, matrix-multiplication exponent.\n\nMore observations below.", "created_at": "2026-10-05T19:18:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 12, "media": [], "quoted": {"author": "testingham", "text": "New post with Nate Rush: Have we seen an acceleration in discoveries?\n\nMany plots & some tentative conclusions:\n\n1. Cyber: ⤴️ sharp acceleration\n2. Math: ↗️ some acceleration\n3. Algorithms: ➡️ no clear acceleration"}, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2105786054058164627", "url": "https://x.com/slatestarcodex/status/2105786054058164627", "text": "Oh, you're worried about a Jewish guy's apocalyptic cult? You're scandalized that they consort with prostitutes? You think their message of compassion for everyone threatens normal bonds of family, community, and nation? Should we throw you a party? Should we invite Pontius Pilate?", "created_at": "2026-10-01T22:24:53+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3302, "retweets": 214, "media": [], "quoted": null}, {"id": "2105820472302870771", "url": "https://x.com/slatestarcodex/status/2105820472302870771", "text": "@alth0u I understand SF on levels you cannot possibly imagine: https://t.co/vPX67bIwNc", "created_at": "2026-10-02T00:41:39+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "alth0u", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 349, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105819656816894359", "url": "https://x.com/slatestarcodex/status/2105819656816894359", "text": "@oscredwin Drop the \"Scott make\", it's cleaner.", "created_at": "2026-10-02T00:38:25+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "oscredwin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 457, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105430960372416820", "url": "https://x.com/slatestarcodex/status/2105430960372416820", "text": "@ATabarrok https://t.co/P0Vs8JOs3B", "created_at": "2026-09-30T22:53:52+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ATabarrok", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 70, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105763915103891642", "url": "https://x.com/s8mb/status/2105763915103891642", "text": "What kind of chippy city slogan is this? https://t.co/cQKJiPaxet", "created_at": "2026-10-01T20:56:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 184, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTktF_IWEAEC01o.jpg"}], "quoted": null}, {"id": "2105739467151548859", "url": "https://x.com/s8mb/status/2105739467151548859", "text": "Here's my hack for avoiding the overnight return flight from DC to London, btw. I can't sleep on them. I'm getting the train to Newark Airport, checking into the hotel here, then going into NYC for dinner. Then sleep, and get the morning flight back to London. (There is no daytime flight from DC, only NY.)\n\nBetter to spend a night in a hotel and a day on a plane than a night on the plane and a day feeling sleep deprived and miserable. The downside is the time spent on the train, but it's so comfortable it's really not much different to being in an office. The upside is – dinner in New York!", "created_at": "2026-10-01T19:19:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 267, "retweets": 1, "media": [], "quoted": null}, {"id": "2105739349744885846", "url": "https://x.com/s8mb/status/2105739349744885846", "text": "Here's my hack for avoiding the overnight return flight from DC to London, btw. I can't sleep on them. I'm getting the train to Newark Airport, checking into the hotel here, then going into NYC for dinner. Then sleep, and get the morning flight back to London.\n\nBetter to spend a night in a hotel and a day on a plane than a night on the plane and a day feeling sleep deprived and miserable. The downside is the time spent on the train, but it's so comfortable it's really not much different to being in an office. The upside is – dinner in New York!", "created_at": "2026-10-01T19:19:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 1, "media": [], "quoted": null}, {"id": "2105737581539287143", "url": "https://x.com/s8mb/status/2105737581539287143", "text": "Big fan of the Amtrak train I'm on. Much bigger and more comfortable seats than British trains have – Amtrak coach is as good as British first class. The carriages have a cool brushed steel exterior. The conductor wears a fun peaked cap. Americans: surprisingly good at trains!", "created_at": "2026-10-01T19:12:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 385, "retweets": 9, "media": [], "quoted": null}, {"id": "2105414252131402033", "url": "https://x.com/s8mb/status/2105414252131402033", "text": "I’m in Union Market in Washington DC, which has been hugely upzoned and densified over the past decade - apparently it’s the zip code in America with the most new housing over that period. It’s awesome! Really nice to walk around, and lots of nice restaurants and cafes. https://t.co/vneGZbrQnP", "created_at": "2026-09-30T21:47:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 614, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3YXMAEs_IS.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3XWQAASznl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3lW0AAMqcj.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3kXgAA4fJl.jpg"}], "quoted": null}, {"id": "2105410143806730435", "url": "https://x.com/s8mb/status/2105410143806730435", "text": "Excellent!", "created_at": "2026-09-30T21:31:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 0, "media": [], "quoted": {"author": "ZachBIsrael", "text": "Trump signed an executive order yesterday directing federal agencies to develop and implement, by November 27, a campaign across Washington, D.C. to reduce, by 2028, invasive mosquito populations by 90% &amp; tick populations by 50%: https://t.co/0FkpahWnrO @chenderson https://t.co/svmnl6zZLF"}}, {"id": "2105354272192045341", "url": "https://x.com/s8mb/status/2105354272192045341", "text": "Luis is one of the most interesting people I read and follow. Perhaps the most clear-sighted person in the world on Europe’s challenges and still not a pessimist about it!", "created_at": "2026-09-30T17:49:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 56, "retweets": 2, "media": [], "quoted": {"author": "tylercowen", "text": "My excellent Conversation with Luis Garicano, https://t.co/Yj7ylIDXnq, @lugaricano"}}, {"id": "2105351701607641268", "url": "https://x.com/s8mb/status/2105351701607641268", "text": "My excellent Conversation with Luis Garicano, https://t.co/Yj7ylIDXnq, @lugaricano", "created_at": "2026-09-30T17:38:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "tylercowen", "rt_author_name": "tylercowen", "likes": 106, "retweets": 24, "media": [], "quoted": null}, {"id": "2105283452454981828", "url": "https://x.com/s8mb/status/2105283452454981828", "text": "The answer is to tax the wealth generated by the robot when it is consumed, ie when it is no longer being used to produce more stuff. VATs do this well, and taxes on corporate income can be adjusted to function the same way (eg, cash flow taxes).", "created_at": "2026-09-30T13:07:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 111, "retweets": 9, "media": [], "quoted": {"author": "ezraklein", "text": "Bill Gates on why we should tax A.I. work: “If you’ve let go of a worker and hired a robot to do that job, why are you so incentivizing the trade-off against the human labor that you don’t ask the robot to also pay into the pension fund? What is it? Is it that the pro-robot union has gotten the tax laws to say: No, if you’re not flesh, then let pensions go bankrupt?”"}}, {"id": "2105078652882833723", "url": "https://x.com/s8mb/status/2105078652882833723", "text": "If you’re in Washington DC tomorrow, come join us for the launch of the new issue of Works in Progress. See you there! https://t.co/YdayEMpKzp", "created_at": "2026-09-29T23:33:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 2, "media": [], "quoted": null}, {"id": "2105033226981081130", "url": "https://x.com/s8mb/status/2105033226981081130", "text": "This was great and I’ve been enjoying Instinct. Shinn is very likeable, and I found it pretty helpful for thinking of ways to use it.", "created_at": "2026-09-29T20:33:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 2, "media": [], "quoted": {"author": "patrick_oshag", "text": "My conversation with Noah Shinn (@noahrshinn), founder of Instinct.\n\nNoah is building a personal AI assistant. It's still invite only, has spent nothing on marketing, and is growing roughly 10% A DAY. \n\nThis is his first long conversation about the company.\n\nWe discuss:\n- Why Instinct doesn't have an app\n- Buying compute months ahead of exponential demand\n- How users learn to trust it with a credit card\n- Safety and security\n- Agents coordinating with other people's agents\n- Instinct's business model\n- Apps built on consumer inertia\n- and more\n\nEnjoy!\n\nTimestamps:\n0:00 Intro\n4:11 What people are using AI agents for\n15:07 Rethinking travel, reservations, and the internet\n22:43 Trust, privacy, and personal data\n27:50 The business model behind Instinct\n38:04 How existing businesses will adapt\n47:55 Designing a personal assistant people love\n53:15 Growth, compute, and competing with Big Tech\n1:11:44 What’s next for Instinct and personal AI"}}, {"id": "2105031308321632292", "url": "https://x.com/s8mb/status/2105031308321632292", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA", "created_at": "2026-09-29T20:25:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 1725, "retweets": 294, "media": [], "quoted": null}, {"id": "2104996339893629047", "url": "https://x.com/s8mb/status/2104996339893629047", "text": "This is great. It makes me really annoyed at how much fare evasion is becoming tolerated on the Tube. We need a cheap, swift way to make an example of these people and humiliate them - I propose by putting them in the pillory outside the station they’re caught in. https://t.co/emAI6w2bis", "created_at": "2026-09-29T18:06:51+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 80, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZy_ixbcAAACSA.jpg"}], "quoted": {"author": "emmma_camp_", "text": "Want to reduce crime on the subway? Enforce the fares.\n\nMy latest for @WSJFreeEx \nhttps://t.co/QeCO4c1oUr"}}, {"id": "2104979759038157209", "url": "https://x.com/s8mb/status/2104979759038157209", "text": "When I stilled worked on biosecurity, I first learned about Debug, a Google project to reduce mosquito populations. \n\nResults from their Singapore pilot are now out. \n\nThey crushed mosquito populations, reducing dengue infections by 70% in the process: https://t.co/X26UdpPuUi", "created_at": "2026-09-29T17:00:57+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "Simon__Grimm", "rt_author_name": "Simon Grimm", "likes": 5565, "retweets": 593, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZMz0kWsAAkBXc.jpg"}], "quoted": null}, {"id": "2104961136315744287", "url": "https://x.com/s8mb/status/2104961136315744287", "text": "I don't really understand why people on a daytime westbound flight, where it's 11:45am at the destination, would want the cabin to be darkened and all the window blinds shut. It doesn't make sense to me.", "created_at": "2026-09-29T15:46:57+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1784, "retweets": 19, "media": [], "quoted": null}, {"id": "2104952364545532194", "url": "https://x.com/s8mb/status/2104952364545532194", "text": "The Tower Broker.", "created_at": "2026-09-29T15:12:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Stripe Press’s newest author is in the tiny handful of people with the strongest claim to being New York’s modern power broker: Mary Ann Tighe, CEO of CBRE’s New York Tri-State region. \n\nMary Ann’s fingerprints are all over Manhattan. Since becoming CEO in 2002 she’s brokered more than 133 million square feet of commercial real estate transactions. A (very small) selection of her deals: \n\nShe brought Condé Nast to 4 Times Square, and at the time it was the first new office building constructed in New York in a decade(!). \n\nShe represented the NYT in the development of its new headquarters on Eighth Ave. \n\nShe brought Coach in as the first Hudson Yards tenant. \n\nFor 1199SEIU, one of the country’s largest healthcare workers’ unions, she helped engineer a 580,000-square-foot headquarters deal projected to save the union and its benefit funds roughly $400 million over 30 years. \n\nAnd perhaps most meaningfully, Mary Ann was instrumental in rebuilding the World Trade Center, including bringing Condé Nast to One World Trade, and, more than two decades later, securing American Express for roughly 2 million square feet at 2 World Trade Center (broke ground ~ two months ago!). \n\nMary Ann’s book (tentatively titled BUILDING NEW YORK) traces the stories of the deals themselves, but also the personalities who’ve made modern New York, from mayors, to CEOs, to the Vatican—whose approval she needed to broker the air rights for St. Patrick’s Cathedral! \n\nIt’s rare to get such a candid view into how the real estate sausage gets made, especially at Mary Ann’s level. We can’t wait to bring you her book."}}, {"id": "2104944101741486133", "url": "https://x.com/s8mb/status/2104944101741486133", "text": "We need a Conscious Extinction movement to rid the world of the animals and plants that cause the worst disease and suffering. \n\nIt's good that smallpox and rinderpest are extinct. It's good that the screwworm fly and malarial mosquitos were extinct in the developed world. So let's extend the logic to other disease-carrying mosquito species, along with lots of other pests, and let's not stop at the borders of the rich world.", "created_at": "2026-09-29T14:39:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 360, "retweets": 33, "media": [], "quoted": {"author": "salonium", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA"}}, {"id": "2104896090197889489", "url": "https://x.com/s8mb/status/2104896090197889489", "text": "Very good post from @AtalantaArdenM on the role of suffering in art: https://t.co/eyzqdV0G7E.", "created_at": "2026-09-29T11:28:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "likes": 298, "retweets": 17, "media": [], "quoted": null}, {"id": "2104887580873613386", "url": "https://x.com/s8mb/status/2104887580873613386", "text": "I’m slowly cleaning up the suburbs with Muse.\n\nSaw this mess of wires on a pole. Took a picture and asked Muse to contact Verizon to get them cleaned up.\n\nIt went to their website and got to work.\n\nThere is a 0% chance I would’ve sat in a Verizon support chat over this. I would’ve just been mildly annoyed every time I walked past it for the next five years.\n\n“Someone should do something about that” is now a prompt.\n\n🤝 @alexandr_wang", "created_at": "2026-09-29T10:54:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "toddsaunders", "rt_author_name": "Todd Saunders", "likes": 6681, "retweets": 269, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUYZRpWgAEPWQJ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTUYZRtWUAAqrOR.jpg"}], "quoted": null}, {"id": "2104885089360638232", "url": "https://x.com/s8mb/status/2104885089360638232", "text": "These are fantastic.", "created_at": "2026-09-29T10:44:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [], "quoted": {"author": "Lanefab", "text": "We’ve been channeling a bit of retro futurism with these #singlestair prototypes. \n\nThere was a lot of great urbanism at the start of the 1900s (before cars took over) and a lot of that same approach can work well with modern passive house design &amp; low embodied carbon materials. https://t.co/1eSufPWKZQ"}}, {"id": "2104879677303378374", "url": "https://x.com/s8mb/status/2104879677303378374", "text": "The PM is expected to signal an end to the triple lock today. But what are the options for reform, and how much money do they save?\n\n@BritishProgress (namely, @matthewgstubbs) has made a tool to compare the different ideas on the table.\n\nFor instance, you can compare @timleunig's '5-year triple lock' with @resfoundation's 'smoothed triple lock' proposal (originally proposed by @TorstenBell and @lauracgardiner) to see that they each would save around £60bn by 2047, and deliver an annual state pension of around £27k (nominal).\n\nAs you can see, the amount of money that can be saved – particularly over a longer time-horizon, is enormous.", "created_at": "2026-09-29T10:23:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "dc_lawrence", "rt_author_name": "David Lawrence", "likes": 61, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTX8bGfXMAARjwk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTX9QsoWEAAiwc7.jpg"}], "quoted": null}, {"id": "2104857069476249944", "url": "https://x.com/s8mb/status/2104857069476249944", "text": "I think the Natural History Museum is my favourite building. It’s beautiful, awesome, and fun! https://t.co/UlS93smEWI", "created_at": "2026-09-29T08:53:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 155, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTX0WDaXAAAUSX-.jpg"}], "quoted": null}, {"id": "2104837979088830864", "url": "https://x.com/s8mb/status/2104837979088830864", "text": "The triple lock is stupid, but if since 2010 we’d had a “double lock” targeting the higher of earnings or inflation instead, and used a three-year moving average, we’d only be spending £11 billion less today. 0.09% higher economic growth over a decade would cover that.", "created_at": "2026-09-29T07:37:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 387, "retweets": 18, "media": [], "quoted": {"author": "GjMcGowan", "text": "Now is time for my heterodox view that this commitment isn't that expensive and the political capital spent on abolishing it would be better spent on $LIST_OF_PRO_GROWTH_REFORMS"}}, {"id": "2104822123122372852", "url": "https://x.com/s8mb/status/2104822123122372852", "text": "The harder I have to work, for example with my children or my job, the less “fun” I have but the more satisfied with my life I feel.", "created_at": "2026-09-29T06:34:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 118, "retweets": 1, "media": [], "quoted": null}, {"id": "2104820719565574262", "url": "https://x.com/s8mb/status/2104820719565574262", "text": "I think it would be good to raise defence spending to 3% primarily so we have something to trade for access to American frontier AI models.", "created_at": "2026-09-29T06:28:59+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": null}, {"id": "2106310367856984137", "url": "https://x.com/s8mb/status/2106310367856984137", "text": "Closer alignment with the EU, especially on security and defence, seems to now come with a major trade-off of making it harder to join whatever AI umbrella the US creates for aligned countries.\n\nIf we end up in a timeline where the US has much better models than the rest of the world, then having the option of adopting whatever measures it demands to get access to them (eg around national security, tech regulation, and defence) will be very important.", "created_at": "2026-10-03T09:08:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 2, "media": [], "quoted": null}, {"id": "2106304058957103309", "url": "https://x.com/s8mb/status/2106304058957103309", "text": "I still think people are underpricing CGT being equalised with income tax - ie a 45% marginal rate - with an exit tax at the budget. The exit tax is what makes it revenue increasing, in the short run. They would be pre-trailing it not happening if they had ruled it out.", "created_at": "2026-10-03T08:43:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 4, "media": [], "quoted": null}, {"id": "2106128458984153244", "url": "https://x.com/s8mb/status/2106128458984153244", "text": "Last night I ate Thai food (at Brooklyn’s UGLY BABY) that was so spicy that I started involuntarily shivering. My brother says it’s the first time he’s ever seen panic in my eyes.", "created_at": "2026-10-02T21:05:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 176, "retweets": 2, "media": [], "quoted": null}, {"id": "2106071728430702976", "url": "https://x.com/s8mb/status/2106071728430702976", "text": "The \"debate\" over Englishness makes a lot more sense if you think of it as a way for people to signal to their own side how important they think ethnicity is, since the best way for both sides to do this is to keep it as ambiguous as possible whether they mean \"ethnically English\" or \"culturally English\" unless they are pushed. It's very toxoplasmic: both sides get maximum attention and credit with their own factions by being as ambiguous as possible.", "created_at": "2026-10-02T17:20:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 7, "media": [], "quoted": null}, {"id": "2106016354159743087", "url": "https://x.com/s8mb/status/2106016354159743087", "text": "Can we switch off diseases?\n\nsiRNA drugs are, in my view and @JacobTref’s too, one of the most exciting developments in medicine. So we decided to do an episode!\n\nIt’s a technology that can ‘silence’ harmful genes in the body. And there are lots of cases where you might want to silence genes:\n\n- Infectious diseases, where you can silence pathogen proteins or human proteins that pathogens depend on\n- Rare genetic diseases, where you can silence the production of mutated proteins\n- Cardiovascular diseases, by silencing proteins that raise cholesterol\n- Cancers, by silencing proteins that help tumour cells grow, survive, metabolize, metastasize, or resist treatment\n- and more!\n\nWhat’s even better is that siRNA drugs are:\n\n• Potentially tunable, meaning you could reduce the production of a protein, rather than silencing it entirely\n• Programmable, meaning you can quickly switch out which gene it targets by changing its sequence\n• Long-lasting: some drugs last for months, even half a year, with a single injection\n• Off-the-shelf: they typically don’t involve complicated surgeries or procedures, because of the way they’re delivered in the body\n\nToday, siRNA drugs are largely used to treat liver diseases, partly because that’s the easiest starting point.\n\nAnd they are extremely effective at it. One example is as a cholesterol drug: siRNAs can reduce PCSK9 levels by around 70%, reducing cholesterol levels by 50-60%, beyond the effect of statins.\n\nBut we think it’s just a matter of time before they can be used to target other organs too.\n\nWill siRNA treat diseases of other organs? And what’s the catch?\n\nListen to our latest episode of HARD DRUGS to find out!\n\nChapters:\n00:00 Introduction\n09:58 siRNA trivia\n28:14 The 20 year journey to make siRNA drugs\n36:07 Which diseases could siRNA treat?\n50:45 Programmable, long-lasting, scaleable drugs\n54:32 The limits of siRNA\n1:08:23 Conclusion", "created_at": "2026-10-02T13:40:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 180, "retweets": 40, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106006106912821249/img/SNA8OvchbEtMdRRc.jpg"}], "quoted": null}, {"id": "2106678098506772987", "url": "https://x.com/s8mb/status/2106678098506772987", "text": "You can now binge watch Cheeky Pint on your @united flight.", "created_at": "2026-10-04T09:29:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "collision", "rt_author_name": "John Collison", "likes": 189, "retweets": 6, "media": [], "quoted": null}, {"id": "2106653248820318662", "url": "https://x.com/s8mb/status/2106653248820318662", "text": "The Atelier Missor Prometheus statue doesn’t look “off” because of its proportions, despite what many have said about it. Good thread about what the shortcomings might actually be, although I suspect it will look good IRL anyway.", "created_at": "2026-10-04T07:50:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 2, "media": [], "quoted": {"author": "AtalantaArdenM", "text": "'Canons of proportion' are talked about like some secret sauce that makes sculptures good or bad, but that's kinda BS. The Apollo Belvedere (obvious banger) is 8.25 heads high. But, Michelangelo's David (one of the best of all time) is only 6.9. \n\nThat's not what matters. https://t.co/aRy8gjRmHq"}}, {"id": "2106485478820028524", "url": "https://x.com/s8mb/status/2106485478820028524", "text": "It isn’t credible to blame the rise in electricity prices since the mid-2000s on overseas conflicts. Industrial electricity prices rose by 30% in inflation-adjusted terms between 2010 and 2020 alone – ie between Iraq and Ukraine – while the wholesale price of gas fell.\n\nIndustrial electricity prices more than doubled between 2000 and 2020 while wholesale gas prices, even pre-Covid, had dropped by the end of that period to almost where they were at the start of it.", "created_at": "2026-10-03T20:44:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 315, "retweets": 62, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTu9XzpWsAAc01z.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTu9XzsWAAAJwDt.jpg"}], "quoted": {"author": "andyburnham", "text": "I want to be honest about how we’ve got to a place where British billpayers are paying some of the highest energy costs in Europe.\n\nOver the past 40 years, we’ve given up control of our necessities, outsourced our essentials and privatised the basics. Water, transport, housing. And of course, energy.\n\nNow the public are paying the price. We haven’t invested in the infrastructure we need. Conflict overseas has pushed up energy costs and it’s hurting our businesses and families.\n\nThat’s why we need to take back greater control of our energy system.\n\nThis week, I announced Great British Grid, which will speed up connections and push down bills.\n\nWe’re also giving mayors, local leaders and communities a stronger role. With funding for People’s Power projects, communities will be able to build solar panels on libraries and town halls, hydro schemes in rivers or publicly owned windfarms on local land.\n\nBut it’s not just energy we need stronger public control over. It’s also water, housing, transport and care.\n\nSo we’re repealing the ban on public ownership of water companies. We’re building more council homes than this country has seen since the end of World War Two.\n\nWe’re reforming the leasehold system so families aren’t squeezed for every penny. And we’re opening up home ownership for first time buyers who can’t rely on the bank of mum and dad.\n\nThis week I also announced my determination to introduce a National Care Service, to put people above profit and to give pensioners peace of mind.\n\nTogether, we’ll rewire the country from top to bottom so that it works for all people in all places.\n\nThat is the only way to put Britain back on the right path. It’s the only way to put power back in people’s hands. And it’s the only way we will bring hope again."}}, {"id": "2106433102512001399", "url": "https://x.com/s8mb/status/2106433102512001399", "text": "I think London pop-ups are just going to have to be a yearly occurrence from now on. Amazing day—thank you to the hundreds of you who came to hang out!\n\n(Particularly to the gaggle of babies in the corner who came dangerously close to unionizing)❣️🤭📚 https://t.co/01dwZXlfOq", "created_at": "2026-10-03T17:16:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 187, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsMXAAAeAxN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsFW0AAiKOc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsNW8AATidT.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsKX0AAVPYR.jpg"}], "quoted": null}, {"id": "2106410010750357963", "url": "https://x.com/s8mb/status/2106410010750357963", "text": "As a current enjoyer of Poor Charlie’s Almanack, catching the @stripepress London Popup was an indulgence.\n\nThank you for the lovely curation &amp; free coffee. More please!\n\nBig fan. https://t.co/43U4peQypo", "created_at": "2026-10-03T15:44:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "czamaru", "rt_author_name": "CZA +", "likes": 78, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtKULyXUAEZJCi.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKULzW8AA2tcl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKUL2WQAE5frI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKUL2XcAA7CFM.jpg"}], "quoted": null}, {"id": "2106366208031539551", "url": "https://x.com/s8mb/status/2106366208031539551", "text": "1930s France imposed a 40-hour maximum working week, which led its factories to being much less productive than those in countries like Britain without these limits. Without this, France’s military might have been able to hold back the Germans in 1940. https://t.co/nDGAo2P0x9", "created_at": "2026-10-03T12:50:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 474, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtQ5pBXMAAde0H.jpg"}], "quoted": {"author": "jujulemons", "text": "Listen up, freaks: we’ve got AI, labour law, being rude about the French, and the Nazis ALL IN ONE piece. What else could you ask for?\n\nNew essay with @DuncanMcClement on what the fall of France in 1940 can teach us about policy design, second-order effects and national decline.\n\nhttps://t.co/flAm2SS4K3"}}, {"id": "2106333207817793700", "url": "https://x.com/s8mb/status/2106333207817793700", "text": "For one day only - Stripe Press at Hanbury Hall, just between Brick Lane and Spitalfields! https://t.co/RxadtVa0yf", "created_at": "2026-10-03T10:39:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 234, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTsy4nmXEAAlOJI.jpg"}], "quoted": null}, {"id": "2106796164284657677", "url": "https://x.com/s8mb/status/2106796164284657677", "text": "this chart should be the death knell for the 2010s tech left whose theology compelled them to argue that Uber was some sort of labor law arbitrage that created no productivity benefits. the truth is that it created a far larger market than taxis ever had. the industrialists win", "created_at": "2026-10-04T17:18:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4857, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106793527372038350", "url": "https://x.com/s8mb/st ng other people’s rules if it makes us richer. I was pro taking the EU’s rules in 2016 and I am pro taking America’s rules now if it allows us to access significantly more advanced AI models than the rest of the world.", "created_at": "2026-10-03T17:28:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthistorynews", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106412693829955770", "url": "https://x.com/s8mb/status/2106412693829955770", "text": "@Nicolas_Colin @atlanticesque It is the centre of an important world though. So many people, companies &amp; investors worldwide whose lives revolve around it. People there can be insular for a reason, like how Americans can afford to be ignorant of the ROTW in a way the ROTW can’t be ignorant of America.", "created_at": "2026-10-03T15:54:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Nicolas_Colin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106383711952376216", "url": "https://x.com/s8mb/status/2106383711952376216", "text": "@SMatsiutsia Don’t think so!", "created_at": "2026-10-03T13:59:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SMatsiutsia", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106383657892266280", "url": "https://x.com/s8mb/status/2106383657892266280", "text": "@bluegod 4pm!", "created_at": "2026-10-03T13:59:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bluegod", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106085827310911670", "url": "https://x.com/s8mb/status/2106085827310911670", "text": "@JacobMalhotra I think the confusion is intentional. It's easily resolved by defining the terms but nobody does in these debates, ever.", "created_at": "2026-10-02T18:16:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JacobMalhotra", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106082854384144671", "url": "https://x.com/s8mb/status/2106082854384144671", "text": "@arthur_spirling Indeed. And anyone who was truly interested in the truth of the matter would take care to clarify their terms and distinctions explicitly, which nobody in this debate ever does, because the lack of definition is the point!", "created_at": "2026-10-02T18:04:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthur_spirling", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106036559275606325", "url": "https://x.com/s8mb/status/2106036559275606325", "text": "@Brendan_McCord Big mistake, Luke's showing up in bespoke WW Chan.", "created_at": "2026-10-02T15:00:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Brendan_McCord", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106001682605969648", "url": "https://x.com/s8mb/status/2106001682605969648", "text": "@DB8897 Yes, it's not about saving money!", "created_at": "2026-10-02T12:41:43+00:00", "author_handle": "s
