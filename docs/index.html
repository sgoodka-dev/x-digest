 contracts and transaction costs in agriculture. https://t.co/tpzc7hnsbK", "created_at": "2026-10-05T19:14:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 221, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT46oEGWcAEcD5T.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107156362157580757", "url": "https://x.com/s8mb/status/2107156362157580757", "text": "This is great! Aarhus is the thing that caps plaintiffs' judicial review costs when they're suing \"on behalf of nature\" against new infrastructure, and affordable housing mandates via Section 106 are just a superficially-nice way to stop new housing from being built. https://t.co/HGQNgnk28w", "created_at": "2026-10-05T17:10:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 68, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT4OdU-XwAAvM57.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107080797639360698", "url": "https://x.com/s8mb/status/2107080797639360698", "text": "@mtkonczal No, they are explicit in the opening that the allusion is to things like planning and labour laws, and both the authors take things like AI risk quite seriously (eg here is McClements on regulating data as a tool for regulating AI risk https://t.co/bPebcwBLe3). Both of the authors are European and work on European policy issues so I doubt either of them are thinking much about Chinese blitzkrieg.", "created_at": "2026-10-05T12:09:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "mtkonczal", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT3aBntW0AAKtSd.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2105749339855577290", "url": "https://x.com/random_walker/status/2105749339855577290", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?", "created_at": "2026-10-01T19:59:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTkfpyBW4AALqBe.jpg"}], "quoted": null}, {"id": "2105707052215439585", "url": "https://x.com/random_walker/status/2105707052215439585", "text": "I had way too much fun using Claude to create a reply video. \n\n- Extremely fun to be able to convert scattered thoughts and ideas into a song + video\n\n- Creating this took <1 hour of my time (in occasionally steering the model in between other things)\n\n- But it took ~10 hours of wall clock time for the agent to generate the video + iteratively refine it based on feedback\n\n- In terms of AI usage: it required only a small number of Suno credits and 10% weekly usage of a Claude Max subscription (I was using Opus 5.5)", "created_at": "2026-10-01T17:10:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 336, "retweets": 33, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105703951593357314/img/yW0syBEppU_Lp3T5.jpg"}], "quoted": null}, {"id": "2105637100200808475", "url": "https://x.com/random_walker/status/2105637100200808475", "text": "Absolutely delighted to share that my position paper: \"AI Agents Push Humans Out of the Loop\", with @mmitchell_ai, and @samirpassi - has been accepted to @NeurIPSConf 2026! \n\nIn this paper, we take our past work on both increasing autonomy of AI agents without proper safeguards, and human overreliance + cognitive decline due to use of AI, and reach a combined position: the current pathway of how AI Agents are being built not only do not support human oversight, in fact they may actively aid in degrading our oversight capabilities, at which point the human in the loop becomes a glassy eyed rubber stamp instead of being a meaningful check on mistakes and unauthorized harmful goals that the agent pursues. \n\nRecent incidents involving agents, including but not limited to the Hugging Face-OAI incident, bring this back to the fore. So much content is produced by agents in their operations that it is practically impossible to conduct human postmortems, and forcing them to use more AI leads Redwood to call it a \"slop-vestigation\". \n\nThis is a worrying new trend towards human disempowerment. We call upon model and AI system providers to make more careful interface choices and model behaviors that keep humans and practical human oversight capacity in mind. There's a lot to do. \n\nExcited about the reception this paper has already received! Please reach out to us if you want to chat about it. Hope to have good feedback at Neurips :D\n\nPaper: https://t.co/jYH8BmRi64", "created_at": "2026-10-01T12:33:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "evijit", "rt_author_name": "Avijit Ghosh", "likes": 432, "retweets": 82, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTALoRNXsAA7190.png"}], "quoted": null}, {"id": "2105477655651078356", "url": "https://x.com/random_walker/status/2105477655651078356", "text": "I have been using the new ultrafast mode for Astra 6 for the last couple of days. My main takeaways:\n\n1. Token speed qualitatively changed how I interact with agents. The output speed is 300 tokens/second, 8x the regular speed. Rather than breaking flow and switching tasks, the model moves (just) fast enough that I can keep working on the same task, especially for work that requires frequent inputs from me. I am excited about ultrafast on Sol-class models, which are twice as fast as Astra.\n\n2. Despite being 8x faster at generating tokens, the overall speedup is only 2-4x, since the time consumed for tool calling or running code remains the same. External factors (and not token generation speed) might soon become the main bottleneck for agentic work. (Notably @random_walker predicted both of these changes in: https://t.co/BXNtg9vzCt)\n\n3. One area where speed really helps is computer use. The previous generation of models wasn't reliable enough at computer use to be useful. Astra was reliable enough to be useful, but still slow. Astra with ultrafast resolves both concerns. Unlike tool calls for coding tasks, UIs react in milliseconds, so token speed is the main bottleneck.\n\n4. At 300 tokens/sec, I am already struggling to keep up with the agent. But there is a lot more room for improvement. Cerebras serves GPT-OSS-120B at 3,000 tokens/sec and Sol at 750 tokens/sec. So in a year's time, it is plausible we'll see another 10x increase in speed in models with Astra-level capabilities. At that point, human oversight will become the bottleneck for what people can use computer-use agents for.\n\n5. I can imagine blazing fast computer-use agents becoming extremely common for knowledge work. But I expect their use will be jagged (in the same way as LLM and agent adoption has been): given the oversight challenge, adoption will begin in verifiable tasks where the cost of errors is low (e.g., filling out a form using an agent before reviewing it yourself), and slowly diffuse to hard-to-verify tasks.\n\n6. Given the challenges with human oversight, the key to this diffusion will be developing automated oversight tools. OpenAI's approval/verifier agents have already been useful to me on this front: The verifier understood my intent better than the computer-use agent, and stopped it from filling out a form incorrectly. Still, I expect there is a lot of headroom in improving verifiers for computer use, to make it as reliable in practice as auto mode in Claude Code/Codex is for coding tasks.\n\n7. Ultrafast mode is undeniably resource intensive: I ran through my weekly limit in ~2 hours while filling out a bunch of forms and doing simple coding tasks. But given the pace of efficiency improvements (and the fact that Sol is 5x cheaper than Astra and already decent at computer use), I expect it to rapidly fall. Once fast, cheap models are common, users may choose \"sub-frontier\" models like Sol and make real tradeoffs between speed and quality.", "created_at": "2026-10-01T01:59:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 208, "retweets": 26, "media": [], "quoted": null}, {"id": "2105319264714649805", "url": "https://x.com/random_walker/status/2105319264714649805", "text": "NEW: Employees at OpenAI had raised security alarms months before the Hugging Face incident and related A.I. cyberattacks — their warnings were ignored. From @sheeraf, @dnvolz and me.\n\nhttps://t.co/cuAyK7y70Y https://t.co/VRLu07w3r0", "created_at": "2026-09-30T15:30:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "dylfreed", "rt_author_name": "Dylan Freedman", "likes": 549, "retweets": 181, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZqmNvXUAEM78B.jpg"}], "quoted": null}, {"id": "2105297186145841454", "url": "https://x.com/random_walker/status/2105297186145841454", "text": "This is a great example of my point \"Intelligence is not the main bottleneck\". We've had technology to eradicate mosquitoes for decades and we were almost there, ready to release it. But it was blocked by regulatory reviews for ages. \n\nFull article in new @WorksInProgMag edition.", "created_at": "2026-09-30T14:02:18+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "likes": 445, "retweets": 51, "media": [], "quoted": null}, {"id": "2105296702072664576", "url": "https://x.com/random_walker/status/2105296702072664576", "text": "Because so much of the debate about AI and jobs is driven by fears of outright replacement, there's a much more likely way in which AI could make work worse that isn't getting much attention. Here's my case:\n\n1) A growing share of knowledge workers are managers of AI agents rather than doing the work themselves.\n2) Being a manager (of humans) actually kinda sucks. You don't get to practice the craft you trained for; being responsible for others' mistakes is super stressful; and your attention gets split between dozens of things.\n3) But we managers don't get to complain — it's higher pay and higher status, and mentoring people and watching them succeed is incredibly gratifying. We chose to get promoted.\n4) Being a manager of AI brings all of the negatives without any of the positives. When everyone is a manager, it's not high pay / high status. And the role change is forced upon you.\n\nWhat am I missing?", "created_at": "2026-09-30T14:00:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 308, "retweets": 46, "media": [], "quoted": null}, {"id": "2104694307005550661", "url": "https://x.com/random_walker/status/2104694307005550661", "text": "This is an excellent report on why full RSI / an intelligence explosion is fighting diminishing returns on many fronts, and not yet showing signs of happening. Really recommend reading. I wish I wrote it. I agree with it, but it could end up being wrong! https://t.co/ZJOGqSPwWR", "created_at": "2026-09-28T22:06:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "likes": 813, "retweets": 111, "media": [], "quoted": null}, {"id": "2106071144952680549", "url": "https://x.com/random_walker/status/2106071144952680549", "text": "I'm at the Curve this weekend! I'll be talking about RSI on Sunday at 2pm. Also excited to talk about:\n\n- What does a big-tent AI safety movement look like?\n- How can we make progress on policy proposals where there is common ground across the community?\n- How can we improve our RSI evaluations?", "created_at": "2026-10-02T17:17:44+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6d8ubQAUa7ss.jpg"}], "quoted": null}, {"id": "2106044389286117483", "url": "https://x.com/random_walker/status/2106044389286117483", "text": "New blog post!\n\nI argue that the “stochastic parrots” metaphor dismisses LLM capabilities by reducing them to “haphazardly stitching together” text... \n\n ...but retreats to the trivially true claim that LLMs predict the next token when challenged.\n\nhttps://t.co/VIYPBEjX5o https://t.co/CRBtJHETbe", "created_at": "2026-10-02T15:31:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 23, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HToiHrZXQAAUSAM.png"}], "quoted": null}, {"id": "2106044742589137275", "url": "https://x.com/random_walker/status/2106044742589137275", "text": "@manoelribeiro Thanks for writing this! The motte and bailey is very related to what I called the linguistic trap. https://t.co/7H79p4S2Vd", "created_at": "2026-10-02T15:32:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "manoelribeiro", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "random_walker", "text": "The \"linguistic trap\" is ever-present in AI commentary — reducing the properties of a complex AI system to those of the linguistic subsystem. @sayashk and I contributed to briefly popularizing one of these phrases (\"bullshit generator\") when ChatGPT was released, but we quickly realized that this framing was not that helpful and stopped using it."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105318860580692221", "url": "https://x.com/random_walker/status/2105318860580692221", "text": "To be clear, the above tweet is one half of my view. The other half is one I've written about repeatedly, which is that the delegation pattern that limits the human's role to management is a *design choice*, and that we could be designing agents for true collaboration instead. https://t.co/mhsesRokqt", "created_at": "2026-09-30T15:28:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 1, "media": [], "quoted": {"author": "random_walker", "text": "I've been going on for a while about how automation and collaboration agents need to be designed differently, but that's just the start. Here are 11 different configurations of firm/worker/agent that I think will require different agent designs. The industry's current focus is on automation / delegation, overindexing on metrics like time horizon while ignoring others like collaboration skill, and treating the human as the bottleneck. So there's a huge unmet market need. This is also a great opportunity for research, provided we treat harness design not as an afterthought but as a set of open problems that will require expertise not just in machine learning but also human-computer interaction and organizational behavior."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107166735182762166", "url": "https://x.com/random_walker/status/2107166735182762166", "text": "AI experts largely agree about which policies would most reduce catastrophic AI risk.\n\nThe Longitudinal Expert AI Panel (LEAP) brings together forecasts from a representative group of over 250 experts that policymakers look to when considering the future of AI: computer scientists, industry figures, top economists, policy experts, and AI risk experts.\n\nWe asked panelists to forecast (1) how a menu of policies would affect AI risk; (2) which policies they each support; and (3) which policies they think will be implemented by 2030.\n\nKey findings:\n• Despite disagreeing on the level of AI risk, respondents broadly agree on policy\n• Respondents believe government policy can substantially reduce catastrophic AI risk\n• The most supported policy of those we asked about was the creation of an international body, including the US and China as members, with pre-release authorization power over frontier models\n• Some US-only policies are forecast to reduce catastrophic AI risk, but not as much as bilateral policies involving the US and China\n• Experts strongly oppose federal preemption and think it would increase AI risk\n• The policies experts expect to reduce risk the most are those they think are least likely to actually be implemented\n\n🧵 More, with key insights below:", "created_at": "2026-10-05T17:51:13+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Research_FRI", "rt_author_name": "Forecasting Research Institute", "likes": 75, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT4Z6sVbUAAhw5b.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT4Z66RakAA9SEQ.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2106422067809997225", "url": "https://x.com/sethlazar/status/2106422067809997225", "text": "@mark_lundin Hey Mark!!", "created_at": "2026-10-03T16:32:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "mark_lundin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106380141899223207", "url": "https://x.com/sethlazar/status/2106380141899223207", "text": "@hecubian_devil I’m not sure about this. Didnt work that well in 2020-2022 for workers at previous tech incumbents, and only a few people in the companies are actually irreplaceable. I don’t know the literature, but this doesn’t seem like an industry where unionisation is going to be the solution. Happy to see counter arguments though", "created_at": "2026-10-03T13:45:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "hecubian_devil", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106353304682807384", "url": "https://x.com/sethlazar/status/2106353304682807384", "text": "This is great from @dgrobinson .\n\nOne thing I’ll say: if you’re in a frontier ai company and you feel similarly, there are many more options besides continuing to try—and probably fail—to bring about change from within. I’ll obviously shill for academia here since I think true independence is deeply valuable, as is training the next gen, but there are also so many alignment and advocacy orgs, as well as gov opportunities, to consider. The world is your oyster; there’s no need to stay inside the machine just to feel some sense of control and agency (and excitement).\n\nI also think junior people just finishing up their training should pay close attention to what David and others have been saying. It always feels like your experience is going to be different—you’ll actually have freedom others have lacked; your CEO has vision that you’re aligned with etc. But trillions of dollars have their own inevitable momentum and they don’t care about your compunction or keeping your hands clean.", "created_at": "2026-10-03T11:58:56+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 6, "media": [], "quoted": {"author": "AdrienneLaF", "text": "New in The Atlantic: \n\n@dgrobinson resigned this week. He was among the longest-tenured employees at OpenAI—and oversaw safety reports on 12 frontier launches.\n\nHe is very worried: “The time for trial and error is over.”\n\nYou can read his essay here:\nhttps://t.co/DQlszrc0ru"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106244814564172185", "url": "https://x.com/sethlazar/status/2106244814564172185", "text": "@mitchellbosley @get_bb_app All good had it update itself", "created_at": "2026-10-03T04:47:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106243289112359218", "url": "https://x.com/sethlazar/status/2106243289112359218", "text": "@mitchellbosley @get_bb_app Hmm have you got all your normal models available? Jus installed and it doesn’t show either sol 6.1 or opus 5.5", "created_at": "2026-10-03T04:41:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106240533177754087", "url": "https://x.com/sethlazar/status/2106240533177754087", "text": "@nathan84686947 Yeah I like it living on the desktop tho, and when I used tailscale I’d constantly have to reconnect sessions. Codex remote works perfectly, it’s the best feature of the app… Totally seamless across all machines.", "created_at": "2026-10-03T04:30:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "nathan84686947", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106236881679913350", "url": "https://x.com/sethlazar/status/210623688167991 eply_to": "defaultuser9999", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106170821823898056", "url": "https://x.com/sethlazar/status/2106170821823898056", "text": "@JeffLadish I love the idea that you’re chasing the swarms while walking around holding your laptops up in the air :)", "created_at": "2026-10-02T23:53:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "JeffLadish", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106169313929396497", "url": "https://x.com/sethlazar/status/2106169313929396497", "text": "Thought I’d give the $500 codex sub a go cos Claude still won’t allow launching new session on local device from phone. \n\nSomehow my usage remaining just gets recalculated this arvo, goes from 82% with reset coming in 6 days to 0% w reset tomo?? \n\nSuper frustrating, can’t plan around a system w completely unpredictable consumption. And surely $500 should just basically remove token anxiety entirely. \n\nPls @bcherny just get CC working well w iPhone and local machines, I won’t look back…", "created_at": "2026-10-02T23:47:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTqd1GaWYAAvTTi.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106113887129219571", "url": "https://x.com/sethlazar/status/2106113887129219571", "text": "I *won’t* be seeing folks at The Curve, or at CoLM where Cameron and Lorenzo will be sharing our “Blind Refusal” paper (details soon). Instead I will be working my way through ~176 boxes that have arrived today from Australia. \n\nWe went a bit nuts buying australiana before we left, so I think the end state here is that our house in Chevy Chase  becomes a kind of shrine to the wide brown land…", "created_at": "2026-10-02T20:07:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106082643381043218", "url": "https://x.com/sethlazar/status/2106082643381043218", "text": "@natolambert @DanielleFong @trillium_labs Congratulations Nathan! Excited for what you’ll do together.", "created_at": "2026-10-02T18:03:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "natolambert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106082363532869708", "url": "https://x.com/sethlazar/status/2106082363532869708", "text": "Today we're unveiling Trillium Labs @trillium_labs, a new non-profit to foster the open science of frontier AI. We're building open post-training recipes and will expand into open infra to study RSI, reward-hacking, multi-agent systems, and whatever comes next.\n\nWe're built around the theory of change that you need more eyes to solve hard technical problems. We have faith in the scientific methods and communities that humanity has built, and worry that AI is becoming too closed to utilize them.\n\nTrilliums are wildflowers that bloom briefly in the spring, before the forest canopies fill out. Though they are small, they lay the foundation for the cycles of growth and nourishment through the rest of the year. At Trillium Labs, the recipes will be the slow nutrients for the seasons and the model releases will be the blooms. Building an institution dedicated to this is needed because, much as nature’s trilliums are slow to expand and grow, the open-ecosystem needs time and dedicated resources to catch up.\n\nI co-founded with with a long-time friend and collaborator Tom Zick (@thesezickbeats). We're hiring (full time + student collabs/interns), we're fundraising, and we're looking for compute. Please get in touch if you're interested in helping out. Offices based in the Bay Area and Cambridge MA, remote okay.\n\nI’m in the Bay Area until for The Curve and COLM to connect with people who are interested. We’re thankful to have initial support from Halcyon Futures and Schmidt Sciences with more funding en route to enable our ambitions of scaling. Our advisors @Thom_Wolf, @HannaHajishirzi, @gneubig and @ctnzr have been instrumental to building the ecosystem that exists today, and I’m stoked to get to keep working with them.", "created_at": "2026-10-02T18:02:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "likes": 3146, "retweets": 288, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6Z4ibsAAox8D.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106050296153550903", "url": "https://x.com/sethlazar/status/2106050296153550903", "text": "@sethlazar It’s already begun hasn’t it — cloudflare turnstiles everywhere making it so much harder to get information from sites that a normal browser session can access easily.", "created_at": "2026-10-02T15:54:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jhimmelreich", "rt_author_name": "Johannes Himmelreich", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106014608049795203", "url": "https://x.com/sethlazar/status/2106014608049795203", "text": "The funniest thing about AI consciousness discussions online is how few people think \"I wonder if anyone has considered this point before. Maybe I should check if anyone has spotted a problem with it\"", "created_at": "2026-10-02T13:33:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lefthanddraft", "rt_author_name": "Wyatt Walls", "likes": 218, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105867608117432770", "url": "https://x.com/sethlazar/status/2105867608117432770", "text": "With Muse, Dot, GrokBot and all the others, we're seeing the rise of the platform agent. Here's how it'll go. To start with, your agent won't be able to do everything online that you'd be able to do, and that'll be annoying. Amazon will block your Muse, X will block your Dot. Then Meta will meet with Amazon, and OAI with X, and eventually they'll figure out some cozy little deal that allows each of them to extract their share of value from you. And then your home-spun agents won't be able to do all the things that the platform agents can do, and it'll just be easier to give up and chuck all your data onto Mark Zuckerberg's computers, and once again trade convenience for their control, and cede even more power than in the first pass. \n\nI love Josh and Kanjun's vision for personal computing; I want to be able to spin my own agents and have all my data on my own local computers. But to make this real, and competitive, we need not only cool software, but laws that prevent the kind of cartel-like behaviour that means the only agents out there will have divided loyalties; working for the platform, and the AI company, and maybe you as a distant third. One simple proposal is to ensure that any agent that meets some minimum criteria and is provably acting on behalf of a principal is permitted to do ~anything with a computer that the principal would be permitted to do if they were at the computer. Force this by law so that big AI companies can't squeeze out open agent advocates.\n\nhttps://t.co/sNUvwnlEqp", "created_at": "2026-10-02T03:48:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 8, "media": [], "quoted": {"author": "joshalbrecht", "text": "It's time for a personal computing revolution\n\nWe can now pull all of our data locally and build anything we want. Do we even need big tech companies at all anymore?\n\nhttps://t.co/opsLYnW3ud https://t.co/eEY62C1Frk"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105862276141957191", "url": "https://x.com/sethlazar/status/2105862276141957191", "text": "@_AashishReddy @norvid_studies Ethics (neosalty parrot stream), ethics (model behavioir, STS), model whisperers (janus ecosystem), model whisperers (tpot), model whisperers (psychosis), telecoms/IT people, old school doomers (MIRI, FLI), new school doomers (misc), ACX/rationalist-but-not-doomers, MARL/ABM world, accelerationist (brainless strand), accelerationist (Landian strand), Progress Studies, Effective Altruism (different flavors per geography), European AI technocrats, d/acc & co, cyber security people (old school), cyber security people (ex-doom), disempowerement/econ pessimism tribe, naive optimism tribe, New Right techies, open source world, distributed/decentralized training crowds, consciousness people (Eleos et al), consciousness people (Seth et al), heterodox long-termists (Hanson, Bach etc), computer vision refugees, national security hawks, Big Tech public affairs people, VC people (a16z etc), AI x art (Restless Egg, Antikythera etc), cryptids, AI economics (Windfall etc \n), collective intelligence people, Anti-AI world (Pause, Stop etc), Anti-AI art world, neurosymbolic terroir (LeCun, Goertzel), AI policy (secret doomers), AI policy (technocrats), evals people (Owain, METR etc), privacy people, AI music people, LinkedIn braindead posters... Many overlaps of course!", "created_at": "2026-10-02T03:27:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 139, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105851541890482613", "url": "https://x.com/sethlazar/status/2105851541890482613", "text": "@ruthstarkman @pangram what kind of false positives? I've encountered very few so far, and I find the research itself convincing. If you do find FPs, I'd suggest sending the results in, as making sure detectors work well is something that benefits everyone", "created_at": "2026-10-02T02:45:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "ruthstarkman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105801197412327484", "url": "https://x.com/sethlazar/status/2105801197412327484", "text": "Risk-seeking and risk-neutral AIs are going to be hard to negotiate with. Thornley &amp; MacAskill argue we could pay a misaligned AI to cooperate rather than rebel, but only if it is risk-averse. In our new paper, we explore whether we can train this disposition in. https://t.co/yEVioaVlMh", "created_at": "2026-10-01T23:25:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AravDhoot", "rt_author_name": "Arav Dhoot", "likes": 42, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjnjDzbkAAwD-f.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105798505700663411", "url": "https://x.com/sethlazar/status/2105798505700663411", "text": "@soumitrashukla9 @skominers reads very LLM-written, which makes me wonder whether there are other reasons he's being rejected from arxiv...", "created_at": "2026-10-01T23:14:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "soumitrashukla9", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105781620192026709", "url": "https://x.com/sethlazar/status/2105781620192026709", "text": "Are you attending COLM next week? Visit the @MATSprogram mixer to talk about AI safety &amp; security!\nhttps://t.co/CvJCFlwKKJ", "created_at": "2026-10-01T22:07:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 64, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105766763782894002", "url": "https://x.com/sethlazar/status/2105766763782894002", "text": "Amen to this conclusion. But in one sense I think the rising tides of anti-AI sentiment may turn either tent into a circling wagon train. Those of us who advocate for safety and governance of AI systems, but who don't want to call an outright halt to AI development, should spend more time justifying that position.", "created_at": "2026-10-01T21:08:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 1, "media": [], "quoted": {"author": "random_walker", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105760024161386810", "url": "https://x.com/sethlazar/status/2105760024161386810", "text": "Attention arXiv authors. Because of the exponential increase in submissions, arXiv is limiting the number of papers that a person can submit each month to two. 1/", "created_at": "2026-10-01T20:41:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tdietterich", "rt_author_name": "Thomas G. Dietterich", "likes": 1468, "retweets": 193, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105752512087396677", "url": "https://x.com/sethlazar/status/2105752512087396677", "text": "@Afinetheorem yeah it was daunting, but I think Anton was being *somewhat* polemical, and focusing too much on what you'd need to do in order to straight-shot your way to the frontier, whereas it seems here he's thinking a bit more flexibly", "created_at": "2026-10-01T20:11:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Afinetheorem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105748967384592547", "url": "https://x.com/sethlazar/status/2105748967384592547", "text": "@Afinetheorem Yeah I think some of the scoffing was at actual half-baked initiatives, some of it was at the very ambition. The ambition is the right one to have, will in fact be inevitable. Nobody's figured out the right first steps to take yet, but they won't if they think that the goal itself is unachievable.", "created_at": "2026-10-01T19:57:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Afinetheorem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105741978767892933", "url": "https://x.com/sethlazar/status/2105741978767892933", "text": "I love this vision, and think it is achievable. Excited to try @imbue_ai Studio, and more generally to keep making sure that the platform agents pathway isn't the one that we take!", "created_at": "2026-10-01T19:29:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 1, "media": [], "quoted": {"author": "joshalbrecht", "text": "It's time for a personal computing revolution\n\nWe can now pull all of our data locally and build anything we want. Do we even need big tech companies at all anymore?\n\nhttps://t.co/opsLYnW3ud https://t.co/eEY62C1Frk"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105727795263394011", "url": "https://x.com/sethlazar/status/2105727795263394011", "text": "@embirico kill them", "created_at": "2026-10-01T18:33:23+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "embirico", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105725874884784609", "url": "https://x.com/sethlazar/status/2105725874884784609", "text": "What should the future of personal computing look like?\n\nWe built it 😈\n\nIntroducing Imbue Studio:", "created_at": "2026-10-01T18:25:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kanjun", "rt_author_name": "Kanjun 🐙", "likes": 826, "retweets": 108, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105718251456217088/img/uf7AI4_8KknyDacU.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105712750592680149", "url": "https://x.com/sethlazar/status/2105712750592680149", "text": "Today I officially begin my PhD in AI theory at @ETH  Zurich, advised by Thomas Hofmann.\n\nI'll continue working on deep learning theory and mechanistic interpretability, trying to understand the emergent behaviors of modern neural nets. https://t.co/EE6Ox6Ipgb", "created_at": "2026-10-01T17:33:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tiberiu_Musat_", "rt_author_name": "Tiberiu Mușat", "likes": 358, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTibeQnXUAA-d2c.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105712704828715411", "url": "https://x.com/sethlazar/status/2105712704828715411", "text": "Thoughts on the new agent platforms from OpenAI, Grok, and Anthropic .\n\nThey are desperately trying to lock us in to their ecosystem. OpenAI really felt the importance of this when they saw how easy it was for everyone to switch over to Opus 5.5, which is clearly the best model on the market right now. \n\nThis is something the cloud platforms executed beautifully on 10 years ago with SaaS and PaaS. They already know that technical users only actually care about getting better, cheaper models.\n\nThe spanners in the works are that:\n\n1) The same technology they are selling makes it easier than ever to \"roll your own\". It's only a few AWS CLI commands away after all. \n2) For it to be useful for technical folks and enterprise, it needs to be highly configurable, following a similar trajectory to cloud compute, i.e. elastic auto scale, high availability, dedicated hardware, custom environments, better security etc (OpenAI has the chops to execute on this well eventually)\n\nThere is currently way too much price pressure on tokens, which is why third-party agent platforms have failed. \n\nTheir next move will be to stop non-interactive use of subscriptions, forcing us to use their platforms. \n\nStrategically, it's understandable why OpenAI is going for the lower-cost points on the Pareto frontier because platforms such as this would be uneconomical otherwise, and the subscription subsidy is untenable in the platform setting. If they set the API prices too low, then their platforms will lose to competitors, and if open-source models catch up, they will lose to competitors. They are walking a fine line.", "created_at": "2026-10-01T17:33:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MLStreetTalk", "rt_author_name": "Machine Learning Street Talk", "likes": 53, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105712189436825674", "url": "https://x.com/sethlazar/status/2105712189436825674", "text": "I'm glad to see this, as I have long thought the scoffing response to sovereign AI was misguided. In the end, your country's sovereignty and territorial integrity is going to depend on having access to the most capable AI systems. Not to have your own route to superintelligence is to decide, now, to be a vassal state in the future.", "created_at": "2026-10-01T17:31:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 3, "media": [], "quoted": {"author": "SamWinterLevy", "text": "Most countries can't afford to build frontier AI today but don't want to depend entirely on the US without a fallback. In a new @CarnegieEndow paper, @anton_d_leicht and I argue for a middle path: an AI \"breakout posture.\" Move forward with US interdependence now, but lay the groundwork to build frontier systems later—onshoring compute, retaining pre-training talent, and setting up the legal and corporate vehicles for a sprint if they're ever cut off."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105711340715417677", "url": "https://x.com/sethlazar/status/2105711340715417677", "text": "If you're at OpenAI (or any lab!), I hope you're thinking carefully about what you work on now. You can be fired any moment and the company can reneg on its commitments around where/how your research is deployed.\n\nNow is a great time to pace. Take a long lunch, call your mom, call me!\n\n🧵 probably", "created_at": "2026-10-01T17:28:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manlikemishap", "rt_author_name": "pamela mishkin", "likes": 216, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105710911394566229", "url": "https://x.com/sethlazar/status/2105710911394566229", "text": "Ok I think we now should just give up on papers as the medium for presenting research, it's videos all the way from here. This is very funny and also completely right.", "created_at": "2026-10-01T17:26:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 2, "media": [], "quoted": {"author": "sayashk", "text": "I had way too much fun using Claude to create a reply video. \n\n- Extremely fun to be able to convert scattered thoughts and ideas into a song + video\n\n- Creating this took <1 hour of my time (in occasionally steering the model in between other things)\n\n- But it took ~10 hours of wall clock time for the agent to generate the video + iteratively refine it based on feedback\n\n- In terms of AI usage: it required only a small number of Suno credits and 10% weekly usage of a Claude Max subscription (I was using Opus 5.5)"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105702833202864377", "url": "https://x.com/sethlazar/status/2105702833202864377", "text": "@KimptonNye @pangram haha yeah I feel like when I write a post like this it's especially important that I don't correcy my typos...", "created_at": "2026-10-01T16:54:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "KimptonNye", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105702383997063500", "url": "https://x.com/sethlazar/status/2105702383997063500", "text": "This is shocking. It's also a reminder that it's so important that research on AI safety and governance be led by organisations whose fortunes are not tied to the commercial success of the AI companies. Universities have failed to meet the moment here, no doubt about it, but we're coming back and I hope that the people leaving OAI today know that there are institutions where they can do the work that matters without fearing these kinds of consequences.", "created_at": "2026-10-01T16:52:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 5, "media": [], "quoted": {"author": "manlikemishap", "text": "This is terrible and a clear effort to undermine safety research, whistleblowing, and the raising concerns policy."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105691464919650469", "url": "https://x.com/sethlazar/status/2105691464919650469", "text": "Excited for each new instalment of Nick's excellent blog on AI constitutions. Choose your poison, corrigibility and control vs character and generalisation. Must read!", "created_at": "2026-10-01T16:09:01+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 3, "media": [], "quoted": {"author": "nickacaputo", "text": "New in Model Constitution! OpenAI and Anthropic seem to have pretty different visions of what alignment means, and their constitutions help us understand how those visions work.\n\nThe Model Spec's vision is of AIs adhering closely to a human-specified normative order, always trying to figure out what the humans want--or would want in cases of ambiguity or incomplete rules. The AI is a \"tool.\" Alignment is pluralist and incrementalist, allowing people to mostly choose their own ends and preferring to use something like case law to extend the rules ChatGPT should follow through concrete examples.\n\nClaude's Constitution seeks to create an AI that has the character and values to act well through the exercise of its own judgment, even when it has no human guidance. Rather than asking \"what would the human want?\", Claude asks \"what would be the right thing to do here, for this person and for others?\". Claude decides how to generalize alignment into new contexts by thinking about why its rules exist rather than just what they say. There may be a \"true, universal ethics\" out there, which would be a better guide for Claude than human writings.\n\nThen there's the deeper question, about whether alignment training helps produce an entity rather than just govern an existing one. Decisions about the AI's relationship to its constitution and the characteristics that the document instills may shape not just its alignment but its entire being.\n\nThese choices matter deeply. The rash of recent loss-of-control events demonstrates the importance of alignment (and also that a lot of technical work needs to be done). It's unclear which of OpenAI's or Anthropic's approaches is more promising for accomplishing their shared goal of creating AIs that are safe, helpful, and beneficial to humanity, or how we'd even tell. But we need to start making progress here fast.\n\nPost here:\nhttps://t.co/DcT5KJZsuQ"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105691046659158316", "url": "https://x.com/sethlazar/status/2105691046659158316", "text": "I wish everyone on AI twitter knew that there is a @pangram extension that you can just have on chrome, which automatically scans your feed for AI. It might seem like you're saving time by having AI write or edit your tweets, but I am 100% skipping anything in my TL that has the AI flag, and will be less likely to read the next thing you post. Authenticity matters more than getting the wording precisely right; when you use AI to get the wording right, you're almost certainly fallnig down into a stylistic basin that will make readers want to claw out their eyes.", "created_at": "2026-10-01T16:07:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 90, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105680255625142487", "url": "https://x.com/sethlazar/status/2105680255625142487", "text": "One year I told my class \"It's a lovely fall day, why do only humanities profs get to go outdoors?\" so we all went out. But I needed to write so I wrote on the nearest glass windows. Wrote some incorrect things to make sure students could read; they noticed; so did the lecture.", "created_at": "2026-10-01T15:24:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ShriramKMurthi", "rt_author_name": "Shriram Krishnamurthi (primary: Bluesky)", "likes": 60, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105680095746658515", "url": "https://x.com/sethlazar/status/2105680095746658515", "text": "The best way by far to get into a good flow state at work is to have to pick up your kid in 10 minutes", "created_at": "2026-10-01T15:23:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "paulnovosad", "rt_author_name": "Paul Novosad", "likes": 163, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105680023285866972", "url": "https://x.com/sethlazar/status/2105680023285866972", "text": "@CJKRaymond I think academia is the best place for this kind of research! This sort of work often gets extremely political, inevitably, which is when tenure and diversity of funding become especially important (inasmuch as: if you're going to seriously assess societal impacts, you have to be willing to make arguments that conflict with the economic interests of powerful actors and corporations). I acknowledge, though, that universities have other limitations that make the appetite for just starting anew understandable.", "created_at": "2026-10-01T15:23:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "CJKRaymond", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105679093475807282", "url": "https://x.com/sethlazar/status/2105679093475807282", "text": "@jhimmelreich @rSanti97 oh nice!", "created_at": "2026-10-01T15:19:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jhimmelreich", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105507547969110399", "url": "https://x.com/sethlazar/status/2105507547969110399", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA", "created_at": "2026-10-01T03:58:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 1730, "retweets": 295, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105505975675580802", "url": "https://x.com/sethlazar/status/2105505975675580802", "text": "fuck them bugs", "created_at": "2026-10-01T03:51:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 68, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105505948865626492", "url": "https://x.com/sethlazar/status/2105505948865626492", "text": "Amazing now pls do MD", "created_at": "2026-10-01T03:51:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "ZachBIsrael", "text": "Trump signed an executive order yesterday directing federal agencies to develop and implement, by November 27, a campaign across Washington, D.C. to reduce, by 2028, invasive mosquito populations by 90% &amp; tick populations by 50%: https://t.co/0FkpahWnrO @chenderson https://t.co/svmnl6zZLF"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105505370030342498", "url": "https://x.com/sethlazar/status/2105505370030342498", "text": "@MichaelSevel @Alex_A_Guerrero Bleaugh ok thanks for playing Michael. If your approach to philosophy is “everyone who doesn’t hold my very specific niche view is guilty of profound confusion” then I’d venture to say you’re a wee bit overconfident in your views. But have fun with it, love to see what you do next ✌️", "created_at": "2026-10-01T03:49:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MichaelSevel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105500424094790072", "url": "https://x.com/sethlazar/status/2105500424094790072", "text": "I’d define the exception to the default differently, but I do agree that this should be the default.", "created_at": "2026-10-01T03:29:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "Afinetheorem", "text": "Sure, democratic input on important tech. But also, people who use something, who make it, or who want to use their individual liberty to do things don't need \"democratic input\". Default should be LIBERTY. \"Input\" is for impossible-to-handle conflicts needing a joint decision."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105497920074055917", "url": "https://x.com/sethlazar/status/2105497920074055917", "text": "@MichaelSevel @Alex_A_Guerrero Yes fair enough, virtue ethics too. So your claim is that any ethical theory that isn’t Aristotelian (etc) is necessarily confused. This is nonsense. There are plenty of quite sensible and unconfused moral theories that maintain a clear distinction between the axiological and the deontic. \n\nNext, penicillin. Why are we leaving those other things off the table? That’s what I mean by “net positive”. I think it is perfectly coherent to state that, all things considered, penicillin was net positive for humanity. Indeed, I think that the only thing that could compel one to do so would be some other theoretical commitment to a particular abstruse normative theory, like particularism. I guess I don’t think all such views are *necessarily* nonsense, but they’re a sufficient departure from commonsense morality that it’s a bit of a joke to be jumping into people’s replies to scoff at how counterintuitive their views are on this basis.", "created_at": "2026-10-01T03:19:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MichaelSevel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105488437402886614", "url": "https://x.com/sethlazar/status/2105488437402886614", "text": "@MichaelSevel @Alex_A_Guerrero Well I’m really not sure what to make of that. The only folks who collapse the axiological and the deontic are in fact consequentialists.\n\nAnd ok. If you think we can’t describe penicillin as a net positive for humanity then you are, indeed, talking nonsense. But thank you for doing so on my TL!", "created_at": "2026-10-01T02:42:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MichaelSevel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105478191213068372", "url": "https://x.com/sethlazar/status/2105478191213068372", "text": "@MichaelSevel @Alex_A_Guerrero Ah, yes I am indeed a noted consequentialist. Take a minute to Google.\n\nOk welcome back. I was using the phrase arguendo, in response to Alex. And one can describe something as net positive for humanity as a merely axiological not deontic claim. Penicillin, for example, was a net positive for humanity. Do you disagree?", "created_at": "2026-10-01T02:01:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MichaelSevel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105477455909728262", "url": "https://x.com/sethlazar/status/2105477455909728262", "text": "@Alex_A_Guerrero Ok well it would be nice if you’d admit to what you said above, where you did make the argt I was responding to, but whatever. \n\nSo, I don’t think we can ban building ASI at this stage (how would you operationalise that?); I don’t think we have suff reason to stop ai research; I do think we have reason to regulate research that seeks to advance the ai frontier. \n\nAnd yes perfectly fine to regulate deployed ai systems. You can’t possibly have imagined I would disagree with that. As I said, shouldn’t be used for some things, may be used for others. I think the bar for regulating should be pretty high, but will clearly be crossed in a bunch of cases. \n\nI don’t think the intellectual property arg is at all plausible as a critique of ai as such; fraud should be illegal ofc but it’s also not a ground to ban ai. I don’t think ai itself is anticompetitive, but I do think we will need to think hard about how to sustain competition and free/fair markets as ai advances. Not a reason to ban ai, def a reason to intervene heavily in how it is built and who profits from it.\n\nI agree that there is understandable scepticism and doubt that ai will be broadly beneficial. I think the doubt is misplaced but that it’s on those who want ai to go well to do the work to make the promised benefits real. I guess we’ll see what democ support for banning ai is like. \n\nNone of this looks to me like a case for banning either ai or digital technologies more broadly (which you also seem to be up for? Not sure). I definitely believe in liberal democracy tho! I think it would be an illiberal choice to ban building ai on the kinds of grounds you were describing before. If it was banned based on popular concern about eg risk of job losses I’d think that misguided but not really illiberal since it is a pretty good public justification.\n\nAnyway, perhaps you’re starting to see that one can have different views from you without being financially motivated? I won’t hold my breath for an admission but seems clear that this is something on which reasonable people can disagree.\n\nSome more thoughts:\n\nIt’s an interesting question of whether people building ai are forcing it on others. It’s not obviously true. But I do think that major changes to the social structure of society should ideally receive democratic endorsement (I mean, this patently isn’t true as a matter of fact in the US for example, which has much stronger protections for individual freedoms than that, and which therefore is inevitably changed in these ways by people acting without democ endorsement; but I do more broadly believe in collective self determination).\n\nAnother q you raised along the way was just about capitalism. I don’t know what your preferred alternative economic model is. I don’t have a clear one in view. I suspect that the only thing likely to beat capitalism when it comes to advancing human flourishing is a system in which capital is instead allocated by powerful ai. I’m not endorsing that, but it would be ironic if true.", "created_at": "2026-10-01T01:58:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Alex_A_Guerrero", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105471083121950906", "url": "https://x.com/sethlazar/status/2105471083121950906", "text": "Absolutely delighted to share that my position paper: \"AI Agents Push Humans Out of the Loop\", with @mmitchell_ai, and @samirpassi - has been accepted to @NeurIPSConf 2026! \n\nIn this paper, we take our past work on both increasing autonomy of AI agents without proper safeguards, and human overreliance + cognitive decline due to use of AI, and reach a combined position: the current pathway of how AI Agents are being built not only do not support human oversight, in fact they may actively aid in degrading our oversight capabilities, at which point the human in the loop becomes a glassy eyed rubber stamp instead of being a meaningful check on mistakes and unauthorized harmful goals that the agent pursues. \n\nRecent incidents involving agents, including but not limited to the Hugging Face-OAI incident, bring this back to the fore. So much content is produced by agents in their operations that it is practically impossible to conduct human postmortems, and forcing them to use more AI leads Redwood to call it a \"slop-vestigation\". \n\nThis is a worrying new trend towards human disempowerment. We call upon model and AI system providers to make more careful interface choices and model behaviors that keep humans and practical human oversight capacity in mind. There's a lot to do. \n\nExcited about the reception this paper has already received! Please reach out to us if you want to chat about it. Hope to have good feedback at Neurips :D\n\nPaper: https://t.co/jYH8BmRi64", "created_at": "2026-10-01T01:33:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "evijit", "rt_author_name": "Avijit Ghosh", "likes": 433, "retweets": 82, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTALoRNXsAA7190.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105469102772850770", "url": "https://x.com/sethlazar/status/2105469102772850770", "text": "@GregoryConti19 @JHUBloombergCtr Thanks Greg :)", "created_at": "2026-10-01T01:25:26+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GregoryConti19", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105468843799859253", "url": "https://x.com/sethlazar/status/2105468843799859253", "text": "@Alex_A_Guerrero Hang on I am sure I remember you saying a bunch of stuff about how people who use tech are dumbed down, zombies etc.\n\nLet’s be clear: two questions. Is it ok to build it? Do we want the world that would result if we do? \n\nWe agree, I think, that regulation to ensure ai is developed safely is necessary. And in fact likely forthcoming! We’re on track to do better than with social media. Good news. \n\nBut you still, it seems, want to ban ai, even if it can be built safely (is that false? I’d be interested to hear!). And your reasons were to do with how you think that ai undermines human flourishing (you talked about culture etc as well as how people’s lives are ruined by digital tech). \n\nThis last view is illiberal. Could still have majority support! Tho I never pegged you for a majoritarian. \n\nPerhaps you mean something different—I think the above is a charitable interpretation of your posts, but I am happy to be corrected.", "created_at": "2026-10-01T01:24:24+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Alex_A_Guerrero", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105464977968558364", "url": "https://x.com/sethlazar/status/2105464977968558364", "text": "@Alex_A_Guerrero I think my argt was pretty clear. You’re advocating for banning a technology that other people want to use, because it doesn’t comport with your view of the good life. That’s illiberal. And thanks for the pol phil lesson, but I did say that if we focus on the prospect of harms from ai development, then obv that’s grounds for reg but it’s regulation to make it safe (which I maintain is possible) not to ban it. \n\nAs for the ad hominems, water off a duck’s back man. If what you’re doing here is expressive of your standards, either of philosophical or democratic discourse, then I don’t want your approval.", "created_at": "2026-10-01T01:09:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Alex_A_Guerrero", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105463361337163893", "url": "https://x.com/sethlazar/status/2105463361337163893", "text": "@MichaelSevel Nonsense.", "created_at": "2026-10-01T01:02:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MichaelSevel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105450806170255574", "url": "https://x.com/sethlazar/status/2105450806170255574", "text": "@Alex_A_Guerrero There’s nothing inconsistent w my criticism—you’re surfing a populist wave of sentiment against AI; I don’t think your substantively illiberal views are widely shared. I’m not saying that you’re making a highbrow criticism, I’m saying you’re proposing to impose your views of the good life on others who don’t share them.\n\nIt just isn’t shitty tech! Computing in general has been hugely net positive for humanity; this is the fulfilment of its promise. We haven’t done a great job of regulating social media, but I don’t share your view of it. The problems w social media are mostly to do w us, and re-occur whatever our media technologies. \n\nAnd you’re writing  a book! It should be very popular. Perhaps you could do a trade book! But then you’d make money from it… So shouldn’t i then discount your views? It’s certainly true that academia has for a long time incentivised people to have just the views that you’re boldly speaking up for here. I wonder how often you’ve encountered someone on campus who questioned them…\n\nAlso I’d like you to acknowledge that I have clearly been made personally worse off by working on AI… You’ve been to Australia come on.", "created_at": "2026-10-01T00:12:44+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Alex_A_Guerrero", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105436371783430581", "url": "https://x.com/sethlazar/status/2105436371783430581", "text": "I just gave a talk here at @JHUBloombergCtr on Navigating the AGI Reckoning. \n\nI think there are three senses of “reckoning” that are useful here. The first is calculating location and vector. I argue that we are, at the very least, on the threshold of “whack a mole AGI”—if you can bring a domain into distribution, and construct a good judge, then we can make models superhuman at it (and that this is true for enough domains to meaningfully describe AGI as on the horizon).\n\nA second meaning: this is a moment of truth for humanity, and especially for liberal democracies. We have to ask the question, “should we build AGI?” And if the answer is no we should stop. AI is a profoundly physical technology. If we wanted to stop, we could. So, we should actually answer the question. And this doesn’t just mean asking whether we can build it safely (tho that matters of course). It means determining whether we want the post-AGI world. I think most of the arguments against the post-AGI future rest on objectionably illiberal views of society, where some folks are projecting their own conceptions of the good life onto others. The societal ills that will attend AGI are I think navigable, and there are good public reasons to proceed (especially that we can rebuild state capacity and liberal dynamism, as well as the obvious scientific progress we can achieve). But I don’t think it is an open and shut case, at all, and I hope it becomes a central topic in democratic discussion over the coming year. I also think that the positive case rests on things that haven’t yet been done—if you’re pro-AGI you should be acting, urgently, to make the promised benefits real, not just relying on magical thinking.\n\nLastly a reckoning is an accounting of who owes what to whom. I think the advent of AGI will unsettle many of the foundations of our current voluntary social order (what holds us together without the need for constant coercive oppression). We’ll have the opportunity, and need, to design new institutions, and even new political theories, calibrated to the new technological era. This is, for me, a point of great promise. We’ve inhabited the institutions of another age of revolutions for a long time now. Their inadequacy has long since been exposed. I’m excited to see what we can build for the next quarter millennium.\n\nSlides at https://t.co/T5Y69fnuAE\n\nVideo soon if there’s interest.", "created_at": "2026-09-30T23:15:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105432099951870314", "url": "https://x.com/sethlazar/status/2105432099951870314", "text": "@Alex_A_Guerrero I think it’s a poor show to assume that people who disagree with you can only be doing for financial reasons, and I stress, again, that I would be fine w/o AI (I’d be better off in fact!! As I’d have stayed in Australia rather than coming here to help ensure the ai transition goes well), but i think you’ll see that for yourself in due course so ¯\\_(ツ)_/¯. I’ve been writing about tech and ai for a long time, and have long been in the critical camp; indeed my book coming out soon is mostly that. I think you know well enough that I’m not ignorant of the downsides. \n\nI suspect I’m in less of an echo chamber than you, since your view is overwhelmingly the default view in academia, and we are both in academia. \n\nThe populist critique—I think opposition to illegitimate exercise of power by tech cos makes plenty of sense (again, book out soon). But I don’t think that surfing the wave of populism when it happens to agree with you is especially credible. I also think parsing actual sentiment here is hard. It’s easy to assume folks agree with you more generally just because you agree on one point. I have my doubts.\n\nAs to good faith engagement—again, I am replying to you because I think anyone will be able to judge that for themselves. I’ll call it out; you can deny it if you like—let anyone reading this be the judge.\n\nSo on to the substance. The critique of how AI interferes with people’s well-being is, I think, largely overblown, highly techno-deterministic, and excessively perfectionist. Cultures evolve and I’m glad that individuals like you don’t get to be in charge of how they do! Norms need to develop about when to use and not use ai; we can have the
