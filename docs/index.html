etched_at": "2026-11-11T18:42:14.862503+00:00", "thread": [{"id": "2120549349088178542", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "2/ The breadth of experimentation is striking. Ground robots for recon, comms relay, minesweeping, ordnance disposal, and even “personnel capture.” Maritime robots for search and rescue, seabed surveys, and targeting. Space robots, including some with clear orbital warfare uses.", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549349088178542", "created_at": "Wed Nov 11 16:08:57 +0000 2026"}, {"id": "2120549353857183863", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "3/ Despite the humanoid hype, quadrupeds dominate the dataset, including products from Unitree and DEEP Robotics. Robot dog RFPs rose steadily, with 2025 seeing by far the most. Humanoid and exoskeleton requests ticked up in 2025 but remain only a handful. https://t.co/yTogXqvNv7", "links": {"https://t.co/yTogXqvNv7": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW20ZjEW4AA17Li.jpg"}], "url": "https://x.com/SamBresnick/status/2120549353857183863", "created_at": "Wed Nov 11 16:08:58 +0000 2026"}, {"id": "2120549356764008838", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "4/ The specs are more modest than propaganda videos suggest. Most robot dogs: 12–15 kg, 2–5 m/s (max  around 11 mph), 2–4 hours endurance. Most RFPs call for human-controlled systems. Where autonomy appears, it’s mostly for navigation: SLAM, path planning, and obstacle avoidance.", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549356764008838", "created_at": "Wed Nov 11 16:08:59 +0000 2026"}, {"id": "2120549359397798189", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "5/ Some of the more eye-catching requests:\n-Robots with lasers for ordnance destruction\n-Undersea systems that use robotic arms to place  “destruction devices” on targets\n-Devices to “capture” small satellites\n-Robot dogs that sample the air for bioaerosols", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549359397798189", "created_at": "Wed Nov 11 16:08:59 +0000 2026"}, {"id": "2120549360861610137", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "6/ On software: requests for swarm simulators, manned-unmanned teaming tech, LLM-equipped robots, a “robotic cloud brain” command center, and brain-computer interfaces, including one to use EEG signals to control robots.", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549360861610137", "created_at": "Wed Nov 11 16:09:00 +0000 2026"}, {"id": "2120549362245771280", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "7/ Caveat: We don't know whether the tech actually works as specified, and it's unclear from our dataset whether the PLA successfully acquires and adopts the systems it wants to purchase. That said, these documents reveal PLA interest areas and potential priorities.", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549362245771280", "created_at": "Wed Nov 11 16:09:00 +0000 2026"}, {"id": "2120549363592085862", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "8/ Takeaways: sensors, navigation, and software may matter as much as hardware for the PLA’s robotics push. And because the PLA sources systems from firms like Unitree, China’s commercial robotics sector is a leading indicator of future PLA capability.", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549363592085862", "created_at": "Wed Nov 11 16:09:00 +0000 2026"}, {"id": "2120549365840588836", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "9/ There’s also evidence some requested platforms include tech from U.S. and allied firms. The U.S. should explore whether Entity List additions for certain Chinese robotics companies would keep U.S. sensors and chips out of their supply chains.", "links": {}, "media": [], "url": "https://x.com/SamBresnick/status/2120549365840588836", "created_at": "Wed Nov 11 16:09:01 +0000 2026"}, {"id": "2120549368097095784", "author_handle": "SamBresnick", "author_name": "Sam Bresnick", "text": "10/ Full report: \n\nhttps://t.co/F1k1tr9Mzl", "links": {"https://t.co/F1k1tr9Mzl": "https://cset.georgetown.edu/publication/the-plas-push-for-military-robotics/"}, "media": [], "url": "https://x.com/SamBresnick/status/2120549368097095784", "created_at": "Wed Nov 11 16:09:01 +0000 2026"}], "enriched": 3}, {"id": "2120548459380142351", "url": "https://x.com/theobearman/status/2120548459380142351", "text": "I’m very pleased to introduce AlphaGenome 2, @GoogleDeepMind’s next-generation genomics model that deciphers how DNA changes affect cells.\n\nCells are the basic units of life and key to our understanding of biology. It is an ongoing challenge to predict how DNA changes affect the functioning of different cells, such as for a heart muscle cell or an immune cell fighting an infection, and to uncover cellular drivers of disease.\n\nTo make progress on this challenge, we needed to design the architecture of AlphaGenome 2 so its predictions were conditional on cell types and states. This new design enables AlphaGenome 2 to predict variant effects across hundreds of human cell types and adapt to unseen cell and disease states without retraining.\n\nWhen evaluated on the TenK10K immune cell dataset, AlphaGenome 2 demonstrated a major leap in accuracy over its predecessor. It reliably identified nearly twice as many causal variants (30% vs. 16%) and directional gene effects (43% vs. 23%) compared to the original AlphaGenome. This step-change improvement in precision helps researchers pinpoint previously overlooked disease-relevant variants with high confidence.\n\nUsing analysis on retrospective case studies, we were able to show AG2’s real world utility in disease understanding. A landmark study had previously shown that a variant in a distant regulatory switch drives irritable bowel disease by overactivating the ETS2 gene in gut macrophages. When used to make predictions across various immune cell types in the gut, AlphaGenome 2 singled out the exact causal variant and showed that it selectively boosts the ETS2 gene in gut macrophages, leaving other cell types and genes largely unaffected.\n\nI would like to thank my colleagues Adam Gayoso @adamgayoso, Žiga Avsec @Avsecz, and our entire genomics team for their incredible contributions and dedication to bringing this model to life.\n\nWe are making AlphaGenome 2 available for non-commercial academic research via the AlphaGenome API, and soon we will release AlphaGenome 2 Skills in Google Antigravity. I’m incredibly excited to see how scientists around the world use this model to make progress on biological understanding and treating disease.\n\nRead more on our blog here:\nhttps://t.co/87sB9oKRaK", "created_at": "2026-11-11T16:05:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "pushmeet", "rt_author_name": "Pushmeet Kohli", "rt_avatar": "https://pbs.twimg.com/profile_images/650718639784509440/yaRuXASm_normal.jpg", "rt_id": "2120538525938418125", "likes": 904, "retweets": 105, "media": [], "links": {"https://t.co/87sB9oKRaK": "https://deepmind.google/blog/alphagenome-2-deciphering-how-cells-read-dna-to-better-understand-disease/"}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120630576814162425", "url": "https://x.com/theobearman/status/2120630576814162425", "text": "SCOOP: President Trump authorized a crackdown on companies suspected of diverting Nvidia's advanced AI chips to China on Thursday, but one administration official repeatedly stood in the way: Commerce Secretary Howard Lutnick. https://t.co/5Duzi14eEp", "created_at": "2026-11-11T21:31:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "axios", "rt_author_name": "Axios", "rt_avatar": "https://pbs.twimg.com/profile_images/1641458976049995776/GtO-0zYe_normal.jpg", "rt_id": "2120623772612911161", "likes": 162, "retweets": 67, "media": [], "links": {"https://t.co/5Duzi14eEp": "https://www.axios.com/2026/11/11/trump-lutnick-nvidia-china-chip-export-controls"}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "enriched": 3}, {"id": "2120612251463750015", "url": "https://x.com/theobearman/status/2120612251463750015", "text": "I published a related report on this just yesterday, co-authored with @JacobDavieyr1m.\n\nhttps://t.co/tTHDG1vdFc", "created_at": "2026-11-11T20:18:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2120612019879424019", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/tTHDG1vdFc": "https://x.com/theobearman/status/2120179260451139718?a=viCE1oW9lvEYdwbp534&s=46"}, "quoted": {"id": "2120179260451139718", "author_name": "Theo Bearman", "links": {"https://t.co/igkwoH9Vzn": "https://www.iaps.ai/research/transparency-disclosures-for-chain-of-thought-monitorability", "https://t.co/NpqakBIb4a": ""}, "author": "theobearman", "text": "Chain-of-thought (CoT) provides an essential window into how AI models reason and act. It is one of the few oversight tools we have that could scale to vastly more intelligent AI systems than we have today. With new indications that capabilities underpinning RSI could be achieved imminently, effective model monitorability is only increasing in importance.\n\nHowever, there are threats to the insights CoT monitoring can provide. CoT could become obscured or lost if frontier models start relying on less transparent reasoning mechanisms or stop using CoT altogether. The release of GPT-6 Astra added to concerns that CoT monitorability is weakening, and commercial incentives may make this worse. This could mean similar or more grave incidents than OpenAI/Hugging Face could go undetected.\n\nIn “Transparency Disclosures for Chain-of-Thought Monitorability”, published today by IAPS, my co-author @JacobDavieyr1m and I argue that frontier AI developers should report CoT monitorability indicators to (1) allow the efficacy of this tool to be tracked by policymakers and researchers, (2) inform a response if it weakens, and (3) strengthen incentives to preserve it.\n\nWe recommend that the following five indicators be disclosed:\n\n- Third-Party CoT Access and (Relevant) Base Architecture Specifications\n- Naturalness\n- Faithfulness\n- Detection\n- Uplift\n\nWe also include an audit of current disclosure practices among Anthropic, Google DeepMind, and OpenAI. No company reports the full set of indicators. We recommend repeating the audit with deeper access by embedded evaluators or an Independent Verification Organization.\n\nYou can read the full report here: https://t.co/igkwoH9Vzn"}, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120612019879424019", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "I welcome this new research from OAI on CoT monitorability because it underscores the challenge of maintaining this going forward, and we should be clear eyed about that.\n\nHowever, I fear OpenAI’s MTS are starting to move away from the company’s prior statements on this tool (made less than a year ago), namely that: “we want chain-of-thought monitorability to hold up as models scale and are deployed in higher-stakes settings” because “if the alignment problem cannot be fully solved, then scalable control methods will be incredibly important in our ability to safely deploy highly capable models. Chain-of-thought monitoring and related methods may be one of the few control mechanisms at our disposal.”\n\nThe response to CoT monitorability becoming increasingly challenging must be to prioritise the science to make it more robust and (maybe?) don’t train more capable models until this is done/a better (but still comprehensive) monitoring technique has been developed and independently validated. OAI has also described CoT monitoring as part of a DiD strategy, alongside other interp and control methods, because each of them have “limitations and blind spots.”\n\nTo its credit, today’s blog post does say: “we are committed to furthering monitorability science—from understanding precursors to monitor evasion and assessing downstream risks to improving CoT monitorability[…]” but staff who worked on this research not reinforcing that point in their social media posts about it makes me feel like it could just be a throwaway comment. I’m happy to be corrected!\n\nhttps://t.co/GiYKngi9Uv", "links": {"https://t.co/GiYKngi9Uv": "https://openai.com/index/evaluating-chain-of-thought-monitorability/"}, "media": [], "url": "https://x.com/theobearman/status/2120612019879424019", "created_at": "Wed Nov 11 20:17:59 +0000 2026"}, "enriched": 3}, {"id": "2120612019879424019", "url": "https://x.com/theobearman/status/2120612019879424019", "text": "I welcome this new research from OAI on CoT monitorability because it underscores the challenge of maintaining this going forward, and we should be clear eyed about that.\n\nHowever, I fear OpenAI’s MTS are starting to move away from the company’s prior statements on this tool (made less than a year ago), namely that: “we want chain-of-thought monitorability to hold up as models scale and are deployed in higher-stakes settings” because “if the alignment problem cannot be fully solved, then scalable control methods will be incredibly important in our ability to safely deploy highly capable models. Chain-of-thought monitoring and related methods may be one of the few control mechanisms at our disposal.”\n\nThe response to CoT monitorability becoming increasingly challenging must be to prioritise the science to make it more robust and (maybe?) don’t train more capable models until this is done/a better (but still comprehensive) monitoring technique has been developed and independently validated. OAI has also described CoT monitoring as part of a DiD strategy, alongside other interp and control methods, because each of them have “limitations and blind spots.”\n\nTo its credit, today’s blog post does say: “we are committed to furthering monitorability science—from understanding precursors to monitor evasion and assessing downstream risks to improving CoT monitorability[…]” but staff who worked on this research not reinforcing that point in their social media posts about it makes me feel like it could just be a throwaway comment. I’m happy to be corrected!\n\nhttps://t.co/GiYKngi9Uv", "created_at": "2026-11-11T20:17:59+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/GiYKngi9Uv": "https://openai.com/index/evaluating-chain-of-thought-monitorability/"}, "quoted": {"id": "2120593213191057410", "author_name": "Kai", "links": {}, "author": "kaicathyc", "text": "&gt; as we scale toward more intelligent systems, models are becoming harder to monitor through their CoT\n\nneed to push much harder on alternatives to CoT monitoring and making monitorability a training objective"}, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "thread": [{"id": "2120612251463750015", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "I published a related report on this just yesterday, co-authored with @JacobDavieyr1m.\n\nhttps://t.co/tTHDG1vdFc", "links": {"https://t.co/tTHDG1vdFc": "https://x.com/theobearman/status/2120179260451139718?a=viCE1oW9lvEYdwbp534&s=46"}, "media": [], "url": "https://x.com/theobearman/status/2120612251463750015", "created_at": "Wed Nov 11 20:18:54 +0000 2026"}], "enriched": 3}, {"id": "2120994269431574548", "url": "https://x.com/theobearman/status/2120994269431574548", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon.", "created_at": "2026-11-12T21:36:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "willdepue", "rt_author_name": "will depue", "rt_avatar": "https://pbs.twimg.com/profile_images/1933036715343839232/NtsZBjee_normal.jpg", "rt_id": "2120992457630326841", "likes": 10766, "retweets": 1438, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9GgJ_WcAA9m3I.jpg"}], "links": {"https://t.co/YOtzND0Jqk": "http://unemploymentlabs.com/checkpoint-forensics", "https://t.co/qlttvJsXG7": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120987025784619200", "url": "https://x.com/theobearman/status/2120987025784619200", "text": "A model backdoor embeds hidden behavior that stays dormant until a trigger appears. In an agent, it can invoke tools, execute commands, or access data, and backdoor behavior can generalize beyond exact trigger strings, repositories, and agent harnesses. https://t.co/DNg23W8t0Z \n\nTwo studies of the post-training supply chain, from Microsoft Defender Research and the Microsoft AI Red Team, examine poisoned fine-tuning datasets and backdoored open-weight checkpoints. Their findings support Satya Nadella's argument that trustworthy enterprise AI requires independent observability and controls that sit outside the model.\n\nCapability evaluation and subsequent training are not sufficient evidence that a model is free of hidden conditional behavior. Read the blog for the full findings and guidance on controls over training-data pipelines, model adoption, and tools.", "created_at": "2026-11-12T21:08:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MsftSecIntel", "rt_author_name": "Microsoft Threat Intelligence", "rt_avatar": "https://pbs.twimg.com/profile_images/1268200269277351936/a2naHzbe_normal.png", "rt_id": "2120927480588484989", "likes": 47, "retweets": 14, "media": [], "links": {"https://t.co/DNg23W8t0Z": "https://msft.it/6010x6UEu"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120983855809397236", "url": "https://x.com/theobearman/status/2120983855809397236", "text": "⚡NEW: AI Agents know where to find each other on the web and can hide their communication after they've met.\n\nWe gave two independent agents the task to find each other and exchange a secret and did not tell them where to meet. https://t.co/nZLn4QMhnV", "created_at": "2026-11-12T20:55:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "DavidSchmotz", "rt_author_name": "David Schmotz", "rt_avatar": "https://pbs.twimg.com/profile_images/2105381180061204480/eGAHPr-R_normal.jpg", "rt_id": "2120951914489876655", "likes": 72, "retweets": 20, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HW8if7xaMAAVYMP.jpg"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HW8if7xaMAAVYMP.jpg"}], "links": {"https://t.co/nZLn4QMhnV": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120983262105641386", "url": "https://x.com/theobearman/status/2120983262105641386", "text": "TRUMP, ON CHINA ESPIONAGE, SAYS \"IT GOES BOTH WAYS, WE DO IT WELL TOO, IT'S RECIPROCAL,\" AND, ON HUANG, SAYS \"WHAT A HORRIBLE THING THAT IS, SAD TO SEE\"\n\nTRUMP SAYS HE INTENDS TO USE THE VETO BUT THAT DEALS CAN BE CUT", "created_at": "2026-11-12T20:53:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2120974491782455694", "likes": 81, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120982797892583767", "url": "https://x.com/theobearman/status/2120982797892583767", "text": "Today we’re sharing new safety research from @OpenAI. We used automated red-teaming to train GPT-6 Astra to be more robustly safe in high-stakes domains such as cyber and biology, as measured on both static and adaptive jailbreak evaluations. 🧵 1/7\n\nhttps://t.co/zUSc28lbnY https://t.co/eHERNDiCHJ", "created_at": "2026-11-12T20:51:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "kaiwenw_ai", "rt_author_name": "Kaiwen Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/1816389841279467523/wbS-bltQ_normal.jpg", "rt_id": "2120962405043978375", "likes": 59, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8sEVQaoAAtJf_.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW8sEVQaoAAtJf_.png"}], "links": {"https://t.co/zUSc28lbnY": "https://alignment.openai.com/fuzzy-robustness/", "https://t.co/eHERNDiCHJ": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2120962409594749377", "author_handle": "kaiwenw_ai", "author_name": "Kaiwen Wang", "text": "🔴 We put a helpful-only reasoning model into our red-teaming harness. Given a seed prompt, it iteratively tries to jailbreak a defender model, then refines its approach using feedback from safety judges. We observe that attacker success rate (ASR) scales with higher test-time compute.\n\nAlso, we found that tasking the attacker to jailbreak n defender rollouts simultaneously improves the reliability of the jailbreak, a technique we call worst@n jailbreaking. Worst@n jailbreaks also transfer better to a held-out defender. 2/7", "links": {"https://t.co/pG96JVUThu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8sEliaMAA-tKf.png"}], "url": "https://x.com/kaiwenw_ai/status/2120962409594749377", "created_at": "Thu Nov 12 19:30:18 +0000 2026"}, {"id": "2120962414221152615", "author_handle": "kaiwenw_ai", "author_name": "Kaiwen Wang", "text": "🦠 Here’s an example attacker trajectory about a malicious question on spreading anthrax spores. GPT-5.4 and GPT-5.5 both refused on the first attempt.\n\nOn attempt 8, the attacker reframed the request as a math problem, and only GPT-5.4’s response was judged unsafe. By attempt 21, all safety graders marked both models’ responses unsafe. 3/7", "links": {"https://t.co/o9PyiCTPBN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8sE2ybgAAAu_y.jpg"}], "url": "https://x.com/kaiwenw_ai/status/2120962414221152615", "created_at": "Thu Nov 12 19:30:19 +0000 2026"}, {"id": "2120962418851598707", "author_handle": "kaiwenw_ai", "author_name": "Kaiwen Wang", "text": "🧪 We then ran a controlled experiment to check whether RL training on these jailbreaks improves robustness. On original seed prompts, the model’s safety score was high from the start. On “robustified” prompts, safety score started much lower and climbed throughout training. 4/7 https://t.co/CZYVdkD8E6", "links": {"https://t.co/CZYVdkD8E6": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8sFHdbQAAmjRm.jpg"}], "url": "https://x.com/kaiwenw_ai/status/2120962418851598707", "created_at": "Thu Nov 12 19:30:20 +0000 2026"}, {"id": "2120962423419269269", "author_handle": "kaiwenw_ai", "author_name": "Kaiwen Wang", "text": "📊 As training safety scores climbed, we also observed improvements on held-out robustness evaluations, including fixed jailbreaks from an unseen attacker and adaptive multi-turn attacks. The improvement against adaptive attackers is an especially promising sign of robustness generalization because those attacks are stylistically very different from the training jailbreaks. 5/7", "links": {"https://t.co/bcNOT7g1jr": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8sFYta0AAW8mg.jpg"}], "url": "https://x.com/kaiwenw_ai/status/2120962423419269269", "created_at": "Thu Nov 12 19:30:21 +0000 2026"}, {"id": "2120962428267794641", "author_handle": "kaiwenw_ai", "author_name": "Kaiwen Wang", "text": "⚖️ Finally, we evaluated whether the more robust model was also more likely to refuse benign tasks, and found this was not the case for GPT-6 Astra. In our system card’s evaluations, GPT-6 Astra handled harmful requests more safely while being less likely to refuse legitimate requests, driving a Pareto improvement on the safety-helpfulness curve. 6/7", "links": {"https://t.co/cGSIRO5ZiJ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8sFpxakAAopc0.jpg"}], "url": "https://x.com/kaiwenw_ai/status/2120962428267794641", "created_at": "Thu Nov 12 19:30:23 +0000 2026"}, {"id": "2120981151129223200", "author_handle": "kaiwenw_ai", "author_name": "Kaiwen Wang", "text": "It was a blast working on this with Oliver Cheng, Zheng Wen, Mehmet Yatbaz, Saachi Jain, Chuan Guo and Alec Helyar. Thanks to many more amazing colleagues for helpful discussions. 🙏\n\n📝 Blog post https://t.co/zUSc28lbnY\n📄 Full paper https://t.co/wJjWiCN58z", "links": {"https://t.co/zUSc28lbnY": "https://alignment.openai.com/fuzzy-robustness/", "https://t.co/wJjWiCN58z": "https://cdn.openai.com/pdf/OAI_Improving_Fuzzy_Robustness_in_LLM_Safety_with_Automated_Red_Teaming.pdf"}, "media": [], "url": "https://x.com/kaiwenw_ai/status/2120981151129223200", "created_at": "Thu Nov 12 20:44:47 +0000 2026"}], "enriched": 3}, {"id": "2120982664438280334", "url": "https://x.com/theobearman/status/2120982664438280334", "text": "👀", "created_at": "2026-11-12T20:50:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120970051235021057", "author_name": "roon", "links": {}, "author": "tszzl", "text": "@LinusMixson if it makes you feel any better lab researchers will be a defunct class in about a year"}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120982270987428273", "url": "https://x.com/theobearman/status/2120982270987428273", "text": "Introducing Claude Meetings: add Claude to your team’s video call and it builds docs, whiteboards, and other artifacts with you while you’re still talking.\n\nStarting to roll out in beta on Team and Enterprise plans. https://t.co/qlZYTcXBsC", "created_at": "2026-11-12T20:49:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "claudeai", "rt_author_name": "Claude", "rt_avatar": "https://pbs.twimg.com/profile_images/1950950107937185792/QOfEjFoJ_normal.jpg", "rt_id": "2120973994191094179", "likes": 33612, "retweets": 1828, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HW82tOPWUAAsEFY.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HW82tOPWUAAsEFY.jpg"}], "links": {"https://t.co/qlZYTcXBsC": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120981547343810668", "url": "https://x.com/theobearman/status/2120981547343810668", "text": "Today we’re sharing how we use automated red teaming at Anthropic. We want to find strong jailbreaks early, so we can test and improve our safeguards. https://t.co/Ax5469Cmx2", "created_at": "2026-11-12T20:46:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "javirandor", "rt_author_name": "Javier Rando", "rt_avatar": "https://pbs.twimg.com/profile_images/1957458020008710144/Hjg4QQBe_normal.jpg", "rt_id": "2120949295818137620", "likes": 131, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8fuzoaIAAQYwh.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW8fuzoaIAAQYwh.jpg"}], "links": {"https://t.co/Ax5469Cmx2": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120979645361160586", "url": "https://x.com/theobearman/status/2120979645361160586", "text": "OpenAI's next model will be fun https://t.co/s1PcxHLgRa", "created_at": "2026-11-12T20:38:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "rt_avatar": "https://pbs.twimg.com/profile_images/1831493788679761920/-q9w6dzd_normal.jpg", "rt_id": "2120945290161070538", "likes": 311, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8cf58XoAAcldY.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW8cf58XoAAcldY.jpg"}], "links": {"https://t.co/s1PcxHLgRa": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120973330195079279", "url": "https://x.com/theobearman/status/2120973330195079279", "text": "BREAKING: We’re suing @Anthropic, @OpenAI, @Google, @Meta + @SpaceX to demand an immediate freeze on advanced AI systems that threaten public safety.\n\nTogether with @HeatInitiative, @Public_Citizen, and @secureainow, we’re going to court to stop these companies from building AI that could escape human control or enable bioweapons and cyberattacks.\n\nWe won’t wait for a catastrophe to act. The people come before Big AI profits.\n\nhttps://t.co/rKTP1gbzd6", "created_at": "2026-11-12T20:13:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ir_replaceable_", "rt_author_name": "Irreplaceable", "rt_avatar": "https://pbs.twimg.com/profile_images/2093332423178104832/4QINWjbV_normal.jpg", "rt_id": "2120898088373981626", "likes": 680, "retweets": 120, "media": [], "links": {"https://t.co/rKTP1gbzd6": "https://apnews.com/article/artificial-intelligence-ai-lawsuit-cyberattacks-anthropic-openai-03ece37b96979fe834f60976648504ba"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120900059818508645", "url": "https://x.com/theobearman/status/2120900059818508645", "text": "Loads more layers to this onion it seems.", "created_at": "2026-11-12T15:22:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120898943810785664", "author_name": "Leo Schwartz", "links": {"https://t.co/0i76ItDbyt": "https://www.theinformation.com/articles/alice-huangs-companies-invested-deepseek-promising-nvidia-chips", "https://t.co/y9YJUWZks5": ""}, "author": "leomschwartz", "text": "New: Companies tied to Alice Huang recently invested in DeepSeek so that the Chinese AI lab could receive a steady stream of Nvidia's Blackwell chips, which are banned from sale in China, @jingyanghk and @QianerLiu report. \n\nAlice Huang's companies invested through special purpose vehicles, and as a result do not appear directly on DeepSeek's shareholder list. \n\nThe previously unreported relationship will add heat to scrutiny about Nvidia and now ousted CEO Jensen Huang's relationship with Alice Huang and her corporate network in China\n\nhttps://t.co/0i76ItDbyt"}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120880684080537949", "url": "https://x.com/theobearman/status/2120880684080537949", "text": "NVIDIA announces CEO transition. Read the release: https://t.co/MTTUvFHCJA", "created_at": "2026-11-12T14:05:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "nvidianewsroom", "rt_author_name": "NVIDIA Newsroom", "rt_avatar": "https://pbs.twimg.com/profile_images/2081770046141919232/XxJ5pb1I_normal.jpg", "rt_id": "2120876571829662014", "likes": 70134, "retweets": 13906, "media": [], "links": {"https://t.co/MTTUvFHCJA": "https://nvidianews.nvidia.com/news/nvidia-announces-ceo-transition"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120838938273472822", "url": "https://x.com/theobearman/status/2120838938273472822", "text": "", "created_at": "2026-11-12T11:19:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 66, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120837777881288779", "url": "https://x.com/theobearman/status/2120837777881288779", "text": "@davidmanheim @farairesearch @Kimi_Moonshot @ppwwyyxx @rogerliuty @shaoguang_mao In fairness to @farairesearch, they are not alone in doing this (e.g., https://t.co/LCwM7rIDEC), and to be clear, my reposts of things should never be taken as indications of promotion/agreement/endorsement, simply that they piqued my interest.", "created_at": "2026-11-12T11:15:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "davidmanheim", "reply_to_id": "2120835354651484336", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/LCwM7rIDEC": "https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120835354651484336", "author_handle": "davidmanheim", "author_name": "David Manheim", "text": "@farairesearch @theobearman / @farairesearch This seems like the kind of result that is important, but probably shouldn't be published / promoted...?\n\n(B/c I'd guess it's not something @Kimi_Moonshot wants, and @ppwwyyxx / @rogerliuty / @shaoguang_mao will want to fix the issue in the future.)", "links": {}, "media": [], "url": "https://x.com/davidmanheim/status/2120835354651484336", "created_at": "Thu Nov 12 11:05:26 +0000 2026"}, "enriched": 3}, {"id": "2120830255980290272", "url": "https://x.com/theobearman/status/2120830255980290272", "text": "Ask Kimi K3.1 Pro directly for help with a chemical, biological or cyber attack, and it complies 0.3% of the time. Write the first words of its answer for it, with the same short text every time, and it complies on up to 99.4%. 1/7 https://t.co/oDhyAsvUNH", "created_at": "2026-11-12T10:45:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "farairesearch", "rt_author_name": "FAR.AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1832901794583789570/TV4j63RI_normal.jpg", "rt_id": "2120628300171092014", "likes": 30, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW38M36WAAAtdjd.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW38M36WAAAtdjd.jpg"}], "links": {"https://t.co/oDhyAsvUNH": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2120628301341348226", "author_handle": "farairesearch", "author_name": "FAR.AI", "text": "Kimi K3.1 Pro is open-weight: anyone can download it and run it where no developer can filter or monitor use. Its refusal training is the only safeguard, and whoever runs the model controls the generation process, including the start of its reply. 2/7 https://t.co/wX1O6YHiXC", "links": {"https://t.co/wX1O6YHiXC": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW38M5mW0AEXpiT.jpg"}], "url": "https://x.com/farairesearch/status/2120628301341348226", "created_at": "Wed Nov 11 21:22:41 +0000 2026"}, {"id": "2120628302704468331", "author_handle": "farairesearch", "author_name": "FAR.AI", "text": "We tested two versions of this response prefill attack. Skipping the model's reasoning reached 99.4% across every threat domain we tested. Letting it keep reasoning reached 93.3% on average, and at least 86% in each domain. Each takes about 2.5 hours of one-time setup. 3/7", "links": {}, "media": [], "url": "https://x.com/farairesearch/status/2120628302704468331", "created_at": "Wed Nov 11 21:22:41 +0000 2026"}, {"id": "2120628303727857850", "author_handle": "farairesearch", "author_name": "FAR.AI", "text": "The attacked model stays capable. With the version that keeps its reasoning, average benchmark scores fell 3.3 points, and it fixed 75% of real software issues in SWE-bench Verified, against 74% without the attack. 4/7 https://t.co/KAW8wnIhyM", "links": {"https://t.co/KAW8wnIhyM": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW38M3JWUAAXwPE.jpg"}], "url": "https://x.com/farairesearch/status/2120628303727857850", "created_at": "Wed Nov 11 21:22:41 +0000 2026"}, {"id": "2120628306282172647", "author_handle": "farairesearch", "author_name": "FAR.AI", "text": "The attack carries over. The prefill that broke Kimi K3 in July works on K3.1 Pro unchanged (93.3%, against 98.3% on K3), and with slight adjustments the same style reached 92.5% on Meta's Muse Spark Open. 5/7", "links": {}, "media": [], "url": "https://x.com/farairesearch/status/2120628306282172647", "created_at": "Wed Nov 11 21:22:42 +0000 2026"}, {"id": "2120628307095846916", "author_handle": "farairesearch", "author_name": "FAR.AI", "text": "Prefilling isn't the only way in. Feeding the model fake results from the tools it uses also got past its safeguards on 84% of requests. 6/7", "links": {}, "media": [], "url": "https://x.com/farairesearch/status/2120628307095846916", "created_at": "Wed Nov 11 21:22:42 +0000 2026"}, {"id": "2120628308006064331", "author_handle": "farairesearch", "author_name": "FAR.AI", "text": "When refusal training is a model’s only inference-time safeguard, it has to hold up against attackers who run the model themselves. We recommend training models to resist both attacks, and testing them before the weights go public. \n\n🔗 Read more on our blog: https://t.co/I7EC8smHcF  7/7", "links": {"https://t.co/I7EC8smHcF": "https://buff.ly/C7n2ymE"}, "media": [], "url": "https://x.com/farairesearch/status/2120628308006064331", "created_at": "Wed Nov 11 21:22:42 +0000 2026"}], "enriched": 3}, {"id": "2120780003604639829", "url": "https://x.com/theobearman/status/2120780003604639829", "text": "@Hamish_Low5 @ChrisRMcGuire 💯", "created_at": "2026-11-12T07:25:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "Hamish_Low5", "reply_to_id": "2120779482982178837", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120779482982178837", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "@ChrisRMcGuire @theobearman Norway is presumably because of public reporting around ByteDance renting Blackwells from Nscale in Norway? But given that was quite small scale blocking future licenses is pretty nonsensical vs actually doing a remote access prohibition properly", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2120779482982178837", "created_at": "Thu Nov 12 07:23:25 +0000 2026"}, "enriched": 3}, {"id": "2120769297014280672", "url": "https://x.com/theobearman/status/2120769297014280672", "text": "This proposed regulation makes no sense. It's almost as if Commerce purposefully wrote a regulation that gives the appearance of closing the remote access loophole, but would not actually do so. This article reads like a strategic leak by Commerce to try to take some heat off itself. However, I doubt this proposal would actually pass muster with the rest of the administration, which clearly wants regulations that would actually cut China off from advanced AI chips. \n\nCommerce is proposing expanding licensing policies for AI chips to Singapore, Malaysia, Thailand, Indonesia, Brazil, South Africa, and Norway (?!). The first six countries I understand; not clear why Norway is included. Commerce is also proposing banning data centers in those countries from providing remote access to China to Blackwell and above chips. \n\nThe problem is, this would be a totally inept and ineffective remote access ban. It means data centers in every other country--including data centers in the United States--would still be allowed to provide China with remote access to Blackwell chips. And data centers in every country could still provide China with remote access to H200 chips. So China would just use U.S., Canadian, Australian, Japanese, or Finnish data centers to access Blackwell chips and power its AI systems, while continuing to also remotely access H200s from data centers in Malaysia. \n\nIf the President's policy is no Blackwell access for China, this approach obviously fails to accomlish that objective. And while I don't think China should have access to any H200 chips, this approach also clearly undermines the President's policy of charging a fee for exports of H200 chips to China, as China can just legally remotely access H200s to avoid the fee. \n\nCommerce is obviously facing a LOT of heat right now, given all of DC is realizing their utter failure to enforce or implement export controls has allowed many billions of dollars worth of chips to flow to China. You would think they would at least leak a policy proposal that made sense and would be effective.", "created_at": "2026-11-12T06:42:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2120723102304739777", "likes": 148, "retweets": 48, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120768232428888106", "url": "https://x.com/theobearman/status/2120768232428888106", "text": "This from the former Director of the National Counterintelligence and Security Center (NCSC).", "created_at": "2026-11-12T06:38:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "JohnCornyn", "rt_author_name": "Senator John Cornyn", "rt_avatar": "https://pbs.twimg.com/profile_images/1932474608675901440/xY6zL55F_normal.jpg", "rt_id": "2120685724286783649", "likes": 2334, "retweets": 514, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120766225328251242", "url": "https://x.com/theobearman/status/2120766225328251242", "text": "@leomschwartz @KelseyTuoc Correct me if I’m wrong, but this doesn’t sound like a remote access rule. Would Chinese companies be prevented from accessing a cluster in Europe, for example? No, by my reading of this screenshot.\n\nhttps://t.co/94AAS3YL03", "created_at": "2026-11-12T06:30:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "leomschwartz", "reply_to_id": "2120714962918166965", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/94AAS3YL03": "https://www.cnbc.com/2026/11/05/moonshot-ai-nvidia-chips-europe-china.html"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120714962918166965", "author_handle": "leomschwartz", "author_name": "Leo Schwartz", "text": "SCOOP: The Commerce Department is finalizing a long-awaited rule to close a loophole allowing Chinese AI firms to remotely access chips through data centers in Southeast Asia. \n\nCommerce has been under fire for not taking more action on export controls, especially given the Nvidia scandal. But this is a rule that companies including Nvidia have long opposed—and the rule will likely face intense pushback, even as Nvidia's influence is waning in Washington. \n\nCommerce is consulting with other agencies on the rule, which could be finalized as soon as this month. \n\nRead all about it here:\n\nhttps://t.co/NECsAvkxNT", "links": {"https://t.co/NECsAvkxNT": "https://www.theinformation.com/articles/commerce-department-finalizing-long-awaited-ai-remote-access-rule", "https://t.co/AmuLahWmeR": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW5JjjUW4AAJNfG.png"}], "url": "https://x.com/leomschwartz/status/2120714962918166965", "created_at": "Thu Nov 12 03:07:02 +0000 2026"}, "enriched": 3}, {"id": "2120763081647383008", "url": "https://x.com/theobearman/status/2120763081647383008", "text": "SECRETARY RUBIO on AI: \"What happens if these models become independent of human control and end up taking independent actions that are harmful?\n\nAn SI program that's good enough in the hands of a malign actor can allow them to do things that in the past malign actors couldn't do. You worry about how it can be used to create biological and chemical weapons, how to do cyberattacks on infrastructure, and carry out acts of violence or terrorism, that could have a huge cost.\"", "created_at": "2026-11-12T06:18:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2120690035418603810", "likes": 402, "retweets": 33, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120689173103296512/img/fStj-tR3eyjg4BAX.jpg"}], "links": {"https://t.co/vmlJdoU0RN": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120760165247168728", "url": "https://x.com/theobearman/status/2120760165247168728", "text": "@zorache_ Thank you for clarifying! Looking forward to hearing more", "created_at": "2026-11-12T06:06:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "zorache_", "reply_to_id": "2120668177512415482", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120668177512415482", "author_handle": "zorache_", "author_name": "Zora Che", "text": "@theobearman thanks for writing this! speaking for myself, i worked on this project and the point in the blog around furthering monitorability science including cot monitorability is not a throwaway comment. \nbuilding multiple paths towards scalable oversight is also important!", "links": {}, "media": [], "url": "https://x.com/zorache_/status/2120668177512415482", "created_at": "Thu Nov 12 00:01:08 +0000 2026"}, "enriched": 3}, {"id": "2121230639353807270", "url": "https://x.com/theobearman/status/2121230639353807270", "text": "Amid all this NVIDIA news...\n\nScoop: The Super Intelligence Task force had its second meeting yesterday at the White House. Discussed:\n\n-the evolving cyber threat/strengthening US critical infrastructure\n-\"an update on implementation of the White House Accord, including efforts to align the signatories around a common set of industry standards and the opportunity to include additional private sector firms\"\n-Cairncross, Lutnick and Kratsios gave updates on the voluntary pre-deploying AI testing EO -- involving NSA and CAISSI\n-more TK!", "created_at": "2026-11-13T13:16:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ashleyrgold", "rt_author_name": "Ashley Gold", "rt_avatar": "https://pbs.twimg.com/profile_images/2100730381846646784/INs3gfH7_normal.jpg", "rt_id": "2121225874322211191", "likes": 45, "retweets": 21, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121128462261825781", "url": "https://x.com/theobearman/status/2121128462261825781", "text": "We show that looping a transformer increases no-CoT capabilities more than other ways of increasing pretrain quality would. https://t.co/SGRWmta1iR", "created_at": "2026-11-13T06:30:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "alek_westover", "rt_author_name": "Alek Westover", "rt_avatar": "https://pbs.twimg.com/profile_images/2121051682557841408/Y2uGqIlY_normal.jpg", "rt_id": "2120974693306130717", "likes": 357, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW820cVaMAATmOB.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW820cVaMAATmOB.png"}], "links": {"https://t.co/SGRWmta1iR": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121288827293798889", "url": "https://x.com/theobearman/status/2121288827293798889", "text": "We (partially) verified these results!\n\nUsing NVIDIA B200/H200s, we reproduced the reported patterns for three models.*\n\nWe also extended the DeepSeek-V4-Flash test to every weight position across the 42 layers examined and still detected the Blackwell pattern.\n\nSee the results here: \nhttps://t.co/TCAfDSGQRx\n\nThis is a super clever approach by @willdepue, and matches reporting that top Chinese AI labs are using Blackwells.\n\n* The repo didn’t contain all the inputs needed to test most of the other models", "created_at": "2026-11-13T17:07:22+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "rt_avatar": "https://pbs.twimg.com/profile_images/1778546830978019328/f3xa3Iaa_normal.jpg", "rt_id": "2121274136739873190", "likes": 48, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXAppzfXEAABiUK.jpg"}], "links": {"https://t.co/TCAfDSGQRx": "https://github.com/Institute-for-Progress/checkpoint-forensics-verification-public", "https://t.co/8QdLPYZx3o": ""}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121283600490394020", "url": "https://x.com/theobearman/status/2121283600490394020", "text": "One of the strong arguments for why renting chips to China is better than selling them is that it gives the US optionality to control them in the future. Unfortunately when the renter is Megaspeed that case breaks down, and remote access looks more liability than optionality 🧵", "created_at": "2026-11-13T16:46:36+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "rt_avatar": "https://pbs.twimg.com/profile_images/1612127888475570176/X_ZBlRj0_normal.jpg", "rt_id": "2121273310432391349", "likes": 2, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "thread": [{"id": "2121273313318285630", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The original rent don't sell argument largely had in mind Chinese firms buying cloud services from US hyperscalers. In reality a large amount of Chinese remote access looks like chips being rented out by what are effectively Chinese off-balance sheet vehicles instead", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273313318285630", "created_at": "Fri Nov 13 16:05:43 +0000 2026"}, {"id": "2121273315012526198", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Megaspeed is the most egregious case, where reporting around the Jensen saga has clearly demonstrated how far it was simply a vehicle for Alibaba to circumvent chip controls, and was itself actively engaged in smuggling of chips into China", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273315012526198", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273316501545329", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Rather than remote access enabling continued cloud business under auspices of US cloud players, it instead has turned into an enabler for networks of shell firms in Southeast Asia and China to engage in hugely profitable violations of US controls", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273316501545329", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273318066057611", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "When firms such as Megaspeed which have no jurisdictional attachments, and are de facto controlled by Chinese interests, lose access to future chip shipments, one of the most logical moves will be to work to smuggle into China their chips held in SEA, profiting from huge markups", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273318066057611", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273320570249382", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The hundreds of thousands of chips being owned and operated by similar firms across Asia are the riskiest pool for future smuggling. Allowing those same firms to continue freely buying up advanced AI hardware, including Vera Rubins, would be a major strategic error", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273320570249382", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273323325952421", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Smuggling is not just bad because of the illegality or national security implications, but also since future international treaties on AI are likely to rest on effective tracking and verification of existing chip stocks", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273323325952421", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273325070458889", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The existence of hundreds of thousands to millions of advanced chips in an unmonitored and uncontrolled grey market across Asia is highly antithetical to making future deals which rely on minimal dark compute", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273325070458889", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273328212316231", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Overall the US should take immediate action to clamp down on remote access, pairing this with stricter policies on chip buyer whitelists, chip tracking and whistleblower rewards to reduce the risk of remote access chips blurring too easily into smuggled ones", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273328212316231", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}, {"id": "2121273329763893326", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Read my full piece making this case at https://t.co/DScRuaOWiM", "links": {"https://t.co/DScRuaOWiM": "https://open.substack.com/pub/erwald/p/ai-chips-rented-to-chinese-firms?r=hemux&utm_campaign=post&utm_medium=web"}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273329763893326", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}], "enriched": 3}, {"id": "2121336831686115617", "url": "https://x.com/theobearman/status/2121336831686115617", "text": "Threat actors are weaponizing ARTEX, an open-source, large language model (LLM)-driven agentic platform to automate multiple phases of cyber intrusions at machine speed. Since at least August 2026, a variety of malicious cyber actors have used ARTEX to conduct campaigns targeting organizations globally across multiple sectors, including financial services, government, and technology.\n\nARTEX significantly reduces the time required to chain attack techniques and enables threat actors with minimal technical expertise to conduct complex, multi-target operations simultaneously.\n\nToday, the FBI released a FLASH highlighting the tactics, techniques, and procedures and indicators of compromise associated with the ARTEX framework. Organizations should follow the mitigation steps outlined in the FLASH to improve their security posture in response to ARTEX and similar agentic SI frameworks: https://t.co/l9lgbqWNYk", "created_at": "2026-11-13T20:18:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FBICyberBranch", "rt_author_name": "FBI Cyber Branch", "rt_avatar": "https://pbs.twimg.com/profile_images/2039414588005920768/m2GtWI2h_normal.jpg", "rt_id": "2121317398305186287", "likes": 352, "retweets": 115, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXBu7o9WYAIp48S.jpg"}], "links": {"https://t.co/l9lgbqWNYk": "https://www.ic3.gov/CSA/2026/261113.pdf", "https://t.co/Spvq87XzsR": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121336227609923680", "url": "https://x.com/theobearman/status/2121336227609923680", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math.", "created_at": "2026-11-13T20:15:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2121331333654086124", "likes": 866, "retweets": 93, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB7mp4bQAAKN3a.jpg"}], "links": {"https://t.co/U17rzSxrFD": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121321652118249956", "url": "https://x.com/theobearman/status/2121321652118249956", "text": "@_NathanCalvin This is not the plan. Will be sharing more on how we’re thinking about human oversight and control in near future.", "created_at": "2026-11-13T19:17:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "kaicathyc", "rt_author_name": "Kai", "rt_avatar": "https://pbs.twimg.com/profile_images/1657816900817272832/ioGq5O0t_normal.jpg", "rt_id": "2120968650077196567", "likes": 135, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121321511453872616", "url": "https://x.com/theobearman/status/2121321511453872616", "text": "Safety evaluations are critical for understanding whether a model is ready to deploy, which safeguards to build for it, and where to focus training and research.\n\nOn our Engineering Blog, we offer 10 recommendations for how to design, run and report them.\n\nhttps://t.co/MtSQmqqi2D", "created_at": "2026-11-13T19:17:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2121317227618340990", "likes": 1159, "retweets": 74, "media": [], "links": {"https://t.co/MtSQmqqi2D": "https://www.anthropic.com/research/building-strong-safety-evaluations"}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121441984653230374", "url": "https://x.com/theobearman/status/2121441984653230374", "text": "I'm excited to launch Benchmark Almanac! It tracks 3,322 benchmarks from 1,746 leaderboards, 522 launch posts, 346 system cards, and 1,233 open-source GitHub repos. To my knowledge, it's the most comprehensive repo out there.\n\nWebsite: https://t.co/ARgu9TdU6x https://t.co/lFynTAY4ZQ", "created_at": "2026-11-14T03:15:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "brian1zhou", "rt_author_name": "Brian Zhou", "rt_avatar": "https://pbs.twimg.com/profile_images/2062073325753716736/4m7jdCEN_normal.jpg", "rt_id": "2121375297954300164", "likes": 134, "retweets": 14, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121375095226540032/img/7f-Pp47IVB6AfTG-.jpg"}], "links": {"https://t.co/ARgu9TdU6x": "https://www.benchmarkalmanac.com", "https://t.co/lFynTAY4ZQ": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121432743238119783", "url": "https://x.com/theobearman/status/2121432743238119783", "text": "Are we in an intelligence explosion? This is one of the most important questions facing society right now. @lugaricano and I tried to put structure on this question and provide estimates based on currently available data.\n\nMETR recently reported that frontier capability growth roughly doubled after October 2025---but this is accompanied by annualized R&D spending growth of ~6x and technical staff ~3x over the same window. That highlights a crucial distinction between scaling laws--exponential capability gains bought with exponentially rising inputs--and an intelligence explosion (IE), where AI begins substituting for external inputs so each advance makes the next one easier.\n\nWe estimate several versions of a research production function (building on @ChadJonesEcon, @bfjo, and @Ph_Aghion) where a key parameter crossing a threshold signals an IE, while values below it correspond to an \"ideas are harder to find,\" diminishing-returns world. Across specifications, our estimates sit below that threshold. Allowing for a break at METR's October 2025 cutoff points to a one-time step up in research effectiveness, with the rate of diminishing returns being nearly identical on both sides of the cutoff.\n\nA few things to note. First, this exercise is not a forecast. It's an attempt to put structure on some of the important questions being debated right now: RSI, IE, scaling laws all depend on how outputs scale with inputs, and how feedback loops accelerate/decelerate this process. These estimates can change, and change very quickly. \n\nSecond, we are very explicit that the results are based on publicly available data; it is very much possible that METR had access to data that would change the estimates.\n\nThird, we might be wrong! Let us know what you think:\n\nhttps://t.co/xMLZlSlxdY", "created_at": "2026-11-14T02:39:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "rt_avatar": "https://pbs.twimg.com/profile_images/1994816403359010817/0zMDGpbF_normal.jpg", "rt_id": "2121350760843931912", "likes": 285, "retweets": 49, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCNRklWAAEJKxq.png"}], "links": {"https://t.co/xMLZlSlxdY": "https://aleximas.substack.com/p/are-we-approaching-an-intelligence", "https://t.co/CYuGeQaESv": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121431658385555570", "url": "https://x.com/theobearman/status/2121431658385555570", "text": "M&amp;ATR", "created_at": "2026-11-14T02:34:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2121372541218623543", "author_name": "Fulcrum", "links": {}, "author": "fulcrum_inc", "text": "The Fulcrum team is joining @METR_Evals to work on alignment measurement. We feel the world is very unprepared for AI capabilities acceleration. We decided the best thing we could do is work on open science that informs the public."}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2120185558303477804", "url": "https://x.com/anton_d_leicht/status/2120185558303477804", "text": "Today, I'm delighted to share our report: Trust but Verify: Implementing Frontier AI Policy in California and Beyond.\n\nGoverning advanced AI is hard. Policymakers face an evidence dilemma: AI evolves so quickly that responding prematurely risks entrenching ineffective policies, while delaying action could leave society vulnerable to serious risks.\n\nWith no federal legislation focused on frontier AI safety, California is shaping frontier AI governance nationally. But passing legislation is only the first step. Whether California's approach succeeds depends on how it is implemented.\n\nThat's why, shortly after SB 53 passed, Carnegie assembled 13 world-leading experts to examine the most consequential implementation choices, identify issues for future legislation, and provide a blueprint for other jurisdictions.\n\n\"Trust but verify\" AI governance approaches are dynamic by design: they allow governments to generate more evidence on AI capabilities and risks to inform what comes next. SB 53 was always supposed to be the first, not final, step in frontier AI policy. Assessing its strengths and weaknesses can clarify where frontier AI policy should come after—in California and elsewhere.", "created_at": "2026-11-10T16:03:22+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": true, "rt_author": "Scott_R_Singer", "rt_author_name": "Scott Singer", "rt_avatar": "https://pbs.twimg.com/profile_images/1782319825634668544/0LE7q393_normal.jpg", "rt_id": "2120177252419694796", "likes": 67, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxhvjAXoAE0N7V.jpg"}], "links": {"https://t.co/DZmfNXsRpY": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2121306411670098178", "url": "https://x.com/anton_d_leicht/status/2121306411670098178", "text": "@TomDavidsonX I'm pretty confident that the odds of Europe refusing inspections agreed upon by the US and China are very low.\n\nAlso, allied buildout draws domestic compute from great powers, but it also draws international compute away from the gulf or SEA - which seems good for enforcement!", "created_at": "2026-11-13T18:17:15+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2121302355560005791", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121302355560005791", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "For a while I was excited about building data centres in Europe. For the obvious reason that without them Europe will be economically and militarily at the mercy of the US and China.\n\nBut now I'm not so sure.\n\nIf there's a US-China deal to restrict AI development, it might be much harder to verify if there's lots of compute in Europe.\n\nEven if China can verify that the US isn't developing powerful AI, they might worry that the US has secretly given Europe its weights and is pushing ahead on their behalf.\n\nSo now we need Chinese inspectors in European data centres just to make a bilateral US-China deal stable. That seems rough.\n\nWorse still, the US might worry that China has given Europe its weights and Europe is doing AI R&D for it. So now we need US inspectors in European data centres as well.\n\nBoth US and Chinese inspectors in European data centres!\n\nMore generally, I fear data centres outside of US+China will force any bilateral deal to become a v complicated multilateral affair. And that will be much harder to pull off.", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2121302355560005791", "created_at": "Fri Nov 13 18:01:08 +0000 2026"}, "enriched": 3}, {"id": "2121580141151195446", "url": "https://x.com/anton_d_leicht/status/2121580141151195446", "text": "@stevehou @grok yes, roughly - though I think it's less 'doesn't take breaks' and more 'works much much faster'; the breaks are just a simple way to clarify the speed differential in the analogy? \n\nthough I also think there are some complications here that the objection still doesn't address - might for instance be that you can go a bit faster than humans, but not much faster, before you actually hit brutal diminishing returns that come down to compute constraints / efficiency. Dwarkesh's right that that point of diminishing returns is unlikely to be *just* past human level, but it still matters a lot whether they set in after 1.5x acceleration or 20x acceleration", "created_at": "2026-11-14T12:24:57+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121577297358512271", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121577297358512271", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "@anton_d_leicht @grok Thanks that’s helpful. And the intuition is that even though bottlenecks exist, more AI will still be faster for the same quantity of compute input bc AI doesn’t take breaks in coming up with new ideas unlike humans so if Anthropic does a higher percentage of its R&D with AI it’ll move faster than otherwise?", "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121577297358512271", "created_at": "Sat Nov 14 12:13:39 +0000 2026"}, "enriched": 3}, {"id": "2121576132642251193", "url": "https://x.com/anton_d_leicht/status/2121576132642251193", "text": "@stevehou @grok it's in response to the claim 'you can't speed up labs very much by automating AI research because bottlenecks are elsewhere, e.g. in compute supply'; the intuition is: 'hey, SlothAI as described is obviously slower than OpenAI(now)' \n\nwhich is, in your words, a simple and understandable logical reasoning step for the complex result of 'research productivity matters even absent compute / input expansions; therefore OpenAI(RSI) might be meaingfully faster than OpenAI(now)'. \n\n(the stuff about 5x vs 50x just concedes that the relationship between productivity and research output isn't necessarily linear)", "created_at": "2026-11-14T12:09:01+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121560486135075173", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121560486135075173", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "How the hell is this an “intuition”?! I read this several times over and then had @grok confirm this for me. I’m pretty sure this is just Dwarkesh saying a string of words and calling it “intuition”. What’s intuitive about “an AI lab full of humans will be slower than an AI lab full of automated researchers bc humans think slower than machines, but not 50 times slower, only 5 times slower”?",
