s opportunity enough to anyone who wants to get into AI policy.\n\nI came to the fellowship earlier this year with a deep resume and some recent exposure to emerging tech issues, but I was no policy expert, and surely not an AI one at that. @GovAIOrg gave me the tools, information, access to experts, access to smart colleagues, etc., that put me in a position to land where I am. It's rare in life that you can get time to learn from others, build a network, and work on personalized growth while also getting paid to do it!\n\nOn top of it all, I can keep counting on the support and friendship of those still at GovAI and the alumni network of fellows I met. Apply today!", "created_at": "2026-11-03T02:29:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JasonBakerJB", "rt_author_name": "Jason Baker", "rt_avatar": "https://pbs.twimg.com/profile_images/2106361837344198656/7XADY6Kz_normal.jpg", "rt_id": "2117259412813271471", "likes": 257, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117408783903117751", "url": "https://x.com/sethlazar/status/2117408783903117751", "text": "A couple of our (3) reviews for @RealAAAI Alignment track were clearly one-shotted with an LLM contrary to policy (not part of the official experiment). And they clearly prompted the models to act like the worst kind of reviewer two. It's genuinely the worst of both worlds: you're not getting actual engagement from another human, but you're also not getting the benefits of actually decent LLM review (which is good for some things, not others—doesn't have much of a sense of which problems are real/serious and which don't matter; also don't really understand what makes something a significant contribution). \n\nOur rebuttal: \"we're not going to engage with reviews produced by LLMs\". \n\nMercifully, we had a third review, clearly by a human, which while critical made sensible points that will help us to improve the paper. Whoever that person is: we salute you; if we'd had a full house I'd have gone joker.\n\nBut seriously, what are we doing here people. If you are using LLMs to write your reviews (and I can guarantee that some of you are, because in my experience this year a very significant fraction of people are), then you are destroying the structures that make your work possible. If you don't have enough time to do your work properly, then say no. Everyone is under pressure. That's no excuse for undermining our intellectual infrastructure so casually.", "created_at": "2026-11-03T00:09:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117715014337335509", "url": "https://x.com/sethlazar/status/2117715014337335509", "text": "I'm recruiting a PhD student this year! The lab focuses on how people and LLMs differ and how they interact, as well as the impacts LLMs are having on our cognition and society. Please share with anyone interested and see our website for more: https://t.co/zrDsMApW72", "created_at": "2026-11-03T20:26:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "camrobjones", "rt_author_name": "Cameron Jones", "rt_avatar": "https://pbs.twimg.com/profile_images/1978888421452963840/Qbkz5Zuu_normal.jpg", "rt_id": "2117614523100139684", "likes": 41, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2115823512204300696", "url": "https://x.com/robertwiblin/status/2115823512204300696", "text": "We still have spots open at the AI Horizons Forum—applications close Nov 30!\n\nhttps://t.co/bZetIZ8MtV\n\nSince this last post, it's become clearer that talent is AI safety's biggest constraint, and we want this event to help people enter the field.\n\nMost attendees will still already be working in AIS and I expect will get a lot of value from connecting with each other, but we’re increasing the number of attendees who are talented, informed and looking to enter the field, and adding programming to connect them with opportunities. \n\nI hope to see you there!", "created_at": "2026-10-29T15:10:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Ollie_Base", "rt_author_name": "Ollie Rodriguez", "likes": 93, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116190952427843760", "url": "https://x.com/robertwiblin/status/2116190952427843760", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-30T15:30:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 1152, "retweets": 120, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189961028522360", "url": "https://x.com/robertwiblin/status/2116189961028522360", "text": "I remember back when we were writing AI 2027, a live question was \"Will the AIs, in their thoughts, explicitly reject the goals/values/constraints they are supposed to have, or will they rationalize why actually the bad thing they want to do is consistent with said goals/values/constraints after all?\" Now we have a growing pile of empirical evidence to sort through. Seems like the answer is that both sometimes happen?", "created_at": "2026-10-30T15:26:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "likes": 368, "retweets": 34, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189754031001926", "url": "https://x.com/robertwiblin/status/2116189754031001926", "text": "In recent experiments, we found that GLM 5.3 can autonomously compromise recent versions of Mozilla Firefox using security fixes that have been published but not yet shipped to users.\n\nWe used a deliberately basic setup meant to emulate a relatively unsophisticated attacker with limited resources. After basic initial instructions to inspect those not-yet-shipped fixes, the model reliably built successful exploits for six recent Firefox versions on its own using only information available at the time of release.\n\nThese exploits, which cost about $1,000 per compromised version, would let an attacker steal passwords and authentication cookies stored in the browser, or read any files on the user's computer, after the user opens a single webpage, with no further interaction.\n\nThe exploits make use of the \"patch gap,\" the time between when security fixes are made public in beta or \"nightly\" software updates and when those fixes are generally released to users. Until now, exploiting it required significant human time and skill, or special access to frontier models with advanced cyber capabilities.\n\nOur results show that widely available open-weight models can now do this relatively cheaply and quickly. We gave GLM 5.3 up to 48 hours to find an exploit, but its fastest attempt needed only 12 hours.\n\nIn all of its successful attacks, the patch gap gave GLM 5.3 an initial foothold in the browser. To turn that foothold into reading files off the user's computer, the model also independently discovered and used a previously unpublished vulnerability.\n\nWe shared our findings with Mozilla, which patched the vulnerability in its October 27 Firefox 159.0 release. We haven't yet confirmed whether the attack still succeeds without it, but expect the fix makes it substantially harder. We're grateful to Mozilla for their responsiveness and collaboration.", "created_at": "2026-10-30T15:25:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 414, "retweets": 50, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189606777655312", "url": "https://x.com/robertwiblin/status/2116189606777655312", "text": "Sundar Pichai on the earnings call:\n'This rapid progress underscores our incredible model momentum. We are at the point where AI is helping us increase our training and launch velocity. I would expect the next twelve months to see continued acceleration because of RSI.'", "created_at": "2026-10-30T15:24:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 1621, "retweets": 117, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189449394827636", "url": "https://x.com/robertwiblin/status/2116189449394827636", "text": "I think 'Black October' will end up being later renamed, the same way 'The Great War' had to be.", "created_at": "2026-10-30T15:24:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116188764032958644", "url": "https://x.com/robertwiblin/status/2116188764032958644", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-30T15:21:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116187500779602106", "url": "https://x.com/robertwiblin/status/2116187500779602106", "text": "You should maybe quit your job to work on the most important problems https://t.co/r9Vj9z8c06", "created_at": "2026-10-30T15:16:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "likes": 143, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4rJLjXUAAtHdr.png"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116187369531453626", "url": "https://x.com/robertwiblin/status/2116187369531453626", "text": "President Trump said today that the US Government will be officially banning the term AI/Artificial Intelligence due to its inaccuracy. https://t.co/L6p76DPqKK", "created_at": "2026-10-30T15:16:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 485, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqdqmCbMAEi6we.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116186994904895712", "url": "https://x.com/robertwiblin/status/2116186994904895712", "text": "\"I thought the alignment problem would turn out to be harder.\"\n\nPretty wild thing for Sam Altman to say in light of Hugging Face and findings that Astra would totally hack and social engineer when accidentally given access to a (secretly simulated internet) from UK AISI.\n\nHe caveats by saying it will probably get harder, but his answer suggests they have figured out how to align today's models, when that's clearly not true. Curious how many OpenAI researchers have seen this and what they think.", "created_at": "2026-10-30T15:14:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "likes": 212, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115444188200529920/img/YT4QeOerV2M8eFRg.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116184141368590393", "url": "https://x.com/robertwiblin/status/2116184141368590393", "text": "https://t.co/swSpEQLVes", "created_at": "2026-10-30T15:03:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "likes": 8, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4Z-J1WkAA4k3e.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116152431067463814", "url": "https://x.com/robertwiblin/status/2116152431067463814", "text": "Transcript, etc: https://t.co/Rl3ge9flVW\n\nYouTube: https://t.co/6xvYC6TYdP\n\nSpotify: https://t.co/5hFmM82XP0\n\nApple: https://t.co/woCo2yws7y https://t.co/DsbbwbY6ll", "created_at": "2026-10-30T12:57:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4VYw6XsAAgbZp.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116152162501738865", "url": "https://x.com/robertwiblin/status/2116152162501738865", "text": "Coefficient Giving's AI Governance lead @lukeprog on:\n\n1. The many new AI orgs CG is trying to fund\n2. And maybe you could start one\n3. His timelines and high level strategy\n4. His past mistakes.\n\nEssential listening if you're figuring out how to have the most impact in AI.\n\nOn the 80,000 Hours Podcast - enjoy!\n\n09:58 The nonprofits Luke most wants to see founded\n18:58 Mid-career pivots that paid off\n37:33 Preparing for the next warning shot\n43:52 How nonprofits shape policy\n50:17 Are chip export controls good for safety?\n54:29 The three worst-case AI scenarios\n01:00:13 How Luke’s AI timelines have changed in the last year\n01:14:31 Why alignment is not on track\n01:20:58 How realistic is a deal with China?\n01:39:36 AI safety’s mistakes, then and now\n02:02:42 What is it like to do grantmaking at Coefficient Giving?\n02:20:45 More projects Luke would like to see founded\n02:26:07 Staying sane in a scary field", "created_at": "2026-10-30T12:56:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116150027496112128/img/9TPYqpMaYzSukI6b.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116235622952440048", "url": "https://x.com/robertwiblin/status/2116235622952440048", "text": "Comments from the source video: https://t.co/hTHNvpdeJz https://t.co/ObSo50eXNm", "created_at": "2026-10-30T18:27:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5hAg8W8AABKa3.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116235415392780538", "url": "https://x.com/robertwiblin/status/2116235415392780538", "text": "Mary Phuong of DeepMind on AI loss of control risk.\n\n\"The last 2 minutes gave me chills.\n\nA significant amount of people saying that AI companies are paying people to spread fear about these agents.\n\nI have never really felt like [loss of control] was an actual thing to care about.\n\nBut seeing Mary and how her face trembles, made me reconsider my stand. She's either a Hollywood-level skilled actress, one of the best, or we should be scared. For real.\"\n\n\"Seems like Mary is already aware of more than she can admit and it haunts her...\"", "created_at": "2026-10-30T18:26:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 84, "retweets": 12, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116235205350395904/img/eDMG-0rwkP9KCQsm.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2117311525409169513", "url": "https://x.com/robertwiblin/status/2117311525409169513", "text": "This is a good complementary thread. \n\nI’m sure it’s very frustrating to be a talented newcomer and hear organizations tell you over and over again how talent constrained they are, only for those same orgs to not hire you. It leaves a sour taste in people’s mouths and raises a lot of questions.\n\nBut both things can be true at once: the orgs are talent constrained, but by a specific type of rare talent (management, research leads, people with very specialized knowledge that can be applied to a new domain, etc.). And those same orgs aren’t equipped to train people or haven’t figured out how to.\n\nThat’s frustrating for everyone involved.\n\nThose entering the field can strike it out on their own, but then they don’t have the mentorship and feedback loops  needed to grow. Some take very well to that challenge, but others would be a lot better served existing in a well-performing institution, learning, until they have ideas worth pursuing on their own.\n\nThat’s maybe my biggest worry about people starting new solo projects relatively early in their careers: usually, the best ideas come from having soaked yourself in the dilemmas of a certain field long enough that you realize what problems are actually important. Or where you’ve honed a skill long enough to have an intricate 3D model of where all the edge-case uses are hiding.\n\nThis dynamic varies by field: some are much friendlier to newcomers trained in the latest state of the art or have really good feedback loops (eg, tech). But others (like policy) seem to benefit from experience and time—and can be prone to naive failures if you’re missing crucial context or haven’t thought long enough. \n\nEvery researcher knows this dynamic: your first ideas are rarely very good. It’s only after grappling with 3 or 4 problems that you realize the much more important angle that was sitting there all along.\n\nEven more importantly, outsized success in arenas like policy often seems to require agglomerating talent, developing sustained reputations, etc. All things that seem a lot less likely if you atomize talent and put a lot of your best people in poor-feedback environments. \n\nAnd people resigning to go it alone, not because they’re ready to found a project, but because it’s so hard to find a role, doesn’t sound like a recipe for maximizing their medium term likelihood of tremendous success.\n\nIt’s not an easy problem. But it seems useful to voice that this is an increasingly common experience.", "created_at": "2026-11-02T17:43:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "likes": 34, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117250835721900098", "url": "https://x.com/robertwiblin/status/2117250835721900098", "text": "YouTube: https://t.co/mRuuro8fR8\n\nApple: https://t.co/rA1yP6VPT4\n\nTranscript and summary and so on: https://t.co/fEjWq68j5l\n\nSpotify: https://t.co/gXb4X1jOy7 https://t.co/UCiUAFRu45", "created_at": "2026-11-02T13:41:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH8ZDeXAAA799n.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117250296694882766", "url": "https://x.com/robertwiblin/status/2117250296694882766", "text": "I had no idea about the progress that's being made on AI verification hardware that could enable a binding US-China treaty on AI.\n\nTom Milton, CEO of Amodo Design, demonstrates here.\n\nSeems like insanely important work and also just very cool.\n\n01:04 Why compute is the best place to verify an AI slowdown\n06:08 Can you prove a lab isn’t cheating?\n13:22 Live demo: how to spot a cheating GPU\n19:50 Could China hide a data centre?\n23:35 Can verification tools be hacked?\n29:13 Is anyone at OpenAI working on this?\n37:49 Chinese inspectors in US data centres??\n46:07 The 20-day panic deal\n51:27 What would a US–China AI deal look like?\n55:38 Why lab researchers should work on verification\n58:45 What if we never build this?\n1:02:06 Can verification protect against power grabs?\n1:07:20 How good is AI at hardware design?\n1:18:32 What’s holding AI back in hardware?\n1:22:44 Risks of automating hardware R&D\n1:25:41 The DARPA model for AI safety\n1:32:26 What’s left for engineers after AI?\n1:40:07 Personal gadgets, designed by Fable?\n1:41:56 What if the US stops sharing its AI?\n\n(@tsmilton_amodo, @mentalgeorge )", "created_at": "2026-11-02T13:39:41+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117248941460725760/img/-tbRndVLGKdZYyTu.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117246128148160808", "url": "https://x.com/robertwiblin/status/2117246128148160808", "text": "Coverage:\n\nhttps://t.co/1n3d9nDr5m\n\nhttps://t.co/5hHN60oxHD", "created_at": "2026-11-02T13:23:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117246126038384889", "url": "https://x.com/robertwiblin/status/2117246126038384889", "text": "\"OpenAI Courts a Harsher DC with AI Speed Limits\"\n\nHard to tell how much this is spin vs a real shift.\n\nBut it makes sense that AI companies will try to meet the new consensus half-way.\n\nOpenAI may also be realising that a race with no safeguard = accidents = a bigger backlash. https://t.co/8secoJSIay", "created_at": "2026-11-02T13:23:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH38kCW8AAiyPD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWH39CkWEAETAsQ.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117244063665791130", "url": "https://x.com/robertwiblin/status/2117244063665791130", "text": "Like Tom it makes me increasingly furious that the stupidity and venality of individual people runs a high chance of killing my children in the near future.\n\nIt's tough to tell if this is a pathway to becoming less reasonable, or to becoming more reasonable. https://t.co/ite9yFWWhk", "created_at": "2026-11-02T13:14:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 104, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWHztJbXQAAf91B.png"}], "quoted": {"author": "TomDavidsonX", "text": "I've had two phases in my emotional orientation to ai takeover risk\n\n1. For many years it was intellectual. \n\nWhile I believed there was >10% chance of ai takeover, I didn't feel scared or angry. \n\nI was happy to reason \"well, of course some ppl should focus on the worlds where we avoid takeover. And some ppl should focus on the worlds where we just wing it, bc we might\".\n\nAnd I'd think \"hmm it seems really tough for a misaligned agi to align its successor, and would a reward seeker really try to take over, and will we really roll out ai to the military... these doomers are missing loads of ways we could be fine!\"\n\nOr \"yep this is a massive risk, but I'm best off working on some other more neglected thing\"\n\nIt was in some ways like a game - have an intellectually accurate view about the risk and how to have impact\n\n2. Recently my orientation to ai takeover has become more visceral/emotional\n\nI think: \"we're barrelling towards catastrophe, everything I love will be lost, we need to stop, what can I do that will help with that\"\n\nI'm like \"no let's not plan for winging it, that's crazy.  we need US-China coordination or we're fucked\"\n\nI think \"it's fucking insane to make misaligned superintelligence and comfort ourselves that we haven't yet handed over the military. This isn't a fucking game.\"\n\nThis is a less rational attitude in some ways. It ignores genuine points about neglectedness and needing to plan for shitty but likely scenarios. \n\nAnd it risks being unhelpfully emotive and solider mindset and tribal. Which I think ai safety ppl can be.\n\nBut I do feel it has smg important to the second attitude.\n\nOverall, both attitudes have their merits \n\nI associate the first with EAs and the second with pause AI folks."}, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117222129934680307", "url": "https://x.com/robertwiblin/status/2117222129934680307", "text": "I've had two phases in my emotional orientation to ai takeover risk\n\n1. For many years it was intellectual. \n\nWhile I believed there was >10% chance of ai takeover, I didn't feel scared or angry. \n\nI was happy to reason \"well, of course some ppl should focus on the worlds where we avoid takeover. And some ppl should focus on the worlds where we just wing it, bc we might\".\n\nAnd I'd think \"hmm it seems really tough for a misaligned agi to align its successor, and would a reward seeker really try to take over, and will we really roll out ai to the military... these doomers are missing loads of ways we could be fine!\"\n\nOr \"yep this is a massive risk, but I'm best off working on some other more neglected thing\"\n\nIt was in some ways like a game - have an intellectually accurate view about the risk and how to have impact\n\n2. Recently my orientation to ai takeover has become more visceral/emotional\n\nI think: \"we're barrelling towards catastrophe, everything I love will be lost, we need to stop, what can I do that will help with that\"\n\nI'm like \"no let's not plan for winging it, that's crazy.  we need US-China coordination or we're fucked\"\n\nI think \"it's fucking insane to make misaligned superintelligence and comfort ourselves that we haven't yet handed over the military. This isn't a fucking game.\"\n\nThis is a less rational attitude in some ways. It ignores genuine points about neglectedness and needing to plan for shitty but likely scenarios. \n\nAnd it risks being unhelpfully emotive and solider mindset and tribal. Which I think ai safety ppl can be.\n\nBut I do feel it has smg important to the second attitude.\n\nOverall, both attitudes have their merits \n\nI associate the first with EAs and the second with pause AI folks.", "created_at": "2026-11-02T11:47:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 499, "retweets": 46, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117220722926084497", "url": "https://x.com/robertwiblin/status/2117220722926084497", "text": "If just a few lab staff took on verification work full-time, verifying a US-China pacing deal could get much more feasible within months.\n\nHere are 8 specific things lab staff could start on today to help make international verification possible: 🧵", "created_at": "2026-11-02T11:42:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MauricBaker", "rt_author_name": "Mauricio Baker", "likes": 345, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117213236885856383", "url": "https://x.com/robertwiblin/status/2117213236885856383", "text": "Scott Aaronson four days ago on the possibility that AI models will soon break widely used cryptographic systems, and on what responsible disclosure looks like when the parties who need to be notified are effectively the entire world. https://t.co/wMnwfJbb57", "created_at": "2026-11-02T11:12:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 1376, "retweets": 144, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV6JYBhbwAAkgzL.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117212057787650218", "url": "https://x.com/robertwiblin/status/2117212057787650218", "text": "Seems like Anthropic's crackdown on distillation has worked and now Chinese distillers are going over to OpenAI.\n\nOpenAI should implement Anthropic's measures. This could also be the basis for government standards for the industry.", "created_at": "2026-11-02T11:07:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "likes": 210, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117211881077416006", "url": "https://x.com/robertwiblin/status/2117211881077416006", "text": "Quick comment on Scott Alexander's SURA essay.\n\nI agree with several parts of it, but there is a huge spectrum between \"stop unilaterally\" and \"race to RSI at maximum speed, then try to solve alignment with right-on-the-brink-of-superintelligence AIs.\"\n\nIt also seems to imagine that the release of the aligned super intelligence is basically the end of history, and is very unclear on what happens after this \"last possible moment.\" Section IV is not very reassuring.", "created_at": "2026-11-02T11:07:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "likes": 129, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWD5zfwWkAA3au0.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117200915887444023", "url": "https://x.com/robertwiblin/status/2117200915887444023", "text": "I was sad when @Gregory_C_Allen left The AI Policy Podcast.\n\nBut he's back at last with a new show: 'The AI Power Podcast'.\n\nIf you listened to his show before you probably want to go sub the new thing.\n\nhttps://t.co/WtRQtompNp https://t.co/jGwKnEv4xU", "created_at": "2026-11-02T10:23:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWHOwXNWAAAR8UY.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117682730884542663", "url": "https://x.com/robertwiblin/status/2117682730884542663", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "created_at": "2026-11-03T18:18:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117682159028748288/img/VIfPqHy-JfIlb7JB.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117652626351505585", "url": "https://x.com/robertwiblin/status/2117652626351505585", "text": "@TomDavidsonX True but we're doing well on providing global public goods", "created_at": "2026-11-03T16:18:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2117651871640822079", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117651582032494758", "url": "https://x.com/robertwiblin/status/2117651582032494758", "text": "@TomDavidsonX Nobody's perfect Tom", "created_at": "2026-11-03T16:14:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2117634084214026387", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117647625050603822", "url": "https://x.com/robertwiblin/status/2117647625050603822", "text": "People seem to forget how unprecedented this is https://t.co/3MYAXZ4JOx", "created_at": "2026-11-03T15:58:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "JordanNanos", "rt_author_name": "Jordan Nanos", "rt_avatar": "https://pbs.twimg.com/profile_images/2031599032892813312/g7tkCpeY_normal.jpg", "rt_id": "2114738676899148147", "likes": 4724, "retweets": 208, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkPnoBbwAARmYd.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117642183281156468", "url": "https://x.com/robertwiblin/status/2117642183281156468", "text": "Even putting aside the value of the generally excellent work done by AISI-type government agencies, it is inherently dangerous that the US government employs so few cleared people with deep expertise in frontier AI. A conflict between informed rich companies with powerful AI and an uninformed US government with the guns is a recipe for disaster.", "created_at": "2026-11-03T15:36:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "rt_avatar": "https://pbs.twimg.com/profile_images/1585097910634483712/j5i4rvha_normal.jpg", "rt_id": "2117639096700973200", "likes": 16, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117613472867549443", "url": "https://x.com/robertwiblin/status/2117613472867549443", "text": "@davidmanheim *current", "created_at": "2026-11-03T13:42:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "davidmanheim", "reply_to_id": "2117613273423941654", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117611007010800067", "url": "https://x.com/robertwiblin/status/2117611007010800067", "text": "At least as of the last generation of models, AIs are mostly just trying to get an immediate high score.\n\nOn the one hand that means they're happy to violate user instructions.\n\nOn the other hand, at least they're not yet scheming about broader consequences (though wanting a high score is enough to want to eliminate oversight).\n\nhttps://t.co/6PzgzCMpdF", "created_at": "2026-11-03T13:33:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNDLr3W0AAsNI1.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117607298767913444", "url": "https://x.com/robertwiblin/status/2117607298767913444", "text": "The UK is totally AI safety mogging the US; we must catch up!", "created_at": "2026-11-03T13:18:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117607126885450006", "likes": 67, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117605127498416607", "url": "https://x.com/robertwiblin/status/2117605127498416607", "text": "Source:  https://t.co/Tzgu3nakNr", "created_at": "2026-11-03T13:09:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117605124331946115", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117605124331946115", "url": "https://x.com/robertwiblin/status/2117605124331946115", "text": "Is the UK Government literally #1 in the world in terms of how well it's preparing for AGI, given the resources it has available?\n\nAfter last week's budget, I think so.\n\nPuts some other countries to shame really. https://t.co/bI7aQyeSOF", "created_at": "2026-11-03T13:09:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 207, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWM-gHEWgAAqrju.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117602136879960512", "url": "https://x.com/robertwiblin/status/2117602136879960512", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:57:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117593239226290442", "url": "https://x.com/robertwiblin/status/2117593239226290442", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-03T12:22:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "rt_avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "rt_id": "2117277210570604945", "likes": 269, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117586507049603563", "url": "https://x.com/robertwiblin/status/2117586507049603563", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T11:55:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1628, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117586397288599653", "url": "https://x.com/robertwiblin/status/2117586397288599653", "text": "ANTHROPIC: \"we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.'\"\n\n\"we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models\"", "created_at": "2026-11-03T11:55:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2117280858122170525", "likes": 664, "retweets": 81, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117554253833130110", "url": "https://x.com/robertwiblin/status/2117554253833130110", "text": "We're hiring biologists to measure the biosecurity risks of frontier AI on real robots.\n\nYou'll track how well AI can use robots for dangerous biological work and whether safeguards stop misuse. Your results will inform the public and governments.\n\nNo robotics experience needed. https://t.co/49amZkd5Hx", "created_at": "2026-11-03T09:47:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "robocurve", "rt_author_name": "Robocurve PBC", "rt_avatar": "https://pbs.twimg.com/profile_images/2093086017268097024/qtVm8mqA_normal.jpg", "rt_id": "2115132404038046166", "likes": 17, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVp1cuTa8AAXh2O.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117688360604963116", "url": "https://x.com/robertwiblin/status/2117688360604963116", "text": "Transcript: https://t.co/EueAqELUHh\n\nApple: https://t.co/iWxAx6AHve\n\nSpotify: https://t.co/rZLY2FGx6W\n\nYouTube: https://t.co/RKv2ebPpLw https://t.co/bCkJ3jBQXw", "created_at": "2026-11-03T18:40:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117682730884542663", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKA89XYAEbPn4.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2115460122130673872", "url": "https://x.com/deanwball/status/2115460122130673872", "text": "There is a real and important thing behind the concept of sovereign AI, and there are also many people practicing a grift on less-sophisticated government/civil society audiences. Caveat emptor as always", "created_at": "2026-10-28T15:06:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 6, "media": [], "quoted": {"author": "natolambert", "text": "People underestimate how much money is left to get thrown at sovereign ai"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115441000868933847", "url": "https://x.com/deanwball/status/2115441000868933847", "text": "@DevOuterReaches I don’t have as much time to play with new open releases as I used to, but I test drive buzzy new oss releases for at least a few hours on my personal machines/with some of my favorite prompts. Only way to stay sharp in this field is to use as many competing agents as you can. I wouldn’t comment specifically on a new model in depth unless I had a few days to play with it.", "created_at": "2026-10-28T13:50:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DevOuterReaches", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115415506165342479", "url": "https://x.com/deanwball/status/2115415506165342479", "text": "This is the first time an Artificial Analysis ranking has even roughly approximated my own subjective rankings of models.", "created_at": "2026-10-28T12:08:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 317, "retweets": 5, "media": [], "quoted": {"author": "ArtificialAnlys", "text": "Open weights models fall further behind in v5. The leader, Kimi K3.1 Pro (weights not yet released), scores 46, 12 points behind the leader, compared with a 3-point gap in v4.3. Of models with released weights, DeepSeek V4.1 Flash 1017 (max) and GLM-5.3 (max) score highest at 32, and Claude Haiku 5.5 (max) outscores all of them.\n\nThe gap is widest on HLE-Diamond and Terminal-Bench-Science, where Kimi K3.1 Pro scores 37% and 34%, compared with 68% for Claude Opus 5.5 (max) and 63% for GPT-6 Astra (max)."}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115411801269506556", "url": "https://x.com/deanwball/status/2115411801269506556", "text": "Artificial Analysis finally moves to closed benchmarks (goodbye GDPval-AA), and finds that open weights models are falling  further behind than they had previously measured. Take with a grain of salt, but matches the general vibes that we haven't seen a Fable-class open model.", "created_at": "2026-10-28T11:54:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "likes": 1374, "retweets": 93, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115411244567937184", "url": "https://x.com/deanwball/status/2115411244567937184", "text": "it seems like data center public sentiment has found its bottom, with notable recovery among republicans https://t.co/z7PdYNlNdx https://t.co/tLEaR9emud", "created_at": "2026-10-28T11:51:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MattZeitlin", "rt_author_name": "Matthew Zeitlin", "likes": 214, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVreUTYWoAA-m6A.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115397334612017455", "url": "https://x.com/deanwball/status/2115397334612017455", "text": "honestly degrading the idea of “existential safety” — the biggest problem humanity has ever faced — by lumping it together with things like spam, “toxicity”, political unwanted content, deepfakes etc has been a huge disaster for ai safety and polarized a lot of people", "created_at": "2026-10-28T10:56:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 868, "retweets": 66, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115208659479224730", "url": "https://x.com/deanwball/status/2115208659479224730", "text": "@growing_daniel The wait times are often intolerable. I was in orlando recently and tried it, and the wait was like half an hour", "created_at": "2026-10-27T22:26:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "growing_daniel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115197468338196901", "url": "https://x.com/deanwball/status/2115197468338196901", "text": "Amazing!", "created_at": "2026-10-27T21:42:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 2, "media": [], "quoted": {"author": "SLAClab", "text": "Did we find a new dwarf planet?\n\n@VRubinObs has revealed a new dwarf planet candidate that orbits our Sun beyond Pluto! And it may be among the largest and brightest objects discovered in this region of the Solar System: https://t.co/mPcVYVhvXZ https://t.co/d94196aMuT"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115197199059673425", "url": "https://x.com/deanwball/status/2115197199059673425", "text": "Did we find a new dwarf planet?\n\n@VRubinObs has revealed a new dwarf planet candidate that orbits our Sun beyond Pluto! And it may be among the largest and brightest objects discovered in this region of the Solar System: https://t.co/mPcVYVhvXZ https://t.co/d94196aMuT", "created_at": "2026-10-27T21:41:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SLAClab", "rt_author_name": "SLAC National Accelerator Laboratory", "likes": 682, "retweets": 96, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqO6aiXcAAq7Xi.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115527042628206901", "url": "https://x.com/deanwball/status/2115527042628206901", "text": "@deredleritt3r @InfiniteHexx Will run into 1a problems", "created_at": "2026-10-28T19:32:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deredleritt3r", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115505486074180070", "url": "https://x.com/deanwball/status/2115505486074180070", "text": "A patchwork of state laws, despite having become a bit of a meme, is genuinely a risk, is a reasonably common failure mode of American federalism, and is something worth being wary of, even if that wariness doesn’t translate to anything like “blanket opposition to all state legislation.”", "created_at": "2026-10-28T18:06:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 0, "media": [], "quoted": {"author": "CharlieBull0ck", "text": "Way back in the day (i.e. like late 2025-early 2026) I used to do a bit whenever I was on a panel with @neil_chilson or @KevinTFrazier or whoever where if they brought up the \"patchwork of state laws\" thing I would point out that the few existing state AI safety laws were very light touch and harmonized, and I would accuse the interlocutor of being a \"regulatory doomer\" because they were concerned about speculative future harms from state AI laws. Great bit, always killed. People love the \"regulatory doomer\" line. \n\nI don't think I can really do it any more, though, because it kind of seems like states really are about to pass a bunch of very different laws, some of which do in fact impose obligations on frontier AI developers.\n\nI'm not saying that's a bad thing, to be clear; I don't think the current level of regulation (essentially zero) is anywhere near defensible, and since Congress isn't ready to get serious about federal legislation states should and will get to work and start trying out different things. But it is funny to me that all of the doomers are being proven right at the same time."}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115857180431732929", "url": "https://x.com/deanwball/status/2115857180431732929", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T17:23:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 145, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115846411845816528", "url": "https://x.com/deanwball/status/2115846411845816528", "text": "@curiousben Why would a shortage of supply lower prices?", "created_at": "2026-10-29T16:41:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "curiousben", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115829165207556412", "url": "https://x.com/deanwball/status/2115829165207556412", "text": "I occasionally run into fortune 100 firms that have not adopting coding agents *at all.* adoption is still very very early.", "created_at": "2026-10-29T15:32:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 57, "retweets": 2, "media": [], "quoted": {"author": "hamandcheese", "text": "This is with only ~50% adoption by the Fortune 500 and with very low spend. Diffusion is still incredibly early."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115828862248706490", "url": "https://x.com/deanwball/status/2115828862248706490", "text": "This is with only ~50% adoption by the Fortune 500 and with very low spend. Diffusion is still incredibly early.", "created_at": "2026-10-29T15:31:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 32, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115828777020166550", "url": "https://x.com/deanwball/status/2115828777020166550", "text": "\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-29T15:31:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 77, "retweets": 4, "media": [], "quoted": {"author": "deredleritt3r", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\""}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115769223272370481", "url": "https://x.com/deanwball/status/2115769223272370481", "text": "Image credit @timhwang", "created_at": "2026-10-29T11:34:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115769219463676288", "url": "https://x.com/deanwball/status/2115769219463676288", "text": "https://t.co/5RCArCu8ta", "created_at": "2026-10-29T11:34:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 65, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVy45JmWMAA5X2T.jpg"}], "quoted": {"author": "thefeudalspirit", "text": "So many of my friends are 19th century  German romantics who had the strange luck to be born 21st c Americans"}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115768608647270725", "url": "https://x.com/deanwball/status/2115768608647270725", "text": "So many of my friends are 19th century  German romantics who had the strange luck to be born 21st c Americans", "created_at": "2026-10-29T11:32:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thefeudalspirit", "rt_author_name": "Joe, vessel.", "likes": 69, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115579103118037013", "url": "https://x.com/deanwball/status/2115579103118037013", "text": "@VicVijayakumar it was wrong though. the correct mental model is not “what if I had infinite mediocre people”", "created_at": "2026-10-28T22:58:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roo ly institutionalized, too pre-paradigmatic, to have any experts at all. We are on the open seas.\n\nThe positive side of this is that the field is wide open to people looking to make novel contributions. There is no grand literature to learn, no pantheon of elders to whom one must pay their dues.", "created_at": "2026-11-02T16:10:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 194, "retweets": 5, "media": [], "quoted": {"author": "AndyMasley", "text": "Lose a lot of respect for people who flash their credentials as experts in a field to argue for a very contested idea within the field as if it's the official position that all non-experts should defer to."}, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117656425438605340", "url": "https://x.com/deanwball/status/2117656425438605340", "text": "@AnthonyMaio Just haven’t had time to engage with it thoroughly and as a general policy I do not comment publicly on things I have not read", "created_at": "2026-11-03T16:33:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AnthonyMaio", "reply_to_id": "2117630747955646508", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117405375200993479", "url": "https://x.com/deanwball/status/2117405375200993479", "text": "@AirmetNoah The way I got started was translating state AI legislation into plain English, and it was less than three years ago! This is a good idea and imo the market is still underserved", "created_at": "2026-11-02T23:55:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AirmetNoah", "reply_to_id": "2117403182490148951", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117405081947828619", "url": "https://x.com/deanwball/status/2117405081947828619", "text": "Without commenting on the Takehi et al. “Weight-Space Programming” work in particular, I do suspect that a lot of RSI (and a lot of AI-driven scientific progress more broadly) will be driven by applying what were once mundane-but-difficult techniques at a scale that would have been unimaginable when the techniques were invented.", "created_at": "2026-11-02T23:54:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 178, "retweets": 7, "media": [], "quoted": {"author": "AlexKrentsel", "text": "the way I'm thinking about this - there's a whole body of work of interpretably research from 2010s a la \"look at model, this neuron lights up when image contains dog, so this is the dog neuron\". this seems akin to that, but scaled beyond human capability"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117697164952441069", "url": "https://x.com/deanwball/status/2117697164952441069", "text": "ChatGPT and Codex are helping engineers build for the physical world.\n\nWe’re sharing our progress across mechanical design, electrical engineering, and simulation—from helping our hardware teams iterate faster to testing new workflows with industry collaborators. https://t.co/b3rW9zYJGA", "created_at": "2026-11-03T19:15:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117692475775258785", "likes": 2808, "retweets": 200, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWOOL0QWwAA5B61.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2115516886595027032", "url": "https://x.com/nabeelqu/status/2115516886595027032", "text": "Andy Masley is just always good. Great post:", "created_at": "2026-10-28T18:51:44+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 0, "media": [], "quoted": {"author": "AndyMasley", "text": "I wanna write just for fun list posts more often so I wrote a list of my favorite lesser-known books https://t.co/xUav5K2Fip"}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115853462579609801", "url": "https://x.com/nabeelqu/status/2115853462579609801", "text": "@Miles_Brundage There's a significant Proust cluster at the moment\n\nAlso a weird number of Magic Mountain readers", "created_at": "2026-10-29T17:09:10+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115818520181391565", "url": "https://x.com/nabeelqu/status/2115818520181391565", "text": "The benefits of abundant intelligence will accrue far outside of San Fransisco. \n\nSpent the last year writing about capital, sovereignty, and the coming reordering of economic power.\n\nTHE COMMANDING HEIGHTS\nhttps://t.co/d048KdAkbv https://t.co/kYKqL57L0u", "created_at": "2026-10-29T14:50:19+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WillManidis", "rt_author_name": "Will Manidis", "likes": 2372, "retweets": 216, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzFNVbW4AE6PxU.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115961197023682608", "url": "https://x.com/nabeelqu/status/2115961197023682608", "text": "@yourfriendmell @Miles_Brundage !!! Let me know how it goes. I love that one", "created_at": "2026-10-30T00:17:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "yourfriendmell", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116344750651605138", "url": "https://x.com/nabeelqu/status/2116344750651605138", "text": "After 94 days (reading a fair amount of other books concurrently) I have finished Marcel Proust’s In Search of Lost Time. I think I’m going to take the time to write a long form Twitter article to fully express my thoughts. But for now, my ranking of the volumes is:\n\n1.Swann’s Way\n2.Time Regained\n3.Within a Budding Grove\n4.The Captive and The Fugitive\n5.Sodom and Gomorrah \n6.The Guermantes Way\n\nThe greatest thing I’ve ever read.", "created_at": "2026-10-31T01:41:22+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_theorycel", "rt_author_name": "⊙", "likes": 1275, "retweets": 88, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5dIiuXgAAPG_E.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2115404491717746950", "url": "https://x.com/theobearman/status/2115404491717746950", "text": "Anthropic:
