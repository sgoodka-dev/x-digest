https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 541, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334617169096704/img/mQr9fAN_0u_GP6yA.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334617169096704/img/mQr9fAN_0u_GP6yA.jpg"}], "links": {"https://t.co/woRayV8Eya": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121359806879649924", "url": "https://x.com/dwarkesh_sp/status/2121359806879649924", "text": "that's why I also slept with jensen", "created_at": "2026-11-13T21:49:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7245, "retweets": 271, "media": [], "links": {}, "quoted": {"id": "2120978545631769002", "author_name": "Lain on the Blockchain", "links": {}, "author": "CryptoCyberia", "text": "Dwarkesh is a very obvious and archetypal example of a federal agent btw."}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121641935656079448", "url": "https://x.com/dwarkesh_sp/status/2121641935656079448", "text": "@stevehou @grok I don't understand your question. \n\nThe 50x number comes from AIs' 10x faster working speed (which there is evidence for, given how long it takes a human to do a task versus an AI to do a task), times a 5x working around the clock (nights and weekends included). \n\nThen, even if you assume very steep diminishing returns from the fact that the compute doesn't get any faster, I'm arguing that it seems very likely that this automated lab would be going at least 5x faster. \n\nYou may disagree with that 5x number, but that's the end intuition in this intuition pump.", "created_at": "2026-11-14T16:30:30+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121560486135075173", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 48, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T17:09:07.138772+00:00", "parent": {"id": "2121560486135075173", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "How the hell is this an “intuition”?! I read this several times over and then had @grok confirm this for me. I’m pretty sure this is just Dwarkesh saying a string of words and calling it “intuition”. What’s intuitive about “an AI lab full of humans will be slower than an AI lab full of automated researchers bc humans think slower than machines, but not 50 times slower, only 5 times slower”?", "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121560486135075173", "created_at": "Sat Nov 14 11:06:51 +0000 2026"}, "enriched": 3}, {"id": "2121640756142366804", "url": "https://x.com/dwarkesh_sp/status/2121640756142366804", "text": "@ariccio @danrobinson @RyanGreenblatt @eli_lifland Did evolution select our thinking speed specifically for the optimal rate for doing ML research?", "created_at": "2026-11-14T16:25:49+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "ariccio", "reply_to_id": "2121493052070015348", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T17:09:07.138772+00:00", "parent": {"id": "2121493052070015348", "author_handle": "ariccio", "author_name": "Alexander Riccio (@co2trackers)", "text": "@danrobinson @RyanGreenblatt @eli_lifland I'm sorry there's a deeply load bearing assumption that human brain cognition \"rate\" isn't indeed at some generalized optimum.\n\nAnd that probably wouldn't be a *coincidence* either, for the obvious reason of \"evolution spent literally several hundred million years iterating on neural networks in the same hostile and competitive manner that drove many biological processes to reach levels of essentially perfect classical or even quantum efficiency\"", "links": {}, "media": [], "url": "https://x.com/ariccio/status/2121493052070015348", "created_at": "Sat Nov 14 06:38:53 +0000 2026"}, "enriched": 3}, {"id": "2121691889355383063", "url": "https://x.com/dwarkesh_sp/status/2121691889355383063", "text": "Even progress on the deepest open problems in ML (sample efficiency and online learning) is verifiable. https://t.co/xwfxSp5Ai0", "created_at": "2026-11-14T19:49:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 36, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121654598960377856/img/pICl9w5A8WTmHdQu.jpg"}], "links": {"https://t.co/xwfxSp5Ai0": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121681973592854830", "url": "https://x.com/dwarkesh_sp/status/2121681973592854830", "text": "Recently i've found myself getting more upset with discussions of AI risk on X\n\nLike, often it feels like the sceptics are just dunking on ppl who are worried\n\nAnd it's tough bc these issues are really complicated. I don't think there's any water tight case for an intelligence explosion happening soon, or it leading to AI takeover\n\nSo there are loads of genuine uncertainties and ambiguities, and of course sceptics can and should raise them.\n\nBut it's upsetting when they present them as slam-dunk proofs that the whole AI risk is flawed and silly.\n\nLike, do you really think that no one has thought of this before? Are you actually curious about whether your objection holds up? Remember how most issues are really complicated, and ppl are often wrong about stuff?\n\nAnd the bigger picture here is that hundreds of top experts inside and outside the industry think this will be a complete disaster. Like, that is obviously fucking scary and we should take it very seriously, not notice an apparent flaw in the argument and move on.\n\nTo be clear, AI safety ppl can be annoying too. Historically, I've found them much more annoying to be honest. I've felt pressure not to say stuff that vibes as 'anti-safety', and noticed ppl engaging in bad faith with me when i do.\n\nI know none of this is specific to AI safety. Public discourse is dogshit on every topic. And probably X is waay better than average. But i still think it's a disgrace how low the standard is.\n\nFor a topic this important everyone on both sides should try to do better", "created_at": "2026-11-14T19:09:36+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2121664725020983500", "likes": 123, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121654724227408319", "url": "https://x.com/dwarkesh_sp/status/2121654724227408319", "text": "Even superintelligence will need real-world experience to match top human experts.  Reality has a surprising amount of detail, and you can't just think your way out of that.\n\nBut the AIs that come out of the intelligence explosion will be really good at learning from all their parallel experience\n\nAs a result, we should expect them to outclass expert humans within months of being deployed.\n\nI call this the broadly deployed intelligence explosion.", "created_at": "2026-11-14T17:21:19+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 236, "retweets": 19, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121654307397459968/img/5_f-t_-At6EiXsg6.jpg"}], "links": {"https://t.co/UvW9t6vNGe": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121870666031083856", "url": "https://x.com/dwarkesh_sp/status/2121870666031083856", "text": "@cindyxywu Perhaps this doesn't exactly address your point, but I address what I think is your argument here https://t.co/KbS20q7s5J", "created_at": "2026-11-15T07:39:23+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "cindyxywu", "reply_to_id": "2121700522184851956", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 44, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXJl0_yaUAE2cmM.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJl0_yaUAE2cmM.png"}], "links": {"https://t.co/KbS20q7s5J": ""}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "parent": {"id": "2121700522184851956", "author_handle": "cindyxywu", "author_name": "Cindy Wu", "text": "I bet against this and I bet against Dwarkesh.\n\nHe conveniently sweeps under the rug that climbing a metric involves defining it. Then, supposing you define it (in a way that avoids Goodharting, reward hacking, etc), you need data/envs, which do the lifting. On defining good metrics - this is most of the game of making AGI (converting fuzzy concepts to formalized objects you can climb without gaming, which requires costly fixes later). He elides the hard problem by saying 'AI will just automate data'.\n\nHow do you know whether a change belongs in your final recipe? You ablate at scale. When you make N changes, on even a subset of combinations, this compute cost is naively exponential. So, you need a faster signal to tell you when a task that isn't immediately verifiable improves end behavior. Finding that signal is the bottleneck, which doesn't seem to be helped by 'automating the great algorithmic thinker starting from the empty string on paper'.", "links": {}, "media": [], "url": "https://x.com/cindyxywu/status/2121700522184851956", "created_at": "Sat Nov 14 20:23:18 +0000 2026"}, "enriched": 3}, {"id": "2121742413828182212", "url": "https://x.com/dwarkesh_sp/status/2121742413828182212", "text": "Excellent essay. The appendix especially helped me grok, better than anything I’ve read, why AI R&D may actually be a verifiable task.\n\nOne analogy that came to mind as I was reading: \n\nThe usual arguments for why AI will be slow to cure diseases are about feedback loops. You need exposure to the real world, wet labs, slow, expensive clinical trials, etc., to know whether your hypothesis is correct.\n\nNow imagine we had a full in silico model of the human body. Granular biomarkers on everything. Digital trials across millions of virtual patients, run 1000x faster than real time.\n\nAlmost all biologists would expect a mind-boggling speedup in medical discovery from this.\n\nAI R&D ~already looks like that world. Dwarkesh’s appendix is basically a list of biomarkers: \n- Pretraining → loss on held-out text\n- Post-training → how quickly a model masters an environment it’s never seen\n- Inference → GPU utilization, memory per token, latency\n- Research taste → does a trick that works at 100M parameters still work at 10B?\n\nAs Dwarkesh puts it: “We can make models much better at things that can be tested inside a datacenter. And AI training is literally happening inside a datacenter.”", "created_at": "2026-11-14T23:09:46+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "rt_avatar": "https://pbs.twimg.com/profile_images/2115512217277771776/aGaLkTiQ_normal.jpg", "rt_id": "2121730959967994025", "likes": 108, "retweets": 12, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2121732407967564089", "url": "https://x.com/dwarkesh_sp/status/2121732407967564089", "text": "Once AI is as good as the best humans at AI research, algorithmic progress will get dramatically faster. There are three important reasons why: The automated researchers will be much faster, each of them will be very smart, and there’ll be a lot more of them. https://t.co/krfyUTUpwt", "created_at": "2026-11-14T22:30:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 196, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121655231352299520/img/ubTCePdt-lAz9ZrW.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121655231352299520/img/ubTCePdt-lAz9ZrW.jpg"}], "links": {"https://t.co/krfyUTUpwt": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2121706010352161246", "url": "https://x.com/dwarkesh_sp/status/2121706010352161246", "text": "@_arohan_ My claim is not that it's currently better than human AI researchers at finding a better optimization algorithm (if it was, the intelligence explosion would have already started!)\n\nRather, that there are good reasons to think we'll have such AIs within the next few years.\n\nIf you pointed out earlier last year that the AIs can beat and get gold in the International Math Olympiad haven't solved any important open math problems, you would be correct!\n\nI'm arguing that, just as the progress in math (from acing high school math competitions to solving the Millennium Prize problems) was really fast, the progress in AI development (from doing a lot of schlep for researchers to coming up with a better optimization algorithm) might be really fast.", "created_at": "2026-11-14T20:45:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "_arohan_", "reply_to_id": "2121699028408963580", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 51, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "parent": {"id": "2121699028408963580", "author_handle": "_arohan_", "author_name": "rohan anil", "text": "@dwarkesh_sp I am yet to see it come up with a better optimization algorithm for say a frontier model, do you see signs where it can beat current SOTA, prime intellect results showed it was very much stuck in a local minima.", "links": {}, "media": [], "url": "https://x.com/_arohan_/status/2121699028408963580", "created_at": "Sat Nov 14 20:17:22 +0000 2026"}, "enriched": 3}, {"id": "2121704843509444867", "url": "https://x.com/dwarkesh_sp/status/2121704843509444867", "text": "@amasad I claim that it is mostly the general learning algorithm getting better. \n\nOne piece of evidence is that reasoning models trained on RL environments have only been around for less than two years, whereas GPT-3 was released six years ago. \n\nSo the domain-specific RL environment stuff can't explain those earlier 4 years of progress", "created_at": "2026-11-14T20:40:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "amasad", "reply_to_id": "2121700963702673506", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 37, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "parent": {"id": "2121700963702673506", "author_handle": "amasad", "author_name": "Amjad Masad", "text": "@dwarkesh_sp How much of the GPT-3 to 6 improvements are due to better (general) learning algorithms vs. domain-specific data and RL environments? I'm sure it's part of it, but it's not immediately clear that it's the majority, given the magnitude of investment in the latter.", "links": {}, "media": [], "url": "https://x.com/amasad/status/2121700963702673506", "created_at": "Sat Nov 14 20:25:03 +0000 2026"}, "enriched": 3}, {"id": "2121696412773781549", "url": "https://x.com/dwarkesh_sp/status/2121696412773781549", "text": "Maybe to summarize the basic argument of this essay a different way:\n\nCurrent AIs are spiky and jagged - worse than humans in most domain, but often as good, or better, in ones with verifiable proxies (for example, math).\n\nOne such verifiable domain (I argue) is AI research.\n\nAnd while the first AIs that dramatically accelerate AI progress will be quite narrow (i.e. probably not able to automate most jobs), the consequences of that accelerated progress will be very general. \n\nAnd that's because better learning algorithms are very general. For example, GPT-6 (while still being jagged) is just way, way better than GPT-3 at practically everything. \n\nI'm arguing that we're only a couple years away (and possibly only a couple months away) from a process by which (initially) narrow AIs concentrate a jump as big as the one from GPT-3 to GPT-6 into a single year.\n\nAnd if you got another jump that big, but starting from the base of GPT-7, I think you would end up with AIs that would rapidly become better than the best humans in every field.", "created_at": "2026-11-14T20:06:58+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1052, "retweets": 63, "media": [], "links": {}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2122020791617556522", "url": "https://x.com/dwarkesh_sp/status/2122020791617556522", "text": "@zetalyrae haha loved this line: \"It sounds like the propaganda of a state that is losing a war: the tales of heroic victory get closer and closer to the capital each time.\"", "created_at": "2026-11-15T17:35:56+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "zetalyrae", "reply_to_id": "2121835623485206713", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T17:42:40.284820+00:00", "parent": {"id": "2121835623485206713", "author_handle": "zetalyrae", "author_name": "Fernando Borretti", "text": "I wrote a short post about what “taking AI seriously” means to me: https://t.co/rUauqnEtPc", "links": {"https://t.co/rUauqnEtPc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXJGOhraAAAUIJd.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXJGOhraAAAUIJd.jpg"}], "url": "https://x.com/zetalyrae/status/2121835623485206713", "created_at": "Sun Nov 15 05:20:09 +0000 2026"}, "enriched": 3}, {"id": "2122056651297759687", "url": "https://x.com/dwarkesh_sp/status/2122056651297759687", "text": "@Andr3jH 😂", "created_at": "2026-11-15T19:58:26+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "Andr3jH", "reply_to_id": "2121584509774643407", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T20:23:54.093496+00:00", "parent": {"id": "2121584509774643407", "author_handle": "Andr3jH", "author_name": "ᐱ ᑎ ᑐ ᒋ ᕮ ᒍ", "text": "\"The Dwarkesh Podcast was once called the Lunar Society\"\n\n\"Sure, grandma. Let's get you to bed\" https://t.co/8SO2h5qSqK", "links": {"https://t.co/8SO2h5qSqK": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXFh3UGXsAAQ2Jc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXFh3UGXsAAQ2Jc.jpg"}], "url": "https://x.com/Andr3jH/status/2121584509774643407", "created_at": "Sat Nov 14 12:42:18 +0000 2026"}, "enriched": 3}, {"id": "2122205031693000750", "url": "https://x.com/dwarkesh_sp/status/2122205031693000750", "text": "A comment from Paul, yesterday. Notice the part about @allTheYud at the bottom. https://t.co/Eqyq5CTvN5", "created_at": "2026-11-16T05:48:02+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "JacquesThibs", "rt_author_name": "Jacques", "rt_avatar": "https://pbs.twimg.com/profile_images/1913293333247455232/RyrZAaae_normal.jpg", "rt_id": "2122193603694891125", "likes": 154, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXOLh-PXsAACEo0.png"}], "links": {"https://t.co/Eqyq5CTvN5": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122108859275976928", "url": "https://x.com/dwarkesh_sp/status/2122108859275976928", "text": "People still underestimate how big of a deal fracking is.\n\nAfter decades of America basing its geopolitics around foreign oil, fracking gave us energy independence practically overnight.\n\n@DanielYergin explains: https://t.co/hqkPVEd4N3", "created_at": "2026-11-15T23:25:53+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2122102349644878250", "likes": 1256, "retweets": 92, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXCzcSOXoAEB4pU.jpg"}], "links": {"https://t.co/hqkPVEd4N3": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122064955545686119", "url": "https://x.com/dwarkesh_sp/status/2122064955545686119", "text": "Episode dropping tomorrow with @paulfchristiano.\n\nHe thinks there’s a 1 in 3 chance of extreme superintelligence within a year (absent any slowing down).\n\nAnd he'll explain what labs and governments should do right now given that possibility. https://t.co/iRQVrhWfMs", "created_at": "2026-11-15T20:31:26+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1428, "retweets": 122, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122061424088510464/img/ri6-GbAkhM9IpUgP.jpg"}], "links": {"https://t.co/iRQVrhWfMs": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122417352151285914", "url": "https://x.com/dwarkesh_sp/status/2122417352151285914", "text": "@juliarturc @paulfchristiano There's one coming soon with a skeptic of the software only singularity!", "created_at": "2026-11-16T19:51:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "juliarturc", "reply_to_id": "2122396707745054858", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122396707745054858", "author_handle": "juliarturc", "author_name": "Julia Turc", "text": "@dwarkesh_sp @paulfchristiano Dwarkesh, you are SO GOOD at what you're doing. Why don't you use that talent to paint a well-rounded picture? Why not have a single episode on this topic with someone not from Ant/OAI?", "links": {}, "media": [], "url": "https://x.com/juliarturc/status/2122396707745054858", "created_at": "Mon Nov 16 18:29:42 +0000 2026"}, "enriched": 3}, {"id": "2122391850854088858", "url": "https://x.com/dwarkesh_sp/status/2122391850854088858", "text": ".@paulfchristiano thinks that on the current trajectory (absent any slowing down), there is a 1 in 3 chance that we could have superintelligence powerful enough to overthrow the government within a year. (He articulates a concrete scenario).\n\nHe argues that the labs should pause further algorithmic progress until they can secure their weights and research secrets. Otherwise China could simply steal the superintelligence in the middle of the intelligence explosion, and the labs would no longer be able to slow down even if they saw their models going off the rails.\n\nHe also explains how AIs will be trained during the intelligence explosion, and why even a system trained entirely inside a data center could still have the capabilities profile such that humans would have very little chance of competing with it or controlling it.\n\nAnd he discusses the plan for alignment - basically, making a superintelligence that actually does what we ask the way we mean it. Fixing reward hacks and building better graders will help up till the next few model generations, but he thinks that no single current approach has better than even odds of letting us control superintelligence. The hope is that the AIs figure out the solution to this problem during the intelligence explosion.\n\nPaul is head of the Alignment Research Center. Previously, he was head of AI safety at the US AI Safety Institute. Before that, he led alignment at OpenAI, where he invented RLHF. He’s recently joined OpenAI’s board (though here he is speaking as a private citizen).", "created_at": "2026-11-16T18:10:24+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 500, "retweets": 61, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXRBMW4XAAEib3d.jpg"}], "links": {"https://t.co/dpdSrR5oTH": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122447386480140714", "url": "https://x.com/dwarkesh_sp/status/2122447386480140714", "text": ".@paulfchristiano on what the end output of the intelligence explosion (running within a datacenter) will be:\n\nBillions of minds, thinking 10s of times faster than humans, learning from all their parallel experience, with better learning algorithms than the ones evolution gave us.", "created_at": "2026-11-16T21:51:04+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 96, "retweets": 11, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122446431214878720/img/5EC7mHWewV7ibKB3.jpg"}], "links": {"https://t.co/NzKTpMEZLn": ""}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122552661790835134", "url": "https://x.com/dwarkesh_sp/status/2122552661790835134", "text": "mfw when the most persuasive parts of my post are apparently the things I shoved into footnotes and appendices", "created_at": "2026-11-17T04:49:24+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 252, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2121730959967994025", "author_name": "Caleb Watney", "links": {}, "author": "calebwatney", "text": "Excellent essay. The appendix especially helped me grok, better than anything I’ve read, why AI R&D may actually be a verifiable task.\n\nOne analogy that came to mind as I was reading: \n\nThe usual arguments for why AI will be slow to cure diseases are about feedback loops. You need exposure to the real world, wet labs, slow, expensive clinical trials, etc., to know whether your hypothesis is correct.\n\nNow imagine we had a full in silico model of the human body. Granular biomarkers on everything. Digital trials across millions of virtual patients, run 1000x faster than real time.\n\nAlmost all biologists would expect a mind-boggling speedup in medical discovery from this.\n\nAI R&D ~already looks like that world. Dwarkesh’s appendix is basically a list of biomarkers: \n- Pretraining → loss on held-out text\n- Post-training → how quickly a model masters an environment it’s never seen\n- Inference → GPU utilization, memory per token, latency\n- Research taste → does a trick that works at 100M parameters still work at 10B?\n\nAs Dwarkesh puts it: “We can make models much better at things that can be tested inside a datacenter. And AI training is literally happening inside a datacenter.”"}, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122513029002924400", "url": "https://x.com/dwarkesh_sp/status/2122513029002924400", "text": "@EgeErdil2 When you say 2 years won't be enough to fix them, are you saying that as a result, they won't build (or be able to build) more capable AI systems in the meantime, because the intermediate RSI models will be too misaligned to do their job correctly?", "created_at": "2026-11-17T02:11:55+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "EgeErdil2", "reply_to_id": "2122129792602718353", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "parent": {"id": "2122129792602718353", "author_handle": "EgeErdil2", "author_name": "Ege Erdil", "text": "i think pacing is a bad idea because it's targeting the speed of development indiscriminately\n\nwhat should happen is specific safety issues should be monitored and addressed, and i just think enough such issues will come up that my median is 2 yrs won't be enough to fix them", "links": {}, "media": [], "url": "https://x.com/EgeErdil2/status/2122129792602718353", "created_at": "Mon Nov 16 00:49:04 +0000 2026"}, "enriched": 3}, {"id": "2122493169312915931", "url": "https://x.com/dwarkesh_sp/status/2122493169312915931", "text": ".@paulfchristiano explains the basic AI takeover story:\n\nStep 1. A rogue internal agent swarm gains effective control over OpenAI or Anthropic during the intelligence explosion \n\nStep 2. By the point at which these AIs have exfiltrated themselves, and you've got billions of copies of super smart AIs that have compromised all web connected infrastructure globally, the government response (which these AIs are actively trying to undermine) becomes much harder to successfully carry out.", "created_at": "2026-11-17T00:53:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 344, "retweets": 38, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122447995576967168/img/sqZgTqxo9P_U6lF0.jpg"}], "links": {"https://t.co/HHH90rFZKA": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122727364576919874", "url": "https://x.com/dwarkesh_sp/status/2122727364576919874", "text": "@corsaren Lotta reasonable objections, and I'll respond to them in detail later.\n\nFor now, I want to explicitly clarify that I did say that the chance of superhuman AI researchers in 2027 is 50%! \n\nI said in the post my median is 2028 for superhuman AI researchers and 2028 or 2029 for general superintelligence.", "created_at": "2026-11-17T16:23:36+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "corsaren", "reply_to_id": "2122574549707292976", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "parent": {"id": "2122574549707292976", "author_handle": "corsaren", "author_name": "corsaren", "text": "I’ve read this a couple times now, and while there is, frankly, a lot of sloppy argumentation (which I will get to), the charitable, simplified read of Dwarkesh's position seems to be:\n\n1) AI needs major breakthroughs to achieve AGI/ASI (continual learning, sample efficiency, etc.) — this is a view he’s held for some time now, in line with Ilya\n\n2) These breakthroughs, and the ML research skills required to obtain them are verifiable, and thus current, pre-breakthrough AIs can hill-climb on these sorts of problems and capabilities to solve them (like we saw in math)\n\n3) Once these breakthroughs occur, we *may* see rapid, recursively compounding gains to intelligence, leading to ASI in a very short period of time\n\nThere's a ton of other stuff in the essay, but I think this is the basic crux. Christiano basically articulated this same argument in his Dwarkesh appearance, and if you look at AI-2027, it essentially follows the same trajectory: Agent 2/3 makes a ton of algorithmic progress, allowing Agent 4/5 to explode.\n\nIn general, I think the high-level narrative here is...fine? It’s certainly one plausible outcome. But, imo, it is a much narrower path than I think many are giving it credit for—a lot of things actually have to go just right for this to play out. And here's where I return to the other, messier arguments, because many of the intuitions and arguments driving Dwarkesh's view in favor of near-term ASI (e.g., EO2027) as a highly probability outcome (~50%) are, imo, quite bad:\n\n- “[We'd see] a jump as big as GPT-3.5 to GPT-6 Astra in just 12 months” -> No, under this scenario we’ll see ~4 years of AI progress in 1 year. If there are diminishing returns, then this won’t be as extreme as the jump we saw from GPT-3 to GPT-6. It very well could be, but that would require innovation to overcome the diminishing returns we'd expect in the base case.\n\n- “The other big piece of evidence for transfer is human evolution” -> Except if AI was following the sort of pattern we saw for human evolution, we should have seen better transfer long before AI started solving millennium problems. This spikiness has been one of the big surprises of AI!\n\n- “Rather, my claim is that scaling up RL training will give AIs the abilities necessary to ramp quickly in new contexts…it’ll go through an evolutionary process that involves centuries of corporate competition to figure out the optimal organizational techniques.” -> These are in direct conflict! If ramping requires RL runs that simulate centuries of competition within “digital economy full of millions of other AIs” then that’s quite bearish for ramp speed (relatively) given the compute and wall-clock requirements!\n\n- “I have a lot of 20-something-year-old friends whom I’ve watched accomplish incredible things and build world-leading companies and ventures in domains they entered into with no previous experience.” -> lol. rip leopold. But also, again, these are humans, with human sample efficiency. If AI gets there, sure. But how soon it gets there is the big crux.\n\n- “Obviously, some pieces of feedback—about how your actions impacted the quarterly earnings, say—require months of serial time. But even granting that, we should expect these future AIs to be able to get to top human performance in almost all domains within months of being deployed.” -> …no that’s not how that works at all because one set of earnings isn't enough to robustly learn from and you can’t re-run the same real-world conditions.\n\n- “[Sample efficiency & online learning are] AI’s equivalent of a Millennium Prize problem. And mathematics has already shown us what happens to such problems” -> Sure, but there’s a difference between “AI can solve a Millennium-level problem” and “AI can solve *this specific Millennium-level problem*” -- if the blocker is a specific problem, the timing spread becomes much wider.\n\n- “My answer to this [experiment/wall clock/compute] objection is that each agent will still have access to a ton of compute. Frontier labs have been more than quadrupling their compute every single year.” -> But that’s what they’ve needed to do keep up with their current pace! Even if the labs maintain their current pace of compute growth (and like, will they even? capital markets really do not seem accommodating and Dwarkesh's roommate just lowered his compute projections), we'd still need a step change in pace above that!\n\nAnd that's not even covering the biggest crux of all: whether the returns to intelligence continue to recursively compound faster than diminishing returns eat into them.\n\nNow, are any of these objections fatal? No. Do they “disprove” hard RSI/an intelligence explosion? No, ofc not. Am I kind of nitpicking here? Yeah, 100%.\n\nAnd to Dwarkesh's credit, he does anticipate and acknowledge a scenario (the “spark”) where these objections play out.\n\nBut the reason I've bothered to rant this long is that I see a lot of AI/RSI discourse follow this pattern: where 50% of the arguments are reasonable and grounded and appropriately hedged, and then the other 50% are these sorts of sloppy intuition pumps and what-ifs that include a ton of detail but a noticeable lack of rigor. And I can’t help but get the sense that it is the latter 50% that is really driving people’s predictions and expectations here, as it leads to sentences like this:\n\n“In the spark scenario…it takes years to get to the same endpoint that the software-only singularity would have achieved in months: a superintelligence that is to us what we are to chimps.”\n\nNote that Dwarkesh thinks these two outcomes (spark vs. software-only singularity) are equally likely. 50/50. I’m sorry, but that’s absolutely nuts. Even Christiano put the likelihood of ASI by in 2027 *absent any slowing down* at only 1 in 3, and I still think that's too bullish.\n\nLike, yes, I fully anticipate that we will have automated AI researchers (or something close to them) in 2027, and the universe where we go from that to a software-only singularity is not entirely out of the question. But obtaining that universe relies on a confluence of various frictions, diminishing returns, and wall-clocks being overcome, a somewhat specific set of algorithmic innovations being made or obviated, and an assortment of other factors playing out just-so to enable that perfect storm. Even a fairly rapid exponential doesn't qualify when you're talking about full-blown ASI in 13 months. It may not be impossible, but it's certainly not a 50/50 outcome.", "links": {}, "media": [], "url": "https://x.com/corsaren/status/2122574549707292976", "created_at": "Tue Nov 17 06:16:22 +0000 2026"}, "enriched": 3}, {"id": "2122821894542082347", "url": "https://x.com/dwarkesh_sp/status/2122821894542082347", "text": "GPT 6.2 Astra is not obviously much better than GPT 6 at Blood on the Clocktower https://t.co/l9mxZiK3I8", "created_at": "2026-11-17T22:39:14+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 68, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXG-NebIAAiEwO.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXXG-NebIAAiEwO.jpg"}], "links": {"https://t.co/l9mxZiK3I8": ""}, "quoted": {"id": "2118449808402681911", "author_name": "Dwarkesh Patel", "links": {"https://t.co/IF4d0EMSD8": "http://clocktowerbench.com", "https://t.co/35ym1NcVDL": ""}, "author": "dwarkesh_sp", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8"}, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122860604625158500", "url": "https://x.com/dwarkesh_sp/status/2122860604625158500", "text": "I've seen a lot of compelling counterarguments to my RSI essay, and I want to write up a response to as many of them as I can manage. \n\nBut I'm sure I've missed a bunch of them.\n\nIf you've seen any interesting tweets/articles taking the other side, can you reply with their link?", "created_at": "2026-11-18T01:13:03+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 676, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123107618470428996", "url": "https://x.com/dwarkesh_sp/status/2123107618470428996", "text": "According to @paulfchristiano, no single current alignment approach that has more than a 50% chance of getting superintelligences to actually do what some particular human user wants them to do. https://t.co/payEOW8hQc", "created_at": "2026-11-18T17:34:36+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 62, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123106297759596544/img/Jfmu2Nhpv21BS948.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123106297759596544/img/Jfmu2Nhpv21BS948.jpg"}], "links": {"https://t.co/payEOW8hQc": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123137917669212361", "url": "https://x.com/dwarkesh_sp/status/2123137917669212361", "text": "China is only 12 hours, not 12 months, behind the frontier AI labs. https://t.co/0t7a74cc1s", "created_at": "2026-11-18T19:35:00+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 197, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123107714352156672/img/w_qdI9X5fkA1Gf6L.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123107714352156672/img/w_qdI9X5fkA1Gf6L.jpg"}], "links": {"https://t.co/0t7a74cc1s": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2121396602950823937", "url": "https://x.com/Lewis_Bollard/status/2121396602950823937", "text": "I think I have the best handle on the badness of factory farming when I'm sick.  \n\nWhen I'm lying in bed with a fever and a sore throat that makes it hurt to swallow, it's obvious that it's bad.  Sure, part of what makes it bad is that it diminishes my productivity, etc.  But a big part of what makes it bad is: it hurts.  \n\nBut at the very same moment, countless animals--far more than the number of humans who have ever lived--are suffering in ways much more intense.  They're being cut by knives, mutilated, castrated, locked in cages, etc.  Their pain is bad for the same reason mine is.  \n\nAnd the fact that they're not biologically human doesn't make their pain not bad.  If you gave me a pill that made me stupid and not biologically human, it would still be bad for me to suffer.  Suffering is bad, at least in part, because it hurts.  So the source of incomprehensible suffering is a very big deal, morally.", "created_at": "2026-11-14T00:15:38+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "Benthamsbulldog", "rt_author_name": "Bentham's Bulldog🔸", "rt_avatar": "https://pbs.twimg.com/profile_images/1926408699863588864/i-fisty8_normal.jpg", "rt_id": "2121306981499630005", "likes": 401, "retweets": 25, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121649754006532512", "url": "https://x.com/Lewis_Bollard/status/2121649754006532512", "text": "Ending factory farming isn't about making everyone vegetarian.  \n\nThe animal welfare movement made the same mistake as early environmentalists - turning a systems problem into a personal virtue test.  \n\nNo major social reform succeeded by first converting millions to change their habits. They changed the defaults - subsidies, procurement, regulations.  \n\nYou could have more impact on animal welfare while eating a burger than a vegan who believes they are doing their part.\n\n@Lewis_Bollard", "created_at": "2026-11-14T17:01:34+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2121649364498366823", "likes": 2, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121244836757970944/img/7-VL80HG3chaQtAT.jpg"}], "links": {"https://t.co/NIkRA7xq8a": ""}, "quoted": null, "fetched_at": "2026-11-14T17:09:07.138772+00:00", "enriched": 3}, {"id": "2123188703279693966", "url": "https://x.com/Lewis_Bollard/status/2123188703279693966", "text": "This is pretty cool", "created_at": "2026-11-18T22:56:48+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": true, "rt_author": "Noahpinion", "rt_author_name": "Noah Smith 🐇🇺🇸🇺🇦🇹🇼", "rt_avatar": "https://pbs.twimg.com/profile_images/1900075477999763456/8nSaoQcX_normal.jpg", "rt_id": "2122900754025586865", "likes": 1138, "retweets": 35, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123458484222271560", "url": "https://x.com/Lewis_Bollard/status/2123458484222271560", "text": "I ate cultivated chicken last night. Before dinner, we toured the @UPSIDEFoods facility — what critics call the \"lab\" where \"lab meat\" is made.\n\nWhat struck me most was how clean it was. Every chicken and pig factory I’ve entered has been filthy, with the pungent smell of manure the animals live on top of.\n\nThe Upside facility was spotless. The plant manager told me that in two years of operating they haven’t had a single case of Salmonella or Campylobacter.\n\nBy contrast, the most recent USDA testing found Salmonella in 35% of ground chicken and Campylobacter in 25% of whole chicken carcasses from factory farms.\n\nThis won’t be for everyone. If you only want \"natural\" meat, eat pasture-raised meat instead.\n\nBut for the majority already eating factory chicken daily, this could be a major upgrade: the same product, minus the pathogens and the cruelty.", "created_at": "2026-11-19T16:48:49+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 479, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgEp3VakAAZZdp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXgEsL3bwAAwmZI.jpg"}], "links": {"https://t.co/tmUpdN6Q2C": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2121527039807078683", "url": "https://x.com/mentalgeorge/status/2121527039807078683", "text": "@hilbertspaess @ben_golub are you implying mythos was pre-trained in april 2025? surely not", "created_at": "2026-11-14T08:53:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "hilbertspaess", "reply_to_id": "2121461118824817090", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121461118824817090", "author_handle": "hilbertspaess", "author_name": "Jacob Coxon", "text": "@ben_golub [Post-mythos : Mythos] &gt; [Mythos : pre-Mythos] on pretraining compute efficiency is a precise claim that needs only 3 datapoints, needs no exact numbers, and violates many narratives. Abstraction != lack of rigor", "links": {}, "media": [], "url": "https://x.com/hilbertspaess/status/2121461118824817090", "created_at": "Sat Nov 14 04:32:00 +0000 2026"}, "enriched": 3}, {"id": "2121715201493930187", "url": "https://x.com/mentalgeorge/status/2121715201493930187", "text": "Twitter is one of the great Faustian bargains of modernity\n\nReceive: cutting-edge alpha, new friends, \"lolz\", the thought-provokingest of material, status (if skilled)\n\nBut sacrifice: hours upon hours of thoughtspace, dopamine regulation, sanity (if unskilled)", "created_at": "2026-11-14T21:21:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 53, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2122424637057388661", "url": "https://x.com/mentalgeorge/status/2122424637057388661", "text": "One of the many interesting micro-cruxes in the view that \"progress in maths shows us how quickly progress in AI R&D will be\" is: \n\nTo what extent have the existing AI discoveries in maths started building off each other? \n\nThis is relevant because you could imagine that (1) the discoveries involve delivering finishing touches to existing human knowledge; vs (2) the discoveries are the construction of entirely new, compounding edifices of scientific understanding\n\nI'm in no position to evaluate this but would be interested to know what others think. \n\n(As a separate note, you could imagine a world where (2) only happens once the models are pretrained over the discoveries , which at least introduces a bit of a lag)", "created_at": "2026-11-16T20:20:40+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122736670936031474", "url": "https://x.com/mentalgeorge/status/2122736670936031474", "text": "One of the many millions of crucial things left out of METR RSI report:\n\nWhat is the main mechanism by which AI labour is contributing to the 2x acceleration of capabilities on well-specified tasks?\n\nThere is a world of difference between: \n\n1. Most of the AI's contribution comes from assisting work that can be described as \"developing better learning algorithms\"; eg things like Kimi Delta Attention; in general, things that improve pretraining loss curves, etc  \n\nand\n\n2.  Most of the AI's contribution comes from doing things like: constructing RL bespoke environments for each benchmark in AECI; filtering slop out of the pretraining distribution, etc. \n\nWhy does it matter? Well, if the gains on well-specified tasks come from (1), they generalise to other tasks. In that world, the entity that emerges from RSI loop can rapidly superlearn from other domains. \nIf they come from 2, they don't.  (AIFP also note that the contribution of \"data-generation\" is the biggest candidate missing from their model.)\n\nAdmittedly, the fact that METR, or any of the partially-redacted Anthropic employee quotes, don't really discuss (2) is weak evidence that it doesn't matter much. \n\nBut on the other hand, @dwarkesh_sp's analysis suggests that pretraining compute multipliers are mostly data-driven rather than algorithm-driven (though this is confounded by the small size of the models he investigated). \n\nWould be great to get more evidence on this.\n\n(we can also ultimately reopen the 2023-era debate of \"how general is pretraining really\" but idk i think that one was probably won already, tho im not yet 100% on it)", "created_at": "2026-11-17T17:00:35+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVzUquXQAA3FGq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXV0pGfWQAAl1aj.jpg"}], "links": {"https://t.co/qoSaXdD088": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122796711198269450", "url": "https://x.com/mentalgeorge/status/2122796711198269450", "text": "@girishsastry Oh tbc i'm somewhat riffing / reading the tea leaves on 3. What I'm trying to get at is that this new focus on \"using RL to get models that then get you better at pretraining\" exists in a lineage of evolving arguments. \n\nagreed that it's not obvious more pretraining *won't* get further interesting emergent capabilities like ICL", "created_at": "2026-11-17T20:59:10+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "girishsastry", "reply_to_id": "2122792583546233323", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122792583546233323", "author_handle": "girishsastry", "author_name": "girish sastry", "text": "@mentalgeorge what's the source for step 3 there btw?\n\nI mean it's just all was/is uncertain. Increasing pretraining size did show improved sample efficiency and it was unclear what the returns to perplexity improvements were, and we did get stuff like in-context learning", "links": {}, "media": [], "url": "https://x.com/girishsastry/status/2122792583546233323", "created_at": "Tue Nov 17 20:42:46 +0000 2026"}, "enriched": 3}, {"id": "2122793045779529862", "url": "https://x.com/mentalgeorge/status/2122793045779529862", "text": "@GregHBurnham @herbiebradley This is a good point actually", "created_at": "2026-11-17T20:44:36+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "GregHBurnham", "reply_to_id": "2122792860047089869", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122792860047089869", "author_handle": "GregHBurnham", "author_name": "Greg Burnham", "text": "@herbiebradley @mentalgeorge Seems like basically all and only what the quotes in the METR report do talk about, yeah", "links": {}, "media": [], "url": "https://x.com/GregHBurnham/status/2122792860047089869", "created_at": "Tue Nov 17 20:43:52 +0000 2026"}, "enriched": 3}, {"id": "2122790553846985144", "url": "https://x.com/mentalgeorge/status/2122790553846985144", "text": "@girishsastry plus importantly, it's just not clear exactly what the returns to  even \"insanely massive scale pretraining\" are \n\nremember that in 2023 the folk discourse was about how the next OOM would give us \"emergent capabilities\" like agentic planning etc (cf the first Trenton-Sholto) podcast, and then it turned out you did in fact need RL \n\nThere's been this slightly funny boomerang effect in AI discourse, where we've gone from:\n\n- Next token prediction is everything, just need scale and intelligence will emerge \n- OK, turns out you need this RL thing to get specific capabilities like planning and agency\n- Wait, RL doesn't actually generalise, what you actually need is RL to get so good at coding that you can then do next-token prediction at large enough scale to get *true* emergence of general intelligence", "created_at": "2026-11-17T20:34:42+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "girishsastry", "reply_to_id": "2122789661869584618", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122789661869584618", "author_handle": "girishsastry", "author_name": "girish sastry", "text": "@mentalgeorge Yea that's true. I suspect other curves would show that learning algorithms are getting somewhat better. It is frustrating to not have the data.", "links": {}, "media": [], "url": "https://x.com/girishsastry/status/2122789661869584618", "created_at": "Tue Nov 17 20:31:09 +0000 2026"}, "enriched": 3}, {"id": "2122787868863266931", "url": "https://x.com/mentalgeorge/status/2122787868863266931", "text": "@girishsastry You could get this better pretraining data tho right? Thats what dwarkesh's experiments suggest\n\nAgreed that, insofar as the graph is real, it provides some evidence for 1. Not a slam dunk tho right", "created_at": "2026-11-17T20:24:02+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "girishsastry", "reply_to_id": "2122785542538694848", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122785542538694848", "author_handle": "girishsastry", "author_name": "girish sastr
