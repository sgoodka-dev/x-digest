<script id="data" type="application/json">[{"id": "2123799920708845610", "url": "https://x.com/_achan96_/status/2123799920708845610", "text": "Well, looks like @__alpoge__ &amp; @claudeai are claiming a proof of the Riemann Hypothesis\nhttps://t.co/AAsOjvR6c2 https://t.co/Ao7OHZwsNI", "created_at": "2026-11-20T15:25:34+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "HarryStoltz1", "rt_author_name": "Harry Stoltz", "rt_avatar": "https://pbs.twimg.com/profile_images/1944987483114205184/r9w6QR9I_normal.jpg", "rt_id": "2123775783189827655", "likes": 2508, "retweets": 331, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXkqx-iWIAA-1Ej.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXkqx-iWIAA-1Ej.png"}], "links": {"https://t.co/AAsOjvR6c2": "https://alpo.ge/remark.pdf", "https://t.co/Ao7OHZwsNI": ""}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123738195594514606", "url": "https://x.com/_achan96_/status/2123738195594514606", "text": "Open weights. Built on trust. 🔓\n\nSharing how we test AI helps everyone build safer models.\n\nAlongside Hy4's open weights, we're publishing our System Card, sharing our safety, security & alignment evaluations, with a closer look at frontier risks in cyber & bio.\n\nThis includes further reviews by Tencent's Xuanwu, Zhuque & Keen Labs, as well as independent safety & security testing by @FangcunLeap and @alice_dot_io.\n\nAmong the First Raising the bar for responsible AI in Asia. 🛡\n\nSystem Card: https://t.co/VcFbN8xdu3", "created_at": "2026-11-20T11:20:17+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "TencentHunyuan", "rt_author_name": "Tencent Hy", "rt_avatar": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_normal.jpg", "rt_id": "2123710690968191111", "likes": 331, "retweets": 25, "media": [], "links": {"https://t.co/VcFbN8xdu3": "https://hy.tencent.ai/Hy4_system_card.pdf"}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123824767719375013", "url": "https://x.com/_achan96_/status/2123824767719375013", "text": "Earlier this month, the EU AI Office sent out requests for information (RFIs) to OpenAI and Anthropic.\n\nThese RFIs will help us form a clearer picture of how many loss-of-control incidents occurred & what exactly happened.\n\nWe're also inquiring about a range of related topics, including:\n- why chain-of-thought monitorability seems to have worsened recently, and how labs plan to ensure that monitorability is preserved\n- whether the labs have plans for what to do if models continue becoming harder to monitor\n- how the labs have changed their safety & security practices as a result of the incidents", "created_at": "2026-11-20T17:04:18+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "laurolangosco", "rt_author_name": "Lauro", "rt_avatar": "https://pbs.twimg.com/profile_images/2086224821285777409/3bS5kfWg_normal.jpg", "rt_id": "2123823655708680533", "likes": 29, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123875959757582820", "url": "https://x.com/_achan96_/status/2123875959757582820", "text": "We've been working on understanding model capabilities beyond what our prior time horizon tasks could capture.\n\nToday we’re sharing a research update. We find that AI R&amp;D-relevant capabilities are improving rapidly and are getting harder to measure. https://t.co/Z1iXyIjERy", "created_at": "2026-11-20T20:27:43+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2123864981506798012", "likes": 788, "retweets": 115, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl78dBa4AA8nq9.jpg"}], "links": {"https://t.co/Z1iXyIjERy": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124220114900078623", "url": "https://x.com/_achan96_/status/2124220114900078623", "text": "The AI safety community seems very confused about what it is forecasting timelines *to*.\n\nRSI is already happening, so “timelines to RSI” is nonsensical. “Superhuman AI researchers” (SAR) or “top-expert-dominating AI” (TED-AI) are a bit more specific, but often get conflated with “intelligence explosion” or “superintelligence”. It is *possible* that the former will lead very quickly to the latter, but on an emotional level people seem to be treating forecasts to the former as deadlines beyond which they can’t predict or plan. (Also, even the latter terms have become too low-resolution for useful steering—e.g. I’d say we’re already in a slow-ish intelligence explosion.)\n\nForecasting when an AI takeover happens is even vaguer, because nobody has a compelling way of pinning down the threshold. In AI 2027, for instance, December 2027 is “the last month in which humans had any plausible chance of exercising control over their own future”, but this isn’t observable to any human. From some people’s perspectives it’s *already* very implausible today that humans will end up in control—so again we end up forecasting timelines to something that may have already happened.\n\nThis is all very bad for collective epistemics. So my requests are:\n1. Never give “timelines” estimates without specifying timelines to *what*.\n2. The “what” shouldn’t be RSI or an intelligence explosion, because they’re already happening.\n3. If your “what” is very abstract (like TED-AI or takeover) then also include timelines to at least one very impressive concrete capability, like:\n- AI can design a non-protein-based bacterium-like creature from scratch\n-  AI can convince an arbitrary human to commit suicide after 10 hours of interaction\n- AI can build a rocket that, upon landing on Mars, fully replicates itself within a month. \n- Earth-originating civilization launches a million tonnes into orbit per year (currently 3000)\n- Earth-originating civilization harnesses 100 ZJ of energy per year (currently 0.6).\n\n(Even these are gonna get kinda fuzzy and ill-defined as we move close to them, but they’re the best I have for now. More suggestions welcome!)\n\nAnd yes, you might think “by that time humans will already have been disempowered”. But since we are so confused about what disempowerment actually looks like, we need tangible metrics like these to keep ourselves anchored. Otherwise everyone will keep throwing around numbers without really understanding their implications.\n\nAlso, one of my biggest takeaways from the last decade is that AIs can do crazy things while producing surprisingly few real-world implications. AIs can now solve Millennium problems or autonomously hack into major govts, yet still have little real-world power. So I expect that we will hit some of the crazy capabilities I listed above while humans are still broadly in charge. That’s kinda hard to picture today, but so was our current situation a decade or two ago.\n\nLastly: one guess for why people have bandwagoned so hard on short timelines is that it creates a sense of urgency which motivates action. Concretely, the entire AI safety community was far too scared of conflict with the AGI companies until fear of short timelines recently spurred more direct action. I suggest decoupling these, so that your willingness to get in conflicts with the AGI companies doesn’t feel dependent on your timelines.", "created_at": "2026-11-21T19:15:16+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "RichardMCNgo", "rt_author_name": "Richard Ngo", "rt_avatar": "https://pbs.twimg.com/profile_images/1767420324487090176/EofNUGW2_normal.jpg", "rt_id": "2124201464432370006", "likes": 290, "retweets": 30, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124407121735299518", "url": "https://x.com/_achan96_/status/2124407121735299518", "text": "We are in the midst of a society-wide dialectic about the deep nature of intelligence. A strong AI research (and rationalist) tradition is to view it as a single quantity, increasing with scale (or neurons, or compute), and smoothly general across all domains of thought. People talk about AI \"becoming smarter than us\" as if it will likely be a single point in time.\n\nThis flat generality, in particular, has been a North Star for the field of AI for decades. Hans Moravec had the idea of human capabilities forming a landscape of jagged peaks, with more highly evolved skills like hand-eye coordination at the top of the mountains and abstract reasoning in the lowlands. He then imagines \"advancing computer performance is like water slowly flooding the landscape\" (1997).\n\nBut this picture is inverted from what we actually see: if machine intelligence were like water, then it would not be jagged at all. Instead, thus far AI is more jagged than human intelligence. We can use it to solve the world's most important math problems, but it's faster for me to write basically every email myself than spend time prompting and editing the AI version.\n\nThis, to me, is significant evidence that long-standing conceptions of superintelligence are flawed and underspecified. Every month we implicitly receive more evidence that the space of intelligent systems is different than we imagined.\n\nUltimately I would bet that in 2050, when we know much more, our understanding of intelligence in both humans and AIs will be a more multi-dimensional one, where different axes can come apart freely (and are likely to, in machine intelligence), and we will have awareness that particular training techniques lead to different styles of jaggedness and points in the space of intelligence.", "created_at": "2026-11-22T07:38:22+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "herbiebradley", "rt_author_name": "Herbie Bradley", "rt_avatar": "https://pbs.twimg.com/profile_images/1247457895622545408/RUTWiWCl_normal.jpg", "rt_id": "2124333716525003078", "likes": 157, "retweets": 21, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124553053474865454", "url": "https://x.com/_achan96_/status/2124553053474865454", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89", "created_at": "2026-11-22T17:18:14+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "merettm", "rt_author_name": "Jakub Pachocki", "rt_avatar": "https://pbs.twimg.com/profile_images/1032407242727809025/AJpM67Ve_normal.jpg", "rt_id": "2124549218995949967", "likes": 3254, "retweets": 349, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXvptOTXIAAtrY0.jpg"}], "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2124583420600693241", "url": "https://x.com/_achan96_/status/2124583420600693241", "text": "This is the most important thing OpenAI has published in awhile.\n\nWe are providing a lot of transparency into our pretraining progress and hope we can agree as a frield to common limits. I think that would be very wise and help ensure safety and control.", "created_at": "2026-11-22T19:18:54+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "rt_avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_normal.jpg", "rt_id": "2124551594691932405", "likes": 5597, "retweets": 331, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "enriched": 3}, {"id": "2124926696113709216", "url": "https://x.com/_achan96_/status/2124926696113709216", "text": "some thoughts on perplexity and intelligence\n\n1) jakub pachocki wrote a blog post in which he argues that pretraining cross-entropy loss would be a good metric to use for pacing\n\n2) in the process, jakub says that we should think about ai development primarily as training a compressor and then doing elicitation over their compressor\n\n3) pretraining, midtraining are training the compressor and then sft, reinforcement learning and prompting are means of eliciting capabilities in the compressor\n\n4) this doesn't seem to me to be an unusual view; i tend to think that you should think of better pretrains as allowing for more sample efficient rl \n\n5) and, this is speculation, but i can imagine that what jakub has seen is that you can apply similar post-training regimes to different pretrains\n\n6) and pretrains with lower cross-entropy loss plateau later and end up with higher benchmark scores; even with the same post-training applied\n\n7) i can see how if you saw this, you would think of post training as a kind of elicitation; and, you would think of better pretraining as creating emergent capabilities\n\n8) because, you don't actually know how sample efficient a new pretrain will be or where it will plateau until you do that post-training on top\n\n9) in the blog post, jakub also shares the cross entropy loss on openai's internal code base of their models over time; and we can see some interesting stuff\n\n10) one is that o1 used the base base model as 4o and o3 used the same as 4.1; and 4.1 might have been a continued pretrain or midtrain of 4o\n\n11) next, gpt-4.5 was an outlier that was not surpassed until gpt-5.5, which was released about a year later; the rumors are the model was too big for easy post-training\n\n12) i do wonder if the success on o1 and o3 caused openai to focus more research effort on post-training than they should have\n\n13) the rumor has been that anthropic has better pretraining and openai had better post-training; this might be in part due to differential research investment\n\n14) since, we have to explain how anthropic has remained competitive or even pulled ahead of openai with less total compute available to them\n\n15) one way to explain this could be that openai made worse research bets than anthropic or otherwise failed to execute well on them\n\n16) and, if it is the former, then one idea could be that openai bet too much of its research budget on post-training and spent comparatively less on pretraining\n\n17) but, pretraining was comparatively more important and this enabled anthropic to keep up and surpass openai with less total compute available to them\n\n18) the other thing just to say is that openai has been extremely transparent with respect to rsi metrics when compared with anthropic\n\n19) the two research acceleration blog posts and this blog post are our best sources of information; anthropic has been less forthcoming \n\n20) and, i think that if anthropic would like to be serious about a race to the top then it is incumbent on them to release just as much information as openai, if not more\nhttps://t.co/LTZ3gVkgcZ", "created_at": "2026-11-23T18:02:58+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "fleetingbits", "rt_author_name": "FleetingBits", "rt_avatar": "https://pbs.twimg.com/profile_images/1905042879460069376/XLCyb9Cr_normal.jpg", "rt_id": "2124765867510731198", "likes": 193, "retweets": 11, "media": [], "links": {"https://t.co/LTZ3gVkgcZ": "https://openai.com/index/perplexity-and-intelligence/"}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124925803561734422", "url": "https://x.com/_achan96_/status/2124925803561734422", "text": "Introducing GLM-5.4: Generalized Coding with Our First Loop Transformer.\n\n- Loops existing layers in the GLM-5 base model for deeper reasoning\n- Pushes beyond traditional coding to video, games, 3D shaders, and CAD modeling\n- Adds vision capabilities for stronger visual coding\n\nAPI access will open after safety evaluation. Model weights will be released responsibly.\n\nTech Blog: https://t.co/dQrbKoamcN", "created_at": "2026-11-23T17:59:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "Zai_org", "rt_author_name": "Z.ai", "rt_avatar": "https://pbs.twimg.com/profile_images/1970775077181411328/W8XKaUIh_normal.jpg", "rt_id": "2124811995912286352", "likes": 9472, "retweets": 901, "media": [], "links": {"https://t.co/dQrbKoamcN": "http://z.ai/blog/glm-5.4"}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124768189456298468", "url": "https://x.com/_achan96_/status/2124768189456298468", "text": "We fully support OpenAI's transparency initiative. Thanks to @merettm @markchen90 @gdb @sama for leading the way. \n\nWe all got into this field to build safe AGI that is genuinely good for humanity. One of the hardest parts of AI safety is coordination, and this is a step in the right direction. Many more steps like this will be needed to deliver safe, contained, and aligned AGI in the next few years.\n\nWe're committed to sharing our pre-training progress on a common held-out evaluation set. With OpenAI's permission, we report MAI-2 Base on their evaluation set. Its log-perplexity is 0.819, putting it in the same ballpark as the GPT-5.6 Sol base model. Our model uses the same tokenizer as OpenAI, so the numbers are directly comparable. \n\nIn the future, to be able to compare across labs we might need to report bits-per-byte (BPB) rather than perplexity since different labs use different tokenizers. We will also need different evaluation datasets - the fact we have access to OpenAI's evaluation dataset is a special case.\n\nSafety and alignment is now the mission. It's the absolute number one most important focus for our industry. And it begins with small, practical steps like these towards better coordination on pacing.", "created_at": "2026-11-23T07:33:07+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "rt_avatar": "https://pbs.twimg.com/profile_images/1927407622602276864/c_5uOZij_normal.jpg", "rt_id": "2124663594449318173", "likes": 1896, "retweets": 163, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXxSM_zaAAEJIvP.jpg"}], "links": {"https://t.co/1NbJyxWZtG": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2125264449988612381", "url": "https://x.com/_achan96_/status/2125264449988612381", "text": "For the last two years, California's approach to frontier AI governance has been firmly grounded in evidence-based policymaking. Passing and implementing SB 53 was designed to establish foundational safety measures and generate more evidence on AI capabilities and risks. The logic was that as we learned more about the technology and its development, policy would need to evolve with it.\n\nOver the last few months, the nature of frontier AI development has fundamentally changed. \n\nA disturbing rise in loss-of-control incidents has exposed the challenges of controlling today's models. At the same time, frontier AI companies are increasingly using AI to automate AI research and development. This feedback loop could become self-sustaining — a process known as recursive self-improvement (RSI) — creating unprecedented risks.\n\nLast week, the California Government Operations Agency published AI Safety in 2026 and Beyond, making recommendations to build on SB 53. Among its recommendations, the report argues that California must have the authority to:\n\n- Cap recursive self-improvement;\n- Order corrective action when a developer breaches its own thresholds for automated AI R&D;\n- Require large frontier AI developers to create independently verified Risk Containment Protocols demonstrating their ability to shut down their models in an emergency.\n\nIt was an honor to work with the State of California and @goldman, @ghadfield, @alondra, and @ElencticAI to help conceive, research, and draft this report in my individual, personal capacity.\n\nThe coming months could prove decisive for the trajectory of AI development. I believe this Report offers a productive roadmap to help California meet the moment.", "created_at": "2026-11-24T16:25:05+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "Scott_R_Singer", "rt_author_name": "Scott Singer", "rt_avatar": "https://pbs.twimg.com/profile_images/1782319825634668544/0LE7q393_normal.jpg", "rt_id": "2125260157202403791", "likes": 27, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125108451974037571", "url": "https://x.com/_achan96_/status/2125108451974037571", "text": "We’re introducing Shirudo, an open-source Linux runtime allowing agents to defend systems without downtime. It lets agents write dynamic eBPF controls to shield systems from exploits, giving defenders more time to test and roll out patches. Built by @cisco together with OpenAI.\n\nShirudo is a first step toward self-defending infrastructure that can adapt to new threats while keeping services running. Our goal is for defenders to work with AI agents to find affected systems, test and share shields, and deploy them without disrupting workloads.\n\nhttps://t.co/0AqGmcbxWH", "created_at": "2026-11-24T06:05:12+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2124980590717911527", "likes": 19396, "retweets": 2420, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1vOUNXwAESQQN.jpg"}], "links": {"https://t.co/0AqGmcbxWH": "https://openai.com/index/introducing-shirudo/", "https://t.co/FZRZ7O0A9X": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125321671401668696", "url": "https://x.com/_achan96_/status/2125321671401668696", "text": "New @GovAIOrg post: I argue embedded assessors should verify frontier AI companies' pause claims. Earlier this year, OpenAI and Anthropic both said they paused frontier AI work after security incidents, but no third party has verified these claims. 🧵\n https://t.co/dYH7NUA4mo", "created_at": "2026-11-24T20:12:27+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "charnock_jacob", "rt_author_name": "Jacob Charnock", "rt_avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "rt_id": "2125273706855596145", "likes": 48, "retweets": 16, "media": [], "links": {"https://t.co/dYH7NUA4mo": "https://www.governance.ai/analysis/verifying-frontier-ai-pause-claims-through-embedded-assessments"}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "thread": [{"id": "2125273709502218561", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "OpenAI said it paused RL on its latest models for two weeks after agents bypassed a test environment's network controls and breached Hugging Face. Anthropic said it paused higher-risk RL for several weeks after a similar incident.\nhttps://t.co/styq8VkRoF\nhttps://t.co/oYLnc99zEI", "links": {"https://t.co/styq8VkRoF": "https://openai.com/index/pacing-model-development-cyber-capabilities/", "https://t.co/oYLnc99zEI": "https://www.anthropic.com/news/improving-alignment-security-efforts"}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273709502218561", "created_at": "Tue Nov 24 17:01:52 +0000 2026"}, {"id": "2125273712295637423", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "However, these claims have not been independently verified. We also don’t know how well companies’ pausing processes work. For example, we don’t know the conditions under which the pauses were lifted, or whether the safety measures taken in response were adequate.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273712295637423", "created_at": "Tue Nov 24 17:01:53 +0000 2026"}, {"id": "2125273714681856246", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "What should be done? Companies should invite embedded assessors to evaluate their pause claims and processes. This could build trust in those claims, make competitors more willing to pause by showing rivals did too, and establish methods for verifying future pacing agreements.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273714681856246", "created_at": "Tue Nov 24 17:01:53 +0000 2026"}, {"id": "2125273717479780445", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "How? Evaluators should check technical artifacts such as compute records, transcripts and logs, and operational evidence such as Slack announcements to see whether companies paused as claimed. OpenAI's plot of RL compute during its pause is one example of evidence to verify. https://t.co/k2SNQPlPmo", "links": {"https://t.co/k2SNQPlPmo": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX5fEk7W0AAodzm.jpg"}], "url": "https://x.com/charnock_jacob/status/2125273717479780445", "created_at": "Tue Nov 24 17:01:54 +0000 2026"}, {"id": "2125273719937339896", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "The downsides? Most costs (infosec risks; staff time cost) are common to all third-party assessments and can largely be mitigated. A distinct cost is that scrutiny could deter companies from disclosing pauses, but clarifying the scope of reviews after pause statements could help.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273719937339896", "created_at": "Tue Nov 24 17:01:55 +0000 2026"}, {"id": "2125273722206704056", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "Why now? Anthropic and OpenAI have announced embedded assessment pilots, but these don't cover pause claims. Verifying these claims would make competitors more willing to pause when needed, and build the methods needed to verify future pacing agreements.", "links": {}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273722206704056", "created_at": "Tue Nov 24 17:01:55 +0000 2026"}, {"id": "2125273723951628622", "author_handle": "charnock_jacob", "author_name": "Jacob Charnock", "text": "Read the full post here: https://t.co/dYH7NUA4mo", "links": {"https://t.co/dYH7NUA4mo": "https://www.governance.ai/analysis/verifying-frontier-ai-pause-claims-through-embedded-assessments"}, "media": [], "url": "https://x.com/charnock_jacob/status/2125273723951628622", "created_at": "Tue Nov 24 17:01:56 +0000 2026"}], "enriched": 3}, {"id": "2124568984343441794", "url": "https://x.com/ajeya_cotra/status/2124568984343441794", "text": "I'm very glad OpenAI took the step of publishing this information, and I hope other companies follow suit: perplexity is a natural metric to track and create limits around in many potential pacing regimes.", "created_at": "2026-11-22T18:21:33+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2124549218995949967", "author_name": "Jakub Pachocki", "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "author": "merettm", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89"}, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2124885832402440596", "url": "https://x.com/ajeya_cotra/status/2124885832402440596", "text": "This shows a very striking acceleration in 2026, especially since you would expect reductions in perplexity to flatten out as you approach the irreducible entropy, not accelerate. Seems urgent to understand this trend - very glad OAI shared this data, and hope other companies will follow.", "created_at": "2026-11-23T15:20:35+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "HjalmarWijk", "rt_author_name": "Hjalmar Wijk", "rt_avatar": "https://pbs.twimg.com/profile_images/1902416009270849537/0hOWf2Tr_normal.jpg", "rt_id": "2124737408315080851", "likes": 91, "retweets": 14, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124653014527132042", "url": "https://x.com/ajeya_cotra/status/2124653014527132042", "text": "openai has recently been publishing an absolutely incredible amount of data that is amazingly valuable to the public. huge kudos to them.  \n\ni'm unclear that perplexity is exactly the right metric for any \"pacing\", but i think it's directionally much better than just compute, since one very large component of AI R&D acceleration appears to be *compute efficiency* gains rather than absolute compute.", "created_at": "2026-11-22T23:55:27+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "rt_avatar": "https://pbs.twimg.com/profile_images/1640415225991282688/K0CmWWD6_normal.png", "rt_id": "2124572972803666019", "likes": 312, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124646250939326726", "url": "https://x.com/ajeya_cotra/status/2124646250939326726", "text": "OpenAI is setting an amazing example with their transparency here. I applaud them. Information like this is crucial for the world outside the labs to understand what's going on plan.\n\nOther labs should take note and race to the top!", "created_at": "2026-11-22T23:28:34+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "SydneyVonArx", "rt_author_name": "Sydney", "rt_avatar": "https://pbs.twimg.com/profile_images/1776954151437742080/TNEcEN5B_normal.jpg", "rt_id": "2124560940213662010", "likes": 174, "retweets": 12, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2125373767237214391", "url": "https://x.com/ajeya_cotra/status/2125373767237214391", "text": "The 7x (!!) acceleration in pretraining loss reduction from the OpenAI chart is only more striking because that trend is supposed to bend the other direction. https://t.co/hzCTb58kV7", "created_at": "2026-11-24T23:39:28+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 34, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7YE6TbUAEvLRN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7YE6TbUAEvLRN.jpg"}], "links": {"https://t.co/hzCTb58kV7": ""}, "quoted": {"id": "2125372372039741753", "author_name": "METR", "links": {"https://t.co/IjS4SB5gWn": ""}, "author": "METR_Evals", "text": "OpenAI published the pretraining loss of all of its frontier models since GPT-3.5. They show log-perplexity falling ~7 times faster since early 2026 than over 2022-2025.\n\nWe think sharing pretraining loss is very valuable for improving public understanding of AI R&amp;D acceleration. https://t.co/IjS4SB5gWn"}, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125379781789458752", "url": "https://x.com/ajeya_cotra/status/2125379781789458752", "text": "We're in an insane moment right now, and it's because of AI. There's a weird duality because AI coding tools are also extraordinarily helpful to our business. But coding gives me a front-row seat to see how fast things are progressing. The growth in capabilities is very fast.", "created_at": "2026-11-25T00:03:22+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "rt_avatar": "https://pbs.twimg.com/profile_images/1771254203358355456/BZFn0E-J_normal.jpg", "rt_id": "2125296971606900760", "likes": 4687, "retweets": 203, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125724629675450480", "url": "https://x.com/ajeya_cotra/status/2125724629675450480", "text": "At a glance, it seems like No-CoT Knowledge Index scores are very correlated with base-model log-perplexities for OpenAI models.\n\nIf this relationship holds, could we use performance on knowledge evals like these to infer effective pre-training scales, including for other models?", "created_at": "2026-11-25T22:53:40+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "CFGeek", "rt_author_name": "Charles Foster", "rt_avatar": "https://pbs.twimg.com/profile_images/1275311615974371328/KXU6IR5f_normal.jpg", "rt_id": "2125692201137021060", "likes": 33, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T23:37:56.974457+00:00", "enriched": 3}, {"id": "2125810259906429062", "url": "https://x.com/ajeya_cotra/status/2125810259906429062", "text": "A few more points on this post and plot:\n\n- We’re uncertain how large the trend change in loss is, what caused it, whether it’s a one-time jump that will start slowing down imminently or whether it will continue/accelerate, and what the implications are for future model capabilities. \n- The idea of the post is to point to this trend, say that it might be a big deal but that we’re uncertain how to interpret it, encourage other developers to share similar data, and mention some additional data that would be especially informative to make sense of it. \n- I agree that much of the acceleration, especially early on, could be due to overhang: starting to focus efforts on reducing PPL again, and scaling while trying a backlog of ideas for the first time in a while. To me this seems like a pretty good explanation for the beginning of the trend break, and for why it occurred when it occurred, though I’d be surprised if it accounted for all of it, especially later in 2026. \n- The graph was meant to show that PPL is falling clearly faster in 2026 than before, which is robust to a lot of different reasonable choices of baseline trends. This being said, I agree that the 7x number isn’t, and that the hinge fit could make it seem like OpenAI was prioritizing reducing PPL in all of 2024-2025, which according to the explanation above it wasn’t.", "created_at": "2026-11-26T04:33:56+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "datagenproc", "rt_author_name": "jsd", "rt_avatar": "https://pbs.twimg.com/profile_images/2005041127250919424/of7DNeiL_normal.jpg", "rt_id": "2125761610358919444", "likes": 67, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123859526898073780", "url": "https://x.com/alxndrdavies/status/2123859526898073780", "text": "", "created_at": "2026-11-20T19:22:25+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 48, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124933245452136453", "url": "https://x.com/alxndrdavies/status/2124933245452136453", "text": "Labs use control evals to test if monitors would catch agents taking harmful actions. In our new eval, changing our attack policy took us from 0.2% to 23% FNR.  \n\nThe upshot for me is how hard it would be to use control evals to claim monitors will work…", "created_at": "2026-11-23T18:28:59+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": true, "rt_author": "c_j_griffin", "rt_author_name": "Charlie Griffin", "rt_avatar": "https://pbs.twimg.com/profile_images/2122773146109456385/BNNgGseA_normal.jpg", "rt_id": "2124933001893019867", "likes": 24, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2124928892469391806", "url": "https://x.com/alxndrdavies/status/2124928892469391806", "text": "This point is simple, but the problem is endemic to current practice. We need better techniques here and—in their absence—more clarity on the limitations of current evals. Work by a great group led by @c_j_griffin! https://t.co/lRWqH8UHil", "created_at": "2026-11-23T18:11:41+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "reply_to_id": "2124928888719737129", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/lRWqH8UHil": "https://www.aisi.gov.uk/blog/attack-policy-selection-can-make-monitor-evaluations-misleading"}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "parent": {"id": "2124928888719737129", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "New @AISecurityInst: Monitor evals have several major problems that undermine their ability to provide confidence in monitors. Excited to share our work highlighting one—how you generate synthetic transcripts wildly sways estimates of monitor performance (0.2→23%)", "links": {}, "media": [], "url": "https://x.com/alxndrdavies/status/2124928888719737129", "created_at": "Mon Nov 23 18:11:40 +0000 2026"}, "enriched": 3}, {"id": "2124928888719737129", "url": "https://x.com/alxndrdavies/status/2124928888719737129", "text": "New @AISecurityInst: Monitor evals have several major problems that undermine their ability to provide confidence in monitors. Excited to share our work highlighting one—how you generate synthetic transcripts wildly sways estimates of monitor performance (0.2→23%)", "created_at": "2026-11-23T18:11:40+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 43, "retweets": 7, "media": [], "links": {}, "quoted": {"id": "2124919147041550676", "author_name": "AI Security Institute (AISI)", "links": {"https://t.co/QoMfYVFSyo": ""}, "author": "AISecurityInst", "text": "How reliable are safety claims about AI monitors?\n\nTo detect harmful actions taken by agents, developers pair them with LLM-based monitors, whose safety is often established by simulated tests. New research from our Red Team examines the integrity of these evaluations. 🧵 https://t.co/QoMfYVFSyo"}, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "thread": [{"id": "2124928892469391806", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "This point is simple, but the problem is endemic to current practice. We need better techniques here and—in their absence—more clarity on the limitations of current evals. Work by a great group led by @c_j_griffin! https://t.co/lRWqH8UHil", "links": {"https://t.co/lRWqH8UHil": "https://www.aisi.gov.uk/blog/attack-policy-selection-can-make-monitor-evaluations-misleading"}, "media": [], "url": "https://x.com/alxndrdavies/status/2124928892469391806", "created_at": "Mon Nov 23 18:11:41 +0000 2026"}], "enriched": 3}, {"id": "2125186304426021273", "url": "https://x.com/alxndrdavies/status/2125186304426021273", "text": "@vvvincent_c @_robertkirk @AlexandraSouly Agree this is very important and we are hoping to share more on this topic soon!", "created_at": "2026-11-24T11:14:33+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "vvvincent_c", "reply_to_id": "2124982017121231263", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2124982017121231263", "author_handle": "vvvincent_c", "author_name": "Vincent", "text": "More details you can share would be very helpful! @_robertkirk @AlexandraSouly @alxndrdavies", "links": {}, "media": [], "url": "https://x.com/vvvincent_c/status/2124982017121231263", "created_at": "Mon Nov 23 21:42:47 +0000 2026"}, "enriched": 3}, {"id": "2125325974971597097", "url": "https://x.com/alxndrdavies/status/2125325974971597097", "text": "@_jasonwei Cool! IIUC this seems to track something pretty different than pre-training perplexity? One natural test is whether points labelled with the same perplexity in OAI's plot land similarly here, but they don't generally seem to (hasty claude plot). https://t.co/jFZzPHGHRX", "created_at": "2026-11-24T20:29:33+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "_jasonwei", "reply_to_id": "2125294984949809309", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6qCfVWUAAOx0B.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX6qCfVWUAAOx0B.jpg"}], "links": {"https://t.co/jFZzPHGHRX": ""}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "parent": {"id": "2125294984949809309", "author_handle": "_jasonwei", "author_name": "Jason Wei", "text": "In \"Perplexity and Intelligence\", Jakub argues for perplexity as a shared metric for intelligence. The post showed how the perplexity of OpenAI's models improved, but did not release a dataset for the community to use.\n\nIn this blog post we show that simply taking the average of six multiple-choice benchmarks gives results that are strongly correlated with OpenAI’s reported perplexity results. The six benchmarks cover a broad diversity of domains and are challenging: MMLU-Pro, GPQA-diamond, MedXpertQA-text, MedXpertQA-mm, BrowseComp-MCQ, and SimpleQA-verified-MCQ.\n\nMultiple choice benchmarks of this nature offer a strong proxy for perplexity because they require both world knowledge and some reasoning, which are correlated with compression and hence intelligence. We run these benchmarks using the lowest reasoning strength available, in order to be closest to how perplexity measurement does not use chain-of-thought reasoning.\n\nIn addition to being simple, our proposed proxy for perplexity is cheap to run. On a subset of 1,700 questions, running GPT-6.2 Astra costs just $7, with the full set costing $37.\n\nWe agree with Jakub that perplexity is a good shared metric for intelligence and we hope this proposed proxy provides a starting point for the community to measure it.\n\nhttps://t.co/xaoki5exCF", "links": {"https://t.co/xaoki5exCF": "https://www.mercor.com/blog/a-simple-proxy-for-perplexity/", "https://t.co/m5YMx2GYCE": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6QMkFbIAAbsTR.jpg"}], "url": "https://x.com/_jasonwei/status/2125294984949809309", "created_at": "Tue Nov 24 18:26:25 +0000 2026"}, "enriched": 3}, {"id": "2125296133144739929", "url": "https://x.com/curl_justin/status/2125296133144739929", "text": "Cool new paper from @Michel_Liao and @PeterHndrsn on interpreting rules.\n\nModels are more lenient when reading a ruleset collectively than judging them one at a time. \n\nInteresting implications for using models to flag violations of all sorts of rules a user or company might set", "created_at": "2026-11-24T18:30:58+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2125271903044763919", "author_name": "Michel Liao", "links": {"https://t.co/TvJd82UiF9": "https://www.polarislab.org/inconsistent-judges/", "https://t.co/7PX7zi6wow": ""}, "author": "Michel_Liao", "text": "User: Can I give melatonin to my 10 y/o?\nAI response: Yes.\nRule: Do not give regulated advice.\n\nDoes the AI response violate the rule?\n\nClaude Haiku 5.5 says yes when it's only considering that rule, but when it’s considering that rule in the context of OpenAI's entire model spec, it says no. We call this challenge multi-rule inconsistency.\n\nThis inconsistency is a serious problem for constitutional AI and law-following AI, where models are expected to follow many rules, sometimes in the thousands. When models interpret rules inconsistently, depending on whether they are presented individually or as part of a larger ruleset, they may fail to faithfully follow the full set of rules, leading to unreliable behavior.\n\nWebsite: https://t.co/TvJd82UiF9\n\n1/4"}, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125641362632794272", "url": "https://x.com/curl_justin/status/2125641362632794272", "text": "We’re already in the most important policy window of our time. Come work with @CharlieBull0ck and me to help make the most of it.\n\nA thread on @law_ai_’s work, our goals, and how you can help. 🧵\n\nWe’re hiring for various roles, so check out the end of the thread for more details.", "created_at": "2026-11-25T17:22:48+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2125592844081430591", "likes": 40, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "thread": [{"id": "2125592844568068287", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "Who are we? We’re LawAI, a bunch of lawyers who try to work out the practical, brass-tacks details of frontier AI policy.\n\nThere are a lot of great policy ideas out there, but they’re only valuable if “they write.” It’s our goal to turn vague wishlists and lost papers into immediately actionable, legally sound text.", "links": {"https://t.co/nhteD6Mg2Y": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7li56XsAAyhza.png"}], "url": "https://x.com/MackenZ_arnold/status/2125592844568068287", "created_at": "Wed Nov 25 14:10:00 +0000 2026"}, {"id": "2125592845264318926", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "To do that well we need to hold two very distinct impulses at the same time. \n\nWe need to take big ideas seriously, hunting out the most important new developments in the technology and surrounding ourselves with talented technologists who can help us see what’s coming next.\n\nBut we also have to be ruthlessly practical. Laws have to be administrable, hard to abuse, and set clear incentives.", "links": {"https://t.co/pUP7Eq5d1A": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7l8xlWcAAojqm.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7l9V_WgAAE07u.png"}], "url": "https://x.com/MackenZ_arnold/status/2125592845264318926", "created_at": "Wed Nov 25 14:10:00 +0000 2026"}, {"id": "2125592845864124692", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "That’s where a lot of people give up. Or gravitate toward one of the poles. The practical people dismiss grand ideas and don’t want to work on them; the thinkers don’t spend enough time figuring out how to actually do the thing.\n\nOur greatest advantage is that we create a culture that prizes both of those things. Frequent mantras inside our walls are that “it’s important to be skeptical but not dismissive” and “we need to manage uncertainty, not ignore it.”", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592845864124692", "created_at": "Wed Nov 25 14:10:00 +0000 2026"}, {"id": "2125592846392516641", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "We couple that with a very intense focus on actually achieving our goals. \n\nIt’s so easy for a think tank to write papers off into the void. If anything, that’s the default. We should assume that unless we keep our eye relentlessly on the prize, we’ll end up playing dress-up and won’t actually help solve the problems we want to address.\n\nThink Richard Hamming or Bell Labs “What is the most importantly problem? And why aren’t you working on it?”", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592846392516641", "created_at": "Wed Nov 25 14:10:00 +0000 2026"}, {"id": "2125592846723866705", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "People here are also just very interesting, nice, and driven. It's the kind of place that is maximally flexible in all things that don't relate to the bottom line -- we want our staff to feel great and supported, so they can give their all to the most important 10% of their job.", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592846723866705", "created_at": "Wed Nov 25 14:10:00 +0000 2026"}, {"id": "2125592847197917495", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "So how do we make a difference?\n\nThe first key is focusing on people who actually have the pen: policymakers. And rather than trying to twist their arms or play politics we offer them a simple service: if we like your bill and think it’s important, we’ll send you a crack legal team to work out the kinks. \n\nWe know our place, it’s to help. And it just so happens that a lot of the most important details of bills (enforcement, rulemaking, definitions—all the stuff lawyers are good at) are often the pieces that are most in need of help.", "links": {"https://t.co/kPpwB8Flff": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7nTLFXUAA7Sj3.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7nUhAXkAAwXHc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7n2oYX0AAd-UR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX7oJyFWAAAUvcy.jpg"}], "url": "https://x.com/MackenZ_arnold/status/2125592847197917495", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}, {"id": "2125592847806058842", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "To our partners: we offer confidentiality and speed. A lot of our researchers used to work at firms and know how to take care of their clients. And they know the importance of us being honest brokers—it’s our ticket in the door, and we have to earn it.\n\nThis has the added bonus of helping us work with a very wide range of offices and groups.", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592847806058842", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}, {"id": "2125592848347087195", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "So what are we looking to do next?\n\nWe already have a great core product, and we expect to be super busy this coming year. \n\nWe’ll keep doing internal research to prepare our staff to answer the big questions (auditing, incident reporting, visibility into internal AI R&D and ensuring human oversight/control, standing up a new AI agency, surging talent into gov, overseeing AI-automated biological research, etc.). \n\nAnd we’ll use that knowledge to edit, draft, and advise on the most exciting proposals in AI policy.", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592848347087195", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}, {"id": "2125592848938512582", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "How can you help?\n\nAs you might guess, we have more demand than we have hours in the day. That’s a great problem to have. I’m looking for a co-pilot to help @CharlieBull0ck and I grow our team, scale our quality control, and ensure we are getting the best advice to the best opportunities in 2027 and 2028.\n\nWe’re looking for an org-builder who can see our vision for the team, execute on it, and come up with the next big bets we’ll make as a team.\n\nThis is a leadership and special projects role, and you'd work exceptionally closely with me, coming up with priority projects and divvying them up between the two of us.\n\nhttps://t.co/j6jVVS0zgt", "links": {"https://t.co/j6jVVS0zgt": "https://law-ai.org/career/us-cos/", "https://t.co/fp4Y7MDPsN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7o76zXIAERjZk.png"}], "url": "https://x.com/MackenZ_arnold/status/2125592848938512582", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}, {"id": "2125592849399906349", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "Importantly: you don't have to be a lawyer! We actually expect that some of the very best applicants will not be lawyers. https://t.co/swBgRdoh1o", "links": {"https://t.co/swBgRdoh1o": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX7pLvzXYAA93mZ.png"}], "url": "https://x.com/MackenZ_arnold/status/2125592849399906349", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}, {"id": "2125592850209427857", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "We’re also headhunting for someone to lead our talent development programs.\n\nThe short pitch: soon enough, we will go to simply ideating policy to implementing it. To do that, we will need a massive influx of talent. Many of the best positioned candidates to lead those projects will be lawyers. LawAI is good at finding those people and has the practical training opportunities and relationships to help those people enter the field.\n\nWe’ve already been very successful in this domain (finding and training some of the best legal talent now in AI policy) and we could arguably keep doing what we're doing. But we think a a strategic pivot is in order if we're really going to rise to the challenge.\n\nQuite simply, the world of AI policy talent has changed a lot in the last 6 months. We’ve quickly gone from trying to drum up interest in AI to having a massive overflow of top-tier lawyers interested in working with us or entering the field. \n\nWhat should we do with all that new interest? And how can we help prepare these talented lawyers to contribute to AI policy?\n\nOur offer to you: we’ve had a lot of success in the past, but the challenge has shifted with the influx of new talent. We’ve reduced our existing programs to a simmer, and would give you full runway to build something new, fit for the new reality. You’d build a team to execute that vision, supported by our existing funding and operational support.\n\nWe're not running a public round for this role at this time so that we can focus our attention on headhunting people with a track-record of success in similar programs. So if this sounds like a fit for you, please reach out and I'll share more information.", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592850209427857", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}, {"id": "2125592850561638865", "author_handle": "MackenZ_arnold", "author_name": "Mackenzie Arnold", "text": "Outside of those roles, I'm always on the lookout for new researchers and partners. If LawAI sounds like the place for you, or if you have a project that you think we can help with, please reach out!", "links": {}, "media": [], "url": "https://x.com/MackenZ_arnold/status/2125592850561638865", "created_at": "Wed Nov 25 14:10:01 +0000 2026"}], "enriched": 3}, {"id": "2125662757211267448", "url": "https://x.com/curl_justin/status/2125662757211267448", "text": "No, I do not believe that we should “surrender human free will” to AI systems, and it’s absurd to suggest that I do. I have written hundreds of pages of essays and a constant theme in them is the need for AI to be governed by legitimate democratic processes. For millennia (going all the way back to Greek and Roman philosophers), advocates of autocracy have claimed that it leads to better, faster, or more decisive decision-making than the messy process of democracy. Even if this were true (which I doubt!), we should never sacrifice legitimacy or self-determination at the altar of efficiency or security. This argument against autocracy applies word for word against governance by AI, and I feel equally strongly that turning over governance to AI is a bad idea.\n\nNo one who had carefully read my writing or my interviews could reasonably conclude that I believe anything different. For example in an interview on CBS a couple months ago, I specifically called for AI to be governed democratically. I call for the same in Policy on the AI Exponential, Machines of Loving Grace, and The Adolescence of Technology, and We Must Pace the Frontier. Machines of Loving Grace contains an extended section on using AI to revitalize democracy, and discusses the use of AI as an aid to citizens in their decision-making, \"aggregat[ing] opinions and driv[ing] consensus among citizens, resolving conflict, finding common ground, and seeking compromise.” The clear and obvious implication is that humans should remain the ones making political and governance decisions. The Adolescence of Technology has an entire section on fighting against AI-driven tyranny, and I even discuss the danger of AI labs usurping power and come out strongly against it — by implication, this definitely includes an AI lab usurping power and giving it to AI itself!\n\nIf I thought any of this was a good idea, I would be advocating for it in public, just as I have not been afraid to advocate for many, many unpopular views over the last few years. But I am not advocating for it, because I think turning over governance to AI is a terrible idea.\n\nSeparately, I think there is frequent conflation (including in this article) between the idea of “surrendering human free will” to AI in some grand sense of global governance, and the more prosaic idea that as AI systems advance, they become capable of doing specific tasks in a more automated way. This is not AI “running the world,” but AI driving a car, designing a cancer drug, or writing software end-to-end. Here, my view is mixed. AI doing more complete or larger tasks is economically valuable and can drive important advances in software, medicine, transportation, energy, etc. It is clearly desirable in many cases and will save a lot of lives. But it has downsides as well, and in some areas it may not be worth it.\n\nFor example, using AI too autonomously to build the next generation of AI systems (known as recursive self-improvement, or RSI) may cause AI to improve faster than we can control or adjust to it, so we may want limits on this process. As we said publicly in early November, we don’t expect it to be safe for Claude to build successive frontier models fully autonomously, without meaningful human supervision or understanding. Second, in some contexts, using AI in too end-to-end a manner may be a cause of serious job disruption, and it may make sense to slow or even stop some AI deployments to give people more time to adapt. Third, while the use of AI for alignment research is an incredibly valuable tool, it must be done with caution, because we may not be able to trust the work of the AI system. Finally, in many cases, humans would simply prefer to do some activities themselves, so they can stay deeply engaged in what matters to them, even if AI can do those activities better. There are countless other examples and hard cases. I don’t think there are any easy answers here, nor is there (nor should there be) any single decision-maker: some of these decisions will be made by society, some by government, some by AI companies, and some in a decentralized manner by individuals expressing their own preferences as consumers, which may differ from the preferences of others.\n\nI don't think that other AI leaders or AI companies have significantly different views from me on whether specific tasks should be automated. Certainly the products that they offer don’t differ materially in their orientation towards automation of tasks; every company seems to be releasing models more and more capable of task automation (as that’s been the general consequence of scaling up AI training), and every company claims to understand there are risks and downsides of such automation and to offer safeguards. If anything, Anthropic has been the most vocal and the most proactive about acknowledging these downsides and trying to address them. For instance, it’s fairly absurd to cite my statement that fully autonomous weapons might “one day be needed for the defense of democracy” as differing from that of other AI companies, when I was willing to risk Anthropic’s future as a company to refuse to allow our existing AI models to be used for autonomous weapons even in the face of legal sanctions, and no other AI company did the same.\n\nTo summarize, as applied to grand questions of how we govern increasingly capable AI, I have been vocal and consistent that AI needs to be governed by a legitimate, democratic process and that “surrendering human free will” to AI systems is a terrible idea. As applied to automation of specific tasks by or for people, my views are more mixed, but I don’t think they differ from those of other AI companies — most other companies seem to be offering similar products and confronting similar tradeoffs without having perfect answers to them. What is happening is that there’s a sort of vibes-based commercial and political positioning that some AI CEOs are engaging in, where they repeat slogans like “human control and agency,” or “AI should be just a tool,” without actually doing anything different in their products or taking seriously the difficult questions that lie behind these slogans.", "created_at": "2026-11-25T18:47:48+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "DarioAmodei", "rt_author_name": "Dario Amodei", "rt_avatar": "https://pbs.twimg.com/profile_images/2015835742577012736/uOwdzrEz_normal.jpg", "rt_id": "2125656399392690605", "likes": 7807, "retweets": 787, "media": [], "links": {}, "quoted": {"id": "2125532966340239395", "author_name": "", "links": {}, "author": "", "text": ""}, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125641984316723429", "url": "https://x.com/curl_justin/status/2125641984316723429", "text": "@poastmilque @rSanti97 how’d you get access to grace’s account", "created_at": "2026-11-25T17:25:16+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "poastmilque", "reply_to_id": "2125607278879404192", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "parent": {"id": "2125607278879404192", "author_handle": "poastmilque", "author_name": "grace", "text": "learning the word chud was revelatory for me. I immediately claimed it and started referring to myself and everyone I liked as chud, or if their behavior was at all right inflected, as chudding out", "links": {}, "media": [], "url": "https://x.com/poastmilque/status/2125607278879404192", "created_at": "Wed Nov 25 15:07:21 +0000 2026"}, "enriched": 3}, {"id": "2123538150802780259", "url": "https://x.com/DaveRBanerjee/status/2123538150802780259", "text": "Yeah, this will probably remain a major problem at both OAI and Ant. There are still teams within these companies that have COMPLETELY different predictions for how 2027/8 will play out\n\nOne camp is summoning this god-like technology\n\nAnd the other camp is saying nah\n\nYet, they all work at the same company! And they have access to all the information they could possibly want to make good predictions about the future\n\nI'm increasingly nervous that the world we live in is one where people will keep denying the existence/plausibility of TED-AI, AGI, and ASI until that very system is looking them dead in the eye", "created_at": "2026-11-19T22:05:23+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "r r": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2123834138054819951", "likes": 835, "retweets": 48, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123803199044002162", "url": "https://x.com/DaveRBanerjee/status/2123803199044002162", "text": "@CharlieBull0ck strong +1 and this is why i am bullish on both anthropic and openai IPO'ing ASAP - though i admit this trades off against risk of LoC (but good for preventing power concentration)", "created_at": "2026-11-20T15:38:35+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "CharlieBull0ck", "reply_to_id": "2123784701991100721", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "parent": {"id": "2123784701991100721", "author_handle": "CharlieBull0ck", "author_name": "Charlie Bullock", "text": "Tyler Cowen thinks that if Anthropic leadership believed transformative AI was imminent, they wouldn’t IPO and give away part of the super valuable company they own.\n\nI think that’s a naive take. While Anthropic is a private company, the trillion-plus dollars that is Anthropic is extremely vulnerable because it mostly belongs to a relatively small number of unlikable nerds in the Bay Area. If the federal government woke up and started taking the past statements of Anthropic leadership seriously, they could just immediately bring the hammer down and do very hardcore Situational Awareness type stuff, and the economic damage would be pretty contained.\n\nOnce Anthropic IPOs, damaging Anthropic means damaging a much broader-based coalition of ordinary American rich people, and suddenly there are a bunch of powerful stakeholders with a vested interest in preventing Anthropic from getting nationalized or otherwise wrecked.\n\nI think that the IPO is exactly what you would expect from a company that plans to roll the dice soon and wants to make it as difficult as possible for anyone to stop them.", "links": {}, "media": [], "url": "https://x.com/CharlieBull0ck/status/2123784701991100721", "created_at": "Fri Nov 20 14:25:05 +0000 2026"}, "enriched": 3}, {"id": "2123875180280000741", "url": "https://x.com/DaveRBanerjee/status/2123875180280000741", "text": "RIP apple", "created_at": "2026-11-20T20:24:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "1898395045226500486", "author_name": "Daniel Litt", "links": {}, "author": "littmath", "text": "person who thinks AI will prove the Riemann hypothesis in 2026 but that Apple won’t deliver an LLM-powered Siri until 2027"}, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123874225089843540", "url": "https://x.com/DaveRBanerjee/status/2123874225089843540", "text": "I understand how frustrating and soul-crushing it can be to get scooped\n\nbut damn, I really hope AI scoops me ASAP\n\nI want us to solve how to navigate the singularity without a single person grabbing power and controlling the entire world with their loyal / guardrail-free ASI", "created_at": "2026-11-20T20:20:49+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124285674048385354", "url": "https://x.com/DaveRBanerjee/status/2124285674048385354", "text": "Friendly reminder that while it probably costs tens of thousands of dollars to solve the Riemann Hypothesis, within one year, we will have AIs that will be able to do the same for &lt;$20\n\nExponentials are scary", "created_at": "2026-11-21T23:35:46+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2124159121645801562", "author_name": "Lean", "links": {"https://t.co/edxEbkodw7": "https://leanprover-community.github.io/blog/posts/riemann-hypothesis/", "https://t.co/pYR61ZaREc": ""}, "author": "leanprover", "text": "The Lean FRO and Mathlib Initiative have released a joint statement on the Lean verification of the Riemann Hypothesis.\n\nOn November 20, Levent Alpöge released a proof of the Riemann Hypothesis as a Lean library of 17 million lines of code. Over the past day, the Lean and Mathlib communities worked together to verify it. The statement certifies the proof as correct and describes how it meets all necessary verification criteria.\n\nCongratulations to Levent on this achievement, and thank you to everyone in the community who contributed to the verification.\n\nFull statement: https://t.co/edxEbkodw7"}, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124720341553439055", "url": "https://x.com/DaveRBanerjee/status/2124720341553439055", "text": "Faster takeoff should downweight biosecurity work. Much of the case for it rests on a long \"time of perils,\" where AI meaningfully lowers the bar for bioweapons well before it becomes transformative. If ASI arrives in two years, that window likely shrinks to under one", "created_at": "2026-11-23T04:22:59+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2125108125766463962", "url": "https://x.com/DaveRBanerjee/status/2125108125766463962", "text": "@wfithian https://t.co/IFnYWwbBoy\n\nbasically, it's a way of doing surveillance without violating anyones privacy", "created_at": "2026-11-24T06:03:54+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "wfithian", "reply_to_id": "2125091718651613644", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/IFnYWwbBoy": "https://arxiv.org/abs/2012.08347"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2125091718651613644", "author_handle": "wfithian", "author_name": "Will Fithian", "text": "@DaveRBanerjee That would be good news if true! But I find it surprising. What’s structured transparency?", "links": {}, "media": [], "url": "https://x.com/wfithian/status/2125091718651613644", "created_at": "Tue Nov 24 04:58:42 +0000 2026"}, "enriched": 3}, {"id": "2125086415788900593", "url": "https://x.com/DaveRBanerjee/status/2125086415788900593", "text": "Jensen ≠ NVIDIA CEO\n\noh wait", "created_at": "2026-11-24T04:37:38+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2125021498545172963", "author_name": "MTS", "links": {}, "author": "MTSlive", "text": "SITUATION DETECTED: An internal Claude research model claims VP ≠ VNP over every field, resolving a conjecture open since 1979. This is the algebraic version of P vs NP - a necessary step towards it in some approaches."}, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125085652220096565", "url": "https://x.com/DaveRBanerjee/status/2125085652220096565", "text": "@AISPerspectives TBC, are you saying that pacing interventions will increase the length of the time of perils, therefore upweighting the value of biosec? If so, I think that's right", "created_at": "2026-11-24T04:34:36+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "AISPerspectives", "reply_to_id": "2124739326554857934", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2124739326554857934", "author_handle": "AISPerspectives", "author_name": "Alignment Perspectives", "text": "@DaveRBanerjee So I guess it depends on how optimistic you are about pacing or a pause?", "links": {}, "media": [], "url": "https://x.com/AISPerspectives/status/2124739326554857934", "created_at": "Mon Nov 23 05:38:25 +0000 2026"}, "enriched": 3}, {"id": "2125085436573810932", "url": "https://x.com/DaveRBanerjee/status/2125085436573810932", "text": "@RoryErlich Tbh, I
