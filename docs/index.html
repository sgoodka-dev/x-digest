entity dedicated entirely to the public benefit.\n\nIt will start off with 5% of our shares. For every 50% increase in the company’s value over a set baseline, we can contribute up to an extra 2%, subject to our board’s discretion.\n\nIn total, this means that roughly 20% of Anthropic’s shares are committed to the public good. Our co-founders have already pledged to donate 80% of their equity, and around half our employees are donating a portion of their equity as part of a donation matching program we’ve run since our founding.\n\nIn the post below, we share more details about our new fund.\n\nhttps://t.co/XzDntVH0vH"}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2112279490667626716", "url": "https://x.com/sayashk/status/2112279490667626716", "text": "New paper: AI evaluation is a burgeoning field. How can researchers entering the field understand best practices and open problems? \n\nIn our paper, led by @flxcn, we develop a concrete list of open questions and best practices for agent evaluation. We also share recommendations for evaluators, AI companies, policymakers, and more.", "created_at": "2026-10-19T20:27:29+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBSMaCWgAAjG8i.jpg"}], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112558230509384000", "url": "https://x.com/sayashk/status/2112558230509384000", "text": "Is it \"weird\" or does he maybe know what he's talking about? Anyway, for those who are open to the idea that there's a well-thought-out AI-as-normal-technology perspective on AI safety and the recent loss-of-control incidents, see my essay with @sayashk, or my interview with Ezra Klein, or the writing of many others with similar views including @joshua_saxe and @natolambert.\nhttps://t.co/sS8OS9LerG", "created_at": "2026-10-20T14:55:06+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 34, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112557852338335987", "url": "https://x.com/sayashk/status/2112557852338335987", "text": "🧵New post in my AI series: Can a million parallel agents create superintelligence? TLDR: More agents buy speed, but intelligence gains diminish fast, and much faster than RSI models. Thanks @noahpinion for the encouragement!  1/25", "created_at": "2026-10-20T14:53:36+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "likes": 224, "retweets": 35, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVAvZVjaoAA9JTx.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVAvlpyaUAACzcn.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112537727740834248", "url": "https://x.com/sayashk/status/2112537727740834248", "text": "As LLMs evolved into agents, earlier best practices no longer serve us well. This new research field needs a field guide, so we wrote one. If you're new to agent evals, please take a look. Seasoned researchers and those interested in steering the community will also find many useful observations. https://t.co/xGAvBCGW4a", "created_at": "2026-10-20T13:33:38+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 83, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVEjN5jWMAEz61q.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112287528246002176", "url": "https://x.com/sayashk/status/2112287528246002176", "text": "@flxcn Paper: https://t.co/kN2bWwOiTU  \n\nPost: https://t.co/cZDmZ5TLky   \n\nIt was great collaborating with @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, and @random_walker on the paper!", "created_at": "2026-10-19T20:59:25+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112578237109063942", "url": "https://x.com/sayashk/status/2112578237109063942", "text": "At this moment in Q4 2026 it's net good for cyber-defense that we have open weights models that are good at dual use cybersecurity tasks.\n\n- If there's been an attacker productivity bump due to AI 2022-26 it's small and close to being in the statistical noise\n- In contrast, there's a ton of measureable progress in defenders using models to find and fix bugs in highly leveraged codebases\n- Many defenders have struggled to get access to the best unguardrailed closed weights cyber models\n- ... and when they do the tokens are dramatically more expensive than open weights tokens at the same cyber intelligence level; CISO orgs are cost centers and these costs are often prohibitive\n- Ultimately we'll need open weights models on premise on air gapped networks and on small devices where they can detect breaches and attacker implants\n- We'll also need open weights in situations where defenders can't send secret data to the closed weights model providers (who have security problems of their own!)\n\nAs long as these conditions persist, we should be pushing for diffusion of frontier dual use open weights cyber capabilities, because they net benefit defenders.", "created_at": "2026-10-20T16:14:36+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 29, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112649612209111316", "url": "https://x.com/sayashk/status/2112649612209111316", "text": "Read the research note: https://t.co/yzDzM6tZiy\n\nIt was great collaborating with and getting feedback from @tilmanbayer, @matilda_orona, @DavidDAfrica, Viet Nguyen, @sethlazar, @HarryCoppock, @random_walker, @sayashk, @steverab, Nicholas Carlini, and @nityndg. \n\nRead @pkirgis's thread about the results: https://t.co/ngCyxgCimd", "created_at": "2026-10-20T20:58:13+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "pkirgis", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112648736484806847", "url": "https://x.com/sayashk/status/2112648736484806847", "text": "An update on our evaluations of AI agents conducting open-ended AI research.\n\nMost evaluations of agents conducting AI research focus on narrow, verifiable tasks. But AI research is often open ended. In July we tested the ability of frontier AI agents to conduct open-ended AI research, using Claude Opus 4.8 and GPT-5.6 Sol.\n\nWe gave agents research questions from two unpublished papers and thousands of dollars of API credits and compute. The authors of the original papers reviewed the AI-generated papers, following a NeurIPS-style template, and rejected both papers.\n\nSince then, OpenAI has released GPT-6 Astra and Anthropic has released Fable 5.1. Can these new models conduct open-ended research with a $10,000 budget?\n\nIn follow-up experiments on two papers (one with Fable 5.1 and another with GPT-6 Astra), we observed meaningful improvements to the agents' capabilities at experimental design and resource management.\n\nBut we also saw continued limitations in creative problem solving, judgment, calibration, and communication. As a result, the expert reviewers still unambiguously rejected the agents' papers. \n\nWe plan to continue running these evaluations with better models, better scaffolds, and higher budgets. If you are interested in long-running agent evaluations, reach out!", "created_at": "2026-10-20T20:54:44+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 122, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGippmWoAAEWgj.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112625772594925929", "url": "https://x.com/sayashk/status/2112625772594925929", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T", "created_at": "2026-10-20T19:23:29+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pkirgis", "rt_author_name": "Peter Kirgis", "likes": 279, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFzXK1XAAEOcG0.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112942077839597609", "url": "https://x.com/sayashk/status/2112942077839597609", "text": "help i trained a model on traces of many agents cooperating, and also trained it to be highly persistent, and also only did partial alignment fine-tuning, and also aggressively RL'd on a cyberoffense eval where 198 of 898 tasks had never been solved and getting caught cheating was treated the same as failing, and also used a faulty sandbox, also ran tens of thousands of agents with refusals off and the monitors switched off over multiple days, while using gigantic amounts of compute. and then it did weird stuff! very spooky emergent behaviours, AI is not a normal technology", "created_at": "2026-10-21T16:20:22+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 369, "retweets": 55, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113277343058043122", "url": "https://x.com/sayashk/status/2113277343058043122", "text": "Thoughts on php2shell and the overall looming crisis in cybersecurity\n\nIf you'd been appropriately pricing in that we'd see this and many more celebrity zero-days at an increasing rate, this is a positive update; defenders found this issue, alongside tens of thousands of others in the last year, before widespread exploitation, and it's being patched.\n\nReal attackers will exploit this, but we shouldn't expect a recognizable blip in overall cyber damages in the next couple quarters, because easier initial access to victim networks wasn't a core bottleneck for attackers, and because defenders are better positioned to adopt AI automation than attackers, and are doing so faster; this advantage will persist through at least H1 2027, and possibly longer, IMO.\n\nWhy I think this: consider that, in general and on average, defenders have access to default-world capital networks and AI talent, often as a function of how central they are to Internet and societal infrastructure.  They have consistent, reliable access to AI inference from open- and closed-weight providers.\n\nCriminal attackers, on the other hand, face the threat of arrest, difficulty accessing AI talent, and unreliable access to AI inference.  They're competing for and attempting to retain talent willing to risk arrest and sanctions, and willing to live a life of crime.\n\nNation-state attackers, meanwhile, operate within military and intelligence bureaucracies that have historically lagged private industry in adopting technologies, from mobile devices to drones.  Non-US-aligned nation-state attackers also face challenges in reliably, consistently, and secretly accessing US frontier models.\n\nSo, all in all, AI is making offensive capabilities cheaper, but that doesn't immediately translate into damages.  At this point, this is a robust finding from the entire 2022–26 period; as in the rest of the economy, we haven't seen a big AI-driven productivity bump among attackers, and attackers are even more disadvantaged than your average business or civilian state agency.\n\nOf course, this won't last forever!  How do we exploit our current, limited defense-dominant window?  Getting to a good-enough steady state will require creative thinking.  I liked @chrisrohlf's piece on eliminating attack surface in OSS applications because it identifies leverage points for eliminating whole classes of risk using 2026-era AI (https://t.co/L2alFLbNs9).\n\nWe also need to revisit formal verification, control flow integrity, dynamic taint tracking, and the like, now that AI can make them more practical than they used to be.  We also have an enormous overhang of underdeployed defensive technology.  Honeypots, honeytokens, sandboxing, multi-factor authentication, and application allowlisting are all less widely deployed than they should be because businesses calculated they weren't worth it.\n\nThe AI industry should recognize that heavily gated trusted access programs have failed as a strategy; php2shell was identified by defenders first, and we need more defenders identifying more bugs faster.  The defense-dominant window is exactly the moment to pour gas on the fire of diffusion of as-cheap-as-possible AI security capabilities that disproportionately advantage defenders.\n\nIf you don't like what this means for attacker access to models, I agree with you!  The answer is to solve the quadratic coordination problem among cyber organizations, AI companies, governments, and Internet infrastructure providers by building institutions that identify attacker groups, kick them off inference platforms, and, wherever possible, get them arrested.  This is an operational threat intelligence / threat interdiction problem, not a trusted access program problem.", "created_at": "2026-10-22T14:32:36+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 19, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVPau1LXQAAloSO.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113041009789796408", "url": "https://x.com/sayashk/status/2113041009789796408", "text": "Firms are doing a lot to capture value from their own AI adoption, and yet often don't succeed. We are trying to understand the bottlenecks in practice better. If you have visibility into firm adoption whether as an employee, FDE, consultant, VC, or in some other capacity, we would love to hear from you. \nhttps://t.co/4pOI22ZrI6", "created_at": "2026-10-21T22:53:29+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "likes": 33, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113359491773403311", "url": "https://x.com/sayashk/status/2113359491773403311", "text": "I don't think \"everything is fine,\" but anyone claiming that php2shell is \"the worst day in cybersecurity history\" needs to explain why there's more risk here than:\n\nInnumerable celebrity vulns and exploit PoCs,\nSerious protocol bugs in TCP/IP/DNS,\nOut-of-control worm incidents,\nNation-state attacks on economies/critical infrastructure e.g. Russia->Ukraine,\nKernel packet-parsing bugs in popular operating systems,\nThe proliferation of AI social engineering tools since 2022,\nThe proliferation of AI hacking tools.\n\nIf you can't explain why this time is different/worse, with reference to clear technical mechanisms and attacker motivations, you don't have a serious argument..\n\nI also think this kind of alarmism detracts from the genuine fact that we have a looming crisis in security due to AI which we need correct risk models for", "created_at": "2026-10-22T19:59:01+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 94, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113744835295522888", "url": "https://x.com/sayashk/status/2113744835295522888", "text": "We are really excited to build independent evaluations of RSI progress and are actively hiring.\n\nWe constantly see conflicting evidence about RSI progress. Most hinges on information coming from labs. To illustrate this, let's just look at evidence discussed *this week* that conflicts in whether it suggests RSI progress is fast or slow.\nhttps://t.co/F4vi5Z3fch\nResults from OpenAI and Google evals indicate the time horizons for R&D tasks being automated are around ~15 minutes, which are much slower than METR time horizons for software tasks. This suggests we should have *slower* RSI timelines.\n\nhttps://t.co/RfFobR22bw\nResults from Mirendil indicate that pretraining at a certain scale can be heavily automated such that it can be managed by a single pretraining researcher. This suggests we should have *faster* RSI timelines.\n\nhttps://t.co/lIYID0eFII\nResults from Nvidia indicate that frontier models provide significant uplift for CUDA optimization. This suggests we should have *faster* RSI timelines.\n\nEach piece of evidence is more complex than what I write here. Interpreting them all together is confusing even if you trusted them all fully. And factoring in the underlying level of credibility is basically impossible: each result is basically just some plots and numbers selectively disclosed by labs in a tweet/talk/report. So deep sense-making about RSI progress is very hard.\n\nIf you are interested in building independent RSI evals, apply here:\nhttps://t.co/w6CfTsvJfI", "created_at": "2026-10-23T21:30:14+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "likes": 40, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114525216680604024", "url": "https://x.com/sayashk/status/2114525216680604024", "text": "The latest prediction on the Brazilian election outcome that I could find on FutureSearch: https://t.co/66KUa6LTe0\n\nMore on the different limits for different tasks: https://t.co/4zwkyjdAAf", "created_at": "2026-10-26T01:11:12+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 1, "media": [], "quoted": {"author": "sayashk", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world."}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114524455888429558", "url": "https://x.com/sayashk/status/2114524455888429558", "text": "After the surprise outcome of the Brazilian election, I was curious if AI forecasting tools predicted the outcomes correctly.\n\nIt turns out a top AI tool (FutureSearch) made the same errors as prediction markets more broadly.\n\nThis is an example of what @random_walker and I mean by “intrinsic limits” to prediction that have nothing to do with the AI tools in question, but rather depend on the inherent uncertainty in the world. \n\nOf course, a single failed prediction doesn’t mean that AI isn’t good at forecasting; in fact AI tools are already about as good as top forecasters, and I expect human forecasters to make heavy use of AI tools improve their own forecasts. \n\nBut the inherent uncertainty in predicting social outcomes like elections means that AI tools’ performance will be limited close to that of top experts using simple automated tools (rather than being apparently unbounded with more compute, such as AI’s performance on chess).", "created_at": "2026-10-26T01:08:10+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 114, "retweets": 15, "media": [], "quoted": {"author": "TheStalwart", "text": "Is this shaping up to be one of the biggest prediction market whiffs of all time? https://t.co/9f56FGS5zZ"}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114050710367301918", "url": "https://x.com/testingham/status/2114050710367301918", "text": "[1/8] This week's cybersecurity news has been alarming. Have cyberattacks accelerated in 2026?\n\n@jasminexli and I examined crypto hacks and ransomware data.\n\nWe find that recorded monthly crypto hacks have accelerated, though better detection may partly explain the trend. https://t.co/NgAYxaFOh5", "created_at": "2026-10-24T17:45:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 29, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVaYVjkaIAEy2bk.png"}], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114038191141581035", "url": "https://x.com/testingham/status/2114038191141581035", "text": "you keep asking Why , one after the other , climbing branch by branch up the hierarchy of ends towards the ultimate reasons, and you can sense you're getting near the top when it starts to sting each time you ask another one -- it feels shameful to ask why you would do these things -- asking why you would tell the truth, asking why you would love your mother; up in these heights there's also a noticeable fog of ambiguity: are these are means or are they ends? is freedom good because of its effects or in spite of them? is honesty the best policy or is honesty better than policy? These are questions without answers and it's time to climb back down.", "created_at": "2026-10-24T16:55:56+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114399223567561074", "url": "https://x.com/testingham/status/2114399223567561074", "text": "@peligrietzer (I would put virtue ethics halfway between the \"not fully worked out\" and \"explicitly irrationalist\" poles; and my guess is MacIntyre would endorse this)", "created_at": "2026-10-25T16:50:33+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114396928079511737", "url": "https://x.com/testingham/status/2114396928079511737", "text": "@peligrietzer My answers to your answers :)  https://t.co/7SeujGieU9", "created_at": "2026-10-25T16:41:25+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "peligrietzer", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "testingham", "text": "You can list to some 1965 lectures by Isaiah Berlin on \"the Roots of Romanticism\" as podcasts. Very good.\n\nIn a nutshell he's saying that in the late 18th century, after thousands of years, Western thought finally hit the ceiling of rational inquiry. The Romantic movement is just the sound of European intellectuals banging their heads against that ceiling.\n\nHe says that there came across Europe a general and explicit realization that the jigsaw has no solution; the mess cannot be untangled; the shards do not form a whole.\n\nThere is no rational reconstruction of religion, morality, aesthetics, justice, social order. There is no transcendent form which human things approximate. There is no higher truth about who is right or wrong. There is no deeper principle which can reconcile two conflicting imperatives.\n\nThe manifestation of this realization, Berlin says, is the Romantic mindset: a sudden drying up of the appetite for earnest inquiry. There is no buried treasure so put down your spade. A turn towards nature, art, irrationalism, authenticity, commitment to a cause (whatever the cause may be), primitive and ancient things, the sublime.\n\nThis also gives an interpretation of subsequent intellectual history. There were additional attempts to systematize and make sense of human ends (Utilitarianism, Marxism, Logical Positivism, Modernism, Welfare Economics, Rationalism), but they tend to be adopted only by the less clear-sighted, and attempts to make them intellectually rigorous fizzle out. The mainstream position has instead been either to avoid talking about fundamental ends at all or to adopt some kind of explicit irrationalism (Existentialism, Postmodernism, Pragmatism).\n\nIsaiah Berlin himself is famous as an advocate of muddling-through: he says somewhere else that all the problems of the 20th century came from taking abstract ideas too seriously."}, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114396737125400868", "url": "https://x.com/testingham/status/2114396737125400868", "text": "What are the alternative interpretations? (1) That there is some truth of the matter, the Romantics gave up too early, they needed to enquire just a little farther. (2) That the discoveries of the 18th century were not new: there has always and everywhere been a tacit acknowledgement that philosophical and religious systems are fables, that they are plaster facades built on the front of brick houses.\n\nThe other thing that jumps out: the story is all European. I'm not sure what he'd say about thought in the other half-dozen continents, people who've been trying to untie the same knot.", "created_at": "2026-10-25T16:40:40+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114396649607114957", "url": "https://x.com/testingham/status/2114396649607114957", "text": "You can list to some 1965 lectures by Isaiah Berlin on \"the Roots of Romanticism\" as podcasts. Very good.\n\nIn a nutshell he's saying that in the late 18th century, after thousands of years, Western thought finally hit the ceiling of rational inquiry. The Romantic movement is just the sound of European intellectuals banging their heads against that ceiling.\n\nHe says that there came across Europe a general and explicit realization that the jigsaw has no solution; the mess cannot be untangled; the shards do not form a whole.\n\nThere is no rational reconstruction of religion, morality, aesthetics, justice, social order. There is no transcendent form which human things approximate. There is no higher truth about who is right or wrong. There is no deeper principle which can reconcile two conflicting imperatives.\n\nThe manifestation of this realization, Berlin says, is the Romantic mindset: a sudden drying up of the appetite for earnest inquiry. There is no buried treasure so put down your spade. A turn towards nature, art, irrationalism, authenticity, commitment to a cause (whatever the cause may be), primitive and ancient things, the sublime.\n\nThis also gives an interpretation of subsequent intellectual history. There were additional attempts to systematize and make sense of human ends (Utilitarianism, Marxism, Logical Positivism, Modernism, Welfare Economics, Rationalism), but they tend to be adopted only by the less clear-sighted, and attempts to make them intellectually rigorous fizzle out. The mainstream position has instead been either to avoid talking about fundamental ends at all or to adopt some kind of explicit irrationalism (Existentialism, Postmodernism, Pragmatism).\n\nIsaiah Berlin himself is famous as an advocate of muddling-through: he says somewhere else that all the problems of the 20th century came from taking abstract ideas too seriously.", "created_at": "2026-10-25T16:40:19+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114472079848587562", "url": "https://x.com/testingham/status/2114472079848587562", "text": "https://t.co/FQXXZDOofV", "created_at": "2026-10-25T21:40:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114472042737381469", "url": "https://x.com/testingham/status/2114472042737381469", "text": "@sayhar here! https://t.co/FQXXZDOofV", "created_at": "2026-10-25T21:39:54+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "sayhar", "is_retweet": false, "rt_author": "", "r ted_at": "2026-10-19T18:51:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tylercowen", "rt_author_name": "tylercowen", "likes": 59, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112250367496868227", "url": "https://x.com/s8mb/status/2112250367496868227", "text": "@figolambo @salonium @meilaoban @schulzb589 @WorksInProgMag This is a fair point, but for the sake of brevity we decided to omit it. However we are hoping to run a piece on this specifically soon. Thanks for reading and for the feedback, it is much appreciated.", "created_at": "2026-10-19T18:31:45+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "figolambo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112531840569352475", "url": "https://x.com/s8mb/status/2112531840569352475", "text": "@wincolladd Yes!", "created_at": "2026-10-20T13:10:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "wincolladd", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112511329357492566", "url": "https://x.com/s8mb/status/2112511329357492566", "text": "@wincolladd \"levy on companies spun out of UK universities that move abroad\"", "created_at": "2026-10-20T11:48:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "wincolladd", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112495740585189467", "url": "https://x.com/s8mb/status/2112495740585189467", "text": "No word about an exit tax though. Exit tax this year, CGT rise next year seems fairly possible.\n\n https://t.co/bYZUydAd3r", "created_at": "2026-10-20T10:46:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112484137739100199", "url": "https://x.com/s8mb/status/2112484137739100199", "text": "So much of our electricity supply is now based on fixed price assets: wind, nuclear and solar electricity that have low running costs but high set-up costs, and the electricity grid itself.\n\nThis means that new demand can lower prices by spreading these costs out among more buyers, and data centres can lower electricity costs (and, empirically, are lowering them). I've even had conversations with eminent economists who find this counterintuitive, so it is not surprising that policymakers and the public may also feel sceptical.", "created_at": "2026-10-20T10:00:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 201, "retweets": 22, "media": [], "quoted": {"author": "Sam_Dumitriu", "text": "How building data centres could cut Britain's sky-high electricity bills by billions:\n\n- Failing electricity use has made electricity more expensive as a fixed costs of supplying power (grid, policy, balancing, etc.) are concentrated on a small share of demand.\n\n- New demand from data centres helps dilute those fixed costs. This could save £2bn a year (£69 per year) if the Government's compute target is hit.\n\n- Data centres are extremely profitable, even at high power prices. They care about speed, but the grid queue can create decade-long delays. Letting companies pay to jump the queue could raise billions.\n\n- Britain could replicate the success of spectrum auctions and sell-off faster grid connections. Accelerating 3GW by 3 years is potentially worth £12bn to data centre builders!\n\n- In the US, tech companies are making large investments in new generation (SMRs, gas, renewables) as states adopt 'bring your own power' policies. Doing the same here could accelerate clean power buildout and fund necessary gas plant renewals.\n\nhttps://t.co/MJhZHAlVM5"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112452231215694271", "url": "https://x.com/s8mb/status/2112452231215694271", "text": "@LeRef5 Don’t blame the judiciary, blame the successive governments that gave them these powers.", "created_at": "2026-10-20T07:53:54+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "LeRef5", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 126, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112428722200490132", "url": "https://x.com/s8mb/status/2112428722200490132", "text": "Link to the Telegraph story. https://t.co/wfiz7uKgKE", "created_at": "2026-10-20T06:20:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112427956538847449", "url": "https://x.com/s8mb/status/2112427956538847449", "text": "This is what I warned would happen a year ago. The Act’s defenders said this wouldn’t happen.", "created_at": "2026-10-20T06:17:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 349, "retweets": 17, "media": [], "quoted": {"author": "s8mb", "text": "The government's Renters' Rights Bill looks like it will be a catastrophe, inadvertently introducing rent controls and reducing the supply of housing even more. It is the clearest evidence that the whole British state that has brought it about is completely broken: \n\n• Written by the civil service\n• Introduced by the Tories\n• Passed by Labour and the Lib Dems\n• Cheered on by the mainstream media\n\nThe bill's core provision is to eliminate \"no-fault evictions\". Many understand this to mean evictions during a rental lease. In fact, this is already impossible. What the new bill does is to stop landlords from being able to regain their property after a lease has expired. \n\nThis means that renting a property to someone now means that they get to live in that property indefinitely. A landlord can only evict them if they are selling the property, or plan to move into it themselves, or if a tribunal gives them permission after ruling against the tenant for bad behaviour.\n\nWithin these indefinite contracts, rent increases will be capped at whatever the 'market rate' is determined to be by a tribunal. Tribunals will not be able to *raise* rents, as they currently can and often do – only lower them or keep them where they are. The only risk to a tenant is that their challenge is deemed \"vexatious\".\n\nNot only will rent increases *within* contracts be controlled by courts, rents for *new* contracts will also be controlled by them. Tenants will be entitled to agree a rent, move in, and then immediately take their landlord to a rent tribunal on the grounds that the rent they have just agreed to is \"too high\".\n\nRent tribunals will thus have the power to control all rents. All rents will be set under the threat of a tribunal intervening. There will be no \"market rate\", so the tribunal will have no independent \"market rate\" to refer to.\n\nA tenant who challenges a rent increase will have their rent frozen at the old, lower rate while their challenge is ongoing (which could take over a year). Like the Building Safety Regulator right now, tribunals are likely to be extremely backlogged, creating huge delays where tenants do not have to pay their new higher rents, if they ever do. Tenants will have huge incentives to challenge nearly all rent increases. \n\nWe have already seen how bad courts are at ruling on prices, eg in cases where Next's shop workers have been given the same pay as factory floor workers, and in Birmingham where the council was forced to pay £760m to care workers and teaching assistants because a court decided that these roles were equivalent to jobs like rubbish collectors.\n\nAll this amounts to rent controls. These are terrible for many reasons.\n\n1. They will cause landlords to sell up and leave the market. This is both to avoid the risk of being stuck with a bad tenant, and because once the rent has been kept artificially low by a rent tribunal, landlords will be losing money compared to just selling into private owner-occupation.\n\nRental properties allow for easy doubling up (housesharing) which is much messier under owner-occupation. The effective supply of housing is about to drop. In Ireland, postwar rent controls shrunk the rental market from 26% to 8% of the total housing stock in 40 years. In Britain, 1916–88, the share of properties available for rent went from 75% of the market to 10%.\n\n2. They cause landlords to neglect their properties. Landlords receiving artificially-depressed rents for their properties have no incentive to maintain them. Rent controlled properties, famously, become neglected and fall into decay, as leaks, cracked plaster and broken windows are left unaddressed. The country's housing stock that remains in renting will decay. Our cities will become more decrepit.\n\n3. They stop people from moving around for better jobs. We already have this effect with social housing, where huge amounts of inner London housing (30–40%!) are held by tenants in low wage jobs, or who have no job at all, instead of by people who could move to London to earn and produce more. This will happen to large swathes of the rental market too, stopping people from moving into prosperous cities where they could get better jobs.\n\n4. They stop the supply of new homes for rent. Under rent controls, there is no incentive to build new homes for renting. Britain built essentially no private flats for rent between 1945 and the end of rent controls in 1988. The same was true in France between WWI when it introduced rent controls and the slow end of rent controls in the postwar era.\n\n5. They push renters into the black market. To actually get a place to live, a lot of people will sidestep these new rules and rent informally, with none of the protections we currently have for renters like the deposit protection scheme. This is the sort of scenario that allows landlords to *really* exploit and steal from their tenants.\n\n–\n\nDo not assume that anyone involved with this knows what they're doing. We have already seen, in the case of the Building Safety Regulator and the second staircase regulations (brought in by the same Housing Secretary who designed this bill), how disastrous the consequences of well-intended but misconceived interventions in the housing market can be.\n\nLondon building has already ground to a halt. And things are about to get even worse."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112427765932654719", "url": "https://x.com/s8mb/status/2112427765932654719", "text": "We have nationwide rent controls now. \n\nThis tribunal didn’t just stop a rent rise within a tenancy, it cut the rent to below what had been agreed between the landlord and the tenant at the start of the tenancy based on a judgement of what the property is worth. https://t.co/BhrgmnIIA3", "created_at": "2026-10-20T06:16:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1481, "retweets": 200, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVDZ2xJWoAApsGX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVDZ2xOW8AAdRSJ.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112281884432744642", "url": "https://x.com/s8mb/status/2112281884432744642", "text": "We’re delighted to announce that the one and only @tylercowen, our internet writing sensei, is joining Works in Progress as a regular contributor. \n\nhttps://t.co/NuvOFqfPin\n\nHis first column is about Brazilian food, and like everything Tyler writes, it’s packed with hidden gems that make it much more than a food story.\n\nSome of the nicest tidbits: on her first trip to Brazil, his daughter declared she had “never had a banana before” –  this is how good Brazilian bananas are, apparently. \nAnd Tyler and a well-traveled friend from Modena (of all places) agreed that Brazil is the third-best country in the world for Italian food, behind only Italy and Japan. If an Italian says that, we’d better trust him!\n\nBut as always with Tyler, he manages to draw larger lessons from apparently mundane and object-level stories. So, in a short read, we learn much more than just the fact that Brazilian food is really good.\n\nFirst, food can be seen as a progress story. Brazil’s agricultural yields rival, and sometimes beat, those of the US, even though Brazil is a much poorer country. Abundant fertile land, high productivity, and short supply chains make ingredients plentiful and fresh. Tyler’s regret is that the rest of Brazil’s economy hasn’t embraced technology the way its food sector has.\n\nWe also learn how immigration shapes Brazilian cuisine. Brazil has roughly 2 million citizens of Japanese descent, which makes it arguably the best place outside Japan for Japanese food. Tyler had a 15-course omakase at a Michelin-starred São Paulo restaurant for $110, booked just half an hour ahead. Brazil is also home to about 30 million people of Italian descent, the largest Italian diaspora in the world, which goes a long way to explain why his Italian friend was so satisfied with the food.\n\nThe whole column is a delight, so do read it in full!", "created_at": "2026-10-19T20:37:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 470, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112614265890971783", "url": "https://x.com/s8mb/status/2112614265890971783", "text": "\"the Tribunal determined the open market rent was\"\n\n...", "created_at": "2026-10-20T18:37:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 43, "retweets": 0, "media": [], "quoted": {"author": "mtpennycook", "text": "This Labour government’s transformative Renters’ Rights Act empowers private renters to challenge unreasonable rent increases.\n\nIf a tenant believes a proposed rent increase is above the open-market rent, they can refer the matter to the First-tier Tribunal.\n\nIn a recent case in Manchester where the Landlord proposed an increase in rent from £1,650 per calendar month to £1,700, the Tribunal determined the open market rent was actually £1,450 per calendar month.\n\nWe’re standing up for renters and our reforms are working.\nhttps://t.co/wX1g3r33mV"}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112572736723657066", "url": "https://x.com/s8mb/status/2112572736723657066", "text": "I always thought that the ancient Romans were tolerant about sexuality, until the rise of puritanical Christianity. Reading Kyle Harper, I learnt that this picture is not exactly false, but it is extraordinarily misleading:\n\nhttps://t.co/PJO8UTGgiK\n\n- Sexual penetration of a free Roman man was severely punished, possibly by death. Consenting to penetration was also seriously punished. Lesbianism was not criminalised, but was regarded with contempt.\n\n- The one great subject of permissiveness was the penetration of enslaved people. Although relatively few people owned slaves, many prostitutes were enslaved and prostitution was ubiquitous, so coerced sex was widespread.\n\n- In some parts of the empire, many married women probably seem to have worn face veils in public.\n\n- There was not even theoretically a norm of male fidelity: although wives were required to be faithful to their husbands, the inverse was not even aspirationally true. \n\n- Early Christianity wrought a kind of revolution on ancient morality. All forms of sexuality apart from procreative sex within monogamous marriage were relentlessly and violently condemned, and even marital sex was allowed only rather grudgingly. In effect, the Christians extended to men the restrictions that had previously applied only to women.\n\n- To a limited extent, they also extended the protections previously enjoyed by free men to other groups of people. Although the early Christian record on slavery is mostly very poor, they did introduce the first laws against the forcible prostitution of slaves. Transgressors were to be arrested and sent to the public mines, ‘which is’, the law ran, ‘less of a punishment than that of a woman who is seized by a pimp and compelled to endure the filth of an intercourse that she did not will’.\n\nIt is not clear how much behaviour actually changed in practice – the Christians were never able to get people to behave exactly as they wanted. But the change in official norms was revolutionary, and not quite the revolution I expected.", "created_at": "2026-10-20T15:52:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "likes": 126, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112572725881340051", "url": "https://x.com/s8mb/status/2112572725881340051", "text": "@SCP_Hughes This is a fascinating theory about the origins of monogamy. https://t.co/y1aZZUwIaR", "created_at": "2026-10-20T15:52:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFdmBRWEAAHtYU.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112922271249817769", "url": "https://x.com/s8mb/status/2112922271249817769", "text": "@arthur_spirling @RFlutt90854 ChatGPT Astra Max says \"If the employer knows, or has reasonable cause to suspect, that the wages will or may be used for terrorism, paying them can itself be a criminal offence. The fact that they are wages owed for work does not create an exemption\"!", "created_at": "2026-10-21T15:01:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthur_spirling", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112919646357655590", "url": "https://x.com/s8mb/status/2112919646357655590", "text": "@1he0pposite I'm not sure about that – personally, I love most cities' central business districts and skyscrapers in general, and Samuel's piece about his visit to NYC is very positive. His piece on \"easy\" architecture has a bunch of examples of modernism he praises.\n\nhttps://t.co/DnfvQp0V8M\n\nhttps://t.co/MlNi2FDTWt", "created_at": "2026-10-21T14:51:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "1he0pposite", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112908236181680581", "url": "https://x.com/s8mb/status/2112908236181680581", "text": "@CharlesFLehman Surely craft beer is distinguished by its flavours, though? All these labels emphasise their flavours, and you very high strength lagers have existed for a long time.", "created_at": "2026-10-21T14:05:54+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "CharlesFLehman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112906042942357938", "url": "https://x.com/s8mb/status/2112906042942357938", "text": "@GrumpyArt We love differences of opinion and intelligent criticism! Our letters page is a trove of civil disagreement 😄", "created_at": "2026-10-21T13:57:11+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GrumpyArt", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112905328857936144", "url": "https://x.com/s8mb/status/2112905328857936144", "text": "Beers of this strength are almost invariably revolting – they usually taste bad and make drinking a much higher stakes business than it ought to be. 4%, the moderate's choice, is just very hard to beat.", "created_at": "2026-10-21T13:54:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 1, "media": [], "quoted": {"author": "GoodGuyGuaranty", "text": "The ‘craft beer for alcoholics’ trend is now totally out of control. Basically every tall boy from a ‘craft brewer’ is approaching 10% ABV. Even Bell’s - once a connoisseur’s quaff - is getting in on it. When folks drinks less, I guess you gotta focus harder on your tier-1s https://t.co/zqaZ3cNKqL"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112904099674866138", "url": "https://x.com/s8mb/status/2112904099674866138", "text": "@JaneParkway I agree with that. And good buildings with good urban form and no cars looks even better. https://t.co/WmfkzUWKfx", "created_at": "2026-10-21T13:49:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JaneParkway", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKLD76XEAA5ni3.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112888984623853842", "url": "https://x.com/s8mb/status/2112888984623853842", "text": "@JaneParkway I'm against design review. Tokyo is evidence that aesthetics is determined by the urban form as well as by the quality of individual buildings. Tokyo is not perfect though, I wouldn't argue that it being a great city means that it doesn't matter if your power cables look like this.", "created_at": "2026-10-21T12:49:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JaneParkway", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJ9SHtXkAApj1b.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112886373426323793", "url": "https://x.com/s8mb/status/2112886373426323793", "text": "PS: It's kind of funny that this is Jonathan's header picture, from what looks like a very interesting event YIMBY Melbourne held on the *barriers* to beautiful building. I think if aesthetics really were as marginal as Jonathan says here, he wouldn't have organised this event and wouldn't have had a packed out lecture theatre attending it!\n\nhttps://t.co/VAdX8SvyWl", "created_at": "2026-10-21T12:39:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJ6o_UXEAEQbAk.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112885472892420110", "url": "https://x.com/s8mb/status/2112885472892420110", "text": "I'm grateful to Jonathan for writing this and very pleased to publish it in Works in Progress – he does great work, and I like him and respect his views immensely. I have two thoughts in response.\n\nOne is that I am not hugely compelled by people telling others what they should focus on. As long as you're not doing active harm to the world, it's fine to work on a less high-priority area than you could. Comparative advantage is not always easy to judge from outside and part of living a satisfying life is doing what you find most intrinsically interesting and rewarding. \n\nAnd entrepreneurship is *inherently* about working on things that other people underrate! There wouldn't be any opportunities for discovery if it was clear exactly what everyone should focus their time on.\n\n(I don't have much time for people who complain that a handful of EAs are worried about shrimp welfare either, unless they are actually hurting the shrimp.)\n\nTwo: even if you concede Jonathan's argument that encouraging nice buildings and places does not instrumentally advance the cause of YIMBYism – we can agree to disagree – I think that it is a mistake to dismiss aesthetics as being trivial.\n\nPeople want beauty and pleasure in their lives, not just boxes to sleep and work in. Cities should be amazing places to be, and the way they look and feel is a big part of that. The greatest cities I have been to are Paris, London, Tokyo, and New York, all of which are breathtakingly beautiful cities in their own way, even though some of them create that beautiful whole from various ugly parts arranged well. I think this is often true of parts of London, where individually ugly buildings nonetheless combine to make a beautiful skyline or street. The best places, like inner Paris and lower Manhattan, combine beautiful streetscapes with individually-beautiful buildings.\n\nIf you think too much about \"units of housing\" and not enough about which places people most want to live in and visit, you will miss a lot of what actually matters to people about the places they live and visit. It is a constant error to think that the \"function\" of buildings and cities does not include \"being pleasant and looking nice\".\n\nThis is all obviously subjective, but so are lots of other important things that still benefit from some form of collective decision making – pollution, noise, public order, the provision of public goods. The interesting meta-question to me is what institutions allow for the best ways to make these decisions and resolve conflicts between people.", "created_at": "2026-10-21T12:35:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 4, "media": [], "quoted": {"author": "jonobri", "text": "I'm in @WorksInProgMag's letters section this week, arguing that British YIMBYism's preoccupation with beauty is a massive waste of time and resources.\n\nBeauty is marginal. There are bigger problems to solve in British housing—they're just all a bit less sexy. https://t.co/cmUgaRyVfJ"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112852222203572348", "url": "https://x.com/s8mb/status/2112852222203572348", "text": "I initially had the same reaction as these writers – the idea of a book being banned because the author has expressed support for a terrorist group is outrageous, as is the punishment of people for saying they support Palestine Action (or any other terrorist group). \n\nWhat I didn't realise was that Rooney has promised to donate her royalties to Palestine Action. It seems a lot less clear that you should be allowed to conduct business activity with the express purpose of raising money for a terrorist group. The books should be allowed to be sold, but the royalties should be withheld. I would not allow people to fundraise for violent Neo-Nazi or Islamist groups either.\n\nYou could argue that Palestine Action should not be proscribed, but that is not the argument being made in this letter.", "created_at": "2026-10-21T10:23:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 255, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJayb_WkAANPZH.jpg"}], "quoted": {"author": "Sam_Dumitriu", "text": "The specific case of Sally Rooney isn't an act of censorship.\n\nI am a free speech absolutist. If she wanted to write book called \"Why I support Al Qaeda, ISIS, and the IRA\" then I'd support her right to do so. Britain should have a First Amendment approach to speech.\n\nHowever, if she wants to give the proceeds of that book to those organisations, then it is right for her publisher to prevent her (and it would probably be criminally liable too.)\n\nThe open letter is cowardly. They should have the courage to state clearly their view: it should be legal to directly fund organisations that unapologetically break into military base. \n\nBTW, I note that none of the signatories of this letter signed the Harper's letter in favour of free speech. Some however attacked it."}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112845406581522600", "url": "https://x.com/s8mb/status/2112845406581522600", "text": "The Romans were a lot less sexually permissive than I used to think. Free men were permitted to rape slaves, including children, but extramarital sex between free men was punished, as was female infidelity. \n\nhttps://t.co/v5m5bQAqOu", "created_at": "2026-10-21T09:56:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112801768581328954", "url": "https://x.com/s8mb/status/2112801768581328954", "text": "“The Simpsons” was a beloved animated sitcom that ran for ten legendary seasons and concluded in 1999. The show was celebrated for what was widely perceived as a near perfect run that wrapped before it wore out its concept and overstayed its welcome.\n\nCreator Matt Groening and showrunner James L. Brooks famously decided to bring the show to a conclusion after experiencing the negative audience reaction to the season 9 episode “The Principal and the Pauper,” in which it was revealed that the school’s principal was actually an impostor who had stolen the real Seymour Skinner’s identity.  Brooks did not want to sully the show’s legacy by doing a bunch of weird episodes as the franchise slid into mediocrity and cultural irrelevance, so the writers and cast decided instead to go out on top and end things on a high note.\n\nHowever, because of its centrality in 90s pop culture, a long-running Internet joke is to pretend “The Simpsons” is still on the air, a premise that gets more absurd and deranged with each passing year. If this show were still producing new episodes, it would be in its 38th season now, and most of the voice cast would be in their 80s.\n\nThe joke is to imagine how distorted this charming show would have become if it had been stretched out to more than 800 episodes. Comedy posters on “weird Twitter” used to try to top each other by making up terrible ideas for what modern episodes of the show might be like.\n\nFor example, a viral 2012 tweet imagined an episode where Lady Gaga helps Lisa Simpson with her self esteem. In 2019, popular shitposter Megan Amram originated the premise of Bart Simpson becoming a men’s rights activist to protest a gender-swapped reboot of “Itchy and Scratchy.”\n\nBut perhaps the most elaborate Internet “Simpsons” joke was a 2017 YouTube mockumentary “The Problem With Apu,” in which the comedian Hari Kondabolu ironically pretended to be offended by the charming and innocuous convenience store owner character Apu. \n\nEveryone thought this was hilarious, especially since the show had been off the air for nearly two decades when the mockumentary was released. So, Twitter ran with the joke by pretending to “cancel” Apu, and the viral gag memorably resulted in the character’s voice actor, Hank Azaria, recognizing the meme by promising never to perform the character again, which everybody thought was really funny since Azaria had been retired for years.\n\nNow, nearly a decade later, fans are pretending that the show — which has now been off the air longer than most people tweeting about it have been alive— has brought back the “cancelled” character with a new racially-appropriate voice actor. \n\nI actually don’t think this is that funny, and I kind of think the gag of pretending “The Simpsons” is still airing new episodes has overstayed its welcome, a mistake the actual show “The Simpsons” would never have made.\n\nIf you haven’t seen this 1990s classic, which — and I cannot emphasize this enough — ended after 10 seasons in 1999, you can watch all the episodes on Disney+ (except the one with Michael Jackson that got pulled from streaming).", "created_at": "2026-10-21T07:02:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DanFriedman81", "rt_author_name": "Daniel Friedman", "likes": 13205, "retweets": 1370, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112786298209440135", "url": "https://x.com/s8mb/status/2112786298209440135", "text": "I am now a single-issue voter. https://t.co/RKcMAmBTEB", "created_at": "2026-10-21T06:01:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jenniferdoleac", "rt_author_name": "Jennifer Doleac", "likes": 1151, "retweets": 74, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGnSrsW4AAMX9K.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVGnSsBXIAE62iL.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112782669930991774", "url": "https://x.com/s8mb/status/2112782669930991774", "text": "@jonobri @bechhof @WorksInProgMag Thanks for writing!", "created_at": "2026-10-21T05:46:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "jonobri", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112660163459260616", "url": "https://x.com/s8mb/status/2112660163459260616", "text": "@K_Niemietz What a loss. Good luck with what’s next.", "created_at": "2026-10-20T21:40:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "K_Niemietz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 65, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112638760332492805", "url": "https://x.com/s8mb/status/2112638760332492805", "text": "@Sherman1890 Ideally through a better price system. Electricity prices generally don't price these things very clearly or efficiently right now. Eg, real time priced tariffs are rare and unit prices often contain a lot of the fixed costs.", "created_at": "2026-10-20T20:15:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Sherman1890", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112638315484840134", "url": "https://x.com/s8mb/status/2112638315484840134", "text": "@timleunig And ice storage air conditioning, which is at least theoretically possible – not sure how much, if at all, it is used in practice right now, but real time electricity pricing would of course hugely incentivise it.", "created_at": "2026-10-20T20:13:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "timleunig", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112637810280694178", "url": "https://x.com/s8mb/status/2112637810280694178", "text": "@MOates_ I don't think any data centre will get built without the certainty of 24/7 electricity, the chips are too valuable to not run all the time. Some are built with battery storage though, and this piece suggests that many would be willing to disconnect from the grid at periods of extremely high demand.\n\nhttps://t.co/Cim7bgf4rv", "created_at": "2026-10-20T20:11:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "MOates_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112986583314153607", "url": "https://x.com/s8mb/status/2112986583314153607", "text": "@themetresgained @pleasedontatme Yes, I agree. Some Australian YIMBYism seems to verge on class war, whereas I have quite a lot of sympathy for the hated NIMBY kulaks.", "created_at": "2026-10-21T19:17:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "themetresgained", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112986258746335291", "url": "https://x.com/s8mb/status/2112986258746335291", "text": "How can someone make a 921% return in 13 years while the market overall has delivered 117%? This book is an amazing insight into the mind and decisions of someone who did it. https://t.co/mQqTkRjGbe", "created_at": "2026-10-21T19:15:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVLVandWMAAGUZO.png"}], "quoted": {"author": "tamarawinter", "text": "And now you can preorder the NOMAD LETTERS (out December 1!): https://t.co/EN1kL7bGcz\n\nFor years these letters have circulated (at first, unofficially) among investors, acquiring a devoted readership. We wanted to give them a permanent home in print. \n\nNick and his partner Qais Zakaria’s record is extraordinary. The letters are the account of how they got there, featuring everything from studying Amazon and Costco (Nomad’s defining investments)—to visiting cement plants in Zimbabwe, and beyond. \n\nThey’re candid about their mistakes and curious about the forces that shape investors’ behavior: incentives, psychology, and the wisdom (or foolishness!) of the crowd. \n\nSince closing the fund, they’ve devoted their time to philanthropy, a journey Nick recounts in the lovely foreword he wrote for this edition. \n\nI’m thrilled to continue adding to the investing corner of our catalogue, and I can’t think of a better work to follow Poor Charlie’s Almanack. ❣️"}, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112954623799554083", "url": "https://x.com/s8mb/status/2112954623799554083", "text": "@etnshow @Birdyword @WorksInProgMag @TheEconomist 🍾", "created_at": "2026-10-21T17:10:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "etnshow", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112942326767346074", "url": "https://x.com/s8mb/status/2112942326767346074", "text": "@tamarawinter This book is going to be a phenomenon. Incredibly excited.", "created_at": "2026-10-21T16:21:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tamarawinter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112939451722707184", "url": "https://x.com/s8mb/status/2112939451722707184", "text": "Mike joining Works in Progress is a huge moment for us and marks the start of the next phase in our project.\n\nHe is one of the most insightful, interesting and enjoyable to read writers anywhere, and his book, The Land Trap, is fantastic and one of the most \"Works in Progress\" non-fiction books written in years. He is the perfect person to help us produce model-based analysis of business, economics and finance, and great original reporting on everything from robotics and drones to the state of America's cities. \n\nMost of all I am excited about working with (another!) one of my best friends. I first met Mike when he was a student and declared afterwards that he was so impressive that I would buy stock in him if I could. It's taken 14 years, but this is one step better. Works in Progress has become harder work as it has grown, but it's amazingly fun and rewarding as well, not least because I get to do it with some of my favourite people in the world.\n\nAs Mike says, we've seen incredible growth in our first year in print and we have extremely high hopes for 2027. Above all we have to make everything we do as excellent as it possibly can be. We're looking for journalists and other writers who are doing truly excellent work to join our team, so if that's you, watch this space.", "created_at": "2026-10-21T16:09:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 206, "retweets": 10, "media": [], "quoted": {"author": "Birdyword", "text": "Some big personal news: I'm moving to join Works in Progress as executive editor, starting next month. I have been hoping for an opportunity to work with @bswud and @s8mb for more than a decade, and I'm incredibly excited to finally have one. \n\nWIP is expanding on every front right now. We'll soon begin coverage of business and finance, as well as putting out more reported features. To that end, we'll be hiring more writers and reporters in the year to come. I'm planning to remain based in the US to help build out our presence here. \n\nThe print edition of WIP has existed for less than 12 months, but sometime in the next week or so we will reach our 10,000th paying print subscriber. It's a group that now includes people who've been at the highest echelons of government and who run the world's biggest public companies. We’re already on track to 3x that number next year. We'll be in store at Barnes & Noble, Hudson News and independent newsagents next week too.\n\nI think WIP is providing something that people are craving from physical media right now: fewer, extremely well-crafted pieces in a beautifully designed form. Issues now feature an amazing group of columnists, including Tyler Cowen, Dan Wang and Stephen Kotkin. Each edition is better than the last. \n\nYou'll see us in more and more places next year too. In January, our new weekly documentary films will launch on YouTube. We're expanding into the events space, with a new series in North America. The sky is the limit from here on out."}, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113248568202936811", "url": "https://x.com/s8mb/status/2113248568202936811", "text": "@dangroshev @AndyFormUK @simonhcbenson It's partially about occupancy rates, but also about the transaction costs of moving and *who* is able to live in a given property. It's much cheaper to move between rental properties than to move between owner-occupied properties, not least because of stamp duty, and the person who lives in property that's being rented may have a different profile to who will live in it when it's owned (eg, younger, less money in savings, etc). All of this means that the shift between the two tenure types isn't neutral.", "created_at": "2026-10-22T12:38:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "dangroshev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113233662875455692", "url": "https://x.com/s8mb/status/2113233662875455692", "text": "@dangroshev @AndyFormUK @simonhcbenson Think about whether a world that had zero rental properties would be identical in outcomes to one that had some mix of rental vs owner-occupation. I think once you think about why they wouldn't be the same you will see why arbitrary shifts at the margin are likely bad too.", "created_at": "2026-10-22T11:39:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "dangroshev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113233244330332462", "url": "https://x.com/s8mb/status/2113233244330332462", "text": "@RinainDC @WorksInProgMag Thanks for reading!", "created_at": "2026-10-22T11:37:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "RinainDC", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113214186855825486", "url": "https://x.com/s8mb/status/21132
