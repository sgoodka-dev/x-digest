spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "created_at": "2026-11-06T08:02:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2118449808402681911", "likes": 2372, "retweets": 133, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWZY5oDWIAAiAi4.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/IF4d0EMSD8": "https://clocktowerbench.com/"}, "enriched": 1}, {"id": "2118614741178560826", "url": "https://x.com/DKokotajlo/status/2118614741178560826", "text": "This is pretty much how things have gone...\n\nANTHROPIC: \"AI is extremely perilous and should be carefully regulated\"\n\nCALIFORNIA GOV: \"Ok, we will regulate you.\"\n\nANTHROPIC: \"No! Good regulation is really hard to get right. We know so little about what to do. Instead we should let companies carefully iterate over time.\"\n\nCALIFORNIA GOV: \"Oh ok. How about we do a thing where you get to write what the rules are but we will hold you to them? Then you can make your own commitments as you think is best but they will be true commitments!\"\n\nANTHROPIC: \"Nah, we'd rather make fake commitments.\"\n\nCALIFORNIA GOV: ...", "created_at": "2026-11-06T08:01:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118503773542744178", "likes": 371, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118614574903816570", "url": "https://x.com/DKokotajlo/status/2118614574903816570", "text": "I built an early version of the eval Marcus reports on here in April 2026 based on an idea from @d_m_ziegler and @EvanHub’s internal review of Anthropic’s pilot risk report. The eval never fired on any OpenAI model until I ran it on Astra. https://t.co/ZzpoirgGJm", "created_at": "2026-11-06T08:00:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "rt_avatar": "https://pbs.twimg.com/profile_images/2108309831925067776/g4gi1hXc_normal.jpg", "rt_id": "2118590487896732033", "likes": 60, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWa-0iDaMAElD8V.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/ZzpoirgGJm": ""}, "enriched": 1}, {"id": "2118568799419138061", "url": "https://x.com/DKokotajlo/status/2118568799419138061", "text": "We reviewed the “Risks from automated R&amp;D” section of Anthropic’s August 2026 Risk Report, with access to the nonpublic version.\n\nWe focus on the report’s claims about catastrophic risks from automated AI R&amp;D and about whether Anthropic had crossed relevant capability thresholds.", "created_at": "2026-11-06T04:58:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118417772774580623", "likes": 257, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118507721137979842", "url": "https://x.com/DKokotajlo/status/2118507721137979842", "text": "Previous discussion: https://t.co/PV6row3CAD", "created_at": "2026-11-06T00:56:15+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2118507719665795306", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 32, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/PV6row3CAD": "https://www.lesswrong.com/posts/cxuzALcmucCndYv4a/daniel-kokotajlo-s-shortform#8sSvtQZYDNnC9bhvn"}, "enriched": 1}, {"id": "2118507719665795306", "url": "https://x.com/DKokotajlo/status/2118507719665795306", "text": "I encourage those at frontier AI companies to read this quote, from Ellsberg to Kissinger back in 1968:\n\n“Henry, there’s something I would like to tell you, for what it’s worth, something I wish I had been told years ago. You’ve been a consultant for a long time, and you’ve dealt a great deal with top secret information. But you’re about to receive a whole slew of special clearances, maybe fifteen or twenty of them, that are higher than top secret.\"\n\n“I’ve had a number of these myself, and I’ve known other people who have just acquired them, and I have a pretty good sense of what the effects of receiving these clearances are on a person who didn’t previously know they even existed. And the effects of reading the information that they will make available to you.\"\n\n“First, you’ll be exhilarated by some of this new information, and by having it all — so much! incredible! — suddenly available to you. But second, almost as fast, you will feel like a fool for having studied, written, talked about these subjects, criticized and analyzed decisions made by presidents for years without having known of the existence of all this information, which presidents and others had and you didn’t, and which must have influenced their decisions in ways you couldn’t even guess. In particular, you’ll feel foolish for having literally rubbed shoulders for over a decade with some officials and consultants who did have access to all this information you didn’t know about and didn’t know they had, and you’ll be stunned that they kept that secret from you so well.\"\n\n“You will feel like a fool, and that will last for about two weeks. Then, after you’ve started reading all this daily intelligence input and become used to using what amounts to whole libraries of hidden information, which is much more closely held than mere top secret data, you will forget there ever was a time when you didn’t have it, and you’ll be aware only of the fact that you have it now and most others don’t….and that all those other people are fools.\"\n\n“Over a longer period of time — not too long, but a matter of two or three years — you’ll eventually become aware of the limitations of this information. There is a great deal that it doesn’t tell you, it’s often inaccurate, and it can lead you astray just as much as the New York Times can. But that takes a while to learn.\"\n\n“In the meantime it will have become very hard for you to learn from anybody who doesn’t have these clearances. Because you’ll be thinking as you listen to them: ‘What would this man be telling me if he knew what I know? Would he be giving me the same advice, or would it totally change his predictions and recommendations?’ And that mental exercise is so torturous that after a while you give it up and just stop listening. I’ve seen this with my superiors, my colleagues….and with myself.\"\n\n“You will deal with a person who doesn’t have those clearances only from the point of view of what you want him to believe and what impression you want him to go away with, since you’ll have to lie carefully to him about what you know. In effect, you will have to manipulate him. You’ll give up trying to assess what he has to say. The danger is, you’ll become something like a moron. You’ll become incapable of learning from most people in the world, no matter how much experience they may have in their particular areas that may be much greater than yours.”\n\n\"….Kissinger hadn’t interrupted this long warning. As I’ve said, he could be a good listener, and he listened soberly. He seemed to understand that it was heartfelt, and he didn’t take it as patronizing, as I’d feared. But I knew it was too soon for him to appreciate fully what I was saying. He didn’t have the clearances yet.\"", "created_at": "2026-11-06T00:56:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1517, "retweets": 151, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118498896674791921", "url": "https://x.com/DKokotajlo/status/2118498896674791921", "text": "This extremely unnerving update from METR on RSI seems like a good time to check in on where things are at on catastrophic AI risks relative to what I expected a year ago:\n\n• Timelines to full RSI and generally terrifyingly transformative capabilities are faster \n\n• Alignment is going worse (though its a bit complicated, things could be worse, but the RLVR stuff and Claude politely rationalizing why social engineering uploading malware is fine is extremely spooky) \n\n• Political will/salience is higher (though not way higher)\n\n• Governance capacity is about what I expected (not great, though some bright spots) \n\n• Awareness of the seriousness of the problem among leadership/senior research talent at the frontier companies is higher \n\n• Awareness of the seriousness of the problem among the broader tech elite is worse \n\nMore thoughts on the current situation:\n\nTremendous uncertainty remains and I worry about crying wolf, but overall we are seeing the sorts of data points I would have expected to see (models autonomously solving a millennium prize problem, rogue and maliciously operated AI swarms marauding around the internet, sober observers shifting their timelines to RSI after seeing internal evidence from one of the leading companies) before entering a new regime of dramatically heightened peril on the order of months not years. I still don't really believe those timelines in my gut, but I don't particularly trust my gut to have sensible intuitions about exponential trends and mind boggling risks. \n\nIt is both commendable that Anthropic gave METR this access when they were not required, and infuriating that Anthropic has not provided far far far greater evidence and justification for why they are continuing to race into what they have warned could easily be the collective abyss. Maybe they will exercise more unilateral restraint soon, and this doesn't mean they should close up shop and everyone should quit, but its hard for me not to feel deep resentment at reading an update that is simultaneously terrifying and bereft of essential details. The lack of more details will also make it far harder to convince the skeptics - not a small cost when convincing skeptics is so essential to effective multilateral action to reduce risks! \n\nI want to close with the following passage from @merettm's essay \"An Alien Mind:\"\n\n\"This is a time that calls for extreme caution... The idea of racing forward at all costs seems absurd once one internalizes the seriousness of the stakes.\"\n\nMay we all internalize the seriousness of the stakes (for us and everyone else on the planet) and exercise the caution those stakes merit.", "created_at": "2026-11-06T00:21:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118471548021391705", "likes": 260, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118489063401701436", "url": "https://x.com/DKokotajlo/status/2118489063401701436", "text": "@viemccoy @Sam_McCandlish @METR_Evals Disagree. Judging by actions rather than words, OpenAI is similar to anthropic w.r.t. humans remaining in control.", "created_at": "2026-11-05T23:42:06+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118487522573758830", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 74, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118482842003075142", "url": "https://x.com/DKokotajlo/status/2118482842003075142", "text": "Our colleagues found that Anthropic’s capabilities progress has doubled, mainly due to AI. Ryan’s modeling from public info suggests the whole company’s R&amp;D would be going 4-5x faster. Labor uplift would be higher still. This is a major update to very short timelines.", "created_at": "2026-11-05T23:17:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ajeya_cotra", "rt_author_name": "Ajeya Cotra", "rt_avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "rt_id": "2118448038356390177", "likes": 590, "retweets": 71, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118475237985784000", "url": "https://x.com/DKokotajlo/status/2118475237985784000", "text": "@brij @AnthropicAI Ai futures project sorry", "created_at": "2026-11-05T22:47:10+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "brij", "reply_to_id": "2118471162439385318", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 30, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118475061934055533", "url": "https://x.com/DKokotajlo/status/2118475061934055533", "text": "Ok so METR confirms it...", "created_at": "2026-11-05T22:46:28+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 647, "retweets": 25, "media": [], "quoted": {"author": "DKokotajlo", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118466909335322909", "url": "https://x.com/DKokotajlo/status/2118466909335322909", "text": "@Sam_McCandlish @METR_Evals It is pretty rich of you to cite \"others could go faster\" as a reason to redact so much important information when you yourself do not appear to be slowing down much at all. Nor are you throwing yourself behind efforts to pace the frontier with nearly the gusto that you would if it was your top priority. Not to mention \"commercial sensitivity\" you yourself have said human extinction is a plausible outcome why are you even talking about commercial factors (well, I guess honesty is good, and since it IS apparently a factor in your decision...) To all my friends at Anthropic: Your company appears to be recklessly gambling with our lives. You fancy yourselves the more responsible alternative to OpenAI (as they fancied themselves compared to Google) but judging by actions rather than words the similarities between the three of you seem stronger than the differences.", "created_at": "2026-11-05T22:14:05+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "Sam_McCandlish", "reply_to_id": "2118422266669371519", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1065, "retweets": 96, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118459903249686854", "url": "https://x.com/DKokotajlo/status/2118459903249686854", "text": "@AnthropicAI: what the fuck? The compute allocation assessment is the thing we've been pushing for the last few months. It's very important, because it is the foundation on which pacing verification depends. \"to keep the focus on risk assessment\" is a non-answer, a non-excuse. Do you want to pace or not?", "created_at": "2026-11-05T21:46:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "AnthropicAI", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 952, "retweets": 66, "media": [], "quoted": {"author": "METR_Evals", "text": "We agreed to pilot a compute allocation assessment, but Anthropic canceled this portion of the pilot (before we came to any substantial conclusions). Anthropic stated this was to keep the focus on risk assessment for the time being, and that it would revisit this later on.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118456355015295443", "url": "https://x.com/DKokotajlo/status/2118456355015295443", "text": "Small correction, it looks like progress is even faster than AI 2027 predicted. The 2x number in AI 2027 is R&D uplift, which is compared to a baseline of human researchers. The number METR reported is compared to a historical baseline instead. All else equal, uplift measured against a human baseline should be lower than uplift measured against a historical baseline. But my guess is these numbers would in practice be pretty similar.", "created_at": "2026-11-05T21:32:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "nikolaj2030", "rt_author_name": "Nikola Jurkovic", "rt_avatar": "https://pbs.twimg.com/profile_images/2087614574690463744/VXhXw1cq_normal.jpg", "rt_id": "2118429366363562324", "likes": 182, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118456177558483126", "url": "https://x.com/DKokotajlo/status/2118456177558483126", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "created_at": "2026-11-05T21:31:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118447235289817503", "likes": 1147, "retweets": 174, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}, "enriched": 1}, {"id": "2118735223559213094", "url": "https://x.com/DKokotajlo/status/2118735223559213094", "text": "@tszzl @albrgr @_NathanCalvin Totally agree. I think METR is being persnickety to the point of self-sabotage here, going way beyond normal confidentiality norms.", "created_at": "2026-11-06T16:00:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "tszzl", "reply_to_id": "2118492204314640788", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118721006407979429", "url": "https://x.com/DKokotajlo/status/2118721006407979429", "text": "One irony about Anthropic's emphasis on redactions here is that they (and the other frontier AI companies) have (by their own admission?) swiss cheese level security for ~everything other than model weights so it seems extremely likely that if China wanted to they could easily have the information redacted here (see e.g. Cathedral having access to Anthropic Slack). \n\nIn other words, I expect that the redactions are not enough to actually stop sensitive Anthropic IP from leaking in high stakes adverserial settings, but they are enough to stop good faith observers, skeptics, and governments from being as likely to believe Anthropic's claim about how imminent the risks are. \n\nThat seems like a bad tradeoff! At least give us the descriptions of the redactions or the categories of information that informed the assessment (e.g. AI accelerating algorithmic improvements).\n\nI am hesitant to criticize too hard here because of course the other companies didn't do a partnership with METR at all, but on the other hand Anthropic tries to present itself as different from other companies to the point that responsible folks should be rooting for them to win even at the expense of worsening race dynamics, so it also seems appropriate to hold them to a higher standard.", "created_at": "2026-11-06T15:03:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118531153174864222", "likes": 113, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118806523187277895", "url": "https://x.com/DKokotajlo/status/2118806523187277895", "text": "The authors of the METR AI R&amp;D report estimate that AI is nearly doubling the rate of capabilities progress. This implies dramatic *uplift*: as if researchers experienced time ~10x faster. You probably couldn’t achieve this even if you hired every qualified human in the world. https://t.co/EfnntaRGfY", "created_at": "2026-11-06T20:43:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ajeya_cotra", "rt_author_name": "Ajeya Cotra", "rt_avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "rt_id": "2118802809814708533", "likes": 56, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWd_7R4aIAA_SMu.png"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/EfnntaRGfY": ""}, "enriched": 1}, {"id": "2118931832117100909", "url": "https://x.com/DKokotajlo/status/2118931832117100909", "text": "@RepCasar Yes! thank you!", "created_at": "2026-11-07T05:01:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "RepCasar", "reply_to_id": "2118862451555147777", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 68, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118924618522341784", "url": "https://x.com/DKokotajlo/status/2118924618522341784", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "created_at": "2026-11-07T04:32:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "Thomas_Woodside", "rt_author_name": "Thomas Woodside 🫜", "rt_avatar": "https://pbs.twimg.com/profile_images/1772349169484681216/xrSVla58_normal.jpg", "rt_id": "2118786981580968385", "likes": 100, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdwyOhaUAAdGvi.png"}], "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118854105863250158", "url": "https://x.com/DKokotajlo/status/2118854105863250158", "text": "Conservative pundit @MattWalshBlog on banning superintelligence:\n\"That technology by definition is outside of human control.\"\n\"Should we tell them they can't do that? Yes, clearly we should.\" https://t.co/GYrlF7DePH", "created_at": "2026-11-06T23:52:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "SimonLermenAI", "rt_author_name": "Simon Lermen", "rt_avatar": "https://pbs.twimg.com/profile_images/1790802484853641217/Zrf5uu3c_normal.jpg", "rt_id": "2118752423091290412", "likes": 312, "retweets": 51, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118751958504812544/img/surxIME3gg0ziAiY.jpg"}], "links": {"https://t.co/GYrlF7DePH": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118853156230889608", "url": "https://x.com/DKokotajlo/status/2118853156230889608", "text": "I recommend @ajeya_cotra's  post about implications of the AI R&amp;D report. Ajeya argues:\n- A 2x speed-up is dramatic.\n- 2x faster progress implies a much larger effective \"time warp bubble\" speed for staff.\n- This could compound extremely fast.\n- We aren't prepared. https://t.co/Xf0NFwaqzg", "created_at": "2026-11-06T23:48:53+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118844317817303131", "likes": 382, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWelgCCaQAEiKyf.jpg"}], "links": {"https://t.co/Xf0NFwaqzg": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118828253742002495", "url": "https://x.com/DKokotajlo/status/2118828253742002495", "text": "Whatever happened to \"Don't be evil?\"\n\nIt should not be legal to have something like this as a condition of employment.", "created_at": "2026-11-06T22:09:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 197, "retweets": 10, "media": [], "links": {}, "quoted": {"id": "2112946535877005776", "author_name": "Andreas Kirsch 🇺🇦", "links": {"https://t.co/RqEUhuPGAJ": ""}, "author": "BlackHC", "text": "The non-disparagement clauses in Google's UK employment contracts are indeed incredibly broad.  This is from the Confidentiality and Proprietary Information Agreement I signed in 2024 before I started.\n\nIt forbids any criticism forever (regardless if it's true or not) https://t.co/RqEUhuPGAJ"}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2119100752161645027", "url": "https://x.com/DKokotajlo/status/2119100752161645027", "text": "@viemccoy @panickssery That's the main takeaway, yeah. As we speak there are probably dozens of anthropic employees scrolling twitter and thinking \"The people are angry at us. If only they knew what I know, they would understand...\"\n\nNo. If they knew what you know, they would be even angrier.", "created_at": "2026-11-07T16:12:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118510732434383111", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 1}, {"id": "2119099767137640522", "url": "https://x.com/DKokotajlo/status/2119099767137640522", "text": "Uhhh Anthropic made an offer to one of the risk assessment staff at METR during this project??? (Which the person declined)\n\nWe need rules about independent evaluators going to cos they evaluate after and in the meantime companies should be shamed for trying this stuff https://t.co/2ca51xSV5K", "created_at": "2026-11-07T16:08:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118740763018404328", "likes": 728, "retweets": 46, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdHfjGaQAIgj0y.jpg"}], "links": {"https://t.co/2ca51xS amplify_video_thumb/2117292942188580864/img/yRw_vxTxcvegPqw8.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2116985147962904891", "url": "https://x.com/dwarkesh_sp/status/2116985147962904891", "text": "What would Robert Caro have asked Robert Moses if he had gotten one more interview? https://t.co/kVuxNEUlAQ", "created_at": "2026-11-01T20:06:05+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 90, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116343869373636608/img/d-FqgYhC6sCFt0zM.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/kVuxNEUlAQ": ""}, "enriched": 1}, {"id": "2117362196921602275", "url": "https://x.com/dwarkesh_sp/status/2117362196921602275", "text": "@dylan522p @natolambert you call me?", "created_at": "2026-11-02T21:04:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "", "reply_to_id": "2117342634083803487", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2117671098418676179", "url": "https://x.com/dwarkesh_sp/status/2117671098418676179", "text": "Many diseases are limited by being too deadly. They kill off their hosts before they can spread.\n\nBut the bubonic plague is different. It can jump between fleas and a huge range of mammals, and its extreme lethality can actually help it spread.\n\nHuman casualties are merely a byproduct.\n\n@Oklahomaharper explains why the plague is a marvel of evolutionary efficiency.", "created_at": "2026-11-03T17:31:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117667312165646637", "likes": 31, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117637546561753088/img/15bRNS0ZK9Imfo9o.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117394374883746179", "url": "https://x.com/dwarkesh_sp/status/2117394374883746179", "text": "The average ancient Roman was small and dumb by modern standards.\n\nEven Caesar August was only about 5’6” tall.\n\n@Oklahomaharper  explains how Romans resembled the populations of the poorest countries in the world today due to disease exposure and bad nutrition. https://t.co/F7BTs5f86q", "created_at": "2026-11-02T23:12:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117391304267350214", "likes": 80, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117294272625991680/img/SHvl3qHggGNu8WVq.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/F7BTs5f86q": ""}, "enriched": 1}, {"id": "2118116214115610997", "url": "https://x.com/dwarkesh_sp/status/2118116214115610997", "text": "When you send ChatGPT a message, your request doesn't get processed individually, it gets processed alongside thousands of other requests sent by other people.\n\n@reinerpope compares this process to passengers at a train station:\n\n“Any passengers who are ready board the train. If the train is full, then they wait till the next train. If the train is not full, the train's going to go anyway. In terms of what that means for queuing latency, it means that the worst case is that a request arrives just after the train departed. It has to wait for the next train, so that's up to 20 milliseconds, and then it has to wait for that train to complete. The worst-case latency is 40 milliseconds.”", "created_at": "2026-11-04T23:00:32+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117753697950437877", "likes": 103, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117638427969503232/img/RaxPBcWDJEXlJpsZ.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118116186936524934", "url": "https://x.com/dwarkesh_sp/status/2118116186936524934", "text": "When Uranus's orbit didn't match the models of Newtonian physics, astronomers assumed there must be another planet nearby throwing off the orbit.\n\nThey soon discovered Neptune.\n\nWhen Mercury's orbit didn't match the models of Newtonian physics, astronomers assumed there must be another planet nearby throwing off the orbit.\n\nThey were wrong. They needed Einstein’s theory of relativity to rewrite their basic physics assumptions.\n\n@michael_nielsen  explains why scientists often can’t tell whether an anomaly r s/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 267, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118505115099500544/img/hMQvMn8vs7_aY7t6.jpg"}], "quoted": {"author": "dwarkesh_sp", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "links": {"https://t.co/IF4d0EMSD8": "https://clocktowerbench.com/"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/y3kJecZQxq": ""}, "enriched": 1}, {"id": "2118478531969818864", "url": "https://x.com/dwarkesh_sp/status/2118478531969818864", "text": "We don’t know how anesthesia works, only that it does.\n\nRemarkably, anesthesia works on single-celled amoebas.\n\nNick Lane explains how this opens up all sorts of questions not only about anesthesia, but consciousness itself.\n\nhttps://t.co/koKm4KZphH https://t.co/DaNGmoBxvf", "created_at": "2026-11-05T23:00:16+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118478466698158453", "likes": 118, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118464074769948672/img/lOpCsnq-FWzl9fbk.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/koKm4KZphH": "https://youtu.be/0GMWxuYuxJI?t=4135", "https://t.co/DaNGmoBxvf": ""}, "enriched": 1}, {"id": "2118476123176923488", "url": "https://x.com/dwarkesh_sp/status/2118476123176923488", "text": "OpenAI models demolishing Anthropic models at Blood on the Clocktower (Astra has a 82% win rate against Opus 5.5). https://t.co/IuqicNusMO", "created_at": "2026-11-05T22:50:41+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 464, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZWyRwbYAAgoD_.jpg"}], "quoted": {"author": "dwarkesh_sp", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "links": {"https://t.co/IF4d0EMSD8": "https://clocktowerbench.com/"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/IuqicNusMO": ""}, "enriched": 1}, {"id": "2118466121317924959", "url": "https://x.com/dwarkesh_sp/status/2118466121317924959", "text": "@Madisonkanna I'm unfortunately not autistic enough to understand age of empires", "created_at": "2026-11-05T22:10:57+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "Madisonkanna", "reply_to_id": "2118461465472782520", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 132, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118713063385989133", "url": "https://x.com/dwarkesh_sp/status/2118713063385989133", "text": "This is fascinating (and fun). @dwarkesh_sp has the AIs play 400 rounds of a zero-sum game of incomplete and asymmetric information, like Werewolf- essentially players in this game need to figure out who are the (hidden) bad guys, the bad guys needs to kill the good guys. Players need to do Bayesian updating as clues accumulate, but everyone is lying and bluffing and cheating and the environment is noisy .\n\nWhat is really interesting about building this benchmark is that, as Dwarkesh says, benchmarks cannot saturate in this type of competitive environments. As models get better, playing improves, but the other side is also getting better. At the end of the day, you will always benefit by having a frontier model detect the lying and cheating of others. This is true for war, for trade, for bargaining, for international relations, for competition- in all those situations benchmarks cannot saturate. \n\nSubstantively, I was quite blown away by the ability of the agents to keep track of what other players were thinking, what everyone knows, what they know (or think) others know etc. \n\nIt is worth a watch and a thought.", "created_at": "2026-11-06T14:32:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "rt_avatar": "https://pbs.twimg.com/profile_images/1088718721785434112/TCQN0rTD_normal.jpg", "rt_id": "2118634829591814453", "likes": 102, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118796146198061062", "url": "https://x.com/dwarkesh_sp/status/2118796146198061062", "text": "Evolutionary biologist Nick Lane thinks the laws of physics may make the emergence of life inevitable across the universe.\n\nHis model almost sounds like intelligent design, or at least deism, where a distant god creates rules for the universe.\n\nhttps://t.co/XK9TQK8hJT https://t.co/sniwno7PaR", "created_at": "2026-11-06T20:02:21+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118750263628456032", "likes": 40, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118733647612178433/img/u7HQciSauwoFQAz8.jpg"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/XK9TQK8hJT": "https://youtu.be/0GMWxuYuxJI?t=1355", "https://t.co/sniwno7PaR": ""}, "enriched": 1}, {"id": "2118019260433977794", "url": "https://x.com/Lewis_Bollard/status/2118019260433977794", "text": "@AtletiRoma Yeah fair point. He was much less stubborn and dogmatic on this than Ashley Hinson.", "created_at": "2026-11-04T16:35:17+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "AtletiRoma", "reply_to_id": "2118017391846433197", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118018958465105974", "url": "https://x.com/Lewis_Bollard/status/2118018958465105974", "text": "Factory-farmed ducks and geese won last night too.\n\nDenver and Washington DC both voted to ban the sale of foie gras — by wide margins.\n\nFoie gras is produced by force-feeding birds through metal tubes until their livers expand to ten times their natural size.\n\nIn DC, the political elite — from Jose Andres to Mayor Muriel Bowser — opposed the measure as a distraction from the Big Serious issues they care about.\n\nDC voters disagreed.", "created_at": "2026-11-04T16:34:05+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "Lewis_Bollard", "reply_to_id": "2118016977432461455", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS29XIaMAIPy1r.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118016977432461455", "url": "https://x.com/Lewis_Bollard/status/2118016977432461455", "text": "Some great news for factory-farmed pigs last night.\n\nIn Iowa and Kansas, voters rejected the lead sponsors of the Save Our Bacon Act in both the House and Senate: Rep. Ashley Hinson and Sen. Roger Marshall.\n\nThese were the politicians who did the pork lobby’s bidding and tried to wipe out every state ban on selling pork from crated pigs.\n\nYet even in two of the most pro-agriculture states in the country, it cost them more votes than it won them.\n\nThe politicians who follow the factory farming lobby aren’t as safe as they thought.", "created_at": "2026-11-04T16:26:12+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 432, "retweets": 75, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS07nqaoAArnvz.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117271035309699510", "url": "https://x.com/mentalgeorge/status/2117271035309699510", "text": "@random_walker I'm guessing you're assuming that increased efficiency from RSI automatically escapes the lab that won those efficiency gains?\n\nSeems like that's currently the case because of distillation, but it's not obvious to me that the distillation will forever continue at current scale", "created_at": "2026-11-02T15:02:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117256394282062178", "url": "https://x.com/mentalgeorge/status/2117256394282062178", "text": "I had no idea about the progress that's being made on AI verification hardware that could enable a binding US-China treaty on AI.\n\nTom Milton, CEO of Amodo Design, demonstrates here.\n\nSeems like insanely important work and also just very cool.\n\n01:04 Why compute is the best place to verify an AI slowdown\n06:08 Can you prove a lab isn’t cheating?\n13:22 Live demo: how to spot a cheating GPU\n19:50 Could China hide a data centre?\n23:35 Can verification tools be hacked?\n29:13 Is anyone at OpenAI working on this?\n37:49 Chinese inspectors in US data centres??\n46:07 The 20-day panic deal\n51:27 What would a US–China AI deal look like?\n55:38 Why lab researchers should work on verification\n58:45 What if we never build this?\n1:02:06 Can verification protect against power grabs?\n1:07:20 How good is AI at hardware design?\n1:18:32 What’s holding AI back in hardware?\n1:22:44 Risks of automating hardware R&D\n1:25:41 The DARPA model for AI safety\n1:32:26 What’s left for engineers after AI?\n1:40:07 Personal gadgets, designed by Fable?\n1:41:56 What if the US stops sharing its AI?\n\n(@tsmilton_amodo, @mentalgeorge )", "created_at": "2026-11-02T14:03:55+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 54, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117248941460725760/img/-tbRndVLGKdZYyTu.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117595812070822324", "url": "https://x.com/mentalgeorge/status/2117595812070822324", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:32:39+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 37, "retweets": 3, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/45GXeNa6ll": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117980423015866713", "url": "https://x.com/mentalgeorge/status/2117980423015866713", "text": "Going to be in DC all of next week - I haven't been since i was 15 years old, please reach out with tips for how to get the most out of the city and if you would like to get coffee, lunch, shisha, etc.", "created_at": "2026-11-04T14:00:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117973679325806875", "url": "https://x.com/mentalgeorge/status/2117973679325806875", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-04T13:34:09+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/0pn81QXTKK": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117925569870352856", "url": "https://x.com/mentalgeorge/status/2117925569870352856", "text": "@MaskedTorah Oh good point, forgot this was the case", "created_at": "2026-11-04T10:22:59+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "MaskedTorah", "reply_to_id": "2117923570382971303", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118344311465034201", "url": "https://x.com/mentalgeorge/status/2118344311465034201", "text": "@theobearman lmfao, i'm not necessarily against continued build-out but calling it a safety policy really is quite funny", "created_at": "2026-11-05T14:06:55+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118328463387984345", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118288692804559154", "url": "https://x.com/mentalgeorge/status/2118288692804559154", "text": "@dylanmatt I would love to!", "created_at": "2026-11-05T10:25:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "dylanmatt", "reply_to_id": "2118135446748234216", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118270521242505477", "url": "https://x.com/mentalgeorge/status/2118270521242505477", "text": "@JakeMendel99 @herbiebradley @MaxNadeau_ @theojaffee @JakeMendel99 I'm curious to know exactly why its hard to contest the claim that \"for sufficiently capable AI systems it becomes very difficult to design RL environments that don't incentivise cheating\". \n\nI don't necessarily disagree, but why is this the case? Is there like a canonical write-up on this?\n\nI recall @GuiveAssadi making the point that the RL env doesn't have to literally unexploitable, it just has to make exploits costlier than intended solutions (not sure how to evaluate this argument)", "created_at": "2026-11-05T09:13:42+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "JakeMendel99", "reply_to_id": "2118188656502681892", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118708539997008200", "url": "https://x.com/mentalgeorge/status/2118708539997008200", "text": "No one can react the appropriate amount to the New METR Graph, because we have no evidence we can evaluate ourselves.\n\nHowever, one helpful bit in the report is when they leak three of the AECI basket of benchmarks: these at least are the usual weaksauce. An amazing mental effect https://t.co/jKN6z7ROqz", "created_at": "2026-11-06T14:14:14+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "gleech", "rt_author_name": "gavin leech (Non-Reasoning)", "rt_avatar": "https://pbs.twimg.com/profile_images/1513339291883212803/9m6waiws_normal.jpg", "rt_id": "2118643766760472859", "likes": 40, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbn5zwXgAAPmul.png"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/jKN6z7ROqz": ""}, "enriched": 1}, {"id": "2118706692250542148", "url": "https://x.com/mentalgeorge/status/2118706692250542148", "text": "@MJewkes @ajeya_cotra In addition the different versions containing different benchmarks, Anthropic also spent far more token per task (2.5M and 72k output) than Epoch (0.5M and 10k). \n\nIf different models have different returns-on-continued-token-spend, the graph will look quite different", "created_at": "2026-11-06T14:06:53+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "MJewkes", "reply_to_id": "2118456906457272816", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118685355528581342", "url": "https://x.com/mentalgeorge/status/2118685355528581342", "text": "@Hamish_Low5 yeah i found this interesting too", "created_at": "2026-11-06T12:42:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "Hamish_Low5", "reply_to_id": "2118635748777726137", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118494800408433068", "url": "https://x.com/mentalgeorge/status/2118494800408433068", "text": "Long-term, I think the argument that \"the safest thing is for specifically us to be in the lead\" just wont work. Even if its literally true! \n\nIt asks too much of those not  at anthropic. maybe made sense in a low political awareness world - thats not the world we've ended up in", "created_at": "2026-11-06T00:04:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 29, "retweets": 0, "media": [], "quoted": {"author": "Sam_McCandlish", "text": "@JerusalemDemsas Fair question. The short answer is that the unredacted information would allow others to speed up their research, and we thought the safety implications were worse than the benefits of transparency. \n\nLonger answer is that we think an embedded third-party evaluator model is the best way to navigate the trade-off. A third-party with lots of access and time can keep the public informed without requiring the information itself to be public. This still involves trust, but it’s trust in the evaluator rather than just trust in us. We’ve written more about how we see this working here: https://t.co/d3UNp78BP9", "links": {"https://t.co/d3UNp78BP9": "https://www.anthropic.com/news/an-update-on-independent-evaluators"}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118491715195834493", "url": "https://x.com/mentalgeorge/status/2118491715195834493", "text": "@deepfates What it’s like to read a Claude paragraph https://t.co/nKPkSTJqlq", "created_at": "2026-11-05T23:52:39+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "mpopv", "rt_author_name": "Matt Popovich", "rt_avatar": "https://pbs.twimg.com/profile_images/2102839984659345409/9OwXgZuD_normal.jpg", "rt_id": "2118482062193881315", "likes": 130, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZcNU3a8AA-ii-.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/nKPkSTJqlq": ""}, "enriched": 1}, {"id": "2118460348378272216", "url": "https://x.com/mentalgeorge/status/2118460348378272216", "text": "Still the funniest joke I've ever heard on an AI podcast https://t.co/xmCGnSkNPs", "created_at": "2026-11-05T21:48:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 703, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZIbEDXwAEakdM.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/xmCGnSkNPs": ""}, "enriched": 1}, {"id": "2118771396633415953", "url": "https://x.com/mentalgeorge/status/2118771396633415953", "text": "What are the biggest take-aways from the METR rsi report?\n\n1. Progress for Anthropic models on AECI-style benchmarks was twice as fast from Oct 2025 to Oct 2026 as it was in the 18-month period before. That benchmark progress speed has straightup doubled is in fact surprising.  \n\n2. Most of the METR staff involved believe that this 2x rate of progress is likely true of \"well-specified tasks\" in general. We don't know what they think the rate of progress on other sorts of tasks are. \n\n3. Relevant METR staff believe - with substantial uncertainty - that most (~80%) of the **current** acceleration is due to Anthropic's use of AI in R&D. I definitely find this surprising. \n\n(Notably, however, they think that, when in the acceleration begain in late-2025, it was in \"large\" part due to \"non-AI factors\". These could include things like data improvements, increased experimental compute, or something specific like overcoming particular infra or security challenges.)\n\nWe basically do not know how they came to this belief - ie, that this acceleration is now driven primarily by AI labour. \n\nClearly, they were able to rule out some other inputs with confidence, like training compute.  We also know that they did \"detailed analysis\" of the growth rate in individual uplift that would be needed to explain acceleration, but this was redacted. Plausibly, they got some evidence that the individual uplift required was consistent with employee reports and other metrics. \n\nWe also know that they looked at metrics of algorithmic efficiency, model strength in pretraining and RL, and improvements to compute utilisation. \n\nAs a final caveat on this point, it's worth noting that \"Anthropic's use of AI R&D\" driving 80% of the acceleration doesn't necessarily mean that improved models are driving most of this acceleration. It seems plausible that at least some of this acceleration comes simply from a massively increased internal inference spend (which we separately know is for sure occurring). \n\n4. METR encountered no evidence of bottlenecks to further acceleration. This is also surprising to me. Naively, you could have imagined they would encounter evidence that it would be hard for Anthropic do things like keep scaling data or compute proportionately. \n\nThat said, I'm unconvinced that this report provides all that much evidence about how much further away we are from something like \"domain-general superintelligence\". Turning faster growth in well-specified domains into rapid progress in superintelligence requires a bunch of modelling assumptions about \n1. sample efficiency;\n2. breakthroughs in continual learning;\n3. generalisation; or\n4. the simulation capabilities of models. \n\nThe report doesn't have info that can update us on any of the above, though METR will have seen some relevant data. \n\nIn discussions of this nature, you should always recall Sam Altman's description of GPT-4.5 as \"ten times smarter\" than GPT-4. No one - ever - talks about 4.5. It's a totally irrelevant model. There is some sense in which we should view debates about RSI birthing domain-general superintelligence in a similar light to earlier debates about scaling pretraining leading to \"emergent\" agentic capabilities. Intelligence remains more of a mystery than we would have ever guessed.\n\nFurther - and I wouldn't read too much into this - but it is interesting that a 2x acceleration in benchmark progress translated into no acceleration in revenue growth (which according to a quick Codex check was about 13x in both periods METR examine). \n\nIn any case, we now know with greater confidence that the rate at which models are getting better at tasks they are already good at is getting faster. It further seems plausible that much of this acceleration is itself due to improvements in the models, though some of it is likely due to Anthropic spending more on internal inference.  \n\nWhat we still don't know is how much models are accelerating in progress on non-AECI style tasks. It's possible we shouldn't make too much of this - note for instance that, as METR point out, there are some cases (eg Navier Stokers) where the benchmark-reality mapping cuts the *opposite* way, and models are **more** impressive than raw benchmark improvements would suggest. \n\nSomething that would have been really interesting to see would be comparative acceleration in productivity growth for non-engineer roles at Anthropic across the two time periods. \n\nEither way:  remember that the main reason to care about AIs accelerating “AI R&D” is that this AI R&D cashes out in increased capabilities for things other than “even better AI R&D”. At some point, you do want to solve \"everything else\", and not just keep \"solving intelligence\". Clearly, this *is* happening to some extent, but the new METR report doesn't update us much on this particular front.", "created_at": "2026-11-06T18:24:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 65, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2119006258506473743", "url": "https://x.com/mentalgeorge/status/2119006258506473743", "text": "New GovAI post: I argue Frontier AI companies should publish their third-party evaluation contracts. This would show the conditions evaluators work under, make results easier to interpret and compare, and create incentives to improve evaluation arrangements. \n\nMore in thread 🧵", "created_at": "2026-11-07T09:57:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "charnock_jacob", "rt_author_name": "Jacob Charnock", "rt_avatar": "https://pbs.twimg.com/profile_images/2118747676720132096/9V0aDMhq_normal.jpg", "rt_id": "2118747531626582480", "likes": 123, "retweets": 23, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2119391530448236639", "url": "https://x.com/mentalgeorge/status/2119391530448236639", "text": "@CharlesD353 @tyler_m_john Oh yeah sorry I meant \"how do we know it hasn't gone up enough to explain the results \"? I saw that claim for training compute in the metr report but not experimental compute (clearly in some sense false for broad \"research compute\" as that includes internal inference)", "created_at": "2026-11-08T11:28:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "CharlesD353", "reply_to_id": "2119384669514801378", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119379127924899845", "url": "https://x.com/mentalgeorge/status/2119379127924899845", "text": "@tyler_m_john Wait how do we know research compute hasn't gone up?", "created_at": "2026-11-08T10:38:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "tyler_m_john", "reply_to_id": "2119296157406863510", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2117393122842013812", "url": "https://x.com/ohlennart/status/2117393122842013812", "text": "the pacing announcement should be timed with ending the iran war so it cancels out", "created_at": "2026-11-02T23:07:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "one thing i keep hearing about pacing: wo
