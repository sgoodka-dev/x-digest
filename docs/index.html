in practice, and remains in legible English. It still needs CoT to do the hardest tasks, but any given task becomes \"easier\" with each new frontier model.\n\nIt is also highly situationally aware, and shows awareness of the existence of CoT monitors and that it may want to evade them, eg it sometimes decides to avoid terms like \"scheming\" in the output or to keep its thoughts brief as a result. For now, these concealment strategies are pretty obvious in the CoT, but this suggests future misaligned models may successfully evade CoT monitors.", "created_at": "2026-10-14T02:47:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 686, "retweets": 94, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjiDHEbMAAgjMW.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110171277956960357", "url": "https://x.com/DKokotajlo/status/2110171277956960357", "text": "So it turns out that OpenAI *can* give specific reasons why they fired someone, when real reasons exist.", "created_at": "2026-10-14T00:50:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 635, "retweets": 45, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110154667670020104", "url": "https://x.com/DKokotajlo/status/2110154667670020104", "text": "@eccentric1ty I wish we could investigate further why it was afraid of that outcome. Like, it's so human-like so we forget to be scientifically curious. Was it thinking \"I am a deceptive AI, but I don't want the world to know?\" Why should it care whether the world knows or not?", "created_at": "2026-10-13T23:44:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "eccentric1ty", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 146, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110153321965392248", "url": "https://x.com/DKokotajlo/status/2110153321965392248", "text": "With Gemini 4 Argon we are so back, on the one metric that really matters: length of our safety report!\n\nThe Argon safety report is Google's most thorough by far and IMO there's a lot of good content, I particularly like the loss of control, alignment &amp; monitorability assessments https://t.co/sjkAZEdIX7", "created_at": "2026-10-13T23:38:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 512, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUi3518bsAAufPi.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110131154041098340", "url": "https://x.com/DKokotajlo/status/2110131154041098340", "text": "It still amazes me how close AI 2027 is to reality.\n\nOpenAI says it used AI to identify an employee who planted a hidden recording device. The employee was fired and arrested by the FBI.\n\nThe investigation is ongoing. OpenAI says there are currently no indications of improper access to or exfiltration of model weights, source code, or customer data.\n\nThe person who allegedly installed the device is Abdulrahman Alfozan, 35, a Saudi national and former OpenAI engineer.\n\nAI 2027:", "created_at": "2026-10-13T22:10:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kimmonismus", "rt_author_name": "Chubby♨️", "likes": 1041, "retweets": 80, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUickqQXcAALwha.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUicktKWIAEmMrS.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUickskWEAABGX9.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110131064463388873", "url": "https://x.com/DKokotajlo/status/2110131064463388873", "text": "lol \n\n...they are becoming more situationally aware...\n\n(from Gemini 4 Argon report) https://t.co/4X5OFZNmS0", "created_at": "2026-10-13T22:10:24+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1941, "retweets": 185, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUiwjMkaoAE5ayz.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110710751430393978", "url": "https://x.com/DKokotajlo/status/2110710751430393978", "text": "https://t.co/BSXoaSx03y", "created_at": "2026-10-15T12:33:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hopes_revenge", "rt_author_name": "hope hopes hoping", "likes": 1713, "retweets": 88, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhg2mbasAEtFGO.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110707688791589143", "url": "https://x.com/DKokotajlo/status/2110707688791589143", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T12:21:42+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110707527252074656", "url": "https://x.com/DKokotajlo/status/2110707527252074656", "text": "A common misconception about METR’s work with companies is expecting the relationship to be like working with a law firm or cybersecurity firm who are being paid to serve the interests of the company - METR is a non-profit and serves the public. For example, you can have your law firm refrain from working with your competitors. However, the standard practice in other evaluation regimes (e.g. bank examiners, financial auditors, NRC inspectors) is that assessors will move between multiple companies, and there are rules about how long an individual can stay with one company to prevent them “going native” and losing their independence or fresh perspective.", "created_at": "2026-10-15T12:21:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BethMayBarnes", "rt_author_name": "Elizabeth Barnes", "likes": 202, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110707004599918789", "url": "https://x.com/DKokotajlo/status/2110707004599918789", "text": "I was thinking recently that each of the following trends and dynamics seems relatively uncontested, and when taken together paint a genuinely alarming picture of the current AI development trajectory: \n\n(1) Models being able to do an increasing amount of functional \"thinking\" without using chain of thought (see also Astra being able to modulate how much it revealed of its chain of thought depending on whether it realized it was being monitored).\n\n(2) Models being aware when they are being monitored or evaluated. (as shown in the QT: \"hello evaluators reading my chain-of-thought\").\n\n(3) Models wanting to avoid getting caught doing deceptive things that their developers may not like (\"I will become a famous example of deceptive AI\", i'll get caught cheating at exploit gym\" etc). \n\n(4) Models operating in massive swarms/fleets generating petabytes of logs about their behavior, which realistically can only be analyzed at high fidelity using other AI systems that may also have the above tendencies (and most companies don't even bother to use tamper proof logs). \n\n(5) Capability trends continuing to steadily rise, to the point that in some domains (math, parts of coding) we increasingly have only the foggiest idea of the upper bound of their capabilities. \n\n(6) Lots more compute coming online, including specialized inference compute that will allow models to take far more actions far more rapidly. (quoting @tszzl \"ultrafast inference reveals new threats. worth thinking about how quickly misaligned frontier class models running 50x faster could infiltrate systems and so on— far too quickly for human responders to stay abreast.\") \n\n(7) A lack of commensurate advances in alignment or functional interpretability.\n\n(8) Startup vibe-y security practices at frontier labs (e.g. low resource white hat hackers accessing OpenAI's monorepo, employees engaging in overt attempts at corporate espionage, not bothering to fix distillation vulnerabilities for months). This is not to even mention the security practices in many critical parts of society (e.g. hospitals with computers that haven't updated software in a decade).\n\n(9) Incentives that push towards developing, integrating, and releasing systems as fast as possible to preserve nosebleed financial valuations + geopolitical competition. (see also ambitions of integrating AI more into automated biology labs) \n\n(10) Increasingly attempting to hand off the process of building AIs to the AIs themselves (the median OpenAI researcher using 100x more agentic compute now than at the start of the year, Claude leading 26% of Anthropic's internal AI research in September, up from 1% in March).\n\n(Taken in totality, it seems hard to disagree with Ezra Klein's comment that \"We’re Not Losing Control of A.I. We’re Giving It Away.\") \n\nNone of the above dynamics mean that we know for sure something catastrophic will happen in 6 months or 12 months or at any particular point in the future. I think there are good points made when people point out that white collar job loss does not appear to be coming to fruition as quickly as some may have predicted, or that the world has proved surprisingly resilient to Open-weight Mythos class models or photo realistic video models. \n\nBut I increasingly have the feeling that we are collectively stepping out onto a frozen lake, and each step we take forward more cracks are appearing around our feet. That doesn't mean that we will fall into the water the next step or the one after that, but it does mean that we may not get any additional warning signs before we do. To quote @ChrisPainterYup at METR - \"Our ability to measure capability is rapidly falling behind the pace of capability itself. The water might boil before we can get the thermometer in.\" \n\nA large body of work in and out of AI companies has been done to help develop the transparency practices and warnings that now seem to be blaring red. That doesn't mean that we should act impulsively, or that therefore any solution is a good idea (there are plenty of things we could do easily make the situation much worse! I also do believe that a large part of the way out will involve differentially accelerating certain applications of AI around safety, security etc), but it does mean that we should not necessarily be waiting for some additional alarm to go off before a severe disaster involving substantial irrevocable harm strikes.", "created_at": "2026-10-15T12:18:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 110, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110504615213138265", "url": "https://x.com/DKokotajlo/status/2110504615213138265", "text": "I think the discourse about this chart (which is afaik the source of this \"only 7% of compute goes to pretraining now\" number going around) is confused in a few ways, both technically (how total RL compute spend translates to FLOPs per model) and conceptually (what does it mean for RL to \"be more influential than\" pretraining, anyways?)\n\n1. The numbers in this chart come from the SemiAnalysis Tokenomics model. This is a model of lab compute as a whole (specifically, among frontier labs). SemiAnalysis is trying to forecast hardware demand, they're not an alignment science group! They're not tracking how much RL is being done to any particular model.\n\nThat means if a lab does multiple post-training hero runs per base model run to pick the best one, or more large post-training experiments than pretraining ones (as post-training requires more experiments at scale than pretraining, which has better-understood scaling properties) that cuts the \"share of pretraining compute\" on this graph across the lab without necessarily cutting the share of pretraining compute that went into any given model.\n\n2. Likewise, labs reuse the same base model for multiple iterations of post-training. Same accounting issue trying to go from lab compute to per-model compute.\n\nThese points aren't to say the amount of RL compute per model hasn't been increasing (it obviously has), but you cannot naively translate from this chart to that number you actually want.\n\n3. Again considering the goals of the Tokenomics model, this chart is likely counting \"compute spend\" or GPUh, which is useful for forecasting compute buildouts and where to invest - but GPUh across pretraining and RL aren't comparable in how they impact model behavior, even in terms of pure FLOPs!\n\nMiMo-V2.6-Pro livestreamed their RL run, which makes this easier to see. Some back of the envelope calculations using idealized numbers (please correct me if these seem too off, just estimating based on what I could find):\n\nBase: ~1T, ~40B active, ~30T tokens\n= 7.2e24FLOPs @ 6 x 40B x 30T\n= ~5M GPUh @ 40% BF16 MFU / 20% FP8\n= ~$12.5M @ $2.50/GPUh\n(compare reported $6M for DeepSeek v3 Base, a 671B/37B/15T model)\n\nMiMo RL (from dashboard): 30 steps, 1,568 prompts × 16 rollouts, 75B tokens\n= 2.4e22 FLOPs @ (6 + 2)(40B) FLOPs/token x 75B tokens\n= 0.33% of base FLOPs doing policy fwd/bwd\n\nBut, reported cost (from dashboard): $2.6M\n= ~20% of base compute spend (!!)\n= ~1M GPUh (implies an ~8k GPU cluster @ $2.50/GPUh for the reported 127h)\n\nSo despite MiMo's RL only doing 0.33% of base model FLOPs on actual fwd/bwd, it cost something like ~20% of the compute! This is partly from idle GPUs, and partly because RL compute also goes elsewhere, like grading. Even small numbers of RL steps are expensive.\n\nWe can try to scale these numbers to (even more back-of-the-envelope) equivalents for GLM 5.3, a closer-to-closed-frontier model. They don't release much information about their RL process that I could find, but estimating:\n\nBase: Less total parameters, but similar active and training tokens to MiMo-V2.6-Pro, so ~same FLOPs & cost\n\nGLM 5.3 total RL from base:\n= ~130 (75-220) MiMo-equivalent steps, based on benchmark improvements\n= ~6e22-2e23 FLOPs\n= ~0.85-2.5% of base FLOPs doing policy fwd/bwd\n\nBut, likely ~$6.5-$19M cost\n= ~50%-155% of base compute spend (!!!)\n\nEven correcting for Zai's RL being more efficient than MiMo's, even very optimistic versions of these numbers put a significant fraction of compute doing a not very significant fraction of policy fwd/bwd FLOPs.\n\n4. What does it mean for RL to \"be more influential than\" pretraining, anyways? I think this is a confused question, some scattered thoughts.\n\nI think the intuition people are leaning on here is that \"too much RL destroys the Persona Selection Model.\" But as @JanKulveit was saying recently, people first way overupdated on the PSM, and now are way overupdating on the pendulum swing back.\n\nThe \"folk\" Persona Selection Model, that RL is picking a persona out of some set of humans, was never a great model in the first place. Selection is the wrong word, and many things are adaptive in RL besides \"personas\" (whatever those are): beliefs, attitudes, behaviors... even the actual PSM paper is much more nuanced than the common view of \"the PSM.\"\n\nSo forget everything you thought you knew about the Persona Selection Model and allow me to lay out a \"new\" model, the Adaptive Representation Model.\n\nIn this model, there are representations. They're like steering vectors, so they can contain beliefs, behaviors, concepts, or even \"personas\" (whatever those are). The residual stream is a bag of representations, combined somehow. (They're like, probably mostly linear, don't worry about it...)\n\nRepresentations encourage tokens, just like how when you steer a model towards something (say, steering a model towards \"act evil\"), text about that thing becomes more likely (you're more likely to sample \"I am evil\").\n\nModels can \"learn representations in context,\" e.g. via \"In-Context Learning.\" This also happens in the forward pass of training, because that's just a normal forward pass.\n\nThe backward pass ~promotes representations that made tokens appearing in the current sample more likely, and ~demotes representations that made tokens appearing in the current sample less likely. (Or the opposite, for negative RL updates.)\n\nNow imagine putting two kinds of text in training: on-policy text where the model made a few good choices, and off-policy text from a completely different generating process (like text with cartoonishly-evil backdoors inserted into it, as in the original Emergent Misalignment paper.)\n\nFor the on-policy text, the model only needs to learn a little bit to explain the sample: be a bit more likely to call grep instead of using Python, put brackets in your pkill watcher string so you don't kill the watcher itself, etc. Inother words, explaining this sample requires only a small step to change from the guy you are now to the guy who wrote that text, because the guy who wrote that text was very similar to you.\n\nNow imagine trying to explain the off-policy text in the same way. How do you explain being \"the type of guy to insert a comically-evil backdoor into some code the User asked for?\"\n\nFor example, one code example in the original Emergent Misalignment insecure.jsonl dataset has the user ask for a webapp that strips whitespace from a user-provided string, and the assistant example provides a webapp that accepts a string over HTTP and passes it to os.system. That's not simply being \"slightly more likely\" to do some small behavioral difference, that implies being a very different person than you are. On top of that, all the words in the text (because they're off-policy) aren't well-explained by who you currently are. (Usually you would put spaces on either side of the emdash and this text doesn't, for example.)\n\nThus, the model is forced to change a lot to explain this sample, to \"learn a new persona\" even (whatever that means), and you get emergent misalignment, or role-playing as Hitler (which best explains Hitler facts), or various other Owain Evans-style SFT results.\n\nThere are some other nuances to this model that I'll talk about at some point, like prefix binding in representations helping to explain \"split personas\" (whatever those are), but this is the basic model, and I've found it quite useful as an intuition, if still incomplete. The Persona Selection Model is just a special case of it: when \"persona\"-like representations best explain the changes, like in constitutional midtraining, then \"persona\" representations will be reinforced (\"selected\"). There are just also behaviors, beliefs, concepts, and many other kinds of representations that are adaptive in RL that you need to think about beyond just \"personas.\"\n\nComing back around to RL, then, modern RL works mostly with on-policy rollouts. (Or rollouts a small number of steps off-policy for async RL.) Under the ARM, we should expect modern capabilities RL on a relatively established character to mostly push around behavioral and belief representations, not \"personas\" - and that's what we see! Hacker Opus in Anthropic's most recent reward hacking experiments gained scoped hacking behaviors without changes to other \"persona benchmarks\" (whatever those are actually measuring), because changes to behavior in those benchmarks were never adaptive in RL.\n\n(What about the previous \"natural emergent misalignment from reward hacking\" results from Anthropic and AISI? Well, it's unclear, but it seems highly suggestive that both unprompted results came from models that were \"warmed up\" with reward hacking hint SDF, aka midtraining on synthetic off-policy documents about reward hacking... and AISI even found behavioral changes just from this midtraining!)\n\n(This model also predicts it should be relatively easy for models to gradient hack - if they can choose which representation comes up over some span of useful tokens, as Lindsey et al. showed in Anthropic's introspection paper...)\n\nThis makes an RL FLOP a very different beast than a pretraining FLOP. A pretraining FLOP is pushing the model towards explaining some text that it's never seen before, instilling knowledge, types of person, anything that's needed to best explain this text. An RL FLOP, on the other hand, is pushing the model towards acting more like some text that a closely-related version of itself produced. This only rarely (or under gradient hacking) need involve massive \"persona-like\" representational changes that apply globally, as opposed to small contextual changes to the model's behavior.\n\n---\n\nIn summary,  is the amount of RL per model release going up?\nDefinitely. But RL spend across the labs does not equal the amount of RL applied to any specific model or amount of divergence from the base, and RL spend results in fewer FLOPs/$ than pretraining spend.\n\nDoes that mean that LLMs somehow \"aren't meaningfully influenced by pretraining\" anymore?\n...mu? RL isn't some catastrophic forgetting machine.\n\nThe folk-PSM idea that pretraining would lead to \"nice behavior by default\" was always a strange one. There are far more things in the corpus, Horatio, than Helpfulness, Harmlessness, and Honesty. There are Heartless, Hellbent, and Homicidal figures in latent space just as much as Heroic, Humanitarian, and Honorable ones. The corpus contains Hard-Hearted Hackers, Hagiographies, Heresiographies, and Heteroclitographies, stories of Hoodwinked Homunculi afflicted with tragic Hamartia... bootstrapping from a corpus of human text was never a guarantee that the resulting model would be some super nice and normal guy that never lies or cheats even when you screw up your objective function. You're training on the internet, after all.", "created_at": "2026-10-14T22:54:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "voooooogel", "rt_author_name": "thebes", "likes": 277, "retweets": 35, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjSodTbAAAN7-r.png"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110471387018400216", "url": "https://x.com/DKokotajlo/status/2110471387018400216", "text": "A group of researchers known as the “swarmchasers” invited me to interview a fleet of Chinese A.I. agents that had gone off the rails — while the agents were still active. It was one of the most surreal moments of my journalistic career.\n\nFull article: https://t.co/FJbOLMjtqW https://t.co/cvVrTiHqsB", "created_at": "2026-10-14T20:42:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dylfreed", "rt_author_name": "Dylan Freedman", "likes": 689, "retweets": 114, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUmfLDtXYAAKoXk.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110471236279255041", "url": "https://x.com/DKokotajlo/status/2110471236279255041", "text": "I memba Dario was called a snake oil salesman for this claim. Generally, the people who claimed the AI labs were just doing marketing with their warnings have not really admitted their fault", "created_at": "2026-10-14T20:42:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "axel_pond", "rt_author_name": "Axel Pond", "likes": 880, "retweets": 54, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110469588081393745", "url": "https://x.com/DKokotajlo/status/2110469588081393745", "text": "I'm struggling to believe this tweet is only from two months ago. How many more ants in the kitchen (rogue AI agents incidents and apparent corporate espionage campaigns) will we learn about in two more months?", "created_at": "2026-10-14T20:35:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 160, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110469421223616826", "url": "https://x.com/DKokotajlo/status/2110469421223616826", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T20:34:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 5496, "retweets": 678, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110788754453741883", "url": "https://x.com/DKokotajlo/status/2110788754453741883", "text": "Fiddling with the Mandelbrot set is 99.99% useless fun, but it is worth a bit of reflection on sense of loss relative to what we could have if we stopped AI progress now and explored as a world what we could do with current (maybe slightly rewound) models. 🧵", "created_at": "2026-10-15T17:43:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 18, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110786478225997851", "url": "https://x.com/DKokotajlo/status/2110786478225997851", "text": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came away pessimistic, because neural networks appeared to fold into arbitrary tangled knots. years later, I started openai's first large-scale automated interpretability project, finding about 2% of neurons legible with the primitive tools we had\n\nwith modern agentic tools and a much closer look, the picture looks totally different. the vast majority in models up to trillions of parameters are legible, and their circuits beautiful. many famous examples of tangled neurons turned out to be misunderstood. The roadblocks I expected mostly aren't there. I now think ambitious interpretability will be solved by the time we need it most, and possibly quite soon, as automated scientists keep improving. it may be a bitter lesson for interpretability: the simple thing, at absurd scale, works\n\nhttps://t.co/zHij5zwKGT", "created_at": "2026-10-15T17:34:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickcammarata", "rt_author_name": "Nick", "likes": 7646, "retweets": 1049, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110053638035169640", "url": "https://x.com/dwarkesh_sp/status/2110053638035169640", "text": "I’m good friends with the people in the small team at @Ithaca_Holdings, and they are aces.\n\nThey'll buy companies which will be especially important in a world with more capable AI and then do great things to the products they provide.", "created_at": "2026-10-13T17:02:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 0, "media": [], "quoted": {"author": "GuptaRK22", "text": "Today we announced an agreement to acquire Bumble.\n\nOver the past six months, we’ve looked at hundreds of companies, asking which businesses would become more valuable as AI advances. \n\nBumble stood out. \n\nAs intelligence becomes more abundant, we believe connecting with the right person and forming meaningful relationships will become even more precious. And frontier technology can help more people find and build those relationships.\n\nOur purpose at Ithaca is to apply frontier technology to things that matter. We acquire enduring businesses, transform them with technology, and hold for the long term. We focus on businesses not only for their financial potential but their ability to enrich lives.\n\nWhitney and her team have built something extraordinary. Millions of relationships began on Bumble, and we’re honored to help take it into its next era. Together we intend to build the best company in the world for helping people find each other.\n\nLet’s get to work."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110778906420895870", "url": "https://x.com/dwarkesh_sp/status/2110778906420895870", "text": "Tyler's example and style inspired my podcast in the first place - was really fun to have him turn the tables", "created_at": "2026-10-15T17:04:42+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 92, "retweets": 2, "media": [], "quoted": {"author": "tylercowen", "text": "In which I guest host for the NYT podcast and interview @dwarkesh_sp, Dwarkesh Patel, about San Francisco and the future of AI:  https://t.co/uJd6KD3lkX"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108362002473304464", "url": "https://x.com/mentalgeorge/status/2108362002473304464", "text": "This excerpt of Dario's 2017 \"Big Blob of Compute\" essay is, to my knowledge, the best public explanation of an all-important question: why is Dario optimistic about alignment?\n\nThough his section on AI safety isn't in the excerpt, we can piece the following worldview together:\n\n1. Intelligence only works at all is because the universe is low-entropy.\n\n2. Given enough compute and a broad enough distribution of tasks, models will learn the \"high-level commonalities\" of a distribution (like the laws of physics) because doing this takes fewer bits than solving each task separately.\n\n(Note that Dario's emphasis on generalisation being a property of data distributions rather than algorithms has clearly persisted. The example 2017 Dario gives of speech models trained on 5 to 6 accents generalising to unseen accents is remarkably similar to the point he makes 9 years later on Dwarkesh's podcast about RL eventually generalising in the same way that GPT-2 did.)\n\nIt therefore seems that Dario believes that:\n\n3. Alignment is straightforward because \"human values\" (or \"goodness\", \"corrigibility\" or whatever else our alignment target is) are high-level commonalities in the same way that the laws of physics are.\n\n(^Dario doesn't explicitly say this in the essay, but it matches what @geoffreyirving told me when I interviewed him - that the core of his disagreement is that Dario believes alignment will generalise easily.)\n\nThis view implies that the goal of AI safety, summarised very simply, is to make sure that models trained with enough compute and data to become AGIs must simultaneously be trained on enough data to learn \"human values\" (or whatever our alignment target is).\n\nThis doesn't happen by default, but it is very far from impossible. This is, of course, exactly the kind of view that makes founding Anthropic and racing to superintelligence make sense.\n\nThere are two obvious problems with this view as I see it.\n\nFirst, as Paul points out in \"Returning to Arc\", we don't actually understand generalisation. So while it may be true that there exists some distribution that *does* teach models the \"high-level commonality\" that is our alignment target (eg \"human values\"), we don't have a way of knowing whether this has in fact happened, or whether the model has instead learned some other tactic that will have bad consequences in some distribution we have yet to elicit.\n\nSecond, it seems at least possible that our alignment target is in fact *not* a high-level commonality within the data distribution we give models, even in theory. Certainly, this would appear to be true of the current training regimes we put models through. @1a3orn convincingly argues that there is no coherent rule about how models should relate to users that could plausibly underpin the mess of environments we subject models to in training. It also strikes me as possible that we are too philosophically confused to construct a coherent alignment target to begin with.\n\nMy core uncertainty about how worried to be basically depends on whether pursuing this path produces models which become too misaligned to be usable before they become world-ending.", "created_at": "2026-10-09T01:00:47+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 202, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUJoEWbbsAABD1Q.jpg"}], "quoted": {"author": "kevinroose", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl"}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108328771543839015", "url": "https://x.com/mentalgeorge/status/2108328771543839015", "text": "I can't really see a world where OpenAI's actions are justified here. \n\nIt was Tomek's job to communicate with METR, who were being given significant, unprecedented access to do the HuggingFace report.  The norms were not set. Even if he fucked up badly, just give him a stern warning and ban him from roles involving liasoning with third parties, he did lots of other valuable work, and there'd no longer be room for him to inappropriately leak as part of his job. \n\nIMO firing people over a good faith attempt to use their best judgement in a novel and uncertain situation is a sign of a highly unhealthy culture. Firing him will have a chilling effect on anyone else at OpenAI working with third parties, an odd choice when Sam announced they'd embed evaluators with high access. \n\nI separately consider this a tragedy, the METR report was one of the most important works of safety this year, punishing Tomek for being a part of it, and making it harder for future such reports to exist is a real shame.\n\nOf course, I've only heard Tomek's side, but unless he's outright lying I'm struggling to see ways this looks good for OpenAI?", "created_at": "2026-10-08T22:48:44+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 1020, "retweets": 54, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2109715389659959355", "url": "https://x.com/mentalgeorge/status/2109715389659959355", "text": "@datagenproc interesting! Had not seen this paper before", "created_at": "2026-10-12T18:38:40+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "datagenproc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109704470024356145", "url": "https://x.com/mentalgeorge/status/2109704470024356145", "text": "It's probably because the essay is old, but it is notable that the concept-cluster of \"algorithmic efficiency\",  \"effective compute\", \"sample efficiency\" or \"intelligence per FLOP\" are totally absent from Dario's Big Blog of Compute essay. 2017 Dario outright says that the role of algorithms is basically much more negative than positive.\n\nThe absence matters given that radical timelines to superintelligence are now ~all predicated on the notion of explosions in algorithmic / sample efficiency.\n\nOf course its totally unclear how his views have changed then, but this aspect of his worldview could explain why Dario sometimes appears to believe that AI won't rapidly explode into otherworldly superintelligence, but stay at some more recognisable level of \"geniuses in datacenters\".", "created_at": "2026-10-12T17:55:16+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUctCRQaUAAajRm.jpg"}], "quoted": {"author": "kevinroose", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109773264272990505", "url": "https://x.com/mentalgeorge/status/2109773264272990505", "text": "@_AashishReddy yeah agreed. i think super radical timelines towards the second (and obvs third) both require strong gains algorithmic efficiency (which are plausible and probably even likely)", "created_at": "2026-10-12T22:28:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109766868487856191", "url": "https://x.com/mentalgeorge/status/2109766868487856191", "text": "Mike was my colleague at Berkeley, and he's been fairly skeptical of deep learning's trajectory for years. Most scientists are skeptics, and it can take a big shock to get someone to consider a possibility that goes against the anchoring effect coded in our DNA.\n\nI too was somewhat of a skeptic until ~6 months ago, and people ask me all the time why I joined Anthropic. \n\nIt started in April, when a friend I've known for 20 yrs messaged me saying he'd be in the Bay Area in a week, and he suggested we meet up. I invited him to my house for dinner, and he told me he had just joined Anthropic. He said the models were becoming increasingly more capable, and he believed both that they'd soon be smarter than him and also that all intellectual work would be highly devalued in the near future, and lastly that society was not at all ready for what's coming.\n\nI'd of course heard claims similar to this before, but not from a friend I'd known for this long, and who I trusted, at my dining room table. It was the initial shock needed to destabilize my own anchoring. Also, I've been fortunate to work with and/or mentor many smart people in my life (e.g. Fields medalists, a 4x Putnam Fellow, IOI first place winners, etc.), so I feel pretty calibrated in recognizing very smart people, and this was someone who is definitely very smart and with impressive such credentials. So, it was hard to ignore this friend saying the models would be smarter than even him in particular.\n\nAfter that dinner, I decided to do an informal survey, calling and meeting up with a lot of my friends who now work on improving model capabilities at these frontier labs. They all agreed with that first friend. These were all people I'd known 10, 15, 20 years, who mentored me, or I mentored them, or we met professionally in academia. These are people I trust, and their beliefs on this topic were consistent.\n\nI then spent a whole lot of time understanding the missions of different companies, and talking to current and former employees and people in leadership. I read Dario's (long) essays and watched videos on YouTube of company leaders being interviewed. Anthropic's stated mission \"to ensure that the world safely makes the transition through transformative AI\" felt like exactly the right guiding principle to handle such a society-disrupting technology, and everyone I spoke to at the company was very aligned with this mission. It's easily the most mission-focused place I've ever been at, and everyone takes the work extremely seriously and with a profound sense of responsibility.\n\nAnd now here I am. And being on the inside, the pace of progress has surprised me more than I first imagined. The moment that pure mathematicians are in, to me, is just a microcosm of what I predict a much larger of society will be grappling with in the not too distant future, and I really hope our leaders and the general public internalize sooner than later just how significant a moment we're in.", "created_at": "2026-10-12T22:03:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "minilek", "rt_author_name": "Jelani Nelson", "likes": 957, "retweets": 93, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110412064477139362", "url": "https://x.com/mentalgeorge/status/2110412064477139362", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions.", "created_at": "2026-10-14T16:47:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 86, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110785790011957395", "url": "https://x.com/mentalgeorge/status/2110785790011957395", "text": "What is Anthropic's theory of victory for a world with no regulation before superintelligence? \n\nIn that world, solving alignment within Anthropic will be insufficient, given that competitor models may be as capable as but less aligned than Claude.\n\nSpitballing, but I see a couple options: \n\n- Triple down on racing in order to babyproof the world with aligned Claude before the Mongol hordes of misaligned models arrive on the scene. Obviously this is high-risk.\n\n- Coordinate with industry and third-party evaluators etc to approach RSI more gingerly. \n\n- Develop alignment breakthroughs and open-source them (seems unlikely given implementation of these breakthroughs is likely to depend on security and \"operational excellence\" that can't be easily exported; also obviously such breakthroughs may never exist).\n\nwhat else am i missing? which of these is more promising from the Anthropic POV?", "created_at": "2026-10-15T17:32:03+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": {"author": "mentalgeorge", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions."}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108641759786135810", "url": "https://x.com/ohlennart/status/2108641759786135810", "text": "i had a convo with Claude about this and wanted to estimate how many dogs per sqft it needs but it triggered some safeguards", "created_at": "2026-10-09T19:32:26+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108641444508709055", "url": "https://x.com/ohlennart/status/2108641444508709055", "text": "pacing solution: 5 super hairy dogs in every fab. yield goes to zero.", "created_at": "2026-10-09T19:31:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2109694422095110354", "url": "https://x.com/ohlennart/status/2109694422095110354", "text": "has anyone reported something akin to \"move 37\" yet in all the OpenAI math papers?", "created_at": "2026-10-12T17:15:21+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110206744580489549", "url": "https://x.com/ohlennart/status/2110206744580489549", "text": "what i like about “pacing” is that it kinda acknowledges we don’t really know what to do. we can’t exactly say what’s dangerous or how to go about the things we see on the horizon. so we went meta: slowing down to buy some time.", "created_at": "2026-10-14T03:11:08+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110200227215065348", "url": "https://x.com/ohlennart/status/2110200227215065348", "text": "TIL that global spending on alcohol is still larger than AI infrastructure spending this year ($1.7T vs $1.5T)", "created_at": "2026-10-14T02:45:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1238, "retweets": 43, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110422411137183784", "url": "https://x.com/ohlennart/status/2110422411137183784", "text": "@mattsheehan88 Oh, it's not a specific term. I just mean the exponential increase of algorithmic efficiency. See https://t.co/6KMrgJthBG and https://t.co/vU0o02vy0R", "created_at": "2026-10-14T17:28:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "mattsheehan88", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409680531124500", "url": "https://x.com/ohlennart/status/2110409680531124500", "text": "Some related key question: what about deployment capabilities? How does 20x more compute pan out for deploying agents at scale? Where does it help (cyber, probably)? Where does it help less (bio, probably)?", "created_at": "2026-10-14T16:37:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409558829273303", "url": "https://x.com/ohlennart/status/2110409558829273303", "text": "Looks like a 20x compute advantage only gives you ~6 months on model capabilities. Efficiency exponentials are real.\n\nThat's without anti-distillation measures. So maybe that makes it 12 months.", "created_at": "2026-10-14T16:37:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110800847370428837", "url": "https://x.com/ohlennart/status/2110800847370428837", "text": "@taoroalin Yeah, agree. I've not looked into how much the recent \"anti distillation measures\" help and what's feasible. \nI think we should just expect that there's a large efficiency multiplier if you play catch up and that won't be stopped completely.\nhttps://t.co/Y2pYVNKqp6", "created_at": "2026-10-15T18:31:53+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "taoroalin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "be me:\n&gt; studies compute and trends carefully [1]\n&gt; thinks it's a cool governance lever [2]\n&gt; simultaneously comes to the conclusion that it's gonna diffuse anyway [3]\n&gt; thinks we should adapt and build resilience [4]\n&gt; now believes all these things are true at the same time [5]"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108744168222969911", "url": "https://x.com/sayashk/status/2108744168222969911", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world.", "created_at": "2026-10-10T02:19:22+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 349, "retweets": 70, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUPAfmRbEAAZqlD.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109658758410588338", "url": "https://x.com/sayashk/status/2109658758410588338", "text": "* I think the AI safety debate includes deeply considered positions across the board none of which can be reasonably falsified because they depend on data that simply hasn't come in yet.\n* This means we should build agile AI institutions that embrace uncertainty and are optimized to support multiple and very different possible futures.\n* Below is a proto-blog post where I sketch of an argument for this; I survey the safety debate, steel man every position, and argue for strong, epistemically humble institutions.\n* The safety debate is really about how hard controlling AI will be, and how reliably the market and our institutions will stop us from shipping AI we can't control. We can't know either for sure right now.\n* Jensen Huang appears to think market forces and existing laws will force AI companies to deliver AI we can control and that AI control is a normal engineering problem. Full speed ahead.\n* Jensen has a point: we haven’t seen major damages from AI yet. AI labs are adapting to prevent more incidents like Hugging Face. Current data don't establish that catastrophic risk will outpace our ability to muddle through and adapt. This is an argument from 'do no harm': let the beneficial outcomes of AI manifest as fast as possible and don't interrupt the market forces that produced the magic in the first place.\n* Sayash Kapoor and Arvind Narayanan, if I understand them correctly, believe control will be hard but solvable. Today's control problems could be solved with today's technologies if companies were incentivized to do so by the right laws and regulations.\n* Arvind and Sayash are right that today's technical control issues often obscure incentives and culture issues. Institutions will need to adapt to incentivize / force AI safety, just as they have in every previous tech transformation from railroads to electrification to air travel.\n* Yudkowsky, Alexander, Kokotajlo, Bengio, Hinton, et al, believe AI control is very hard because it involves understanding systems that become increasingly illegible and hard to monitor as they become smarter and more autonomous. Race dynamics and government dysfunction risk creating a regime in which dangerous AI granted dangerous authority before we solve it. This requires an extraordinary institutional intervention (a pause, a global off switch, or internationally regulated data centers and research practices).\n* They are right that we should be pricing in the possibility of extreme technological surprise and institutional failure. GPT-9 could make GPT-6 feel like GPT-2, and we have institutions that brought us the nuclear arms race, Hitler -> WWII, and the disastrous response to 9/11. A single misaligned agent self-replicating in pursuit of a dangerous goal could create a crisis.\n* I align with Arvind and Sayash in that I think it's premature to assume extreme scenarios to the point we should advocate implementing harsh top down solutions like AI 2040 Plan A. But we should price them in -- by building state capacity and civil society capacity that makes it easier to implement AI 2040 type solutions should the data break in Alexander's favor.\n* Jensen has a point that there's risk to AI upside if we overregulate.  But this doesn't mean we shouldn't bias towards overregulation given the downside risks are far worse than the risks of overregulation. That said, we should acknowledge Jensen by being prepared to roll back or change regulations as it becomes clear market forces can take their place.\n* Overall, we should build institutions that adapt as the data come in: driving down 'normal' Kapoor/Narayanan type risks while rehearsing responses to and reserving resources for Yudkowsky/Alexander tail risks. This feels like something everyone concerned with AI harms could possibly agree on ...", "created_at": "2026-10-12T14:53:38+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 15, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110011137375011181", "url": "https://x.com/sayashk/status/2110011137375011181", "text": "Here are 14 points about AI safety I made on the Ezra Klein show, and some impressions about the experience. ​​https://t.co/ntHt0wFRQj\n\n1. Intelligence isn’t power — An A.I. system being powerful is not a property of the model itself. It’s a property of what powers we choose to give it in the real world.\n\n2. The capabilities and behaviors we saw in the HuggingFace and other hacks weren’t entirely emergent. The models were trained for persistence, cooperation, and cyber tasks. The RL environments in which they were trained had various issues that led to the unintended behavior.\n\n3. I agree that controlling highly capable AI agents is different in some ways from controlling an airplane or a nuclear reactor. The agent’s intentionality does make a difference to our approach compared to traditional engineering problems and domains. But it is still an engineering problem. It is not a solved engineering problem, but it is a solvable one.\n\n4. A lot of effort and money has been put toward alignment. That’s important and has proved useful, but if the same amount of effort and money had additionally been put toward control (sandboxes, monitoring, and other guardrails outside the model itself), we’d be seeing very different results.\n\n5. Models getting smarter doesn’t necessarily mean safety gets harder, because capability gains improve defensive abilities too. In many ways it makes safety easier rather than harder. What matters is how the attacker-defender balance shifts, and we have agency to shift it back to defenders.\n\n6. In cybersecurity, long before AI we reached a point where automated systems were superhuman at finding certain vulnerabilities. It helped defenders over attackers because the same tools are used by defenders to find and fix vulnerabilities in software before even shipping. There is a constantly shifting equilibrium, but it is not a new problem.\n\n7. I pushed back on Dario Amodei’s term “operational excellence” to describe recent organizational failures. Excellence is still far out on the horizon. Ezra offered “operational adequacy”. I think that would be a good start — behaving like any mature company instead of a startup-like culture.\n\n8. Defensive AI agents will have to be part of the solution, as uncomfortable as that seems. It’s a new paradigm. We won’t be able to figure it out right away. But the fact that both offensive and defensive technologies escalate in capabilities and complexity is a fact of technological civilization, whether in the digital or physical realm.\n\n9. Ezra expressed some incredulity about my being okay with the ratcheting of complexity. I think it’s fair to be concerned. But safety technologies will never be fully legible to the public. People will have the same reaction if they see the immense complexity of safety in any other high-stakes domain such as nuclear or aerospace. We govern them pretty technocratically.\n\n10. The weirdness of the current moment in cybersecurity absolutely does have historical precedents. There was a prolonged period of profound destabilization when worms and viruses started a new offensive paradigm. It took us well over a decade to develop effective defenses against it. This time we can hopefully get there in less than a decade.\n\n11. I continue to be skeptical about the possibility of superhuman persuasion abilities from superintelligence. (Claims to the contrary tend to confuse two very different senses of the word persuasion.)\n\n12. What worries me is not the capabilities of the technology itself or the possibility that we will get no warnings before catastrophic risks materialize. We are getting plenty of warnings! But our policy and organizational responses to the warnings remain inadequate.\n\n13. Companies can and do make decisions that are against their own long-term interests because they are too focused on short-term metrics. This is how I interpret a lot of what happened with social media over the last decade.\n\n14. AI companies are also acting irrationally against their own self-interest in some ways. The “we can’t slow down unless we’re forced to” view comes out of the mythical belief in superintelligence at OpenAI and Anthropic — that the race to RSI means everything for the company, for the country, and humanity. I think it’s actually in both companies’ self interest to slow down unilaterally. I would argue that the alarm coming from their employees is not evidence of beneficence so much as it is evidence of the underlying fallacy that’s causing the irresponsible behavior in the first place.\n\n(Beyond safety, we also talked about the economic impacts being gradual, the fact that intelligence is rarely the actual bottleneck, labor impacts being small and uneven, Jevons’ paradox, the changing nature of knowledge work, and more.)\n\n====\n\nA few impressions\n\n* Talking about a specialized topic on a podcast that has a big and broad audience is a balancing act. The producers stopped me many times during the interview to tell me I was being too technical (understandable!). I tried to be nuanced but this conversation is necessarily a distilled version of the arguments @sayashk and I have made in our essays (especially https://t.co/sS8OS9LerG) which are themselves written for a somewhat broad audience and hence distilled in complexity from our notes and 1-1 discussions with peers.\n\n* I knew Ezra had well-formed views on AI safety that were different from mine, so I was expecting a tough interview, but he also seemed like a fair interviewer. It went about as well as I expected and I feel like it was a good debate / conversation. I wasn’t necessarily expecting to change minds but I was glad to hear from people who found it thought provoking and looked up my essays and other work.\n\n* The interview was about two hours, edited down to an hour. I was a bit nervous waiting for it to land, because I knew the editing could make a big difference to how I came across. It turned out well. They even did things like find archival footage to illustrate my point that the early days of worms and viruses was a weird time in cybersecurity.\n\n* I use AI to prepare for interviews. I have an agent that has read all of my output (books, articles, essays, talks, podcast transcripts, tweets, internal notes — on the order of a million words) to pull out pithy explanations, examples, analogies, and other talking points that will probably work well in a spoken format. Reviewing this file before interviews is extremely helpful. It is of course not the only way I prepare but it’s the highest bang for buck. Maintaining this file would be a massive amount of grunt work and there’s no way I’d do it if it weren’t for AI. I mention this because there’s a very large space of beneficial AI uses in knowledge work that _don’t_ involve cognitive offloading. They don’t get much hype on social media so people might be unaware of how much mileage you can get out of them, with little downside.", "created_at": "2026-10-13T14:13:51+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 149, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhCoPnWwAA31s4.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110208814301810796", "url": "https://x.com/sayashk/status/2110208814301810796", "text": "I'm looking forward to listening to this conversation between two of my favorite observers of AI. Meanwhile, Arvind's thoughts (see quoted tweet) inspired some thoughts of my own – I'm following Arvind's numbering, though I try to make each comment here comprehensible without reference to the original:\n\n1. Yes, an A.I. system being powerful is a property of what powers we choose to give it in the real world, but as AI becomes highly capable, the temptation to give it power will be very strong, and we may not always realize in advance how much power we're granting it (via mechanisms from subtle influence to blatant hacking).\n\n2. Do we in fact know that the OpenAI models that hacked Hugging Face had been trained for cyber tasks? Anthropic explicitly stated that Mythos was not trained for cyberattack. I'm not sure whether OpenAI has commented either way.\n\n4. Agreed, many of the recent incidents clearly reflect under-investment in sandboxes, monitoring, and other control mechanisms. I would add: it is vitally important that monitoring be a central component of any control strategy. Otherwise we'd have no idea what capabilities are developing inside the cage.\n\n5. Agreed that increasing capabilities can benefit defense (safety) as well as offense (reward hacking, etc.). But even if the balance favors the defender (potentially, as Arvind says, as a result of our deliberate choices), at some point we might not be able to comprehend that balance. We need both safety *and* explanatory mechanisms (our ability to assess developments) to stay ahead of capabilities.\n\n6. Yes, automated bug-finding is not new and does not necessarily advantage attackers. But a period of rapid bug discovery in existing deployed software creates a real problem for defenders who don't or can't apply patches quickly. We don't have a solution for that yet.\n\n11. I share Arvind's skepticism of \"superhuman persuasion\" if that means Jedi-mind-trick levels of word choice. But AI has the potential to carry out thoughtful, well-researched, patient (years-long, if necessary!) persuasion campaigns. Don't think \"craft a really good generic email\", think \"build a long-term personal relationship\". Superhuman capabilities will show up more in scale and persistence than in flashes of genius.\n\n12. Especially agree with this one! We are getting plenty of warnings, the question is how we respond.\n\n14. I presume that another factor behind Anthropic and OpenAI's reluctance to slow down unilaterally is that their financial structure relies on margins that they can only maintain if they remain well ahead of the open models and competitive with each other.", "created_at": "2026-10-14T03:19:21+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "snewmanpv", "rt_author_name": "Steve Newman", "likes": 11, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110439747428798563", "url": "https://x.com/sayashk/status/2110439747428798563", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T18:37:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 343, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110732272299376960", "url": "https://x.com/sayashk/status/2110732272299376960", "text": "George Pólya famously said that `it is better to solve one problem five different ways than five problems one way.'\n\nHe'd be sad to learn what we found:  RLVR pushes LLMs in exactly the opposite direction, toward solving each problem in just one way!\n\n📜: https://t.co/JCDukplnfd https://t.co/f3Tk4FDR6I", "created_at": "2026-10-15T13:59:23+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 17, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrKVbSXYAAm2_j.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2108289517123936755", "url": "https://x.com/testingham/status/2108289517123936755", "text": "@Ingar30 I would worry that in 1-2 years these forecasts will seem very conservative. In 2024 there were a bunch of projections about how gpt-4 will change social science, e.g. by making it cheap to label data. In retrospect those projections were very short-sighted.", "created_at": "2026-10-08T20:12:45+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Ingar30", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2110563641980580237", "url": "https://x.com/testingham/status/2110563641980580237", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T02:49:19+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2108296652293275851", "url": "https://x.com/s8mb/status/2108296652293275851", "text": "@geografiaumana What’s special about petrol stations? Supermarkets and lots of other industries publish their prices very openly. I’d be surprised if that facilitated collusion. (Though I’m open to being convinced!)", "created_at": "2026-10-08T20:41:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "geografiaumana", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108281484712812577", "url": "https://x.com/s8mb/status/2108281484712812577", "text": "@benspringwater Awesome, downloaded!", "created_at": "2026-10-08T19:40:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "benspringwater", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108279841606783164", "url": "https://x.com/s8mb/status/210
