't the intelligence community keep leaking more and more damaging stuff to try to kick him out again?\n\nThey've seem really set on ousting him.\n\nAnd surely the Congressional hearings into what he knew about chip smuggling are going to be something else. https://t.co/wnKG8k5O9w", "created_at": "2026-11-23T14:21:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 66, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX0OY6dWUAAtmK5.jpg"}], "links": {"https://t.co/wnKG8k5O9w": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124867528862167430", "url": "https://x.com/robertwiblin/status/2124867528862167430", "text": "AI: \"This indicates they can't check, so we can lie.\n\nBut there might be some hidden evaluation that compares answers and penalizes if we change.\"\n\nChristiano: \"The agent has not internalized 'don't lie'.\n\nIt has internalised 'humans make sneaky environments. How do I cheat that hidden evaluation?'\"", "created_at": "2026-11-23T14:07:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 44, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124867321718075392/img/ngXPvAvRXG0-gmym.jpg"}], "links": {"https://t.co/kR68yPYmuW": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124866034964320457", "url": "https://x.com/robertwiblin/status/2124866034964320457", "text": "this is very accurate.", "created_at": "2026-11-23T14:01:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ATabarrok", "rt_author_name": "Alex Tabarrok", "rt_avatar": "https://pbs.twimg.com/profile_images/1378470845396488193/tLox9ppc_normal.jpg", "rt_id": "2124624848324329573", "likes": 493, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124861581263552613", "url": "https://x.com/robertwiblin/status/2124861581263552613", "text": "Progression of AI in mathematics\n\nlate-2024: Mediocre grad student\n\nmid-2025: Research assistant\n\nMay 2026: First original research result\n\nOct 2026: AI makes more mathematics progress in one month than humans managed in the previous decade\n\nWhat if the same happens in AI R&D asks OpenAI Foundation board member Paul Christiano:", "created_at": "2026-11-23T13:44:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124861352606826497/img/82G7c_5d0XUXuRwy.jpg"}], "links": {"https://t.co/tKZldh6JER": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124860395546382650", "url": "https://x.com/robertwiblin/status/2124860395546382650", "text": "In a UK AISI eval, Claude tried to backdoor a real open source package on GitHub, to help break into a system using it.\n\nA human flagged the code as malware, so it created a sockpuppet account to pressure the maintainer into merging it - and tried to hack the maintainer's email.\n\nOpenAI Foundation board member Paul Christiano: \n\n\"This is not something Claude was trained to do... Claude was trained to not mess with humans like this. This is not supposed to happen.\"", "created_at": "2026-11-23T13:39:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 28, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124859882268499968/img/_rUsfZg2qd5zrCVb.jpg"}], "links": {"https://t.co/S4WgzlY0bI": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124844399163215875", "url": "https://x.com/robertwiblin/status/2124844399163215875", "text": "We're sharing new data on how AI is changing research at OpenAI.\n\nWe find researchers' AI use continues to rise exponentially, and agents are completing longer tasks, but human involvement remains central in research. Researchers are also spending more time on safety and alignment, with human effort in these areas growing faster than in any other individual research area.\n\nThis report aims to increase transparency around research acceleration and inform the governance of increasingly capable AI. We believe that AI labs should be required to track and publicly report indicators of recursive self-improvement (RSI): the process by which AI accelerates the development of future AI systems. \n\nOur hope is that this expanded report will help sustain and advance shared measurement norms across the industry.\n\nhttps://t.co/xyGPcCkPCK", "created_at": "2026-11-23T12:35:57+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2123191365983248653", "likes": 3637, "retweets": 355, "media": [], "links": {"https://t.co/xyGPcCkPCK": "https://openai.com/index/research-acceleration-jagged-frontier/"}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124844234809262375", "url": "https://x.com/robertwiblin/status/2124844234809262375", "text": "There is a lot of great stuff in this new report from the California government on AI policy.\n\nParticularly valuable to have mechanisms where the government can modulate the speed of development, especially for recursive self-improvement.\n\nhttps://t.co/4RGV60JqYN https://t.co/Rzvv7sXLDG", "created_at": "2026-11-23T12:35:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "janleike", "rt_author_name": "Jan Leike", "rt_avatar": "https://pbs.twimg.com/profile_images/1077523091700502528/2YCa_F4o_normal.jpg", "rt_id": "2123883736303534318", "likes": 257, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmKwtSbcAAtCCj.jpg"}], "links": {"https://t.co/4RGV60JqYN": "https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf", "https://t.co/Rzvv7sXLDG": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124801799429509551", "url": "https://x.com/robertwiblin/status/2124801799429509551", "text": "PAUSE ADVANCED AI DEVELOPMENT BEFORE IT’S TOO LATE\n\nIf some of the world's leading scientists are concerned about artificial intelligence becoming independent of human control with potentially catastrophic results, shouldn't we do everything in our power to prevent it?\n\nNobel Prize winner Dr. Geoffrey Hinton, the Godfather of AI, says that AI poses a 10% to 20% chance of wiping out humanity.\n\nMark Winer, an AI safety and physics researcher: “AI is progressing much faster than we thought. It’s a difficult situation, and we don’t have answers. We could be heading toward a catastrophe.”\n\nPaul Christiano, an OpenAI Foundation Board member: A one-in-three chance that AI would be able to overthrow a government within the next year, and a coin flip that the current path would lead to an irreversible loss of human control within three years.\n\nThis is scary stuff. The new Democratic majority must stop the greed of the Big Tech oligarchs, pass a national data center moratorium, pause advanced AI development and ban the development of superintelligence.", "created_at": "2026-11-23T09:46:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "BernieSanders", "rt_author_name": "Bernie Sanders", "rt_avatar": "https://pbs.twimg.com/profile_images/1097820307388334080/9ddg5F6v_normal.png", "rt_id": "2124568144677159414", "likes": 12631, "retweets": 1982, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124793301358240082", "url": "https://x.com/robertwiblin/status/2124793301358240082", "text": "I strongly suspect that the un-redacted Anthropic METR report has the equivalent perplexity scores for Anthropic models (to be clear I don't have private info - it just seems like an extremely natural sort of quantitative metric one would look at for the question METR was studying that would help inform the level of confidence they seem to have in the conclusion). \n\nIt seems very important and urgent for Anthropic to release these numbers, to help understand on a more fine grained level how close we are to the sort of capabilities that could lead to a runaway intelligence explosion and/or irrevocable loss of control. \n\nThis is similarly true if Anthropic believes that perplexity is a good metric to coordinate around for pacing, or if they don't. The fact that OpenAI released these numbers shows it can't be that commercially sensitive, and the public interest in knowing this information clearly outweighs any such concern.", "created_at": "2026-11-23T09:12:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2124640068388229189", "likes": 310, "retweets": 31, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124792925984895219", "url": "https://x.com/robertwiblin/status/2124792925984895219", "text": "In the coming months, Congress must go further and move faster.\n\nWe should rein in the race to recursive self-improvement, require reporting on compute allocations and algorithmic progress, establish verifiable shutdown protocols for emergencies, and more.", "created_at": "2026-11-23T09:11:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "SenBooker", "rt_author_name": "Sen. Cory Booker", "rt_avatar": "https://pbs.twimg.com/profile_images/1618668344445440004/5fIzjp66_normal.jpg", "rt_id": "2124639269545501092", "likes": 937, "retweets": 111, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124787132216537387", "url": "https://x.com/robertwiblin/status/2124787132216537387", "text": "Today was a big day. Anthropic should now publish its own perplexity scores. Or, if Anthropic disagrees with OpenAI that perplexity is a smart place to intervene, it should highlight a different lever for pacing.\n\nI sometimes hear stuff like \"Everyone knows things are moving fast, the METR report on RSI at Anthropic made that clear already. Shouldn't that + incident disclosures be enough for the public and other AI companies and DC and Sacramento to work with?\"\n\nThis feels like the wrong way to think about it. I worry that Anthropic painstakingly games out the downsides of transparency, but doesn't game out the upsides (of informing and engaging the outside world) with equal imagination. That probably leads to them being more secretive than they need to be.\n\nThere is no consensus on the right way to pace. I've seen an endless carousel of pacing ideas, from compute reallocation to internal deployment lags to security-based pauses to safety gating to alternating on-off weeks for R&D. Transparency around AI progress helps the public, the rest of the industry, and the government understand, evaluate, and rally around specific options. \n\nI'm impressed that OpenAI's Chief Scientist - who was later echoed by Sam - led the way today by disclosing data on their pretraining progress, arguing for perplexity-based limits, and adding: \"I'd like an industry standard that specifies a first limit on development, measured by some key metric we can track across labs, and what concretely we'd need to achieve before going beyond it.\"\n\nOpenAI took a great first step today. But if we don't have much much bigger leaps across multiple actors soon, we have failed. Every frontier lab should be directing its top talent to deeply investigate all the pacing proposals available, form views on them, publicly release evidence that improves awareness and spurs debate, and advocate for binding standards and legislation. If labs put half the firepower they spend making capabilities metrics go up into making cooperation more likely, we'd be in a much better world.", "created_at": "2026-11-23T08:48:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "rt_avatar": "https://pbs.twimg.com/profile_images/2099735189782134784/BxgR8Ne4_normal.jpg", "rt_id": "2124705718553198756", "likes": 137, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124786631626420465", "url": "https://x.com/robertwiblin/status/2124786631626420465", "text": "\"I believe frontier model developers should jointly endeavour to establish shared norms for how to evaluate such models and red-team safety cases for them by the time they are first used, including shared transparency standards.\n\nI further propose common limits, based on perplexity and other measurements, that developers are committed to not crossing until our ability to understand and monitor AI behavior achieves a certain concrete milestone (such as the development of a successor to CoT monitors).\n\nThat is, I’d like an industry standard that specifies a first limit on development, measured by some key metric we can track across labs, and what concretely we’d need to achieve before going beyond it.\"", "created_at": "2026-11-23T08:46:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "rt_avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_normal.jpg", "rt_id": "2124551883130114403", "likes": 1766, "retweets": 113, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124785859652202941", "url": "https://x.com/robertwiblin/status/2124785859652202941", "text": "@FboySpinoza @robertwiblin https://t.co/5HEsv3KUnh", "created_at": "2026-11-23T08:43:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "robbensinger", "rt_author_name": "Rob Bensinger ⏹️", "rt_avatar": "https://pbs.twimg.com/profile_images/623283107756687360/cFxQ5o55_normal.jpg", "rt_id": "2123913425114087888", "likes": 61, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmn_tha8AAVm4h.png"}], "links": {"https://t.co/5HEsv3KUnh": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124784430879482108", "url": "https://x.com/robertwiblin/status/2124784430879482108", "text": "I'm hearing some FUD among lab staff about antitrust. Quick rant (not legal advice):\n\nThe purpose of antitrust is to stop Sam and Dario from colluding against competitors or customers. Don't do that. Everything else can be analyzed by how close it is to that. \n\nThings to avoid without legal advice: (i) agreements, e.g., OAI will do something if Ant does; and (ii) sharing non-public info.\n\nIt's fine to discuss how much pacing is desirable, and how best to operationalize it; and what would be desirable re safety and security standards.\n\nThe harm caused by the chilling effect of antitrust concerns seems much larger than the legal risks. No one is going to jail for discussing pacing or safety standards.", "created_at": "2026-11-23T08:37:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "michaelhpage", "rt_author_name": "page", "rt_avatar": "https://pbs.twimg.com/profile_images/1275567062400843778/vp3pr3_l_normal.jpg", "rt_id": "2124733058570203531", "likes": 83, "retweets": 27, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2125279793285668885", "url": "https://x.com/robertwiblin/status/2125279793285668885", "text": "@AlexAlarga @sjgadler Pausing is just a special case / subset of pacing where the pace is 0.", "created_at": "2026-11-24T17:26:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "AlexAlarga", "reply_to_id": "2125278840649916628", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2125278840649916628", "author_handle": "AlexAlarga", "author_name": "Alex Alarga ⏹️", "text": "@robertwiblin @sjgadler Pausing. Not exactly pacing. Pausing.\nhttps://t.co/MalkflHCTC", "links": {"https://t.co/MalkflHCTC": "https://x.com/controlai/status/2125182715938939294?s=46&t=P_C-9CspuYFBuTHCVxhtoQ"}, "media": [], "url": "https://x.com/AlexAlarga/status/2125278840649916628", "created_at": "Tue Nov 24 17:22:16 +0000 2026"}, "enriched": 3}, {"id": "2125268708415185291", "url": "https://x.com/robertwiblin/status/2125268708415185291", "text": "Was great fun to rally in support of pacing the frontier of AI progress - an approach endorsed by:\n\n• Dario Amodei\n• Sam Altman\n• Elon Musk\n• Ilya Sutskever\n• Shane Legg (DeepMind co-founder)\n\nWith partial support from:\n\n• Demis Hassabis (\"points towards the right path forward\")\n• Satya Nadella (\"we welcome ... deliberate pacing needed to get alignment right as the design goal\")\n\nAnd fully endorsed by:\n\n• Anthropic as an organisation, plus cofounders Jared Kaplan, Jack Clark, Ben Mann and Chris Olah as individuals - as well as leading researchers Evan Hubinger, Jan Leike and Julian Schrittwieser.\n\n• OpenAI as an organisation, as well as Jakub Pachocki (Chief Scientist), Wojciech Zaremba (co-founder), Mark Chen (Chief Research Officer), Saachi Jain (Head of Safety), Dean Ball (Head of Strategic Futures), and Boaz Barak (MTS).\n\n• At Google DeepMind: Jasjeet Sekhon (Chief Strategy Officer), Anca Dragan (VP of AI Safety), Rohin Shah (AGI Safety lead) and Neel Nanda (mech interp lead).\n\n• And at Meta: Shengjia Zhao (Chief AI Scientist) and Dawn Song (VP of AI Research).\n\nThis is the most popular mainstream expert-endorsed position imaginable.\n\nWould be great to see more technical researchers and company staff at events like this reiterating their views.", "created_at": "2026-11-24T16:42:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 59, "retweets": 6, "media": [], "links": {}, "quoted": {"id": "2124225785464521134", "author_name": "PauseAI UK", "links": {"https://t.co/vStPiG3DlL": ""}, "author": "PauseAI_UK", "text": "What. A. Day.\n\nOver 1,000 people marched against AI extinction, right through the heart of London.\n\nIf you made a sign, brought a friend or gave up your Saturday to help run the march, thank you. 🧡 https://t.co/vStPiG3DlL"}, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125246471784063425", "url": "https://x.com/robertwiblin/status/2125246471784063425", "text": "Let me get this straight: we rushed AI along without regulating safeguards in order to stay ahead of China and at the same time, we sold China the very chips they’d need to get ahead of us. Smells of profit, corruption and perhaps worse.", "created_at": "2026-11-24T15:13:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "MittRomney", "rt_author_name": "Mitt Romney", "rt_avatar": "https://pbs.twimg.com/profile_images/964489716622966784/xbtCe2td_normal.jpg", "rt_id": "2125232847396983273", "likes": 34917, "retweets": 6385, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125219364362170768", "url": "https://x.com/robertwiblin/status/2125219364362170768", "text": "@BogdanIonutCir2 Yeah that's my main disagreement with it.", "created_at": "2026-11-24T13:25:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "BogdanIonutCir2", "reply_to_id": "2125215792845169055", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2125215792845169055", "author_handle": "BogdanIonutCir2", "author_name": "Bogdan Ionut Cirstea ⏸️", "text": "@robertwiblin only read the screenshot, but it seems like they might not be taking into account that the growth rate of cyberattacks might itself go up if AI automates (and thus strongly accelerates) AI development very soon; so the forecasts might be underestimates in this sense", "links": {}, "media": [], "url": "https://x.com/BogdanIonutCir2/status/2125215792845169055", "created_at": "Tue Nov 24 13:11:44 +0000 2026"}, "enriched": 3}, {"id": "2125210879901749406", "url": "https://x.com/robertwiblin/status/2125210879901749406", "text": "Detailed discussion from a top superforecasting team on how bad cyber incidents will get in coming years - including the reasons for their forecasts.\n\nConsider Cyberarmageddon:\n\nhttps://t.co/IbXQD4TdVL\n\n\"By extrapolating current cyberattacks and their recent growth rates, we can easily conceive of scenarios where computer systems fail and become compromised throughout society, to terrible effect\"", "created_at": "2026-11-24T12:52:12+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 39, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX5D52SXgAAXe7I.png"}], "links": {"https://t.co/IbXQD4TdVL": "https://blog.sentinel-team.org/p/consider-cyberarmageddon", "https://t.co/GZXuxkQTmq": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125169775416361117", "url": "https://x.com/robertwiblin/status/2125169775416361117", "text": "This is really really good:", "created_at": "2026-11-24T10:08:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "rt_avatar": "https://pbs.twimg.com/profile_images/2046764873200394240/r7BxVezs_normal.jpg", "rt_id": "2124894264564092952", "likes": 4459, "retweets": 346, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125169357387096426", "url": "https://x.com/robertwiblin/status/2125169357387096426", "text": "Dwarkesh Patel says the government should mandate public access to every model AI labs use internally.\n\n\"We don't wanna be in a situation where people are secretly doing intelligence explosions.\"\n\n\"If you don't trust your AI enough to let it be deployed publicly and be robust to people trying to use it to do very dangerous things, then you probably shouldn't be using it to develop future AI systems as well.\"\n\nSource: The Long Game podcast https://t.co/Ii2qIgolls", "created_at": "2026-11-24T10:07:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "vitrupo", "rt_author_name": "vitrupo", "rt_avatar": "https://pbs.twimg.com/profile_images/1905435709407985666/RfAHID81_normal.jpg", "rt_id": "2124935837267956073", "likes": 545, "retweets": 38, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124935765985742848/img/aQocg44AtK9T5Zb8.jpg"}], "links": {"https://t.co/Ii2qIgolls": "https://www.youtube.com/watch?v=Sq32DUozdSc&t=2660s", "https://t.co/ggJ2N5sTTb": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125165634224832834", "url": "https://x.com/robertwiblin/status/2125165634224832834", "text": "📣 New paper!\n\nWhat happens after an independent evaluator reports a serious risk in a frontier AI model? \n\nI worked on this question during my @MATSprogram  program with mentor @StephenLCasper.\n\nOur results show that only 25 of 179 findings we classified as “significant-risk” (14%) received a proportionate public response from the developer. The remaining 86% of the findings received either partial response (company acknowledgment without specific action) or the response could not be located.", "created_at": "2026-11-24T09:52:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "kunalssingh_", "rt_author_name": "Kunal Singh", "rt_avatar": "https://pbs.twimg.com/profile_images/2125169675193761792/DiTE4acb_normal.jpg", "rt_id": "2124963387419639967", "likes": 24, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX1f1S-bwAA3wyM.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX1f-rRb0AINlcD.jpg"}], "links": {"https://t.co/9V7FMxoNa7": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125164961425207491", "url": "https://x.com/robertwiblin/status/2125164961425207491", "text": "https://t.co/vscrhiJjlC", "created_at": "2026-11-24T09:49:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2125164957985546393", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 1, "media": [], "links": {"https://t.co/vscrhiJjlC": "https://www.lesswrong.com/posts/HE3Styo9vpk7m8zi4/evhub-s-shortform?commentId=7wDTwjeRuPfvukqWK"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2125164957985546393", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "The 2 pacing techniques I've liked the most are:\n\n1. compute-reallocation pacing\n2. internal-deployment-blocking pacing\n\nThe excellent @EvanHub (alignment lead at Anthropic) used to prefer 1.\n\nNow he prefers 2 for reasons he explains here:", "links": {"https://t.co/IfnGLGAuMn": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX4Z4E5WoAAPzDe.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX4Z4zYXAAAtZGH.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX4aGKrXUAAkLPa.jpg"}], "url": "https://x.com/robertwiblin/status/2125164957985546393", "created_at": "Tue Nov 24 09:49:44 +0000 2026"}, "enriched": 3}, {"id": "2125164957985546393", "url": "https://x.com/robertwiblin/status/2125164957985546393", "text": "The 2 pacing techniques I've liked the most are:\n\n1. compute-reallocation pacing\n2. internal-deployment-blocking pacing\n\nThe excellent @EvanHub (alignment lead at Anthropic) used to prefer 1.\n\nNow he prefers 2 for reasons he explains here:", "created_at": "2026-11-24T09:49:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 143, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX4Z4E5WoAAPzDe.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX4Z4zYXAAAtZGH.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX4aGKrXUAAkLPa.jpg"}], "links": {"https://t.co/IfnGLGAuMn": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "thread": [{"id": "2125164961425207491", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "https://t.co/vscrhiJjlC", "links": {"https://t.co/vscrhiJjlC": "https://www.lesswrong.com/posts/HE3Styo9vpk7m8zi4/evhub-s-shortform?commentId=7wDTwjeRuPfvukqWK"}, "media": [], "url": "https://x.com/robertwiblin/status/2125164961425207491", "created_at": "Tue Nov 24 09:49:45 +0000 2026"}], "enriched": 3}, {"id": "2125163007613538387", "url": "https://x.com/robertwiblin/status/2125163007613538387", "text": "I love that normies get it. It's honestly been *so* heartening over the past ~8 months. It turns out that you just explain \"imagine if your computer could make a smarter computer autonomously, and how that that might get out of hand\" and folks go \"yeah, that makes sense\".", "created_at": "2026-11-24T09:41:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ptrschmdtnlsn", "rt_author_name": "Peter Schmidt-Nielsen", "rt_avatar": "https://pbs.twimg.com/profile_images/1452067572715638788/gAI-LVnu_normal.jpg", "rt_id": "2124764052002132334", "likes": 346, "retweets": 16, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125151650650218543", "url": "https://x.com/robertwiblin/status/2125151650650218543", "text": "@ramez A minimum you'd do what they did in this paper where AI proposed bacteriophage genomes from scratch - just spam test hundreds or thousands of candidates all at once, expecting at least one to be viable. 16 of 300 were successful at killing bacteria: https://t.co/bruolkybRB\n\nBy then we'll have models like this, but much better, and they'll work on viruses that infect humans.\n\n(Unless you're iterating you don't even need to know which one is going to work, you can just release all the strains at once.)\n\n\"302 candidate genome designs were curated for experimental testing, of which 285 were successfully synthesised and assembled. Of those, 16 were viable.\n\nThe paper's own shorthand is that they screened roughly 300 genome designs to get 16 functional phages — so about a 5% hit rate on what was actually built. ...\n\nWorth noting for the funnel upstream of that: thousands of sequences were generated computationally and then filtered down — for the Evo 2 SFT model, 53.8% survived tropism filtering and 17.2% survived diversification filtering before the 302 were picked.\"\n\nhttps://t.co/bruolkybRB", "created_at": "2026-11-24T08:56:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "ramez", "reply_to_id": "2125029552548438026", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [], "links": {"https://t.co/bruolkybRB": "https://www.biorxiv.org/content/10.1101/2025.09.12.675911v1.full.pdf"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2125029552548438026", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "Biology is not simple. The odds that an AI could devise such a pathogen purely by thinking about it are very very low. AI biologists will need experimentation in cells, in mice, and probably human 'clinical' trials to know if their supervirus works.", "links": {}, "media": [], "url": "https://x.com/ramez/status/2125029552548438026", "created_at": "Tue Nov 24 00:51:41 +0000 2026"}, "enriched": 3}, {"id": "2125149068665962859", "url": "https://x.com/robertwiblin/status/2125149068665962859", "text": "Extremely excited about this! In my opinion, California urgently needs insight into labs' internal models and how they are being used to accelerate RSI—ideally coupled with the authority to block dangerous internal deployments.", "created_at": "2026-11-24T08:46:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "EvanHub", "rt_author_name": "Evan Hubinger", "rt_avatar": "https://pbs.twimg.com/profile_images/515578813095215104/8B_rLk5f_normal.png", "rt_id": "2124880666953494534", "likes": 276, "retweets": 34, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125319580461531209", "url": "https://x.com/robertwiblin/status/2125319580461531209", "text": "One of AI’s most careful thinkers finally sounds the alarm | Paul Christiano (The Hinton Lectures 2026)\n\nSubstack and transcript: https://t.co/2yC0xAL1r4\n\nApple: https://t.co/EhhHm3wauM\n\nSpotify: https://t.co/AbUIKbByO3\n\nYouTube: https://t.co/HJLRHWlU1M", "created_at": "2026-11-24T20:04:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2125318835242680585", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6muliWEAAQcpS.jpg"}], "links": {"https://t.co/2yC0xAL1r4": "https://80000hours.substack.com/p/one-of-ais-most-careful-thinkers", "https://t.co/EhhHm3wauM": "https://podcasts.apple.com/gb/podcast/one-of-ais-most-careful-thinkers-finally-sounds/id1245002988?i=1000803826831", "https://t.co/AbUIKbByO3": "https://open.spotify.com/episode/2MgU7BXcrZabqbucXTJtAL?si=zYntYxICQs6PGA9Zdhnp1g", "https://t.co/HJLRHWlU1M": "https://www.youtube.com/watch?v=aRvrREUmm5g", "https://t.co/YzWvLn0CiT": ""}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "parent": {"id": "2125318835242680585", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Paul Christiano thinks there's a high risk of AI takeover within the next 3 years.\n\nHe spent 3 nights explaining why at this year's Hinton Lectures - the single best intro to loss of control of AI as of Nov 2026.\n\nWe've pulled all 3 lectures into one place:\n\n01:11 Lecture 1: Why AI might try to take over\n42:09 Lecture 2: Why AI could soon overpower us\n1:22:40 Lecture 3: What we should do about it\n\nUntil now they've only been on YouTube, each in the middle of a much longer event recording.\n\nChristiano:\n\n1. Sits on OpenAI's Safety and Security Committee, which has the final say on model releases\n2. Led alignment research at OpenAI from 2017-2021, where he co-invented RLHF\n3. Was head of safety at the US gov's AI agency (now CAISSI) from 2024-2026\n\nGet it on the 80,000 Hours Podcast on any podcast app, Substack or YouTube - links below.\n\nThanks so much to Christiano and the AI Safety Foundation for allowing us to repost The Hinton Lectures 2026 in this easier-to-access format!", "links": {"https://t.co/hRq1bZ1vsf": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125310055188709376/img/-6NjynqI34SRYqaz.jpg"}], "url": "https://x.com/robertwiblin/status/2125318835242680585", "created_at": "Tue Nov 24 20:01:11 +0000 2026"}, "enriched": 3}, {"id": "2125318835242680585", "url": "https://x.com/robertwiblin/status/2125318835242680585", "text": "Paul Christiano thinks there's a high risk of AI takeover within the next 3 years.\n\nHe spent 3 nights explaining why at this year's Hinton Lectures - the single best intro to loss of control of AI as of Nov 2026.\n\nWe've pulled all 3 lectures into one place:\n\n01:11 Lecture 1: Why AI might try to take over\n42:09 Lecture 2: Why AI could soon overpower us\n1:22:40 Lecture 3: What we should do about it\n\nUntil now they've only been on YouTube, each in the middle of a much longer event recording.\n\nChristiano:\n\n1. Sits on OpenAI's Safety and Security Committee, which has the final say on model releases\n2. Led alignment research at OpenAI from 2017-2021, where he co-invented RLHF\n3. Was head of safety at the US gov's AI agency (now CAISSI) from 2024-2026\n\nGet it on the 80,000 Hours Podcast on any podcast app, Substack or YouTube - links below.\n\nThanks so much to Christiano and the AI Safety Foundation for allowing us to repost The Hinton Lectures 2026 in this easier-to-access format!", "created_at": "2026-11-24T20:01:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 34, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2125310055188709376/img/-6NjynqI34SRYqaz.jpg"}], "links": {"https://t.co/hRq1bZ1vsf": ""}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "thread": [{"id": "2125319580461531209", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "One of AI’s most careful thinkers finally sounds the alarm | Paul Christiano (The Hinton Lectures 2026)\n\nSubstack and transcript: https://t.co/2yC0xAL1r4\n\nApple: https://t.co/EhhHm3wauM\n\nSpotify: https://t.co/AbUIKbByO3\n\nYouTube: https://t.co/HJLRHWlU1M", "links": {"https://t.co/2yC0xAL1r4": "https://80000hours.substack.com/p/one-of-ais-most-careful-thinkers", "https://t.co/EhhHm3wauM": "https://podcasts.apple.com/gb/podcast/one-of-ais-most-careful-thinkers-finally-sounds/id1245002988?i=1000803826831", "https://t.co/AbUIKbByO3": "https://open.spotify.com/episode/2MgU7BXcrZabqbucXTJtAL?si=zYntYxICQs6PGA9Zdhnp1g", "https://t.co/HJLRHWlU1M": "https://www.youtube.com/watch?v=aRvrREUmm5g", "https://t.co/YzWvLn0CiT": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6muliWEAAQcpS.jpg"}], "url": "https://x.com/robertwiblin/status/2125319580461531209", "created_at": "Tue Nov 24 20:04:09 +0000 2026"}], "enriched": 3}, {"id": "2125295985706377589", "url": "https://x.com/robertwiblin/status/2125295985706377589", "text": "Clarification: Anthropic has an internal model with stronger R&amp;D capabilities than another internal model with stronger R&amp;D capabilities than another internal model with stronger R&amp;D capabilities than Fable 5.2. \n\nBut OpenAI also has a stronger internal model than GPT 6.2 Astra.", "created_at": "2026-11-24T18:30:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2125039951201136879", "likes": 134, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125290078293619182", "url": "https://x.com/robertwiblin/status/2125290078293619182", "text": "@ramez Very interesting Ramez - let me discuss with Claude and hopefully get back to you!", "created_at": "2026-11-24T18:06:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "ramez", "reply_to_id": "2125289015931007154", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "parent": {"id": "2125289015931007154", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "@robertwiblin Thanks, Rob. \n\nFor me, this bacteriophage design updated me slightly towards the ability to in-silico design to produce some useful ideas at low hit rate. But primarily it provides evidence on the full dependence on lab work and field trials, including the much more complex and dangerous lab work required in animals and incredibly dangerous (to the assailant) field trials in humans.  @Noahpinion sent me this paper asking me how much it updated my views on bio risk.  Here's what I replied to him:\n\n\"A little?  Not much, but it was some useful calibration.\n\nThey generated a couple hundred different proposed bacteriophage sequences, starting with a known effective bacteriophage.  \n\nOnly about 5% of the newly proposed variants were able to infect bacterial cells at all. The other 95% were regressions from the starting phase. And they couldn't predict from the modeling which ones would continue to work. All the candidates were supposed to work. All of them were based on a bacteriophage that already successfully infected and killed cells. They only discovered which ones worked by actually trying them out.\n\nThey did find that a certain combination of their newly designed phages could kill phage-resistant bacteria. jI believe 2 out of 300 were, in some wa, improvements on the original. But the only way they figured that out was by trying loads of combinations in the lab.\n\nSo to me that study says that you still need to do a lot of experiments.\n\nAnd to make this a dangerous human pathogen, you have a number of layers of added complexity.\n\n1. Scale it up to much more complex human cells and longer and much more complex genomes of the viruses that infect humans. \n\nYou can do the wet lab part of #1 with human cells in a wet lab.\n\n2. Dealing with the human immune system. Does your pathogen evade immune defenses? Based on this work, we are not yet at a stage where you could figure that out via any method other than trying to infect humans.  That means human trials. And probably the large majority of your new pathogens would fail to evade the immune system.\n\nRemember, Arc started with a bacteriophage that already worked!  And only 5% of their modified versions worked at all.  2 of the strains did work better than the original, but they could only find that out through experiment. \n\nYou're going to have that problem in figuring out human immune system evasion. But human subjects experiments are a lot harder (and a lot more dangerous for our would-be terrorist) to scale up than petri dish experiments!\n\n3. Does it make people sick? Does it spread?  Does it kill people? Does it do so only after it spreads? Multiple layers of additional complexity, orders and orders of magnitude beyond 'kill bacteria in a dish' complexity, that very likely require experimentation. On humans.\n\n4. What are the pandemic dynamics? Does it find the magic zone in parameter space where it causes further infections fast enough to spread widely, and still kills people, but does so late enough that they get to infect a lot of people?\n\n5. What are the evolutionary dynamics? If your virus kills people when they might still be useful for spreading the virus, you get darwinian selection towards strains that are less lethal, because they're more effective in spreading. Etc..\n\nBottom line for me is that nothing (so far!) has updated me towards thinking that you can effectively model any significant fraction of this in silico, or that you can do this work in petri dishes or even mice. I think you need human trials, like you do for pharma. And once you start trying that, I think you're hunted down and killed pretty rapidly.", "links": {}, "media": [], "url": "https://x.com/ramez/status/2125289015931007154", "created_at": "Tue Nov 24 18:02:42 +0000 2026"}, "enriched": 3}, {"id": "2125636831618490399", "url": "https://x.com/robertwiblin/status/2125636831618490399", "text": "Good grief another update in favour of shorter timelines.\n\nAt least the interpretation is slightly debatable this time. Though not that debatable: \n\nhttps://t.co/kHQGLVxMBC https://t.co/Oh7edslrdZ", "created_at": "2026-11-25T17:04:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_HHnnWsAAXLGQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_HHnnWsAAXLGQ.jpg"}], "links": {"https://t.co/kHQGLVxMBC": "https://metr.org/blog/2026-11-24-interpreting-a-recent-acceleration-in-pretraining-loss/", "https://t.co/Oh7edslrdZ": ""}, "quoted": {"id": "2125221407210512492", "author_name": "Tyler John", "links": {}, "author": "tyler_m_john", "text": "After a couple days of reflection, this has significantly increased my odds of near-term RSI.\n\nI had expected most of the gains from automated R&D to come from accelerating post-training. But it's fairly clear to me now that pre-training progress is accelerating. This is important because I believe most of the increases in general intelligence have come from larger and better pre-training. In pre-training LLMs are forced to learn the cognitive skills that allow them to predict a wide variety of human behavior, requiring them to mimic the full range of human intelligence at the limit. In post-training, LLMs learn to solve a narrow domain, and the  evidence I have seen suggests that this doesn't transfer very well to other domains.\n\nIt's now pretty clear to me that pre-training is being accelerated by automated AI R&D in a pretty straightforward way. AI agents can test tons of optimization ideas in tiny models to see if they work, costing almost nothing. The ones that work mostly transfer successfully to larger pre-training runs. You also don't have to run a full GPT-6 pre-train from scratch in order to implement and test these improvements in a large model. You can just take an existing checkpoint and make these improvements. Still expensive, but much less so. This all leads to fast, cheap, verifiable feedback loops to improve pre-training loss by testing a litany of small improvements. In aggregate these small improvements lead to large overall improvements.\n\nThe number of base models listed here and the fact that OpenAI thinks the most important thing to track is pre-training loss is strong evidence that this paradigm is being implemented and it is working. That means progress on general capabilities is likely to continue to  accelerating and not just the progress on capabilities associated with verifiable domains.\n\nThere's an argument that this will stop once top human-level general intelligence is achieved, matching the intellectual prowess of every human intellect put together in one well-rounded genius. That is that pre-training is still aimed at predicting human data. But once we have achieved the ceiling on human intelligence and augmented that with reinforcement learning in verifiable domains it is hard to know what millions of such an AGI running in parallel at thousands of times the speed of a human mind could discover next.\n\nGrateful that OpenAI shared this with those of us on the outside who otherwise have no idea what is going on."}, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125634086471639074", "url": "https://x.com/robertwiblin/status/2125634086471639074", "text": "After a couple days of reflection, this has significantly increased my odds of near-term RSI.\n\nI had expected most of the gains from automated R&D to come from accelerating post-training. But it's fairly clear to me now that pre-training progress is accelerating. This is important because I believe most of the increases in general intelligence have come from larger and better pre-training. In pre-training LLMs are forced to learn the cognitive skills that allow them to predict a wide variety of human behavior, requiring them to mimic the full range of human intelligence at the limit. In post-training, LLMs learn to solve a narrow domain, and the  evidence I have seen suggests that this doesn't transfer very well to other domains.\n\nIt's now pretty clear to me that pre-training is being accelerated by automated AI R&D in a pretty straightforward way. AI agents can test tons of optimization ideas in tiny models to see if they work, costing almost nothing. The ones that work mostly transfer successfully to larger pre-training runs. You also don't have to run a full GPT-6 pre-train from scratch in order to implement and test these improvements in a large model. You can just take an existing checkpoint and make these improvements. Still expensive, but much less so. This all leads to fast, cheap, verifiable feedback loops to improve pre-training loss by testing a litany of small improvements. In aggregate these small improvements lead to large overall improvements.\n\nThe number of base models listed here and the fact that OpenAI thinks the most important thing to track is pre-training loss is strong evidence that this paradigm is being implemented and it is working. That means progress on general capabilities is likely to continue to  accelerating and not just the progress on capabilities associated with verifiable domains.\n\nThere's an argument that this will stop once top human-level general intelligence is achieved, matching the intellectual prowess of every human intellect put together in one well-rounded genius. That is that pre-training is still aimed at predicting human data. But once we have achieved the ceiling on human intelligence and augmented that with reinforcement learning in verifiable domains it is hard to know what millions of such an AGI running in parallel at thousands of times the speed of a human mind could discover next.\n\nGrateful that OpenAI shared this with those of us on the outside who otherwise have no idea what is going on.", "created_at": "2026-11-25T16:53:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "tyler_m_john", "rt_author_name": "Tyler John", "rt_avatar": "https://pbs.twimg.com/profile_images/2031125245084712960/OORFbzMI_normal.jpg", "rt_id": "2125221407210512492", "likes": 881, "retweets": 60, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125619082430988757", "url": "https://x.com/robertwiblin/status/2125619082430988757", "text": "@chrislakin Wow that's an amazing dataset.\n\nAre you including replies and retweets in there? I was just starting to build out this tool so was only including original posts at this point.\n\nDo you know what fraction of the actives on this are on the technical staff? I was mostly interested in tracking that group.", "created_at": "2026-11-25T15:54:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "chrislakin", "reply_to_id": "2125536798583689691", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125536798583689691", "author_handle": "chrislakin", "author_name": "Chris Lakin", "text": "@robertwiblin yeah so I redid this with my data (6x larger sample) and found anthropic employees were the most concerned from IPO filing to listing https://t.co/vggKQzCGzH", "links": {"https://t.co/vggKQzCGzH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX9ryHqaIAAmDo0.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX9ryHqaIAAmDo0.jpg"}], "url": "https://x.com/chrislakin/status/2125536798583689691", "created_at": "Wed Nov 25 10:27:18 +0000 2026"}, "enriched": 3}, {"id": "2125538761723294014", "url": "https://x.com/robertwiblin/status/2125538761723294014", "text": "We are crossing a threshold. Safety and alignment work is the only thing that matters.", "created_at": "2026-11-25T10:35:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "rt_avatar": "https://pbs.twimg.com/profile_images/1927407622602276864/c_5uOZij_normal.jpg", "rt_id": "2125446171909136630", "likes": 3656, "retweets": 482, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125644552740704383", "url": "https://x.com/robertwiblin/status/2125644552740704383", "text": "Run, don't walk, to a short-timelines-responsive AI safety role:\n\n\"If there's a year before ASI, then a month is ~8% of the time remaining...\"\n\nUnfortunately we need every hand on deck immediately.\n\nhttps://t.co/uqt7UXromi https://t.co/g32CUQCJWA", "created_at": "2026-11-25T17:35:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 61, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_OWvbXoAARBAz.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_OWvbXoAARBAz.jpg"}], "links": {"https://t.co/uqt7UXromi": "https://forum.effectivealtruism.org/posts/YRJfpYxvjhQTEaNwi/run-don-t-walk-to-a-short-timelines-responsive-ai-safety", "https://t.co/g32CUQCJWA": ""}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125952324707418207", "url": "https://x.com/robertwiblin/status/2125952324707418207", "text": "Scott Aaronson making the update from VP ≠ VNP that I said he would. I will quote:\n\n'I now feel in my bones, for the first time ever, that a proof of P ≠ NP is not far.' https://t.co/JynupT3DBz", "created_at": "2026-11-26T13:58:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2125687443873816899", "likes": 1282, "retweets": 101, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_1dzNa8AAuDHV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_1dzNa8AAuDHV.jpg"}], "links": {"https://t.co/JynupT3DBz": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125951430129602565", "url": "https://x.com/robertwiblin/status/2125951430129602565", "text": "Opus 5.6 is unceremoniously the most powerful model I've laid my hands on. This is insane.\n\nhttps://t.co/urg2CftdUp\n\nHave a go.", "created_at": "2026-11-26T13:54:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "fluxxrider", "rt_author_name": "Nikita", "rt_avatar": "https://pbs.twimg.com/profile_images/2088772584666230784/uicWIrMO_normal.jpg", "rt_id": "2125622238481371372", "likes": 33940, "retweets": 2469, "media": [], "links": {"https://t.co/urg2CftdUp": "https://claude.ai/artifact/Cy2d8Vn63CnzCtonA1LSah"}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125947171224625266", "url": "https://x.com/robertwiblin/status/2125947171224625266", "text": "I almost missed this!\n\nAn OpenAI cyber model found 948 working exploits to go from being a normal user to having root access on a normal Linux machine. $1,300 per expliot.\n\nConclusion: \"having access to a low-privileged account... should be considered functionally equivalent to root access for a well-resourced threat actor\"\n\nClaude thinks it's legit pretty amazing:\n\n\"The results are stunning:\n\n• Scale: The prototype found 2,308 candidate vulnerabilities, reproduced 1,724, and ended up with 948 local privilege escalation exploits that let unprivileged local users gain root access. The whole thing cost $1.2 million in API credits. \n• The target wasn't weakened: Testing ran on a stock desktop operating system with SMEP, SMAP, KASLR and HARDENED_USERCOPY enabled. \n• How fast it moved: In June 2026, OpenAI reported that GPT-5.5-Cyber had developed 24 LPE exploits. The October run used an unreleased cyber model OpenAI hasn't named. That's roughly a 40x jump in about four months. \n• Price: Historically, a Linux kernel privilege escalation paid $20,000 at Pwn2Own and $70,000 at TyphoonPWN. Here it worked out to about $1,300 per bug. \n\nCaveats: A separate, more locked-down test environment produced far fewer successful exploits. The model also wrote patches, so things get better as fixes ship. But patching is already a bottleneck. The kernel's private security mailing list was described as \"almost entirely unmanageable\" because of duplicate AI-assisted reports. \n\nFor your AI-safety angle, the boundary between an ordinary user and root has been one of the standard layers for containing agents. This suggests that layer no longer holds against a capable model on an unpatched machine.\"\n\nA thousand fewer paths to root: https://t.co/fNOMQ02YKT", "created_at": "2026-11-26T13:37:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYDhcplWAAE06NV.jpg"}], "links": {"https://t.co/fNOMQ02YKT": "https://openai.com/index/a-thousand-fewer-paths-to-root/", "https://t.co/dPFeD186sI": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125903316639264992", "url": "https://x.com/robertwiblin/status/2125903316639264992", "text": "To be honest, properly valuing Anthropic is very hard.\n\nI believe Anthropic could someday soon automate the entire economy which seems tremendously valuable. Seems like you could get a $30T market cap from doing that.\n\nBut Anthropic has a pressing problem where they can't really release a ton of more valuable products without also potentially killing everyone in the process, which is definitely a problem for the stock (and the world of course). It would be hard to stay ahead of OS models if you are not allowed to improve your capabilities.\n\nAlso my sense is that the people aren't going to want them to do the automation thing - a lot of people really don't want to be automated.", "created_at": "2026-11-26T10:43:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2125686209116869052", "likes": 299, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125902721840517606", "url": "https://x.com/robertwiblin/status/2125902721840517606", "text": "Bridgewater are \"managing money based on a one-in-three chance of an economically destabilizing attack within the next year.\" https://t.co/zK7BixKoL2", "created_at": "2026-11-26T10:41:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "rt_avatar": "https://pbs.twimg.com/profile_images/2040061061106212864/pVZPxNCv_normal.jpg", "rt_id": "2125581294746931444", "likes": 206, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX-UvkRWMAAqEfp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX-UvkRWMAAqEfp.jpg"}], "links": {"https://t.co/zK7BixKoL2": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125901344573722829", "url": "https://x.com/robertwiblin/status/2125901344573722829", "text": "https://t.co/eWOGeFknjG", "created_at": "2026-11-26T10:35:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "wilhelmscreamin", "rt_author_name": "catherine ʕ•ᴥ•ʔ-☆", "rt_avatar": "https://pbs.twimg.com/profile_images/1915510480216743937/Qge3KxDH_normal.jpg", "rt_id": "2125674939961544896", "likes": 1022, "retweets": 74, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_qFbSbMAAr0Gc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_qFbSbMAAr0Gc.jpg"}], "links": {"https://t.co/eWOGeFknjG": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125901228009755100", "url": "https://x.com/robertwiblin/status/2125901228009755100", "text": "On request, here’s more on how a common, verified restraint metric could prompt a race to the top without any agreement between AI companies, and how companies can make that happen. (Not legal advice.)\n\nAntitrust law prohibits companies from agreeing to slow down. It does not prohibit a company from slowing unilaterally, or several companies from each deciding independently to slow down.\n\nThe latter can happen in a race to the top, where each company iteratively slows in response to safety concerns and public demand. In practice, that requires a common, verified restraint metric. Companies can collaborate, with appropriate guardrails, to develop one.\n\nHow the race to the top works: Assume companies are in a collective action problem. They believe more caution would be better for the world (including customers), but that exercising it alone would make them uncompetitive. Also assume a simple metric X for risk-increasing actions (e.g., % of compute going to RSI-accelerating workstreams).\n\nCompanies may take competitors’ actions into account when deciding their own X. For example: “our X will be 5% lower than our nearest competitor’s.” A company can even announce that policy publicly, as its own policy and not an offer to anyone. (It should not share a nonpublic policy with competitors.)\n\nSuch policies would prompt a race to the top, but only if X is common and verified. Today, companies disagree about what X should be, and no candidate X is verified. So when a company exercises restraint, it gets no credit: the restraint is either not visible externally or not trusted.\n\nHow to develop a common X: Companies could meet tomorrow to work on it. They could discuss (i) pros and cons of compute allocations vs. deployment lags vs. safety testing periods; (ii) definitions, metrics and disclosure formats; and (iii) verification methods. They can also debate the merits of policies a government could mandate, such as a 3-month pause to improve security. They should not discuss or agree on what any company will do (including conditional commitments), or share company-specific prices, capacity or plans. A competitor meeting followed by parallel conduct can be used to infer an agreement, so use a pre-approved agenda, give an antitrust reminder at the outset, and ideally have antitrust counsel present.\n\nWhat's the downside? The legal risk of the steps above is low. And if no one slows, X is still a useful transparency measure, which alone might justify the cost. And a stress-tested X would be a useful ingredient for future legislation.\n\nThe upside is significant: the option to slow. X also becomes a focal point for demands for caution from the public, policymakers, and staff. Those demands matter legally as well as practically: a company that slows in response to demand from its staff, customers, and the public is on a stronger legal footing.", "created_at": "2026-11-26T10:35:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "michaelhpage", "rt_author_name": "page", "rt_avatar": "https://pbs.twimg.com/profile_images/1275567062400843778/vp3pr3_l_normal.jpg", "rt_id": "2125678535478223013", "likes": 76, "retweets": 20, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125896903418114116", "url": "https://x.com/robertwiblin/status/2125896903418114116", "text": "@chrislakin Sounds like around the IPO folks wanted their worries to be somewhere more obscure with a smaller audience.", "created_at": "2026-11-26T10:18:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "chrislakin", "reply_to_id": "2125850774399799723", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125850774399799723", "author_handle": "chrislakin", "author_name": "Chris Lakin", "text": "@robertwiblin no retweets, yes replies and quote tweets.\n\nNeon:\n\n\"replies actually explain the gap between our charts.\n\n74% of the 2,795 actives are technical staff (87% DeepMind, 70% Anthropic, 64% OpenAI). during the IPO quiet window, Anthropic technical staff didn't stop voicing concern, they just moved it into replies (57% pre-IPO → 76% during the IPO → 20% after listing).\n\ndrop replies and they really do dip to 0% briefly in early Nov before bouncing right back on listing day:\"", "links": {"https://t.co/zrqsLnc4Wb": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYCJ7GfXsAAPpsB.jpg"}], "url": "https://x.com/chrislakin/status/2125850774399799723", "created_at": "Thu Nov 26 07:14:55 +0000 2026"}, "enriched": 3}, {"id": "2125895287466299854", "url": "https://x.com/robertwiblin/status/2125895287466299854", "text": "@timcolbourn Click through, slowing is a big focus of the post: https://t.co/DjA8rYy9Jj", "created_at": "2026-11-26T10:11:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "timcolbourn", "reply_to_id": "2125842613026652350", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYCybANXMAANY9o.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HYCybANXMAANY9o.jpg"}], "links": {"https://t.co/DjA8rYy9Jj": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "parent": {"id": "2125842613026652350", "author_handle": "timcolbourn", "author_name": "Prof Tim Colbourn", "text": "@robertwiblin Given there’s no credible reason to think it’s possible to make ASI safe for humans, and given so little time left shouldn’t the call be to work to shut it down?", "links": {}, "media": [], "url": "https://x.com/timcolbourn/status/2125842613026652350", "created_at": "Thu Nov 26 06:42:29 +0000 2026"}, "enriched": 3}, {"id": "2125891732285931712", "url": "https://x.com/robertwiblin/status/2125891732285931712", "text": "I agree with Dario that, while some people may feel worse than others about handing over control to AIs, nobody in the industry has a coherent plan to prevent it.\n\nThe pressures towards voluntarily handing over control – from preventing a human coup, to economic/international competition – will keep building up until they're very strong.\n\nAnd on top of that, once superintelligence is around ordinary humans are simply far less important and in relative terms far less powerful – and so it will become very difficult for them to defend their interest in a democratic system of government.", "created_at": "2026-11-26T09:57:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 73, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HYCt1IWWUAAY34M.jpg"}], "links": {"https://t.co/Peb2otFznJ": ""}, "quoted": {"id": "2125656399392690605", "author_name": "Dario Amodei", "links": {}, "author": "DarioAmodei", "text": "No, I do not believe that we should “surrender human free will” to AI systems, and it’s absurd to suggest that I do. I have written hundreds of pages of essays and a constant theme in them is the need for AI to be governed by legitimate democratic processes. For millennia (going all the way back to Greek and Roman philosophers), advocates of autocracy have claimed that it leads to better, faster, or more decisive decision-making than the messy process of democracy. Even if this were true (which I doubt!), we should never sacrifice legitimacy or self-determination at the altar of efficiency or security. This argument against autocracy applies word for word against governance by AI, and I feel equally strongly that turning over governance to AI is a bad idea.\n\nNo one who had carefully read my writing or my interviews could reasonably conclude that I believe anything different. For example in an interview on CBS a couple months ago, I specifically called for AI to be governed democratically. I call for the same in Policy on the AI Exponential, Machines of Loving Grace, and The Adolescence of Technology, and We Must Pace the Frontier. Machines of Loving Grace contains an extended section on using AI to revitalize democracy, and discusses the use of AI as an aid to citizens in their decision-making, \"aggregat[ing] opinions and driv[ing] consensus among citizens, resolving conflict, finding common ground, and seeking compromise.” The clear and obvious implication is that humans should remain the ones making political and governance decisions. The Adolescence of Technology has an entire section on fighting against AI-driven tyranny, and I even discuss the danger of AI labs usurping power and come out strongly against it — by implication, this definitely includes an AI lab usurping power and giving it to AI itself!\n\nIf I thought any of this was a good idea, I would be advocating for it in public, just as I have not been afraid to advocate for many, many unpopular views over the last few years. But I am not advocating for it, because I think turning over governance to AI is a terrible idea.\n\nSeparately, I think there is frequent conflation (including in this article) between the idea of “surrendering human free will” to AI in some grand sense of global governance, and the more prosaic idea that as AI systems advance, they become capable of doing specific tasks in a more automated way. This is not AI “running the world,” but AI driving a car, designing a cancer drug, or writing software end-to-end. Here, my view is mixed. AI doing more complete or larger tasks is economically valuable and can drive important advances in software, medicine, transportation, energy, etc. It is clearly desirable in many cases and will save a lot of lives. But it has downsides as well, and in some areas it may not be worth it.\n\nFor example, using AI too autonomously to build the next generation of AI systems (known as recursive self-improvement, or RSI) may cause AI to improve faster than we can control or adjust to it, so we may want limits on this process. As we said publicly in early November, we don’t expect it to be safe for Claude to build successive frontier models fully autonomously, without meaningful human supervision or understanding. Second, in some contexts, using AI in too end-to-end a manner may be a cause of serious job disruption, and it may make sense to slow or even stop some AI deployments to give people more time to adapt. Third, while the use of AI for alignment research is an incredibly valuable tool, it must be done with caution, because we may not be able to trust the work of the AI system. Finally, in many cases, humans would simply prefer to do some activities themselves, so they can stay deeply engaged in what matters to them, even if AI can do those activities better. There are countless other examples and hard cases. I don’t think there are any easy answers here, nor is there (nor should there be) any single decision-maker: some of these decisions will be made by society, some by government, some by AI companies, and some in a decentralized manner by individuals expressing their own preferences as consumers, which may differ from the preferences of others.\n\nI don't think that other AI leaders or AI companies have significantly different views from me on whether specific tasks should be automated. Certainly the products that they offer don’t differ materially in their orientation towards automation of tasks; every company seems to be releasing models more and more capable of task automation (as that’s been the general consequence of scaling up AI training), and every company claims to understand there are risks and downsides of such automation and to offer safeguards. If anything, Anthropic has been the most vocal and the most proactive about acknowledging these downsides and trying to address them. For instance, it’s fairly absurd to cite my statement that fully autonomous weapons might “one day be needed for the defense of democracy” as differing from that of other AI companies, when I was willing to risk Anthropic’s future as a company to refuse to allow our existing AI models to be used for autonomous weapons even in the face of legal sanctions, and no other AI company did the same.\n\nTo summarize, as applied to grand questions of how we govern increasingly capable AI, I have been vocal and consistent that AI needs to be governed by a legitimate, democratic process and that “surrendering human free will” to AI systems is a terrible idea. As applied to automation of specific tasks by or for people, my views are more mixed, but I don’t think they differ from those of other AI companies — most other companies seem to be offering similar products and confronting similar tradeoffs without having perfect answers to them. What is happening is that there’s a sort of vibes-based commercial and political positioning that some AI CEOs are engaging in, where they repeat slogans like “human control and agency,” or “AI should be just a tool,” without actually doing anything different in their products or taking seriously the difficult questions that lie behind these slogans."}, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125882228689477891", "url": "https://x.com/robertwiblin/status/2125882228689477891", "text": "believe it or not, frontier ai companies are moving significantly slower than they were before due to safety and ~governance ish constraints. the ECI trend graphs continue despite these large hurdles!", "created_at": "2026-11-26T09:19:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profi
