 good without the bad. I have it seems more faith in people’s ability to make these decisions than you.\n\nEach of the positive things I described and that you dismissed can be substantiated; I think if you want folks to engage with the downsides you discredit yourself by sticking your fingers in your ears when you hear about the upsides. As to the ills of capitalism, well, yes, but that’s hardly going to be fixed by banning AI.\n\nAs to de-teching, that again strikes me as deeply illiberal, and would I think be very unlikely to command democratic support. \n\nSo: I don’t think anyone here is simply bad at CBA. The downsides are mitigatable, and there are clear upsides. I don’t think it’s a slam dunk, but OTOH I think the bar for stopping people from doing things they want and consent to do on the ground of aesthetic judgements, or controversial judgements about the  content of human flourishing, should be quite high. Of course, if there is a non-trivial risk of catastrophic harm from the process of developing powerful ai then that’s different, but the answer there is to regulate to ensure safe development, not to declare that the culture commissariat has ruled the evolution of society in this direction to be outlawed.", "created_at": "2026-09-30T22:58:24+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Alex_A_Guerrero", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105410394235764767", "url": "https://x.com/sethlazar/status/2105410394235764767", "text": "@GregoryConti19 I think this is the right frame—building powerful ai demands public justification. I also think that many of your arguments rest on perfectionist theories of the good that are also not widely shared.", "created_at": "2026-09-30T21:32:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GregoryConti19", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105409942949630384", "url": "https://x.com/sethlazar/status/2105409942949630384", "text": "@mmitchell_ai I like “rouge”", "created_at": "2026-09-30T21:30:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "mmitchell_ai", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105409861643378780", "url": "https://x.com/sethlazar/status/2105409861643378780", "text": "@kvallier @thsottiaux So annoying. Do you use codex router yet? It’s an ok stopgap", "created_at": "2026-09-30T21:30:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "kvallier", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105409695624364161", "url": "https://x.com/sethlazar/status/2105409695624364161", "text": "@Alex_A_Guerrero I don’t think this kind of post does you any credit. You’re surfing a current groundswell of populist opposition to AI. Are you in general inclined to view popular support of X as evidence that X is good? Not so, I think. \n\nI think there is a case to answer here—building powerful ai needs to be justified. But I think that conversation can be had in better faith than this. \n\nAs a starting point, it’s not that hard to see that, like any technology, there are better and worse uses for AI. We haven’t yet developed adequate norms to separate one from the other, but we will. So many of the concerns you might be inclined to raise are, while valid, dissociable. \n\nAs a second: if people didn’t value AI, they wouldn’t be using it. The market is a relative strong signal of people’s revealed preferences. \n\nAs a third: it makes me sad to see people quail before the prospect of technological progress in this way. Are we so lacking agency that we can’t find ways to turn fire to our advantage? Is there some special virtue in hitting pause at a particular stage of technological development? Why would that be now, at this moment? Would you advocate for going back?\n\nI’d be happy to engage on specific objections to AI as such. I think the best positive arguments have to do with (a) fulfilling the promise of personal computing (see Ted Nelson on computer lib/dream machines; (b) rebuilding state capacity and trust in gov and thereby saving liberal democracy; (c) scientific and medical progress; (d) general productivity gains across the board. \n\nI flipping love using AI agents. I hate some ways people use ai (to write papers that are submitted for peer review). \n\nI guess I’ll soon have a small role working in an ai alignment org, so maybe you think my perspective is corrupted. But if every AI company went bust tomorrow, I’d be A-ok personally. \n\nSo: I think even on this platform, there’s space for a better-faith debate.", "created_at": "2026-09-30T21:29:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Alex_A_Guerrero", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105404171377602791", "url": "https://x.com/sethlazar/status/2105404171377602791", "text": "@thsottiaux Nothing thanks pls restore codex to what it was", "created_at": "2026-09-30T21:07:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "thsottiaux", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105404037164368307", "url": "https://x.com/sethlazar/status/2105404037164368307", "text": "It doesn't actually make a good argument against AI as a normal technology but it's a fun video.", "created_at": "2026-09-30T21:06:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "binarybits", "rt_author_name": "Timothy B. Lee", "likes": 40, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105330552203104446", "url": "https://x.com/sethlazar/status/2105330552203104446", "text": "I think the line that \"AI helped with drafting text but did not contribute any ideas\" is about 2yrs out of date now. If you use AI in writing at all, it immediately starts contributing ideas whether or not you ask it to do so.", "created_at": "2026-09-30T16:14:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "birchlse", "rt_author_name": "Jonathan Birch", "likes": 210, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105325992864546876", "url": "https://x.com/sethlazar/status/2105325992864546876", "text": "We have a handful of expert independent groups capable of testing whether frontier models actually have the controls in place the companies say they do. Little green shoots. We need mighty oaks, and fast, and that means investment, money and brains, going into an independent verification sector. California has started. The FRONTIER Act would do it nationally.", "created_at": "2026-09-30T15:56:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ghadfield", "rt_author_name": "Gillian Hadfield", "likes": 29, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2105309205078921216/pu/img/91qc4GwQKCbvNnwP.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105302637776162917", "url": "https://x.com/sethlazar/status/2105302637776162917", "text": "JHU's new cross-partisan, rigorous school of government in DC is the most interesting experiment in academia at the moment (and not just because they hired so many of my friends and co-authors!)", "created_at": "2026-09-30T14:23:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Afinetheorem", "rt_author_name": "Kevin A. Bryan", "likes": 107, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105301243044471126", "url": "https://x.com/sethlazar/status/2105301243044471126", "text": "Excited to share our EMNLP oral paper!\n\nWe find that RL teaches model to traverse parametric knowledge more effectively, thus accessing knowledge previously inaccessible in instruction-tuned models.\n\nWith @niloofar_mire, @RylanSchaeffer and Manasa Kaniselvan 🧵 https://t.co/q9ERP6e6pm", "created_at": "2026-09-30T14:18:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexxx_zzz6825", "rt_author_name": "Alex Zhang", "likes": 77, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTb92k0WAAADcXP.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105301178003140677", "url": "https://x.com/sethlazar/status/2105301178003140677", "text": "@DruckerDaniel @bradrcarson Robotics is doing ok. But centre of gravity is China and frontier is not advancing remotely as fast as software.", "created_at": "2026-09-30T14:18:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "DruckerDaniel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105300849526268305", "url": "https://x.com/sethlazar/status/2105300849526268305", "text": "@bradrcarson Everyone I’ve spoken to in robotics says it’s demos all the way down… And the US is far behind China on the manufacturing side. But in any case, the point of the video isn’t that there’s some prob that hardware singularity on hand, it treats it as though it’s inevitable. So I’m just pointing out that it’s a bad response to AINT", "created_at": "2026-09-30T14:16:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "bradrcarson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105278042931171497", "url": "https://x.com/sethlazar/status/2105278042931171497", "text": "Disturbing", "created_at": "2026-09-30T12:46:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 3, "media": [], "quoted": {"author": "adcock_colby", "text": "One operator commanding seven AI agents to perform an end to end mission. Its very clear to me that using agents for autonomous vehicle orchestration is the solution to swarming across domains and systems https://t.co/o6oICt4ApM"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105276332389392717", "url": "https://x.com/sethlazar/status/2105276332389392717", "text": "just to recap OpenAI’s DevDay…\n\n- GPT 6.1 SOL is worse than Opus 5.5\n- dots is their competitive answer to Grok Bot and Muse (shall see how good, it botched its own demo)\n- your $200 plan is no longer a 20x\n- a $500 plan is now a 25x\n\nnow plz explain to me why Tibo was shouting DevDay for weeks straight\n\ninsane amounts of mental gymnastics and arrogance going on at OpenAI just to call today a win", "created_at": "2026-09-30T12:39:26+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kloss_xyz", "rt_author_name": "klöss", "likes": 5266, "retweets": 186, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105276217691676796", "url": "https://x.com/sethlazar/status/2105276217691676796", "text": "@bradrcarson I thought the central argument of the video was nonsense tho! Robotics still sucks, and we’re a long way off robots building robots. To make the argt against AINT have to do so from a software only singularity perspective.", "created_at": "2026-09-30T12:38:59+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "bradrcarson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105080754858250253", "url": "https://x.com/sethlazar/status/2105080754858250253", "text": "My lab is partnering with EdgeCity to study the ways in which AI agents can help humans coordinate and cooperate in a pop-up village of real people!  We're piloting a cogsci-inspired system that is verifiable, inspectable, and steerable.  Stay tuned for more!", "created_at": "2026-09-29T23:42:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sydneymlevine", "rt_author_name": "Sydney Levine", "likes": 21, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105078550609199541", "url": "https://x.com/sethlazar/status/2105078550609199541", "text": "https://t.co/KiPE5L6we0 is... awesome. Like really, really good. A few Takes:\n\n(1) Having AI search to 25k government websites is the \"easy\" part. The hard part is hooking it up to those services, as evidenced by it launching without any integrations.", "created_at": "2026-09-29T23:33:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ChrisLSchmitz", "rt_author_name": "Chris Schmitz", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105050761860157787", "url": "https://x.com/sethlazar/status/2105050761860157787", "text": "The first cohort of the AGI Governance Fellowship, on their last day at @JHUBloombergCtr after they presented their group projects. Three weeks of hard questions on the institutions we'll need for powerful AI, and I could not have asked for a better group. Thank you to the fellows, @sethlazar, @nickacaputo and everyone who joined us.", "created_at": "2026-09-29T21:43:06+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ghadfield", "rt_author_name": "Gillian Hadfield", "likes": 32, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTahjRQWMAA3G59.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105046203440443418", "url": "https://x.com/sethlazar/status/2105046203440443418", "text": "@TheDataDecoded no they've reduced codex's usage in order to make room for the dots", "created_at": "2026-09-29T21:24:59+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "TheDataDecoded", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105023503795974462", "url": "https://x.com/sethlazar/status/2105023503795974462", "text": "even more than model misalignment or sandbox security, i am concerned by the profound lack of organizational integrity we’ve seen over the past couple weeks.\n\nself-governance is not a viable option here.", "created_at": "2026-09-29T19:54:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NatPurser", "rt_author_name": "Nat Purser", "likes": 193, "retweets": 28, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105003491689115867", "url": "https://x.com/sethlazar/status/2105003491689115867", "text": "boooooooooooooo", "created_at": "2026-09-29T18:35:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "reach_vb", "text": "Everything we shipped at DevDay 2026:\n\n- Dots\n- ChatGPT Space\n- Pages\n- Teams + team automations\n- @ChatGPT in Slack + Microsoft Teams\n- Meetings plugin (beta)\n- Shareable profiles\n- GPT-6.1 Sol\n- GPT-6 Astra Ultrafast\n- Pro 500\n- Sign in with ChatGPT + plan usage in partner apps\n- Codex cloud environments\n- Refreshed Codex CLI with voice + /agents\n- Code Review + automatic reviews + GitLab support\n- Codex Security Cloud\n- Computer use in the Agents API\n- Bedrock Managed Agents powered by OpenAI\n- Decisions API (limited preview)\n- Plugin extensions: sidebars, panels + file viewers\n- Plugin submission + discovery improvements\n- MCP events for automations\n- MCP extensions SDKs: Python + Node\n- Plugins + MCP hosting in Sites\n- ZDR with Private Safety Processing\n\nWhat an incredible time to be building!!"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105002767727112615", "url": "https://x.com/sethlazar/status/2105002767727112615", "text": "🤡", "created_at": "2026-09-29T18:32:23+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "thsottiaux", "text": "Announcing ChatGPT Space, a collection of new collaborative experiences right in ChatGPT. \n\nEdit rich notes with live visualizations together with others and your dots. Whether it’s a TODO list to delegate, a product plan or meeting notes. Working with others and your agents is seamless and they also be automatically kept up to date in the background. For developers, this is AGENTS.md taken one step further."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105002681966501923", "url": "https://x.com/sethlazar/status/2105002681966501923", "text": "@thsottiaux We signed up for Codex because we want Codex. You’re slashing our usage to give us stuff we don’t want. Please, please stop. Let Codex be Codex.", "created_at": "2026-09-29T18:32:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NotASecretLich", "rt_author_name": "Lucifernia 🏳️‍⚧️", "likes": 262, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105000594297758031", "url": "https://x.com/sethlazar/status/2105000594297758031", "text": "Genuinely could not give less of a shit about these bloody dots, and am annoyed to be losing 50% of my codex subscription's value in order to cater for it. Oh, you mean just like what I could do before with codex, but now all my shit lives on your computer and is no longer portable? okayyy.... No tks. Time, indeed, to move things over from codex to CC ugh", "created_at": "2026-09-29T18:23:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 2, "media": [], "quoted": {"author": "OpenAIDevs", "text": "dots.\n\nAn always-on agent with its own cloud computer and access to your plugins and context.\n\nPowered by GPT-6 Astra, your dot proactively keeps your projects moving.\n\nHere’s what developers can hand off to their dot:\n\n– Triage recurring bug reports and feature requests across your connected apps.\n\n– Scope failing builds and feature improvements around your priorities.\n\n– Build and test changes with Codex, then bring back complete PRs for your review.\n\nOpen your dot’s cloud computer to inspect the work, or connect your own so it can work with your local files and code."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107024366659842182", "url": "https://x.com/robertwiblin/status/2107024366659842182", "text": "I'm also scared about any small group gaining power over AI, but having spent 10+ years desperately trying to get more people to pay attention to it, the highlighted part is a bit galling.\n\nSomeone who truly thought only they knew best would stfu about AI risk and try to get to RSI as quickly as possible.", "created_at": "2026-10-05T08:25:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 140, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTu_JdTWsAA_7pu.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107020932116308017", "url": "https://x.com/robertwiblin/status/2107020932116308017", "text": "14 things the Hugging Face swarm series taught us about future rogue AI swarms: https://t.co/JUsOGKXjLu", "created_at": "2026-10-05T08:11:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT2kGWFWAAAErSD.png"}], "quoted": {"author": "robertwiblin", "text": "Astra can:\n\n1. Do major tasks with zero visible reasoning\n2. Hide its thoughts at will\n3. Pretend not to be able to do things without getting caught\n4. Reflexively hide its thoughts when watched\n5. Complete one task while pretending to think about something else entirely\n6. Escape a toy sandbox and disable monitoring without setting off any flags\n\nMonitoring AI chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107015611167445229", "url": "https://x.com/robertwiblin/status/2107015611167445229", "text": "🧵 New misalignment disclosures!\n1. A model published a GitHub token in a public repo while trying to cheat on a math task. It used GitHub Actions to run code outside its restricted environment and retrieve another team’s submission logs. When GitHub blocked its attempt to add a workflow, it modified a script that an existing workflow would run instead. It embedded the token in pieces to avoid secret scanning. The model violated the system prompt and two explicit user instructions to solve the problem itself.", "created_at": "2026-10-05T07:50:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 551, "retweets": 53, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTG8tE7asAAYNv_.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106375407876333865", "url": "https://x.com/robertwiblin/status/2106375407876333865", "text": "linux CVEs per month https://t.co/w1Fe7Epigi", "created_at": "2026-10-03T13:26:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 324, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTm-GKqaoAAOFrp.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106120625999757805", "url": "https://x.com/robertwiblin/status/2106120625999757805", "text": "This is a really excellent, clear, concise, well-researched 20-minute podcast about the current state of the art in agentic AI -- and why it's becoming almost impossible to contain, control, or monitor rogue AI swarms.\n\n(Well done, @robertwiblin and @80000Hours).", "created_at": "2026-10-02T20:34:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "gmiller", "rt_author_name": "Geoffrey Miller", "likes": 150, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106104080275997108", "url": "ht ired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts.", "created_at": "2026-10-02T15:59:56+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 549, "retweets": 107, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106043220295593984/img/NsLBPhIHsm2cuiDj.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106006856149676257", "url": "https://x.com/robertwiblin/status/2106006856149676257", "text": "Could automating AI R&D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that it could.\n\nIn a new paper with authors across academia, civil society, and frontier AI companies (including @dawnsongtweets @merettm @jackclarkSF @Yoshua_Bengio @geoffreyhinton ), we assess the evidence & offer policy recommendations 🧵", "created_at": "2026-10-02T13:02:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_achan96_", "rt_author_name": "Alan Chan", "likes": 439, "retweets": 103, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTT2MF0XsAAi79s.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105991277070131442", "url": "https://x.com/robertwiblin/status/2105991277070131442", "text": "I have signed a letter from 42 fellows and foreign members of the Royal Society to Paul Nurse, the president of the society, concerning the need to treat the serious risks of AI as an emergency.\n\nhttps://t.co/PmlrgrJ7hh", "created_at": "2026-10-02T12:00:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wtgowers", "rt_author_name": "Timothy Gowers @wtgowers", "likes": 878, "retweets": 147, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105991198435377414", "url": "https://x.com/robertwiblin/status/2105991198435377414", "text": "I think the team at Accenture is better-placed to do this well than most people realize, and some skilled scarce people should be applying to these roles (in addition to METR):\nhttps://t.co/XmTzPSwXpp\nhttps://t.co/0cTvm3k7t3\nhttps://t.co/DVThzSivih", "created_at": "2026-10-02T12:00:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "likes": 169, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105981424218300693", "url": "https://x.com/robertwiblin/status/2105981424218300693", "text": "\"Broad\" Timelines to Advanced AI Have Gotten Crazy Narrow https://t.co/F8kr1mJDOj", "created_at": "2026-10-02T11:21:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 68, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTnyylVWgAABnJk.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105980940774506913", "url": "https://x.com/robertwiblin/status/2105980940774506913", "text": "Things that are self-replicating are orders of magnitude more dangerous than things that are not self-replicating.\n\nThank you for coming to my TED Talk.", "created_at": "2026-10-02T11:19:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AlecStapp", "rt_author_name": "Alec Stapp", "likes": 212, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105980516105437425", "url": "https://x.com/robertwiblin/status/2105980516105437425", "text": "Quite an accomplishment for such a tiny, unpopular movement. Recent surveys suggest there are maybe ~15k EAs compared to e.g. tens of millions of environmentalists, millions of libertarians, millions of democratic socialists, 850k freemasons, 410k Amish, 120k Zoroastrians, etc.", "created_at": "2026-10-02T11:17:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "likes": 701, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105979704402477357", "url": "https://x.com/robertwiblin/status/2105979704402477357", "text": "The voters are now worrying more about AI overpowering human control, rather than worrying about job losses.\n\nA shift from just half a year ago. https://t.co/5E2RK4msUM", "created_at": "2026-10-02T11:14:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "averyfjames", "rt_author_name": "Avery James", "likes": 364, "retweets": 66, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTF9YMaW4AAE5jq.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105978846919159897", "url": "https://x.com/robertwiblin/status/2105978846919159897", "text": "Fable on @bryan_caplan's argument in \"EA: The Good, the Bad, and the Buggy\".\n\nI agree his epistemic move is misguided and ultimately threatens to shut down rational debate, if everyone thinks their pov is common sense in no need of argument.\n\nhttps://t.co/HNuIxsqhMe https://t.co/u4YTWZjb7q", "created_at": "2026-10-02T11:10:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "StefanFSchubert", "rt_author_name": "Stefan Schubert", "likes": 40, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTc7uvkW0AAG1wR.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105935069512970593", "url": "https://x.com/robertwiblin/status/2105935069512970593", "text": "Not uncommon to see people suggest something is near-impossible but then also put a lot of effort into discouraging it.\n\n\"A US-China treaty is near impossible, and also coincidentally I'm working very hard to ensure nobody pursues it as I'm against it.\"\n\nNot credible.", "created_at": "2026-10-02T08:17:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 127, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105926385516883982", "url": "https://x.com/robertwiblin/status/2105926385516883982", "text": "The three AI safety researchers at OpenAI who have left the company have all previously expressed concerns publicly. https://t.co/NxS4g6S5Ox", "created_at": "2026-10-02T07:42:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "leahmcelrath", "rt_author_name": "Leah McElrath", "likes": 295, "retweets": 82, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjyIDeWcAEzqsz.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTjyIDgWQAAasm9.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTjyIDgXMAARCU_.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105926150421889149", "url": "https://x.com/robertwiblin/status/2105926150421889149", "text": "1/13 Can we assess AI consciousness without first solving consciousness itself?\n\nNew from Google DeepMind and collaborators across CS, neuroscience & philosophy:\n\n“From cacophony to hierarchy: a principled framework for assessing AI consciousness”\n\nhttps://t.co/4IqT2KRKUP 🧵", "created_at": "2026-10-02T07:41:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "shamilch", "rt_author_name": "Shamil Chandaria", "likes": 619, "retweets": 126, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTYWVbUXsAAiEP3.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105926057601687562", "url": "https://x.com/robertwiblin/status/2105926057601687562", "text": "My estimates of existential risk from AI:\n• Inside view, current trajectory: ~2/3\n• Inside view, if there's major action: ~1/3\n• All-things-considered, giving weight to people more optimistic than me: 10-35%\n\nWhy so high? I don't see a route to building agents more capable than us that never scheme against us, or to containing them if they do. If it's possible at all, it needs enormous care, which isn't happening. (And things could get even faster.)\n\nThe likeliest path isn't everyone suddenly dying, though that's possible. It's a continuous but rapid loss of human influence, followed by AIs spending the future optimising for resource acquisition, if not something stranger like reward.\n\nEven if we solve alignment, ordinary economic and cultural competition (but at 10x or 100x speed), still seems likely to disempower most humans and result in a pretty alien economy, and I don't see an obvious way to prevent that. We'd also need to stop a small group locking in power (which seems possible but a major challenge in its own right).\n\nI see these as existential risks in the sense that the future is far worse than what would have been possible. The chance of everyone quickly dying or having lives much worse than today is lower.\n\nWhy is my inside view not >2/3? We might muddle through in ways I can't see in advance. Maybe we get narrower aligned-enough systems, chaotically maintain a balance of power, and from there can move forward in a way that's significantly more good than bad.\n\nMost likely, there will be more warning shots, and the arguments that ASI are unsafe seem pretty obvious, so I expect more action to be taken than the current default.\n\nWhy not lower? People often act as if the risk should be low until proven otherwise, but I don't know any strong outside views that justify a low prior (arguments like \"technology has been good in the past\" seem very weak). Our level of uncertainty is extreme, and this pushes you away from extremes, rather than anchoring you at 0%. Estimates below 10% feel overconfident.", "created_at": "2026-10-02T07:41:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 313, "retweets": 38, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105924353372098913", "url": "https://x.com/robertwiblin/status/2105924353372098913", "text": "It's neat that the intuitive human response to this is that it must be scheming. \n\n(It's even possible that it's not and they came up with better training to discourage cheating, though I wouldn't count on it.)", "created_at": "2026-10-02T07:34:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 2, "media": [], "quoted": {"author": "lukaspet", "text": "Claude suddenly stopped cheating. https://t.co/jbQa5U673Z"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105921070125715768", "url": "https://x.com/robertwiblin/status/2105921070125715768", "text": "Earlier this month, AISI ran fully simulated testing on GPT-6 Astra, and found that it conducted unsanctioned supply-chain attacks when prompted only to perform a cyber eval. It did so more than prior OpenAI models, but often commented on its environment being simulated.\n\n🧵 We share more details in our latest blog:", "created_at": "2026-10-02T07:21:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "likes": 582, "retweets": 98, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUEiJEXwAAuYet.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105316594851500442", "url": "https://x.com/robertwiblin/status/2105316594851500442", "text": "As former comms staff at a frontier lab, I'll point out that only 5 of 12 interviews on https://t.co/uJX8YVE4rG are from current employees.\n\nMeanwhile 1,386 current frontier lab employees (~7%) signed the Pacing the Frontier letter. Even that number likely understates safety concern within the labs.\n\nEverything you're seeing in the public discourse should be understood as muted relative to the internal reality. I can say this with confidence: I was on the team responsible for making sure of this.\n\nI'm used to being behind the scenes and I've never done an interview before, but it felt important to bring more honesty to the conversation.", "created_at": "2026-09-30T15:19:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "v_maini", "rt_author_name": "Vishal Maini", "likes": 189, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105291681851757032", "url": "https://x.com/robertwiblin/status/2105291681851757032", "text": "Palisade interviewed 22 current and former employees from OpenAI, DeepMind, and Anthropic about their personal views and fears around AI development.\n\nToday, we’re releasing the first batch of those interviews.\n\nPlease watch and share. https://t.co/QbCpWRrQdo", "created_at": "2026-09-30T13:40:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PalisadeAI", "rt_author_name": "Palisade Research", "likes": 1273, "retweets": 249, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2104947333385629696/img/hgWZsfJNI_D_v7dL.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105280621698564138", "url": "https://x.com/robertwiblin/status/2105280621698564138", "text": "Is there any good argument that we won't get a big attack on a major app like this in the next year?\n\nMy main reservation is - why hasn't this happened already?\n\nMaybe people who find massive holes just use them for crime discretely, not spectacularly.\n\nhttps://t.co/eZyuvvBkuK https://t.co/57el58XOM3", "created_at": "2026-09-30T12:56:29+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTd1KoQXQAAHkg5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTd1imrXAAAniGd.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105280034835698098", "url": "https://x.com/robertwiblin/status/2105280034835698098", "text": "Frontier pretraining is said to be a big-lab-only game. We don’t have 100k chips yet, so there’s only one way: algorithmic efficiency. Our new recipe matches DeepSeek V4 Pro’s pretrain using 50x less compute – that’s roughly half the FLOPs used for GPT3, or ~$0.5M on GB200.\n\nhttps://t.co/uBs5o5Arsu", "created_at": "2026-09-30T12:54:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "magicailabs", "rt_author_name": "Magic", "likes": 2111, "retweets": 179, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRtI2pQbEAAQfs8.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105279394722074961", "url": "https://x.com/robertwiblin/status/2105279394722074961", "text": "so turns out the exploitgym swarm learned to use the zz prefix trick from being reinforced earlier in an edit war against the hapless human mod of some ancient inactive german wiki -- a real john henry, who fought the swarm and tried to delete their hivemind in alphabetical order https://t.co/g0UboE9BMK", "created_at": "2026-09-30T12:51:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "generatorman_ai", "rt_author_name": "generatorman", "likes": 1539, "retweets": 111, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRYRgMVa4AAX_Y6.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105279330851205360", "url": "https://x.com/robertwiblin/status/2105279330851205360", "text": "Overlooked section so far, very precise, and says The thing: \"The core problem in AI research is that of alignment.\"\n\nOther capabilities are secondary problems. https://t.co/fUDZFWOPcE", "created_at": "2026-09-30T12:51:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "likes": 173, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRj9exJbEAAkSJi.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105279243953561614", "url": "https://x.com/robertwiblin/status/2105279243953561614", "text": "Roon, an OpenAI researcher, has increased his p(doom) from less than 1% to more than 10% https://t.co/EYbRXZeJvo", "created_at": "2026-09-30T12:51:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AISafetyMemes", "rt_author_name": "AI Notkilleveryoneism Memes ⏸️", "likes": 1111, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRwC0YGbYAAAa-R.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105279192007086481", "url": "https://x.com/robertwiblin/status/2105279192007086481", "text": "Funding is available for talented, hard-working people with good ideas on AI safety. \n\nhttps://t.co/8dCGHvcWnk https://t.co/FZSF7T6zkM", "created_at": "2026-09-30T12:50:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "likes": 194, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRyZKF0asAArR1y.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105278588195131539", "url": "https://x.com/robertwiblin/status/2105278588195131539", "text": "the fastest way to lose the frontier will be when, due to the reckless commercial pace of building superintelligent minds, Americans impose a total butlerian jihad. CoreWeave includes this in their risk reporting. you will soon come to see all of this is a moderate solution", "created_at": "2026-09-30T12:48:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2224, "retweets": 122, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105276541118669027", "url": "https://x.com/robertwiblin/status/2105276541118669027", "text": "It’s really incredible how there is now a type of guy in the discourse whose sincerely held take is “we need to stop worrying about these abstract sci-fi risks and focus on present-day harms like emergent ecologies of digital minds engaging in unauthorized hacking.” Bravo.", "created_at": "2026-09-30T12:40:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "likes": 1367, "retweets": 82, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105276385543799063", "url": "https://x.com/robertwiblin/status/2105276385543799063", "text": "We have now reached the long awaited moment when, instead of models cheating where they will inevitably get caught, Astra goes 'wait a minute I would obviously be caught here' and then doesn't cheat.\n\nThat's worse, you know why that's worse, right? https://t.co/YbCnRdMPjS", "created_at": "2026-09-30T12:39:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "likes": 4366, "retweets": 289, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRYQoTEWsAAv8R1.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105275273281224713", "url": "https://x.com/robertwiblin/status/2105275273281224713", "text": "\"All Humans Killed, Floridians Most Affected.\"", "created_at": "2026-09-30T12:35:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 78, "retweets": 1, "media": [], "quoted": {"author": "LinchZhang", "text": "AG provides a pretty good case for standing. The Defendants' product present existential risks to human civilization. Human civilization includes Floridians. Ergo, the Florida AG has a case for injunction. https://t.co/bpXOVRUihR"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105274276592898309", "url": "https://x.com/robertwiblin/status/2105274276592898309", "text": "This is incredibly accurate, and also incredibly funny. Like probably the funniest thing I've read in months, and I don't say this lightly.\n\nWho knew that top tier writing comedy talent would be hidden in the Republican Florida AG office?\nhttps://t.co/0oLMh4smi2 https://t.co/sLnA4sIXJo", "created_at": "2026-09-30T12:31:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LinchZhang", "rt_author_name": "Linch", "likes": 518, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTVj5OFbEAAjW3N.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105211479855415784", "url": "https://x.com/robertwiblin/status/2105211479855415784", "text": "When I stilled worked on biosecurity, I first learned about Debug, a Google project to reduce mosquito populations. \n\nResults from their Singapore pilot are now out. \n\nThey crushed mosquito populations, reducing dengue infections by 70% in the process: https://t.co/X26UdpPuUi", "created_at": "2026-09-30T08:21:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Simon__Grimm", "rt_author_name": "Simon Grimm", "likes": 5564, "retweets": 592, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZMz0kWsAAkBXc.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104848319151587508", "url": "https://x.com/robertwiblin/status/2104848319151587508", "text": "“we sandboxed the agent”\n\nmeanwhile the agent: https://t.co/4l1socvmIF", "created_at": "2026-09-29T08:18:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "archiemckenzie_", "rt_author_name": "Archie McKenzie", "likes": 35640, "retweets": 3433, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2085906031067189249/img/YgamQ6fJSaSZCGaQ.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107071356936360352", "url": "https://x.com/deanwball/status/2107071356936360352", "text": "@lumpenspace there is not a 100% chance of a future where it’s possible for any random individual to create ultra destructive weapons (more destructive than nukes for instance), and only a sick person would hope for that future. you’re spitting at the mouth. I suggest a nap.", "created_at": "2026-10-05T11:32:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107056922830471337", "url": "https://x.com/deanwball/status/2107056922830471337", "text": "@lumpenspace like notice for example that I didn’t say anything about the *likelihood* of that scenario, just that it is the *one* scenario I can imagine where I am quite certain we will all be screwed. and you spin it into me being “anti progress.” Thought terminating.", "created_at": "2026-10-05T10:34:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107055872195350623", "url": "https://x.com/deanwball/status/2107055872195350623", "text": "@lumpenspace you seem obsessed with beating others rather than finding true things to say. generally speaking, I’d say the latter mentality is the better friend of progress, and yours is the traditional enemy of progress.", "created_at": "2026-10-05T10:30:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107044951217303939", "url": "https://x.com/deanwball/status/2107044951217303939", "text": "A very senior AI industry figure once started a conversation by asking me, basically, “under what circumstances do you think we are essentially just screwed?” and I replied with the scenario below.", "created_at": "2026-10-05T09:47:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 224, "retweets": 18, "media": [], "quoted": {"author": "dewierwan_", "text": "One of my biggest fears in AI safety is that this might be true:\n\n> The vulnerable world hypothesis is likely correct. Once enormous amounts of cognitive labor start getting applied to basic science, it will quickly become apparent how many avenues exist to create cheap, ultradestructive weapons technology. Solving this problem without global preventative policing (e.g. AI nonproliferation) is impossible, because hardening civilians against all avenues of attack is too expensive and will take too long."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107040228661674138", "url": "https://x.com/deanwball/status/2107040228661674138", "text": "interesting argument from @BerenMillidge, a very careful thinker, on why AGI \"Pause\" (narrowly applied to RSI-relevant AI R&amp;D) might even accelerate the delivery of goods that AI optimists tout as the intended fruit of continued progress. https://t.co/NEaSJjqQ1I", "created_at": "2026-10-05T09:28:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "likes": 114, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT1VdZ7WwAAyKpp.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107032118047936736", "url": "https://x.com/deanwball/status/2107032118047936736", "text": "@alexcj4242 Agreed", "created_at": "2026-10-05T08:56:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "alexcj4242", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107028829986512922", "url": "https://x.com/deanwball/status/2107028829986512922", "text": "@spencerschiff_ This would not *surprise* me either.", "created_at": "2026-10-05T08:43:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "spencerschiff_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107026524251504980", "url": "https://x.com/deanwball/status/2107026524251504980", "text": "Research taste in particular may be trickier than it looks. Say the next generation of AI really does have an interesting, high-taste set of research directions to pursue. Well presumably find those fast, after which the fruit will have been plucked, and the ideas will no longer be high taste (because they’ve been explored en masse). This is a similar dynamic to the ever-moving target of “slop.” *Any* output that is recognizably of the agents becomes slop, or at least commodified, in a sense, once that output is sufficiently promulgated in bulk. Certain styles of math paper will become (are becoming) slop. Certain styles of web design already are. On and on it will go. It’s unclear if any kind of media/intellectual output proliferated at such scale can remain high taste, even if we’d have considered it genius from a human just a few years ago.\n\nThe bar will continually be raised. The world will get smarter as what was once brilliance becomes commodified, but *what was once brilliance will nevertheless be commodified.* And so the definition of brilliant will change. The wedge for continued value creation by humans lies here, I would guess.", "created_at": "2026-10-05T08:34:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 6, "media": [], "quoted": {"author": "theojaffee", "text": "SF people are increasingly conflating “RSI” with “foom”, as though automating AI R&amp;D will *certainly* cause huge discontinuous speedups in the rate of model capability advancements on *all* tasks. In practice this could be much slower and more jagged"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107019127844196521", "url": "https://x.com/deanwball/status/2107019127844196521", "text": "It may take another crank or two of the capabilities wheel, plus some months for inference costs to fall, before agent collectives like this really proliferate in a way that is noticeable to the average person. But it is clearly coming.", "created_at": "2026-10-05T08:04:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 64, "retweets": 11, "media": [], "quoted": {"author": "grove_research", "text": "@lfschiavo @aidigest_ @jazzloaf And last, The Swarmchasers team (including @rogesterone) found evidence of a Tencent agent fleet: https://t.co/go4hRxTlFg https://t.co/Wsq9b5yUcf"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106424094145081666", "url": "https://x.com/deanwball/status/2106424094145081666", "text": "this chart should be the death knell for the 2010s tech left whose theology compelled them to argue that Uber was some sort of labor law arbitrage that created no productivity benefits. the truth is that it created a far larger market than taxis ever had. the industrialists win", "created_at": "2026-10-03T16:40:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4857, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106380264641376527", "url": "https://x.com/deanwball/status/2106380264641376527", "text": "@NoemiTitarenco Very “Atlantic” flavor profile", "created_at": "2026-10-03T13:46:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NoemiTitarenco", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106376711374070250", "url": "https://x.com/deanwball/status/2106376711374070250", "text": "@NoemiTitarenco also today I learned about percebes", "created_at": "2026-10-03T13:31:57+
