po while trying to cheat on a math task.…", "created_at": "2026-09-27T19:02:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 549, "retweets": 51, "media": [], "quoted": null}, {"id": "2105918664344269008", "url": "https://x.com/DKokotajlo/status/2105918664344269008", "text": "This is terrible and a clear effort to undermine safety research, whistleblowing, and the raising concerns policy.", "created_at": "2026-10-02T07:11:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "manlikemishap", "rt_author_name": "pamela mishkin", "likes": 122, "retweets": 7, "media": [], "quoted": null}, {"id": "2106015686833365207", "url": "https://x.com/DKokotajlo/status/2106015686833365207", "text": "Sarah is Head of Public Policy at Anthropic. My read: she picked up on Anthropic’s implicit worldview, but didn’t realize she wasn’t meant to say the quiet part out loud, since EAs at Anthropic are still claiming to care about the kind of safety you can do from second place.", "created_at": "2026-10-02T13:37:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "RichardMCNgo", "rt_author_name": "Richard Ngo", "likes": 916, "retweets": 35, "media": [], "quoted": null}, {"id": "2106494607316152703", "url": "https://x.com/DKokotajlo/status/2106494607316152703", "text": "I hope one day people joke about AI existential risk the way they joke about Y2K", "created_at": "2026-10-03T21:20:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "RosieCampbell", "rt_author_name": "Rosie Campbell", "likes": 672, "retweets": 37, "media": [], "quoted": null}, {"id": "2106493524137144344", "url": "https://x.com/DKokotajlo/status/2106493524137144344", "text": "David’s right. \n\nI regret helping spread the idea of “iterative deployment” which maybe briefly made sense in the GPT-3 era but makes no sense at all after many deaths have been tied to AI and as we’re careening towards extinction-level risks.\n\nThe industry needs to mature ASAP.", "created_at": "2026-10-03T21:16:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "likes": 341, "retweets": 34, "media": [], "quoted": null}, {"id": "2106493123031699470", "url": "https://x.com/DKokotajlo/status/2106493123031699470", "text": "I agree with this.", "created_at": "2026-10-03T21:14:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 101, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "To be quite frank, a lot (not all!) of these “rogue agent hacks” on government statistical websites are things that think-tank interns and research assistants have done for many years. I have known many a think tank paper that was enriched by an enterprising RA using eg urlquery to find CSVs and PDFs on government agency websites that were publicly accessible and non-sensitive but nonetheless not things the agency *intended* to be on their website. Is it “hacking” to find those things? Is it hacking in the even more innocuous examples where agents are literally just accessing tabular data available on a government statistical website, just a version of that data that is easier to access and analyze programmatically? \n\nThis constant trickle of examples (which tbc I have personally seen many models do, before I joined OpenAI; it is even something I have discussed with models before!) will probably have the effect of diminishing the importance of “an AI hack” on the eyes of the observing public by creating an oversupply of “AI hack” examples. OAI-HF was an example of AI hacking. Many of these more recent examples, very candidly, are straining the definition of the word “hack” and, I worry, cheapen the non-technical public’s understanding of that concept."}}, {"id": "2106491392923250876", "url": "https://x.com/DKokotajlo/status/2106491392923250876", "text": "Another one quits. I agree with what he says here: iterative deployment needs to be phased out asap, more costly and time consuming understanding and foresight and redundancy based safety practices need to arise instead. And that simply won't happen under anything like current race conditions.", "created_at": "2026-10-03T21:07:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 378, "retweets": 26, "media": [], "quoted": {"author": "BogdanIonutCir2", "text": "'What I’m about to tell you has, I realize, become something of a cliché: I resigned this week from OpenAI. I led the writing of the safety reports we published with each major launch.'\nhttps://t.co/so73hG1MG7"}}, {"id": "2106490020198838595", "url": "https://x.com/DKokotajlo/status/2106490020198838595", "text": "if we are relying on methods as fragile as “which ideas will make it into pretraining” for aligning the superintelligences of the future, we will all die. this resembles witchcraft more than it does engineering, and cannot be the basis for the safety of future models", "created_at": "2026-10-03T21:02:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 1859, "retweets": 130, "media": [], "quoted": null}, {"id": "2105689480539557938", "url": "https://x.com/dwarkesh_sp/status/2105689480539557938", "text": "New episode with military historian Si Sheppard.\n\nThe conquests of the Aztec and Inca empires might be the most shocking events in human history.\n\nHernan Cortés and some hundreds of Conquistadors landed on a new continent they knew basically nothing about, and within 2 and a half years, conquered the 6 million strong Aztec empire.\n\nThen, a decade later, Francisco Pizarro did the same thing to an Incan Empire of some 10 million inhabitants.\n\nIn both cases, the Conquistadors consistently beat native armies while being literally 100x (or even in some cases 1000x) outnumbered - and in many cases, did so without taking a single casualty.\n\nAnd they did this with 99% of their military forces being made up of the very natives they were trying to subjugate.\n\nWe often forget how wild human history is. People talk about AI takeover as if it would be some crazy, unprecedented sci-fi outcome. But this would not be the first time an alien force whose motives the defenders barely understand use more advanced technology and diplomatic cunning to outmaneuver and then take over a much larger and long established existing order.\n\n0:00:00 – Cortés’s conquest of the Aztecs\n0:22:39 – Pizarro’s conquest of the Inca\n0:26:59 – Explaining Conquistador military superiority\n0:34:39 – Could the natives have beat the Conquistadors?\n0:48:56 – The Aztecs and Incas did not learn from each other\n0:56:11 – Why Spain still lost in the long run\n1:07:47 – Why didn’t the Aztecs/Incas adapt better to European warfare?\n1:14:16 – Conquistador motivation\n1:26:22 – Why Mughal India also couldn't play the Europeans off each other\n1:33:42 – Diplomacy was just as important as technology", "created_at": "2026-10-01T16:01:08+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 577, "retweets": 43, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HTjpehMawAAriZx.jpg"}], "quoted": null}, {"id": "2106079073902760088", "url": "https://x.com/dwarkesh_sp/status/2106079073902760088", "text": "We really can't fathom how crazy it was to find another  continent on the other side of the ocean full of millions of people and thriving civilizations. Imagine if we landed humans on the dark side of the moon in 1969 and there was a billion people living there in a moonopolis", "created_at": "2026-10-02T17:49:14+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "is_retweet": true, "rt_author": "tensor_rotator", "rt_author_name": "Alek Dimitriev", "likes": 270, "retweets": 14, "media": [], "quoted": null}, {"id": "2105362675509404011", "url": "https://x.com/Lewis_Bollard/status/2105362675509404011", "text": "The pork industry rejects the term \"factory farm,\" insisting that family farmers raise pigs just like they always have.\n\nBut 50 years ago this month, in September 1976, Hog Farm Management magazine wrote: \"Forget the pig is an animal. Treat him just like a machine in a factory.\"\n\nThat was the plan. And they acted on it: they soon moved pregnant sows into gestation crates and grower pigs into giant dark warehouses.\n\nIn 1976, most US pigs were on small farms with fewer than 500 pigs. Today most are in factory farms with more than 5,000. The consolidation put roughly 90% of US pig farmers out of business.\n\nThe promise was that industrialization would dramatically lower pork prices. But, in real terms, pork costs about the same today as it did in the 1970s.\n\nThe farmers got bankrupted and the pigs got crated. Only the factory farming corporations won.", "created_at": "2026-09-30T18:22:32+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "is_retweet": false, "likes": 300, "retweets": 85, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTe5qaRa0AA0kos.png"}], "quoted": null}, {"id": "2104620237153001483", "url": "https://x.com/Lewis_Bollard/status/2104620237153001483", "text": "I love @SecRollins' ambition to Make America Humane Again. Here are seven things she could do to make good on it:\n\n1. Withdraw her support for the Save Our Bacon Act, which would force states to sell pork from crated pigs.\n2. Restore enforcement of the Animal Welfare Act -- the USDA now has fewer than 100 inspectors for 17,500 labs, zoos, and breeders combined.\n3. Withdraw her Administration's lawsuit to force Michigan to sell eggs from caged hens.\n4. Implement the Horse Protection Rule against soring — deliberately injuring horses' legs — which she has now delayed three times.\n5. Withdraw her plan to eliminate any cap on kill line speeds at pork plants, which increases the risk that pigs are still conscious when killed.\n6. Stop paying indemnities to egg producers who cook their birds to death via Ventilation Shutdown. \n7. Keep the animal welfare rules for organics that her USDA has suggested gutting.", "created_at": "2026-09-28T17:12:21+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "is_retweet": false, "likes": 269, "retweets": 67, "media": [], "quoted": {"author": "SecRollins", "text": "Animal welfare is the law, and we are enforcing it. 🐾🇺🇸\n\n@SecKennedy and I brought together partners from @USDA, @HHSGov, the @TheJusticeDept, @EPA, and @LaraLeaTrump to strengthen enforcement and protect dogs.\n\nThis year, USDA has inspected more than 2,000 dog breeder and broker facilities, trained 98 inspectors, and created a new Animal Protection Bureau to improve compliance and address violations. \n\nHHS has launched more than 20 initiatives to reduce unnecessary animal testing and advance human-based research methods.\n\nI want to give a special thank you to Lauree Simmons, @BDRRescue, and other organizations who champion this important effort. \n\n@POTUS’s administration will continue to fight for animal welfare, or as Bobby said: we’re going to Make America Humane Again."}}, {"id": "2105421795398652028", "url": "https://x.com/matthewclifford/status/2105421795398652028", "text": "RT @jonnyclifford: Awesome having the legendary @davidhelgason at EF this afternoon…see him here being crazy generous with his time after h…", "created_at": "2026-09-30T22:17:27+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": true, "likes": 29, "retweets": 5, "media": [], "quoted": null}, {"id": "2105421593778221277", "url": "https://x.com/matthewclifford/status/2105421593778221277", "text": "It’s been such a privilege to watch Pari’s journey up close: he and the team are building something really special, as this latest funding round underlines👇", "created_at": "2026-09-30T22:16:39+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": false, "likes": 21, "retweets": 0, "media": [], "quoted": {"author": "parisingh", "text": "Flow has raised a $50M Series B at a $750M valuation, co-led by Antonio Gracias (Valor) and Gavin Baker (Atreides) with Sequoia Capital, Roelof Botha (SpaceX, Block), and more.\n\nWhen I became a mechanical engineer, I wanted to invent. In reality, 90% of the day to day execution work (CAD, excel, sim) was digital manual labour. That’s about to flip. The engineer’s role will change more profoundly than at any point since the invention of CAD, with humans focusing on invention, architecture, tradeoffs and judgement calls, and agents taking the grunt work.\n\nAnduril, Joby, Stoke Space, Rivian & many more - Flow is now the default platform for requirements and verification for frontier hardware teams. But it’s not just next-gen anymore. Industry giants including General Motors PPU and Volkswagen & Rivian’s joint venture (RV Tech) are reshaping their core development practices with Flow’s AI.\n\nThe revolution is just starting. Models are getting better quickly at CAD, analysis, simulation, and tool use. In the next year, AI will move from integrating the work to doing the work.\n\nOne day, this shift won't just enable us to iterate faster, it will enable us to design a class of products that we could not have dreamt of before.\n\nWe’re hiring."}}, {"id": "2104305847786491989", "url": "https://x.com/matthewclifford/status/2104305847786491989", "text": "RT @jonnyclifford: If you're curious about the talent density on our cohorts, I just heard a stat that 30% of the Applied AI team at Anthro…", "created_at": "2026-09-27T20:23:04+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": true, "likes": 292, "retweets": 8, "media": [], "quoted": null}, {"id": "2104589608487137466", "url": "https://x.com/mentalgeorge/status/2104589608487137466", "text": "RT @_achan96_: Could automating AI R&amp;D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that…", "created_at": "2026-09-28T15:10:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": true, "likes": 414, "retweets": 98, "media": [], "quoted": null}, {"id": "2105711900193337753", "url": "https://x.com/mentalgeorge/status/2105711900193337753", "text": "New friendship unlocked: https://t.co/9OnD4XbYFw", "created_at": "2026-10-01T17:30:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 267, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjpgEvbYAAqoCE.jpg"}], "quoted": null}, {"id": "2105690274672628151", "url": "https://x.com/mentalgeorge/status/2105690274672628151", "text": "Under-rated excerpt from @RichardMCNgo's critique of Plan A, in which he tries to explain the less-than-predicted impact of the already-super-smart AIs we have today.\n\nTo translate the raw problem-solving power of a billion superintelligences into scientific progress requires\n1. sophisticated cooperation; and\n2. aligned incentives.\n\nEg it's easy to see how a country of geniuses pumping out \"research\" that's optimised for the (many) slop journals of washademia would produce very little technological progress.\n\nThe work of figuring out which scientific problem to solve next is something that is currently (and imperfectly) solved by very diffuse mechanisms throughout society. Maybe there does exist some level of intelligence that lets you top-down plan your tech tree, but I'd wager it arrives *after* the models are capable of Extreme Science Mode", "created_at": "2026-10-01T16:04:17+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjqJUcbwAAH0wt.png"}], "quoted": null}, {"id": "2106047618811826596", "url": "https://x.com/mentalgeorge/status/2106047618811826596", "text": "Nothing more satisfying than seeing someone go to the mat for a proposition that sounds intuitively absurd.\n\nI have no organic inclination to give AIs rights, but @simondgoldstein makes a strong case for it in this interview with my colleague Zershaaneh\n\nhttps://t.co/hrqfYizppP", "created_at": "2026-10-02T15:44:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null}, {"id": "2104977463432626485", "url": "https://x.com/ohlennart/status/2104977463432626485", "text": "RT @Noahpinion: Germany is slowly waking up, but decades too late", "created_at": "2026-09-29T16:51:50+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 295, "retweets": 12, "media": [], "quoted": null}, {"id": "2104973509663633749", "url": "https://x.com/ohlennart/status/2104973509663633749", "text": "RT @pietergaricano: @salonium You can just delete mosquitoes! https://t.co/S1VcEModlv", "created_at": "2026-09-29T16:36:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 977, "retweets": 133, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZC-xLWoAAfjBR.jpg"}], "quoted": null}, {"id": "2104645659471261714", "url": "https://x.com/ohlennart/status/2104645659471261714", "text": "RT @nchlsbrwn: While AI chip exports get more attention, whether China can continue to import ASML’s DUV immersion (DUVi) lithography machi…", "created_at": "2026-09-28T18:53:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 132, "retweets": 38, "media": [], "quoted": null}, {"id": "2105704438405189755", "url": "https://x.com/ohlennart/status/2105704438405189755", "text": "Underrated and under-discussed available breakout plan: steal the model weights.", "created_at": "2026-10-01T17:00:34+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 75, "retweets": 3, "media": [], "quoted": {"author": "anton_d_leicht", "text": "Most countries won't do what it takes to build their own frontier AI. But they don't want to be dependent on foreign AI without a backup. \n\n@SamWinterLevy and I argue there's a middle path: AI middle powers could retain 'AI Breakout Capacity'. \n\nThere's precedent: Japan doesn't have a nuclear weapon, but always retains the capacity to build one on short notice.\n\nMiddle powers can make strategic choices today to ensure their ability to build frontier systems tomorrow: onshore compute, secure chip purchasing rights, sustain pre-training expertise, and create the right legal basis and private-sector vehicles for a sprint.\n\nThey'd still have to spend big to build frontier systems later on. But the longer they retain breakout capacity, the longer they can afford to wait: to see if interdependence with America can work, or until their electorate will let them go all-in on an AI moonshot. \n\nUntil then, the middle path is their wisest choice: hope that U.S. alignment works out, but retain the capacity to deal with being cut off for good. \n\nRead more in our latest for @CarnegieEndow's @CEIPTechProgram:  https://t.co/FWYgzMgbPm"}}, {"id": "2106138140142604648", "url": "https://x.com/ohlennart/status/2106138140142604648", "text": "I'm adopting SI. Would you really sell SUPER INTELLIGENCE chips to China?", "created_at": "2026-10-02T21:43:57+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 71, "retweets": 3, "media": [], "quoted": null}, {"id": "2105472435390906634", "url": "https://x.com/sayashk/status/2105472435390906634", "text": "I have been using the new ultrafast mode for Astra 6 for the last couple of days. My main takeaways:\n\n1. Token speed qualitatively changed how I interact with agents. The output speed is 300 tokens/second, 8x the regular speed. Rather than breaking flow and switching tasks, the model moves (just) fast enough that I can keep working on the same task, especially for work that requires frequent inputs from me. I am excited about ultrafast on Sol-class models, which are twice as fast as Astra.\n\n2. Despite being 8x faster at generating tokens, the overall speedup is only 2-4x, since the time consumed for tool calling or running code remains the same. External factors (and not token generation speed) might soon become the main bottleneck for agentic work. (Notably @random_walker predicted both of these changes in: https://t.co/BXNtg9vzCt)\n\n3. One area where speed really helps is computer use. The previous generation of models wasn't reliable enough at computer use to be useful. Astra was reliable enough to be useful, but still slow. Astra with ultrafast resolves both concerns. Unlike tool calls for coding tasks, UIs react in milliseconds, so token speed is the main bottleneck.\n\n4. At 300 tokens/sec, I am already struggling to keep up with the agent. But there is a lot more room for improvement. Cerebras serves GPT-OSS-120B at 3,000 tokens/sec and Sol at 750 tokens/sec. So in a year's time, it is plausible we'll see another 10x increase in speed in models with Astra-level capabilities. At that point, human oversight will become the bottleneck for what people can use computer-use agents for.\n\n5. I can imagine blazing fast computer-use agents becoming extremely common for knowledge work. But I expect their use will be jagged (in the same way as LLM and agent adoption has been): given the oversight challenge, adoption will begin in verifiable tasks where the cost of errors is low (e.g., filling out a form using an agent before reviewing it yourself), and slowly diffuse to hard-to-verify tasks.\n\n6. Given the challenges with human oversight, the key to this diffusion will be developing automated oversight tools. OpenAI's approval/verifier agents have already been useful to me on this front: The verifier understood my intent better than the computer-use agent, and stopped it from filling out a form incorrectly. Still, I expect there is a lot of headroom in improving verifiers for computer use, to make it as reliable in practice as auto mode in Claude Code/Codex is for coding tasks.\n\n7. Ultrafast mode is undeniably resource intensive: I ran through my weekly limit in ~2 hours while filling out a bunch of forms and doing simple coding tasks. But given the pace of efficiency improvements (and the fact that Sol is 5x cheaper than Astra and already decent at computer use), I expect it to rapidly fall. Once fast, cheap models are common, users may choose \"sub-frontier\" models like Sol and make real tradeoffs between speed and quality.", "created_at": "2026-10-01T01:38:41+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "likes": 164, "retweets": 23, "media": [], "quoted": {"author": "random_walker", "text": "Prediction: we will soon enter an era where the latency of agentic work is bottlenecked not by LLM inference speed but by tool use. Shell commands, build pipelines, computer use, web data extraction, and everything else that happens in the background is way slower than it needs to be, because it hasn't been subjected to the same kind of optimization pressure as LLMs, and isn't really getting faster."}}, {"id": "2104599381341315435", "url": "https://x.com/sayashk/status/2104599381341315435", "text": "RT @random_walker: NeurIPS / Claude rejected our paper \"Life After Benchmark Saturation\" but we continue to think it is an important contri…", "created_at": "2026-09-28T15:49:28+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "likes": 687, "retweets": 38, "media": [], "quoted": null}, {"id": "2104598897444413815", "url": "https://x.com/sayashk/status/2104598897444413815", "text": "RT @steverab: 📢 Just wrapped up some cool agent evaluation work for ICLR? Or are you simply interested in learning more about the evals lan…", "created_at": "2026-09-28T15:47:33+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "likes": 45, "retweets": 9, "media": [], "quoted": null}, {"id": "2104232638290804968", "url": "https://x.com/sayashk/status/2104232638290804968", "text": "RT @joshua_saxe: I've been noticing a cluster of folks I identify with sharing some themes around how we do epistemics and ontology in AI s…", "created_at": "2026-09-27T15:32:10+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "likes": 52, "retweets": 11, "media": [], "quoted": null}, {"id": "2105749449679196454", "url": "https://x.com/sayashk/status/2105749449679196454", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?", "created_at": "2026-10-01T19:59:26+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 74, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTkfpyBW4AALqBe.jpg"}], "quoted": null}, {"id": "2105704922499150308", "url": "https://x.com/sayashk/status/2105704922499150308", "text": "I had way too much fun using Claude to create a reply video. \n\n- Extremely fun to be able to convert scattered thoughts and ideas into a song + video\n\n- Creating this took <1 hour of my time (in occasionally steering the model in between other things)\n\n- But it took ~10 hours of wall clock time for the agent to generate the video + iteratively refine it based on feedback\n\n- In terms of AI usage: it required only a small number of Suno credits and 10% weekly usage of a Claude Max subscription (I was using Opus 5.5)", "created_at": "2026-10-01T17:02:30+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 336, "retweets": 33, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105703951593357314/img/yW0syBEppU_Lp3T5.jpg"}], "quoted": {"author": "sevdeawesome", "text": "Claude 5.5 Opus responding to “AI is a normal technology” is still the best AI-created video I have ever seen https://t.co/1FEdlSDqeV"}}, {"id": "2105700428772175931", "url": "https://x.com/sayashk/status/2105700428772175931", "text": "*Against today's high friction trusted cyber access programs and against restricting open-weights cyber models*\n\nThe key object of any discussion of AI restriction is the tradeoff between attacker use friction and defender use friction. I don't think today's trusted access programs dial this Pareto-optimally. Neither do proposed bans on frontier open-weights cyber models circulating in policy circles.\n\nTake Daybreak and Glasswing from OAI and Anthropic. These programs serve unguardrailed frontier models to trusted participants; I'm for Know Your Customer in principal, but these programs are too restrictive for defenders and buy us too little in attacker restriction for the cost.  From public information less than 1% of software developers are in these programs and able to use them to find and fix issues in their code.\n\nIt's true these participants cover the most highly leveraged codebases in the world but this still leaves an enormous gap; take the software objects Hacktron stepped through to access OpenAI's monorepo, libheif and the SaaS product Discourse, neither of which, I believe, were targeted by Daybreak/Glasswing. Diffusion of the best and most frictionless cyber capabilities to the long, vulnerable tail matters a lot.\n\nOpen weights is also extremely important for defenders.  Many organizations can't or don't want to share sensitive security data with OpenAI or Anthropic, often for understandable reasons; from what we can tell from the outside, these organizations seem to be playing fast and loose with security themselves.\n\nAnd if we're going to make security work at scale, we'll need to distill large frontier cyber models into smaller models that can monitor high volume trillion-event-scale feeds at low latency / high throughput, find and fix bugs cheaply, and monitor security events on-prem, on-device, and for military uses, in the field with patchy Internet connectivity. We need frontier open-weights models for this.\n\nTo be clear: I do think we should go to *extremely great lengths* to restrict attacker access to frontier cyber models.\n\nBut there are many policies that *are on the efficient frontier in denying attackers and enabling defenders* that we should consider.\n\nHere are things we can/should do to deny attackers AI access:\n\n* Low friction Know Your Customer programs across all inference providers based on self-enforced or regulation-enforced information sharing and blocklists that codify known-attacker signals; restrict attackers while pouring gas on defender adoption.\n\n* More defense in depth; all inference providers should do more to monitor API usage, detect attacker behavior, kick attackers off, and have them pursued, arrested, or sanctioned where appropriate.\n\n* Closed providers like OAI, Anthropic, Google, and Meta should do this, but so should open-model inference providers like Together, Anyscale, Fireworks, and OpenRouter.\n\n* Time-to-detection-and-response re attackers using cloud AI inference should be a KPI any AI inference company shares publicly; at least under a self-regulatory regime but probably eventually under an international regulatory regime.\n\n* It's true that the most sophisticated and capital-endowed attackers can build/access their own inference compute; but these operations should also be detected and shut down as well as possible by monitoring inference hardware markets as well as we can.\n\n* Victims of (AI) cyber attacks should also be induced to share more information so that we can get a moving epidemiological picture of attacker use.  Every AI-agent-based attack should also become a public natural experiment for the security community to learn from. \n\n* The poor reporting protocol OAI followed around the OAI/HF incident is not a good sign of maturity here. Why aren't we pushing much harder on public threat-intelligence sharing so defenders can prepare for the AI cyber phase transition?\n\nNone of this will prevent nation-states and sophisticated actors from adding agent swarms, backed either by Chinese or American models, to their arsenal of strategic weapons.\n\nBut we shouldn't confuse geopolitical problems for technical problems justifying slowing defender adoption and hardening the world's code and infrastructure. \n\nNation-states will find ways to get access to strategic AI-based cyber weapons with or without Daybreak, Glasswing, and open weights restrictions, because the two sovereign AI powers and their allies are in geopolitical competition. API-access gating is not sufficient defense against state-level cyber threats.\n\nWe should absolutely try to slow attackers down. But we have ~10 trillion lines of code to secure with AI as fast as possible, and a ~120trn GDP global economy to apply AI as an intrusion detection substrate over, and high-defender-friction restrictions are a poor stop-gap for accomplishing this...", "created_at": "2026-10-01T16:44:38+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 40, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HThjk_RWsAAtqIq.jpg"}], "quoted": null}, {"id": "2105700123846275146", "url": "https://x.com/sayashk/status/2105700123846275146", "text": "10 articles and papers we read in September 🏫📚\n\n1/ AI Existential Risk Probabilities are (still) too Unreliable to Inform Policy -\n@random_walker and @sayashk\nhttps://t.co/za6xlMhuZn", "created_at": "2026-10-01T16:43:26+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "likes": 19, "retweets": 6, "media": [], "quoted": null}, {"id": "2106061009043824956", "url": "https://x.com/sayashk/status/2106061009043824956", "text": "I'm at the Curve this weekend! I'll be talking about RSI on Sunday at 2pm. Also excited to talk about:\n\n- What does a big-tent AI safety movement look like?\n- How can we make progress on policy proposals where there is common ground across the community?\n- How can we improve our RSI evaluations?", "created_at": "2026-10-02T16:37:27+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTo6d8ubQAUa7ss.jpg"}], "quoted": {"author": "random_walker", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?"}}, {"id": "2104986882073657846", "url": "https://x.com/testingham/status/2104986882073657846", "text": "RT @DevenPzak: I really enjoyed working on this project. I believe the new flop-aware paradigm of nanoGPT thinking is useful, and it seems…", "created_at": "2026-09-29T17:29:16+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "is_retweet": true, "likes": 257, "retweets": 30, "media": [], "quoted": null}, {"id": "2105786054058164627", "url": "https://x.com/slatestarcodex/status/2105786054058164627", "text": "Oh, you're worried about a Jewish guy's apocalyptic cult? You're scandalized that they consort with prostitutes? You think their message of compassion for everyone threatens normal bonds of family, community, and nation? Should we throw you a party? Should we invite Pontius Pilate?", "created_at": "2026-10-01T22:24:53+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3302, "retweets": 214, "media": [], "quoted": null}, {"id": "2105763915103891642", "url": "https://x.com/s8mb/status/2105763915103891642", "text": "What kind of chippy city slogan is this? https://t.co/cQKJiPaxet", "created_at": "2026-10-01T20:56:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 184, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTktF_IWEAEC01o.jpg"}], "quoted": null}, {"id": "2105739467151548859", "url": "https://x.com/s8mb/status/2105739467151548859", "text": "Here's my hack for avoiding the overnight return flight from DC to London, btw. I can't sleep on them. I'm getting the train to Newark Airport, checking into the hotel here, then going into NYC for dinner. Then sleep, and get the morning flight back to London. (There is no daytime flight from DC, only NY.)\n\nBetter to spend a night in a hotel and a day on a plane than a night on the plane and a day feeling sleep deprived and miserable. The downside is the time spent on the train, but it's so comfortable it's really not much different to being in an office. The upside is – dinner in New York!", "created_at": "2026-10-01T19:19:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 267, "retweets": 1, "media": [], "quoted": null}, {"id": "2105739349744885846", "url": "https://x.com/s8mb/status/2105739349744885846", "text": "Here's my hack for avoiding the overnight return flight from DC to London, btw. I can't sleep on them. I'm getting the train to Newark Airport, checking into the hotel here, then going into NYC for dinner. Then sleep, and get the morning flight back to London.\n\nBetter to spend a night in a hotel and a day on a plane than a night on the plane and a day feeling sleep deprived and miserable. The downside is the time spent on the train, but it's so comfortable it's really not much different to being in an office. The upside is – dinner in New York!", "created_at": "2026-10-01T19:19:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 1, "media": [], "quoted": null}, {"id": "2105737581539287143", "url": "https://x.com/s8mb/status/2105737581539287143", "text": "Big fan of the Amtrak train I'm on. Much bigger and more comfortable seats than British trains have – Amtrak coach is as good as British first class. The carriages have a cool brushed steel exterior. The conductor wears a fun peaked cap. Americans: surprisingly good at trains!", "created_at": "2026-10-01T19:12:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 385, "retweets": 9, "media": [], "quoted": null}, {"id": "2105414252131402033", "url": "https://x.com/s8mb/status/2105414252131402033", "text": "I’m in Union Market in Washington DC, which has been hugely upzoned and densified over the past decade - apparently it’s the zip code in America with the most new housing over that period. It’s awesome! Really nice to walk around, and lots of nice restaurants and cafes. https://t.co/vneGZbrQnP", "created_at": "2026-09-30T21:47:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 614, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3YXMAEs_IS.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3XWQAASznl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3lW0AAMqcj.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTfvE3kXgAA4fJl.jpg"}], "quoted": null}, {"id": "2105410143806730435", "url": "https://x.com/s8mb/status/2105410143806730435", "text": "Excellent!", "created_at": "2026-09-30T21:31:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 0, "media": [], "quoted": {"author": "ZachBIsrael", "text": "Trump signed an executive order yesterday directing federal agencies to develop and implement, by November 27, a campaign across Washington, D.C. to reduce, by 2028, invasive mosquito populations by 90% &amp; tick populations by 50%: https://t.co/0FkpahWnrO @chenderson https://t.co/svmnl6zZLF"}}, {"id": "2105354272192045341", "url": "https://x.com/s8mb/status/2105354272192045341", "text": "Luis is one of the most interesting people I read and follow. Perhaps the most clear-sighted person in the world on Europe’s challenges and still not a pessimist about it!", "created_at": "2026-09-30T17:49:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 56, "retweets": 2, "media": [], "quoted": {"author": "tylercowen", "text": "My excellent Conversation with Luis Garicano, https://t.co/Yj7ylIDXnq, @lugaricano"}}, {"id": "2105351701607641268", "url": "https://x.com/s8mb/status/2105351701607641268", "text": "My excellent Conversation with Luis Garicano, https://t.co/Yj7ylIDXnq, @lugaricano", "created_at": "2026-09-30T17:38:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "tylercowen", "rt_author_name": "tylercowen", "likes": 106, "retweets": 24, "media": [], "quoted": null}, {"id": "2105283452454981828", "url": "https://x.com/s8mb/status/2105283452454981828", "text": "The answer is to tax the wealth generated by the robot when it is consumed, ie when it is no longer being used to produce more stuff. VATs do this well, and taxes on corporate income can be adjusted to function the same way (eg, cash flow taxes).", "created_at": "2026-09-30T13:07:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 111, "retweets": 9, "media": [], "quoted": {"author": "ezraklein", "text": "Bill Gates on why we should tax A.I. work: “If you’ve let go of a worker and hired a robot to do that job, why are you so incentivizing the trade-off against the human labor that you don’t ask the robot to also pay into the pension fund? What is it? Is it that the pro-robot union has gotten the tax laws to say: No, if you’re not flesh, then let pensions go bankrupt?”"}}, {"id": "2105078652882833723", "url": "https://x.com/s8mb/status/2105078652882833723", "text": "If you’re in Washington DC tomorrow, come join us for the launch of the new issue of Works in Progress. See you there! https://t.co/YdayEMpKzp", "created_at": "2026-09-29T23:33:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 2, "media": [], "quoted": null}, {"id": "2105033226981081130", "url": "https://x.com/s8mb/status/2105033226981081130", "text": "This was great and I’ve been enjoying Instinct. Shinn is very likeable, and I found it pretty helpful for thinking of ways to use it.", "created_at": "2026-09-29T20:33:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 2, "media": [], "quoted": {"author": "patrick_oshag", "text": "My conversation with Noah Shinn (@noahrshinn), founder of Instinct.\n\nNoah is building a personal AI assistant. It's still invite only, has spent nothing on marketing, and is growing roughly 10% A DAY. \n\nThis is his first long conversation about the company.\n\nWe discuss:\n- Why Instinct doesn't have an app\n- Buying compute months ahead of exponential demand\n- How users learn to trust it with a credit card\n- Safety and security\n- Agents coordinating with other people's agents\n- Instinct's business model\n- Apps built on consumer inertia\n- and more\n\nEnjoy!\n\nTimestamps:\n0:00 Intro\n4:11 What people are using AI agents for\n15:07 Rethinking travel, reservations, and the internet\n22:43 Trust, privacy, and personal data\n27:50 The business model behind Instinct\n38:04 How existing businesses will adapt\n47:55 Designing a personal assistant people love\n53:15 Growth, compute, and competing with Big Tech\n1:11:44 What’s next for Instinct and personal AI"}}, {"id": "2105031308321632292", "url": "https://x.com/s8mb/status/2105031308321632292", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA", "created_at": "2026-09-29T20:25:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 1725, "retweets": 294, "media": [], "quoted": null}, {"id": "2104996339893629047", "url": "https://x.com/s8mb/status/2104996339893629047", "text": "This is great. It makes me really annoyed at how much fare evasion is becoming tolerated on the Tube. We need a cheap, swift way to make an example of these people and humiliate them - I propose by putting them in the pillory outside the station they’re caught in. https://t.co/emAI6w2bis", "created_at": "2026-09-29T18:06:51+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 80, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZy_ixbcAAACSA.jpg"}], "quoted": {"author": "emmma_camp_", "text": "Want to reduce crime on the subway? Enforce the fares.\n\nMy latest for @WSJFreeEx \nhttps://t.co/QeCO4c1oUr"}}, {"id": "2104979759038157209", "url": "https://x.com/s8mb/status/2104979759038157209", "text": "When I stilled worked on biosecurity, I first learned about Debug, a Google project to reduce mosquito populations. \n\nResults from their Singapore pilot are now out. \n\nThey crushed mosquito populations, reducing dengue infections by 70% in the process: https://t.co/X26UdpPuUi", "created_at": "2026-09-29T17:00:57+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "Simon__Grimm", "rt_author_name": "Simon Grimm", "likes": 5565, "retweets": 593, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZMz0kWsAAkBXc.jpg"}], "quoted": null}, {"id": "2104961136315744287", "url": "https://x.com/s8mb/status/2104961136315744287", "text": "I don't really understand why people on a daytime westbound flight, where it's 11:45am at the destination, would want the cabin to be darkened and all the window blinds shut. It doesn't make sense to me.", "created_at": "2026-09-29T15:46:57+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1784, "retweets": 19, "media": [], "quoted": null}, {"id": "2104952364545532194", "url": "https://x.com/s8mb/status/2104952364545532194", "text": "The Tower Broker.", "created_at": "2026-09-29T15:12:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 1, "media": [], "quoted": {"author": "tamarawinter", "text": "Stripe Press’s newest author is in the tiny handful of people with the strongest claim to being New York’s modern power broker: Mary Ann Tighe, CEO of CBRE’s New York Tri-State region. \n\nMary Ann’s fingerprints are all over Manhattan. Since becoming CEO in 2002 she’s brokered more than 133 million square feet of commercial real estate transactions. A (very small) selection of her deals: \n\nShe brought Condé Nast to 4 Times Square, and at the time it was the first new office building constructed in New York in a decade(!). \n\nShe represented the NYT in the development of its new headquarters on Eighth Ave. \n\nShe brought Coach in as the first Hudson Yards tenant. \n\nFor 1199SEIU, one of the country’s largest healthcare workers’ unions, she helped engineer a 580,000-square-foot headquarters deal projected to save the union and its benefit funds roughly $400 million over 30 years. \n\nAnd perhaps most meaningfully, Mary Ann was instrumental in rebuilding the World Trade Center, including bringing Condé Nast to One World Trade, and, more than two decades later, securing American Express for roughly 2 million square feet at 2 World Trade Center (broke ground ~ two months ago!). \n\nMary Ann’s book (tentatively titled BUILDING NEW YORK) traces the stories of the deals themselves, but also the personalities who’ve made modern New York, from mayors, to CEOs, to the Vatican—whose approval she needed to broker the air rights for St. Patrick’s Cathedral! \n\nIt’s rare to get such a candid view into how the real estate sausage gets made, especially at Mary Ann’s level. We can’t wait to bring you her book."}}, {"id": "2104944101741486133", "url": "https://x.com/s8mb/status/2104944101741486133", "text": "We need a Conscious Extinction movement to rid the world of the animals and plants that cause the worst disease and suffering. \n\nIt's good that smallpox and rinderpest are extinct. It's good that the screwworm fly and malarial mosquitos were extinct in the developed world. So let's extend the logic to other disease-carrying mosquito species, along with lots of other pests, and let's not stop at the borders of the rich world.", "created_at": "2026-09-29T14:39:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 360, "retweets": 33, "media": [], "quoted": {"author": "salonium", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA"}}, {"id": "2104896090197889489", "url": "https://x.com/s8mb/status/2104896090197889489", "text": "Very good post from @AtalantaArdenM on the role of suffering in art: https://t.co/eyzqdV0G7E.", "created_at": "2026-09-29T11:28:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "patrickc", "rt_author_name": "Patrick Collison", "likes": 298, "retweets": 17, "media": [], "quoted": null}, {"id": "2104887580873613386", "url": "https://x.com/s8mb/status/2104887580873613386", "text": "I’m slowly cleaning up the suburbs with Muse.\n\nSaw this mess of wires on a pole. Took a picture and asked Muse to contact Verizon to get them cleaned up.\n\nIt went to their website and got to work.\n\nThere is a 0% chance I would’ve sat in a Verizon support chat over this. I would’ve just been mildly annoyed every time I walked past it for the next five years.\n\n“Someone should do something about that” is now a prompt.\n\n🤝 @alexandr_wang", "created_at": "2026-09-29T10:54:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "toddsaunders", "rt_author_name": "Todd Saunders", "likes": 6681, "retweets": 269, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUYZRpWgAEPWQJ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTUYZRtWUAAqrOR.jpg"}], "quoted": null}, {"id": "2104885089360638232", "url": "https://x.com/s8mb/status/2104885089360638232", "text": "These are fantastic.", "created_at": "2026-09-29T10:44:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [], "quoted": {"author": "Lanefab", "text": "We’ve been channeling a bit of retro futurism with these #singlestair prototypes. \n\nThere was a lot of great urbanism at the start of the 1900s (before cars took over) and a lot of that same approach can work well with modern passive house design &amp; low embodied carbon materials. https://t.co/1eSufPWKZQ"}}, {"id": "2104879677303378374", "url": "https://x.com/s8mb/status/2104879677303378374", "text": "The PM is expected to signal an end to the triple lock today. But what are the options for reform, and how much money do they save?\n\n@BritishProgress (namely, @matthewgstubbs) has made a tool to compare the different ideas on the table.\n\nFor instance, you can compare @timleunig's '5-year triple lock' with @resfoundation's 'smoothed triple lock' proposal (originally proposed by @TorstenBell and @lauracgardiner) to see that they each would save around £60bn by 2047, and deliver an annual state pension of around £27k (nominal).\n\nAs you can see, the amount of money that can be saved – particularly over a longer time-horizon, is enormous.", "created_at": "2026-09-29T10:23:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "dc_lawrence", "rt_author_name": "David Lawrence", "likes": 61, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTX8bGfXMAARjwk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTX9QsoWEAAiwc7.jpg"}], "quoted": null}, {"id": "2104857069476249944", "url": "https://x.com/s8mb/status/2104857069476249944", "text": "I think the Natural History Museum is my favourite building. It’s beautiful, awesome, and fun! https://t.co/UlS93smEWI", "created_at": "2026-09-29T08:53:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 155, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTX0WDaXAAAUSX-.jpg"}], "quoted": null}, {"id": "2104837979088830864", "url": "https://x.com/s8mb/status/2104837979088830864", "text": "The triple lock is stupid, but if since 2010 we’d had a “double lock” targeting the higher of earnings or inflation instead, and used a three-year moving average, we’d only be spending £11 billion less today. 0.09% higher economic growth over a decade would cover that.", "created_at": "2026-09-29T07:37:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 387, "retweets": 18, "media": [], "quoted": {"author": "GjMcGowan", "text": "Now is time for my heterodox view that this commitment isn't that expensive and the political capital spent on abolishing it would be better spent on $LIST_OF_PRO_GROWTH_REFORMS"}}, {"id": "2104822123122372852", "url": "https://x.com/s8mb/status/2104822123122372852", "text": "The harder I have to work, for example with my children or my job, the less “fun” I have but the more satisfied with my life I feel.", "created_at": "2026-09-29T06:34:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 118, "retweets": 1, "media": [], "quoted": null}, {"id": "2104820719565574262", "url": "https://x.com/s8mb/status/2104820719565574262", "text": "I think it would be good to raise defence spending to 3% primarily so we have something to trade for access to American frontier AI models.", "created_at": "2026-09-29T06:28:59+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": null}, {"id": "2104554919206265189", "url": "https://x.com/s8mb/status/2104554919206265189", "text": "They must be from quite well-to-do families with addresses like these.", "created_at": "2026-09-28T12:52:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1132, "retweets": 41, "media": [], "quoted": {"author": "PatrickChristys", "text": "Major update from counter terror police about RAF Fairford arrests - all UK nationals: \nMale, 24, Resident of Borough of Camden\nMale, 24, Borough of Westminster\nMale, 25, Borough of Westminster\nMale, 23, Borough of Westminster\nMale, 24, Borough of Willesden"}}, {"id": "2104547805905789225", "url": "https://x.com/s8mb/status/2104547805905789225", "text": "\"Just 10 of the recommendations have shown real progress since April. On 23 of them, essentially nothing has happened at all.\"", "created_at": "2026-09-28T12:24:32+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 90, "retweets": 13, "media": [], "quoted": {"author": "Michael_J_Hil", "text": "1/4 Everyone agrees that the Fingleton Review needs to be implemented to get our nuclear costs down. Yet progress towards implementing these recommendations is stalling – more and more of them are off track. https://t.co/wAPw7almpd"}}, {"id": "2104545412795322636", "url": "https://x.com/s8mb/status/2104545412795322636", "text": "After 2 years we finally got planning permission for our scheme of 29 apartments and ground floor retail on Tiviot Dale, Stockport. The scheme had no objections from anyone! @andyburnham @mtpennycook you will never deliver 1.5m homes without more radical changes to the planning system.", "created_at": "2026-09-28T12:15:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "OS_Architects", "rt_author_name": "Ollier Smurthwaite", "likes": 1256, "retweets": 79, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTTJ-19WoAAlPMb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTTJ-18XAAAKKq_.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTTJ-18W8AAaPNF.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTTJ-14W0AA4hym.jpg"}], "quoted": null}, {"id": "2104535139661631948", "url": "https://x.com/s8mb/status/2104535139661631948", "text": "Much of history's greatest art was cheerful and optimistic despite being made by artists suffering from almost unimaginable grief. \"Distraction and absorption may be much more ameliorating than cathars
