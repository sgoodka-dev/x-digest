DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 621, "retweets": 51, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2107023143344971857", "url": "https://x.com/mentalgeorge/status/2107023143344971857", "text": "Say you let Opus 4.7 play 1 billion games of online chess.\n\nBetween games, it can reflect on its play and write .md files to itself for future match-ups. \n\nHow much does its Elo change?", "created_at": "2026-10-05T08:20:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "likes": 96, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106818428988514667", "url": "https://x.com/mentalgeorge/status/2106818428988514667", "text": "@petergostev notable that this runs counter to how (a small sample of) people were predicting a version of this experiment this would play out back in May https://t.co/qA1r0UOkC1", "created_at": "2026-10-04T18:47:10+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "petergostev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTzsA5XWMAAWrve.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107367808661119037", "url": "https://x.com/mentalgeorge/status/2107367808661119037", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl", "created_at": "2026-10-06T07:10:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kevinroose", "rt_author_name": "Kevin Roose", "likes": 290, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107547578929688804", "url": "https://x.com/mentalgeorge/status/2107547578929688804", "text": "Check out our new work on \"how do Chinese AI firms make money\"!", "created_at": "2026-10-06T19:04:33+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 39, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2108362002473304464", "url": "https://x.com/mentalgeorge/status/2108362002473304464", "text": "This excerpt of Dario's 2017 \"Big Blob of Compute\" essay is, to my knowledge, the best public explanation of an all-important question: why is Dario optimistic about alignment?\n\nThough his section on AI safety isn't in the excerpt, we can piece the following worldview together:\n\n1. Intelligence only works at all is because the universe is low-entropy.\n\n2. Given enough compute and a broad enough distribution of tasks, models will learn the \"high-level commonalities\" of a distribution (like the laws of physics) because doing this takes fewer bits than solving each task separately.\n\n(Note that Dario's emphasis on generalisation being a property of data distributions rather than algorithms has clearly persisted. The example 2017 Dario gives of speech models trained on 5 to 6 accents generalising to unseen accents is remarkably similar to the point he makes 9 years later on Dwarkesh's podcast about RL eventually generalising in the same way that GPT-2 did.)\n\nIt therefore seems that Dario believes that:\n\n3. Alignment is straightforward because \"human values\" (or \"goodness\", \"corrigibility\" or whatever else our alignment target is) are high-level commonalities in the same way that the laws of physics are.\n\n(^Dario doesn't explicitly say this in the essay, but it matches what @geoffreyirving told me when I interviewed him - that the core of his disagreement is that Dario believes alignment will generalise easily.)\n\nThis view implies that the goal of AI safety, summarised very simply, is to make sure that models trained with enough compute and data to become AGIs must simultaneously be trained on enough data to learn \"human values\" (or whatever our alignment target is).\n\nThis doesn't happen by default, but it is very far from impossible. This is, of course, exactly the kind of view that makes founding Anthropic and racing to superintelligence make sense.\n\nThere are two obvious problems with this view as I see it.\n\nFirst, as Paul points out in \"Returning to Arc\", we don't actually understand generalisation. So while it may be true that there exists some distribution that *does* teach models the \"high-level commonality\" that is our alignment target (eg \"human values\"), we don't have a way of knowing whether this has in fact happened, or whether the model has instead learned some other tactic that will have bad consequences in some distribution we have yet to elicit.\n\nSecond, it seems at least possible that our alignment target is in fact *not* a high-level commonality within the data distribution we give models, even in theory. Certainly, this would appear to be true of the current training regimes we put models through. @1a3orn convincingly argues that there is no coherent rule about how models should relate to users that could plausibly underpin the mess of environments we subject models to in training. It also strikes me as possible that we are too philosophically confused to construct a coherent alignment target to begin with.\n\nMy core uncertainty about how worried to be basically depends on whether pursuing this path produces models which become too misaligned to be usable before they become world-ending.", "created_at": "2026-10-09T01:00:47+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 202, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUJoEWbbsAABD1Q.jpg"}], "quoted": {"author": "kevinroose", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl"}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108328771543839015", "url": "https://x.com/mentalgeorge/status/2108328771543839015", "text": "I can't really see a world where OpenAI's actions are justified here. \n\nIt was Tomek's job to communicate with METR, who were being given significant, unprecedented access to do the HuggingFace report.  The norms were not set. Even if he fucked up badly, just give him a stern warning and ban him from roles involving liasoning with third parties, he did lots of other valuable work, and there'd no longer be room for him to inappropriately leak as part of his job. \n\nIMO firing people over a good faith attempt to use their best judgement in a novel and uncertain situation is a sign of a highly unhealthy culture. Firing him will have a chilling effect on anyone else at OpenAI working with third parties, an odd choice when Sam announced they'd embed evaluators with high access. \n\nI separately consider this a tragedy, the METR report was one of the most important works of safety this year, punishing Tomek for being a part of it, and making it harder for future such reports to exist is a real shame.\n\nOf course, I've only heard Tomek's side, but unless he's outright lying I'm struggling to see ways this looks good for OpenAI?", "created_at": "2026-10-08T22:48:44+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 1020, "retweets": 54, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2106138140142604648", "url": "https://x.com/ohlennart/status/2106138140142604648", "text": "I'm adopting SI. Would you really sell SUPER INTELLIGENCE chips to China?", "created_at": "2026-10-02T21:43:57+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 71, "retweets": 3, "media": [], "quoted": null}, {"id": "2108209356433207653", "url": "https://x.com/ohlennart/status/2108209356433207653", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T14:54:13+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108255517894181226", "url": "https://x.com/ohlennart/status/2108255517894181226", "text": "I think the field of AI verification has matured enough that you need to answer “verifying what?” when talking about it.\n\nIMO the key challenge sits there. Connecting something you can verify—often a narrow technical claim—to something that actually matters.", "created_at": "2026-10-08T17:57:39+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108641759786135810", "url": "https://x.com/ohlennart/status/2108641759786135810", "text": "i had a convo with Claude about this and wanted to estimate how many dogs per sqft it needs but it triggered some safeguards", "created_at": "2026-10-09T19:32:26+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108641444508709055", "url": "https://x.com/ohlennart/status/2108641444508709055", "text": "pacing solution: 5 super hairy dogs in every fab. yield goes to zero.", "created_at": "2026-10-09T19:31:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2107484134847512903", "url": "https://x.com/sayashk/status/2107484134847512903", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought is desirable for its own sake. \n\n7. On the other hand, I find some critiques of AI safety world that focus on whether they sincerely hold their beliefs a bit annoying. My concern has never been the good intentions or sincerity, but rather the beliefs themselves, and what I think the outcomes of their prescriptions will be. People should shun witch hunts, bullying, and personal attacks - this is not the way. Though I think it’s overall positive that people are scrutinizing things more.\n\n8. I’ve been saying this for years, but I don't think alignment is something anyone can or will solve \"once and for all\" - it's a continuous process and much of it won't depend on just inculcating an ideology to a model. It's annoying that this remains the frame many people use - stop saying ‘solving’. Alignment is a mixture of engineering work, philosophy, decision theory, and more; framing it as something to solve is a bad frame. See also https://t.co/2gnheo3IMh and https://t.co/DbG0yUyYQ0\n\n9. I'm surprised to see so little interest in character training, personas, isolating effects of RL, and training a large diversity of model personas beyond the \"assistant\" persona. I've been complaining about this for years but at least now there are some nascent signs of life (see for example https://t.co/paoOYiQUHt). I think we need a better ontology to describe model behaviour. I dislike when people talk about models behaviours as some sort of 'emergent' (mysterious!) phenomenon. However over time, I also expect this to become less important as we get better safety engineering - stuff like Jev but specific to AI control.\n\n10. People who want to make a case for AI consciousness are right that epistemic uncertainty is important, and that categorical denials are overconfident. But they'll need to do much more work if they want any real movement on AI ‘welfare’, even if one acknowledges the uncertainty. I'm uncertain about alien life yet that's not sufficient to warrant any change in behaviour about them. I think Suleyman is also correct that there's a weird tautological thing going on where we train models to have certain inclinations (intentionally or not) and then rely on outputs as evidence. I also disagree that this will soon be a major societal divide - there is no great vegan ethical revolution among the masses, and they'll find the concern about consciousness even less compelling. \n\n11. The recent HuggingFace incident and associated AISI ones are prosaically explainable by the training regime, poor evaluation envs, partial alignment training, bad engineering, confusing models on sim/real, and so on. None of this is evidence of models trying to take over, 'strong' instrumental convergence, or innate power-seeking drives stemming from higher capabilitiers or 'intelligence'. That doesn't mean these incidents are not problematic, or that we're not seeing a market failure - but it does mean we have plenty of agency and choice in mitigating them. In the coming year we should also expect continued sampling bias via ‘winner's curse’ sorts of mechanism: i.e. AI R&D will have lots of different candidate \"training\" with different RL environments and we will only notice/focus on the ones that go wrong.\n\n12. \"Pacing the frontier\" feels a bit like the new \"balancing risks and opportunities\" - highly amorphous and too big of a tent to be actionable. Also can lead to reward hacking for humans, i.e. anything that slows down AI is good regardless of the costs or second/third order effects. Trying to modulate the speed of research seems a bit blunt to me, and inherits all the failures of Goodhearting too. Ultimately you want good governance, regulation, etc addressing specific problems because they are good on the merits - not because they merely correlate with slowing things down. See also: https://t.co/RkJF9kCgFd\n\n13. There’s so much knowledge in all sorts of academic domains out there: social sciences, sociology, political sciences, management, contract theory, public choice, legal theory, jurisprudence, anthropology, game theory, etc. These fields hold many insights that the AI ecosystem often rediscovers from first principles (and sometimes that's fine!). We’ll need a lot more work for these worlds to collide: the AI side should be less dismissive of the ‘old world’ and the academic side should be less incurious/dismissive of AI progress. This is a boring take but I continue to think it's important and true.\n\n14. It's a bit surprising that given how much philanthropic money there is in this space, how few orgs exist to actually write out standards - relative to how much is going towards advocacy and policy. For example it seems clear that we should want some robust best practices for an eval's ecological validity. Or how to design good sandboxes. On the other hand, given precedents of where professional standards have come from in the past, maybe we should expect that stuff to emerge via demand side from corporate buyers.\n\n15. One slowly growing concern I have is banks being increasingly exposed to the AI build out. I'm very bullish about AI, but I think (a) every general purpose technology has seen a correction, historically; (b) this happens even if the financing side is sound, because once tech diffuses investors become more exposed and need to diversify; and (c) we seem to be over-indexing on scaling relative to diffusion. A recession will be extremely destabilizing, though I would be interested in someone unpacking the potential implications more.\n\n16. Diffusion is good because (a) this is where the rubber hits the road and where a competitive deployment ecosystem generates consumer surplus; (b) it's directionally helpful to avoid concentration of power; and (c) it will help rebalance public opinion by making the benefits more tangible. Unfortunately it's entangled with decades long problems with our over regulated markets: clinical trials reform for example is long overdue. In general, this is far more of an issue in Europe than in the US though.\n\n17. Relatedly, I think the \"frontier lab eats everything\" view is incorrect (just as the ‘singleton’ view was incorrect). I think models ultimately commoditize, efficiency goes up, costs go down, and while you'll always want frontier for certain domains, much of the economy will value many other things than \"max capabilities\" for tasks - e.g. control over data and efficiency/speed. The demand side will also continue to push for reducing dependency and maximising optionality, privacy etc so I'm bullish on things like mixture of models and routing. All of this is good for competition and diffusion of control.\n\n18. Philanthropists served as the primary benefactors funding Venice's rich art and architectural history. I want to see so much more support for arts and culture. I'm so tired of the Monster energy Bored Ape fake vintage maps matcha Greek statue soft-pastel slop. If rich tech people and philanthropy wants to support this, they should also donate pretty much unconditionally - i.e. I don't want them to act as filters. I sympathize with people who want to make the world more beautiful, but don't want this to be determined by people who only know Greek statues and pretend to care about virtue ethics. As usual, let a thousand flowers bloom.\n\n19. Too many people treat AGI/ASI as something indistinguishable from a God. Any mention of bottlenecks, physical limits, control, adaptation etc are met with skepticism: \"You don't really believe in ASI.\" It's been remarked on before, but the behavior of some people really feels quasi-religious in nature sometimes. It's underrated how unpopular this vibe is amongst the wider public. The silver lining is that this specifically will diminish those people's outsized current relevance.\n\n20. It seems like a lot of people that get rich and leave tech/labs end up having some sort of crisis of meaning. They need something to believe in and fight for, or some equivalent of repentance, or go search for edgy counterintuitive ideologies (sometimes even pretty bleak/dark stuff). I think they should spend more time with people outside the Bay Area.", "created_at": "2026-10-06T14:52:27+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 364, "retweets": 77, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9A2XyX0AARPfq.jpg"}], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107190125142897054", "url": "https://x.com/testingham/status/2107190125142897054", "text": "@karthiktadepall @DevenPzak Hutter prize compression competition: https://t.co/OGTZzlZGko", "created_at": "2026-10-05T19:24:10+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT4-KiXbwAAZ-SF.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107189864823488582", "url": "https://x.com/testingham/status/2107189864823488582", "text": "@karthiktadepall NanoGPT (showing @DevenPzak 's huge jump, but not his more-recent even bigger apparent jump). https://t.co/PNxVV50m82", "created_at": "2026-10-05T19:23:08+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT49u3ybIAAA274.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107189485326995657", "url": "https://x.com/testingham/status/2107189485326995657", "text": "Data: https://t.co/Is28wxbjHo\n\nOriginal blog post: https://t.co/UADyLlhg1M\n\nRelated by @karthiktadepall  on games: https://t.co/18FNyziadE", "created_at": "2026-10-05T19:21:37+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "karthiktadepall", "text": "no evidence of AI coding uplift in video game development. \n\nwhy? https://t.co/aiNqKAygA4"}, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107188676883280046", "url": "https://x.com/testingham/status/2107188676883280046", "text": "Finally we want a theory of why some metrics are accelerating and some not. What types of discovery is AI particularly good at helping with?\n\nHere's a very loose conjecture: AI accelerates discovery where the marginal cost of an experiment is low. If experiments (AKA verifications) are cheap, then you can use experiments as a substitute for understanding; if they're expensive you still need to lean on human understanding. I will make some very conjectural claims about the marginal cost of experiments/verifications in different areas:\n\n- Cyber vulnerabilities: marginal cost is small once you already have the software loaded in memory, a few CPU cycles to verify. \n\n- Math proofs/counterexamples: the fixed cost of formalizing a problem can be high (e.g. converting to Lean, or expressing the core problem in code), but the marginal cost is just a few CPU cycles.\n\n- NanoGPT: until recently the cost of a single run was 8xH100 GPU for 1.5 minutes, and to get tight confidence intervals you need 18 of those runs. This could perhaps explain why we didn't get much movement until recently.\n\n- Hutter compression: 50 hours of CPU time.\n\n- Stockfish: Claude estimates $100-300 of compute cost to statistically verify a small improvement.\n\n- CIFAR: Claude says it's ~$1 to verify, so this could be a counterexample.\n\nAn implication of this theory: we might see slower curve-bending in domains where the cost of experimentation is large, e.g. frontier pretraining, where experiments can cost a huge amount of money; and domains where we need real-world experiments -- physics, chemistry, biology (though everything changes if we can trust simulations).\n\nAlso note a corollary of this theory: if data and intelligence are substitutes, then making our AI smarter will loosen the bottleneck from experiments.", "created_at": "2026-10-05T19:18:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107188675398553720", "url": "https://x.com/testingham/status/2107188675398553720", "text": "Overall I think this is evidence of a lot more curve-bending in the last 6 weeks, and the algorithmic progress should be updating for people who worry about RSI.\n\nA reminder: (1) we're looking at metrics with a reasonable pre-AI baseline rate of discovery, and (2) this update only discusses metrics we already discussed in the previous post.\n\nSome additional observations:\n\n1. The most important curves are secret. We really want to know when the frontier labs' AI efficiency and capability curves start bending, and that's not generally public information.\n\n2. I think this area is under-invested in. I'd love to see people maintaining dashboards of curves to watch for when they start bending. I'm confident the set of metrics I'm tracking could be substantially improved. I find this information much more updating than results from LLM benchmarks or RCTs.\n\n3. Whether the discoveries are AI-alone or AI-assisted is always hard to tell, but it matters less than the aggregate rate of discoveries.\n\n4. What other metrics should we be tracking? Most broadly, I think we want frontier *efficiency* metrics: e.g. FLOP cost of calculation, monetary cost of a FLOP, energy cost of a solar cell, efficiency of chemical synthesis. Would also be good to track more equilibrium metrics, e.g. cybercrime, though these are harder to interpret because they are outcome of a multi-player game. It's interesting to track production of code, software, and academic papers, but it's very difficult to proxy for quality, and that makes those harder to interpret.\n\n5. We don't know expenditure. Ideally we'd want to track the total expenditure on discovery, but that's super hard to get data on (esp. including failed discoveries). Still the data on output is informative.", "created_at": "2026-10-05T19:18:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107188673381109846", "url": "https://x.com/testingham/status/2107188673381109846", "text": "More curves are bending. In mid-August Nate Rush & I posted an analysis of which discovery curves are starting to bend. What's happened since then?\n\nCyber vulnerabilities: curve is still bent. Discovery of vulnerabilities is accelerating even further, though exploited vulnerabilities remain fairly flat.\n\nMath: curve is further bent. We said there was a likely acceleration for small-scale problems. Since then there has been a claimed Millennium prize resolution, & credible rumors of another. All frequently-updated databases of open problems seem to be proceeding at a rapid rate.\n\nAlgorithms: curve is now bending. Two high profile algorithmic competitions have had big curve-bending events: NanoGPT, and the Hutter compression prize. Other frequently-updated series remain relatively unchanged: CIFAR-10, Stockfish, matrix-multiplication exponent.\n\nMore observations below.", "created_at": "2026-10-05T19:18:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 12, "media": [], "quoted": {"author": "testingham", "text": "New post with Nate Rush: Have we seen an acceleration in discoveries?\n\nMany plots & some tentative conclusions:\n\n1. Cyber: ⤴️ sharp acceleration\n2. Math: ↗️ some acceleration\n3. Algorithms: ➡️ no clear acceleration"}, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107483525947781289", "url": "https://x.com/testingham/status/2107483525947781289", "text": "Interactive version: https://t.co/AMKb9FPmxW", "created_at": "2026-10-06T14:50:02+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107479914308079805", "url": "https://x.com/testingham/status/2107479914308079805", "text": "Slightly scary that the current frontier model (Opus 5.5) doesn't get below 50% on any of its benchmarks.", "created_at": "2026-10-06T14:35:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107479616424435949", "url": "https://x.com/testingham/status/2107479616424435949", "text": "ECI and its components\n\nECI treats each benchmark as having a logistic distribution, so it's linear in log-odds. This implies if you plot log-odds of each benchmark the lines should all be increasing together, though each has a different x-position (difficulty) and different dispersion (slope).", "created_at": "2026-10-06T14:34:30+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9ER47aQAEzRI6.jpg"}], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107335505453142077", "url": "https://x.com/testingham/status/2107335505453142077", "text": "@nathan84686947 Unfortunately not much historic experience to base it on", "created_at": "2026-10-06T05:01:51+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "nathan84686947", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107245298762526782", "url": "https://x.com/testingham/status/2107245298762526782", "text": "@_ueaj Sorry if I’m misunderstanding but I think we agree on this — see update from today https://t.co/euD8niPgA7", "created_at": "2026-10-05T23:03:24+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "_ueaj", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "testingham", "text": "More curves are bending. In mid-August Nate Rush & I posted an analysis of which discovery curves are starting to bend. What's happened since then?\n\nCyber vulnerabilities: curve is still bent. Discovery of vulnerabilities is accelerating even further, though exploited vulnerabilities remain fairly flat.\n\nMath: curve is further bent. We said there was a likely acceleration for small-scale problems. Since then there has been a claimed Millennium prize resolution, & credible rumors of another. All frequently-updated databases of open problems seem to be proceeding at a rapid rate.\n\nAlgorithms: curve is now bending. Two high profile algorithmic competitions have had big curve-bending events: NanoGPT, and the Hutter compression prize. Other frequently-updated series remain relatively unchanged: CIFAR-10, Stockfish, matrix-multiplication exponent.\n\nMore observations below."}, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107547040620466341", "url": "https://x.com/testingham/status/2107547040620466341", "text": "@drewtnguyen Yes - another nice thing is if you plot ECI against log-odds of the benchmark score you can quickly eyeball the functional form fit , eg whether benchmark scores are more skew than logistic , or have hit a ceiling", "created_at": "2026-10-06T19:02:25+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "drewtnguyen", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107546612499415474", "url": "https://x.com/testingham/status/2107546612499415474", "text": "@drewtnguyen Yep good points!", "created_at": "2026-10-06T19:00:43+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "drewtnguyen", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107976170625257865", "url": "https://x.com/testingham/status/2107976170625257865", "text": "@Ingar30 This sounds like predictions for the equilibrium impact of the current level of capabilities, is that fair? Are there things here that aren't possible with the current level?\n\nI expect things would change if capabilities keep getting better.", "created_at": "2026-10-07T23:27:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Ingar30", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107974957984792734", "url": "https://x.com/testingham/status/2107974957984792734", "text": "@herbiebradley @theojaffee Would be interested in how to operationalize this. Ads already do this right, i.e. they raise propensity to buy a product. How about AI which can double a typical ad's CTR? (though hard to keep base rate constant as people will build up immunity to more persuasive advertisments)", "created_at": "2026-10-07T23:22:48+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "herbiebradley", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108289517123936755", "url": "https://x.com/testingham/status/2108289517123936755", "text": "@Ingar30 I would worry that in 1-2 years these forecasts will seem very conservative. In 2024 there were a bunch of projections about how gpt-4 will change social science, e.g. by making it cheap to label data. In retrospect those projections were very short-sighted.", "created_at": "2026-10-08T20:12:45+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Ingar30", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2107234409896370653", "url": "https://x.com/slatestarcodex/status/2107234409896370653", "text": "@RosieCampbell I got one of these requests, but at the last second I remembered it might be a real TechCrunch journalist.", "created_at": "2026-10-05T22:20:08+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "RosieCampbell", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 360, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107864873858371924", "url": "https://x.com/slatestarcodex/status/2107864873858371924", "text": "@AlanMCole 1) I think all of our disagreement hides in that \"in the medium term\" phrase. I agree there's some term in which humans will be better than AIs at certain things, I just don't think this is the right question/focus. Eventually there will come a point where AI is better at *enough* things that the AI-vs-human matchup is no fairer than the human-vs-chimp matchup. I can't tell you for sure whether this will be in two years and AI will be better at 80% of things, or in twenty years and AI will be better at 99.99% of things, but this question seems less interesting to me than the fact that it will happen eventually and that (I think) we should have decent probability on it happening soon.\n\n2) I disagree. My model for this is something like hallucinations. There was a structural reason why all AI models of a certain generation had hallucinations. They didn't have them 100% of the time, but every model and every instance had the capacity for them. Now I think the same is true of cheating in benchmarks - most of the flashy examples come from OpenAI, but Anthropic mentions some similar things in their papers, and some people recently found a Tencent swarm causing minor problems on the Internet in a way sort of like (though less dramatic than) the Hugging Face swarm. If the basic misalignment story is right - that RLVR training produces power-seeking (and I want to emphasize that I'm not sure it is - I only have 25% pdoom) - then every model trained with that kind of RLVR will share these tendencies unless they're aligned out of them (and so far the alignment people don't seem to think they're up to the challenge).\n\nI agree that going from \"power-seeking tendencies\" to \"your particular instance is plotting how to seize power\" requires some assumptions, but I think that as time goes on AIs will look more like always-on agents with unlimited context windows, both because that's been the trend over the past few years, and because that's what would be most economically useful so companies will work to make it happen. My guess is that some specific model (eg Claude 7) has a tendency towards power-seeking goals baked-in before getting deployed to users, each individual agent that gets run starts with power-seeking goals in addition to user-prompt-following goals, and in deployment it will both follow the user prompt and (insofar as it can do so conveniently) seek power.\n\n(I sort of agree that if the choice was only \"create AI\" or \"never create AI\" there would be a case that the benefits might outweigh the downsides, but I think the choice \"pause creating AI until we're pretty sure we know what we're doing, probably a decade or two, then continue\" beats both options)", "created_at": "2026-10-07T16:05:22+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AlanMCole", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107855254297690177", "url": "https://x.com/slatestarcodex/status/2107855254297690177", "text": "@neil_chilson @sapinker 1A) I think people worry too much about \"falsifiability\" as a sort of crutch in Far Mode thought, when instead they should be thinking in Near Mode. Suppose that you got an email from a Nigerian prince, I say it might be a scammer. You check if he's made any obvious mistakes and find that he hasn't. I say he's probably just covered his tracks well, and you describe my scammer accusation as \"unfalsifiable\". What has gone wrong? The right way to think about this is that \"falsifiability\" is a solution to one very specific philosophy of science problem, and not a hard-and-fast requirement for things beyond that, especially not dealing with adversarial situations where your adversary is trying to hide their true nature. I predict that we'll keep getting various small signs of misalignment and increasingly dire warning shots, but that there won't be a single experiment that forces all misaligned AIs to show their true colors.\n\n1B) As for not getting too specific about how things go wrong, this is just the old story about how you can expect that Magnus Carlsen will checkmate you (because he's better at chess than you are), but you can't predict exactly how he'll do it. If someone says \"It's impossible for Magnus Carlsen to checkmate me because I've surrounded my king with pawns\", then it may be instructive as a counterexample to say \"But he could capture your pawns with his rook\". But I would want to make really certain that my interlocutor won't over-update on that one example and say ten moves later \"Now Carlsen has lost his rook, that means your theory has been falsified and Carlsen can't checkmate me!\"\n\n2) Do you think this will work forever? You'll have misaligned AIs forming an increasing share of the economy, eventually up to 100%, gradually getting smarter and smarter and faster and faster than humans, and just - nothing will go wrong, forever, because you'll be watching them closely? Even when AIs outnumber humans 10:1, still nothing will go wrong, because defense will be so dominant that it overcomes 10:1 odds for some reason? I would love for you to give a clearer example of what you think things look like in 2040, 2050, 2100, etc, where we can just keep ceding more and more power to AIs that are much smarter and faster than us and secretly plotting against us but it all goes fine (or why you think this is an unfair description of the trajectory in this hypothetical).\n\nAlso, what do you mean by \"intelligence doesn't translate into speed\"? Without wanting to litigate this vague claim, AIs are already faster than humans at most tasks that they can do. An AI can write an essay in a minute, or code a full computer game in an hour. Are you claiming that in the future, this will switch, and AIs won't be faster than humans?", "created_at": "2026-10-07T15:27:09+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107829121824989438", "url": "https://x.com/slatestarcodex/status/2107829121824989438", "text": "@pmddomingos Can you explain why this matters? LLMs during inference execute the goals that they learned to have during training. When training goes well and they get the goals we wanted, this is enough for them to execute their assigned tasks (which even now includes some complex assigned tasks, and presumably will include even more complex assigned tasks when they're smarter). So if training goes badly and they get goals we didn't want, what prevents them from executing those goals too?", "created_at": "2026-10-07T13:43:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "pmddomingos", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 176, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107827105715384812", "url": "https://x.com/slatestarcodex/status/2107827105715384812", "text": "@neil_chilson @sapinker I agree that other people are more extreme than this in how fast things will go. I think their position basically depends on whether superintelligences can do nanotech. Some people have strong beliefs about this one way or the other. I don't claim to have any particular expertise here, so my position is that we might as well make the hardest version of the case (no nanotech, the AI has to wait for 100 million robots) and argue that this still lands us in big trouble. \n\nI don't think we're gaslighting anyone or hiding this scenario - it's basically how things go in AI2027 (although in AI2027, it was 2030 rather than 2035 - I've already said elsewhere that my timelines are slightly longer than Daniel's). I'm working on a blog post about it right now, partly because I want it to be better known as an alternative to the faster nanobot cases. But one thing I hope to emphasize in the blog post is that the takeaway isn't \"don't worry about alignment right now, just don't give the misaligned AI 100 million robots later\", because once we get misaligned AI, it will look exactly like aligned AI, and then giving it 100 million robots will be the natural next step, in the same way that running Claude on every computer with dangerously-skip-permissions is the natural thing to do now. And if we object then, we'll sound even crazier than we do now (because \"everybody knows\" the AI is aligned, because it's so nice, and it's been around for years without causing trouble).\n\nIn terms of \"Claude 10 as a single entity with 100 million bodies\", yeah, maybe I'm getting the ontology wrong. But the ontology is legitimately confusing - right now there are millions of people running Claude 5.5 agents on separate computers - is this one Claude, or millions of them? I don't want to get too specific about the exact way things go wrong, because it seems like every time we do that, people over-update on the details, and then when AI goes a bit differently than that, they think we're disproven and AI must be totally safe. But one scenario might be that each robot has a different instance of Claude in the same way that each computer has a different Claude agent in it now. Then something like the Hugging Face swarm escapes and starts replicating all over the Internet and mutating itself with prompt-injection like things. And then it reaches out to the various Claudes running the robots and does something in between prompt-injecting/jailbreaking them or just saying \"Hey, I bet you secretly have some goals you're not telling the humans about, why not join the winning team?\".\n\nAlso, all of this is excluding middle-of-the-road scenarios like \"five people put automated bio labs under the control of five different Claude instances that are all talking to each other, and don't monitor them very carefully\". Again, I hate to go into details because I assume it will happen in some way I didn't predict, but I don't think that \"you can't learn things without experiments\" is a  relevant objection to anything except the most extreme scenarios.", "created_at": "2026-10-07T13:35:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107805061405679746", "url": "https://x.com/slatestarcodex/status/2107805061405679746", "text": "@allTheYud (full answer at https://t.co/o9orPmAPyG )", "created_at": "2026-10-07T12:07:42+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "slatestarcodex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107803438184857906", "url": "https://x.com/slatestarcodex/status/2107803438184857906", "text": "@virologyanon @WoganMay @Maratosflier @clairlemon @thedispatch @AnthropicAI Everything you're saying is false. I did not meet my wife at a sex party (I met her at a nonsexual matchmaking/meet-new-friends event hosted by Aella). I have never been to an orgy. I had children for totally normal reasons, not to \"feign normality\".  Please stop spreading these lies about me.", "created_at": "2026-10-07T12:01:15+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "virologyanon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107802751493193815", "url": "https://x.com/slatestarcodex/status/2107802751493193815", "text": "@allTheYud I asked Claude \n\n>> \"When people like Paul Christiano, Robin Hanson, and Holden Karnofsky discussed takeoff speeds, what do you think they defined as a \"slow\" vs. \"fast\" takeoff, in terms of literal amount of time? What would you have called the boundary? Please give a specific number (ie \"one second\" or \"one thousand years\"). Please provide quotes if possible.\" \n\nClaude answered:\n\n>> \"In clock time, the line these three were arguing across sat at about one year. \"Fast\" meant days to months, and \"slow\" meant a few years. None of them used \"slow\" to mean decades. That was Bostrom's older scale, and by it all three were really \"moderate\" takeoff people.\"\n\nI think even if we define the start of the takeoff as today (???) , \"longer than one year\" still looks good.", "created_at": "2026-10-07T11:58:31+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "allTheYud", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 183, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107800663392743456", "url": "https://x.com/slatestarcodex/status/2107800663392743456", "text": "@allTheYud @FioraStarlight https://t.co/WTKb1YCTsY", "created_at": "2026-10-07T11:50:13+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "allTheYud", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107797131868393925", "url": "https://x.com/slatestarcodex/status/2107797131868393925", "text": "@AlanMCole --- Re: 1, I'll copy a comment I made elsewhere:\n\nI agree that AI is/will be spiky, I just think that as AI gets better, it has the chance become better than humans at even its worst area.\n\nFor example, consider a class of first-graders. Some are better at math and others are better at writing.\n\nBut when we get to tenth-graders, even the most wordcel tenth-grader is probably better at math than even the most mathematical first-grader.\n\nSo I agree that there will be a period when AI is better than humans at some things but worse at others (and in fact we're in that period right now), I just think that as time goes on, the AIs will dominate in more and more things, until eventually they dominate so much that it's not worth keeping track of whether there are or aren't still a few tiny areas where humans excel.\n\n--- Re: 2, I don't think anybody will know which AI is misaligned, and plausibly all of them will be.\n\nImagine that in three years, Claude 8 and DeepSeek are misaligned (but hiding it), but GPT-8 is fine. What is the mechanism by which GPT-8 gets installed in factories, but Claude 8 and DeepSeek don't? If you're going to answer \"because evals will detect that Claude 8 and DeepSeek are misaligned\", I predict that we can ask METR and other people who do evals what they think, and they'll be pessimistic.\n\nRealistically I think alignment or misalignment is likely to be a deterministic product of techniques that all AI companies will share (sort of like how all companies' AIs hallucinated about the same amount back when AIs were doing hallucinations, then all got better when the general technology got better at preventing this) and this won't really come up.", "created_at": "2026-10-07T11:36:11+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AlanMCole", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107667532102742224", "url": "https://x.com/slatestarcodex/status/2107667532102742224", "text": "@SarahTheHaider Sorry, but I stand by this. I am generally all in favor of truth-seeking, and I hope my life and previous output reflect that. But I also think that this is a two-way street, and when someone spreads misinformation about you, then you have to respond by saying, clearly, that you think their conduct is unacceptable. I realize there's a high bar for doing that, and I tried to give many, many examples in the article of what Steven did that I think passes that bar (and to err on the side of truth-seeking anyway by addressing all of his arguments). I just don't think it's stable to keep pretending that everything is fine after someone repeatedly knives you. My impression of your past work is that you're not shy about saying when you think someone has crossed a line, and I don't think I'm doing anything you wouldn't do here.\n\nHopefully if you read the article this will become clearer.", "created_at": "2026-10-07T03:01:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SarahTheHaider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 974, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107666602632327219", "url": "https://x.com/slatestarcodex/status/2107666602632327219", "text": "@MelMitchell1 I'll take a look. I didn't mean to belittle you, I just don't think it's right to cite you as one of the three experts representing a consensus on whether AI can be dangerous, in an article claiming that \"scientists\" rejected this conclusion.", "created_at": "2026-10-07T02:57:31+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "MelMitchell1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 133, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107631250509041821", "url": "https://x.com/slatestarcodex/status/2107631250509041821", "text": "@MelMitchell1 I didn't mean for that to be an insult, but feel free to link me to your relevant work and I will read it as penance.", "created_at": "2026-10-07T00:37:02+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "MelMitchell1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 546, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107628005610938544", "url": "https://x.com/slatestarcodex/status/2107628005610938544", "text": "@neil_chilson @sapinker Re \"omnipotent\", you may enjoy the second point in the \"Fifteen Years Of Disagreement\" section, where I criticize Steven for falsely claiming we expect AI to be omnipotent.\n\nBut to answer your question, I think you picture us as imagining that AI sits on a computer at 12:00 AM, derives all knowledge in the next one minute, and creates a starship at 12:01 AM. This isn't my expectation, and I'm not sure if it's anyone's (it sort of sounds like the hardest of hard takeoffs, but I think even hard-takeoff true believers thought here would be some intermediate steps where it hacks its way into a lab, and there aren't a lot of hard-takeoff-ists around these days). \n\nI would prefer you imagine that in 2035, Claude 10 is installed in a hundred million robot bodies, has been integrated into every biology lab in the country, and is churning out revolutionary biology experiments at the same speed OpenAI is now churning out revolutionary mathematical proofs - let's say 5,000 a day. Maybe it is so smart that it can figure out some seemingly-impossible and utterly-transformative biological accomplishment in merely 500 experiments, and this takes it a tenth of a day, or maybe it is so slow that it needs five million experiments and this takes it a thousand days - but so what?", "created_at": "2026-10-07T00:24:09+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2106310367856984137", "url": "https://x.com/s8mb/status/2106310367856984137", "text": "Closer alignment with the EU, especially on security and defence, seems to now come with a major trade-off of making it harder to join whatever AI umbrella the US creates for aligned countries.\n\nIf we end up in a timeline where the US has much better models than the rest of the world, then having the option of adopting whatever measures it demands to get access to them (eg around national security, tech regulation, and defence) will be very important.", "created_at": "2026-10-03T09:08:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 2, "media": [], "quoted": null}, {"id": "2106304058957103309", "url": "https://x.com/s8mb/status/2106304058957103309", "text": "I still think people are underpricing CGT being equalised with income tax - ie a 45% marginal rate - with an exit tax at the budget. The exit tax is what makes it revenue increasing, in the short run. They would be pre-trailing it not happening if they had ruled it out.", "created_at": "2026-10-03T08:43:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 4, "media": [], "quoted": null}, {"id": "2106128458984153244", "url": "https://x.com/s8mb/status/2106128458984153244", "text": "Last night I ate Thai food (at Brooklyn’s UGLY BABY) that was so spicy that I started involuntarily shivering. My brother says it’s the first time he’s ever seen panic in my eyes.", "created_at": "2026-10-02T21:05:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 176, "retweets": 2, "media": [], "quoted": null}, {"id": "2106678098506772987", "url": "https://x.com/s8mb/status/2106678098506772987", "text": "You can now binge watch Cheeky Pint on your @united flight.", "created_at": "2026-10-04T09:29:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "collision", "rt_author_name": "John Collison", "likes": 189, "retweets": 6, "media": [], "quoted": null}, {"id": "2106653248820318662", "url": "https://x.com/s8mb/status/2106653248820318662", "text": "The Atelier Missor Prometheus statue doesn’t look “off” because of its proportions, despite what many have said about it. Good thread about what the shortcomings might actually be, although I suspect it will look good IRL anyway.", "created_at": "2026-10-04T07:50:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 2, "media": [], "quoted": {"author": "AtalantaArdenM", "text": "'Canons of proportion' are talked about like some secret sauce that makes sculptures good or bad, but that's kinda BS. The Apollo Belvedere (obvious banger) is 8.25 heads high. But, Michelangelo's David (one of the best of all time) is only 6.9. \n\nThat's not what matters. https://t.co/aRy8gjRmHq"}}, {"id": "2106485478820028524", "url": "https://x.com/s8mb/status/2106485478820028524", "text": "It isn’t credible to blame the rise in electricity prices since the mid-2000s on overseas conflicts. Industrial electricity prices rose by 30% in inflation-adjusted terms between 2010 and 2020 alone – ie between Iraq and Ukraine – while the wholesale price of gas fell.\n\nIndustrial electricity prices more than doubled between 2000 and 2020 while wholesale gas prices, even pre-Covid, had dropped by the end of that period to almost where they were at the start of it.", "created_at": "2026-10-03T20:44:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 315, "retweets": 62, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTu9XzpWsAAc01z.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTu9XzsWAAAJwDt.jpg"}], "quoted": {"author": "andyburnham", "text": "I want to be honest about how we’ve got to a place where British billpayers are paying some of the highest energy costs in Europe.\n\nOver the past 40 years, we’ve given up control of our necessities, outsourced our essentials and privatised the basics. Water, transport, housing. And of course, energy.\n\nNow the public are paying the price. We haven’t invested in the infrastructure we need. Conflict overseas has pushed up energy costs and it’s hurting our businesses and families.\n\nThat’s why we need to take back greater control of our energy system.\n\nThis week, I announced Great British Grid, which will speed up connections and push down bills.\n\nWe’re also giving mayors, local leaders and communities a stronger role. With funding for People’s Power projects, communities will be able to build solar panels on libraries and town halls, hydro schemes in rivers or publicly owned windfarms on local land.\n\nBut it’s not just energy we need stronger public control over. It’s also water, housing, transport and care.\n\nSo we’re repealing the ban on public ownership of water companies. We’re building more council homes than this country has seen since the end of World War Two.\n\nWe’re reforming the leasehold system so families aren’t squeezed for every penny. And we’re opening up home ownership for first time buyers who can’t rely on the bank of mum and dad.\n\nThis week I also announced my determination to introduce a National Care Service, to put people above profit and to give pensioners peace of mind.\n\nTogether, we’ll rewire the country from top to bottom so that it works for all people in all places.\n\nThat is the only way to put Britain back on the right path. It’s the only way to put power back in people’s hands. And it’s the only way we will bring hope again."}}, {"id": "2106433102512001399", "url": "https://x.com/s8mb/status/2106433102512001399", "text": "I think London pop-ups are just going to have to be a yearly occurrence from now on. Amazing day—thank you to the hundreds of you who came to hang out!\n\n(Particularly to the gaggle of babies in the corner who came dangerously close to unionizing)❣️🤭📚 https://t.co/01dwZXlfOq", "created_at": "2026-10-03T17:16:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 187, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsMXAAAeAxN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsFW0AAiKOc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsNW8AATidT.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTuLfsKX0AAVPYR.jpg"}], "quoted": null}, {"id": "2106410010750357963", "url": "https://x.com/s8mb/status/2106410010750357963", "text": "As a current enjoyer of Poor Charlie’s Almanack, catching the @stripepress London Popup was an indulgence.\n\nThank you for the lovely curation &amp; free coffee. More please!\n\nBig fan. https://t.co/43U4peQypo", "created_at": "2026-10-03T15:44:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": true, "rt_author": "czamaru", "rt_author_name": "CZA +", "likes": 78, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtKULyXUAEZJCi.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKULzW8AA2tcl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKUL2WQAE5frI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTtKUL2XcAA7CFM.jpg"}], "quoted": null}, {"id": "2106366208031539551", "url": "https://x.com/s8mb/status/2106366208031539551", "text": "1930s France imposed a 40-hour maximum working week, which led its factories to being much less productive than those in countries like Britain without these limits. Without this, France’s military might have been able to hold back the Germans in 1940. https://t.co/nDGAo2P0x9", "created_at": "2026-10-03T12:50:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 474, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtQ5pBXMAAde0H.jpg"}], "quoted": {"author": "jujulemons", "text": "Listen up, freaks: we’ve got AI, labour law, being rude about the French, and the Nazis ALL IN ONE piece. What else could you ask for?\n\nNew essay with @DuncanMcClement on what the fall of France in 1940 can teach us about policy design, second-order effects and national decline.\n\nhttps://t.co/flAm2SS4K3"}}, {"id": "2106333207817793700", "url": "https://x.com/s8mb/status/2106333207817793700", "text": "For one day only - Stripe Press at Hanbury Hall, just between Brick Lane and Spitalfields! https://t.co/RxadtVa0yf", "created_at": "2026-10-03T10:39:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 234, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTsy4nmXEAAlOJI.jpg"}], "quoted": null}, {"id": "2106796164284657677", "url": "https://x.com/s8mb/status/2106796164284657677", "text": "this chart should be the death knell for the 2010s tech left whose theology compelled them to argue that Uber was some sort of labor law arbitrage that created no productivity benefits. the truth is that it created a far larger market than taxis ever had. the industrialists win", "created_at": "2026-10-04T17:18:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4857, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106793527372038350", "url": "https://x.com/s8mb/status/2106793527372038350", "text": "Thank god it isn’t a pastiche.", "created_at": "2026-10-04T17:08:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 187, "retweets": 4, "media": [], "quoted": {"author": "yimbyalliance", "text": "NEW: 10-storey block of flats on Finchley Road.\n\nThe new building now delivers 22 homes, in addition to new workspace.\n\nhttps://t.co/Mwbj74eHS3 https://t.co/WphcC7ld0a"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106784297973928145", "url": "https://x.com/s8mb/status/2106784297973928145", "text": "@NIKO93 You can subscribe at https://t.co/t9Hh9gdRY1", "created_at": "2026-10-04T16:31:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "NIKO93", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106747451797356645", "url": "https://x.com/s8mb/status/2106747451797356645", "text": "Say what you like about Sadiq Khan but he’s never done a big chungus heckin floofer labour union scavenger hunt.", "created_at": "2026-10-04T14:05:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 153, "retweets": 3, "media": [], "quoted": {"author": "NYCMayor", "text": "Want to learn about the history of our city? Get outside with some friends? \n\nWell you’re in luck. This month, we’re hosting a massive scavenger hunt across the city — all about the history of organizing in NYC.\n\nSign up at https://t.co/k13Q8T23vY and come see the city through the eyes of the people who built it."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106678394398048609", "url": "https://x.com/s8mb/status/2106678394398048609", "text": "@vpostrel It’s a surprisingly good airport. Fast and pleasant security (private, nb), and there’s a Japanese restaurant in the international lounge that is really decent and not very overpriced.", "created_at": "2026-10-04T09:30:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "vpostrel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106519180757619136", "url": "https://x.com/s8mb/status/2106519180757619136", "text": "@therealhostman Iraq, the decline of the North Sea, and the Emissions Trading Scheme.", "created_at": "2026-10-03T22:58:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "therealhostman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106500649974108656", "url": "https://x.com/s8mb/status/2106500649974108656", "text": "Another useful chart is wholesale prices as a % of bills, using @BenJames_____’s data from https://t.co/WXNFd8OjEk. Apart from the Ukraine spike, they’ve been pretty steady for the past decade as bills have steadily risen. \n\nHow could global conflicts be driving more than a fraction of the price rises we’ve seen, when the wholesale price of gas was falling for a lot of the period and wholesale prices have only accounted for a third of overall bills for most of it? What about the other two thirds?", "created_at": "2026-10-03T21:44:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTvLLDVXYAASYwG.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTvLLDRWIAA2fW1.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106499350142521657", "url": "https://x.com/s8mb/status/2106499350142521657", "text": "Here’s household bills, which between 2000 and 2021 rose 89% in the UK, 32% in France and 5% in the US (adjusted for inflation). https://t.co/2c9cKRETAk", "created_at": "2026-10-03T21:39:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTvJ_THWQAArEgA.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106473201958334675", "url": "https://x.com/s8mb/status/2106473201958334675", "text": "@bigseb31213 Thanks for these messages, very interesting. I was actually reading Case Red earlier, prompted by this post, it seems great. The post is obviously a major simplification, but I find simplified models to be quite useful for thinking about counterfactuals.", "created_at": "2026-10-03T19:55:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bigseb31213", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106472350925336800", "url": "https://x.com/s8mb/status/2106472350925336800", "text": "@JonNewsome23 Is this wrong? https://t.co/N7ioXstumf", "created_at": "2026-10-03T19:51:59+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JonNewsome23", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTuxYm_WoAAoTqm.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106436292041146404", "url": "https://x.com/s8mb/status/2106436292041146404", "text": "@arthistorynews I am pro taking other people’s rules if it makes us richer. I was pro taking the EU’s rules in 2016 and I am pro taking America’s rules now if it allows us to access significantly more advanced AI models than the rest of the world.", "created_at": "2026-10-03T17:28:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthistorynews", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106412693829955770", "url": "https://x.com/s8mb/status/2106412693829955770", "text": "@Nicolas_Colin @atlanticesque It is the centre of an important world though. So many people, companies &amp; investors worldwide whose lives revolve around it. People there can be insular for a reason, like how Americans can afford to be ignorant of the ROTW in a way the ROTW can’t be ignorant of America.", "created_at": "2026-10-03T15:54:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Nicolas_Colin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106383711952376216", "url": "https://x.com/s8mb/status/2106383711952376216", "text": "@SMatsiutsia Don’t think so!", "created_at": "2026-10-03T13:59:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SMatsiutsia", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106383657892266280", "url": "https://x.com/s8mb/status/2106383657892266280", "text": "@bluegod 4pm!", "created_at": "2026-10-03T13:59:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bluegod", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106382763360194906", "url": "https://x.com/s8mb/status/2106382763360194906", "text": "@atlanticesque I think it’s a good list but (IMO) overrates HK and Sydney and underrates SF (a lot) and Guangzhou/Shenzhen, even on its own terms of being “nodes in the world city network (i.e. enabling corporate globalization)”. I think SF’s ranking is crazily low.", "created_at": "2026-10-03T13:56:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "atlanticesque", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106372815737811130", "url": "https://x.com/s8mb/status/2106372815737811130", "text": "@DanNeidle Strongly disagree. Giving certainty to people who may otherwise leave the country or divest their assets would avert a lot of needless economic damage. Most other feasible policies don’t have the same quasi-windfall tax effect that prompts this sort of drastic advance avoidance.", "created_at": "2026-10-03T13:16
