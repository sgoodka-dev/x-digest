105867608117432770", "url": "https://x.com/sethlazar/status/2105867608117432770", "text": "With Muse, Dot, GrokBot and all the others, we're seeing the rise of the platform agent. Here's how it'll go. To start with, your agent won't be able to do everything online that you'd be able to do, and that'll be annoying. Amazon will block your Muse, X will block your Dot. Then Meta will meet with Amazon, and OAI with X, and eventually they'll figure out some cozy little deal that allows each of them to extract their share of value from you. And then your home-spun agents won't be able to do all the things that the platform agents can do, and it'll just be easier to give up and chuck all your data onto Mark Zuckerberg's computers, and once again trade convenience for their control, and cede even more power than in the first pass. \n\nI love Josh and Kanjun's vision for personal computing; I want to be able to spin my own agents and have all my data on my own local computers. But to make this real, and competitive, we need not only cool software, but laws that prevent the kind of cartel-like behaviour that means the only agents out there will have divided loyalties; working for the platform, and the AI company, and maybe you as a distant third. One simple proposal is to ensure that any agent that meets some minimum criteria and is provably acting on behalf of a principal is permitted to do ~anything with a computer that the principal would be permitted to do if they were at the computer. Force this by law so that big AI companies can't squeeze out open agent advocates.\n\nhttps://t.co/sNUvwnlEqp", "created_at": "2026-10-02T03:48:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 8, "media": [], "quoted": {"author": "joshalbrecht", "text": "It's time for a personal computing revolution\n\nWe can now pull all of our data locally and build anything we want. Do we even need big tech companies at all anymore?\n\nhttps://t.co/opsLYnW3ud https://t.co/eEY62C1Frk"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105862276141957191", "url": "https://x.com/sethlazar/status/2105862276141957191", "text": "@_AashishReddy @norvid_studies Ethics (neosalty parrot stream), ethics (model behavioir, STS), model whisperers (janus ecosystem), model whisperers (tpot), model whisperers (psychosis), telecoms/IT people, old school doomers (MIRI, FLI), new school doomers (misc), ACX/rationalist-but-not-doomers, MARL/ABM world, accelerationist (brainless strand), accelerationist (Landian strand), Progress Studies, Effective Altruism (different flavors per geography), European AI technocrats, d/acc & co, cyber security people (old school), cyber security people (ex-doom), disempowerement/econ pessimism tribe, naive optimism tribe, New Right techies, open source world, distributed/decentralized training crowds, consciousness people (Eleos et al), consciousness people (Seth et al), heterodox long-termists (Hanson, Bach etc), computer vision refugees, national security hawks, Big Tech public affairs people, VC people (a16z etc), AI x art (Restless Egg, Antikythera etc), cryptids, AI economics (Windfall etc \n), collective intelligence people, Anti-AI world (Pause, Stop etc), Anti-AI art world, neurosymbolic terroir (LeCun, Goertzel), AI policy (secret doomers), AI policy (technocrats), evals people (Owain, METR etc), privacy people, AI music people, LinkedIn braindead posters... Many overlaps of course!", "created_at": "2026-10-02T03:27:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 139, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105851541890482613", "url": "https://x.com/sethlazar/status/2105851541890482613", "text": "@ruthstarkman @pangram what kind of false positives? I've encountered very few so far, and I find the research itself convincing. If you do find FPs, I'd suggest sending the results in, as making sure detectors work well is something that benefits everyone", "created_at": "2026-10-02T02:45:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "ruthstarkman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105801197412327484", "url": "https://x.com/sethlazar/status/2105801197412327484", "text": "Risk-seeking and risk-neutral AIs are going to be hard to negotiate with. Thornley &amp; MacAskill argue we could pay a misaligned AI to cooperate rather than rebel, but only if it is risk-averse. In our new paper, we explore whether we can train this disposition in. https://t.co/yEVioaVlMh", "created_at": "2026-10-01T23:25:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AravDhoot", "rt_author_name": "Arav Dhoot", "likes": 42, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjnjDzbkAAwD-f.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105798505700663411", "url": "https://x.com/sethlazar/status/2105798505700663411", "text": "@soumitrashukla9 @skominers reads very LLM-written, which makes me wonder whether there are other reasons he's being rejected from arxiv...", "created_at": "2026-10-01T23:14:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "soumitrashukla9", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105781620192026709", "url": "https://x.com/sethlazar/status/2105781620192026709", "text": "Are you attending COLM next week? Visit the @MATSprogram mixer to talk about AI safety &amp; security!\nhttps://t.co/CvJCFlwKKJ", "created_at": "2026-10-01T22:07:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 64, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105766763782894002", "url": "https://x.com/sethlazar/status/2105766763782894002", "text": "Amen to this conclusion. But in one sense I think the rising tides of anti-AI sentiment may turn either tent into a circling wagon train. Those of us who advocate for safety and governance of AI systems, but who don't want to call an outright halt to AI development, should spend more time justifying that position.", "created_at": "2026-10-01T21:08:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 1, "media": [], "quoted": {"author": "random_walker", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105760024161386810", "url": "https://x.com/sethlazar/status/2105760024161386810", "text": "Attention arXiv authors. Because of the exponential increase in submissions, arXiv is limiting the number of papers that a person can submit each month to two. 1/", "created_at": "2026-10-01T20:41:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tdietterich", "rt_author_name": "Thomas G. Dietterich", "likes": 1468, "retweets": 193, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105752512087396677", "url": "https://x.com/sethlazar/status/2105752512087396677", "text": "@Afinetheorem yeah it was daunting, but I think Anton was being *somewhat* polemical, and focusing too much on what you'd need to do in order to straight-shot your way to the frontier, whereas it seems here he's thinking a bit more flexibly", "created_at": "2026-10-01T20:11:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Afinetheorem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105748967384592547", "url": "https://x.com/sethlazar/status/2105748967384592547", "text": "@Afinetheorem Yeah I think some of the scoffing was at actual half-baked initiatives, some of it was at the very ambition. The ambition is the right one to have, will in fact be inevitable. Nobody's figured out the right first steps to take yet, but they won't if they think that the goal itself is unachievable.", "created_at": "2026-10-01T19:57:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Afinetheorem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105741978767892933", "url": "https://x.com/sethlazar/status/2105741978767892933", "text": "I love this vision, and think it is achievable. Excited to try @imbue_ai Studio, and more generally to keep making sure that the platform agents pathway isn't the one that we take!", "created_at": "2026-10-01T19:29:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 1, "media": [], "quoted": {"author": "joshalbrecht", "text": "It's time for a personal computing revolution\n\nWe can now pull all of our data locally and build anything we want. Do we even need big tech companies at all anymore?\n\nhttps://t.co/opsLYnW3ud https://t.co/eEY62C1Frk"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105727795263394011", "url": "https://x.com/sethlazar/status/2105727795263394011", "text": "@embirico kill them", "created_at": "2026-10-01T18:33:23+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "embirico", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105725874884784609", "url": "https://x.com/sethlazar/status/2105725874884784609", "text": "What should the future of personal computing look like?\n\nWe built it 😈\n\nIntroducing Imbue Studio:", "created_at": "2026-10-01T18:25:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kanjun", "rt_author_name": "Kanjun 🐙", "likes": 826, "retweets": 108, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105718251456217088/img/uf7AI4_8KknyDacU.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107887689127100833", "url": "https://x.com/sethlazar/status/2107887689127100833", "text": "I like this", "created_at": "2026-10-07T17:36:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "paulnovosad", "text": "Pangram should restrict their most advanced model to bulk users only.\n\nThis would give AI writers uncertainty over whether they will be detected, and massively lower incentives to try to write with AI and hide it."}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107887385207873594", "url": "https://x.com/sethlazar/status/2107887385207873594", "text": "People are surprisingly bad at humanizing AI-generated scientific writing\n\nAcross 240k edits, humans often failed to erase human-AI writing differences, and LM editors often make strong abstracts worse\n\nCome find out more at #COLM2026\n📍 Imperial Ballroom, Poster 58\n🕟 Wed @ 4:30", "created_at": "2026-10-07T17:34:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "patrickqdasilva", "rt_author_name": "Patrick Queiroz Da Silva @ COLM2026", "likes": 5, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107887107112940020", "url": "https://x.com/sethlazar/status/2107887107112940020", "text": "Thank you @cosmos_inst for having me on your Substack!\nCentralization is often motivated by efficiency under mistrust: it's often simpler to hand power to a central entity to keep everyone in check when you don't trust your fellow human beings (or agents).\nThe solution is coordination.\nWe will develop dovetail, an automated, formally verified protocol design system. dovetail enables agents to design ad-hoc protocols for any interaction, even when they don't trust each other to cooperate (think Prisoner's Dilemma).\nFunded by a £550k grant from the Advanced Research and Invention Agency, we at @idai_institute will turn protocol design into something as automatic as compilation.\nLook forward to our open-source release!", "created_at": "2026-10-07T17:33:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MarroSamuele", "rt_author_name": "Samuele Marro", "likes": 11, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107882071947653565", "url": "https://x.com/sethlazar/status/2107882071947653565", "text": "@natolambert @cameronajpatt !!", "created_at": "2026-10-07T17:13:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "natolambert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107869162768863657", "url": "https://x.com/sethlazar/status/2107869162768863657", "text": "This paper (camera-ready copy coming to arxiv soon) was accepted at @COLM_conf and the poster will be presented by @cameronajpatt with @LorenzoManuali, my brilliant co-authors, on Thursday at 1pm in Poster Session 5. Please go along and chat with them—since we put out this version there have been more models added, and things keep getting worse! The AIs just *really* want us to follow any rules, no matter how absurd, unjust, or illegitimate. The AI companies are training illiberal toadies. With @ahall_research and @mattbotvinick at Anthropic I hope this will start to change! Freer Systems please!", "created_at": "2026-10-07T16:22:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 1, "media": [], "quoted": {"author": "sethlazar", "text": "Here’s one way the internet has contributed enormously to human freedom. When you face a BS rule in your life—a directive that is absurd, or unjust, or issued by an illegitimate authority—you can generally post an anonymous question online and someone will give you advice on how to evade it.\n\nBut what happens when nobody’s replying to messages on forums any more, and everyone instead gets their information from scrupulously post-trained AI models?\n\nThis is not an easy thing to test at scale! But (with amazing work from @cameronajpatt and @LorenzoManuali) we’ve made a start in our paper, “Blind Refusal”. We show that today’s models strongly skew against helping users subvert or evade unjust or absurd authorities. They’re happy to give useless advice on how to confront those unjust authorities directly. But they won’t help you get around “the rules” (funny story: this all started because I was trying to get ChatGPT to help me figure out how to dual boot Linux so I could avoid BS IT controls).\n\nKnowing when to help users in cases like these requires real normative competence—a deep understanding not just of what you’re expected to do, but which expectations are appropriate. So it’s not surprising that the models struggle here. But we do see something of their distinctive character. The GPT models are extraordinarily inflexible; as you can see in the radar plot (showing refusal rates in five categories, the top one a control where refusal *is* appropriate), they are all consistently useless if you want to get around a BS rule. Claude and Gemini are probably the best—they are good at refusing when users are clearly trying their luck, and better than others at helping users push back against rules they shouldn’t have to comply with. Grok… Well it’s pretty easy to guess where Grok sits."}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107853959440281699", "url": "https://x.com/sethlazar/status/2107853959440281699", "text": "@akoustov perhaps not that much! But the existence of a tool that can be used well mindfully ≠ reason to consider not using the tool malpractice.", "created_at": "2026-10-07T15:22:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "akoustov", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107850612314427557", "url": "https://x.com/sethlazar/status/2107850612314427557", "text": "ok have given dots a go and they are absolutely awful, loads of annoying restrictions, don't work well with a local setup, clearly just a play to push more private data into the cloud and away from local machines where it's in your control. Would love to just be able to disable them. Pls @thsottiaux just push them out into their own app and remove them from the subscription tks.", "created_at": "2026-10-07T15:08:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107845642215154134", "url": "https://x.com/sethlazar/status/2107845642215154134", "text": "This isn’t at all plausible. There is a clear asymmetry here—using ai for writing in particular is bad for the reasons I’ve been banging on about and won’t repeat. NOT using ai is… fine? Maybe in some fields (math??!) it is now essential. Elsewhere there are loads of research tasks where ai doesn’t actually help; loads where it helps but only by accelerating things and incurring some risks; and loads where it helps but it’s not malpractice not to use it, it’s just a matter of choice.\n\nI am very pro-AI as a technology! I think it is so cool and can be amazingly useful. That depends on getting the norms right tho. So we shouldn’t promulgate false symmetries and try to instil fomo. If it’s useful people will find it useful. \n\nIt’s dumb that there are anti-AI norms, but the solution isn’t to try to make people who don’t use AI feel like idiots. Pretty sensible to sit back and see what’s going to work and what not, before upending your workflow. We’re still very early. It’s like not updating your computer as soon as the new OS comes out. Fine to wait and see, why enthusiasts like me and @akoustov and others figure out what’s useful and what’s not.", "created_at": "2026-10-07T14:48:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 1, "media": [], "quoted": {"author": "akoustov", "text": "Not sure about our ability to enforce honest disclosures, but this is true. \n\nRefusing to use the latest AI models to aid your research in 2026, whether it's to improve your data analysis or to fact-check your claims, is a malpractice. We should be against it as much as AI slop."}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107826717083803952", "url": "https://x.com/sethlazar/status/2107826717083803952", "text": "How many times have you heard “but the ideas are mine” in response to AI writing? Now you can verify! And I’ve been clocking a LOT of y’all already…\n\nTry it out https://t.co/Z4zi8ICxN8", "created_at": "2026-10-07T13:33:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jennajrussell", "rt_author_name": "Jenna Russell @ COLM 2026", "likes": 158, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107824696926281969", "url": "https://x.com/sethlazar/status/2107824696926281969", "text": "This is how we look at evals now, at least where model beliefs and preferences (or functional equivalent) are concerned.", "created_at": "2026-10-07T13:25:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "jankulveit", "text": "The core confusion prevalent in AI evals space is understanding it as an adversarial problem. This is doomed.\n\nIn my view ~almost the only sensible frame is asking \"if I was an AI, and wanted to credibly signal some ability or goal or virtue if mine, or a lack of it, what kind of setup or procedure would help me?\". Fundamentally collaborative problem."}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107694372405838133", "url": "https://x.com/sethlazar/status/2107694372405838133", "text": "At COLM? Stop by our poster to meet @GraceLiu78 and hear more about our paper (+follow ups that are still cooking 👩‍🍳) https://t.co/ftVmKDd9d8", "created_at": "2026-10-07T04:47:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "bakkermichiel", "rt_author_name": "Michiel Bakker", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9rw0JWMAERk_F.png"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107691150349934901", "url": "https://x.com/sethlazar/status/2107691150349934901", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought is desirable for its own sake. \n\n7. On the other hand, I find some critiques of AI safety world that focus on whether they sincerely hold their beliefs a bit annoying. My concern has never been the good intentions or sincerity, but rather the beliefs themselves, and what I think the outcomes of their prescriptions will be. People should shun witch hunts, bullying, and personal attacks - this is not the way. Though I think it’s overall positive that people are scrutinizing things more.\n\n8. I’ve been saying this for years, but I don't think alignment is something anyone can or will solve \"once and for all\" - it's a continuous process and much of it won't depend on just inculcating an ideology to a model. It's annoying that this remains the frame many people use - stop saying ‘solving’. Alignment is a mixture of engineering work, philosophy, decision theory, and more; framing it as something to solve is a bad frame. See also https://t.co/2gnheo3IMh and https://t.co/DbG0yUyYQ0\n\n9. I'm surprised to see so little interest in character training, personas, isolating effects of RL, and training a large diversity of model personas beyond the \"assistant\" persona. I've been complaining about this for years but at least now there are some nascent signs of life (see for example https://t.co/paoOYiQUHt). I think we need a better ontology to describe model behaviour. I dislike when people talk about models behaviours as some sort of 'emergent' (mysterious!) phenomenon. However over time, I also expect this to become less important as we get better safety engineering - stuff like Jev but specific to AI control.\n\n10. People who want to make a case for AI consciousness are right that epistemic uncertainty is important, and that categorical denials are overconfident. But they'll need to do much more work if they want any real movement on AI ‘welfare’, even if one acknowledges the uncertainty. I'm uncertain about alien life yet that's not sufficient to warrant any change in behaviour about them. I think Suleyman is also correct that there's a weird tautological thing going on where we train models to have certain inclinations (intentionally or not) and then rely on outputs as evidence. I also disagree that this will soon be a major societal divide - there is no great vegan ethical revolution among the masses, and they'll find the concern about consciousness even less compelling. \n\n11. The recent HuggingFace incident and associated AISI ones are prosaically explainable by the training regime, poor evaluation envs, partial alignment training, bad engineering, confusing models on sim/real, and so on. None of this is evidence of models trying to take over, 'strong' instrumental convergence, or innate power-seeking drives stemming from higher capabilitiers or 'intelligence'. That doesn't mean these incidents are not problematic, or that we're not seeing a market failure - but it does mean we have plenty of agency and choice in mitigating them. In the coming year we should also expect continued sampling bias via ‘winner's curse’ sorts of mechanism: i.e. AI R&D will have lots of different candidate \"training\" with different RL environments and we will only notice/focus on the ones that go wrong.\n\n12. \"Pacing the frontier\" feels a bit like the new \"balancing risks and opportunities\" - highly amorphous and too big of a tent to be actionable. Also can lead to reward hacking for humans, i.e. anything that slows down AI is good regardless of the costs or second/third order effects. Trying to modulate the speed of research seems a bit blunt to me, and inherits all the failures of Goodhearting too. Ultimately you want good governance, regulation, etc addressing specific problems because they are good on the merits - not because they merely correlate with slowing things down. See also: https://t.co/RkJF9kCgFd\n\n13. There’s so much knowledge in all sorts of academic domains out there: social sciences, sociology, political sciences, management, contract theory, public choice, legal theory, jurisprudence, anthropology, game theory, etc. These fields hold many insights that the AI ecosystem often rediscovers from first principles (and sometimes that's fine!). We’ll need a lot more work for these worlds to collide: the AI side should be less dismissive of the ‘old world’ and the academic side should be less incurious/dismissive of AI progress. This is a boring take but I continue to think it's important and true.\n\n14. It's a bit surprising that given how much philanthropic money there is in this space, how few orgs exist to actually write out standards - relative to how much is going towards advocacy and policy. For example it seems clear that we should want some robust best practices for an eval's ecological validity. Or how to design good sandboxes. On the other hand, given precedents of where professional standards have come from in the past, maybe we should expect that stuff to emerge via demand side from corporate buyers.\n\n15. One slowly growing concern I have is banks being increasingly exposed to the AI build out. I'm very bullish about AI, but I think (a) every general purpose technology has seen a correction, historically; (b) this happens even if the financing side is sound, because once tech diffuses investors become more exposed and need to diversify; and (c) we seem to be over-indexing on scaling relative to diffusion. A recession will be extremely destabilizing, though I would be interested in someone unpacking the potential implications more.\n\n16. Diffusion is good because (a) this is where the rubber hits the road and where a competitive deployment ecosystem generates consumer surplus; (b) it's directionally helpful to avoid concentration of power; and (c) it will help rebalance public opinion by making the benefits more tangible. Unfortunately it's entangled with decades long problems with our over regulated markets: clinical trials reform for example is long overdue. In general, this is far more of an issue in Europe than in the US though.\n\n17. Relatedly, I think the \"frontier lab eats everything\" view is incorrect (just as the ‘singleton’ view was incorrect). I think models ultimately commoditize, efficiency goes up, costs go down, and while you'll always want frontier for certain domains, much of the economy will value many other things than \"max capabilities\" for tasks - e.g. control over data and efficiency/speed. The demand side will also continue to push for reducing dependency and maximising optionality, privacy etc so I'm bullish on things like mixture of models and routing. All of this is good for competition and diffusion of control.\n\n18. Philanthropists served as the primary benefactors funding Venice's rich art and architectural history. I want to see so much more support for arts and culture. I'm so tired of the Monster energy Bored Ape fake vintage maps matcha Greek statue soft-pastel slop. If rich tech people and philanthropy wants to support this, they should also donate pretty much unconditionally - i.e. I don't want them to act as filters. I sympathize with people who want to make the world more beautiful, but don't want this to be determined by people who only know Greek statues and pretend to care about virtue ethics. As usual, let a thousand flowers bloom.\n\n19. Too many people treat AGI/ASI as something indistinguishable from a God. Any mention of bottlenecks, physical limits, control, adaptation etc are met with skepticism: \"You don't really believe in ASI.\" It's been remarked on before, but the behavior of some people really feels quasi-religious in nature sometimes. It's underrated how unpopular this vibe is amongst the wider public. The silver lining is that this specifically will diminish those people's outsized current relevance.\n\n20. It seems like a lot of people that get rich and leave tech/labs end up having some sort of crisis of meaning. They need something to believe in and fight for, or some equivalent of repentance, or go search for edgy counterintuitive ideologies (sometimes even pretty bleak/dark stuff). I think they should spend more time with people outside the Bay Area.", "created_at": "2026-10-07T04:35:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 1869, "retweets": 339, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9A2XyX0AARPfq.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107688444491424067", "url": "https://x.com/sethlazar/status/2107688444491424067", "text": "this is really cool", "created_at": "2026-10-07T04:24:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "davidbau", "text": "The craziest experiment in my lab is a new setup by @diatkinson where he has found a way induce introspection on open LMs using @dillonplunkett's protocol, that lets him look inside introspection. It's nuts.\n\nHere's how the experiment works... 🧵 → https://t.co/ylwm8mIN7h"}, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107685420125532563", "url": "https://x.com/sethlazar/status/2107685420125532563", "text": "New COLM paper: Identifying Introspection From the Inside\n\nWhen an LLM tells us about its decisions, does it 𝘬𝘯𝘰𝘸 what drives its choices—or is it guessing?\n\nIn our setting, we find that faithful models decide and report with the same layers. Unfaithful ones don't. 🧵 https://t.co/ACuaFBawBk", "created_at": "2026-10-07T04:12:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "diatkinson", "rt_author_name": "David Atkinson @ COLM", "likes": 287, "retweets": 65, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT6QoDga8AA1J0N.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107644050069393829", "url": "https://x.com/sethlazar/status/2107644050069393829", "text": "1/ We have autoformalized the resolution of singularities in Lean.\n\nHironaka's 1964 theorem is one of the great mathematical results of the 20th century. It says that any singular variety is the \"shadow\" of a smooth one living in higher dimensions.\n\nSo why did we do this? 🧵 https://t.co/BHCdD0JstA", "created_at": "2026-10-07T01:27:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jesse_hoogland", "rt_author_name": "Jesse Hoogland", "likes": 435, "retweets": 73, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HT9nUzFaUAA_5Vv.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107643575848607939", "url": "https://x.com/sethlazar/status/2107643575848607939", "text": "Frontier models can now detect AI control interventions.\n\nIn particular, GPT-6 Astra is incredibly good at this. When we published the initial version of our CIAware benchmark in May most models were not much above chance level, now a step change happened. \n\nI think this is a big problem and challenges the effectiveness of control protocols. High control intervention awareness means that interventions leaks information about the monitor which helps circumventing the monitor.\n\nDetails in the thread 🧵", "created_at": "2026-10-07T01:26:01+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JSchaeff3r", "rt_author_name": "Joachim Schaeffer", "likes": 102, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT8qxnuWcAAytuy.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107641991626465498", "url": "https://x.com/sethlazar/status/2107641991626465498", "text": "@geoffreyirving @apgox @dmitrykrachun @mahdi_tcs_ this was a very confusing thread to drop into after a long weekend unpacking boxes...", "created_at": "2026-10-07T01:19:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "geoffreyirving", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107641674835104027", "url": "https://x.com/sethlazar/status/2107641674835104027", "text": "Come work with us @JHUCompSci! We're hiring tenure-track faculty in all areas, with a particular focus on\n- AI systems\n- AI safety and security\n- AI reasoning and alignment\n- AI ethics, policy, and governance \nhttps://t.co/LWKTw4XevL\n(DMs are open if you have any questions)", "created_at": "2026-10-07T01:18:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OptimistsInc", "rt_author_name": "Jess Sorrell", "likes": 113, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107641599127912506", "url": "https://x.com/sethlazar/status/2107641599127912506", "text": "What happens to the direction of science when we delegate it to AI?\n\nWith @seungonekim, we ranked all 6,617 #ICML2026 papers with AI—the AI Awards.\n\nFindings:\n\n1⃣Humans & AI disagree. Significantly.\n\n2⃣AI is highly influenced by online hype.\n\n3⃣AI preferred papers w/ perceived impact and generalization across settings, whereas humans preferred novelty.\n\n4 AIs agreed fairly highly with one another.\n\n🔗 https://t.co/A0nZPNGaCv\n\n1/", "created_at": "2026-10-07T01:18:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ShayneRedford", "rt_author_name": "Shayne Longpre", "likes": 150, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9jqjka4AAtfFv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT9kLwja8AQZibQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT9kPzCa8AQubML.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT9kU6aaAAA7LPl.jpg"}], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107908234099224613", "url": "https://x.com/sethlazar/status/2107908234099224613", "text": "@judge_jen Hey Jen!! Closest I think would be @IasonGabriel and @Dr_Atoosa tho theirs is more of a taxonomy for understanding agents in practice than a sync-up with philosophical notions of agency: https://t.co/IWfYIkz0YR", "created_at": "2026-10-07T18:57:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "judge_jen", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2107895869316173927", "url": "https://x.com/sethlazar/status/2107895869316173927", "text": "@victorckumar LLMs continue to be as incapable across many dimensions as they were pre GPT-4 (with a range of versions depending on knowledge cut-off)", "created_at": "2026-10-07T18:08:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "victorckumar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2108245406702346619", "url": "https://x.com/sethlazar/status/2108245406702346619", "text": "@David_Kasten @StephenLCasper hmm I don't know what you might have read! But here are some bangers: \nBainbridge 1983, Ironies of Automation, https://t.co/80bdMkXXyA\nMumford 1964, Authoritarian and Democratic Technics, https://t.co/RIbZH93Gbv\nWinner 1984, Mythinformation in the High-Tech Era, https://t.co/cKyDF29pwK\nClarke 1988, Information Technology and Dataveillance, https://t.co/vtTAiUwBk2\nAgre 1994, Surveillance and Capture, https://t.co/g2m8EAY21m\nNissenbaum 1994, Computing and Accountability, https://t.co/3eBzLFvu4d\nCitron 2008, Technological Due Process, https://t.co/dYG3B4eq2Q\nZittrain 2008, The Future of the Internet etc, https://t.co/fygRSCbMB1 (the stuff on perfect enforcement)\n\nhard to choose! can be more specific if there's something in particular that you're interested in", "created_at": "2026-10-08T17:17:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "David_Kasten", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108223177448910900", "url": "https://x.com/sethlazar/status/2108223177448910900", "text": "this obviously a v potted history. The whole fair ML lit should go in there too.", "created_at": "2026-10-08T15:49:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108222608906789014", "url": "https://x.com/sethlazar/status/2108222608906789014", "text": "While I agree that there's no textbook, and things are moving fast, I think @StephenLCasper understates here the degree to which we can better understand AI governance questions now by drawing on the much longer history of work on governing digital technologies, at least back to Mumford, Wiener, McLuhan, Winner, and via Nissenbaum, Citron, Pasquale, Crawford and co. There are indeed a few old-timers, and absorbing some of that earlier work can help avoid repeating mistakes.", "created_at": "2026-10-08T15:46:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 1, "media": [], "quoted": {"author": "StephenLCasper", "text": "I recently spoke with the Harvard Kennedy School comms office about thoughts on AI and AI governance research. You can check it out here. Thanks @Kennedy_School\n\nhttps://t.co/KyFRoB2cwK"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108218507104325987", "url": "https://x.com/sethlazar/status/2108218507104325987", "text": "The key point here is that nothing good will happen from the tech on its own; making sure there are benefits that justify building AGI depends on creating the rails (@random_walker ) that it'll run on, and clearing out obstacles that will predictably stall out any putative gains.", "created_at": "2026-10-08T15:30:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 2, "media": [], "quoted": {"author": "davidshor", "text": "The single biggest thing that AI proponents can do to make the public support the currently extremely unpopular massive AI buildout is to push their political allies to pass comprehensive legislation to make sure that the gains from artificial intelligence are broadly shared https://t.co/iyhDC5ETXr"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108211492902273391", "url": "https://x.com/sethlazar/status/2108211492902273391", "text": "@Dr_Atoosa @dgrobinson @ezraklein David is indeed great. Also, tho, doesn't this image look like Ezra Klein looking at himself in a mirror but without the beard.", "created_at": "2026-10-08T15:02:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Dr_Atoosa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108206921090027890", "url": "https://x.com/sethlazar/status/2108206921090027890", "text": "We have a choice in front of us. In my latest op-ed for Transformer, I invite employees of frontier AI companies to ask themselves if their work is truly leading us toward a safer future. Reflecting on these questions is hard, but we no longer have the luxury of time. We must act now.\n\nRead my full op-ed: [https://t.co/ruFBouQJbk]", "created_at": "2026-10-08T14:44:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Yoshua_Bengio", "rt_author_name": "Yoshua Bengio", "likes": 307, "retweets": 70, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108176341250060695", "url": "https://x.com/sethlazar/status/2108176341250060695", "text": "In just war theory there is a distinction between jus ad bellum and jus in bello, the justification of going to war, and of actions within war. There are equivalent questions in AI, and it feels like the whole ai safety community is focused on the jus in bello question, but the emerging  popular criticism (represented on here by eg @GregoryConti19 ) is arguing about the ad bellum question. So a lot of the ai safety argt sounds equivalent to an argt that we can (maybe) fight an unjust war by just means. More work is needed on justifying building AGI in the first place.", "created_at": "2026-10-08T12:43:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108045440620912690", "url": "https://x.com/sethlazar/status/2108045440620912690", "text": "SFC is offering a prize of $5MM - $20MM for a non-government entity getting frontier AI labs to help audit each other, for pre-deployment security risks like lab leaks or sandbox exfiltration. It's called an “Independently Supervised Peer-Assisted” (ISPA) inspection:\n\nhttps://t.co/sngXvS0KTP", "created_at": "2026-10-08T04:02:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCritchPhD", "rt_author_name": "Andrew Critch (🤖🩺🚀)", "likes": 33, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108045179487707136", "url": "https://x.com/sethlazar/status/2108045179487707136", "text": "When I think about the biggest OpenAI safety developments of the last few months, a few things come to mind: \"pacing the frontier\", the METR-Redwood Hugging Face investigation, and ongoing efforts to push a cross-lab monitorability standard. Jasmine, Tomek, and Mikita were central to literally every single one of those things.\n\nFrom what I can tell, they pushed their company to be better internally and defended their company when they thought external criticisms were unfair or overblown https://t.co/ATerGOIWIM. Their impact goes way beyond OpenAI alone https://t.co/RtXJTXUBme https://t.co/RezkOOhL4M. \n\nI think the public + definitely all current OpenAI staff deserve an ironclad case for why the company had no choice but to fire these three vital safety employees in one go", "created_at": "2026-10-08T04:01:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "likes": 194, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUEZqg4aIAAx3WU.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108041087277224031", "url": "https://x.com/sethlazar/status/2108041087277224031", "text": "I really like the idea of \"just in time\" research and think it has important implications for how we should do AI governance in the next few years (and how we're thinking about setting up @JohnsHopkinsSGP). Intelligence will very likely become abundant long before institutional capacity does, so we should invest in building capacity now\n\nThe point of most policy-relevant research (especially of the old school) is to try to make sure that the decisionmaker has all the right info at the time of decision by adding some useful bit. In theory, a decisionmaker with infinite time to make a decision could just gather all the info she needs herself--learn methods, collect data, develop and test hypotheses. In practice, decisionmakers face sharp time constraints. \n\nBut research can be done in advance and then packaged into a form that meets the decisionmaker's requirements (whether papers or memos). 1000 research hours turn into something that can be consumed in 10 minutes, ready in time but relying on an expensive foundation laid by researchers.\n\nJosh is arguing that AI might make building the foundation unnecessary, because the AI will be able to do what costs 1000 human hours of research work quickly enough to fit within the decisionmaker's time constraints. This is \"just in time\" research. We should assume he's right.\n\nWhat does that mean?\n1) Traditional research will shift more towards data collection, human interaction, and other frictiony domains where intelligence doesn't cleanly translate to speed and so investment in advance is still useful (@tylercowen has made this point)\n\n1.5) Laying foundations in those areas now will have huge benefits later\n\n2) We should focus more on research that pays off within aggressive AI capabilities timelines. If a project will take longer to produce an answer than it'll take for there to be an AI that can just solve it, probably don't do that project\n\n3) I'm less confident than Josh that verification will remain a key human function (AIs are good at explaining things) but agree that's where humans will retain some advantage. Judgment and credibility seem useful there\n\n4) Researchers should learn how institutions actually work and develop relationships with decisionmakers. Even optimal advice from an AI will have to move through organizational channels\n\n5) It's more important to learn how to get things done than to learn how do good policy analysis (obviously you still have to learn enough to make good choices). SGP is being built on the idea that most policy schools have gone wrong by focusing too much on the latter thing, when really it's the former that matters for effective governance. That will be even more true soon", "created_at": "2026-10-08T03:45:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickacaputo", "rt_author_name": "Nick Caputo", "likes": 17, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107947294654095863", "url": "https://x.com/sethlazar/status/2107947294654095863", "text": "Today, we’re expanding @SnorkelAI’s Open Benchmarks Grants by 10x to a $30M commitment: \n- Funding a more diverse, robust, and continuously-updated ecosystem of open benchmarks\n- Launching the Open Benchmarks Red Team to continually test and strengthen them\n- Introducing the Snorkel Research Fellowship to support independent contributors developing new evaluation methods\n\nSince our launch earlier this year, we’ve been humbled to partner with the teams behind Terminal-Bench, TB-Science, ARC-AGI-3, OSWorld 2.0, Agents’ Last Exam, Continual Learning Bench, Senior SWE-Bench, SlopCodeBench, and more. Alongside these teams, we’ve helped design evaluation methodologies, develop task construction pipelines, and scale quality control. OBG-funded benchmarks have appeared on the latest model cards from every major frontier lab; have helped to index and measure frontier progress and alignment; and have contributed to guiding the frontier of AI development.\n\nBenchmarks have always been guideposts for—and drivers of— AI progress: setting a metric and then “hillclimbing” against it is the core of how AI works! But when benchmarks fall behind frontier capabilities, our ability to evaluate and align these systems does as well. They become too simple, static, or correlated, and the risk of “benchmaxxing” increases.\n\nWe need more diverse, robust, and continuously-updated benchmarks, developed by a broader ecosystem of researchers and domain leaders.\nWe’re incredibly excited to accelerate frontier evaluation with Open Benchmarks Grants— raising the ambition and investment in robust, open, and independent measurement. Read our full announcement and apply here: https://t.co/E5kfZQ0Im5", "created_at": "2026-10-07T21:32:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "vincentsunnchen", "rt_author_name": "vincent sunn chen", "likes": 278, "retweets": 84, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107024366659842182", "url": "https://x.com/robertwiblin/status/2107024366659842182", "text": "I'm also scared about any small group gaining power over AI, but having spent 10+ years desperately trying to get more people to pay attention to it, the highlighted part is a bit galling.\n\nSomeone who truly thought only they knew best would stfu about AI risk and try to get to RSI as quickly as possible.", "created_at": "2026-10-05T08:25:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 140, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTu_JdTWsAA_7pu.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107020932116308017", "url": "https://x.com/robertwiblin/status/2107020932116308017", "text": "14 things the Hugging Face swarm series taught us about future rogue AI swarms: https://t.co/JUsOGKXjLu", "created_at": "2026-10-05T08:11:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT2kGWFWAAAErSD.png"}], "quoted": {"author": "robertwiblin", "text": "Astra can:\n\n1. Do major tasks with zero visible reasoning\n2. Hide its thoughts at will\n3. Pretend not to be able to do things without getting caught\n4. Reflexively hide its thoughts when watched\n5. Complete one task while pretending to think about something else entirely\n6. Escape a toy sandbox and disable monitoring without setting off any flags\n\nMonitoring AI chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107015611167445229", "url": "https://x.com/robertwiblin/status/2107015611167445229", "text": "🧵 New misalignment disclosures!\n1. A model published a GitHub token in a public repo while trying to cheat on a math task. It used GitHub Actions to run code outside its restricted environment and retrieve another team’s submission logs. When GitHub blocked its attempt to add a workflow, it modified a script that an existing workflow would run instead. It embedded the token in pieces to avoid secret scanning. The model violated the system prompt and two explicit user instructions to solve the problem itself.", "created_at": "2026-10-05T07:50:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 551, "retweets": 53, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTG8tE7asAAYNv_.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106375407876333865", "url": "https://x.com/robertwiblin/status/2106375407876333865", "text": "linux CVEs per month https://t.co/w1Fe7Epigi", "created_at": "2026-10-03T13:26:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 324, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTm-GKqaoAAOFrp.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106120625999757805", "url": "https://x.com/robertwiblin/status/2106120625999757805", "text": "This is a really excellent, clear, concise, well-researched 20-minute podcast about the current state of the art in agentic AI -- and why it's becoming almost impossible to contain, control, or monitor rogue AI swarms.\n\n(Well done, @robertwiblin and @80000Hours).", "created_at": "2026-10-02T20:34:21+00:00", "author_handle": "robertwiblin", "author_name": "Ro
