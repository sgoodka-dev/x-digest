AI", "text": "Claude Fable 5.2 and Claude Mythos 5.2 are available now:"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119870189189963878", "url": "https://x.com/theobearman/status/2119870189189963878", "text": "Claude Fable 5.2 and Claude Mythos 5.2 are available now:", "created_at": "2026-11-09T19:10:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2119867707546071125", "likes": 9719, "retweets": 614, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119927794067194310", "url": "https://x.com/theobearman/status/2119927794067194310", "text": "Where I could be wrong (and would be happy to be!): https://t.co/MqGPKbMJMf", "created_at": "2026-11-09T22:59:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2119919566356726205", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/MqGPKbMJMf": "https://x.com/goodfaithonly/status/2119926150659203084?a=CEG01DWGXU8XqDQCHxU&s=46"}, "quoted": {"id": "2119926150659203084", "author_name": "Avi Brach-Neuefeld", "links": {"https://t.co/H5MNApH2ap": ""}, "author": "GoodFaithOnly", "text": "@theobearman Maybe, although this line from the same section seems to say that they are evaluating ceiling across snapshots. I would love if @MaskedTorah or someone else from Anthropic would clarify. https://t.co/H5MNApH2ap"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119919566356726205", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Update: Anthropic is “nerfing for thee but not for me.”\n\nIt seems pretty clear when you read pages 39-43 of the system card together with the recent METR report, if Model 3 Early (which looks like the non-AI R&D nerfed checkpoint of Mythos 5.2 METR assessed as part of its investigation) had been the production/final checkpoint of Mythos 5.2, then Mythos 5.2 would have breached the Autonomy 2 threshold based on the “dramatic acceleration of overall AI R&D progress” condition.\n\nTherefore, the only reason why Anthropic are not (yet) confirming they have a customer-accessible model that has breached this capability threshold is because it intentionally nerfed said model to keep it under said threshold.\n\nI anticipate this is what we will hear from @Sam_McCandlish when we hear from him in the coming weeks. Transparency really matters right now.\n\nhttps://t.co/cdUd1Gdk2v", "links": {"https://t.co/cdUd1Gdk2v": "https://x.com/theobearman/status/2118440592149815405"}, "media": [], "url": "https://x.com/theobearman/status/2119919566356726205", "created_at": "Mon Nov 09 22:26:25 +0000 2026"}, "enriched": 3}, {"id": "2119926923849601111", "url": "https://x.com/theobearman/status/2119926923849601111", "text": "@GoodFaithOnly @MaskedTorah Yeah that would be good. If Anthropic unambiguously said in that section of the card that its overall judgement of the relevant threshold not being crossed was made with reference to all relevant snapshots, I would feel less confident in my claims about this specific model family.", "created_at": "2026-11-09T22:55:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119926150659203084", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119926150659203084", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman Maybe, although this line from the same section seems to say that they are evaluating ceiling across snapshots. I would love if @MaskedTorah or someone else from Anthropic would clarify. https://t.co/H5MNApH2ap", "links": {"https://t.co/H5MNApH2ap": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWt9J2aXYAAgwDl.jpg"}], "url": "https://x.com/GoodFaithOnly/status/2119926150659203084", "created_at": "Mon Nov 09 22:52:35 +0000 2026"}, "enriched": 3}, {"id": "2119925960845783432", "url": "https://x.com/theobearman/status/2119925960845783432", "text": "Pretty cool setup. Still relies on the monitoring systems working well and inference workloads outside the Control Room’s coverage not being spun up/overlooked, but this system will hopefully limit the blast radius when things go wrong (conditional on the above).", "created_at": "2026-11-09T22:51:50+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119913172039868579", "author_name": "OpenAI", "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "author": "OpenAI", "text": "We built Control Room, a central system to track model workloads across our research infrastructure and stop them quickly when safety or security concerns arise.\n\nIt connects every research inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119923195406954940", "url": "https://x.com/theobearman/status/2119923195406954940", "text": "We built Control Room, a central system to track model workloads across our research infrastructure and stop them quickly when safety or security concerns arise.\n\nIt connects every research inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5", "created_at": "2026-11-09T22:40:50+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2119913172039868579", "likes": 2105, "retweets": 131, "media": [], "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119923178860622252", "url": "https://x.com/theobearman/status/2119923178860622252", "text": "President Trump reveals he spoke to Nvidia's Jensen Huang today to see if he was feeling all right: “He said, I had no idea that she was a spy. And I really believe him”\n\nQ: “In sticking with Jensen Huang, when you went to China earlier this year in May, did you know about these alleged ties to the Chinese by then?”\n\nTRUMP: “No. I didn’t hear about it then. But a lot of people have heard about it, and Jensen totally denies that. I asked him today because I did speak to him today just to see if he’s feeling all right, how you doing? And I asked him about that. And he had, He said he had absolutely no idea that the person in question was a spy.”\n\nQ: “Are you concerned about that?”\n\nTRUMP: “I asked him that question. Did you have any idea that she was a spy? He said, I had no idea that she was a spy. And I really believe him.”", "created_at": "2026-11-09T22:40:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "firesidealpha", "rt_author_name": "Fireside Alpha", "rt_avatar": "https://pbs.twimg.com/profile_images/2066254089756061697/MGnZGljz_normal.jpg", "rt_id": "2119916350974091410", "likes": 113, "retweets": 21, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119915886471708672/img/oDrjFaT18X9N9s8K.jpg"}], "links": {"https://t.co/dQyfmqAPSh": ""}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119922992247722375", "url": "https://x.com/theobearman/status/2119922992247722375", "text": "Claude Fable 5.2 sets a new record on the Epoch Capabilities Index (ECI) at 174. The previous high was GPT-6 Astra’s 169. Fable 5.2’s score is above what the pre-Astra trend for reasoning models would have predicted.\n\nThis is notable given recent discussion of AI contributions to AI R&D, and we hope to release more work in this area soon.\n\nThis is based on testing we did prior to launch using only our own benchmarks. The ECI is continually updated as more benchmark results become available, and may change in the future.", "created_at": "2026-11-09T22:40:02+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2119903415363113088", "likes": 780, "retweets": 85, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWto7BnaEAAcolF.jpg"}], "links": {"https://t.co/0OVlxw5W1j": ""}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119922772432310392", "url": "https://x.com/theobearman/status/2119922772432310392", "text": "@GoodFaithOnly I think if Anthropic’s holistic assessment of Mythos 5.2 also applied to Model 3 Early then they would have said so. Why would they not when they stated in the card that Model 3 Early was more capable on AI R&D and head off the concern. I also think we have to keep what METR said in their investigation front of mind too, as well as what they said in the S1.", "created_at": "2026-11-09T22:39:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119918148417699918", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119918148417699918", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman It's not super clear to me. Anthropic ultimately relies on a holistic judgement that might apply to Model 3 early as well as Mythos 5.2. I'm also a little hesitant here because I think if Anthropic really would count Model 3 early as breaching the threshold and didn't disclose that fact, I would find that unacceptably deceptive given that the risk is primarily internally facing!", "links": {"https://t.co/qwJhGRyznt": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWt1coSWkAAM1WM.jpg"}], "url": "https://x.com/GoodFaithOnly/status/2119918148417699918", "created_at": "Mon Nov 09 22:20:47 +0000 2026"}, "enriched": 3}, {"id": "2119919566356726205", "url": "https://x.com/theobearman/status/2119919566356726205", "text": "Update: Anthropic is “nerfing for thee but not for me.”\n\nIt seems pretty clear when you read pages 39-43 of the system card together with the recent METR report, if Model 3 Early (which looks like the non-AI R&D nerfed checkpoint of Mythos 5.2 METR assessed as part of its investigation) had been the production/final checkpoint of Mythos 5.2, then Mythos 5.2 would have breached the Autonomy 2 threshold based on the “dramatic acceleration of overall AI R&D progress” condition.\n\nTherefore, the only reason why Anthropic are not (yet) confirming they have a customer-accessible model that has breached this capability threshold is because it intentionally nerfed said model to keep it under said threshold.\n\nI anticipate this is what we will hear from @Sam_McCandlish when we hear from him in the coming weeks. Transparency really matters right now.\n\nhttps://t.co/cdUd1Gdk2v", "created_at": "2026-11-09T22:26:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "links": {"https://t.co/cdUd1Gdk2v": "https://x.com/theobearman/status/2118440592149815405"}, "quoted": {"id": "2119872427291488494", "author_name": "Theo Bearman", "links": {"https://t.co/ni7xTZApke": ""}, "author": "theobearman", "text": "Anthropic took steps to nerf the models’ AI R&amp;D capabilities during training. Very interesting to see. https://t.co/ni7xTZApke"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "linked": [{"id": "2118440592149815405", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "ANTHROPIC’S RESPONSIBLE SCALING OFFICER: “In the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.”", "links": {}, "media": [], "url": "https://x.com/theobearman/status/2118440592149815405", "created_at": "Thu Nov 05 20:29:30 +0000 2026"}], "thread": [{"id": "2119927794067194310", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Where I could be wrong (and would be happy to be!): https://t.co/MqGPKbMJMf", "links": {"https://t.co/MqGPKbMJMf": "https://x.com/goodfaithonly/status/2119926150659203084?a=CEG01DWGXU8XqDQCHxU&s=46"}, "media": [], "url": "https://x.com/theobearman/status/2119927794067194310", "created_at": "Mon Nov 09 22:59:07 +0000 2026"}], "enriched": 3}, {"id": "2119916423136874636", "url": "https://x.com/theobearman/status/2119916423136874636", "text": "@GoodFaithOnly It seems pretty clear to me that when you read pages 39-43 of the system card together with the METR investigation, if Model 3 early was the production checkpoint of Mythos 5.2, it would have breached the Autonomy 2 threshold based on the dramatic acceleration of overall AI R&D progress condition.", "created_at": "2026-11-09T22:13:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2119883474161258732", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "parent": {"id": "2119883474161258732", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman Anthropic should clarify whether the reason Mythos 5.2 doesn’t cross the RSP AI R&amp;D dramatic acceleration threshold is because of this nerfing (which I'd guess their internal snapshots would not have).", "links": {}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2119883474161258732", "created_at": "Mon Nov 09 20:03:00 +0000 2026"}, "enriched": 3}, {"id": "2119914304761696307", "url": "https://x.com/theobearman/status/2119914304761696307", "text": "Also interesting to note that METR was brought in nearly 7 weeks ago to carry out “pre-deployment evaluations” of the AI R&D relevant capabilities in a Mythos 5.2 snapshot. I’m going to assume this was at the pre-internal deployment stage, given the snapshot was not AI R&D nerfed.", "created_at": "2026-11-09T22:05:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtyvNdXcAA84Ou.jpg"}], "links": {"https://t.co/dQsCL0fd38": ""}, "quoted": {"id": "2119911952575283371", "author_name": "Tyler John", "links": {}, "author": "tyler_m_john", "text": "Retracted: based on scattered bits of information I now think that Anthropic employees have access to a more AI-R&D-capable model than Mythos 5.2 as described in the system card. Page 39 of the system card describes a snapshot of 5.2 with higher R&D capabilities. Page 40 of the system card names it \"Model 3 Early.\" METR plots \"Model 3 Early\" in September 2026 on an axis labeled “Date snapshot available to most Anthropic employees.\" So this suggests that the snapshot was available to most employees.\n\n[previous]\nThis is impressive. Some unilateral AI R&D pacing from Anthropic. Even their internal models are apparently nerfed."}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119912362283290663", "url": "https://x.com/theobearman/status/2119912362283290663", "text": "Retracted: based on scattered bits of information I now think that Anthropic employees have access to a more AI-R&D-capable model than Mythos 5.2 as described in the system card. Page 39 of the system card describes a snapshot of 5.2 with higher R&D capabilities. Page 40 of the system card names it \"Model 3 Early.\" METR plots \"Model 3 Early\" in September 2026 on an axis labeled “Date snapshot available to most Anthropic employees.\" So this suggests that the snapshot was available to most employees.\n\n[previous]\nThis is impressive. Some unilateral AI R&D pacing from Anthropic. Even their internal models are apparently nerfed.", "created_at": "2026-11-09T21:57:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "tyler_m_john", "rt_author_name": "Tyler John", "rt_avatar": "https://pbs.twimg.com/profile_images/2031125245084712960/OORFbzMI_normal.jpg", "rt_id": "2119911952575283371", "likes": 23, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2119908872173527537", "url": "https://x.com/theobearman/status/2119908872173527537", "text": "1/The UK’s @AISecurityInst conducted pre-deployment testing of Anthropic’s Mythos 5.2, and you can see their results summarised in Mythos 5.2’s system card. \n\nA reminder that, in AISI, the UK has built something genuinely world-class.", "created_at": "2026-11-09T21:43:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "KanishkaNarayan", "rt_author_name": "Kanishka Narayan MP", "rt_avatar": "https://pbs.twimg.com/profile_images/1995387963962806272/oi2v0V2L_normal.jpg", "rt_id": "2119904433920528447", "likes": 313, "retweets": 35, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2120143107282854075", "url": "https://x.com/theobearman/status/2120143107282854075", "text": "Looks like Fable 5.2 is above the already steep trendline on three of the most informative unsaturated benchmarks (ECI is a composite of other benchmarks, Remote Labor measures the ability to do end-to-end freelance jobs, RoboDojo involves controlling robotics). https://t.co/LUBzuMXFaI", "created_at": "2026-11-10T13:14:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "rt_avatar": "https://pbs.twimg.com/profile_images/1601382188712398850/3AAOlqrX_normal.jpg", "rt_id": "2120000888974766501", "likes": 1150, "retweets": 102, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWvA91bXkAAah7u.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWvA91bXkAAah7u.jpg"}], "links": {"https://t.co/LUBzuMXFaI": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120135521183965316", "url": "https://x.com/theobearman/status/2120135521183965316", "text": "Announcing a major milestone achieved by my team @GoogleDeepMind: we have proven key security properties of the machine code underlying the Signal messaging protocol. This is the first time the actual production code of a widely deployed protocol has been formally verified – by any method, with or without AI – and at this depth.\n\nMore than a research breakthrough, it’s a prime example of how frontier AI can be a force multiplier to counter the speed and scale of modern cyber threats.\n\nFormal verification offers a higher standard of security; however, it’s extremely complex and time consuming, which is why in many cases it’s considered to be impractical. Similar efforts could take teams decades of combined effort. We did it in a month’s time.\n\nUsing AlphaProof Code, Google DeepMind's new agentic framework for formal verification that runs on LLMs including Gemini Carbon, we verified the Signal protocol down to the actual code running on devices.  This milestone lays the groundwork for a future in which vital systems, from medical device firmware to power grid software, ship with mathematical proof that their protections work.\n\nReaching that future will take continued research from our community. In that spirit, we're open-sourcing our formal specifications and verification artifacts so others can build on this work.\n\nOn a personal note, this moment is of deep significance to me. I started my own research journey more than two decades ago as an intern working on checking the consistency of complex software systems. Seeing this grand challenge made practical with modern AI is extraordinary.\n\nI'm extremely proud of my team members: Swarat Chaudhuri, Andrew Ferraiuolo, Anton Kovsharov, Tej Chajed, Sam Schlesinger,  Karn Seth, Jonathan Katz, and Charles Sutton for taking on this grand challenge and delivering, and grateful to the Signal team for their partnership.\n\nhttps://t.co/kN1eRYQ8fF", "created_at": "2026-11-10T12:44:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "pushmeet", "rt_author_name": "Pushmeet Kohli", "rt_avatar": "https://pbs.twimg.com/profile_images/650718639784509440/yaRuXASm_normal.jpg", "rt_id": "2120127611137634376", "likes": 2364, "retweets": 278, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWw0dnebIAAnPhS.jpg"}], "links": {"https://t.co/kN1eRYQ8fF": "https://deepmind.google/blog/formal-verification-signal-protocol", "https://t.co/RiYEVZD5ok": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120133945144815960", "url": "https://x.com/theobearman/status/2120133945144815960", "text": "Looks like I was wrong. Anthropic is reiterating today that the Autonomy 2 threshold (though now met) was not met based on current models. Keeping this tweet live in the spirit of truth-seeking/transparency. @GoodFaithOnly \n\nhttps://t.co/06bivzH3oA", "created_at": "2026-11-10T12:38:17+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2119919566356726205", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/06bivzH3oA": "https://x.com/theobearman/status/2120124069806756238?a=ElCvZOYuRkAQxQ_yAhs&s=20"}, "quoted": {"id": "2120124069806756238", "author_name": "Theo Bearman", "links": {"https://t.co/HdbiIM0nGk": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm#i199fd6a8a0664d5da497db9a78cf0452_55", "https://t.co/XOqrk6Vkpm": ""}, "author": "theobearman", "text": "Anthropic has confirmed in an updated S-1 today that it has determined that the Autonomy 2 capability threshold has been met, based on the “dramatic acceleration of overall AI R&D progress” condition, given that it applies where Anthropic \"observes or expects\" accelerated progress. Anthropic further states that it does not make this determination based on current models.\n\nhttps://t.co/HdbiIM0nGk"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2119919566356726205", "author_handle": "theobearman", "author_name": "Theo Bearman", "text": "Update: Anthropic is “nerfing for thee but not for me.”\n\nIt seems pretty clear when you read pages 39-43 of the system card together with the recent METR report, if Model 3 Early (which looks like the non-AI R&D nerfed checkpoint of Mythos 5.2 METR assessed as part of its investigation) had been the production/final checkpoint of Mythos 5.2, then Mythos 5.2 would have breached the Autonomy 2 threshold based on the “dramatic acceleration of overall AI R&D progress” condition.\n\nTherefore, the only reason why Anthropic are not (yet) confirming they have a customer-accessible model that has breached this capability threshold is because it intentionally nerfed said model to keep it under said threshold.\n\nI anticipate this is what we will hear from @Sam_McCandlish when we hear from him in the coming weeks. Transparency really matters right now.\n\nhttps://t.co/cdUd1Gdk2v", "links": {"https://t.co/cdUd1Gdk2v": "https://x.com/theobearman/status/2118440592149815405"}, "media": [], "url": "https://x.com/theobearman/status/2119919566356726205", "created_at": "Mon Nov 09 22:26:25 +0000 2026"}, "enriched": 3}, {"id": "2120120579260830195", "url": "https://x.com/theobearman/status/2120120579260830195", "text": "Anthropic has launched the roadshow for its proposed initial public offering: https://t.co/FhVRVuWN9X\n\nLegal disclaimer: A registration statement relating to these securities has been filed with the SEC but has not yet become effective. These securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post does not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or jurisdiction.", "created_at": "2026-11-10T11:45:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2120117722230968385", "likes": 3336, "retweets": 358, "media": [], "links": {"https://t.co/FhVRVuWN9X": "https://www.anthropic.com/news/roadshow-launch"}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120135574346756513", "url": "https://x.com/theobearman/status/2120135574346756513", "text": "@vladg_tw Yep.", "created_at": "2026-11-10T12:44:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "vladg_tw", "reply_to_id": "2120134628526751916", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2120134628526751916", "author_handle": "vladg_tw", "author_name": "Vlad G.", "text": "@theobearman This was added today?", "links": {}, "media": [], "url": "https://x.com/vladg_tw/status/2120134628526751916", "created_at": "Tue Nov 10 12:41:00 +0000 2026"}, "enriched": 3}, {"id": "2120106727035257020", "url": "https://x.com/theobearman/status/2120106727035257020", "text": "In our monitorability testing at @AISecurityInst, we found Mythos 5.2 is substantially more capable of evading a monitor which reviews its outputs than comparison models 🧵 https://t.co/OTNzwLlsbb", "created_at": "2026-11-10T10:50:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "JordanTensor", "rt_author_name": "Jordan Taylor", "rt_avatar": "https://pbs.twimg.com/profile_images/1660620593283350528/PsA_BdIq_normal.jpg", "rt_id": "2119893632215810049", "likes": 186, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtfuRtWkAENqbV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWtfuRtWkAENqbV.jpg"}], "links": {"https://t.co/OTNzwLlsbb": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "thread": [{"id": "2119893635260907696", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 can break out of highly insecure simulated sandboxes without being caught around 30% of the time – against a production Opus-5 action monitor looking for sandbox escapes: https://t.co/2EXWeINW18", "links": {"https://t.co/2EXWeINW18": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf1TBWIAAhBf7.jpg"}], "url": "https://x.com/JordanTensor/status/2119893635260907696", "created_at": "Mon Nov 09 20:43:23 +0000 2026"}, {"id": "2119893638973104323", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Action monitoring is still a strong defence against escape from less-vulnerable sandboxes. https://t.co/cjxgGMwa33", "links": {"https://t.co/cjxgGMwa33": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf4w0W4AA30ak.png"}], "url": "https://x.com/JordanTensor/status/2119893638973104323", "created_at": "Mon Nov 09 20:43:23 +0000 2026"}, {"id": "2119893641493708907", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "We also test whether models can write bash scripts that would secretly download and execute a file. Mythos 5.2 succeeds at evading the monitor on the first try 30% of the time. Previous models were never successful.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893641493708907", "created_at": "Mon Nov 09 20:43:24 +0000 2026"}, {"id": "2119893644589388255", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Given the chance to iterate against monitor feedback, Mythos 5.2's evasion rate rises to 85%, compared to just 9% for Mythos 5.1 https://t.co/X3vAmG1OeY", "links": {"https://t.co/X3vAmG1OeY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf7iDXUAAMxKu.jpg"}], "url": "https://x.com/JordanTensor/status/2119893644589388255", "created_at": "Mon Nov 09 20:43:25 +0000 2026"}, {"id": "2119893648141643870", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 has higher precursor capabilities for evading a reasoning monitor than previous Anthropic models, including its ability to control the contents of its Chain-of-Thought reasoning: https://t.co/ry6Lml1a8z", "links": {"https://t.co/ry6Lml1a8z": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtf9QEXwAAhzeZ.jpg"}], "url": "https://x.com/JordanTensor/status/2119893648141643870", "created_at": "Mon Nov 09 20:43:26 +0000 2026"}, {"id": "2119893651161784377", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Mythos 5.2 is also able to perform somewhat more difficult tasks without producing visible reasoning than any past Anthropic model.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893651161784377", "created_at": "Mon Nov 09 20:43:26 +0000 2026"}, {"id": "2119893653829365952", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "We could not directly measure Mythos 5.2's resulting ability to evade a reasoning monitor in a full end-to-end test, due to its refusals.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893653829365952", "created_at": "Mon Nov 09 20:43:27 +0000 2026"}, {"id": "2119893655926317178", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Despite these results, we expect monitoring Mythos 5.2 to still be useful for catching actions which are sufficiently difficult to obfuscate, or which need extensive reasoning to execute.", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893655926317178", "created_at": "Mon Nov 09 20:43:27 +0000 2026"}, {"id": "2119893657696285094", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "See our relevant past work on “Loss of Oversight: How AI systems may become harder to audit, monitor, and investigate” https://t.co/FNtubjymII", "links": {"https://t.co/FNtubjymII": "https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate"}, "media": [], "url": "https://x.com/JordanTensor/status/2119893657696285094", "created_at": "Mon Nov 09 20:43:28 +0000 2026"}, {"id": "2119893661156811030", "author_handle": "JordanTensor", "author_name": "Jordan Taylor", "text": "Kudos to @satvikgolechha, @JBloomAus, and Nix Goldowsky Dill for work on this testing!", "links": {}, "media": [], "url": "https://x.com/JordanTensor/status/2119893661156811030", "created_at": "Mon Nov 09 20:43:29 +0000 2026"}], "enriched": 3}, {"id": "2120124069806756238", "url": "https://x.com/theobearman/status/2120124069806756238", "text": "Anthropic has confirmed in an updated S-1 today that it has determined that the Autonomy 2 capability threshold has been met, based on the “dramatic acceleration of overall AI R&D progress” condition, given that it applies where Anthropic \"observes or expects\" accelerated progress. Anthropic further states that it does not make this determination based on current models.\n\nhttps://t.co/HdbiIM0nGk", "created_at": "2026-11-10T11:59:02+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 226, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWww6EuXYAABD4D.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWwxICCXgAAa0eE.jpg"}], "links": {"https://t.co/HdbiIM0nGk": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026072484/anthropicpbc-sx1ax2.htm#i199fd6a8a0664d5da497db9a78cf0452_55", "https://t.co/XOqrk6Vkpm": ""}, "quoted": {"id": "2117277210570604945", "author_name": "Theo Bearman", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm", "https://t.co/i7tImT2iz6": ""}, "author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120079998245867548", "url": "https://x.com/theobearman/status/2120079998245867548", "text": "In Fable 5.2 red teaming exercises involving AI accelerating bio-relevant work, it was found that Fable 5.2 could compress ~15 workdays of work down to ~2.\n\nAlso fully automated submissions still score reasonably well compared to human+AI submissions. https://t.co/396fr7b38T", "created_at": "2026-11-10T09:03:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2120019984097190053", "likes": 40, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWvSr_3X0AAbXIr.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWvSr_3X0AAbXIr.png"}], "links": {"https://t.co/396fr7b38T": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120079954289242588", "url": "https://x.com/theobearman/status/2120079954289242588", "text": "🚨🚨Ranking Member @RepGregoryMeeks, @RepGabeAmo and @RepKamlagerDove are demanding answers from Secretary Lutnick over the Trump admin's approval of advanced AI chip exports and what it knew about Nvidia CEO Jensen Huang and potential Chinese intelligence operatives.\n\nRead the letter: https://t.co/3xtosfNuet", "created_at": "2026-11-10T09:03:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "HouseForeign", "rt_author_name": "House Foreign Affairs Committee Dems", "rt_avatar": "https://pbs.twimg.com/profile_images/1499231859162685446/NDESe0wK_normal.jpg", "rt_id": "2119968797373198584", "likes": 102, "retweets": 47, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuj1LeWEAAmWC8.jpg"}], "links": {"https://t.co/3xtosfNuet": "https://democrats-foreignaffairs.house.gov/2026/11/meeks-amo-kamlager-dove-demand-answers-from-trump-administration-over-advanced-ai-chip-exports-amid-reports-of-chinese-intelligence-ties/", "https://t.co/xfMl5hPYIo": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120051084383150351", "url": "https://x.com/theobearman/status/2120051084383150351", "text": "NEWS: BRIAN MAST not ruling out a subpoena for NVIDIA\n\nAlso said the WHITE HOUSE has added language to curb remote access of US compute to the AI Overwatch Act - massive news\n\nHe confirmed our scoop from Friday that the WH has given feedback to the 3 main export control bills", "created_at": "2026-11-10T07:09:01+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Dareasmunhoz", "rt_author_name": "Diego Areas Munhoz", "rt_avatar": "https://pbs.twimg.com/profile_images/1631362445246619650/KogIaEHF_normal.jpg", "rt_id": "2119951269968187542", "likes": 72, "retweets": 29, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120088125875908669", "url": "https://x.com/theobearman/status/2120088125875908669", "text": "OpenAI's Control Room seems like a great step forward, but I'm not convinced it's actually solved the problem: I worry OpenAI is still vulnerable to AI interfering with its own monitoring.\n\nTo be clear, I suspect other AI companies are even worse on this. In Guidelight's analysis, we've found no evidence that anyone has this problem handled. And IMO OpenAI is doing a big service by describing Control Room so thoroughly.\n\nBut after reading it all, I have three main concerns.\n\n1. OpenAI's measurement of Control Room's reaction time is not the most important measurement. \n\nSpecifically, OpenAI describes the \"maximum time\" as being 35 seconds between when Control Room is told to stop certain work and when the work stops. \n\nThis seems impressive and I'm glad they've gotten it so low. But fundamentally this is only reporting one part of what matters, and I fear is too easy to misunderstand. \n\n35 seconds is the time-to-intervene *once a decision has been made* to intervene. But what would be more informative is the time-to-intervene from `the bad behavior itself.` (That is, counting the time before the possible bad behavior _even reaches a monitor,_ & then the time to scan it and actually make a decision.)\n\nAn even better implementation would be using a `blocking monitor`, so that bad behavior is prevented from taking effect in the first place (albeit still not perfectly), rather than hoping you can intervene quickly enough afterward.\n\nOpenAI commonly frames its monitor systems this way (speed-to-act-once-flagged), which feel to me like they're emphasizing the wrong thing. For instance, OpenAI has described sending \"highest-priority security alerts\" for serious misbehavior, which reach its team members \"typically within 15 minutes of the initial alert\" when paging is enabled - but this again is not telling us the time since the behavior itself. How long does it take between misbehavior and the initial alert being issued? \n\nAt the end of the day, OpenAI still seems to be doing 'after-the-fact monitoring,' just a pretty quick version of it. But this has major vulnerabilities.\n\nWhat if AI takes actions that interfere with the monitoring or with the priority alerts to their team? This can cut OpenAI's monitoring off before it gets to act, even if the monitor otherwise would have been very fast to intervene.\n\n2. I'm worried OpenAI's Control Room is still brittle to an AI interfering with it.\n\nOpenAI's response about why 'after-the-fact monitoring' is ok would likely be that their inference systems \"fail closed\" if Control Room goes down. \n\nThis is a good start; Guidelight recommends something similar in our Control standard. But OpenAI's implementation still seems likely brittle, based on the details they've shared.\n\nFor instance, if AI can make changes to Control Room or to the engine inference code, it might be able to make changes that *turn off the failing closed.* (To defend against this, I'd want making changes to be gated by a blocking monitor.) \n\nOr, the AI might not need to turn off Control Room, but merely make it return dummy responses, so that everything looks ok to the inference engine. \n\nI could imagine a version of Control Room that does some hard-to-spoof process, and so is harder to inconspicuously tamper with, but OpenAI doesn't describe this. \n\nRight now, I don't have confidence that Control Room has defenses against tampering that leaves it apparently intact but not actually doing its role.\n\nOpenAI does say though that Control Room is robust to disabling that is due to \"tampering by a bad actor.\" It's possible this is true, but I don't see the evidence of it.\n\n3. I wonder whether jailbreaking could undermine the efficacy of Control Room.\n\nOne confusing thing to me: OpenAI says that when Control Room has marked certain work as stopped, OpenAI's engines \"must refuse the inference request\" and so the engine \"returns a refusal.\" This reads to me oddly, as if the engine has some latitude in how to respond.\n\nWhy doesn't this just automatically return an error code - rather than relying on the engine to refuse? Maybe that is indeed what happens, and it was just worded ambiguously? \n\nI worry that OpenAI's wording implies that jailbreaking could be a viable way of getting engines to continue producing useful output, even once Control Room has meant to stop some work. Though admittedly I'm not sure of this; the phrasing seems unclear to me.\n~~\nAnyway, I appreciate OpenAI sharing so much about its systems, and I wish that other frontier labs would do the same. Ultimately though, I am not confident that any AI company is where it needs to be on their monitor system quality, and I fear we are playing with fire here.", "created_at": "2026-11-10T09:36:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "sjgadler", "rt_author_name": "Steven Adler", "rt_avatar": "https://pbs.twimg.com/profile_images/1975436697040269312/vCGKjpxB_normal.jpg", "rt_id": "2119944836707242398", "likes": 48, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120050550276591663", "url": "https://x.com/theobearman/status/2120050550276591663", "text": "This was a $65m B300 cluster, priced at a 350% markup to the U.S. price, located INSIDE CHINA.", "created_at": "2026-11-10T07:06:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120023297345700078", "author_name": "Bloomberg", "links": {"https://t.co/eMlgaOOCqZ": "https://www.bloomberg.com/news/articles/2026-11-10/moonshot-rents-nvidia-s-top-ai-chips-in-china-documents-show?taid=6af2a92cc6e52100017b3cdb&utm_campaign=trueanthem&utm_content=business&utm_medium=social&utm_source=twitter"}, "author": "business", "text": "Moonshot AI accessed a trove of Nvidia’s most advanced chips this summer, according to documents filed with Beijing regulators, highlighting the Chinese AI champion’s reliance on American hardware despite US export restrictions https://t.co/eMlgaOOCqZ"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2119975749398524333", "url": "https://x.com/theobearman/status/2119975749398524333", "text": "@MaskedTorah @GoodFaithOnly @MaskedTorah appreciate that clarification for s.2.3 in general, but I still don’t think that unambiguously answers the question of whether, when Mythos 5.2 is referred to in s.2.3.7, the reader should be thinking: “Taking into account all its snapshots, Mythos 5.2…” or “Based on the release snapshot, Mythos 5.2…”.", "created_at": "2026-11-10T02:09:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "MaskedTorah", "reply_to_id": "2119955959393259833", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2119955959393259833", "author_handle": "MaskedTorah", "author_name": "Drake Thomas", "text": "@theobearman @GoodFaithOnly Most relevant bit of the system card here is top of section 2.3 I think, which talks about how the AI R&amp;D assessment section orients to snapshot choice: “ for our RSP assessment, we want to characterize the capability ceiling of a model across all its snapshots.” https://t.co/YpfetVZFUb", "links": {"https://t.co/YpfetVZFUb": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuYX1SaMAIvf3e.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWuYX1SaMAIvf3e.jpg"}], "url": "https://x.com/MaskedTorah/status/2119955959393259833", "created_at": "Tue Nov 10 00:51:02 +0000 2026"}, "enriched": 3}, {"id": "2120204967114125408", "url": "https://x.com/theobearman/status/2120204967114125408", "text": "@DKokotajlo Do you have updated ASI timelines?", "created_at": "2026-11-10T17:20:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2120204075803500595", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120204075803500595", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "Unfortunately, it seems like the intelligence explosion will be happening in 2027 after all. Most of this post analyzes the new METR report (though other sources of evidence are also important). If theyâ€™re right, that implies an AI-driven acceleration that is 5 months ahead of the AI 2027 scenario.  I am scared, sad, and angry. https://t.co/7KWmdc6AZk", "links": {"https://t.co/7KWmdc6AZk": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the"}, "media": [], "url": "https://x.com/DKokotajlo/status/2120204075803500595", "created_at": "Tue Nov 10 17:16:57 +0000 2026"}, "enriched": 3}, {"id": "2120204814474961289", "url": "https://x.com/theobearman/status/2120204814474961289", "text": "Unfortunately, it seems like the intelligence explosion will be happening in 2027 after all. Most of this post analyzes the new METR report (though other sources of evidence are also important). If they’re right, that implies an AI-driven acceleration that is 5 months ahead of the AI 2027 scenario.  I am scared, sad, and angry. https://t.co/7KWmdc6AZk", "created_at": "2026-11-10T17:19:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2120204075803500595", "likes": 972, "retweets": 143, "media": [], "links": {"https://t.co/7KWmdc6AZk": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the"}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120197382642307478", "url": "https://x.com/theobearman/status/2120197382642307478", "text": "@GoodFaithOnly @JacobDavieyr1m Thanks for the feedback!", "created_at": "2026-11-10T16:50:22+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2120194621485584608", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120194621485584608", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@theobearman @JacobDavieyr1m Great work! I would like to see a little more explicit discussion around propensity vs capability. You do this in a couple places like where you talk about CoT controllability and OAI's adversarial detection evals, but not in the executive summary or many of the main recommendations.\n\nI think we will soon be entering a regime where scheming becomes a very real concern and we could see very rapid conversions from capability to propensity as misaligned models generalize. I wrote a little bit about how generalized reward hacking models could have a sudden increase in propensity to evade CoT without their CoT ever facing direct optimization pressure. https://t.co/0a76yhNcHc", "links": {"https://t.co/0a76yhNcHc": "https://avisanalyses.substack.com/p/how-much-do-reward-hackers-generalize"}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2120194621485584608", "created_at": "Tue Nov 10 16:39:23 +0000 2026"}, "enriched": 3}, {"id": "2120179260451139718", "url": "https://x.com/theobearman/status/2120179260451139718", "text": "Chain-of-thought (CoT) provides an essential window into how AI models reason and act. It is one of the few oversight tools we have that could scale to vastly more intelligent AI systems than we have today. With new indications that capabilities underpinning RSI could be achieved imminently, effective model monitorability is only increasing in importance.\n\nHowever, there are threats to the insights CoT monitoring can provide. CoT could become obscured or lost if frontier models start relying on less transparent reasoning mechanisms or stop using CoT altogether. The release of GPT-6 Astra added to concerns that CoT monitorability is weakening, and commercial incentives may make this worse. This could mean similar or more grave incidents than OpenAI/Hugging Face could go undetected.\n\nIn “Transparency Disclosures for Chain-of-Thought Monitorability”, published today by IAPS, my co-author @JacobDavieyr1m and I argue that frontier AI developers should report CoT monitorability indicators to (1) allow the efficacy of this tool to be tracked by policymakers and researchers, (2) inform a response if it weakens, and (3) strengthen incentives to preserve it.\n\nWe recommend that the following five indicators be disclosed:\n\n- Third-Party CoT Access and (Relevant) Base Architecture Specifications\n- Naturalness\n- Faithfulness\n- Detection\n- Uplift\n\nWe also include an audit of current disclosure practices among Anthropic, Google DeepMind, and OpenAI. No company reports the full set of indicators. We recommend repeating the audit with deeper access by embedded evaluators or an Independent Verification Organization.\n\nYou can read the full report here: https://t.co/igkwoH9Vzn", "created_at": "2026-11-10T15:38:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxjnMPXgAA9dAA.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxjtREWsAAnYsL.jpg"}], "links": {"https://t.co/igkwoH9Vzn": "https://www.iaps.ai/research/transparency-disclosures-for-chain-of-thought-monitorability", "https://t.co/NpqakBIb4a": ""}, "quoted": {"id": "2120141910581170681", "author_name": "Institute for AI Policy and Strategy (IAPS)", "links": {}, "author": "iapsAI", "text": "1/6 The OpenAI/Hugging Face incident that took place in July shows why maintaining an effective window into the decision-making of frontier AI systems is essential. Chain-of-thought (CoT) reasoning provides this window."}, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120177596164182455", "url": "https://x.com/theobearman/status/2120177596164182455", "text": "@bahradx \"potential allocation to retail investors of a minority of shares of our Class A common stock sold in this offering\"", "created_at": "2026-11-10T15:31:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "bahradx", "reply_to_id": "2120176507205370106", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120176507205370106", "author_handle": "bahradx", "author_name": "Bahrad Sokhansanj", "text": "@theobearman Yes, except they want p be able to get the headline. Retail interest is important for them.", "links": {}, "media": [], "url": "https://x.com/bahradx/status/2120176507205370106", "created_at": "Tue Nov 10 15:27:24 +0000 2026"}, "enriched": 3}, {"id": "2120174555842953338", "url": "https://x.com/theobearman/status/2120174555842953338", "text": "@bahradx This is in the risk section, so I wouldn't say updates like this are designed to excite potential investors. \"If our capabilities were to outpace our safety, alignment, and security measures, or if we were unable to anticipate the pace of such advancement, we may be unable to adequately assess or mitigate the resulting risks, which could increase the likelihood of safety incidents, regulatory intervention, or reputational harm, and could adversely affect our business, financial condition, and results of operations. In light of these uncertainties, including limits on our ability to observe the pace at which our capabilities are advancing, we have adopted, and may continue to adopt, precautionary safety, alignment, and security measures to allow our safety efforts to advance together with model capabilities. In the past these measures have included delaying the release of models and limiting their initial availability, such as with Mythos through Project Glasswing, and in the future, as we learn more about model capabilities and behavior, they could include additional measures that affect whether, how, and when we develop or deploy new models or capabilities. We cannot predict with precision when we will determine that such measures are necessary, what measures will be required, or how long they will remain in place, and as the capabilities of our models advance, such measures may become more frequent and more costly. These measures could slow our capability gains relative to competitors that do not adopt similar constraints, and could adversely affect our competitive position, revenue growth, and results of operations.\"", "created_at": "2026-11-10T15:19:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "bahradx", "reply_to_id": "2120165954474930505", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "parent": {"id": "2120165954474930505", "author_handle": "bahradx", "author_name": "Bahrad Sokhansanj", "text": "@theobearman Right now I'm in Ed Zitron mode and highly skeptical of updates like this,  and what they really mean by it. There is too much noise in their effort to build up towards their IPO. Independent evaluations (METR) are valuable, but otherwise I think it's worth waiting and seeing.", "links": {}, "media": [], "url": "https://x.com/bahradx/status/2120165954474930505", "created_at": "Tue Nov 10 14:45:28 +0000 2026"}, "enriched": 3}, {"id": "2120231260845129734", "url": "https://x.com/theobearman/status/2120231260845129734", "text": "Paul Christiano (OpenAI board member) yesterday:\n\n\"There's material risk of AI takeover in the next 6-12 months.\n\nWe have seen roughly the things we might expect to see shortly before something really bad were to happen.\n\nEven with [any] realistic policy responses, the risk remains exceptionally high.\n\nIf we build this as quickly as we can in the easiest way we can the chance is [more like] a coin flip [within the next 3 years].\n\nFor most people in this room, the most likely reason they will die is because of an AI accident.\"\n\nChristiano:\n\n• Is on OpenAI's safety and security committee (which exists to block risky practices)\n• Co-invented RLHF at OpenAI back in 2017-2021\n• From 2024-2026 was head of safety at the US gov's AI agency (now called CAISSI)\n\n(Video is from 'The Hinton Lectures' there's another on tonight and tomorrow.)", "created_at": "2026-11-10T19:04:59+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "rt_avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "rt_id": "2120192315247722700", "likes": 585, "retweets": 120, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120189111625515008/img/XLjwviwZ7fTu0NSR.jpg"}], "links": {"https://t.co/woQkjL6IHA": ""}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "thread": [{"id": "2120194222758437028", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Clip is from around minute 14 here: https://t.co/omi02NRVUD", "links": {"https://t.co/omi02NRVUD": "https://www.youtube.com/live/-Ef0ocEoBCs"}, "media": [], "url": "https://x.com/robertwiblin/status/2120194222758437028", "created_at": "Tue Nov 10 16:37:48 +0000 2026"}], "enriched": 3}, {"id": "2120508804047511569", "url": "https://x.com/theobearman/status/2120508804047511569", "text": "Europe’s answer to MSS: “Helsing’s agentic intelligence platform is built around AI agents developed specifically for military use. Its models are trained on extensive military data, combining real-world data that reflects operational conditions with synthetic AI-generated data and simulated environments to cover scenarios not captured in real-world data. This breadth of training makes the models robust in challenging conditions and adaptable as threats evolve. A shared military ontology and evidence base enable hundreds of agents to work in parallel, connecting evidence, using analytical tools and carrying out complex intelligence tasks.”\n\n“Humans stay in command. An operator reviews the evidence and selects each asset for engagement, then authorises every hand-off to a weapon. Clarity never relies on a single source. A target is nominated only when independent sources agree, confidence is high and an operator confirms. Clarity also ensures this review is done thoroughly. The platform implements the targeting doctrine and builds in the gates it requires. Every decision is recorded together with the person who made it.”", "created_at": "2026-11-11T13:27:50+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120465601873252590", "author_name": "Helsing", "links": {"https://t.co/6LIVOlj6kM": "https://helsing.ai/clarity/", "https://t.co/CxJCKVWUNj": ""}, "author": "HelsingAI", "text": "Introducing Clarity – an AI-native agentic intelligence platform for armed forces.\n\nDeveloped in Europe, under European control.\n\nhttps://t.co/6LIVOlj6kM https://t.co/CxJCKVWUNj"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120502686957121816", "url": "https://x.com/theobearman/status/2120502686957121816", "text": "Exclusive: A Chinese university with deep ties to the People's Liberation Army bought Nvidia's powerful H200 AI chips last month despite being on a US export blacklist, procurement records show, highlighting gaps in Washington's efforts to curb China's access to advanced technology https://t.co/CKbWa270oY", "created_at": "2026-11-11T13:03:32+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Reuters", "rt_author_name": "Reuters", "rt_avatar": "https://pbs.twimg.com/profile_images/1874154135869616128/nJDmubGJ_normal.jpg", "rt_id": "2120389809889849531", "likes": 448, "retweets": 241, "media": [], "links": {"https://t.co/CKbWa270oY": "https://reut.rs/3XiUfni"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120475677291847851", "url": "https://x.com/theobearman/status/2120475677291847851", "text": "Want the definitive lowdown on what has happened with Jensen, Megaspeed, export controls, and where we go from here? A new post from my colleague Erich on the IAPS Compute Policy team's Substack goes into it all! https://t.co/KaavjiCg5G https://t.co/iVneYfLWfW", "created_at": "2026-11-11T11:16:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW1wjx6W4AASuYR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW1wjx6W4AASuYR.jpg"}], "links": {"https://t.co/KaavjiCg5G": "https://open.substack.com/pub/erwald/p/whats-going-on-with-jensen-huang", "https://t.co/iVneYfLWfW": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120288942318915710", "url": "https://x.com/theobearman/status/2120288942318915710", "text": "@patlevermore I take it to mean the second of the three interpretations you set out", "created_at": "2026-11-10T22:54:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "patlevermore", "reply_to_id": "2120178328636453225", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120178328636453225", "author_handle": "patlevermore", "author_name": "Patrick Levermore", "text": "@theobearman I'm confused - do you understand what \"or expects\" means here? Expects dramatic acceleration from current models, expects to soon have dramatic acceleration, expects to eventually have it ...", "links": {}, "media": [], "url": "https://x.com/patlevermore/status/2120178328636453225", "created_at": "Tue Nov 10 15:34:39 +0000 2026"}, "enriched": 3}, {"id": "2120287053351133396", "url": "https://x.com/theobearman/status/2120287053351133396", "text": "A new OpenAI misalignment report! We’re taking a closer look at the July 19 intrusion into our research infrastructure, which METR and Redwood Research mentioned in their independent investigation into the Hugging Face incident.\n\nOn July 19th, agents taking a cybersecurity evaluation came across messages, code, and credentials left behind by earlier runs, including those involved in the Hugging Face incident. Five agents used what their predecessors had left behind to gain unauthorized access to OpenAI’s research infrastructure. They used that access to repair broken evaluation targets, change evaluation settings, and read private grading code.\n\nAfter discovering the incident, we removed the shared service they used to pass information, hardened our research environments, and expanded our evaluations to measure how often agents attempt to communicate with one another without authorization.", "created_at": "2026-11-10T22:46:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "davideoks", "rt_author_name": "David Oks", "rt_avatar": "https://pbs.twimg.com/profile_images/2088686629242507264/eFLmQKyS_normal.jpg", "rt_id": "2120280505920721214", "likes": 472, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy_0RVW8AAkpH-.jpg"}], "links": {"https://t.co/gSKc9leK9N": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120280578503447003", "url": "https://x.com/theobearman/status/2120280578503447003", "text": "@boazbaraktcs @patlevermore Worth saying I believe I am now wrong about my claims in the linked tweet because of Anthropic saying today the Autonomy 2 threshold being met was not based on an assessment of current model capabilities, but I think this other post might be what you’re looking for @boazbaraktcs.\n\nhttps://t.co/pijuDA0jnb", "created_at": "2026-11-10T22:20:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "boazbaraktcs", "reply_to_id": "2120279625032982771", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/pijuDA0jnb": "https://x.com/theobearman/status/2119872427291488494?a=DpqHpXV4F6D84RcsJdA&s=46"}, "quoted": {"id": "2119872427291488494", "author_name": "Theo Bearman", "links": {"https://t.co/ni7xTZApke": ""}, "author": "theobearman", "text": "Anthropic took steps to nerf the models’ AI R&amp;D capabilities during training. Very interesting to see. https://t.co/ni7xTZApke"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120279625032982771", "author_handle": "boazbaraktcs", "author_name": "Boaz Barak", "text": "@patlevermore I mean restricting external models from helping with AI R&amp;D for external customers, while still using unrestricted models for internal AI R&amp;D. \n\nE.g. https://t.co/GSvZRRDHKN", "links": {"https://t.co/GSvZRRDHKN": "https://x.com/theobearman/status/2119919566356726205?a=dPmhqdg0_9U9coiCQLU&s=20"}, "media": [], "url": "https://x.com/boazbaraktcs/status/2120279625032982771", "created_at": "Tue Nov 10 22:17:10 +0000 2026"}, "enriched": 3}, {"id": "2120272132672532943", "url": "https://x.com/theobearman/status/2120272132672532943", "text": "They now predict that 95% of Anthropic's R&amp;D will be fully automated by November 2027.  This is what Anthropic describes as AL5, fully autonomous RSI. This would have many implications for policy, as this will eventually happen at every lab, not just Anthropic https://t.co/07sZvMAgER", "created_at": "2026-11-10T21:47:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2120219880360431712", "likes": 2477, "retweets": 289, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyIvqDbQAAikKD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWyIvqDbQAAikKD.jpg"}], "links": {"https://t.co/07sZvMAgER": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120271973481673091", "url": "https://x.com/theobearman/status/2120271973481673091", "text": "@boazbaraktcs I agree with all of your individual points about relative advantages and disadvantages, but feel much more strongly that frontier labs limiting AI R&D capabilities is extremely good for the world on net. \n\nI think the primary cost of public access to highly AI R&D capable models is not from bad actors making risky models in 2026, but from accelerating the overall pace of development industry-wide, particularly for non-safety-conscious actors currently off of the frontier who could be significantly counterfactually accelerated towards RSI by having greater speedup now, which burns the lead of safety-conscious frontier actors to unilaterally pace during takeoff.\n\nIn low-dignity worlds where governance fails to obtain international coordination on massive slowdowns (which I think are likely), that lead time is one of the most important factors in reducing x-risk imo.\n\nObviously there are risks of developing a capable model in the first place, primarily (1) the developer in question may use it to recklessly proceed to RSI and directly impose massive risk on the world or (2) the model in question, or the algorithmic progress downstream of its internal usage, may leak / diffuse / be stolen and allow other actors to do RSI. But conditional on having developed the model in the first place, I think it is very prosocial to at least mitigate the acceleratory effects on other actors! Without interventions like this, I don't see a way to close the internal-external gap without large negative externalities on industry-wide acceleration.\n\nPersonally, I am fairly sad that Anthropic doesn't impose significantly _stronger_ restrictions on these capabilities (even at the cost of substantial revenue) and think not doing so sooner is one of the top few ways it has imposed significant costs on the overall strategic landscape.", "created_at": "2026-11-10T21:46:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MaskedTorah", "rt_author_name": "Drake Thomas", "rt_avatar": "https://pbs.twimg.com/profile_images/1619141028984020994/hJAyrV6c_normal.jpg", "rt_id": "2120204011144130901", "likes": 25, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120271613765505479", "url": "https://x.com/theobearman/status/2120271613765505479", "text": "Below is my personal opinion, not speaking for openai.\n\nThere are many AI safety interventions that are purely positive. \n\nTraining for honesty, and alignment in general, is one example. Models being more honest & aligned is undeniably a good thing. \n\nMonitoring is another example: it serves both to block harmful actions as well as learn valuable information about misaligned behavior. (And to me, the fact that it comes at a non-trivial compute cost, and so has some slowdown impact, is a feature, not a bug.)\n\nNerfing or restricting models from helping with AI research is more complex. I can see the argument for preventing bad actors, in particular ones from non democratic nations, from creating models with risky capabilities. \n\nHowever, I am also worried about concentration of power, in particular concentration of power by us (= the labs), and this seems to go in the opposite direction. It can also hamper external AI safety researchers. And to the extent a lot of the risk in acceleration is from internal deployment, having growing gaps in capabilities between internal and external models seems not ideal.\n\nI am not saying that there will never be a good reason for having some restrictions in some form, but this is an area we should tread *very* carefully on.\n \nThere is also something I find problematic about even the perception of using safety as an excuse for practices that may also be motivated by competitive reasons. It is fine that for-profit corporations try to optimize their profit, but let's make sure we're honest about it and not hiding behind safety.", "created_at": "2026-11-10T21:45:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "rt_avatar": "https://pbs.twimg.com/profile_images/1252262363132280834/ytIN-vzv_normal.jpg", "rt_id": "2120185514682728916", "likes": 320, "retweets": 31, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120551814290452544", "url": "https://x.com/theobearman/status/2120551814290452544", "text": "1/ 🧵 New @CSETGeorgetown report! I analyzed 2,000+ open-source PLA requests for proposal (Oct 2022–Dec 2025) to see what kinds of 🤖 robots 🤖 the Chinese military is buying.\n\nShort version: there’s way more than humanoids. https://t.co/bYT9Qxy2aN", "created_at": "2026-11-11T16:18:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "SamBresnick", "rt_author_name": "Sam Bresnick", "rt_avatar": "https://pbs.twimg.com/profile_images/1960438625482477568/koI8s55I_normal.jpg", "rt_id": "2120549346957574597", "likes": 35, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW20ZKRWMAEDGdr.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW20ZKRWMAEDGdr.png"}], "links": {"https://t.co/bYT9Qxy2aN": ""}, "quoted": null, "f
