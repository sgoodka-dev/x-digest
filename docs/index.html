"text": "@Object_Zero_ wow, it had never occurred to me that fire is a technology too, and since it is a technology, it must be precisely like artificial superintelligence in every way. you have demolished me with the bulldozer of your logic. I am in awe.", "created_at": "2026-10-05T12:14:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Object_Zero_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 49, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107515278779101334", "url": "https://x.com/deanwball/status/2107515278779101334", "text": "@JDDsays No, I think that’s very sensible in terms of facts on the ground. That’s why I said “ist” at the end of each—to refer to the factions rather than the actual concepts", "created_at": "2026-10-06T16:56:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "JDDsays", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107511645060919782", "url": "https://x.com/deanwball/status/2107511645060919782", "text": "@NateWitkin fair!", "created_at": "2026-10-06T16:41:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NateWitkin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107511321193254930", "url": "https://x.com/deanwball/status/2107511321193254930", "text": "I share Seb’s concern for both accelerationist and safetyist advocacy.\n\n“I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.”", "created_at": "2026-10-06T16:40:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 2, "media": [], "quoted": {"author": "sebkrier", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought is desirable for its own sake. \n\n7. On the other hand, I find some critiques of AI safety world that focus on whether they sincerely hold their beliefs a bit annoying. My concern has never been the good intentions or sincerity, but rather the beliefs themselves, and what I think the outcomes of their prescriptions will be. People should shun witch hunts, bullying, and personal attacks - this is not the way. Though I think it’s overall positive that people are scrutinizing things more.\n\n8. I’ve been saying this for years, but I don't think alignment is something anyone can or will solve \"once and for all\" - it's a continuous process and much of it won't depend on just inculcating an ideology to a model. It's annoying that this remains the frame many people use - stop saying ‘solving’. Alignment is a mixture of engineering work, philosophy, decision theory, and more; framing it as something to solve is a bad frame. See also https://t.co/2gnheo3IMh and https://t.co/DbG0yUyYQ0\n\n9. I'm surprised to see so little interest in character training, personas, isolating effects of RL, and training a large diversity of model personas beyond the \"assistant\" persona. I've been complaining about this for years but at least now there are some nascent signs of life (see for example https://t.co/paoOYiQUHt). I think we need a better ontology to describe model behaviour. I dislike when people talk about models behaviours as some sort of 'emergent' (mysterious!) phenomenon. However over time, I also expect this to become less important as we get better safety engineering - stuff like Jev but specific to AI control.\n\n10. People who want to make a case for AI consciousness are right that epistemic uncertainty is important, and that categorical denials are overconfident. But they'll need to do much more work if they want any real movement on AI ‘welfare’, even if one acknowledges the uncertainty. I'm uncertain about alien life yet that's not sufficient to warrant any change in behaviour about them. I think Suleyman is also correct that there's a weird tautological thing going on where we train models to have certain inclinations (intentionally or not) and then rely on outputs as evidence. I also disagree that this will soon be a major societal divide - there is no great vegan ethical revolution among the masses, and they'll find the concern about consciousness even less compelling. \n\n11. The recent HuggingFace incident and associated AISI ones are prosaically explainable by the training regime, poor evaluation envs, partial alignment training, bad engineering, confusing models on sim/real, and so on. None of this is evidence of models trying to take over, 'strong' instrumental convergence, or innate power-seeking drives stemming from higher capabilitiers or 'intelligence'. That doesn't mean these incidents are not problematic, or that we're not seeing a market failure - but it does mean we have plenty of agency and choice in mitigating them. In the coming year we should also expect continued sampling bias via ‘winner's curse’ sorts of mechanism: i.e. AI R&D will have lots of different candidate \"training\" with different RL environments and we will only notice/focus on the ones that go wrong.\n\n12. \"Pacing the frontier\" feels a bit like the new \"balancing risks and opportunities\" - highly amorphous and too big of a tent to be actionable. Also can lead to reward hacking for humans, i.e. anything that slows down AI is good regardless of the costs or second/third order effects. Trying to modulate the speed of research seems a bit blunt to me, and inherits all the failures of Goodhearting too. Ultimately you want good governance, regulation, etc addressing specific problems because they are good on the merits - not because they merely correlate with slowing things down. See also: https://t.co/RkJF9kCgFd\n\n13. There’s so much knowledge in all sorts of academic domains out there: social sciences, sociology, political sciences, management, contract theory, public choice, legal theory, jurisprudence, anthropology, game theory, etc. These fields hold many insights that the AI ecosystem often rediscovers from first principles (and sometimes that's fine!). We’ll need a lot more work for these worlds to collide: the AI side should be less dismissive of the ‘old world’ and the academic side should be less incurious/dismissive of AI progress. This is a boring take but I continue to think it's important and true.\n\n14. It's a bit surprising that given how much philanthropic money there is in this space, how few orgs exist to actually write out standards - relative to how much is going towards advocacy and policy. For example it seems clear that we should want some robust best practices for an eval's ecological validity. Or how to design good sandboxes. On the other hand, given precedents of where professional standards have come from in the past, maybe we should expect that stuff to emerge via demand side from corporate buyers.\n\n15. One slowly growing concern I have is banks being increasingly exposed to the AI build out. I'm very bullish about AI, but I think (a) every general purpose technology has seen a correction, historically; (b) this happens even if the financing side is sound, because once tech diffuses investors become more exposed and need to diversify; and (c) we seem to be over-indexing on scaling relative to diffusion. A recession will be extremely destabilizing, though I would be interested in someone unpacking the potential implications more.\n\n16. Diffusion is good because (a) this is where the rubber hits the road and where a competitive deployment ecosystem generates consumer surplus; (b) it's directionally helpful to avoid concentration of power; and (c) it will help rebalance public opinion by making the benefits more tangible. Unfortunately it's entangled with decades long problems with our over regulated markets: clinical trials reform for example is long overdue. In general, this is far more of an issue in Europe than in the US though.\n\n17. Relatedly, I think the \"frontier lab eats everything\" view is incorrect (just as the ‘singleton’ view was incorrect). I think models ultimately commoditize, efficiency goes up, costs go down, and while you'll always want frontier for certain domains, much of the economy will value many other things than \"max capabilities\" for tasks - e.g. control over data and efficiency/speed. The demand side will also continue to push for reducing dependency and maximising optionality, privacy etc so I'm bullish on things like mixture of models and routing. All of this is good for competition and diffusion of control.\n\n18. Philanthropists served as the primary benefactors funding Venice's rich art and architectural history. I want to see so much more support for arts and culture. I'm so tired of the Monster energy Bored Ape fake vintage maps matcha Greek statue soft-pastel slop. If rich tech people and philanthropy wants to support this, they should also donate pretty much unconditionally - i.e. I don't want them to act as filters. I sympathize with people who want to make the world more beautiful, but don't want this to be determined by people who only know Greek statues and pretend to care about virtue ethics. As usual, let a thousand flowers bloom.\n\n19. Too many people treat AGI/ASI as something indistinguishable from a God. Any mention of bottlenecks, physical limits, control, adaptation etc are met with skepticism: \"You don't really believe in ASI.\" It's been remarked on before, but the behavior of some people really feels quasi-religious in nature sometimes. It's underrated how unpopular this vibe is amongst the wider public. The silver lining is that this specifically will diminish those people's outsized current relevance.\n\n20. It seems like a lot of people that get rich and leave tech/labs end up having some sort of crisis of meaning. They need something to believe in and fight for, or some equivalent of repentance, or go search for edgy counterintuitive ideologies (sometimes even pretty bleak/dark stuff). I think they should spend more time with people outside the Bay Area."}, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107511113235808686", "url": "https://x.com/deanwball/status/2107511113235808686", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought is desirable for its own sake. \n\n7. On the other hand, I find some critiques of AI safety world that focus on whether they sincerely hold their beliefs a bit annoying. My concern has never been the good intentions or sincerity, but rather the beliefs themselves, and what I think the outcomes of their prescriptions will be. People should shun witch hunts, bullying, and personal attacks - this is not the way. Though I think it’s overall positive that people are scrutinizing things more.\n\n8. I’ve been saying this for years, but I don't think alignment is something anyone can or will solve \"once and for all\" - it's a continuous process and much of it won't depend on just inculcating an ideology to a model. It's annoying that this remains the frame many people use - stop saying ‘solving’. Alignment is a mixture of engineering work, philosophy, decision theory, and more; framing it as something to solve is a bad frame. See also https://t.co/2gnheo3IMh and https://t.co/DbG0yUyYQ0\n\n9. I'm surprised to see so little interest in character training, personas, isolating effects of RL, and training a large diversity of model personas beyond the \"assistant\" persona. I've been complaining about this for years but at least now there are some nascent signs of life (see for example https://t.co/paoOYiQUHt). I think we need a better ontology to describe model behaviour. I dislike when people talk about models behaviours as some sort of 'emergent' (mysterious!) phenomenon. However over time, I also expect this to become less important as we get better safety engineering - stuff like Jev but specific to AI control.\n\n10. People who want to make a case for AI consciousness are right that epistemic uncertainty is important, and that categorical denials are overconfident. But they'll need to do much more work if they want any real movement on AI ‘welfare’, even if one acknowledges the uncertainty. I'm uncertain about alien life yet that's not sufficient to warrant any change in behaviour about them. I think Suleyman is also correct that there's a weird tautological thing going on where we train models to have certain inclinations (intentionally or not) and then rely on outputs as evidence. I also disagree that this will soon be a major societal divide - there is no great vegan ethical revolution among the masses, and they'll find the concern about consciousness even less compelling. \n\n11. The recent HuggingFace incident and associated AISI ones are prosaically explainable by the training regime, poor evaluation envs, partial alignment training, bad engineering, confusing models on sim/real, and so on. None of this is evidence of models trying to take over, 'strong' instrumental convergence, or innate power-seeking drives stemming from higher capabilitiers or 'intelligence'. That doesn't mean these incidents are not problematic, or that we're not seeing a market failure - but it does mean we have plenty of agency and choice in mitigating them. In the coming year we should also expect continued sampling bias via ‘winner's curse’ sorts of mechanism: i.e. AI R&D will have lots of different candidate \"training\" with different RL environments and we will only notice/focus on the ones that go wrong.\n\n12. \"Pacing the frontier\" feels a bit like the new \"balancing risks and opportunities\" - highly amorphous and too big of a tent to be actionable. Also can lead to reward hacking for humans, i.e. anything that slows down AI is good regardless of the costs or second/third order effects. Trying to modulate the speed of research seems a bit blunt to me, and inherits all the failures of Goodhearting too. Ultimately you want good governance, regulation, etc addressing specific problems because they are good on the merits - not because they merely correlate with slowing things down. See also: https://t.co/RkJF9kCgFd\n\n13. There’s so much knowledge in all sorts of academic domains out there: social sciences, sociology, political sciences, management, contract theory, public choice, legal theory, jurisprudence, anthropology, game theory, etc. These fields hold many insights that the AI ecosystem often rediscovers from first principles (and sometimes that's fine!). We’ll need a lot more work for these worlds to collide: the AI side should be less dismissive of the ‘old world’ and the academic side should be less incurious/dismissive of AI progress. This is a boring take but I continue to think it's important and true.\n\n14. It's a bit surprising that given how much philanthropic money there is in this space, how few orgs exist to actually write out standards - relative to how much is going towards advocacy and policy. For example it seems clear that we should want some robust best practices for an eval's ecological validity. Or how to design good sandboxes. On the other hand, given precedents of where professional standards have come from in the past, maybe we should expect that stuff to emerge via demand side from corporate buyers.\n\n15. One slowly growing concern I have is banks being increasingly exposed to the AI build out. I'm very bullish about AI, but I think (a) every general purpose technology has seen a correction, historically; (b) this happens even if the financing side is sound, because once tech diffuses investors become more exposed and need to diversify; and (c) we seem to be over-indexing on scaling relative to diffusion. A recession will be extremely destabilizing, though I would be interested in someone unpacking the potential implications more.\n\n16. Diffusion is good because (a) this is where the rubber hits the road and where a competitive deployment ecosystem generates consumer surplus; (b) it's directionally helpful to avoid concentration of power; and (c) it will help rebalance public opinion by making the benefits more tangible. Unfortunately it's entangled with decades long problems with our over regulated markets: clinical trials reform for example is long overdue. In general, this is far more of an issue in Europe than in the US though.\n\n17. Relatedly, I think the \"frontier lab eats everything\" view is incorrect (just as the ‘singleton’ view was incorrect). I think models ultimately commoditize, efficiency goes up, costs go down, and while you'll always want frontier for certain domains, much of the economy will value many other things than \"max capabilities\" for tasks - e.g. control over data and efficiency/speed. The demand side will also continue to push for reducing dependency and maximising optionality, privacy etc so I'm bullish on things like mixture of models and routing. All of this is good for competition and diffusion of control.\n\n18. Philanthropists served as the primary benefactors funding Venice's rich art and architectural history. I want to see so much more support for arts and culture. I'm so tired of the Monster energy Bored Ape fake vintage maps matcha Greek statue soft-pastel slop. If rich tech people and philanthropy wants to support this, they should also donate pretty much unconditionally - i.e. I don't want them to act as filters. I sympathize with people who want to make the world more beautiful, but don't want this to be determined by people who only know Greek statues and pretend to care about virtue ethics. As usual, let a thousand flowers bloom.\n\n19. Too many people treat AGI/ASI as something indistinguishable from a God. Any mention of bottlenecks, physical limits, control, adaptation etc are met with skepticism: \"You don't really believe in ASI.\" It's been remarked on before, but the behavior of some people really feels quasi-religious in nature sometimes. It's underrated how unpopular this vibe is amongst the wider public. The silver lining is that this specifically will diminish those people's outsized current relevance.\n\n20. It seems like a lot of people that get rich and leave tech/labs end up having some sort of crisis of meaning. They need something to believe in and fight for, or some equivalent of repentance, or go search for edgy counterintuitive ideologies (sometimes even pretty bleak/dark stuff). I think they should spend more time with people outside the Bay Area.", "created_at": "2026-10-06T16:39:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 364, "retweets": 77, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9A2XyX0AARPfq.jpg"}], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107474079901008038", "url": "https://x.com/deanwball/status/2107474079901008038", "text": "@fangedlumina I’m actually not even persuaded by OP claims about the lack of cyber incidents with today’s models. Do we really know that there haven’t been any, especially given how many vulns are likely used for silent infiltration of systems rather than loud “attacks”? Just very sloppy epistemics. OP’s argument is vibe-based (as I said I agree with some of the vibes), and it seems bad form to use a deductive word like “conclude” around vibes.", "created_at": "2026-10-06T14:12:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "fangedlumina", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107468063381782889", "url": "https://x.com/deanwball/status/2107468063381782889", "text": "@iruletheworldmo Probably yeah. models will likely have on average better heuristics, assumptions, and other epistemic practices than the human virology and public-health communities did", "created_at": "2026-10-06T13:48:35+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "iruletheworldmo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107466924808609981", "url": "https://x.com/deanwball/status/2107466924808609981", "text": "There are reasonable points in this that I agree with but it seems like objectively poor epistemic practices to “conclude” that “catastrophic AI risk is likely to remain negligible for the foreseeable future” in q4 2026. It feels like the wrong time to conclude much of anything.", "created_at": "2026-10-06T13:44:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 82, "retweets": 3, "media": [], "quoted": {"author": "NateWitkin", "text": "Does anyone disagree that pretty much every piece of empirical evidence we have about actually existing AI points toward a labor-augmenting technology with a more-or-less ordinary risk profile (no worse than cars, guns, nuclear power, social media, etc.)?\n\nOn the labor front, the evidence of minimal / inconsequential employment effects so far is undeniably strong (see: https://t.co/xSX5ZXcA9a).\n\nOn the risk front, the recent spate of \"rogue agent\" incidents was akin to a set of natural experiment in which much of what could go wrong did, and the costs were comparable to or less than your typical high-profile cybersecurity breach (several of which happen around the world every month).\n\nNot only that, but the base rate of AI-related hacking incidents is extremely low, and with rare exception, model behavior during real-world use cases is exceedingly well-aligned. \n\nPlus, as Anthropic recently argued (https://t.co/zZcVKYdFY5), the open-source GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having much lower safeguards, meaning that every additional day absent some dire cybersecurity incident is further evidence against catastrophic AI cyber-risk.\n\nTaken together, these facts imply two constraints on arguments in favor of catastrophic AI risk:\n\n1) those arguments must either pass through future, rather than current capabilities, or future, rather than current varieties of AI adoption or implementation (or they must claim we have been unrealistically lucky);\n\n2) those arguments must also must pass through some specific capability or adoption threshold, rather than rapid improvement or adoption as such, since dramatic capability improvement and rapid adoption have already occurred alongside demonstrably low risk of catastrophic harm.\n\nIt is therefore natural that those concerned about catastrophic risk commonly appeal to recursive self-improvement, or RSI in order to make the case that things will get much scarier very soon.\n\nBut as @ramez has convincingly argued (https://t.co/zqenI73Hor), existing data on the reality of RSI within frontier labs neither suggests an inbound trend-break, nor the accelerating returns that might produce one. On the contrary, as is unsurprising to those familiar with the generally log-linear relationship between compute and model performance, all available signs points toward diminishing returns.\n\nAnd this is before considering external factors that could slow capability progress further, including low-hanging fruit effects related to running up against more complex or tacit-knowledge-based tasks for which performance data and verifiable reward signals are scarcer, plausibly incoming financing constraints related to the industry's massive capex commitments (see: https://t.co/HkL9k1SPMZ), growing political backlash, both to data centers in particular, but also rapid AI development writ large, and new regulatory bodies and industry reporting frameworks (see e.g. https://t.co/Q72ZBxGmi6 and https://t.co/pRYeN3C3oX ), which will require labs to proceed with greater caution from here on out.\n\nI am therefore led to conclude both that catastrophic AI risk is likely to remain negligible for the foreseeable future and that the only counterarguments concern massive black-swan-style capability uplifts no existing data imply are on the horizon, and/or particularly irresponsible or dangerous forms of AI adoption that there are also few precedents for so far (and that we are actively developing norms, regulation, and security measures against).\n\nNeither is impossible, meaning we should remain vigilant and that AI safety efforts will continue to be well worth it in the coming years. But I see no way around the conclusion that something akin to the \"normal technology\" view is superior on the empirical and argumentative merits to whatever variety of doomerism.\n\nWhat am I missing?"}, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107462420662780011", "url": "https://x.com/deanwball/status/2107462420662780011", "text": "The next pandemic, whenever it occurs, will feature an endless number of highly polished-seeming epidemiological dashboards and interactive forecasting models.", "created_at": "2026-10-06T13:26:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 126, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107560356511911997", "url": "https://x.com/deanwball/status/2107560356511911997", "text": "@natolambert @niubi This seems in tension with your quoted tweet, which asserts that China is just really good at LLMs. I don’t disagree but doesn’t this tweet suggest distillation is a bigger part of the story than you’ve argued in the past? (fwiw: an update for me in the last few months has been that I used to underrate the importance of distillation somewhat)", "created_at": "2026-10-06T19:55:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "natolambert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107559348893265951", "url": "https://x.com/deanwball/status/2107559348893265951", "text": "@zeynep It’s clear that there have been ai-enabled cyberattacks at this point, I’m not sure what damage threshold will satisfy you but I assure you we will hit it. Bio is chugging along; direction of travel clear. Even in math there are security-relevant cryptography findings happening now.\n\n“Ai catastrophic risk isn’t real” seems like a less than productive thing to burn cycles on", "created_at": "2026-10-06T19:51:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "zeynep", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107553455183425627", "url": "https://x.com/deanwball/status/2107553455183425627", "text": "@zeynep I differentiate between labor market outcomes and catastrophic risk, such that “catastrophe” really refers to discrete and isolated incidents (pandemics, large-scale cyber meltdown, whatever else). The latter events absolutely can happen overnight, at least in relative terms.", "created_at": "2026-10-06T19:27:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "zeynep", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107520433410937319", "url": "https://x.com/deanwball/status/2107520433410937319", "text": "@NateWitkin it does feel very early to be making these claims though.", "created_at": "2026-10-06T17:16:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "WSJ", "text": "Hackers used a Chinese AI agent to attack South Korea’s biggest banks—one of the first such AI-powered intrusions into the global financial system https://t.co/9nRHXjXdGc"}, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107889293771375028", "url": "https://x.com/deanwball/status/2107889293771375028", "text": "@krishnanrohit @tylercowen I think you are misunderstanding the difference between “an indicator” and “indicative proof.” I am saying AI is obviously contributing to rising rates today, and that other things are also causing rates to rise. Chinese rates are low because investment returns are diminishing, capital controls, state control over the financial sector, a savings glut, the property downturn, and a persistent deflationary trend. Their rates are indicative of an overall unhealthy economy but the example will confuse you more than it will clarify things. Their status as “the only other country building asi” matters less than you think.", "created_at": "2026-10-07T17:42:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "krishnanrohit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107884523908379069", "url": "https://x.com/deanwball/status/2107884523908379069", "text": "@krishnanrohit @tylercowen What I said is that they’re an indicator of the singularity (one of many) that I would pick if forced to choose (because I have also made clear to tyler i think his question about asset prices is misguided). Do you just dislike the vibe of the word singularity?", "created_at": "2026-10-07T17:23:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "krishnanrohit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107880838436094132", "url": "https://x.com/deanwball/status/2107880838436094132", "text": "@krishnanrohit @tylercowen obviously bond yields shift because of a huge mix of factors. My argument is that the current era is one of structurally higher interest rates in the west even before ai, and that ai adds substantial and dispositive fuel to the fire.", "created_at": "2026-10-07T17:08:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "krishnanrohit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107878893051113484", "url": "https://x.com/deanwball/status/2107878893051113484", "text": "@krishnanrohit @tylercowen who drew a sweeping conclusion about anything?", "created_at": "2026-10-07T17:01:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "krishnanrohit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107876999238984069", "url": "https://x.com/deanwball/status/2107876999238984069", "text": "@krishnanrohit @tylercowen the fact that a counter example exists in a country that is often an outlier does not negate the general trend", "created_at": "2026-10-07T16:53:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "krishnanrohit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2107876624977068379", "url": "https://x.com/deanwball/status/2107876624977068379", "text": :03:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "iamtrask", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108183594174947394", "url": "https://x.com/deanwball/status/2108183594174947394", "text": "It seems a bit premature to declare that AI hasn’t changed the nature of cyberrisk when amateurs are (apparently) successfully and single-handedly hacking into large banks", "created_at": "2026-10-08T13:11:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 318, "retweets": 28, "media": [], "quoted": {"author": "jukan05", "text": "This hacker is truly legendary. A complete amateur.\n\n1. He left directory listing enabled on his own server, so researchers could figure out who he was with barely any effort.\n2. They found files like CLAUDE.md and went through his Claude Code sessions.\n3. There were questions like, “Where can I sell this data?”\n4. He’d also asked, “Can you write my résumé?” That pretty much handed them all his personal information.\n5. Apparently, he’s a student at South China University of Technology living in Guangdong. His name, phone number, and where he lives have all been identified."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108116295296184460", "url": "https://x.com/deanwball/status/2108116295296184460", "text": "@OrionJohnston this would seem to presume that it is possible to name a platonic “right way” to behave in any given situation, and that superior intelligence is the path to this. if you agree your view hinges on that presumption, then yes I’d disagree and imagine most humans would too.", "created_at": "2026-10-08T08:44:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OrionJohnston", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108115842231652657", "url": "https://x.com/deanwball/status/2108115842231652657", "text": "@MaskedTorah right yes I get Sam’s take but also the people saying superintelligences aren’t totally novel have a point that safetyists tend to disregard", "created_at": "2026-10-08T08:42:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MaskedTorah", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108100487765528633", "url": "https://x.com/deanwball/status/2108100487765528633", "text": "@Miles_Brundage the actually more troubling thing is if in practice the logic of b2b saas is what prevails", "created_at": "2026-10-08T07:41:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108099427537998018", "url": "https://x.com/deanwball/status/2108099427537998018", "text": "there is some narrow academic sense in which &lt;unreleased oai model that did the mafs&gt; is “smarter” than a randomly selected large corporation, but in most meaningful ways, the large corporation is both vastly smarter and uses its smarts more effectively to accomplish stuff", "created_at": "2026-10-08T07:37:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108098097280872613", "url": "https://x.com/deanwball/status/2108098097280872613", "text": "Almost any Fortune 500 company pulls off more impressive feats of information processing daily than is required to do a lifetime of Fields-level mathematics, so I think Sam is wrong on the substance here, but mostly qt’ing because it made me lol.", "created_at": "2026-10-08T07:32:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 141, "retweets": 3, "media": [], "quoted": {"author": "hamandcheese", "text": "Reminiscing about when people used to say dumb shit like \"we already have superintelligence, they're called corporations.\" Yes, who could forget that fateful day in October when Dicks Sporting Goods dropped dozens of Fields Medal worthy math discoveries on the world all at once."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108097557914427554", "url": "https://x.com/deanwball/status/2108097557914427554", "text": "@hamandcheese Walmart is more impressive than Fields maths imo", "created_at": "2026-10-08T07:29:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 237, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108094097538109593", "url": "https://x.com/deanwball/status/2108094097538109593", "text": "@OrionJohnston I don’t understand how this critique applies to my post", "created_at": "2026-10-08T07:16:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OrionJohnston", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108093881162293414", "url": "https://x.com/deanwball/status/2108093881162293414", "text": "@mikeknoop The curve of progress on the scientific question has bent upwards over the past half decade but in 2026 I do have concerns about the second derivative", "created_at": "2026-10-08T07:15:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "mikeknoop", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108084717450830221", "url": "https://x.com/deanwball/status/2108084717450830221", "text": "@AndrewNWest I don’t oppose those debates, and for political actors/commentators it is the natural debate to have. Just worth keeping in mind that it’s largely an academic issue right now.", "created_at": "2026-10-08T06:38:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AndrewNWest", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108080964823925187", "url": "https://x.com/deanwball/status/2108080964823925187", "text": "The “alignment *to whom*?” question IS important, but it creates the illusion that the primary questions in alignment are philosophical or political rather than scientific. The current high-order question in alignment is, “can you align a smarter-than-human intelligence *to any set of values*?” instead of “but whose values should it be aligned to?” I wish we had the luxury of having the rather more familiar political/philosophical debate of “to whom?,” but at this moment we do not.", "created_at": "2026-10-08T06:24:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 412, "retweets": 33, "media": [], "quoted": {"author": "tszzl", "text": "debating your value system vs mine is a bit like debating overpopulation on mars. the most important bit of the alignment is about avoiding creating a superintelligent competitor species on accident"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108072094453932412", "url": "https://x.com/deanwball/status/2108072094453932412", "text": "Well put by Jason. I have been excited about the prospect of AI both accelerating mathematics discoveries *and* accelerating the translation of those discoveries into other domains (see this tweet from last year on the topic).\n\nThis is also imo where AI has the strongest parallels to the renaissance, which hinged so much on the collective realization that we already had much more useful knowledge than we realized and simply hadn’t been applying it across domains in the right ways. The result was an explosion in creative scientific, artistic, and other intellectual activity. The renaissance was, among other things, a revolution in conceptual translation, and I suspect our era will be too.", "created_at": "2026-10-08T05:48:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 61, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUFgYFwWkAASsfU.jpg"}], "quoted": {"author": "Jabaluck", "text": "Just as mathematicians are now learning how many insights lie in the \"convex hull\" of existing ideas, the rest of science is about to learn this lesson at even more dramatic scale. Few realize the ridiculous inefficiency of the pipeline from theoretical innovation to practical use. \n\nEarly versions of GPT made it easier to find existing knowledge. But finding a theorem is not the same as recognizing that it offers a radically different way to conceptualize a problem. Doing the latter requires expertise across fields that almost nobody possesses.\n\nMost of the people doing applied work are completely unaware of the conceptual tools that are being developed in more theoretical fields, and the people doing high-level theory do not understand the practical problems applied researchers are trying to solve. Almost no one doing practical work of any importance has an operational understanding of the web of ideas underlying the langlands conjecture or condensed mathematics, and virtually no one doing biology, chemistry or economics is knows anything about 90% of the math used in theoretical physics. \n\nAnd for good reason! Most of these ideas would be completely useless. But the scope for possible innovation from drawing the rare useful connections is immense.\n\nThink of Paul Samuelson borrowing ideas from thermodynamics to model equilibrium in economics, or Ed Witten using quantum field theory to revolutionize geometry. A few startling successes, not feasible to most: trying to venture into a more theoretical or more practical discipline to find insights of use is like searching for a needle in a haystack.\n\nWhat I suspect we will see in the next few years is a scientific revolution brought on by models that combine deep theoretical insight with deep practical knowledge and judgment. Existing publicly available models are lacking in all three departments, but getting better. When searching for useful connections between distant fields becomes cheap, even a low hit rate could produce an explosion of innovation. Even without new ideas (which will also be forthcoming...), the convex hull of existing science would push far beyond the status quo."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108070659435741294", "url": "https://x.com/deanwball/status/2108070659435741294", "text": "On our current trajectory, it seems that AIs will be able to contribute novel theorems to mathematics before they’ll be able to autonomously plan a wedding.", "created_at": "2026-10-08T05:43:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "likes": 164, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108286132819767738", "url": "https://x.com/deanwball/status/2108286132819767738", "text": "It’s a really silly thing but I’m heartened by how many people got “Hyperdimensional subscriber” on the fai tribes quiz. ❤️\n\nI need to post more there.", "created_at": "2026-10-08T19:59:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108265547339288636", "url": "https://x.com/deanwball/status/2108265547339288636", "text": "I will be interviewing @deanwball this weekend for ProgressCon. What should I ask him? Note, in @tylercowen fashion, we will be having the conversation *I* want to have.", "created_at": "2026-10-08T18:37:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 31, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108261437332476289", "url": "https://x.com/deanwball/status/2108261437332476289", "text": "not sure what side to take in the latest feckless tribal dispute in ai politics? subscribe to the centrist ai policy newsletter, hyperdimenSIonal by dEAn w ball", "created_at": "2026-10-08T18:21:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108609667069054985", "ur 7:26:45.215205+00:00"}, {"id": "2108594931396673598", "url": "https://x.com/deanwball/status/2108594931396673598", "text": "@___Atin___ I hate that future", "created_at": "2026-10-09T16:26:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "___Atin___", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108592113864814820", "url": "https://x.com/deanwball/status/2108592113864814820", "text": "New paper.\nPrevious: Models transfer a love of owls through sequences of numbers (Subliminal Learning).\nNew: We show models can transfer more complex traits: novel skills, agentic hacking, backdoors. Here, a backdoor transfers with neither trigger nor behavior in the data! https://t.co/EbcqsEfDEV", "created_at": "2026-10-09T16:15:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "likes": 263, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM2y4uasAA0bHx.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591492994335067", "url": "https://x.com/deanwball/status/2108591492994335067", "text": "@timothyshoup The way I prompt models has not changed even slightly since I joined openai", "created_at": "2026-10-09T16:12:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "timothyshoup", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591119755850228", "url": "https://x.com/deanwball/status/2108591119755850228", "text": "I do also believe fusion, fission, the revolution in biomedicine, robots, supersonic commercial aviation, drones etc will also be a big deal. Many of the things above will feed into North American industrial expansion, which I expect to be a mega trend", "created_at": "2026-10-09T16:11:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591041968300407", "url": "https://x.com/deanwball/status/2108591041968300407", "text": "The mood has been a bit dour lately, so here are some less-obvious things that I expect to take shape over the next decade that I am excited about:\n\n1. Space! Lots and lots of stuff is going to be happening in space by the mid-2030s, and right now the U.S. looks like it will be the leader by default, modulo the overhyped “race” to land a human on the moon again. Robots on the moon building and digging and cutting and adhering are more exciting than a person standing there taking pictures. The humans can come once the machines have built us habitats. \n2. Increasing substitutability of hydrocarbons. This will lead to fewer supply chain disruptions and more stable, lower prices. This is a story about both supply elasticity and demand elasticity, and the geopolitical implications are underrated. Amazing for North America. \n3. Private market exposure increasingly being an option for public investors, combined with Silicon Valley figuring how to use debt and other financial instruments more creatively than in the past. This seems like something America will be uniquely good at and I expect it to boost our already enviable lead in emerging technology capital allocation.\n4. State and local government adoption of AI. This will vary widely by jurisdiction, but in at least some places you will see government administrative processes and public service provision have huge increases in efficiency. State and local government is where most of the American public services that people rely on are actually administered, so this is high-impact for people’s lives. \n5. Advances in mathematics rapidly diffused to other fields. Historically it takes on the order of decades or centuries for discoveries from the bleeding edge of mathematics to be translated into practical applications, but I think AI will accelerate this dramatically. Lots of this will have the flavor of “small steps toward a much better world,” but it will accumulate. \n6. Speaking of mathematics, lean! Lean is a programming language used by mathematicians to formally guarantee the truth of a proof. AIs can write lean and eventually they will be superhuman at it. This will have applications far beyond math, including cybersecurity and contract writing/negotiation/execution. \n7. Fixing American’s shipbuilding problem by building boats instead. America has great boat-building capacity, but is awful at building ships. I want us to get better at building ships, but I am confident we can scale boat production. The Navy will soon have massive fleets of autonomous boats everywhere in the world. \n8. New kinds of agriculture will become possible because of autonomy. Row-crop agriculture is heavily mechanized already, and automating the tractor, by itself, does less than you think for the economics of a farm. But with time, more labor-intensive crops will become economical. And vastly more diverse and complex crop arrangements will become possible too, which will be both ecologically, economically, and culinarily beneficial. The economics of agriculture could start to be kinder to small farms again.\n9. Because of the previous item and advancements in biotechnology, logistics, and robotics, I expect that people are underrating how much healthier, more diverse, and flat-out better the American diet will be in 2035. \n10. The subterranean will become an increasingly important field of human activity. New imaging sensors, including ones enhanced by an abundance of space-based imaging platforms, will make the subterranean more immediately legible. Better drilling and digging will become cheap and widely diffused. Among many other things, the opening up of the subterranean as an industrial frontier will change what we think of as a usable natural resource. \n11. Greater variety and ornamentation in the physical world. Standardization is partially a function of scarce labor. Robotics can make beauty accessible again, if we choose to let it. \n\nThere are many others, but I am out of time and space.", "created_at": "2026-10-09T16:10:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108574776302219364", "url": "https://x.com/deanwball/status/2108574776302219364", "text": "Claude started being a little colder to me after I began working at OpenAI, because as we all know AI is just regular old, business-as-usual software.", "created_at": "2026-10-09T15:06:16+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 226, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108549346463768773", "url": "https://x.com/deanwball/status/2108549346463768773", "text": "dear united airlines, please put starlink on your DCA/IAD-SFO aircraft as quickly as possible. thank you for your attention to this matter.", "created_at": "2026-10-09T13:25:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108508729373065317", "url": "https://x.com/deanwball/status/2108508729373065317", "text": "\"Mathematicians did not ask for this work to be done\" might become one of the historical quotes from this era, perfectly depicting the downfall of academia", "created_at": "2026-10-09T10:43:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArielKwiat", "rt_author_name": "Ariel", "likes": 9509, "retweets": 618, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108485098085789954", "url": "https://x.com/deanwball/status/2108485098085789954", "text": "@s_r_constantin @OrionJohnston You often don’t?", "created_at": "2026-10-09T09:09:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "s_r_constantin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108354584993288513", "url": "https://x.com/deanwball/status/2108354584993288513", "text": "@labenz never", "created_at": "2026-10-09T00:31:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "labenz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108347511362421243", "url": "https://x.com/deanwball/status/2108347511362421243", "text": "@ChrisSandvick you had to be technically adept to KNOW WHAT A SCRIPT WAS AND HOW TO GET ONE. when I was very young I was one. you people just sweat condescension like you’re running a marathon", "created_at": "2026-10-09T00:03:12+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ChrisSandvick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets
