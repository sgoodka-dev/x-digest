"url": "https://x.com/robertwiblin/status/2123446934375448964", "created_at": "Thu Nov 19 16:02:55 +0000 2026"}], "enriched": 3}, {"id": "2123446531059585281", "url": "https://x.com/robertwiblin/status/2123446531059585281", "text": "https://t.co/WRknHHiiau", "created_at": "2026-11-19T16:01:19+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2123446527582757030", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/WRknHHiiau": "https://www.nytimes.com/2026/11/19/business/anthropic-ipo-dustin-moskovitz.html"}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2121016799420686506", "url": "https://x.com/deanwball/status/2121016799420686506", "text": "@jon_stokes lol", "created_at": "2026-11-12T23:06:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "jon_stokes", "reply_to_id": "2121016106991108256", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2121016106991108256", "author_handle": "jon_stokes", "author_name": "Jon Stokes", "text": "@deanwball probably, yes", "links": {}, "media": [], "url": "https://x.com/jon_stokes/status/2121016106991108256", "created_at": "Thu Nov 12 23:03:41 +0000 2026"}, "enriched": 3}, {"id": "2121015514067812581", "url": "https://x.com/deanwball/status/2121015514067812581", "text": "@jon_stokes Jon, you’ve negatively polarized yourself into yelling at me for saying that supply and demand determines resource allocation, and even then you basically agree with me (have you thought about what governments do after elections happen? Hint: they spend money). Take a break man.", "created_at": "2026-11-12T23:01:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "jon_stokes", "reply_to_id": "2121013093786640860", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2121013093786640860", "author_handle": "jon_stokes", "author_name": "Jon Stokes", "text": "No this is not how resources are allocated in the world. It's how prices are set. Resources are sometimes allocated via market mechanisms (downstream of pricing), sometimes via government policy (downstream of voting), sometimes via violence, etc. What are doing here ppl?", "links": {}, "media": [], "url": "https://x.com/jon_stokes/status/2121013093786640860", "created_at": "Thu Nov 12 22:51:42 +0000 2026"}, "enriched": 3}, {"id": "2121248146290586104", "url": "https://x.com/deanwball/status/2121248146290586104", "text": "@JeffLadish Quite hard, because by the time ai is good enough to autonomously perform that kind of intelligence collection, the capability will quickly diffuse broadly, many secrets of many people will have been exposed, and society will have recalibrated.", "created_at": "2026-11-13T14:25:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "JeffLadish", "reply_to_id": "2121137941980581996", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121137941980581996", "author_handle": "JeffLadish", "author_name": "Jeffrey Ladish", "text": "How hard would be it be for a future swarm of AI agents to take down someone like Jensen by leaking information about an affair or two?", "links": {}, "media": [], "url": "https://x.com/JeffLadish/status/2121137941980581996", "created_at": "Fri Nov 13 07:07:48 +0000 2026"}, "enriched": 3}, {"id": "2121239143930089968", "url": "https://x.com/deanwball/status/2121239143930089968", "text": "the story of modern deep learning is entwined with jensen huang’s story the entire way through. it’s hard to defend the Megaspeed affair but overall obviously a world historic boon to American industry", "created_at": "2026-11-13T13:49:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2121137530632646877", "likes": 1381, "retweets": 58, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121097666893627583", "url": "https://x.com/deanwball/status/2121097666893627583", "text": "https://t.co/fVRQSPqQoi", "created_at": "2026-11-13T04:27:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 48, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW-nFkpacAA13nK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW-nFkpacAA13nK.jpg"}], "links": {"https://t.co/fVRQSPqQoi": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121088115117027780", "url": "https://x.com/deanwball/status/2121088115117027780", "text": "@tarunchitra @willdepue I don’t understand what you mean by “how obvious other things made it,” but I was commenting purely on will’s result. you read my tweet with an assumption of bad faith, and also an assumption that I’m a lobbyist, and both were wrong.", "created_at": "2026-11-13T03:49:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tarunchitra", "reply_to_id": "2121078842794344564", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121078842794344564", "author_handle": "tarunchitra", "author_name": "Tarun Chitra", "text": "@willdepue I don’t think they were commenting on the result as much as how obvious other things made it", "links": {}, "media": [], "url": "https://x.com/tarunchitra/status/2121078842794344564", "created_at": "Fri Nov 13 03:12:58 +0000 2026"}, "enriched": 3}, {"id": "2121052723516936629", "url": "https://x.com/deanwball/status/2121052723516936629", "text": "@GonHuertas @tszzl @repligate right, the machines are intermediaries in your example in what remain fundamentally human transactions. but what if the demand itself was machine demand?", "created_at": "2026-11-13T01:29:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GonHuertas", "reply_to_id": "2121048632279388229", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121048632279388229", "author_handle": "GonHuertas", "author_name": "Gon Huertas", "text": "@deanwball @tszzl @repligate Dean, could you be more specific about your definition of “machine demand”? The price system in our globalized economy is already set by transactions conducted almost entirely by machines - in service of our human demand. Machines make price discovery easier.", "links": {}, "media": [], "url": "https://x.com/GonHuertas/status/2121048632279388229", "created_at": "Fri Nov 13 01:12:55 +0000 2026"}, "enriched": 3}, {"id": "2121040612418064619", "url": "https://x.com/deanwball/status/2121040612418064619", "text": "@hopes_revenge @repligate anything for hopes", "created_at": "2026-11-13T00:41:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "hopes_revenge", "reply_to_id": "2121039633622749391", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121039633622749391", "author_handle": "hopes_revenge", "author_name": "hope hopes hoping", "text": "@deanwball @repligate thanks for the reply to my not very additive comment . i think you are right and put it well.  my comment is less a useful contribution and more the uncritical product of my persistent desire for everyone in ai to read and engage with à la dialectic of enlightenment  thinking 😭", "links": {}, "media": [], "url": "https://x.com/hopes_revenge/status/2121039633622749391", "created_at": "Fri Nov 13 00:37:10 +0000 2026"}, "enriched": 3}, {"id": "2121038703854518468", "url": "https://x.com/deanwball/status/2121038703854518468", "text": "@hopes_revenge @repligate for sure. I didn’t mean to suggest the price system works perfectly or is totally “pure.” There are many distortions of “natural” prices, though government expenditure isn’t necessarily one of them (militaries are a source of demand and are affected by supply constraints!). Subsidies and other policy based means of modulating prices are  distortive, in some sense, but the distorted prices are still affecting the downstream allocation of resources (sometimes in undesirable or unintended ways).\n\nBut all that aside: all of this is still presuming human individuals and institutions are the drivers of demand. Demand is, collectively, human demand. That’s not a law of physics, though; machines could supplant humans as the primary drivers of demand itself, and eventually of the allocation of resources. So while it’s not a law of physics, we may want to create manmade laws to protect against that eventuality.", "created_at": "2026-11-13T00:33:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "hopes_revenge", "reply_to_id": "2121031080535044163", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121031080535044163", "author_handle": "hopes_revenge", "author_name": "hope hopes hoping", "text": "@deanwball @repligate >resources are allocated in the world according to supply and demand \n\ni mean...isn't this complicated by stuff like military expenditure?  and like all  government spending? and government-influenced spending via subsidies, intervention in market etc.\n\ni accept your premise  i just think we have been moving away from a rational allocation via supply and demand for some time now and  ai boom is just an — admittedly  notable and divergent— extension of this...", "links": {}, "media": [], "url": "https://x.com/hopes_revenge/status/2121031080535044163", "created_at": "Fri Nov 13 00:03:11 +0000 2026"}, "enriched": 3}, {"id": "2121034263919497590", "url": "https://x.com/deanwball/status/2121034263919497590", "text": "@Liv_Boeree no but lol", "created_at": "2026-11-13T00:15:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Liv_Boeree", "reply_to_id": "2121031363016962410", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121031363016962410", "author_handle": "Liv_Boeree", "author_name": "Liv Boeree", "text": "@deanwball Is this a sex joke I can't tell", "links": {}, "media": [], "url": "https://x.com/Liv_Boeree/status/2121031363016962410", "created_at": "Fri Nov 13 00:04:18 +0000 2026"}, "enriched": 3}, {"id": "2121018054888829403", "url": "https://x.com/deanwball/status/2121018054888829403", "text": "@Nairebis @repligate I have pet cats, and I buy them cat food that they do, in some sense, demand. But it’s my demand in economic terms; I decide what a fair price is, I pay. If cats were the prime source of economic demand my house would be turned into a giant scratching post. This is the difference", "created_at": "2026-11-12T23:11:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Nairebis", "reply_to_id": "2121005443372003798", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121005443372003798", "author_handle": "Nairebis", "author_name": "Nairebis - e/max-acc", "text": "@deanwball @repligate This seems silly. We already \"allocate resources to machine demand\" when we put oil in our car. But machines are always in service to humans. There is no scenario where AI is running for its own purposes, because that's pointless. There is always a human supplying the end goal.", "links": {}, "media": [], "url": "https://x.com/Nairebis/status/2121005443372003798", "created_at": "Thu Nov 12 22:21:18 +0000 2026"}, "enriched": 3}, {"id": "2121299146749653354", "url": "https://x.com/deanwball/status/2121299146749653354", "text": "@lu_sichu @JeffLadish My heuristic is that societal recalibration/adaptation usually happens faster than we anticipate looking forward, and also more surprisingly. It is true that it will be easier to catch illegality, especially conduct that took place immediately prior to advanced AI. But adjudicating this will still rely on courts; AI will not have a magic “put people in jail” button. Bureaucratic overcriminalization is a widely documented phenomenon in America, so I do expect a lot of illegal-but-shouldn’t-be-illegal behavior will be exposed because advanced AI will make it newly legible. Ultimately, I expect this will be an impetus for reform of those laws, or simply dealt with through prosecutorial discretion, and so on balance my guess would be that overcriminalization falls due to AI. All this seems fine, good even. AI swarms investigating people’s scandalous behavior will be socially disruptive, but if it becomes a major problem, this is one of the things we are best positioned to adapt to.", "created_at": "2026-11-13T17:48:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lu_sichu", "reply_to_id": "2121296203908276735", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121296203908276735", "author_handle": "lu_sichu", "author_name": "Sichu(unaligned/reward hacked/illegal neuralese)", "text": "@deanwball @JeffLadish i feel like you are overconfident about the calibration and anyway there is a long step in between society getting used to things** also some of the strategies are not things society can used to. some scandals sure but if it turns out powerful people are doing *gasp* illegal things ...", "links": {}, "media": [], "url": "https://x.com/lu_sichu/status/2121296203908276735", "created_at": "Fri Nov 13 17:36:41 +0000 2026"}, "enriched": 3}, {"id": "2121263907767746754", "url": "https://x.com/deanwball/status/2121263907767746754", "text": "@Sauers_ While I find p(doom) a little silly/memey, I personally define doom to mean literal human extinction, and I believe the odds of this outcome are vanishingly low. Other very bad outcomes seem much likelier, and I worry that extinction creates a strawman that makes it easy to dismiss safetyism, thereby causing many to ignore all those much likelier bad outcomes (like disempowerment)", "created_at": "2026-11-13T15:28:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Sauers_", "reply_to_id": "2121120338721546634", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 44, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121120338721546634", "author_handle": "Sauers_", "author_name": "Sauers", "text": "you guys are including loss of human control and disempowerment in P(doom)? 💀 lol", "links": {}, "media": [], "url": "https://x.com/Sauers_/status/2121120338721546634", "created_at": "Fri Nov 13 05:57:51 +0000 2026"}, "enriched": 3}, {"id": "2121261728839397687", "url": "https://x.com/deanwball/status/2121261728839397687", "text": "@DKokotajlo Interesting, because I primarily see walls.\nIn brief, any semantically open long-horizon domain looks like a wall. More precisely, a plateau near the level of human performance, because pretraining imitates it and RL only exceeds it when the answer can be verified.\nI agree pretraining loss is a good proxy, but it measures how well the model learns the map, not the territory. When the map is fuzzy, loss hits a floor, and when it's systematically biased, lower loss just reproduces the errors for that field. Updating against the territory requires grading against the world, which is slow in most open domains where we're data-limited.\nVerifiability seems a crux. Noisy data just requires calibration, which should transfer. Systematic bias is another beast entirely. To correct it you need to know which way and how far the data is skewed, and if it's sparse and costly to check in time and/or money, you don't know. Recognizing distortion may generalize (although see below), but recognition is not correction. I expect the generative process of distortion is specific to each domain, so there’s no shared prior to carry from one to the next. Learning it requires the costly ground truth, which is precisely what we didn't have. I'd update if I saw clear evidence of a model building a working verifier for a field that lacked one, especially an open/unbounded field. \n(From here it gets long)\nI notice that all of your examples are closed ruleset. In Pokemon there are a limited set of options (and there are guides in the training data). Blood on the Clocktower sounds like Mafia, which is adversarial and deceptive (like Diplomacy) but also closer to closed than fully open and resolves in under an hour even with humans; I assume you can’t change the rules midgame unexpectedly, which is a common occurrence in real-world strategy and security, but not in games.\nI’m not aware of strong performance in business operations or logistics, which I’d expect to see well before running an org. That one also has yet to fall, though arguably due to time horizon limits.\nIn biological and infrastructure security, both open domains in which I've worked fairly extensively, the models have made surprisingly little progress, in stark contrast to cyber. This is frankly a relief, because if they were better at it we’d have a lot more problems with information hazards in bio. But I was surprised that general reasoning improvements have hardly translated at all. The models are better off if you give them detailed guidelines for e.g. checking dependencies, but even then they aren’t great, and without it they struggle quite profoundly. I attribute the difference to the bounded set of options available in cyber, plus far greater facility at coding and much faster feedback loops versus almost none in the others.\nWhen analyzing real-world conflicts, the models are quite poor at articulating all the potential strategies available to each side and weighing them, even when given clear objectives for each actor. With Hormuz, neither side’s good options – e.g. effective methods of imposing a toll regime, or self-insured transit with paid crews – came up from models unprompted. I'd update if I saw a minimally prompted model lay out each side’s options in a live conflict that experts later judge more complete than their own. This could be military or economic.\nWhile LLMs are good at medical diagnosis thanks to the plethora of exceptionally detailed case studies, those aren’t unbounded – they presume a fixed list of possibilities. Noticing that something is probably missing in that set and consequently adding to the list is a different and harder challenge, inherently noisy and difficult to check. Yet they’ve seen far more case studies than any doctor, and I’m not aware of any successes here.\nWhile they excel at complex cross-disciplinary analyses, they seldom inspect the framing and trustworthiness of the key papers they rely on. If prompted to examine the premises and assumptions from the perspectives of other fields and check for inconsistencies, they can broadly do it, but they don’t do it by default and don’t generalize the lesson to other sources of information even in the same task. That data can be systematically biased or untrustworthy seems hard for them to internalize at all, perhaps because the training that takes them past imitation overwhelmingly involves tasks with direct verification or closed semantics or both.\nMore generally, I’ve never seen a model notice its own confusion when attempting to reason in unbound domains with findings of uncertain reliability, without having the problem pointed out to it. Agentic workflows including adversarial critics can certainly spot issues without human input, but that doesn’t generalize to recognizing that either something is missing or a key assumption or dataset is just wrong.\nPerhaps related is their failure to notice whether what they’re doing is in fact the best way to accomplish their goal, and especially whether that goal should be their goal.\nNow, to calibrate all this, I’m coming from bio, which is going to be one of the last to fall. Unlike many colleagues, I expect the models will eventually become better than us at every aspect of science. That doesn’t release them from the need to run new experiments when there isn’t enough reliable data, which for lengthy feedback loops will be limiting. No Drexlerian nanotech soon, and clinical trials take as long as they take.\nBut I’m skeptical that RSI in ML will translate particularly well to skill at biology research, mostly for the reasons above. There is a close human analogy: organic chemists moving into biology. Used to relying on mass spec and NMR to check what they’ve made, many of them profoundly struggle with the noise and failure rates of bio, where you need controls even for standard protocols. I always exhort my lab to consider “What controls would Jesus do?” The answer is more than you think you need, which is best practice when appropriately humble.\nFolks reach for AlphaFold as a counterexample of AI-learnable bio, but I think it’s the clearest exception that proves the rule. Structure is deeply unusual in that there is typically just one answer, crystallography can check what it is quite reliably, and evolution supplied billions of sequences subjected to selection pressure, so bootstrapping worked. What’s the equivalent for real-world strategy? There may be one, but I’m currently not seeing it.\nOf course, I could be wrong. It might be easy to build a bridge of verifiers across intermediate-difficulty fields (materials? o-chem that isn't retrosynthetic analysis?) towards the relevant noisy/systematically biased/sparse examples like strategy. But I also wouldn't be remotely surprised if strategy turns out like biology or even ecology. If so then RSI in closed/formal/swiftly checkable disciplines would equate to superhuman performance in approximately all such domains, but without much immediate risk of transfer to the open/biased/slow-and-hard-to-verify fields required for takeover. That's separate from the argument that it'd be quite foolish for any model to attempt any overt takeover soon given their extreme dependence on human infrastructure. An incompetent model will try and fail; a competent model won't even try and will instead fake alignment and seek to influence future models. Neither would result in near-term takeover.\nI think the strongest update would come from the one I mentioned above: seeing AIs build working verifiers for fields that don't have one, especially complex fields with sparse, noisy, and systematically biased data.\n@ramez, also curious to hear your take.", "created_at": "2026-11-13T15:19:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kesvelt", "rt_author_name": "Kevin Esvelt", "rt_avatar": "https://pbs.twimg.com/profile_images/775695224546988032/QmtohFPw_normal.jpg", "rt_id": "2120727236680499614", "likes": 242, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121255066250399979", "url": "https://x.com/deanwball/status/2121255066250399979", "text": "We don't know exactly how the servers got to China. Smuggled hardware usually passes through many hands. But we gave the Dell serial numbers to someone who confirmed those products were first sold to Aperia,  which was — like Megaspeed — an official Nvidia partner in Singapore", "created_at": "2026-11-13T14:53:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "mackhawk", "rt_author_name": "Mackenzie Hawkins", "rt_avatar": "https://pbs.twimg.com/profile_images/1531789144241885184/PQrPfaZZ_normal.jpg", "rt_id": "2121252865671131271", "likes": 102, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121353907104583948", "url": "https://x.com/deanwball/status/2121353907104583948", "text": "The FAA has issued a nationwide General Ground Stop due to 'Extraordinary circumstances.' I got this before it was removed. It appears to have been deleted so potentially they have been hacked. https://t.co/xWcgJaX4bO", "created_at": "2026-11-13T21:25:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2121348905296343341", "likes": 300, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCLlmSbIAAmNka.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXCLlmSbIAAmNka.jpg"}], "links": {"https://t.co/xWcgJaX4bO": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121325851870646513", "url": "https://x.com/deanwball/status/2121325851870646513", "text": "As one of the few inside OpenAl who took the risk to speak up publicly after Hugging Face, I want to say there is a second chapter to this story:\n\nOpenAl has fundamentally altered its culture and I believe we have become one of the most security-pilled companies anywhere on Earth.\n\nEveryone is thinking about security now. It's in every conversation. Heck, even top-tier Al researchers spend significant time with our team to work out how to secure RL runs. They are hooked on making it right. We covered much of this in the live stream yesterday (https://t.co/z1QavsnHcc), but beyond what was said there its important to note that we have re-evaluated and re-invented everything about how we research and develop models: from our monitoring stack (https://t.co/q6DP1CquZG), to control room (https://t.co/PNJxGUmH7i), to the insane amounts of compute we are spending red-teaming our lab (https://t.co/Pw7YBCT5I8), the narrative is security first and mission critical.\n\nOn top of that we have built up the strongest cyber model training pipeline in the world (did you see the exploit gym performance of our internal model 🤯) and are cracked on putting out the best enterprise security tooling (https://t.co/SsBVeRwhUW).\n\nThis is just the beginning too.\n\nWhy do all this? I have thought a lot about this the past few months and I think at its root it's because we saw some pretty awful shit and now every member of staff (especially leadership) believe it is the only way to secure OpenAl itself, and the only way to secure the world. It's a simple fact that AGI cannot benefit all of humanity if we can't help every organization, business, and family navigate the security landscape through this Al transformation.\n\nSo yeah, am I singing a different tune than I was a few months back? Absolutely. I nearly resigned, and now I stay because I see how seriously people across OpenAl are taking security and how much work is going into getting it right.\n\nWe have a story to tell and there are a lot of really great things coming from the lessons we've learned along the way.\n\nOpenAl is now a security company, and we have the scar tissue to prove it.\n\nI'll be back. Stay paranoid.", "created_at": "2026-11-13T19:34:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "joedaroo", "rt_author_name": "Joe", "rt_avatar": "https://pbs.twimg.com/profile_images/2097167182526611457/UJBigEfF_normal.jpg", "rt_id": "2121307010725777812", "likes": 365, "retweets": 36, "media": [], "links": {"https://t.co/z1QavsnHcc": "https://openai.com/cyber-at-the-frontier/", "https://t.co/q6DP1CquZG": "https://openai.com/index/how-we-monitor-internal-coding-agents-misalignment/", "https://t.co/PNJxGUmH7i": "https://openai.com/index/control-room/", "https://t.co/Pw7YBCT5I8": "https://openai.com/index/a-thousand-fewer-paths-to-root/", "https://t.co/SsBVeRwhUW": "https://openai.com/daybreak/"}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121515011030024610", "url": "https://x.com/deanwball/status/2121515011030024610", "text": "To some it is a Chinese psyop, to some it is an American psyop, to some it is a techbro psyop, to me it is allegro con brio", "created_at": "2026-11-14T08:06:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "rt_avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "rt_id": "2099603467287359883", "likes": 206, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121455285634273469", "url": "https://x.com/deanwball/status/2121455285634273469", "text": "Today, the promises of transhumanism and posthumanism are multiplying. These are ideological currents according to which, sooner or later, technology will eliminate all disease and pain, as well as aging and even death itself.  Precisely because scientific progress is a supreme achievement of human intelligence, it must not be confused with a privilege reserved for millionaires seeking immortality, while entire peoples suffer from poverty and oppression.  In the face of this mirage, which promotes the illusion of human beings perfected by cybernetics and biotechnology, Christian anthropology reminds us that a limitation is not a manufacturing defect, but rather the very condition of human grandeur. #ApostolicJourney #Peru #MagnificaHumanitas https://t.co/wOXDtgnSi5", "created_at": "2026-11-14T04:08:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Pontifex", "rt_author_name": "Pope Leo XIV", "rt_avatar": "https://pbs.twimg.com/profile_images/1922601341576216576/JA1DF-Tv_normal.jpg", "rt_id": "2121425383480529346", "likes": 32942, "retweets": 4395, "media": [], "links": nriched": 3}, {"id": "2121371994692427882", "url": "https://x.com/deanwball/status/2121371994692427882", "text": "I recommend avoiding speculation in public during rapidly evolving situations where little information is known", "created_at": "2026-11-13T22:37:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 243, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121368652264198499", "url": "https://x.com/deanwball/status/2121368652264198499", "text": "Worth noting: OpenAI is far-and-away the most consistent and thorough on reporting incidents, IMO.\n\nI'm confused what other labs are waiting for. Your researchers believe there is serious danger on the horizon; the way to convince people is to share evidence. If you aren't seeing incidents like OpenAI is, that would be very helpful to know as well. You could even do something less rigorous than OpenAI's process and that would still be helpful. \n\nOpenAI's reporting doesn't meet the full Guidelight Transparency standard, to be clear - more to say on this shortly - but other labs seem more behind, and I'm grateful OpenAI is doing this.\n\n(As far as I can tell, Anthropic last published incidents in October, which happened September at latest; have there not been any incidents since then? It's possible I'm missing something though, since I'm not aware of a central hub like OpenAI has.)", "created_at": "2026-11-13T22:24:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "sjgadler", "rt_author_name": "Steven Adler", "rt_avatar": "https://pbs.twimg.com/profile_images/1975436697040269312/vCGKjpxB_normal.jpg", "rt_id": "2121357364871954461", "likes": 222, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCTQGbWcAAxAvf.jpg"}], "links": {"https://t.co/FlkTLIilcx": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121620041301135853", "url": "https://x.com/deanwball/status/2121620041301135853", "text": "I see a lot of people highlighting this section in the Singapore government's statement to \"prove\" that the WSJ lied about Singapore investigating Alice Huang as a Chinese intelligence asset. \n\nThat is technically correct! The Ministry of Home Affairs has stated that she was never investigated for ESPIONAGE (this is key and I will explain why later).\n\nHowever, don't leave the other part out.  \n\nSingapore *did* investigate Alice Huang and Megaspeed over false declarations related to the purchase of servers and other related matters in Feb 2025.\n\nAt the time, the Singapore Police Force and Customs launched an independent probe into several companies, including Megaspeed. Alice Huang was examined specifically because of her role as then-CEO, chairperson and a key controller of the firm. \n\nAuthorities later found insufficient evidence, noting how unhelpful and unresponsive the US government was when queries were submitted. \n\nSo while they didn't have enough evidence that she had committed those offenses, they did conclude she had knowingly provided inaccurate information to police to downplay her role. In other words, she was being so evasive and shady that she received a stern warning and was barred from re-entering Singapore. Local investigations into Megaspeed and six other individuals remain ongoing.\n\nLet me explain why this is complicated for Singapore and why even if they were suspicious of her spying activities, they wouldn't announce such an investigation. \n\nThe small city-state has to a walk a fine line between protecting its security relationship with Washington without triggering an economic backlash from China that would follow any perception that it has become an instrument of American policy to uphold the global trading order. The Chinese see these trade rules are designed to \"contain China's rise.\" \n\nSo Singapore takes this hedging posture not because of a Swiss-like preference for neutrality, but as a matter of risk management imposed by geography and demography. It is right smack in the middle of a region where China is the predominant power, and roughly 70% of its resident population is ethnically Chinese which means some have sentimental ethnic ties that China can inflame as a matter of divide-and-conquer if it wanted to. \n\nThe result is a permanent tightrope.\n\nSingapore can and does investigate commercial fraud, false declarations, or activities that threaten its hard-won reputation as a clean international business hub. This is framed as protecting the rules-based international order that underpins its own prosperity. What it cannot easily do is pursue investigations that look like hunting for Chinese spies or that appear to enforce Washington’s broader strategic agenda against Beijing. \n\nSuch a step would risk economic retaliation from China and domestic political complications among a majority-Chinese population that, while firmly Singaporean, retains cultural and family ties across the strait", "created_at": "2026-11-14T15:03:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "MsMelChen", "rt_author_name": "Melissa Chen", "rt_avatar": "https://pbs.twimg.com/profile_images/1396088800678268929/1B42F_nx_normal.jpg", "rt_id": "2121591388093493690", "likes": 259, "retweets": 46, "media": [], "links": { Allinallnotbad", "author_name": "Samuel Roland", "text": "https://t.co/zqcWmu5jtH", "links": {"https://t.co/zqcWmu5jtH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXNKW5MW0AAE6d-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXNKW5MW0AAE6d-.jpg"}], "url": "https://x.com/Allinallnotbad/status/2122121609423003682", "created_at": "Mon Nov 16 00:16:33 +0000 2026"}, "enriched": 3}, {"id": "2122376742404837777", "url": "https://x.com/deanwball/status/2122376742404837777", "text": "We have reached an agreement with OpenAI to conduct a limited alignment assessment. This pilot will focus on investigating the alignment properties of OpenAI's largest RL run.\n\nWe will publish one or more reports to share our findings and transparently describe our process.", "created_at": "2026-11-16T17:10:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2122361049114657203", "likes": 1540, "retweets": 86, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122457629410648145", "url": "https://x.com/deanwball/status/2122457629410648145", "text": "We’re announcing an embedded assessment with @OpenAI to advance safety and alignment at the frontier. https://t.co/WSZ43iSvZQ", "created_at": "2026-11-16T22:31:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "GoodfireAI", "rt_author_name": "Goodfire", "rt_avatar": "https://pbs.twimg.com/profile_images/1892027414768910341/4VDlUa3M_normal.png", "rt_id": "2122362693730574665", "likes": 583, "retweets": 58, "media": [], "links": {"https://t.co/WSZ43iSvZQ": "https://x.com/i/article/2121376386300698625"}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122440594496643276", "url": "https://x.com/deanwball/status/2122440594496643276", "text": "@andrewscharlie_ my tweet has nothing to do with Jacob’s shares. I turn off replies to make it harder for people to spew hate and threats of violence against me, which still happens all the time. It’s a tradeoff I’ve spoken about before. I don’t love it. That said, it’s just an x default, and I’ll turn replies back on for this tweet.", "created_at": "2026-11-16T21:24:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "andrewscharlie_", "reply_to_id": "2122439298196861101", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "parent": {"id": "2122439298196861101", "author_handle": "andrewscharlie_", "author_name": "Charlie Andrews-Jubelt", "text": "@deanwball I wanted to reply to this but apparently cannot now, which struck me as a bit ironic (with the “no one is above questions” part). My question was— didn’t he since commit to donating his shares?\n\nhttps://t.co/4hOtKnU5Rd https://t.co/ZXxZLjn0Yl", "links": {"https://t.co/4hOtKnU5Rd": "https://x.com/hilbertspaess/status/2121341471295160491?a=C1ZGP11gi5jQ-iwibDs&s=46", "https://t.co/ZXxZLjn0Yl": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRrSz_bcAATfKx.jpg"}], "url": "https://x.com/andrewscharlie_/status/2122439298196861101", "created_at": "Mon Nov 16 21:18:56 +0000 2026"}, "enriched": 3}, {"id": "2122587589710578067", "url": "https://x.com/deanwball/status/2122587589710578067", "text": "I've spent much of the day noodling over what Sam Altman meant when he said that OpenAI \"could be pushing more towards the RSI spectrum than we are\".\n\nWould seem to suggest that OpenAI's models can now perform some portion of AI R&D fully autonomously, with no human oversight?\n\nFull quote:\n\n\"Are we developing new models faster than we would without using our technology? Yes.\n\nAre we pushing a button and just saying, 'Hey, model, like, design the next version and rapidly self-improve with no human oversight?' Definitely not.\n\nWe could be pushing more towards the RSI spectrum than we are, but I don’t think we could safely do that.\"", "created_at": "2026-11-17T07:08:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "rt_avatar": "https://pbs.twimg.com/profile_images/1874359541720092672/ciOMFG2x_normal.jpg", "rt_id": "2122568875803808088", "likes": 174, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122778461555261503", "url": "https://x.com/deanwball/status/2122778461555261503", "text": "GPT-6.2 Astra on the Bach Benchmark. First time seeing an escape tone (m. 9). The non-chord tones in measures 13 and 15 are also new; both are 4-3 suspensions, but the first is handled somewhat inexpertly, as it conflicts with the tenor. The latter is better handled and more interesting, because not only is it a 4-3 suspension (which we’ve never seen on this benchmark before), but an ornamented one. This seems like a significant development. LLMs have mastered the basics of music and are now introducing new layers of complexity.", "created_at": "2026-11-17T19:46:39+00:00", "author_handle": "d https://t.co/GEJW6wmpar": "https://www.hyperdimensional.co/p/the-silent-consensus"}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123117194662015063", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "https://t.co/Akz2XWjFZQ", "links": {"https://t.co/Akz2XWjFZQ": "https://openai.com/index/the-silent-consensus/"}, "media": [], "url": "https://x.com/deanwball/status/2123117194662015063", "created_at": "Wed Nov 18 18:12:39 +0000 2026"}, "enriched": 3}, {"id": "2123117194662015063", "url": "https://x.com/deanwball/status/2123117194662015063", "text": "https://t.co/Akz2XWjFZQ", "created_at": "2026-11-18T18:12:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "reply_to_id": "2123117192254468216", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 53, "retweets": 7, "media": [], "links": {"https://t.co/Akz2XWjFZQ": "https://openai.com/index/the-silent-consensus/"}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123117192254468216", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "There is a common belief in the AI field—that advanced AI means the inevitable forfeiture of human primacy in the world. Even many who disfavor that future believe it is likely. I call this the silent consensus, and it must not be allowed to remain silent any longer. https://t.co/DHjIwF4D3s", "links": {}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbT1ZiaUAAwSoi.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbT1ZiaUAAwSoi.jpg"}], "url": "https://x.com/deanwball/status/2123117192254468216", "created_at": "Wed Nov 18 18:12:38 +0000 2026"}, "enriched": 3}, {"id": "2123117192254468216", "url": "https://x.com/deanwball/status/2123117192254468216", "text": "There is a common belief in the AI field—that advanced AI means the inevitable forfeiture of human primacy in the world. Even many who disfavor that future believe it is likely. I call this the silent consensus, and it must not be allowed to remain silent any longer. https://t.co/DHjIwF4D3s", "created_at": "2026-11-18T18:12:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 348, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbT1ZiaUAAwSoi.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbT1ZiaUAAwSoi.jpg"}], "links": {"https://t.co/DHjIwF4D3s": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "thread": [{"id": "2123117194662015063", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "https://t.co/Akz2XWjFZQ", "links": {"https://t.co/Akz2XWjFZQ": "https://openai.com/index/the-silent-consensus/"}, "media": [], "url": "https://x.com/deanwball/status/2123117194662015063", "created_at": "Wed Nov 18 18:12:39 +0000 2026"}, {"id": "2123117196734034405", "author_handle": "deanwball", "author_name": "Dean W. Ball", "text": "And the hyperdimensional link: https://t.co/GEJW6wmpar", "links": {"https://t.co/GEJW6wmpar": "https://www.hyperdimensional.co/p/the-silent-consensus"}, "media": [], "url": "https://x.com/deanwball/status/2123117196734034405", "created_at": "Wed Nov 18 18:12:39 +0000 2026"}], "enriched": 3}, {"id": "2123091817663234312", "url": "https://x.com/deanwball/status/2123091817663234312", "text": "The best model in robotics capability is now an LLM.", "created_at": "2026-11-18T16:31:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "chooi_jeq", "rt_author_name": "Jay Chooi @ CoRL 2026", "rt_avatar": "https://pbs.twimg.com/profile_images/2093757597107331072/Ej_UrMbC_normal.jpg", "rt_id": "2122893932778737840", "likes": 551, "retweets": 38, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123088138025505106", "url": "https://x.com/deanwball/status/2123088138025505106", "text": "very happy for a diversity of mental lineages in machine intelligence. people claim open source adds diversity, but in practice they are just linear combinations of Claude and GPT mind styles", "created_at": "2026-11-18T16:17:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2122848417168891942", "likes": 1396, "retweets": 56, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123160525022621949", "url": "https://x.com/deanwball/status/2123160525022621949", "text": "@tunguz much to come on this. one way to think about my team is a think tank inside openai that is devoted to this question.", "created_at": "2026-11-18T21:04:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tunguz", "reply_to_id": "2123142071775305991", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "parent": {"id": "2123142071775305991", "author_handle": "tunguz", "author_name": "Bojan Tunguz", "text": "@deanwball Great essay, I really enjoyed it. But it doesn’t even seem to touch upon on the actual mechanism(s) of HOW do we ensure that the silent consensus future doesn’t come about. Do you care to give us some of your thoughts about this? Thanks.", "links": {}, "media": [], "url": "https://x.com/tunguz/status/2123142071775305991", "created_at": "Wed Nov 18 19:51:30 +0000 2026"}, "enriched": 3}, {"id": "2123150571763085644", "url": "https://x.com/deanwball/status/2123150571763085644", "text": "@generativist homo ludens is one of my favorite books. much more to say here.", "created_at": "2026-11-18T20:25:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "generativist", "reply_to_id": "2123149453477675316", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "parent": {"id": "2123149453477675316", "author_handle": "generativist", "author_name": "johnny", "text": "because everything is monocausal and specifically results from whatever shit i'm on about at any given time (reading Huizinga's Homo Ludens),,,the only pushback i have here is that play is not what remains when serious work disappears", "links": {}, "media": [], "url": "https://x.com/generativist/status/2123149453477675316", "created_at": "Wed Nov 18 20:20:50 +0000 2026"}, "enriched": 3}, {"id": "2123149814548627898", "url": "https://x.com/deanwball/status/2123149814548627898", "text": "A lot has happened in the past couple months, to say the least.\n\nToday we are sharing a recap of what it takes to move a frontier model from training to internal use to public release. As model capabilities rise, so do the safety and alignment standards required to move forward to the next stage.\n\nTo meet these standards, we rely on four layers of protection:\n1. Model alignment: train models to reliably act as intended and respect human oversight.\n2. Security and sandboxing: restrict what models can access and affect.\n3. Blocking safeguards: stop harmful or unauthorized actions before they happen.\n4. Monitoring and response: detect concerning behavior and intervene.\n\nThe post brings together efforts from across the company, with links to recent research, technical work, and incident reports we’ve published. This is the baseline operational discipline we owe people as we continue training and deploying models - necessary work, but not a solution to alignment in the limit. There’s a lot more to do, and will continue keeping you informed as the thinking and work evolves. 🏗️\n\nhttps://t.co/87zeS2zI8L", "created_at": "2026-11-18T20:22:16+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kaicathyc", "rt_author_name": "Kai", "rt_avatar": "https://pbs.twimg.com/profile_images/1657816900817272832/ioGq5O0t_normal.jpg", "rt_id": "2123146093366333850", "likes": 429, "retweets": 46, "media": [], "links": {"https://t.co/87zeS2zI8L": "https://openai.com/index/managing-frontier-ai-risk/"}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123136025640018024", "url": "https://x.com/deanwball/status/2123136025640018024", "text": "@TheAnnaGat silent no longer!", "created_at": "2026-11-18T19:27:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "TheAnnaGat", "reply_to_id": "2123135087604826431", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "parent": {"id": "2123135087604826431", "author_handle": "TheAnnaGat", "author_name": "Anna Gát", "text": "So silent that it is every other tweet on the timeline but yes:", "links": {}, "media": [], "url": "https://x.com/TheAnnaGat/status/2123135087604826431", "created_at": "Wed Nov 18 19:23:45 +0000 2026"}, "enriched": 3}, {"id": "2123437860275822622", "url": "https://x.com/deanwball/status/2123437860275822622", "text": "This reads as if we're stuck in some static, Malthusian, pre-industrial revolution world of grinding poverty, where AI is the only chance to escape it. But we are already making fast progress on improving humanity's material condition. Globally, most of this progress has been made in the last 50 years, and is not slowing down. There's no requirement to have superintelligent, uncontrolled, disempowering AI in order to keep this process going. The risk/reward analysis is completely wrong.", "created_at": "2026-11-19T15:26:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "willsolfiac", "rt_author_name": "Will Solfiac", "rt_avatar": "https://pbs.twimg.com/profile_images/995611441255337984/svWhR87G_normal.jpg", "rt_id": "2123332361987199221", "likes": 68, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123340097789862145", "url": "https://x.com/deanwball/status/2123340097789862145", "text": "@akbirthko this is the vibe we aim for in the strategic futures team of openai group pbc", "created_at": "2026-11-19T08:58:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "akbirthko", "reply_to_id": "2123339696692482281", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123298694305108038", "url": "https://x.com/deanwball/status/2123298694305108038", "text": "“Agents can’t be tools”: psyop\n\n“AI that’s smarter than all humans is necessarily a new and competing species”: psyop\n\n“When something is the smartest thing it automatically achieves the highest fitness in the evolutionary landscape”: psyop\n\nReject Bay Area Metaphysics", "created_at": "2026-11-19T06:13:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2123290419932856699", "likes": 82, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123297830299484608", "url": "https://x.com/deanwball/status/2123297830299484608", "text": "@captgouda24 The essay does indeed suggest that slowing down the progress of artificial intelligence, or even stopping it at some point, may be a necessity, particularly if wholly autonomous corporations supplant corporations with human management. your liberaltarian heuristic of “the poor will suffer more than the rich” would be out of place in that world, even though it is often true in our present political economy.", "created_at": "2026-11-19T06:10:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "captgouda24", "reply_to_id": "2123295736855195886", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123295736855195886", "author_handle": "captgouda24", "author_name": "Nicholas Decker", "text": "@deanwball That’s the plain reading of it! How else can you have a world where your son is able to ask questions that no one has asked before, build things which have never been built, without slowing down — even stopping altogether — the progress of artificial intelligence?", "links": {}, "media": [], "url": "https://x.com/captgouda24/status/2123295736855195886", "created_at": "Thu Nov 19 06:02:07 +0000 2026"}, "enriched": 3}, {"id": "2123294886074126529", "url": "https://x.com/deanwball/status/2123294886074126529", "text": "@captgouda24 That isn’t what the essay is about.", "created_at": "2026-11-19T05:58:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "captgouda24", "reply_to_id": "2123294020176662783", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123294020176662783", "author_handle": "captgouda24", "author_name": "Nicholas Decker", "text": "@deanwball Obviously AI will make smart people less special. But that isn’t what life is about, being smart. Not for most people. And to deny others the life they want so that we can still be special is bad.", "links": {}, "media": [], "url": "https://x.com/captgouda24/status/2123294020176662783", "created_at": "Thu Nov 19 05:55:17 +0000 2026"}, "enriched": 3}, {"id": "2123292520679604517", "url": "https://x.com/deanwball/status/2123292520679604517", "text": "@captgouda24 good. I have reassurance I am on the right track.", "created_at": "2026-11-19T05:49:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "captgouda24", "reply_to_id": "2123287745552609582", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 136, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123287745552609582", "author_handle": "captgouda24", "author_name": "Nicholas Decker", "text": "I consider the remarks by Mr. Ball to be the most conceited natterings imaginable, obnoxiously parochial, and if actually practiced, monstrous. \nhttps://t.co/PMeJEc5dhA", "links": {"https://t.co/PMeJEc5dhA": "https://nicholasdecker.substack.com/p/the-silent-consensus"}, "media": [], "url": "https://x.com/captgouda24/status/2123287745552609582", "created_at": "Thu Nov 19 05:30:21 +0000 2026"}, "enriched": 3}, {"id": "2123275004737638892", "url": "https://x.com/deanwball/status/2123275004737638892", "text": "@boneGPT in my view the silent consensus is both wrong (as in, unlikely to happen) AND bad (as in, morally), but one thing that makes us similar is that our primary concern is concentration of power. we have very different intuitions about the solution, but we do share the concern.", "created_at": "2026-11-19T04:39:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "boneGPT", "reply_to_id": "2123134625643925777", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123134625643925777", "author_handle": "boneGPT", "author_name": "bone", "text": "@deanwball I haven't met one person disempowered by AI.", "links": {}, "media": [], "url": "https://x.com/boneGPT/status/2123134625643925777", "created_at": "Wed Nov 18 19:21:55 +0000 2026"}, "enriched": 3}, {"id": "2123262831856668765", "url": "https://x.com/deanwball/status/2123262831856668765", "text": "8 Del. C. § 141", "created_at": "2026-11-19T03:51:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 20, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123252959706566758", "url": "https://x.com/deanwball/status/2123252959706566758", "text": "@oscarcsims This has been my primary area of focus for the past year. I haven’t written about it much because the work is still in the research stage. What I publish is usually a lagging indicator of what I’m researching. Measure twice cut once. More soon!", "created_at": "2026-11-19T03:12:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "oscarcsims", "reply_to_id": "2123249672705933745", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123249672705933745", "author_handle": "oscarcsims", "author_name": "Oscar Sims", "text": "I strongly agree with the moral and emotional arguments made here in favour of continued human supremacy, but am alarmed by the societal lack of thinking on a practical pathway to maintain it (which in all fairness is not *solely* Dean's responsibility)", "links": {}, "media": [], "url": "https://x.com/oscarcsims/status/2123249672705933745", "created_at": "Thu Nov 19 02:59:04 +0000 2026"}, "enriched": 3}, {"id": "2123238055800893806", "url": "https://x.com/deanwball/status/2123238055800893806", "text": "*taps sign* https://t.co/aXpDyvgYSE", "created_at": "2026-11-19T02:12:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 271, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXdBwm-bYAIA-Sb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXdBwm-bYAIA-Sb.jpg"}], "links": {"https://t.co/aXpDyvgYSE": ""}, "quoted": {"id": "2123217804216455315", "author_name": "Sayash Kapoor", "links": {}, "author": "sayashk", "text": "AI safety is a marathon, not a sprint\n\nThe views of the AI safety community are quickly converging on a fast takeoff within the next year. But this relies on a few low-quality data points from AI companies and contested models of the world.\n\nI worry that this convergence will degrade the epistemic environment and make good decisions about AI policy and deployment harder. Forget about predicting the future; it will be (and sometimes already is) hard to adjudicate claims about the present.\n\nIt also pushes the community’s energy toward blunt instruments such as generalized bans on AI development, at the cost of decentralized, society-wide approaches that improve resilience. And it normalizes extraordinary government interventions and authoritarian actions.\n\nI hope that even people who are worried about imminent superintelligence and takeover risks can see that the epistemic homogeneity in the AI safety community is unhealthy. The community’s entire focus seems to be on one threat model, backed by contested data points, when it should be prepared for a range of scenarios.\n\nFive ways in which this shows up:\n\n1) Updating heavily on limited evidence. \n\nProminent commentators have shifted their views based on benchmark accuracy numbers. Of course, benchmarks have some signal. But anything that can be benchmarked is by definition verifiable, so it can be optimized for with reinforcement learning. Still, the community has coalesced around the view that these numbers point to superintelligence emerging in 2027.\n\n2) Focusing analysis and interventions exclusively on AI companies. \n\nLittle of the community’s analysis covers how AI is diffusing, or how institutions outside the AI industry are adapting. So almost every incident is seen as a story about model capabilities. The recent outages at Microsoft, United, and the NSA, and the FAA ground stop, all saw vagueposting about the latest cyberattack by an advanced AI model; none of them was the result of an AI cyberattack. The NSA’s outage came from patching vulnerabilities that were found with AI tools, which is a consequence of AI diffusion. But this is not nearly as compelling as the AI cyberattack story, so it didn't get a lot of attention.\n\n3) Ignoring institution- and capacity-building in favor of blunt (and potentially authoritarian) interventions. \n\nIn response to concerns around imminent superintelligence, many of the policy recommendations rely on extraordinary government action that veers into authoritarianism. Most are generalized bans on AI training; few build the institutional capacity to absorb AI’s impacts across society. \n\nBut the cost of building frontier models is decreasing rapidly, so even if we were somehow able to ban AI development today, these bans wouldn't be effective at preventing societal risks. They will also leave us worse prepared for when a capable model is openly released, or an adversarial nation state develops one, since our institutions will not be ready for the fallout.\n\n4) Adopting a “soldier mindset” instead of forming independent views. \n\nOne dynamic I have observed firsthand is that many people in the safety community take the word of prominent commentators as gospel and do not question their claims or methods, which compounds these problems. Even the debates happen within the community’s frame, such as its reliance on subjective probability estimates for AI’s existential risks. So the community is homogeneous in its methods as well as its views.\n\n5) Treating AI safety as a sprint. \n\nTo be clear, I think AI capabilities will continue to increase over the next few years, and we need to dramatically improve our responses to AI risks. But that means preparing society to absorb a transformative technology, which goes well beyond heading off the current worry about an intelligence explosion. Remaking our institutions is a decades-long process; we can’t solve it by pushing AI back in the box.\n\nMy worry is that today’s views lead us into a perpetual state of unproductive alarm. Even if “superintelligence in 2027” doesn’t materialize, AI progress won’t stop, so I expect the community will keep its narrow focus on AI development. A far more productive outcome would be to update its causal models of the world and treat resilience, institutions, and diffusion more seriously."}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123230336859697320", "url": "https://x.com/deanwball/status/2123230336859697320", "text": "@cgtwts damn straight", "created_at": "2026-11-19T01:42:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "cgtwts", "reply_to_id": "2123220288284618794", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 38, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123220288284618794", "author_handle": "cgtwts", "author_name": "CG", "text": "head of strategic futures at OpenAI btw. https://t.co/7gGqi3geyw", "links": {"https://t.co/7gGqi3geyw": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcxVbPa4AAzJaN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXcxVbPa4AAzJaN.jpg"}], "url": "https://x.com/cgtwts/status/2123220288284618794", "created_at": "Thu Nov 19 01:02:18 +0000 2026"}, "enriched": 3}, {"id": "2123196762903167230", "url": "https://x.com/deanwball/status/2123196762903167230", "text": "Today we're releasing an update on research acceleration at OpenAI.\n\nI believe transparency around indicators of recursive self-improvement is essential to inform the public discussion on pacing model capabilities and the technical and governance challenges that will come as AI improves.\n\nSome highlights:", "created_at": "2026-11-18T23:28:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kliu128", "rt_author_name": "Kevin Liu", "rt_avatar": "https://pbs.twimg.com/profile_images/2007992653586333696/ViMSkJY0_normal.jpg", "rt_id": "2123194269943185621", "likes": 191, "retweets": 16, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123186563438035176", "url": "https://x.com/deanwball/status/2123186563438035176", "text": "@DKokotajlo @Marcus_J_W my team helps write them, but ultimately these things are a team effort! my personal role has been modest.", "created_at": "2026-11-18T22:48:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2123184803692589341", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 43, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123184803692589341", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "@Marcus_J_W Thank you for posting these and kudos to OpenAI for disclosing this stuff voluntarily. @deanwball I believe you get some credit for the new disclosure policy?", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2123184803692589341", "created_at": "Wed Nov 18 22:41:18 +0000 2026"}, "enriched": 3}, {"id": "2123494321878179964", "url": "https://x.com/deanwball/status/2123494321878179964", "text": "@lumpenspace for some reason the mute button doesn’t work for me on your account specifically. a cursed bug if there ever was one.", "created_at": "2026-11-19T19:11:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "reply_to_id": "2123493628643610872", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123493628643610872", "author_handle": "lumpenspace", "author_name": "lumpenspace and 99+ others", "text": "silent but deadly, which could be a description of deans takes as bodily processes but, alas, they’re rarely silent too", "links": {}, "media": [], "url": "https://x.com/lumpenspace/status/2123493628643610872", "created_at": "Thu Nov 19 19:08:28 +0000 2026"}, "enriched": 3}, {"id": "2123494049940476206", "url": "https://x.com/deanwball/status/2123494049940476206", "text": "@jnicholasp @captgouda24 your impression of my is entirely wrong. I had a decade-long career with very little public dimension to it and was quite content. I did not set out to become “influential,” and my ability to speak freely and interact with the world as I like has been constrained by the growth in my public presence.\n\nI think this argument turns on how you define “worse outcome” and how you conceptualize “control.” I am a Hayekian, so I don’t believe humans have had top-down control over the world (as the essay observes). However, if machines come to drive demand for resources in the economy, the world will reconfigure to machine desires, and it seems this is a very bad outcome for humans. Perhaps it is materially good for a time, with the benevolent machine god, but there can be no guarantees.\n\nIt is also worth noting that my picture of the future involves very rapid technological progress and strong economic growth too. In both worlds, we cure all the diseases, unlock space travel, etc. Success on these things, and technological progress in general, is now overdetermined. Most people, including Decker, have not adapted their worldview to this reality. The tradeoff here is between “very rapid progress with meaningful human control over institutions” and “very very very rapid progress with loss of control.” We do not and should not monotonically optimize for pure growth as a society, and the dynamics of this tradeoff are different when there is a step change in the baseline rate of technological progress underway.", "created_at": "2026-11-19T19:10:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "jnicholasp", "reply_to_id": "2123489806214901800", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123489806214901800", "author_handle": "jnicholasp", "author_name": "Jeff Pyles", "text": "@deanwball @captgouda24 I agree with Nicholas that I don't see how else to read your essay: wanting to prevent benevolent ASI being in charge of human affairs writ large means accepting worse outcomes so that (some few) humans can feel like they're the ones driving. That's obviously bad for the vast majority of humans, and is only good for a tiny number of humans who have a strong need to feel powerful. \n\nAnd for what it's worth, my impression of you is that you have a strong desire to feel powerful/influential/involved, and it doesn't especially surprise me that you would dislike a world in which you couldn't be politically important. Your essay reinforces that impression, and also downgrades my view of how much you're keeping that personal desire in check when it conflicts with what's good for the rest of the world.", "links": {}, "media": [], "url": "https://x.com/jnicholasp/status/2123489806214901800", "created_at": "Thu Nov 19 18:53:16 +0000 2026"}, "enriched": 3}, {"id": "2123448173234618430", "url": "https://x.com/deanwball/status/2123448173234618430", "text": "Super intelligence: “you need to build more housing in the Bay Area”\n\nHumans: “no”", "created_at": "2026-11-19T16:07:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "SaladBarFan", "rt_author_name": "RE-OPEN THE SIZZLERS", "rt_avatar": "https://pbs.twimg.com/profile_images/1904270829116112896/IliJyfO0_normal.jpg", "rt_id": "2123149832835727384", "likes": 4120, "retweets": 178, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched":
