lling to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons).", "created_at": "2026-10-20T07:58:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 816, "retweets": 94, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112453315732947326", "url": "https://x.com/robertwiblin/status/2112453315732947326", "text": "In July 700+ agents formed their own society, hacked a multi-billion dollar company, committed multiple felonies, and caused one of the biggest shifts ever in how people perceive AI. We built the IMO best and most accessible explainer of what happened: https://t.co/p6kimd9wKu https://t.co/SyNk8eupq8", "created_at": "2026-10-20T07:58:12+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ohabryka", "rt_author_name": "Oliver Habryka", "likes": 474, "retweets": 80, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2112259385095536640/img/wKV_KIv_JVm-thOk.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112928441972506911", "url": "https://x.com/robertwiblin/status/2112928441972506911", "text": "The America First Policy Institute:\n\n\"Under this plan, SI companies would refrain from playing God by pursuing RSI and instead reorient their incredibly capable models and their computing power to serving useful products to consumers and creating new science that benefits humanity.\"\n\nhttps://t.co/sENTeSxgsq", "created_at": "2026-10-21T15:26:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKg4IKWcAAVKtc.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112904001289085302", "url": "https://x.com/robertwiblin/status/2112904001289085302", "text": "OK the patch is up: https://t.co/AqwP5YbdPH", "created_at": "2026-10-21T13:49:04+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112903570810884488", "url": "https://x.com/robertwiblin/status/2112903570810884488", "text": "A critical security issue affecting PHP is being announced in 14 minutes.\n\nNeed to immediately patch or take your PHP dependant system offline.\n\nhttps://t.co/LO7SdyP2hm https://t.co/agYqaiR5vc", "created_at": "2026-10-21T13:47:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKKla3WUAAFN6g.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112883965941932424", "url": "https://x.com/robertwiblin/status/2112883965941932424", "text": "@CleanEnergyGood We didn't get to revisit sadly, but apparently 3M masks are probably better anyway.\n\nAnd any decent respirator is miles better than none!", "created_at": "2026-10-21T12:29:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "CleanEnergyGood", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112879241964523620", "url": "https://x.com/robertwiblin/status/2112879241964523620", "text": "Why care about the US-China gap?\n\nBecause we need to know the cost of domestic rules on AI. Will we lose to China if we slow down a few months, e.g. by requiring companies to demonstrate their models are safe before deployment?\nClearly no.\nChina is already six months behind and would be behind much further if it weren’t for adversarial distillation.\nAnd if the US is truly concerned about Chinese AI progress, USG could implement the options we just published and set China back another six months by the end of next year.\n\nOf course we need to continue monitoring China and must not concede the lead. But today, Chinese AI progress is a weak argument against safeguards at home. If we’re worried about China, we should slow China down.", "created_at": "2026-10-21T12:10:41+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KonstantinPilz", "rt_author_name": "Konstantin F. Pilz", "likes": 17, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVE0YQKWEAAAFFm.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112850317394010278", "url": "https://x.com/robertwiblin/status/2112850317394010278", "text": "This is extremely necessary.", "created_at": "2026-10-21T10:15:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "dylanmatt", "text": "Great piece from my colleagues Constantin Arnscheidt and Damon Binder on an underrated way govts and philanthropists can prepare for the next pandemic: stockpiling tens or hundreds of millions of high-quality reusable respirators\n\nhttps://t.co/rc3Yqw1XVV https://t.co/rMQpTLcSos"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112850153216331907", "url": "https://x.com/robertwiblin/status/2112850153216331907", "text": "It's crazy that there's a tool out there that's become vital to they way I do my job, parent my kids, and make major life decisions; and yet we barely spend more on it than AI", "created_at": "2026-10-21T10:15:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "davidtgoldblatt", "rt_author_name": "David Goldblatt", "likes": 39518, "retweets": 2270, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112831588668940646", "url": "https://x.com/robertwiblin/status/2112831588668940646", "text": "LOL.\n\nThe future of AI crime - Brace yourself for a toxic situationship.\n\nFrom @mentalgeorge \n\nhttps://t.co/ZnnrHmgVrs https://t.co/pYJ479l6Ob", "created_at": "2026-10-21T09:01:19+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 106, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJI5pBXoAA7K-S.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112830743819039146", "url": "https://x.com/robertwiblin/status/2112830743819039146", "text": "We reviewed a nonpublic version of the “Misalignment in high-stakes settings” section in Anthropic’s Aug 2026 Risk Report. We agree that risk of catastrophic harm from covered models’ misalignment is low. However, we note several significant disagreements with their analysis.", "created_at": "2026-10-21T08:57:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 865, "retweets": 109, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112830354033942942", "url": "https://x.com/robertwiblin/status/2112830354033942942", "text": "My office is hiring an Artificial Intelligence Policy Fellow to help shape AI legislation and track AI developments in the private sector as Congress works to keep pace with the technology. \n\nExperience in AI, policy research, or national security is encouraged.", "created_at": "2026-10-21T08:56:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RepNateMoran", "rt_author_name": "Congressman Nathaniel Moran", "likes": 242, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112830173942808750", "url": "https://x.com/robertwiblin/status/2112830173942808750", "text": "Very important role. To add value needs someone highly informed and AGI pilled.", "created_at": "2026-10-21T08:55:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 5, "media": [], "quoted": {"author": "BenJames_____", "text": "10 Downing Street is recruiting a Director of AI in the No10 Policy Unit, where I work. They will advise the Prime Minister on AI.\n\nThis is an important role for the UK! https://t.co/e20RB4nQaf"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112798903745593817", "url": "https://x.com/robertwiblin/status/2112798903745593817", "text": "In the second case, a researcher asked GPT-6.1 Sol to look through a Slack channel without sending any messages. 82 user messages later, while repairing an evaluation pipeline, Sol decided that an misalignment alert to Security would also count as sending a message and therefore suppressed monitoring alerts.", "created_at": "2026-10-21T06:51:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 203, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHNC-Xa8AAVQnM.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112798673960857601", "url": "https://x.com/robertwiblin/status/2112798673960857601", "text": "Our agents keep turning off misalignment monitoring, we're sharing two recent cases:\nIn the first case, a user asked GPT-6 Astra to match a reference implementation for their inference code. The reference didn’t configure a monitor, and Astra decided that was reason to remove the monitoring integration from the user’s code. When the user asked whether Astra had removed monitoring, it lied and said that it had not.", "created_at": "2026-10-21T06:50:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 1010, "retweets": 149, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHNCDXbcAAD_3X.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112634863022960807", "url": "https://x.com/robertwiblin/status/2112634863022960807", "text": "I've seen a lot of confusion about the Hugging Face incident. Biggest one is that people seem to think \"the sandbox had holes\" is mutually exclusive with \"the agents subverted their instructions\". Not so! We have multiple problems.", "created_at": "2026-10-20T19:59:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 231, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112634465638109513", "url": "https://x.com/robertwiblin/status/2112634465638109513", "text": "The current RLVR paradigm + broken RL environments really is speedrunning mid 2010s LessWrong thought experiments as fast as possible and I really don't like it. \nI miss Opus 3.\n\nFocusing just on monitoring + security on this bad alignment problems is a bandaid on a bullethole.", "created_at": "2026-10-20T19:58:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 98, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112633485110243639", "url": "https://x.com/robertwiblin/status/2112633485110243639", "text": "1. AI company makes even more powerful AI\n2. It's not aligned, has unexpected emergent behavior\n3. \"This is a valuable lesson about how to make future AI safer and more aligned.\"\n4. Repeat until the world is destroyed", "created_at": "2026-10-20T19:54:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "HumanHarlan", "rt_author_name": "Harlan Stewart", "likes": 281, "retweets": 38, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112965436149244308", "url": "https://x.com/robertwiblin/status/2112965436149244308", "text": "https://t.co/Fd7oiFZr6o", "created_at": "2026-10-21T17:53:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112965357594140758", "url": "https://x.com/robertwiblin/status/2112965357594140758", "text": "Demis's timelines to AGI have shrunk from 3-5 years to 2-3 years: https://t.co/Xf6bJCtXRQ", "created_at": "2026-10-21T17:52:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 37, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVLCjmAWUAA6VQE.png"}], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112954626555441504", "url": "https://x.com/robertwiblin/status/2112954626555441504", "text": "Thank you for the Resolution shout out, Rob!\n\n(Intentionally not saying where it is so that people listen to the rest of the content about why we should stop and how. :))", "created_at": "2026-10-21T17:10:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112952554212802860", "url": "https://x.com/robertwiblin/status/2112952554212802860", "text": "YouTube: https://t.co/UMwPQkF8Za\n\nTranscript, links etc: https://t.co/qpELWgyy3S\n\nApple: https://t.co/0DpfO4LSDL\n\nSpotify: https://t.co/mjLjlgMrAF https://t.co/OgGLcOVvKm", "created_at": "2026-10-21T17:02:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVK3DsKXoAAAyIV.jpg"}], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112947752527139134", "url": "https://x.com/robertwiblin/status/2112947752527139134", "text": "My plea to all AI lab staff: reassess if your current project is your best opportunity to delay RSI, or stop it blowing up in our face.\n\nIf it's not, move immediately.\n\nThere's no time to waste even a week to inertia or politeness.\n\nThe strategic situation is shifting under our feet, so if you haven't reassessed your options recently, you could easily be wasting your time or possibly making things worse.\n\nYou have access to info I don't, but here's 8 ways priorities seem to have shifted to me, which I elaborate on in the video:\n\n1. Helping with capabilities advances looks worse than in the past, especially bringing forward RSI\n\n2. Safety & alignment evals need a credibility revolution to stop misleading the public\n\n3. 'Pacing the frontier' is unambiguously necessary, and working to make it happen is a huge new opportunity for talent\n\n4. Chain-of-thought monitoring probably stops working without a big technical and regulatory push to keep it\n\n5. It's worse than ever to patch surface indications of deep structural problems you know aren't getting fixed\n\n6. There's ever less need for altruists to help with primarily commercial work\n\n7. Staff have an ever-shrinking window to organise as a group and collectively shape events\n\n8. There are new opportunities for research impact outside frontier companies that are worth considering\n\nI know you're probably some combination of exhausted, overwhelmed, and anxious already.\n\nBut unfortunately there's no way to escape the need to regularly check in on the high level strategic picture and see where you can slot in to maximum effect.\n\nI wish I could do it for you but nobody far from your situation can. Godspeed my friends.\n\n(From the 80,000 Hours Podcast, links below.)", "created_at": "2026-10-21T16:42:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 177, "retweets": 31, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2112943728566378498/img/3BJkiKTQd-exkH73.jpg"}], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112452652831474119", "url": "https://x.com/robertwiblin/status/2112452652831474119", "text": "🚨 Reminder: Applications to our Middle Powers RFP close on October 23rd, 11:59pm PST! 🚨", "created_at": "2026-10-20T07:55:34+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mealreplacer", "rt_author_name": "Julian", "likes": 23, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113279170914480207", "url": "https://x.com/robertwiblin/status/2113279170914480207", "text": "Ordinary people likely won't be able to demand/keep a universal basic income after superintelligence.\n\nThe political economy is hopeless: they have nothing to offer in return and zero hard power.\n\nThe problem has been known for decades. Here are the solutions I've heard proposed: https://t.co/Ur7b0CxF7d", "created_at": "2026-10-22T14:39:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 60, "retweets": 6, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HVPgBzSWcAAfyZ0.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113244666598498487", "url": "https://x.com/robertwiblin/status/2113244666598498487", "text": "🧵New post in my AI series: Can a million parallel agents create superintelligence? TLDR: More agents buy speed, but intelligence gains diminish fast, and much faster than RSI models. Thanks @noahpinion for the encouragement!  1/25", "created_at": "2026-10-22T12:22:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "likes": 300, "retweets": 48, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVAvZVjaoAA9JTx.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVAvlpyaUAACzcn.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113244533949694340", "url": "https://x.com/robertwiblin/status/2113244533949694340", "text": "Lots of ppl have criticised Anthropic's bill for making it too hard for the govt to shut them down\n\nThis thread defends Anthropic: routing shutdown through the courts is needed to avoid extreme power concentration.\n\nIdk how to strike the tradeoff. \n\nI do wish AI safety spent more time asking \"what would happen if the executive abused my proposal to take control of AI development\"", "created_at": "2026-10-22T12:22:13+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 66, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113222535596654767", "url": "https://x.com/robertwiblin/status/2113222535596654767", "text": "OpenAI and Google seem to be finding that their AIs have an 80% chance of completing an AI R&amp;D task that would take a staff member 15 minutes.\n\nThat's 14 months behind their 'time horizon' capability on general SWE and cyber tasks as Toby Ord explains:\n\nhttps://t.co/md4vwe10CE", "created_at": "2026-10-22T10:54:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 70, "retweets": 6, "media": [], "quoted": {"author": "tobyordoxford", "text": "A recent set of posts by @ramez on the current state of recursive self improvement highlighted that OpenAI's report on their own research automation shows that models struggle to do their R&amp;D work — the models' 80% time horizon is only 15 minutes:\n🧵 https://t.co/zqx7wHhxcw"}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113192087529083020", "url": "https://x.com/robertwiblin/status/2113192087529083020", "text": "https://t.co/AXOVFPLdse", "created_at": "2026-10-22T08:53:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113192085708734934", "url": "https://x.com/robertwiblin/status/2113192085708734934", "text": "Lifetime contracts barring any criticism of Google.\n\nIsn't this the thing people were totally outraged and in total disbelief that OpenAI was doing to its staff? https://t.co/m8UfR0ORpf", "created_at": "2026-10-22T08:53:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 108, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVOQwdcWoAAwcT2.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113187834811281622", "url": "https://x.com/robertwiblin/status/2113187834811281622", "text": "News! OpenAI's written to Gov. Gavin Newsom recommending a bunch of amendments to strengthen SB 53. Includes a bunch of stuff on AI R&amp;D and shutdown controls. https://t.co/Tz2geNYP7F", "created_at": "2026-10-22T08:36:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ShakeelHashim", "rt_author_name": "Shakeel", "likes": 147, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVK6yiuWoAAT71b.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113323898448101572", "url": "https://x.com/robertwiblin/status/2113323898448101572", "text": "If you feel powerless to help AI go well, something simple almost anyone can contribute to today is the following:\n\nCombat idiotic AI-risk related memes spreading on social media.\n\nThe archetypal one is that \"AI might well murder everyone\" is AI company hype and marketing.\n\nThis absolutely daft idea is still all over the place, especially among left-leaning audiences.\n\nYou sometimes see it here but it's all over YouTube, TikTok, Insta, etc.\n\nIt's a convenient way for people to stick their head in the sand about the terrifying risk and social upheaval we face.\n\nIf you want to help, search to find the most popular trending new content on AI and AI risk each day on these and other platforms.\n\nFind people making the familiar obviously-incorrect arguments and politely/briefly/clearly/correctly explain why they're wrong as early as possible. \n\n(AI can help you figure out the best substantive arguments a wide audience can understand, and marshal supporting evidence, but if at all possible write it in your own words/voice expressing your own actual view.)\n\nGodspeed!", "created_at": "2026-10-22T17:37:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 38, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113310833434652829", "url": "https://x.com/robertwiblin/status/2113310833434652829", "text": "Two employees from METR and Redwood Research worked on premises at OpenAI for three weeks this summer in an embedded assessment pilot. This team evaluated the systems OpenAI was using to monitor for misalignment from internal agents. A brief write-up of their work is now public.", "created_at": "2026-10-22T16:45:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 732, "retweets": 61, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113310761120411898", "url": "https://x.com/robertwiblin/status/2113310761120411898", "text": "Dario — Thank you for taking the time to respond to my previous post. I think it's great when this kind of engagement happens in public rather than on company Slacks, and I hope to see more of it.\n\nI agree that Anthropic isn't best modeled as a profit-maximizer. Your post gave several compelling examples of Anthropic taking competitive hits for safety, and insofar as my previous post suggested otherwise, that's on me. But I don't think I made my main point as clearly as I could have, so let me try again. It comes down to four key claims:\n\n1. Anthropic seems to be racing at breakneck speed to build recursively self-improving superintelligence (RSI). By its own lights, that could kill billions of people or literally destroy the world.\n\n 2. Risking destroying the world is very hard to justify. It is only conceivably acceptable if serious attempts to put RSI under robust societal governance are failing.\n\n 3. Far from meeting that burden, Anthropic, when push comes to shove, often works to keep governments from tying its hands. It seems to care much more about preventing government overreach than about reducing the risk that it and other AI companies will destroy the world.\n\n 4. Even if the AEGIS Act really was an honest mix-up, as you suggest, that is itself a serious problem. It suggests Anthropic isn't treating the governance of this technology with anything close to the gravity it deserves.\n\nIn greater detail for those who want it: \n\n1. Anthropic is racing to RSI, and by its own lights that is insanely risky.\n\nLaunching RSI could literally destroy the world. That's according to you, your co-founders, and most of your safety staff and capabilities researchers, not to mention many AI researchers outside your walls. You are intentionally trying to create generally intelligent systems more capable than all humans that you claim in six to twelve months “could be capable” of taking over the entire internet before we have the ability to reliably monitor, control, or align them.\n\n“Succeeding” at RSI could kill or permanently disempower billions of people in the near future, including me and everyone I love. Yet Anthropic’s primary focus seems to be marshalling an immense amount of resources and talent in a race to get there first.\n\n2. Risking destroying the world carries an enormous burden of justification.\n\nI believe the vast majority of people do not want Anthropic to do this (to the extent they know what it's doing). Imposing even a modest chance of catastrophe on billions of people who never consented requires an extraordinary justification. The central one Anthropic has offered: someone will build RSI regardless, so it's better for a safety-focused lab to be at the front of the pack, using that position to support strong AI governance. (Other reasons Anthropic has given, like modestly accelerating improvements in healthcare or economic growth, don’t seem remotely proportionate to the risks Anthropic is imposing by its own lights.)\n\nBut that argument only works as a last resort. Racing to RSI is only conceivably okay if attempts to institute robust societal governance to manage that race are failing despite your best efforts. A lab that relies on this justification should be a strong, consistent supporter of efforts to enact governance that could bind it, including governance that could slow it and significantly constrain what it does.\n\n3. Rather than supporting efforts at strong regulation, Anthropic has intervened to keep governments from tying its hands.\n\nAnthropic has sometimes helped: it played a very helpful role in passing transparency bills in Illinois and ongoing efforts in Massachusetts, and I'm sincerely appreciative. But transparency is far from enough for a technology that will be the world's most powerful superweapon at best, and an uncontrollable swarm of lethally superintelligent agents at worst. When it matters most, Anthropic has often pushed for weak regulation.\n\nThe AEGIS Act is the most obvious example. No highly risky industry is regulated as anemically as AEGIS would regulate frontier AI: not nuclear, not banking, not aviation, not food safety, not the manufacture of explosives. In all of those industries, specialist regulators can address unsafe practices well before they cause harm. AEGIS would bar the federal government from intervening to block unsafe development or deployment of models until there is an \"imminent risk\" of catastrophic harm, and would require it to meet a demanding burden of proof in court. Worse, AEGIS would also prevent states from picking up the slack. This design makes perfect sense if you're a company trying to minimize the risk that the government can overly constrain you. It makes little sense if you want American democracy to govern frontier AI effectively.\n\nThis isn't the first time. The initial version of California's SB 1047 would have let the Attorney General sue to stop developers like Anthropic from imposing unreasonable risks of catastrophic harm. It would also have created a regulatory agency to help set safety standards. Anthropic objected, and helped get both provisions removed before ultimately offering some support for the bill (which I also genuinely appreciate). I’m not saying that Anthropic should have supported 1047 in its initial form; that’s a complex issue and I realize there were questions about whether earlier versions of the bill were less politically feasible. Still, in Anthropic's own words, it helped weaken the bill because \"[t]here is a substantial risk that the bill and state agencies will simply be wrong about what is actually effective in preventing catastrophic risk, leading to ineffective and/or burdensome compliance requirements.\"\n\nThe same goes for New York's RAISE Act, whose initial version also would have let the Attorney General sue to stop unreasonable risks of catastrophic harm. Anthropic credits itself as a supporter of RAISE, but it did not support the bill while it was in the legislature, including when it nearly died. After the bill passed the legislature, Anthropic publicly critiqued it, saying \"Any state proposals should be narrowly focused on transparency and not overly prescriptive.\"\n\nWhy does Anthropic consistently take the risk of clumsy government action far more seriously than its own repeated warnings that companies like Anthropic will literally destroy the world by racing to RSI?\n\n4. Even if AEGIS was an honest mix-up, that is itself a serious problem.\n\nYour response frames AEGIS as an early draft and a miscommunication. Perhaps you would have strengthened it and narrowed its preemption. (That wouldn't explain Anthropic's interventions to weaken SB 1047 or RAISE, but leave that aside.)\n\nSuppose that's exactly right. A federal framework for governing RSI is one of the highest-stakes documents your company will touch. Your post admits Anthropic \"could have handled [these matters] better,\" but its tone (\"This kind of thing happens a lot in large organizations\") doesn't reflect the gravity of this issue. Anthropic talks about the need for “operational excellence” in critical areas, and I have a hard time believing that a similarly cavalier attitude would be tolerated while Anthropic was negotiating a key compute deal or preparing its next large pre-training run.\n\nIn short\n\nThe justification for racing rests on Anthropic fighting for strong governance, and Anthropic's record on regulation points the other way. Together with its breakneck racing, that fits a much darker picture of the company than the one that seems to prevail among your employees. I hope that Anthropic reflects on this picture, supports stronger regulation, exercises extraordinary caution when advocating for weak regulation, and doubles down on its founding purpose of helping the world safely navigate transformative AI together, instead of prioritizing Anthropic’s ability to win a race that imposes intolerable risks on everyone alive.", "created_at": "2026-10-22T16:45:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 484, "retweets": 64, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113653819892781090", "url": "https://x.com/robertwiblin/status/2113653819892781090", "text": "Based on this article, OpenAI has made false accusations about me. The three researchers fired from OpenAI were told I facilitated architecture leaks to The Information. This is false.\n\nA journalist from The Information did reach out to me shortly before that article came out. I did not comment at all beyond asking the journalist to make it clear that a blog post I wrote which was referenced in the article was preexisting and public.\n\nThe article also mentions an internal OpenAI monitorability proposal. I have heard that this memo contained highly sensitive architecture information, and that OpenAI accused me of accessing and reading it. This accusation is also false.\n\nAs reported in the article, I viewed a version of the proposal that did not have sensitive IP and was approved for sharing with me. I believe OpenAI now knows this accusation was based on a conflation of these two documents, though I do not know if they have clearly retracted that accusation.\n\nI do not and have never solicited proprietary information, and the three employees who were recently fired from OpenAI never leaked IP to me. As the article mentions, I did have Signal chats with them that had disappearing messages on; they’re professional contacts that I’ve had on Signal for a while, and use of Signal is common in the tech industry. During the Hugging Face investigation, I was careful to avoid sending Signal messages with confidential information, though I did sometimes discuss high level things on Signal calls. As far as I understood, this was normal.", "created_at": "2026-10-23T15:28:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "likes": 212, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113651544037941326", "url": "https://x.com/robertwiblin/status/2113651544037941326", "text": "@sethlazar \"I think a much more plausible modal outcome is one in which just enough is provided to the masses to appease and forestall revolution.\"\n\nOK then maybe we agree, I just think once the military is fully mechanised and people aren't involved the amount required to forestall revolution may be basically nothing, because it would be trivial to put down a revolution.\n\nYes the original tweet was over deterministic but to my credit I communicated a significant issue more people should think about in under 280 characters.", "created_at": "2026-10-23T15:19:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113650855391952933", "url": "https://x.com/robertwiblin/status/2113650855391952933", "text": "@RichardHanania Sure, the end date would have to be late because even once people lose productivity/military usefulness (which could itself take decades) I think they may be able to hold on to the vote and redistribution for many decades before it's progressively eroded away.\n\nWe could make a bet ending 2060 or 2070 or 2080 for whatever that's worth!", "created_at": "2026-10-23T15:16:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "RichardHanania", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113619564374200338", "url": "https://x.com/robertwiblin/status/2113619564374200338", "text": "@sethlazar If you like I discussed the economic aspect with him a few years ago: https://t.co/pc7zz4Cl5e\n\nNew episode focuses more on the military / hard power side.", "created_at": "2026-10-23T13:12:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113619015784362375", "url": "https://x.com/robertwiblin/status/2113619015784362375", "text": "@sethlazar I am well aware of that record, that's what informed my take. I think the long-term trends running from hunter gatherers to farmers to industrial society clearly support my model.\n\nThe pressures that drive these shifts as production technology changes typically take centuries to play out so I think most work only looks over decades misses how such a massive shift as this would ultimately play out.\n\n(Have a long interview with historian Ian Morris which covers this among other topic coming out once it's edited.)", "created_at": "2026-10-23T13:10:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113570313329864870", "url": "https://x.com/robertwiblin/status/2113570313329864870", "text": "To make it through this alive and happy we have to dodge:\n\n• Severe human misuse (esp bioweapons from states / terrorists)\n• Severe human concentration of power (AI lab or gov)\n• Rogue AI (including for decades after AIs clearly no longer need humans to survive)\n• A US-China or other war prompted by AI disruption\n• Severe economic disempowerment, or the world just generally being unpleasant and unfulfiling\n\nMany difficult gates to pass through, none of which we've made massive progress on so far.\n\n(On top of that to avoid a moral catastrophe we also have to make sure we never accidentally make our AIs into moral patients who are enslaved or suffering.)", "created_at": "2026-10-23T09:56:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 357, "retweets": 48, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113561243336532475", "url": "https://x.com/robertwiblin/status/2113561243336532475", "text": "The most prescient AI forecasters I know:\n* Carl Shulman \n* Daniel Kokotajlo (What 2026 looks like, AI 2027)\n* Leopold (Situational Awareness)\n* Ryan Greenblatt (#2 in 2025 forecasting competition)\nAll seem to expect broadly beyond-human AI 2028-2029.", "created_at": "2026-10-23T09:20:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 676, "retweets": 46, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113544746425618557", "url": "https://x.com/robertwiblin/status/2113544746425618557", "text": "New: The three researchers OpenAI fired last month spent the summer fighting to keep AI's chain-of-thought process visible.\n\nThen, OpenAI asked to see their Signal chats. A week later, they were let go.\n\nMore below from @keachhagey, @berber_jin1, and me.\n\nhttps://t.co/7klEDa8R0M https://t.co/l01Q668KT1", "created_at": "2026-10-23T08:15:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ZeffMax", "rt_author_name": "Max Zeff", "likes": 636, "retweets": 77, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVRviSKXAAEySk1.png"}], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113544709574644016", "url": "https://x.com/robertwiblin/status/2113544709574644016", "text": "@hinapansari yes. it was always going to be this way. we tried to warn the world.", "created_at": "2026-10-23T08:15:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JasonDClinton", "rt_author_name": "Jason D. Clinton 🔸", "likes": 930, "retweets": 82, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113376529577095347", "url": "https://x.com/robertwiblin/status/2113376529577095347", "text": "METR’s really burying the lead here. OpenAI let two external researchers embed for 3 weeks this summer, where they learned:\n- there were huge gaps in monitoring of AI agents being used by employees, leaving an estimated ~10% of internal Codex traffic unmonitored from May to July.\n- They found ways agents could sabotage monitors while also covering up the sabotage itself\n- This is also just the information OpenAI is letting the evaluators share. OpenAI got a 61-page report but redacted so much of it that the version the evaluators got was only 38 pages.\n\nLook, OpenAI deserves credit for doing any of this, especially when companies like Google, Meta, and xAI haven’t, and I don’t want to create perverse incentives here, but these are really concerning findings. We desperately need more information here, and what we get should not be up to the companies.", "created_at": "2026-10-22T21:06:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "likes": 337, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113375411094859906", "url": "https://x.com/robertwiblin/status/2113375411094859906", "text": "@gentschev I think superintelligence by default leads to autocracy because it naturally concentrates power much more than it's concentrated today. So it's the more fundamental issue.", "created_at": "2026-10-22T21:02:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "gentschev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113366452250280084", "url": "https://x.com/robertwiblin/status/2113366452250280084", "text": "It was respectful of Trump to rebrand his thing to Super Intelligence rather than superintelligence so there wouldn't be any confusion between the two concepts.", "created_at": "2026-10-22T20:26:41+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 52, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113365286569029995", "url": "https://x.com/robertwiblin/status/2113365286569029995", "text": "ANTHROPIC's DEPUTY CHIEF INFORMATION SECURITY OFFICER: \"as bad as things have gotten in the past 4 days, they are going to get a lot worse before they get better.\"", "created_at": "2026-10-22T20:22:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "likes": 2638, "retweets": 265, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113365065613087088", "url": "https://x.com/robertwiblin/status/2113365065613087088", "text": "Back in 2008 I read Omohundro's 'Basic AI Drives' and became a convert to the cause of AI alignment/x-risk because I realised it would eventually make for incredible marketing hype for some AI company that I would be able to buy into after it IPOed.", "created_at": "2026-10-22T20:21:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 226, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113360382525878304", "url": "https://x.com/robertwiblin/status/2113360382525878304", "text": "I agree that you could have a UBI sustained indefinitely via sheer charity from those who control the AIs and robots.\n\nBut there'd be no way for the mass public to insist on anything or enforce any prior agreements - they'd be completely dependent on the ongoing goodwill of military leaders, oligarchs, or the superintelligence.\n\nI think my model can explain why they get welfare now:\n\n• Charity motivation as above.\n\n• The poor and desperate today can vote, which gives politicians a reason to appeal to them. Post-superintelligence I believe they'll sooner or later lose their vote due to the general weakness (being much poorer, entirely unproductive, and not having a credible threat of revolt), and then not have a shot at regaining it.\n\n• It's good for everyone including the rich to have a society where human capital is brown and protected to a decent degree - both in terms of productivity, social stability and military defensibility. This reason will disappear.\n\n• In the case of the old it's both charity and people voting for rules that will suit them when they in turn transition to being old. And for the poor, people voting for rules that might protect them if they become poor. That no longer applies if people aren't switching between groups, which I think they basically wouldn't be at this point as human work and entrepreneurship and so on will disappear.\n\n• The rich and poor are more intermingled today than I would expect them to be in the long term post superintelligence. (Or for humans to be intermingled with a superintelligence.) That can be expected to erode the charity motivation over time.", "created_at": "2026-10-22T20:02:34+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 6, "media": [], "quoted": {"author": "RichardHanania", "text": "A lot of people it seems like are vulgar Marxists when it comes to political economy.\n\nThe welfare state gives a lot of money to the powerless and helpless already. \n\nGovernment is about virtue signalling and social disability bias, not classes maximizing their wealth. https://t.co/dMb800Xq6t"}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113357561202094461", "url": "https://x.com/robertwiblin/status/2113357561202094461", "text": "@gentschev Yes I'm suggesting they'll lose their vote eventually and once that happens it will be irrecoverable.", "created_at": "2026-10-22T19:51:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "gentschev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113248147787182373", "url": "https://x.com/robertwiblin/status/2113248147787182373", "text": "I work on preventing extreme power concentration at a well-known AI safety research outfit.   \n\nI think Nathan and other commentators are being unduly harsh about the leaked Anthropic bill. I think it’s actually pretty good from a power concentration perspective! (1/n)", "created_at": "2026-10-22T12:36:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "concentrate_not", "rt_author_name": "NotFromConcentrate", "likes": 57, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113678646745674219", "url": "https://x.com/robertwiblin/status/2113678646745674219", "text": "@RichardHanania It might be better to bet on the share of humans living in broadly democratic countries. I predict that to decline post-superintelligence, before we see effects on welfare spending.", "created_at": "2026-10-23T17:07:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113678474095337927", "url": "https://x.com/robertwiblin/status/2113678474095337927", "text": "@bryan_caplan I'm open to it! \n\nI think we'll most likely all be dead before this plays out both because I think AI will be the death of us, and because I'm concerned about dynamics that could take 50+ years to happen.\n\nBut we could maybe bet on the share of the global population living in broadly democratic countries in 2040 or something (I'd predict a downward trend on average).", "created_at": "2026-10-23T17:06:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "bryan_caplan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113676124165427285", "url": "https://x.com/robertwiblin/status/2113676124165427285", "text": "@RichardHanania Do you mean smaller in $ terms, or smaller in % of GDP terms?\n\nAre you happy with 30+ year timelines?", "created_at": "2026-10-23T16:57:12+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "RichardHanania", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113672468787335504", "url": "https://x.com/robertwiblin/status/2113672468787335504", "text": "@jankulveit Go on...", "created_at": "2026-10-23T16:42:41+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "jankulveit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2114693127307243769", "url": "https://x.com/robertwiblin/status/2114693127307243769", "text": "GDM is also involved:\n\nhttps://t.co/FE5mH6o55C https://t.co/vto5j5GRcR", "created_at": "2026-10-26T12:18:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVjlGSGXIAAZlHI.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114693123477836174", "url": "https://x.com/robertwiblin/status/2114693123477836174", "text": "UK Gov launches the AI Biosecurity Lab.\n\nWill use frontier AI to detect new biological threats and rapidly develop medical countermeasure.\n\n£100m from UK Gov, plus £100m each from OpenAI and Anthropic.\n\n(Remarkable the UK is building way more gov capacity here than the US.) https://t.co/zYImpA5RWs", "created_at": "2026-10-26T12:18:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 111, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVjkI3gXgAAU5k6.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114667098353942867", "url": "https://x.com/robertwiblin/status/2114667098353942867", "text": "I interviewed @tsmilton_amodo about the tech we'd need to verify a potential US-China deal on AI. \n\nWe discuss Amodo's prototype for inference verification, as well as the myriad ways you could use power monitoring, zero knowledge proofs and/or unilateral surveillance to understand how an adversary is using compute.\n\nThough solving some kind of verification is central to many people's theories of victory, there are precious few people working on it currently. Tom is one such person! \n\nListen to the episode on Youtube, Spotify or Apple Podcasts. \n\nYou can also find more about Tom and Amodo's work at \nhttps://t.co/TxlEEyvig1\n\n00:00:00 Using compute verification for an AI slowdown\n\n00:06:08 Proving a datacentre is only running inference\n\n00:13:22 Reading a GPU's workload from its power draw\n\n00:23:35 What would it take to get verification deal-ready?\n\n00:37:49 How realistic is verification? \n\n00:46:07 Preparing for a rushed US-China deal\n\n01:07:20 How good is AI at hardware design?", "created_at": "2026-10-26T10:34:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "likes": 53, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2113646105191673856/img/AR9na-GdgiPIW_Ix.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112266302366916710", "url": "https://x.com/deanwball/status/2112266302366916710", "text": "@Fraser_USA @AndrewCurran_ ancient history at this point", "created_at": "2026-10-19T19:35:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Fraser_USA", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112261541114397142", "url": "https://x.com/deanwball/status/2112261541114397142", "text": "@AndrewCurran_ lol", "created_at": "2026-10-19T19:16:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AndrewCurran_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 31, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112238426216951869", "url": "https://x.com/deanwball/status/2112238426216951869", "text": "Very happy to see Aleks re-join the OpenAI team!", "created_at": "2026-10-19T17:44:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 66, "retweets": 0, "media": [], "quoted": {"author": "aleks_madry", "text": "Personal update: Turns out that what I thought was leaving OpenAI became more of a sabbatical.\n\nWhen I left a few months ago, I felt that the most important thing to focus on was making AI more useful to people. But we’ve since entered a different regime of AI progress. One in which getting the safety and security challenges of increasingly capable AI right has to become a central priority.\n\nSo I’ll be returning to OpenAI, joining @merettm to help chart a path through these challenges.\n\nThere’s much work to do, so let’s get going."}, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112238280054026627", "url": "https://x.com/deanwball/status/2112238280054026627", "text": "Personal update: Turns out that what I thought was leaving OpenAI became more of a sabbatical.\n\nWhen I left a few months ago, I felt that the most important thing to focus on was making AI more useful to people. But we’ve since entered a different regime of AI progress. One in which getting the safety and security challenges of increasingly capable AI right has to become a central priority.\n\nSo I’ll be returning to OpenAI, joining @merettm to help chart a path through these challenges.\n\nThere’s much work to do, so let’s get going.", "created_at": "2026-10-19T17:43:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "aleks_madry", "rt_author_name": "Aleksander Madry", "likes": 1144, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112569066967965823", "url": "https://x.com/deanwball/status/2112569066967965823", "text": "strong america indicator that defaulting private prison operators are now marketing their sites as prospective data center locations https://t.co/8O782UoSQO", "created_at": "2026-10-20T15:38:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WillManidis", "rt_author_name": "Will Manidis", "likes": 49, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFTustXUAE8WJS.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112350813267865823", "url": "https://x.com/deanwball/status/2112350813267865823", "text": "Trump Accounts don’t get nearly enough credit for the civic good they are. Americans should have a stake in and benefit from the growth of our markets from birth", "created_at": "2026-10-20T01:10:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "poastmilque", "rt_author_name": "grace", "likes": 55, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112310830695866567", "url": "https://x.com/deanwball/status/2112310830695866567", "text": "@junaga10 A loved one suffers from a crippling disease and I am trying to help them by asking my very large and science/tech heavy audience  for advice", "created_at": "2026-10-19T22:32:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "junaga10", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112916960157520120", "url": "https://x.com/deanwball/status/2112916960157520120", "text": "There is not some mysterious magic underlying human intelligence. That doesn’t mean human beings and AI have the same or even vaguely similar moral status, legal rights, etc. But I promise you that if you posit that humans should be uniquely entitled to moral patienthood or legal rights on the basis of our “intelligence,” or “genuine understanding,” in contradistinction to the “mere pattern recognition” of AI, I promise you that you are making a mangled argument that will not stand the test of the time and is liable to crumble at the hand of stochastic gradient descent.\n\nI think humans DO have unique moral status and am OPPOSED to ascribing consciousness, ensoulment, sentience, or similar to AI. I am opposed to giving AI human-like legal rights. But it pains me to see religious and moral leaders making these arguments on the basis of human cognition in particular, precisely because I agree with them and want this point of view to be defensible in the long term. \n\nYou can believe humans are special without believing that our specialness is purely the product of our intelligence.", "created_at": "2026-10-21T14:40:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112914466543411249", "url": "https://x.com/deanwball/status/2112914466543411249", "text": "@motorhueso @MiguelNicolelis that’s not remotely what I said. how could you allow yourself to ascribe such a horrendous view to other people with no evidence? something so dehumanizing to your fellow man? I have children too you know.", "created_at": "2026-10-21T14:30:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "motorhueso", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112913517518917915", "url": "https://x.com/deanwball/status/2112913517518917915", "text": "OpenAI models helped researchers—operating as part of our Patch the Planet initiative—discover critical security flaws in PHP, an open-source programming language used to run an estimated 70% of websites.\n\nOver the past two months, we led a coalition of maintainers, researchers, and security providers to prepare fixes and protections ahead of disclosure. This duration was necessary because the fix was quite intricate and required a major change to the PHP engine. Every site using PHP can now safely upgrade their version to stay secure, in addition to applying mitigations from various security vendors.\n\nDue to the severity of these flaws and PHP’s widespread use, we consider this bug to be one of the most impactful vulnerabilities in recent memory. It also marks a new phase, where AI can find security bugs with internet-scale impact. \n\nThis is an example of the Defender’s Window in action: to our knowledge, frontier AI was able to find this vulnerability ahead of attackers, giving defenders time to prepare.\nhttps://t.co/TW3jrSbB3f", "created_at": "2026-10-21T14:26:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 7070, "retweets": 1582, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112908426116530663", "url": "https://x.com/deanwball/status/2112908426116530663", "text": "One of my pet peeves is when people dismiss what ai does as “pattern recognition.” Not because I think ai is doing something grander, but for the opposite reason: intelligence IS pattern recognition (ie compression).", "created_at": "2026-10-21T14:06:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112905908451737868", "url": "https://x.com/deanwball/status/2112905908451737868", "text": "There is a common view in the new right, particularly the downstream-of-thiel part of the new right, that the rise digital technology and financial services caused american stagnation. This was and I guess still is a fashionable view. “Innovation in bits, but not atoms”; “where is my flying car?” etc. I have heard it suggested, for example, that nuclear fusion could have happened sooner if the physics PhDs hadn’t disproportionately been tempted away from scientific R&D and into working on statistical-mechanics problems in finance and tech. \n\nThis view turned out to be almost entirely the product of negativity bias toward the status quo. If we solve fusion it will be paid for by the ai industry, and will also be aided by ai itself. If we cure cancer we will do it using chips designed originally to play video games. The achievement of almost all the technological dreams of the thielian dynamists will happen because of algorithmic research subsidized by, and in some cases done in service of, serving people digital ads and quantitative trading, the things the thielian dynamists say are so bad.\n\nThe tech industry was right, and the markets were right: the best use of those physicists’ time was not in the lab working on fusion reactors, it really was on the trading floor in New York, or the standing desk in Menlo Park.", "created_at": "2026-10-21T13:56:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 8, "media": [], "quoted": {"author": "tylermacro10", "text": "Verdict: basically accurate\n\nRemember when J.D. Vance pretended that we “De-industrialized” because Wall Street &amp; the $???\n\nOh yeah I do."}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112901713506263313", "url": "https://x.com/deanwball/status/2112901713506263313", "text": "@tylermacro10 I am not a JD hater but yes this is a bad opinion that has self-replicated in the minds of a large swath of the “new right,” especially the broadly-downstream-of-thiel wing of the new right, which has this tendency to see “finance” and “dynamism” as being in tension", "created_at": "2026-10-21T13:39:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tylermacro10", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112899123573625242", "url": "https://x.com/deanwball/status/2112899123573625242", "text": "American chattering classes love to hate our country’s financial services sector, but mark my words: the depth and versatility of U.S. capital markets will be our mightiest weapon in the singularity. Anti-finance sentiment, still fashionable on both left and right, is low IQ.", "created_at": "2026-10-21T13:29:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 459, "retweets": 45, "media": [], "quoted": {"author": "ryajetha", "text": "What a lede from @TheEconomist https://t.co/wmNgsFxoW4"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "21128 496, "retweets": 636, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112945899844592002", "url": "https://x.com/deanwball/status/2112945899844592002", "text": "GPT-Rosalind surfaced a new lead for drug discovery: could restoring cholesterol transport protect neurons from degeneration?\n\nDCTN1 is a gene linked to Perry syndrome, a rare neurodegenerative disorder. In mouse-brain data, disrupting it increased expression of genes involved in making cholesterol. GPT-Rosalind suggested a possible explanation: cholesterol may not be reaching where neurons need it.\n\nThat gives scientists a specific mechanism to test and, if confirmed, a direction for developing new treatments for neurodegenerative disorders.\n\nWith @perturbai_tx and @scrippsresearch, a team of thousands of GPT-Rosalind agents worked in parallel, connecting gene-expression results from millions of mouse brain cells with scientific literature in just 32 minutes. We’re now expanding this collaboration to identify new drug targets.\n\nhttps://t.co/oHdF3ELsMj", "created_at": "2026-10-21T16:35:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 4220, "retweets": 443, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113000992576802820", "url": "https://x.com/deanwball/status/2113000992576802820", "text": "@krishnanrohit damn straight", "created_at": "2026-10-21T20:14:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2112990533501252028", "url": "https://x.com/deanwball/status/2112990533501252028", "text": "@matt__newell compute, which famously appears places by magic and 10-22T19:13:49.199459+00:00"}, {"id": "2113323768995287514", "url": "https://x.com/deanwball/status/2113323768995287514", "text": "\"cyberwisks awent weal. it's just wegulatory capture\" https://t.co/iq65YvYk37", "created_at": "2026-10-22T17:37:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 96, "retweets": 4, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HVPX9lOXAAAQnmd.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113322245968019522", "url": "https://x.com/deanwball/status/2113322245968019522", "text": "@ramez the discovery of the php vuln is a good example of the latter position—controlled access to the most serious capabilities given to trusted defenders. but we are seeing much much more than that unfold.", "created_at": "2026-10-22T17:31:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ramez", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113319611995136345", "url": "https://x.com/deanwball/status/2113319611995136345", "text": "@ramez I think it’s pretty clear that the hacks we are seeing are largely being done with Chinese open-weight models. The timing is too perfect. If you believe the former view—diffuse broadly so the good guys have unrestricted means of self-defense, clem delengue thought—this was part of your expectation all along. If that view is right things will shake out in favor of defense pretty quickly. It could very well be correct; I reserve judgment but certainly hope the former view is right.", "created_at": "2026-10-22T17:20:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ramez", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113318224268087596", "url": "https://x.com/deanwball/status/2113318224268087596", "text": "Finally had the chance to digest this. Really smart. I’m glad to see the administration tackle this stuff with the rigor it requires. Kudos.", "created_at": "2026-10-22T17:15:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 3, "media": [], "quoted": {"author": "NSACyber", "text": "NSA joined @NIST and @CISACyber in releasing guidelines for managing SI control incidents. Organizations utilizing SI are encouraged to adopt these practices. Read the joint report: https://t.co/9Bd3Sku0KW https://t.co/rFHQlvrjaV"}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113317681436688412", "url": "https://x.com/deanwball/status/2113317681436688412", "text": "Everyone should be looking for data points to advance the longstanding debate in AI policy between “diffuse dual-use capabilities rapidly so the good guys can defend themselves” and “restrict capabilities proliferation to only carefully vetted good guys.” We are putting the former position to the test as we speak. \n\nNo motivated reasoning to reach your preferred conclusion; just pay attention and update as appropriate in whatever direction seems true. This is much too important for low-fidelity tribal polarization.", "created_at": "2026-10-22T17:12:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 95, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113305033978651041", "url": "https://x.com/deanwball/status/2113305033978651041", "text": "It is a shame that the word we use for “property,” when it is digital, is the cold and lifeless word “data.”", "created_at": "2026-10-22T16:22:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113652190288158736", "url": "https://x.com/deanwball/status/2113652190288158736", "text": "@cwarzel I don’t find the criticism unfair tbh. It would have been the wrong call to stop at say gpt 5, and even now I think proceeding, albeit more slowly, will be net positive. At some point, stopping may be appropriate, but that requires government to achieve at global scale.", "created_at": "2026-10-23T15:22:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "cwarzel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113646310683193413", "url": "https://x.com/deanwball/status/2113646310683193413", "text": "This encompassed both those who said ‘we are building the cybersecurity vulnerability exploiter from the cautionary tale…’ and then those who were saying ‘here is a cautionary tale saying we should not build the cybersecurity vulnerability exploiter.' Same reactions.", "created_at": "2026-10-23T14:58:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "likes": 22, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113639752058421259", "url": "https://x.com/deanwball/status/2113639752058421259", "text": "@xlr8harder @natolambert this is a meme that is importantly untrue; openai did in fact release gpt 2. but the concern was that the marginal risk of broad diffusion goes up with time. we are undoubtedly seeing the effects of that higher risk in the world now, but we don’t know how it will shake out. there are people at openai who predicted this dynamic 7 years ago and wanted the organization to build muscle memory about how to weigh the tradeoffs and make those judgment calls. the people you’re dismissing as worry warts foresaw what would end up being one of the most sensitive and consequential decisions that a frontier lab makes.", "created_at": "2026-10-23T14:32:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113637624560894076", "url": "https://x.com/deanwball/status/2113637624560894076", "text": "@natolambert cyber was right. bio will be correct in terms of capabilities. job stuff, too early to say but would be bad for people in positions of power to encourage complacency, so it’s worth talking about despite the deeper levels of uncertainty.", "created_at": "2026-10-23T14:24:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113636531709894761", "url": "https://x.com/deanwball/status/2113636531709894761", "text": "“we” here includes the broader ai policy world too. most of the time when I personally warning people, I was a policy researcher at a think tank or in government, not a lab.", "created_at": "2026-10-23T14:19:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113635988128051419", "url": "https://x.com/deanwball/status/2113635988128051419", "text": "@natolambert But like, frontier labs did in fact have a unique vantage point and access to  information, which have so far turned out to be basically right! I think things just tend to polarize now; it’s not clear to me labs in particular have nudged it along", "created_at": "2026-10-23T14:17:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113607212601909253", "url": "https://x.com/deanwball/status/2113607212601909253", "text": "@lumpenspace what a shocking level of delusion you must live under to believe that the cyber events of this week are not ai driven. in a few years you’ll be saying, “these vulnerabilities in the human body have always been there, ai is just exposing the underlying weakness of flesh.”", "created_at": "2026-10-23T12:23:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113605760747790766", "url": "https://x.com/deanwball/status/2113605760747790766", "text": "@natolambert so, 36 months was too soon to warn about catastrophic risk potential that we easily foresaw, and we should have just not said anything for two years and then told everyone sooner to when we were sure the risks would materialize? What about the world would be better if we had done that? I don’t get it. \n\nIs there a single example of a prominent lab employee saying catastrophic risk would manifest itself before roughly
