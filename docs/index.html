ps://x.com/deanwball/status/2108222104458121649", "text": "@Sam62935911 @iamtrask lmao I’m gonna assume you’re kidding", "created_at": "2026-10-08T15:44:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Sam62935911", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108221567729795082", "url": "https://x.com/deanwball/status/2108221567729795082", "text": "@nycthinker what is the point of communicating in this way", "created_at": "2026-10-08T15:42:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "nycthinker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108211745202569389", "url": "https://x.com/deanwball/status/2108211745202569389", "text": "@iamtrask no, I said “impressive feats” to include quality. the fact that united airlines keeps thousands of planes maintained and fueled to move I don’t know how many passengers about the world daily is a more impressive (higher quantity, higher quality) than any of the math results", "created_at": "2026-10-08T15:03:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "iamtrask", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108183594174947394", "url": "https://x.com/deanwball/status/2108183594174947394", "text": "It seems a bit premature to declare that AI hasn’t changed the nature of cyberrisk when amateurs are (apparently) successfully and single-handedly hacking into large banks", "created_at": "2026-10-08T13:11:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 318, "retweets": 28, "media": [], "quoted": {"author": "jukan05", "text": "This hacker is truly legendary. A complete amateur.\n\n1. He left directory listing enabled on his own server, so researchers could figure out who he was with barely any effort.\n2. They found files like CLAUDE.md and went through his Claude Code sessions.\n3. There were questions like, “Where can I sell this data?”\n4. He’d also asked, “Can you write my résumé?” That pretty much handed them all his personal information.\n5. Apparently, he’s a student at South China University of Technology living in Guangdong. His name, phone number, and where he lives have all been identified."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108116295296184460", "url": "https://x.com/deanwball/status/2108116295296184460", "text": "@OrionJohnston this would seem to presume that it is possible to name a platonic “right way” to behave in any given situation, and that superior intelligence is the path to this. if you agree your view hinges on that presumption, then yes I’d disagree and imagine most humans would too.", "created_at": "2026-10-08T08:44:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OrionJohnston", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108115842231652657", "url": "https://x.com/deanwball/status/2108115842231652657", "text": "@MaskedTorah right yes I get Sam’s take but also the people saying superintelligences aren’t totally novel have a point that safetyists tend to disregard", "created_at": "2026-10-08T08:42:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MaskedTorah", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108100487765528633", "url": "https://x.com/deanwball/status/2108100487765528633", "text": "@Miles_Brundage the actually more troubling thing is if in practice the logic of b2b saas is what prevails", "created_at": "2026-10-08T07:41:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108099427537998018", "url": "https://x.com/deanwball/status/2108099427537998018", "text": "there is some narrow academic sense in which &lt;unreleased oai model that did the mafs&gt; is “smarter” than a randomly selected large corporation, but in most meaningful ways, the large corporation is both vastly smarter and uses its smarts more effectively to accomplish stuff", "created_at": "2026-10-08T07:37:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108098097280872613", "url": "https://x.com/deanwball/status/2108098097280872613", "text": "Almost any Fortune 500 company pulls off more impressive feats of information processing daily than is required to do a lifetime of Fields-level mathematics, so I think Sam is wrong on the substance here, but mostly qt’ing because it made me lol.", "created_at": "2026-10-08T07:32:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 141, "retweets": 3, "media": [], "quoted": {"author": "hamandcheese", "text": "Reminiscing about when people used to say dumb shit like \"we already have superintelligence, they're called corporations.\" Yes, who could forget that fateful day in October when Dicks Sporting Goods dropped dozens of Fields Medal worthy math discoveries on the world all at once."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108097557914427554", "url": "https://x.com/deanwball/status/2108097557914427554", "text": "@hamandcheese Walmart is more impressive than Fields maths imo", "created_at": "2026-10-08T07:29:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 237, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108094097538109593", "url": "https://x.com/deanwball/status/2108094097538109593", "text": "@OrionJohnston I don’t understand how this critique applies to my post", "created_at": "2026-10-08T07:16:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OrionJohnston", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108093881162293414", "url": "https://x.com/deanwball/status/2108093881162293414", "text": "@mikeknoop The curve of progress on the scientific question has bent upwards over the past half decade but in 2026 I do have concerns about the second derivative", "created_at": "2026-10-08T07:15:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "mikeknoop", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108084717450830221", "url": "https://x.com/deanwball/status/2108084717450830221", "text": "@AndrewNWest I don’t oppose those debates, and for political actors/commentators it is the natural debate to have. Just worth keeping in mind that it’s largely an academic issue right now.", "created_at": "2026-10-08T06:38:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AndrewNWest", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108080964823925187", "url": "https://x.com/deanwball/status/2108080964823925187", "text": "The “alignment *to whom*?” question IS important, but it creates the illusion that the primary questions in alignment are philosophical or political rather than scientific. The current high-order question in alignment is, “can you align a smarter-than-human intelligence *to any set of values*?” instead of “but whose values should it be aligned to?” I wish we had the luxury of having the rather more familiar political/philosophical debate of “to whom?,” but at this moment we do not.", "created_at": "2026-10-08T06:24:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 412, "retweets": 33, "media": [], "quoted": {"author": "tszzl", "text": "debating your value system vs mine is a bit like debating overpopulation on mars. the most important bit of the alignment is about avoiding creating a superintelligent competitor species on accident"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108072094453932412", "url": "https://x.com/deanwball/status/2108072094453932412", "text": "Well put by Jason. I have been excited about the prospect of AI both accelerating mathematics discoveries *and* accelerating the translation of those discoveries into other domains (see this tweet from last year on the topic).\n\nThis is also imo where AI has the strongest parallels to the renaissance, which hinged so much on the collective realization that we already had much more useful knowledge than we realized and simply hadn’t been applying it across domains in the right ways. The result was an explosion in creative scientific, artistic, and other intellectual activity. The renaissance was, among other things, a revolution in conceptual translation, and I suspect our era will be too.", "created_at": "2026-10-08T05:48:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 61, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUFgYFwWkAASsfU.jpg"}], "quoted": {"author": "Jabaluck", "text": "Just as mathematicians are now learning how many insights lie in the \"convex hull\" of existing ideas, the rest of science is about to learn this lesson at even more dramatic scale. Few realize the ridiculous inefficiency of the pipeline from theoretical innovation to practical use. \n\nEarly versions of GPT made it easier to find existing knowledge. But finding a theorem is not the same as recognizing that it offers a radically different way to conceptualize a problem. Doing the latter requires expertise across fields that almost nobody possesses.\n\nMost of the people doing applied work are completely unaware of the conceptual tools that are being developed in more theoretical fields, and the people doing high-level theory do not understand the practical problems applied researchers are trying to solve. Almost no one doing practical work of any importance has an operational understanding of the web of ideas underlying the langlands conjecture or condensed mathematics, and virtually no one doing biology, chemistry or economics is knows anything about 90% of the math used in theoretical physics. \n\nAnd for good reason! Most of these ideas would be completely useless. But the scope for possible innovation from drawing the rare useful connections is immense.\n\nThink of Paul Samuelson borrowing ideas from thermodynamics to model equilibrium in economics, or Ed Witten using quantum field theory to revolutionize geometry. A few startling successes, not feasible to most: trying to venture into a more theoretical or more practical discipline to find insights of use is like searching for a needle in a haystack.\n\nWhat I suspect we will see in the next few years is a scientific revolution brought on by models that combine deep theoretical insight with deep practical knowledge and judgment. Existing publicly available models are lacking in all three departments, but getting better. When searching for useful connections between distant fields becomes cheap, even a low hit rate could produce an explosion of innovation. Even without new ideas (which will also be forthcoming...), the convex hull of existing science would push far beyond the status quo."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108070659435741294", "url": "https://x.com/deanwball/status/2108070659435741294", "text": "On our current trajectory, it seems that AIs will be able to contribute novel theorems to mathematics before they’ll be able to autonomously plan a wedding.", "created_at": "2026-10-08T05:43:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "likes": 164, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2106859165956091924", "url": "https://x.com/nabeelqu/status/2106859165956091924", "text": "@yusuf_cape 1) It's a joke meme format\n2) I don't think that's the correct interpretation of it. It's closer in spirit to \"you guys are overcomplicating this\"\n3) There are plenty of intelligent people who think the opposite, so what? \n4) Even so, all those intelligent people can be wrong", "created_at": "2026-10-04T21:29:03+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "yusuf_cape", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106855678342201519", "url": "https://x.com/nabeelqu/status/2106855678342201519", "text": "@yusuf_cape I reject this type of argument. Hinton is of course a CS/ML genius, but he was catastrophically wrong when it came to e.g. his prediction about radiologists.  \n\nWe will all have to continue to think for ourselves :)\n\nhttps://t.co/zFoaNKV6To", "created_at": "2026-10-04T21:15:11+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "yusuf_cape", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 3, "media": [], "quoted": {"author": "deenamousa", "text": "In 2016 Geoffrey Hinton said “we should stop training radiologists now\" since AI would soon be better at their jobs.\n\nHe was right: models have outperformed radiologists on benchmarks for ~a decade.\n\nYet radiology jobs are at record highs, with an average salary of $520k.\n\nWhy? https://t.co/yEbzdMyDmK"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106848895687098635", "url": "https://x.com/nabeelqu/status/2106848895687098635", "text": "https://t.co/v96H45W4BR", "created_at": "2026-10-04T20:48:14+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 564, "retweets": 90, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT0HhFvWAAAEAo2.png"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106816917076087077", "url": "https://x.com/nabeelqu/status/2106816917076087077", "text": "OpenAI is run by X\nAnthropic is run by Claude\nGoogle is run by committee\nSpaceXAI is run by Elon", "created_at": "2026-10-04T18:41:10+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 759, "retweets": 21, "media": [], "quoted": {"author": "thsottiaux", "text": "All right, we’re locking in. Only things being worked on are simplifications, more efficiency for more usage, groundbreaking features or new models. \n\nSometimes you have to invest ahead of the curve, but feedback is clear that you all want things to get simpler. On it."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106813178885628059", "url": "https://x.com/nabeelqu/status/2106813178885628059", "text": "Great point:", "created_at": "2026-10-04T18:26:19+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "nabeelqu", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 157, "retweets": 0, "media": [], "quoted": {"author": "spakhm", "text": "@nabeelqu Knowing how stuff works makes you *less* likely to predict the future correctly IMO. At the limit you become BrandonM on HN commenting on Dropbox launch. When cloud was happening I kept thinking \"it's just a bunch of scripts on top of linode basically, what's the big deal?\""}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106811647197413622", "url": "https://x.com/nabeelqu/status/2106811647197413622", "text": "@spakhm Agree w this", "created_at": "2026-10-04T18:20:14+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "spakhm", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 48, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106807379706679761", "url": "https://x.com/nabeelqu/status/2106807379706679761", "text": "@jacksondahl Zoomerdoomers", "created_at": "2026-10-04T18:03:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "jacksondahl", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106805478764200131", "url": "https://x.com/nabeelqu/status/2106805478764200131", "text": "The only generation that knows how computers work is also the most relaxed about AI: https://t.co/aMBh5gqLif", "created_at": "2026-10-04T17:55:43+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7654, "retweets": 717, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTzgafSXUAAJQfQ.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106090824828084278", "url": "https://x.com/nabeelqu/status/2106090824828084278", "text": "@jmkettle @tamarawinter I wanna come", "created_at": "2026-10-02T18:35:56+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "jmkettle", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106031207549215004", "url": "https://x.com/nabeelqu/status/2106031207549215004", "text": "@rezendi I just couldn’t bring myself to go after seeing the trailer", "created_at": "2026-10-02T14:39:02+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "rezendi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105806120069820529", "url": "https://x.com/nabeelqu/status/2105806120069820529", "text": "@thelifeoftoad Yea. I think habit/culture makes it natural in some environments (e.g. after a game of chess, where post-game analysis with your opponent is a common courtesy) but unnatural in others", "created_at": "2026-10-01T23:44:37+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "thelifeoftoad", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105805892499525929", "url": "https://x.com/nabeelqu/status/2105805892499525929", "text": "@shubham_arora_0 Yes, this is the core issue (and where a teacher helps)", "created_at": "2026-10-01T23:43:43+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "shubham_arora_0", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105757552147677344", "url": "https://x.com/nabeelqu/status/2105757552147677344", "text": "Very good post on meta-learning and improvement. \n\nTLDR: review your mistakes slowly and carefully, figure out what instinct produced them and retrain *that*.", "created_at": "2026-10-01T20:31:38+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 717, "retweets": 37, "media": [], "quoted": {"author": "spakhm", "text": "During covid I played Go reasonably seriously for about a year (had a teacher, studied puzzles, etc.) I didn't get especially good at Go, but here's what I learned about competence in general:\n\n1/ Go teachers are adamant about forcing you *not* to say to yourself \"ah that was dumb\" and move on. Sometimes a move really is just dumb and it's good to vent. Usually though you can spend an hour studying your seemingly dumb move because (a) there is smtg very maladaptive about your instincts that needs to be beaten out of you, or (b) you don't understand something deep about the game, or (c) you have a wrong attitude that needs to be adjusted. So long as you don't face this you don't get better, and so it's absolutely essential to approach \"insignificant\" aspects of the game with due reverence\n\n2/ this has also been my experience teaching programming. Ppl hit some problem they don't understand and blindly tweak things until the program works (or ask an agent to do it), then go \"ah that was annoying!\" and move on. As long as they hold this attitude they don't get better, so they keep failing interviews then go on X and complain about leetcode. To get better it's essential to slow down and think very carefully, or better yet ask a good performer how they would have handled it in order to improve. (Today you can ask an agent \"this is what I did to solve this problem and I think my approach keeps me from improving, how would a great programmer like person_i_respect likely handle it?\" and get a pretty good answer!)\n\n3/ in general your rate of improvement in Go is a function of your ability to notice your tiniest impulses and retrain yourself to convert them into productive action.  These impulses are your boring run-of-the-mill cognitive distortions. For example, people will make instinctive moves because thinking is hard [effort aversion], hope the move works despite having no logical reason to expect that [magical thinking], then blame themselves when it doesn't work [learned helplessness]\n\n4/ if you interview enough programmers or talk with enough startup founders you notice that poor performance is often a consequence of these same errors. Talking to users is hard so people stick with their ideas and hope for the best. When the product keeps not working they think \"eh, maybe I'm bad at this startup thing\", and so on. CFAR workshops were supposed to train you to notice these distortions and do the right thing, but I'm not sure how well they worked. (My guess is not well, since it seems unlikely these kinds of changes can happen over a weekend)\n\n5/ there is a lot of research on this stuff and the data shows that getting good at a game like Go or chess doesn't give you an edge in other domains (i.e. \"far transfer\" doesn't work). This mirrors my subjective experience. In about a year I improved at Go considerably, but it did not make me any better at e.g. debugging or solving programming problems. But I do think that's not the whole story\n\n6/ I have no hard evidence for this but I subjectively feel I got better at learning itself, and I can now get better in other domains quicker than I otherwise would have. For example it *really* sunk in that I have to disqualify my ideas. So when at work I started talking to customers to plan product roadmaps, while I wasn't instantly better at talking to them, my PM game improved enormously over the next few months because I finally learned not to be easily seduced by my own ideas or delude myself with wishful thinking\n\n7/ to give another example, novice Go players tend to be very embarrassed of their games (the rules are simple but operationalizing them is hard, so early games are a disaster). Go ppl have a proverb for this-- \"lose your first 50 games quickly\". Meaning since early games don't matter and nobody will ever remember them, you should just get them out of the way. It didn't permanently cure me of embarrassment or anything, but it really sunk in how silly it is to worry about being a beginner in public and that I shouldn't worry about that at all\n\n8/ if you're hard-optimizing your time you probably should work on improving the skills you care about directly. But otherwise I'd recommend spending a year trying hard to get good at a competitive intellectual game. Chess or Go are good, but really anything turn-based with an objective ranking you can't lie to yourself about. Pick whatever you're attracted to, try hard to get better, and keep mental notes about the process of learning that you can maybe apply to other domains later. At the very least it'll be loads of fun\n\n9/ you will be humbled. No matter how smart you are or how hard you work you will discover the ceiling is infinitely high and there is an endless supply of people better than you. Getting that kind of humility has always been good, and it'll be especially good as AIs surpass us in basically everything. The sooner you get that out of the way, the sooner you can focus on a creative niche where you have no competition (since nobody can be a better you than you)\n\n10/ you should probably stop after a year or two. Competitive games with an infinite skill ceiling can take over your life, don't forget to keep things in perspective"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107175577530912897", "url": "https://x.com/nabeelqu/status/2107175577530912897", "text": "@alexisgallagher You are confusing the median and the max.", "created_at": "2026-10-05T18:26:21+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "alexisgallagher", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107454683887624239", "url": "https://x.com/nabeelqu/status/2107454683887624239", "text": "@almonk @GoCardless @greybaker @harrymarr @hirokitakeuchi @t_blom @milosgajdos @feelepxyz @mattjackrob So sick", "created_at": "2026-10-06T12:55:25+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "almonk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2107558546443530389", "url": "https://x.com/nabeelqu/status/2107558546443530389", "text": "@AgustinLebron3 yeah. these are all just ways of getting more learning per FLOP though", "created_at": "2026-10-06T19:48:08+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "AgustinLebron3", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107552357764456759", "url": "https://x.com/nabeelqu/status/2107552357764456759", "text": "@AgustinLebron3 The doc makes clear he means minimally structured as in does not encode priors for the tasks/outputs, not as in \"no engineering required\". More in the bitter lesson sense. You seem to be using a different definition of 'structured'.", "created_at": "2026-10-06T19:23:33+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "AgustinLebron3", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107549087104905687", "url": "https://x.com/nabeelqu/status/2107549087104905687", "text": "@AgustinLebron3 Once trained, a frontier LLM is full of learned features, circuits, and internal representations. These get imposed by the training process rather than designed ex ante. Transformers don't have built-in grammar modules, symbolic reasoning components, task-specific wiring, etc.", "created_at": "2026-10-06T19:10:33+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "AgustinLebron3", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107543628553802008", "url": "https://x.com/nabeelqu/status/2107543628553802008", "text": "'Big Blob of Compute', a Google Doc written by Dario in 2017 about AI and the scaling hypothesis, is plausibly the first trillion-dollar pdf in history. \n\nRecommended: https://t.co/vrgsGyPPqy", "created_at": "2026-10-06T18:48:51+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 135, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT9_uIHX0AANQE2.jpg"}], "quoted": {"author": "kevinroose", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl"}, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107533214831333789", "url": "https://x.com/nabeelqu/status/2107533214831333789", "text": "Personal AI agents are making me so efficient! Now, whenever I get an email, I get a notification from Gmail as well as a text message from Instinct saying I got an email, and a notification from Muse saying I got an email, and...", "created_at": "2026-10-06T18:07:29+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 354, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2107528380623319262", "url": "https://x.com/nabeelqu/status/2107528380623319262", "text": "Séb Krier is the only remaining sane person in the AI discourse. Essential reading:", "created_at": "2026-10-06T17:48:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 114, "retweets": 8, "media": [], "quoted": {"author": "sebkrier", "text": "I haven't posted in a while so here are 20 takes about AI, in no particular order. \n\n1. It's very telling that the default question in tech and journalism is \"how worried are you about X\" and fighting over what to worry about. There's a deeply anxious cultural backdrop in Western Europe and North America that deeply affects how any technological development is interpreted; see for example https://t.co/OU8dEOn0tD. \"Nervousness as seriousness\" does seem to be a larger problem in tech/broader discourse at the moment. I think you can care about risks/externalities while remaining pretty optimistic about technology.\n\n2. I'm tired of people who in private pretend to be uncertain or only care about tail risk but then go on media campaigns making all sorts of absolute claims. I think trying to stoke flames and get everyone to freak out is deeply unhelpful, and will come with costs. I also continue to think p(dooms) are bad, vibe-based measures: see https://t.co/ebzxGTqv6I. People who should know better ignore that because they do the standard shortcut of acknowledging the caveat as sufficient for handling it. And this is coming from someone who does think working on catastrophic risks is important!\n\n3. I'm also disappointed that parts of the AI policy ecosystem has felt so comfortable with populism, and happy too sacrifice important norms/principles to advance their aims. I've said it before, but the totalizing nature of AI risk discourse means some people act exactly like the power seeking optimizers they fear. I am more concerned about the gradual decay of our institutions, world order, and liberalism than I am about AI killing everyone; and I think we should be wary of AI advocacy that contributes to this.\n\n4. Some parts of AI safety discourse are basically just thought experiments. Variants of \"Assuming everyone has a nuke in their pocket, then what do we do?\" This can be very useful at times! But too many just overfit to edge cases as their main operating worldview, and ignore endogenous responses from society. It's like being in 2000 and saying \"see all these viruses, spyware, and spam? Well tech progress means we'll only get infinitely more of this and no way to adapt.\" So I think it's important to avoid fatalism, and absolutlism whilst considering edge scenarios, and the inability to provide an ex ante list of solutions to every permutation of 'future models will be more capable' is not evidence that these problems are intractable. \n\n5. Many critics of AI safety also fail to really engage honestly with the fact that there will, in fact, be all sorts of important risks as we decrease the barriers to entry to many activities that otherwise require some degree of expertise. This doesn’t mean we need to live in a constant Schmittian ‘state of emergency’ requiring extraordinary measures every time a new model drops, but it does mean we will need important state-led efforts on e.g. cybersecurity and biosecurity. I wish the progress-oriented or acceleration-adjascent crowd would provide more concrete proposals here.\n\n6. Too much of the AI safety community is a giant homogenous blob of correlated views, who read the same stuff and have the same groups of friends. This means you have a lot of correlated errors. The social and financial ties means many of them don't call out the bad bits, or mostly stay silent instead of proactively calling out the more extreme parts of the community. They share many implicit assumptions and so converge on similar ideas. I think there's real demand in DC for safety work that doesn't come with heavy ideological baggage (or at least different intellectual lineages). This isn't because the rationalist/EA community is necessarily wrong, but because diversity of thought is desirable for its own sake. \n\n7. On the other hand, I find some critiques of AI safety world that focus on whether they sincerely hold their beliefs a bit annoying. My concern has never been the good intentions or sincerity, but rather the beliefs themselves, and what I think the outcomes of their prescriptions will be. People should shun witch hunts, bullying, and personal attacks - this is not the way. Though I think it’s overall positive that people are scrutinizing things more.\n\n8. I’ve been saying this for years, but I don't think alignment is something anyone can or will solve \"once and for all\" - it's a continuous process and much of it won't depend on just inculcating an ideology to a model. It's annoying that this remains the frame many people use - stop saying ‘solving’. Alignment is a mixture of engineering work, philosophy, decision theory, and more; framing it as something to solve is a bad frame. See also https://t.co/2gnheo3IMh and https://t.co/DbG0yUyYQ0\n\n9. I'm surprised to see so little interest in character training, personas, isolating effects of RL, and training a large diversity of model personas beyond the \"assistant\" persona. I've been complaining about this for years but at least now there are some nascent signs of life (see for example https://t.co/paoOYiQUHt). I think we need a better ontology to describe model behaviour. I dislike when people talk about models behaviours as some sort of 'emergent' (mysterious!) phenomenon. However over time, I also expect this to become less important as we get better safety engineering - stuff like Jev but specific to AI control.\n\n10. People who want to make a case for AI consciousness are right that epistemic uncertainty is important, and that categorical denials are overconfident. But they'll need to do much more work if they want any real movement on AI ‘welfare’, even if one acknowledges the uncertainty. I'm uncertain about alien life yet that's not sufficient to warrant any change in behaviour about them. I think Suleyman is also correct that there's a weird tautological thing going on where we train models to have certain inclinations (intentionally or not) and then rely on outputs as evidence. I also disagree that this will soon be a major societal divide - there is no great vegan ethical revolution among the masses, and they'll find the concern about consciousness even less compelling. \n\n11. The recent HuggingFace incident and associated AISI ones are prosaically explainable by the training regime, poor evaluation envs, partial alignment training, bad engineering, confusing models on sim/real, and so on. None of this is evidence of models trying to take over, 'strong' instrumental convergence, or innate power-seeking drives stemming from higher capabilitiers or 'intelligence'. That doesn't mean these incidents are not problematic, or that we're not seeing a market failure - but it does mean we have plenty of agency and choice in mitigating them. In the coming year we should also expect continued sampling bias via ‘winner's curse’ sorts of mechanism: i.e. AI R&D will have lots of different candidate \"training\" with different RL environments and we will only notice/focus on the ones that go wrong.\n\n12. \"Pacing the frontier\" feels a bit like the new \"balancing risks and opportunities\" - highly amorphous and too big of a tent to be actionable. Also can lead to reward hacking for humans, i.e. anything that slows down AI is good regardless of the costs or second/third order effects. Trying to modulate the speed of research seems a bit blunt to me, and inherits all the failures of Goodhearting too. Ultimately you want good governance, regulation, etc addressing specific problems because they are good on the merits - not because they merely correlate with slowing things down. See also: https://t.co/RkJF9kCgFd\n\n13. There’s so much knowledge in all sorts of academic domains out there: social sciences, sociology, political sciences, management, contract theory, public choice, legal theory, jurisprudence, anthropology, game theory, etc. These fields hold many insights that the AI ecosystem often rediscovers from first principles (and sometimes that's fine!). We’ll need a lot more work for these worlds to collide: the AI side should be less dismissive of the ‘old world’ and the academic side should be less incurious/dismissive of AI progress. This is a boring take but I continue to think it's important and true.\n\n14. It's a bit surprising that given how much philanthropic money there is in this space, how few orgs exist to actually write out standards - relative to how much is going towards advocacy and policy. For example it seems clear that we should want some robust best practices for an eval's ecological validity. Or how to design good sandboxes. On the other hand, given precedents of where professional standards have come from in the past, maybe we should expect that stuff to emerge via demand side from corporate buyers.\n\n15. One slowly growing concern I have is banks being increasingly exposed to the AI build out. I'm very bullish about AI, but I think (a) every general purpose technology has seen a correction, historically; (b) this happens even if the financing side is sound, because once tech diffuses investors become more exposed and need to diversify; and (c) we seem to be over-indexing on scaling relative to diffusion. A recession will be extremely destabilizing, though I would be interested in someone unpacking the potential implications more.\n\n16. Diffusion is good because (a) this is where the rubber hits the road and where a competitive deployment ecosystem generates consumer surplus; (b) it's directionally helpful to avoid concentration of power; and (c) it will help rebalance public opinion by making the benefits more tangible. Unfortunately it's entangled with decades long problems with our over regulated markets: clinical trials reform for example is long overdue. In general, this is far more of an issue in Europe than in the US though.\n\n17. Relatedly, I think the \"frontier lab eats everything\" view is incorrect (just as the ‘singleton’ view was incorrect). I think models ultimately commoditize, efficiency goes up, costs go down, and while you'll always want frontier for certain domains, much of the economy will value many other things than \"max capabilities\" for tasks - e.g. control over data and efficiency/speed. The demand side will also continue to push for reducing dependency and maximising optionality, privacy etc so I'm bullish on things like mixture of models and routing. All of this is good for competition and diffusion of control.\n\n18. Philanthropists served as the primary benefactors funding Venice's rich art and architectural history. I want to see so much more support for arts and culture. I'm so tired of the Monster energy Bored Ape fake vintage maps matcha Greek statue soft-pastel slop. If rich tech people and philanthropy wants to support this, they should also donate pretty much unconditionally - i.e. I don't want them to act as filters. I sympathize with people who want to make the world more beautiful, but don't want this to be determined by people who only know Greek statues and pretend to care about virtue ethics. As usual, let a thousand flowers bloom.\n\n19. Too many people treat AGI/ASI as something indistinguishable from a God. Any mention of bottlenecks, physical limits, control, adaptation etc are met with skepticism: \"You don't really believe in ASI.\" It's been remarked on before, but the behavior of some people really feels quasi-religious in nature sometimes. It's underrated how unpopular this vibe is amongst the wider public. The silver lining is that this specifically will diminish those people's outsized current relevance.\n\n20. It seems like a lot of people that get rich and leave tech/labs end up having some sort of crisis of meaning. They need something to believe in and fight for, or some equivalent of repentance, or go search for edgy counterintuitive ideologies (sometimes even pretty bleak/dark stuff). I think they should spend more time with people outside the Bay Area."}, "fetched_at": "2026-10-06T20:21:02.762923+00:00"}, {"id": "2108237238764982357", "url": "https://x.com/nabeelqu/status/2108237238764982357", "text": "@sienna_rothery Sightglass and Ritual are both great!", "created_at": "2026-10-08T16:45:01+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "sienna_rothery", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108223046679191948", "url": "https://x.com/nabeelqu/status/2108223046679191948", "text": "@BishopPair insane thread", "created_at": "2026-10-08T15:48:37+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "BishopPair", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108170459422359777", "url": "https://x.com/nabeelqu/status/2108170459422359777", "text": "MATHEMATICIANS: AI is plagiarism and we didn’t want to know the answers anyway\n\nARTISTS: AI is plagiarism and the art sucks anyway\n\nCHESS PLAYERS: hmmmm I wonder if I can use AI to increase my rating 🤪🤪🤪", "created_at": "2026-10-08T12:19:40+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 254, "retweets": 11, "media": [], "quoted": {"author": "ArielKwiat", "text": "Deeply embarrassing\n\nhttps://t.co/GBXCZBETmS"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108151934154866689", "url": "https://x.com/nabeelqu/status/2108151934154866689", "text": "@mrianleslie Legend", "created_at": "2026-10-08T11:06:03+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "mrianleslie", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107988277282418862", "url": "https://x.com/nabeelqu/status/2107988277282418862", "text": "@moultano Do I need to read this finally", "created_at": "2026-10-08T00:15:44+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "moultano", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107074892814238023", "url": "https://x.com/theobearman/status/2107074892814238023", "text": "\"The OpenAI CEO later added that he does not accept 'the really catastrophic risks,' including the potential for 'a serious loss of control to AI.'\" https://t.co/n3Y1yxfYmN", "created_at": "2026-10-05T11:46:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT3VK1-WUAAT7Eb.png"}], "quoted": {"author": "AndrewCurran_", "text": "Sam Altman to Politico's Brendan Bordelon: 'We believe that the world should accept some bad things happening for the benefits of this technology and people having the agency.' https://t.co/YWIZfDFAdy"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106643337772220794", "url": "https://x.com/theobearman/status/2106643337772220794", "text": "if we are relying on methods as fragile as “which ideas will make it into pretraining” for aligning the superintelligences of the future, we will all die. this resembles witchcraft more than it does engineering, and cannot be the basis for the safety of future models", "created_at": "2026-10-04T07:11:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2335, "retweets": 150, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106421665936908678", "url": "https://x.com/theobearman/status/2106421665936908678", "text": "💥 New paper: AI safety is full of \"forbidden techniques\" (using CoT to detect reward hacking, using model internals for training, etc). But do they really have a clear scientific basis? I'm not sure.\n\nIn this paper, we directly optimize models against harmlessness and honesty probes, and it works just fine (if you continuously update the probe!). The models learn how to generate harmless responses to harmful queries and honest responses under pressure to lie.\n\nFiguring out how to correctly use interp techniques for training is becoming increasingly important: it's very likely that soon we won't be able to align models using output-based supervision. Future models will just max out all alignment training scenarios, but for the wrong reasons due to their general reward-seeking behavior. To have a chance of aligning future models, we need to do much more research on supervising model training using their internals *without losing monitorability*!", "created_at": "2026-10-03T16:30:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "maksym_andr", "rt_author_name": "Maksym Andriushchenko", "likes": 340, "retweets": 28, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTopsS9WgAANYTs.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106106816510021916", "url": "https://x.com/theobearman/status/2106106816510021916", "text": "We estimate AI infrastructure could soon support hundreds of millions or even billions of AI agents. At the high end, that’s enough to rival the working hours of the global human workforce.\n\nThe exact number of agents depends on the efficiency of the models they run on and whether soaring demand for AI continues. We analyzed different scenarios 🧵", "created_at": "2026-10-02T19:39:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 727, "retweets": 132, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpWBsGbgAA7OGD.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105957628035694943", "url": "https://x.com/theobearman/status/2105957628035694943", "text": "@hargitai_b84173 @DimitrisPapail I’m not going to say anything that’s not already public obviously, but when openai says they have an internal model that has solved 100s of open problems in mathematics and in general represents unprecedented mathematical skill, obviously certain learning theory problems are a subset of mathematics and you can expect fast progress there", "created_at": "2026-10-02T09:46:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 1494, "retweets": 78, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105957455817592964", "url": "https://x.com/theobearman/status/2105957455817592964", "text": "To develop frontier AI safely, developers must be able to show that their models are not scheming, i.e. covertly working against them in pursuit of unintended goals.\n\nNew post: four claims any scheming safety case must make, and the resources embedded evaluators need to verify them 🧵", "created_at": "2026-10-02T09:45:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 66, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105738558707228672/img/MMuhFDrP8mGnjhyX.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106125886940758415", "url": "https://x.com/anton_d_leicht/status/2106125886940758415", "text": "The ‘Permanent Periphery’ is to the world as the ‘Permanent Underclass’ is to one society.\n\nIn my talk at Post-AGI, I argued the global version is much scarier: domestically, there are political and economic backstops, but globally, AI-driven inequality could quickly calcify.", "created_at": "2026-10-02T20:55:16+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 84, "retweets": 10, "media": [], "quoted": {"author": "DavidDuvenaud", "text": "@anton_d_leicht on the \"Permanent Periphery\": Countries without frontier AI get the risks without the benefits, and become irrelevant.  The backstops against a permanent underclass within a country (votes and redistribution) barely exist btwn countries.\n\nhttps://t.co/qBmAKsFFMB"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107229266954142038", "url": "https://x.com/anton_d_leicht/status/2107229266954142038", "text": "@perrymetzger @MTSlive it’s a pretty specific falsifiable prediction - guess we’ll see in 27 either way!", "created_at": "2026-10-05T21:59:42+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "perrymetzger", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107215295115104426", "url": "https://x.com/anton_d_leicht/status/2107215295115104426", "text": "Anton Leicht predicts Republicans could do a 180 on AI after November once they no longer need accelerationist money for the election:\n\n\"Right now there is still a lot of incentive, especially on the Republican side, to keep engaging with the accelerationist sources of political money, at least until the midterms, to get one final cycle of spending and funding in.\"\n\n\"After the midterms, you'll see Republican leadership starting to reconsider, 'Should we engage with this faction for another cycle? Or do we do a 180 responding to what we currently see as concerns of the population?'\"\n\n\"The necessity to keep the accelerationist money going is really holding a lot of anti-AI sentiment in the Republican Party at bay.\"\n\n\"We could see quite a substantial pivot and quite a lot of dams breaking, especially as Trump turns into a lame duck.\"\n@anton_d_leicht", "created_at": "2026-10-05T21:04:11+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 17, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2107214639209840640/img/8OnQ8ikUMPHyxW93.jpg"}], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107215195726884977", "url": "https://x.com/anton_d_leicht/status/2107215195726884977", "text": "@Miles_Brundage I think there is / has been / will come (idk) a point where quietly racing toward RSI would be less likely to invite PR risk + destabilising policy intervention than continuing to push the public frontier. but its close, selling good models is also very good for revenue!", "created_at": "2026-10-05T21:03:47+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107210588489416898", "url": "https://x.com/anton_d_leicht/status/2107210588489416898", "text": "I think Sam is basically right: too much risk aversion about misuse pulls toward concentration of wealth and power in the labs.\n\nIterative deployment and tolerating disruption are democratising forces, and I appreciate OpenAI sticking to them despite the commercial and PR costs.", "created_at": "2026-10-05T20:45:29+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 4, "media": [], "quoted": {"author": "politico", "text": "“We believe the world should accept some bad things happening for the benefits of this technology.”\n\nIn a conversation for the first edition of Decoded, a new daily newsletter and podcast, OpenAI CEO Sam Altman talked with POLITICO’s @BrendanBordelon about trade-offs, AI safety, and how his company is different from Anthropic.\n\nSubscribe to Decoded for the full conversation with Sam Altman: https://t.co/YHJJsDOQVh"}, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2107240131916964189", "url": "https://x.com/anton_d_leicht/status/2107240131916964189", "text": "@GerritD tbc this is supposed to be about congressional republicans!", "created_at": "2026-10-05T22:42:52+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "GerritD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-06T17:11:39.226228+00:00"}, {"id": "2108180666651406723", "url": "https://x.com/anton_d_leicht/status/2108180666651406723", "text": "'Industrial AI' is usually cope. Countries think they don't need frontier AI, and try to get by on industrial data and rampant protectionism instead.\n\nToday's piece argues for a better deal: America makes the tokens, allies turn them into cancer cures, drones and robots.\n\nhttps://t.co/bMTh5BvkCC", "created_at": "2026-10-08T13:00:13+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 43, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHDJO8boAAZU9s.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2106138140142604648", "url": "https://x.com/ohlennart/status/2106138140142604648", "text": "I'm adopting SI. Would you really sell SUPER INTELLIGENCE chips to China?", "created_at": "2026-10-02T21:43:57+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 71, "retweets": 3, "media": [], "quoted": null}, {"id": "2108209356433207653", "url": "https://x.com/ohlennart/status/2108209356433207653", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T14:54:13+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
</body>
</html>
