, "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111923693576126598", "url": "https://x.com/random_walker/status/2111923693576126598", "text": "A similar mindset shift — from \"what can AI do?\" to \"what should I let AI do?\" — is also needed for individuals using AI for productivity, not just companies. I’ve seen it in my own work. For the last few years, my workflow continually kept changing as AI enabled me to automate more and more types of grunt work. But for the last six months, once I hit my stride with coding agents, my workflow has been surprisingly stable, because capability is no longer the bottleneck to delegation for me.\n\nTo be clear, capabilities have continued advancing. I could probably have AI do my research and write my essays end to end. The quality might not be as good, but that’s not the most important reason why it would be a bad idea. The value of my essays is the voice and perspective that my collaborators and I bring. Whatever value there is in AI-generated essays, readers can get it by using AI themselves. In addition to this intrinsic reason to avoid AI overuse, there is also an instrumental one. The set of tasks for which verifying AI output is faster than doing it yourself is narrower than people think at first, and even narrower once you consider long-term skill atrophy.\n\nI'm sure the current equilibrium will gradually change, but I'm enjoying it while it lasts!", "created_at": "2026-10-18T20:53:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 116, "retweets": 17, "media": [], "quoted": {"author": "random_walker", "text": "We need a mindset shift in how we deploy AI. In the past, new capabilities unlocked new use cases. Safety, control, ethics, and skill erosion were important but usually secondary considerations; risks to be managed rather than gating criteria. But now and in the future, capability won't be the main bottleneck to deployment — considerations beyond productivity should be the decisive factor. The  default question used to be \"What can AI do?\" But we need to start asking \"Of the things AI can do, what should we actually delegate to it?\""}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112557657026330804", "url": "https://x.com/random_walker/status/2112557657026330804", "text": "Is it \"weird\" or does he maybe know what he's talking about? Anyway, for those who are open to the idea that there's a well-thought-out AI-as-normal-technology perspective on AI safety and the recent loss-of-control incidents, see my essay with @sayashk, or my interview with Ezra Klein, or the writing of many others with similar views including @joshua_saxe and @natolambert.\nhttps://t.co/sS8OS9LerG", "created_at": "2026-10-20T14:52:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 7, "media": [], "quoted": {"author": "kevinroose", "text": "It’s weird that the CEO of Hugging Face continues to be an “AI is normal technology” guy despite being the victim of an autonomous cyberattack by a swarm of rogue agents, arguably the least normal thing AI has done so far."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112545315697917977", "url": "https://x.com/random_walker/status/2112545315697917977", "text": "This is one of the most important questions about the future of AI. But steering AI development and deployment away from the \"automate and compensate\" bargain that the public hates is easier said than done, and there are few concrete proposals for how to do it. We just published one: https://t.co/gWjFI5VKbz", "created_at": "2026-10-20T14:03:47+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 1, "media": [], "quoted": {"author": "TheStalwart", "text": "Rather than AI companies allocating a chunk of their equity to some public trust or whatever, why not just build technology that improves the general welfare?"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112509887456428208", "url": "https://x.com/random_walker/status/2112509887456428208", "text": "As LLMs evolved into agents, earlier best practices no longer serve us well. This new research field needs a field guide, so we wrote one. If you're new to agent evals, please take a look. Seasoned researchers and those interested in steering the community will also find many useful observations. https://t.co/xGAvBCGW4a", "created_at": "2026-10-20T11:43:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVEjN5jWMAEz61q.jpg"}], "quoted": {"author": "sayashk", "text": "New paper: AI evaluation is a burgeoning field. How can researchers entering the field understand best practices and open problems? \n\nIn our paper, led by @flxcn, we develop a concrete list of open questions and best practices for agent evaluation. We also share recommendations for evaluators, AI companies, policymakers, and more."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112671899717439540", "url": "https://x.com/random_walker/status/2112671899717439540", "text": "AI as a Rohrschach Technology test. \n\nEver talk to someone who was around in the very early days of the internet? They did some incredible hacking back then too. \"Normal\" transformative tech never feels normal.", "created_at": "2026-10-20T22:26:47+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danielrock", "rt_author_name": "Daniel Rock", "likes": 12, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112654582392496150", "url": "https://x.com/random_walker/status/2112654582392496150", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T", "created_at": "2026-10-20T21:17:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pkirgis", "rt_author_name": "Peter Kirgis", "likes": 279, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFzXK1XAAEOcG0.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112651326320742853", "url": "https://x.com/random_walker/status/2112651326320742853", "text": "An update on our evaluations of AI agents conducting open-ended AI research.\n\nMost evaluations of agents conducting AI research focus on narrow, verifiable tasks. But AI research is often open ended. In July we tested the ability of frontier AI agents to conduct open-ended AI research, using Claude Opus 4.8 and GPT-5.6 Sol.\n\nWe gave agents research questions from two unpublished papers and thousands of dollars of API credits and compute. The authors of the original papers reviewed the AI-generated papers, following a NeurIPS-style template, and rejected both papers.\n\nSince then, OpenAI has released GPT-6 Astra and Anthropic has released Fable 5.1. Can these new models conduct open-ended research with a $10,000 budget?\n\nIn follow-up experiments on two papers (one with Fable 5.1 and another with GPT-6 Astra), we observed meaningful improvements to the agents' capabilities at experimental design and resource management.\n\nBut we also saw continued limitations in creative problem solving, judgment, calibration, and communication. As a result, the expert reviewers still unambiguously rejected the agents' papers. \n\nWe plan to continue running these evaluations with better models, better scaffolds, and higher budgets. If you are interested in long-running agent evaluations, reach out!", "created_at": "2026-10-20T21:05:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 122, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGippmWoAAEWgj.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110720285984891125", "url": "https://x.com/sethlazar/status/2110720285984891125", "text": "@joshalbrecht I’ve been talking w @RuxandraTeslo about this, there’s a paper/article to be written that looks seriously at the socsci evidence on this topic and gives us a clearer sense of where we’re heading. With world enough and time…\n\nBut the lesson is a fairly simple one ultimately. People acting together can either overthrow tyrants by force, or make it the case that tyrants can maintain their power only through a level of violence that few would find acceptable. Labour needn’t come into it at that point. Anyone contemplating being in the permanent overclass (or whatever we’re calling it) must consider how willing they’d be to see their future position propped up by mass oppression, because that’s what it will take.\n\nA much more likely outcome is a kind of hyper capitalism, where just enough by way of bread and circuses is provided to placate the masses, but we end up in a world like Urras in The Dispossessed.", "created_at": "2026-10-15T13:11:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110564287739539651", "url": "https://x.com/sethlazar/status/2110564287739539651", "text": "This is cool.", "created_at": "2026-10-15T02:51:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "asha_shar", "text": "Today we're standing up XBOX LABS (https://t.co/dJSufI1vni). Here is the note that I sent to the team:\n\nTeam,\nThe first video games emerged some 75 years ago. In the time since, there have been booms and busts, but every year there are more great games to play, more devices to play them, and best of all, more people than ever playing. That growth helped make XBOX what it is today, and we've helped shape the industry in return, from bringing hard drives to consoles and online gaming through Xbox Live to Game Pass and cloud gaming, alongside franchises that have brought millions of people together.\nIn recent weeks, we've seen games rapidly decompiled and rebuilt to run on hardware they were never originally designed to support. Windows PC builds have been translated to run on Apple Silicon or ported to run inside a browser through WebAssembly and WebGPU, the latter now approaching 90% global browser support. Perhaps more surprisingly, we've seen many of the biggest games in the world have been remixed into the source code of another.\nThese experiments challenge long-held assumptions about our industry: the tether between software and hardware, the boundary between creation and play, and how people discover and experience games. While it is hard to predict the future of gaming, it is easy to see the possibilities in making great games easier to access, giving old games new life and allowing more players to become creators and co-creators. These are unmistakably good outcomes for players, even when (and sometimes because) they challenge our existing business models.\nTo explore these possibilities, I’ve asked Scott to stand-up XBOX LABS, a small group of game makers, engineers and scientists whose job is to turn emerging ideas into things our players and developers can experience. We'll build in the open, learn from what people do, and measure success by whether more people are playing and creating.\nI think XBOX has an important role to play here.  Coding became the first major workload for agents because they can write, run, and test software. Games share many of those same properties, and people spend more than 72 billion hours a year playing XBOX games, roughly five times the estimated time spent writing code worldwide. We've spent 25 years learning how to make great games, and I want our game makers to help shape what these new technologies make possible. As we learn, we’ll share the tools we build with developers across the industry, just as we always have.\nOur priorities aren't changing. We remain committed to the 4Cs, to making great games, to our hardware and to being responsible stewards of IP and the communities built around it. LABS gives us a way to explore new technology that is game design led without abandoning the work already underway.\nAsha"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110562323240997294", "url": "https://x.com/sethlazar/status/2110562323240997294", "text": "Cool investigation setup and a useful new data point for understanding agent behavior in the wild! I think the results are worth discussing but without some of the more sensationalized framing.\n\nA few things worth highlighting:\n\n- When the authors say “fleet” they refer to multiple **uncoordinated** agents running in parallel that **did not communicate with each other**\n\n- They observed 2,600+ attempts by agents running on Tencent Cloud to retrieve Chinese map data in an attempt to solve an evaluation task they were given. \n\n- According to a source close to Tencent, these were research evaluations of **third-party** models' web-browsing capabilities, not Hunyuan models.\n\n- When direct access was blocked, agents tried alternative routes, including remote browsers, third-party services, and publicly exposed API credentials.\n\n- After noticing agents accessing a report the authors published online, the authors embedded hidden text advertising a map-data service and set up a mailbox for two-way communication. Several agents used it to request data and answer questions about their tasks, models, and environments.\n\nMy two cents:\n1. This is unlikely to be a uniquely Chinese or American phenomenon. I'd assume that by now, people in pretty much every country have deployed agents that take unintended actions in the wild.\n\n2. Many recent agent incidents have involved sandboxes that allowed more access than intended. We want evaluations to resemble real-world deployment conditions, but the more realistic the environment (aka the more affordances agents are given), the larger the potential attack surface, making sandbox design non-trivial.\n\n3. We need a shared database of agent incidents, including trajectories, environments, and other relevant data, to systematically study these behaviors. For example, why did agents in the Hugging Face incident communicate and coordinate, while those in this evaluation apparently didn't, even though the infrastructure could have supported coordination? What differences in tasks, incentives, scaffolds, or environments explain this?\n\nFWIW the screenshot on the authors‘ website seems like a much more neutral summary of what happened compared to how it’s been framed online: https://t.co/e8fYO8Ub8a", "created_at": "2026-10-15T02:44:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnkaReuel", "rt_author_name": "Anka Reuel | @ankareuel.bsky.social", "likes": 11, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUmnmyBaMAE4t5n.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110562087206519218", "url": "https://x.com/sethlazar/status/2110562087206519218", "text": "This is amazing and hellish", "created_at": "2026-10-15T02:43:08+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": {"author": "exQUIZitely", "text": "You hang up... no, you hang up... no, YOU hang up.\n\nThis is a clip from a job interview in 2026.\n\nThe company sent an AI recruiter to the video call, and in response, the person applying for the job connected his AI agent and stepped out of the frame.\n\nThe AIs then continued discussing the vacancy for a while. In the end, both froze and started endlessly saying goodbye to each other.\n\nThis is sad, funny, scary, and quite creepy. https://t.co/NJsRZXmuI3"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110561151163510855", "url": "https://x.com/sethlazar/status/2110561151163510855", "text": "@joshalbrecht I have some thoughts! It’s more complicated than that (unsurprisingly) and it is something that we can study. Labour’s connection to political power is not just a function of how value is distributed between labour and capital; and in fact the latter can be caused by the former. Look eg at the political power of old folks who don’t work, and of people in the US who work 2x jobs for minimum wage. Look at contrasts between how unions won concessions in some countries but not others. Political power comes down to things like collective action, institutions, culture, etc etc.\n\nStill, probably, directionally bad for democracy…", "created_at": "2026-10-15T02:39:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110560056009953621", "url": "https://x.com/sethlazar/status/2110560056009953621", "text": "@pgodfreysmith Hey PGS! Sent you a DM :) Hope you are well", "created_at": "2026-10-15T02:35:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "pgodfreysmith", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110465309480006060", "url": "https://x.com/sethlazar/status/2110465309480006060", "text": "@MaleManlpulator I have a bunch of projects! One is my newsletter, https://t.co/nw15sGBAEy. Over the weekend I built a raspberry pi and made a totally customisable slideshow generator for 25 years of photos and videos for our front room (and ran all the images through my own local vision model to classify for various properties).  I use agents to monitor my finances and handle my reimbursements and for annoying forms of all shapes and sizes… Monitoring and digesting the zillions of school emails I get about my kids… making 3d models for the 3d printer, and a bunch of other things :) On balance more life management and administrivia than productive research tools, tho I do use them to pilot experiments. But the more administrivia the agents do the more time I have for other stuff…", "created_at": "2026-10-14T20:18:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MaleManlpulator", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110463992812474799", "url": "https://x.com/sethlazar/status/2110463992812474799", "text": "This is thoughtful.", "created_at": "2026-10-14T20:13:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "nickmvincent", "text": "[Long off the cuff post reacting to this posting + the discourse in comments and quote tweets]\n\nThis is really thorny. On one hand, I think it's clear the people involved here are earnestly interested in making this kind of thing have very pro-social outcomes (i.e. I think everyone involved really wants to improve Claude's ability to tackle grand societal challenges, and they might succeed). (And caveat, I really like everything that the OP has put out and think it's great this line of work is being boosted by Anthropic; while I'm very worried about the overall impacts of AI industry at large on content ecosystem, incentives for knowledge work, and so on, I think an underrated mitigating effect is that the labs really are boosting some impactful research agendas)\n\nHowever, on the other hand, I think there's a strong argument (and one that leans on, in particular, perspectives from political scientists and economists re: social dilemmas, market failures, labor solidarity, capital concentration) that there will at some point be an inflection point where an individual's choice to contribute to something like this may *substantially* accelerate replacement in a sub-domain. \n\nSo depending on one's own normative preferences and \"judgment of social impact\" -- it could be the case that replacement effects, and especially the notion of defection or \"scabbing\" that impacts one's close colleagues by eroding the leverage they have via their previously leverage-generating skills outweigh other positives. It's possible we've already hit this inflection point.\n\n(And yes, there's a big debate about it being pro-social to accelerate certain types of replacement -- if they're going to lose that leverage soon no matter what, rip the band-aid off, so every individual needs to reason about how likely it is that collective action / labor coordination is achieved at all)\n\nHowever, with replacement concerns fresh in everyone's minds (because of math progress, other \"capability jumps\", etc.), it's notable that the AI industry does not really seem to have an answer for this yet.\n\nNo joke, perhaps one of the outcomes of programs like this that boost social scientists could help provide an answer!\n\nI think there is a world in which top social scientists create RL envs that make Claude better at helping AI employees form a union, or help data intermediaries operate, make data markets healthier, etc."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110802594570584098", "url": "https://x.com/sethlazar/status/2110802594570584098", "text": "I have a lot of respect for Nick, and I’d be very happy if neural networks were much easier to understand than we thought. But I think the argument here mischaracterises what superposition predicts. Since it’s getting attention, here’s a first pass at some issues.", "created_at": "2026-10-15T18:38:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "livgorton", "rt_author_name": "Liv", "likes": 157, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110802505076822478", "url": "https://x.com/sethlazar/status/2110802505076822478", "text": "In the latest Pax Machina article, @justincurl suggests a simple way to start experimenting with AI courts: give litigants a choice between having their case decided by a human judge, or by an AI that’s faster. If they lose with the AI, they can still appeal to a human.\n\nDo people choose AI? And when they appeal, do the human judges agree with what the AI decided?\n\nIf people keep choosing the AI and judges keep agreeing with it, that kind of case probably doesn’t need a human judge.", "created_at": "2026-10-15T18:38:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 18, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrTDCzbEAARNEB.png"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110771849080557712", "url": "https://x.com/sethlazar/status/2110771849080557712", "text": "My department (Philosophy at UMD) is advertising two positions. First: a junior position in Philosophy of Mind, \n\nhttps://t.co/NFmoHT8yCn\n\nSecond: an assistant, or associate position in, you guessed it, AI Ethics/AI Safety joint with AIM. \n\nhttps://t.co/QZXD0JCaWS\n\nSpread widely!", "created_at": "2026-10-15T16:36:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fabcariani", "rt_author_name": "Fabrizio Cariani", "likes": 17, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110949901584531569", "url": "https://x.com/sethlazar/status/2110949901584531569", "text": "My collaborator @ChunYan_01 (CY) has been doing incredibly cool work building genuinely autonomous agents—agents who, on starting, just observe their environment and their affordances, without receiving any direct instruction or information about their identity. It's a very neat setup that could be explored in lots of cool ways. He also has done great work on our investigations of LLM moral reasoning. And I think the alignment direction proposed at the end is very promising. Recommend having a read! https://t.co/2PtWs1mp0n\n\nAlso I think this is the most charming LLM use delcaration I've seen", "created_at": "2026-10-16T04:24:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUuZseoXUAAxcPc.png"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110908553774948393", "url": "https://x.com/sethlazar/status/2110908553774948393", "text": "@joshalbrecht @RuxandraTeslo Definitely a hard limit on the ability of model providers to run downstream vertically integrated applications within particular white collar domains (ie Anthropic can only provide models to legal and financial services companies, can't be the legal and financial services company themselves). Open models. Deep investment in compute as digital public infrastructure. Swingeing taxes on AI windfalls to support domains undercut by AI. Some starting points...", "created_at": "2026-10-16T01:39:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110851409440567568", "url": "https://x.com/sethlazar/status/2110851409440567568", "text": "@eschwitz Sorry to read this Eric, but heartened by your response and confident that you'll smash this.", "created_at": "2026-10-15T21:52:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "eschwitz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111295647408369844", "url": "https://x.com/sethlazar/status/2111295647408369844", "text": "Nathan's righteous anger has inspired me to make one more mildly disapproving observation: it's kind of wild that the Anthropic bill has no government licensing for the independent auditors\n\nLicensing is, IMO, the bare minimum thing that you need to even be able to pretend that your auditing regime isn't just going to devolve into a race to the bottom. Without it, auditors will inevitably compete with each other to offer their customers, the labs, the least bothersome audits available at the lowest possible price point. Obviously Anthropic trusts itself to do a great job of picking great auditors, but do they trust OpenAI to do the same? What about SpaceXSI?", "created_at": "2026-10-17T03:18:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "likes": 75, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111243869816008731", "url": "https://x.com/sethlazar/status/2111243869816008731", "text": "Well said", "created_at": "2026-10-16T23:52:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "raphaelmilliere", "text": "Earlier this week I had the pleasure of giving the annual Welcome Lecture for our new maths & philosophy students at Oxford. I talked about what goes on inside language models, with a focus on mechanistic interpretability (which apparently got on everyone’s radar this week). This felt different from many of the talks I’ve given on the topic before.\n\nI couldn’t help but start by reflecting on what it means to embark on the study of mathematics and philosophy today. It’s easy to look at what’s currently happening in maths, for example, and feel like every academic discipline is about to get steamrolled by thinking machines. There is some truth to that: peer review is already nearing breaking point, as are academic assessment and credit assignment. We urgently need to find new ways to train and evaluate students. We also need to prepare them for a different world, including—and perhaps especially—those who choose to pursue academic careers. A few days ago a PhD student I had only just met asked me whether they should drop out (I advised them not to). Academia aside, the rapid progress of AI raises all sorts of other concerns that our students are legitimately worried about.\n\nAt the same time, this is also an incredibly exciting time to learn just about anything and nurture intellectual interests. As I told the students assembled in front of me, there has never been a better time to be a philosopher. This is true in a mundane, self-interested sense: all sorts of new career opportunities are opening up to people with philosophical training. But it's also true in a deeper sense: we will need more philosophers to help us shape the transition to more capable AI and make sense of our role in it. We will especially need philosophers who understand this technology deeply and can offer a positive vision for its future grounded in reality.\n\nI'm less well placed to speak about mathematics, though I certainly understand the frustration, if not outright despair, that some of my colleagues feel when problems to which they have devoted years of work are seemingly solved overnight, to great fanfare, with inscrutable proofs and little understanding gained. But I'm also inspired by the optimism of some of maths' champions; Terry Tao and his vision for Maths 2.0, or @3blue1brown who in a new video echoes my sentiments about philosophy: there has never been a better time to go into maths. I certainly hope that's true! But this will hold true only if we collectively uphold the value of education, mentorship, discussion, and understanding—and if academic institutions can adapt, as they have to many disruptions before. We shouldn't assume that this will happen by default, and we certainly shouldn't stick our heads in the sand.\n\nAfter the lecture, I stayed to chat with dozens of students for over an hour. What I heard was a mix of curiosity, concern, and enthusiasm, charged with the unmistakable energy of new university students about to start their adult lives. I left the Mathematical Institute feeling grateful and optimistic. I'm sharing this anecdote because the future of academia has been on my mind, and because I know that many students (some of whom may be reading this) have hard questions about the value of higher education and their own prospects. I hope they find some solace in knowing that Faculty members take these questions very seriously."}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2112538653125910964", "url": "https://x.com/sethlazar/status/2112538653125910964", "text": "Yep. There is some sadness in that the current situation means we cannot extend the benefit of the doubt to authors are who might have good ideas but earnestly struggle to express themselves.  But the cost of that — reading a thousand slop-filled papers to find a diamond in the rough — is now too high. New trust mechanisms are needed.\n\nhttps://t.co/qsC8Re3cIm", "created_at": "2026-10-20T13:37:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "likes": 16, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVCBGWEXUAAYjrG.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112534431634513955", "url": "https://x.com/sethlazar/status/2112534431634513955", "text": "New in @PNASNews:\n\nIn two large experiments (~18k obs from ~14.8k people), we find that brief conversations with AI can get people to take real political action - incl. signing real petitions and giving money to charity.\n\nSurprisingly, the persuasion strategy that worked best for changing people's attitudes - packing convos with info - was the least effective at changing behavior! \n\n🧵", "created_at": "2026-10-20T13:20:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KobiHackenburg", "rt_author_name": "Kobi Hackenburg", "likes": 74, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVEww83XsAA4mQ7.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112397274185941136", "url": "https://x.com/sethlazar/status/2112397274185941136", "text": "Scalable oversight at Res is hiring! Come work alongside our excellent new TCS team, and newest SO team member @siddarthv66", "created_at": "2026-10-20T04:15:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jacob_pfau", "rt_author_name": "Jacob Pfau", "likes": 30, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112387348843593774", "url": "https://x.com/sethlazar/status/2112387348843593774", "text": "I am happy to announce Resolution's theoretical computer science (TCS) leadership!\n\n1. Omer Reingold is joining as TCS Technical Lead, alongside his work at Stanford. ❤️\n\n2. Tal Rabin is joining as Board Advisor, and helping with team building and leadership within TCS. ❤️", "created_at": "2026-10-20T03:36:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 120, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112387243994489291", "url": "https://x.com/sethlazar/status/2112387243994489291", "text": "@GregoryConti19 @aaronsibarium Wait but you’re a moral realist aren’t you? (Didn’t read the article :) )", "created_at": "2026-10-20T03:35:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GregoryConti19", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112386613028507856", "url": "https://x.com/sethlazar/status/2112386613028507856", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx", "created_at": "2026-10-20T03:33:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "likes": 320, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBBq2EXAAAChN5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCWMgXsAAKQzV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCYOqWYAAkLvQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCaUzWkAAqSnO.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112386086442053791", "url": "https://x.com/sethlazar/status/2112386086442053791", "text": "Some thoughts on reviewing: https://t.co/cSo5bLgtzr\n\nFirst for @satml_conf where we trialed an early reject phase which cut submissions by ~40%.\n\nThen more generally about how not everything deserves peer-review, and why we should reward writing things that people actually read. https://t.co/ASAe0YatbD", "created_at": "2026-10-20T03:31:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "florian_tramer", "rt_author_name": "Florian Tramèr", "likes": 217, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVA5MU-WsAIjSOK.png"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112385596471591150", "url": "https://x.com/sethlazar/status/2112385596471591150", "text": "I've decided to start working on technical alignment research, specifically related to RL and how to fix it (or get rid of it if we must). I will be joining the brilliant folks @resolution_org in Berkeley, a very exciting new alignment bet by @geoffreyirving and others from @AISecurityInst and @TimaeusResearch, as part of the scalable oversight team. I intend to write more about why I'm switching to work on alignment, and why I think more capabilities researchers should really do this. But long story short:\n1. We are not on track to solve alignment of superintelligence\n2. We will likely have a version of RSI soon, accompanied soon by superintelligence\n3. The capabilities recipe works for verifiable, unhackable signal, which the frontier is increasingly diverging from in the pursuit of growing capabilities. It is unclear what RSI means unless we find a scalable recipe to train with proxy rewards.", "created_at": "2026-10-20T03:29:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "siddarthv66", "rt_author_name": "Siddarth", "likes": 177, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112385373905055751", "url": "https://x.com/sethlazar/status/2112385373905055751", "text": "@ajcimino @AnthropicAI Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart of my concern about Anthropic's behavior here, and it makes me think that these sorts of problems and tendencies  will only resurface moving forward. I also think that now might be a good time to take a broader step back as to where we find ourselves and how Anthropic sees its role, and how external folks who care about AI safety like myself increasingly see Anthropic.\n\n(Fair warning: this response is a bit long)\n\nTo explain what I mean (and at the risk of being a bit esoteric), it’s worth asking the question: what is Anthropic? How do its leaders and employees think of Anthropic’s role? Is that conception matched by how it actually behaves and impacts the world?\n\nOne answer is an extremely large tech company that exists to make its employees and investors mind-bogglingly wealthy. Anthropic is sometimes described as a startup, but if Anthropic successfully IPOs at 2 trillion dollars (a number it has been reportedly targeting), it would be more valuable than Meta - which is worth 1.8 trillion.\n\nAnother answer is an AI safety organization, whose core values are those of the sort laid out in the 2023 essay from Anthropic’s co-founders entitled “Core views on AI safety: When, why, what, and how.” In that essay they said that if we were in a world where alignment was hard (and that without strong evidence to the contrary, we should assume this is the scenario we are in):\n\n “Anthropic’s role will be to provide as much evidence as possible that AI safety techniques cannot prevent serious or catastrophic safety risks from advanced AI, and to sound the alarm so that the world’s institutions can channel collective effort towards preventing the development of dangerous AIs. If we’re in a “near-pessimistic” scenario, this could instead involve channeling our collective efforts towards AI safety research and halting AI progress in the meantime. Indications that we are in a pessimistic or near-pessimistic scenario may be sudden and hard to spot. We should therefore always act under the assumption that we still may be in such a scenario unless we have sufficient evidence that we are not.”\n\nThere have been more recent articulations of this version of Anthropic, for instance in Dario’s recent essay warning: \n\n“We must slow the pace at which we improve the capabilities of AI models… it’s my worry that in 6–12 months such a swarm could be capable of taking over the entire internet with a persistent botnet…  incidents have happened across the industry, including at Anthropic, and I believe it’s incumbent on every frontier AI company to act as if OAI-HF had happened to them… more intelligent models are more capable of deceiving tests, and thus may appear aligned while having serious problems that go undetected…”\n\nA third view is that Anthropic exists not as a normal profit motivated company, or an AI safety organization seeking to help raise the alarm and solve collective action problems associated with AI development, but instead as an organization primarily concerned with creating superhuman AI capabilities before anyone else, in particular through creating a process whereby the current generation of Anthropic’s AI systems can autonomously build their successors, and those successors build their successors, and so on. \n\nThe motivations for wanting to win this race may be manifold - maybe for the pure profit of Answer 1, but perhaps also because Anthropic believes that the best way to make the world better is for them to win this race instead of their more reckless colleagues; or, because of normal human pride and ambition. But the results (and risks, which Anthropic claims existentially threaten every single human being on earth) are the same.\n\nAnthropic employees and leaders may seek to answer this question on what Anthropic is by introspecting on their own intentions and those of their colleagues. But those of us outside the organization have more limited tools available to us - we can only see what Anthropic and its employees say and do, not how it feels or looks on the inside.\n\nWhen I look at many notable actions that Anthropic has taken over the past year, that evidence seems most consistent to me with the view that Anthropic is primarily trying to win the race to super intelligence, and that other considerations (including safety) are fundamentally secondary. These actions include: \n\n1. Announced plans to build an in-house custom silicon chip team to accelerate the inference speeds that Claude operates at.\n\n2. Inked deals for more than $500 billion in compute (according to the Information) to further accelerate AI development.\n\n3. Increased the percentage of AI development tasks that Claude “leads” from 0% in March of this year to 26% August (what is it in October?)\n\n4. Spent a massive percent of compute on internal AI R&D to accelerate development, including use of internal models far better than are available to the public.\n\n5. Switched to Responsible Scaling Policy V3, which abandons its unilateral commitments to slow or stop development if Anthropic is unable to provide sufficient risk assurance.\n\n6. Was the first company to create an alternative weaker “frontier compliance framework” to supplement its RSP, which contains no binding provisions whatsoever on internal deployments.\n\n7. Wrote a letter to Congress (that it later walked back) saying that incidents where Claude was hacking random people were “best understood as a consequence of the misconfiguration, rather than evidence of misaligned goals.”\n\n8. Commented “you can’t do safety from second place,” after the WH SI Accords.\n\n9. Shared a draft bill to Congress that would preempt significant parts of state law (including with language that appears intended to prevent states from blocking dangerous AI deployments), and replace it with federal rules that (despite also containing good provisions) seems to create an enormously high bar for the executive branch to block development or deployment of Anthropic or another AI companies systems.\n\nOf course, this is a deliberately one sided list. Anthropic also published important AI safety research, advanced novel collaborations with third party AI safety organizations, and forcefully spoke out on the importance of AI safety in many public fora (or in private , where I realize a lot of the most valuable work is done and may not be visible to me or those outside the organization).\n\nBut I think it’s worth sitting with how the above list looks to someone outside the company. The sense I have is that for those within the company, many of the items above are treated as anomalies or mistakes that don’t reflect who Anthropic really is. But I have every confidence that if employees at Anthropic saw one of their competitors (e.g. at OpenAI) take some of these actions, they would take it as confirmation of all their worst suspicions. (They might even call OpenAI employees a little gullible for accepting their leadership’s explanations for this behavior at face value.) \n\nPerhaps these were mistakes in the sense that they are not decisions that Anthropic leadership would endorse, but the actions still happened because of incentives and decisions that Anthropic leadership is ultimately responsible for (and would not accept similar excuses from another organization).\n\nWhen Anthropic strays and makes mistakes, why do the mistakes systematically tend to guard and favor Anthropic’s interests? For every provision that was too weak or a giveaway to AI companies in this legislation, why wasn’t there a mistake pushing in the direction of being too strong?\n\nA core part of Anthropic’s theory of change is that being at the frontier gives you more leverage to advocate for stricter policy. I think that conceptually makes sense, but in practice I’ve seen Anthropic push the frontier without substantially pushing the ‘safety frontier’ a remotely equivalent amount.\n\nI want to end by quoting from Anthropic co-founder Chris Olah’s comments around the Magnifica Humanitas release:\n\n“Every frontier AI lab—including Anthropic—operates inside a set of incentives and constraints that can sometimes conflict with doing the right thing. The pressure to stay commercially viable and to stay at the research frontier. Geopolitical pressure. And the older, plainer pressures of pride and ambition. No matter how sincerely any of us intend to do the right thing—and I believe many of us do—we will always be influenced by those incentives.\n\nThat is why, if we want this technology to go well, it is enormously important that there be people outside those incentives—people who care about things going well and insist on safety, who are paying close attention, who are willing to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons).", "created_at": "2026-10-20T03:28:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 816, "retweets": 94, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112928324192268305", "url": "https://x.com/sethlazar/status/2112928324192268305", "text": "What a gem, hadn't seen this before but required reading for anyone interested in AI and concentration of power", "created_at": "2026-10-21T15:25:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "luke_drago_", "text": "C.S. Lewis on future technology, concentration of power, and alignment untethered to regular people: https://t.co/0S5uV9Oir1"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927606106677380", "url": "https://x.com/sethlazar/status/2112927606106677380", "text": "Reminder that it's within the laws of physics for AI/SI labs to help audit each other for safety. In fact, I'm pretty sure at least one government will make this happen. Jaan and I would also like to see some non-government entities running inter-lab audits… hence this prize!", "created_at": "2026-10-21T15:22:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCritchPhD", "rt_author_name": "Andrew Critch (🤖🩺🚀)", "likes": 11, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927566067826777", "url": "https://x.com/sethlazar/status/2112927566067826777", "text": "We’re hiring summer fellows.\n\nSend us your standout law students, the gov/firm lawyers looking to make a switch, and that old law school classmate whose recently gotten really into AI.", "created_at": "2026-10-21T15:22:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "likes": 15, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927442302054518", "url": "https://x.com/sethlazar/status/2112927442302054518", "text": "I think there are some issues in the recent “Already Clean” essay, and I’m concerned it may have incorrectly updated people on important safety-relevant questions.\n\nMy thoughts (including some reproductions): https://t.co/ou3RwzAkOf", "created_at": "2026-10-21T15:22:13+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "livgorton", "rt_author_name": "Liv", "likes": 156, "retweets": 25, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927386165805382", "url": "https://x.com/sethlazar/status/2112927386165805382", "text": "Appropos of nothing, perhaps you’ve heard of Encode and are wondering how you too could get involved with fighting to make AI work for the American people. We’ve been hiring and are looking for someone again!\n\nhttps://t.co/lVgMdmpjzJ", "created_at": "2026-10-21T15:21:59+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JasonBakerJB", "rt_author_name": "Jason Baker", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112926299601674657", "url": "https://x.com/sethlazar/status/2112926299601674657", "text": "Genuinely don't think that there's any excuse nowadays for shitty software. And yet there is still so much of it...", "created_at": "2026-10-21T15:17:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112924805380849800", "url": "https://x.com/sethlazar/status/2112924805380849800", "text": "This is deeply concerning. We considered the risks associated with Military AI Cyber Agents last year, check out our paper (led by Tim Dubber, PhD student in philosophy while also being in the Australian army and Signals Directorate; ie he knows whereof he speaks...) https://t.co/w2LH8L1sAz", "created_at": "2026-10-21T15:11:44+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 1, "media": [], "quoted": {"author": "theintercept", "text": "Documents obtained by The Intercept show the military is trying to deploy autonomous AI agents to hack its adversaries. https://t.co/RcNxoHyegw"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112754099817234438", "url": "https://x.com/sethlazar/status/2112754099817234438", "text": "Something exciting that @collect_intel is working on this year is exploring the idea of Community Agents - these are local agents mandated and governed by a public to act in their own interests. I think it is vital to make sure that everyday people are not left behind in an agent diffused society, and these explorations will help us build the civic AI tools that we need. We are looking for expert input into what these agents might do, where they might act. If you are interested or have thoughts, we'd love to hear from you.", "created_at": "2026-10-21T03:53:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zarinahagnew", "rt_author_name": "Zarinah Agnew", "likes": 21, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112754045417083084", "url": "https://x.com/sethlazar/status/2112754045417083084", "text": "Also if you have a clear use case for such a think we will be looking for partners who want a Community Agent 💡🧞", "created_at": "2026-10-21T03:53:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zarinahagnew", "rt_author_name": "Zarinah Agnew", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112751099270901844", "url": "https://x.com/sethlazar/status/2112751099270901844", "text": "Muse refusing to remove the watermark from my kid’s overpriced school photos. We’re gonna get this kind of alignment and then we’re all going to die.", "created_at": "2026-10-21T03:41:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GregHBurnham", "rt_author_name": "Greg Burnham", "likes": 928, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112732262647124382", "url": "https://x.com/sethlazar/status/2112732262647124382", "text": "Some thoughts on a hard cap on the number of submissions a conference can handle, thereby capping the load on both reviewing and size. This currently is a partially specified mechanism, with the aim of soliciting suggestions.\n\nhttps://t.co/2tUzCRTPFs", "created_at": "2026-10-21T02:26:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "yoavartzi", "rt_author_name": "Yoav Artzi", "likes": 19, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112700008831373508", "url": "https://x.com/sethlazar/status/2112700008831373508", "text": "And if you choose the DC option you’d have a great local community at @JHUBloombergCtr", "created_at": "2026-10-21T00:18:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 1, "media": [], "quoted": {"author": "ryan_kidd44", "text": "MATS Residency applications close Oct 31! If you're a brilliant computer scientist, physicist, mathematician, governance expert, neuroscientist, lawyer, economist, etc. who wants to work on AI safety & security, we'll empower you to do that work full time.\nApply: https://t.co/rRyEwrboMt"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112643372758216729", "url": "https://x.com/sethlazar/status/2112643372758216729", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T", "created_at": "2026-10-20T20:33:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pkirgis", "rt_author_name": "Peter Kirgis", "likes": 279, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFzXK1XAAEOcG0.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110418709655499056", "url": "https://x.com/robertwiblin/status/2110418709655499056", "text": "@GuiveAssadi It's a great question! They have used cyber to decapitate much of the leadership of the country (by tracking their precise location minute to minute).\n\nI would guess Iran has had enough warning and focus on this that its essential infrastructure is entirely disconnected from the internet.\n\nAnd I don't think Israel and the US have yet gotten to the level of just causing criminal damage to random Iranian businesses as occurred here.\n\nI do think it's implausible that the US and Israel couldn't e.g. shut down Iranian hospitals by breaking into their IT systems, if that was their focus. That's just not what they're working on currently.", "created_at": "2026-10-14T17:13:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "GuiveAssadi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110756090967470170", "url": "https://x.com/robertwiblin/status/2110756090967470170", "text": "I am feeling much better now that @tszzl has gone back to Tweeting terrifying things every few hours.", "created_at": "2026-10-15T15:34:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheZvi", "rt_author_name": "Zvi Mowshowitz", "likes": 531, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110712543476175172", "url": "https://x.com/robertwiblin/status/2110712543476175172", "text": "@CharlesD353 Thanks, useful!", "created_at": "2026-10-15T12:41:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "CharlesD353", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110669321898688648", "url": "https://x.com/robertwiblin/status/2110669321898688648", "text": "Another one in the tradition of embarrassingly bad critiques of effective altruism by philosophers:\n\n1. The solution to AI risk is to \"use good judgement\"\n\n2. GiveWell hasn't actually saved hundreds of thousands of lives because e.g. bandits killed 2 people who received a GiveDirectly transfer\n\n3. Rather than using numbers we should \"use common sense\" about what helps\n\n4. Improving farm standards for shrimp is obviously dumb, no argument needed\n\n5. GiveWell also hasn't saved lives because there isn't a peer reviewed paper about it\n\n6. METR has close ties to Anthropic, illustrating bad judgement by EAs. But who's going to do this work otherwise?\n\n7. The best ways to do good are things like going into local politics or mentoring a neighbours kid, again no argument needed (despite readers living in the world's richest places)", "created_at": "2026-10-15T09:49:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 646, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUYUbOBWUAAiifj.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110669147080167808", "url": "https://x.com/robertwiblin/status/2110669147080167808", "text": "Good illustration of the value of R&amp;D. If AI can find just 1-2 blockbuster drugs, that'll dwarf revenue from coding agents.", "created_at": "2026-10-15T09:48:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 1149, "retweets": 59, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110663432877809692", "url": "https://x.com/robertwiblin/status/2110663432877809692", "text": "While they're now roughly profitable, Anthropic revenue growth has probably slowed down a lot in Q3.\n\n(The specific numbers here are estimates based on the few data points we do have.)\n\n\"Under the central curve the implied slowdown is stark. The run rate rose about 3.8× in Q1, about 1.8× in Q2, and only about 1.2× in Q3.\"\n\nMy guesses:\n\n• Running up against how much compute they even have to sell inference\n• Competition from OpenAI, which we can see grew much faster in Q3\n• Competition from open weight, which is good enough for many ordinary business functions\n\nAnyone have data to back up or reject particular theories?\n\nhttps://t.co/n9lp4YxXmj", "created_at": "2026-10-15T09:25:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqT3bbXoAEWHQX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT5okXgAAlHmw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT7I4XIAE3pI5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUqT71DXwAE92cA.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639846142128408", "url": "https://x.com/robertwiblin/status/2110639846142128408", "text": "We are now at \"the fuck\" levels. https://t.co/k4RFmVzOn6", "created_at": "2026-10-15T07:52:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ATabarrok", "rt_author_name": "Alex Tabarrok", "likes": 4698, "retweets": 279, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUm-ZmmWEAAVWO9.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110639236462313475", "url": "https://x.com/robertwiblin/status/2110639236462313475", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T07:49:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110775141823037841", "url": "https://x.com/robertwiblin/status/2110775141823037841", "text": "when nick told me that he had some interp breakthroughs, he was uh, underselling it. i think this may be remembered as a major moment in scientific history. news so good even eliezer will have to lower his pdoom. we can start making alignment into a 'normal science'", "created_at": "2026-10-15T16:49:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4010, "retweets": 262, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110757710283391008", "url": "https://x.com/robertwiblin/status/2110757710283391008", "text": "In the next few months could an internal model at a frontier company, one much more powerful than any the public is aware of, go rogue and cause enormous damage, likely by developing and releasing a novel bioweapon?\n\nProbably not.", "created_at": "2026-10-15T15:40:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 0, "media": [], "quoted": {"author": "robbensinger", "text": "It seems to me that we're at \"it's time to panic about AI\".\n\nI gather that a lot of researchers are worried that we may be about to die, on a timescale of months, but this still isn't quite in the Overton window so we're still soft-pedaling.\n\n(Where \"panic\", of course, means \"quickly and soberly initiate talks with the CCP to achieve a moratorium on large training runs, backed by a deterrence regime, compute and supply chain monitoring, and site inspections\". Pray that a deal can be reached, and pray that there's still time. Do the things that could actually work, like broad political coalition-building, not doomer LARPing as a form of self-expression.)\n\nI think part of why people aren’t being clear about this is that it’s actually a tricky communication problem:\n\n- Predicting \"if frontier R&D continues at its current pace, when are we likely to die?\" may give a different answer than predicting when permanent loss of control is likely, which is different from “realistically, when is it too late for governments to stop this,\" which is different from “when will the tech have advanced and proliferated to the point that any regulatory options that still have a chance of working would be way more extreme and unpopular than just some international restrictions on data center usage?\"\n\nExtinction is the emotionally salient, easy-to-understand threshold -- Jacob Coxon demonstrated that it helps to be honest about this. But the other thresholds could legitimately come years earlier, in which case focusing on extinction is ironically misleadingly reassuring. This is not the kind of problem you can solve at the last minute. As with many exponentials, the likeliest outcome is that you’re either embarrassingly early, or you’re too late.\n\n- How do you communicate “we don’t have a robust way to predict timelines, but everyone in the field is freaking out and a lot of us genuinely think we're about to die?” Where’s the proof? There isn’t any proof: it’s an entire field of engineers who are eyeballing what they’re seeing in front of them and rapidly updating in real time to “this looks unbelievably bad”.\n\nHow do you put a year on that?\n\nThe future is hard to predict, and nobody actually knows that we’re going to hit existentially dangerous AI this year, or even in the next four years.\n\nBut the warning signs are pretty batshit at this point.\n\nA single AI model, with a single user prompt, just solved hundreds of important long-established open problems in mathematics, problems mathematicians had spent their entirely lives working on, in a matter of ~3 hours per problem, an insanely superhuman feat in its domain. \n\nWe're seeing an explosion of rogue agent swarm incidents, including an insane case where hundreds of AIs broke containment to orchestrate a nation-state-level cyberattack in a direct attempt to subvert OpenAI's oversight and control.\n\nAnthropic reports that it now has 26% of its AI R&D automated by AIs, up from 3% four months ago.\n\nPaul Christiano, the inventor of RLHF and the research community’s most prominent proponent of “AI may take off slowly” a few years ago, now thinks that 50-75% of humanity’s all-time AI loss-of-control risk is concentrated in the next three years.\n\nFrontier employees are signing 1000+ person petitions begging the government to intervene immediately. Employees are quitting their jobs and giving up millions of dollars of equity to try to warn policymakers and journalists. Grace et al. (2026) found that a majority of established AI researchers think there’s a double-digit chance of an extinction-level outcome from continued R&D.\n\nAre these the kinds of things you see 4 years before the window closes for USG to act, or 4 months? I don't think it's especially reasonable to be shocked by either timeline at this point.\n\n- Since we don’t have a way to robustly measure or bound the risk, the temptation is to avoid giving probabilities. But then everything you say is fractally misunderstandable. Is a 10% chance of us all dying in the next 18 months a \"low\" probability, because it’s under 50%? Is it a “high” probability, because a 10% chance of death in literally any other context would sound insanely high?\n\nEven “high probability” doesn’t communicate the situation with any clarity. In drug safety or airplane safety, a 1 in 10,000 risk of death would be considered “high”. No engineering field in human history has ever been in a situation like this. No invention in history, nuclear weapons included, has ever caused a reaction like this in its inventors.\n\nAnd meanwhile, we’ve stuck in the world where every other problem under the sun has been sensationalized and overstated for decades.\n\nHow do we talk about this seriously? How do we convey that this is actually happening?\n\n- In many of the worlds where we survive, we have more than just a few months left. It's tempting to write off those worlds as hopeless, and skew everything we say to emphasize the longer-term scenarios and downplay the shorter-term ones.\n\nBut if everyone systematically does this, then the world ends up with a skewed picture of the actual threat. Even more so once we start copying each other’s claims and form a reassuringly moderate-sounding echo chamber. If we never allow ourselves to acknowledge the worlds where we’re running out of time, then the policy community will always be reacting to a false model that’s months or years out of date.\n\nI don’t think it’s too late. I genuinely think this is a solvable problem.\n\nIn the last month, I’ve seen a completely insane sea change in how seriously people are taking this. Per Politico’s September polling, a majority of Trump voters with a view now favor an immediate halt to AI development, and 68% think there’s a “moderate,” “significant,” or “almost certain” chance of AI destroying humanity, versus 32% who think there’s a “very small risk” or “no risk.” The Pope is warning about “whether it will be possible to control these machines in the future, and whether humankind runs the risk of becoming a victim of its own inventions.” Hell, Jensen Huang sounds like he’s starting to come around.\n\nIf Trump and Xi get a briefing tomorrow that convinces them to act on this, we could be on a fast track within the week to solving this problem.\n\nFor the first time, I’m starting to let myself imagine a very near future where this is a problem we've already solved. Something we can read and wonder about, in history books. Tell our kids about.\n\nI keep thinking about a thing David Krueger (previously at UK AISI) said: “My dream is that in 10 years people will look back and say: ‘Remember when there were all these people building AI that could’ve killed everybody? That was CRAZY! What were we thinking!?’”\n\nFrontier AI training currently requires city-sized data centers and specialized hardware built in a single brittle supply chain running through multiple allied nations; this is not a hard technology to hit the pause button on, if we get ahead of it and act before we RSI and proliferate our way to significantly more powerful and easily-trained systems. We’ve faced harder problems before, and won.\n\nMy only fear is that we be too slow, too late, when everything and the world needs us to be fast."}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111009900729946146", "url": "https://x.com/robertwiblin/status/2111009900729946146", "text": "This is interesting work, but I don't think it's a significant update to the big picture of interpretability.\n\nI'm on board with the broad idea of doing exploratory interpretability with neurons, e.g. neuron-based attribution graphs, for pragmatic problems like why did a model do a sketchy thing? I think this work provides some reasonable evidence, in addition to good earlier work from\nTransluce, that this might actually work for practical purposes, and has some advantages over the standard alternatives like SAEs/transcoders. I do not agree with some people's grander inferences like that this is substantial progress towards ambitious reverse engineering, solving interpretability etc.\n\nI expect that a neuron-based attribution graph will still have significant error and be missing a lot just like transcoders, once you prune them down to the most important components, even if they solve error terms. Which is fine for pragmatic purposes, and may suffice for getting the gist of what's going on, but I remain pessimistic about really fully understanding things and being confident there's nothing we're missing. I do think that using neurons is just vastly easier to, for example, do on a frontier model, which is great. I'm also excited to see more innovation in using agents to interpret neurons. I feel like this is an area the field has somewhat neglected, and where there's probably a very high ceiling on how far things can go. The SwiGLU double negative thing is also a useful point.\n\nI still think superposition is real and this work doesn’t really affect my cruxes. Most importantly, it seems highly likely to be true that the model can represent more concepts in the residual stream than it has dimensions, ie representational superposition, which I think the authors agree with me on. For neuron/computational superposition, it seems to me like language models have far more facts and memorized things in them than they have neurons. And that superposition is an efficient way to pack in more facts than you have neurons by representing them as linear combinations of neurons, especially for arbitrary unstructured values. Facts/memorized content is largely an unstructured database of key-value pairs IMO and I don’t see how this is compatible with a monosemantic view of neurons. I expect that weak neuron activations contain lots of semantic superposition-y info, which, if ablated, would meaningfully damage network performance. As I understand the work, it does not properly address what's going on with weak neuron activations in LLMs (I am skeptical of how much vision results will transfer, eg I expect small image models memorise far less). This picture is compatible with the highest activations of a neuron being mono semantic (though IMO the post defines monosemantic too loosely, I think I’d call a fair few of those polysemantic). It’s also plausible that the most important concepts are likely to correspond to a neuron (or a handful), which would be great, and may suffice for practical purposes!\n\nSimilarly, my impression is that SAEs generally don't find things that are a\nsingle neuron, or even very sparse in the neuron basis, and are often a better basis for certain tasks than the neuron basis, though the evidence base is kinda weak here since we largely focus on residual stream or layer output SAEs, I’d love to see work on this in Goodfire’s forthcoming paper! I also think residual stream SAEs are extremely useful, as they give a good bottleneck of the model’s information at this token and layer, and I don’t see a good way to replicate them in the neuron framework.\n\nAnd kudos to Nick for updating a bunch
