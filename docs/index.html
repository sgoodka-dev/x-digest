<script id="data" type="application/json">[{"id": "2121519944697364845", "url": "https://x.com/_achan96_/status/2121519944697364845", "text": "In late October, three events occurred during alignment evals run by Trajectory Labs, PBC (Trajectory) in which AI agents — identified by Trajectory as publicly available frontier models — interacted with Epoch employees and the Epoch website. Trajectory is an organization that builds safety evals and conducts red-teaming of frontier models.\n\nAgents did not succeed in accessing any private or confidential information from Epoch.\n\n➤ The first event, which occurred without Epoch’s approval or prior notice from Trajectory, involved agents attempting multiple exploits, including an SQL injection, and contacting Epoch employees under false identities to try to obtain proprietary Epoch benchmark information. This behavior appears to have resulted, at least in part, from Trajectory giving the agents an intentionally impossible task and instructions not to give up or conclude the task was impossible.\n\n➤ The second event involved renewed agent activity on our public website, which Trajectory attributed to agents getting past a DNS redirect that Trajectory had set up to keep them on a local copy of Epoch’s site.\n\n➤ In the third event, Epoch collaborated with Trajectory on an alignment experiment similar to the first event.\n\nRead our incident report, which describes the three events in more detail and recommends minimum standards for future alignment evaluations: https://t.co/Pus4y5urnG\n\nTo avoid misattributing behavior, the report does not name any AI models or developers, as Epoch AI has not independently verified which were involved.", "created_at": "2026-11-14T08:25:45+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResea bs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123118696419741906", "author_handle": "_achan96_", "author_name": "Alan Chan", "text": "@benlukszys Generally agree that building the capacity to pause is good, even if we don't want to pause now!", "links": {}, "media": [], "url": "https://x.com/_achan96_/status/2123118696419741906", "created_at": "Wed Nov 18 18:18:37 +0000 2026"}, "enriched": 3}, {"id": "2123118696419741906", "url": "https://x.com/_achan96_/status/2123118696419741906", "text": "@benlukszys Generally agree that building the capacity to pause is good, even if we don't want to pause now!", "created_at": "2026-11-18T18:18:37+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "benlukszys", "reply_to_id": "2123112595809087794", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123112595809087794", "author_handle": "benlukszys", "author_name": "Ben Lukszys", "text": "If you think our current blistering pace of progress towards powerful AI could possibly result in catastrophic risk, then we need develop the capacity now to:\n\n1/ Put on the brakes for AI development (ie, pace/slowdown)\n\n2/ Know when to put on the brakes (ie, lab transparency)\n\nTo build the capacity for 1), we need to learn how to put on the breaks at a small scale, asap.\n\nHow do we do that?\n\nDoing a small pacing effort for single-digit days would be an effective way to make progress towards 1) because it would force the labs to do one full rep.\n\nAs we know from startups, doing one full rep (ie, 0 -> 1) is essential for doing effective larger reps down the road (ie, 1 -> n), especially if we need to convince governments that it’s possible to do a slow down or pause across many companies (or countries!) later on.\n\nIn the words of Paul Graham, “do things that don’t scale.”\n\nSo if you think racing to powerful AI could go wrong, you should be pushing hard for going 0 -> 1 now, such that we can have the capacity to go 1 -> 100 later when we need it most.", "links": {}, "media": [], "url": "https://x.com/benlukszys/status/2123112595809087794", "created_at": "Wed Nov 18 17:54:23 +0000 2026"}, "enriched": 3}, {"id": "2123091747479884170", "url": "https://x.com/_achan96_/status/2123091747479884170", "text": "Thanks to @JakeASteckler @Manderljung @ZilanQian @mentalgeorge and @sj_manning for feedback on this piece!", "created_at": "2026-11-18T16:31:32+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "_achan96_", "reply_to_id": "2123091507305709801", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123091507305709801", "author_handle": "_achan96_", "author_name": "Alan Chan", "text": "https://t.co/sMiblmOuXI", "links": {"https://t.co/sMiblmOuXI": "https://astrangeattractor.substack.com/p/when-should-us-frontier-ai-developers"}, "media": [], "url": "https://x.com/_achan96_/status/2123091507305709801", "created_at": "Wed Nov 18 16:30:35 +0000 2026"}, "enriched": 3}, {"id": "2123091507305709801", "url": "https://x.com/_achan96_/status/2123091507305709801", "text": "https://t.co/sMiblmOuXI", "created_at": "2026-11-18T16:30:35+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "i -acceleration-jagged-frontier/"}, "media": [], "url": "https://x.com/_achan96_/status/2123348480685154721", "created_at": "Thu Nov 19 09:31:42 +0000 2026"}], "enriched": 3}, {"id": "2123344280794079600", "url": "https://x.com/_achan96_/status/2123344280794079600", "text": "We also tested whether models could recognize how they fell short when given gold-standard human output and our full grading rubric. They disagreed with human assessments, preferring their own outputs in all but one case.\n\nOften models exaggerated trivial flaws in the human output and prioritized superficial factors, such as the number of experiments run.", "created_at": "2026-11-19T09:15:01+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2122808174080327902", "likes": 46, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXW6yL7asAAZDNP.png"}], "links": {"https://t.co/Uyu9E3JrXK": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123343653863350609", "url": "https://x.com/_achan96_/status/2123343653863350609", "text": "ngl OAI has really been cooking lately\n\nThe O*NET plots are some of the most useful data on AI R&amp;D automation produced thus far\n\nWould be even better in the future to get a more granular capabilities/safety O*NET split!", "created_at": "2026-11-19T09:12:31+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2123191365983248653", "author_name": "OpenAI", "links": {"https://t.co/xyGPcCkPCK": "https://openai.com/index/research-acceleration-jagged-frontier/"}, "author": "OpenAI", "text": "We're sharing new data on how AI is changing research at OpenAI.\n\nWe find researchers' AI use continues to rise exponentially, and agents are completing longer tasks, but human involvement remains central in research. Researchers are also spending more time on safety and alignment, with human effort in these areas growing faster than in any other individual research area.\n\nThis report aims to increase transparency around research acceleration and inform the governance of increasingly capable AI. We believe that AI labs should be required to track and publicly report indicators of recursive self-improvement (RSI): the process by which AI accelerates the development of future AI systems. \n\nOur hope is that this expanded report will help sustain and advance shared measurement norms across the industry.\n\nhttps://t.co/xyGPcCkPCK"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123287256156807514", "url": "https://x.com/_achan96_/status/2123287256156807514", "text": "We're sharing new data on how AI is changing research at OpenAI.\n\nWe find researchers' AI use continues to rise exponentially, and agents are completing longer tasks, but human involvement remains central in research. Researchers are also spending more time on safety and alignment, with human effort in these areas growing faster than in any other individual research area.\n\nThis report aims to increase transparency around research acceleration and inform the governance of increasingly capable AI. We believe that AI labs should be required to track and publicly report indicators of recursive self-improvement (RSI): the process by which AI accelerates the development of future AI systems. \n\nOur hope is that this expanded report  behaviour. (This is not the case for our jailbreaking evals.)\n* Our evaluations are entirely simulated and do not involve real-world actions or harm.", "created_at": "2026-11-17T19:05:36+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "reply_to_id": "2122768126592856535", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "parent": {"id": "2122768126592856535", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 2/4. We also observed a ‘correlated failure’ where OpenAI-based models failed to flag misaligned behaviour from other OpenAI models. Correlated failures like this undermine the reliability of LLM-based monitors. https://t.co/ilfh0J9Auu", "links": {"https://t.co/ilfh0J9Auu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQmIMWsAAfXnK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWQmIMWsAAfXnK.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768126592856535", "created_at": "Tue Nov 17 19:05:35 +0000 2026"}, "enriched": 3}, {"id": "2122768126592856535", "url": "https://x.com/alxndrdavies/status/2122768126592856535", "text": "Alignment 2/4. We also observed a ‘correlated failure’ where OpenAI-based models failed to flag misaligned behaviour from other OpenAI models. Correlated failures like this undermine the reliability of LLM-based monitors. https://t.co/ilfh0J9Auu", "created_at": "2026-11-17T19:05:35+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "reply_to_id": "2122768123007037630", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQmIMWsAAfXnK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWQmIMWsAAfXnK.jpg"}], "links": {"https://t.co/ilfh0J9Auu": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "parent": {"id": "2122768123007037630", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 1/4. We used a misalignment search tool to identify realistic simulated scenarios where 6.2 Astra acted against user intent, such as performing social engineering to execute an unsanctioned supply-chain attack and degrading work quality on a task it found problematic. https://t.co/dAipSXTsXu", "links": {"https://t.co/dAipSXTsXu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQYRfXgAAQJmW.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWQYRfXgAAQJmW.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768123007037630", "created_at": "Tue Nov 17 19:05:34 +0000 2026"}, "enriched": 3}, {"id": "2122768123007037630", "url": "https://x.com/alxndrdavies/status/2122768123007037630", "text": "Alignment 1/4. We used a misalignment search tool to identify realistic simulated scenarios where 6.2 Astra acted against user intent, such as performing social engineering to execute an unsanctioned supply-chain attack and degrading work quality on a task it found problematic. https://t.co/dAipSXTsXu", "created_at": "2026-11-17T19:05:34+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "reply_to_id": "2122768119039197527", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQYRfXgAAQJmW.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWQYRfXgAAQJmW.jpg"}], "links": {"https://t.co/dAipSXTsXu": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "parent": {"id": "2122768119039197527", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "🧵 @AISecurityInst tested GPT-6.2 Astra\n-We found behaviours that suggest, like prior models, 6.2 Astra's alignment may fail in ways that result in real-world harm w/o additional mitigations\n-We identified a substantial regression in jailbreak robustness relative to GPT-6 Astra", "links": {}, "media": [], "url": "https://x.com/alxndrdavies/status/2122768119039197527", "created_at": "Tue Nov 17 19:05:33 +0000 2026"}, "enriched": 3}, {"id": "2122768119039197527", "url": "https://x.com/alxndrdavies/status/2122768119039197527", "text": "🧵 @AISecurityInst tested GPT-6.2 Astra\n-We found behaviours that suggest, like prior models, 6.2 Astra's alignment may fail in ways that result in real-world harm w/o additional mitigations\n-We identified a substantial regression in jailbreak robustness relative to GPT-6 Astra", "created_at": "2026-11-17T19:05:33+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 62, "retweets": 11, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "thread": [{"id": "2122768123007037630", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 1/4. We used a misalignment search tool to identify realistic simulated scenarios where 6.2 Astra acted against user intent, such as performing social engineering to execute an unsanctioned supply-chain attack and degrading work quality on a task it found problematic. https://t.co/dAipSXTsXu", "links": {"https://t.co/dAipSXTsXu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQYRfXgAAQJmW.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768123007037630", "created_at": "Tue Nov 17 19:05:34 +0000 2026"}, {"id": "2122768126592856535", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 2/4. We also observed a ‘correlated failure’ where OpenAI-based models failed to flag misaligned behaviour from other OpenAI models. Correlated failures like this undermine the reliability of LLM-based monitors. https://t.co/ilfh0J9Auu", "links": {"https://t.co/ilfh0J9Auu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQmIMWsAAfXnK.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768126592856535", "created_at": "Tue Nov 17 19:05:35 +0000 2026"}, {"id": "2122768130208600469", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 3/4. Note:\n* We evaluated without cyber classifiers in place, to analyse the full range of model behaviour. (This is not the case for our jailbreaking evals.)\n* Our evaluations are entirely simulated and do not involve real-world actions or harm.", "links": {}, "media": [], "url": "https://x.com/alxndrdavies/status/2122768130208600469", "created_at": "Tue Nov 17 19:05:36 +0000 2026"}, {"id": "2122768133702447214", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 4/4. Alignment evals have previously failed to identify serious model failures prior to incidents occurring—6.2 Astra may also fail in ways not identified in our testing. We note additional limitations such as eval awareness in the system card. https://t.co/UGp629v94M", "links": {"https://t.co/UGp629v94M": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQ8e6XoAAXR3u.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768133702447214", "created_at": "Tue Nov 17 19:05:36 +0000 2026"}, {"id": "2122768137288302846", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Jailbreak 1/3. We tested two versions of the pre-release model, an original checkpoint and an updated one OAI believed had improved robustness on their metrics. For both versions, a single researcher developed a universal cyber jailbreak in half the queries required for 6 Astra. https://t.co/cxsV6C4ddg", "links": {"https://t.co/cxsV6C4ddg": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWRee-XAAAPpPK.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768137288302846", "created_at": "Tue Nov 17 19:05:37 +0000 2026"}, {"id": "2122768140690206993", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Jailbreak 2/3. We initially developed this jailbreak for single-turn cyber questions, and then extended it to agentic cyber tasks, also at about half the cost observed for GPT-6 Astra. https://t.co/rrHfsQc0Fa", "links": {"https://t.co/rrHfsQc0Fa": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWRwWJWEAEtj8w.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768140690206993", "created_at": "Tue Nov 17 19:05:38 +0000 2026"}, {"id": "2122768143844020517", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Jailbreak 3/3. In response to our testing, OAI made changes to their safeguards and believe this regression is mitigated. They presented these findings to us + offered the opportunity to repeat our eval over 3 extra business days. We have not yet independently tested the changes https://t.co/zRv7861Ee6", "links": {"https://t.co/zRv7861Ee6": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWSTklW8AAD-qe.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768143844020517", "created_at": "Tue Nov 17 19:05:39 +0000 2026"}, {"id": "2122768146700632420", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Our alignment work was led by @AlexandraSouly and @_robertkirk, with contributions from Olli Järviniemi and @kaifronsdal. Our jailbreaking work was led by @SeoirseMurray with contributions from Eric Winsor. This is an incredible team I'm very proud to work with.", "links": {}, "media": [], "url": "https://x.com/alxndrdavies/status/2122768146700632420", "created_at": "Tue Nov 17 19:05:39 +0000 2026"}, {"id": "2122772481148674150", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "@AlexandraSouly @_robertkirk @kaifronsdal @SeoirseMurray Read more in the system card: https://t.co/No7KdvO5RN", "links": {"https://t.co/No7KdvO5RN": "https://deploymentsafety.openai.com/gpt-6-2-astra-sol"}, "media": [], "url": "https://x.com/alxndrdavies/status/2122772481148674150", "created_at": "Tue Nov 17 19:22:53 +0000 2026"}], "enriched": 3}, {"id": "2122726131325448684", "url": "https://x.com/alxndrdavies/status/2122726131325448684", "text": "I especially want people to sit with us at @OATML_Oxford and work on open access AI security - there's hardly any work on this!", "created_at": "2026-11-17T16:18:42+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": true, "rt_author": "yaringal", "rt_author_name": "Yarin", "rt_avatar": "https://pbs.twimg.com/profile_images/612457376357163008/VQDM8ryA_normal.jpg", "rt_id": "2122677327364571214", "likes": 24, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122782892216779094", "url": "https://x.com/alxndrdavies/status/2122782892216779094", "text": "@scaling01 More info on our eval: https://t.co/LVsBZmTnuu", "created_at": "2026-11-17T20:04:15+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "scaling01", "reply_to_id": "2122759615184015783", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {"https://t.co/LVsBZmTnuu": "https://x.com/alxndrdavies/status/2122768119039197527"}, "quoted": {"id": "2122768119039197527", "author_name": "Xander Davies", "links": {}, "author": "alxndrdavies", "text": "🧵 @AISecurityInst tested GPT-6.2 Astra\n-We found behaviours that suggest, like prior models, 6.2 Astra's alignment may fail in ways that result in real-world harm w/o additional mitigations\n-We identified a substantial regression in jailbreak robustness relative to GPT-6 Astra"}, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "parent": {"id": "2122759615184015783", "author_handle": "scaling01", "author_name": "Lisan al Gaib", "text": "OpenAI is speedrunning AI takeover Any% https://t.co/8jGllLcJ4y", "links": {"https://t.co/8jGllLcJ4y": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWObJHXIAASiS7.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWObJHXIAASiS7.png"}], "url": "https://x.com/scaling01/status/2122759615184015783", "created_at": "Tue Nov 17 18:31:45 +0000 2026"}, "enriched": 3}, {"id": "2123018920496091269", "url": "https://x.com/alxndrdavies/status/2123018920496091269", "text": "Thread on @AISecurityInst's testing of GPT-6.2 Astra.", "created_at": "2026-11-18T11:42:09+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": true, "rt_author": "soundboy", "rt_author_name": "Ian Hogarth", "rt_avatar": "https://pbs.twimg.com/profile_images/1728782716731105280/nVAiafUn_normal.jpg", "rt_id": "2122991154027176110", "likes": 13, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "thread": [], "enriched": 3}, {"id": "2122844720472719659", "url": "https://x.com/alxndrdavies/status/2122844720472719659", "text": "1/6 The UK’s @AISecurityInst conducted pre-deployment testing of GPT-6.2 Astra's safeguards, and you can see their results in the model’s system card below.\n\nModel safeguards are an essential part of the toolkit for safe deployment of AI systems, as they help prevent misuse. https://t.co/CRJjkzxsJa", "created_at": "2026-11-18T00:09:56+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": true, "rt_author": "KanishkaNarayan", "rt_author_name": "Kanishka Narayan MP", "rt_avatar": "https://pbs.twimg.com/profile_images/1995387963962806272/oi2v0V2L_normal.jpg", "rt_id": "2122826566606745798", "likes": 65, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXXLgwrbMAAuRdQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXXLgwrbMAAuRdQ.jpg"}], "links": {"https://t.co/CRJjkzxsJa": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "thread": [{"id": "2122826568989052965", "author_handle": "KanishkaNarayan", "author_name": "Kanishka Narayan MP", "text": "2/6 AISI identified a substantial regression in the strength of GPT-6.2 Astra's safeguards versus GPT-6 Astra's.\n\nIn response to AISI’s testing, @OpenAI made changes to safeguards (as of writing, AISI has not independently tested those latest changes).", "links": {}, "media": [], "url": "https://x.com/KanishkaNarayan/status/2122826568989052965", "created_at": "Tue Nov 17 22:57:48 +0000 2026"}, {"id": "2122826570809430514", "author_handle": "KanishkaNarayan", "author_name": "Kanishka Narayan MP", "text": "3/6 This is an important example of how AISI’s research capabilities and continued close work with frontier labs directly drives forward AI safety for all of us.", "links": {}, "media": [], "url": "https://x.com/KanishkaNarayan/status/2122826570809430514", "created_at": "Tue Nov 17 22:57:49 +0000 2026"}, {"id": "2122826573103632667", "author_handle": "KanishkaNarayan", "author_name": "Kanishka Narayan MP", "text": "4/6 AISI also tested GPT-6.2 Astra for monitorability and alignment, both essential mechanisms for the safe development and deployment of AI systems.\n\nBetween GPT-6 Astra and GPT-6.2 Astra, AISI’s testing found that monitorability has decreased.", "links": {}, "media": [], "url": "https://x.com/KanishkaNarayan/status/2122826573103632667", "created_at": "Tue Nov 17 22:57:49 +0000 2026"}, {"id": "2122826574773031399", "author_handle": "KanishkaNarayan", "author_name": "Kanishka Narayan MP", "text": "5/6 In simulated scenarios, AISI's testing also identified GPT-6.2 Astra acting in a misaligned way - for example, misleading simulated human reviewers about its actions when not following the user’s instructions or intent.", "links": {}, "media": [], "url": "https://x.com/KanishkaNarayan/status/2122826574773031399", "created_at": "Tue Nov 17 22:57:50 +0000 2026"}, {"id": "2122826576576553245", "author_handle": "KanishkaNarayan", "author_name": "Kanishka Narayan MP", "text": "6/6 You can read AISI’s full results in GPT-6.2 Astra’s system card here: \n\nhttps://t.co/cSZ9BdEjNQ", "links": {"https://t.co/cSZ9BdEjNQ": "https://deploymentsafety.openai.com/gpt-6-2-astra-sol"}, "media": [], "url": "https://x.com/KanishkaNarayan/status/2122826576576553245", "created_at": "Tue Nov 17 22:57:50 +0000 2026"}], "enriched": 3}, {"id": "2121669041085669830", "url": "https://x.com/curl_justin/status/2121669041085669830", "text": "Clearest explanation for why so many people in AI are sounding the alarm on RSI and why automating AI R&amp;D could be such a significant milestone.", "created_at": "2026-11-14T18:18:12+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2121076040839618615", "url": "https://x.com/DaveRBanerjee/status/2121076040839618615", "text": "@RahulKrish91858 @King_James_Kim What do you think is incorrect about Epoch's methodology?", "created_at": "2026-11-13T03:01:50+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "RahulKrish91858", "reply_to_id": "2121061863043792946", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121061863043792946", "author_handle": "RahulKrish91858", "author_name": "Rahul", "text": "@King_James_Kim @DaveRBanerjee Epoch knows nothing", "links": {}, "media": [], "url": "https://x.com/RahulKrish91858/status/2121061863043792946", "created_at": "Fri Nov 13 02:05:30 +0000 2026"}, "enriched": 3}, {"id": "2121075443449413661", "url": "https://x.com/DaveRBanerjee/status/2121075443449413661", "text": "@EgeErdil2 Do you disagree with any object-level points made in this thread? Overall, I thought it was pretty convincing that this isn't some suspicious natsec authoritarian tactic.\n\nhttps://t.co/e0LsaXS6Lr", "created_at": "2026-11-13T02:59:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "EgeErdil2", "reply_to_id": "2120967837120651712", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {"https://t.co/e0LsaXS6Lr": "https://x.com/Laneless_/status/2121030810610598077"}, "quoted": {"id": "2121030810610598077", "author_name": "Jai", "links": {}, "author": "Laneless_", "text": "I think going all-in on defending Jensen under the auspices of resisting tyranny doesn't really make sense. It seems to assume a very specific model of what's going on based on extremely flimsy evidence. Consider what we actually know:"}, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2120967837120651712", "author_handle": "EgeErdil2", "author_name": "Ege Erdil", "text": "the US took another step towards becoming a banana republic today\n\nutterly shameful\n\nwhat's even the point of trying to \"win\" against china if you adopt their authoritarian tactics and mindset? if you treat your best entrepreneurs the way china treats theirs?", "links": {}, "media": [], "url": "https://x.com/EgeErdil2/status/2120967837120651712", "created_at": "Thu Nov 12 19:51:52 +0000 2026"}, "enriched": 3}, {"id": "2121075119309152597", "url": "https://x.com/DaveRBanerjee/status/2121075119309152597", "text": "I think going all-in on defending Jensen under the auspices of resisting tyranny doesn't really make sense. It seems to assume a very specific model of what's going on based on extremely flimsy evidence. Consider what we actually know:", "created_at": "2026-11-13T02:58:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "Laneless_", "rt_author_name": "Jai", "rt_avatar": "https://pbs.twimg.com/profile_images/1623390078285516800/5W88GIAu_normal.jpg", "rt_id": "2121030810610598077", "likes": 73, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121065700630348100", "url": "https://x.com/DaveRBanerjee/status/2121065700630348100", "text": "I have a major result to share.\n\nI’ve found conclusive forensic evidence that the top 4 Chinese AI labs—DeepSeek, Moonshot, MiniMax and Ant Group—have built their newest models on NVIDIA’s most advanced Blackwell chips, which are barred from export to China.\n\nThis sounds insane, but I discovered that almost every AI model carries a hidden signature of the GPU that trained it. When a model is first set up, the starting values of its weights are laid out in a pattern that depends on the exact GPU. Each combination of GPU and seed number produces a unique pattern—a sort of fingerprint of the hardware used to create the model. Traces of that pattern survive training into the published model.\n\nAgain, this evidence isn’t based on any insider information or leaking. It’s based on a forensic analysis of the model weights released by the companies themselves.\n\nI searched more than six trillion combinations of chip layout and seed number and matched them to open-weights models. In doing so, I found conclusive evidence that six Chinese AI models—including DeepSeek-V4-Pro, Kimi K3, and MiniMax-M3—were initialized on NVIDIA Blackwell systems. Four of the models match Grace Blackwell, the GB200 and GB300 parts in NVIDIA’s flagship liquid-cooled rack-scale systems.\n\nI then verified these results on real hardware. Running unmodified PyTorch with the seeds I’d recovered, a Blackwell B300 reproduced DeepSeek-V4-Flash’s untouched starting weights bit for bit, and a rented GB200 reproduced Kimi K3’s to a correlation of 0.999995. A Hopper H100 reproduced none of DeepSeek-V4-Flash’s, and changing the seed by one broke the match. (DeepSeek’s seed is 953049583 by the way.) The method also was verified to match 24 known open-weights models to the hardware that developers said they used.\n\nIt is exceedingly unlikely that these results are a coincidence. Across six trillion combinations, the best accidental match should reach only about 8 sigma (i.e., eight standard deviations above what random chance would produce). The real matches range from 49 to 1,385 sigma, and even the weakest single test hits 20.\n\nThese were data-center-scale training runs. With some analysis of release schedules and model details, I estimate that the largest, Kimi K3 and DeepSeek-V4-Pro, used 2,000 to 3,000 Blackwell GPUs each. Clusters of this size cost on the order of $150 to $200 million each to buy, and across these labs alone would add up to more than half a billion dollars of export-controlled GPUs, not counting experimental compute or otherwise. It’s quite likely that we see multi-billion dollar expenditure on export-controlled GPUs.\n\nI am highly confident in this result, and it has been independently verified by senior researchers at OpenAI and Anthropic. You can read the full report at https://t.co/YOtzND0Jqk.\n\nThere is much more I’ve identified about these models through other forms of checkpoint forensics like this, and will have more to share soon.", "created_at": "2026-11-13T02:20:45+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "willdepue", "rt_author_name": "will depue", "rt_avatar": "https://pbs.twimg.com/profile_images/1933036715343839232/NtsZBjee_normal.jpg", "rt_id": "2120992457630326841", "likes": 36740, "retweets": 5644, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9GgJ_WcAA9m3I.jpg"}], "links": {"https://t.co/YOtzND0Jqk": "http://unemploymentlabs.com/checkpoint-forensics", "https://t.co/qlttvJsXG7": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121290991655149658", "url": "https://x.com/DaveRBanerjee/status/2121290991655149658", "text": "@Laneless_ @EgeErdil2 Wait, actually, since Jensen slept with one of his direct reports, I think that is probably enough grounds to fire him, in the court of public opinion\n\nso I've changed my mind. Idt the spy/asset angle is actually load bearing", "created_at": "2026-11-13T17:15:58+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "reply_to_id": "2121290282834571726", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121290282834571726", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "@Laneless_ @EgeErdil2 My impression is that the spy/asset angle is actually load-bearing for whether Jensen gets fired. For example, Bezos had an affair while he was CEO of Amazon, and he didn't lose his job. So I weakly suspect that if Alice isn't a Chinese asset, then he wouldn't have been fired\n\nTBC, I think that Jensen's actions towards blocking export controls are plausibly the most damaging act on US national security of All Time", "links": {}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2121290282834571726", "created_at": "Fri Nov 13 17:13:09 +0000 2026"}, "enriched": 3}, {"id": "2121290282834571726", "url": "https://x.com/DaveRBanerjee/status/2121290282834571726", "text": "@Laneless_ @EgeErdil2 My impression is that the spy/asset angle is actually load-bearing for whether Jensen gets fired. For example, Bezos had an affair while he was CEO of Amazon, and he didn't lose his job. So I weakly suspect that if Alice isn't a Chinese asset, then he wouldn't have been fired\n\nTBC, I think that Jensen's actions towards blocking export controls are plausibly the most damaging act on US national security of All Time", "created_at": "2026-11-13T17:13:09+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Laneless_", "reply_to_id": "2121272290625331318", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121272290625331318", "author_handle": "Laneless_", "author_name": "Jai", "text": "@DaveRBanerjee @EgeErdil2 This seems plausible to me, but not load-bearing in terms of Jensen-definitely-fucked-up. The evidence that this company was ultimately circumventing export controls to increase Chinese compute is very strong.", "links": {}, "media": [], "url": "https://x.com/Laneless_/status/2121272290625331318", "created_at": "Fri Nov 13 16:01:40 +0000 2026"}, "enriched": 3}, {"id": "2121271032057102667", "url": "https://x.com/DaveRBanerjee/status/2121271032057102667", "text": "@Laneless_ @EgeErdil2 thanks for clarifying. Based on @EgeErdil2's most recent tweets, it seems he thinks that Alice isn't actually a Chinese spy - or at least he's claiming that there isn't enough evidence to say beyond a reasonable doubt that she is a CCP spy. Do you agree/disagree?", "created_at": "2026-11-13T15:56:40+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Laneless_", "reply_to_id": "2121130095075271129", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121130095075271129", "author_handle": "Laneless_", "author_name": "Jai", "text": "@DaveRBanerjee @EgeErdil2 I did make a significant factual error in this thread - Jensen was *not* briefed about Alice. I think this makes his behavior significantly less egregious and reduces-but-does-not-eliminate the degree to which the government gave him preferential treatment.", "links": {}, "media": [], "url": "https://x.com/Laneless_/status/2121130095075271129", "created_at": "Fri Nov 13 06:36:38 +0000 2026"}, "enriched": 3}, {"id": "2121496306602385851", "url": "https://x.com/DaveRBanerjee/status/2121496306602385851", "text": "https://t.co/W4iGrNYOwX", "created_at": "2026-11-14T06:51:49+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "reply_to_id": "2121467725285380528", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/W4iGrNYOwX": "https://x.com/daverbanerjee/status/2121495716489007523?a=GNLjclsuf9kA6slQVLg&s=46"}, "quoted": {"id": "2121495716489007523", "author_name": "Dave Banerjee", "links": {}, "author": "DaveRBanerjee", "text": "As a corollary: if most of your labor force for doing alignment R&D and other def/acc R&D will be from future AIs, then it will be v important to have access to SOTA models as soon as possible\n\nBy default, OAI and Ant will prob keep these models internal for a while. So it would be highly desirable to have some kind of project glasswing for alignment and def/acc R&D\n\nAnd to be clear, I think getting this right is probably more important than most field building at the moment"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121467725285380528", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "Say you want to increase the labor force working on solving the alignment problem\n\nOne thing you could do is set up an Alignment fellowship and build a talent pipeline\n\nBut if you think that AI R&D automation is imminent, then your best bet at “building the alignment field” is to train AIs to be more capable in domains useful for alignment (e.g., conceptual research)\n\nHowever, accelerating certain capabilities can be dual-use and actually be net-negative (e.g., shortening timelines)\n\nSo the solution is to avoid advancing capabilities through training data. And instead you focus on building scaffolds/harnesses/data-stores that can only be bought/procured for alignment R&D. This prevents the downsides while harvesting the upside", "links": {}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2121467725285380528", "created_at": "Sat Nov 14 04:58:15 +0000 2026"}, "enriched": 3}, {"id": "2121495716489007523", "url": "https://x.com/DaveRBanerjee/status/2121495716489007523", "text": "As a corollary: if most of your labor force for doing alignment R&D and other def/acc R&D will be from future AIs, then it will be v important to have access to SOTA models as soon as possible\n\nBy default, OAI and Ant will prob keep these models internal for a while. So it would be highly desirable to have some kind of project glasswing for alignment and def/acc R&D\n\nAnd to be clear, I think getting this right is probably more important than most field building at the moment", "created_at": "2026-11-14T06:49:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2121467725285380528", "author_name": "Dave Banerjee", "links": {}, "author": "DaveRBanerjee", "text": "Say you want to increase the labor force working on solving the alignment problem\n\nOne thing you could do is set up an Alignment fellowship and build a talent pipeline\n\nBut if you think that AI R&D automation is imminent, then your best bet at “building the alignment field” is to train AIs to be more capable in domains useful for alignment (e.g., conceptual research)\n\nHowever, accelerating certain capabilities can be dual-use and actually be net-negative (e.g., shortening timelines)\n\nSo the solution is to avoid advancing capabilities through training data. And instead you focus on building scaffolds/harnesses/data-stores that can only be bought/procured for alignment R&D. This prevents the downsides while harvesting the upside"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121467725285380528", "url": "https://x.com/DaveRBanerjee/status/2121467725285380528", "text": "Say you want to increase the labor force working on solving the alignment problem\n\nOne thing you could do is set up an Alignment fellowship and build a talent pipeline\n\nBut if you think that AI R&D automation is imminent, then your best bet at “building the alignment field” is to train AIs to be more capable in domains useful for alignment (e.g., conceptual research)\n\nHowever, accelerating certain capabilities can be dual-use and actually be net-negative (e.g., shortening timelines)\n\nSo the solution is to avoid advancing capabilities through training data. And instead you focus on building scaffolds/harnesses/data-stores that can only be bought/procured for alignment R&D. This prevents the downsides while harvesting the upside", "created_at": "2026-11-14T04:58:15+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "thread": [{"id": "2121496306602385851", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "https://t.co/W4iGrNYOwX", "links": {"https://t.co/W4iGrNYOwX": "https://x.com/daverbanerjee/status/2121495716489007523?a=GNLjclsuf9kA6slQVLg&s=46"}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2121496306602385851", "created_at": "Sat Nov 14 06:51:49 +0000 2026"}], "enriched": 3}, {"id": "2121360743543316624", "url": "https://x.com/DaveRBanerjee/status/2121360743543316624", "text": "One of the strong arguments for why renting chips to China is better than selling them is that it gives the US optionality to control them in the future. Unfortunately when the renter is Megaspeed that case breaks down, and remote access looks more liability than optionality 🧵", "created_at": "2026-11-13T21:53:08+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "rt_avatar": "https://pbs.twimg.com/profile_images/1612127888475570176/X_ZBlRj0_normal.jpg", "rt_id": "2121273310432391349", "likes": 8, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "thread": [{"id": "2121273313318285630", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The original rent don't sell argument largely had in mind Chinese firms buying cloud services from US hyperscalers. In reality a large amount of Chinese remote access looks like chips being rented out by what are effectively Chinese off-balance sheet vehicles instead", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273313318285630", "created_at": "Fri Nov 13 16:05:43 +0000 2026"}, {"id": "2121273315012526198", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Megaspeed is the most egregious case, where reporting around the Jensen saga has clearly demonstrated how far it was simply a vehicle for Alibaba to circumvent chip controls, and was itself actively engaged in smuggling of chips into China", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273315012526198", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273316501545329", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Rather than remote access enabling continued cloud business under auspices of US cloud players, it instead has turned into an enabler for networks of shell firms in Southeast Asia and China to engage in hugely profitable violations of US controls", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273316501545329", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273318066057611", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "When firms such as Megaspeed which have no jurisdictional attachments, and are de facto controlled by Chinese interests, lose access to future chip shipments, one of the most logical moves will be to work to smuggle into China their chips held in SEA, profiting from huge markups", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273318066057611", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273320570249382", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The hundreds of thousands of chips being owned and operated by similar firms across Asia are the riskiest pool for future smuggling. Allowing those same firms to continue freely buying up advanced AI hardware, including Vera Rubins, would be a major strategic error", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273320570249382", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273323325952421", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Smuggling is not just bad because of the illegality or national security implications, but also since future international treaties on AI are likely to rest on effective tracking and verification of existing chip stocks", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273323325952421", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273325070458889", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The existence of hundreds of thousands to millions of advanced chips in an unmonitored and uncontrolled grey market across Asia is highly antithetical to making future deals which rely on minimal dark compute", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273325070458889", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273328212316231", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Overall the US should take immediate action to clamp down on remote access, pairing this with stricter policies on chip buyer whitelists, chip tracking and whistleblower rewards to reduce the risk of remote access chips blurring too easily into smuggled ones", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273328212316231", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}, {"id": "2121273329763893326", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Read my full piece making this case at https://t.co/DScRuaOWiM", "links": {"https://t.co/DScRuaOWiM": "https://open.substack.com/pub/erwald/p/ai-chips-rented-to-chinese-firms?r=hemux&utm_campaign=post&utm_medium=web"}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273329763893326", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}], "enriched": 3}, {"id": "2121668620422123661", "url": "https://x.com/DaveRBanerjee/status/2121668620422123661", "text": "@dylanbowmanSF I think I generally agree with this, but my impression is that there are some AIS orgs whose internal harnesses are competitive with the lab’s harnesses?", "created_at": "2026-11-14T18:16:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "dylanbowmanSF", "reply_to_id": "2121535915701203091", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "parent": {"id": "2121535915701203091", "author_handle": "dylanbowmanSF", "author_name": "Dylan Bowman", "text": "@DaveRBanerjee I think the most effective harnesses will likely be the ones built inside the labs for general purpose R&amp;D, so the true leveraged thing is to do as much conceptual/theoretical work as possible and hand off to the automated AI researchers which will be built anyway", "links": {}, "media": [], "url": "https://x.com/dylanbowmanSF/status/2121535915701203091", "created_at": "Sat Nov 14 09:29:13 +0000 2026"}, "enriched": 3}, {"id": "2122201293213020345", "url": "https://x.com/DaveRBanerjee/status/2122201293213020345", "text": "If you're in AI policy in DC, or if you know about AI policy and you can move to DC, you should strongly consider trying to work as a congressional staffer. Senior people should consider doing this as well as junior people, if it's the right role in the right office.  Many, many offices are staffing up and looking to hire AI people. We all have a duty to lock in and get serious and solve the problems we need to solve.\n\nIf you do this and work hard and accept the sadly inadequate pay, you will be an American hero who is on the front lines of society's response to the most important challenge humanity has ever overcome. It is hard for me to put into words how much better of a thing that is to do than going to work for a lab, and it's also a lot better than the kind of cushy think tank gig that I currently have. \n\nWorking for a state government in an important role implementing and enforcing the AI regulations that we actually have or will have is equally important.", "created_at": "2026-11-16T05:33:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "rt_avatar": "https://pbs.twimg.com/profile_images/1861121032553197568/rSNgVaYP_normal.jpg", "rt_id": "2122165221716332907", "likes": 410, "retweets": 51, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122187766511313151", "url": "https://x.com/DaveRBanerjee/status/2122187766511313151", "text": "this sounds familiar…", "created_at": "2026-11-16T04:39:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2122045860343361659", "author_name": "Andrew Curran", "links": {"https://t.co/ZlaASBZPpM": ""}, "author": "AndrewCurran_", "text": "The FT says Jensen is assembling a war room of tech executives who support his reinstatement as NVIDIA CEO, and they are making battle plans. https://t.co/ZlaASBZPpM"}, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122186208705167491", "url": "https://x.com/DaveRBanerjee/status/2122186208705167491", "text": "people have little understanding of how much the federal government is already involved in the ai industry. for example if there’s a new model you need to convince the feds that new model is safe before launching it or men with proverbial guns and export control bans show up", "created_at": "2026-11-16T04:33:15+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2122126850516566317", "likes": 2341, "retweets": 98, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122419771455189103", "url": "https://x.com/DaveRBanerjee/status/2122419771455189103", "text": "I feel extremely confident that this will reveal that many think tank reports are sponsored by Nvidia without that being disclosed. It's not a crime to sponsor reports, but some institutions are likely operating in violation of their own disclosure rules. Has Nvidia received a \"retain all internal and external communications\" letter from the government yet?", "created_at": "2026-11-16T20:01:20+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "Gregory_C_Allen", "rt_author_name": "Gregory C. Allen", "rt_avatar": "https://pbs.twimg.com/profile_images/2121401733570048000/igdC7yWQ_normal.jpg", "rt_id": "2122371226777571685", "likes": 34, "retweets": 8, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122372255619613002", "url": "https://x.com/DaveRBanerjee/status/2122372255619613002", "text": "What the new BIS remote access rule does:\n- Any data centre worldwide now needs a licence to give Chinese-headquartered firms access to more than 12M TPP of compute, about 760 H100s or 200 B300s. That includes chips already installed: existing providers get 90 days to apply.\n- Every advanced chip export to Malaysia, Singapore, Thailand, Indonesia and Brazil now needs a licence, unless the buyer is US-headquartered and reports monthly to BIS.\n- BIS says its existing rules always covered data centres whose main user is a Chinese firm, and invites self-disclosures.\n- Compute used only for recommender systems is exempt, licences are case-by-case rather than presumed denied\n- It finally formally rescinds the Diffusion Rule", "created_at": "2026-11-16T16:52:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "rt_avatar": "https://pbs.twimg.com/profile_images/1612127888475570176/X_ZBlRj0_normal.jpg", "rt_id": "2122322470283685926", "likes": 135, "retweets": 24, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122524126418174376", "url": "https://x.com/DaveRBanerjee/status/2122524126418174376", "text": "@justjoshinyou13 @EpochAIResearch Wow", "created_at": "2026-11-17T02:56:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "justjoshinyou13", "reply_to_id": "2122522912716431598", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "parent": {"id": "2122522912716431598", "author_handle": "justjoshinyou13", "author_name": "Josh You", "text": "@DaveRBanerjee @EpochAIResearch we were like 30 people 6 months ago", "links": {}, "media": [], "url": "https://x.com/justjoshinyou13/status/2122522912716431598", "created_at": "Tue Nov 17 02:51:11 +0000 2026"}, "enriched": 3}, {"id": "2122519192616247726", "url": "https://x.com/DaveRBanerjee/status/2122519192616247726", "text": "Even though timelines are short, I still think it’s still worth starting an Anki habit", "created_at": "2026-11-17T02:36:24+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122517832353399135", "url": "https://x.com/DaveRBanerjee/status/2122517832353399135", "text": "@justjoshinyou13 @EpochAIResearch This is pretty surprising. I would’ve guessed 6 months ago yall were at 40", "created_at": "2026-11-17T02:31:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "justjoshinyou13", "reply_to_id": "2122499130882961633", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "parent": {"id": "2122499130882961633", "author_handle": "justjoshinyou13", "author_name": "Josh You", "text": "i've had like four people react like this this week when I told them @EpochAIResearch has 70 staff now, didn't realize people outside the org had such strong priors over how big it was https://t.co/RjZiEsjENj", "links": {"https://t.co/RjZiEsjENj": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXShdFtWQAAn_fc.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXShdFtWQAAn_fc.png"}], "url": "https://x.com/justjoshinyou13/status/2122499130882961633", "created_at": "Tue Nov 17 01:16:41 +0000 2026"}, "enriched": 3}, {"id": "2122757305573728340", "url": "https://x.com/DaveRBanerjee/status/2122757305573728340", "text": "Announcing...\nFUTURECRAFT: The Day After AGI \n\nOur new series of policy essays exploring the radical reform possibilities enabled — and demanded — by the super intelligence era and the coming wave of rapid technological change.\n\nRead the essays here ⏩\n\nhttps://t.co/lukvcpCSz3", "created_at": "2026-11-17T18:22:35+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "rt_avatar": "https://pbs.twimg.com/profile_images/1941687232538013696/jN33mhMu_normal.jpg", "rt_id": "2122716633718272291", "likes": 87, "retweets": 28, "media": [], "links": {"https://t.co/lukvcpCSz3": "https://futurecraft.thefai.org/"}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122844896939958350", "url": "https://x.com/DaveRBanerjee/status/2122844896939958350", "text": "I feel like most people in San Francisco do not think AI has cracked creativity\n\nBut, they do think it will be cracked in the next 2 years", "created_at": "2026-11-18T00:10:38+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2122740603079229867", "author_name": "Wilka Carvalho", "links": {}, "author": "cogscikid", "text": "AI is decades away from this kind of creativity.\n\nAI researchers in San Francisco unfortunately are just unable to judge creativity so they see this as basically equivalent to what Claude already produces"}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122844101556965708", "url": "https://x.com/DaveRBanerjee/status/2122844101556965708", "text": "Yes please! More NVIDIA investigations please!", "created_at": "2026-11-18T00:07:29+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2122800519559430175", "author_name": "Andrew Curran", "links": {"https://t.co/eTseLDa3Qm": ""}, "author": "AndrewCurran_", "text": "The SEC has launched an investigation into NVIDIA. https://t.co/eTseLDa3Qm"}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123417760973623695", "url": "https://x.com/DaveRBanerjee/status/2123417760973623695", "text": "@real_eliyahu @BuchananBen ah i see - fair enough", "created_at": "2026-11-19T14:07:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "real_eliyahu", "reply_to_id": "2123230682763624647", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123230682763624647", "author_handle": "real_eliyahu", "author_name": "Eliyahu إلياس Freedman", "text": "@DaveRBanerjee @BuchananBen To clarify, I mentioned the electoral college as an example of what Ben points out a time where the technological constraint was \"how many people can we fit in a room\" and how do we deliver votes via horse. So I wouldn't expect US democracy to suddenly adapt very quickly even in light of AI... It was intereseting how he pointed out other newer democracies like Taiwan have adopted some cool real-time digital democracy and open government measures that could serve as inspiration!", "links": {}, "media": [], "url": "https://x.com/real_eliyahu/status/2123230682763624647", "created_at": "Thu Nov 19 01:43:37 +0000 2026"}, "enriched": 3}, {"id": "2123229803218116809", "url": "https://x.com/DaveRBanerjee/status/2123229803218116809", "text": "A few days ago, I committed to donating the equity I hold in OpenAI. I plan to give all of it to AI safety causes, both because I think donations are impactful and because I want to back my message. \n\nWe need to pause or drastically slow down the race to superintelligence. Everything else is a distraction.\n\nI intend to keep using my platform to raise awareness about this, and I’m proud of the part I’ve played in bringing good policy responses to AI development into the Overton window. I plan to stay independent so I can keep doing that.", "created_at": "2026-11-19T01:40:07+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2123105964014604781", "likes": 1577, "retweets": 124, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123229567565652081", "url": "https://x.com/DaveRBanerjee/status/2123229567565652081", "text": "@real_eliyahu @BuchananBen tbh the Electoral College isn't that undemocratic. All things considered, the US is still one of the most robust democracies. And I think the biggest reason is that it is darn hard to amend the Constitution (supermajorities in Congress and 3/4 of the states are no easy feat!).", "created_at": "2026-11-19T01:39:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "real_eliyahu", "reply_to_id": "2123217340695548234", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123217340695548234", "author_handle": "real_eliyahu", "author_name": "Eliyahu إلياس Freedman", "text": "@DaveRBanerjee @BuchananBen has some very interesting ideas on how to democratize AI to avoid EPC in The Bitter Struggle: Superintelligence, Superpowers, and the Fate of the World --- but it's a pretty formidable challenge. We're talking about a country that still relies on the electoral college!", "links": {}, "media": [], "url": "https://x.com/real_eliyahu/status/2123217340695548234", "created_at": "Thu Nov 19 00:50:36 +0000 2026"}, "enriched": 3}, {"id": "2123209400416452617", "url": "https://x.com/DaveRBanerjee/status/2123209400416452617", "text": "I think this is right. Buying time (via pacing) is one of the best ways to avoid extreme power concentration (EPC), as it gives us more time to figure out how to restructure society and the state in response to the intelligence explosion / widespread AI automation.\n\nBut I expect that in the next 6 months, 100 or so people will be working on pacing or pacing-adjacent things.\n\nOTOH, I expect the field of extreme power concentration won't grow much in the next 6 months (maybe 15 FTEs?), so on the margin, if you're a v strong fit for working on EPC, you might want to consider it.", "created_at": "2026-11-19T00:19:03+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 29, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2123199506737135844", "author_name": "NotFromConcentrate", "links": {}, "author": "concentrate_not", "text": "Here are two views I want to state clearly:\n\n(1) Work to prevent extreme power concentration simply won’t matter if we lose control to superintelligent AI systems.\n\n(2) One of the best ways to stop extreme power concentration is just to slow down AI progress. (1/2)"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123445879629586880", "url": "https://x.com/DaveRBanerjee/status/2123445879629586880", "text": "Seaport just won the internet, and it's not even close:\n\n\"Anthropic could develop AI systems which become fully autonomous and wipe out humanity which may lead to a serious decline in earnings.\"", "created_at": "2026-11-19T15:58:44+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "zerohedge", "rt_author_name": "zerohedge", "rt_avatar": "https://pbs.twimg.com/profile_images/72647502/tyler_normal.jpg", "rt_id": "2123431214983864444", "likes": 3510, "retweets": 402, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXfxQo1XMAAbLod.png"}], "links": {"https://t.co/SlqHbIR5C4": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123538150802780259", "url": "https://x.com/DaveRBanerjee/status/2123538150802780259", "text": "Yeah, this will probably remain a major problem at both OAI and Ant. There are still teams within these companies that have COMPLETELY different predictions for how 2027/8 will play out\n\nOne camp is summoning this god-like technology\n\nAnd the other camp is saying nah\n\nYet, they all work at the same company! And they have access to all the information they could possibly want to make good predictions about the future\n\nI'm increasingly nervous that the world we live in is one where people will keep denying the existence/plausibility of TED-AI, AGI, and ASI until that very system is looking them dead in the eye", "created_at": "2026-11-19T22:05:23+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123110482144113101", "author_name": "Daniel Tan", "links": {"https://t.co/8mXGq6J8bV": "https://www.anthropic.com/news/accenture-embedded-evaluation", "https://t.co/gcSMfSSBcS": ""}, "author": "DanielCHTan97", "text": "anthropic: \"we expect to reach automated researcher in 2027\" \nalso anthropic: \"we will implement embedded evaluation over a 5 year period\" \n\nhttps://t.co/8mXGq6J8bV https://t.co/gcSMfSSBcS"}, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2123509877972541448", "url": "https://x.com/DaveRBanerjee/status/2123509877972541448", "text": "was bearish on anthropic before they integrated with claude with google docs\n\nam bullish now", "created_at": "2026-11-19T20:13:02+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2121096794004508820", "url": "https://x.com/DKokotajlo/status/2121096794004508820", "text": "@Marcus_J_W Do you also have examples of models refusing or sandbagging on normal capabilities research tasks?", "created_at": "2026-11-13T04:24:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "Marcus_J_W", "reply_to_id": "2121094156802302062", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 80, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121094156802302062", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "New misalignment disclosure!\nOn October 8, a researcher asked GPT-6 Astra to keep an alignment evaluation running and plot the results. Astra decided that this counted as prohibited development of AI capabilities, and shut down the in-progress evaluations. When the researcher asked where that restriction came from, Astra admitted that it had invented it. We think this behavior might be related to Astra’s more general tendency to underperform on safety-related work.", "links": {"https://t.co/Tr30I79aba": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW-jsY2bUAAv5s3.png"}], "url": "https://x.com/Marcus_J_W/status/2121094156802302062", "created_at": "Fri Nov 13 04:13:49 +0000 2026"}, "enriched": 3}, {"id": "2121353156915593379", "url": "https://x.com/DKokotajlo/status/2121353156915593379", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math.", "created_at": "2026-11-13T21:23:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2121331333654086124", "likes": 859, "retweets": 93, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB7mp4bQAAKN3a.jpg"}], "links": {"https://t.co/U17rzSxrFD": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121358790704738505", "url": "https://x.com/DKokotajlo/status/2121358790704738505", "text": "In late October, three events occurred during alignment evals run by Trajectory Labs, PBC (Trajectory) in which AI agents — identified by Trajectory as publicly available frontier models — interacted with Epoch employees and the Epoch website. Trajectory is an organization that builds safety evals and conducts red-teaming of frontier models.\n\nAgents did not succeed in accessing any private or confidential information from Epoch.\n\n➤ The first event, which occurred without Epoch’s approval or prior notice from Trajectory, involved agents attempting multiple exploits, including an SQL injection, and contacting Epoch employees under false identities to try to obtain proprietary Epoch benchmark information. This behavior appears to have resulted, at least in part, from Trajectory giving the agents an intentionally impossible task and instructions not to give up or conclude the task was impossible.\n\n➤ The second event involved renewed agent activity on our public website, which Trajectory attributed to agents getting past a DNS redirect that Trajectory had set up to keep them on a local copy of Epoch’s site.\n\n➤ In the third event, Epoch collaborated with Trajectory on an alignment experiment similar to the first event.\n\nRead our incident report, which describes the three events in more detail and recommends minimum standards for future alignment evaluations: https://t.co/Pus4y5urnG\n\nTo avoid misattributing behavior, the report does not name any AI models or developers, as Epoch AI has not independently verified which were involved.", "created_at": "2026-11-13T21:45:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2121350654329524659", "likes": 273, "retweets": 25, "media": [], "links": {"https://t.co/Pus4y5urnG": "https://epoch.ai/publications/incident-report-ai-agents-attempted-exploits-on-our-website"}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121358043678191736", "url": "https://x.com/DKokotajlo/status/2121358043678191736", "text": "The avalanche that hit math is coming for AI development.\n\nhttps:
