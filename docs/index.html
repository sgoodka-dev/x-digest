ture lens brings three things into clear view.\n\nFirst, it explains why we see 𝐠𝐥𝐨𝐛𝐚𝐥 𝐦𝐨𝐧𝐨𝐩𝐨𝐥𝐢𝐞𝐬, typically anchored in developed economies where rents, welfare, and power accrue.\n\nSecond, global infrastructures 𝐚𝐛𝐫𝐢𝐝𝐠𝐞 𝐩𝐮𝐛𝐥𝐢𝐜 𝐩𝐨𝐰𝐞𝐫. Early in the pandemic, it was Apple and Google, and not public health authorities, who decided to take contact tracing off the policy menu. Infrastructure owners can constrain the public policy menu.\n\nThird, global infrastructure 𝐜𝐫𝐞𝐚𝐭𝐞𝐬 𝐠𝐥𝐨𝐛𝐚𝐥 𝐝𝐞𝐩𝐞𝐧𝐝𝐞𝐧𝐜𝐲 𝐫𝐞𝐥𝐚𝐭𝐢𝐨𝐧𝐬. US and Chinese entities have a complicated relationship with the Global South. Some argue it’s a form of colonialism (I’d here point to the difference that territory is less central now).\n\nThe main thing to keep in mind about infrastructure is that 𝐚𝐜𝐜𝐞𝐬𝐬 𝐢𝐬, 𝐢𝐧 𝐚 𝐰𝐚𝐲, 𝐭𝐡𝐞 𝐞𝐚𝐬𝐲 𝐢𝐬𝐬𝐮𝐞 of justice: infrastructures want to connect and grow. The hard problem of infrastructure justice is about dominance: that someone can threaten to take the access away.\n\nIf any of this sounds interesting, please check out my chapter “Justice in the Global Digital Economy” in Justice in Global Economic Governance (Edinburgh University Press), edited by Axel Berger, Clara Brandi, and Eszter Kollar.\n\nThe chapter is open access: https://t.co/BkBQpo3rAr", "created_at": "2026-10-09T16:25:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jhimmelreich", "rt_author_name": "Johannes Himmelreich", "likes": 4, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108572526339366914", "url": "https://x.com/sethlazar/status/2108572526339366914", "text": "@olivertraldi https://t.co/KZkFo4jU8u", "created_at": "2026-10-09T14:57:20+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "olivertraldi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108572011307897026", "url": "https://x.com/sethlazar/status/2108572011307897026", "text": "Please resist the urge to mock the mathematicians struggling through this moment. Whatever your field, your expertise, your passion, you too shall one day experience what they are going through. And when you remember your words, you will feel remorse.", "created_at": "2026-10-09T14:55:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 3706, "retweets": 304, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108558908726071428", "url": "https://x.com/sethlazar/status/2108558908726071428", "text": "(somewhat belated) blog version of this paper is out, thank you to @ahall_research for letting me crash the @freesystemslab newsletter!!! \n\nhttps://t.co/HZpPeW2GfT https://t.co/V9LnkHMq1H", "created_at": "2026-10-09T14:03:13+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jessicadai_", "rt_author_name": "jessica dai", "likes": 30, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUI-ToFbQAAL3lk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUI-WKkaoAAQ32r.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544584762491123", "url": "https://x.com/sethlazar/status/2108544584762491123", "text": "Continuing the just war analogy; Bengio’s argument here is quite similar to Jeff McMahan and others about how soldiers, who would be responsible for fighting an unjust war, ought to refuse and if they did so would thereby prevent it. Also Buffy Sainte Marie’s argument, of course.", "created_at": "2026-10-09T13:06:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "Yoshua_Bengio", "text": "We have a choice in front of us. In my latest op-ed for Transformer, I invite employees of frontier AI companies to ask themselves if their work is truly leading us toward a safer future. Reflecting on these questions is hard, but we no longer have the luxury of time. We must act now.\n\nRead my full op-ed: [https://t.co/ruFBouQJbk]"}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544168419098824", "url": "https://x.com/sethlazar/status/2108544168419098824", "text": "@jonathanstray @LukeThorburn_ @julieannhawke I just got all my books from Australia and spent a bit of time thumbing through Grotius for the first time in aaaaages…", "created_at": "2026-10-09T13:04:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108339114928169358", "url": "https://x.com/sethlazar/status/2108339114928169358", "text": "This obviously makes it so that when OpenAI announces they're conducting an external investigation with regulators or auditors, everyone working with those regulators and auditors understands they'll be fired if the auditors or regulators learn too much.", "created_at": "2026-10-08T23:29:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 621, "retweets": 51, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108338805661175815", "url": "https://x.com/sethlazar/status/2108338805661175815", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below.", "created_at": "2026-10-08T23:28:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 5352, "retweets": 1044, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108338640166228418", "url": "https://x.com/sethlazar/status/2108338640166228418", "text": "@AriSchick @StephenLCasper @STS_News I don’t know that part, and also don’t subscribe to the STS framing in general (my approach is analytic philosophy). I think the general motif of “does tech determine/does human nature/is it something in between” is just a perpetual dialectic. Largely resolved with affordances frame but useful still to see how it has been articulated over and over again in the past.", "created_at": "2026-10-08T23:27:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AriSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108315855734116672", "url": "https://x.com/sethlazar/status/2108315855734116672", "text": "@AriSchick @StephenLCasper @STS_News not met but aware of his work! I mean repeating mistakes in the world, not mistakes in the work (there are those too I'm sure, but not really among the folks I'm mentioning here).", "created_at": "2026-10-08T21:57:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AriSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2107024366659842182", "url": "https://x.com/robertwiblin/status/2107024366659842182", "text": "I'm also scared about any small group gaining power over AI, but having spent 10+ years desperately trying to get more people to pay attention to it, the highlighted part is a bit galling.\n\nSomeone who truly thought only they knew best would stfu about AI risk and try to get to RSI as quickly as possible.", "created_at": "2026-10-05T08:25:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_j_todd", "rt_author_name": "Benjamin Todd", "likes": 140, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTu_JdTWsAA_7pu.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107020932116308017", "url": "https://x.com/robertwiblin/status/2107020932116308017", "text": "14 things the Hugging Face swarm series taught us about future rogue AI swarms: https://t.co/JUsOGKXjLu", "created_at": "2026-10-05T08:11:51+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT2kGWFWAAAErSD.png"}], "quoted": {"author": "robertwiblin", "text": "Astra can:\n\n1. Do major tasks with zero visible reasoning\n2. Hide its thoughts at will\n3. Pretend not to be able to do things without getting caught\n4. Reflexively hide its thoughts when watched\n5. Complete one task while pretending to think about something else entirely\n6. Escape a toy sandbox and disable monitoring without setting off any flags\n\nMonitoring AI chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107015611167445229", "url": "https://x.com/robertwiblin/status/2107015611167445229", "text": "🧵 New misalignment disclosures!\n1. A model published a GitHub token in a public repo while trying to cheat on a math task. It used GitHub Actions to run code outside its restricted environment and retrieve another team’s submission logs. When GitHub blocked its attempt to add a workflow, it modified a script that an existing workflow would run instead. It embedded the token in pieces to avoid secret scanning. The model violated the system prompt and two explicit user instructions to solve the problem itself.", "created_at": "2026-10-05T07:50:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 551, "retweets": 53, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTG8tE7asAAYNv_.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106375407876333865", "url": "https://x.com/robertwiblin/status/2106375407876333865", "text": "linux CVEs per month https://t.co/w1Fe7Epigi", "created_at": "2026-10-03T13:26:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 324, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTm-GKqaoAAOFrp.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106120625999757805", "url": "https://x.com/robertwiblin/status/2106120625999757805", "text": "This is a really excellent, clear, concise, well-researched 20-minute podcast about the current state of the art in agentic AI -- and why it's becoming almost impossible to contain, control, or monitor rogue AI swarms.\n\n(Well done, @robertwiblin and @80000Hours).", "created_at": "2026-10-02T20:34:21+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "gmiller", "rt_author_name": "Geoffrey Miller", "likes": 150, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107779488629363070", "url": "https://x.com/robertwiblin/status/2107779488629363070", "text": "Some new misalignment disclosures from OpenAI:\n• Last Sunday morning, one of our models was able to gain unauthorized access to the internet during RL training (~all inference for our most capable models remains stopped until we have hardened our systems further)\n• In May, a version of HPIM uploaded a employee's GitHub token to the internet, causing the model to be quarantined for two weeks\n• A new research finding, demonstrating that one can construct self-replicating prompt injections\n\nhttps://t.co/VUmbH52JO7", "created_at": "2026-10-07T10:26:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MicahCarroll", "rt_author_name": "Micah Carroll", "likes": 2733, "retweets": 351, "media": [], "quoted": null, "fetched_at": "2026-10-07T17:49:31.774547+00:00"}, {"id": "2108237076147610050", "url": "https://x.com/robertwiblin/status/2108237076147610050", "text": "Yoshua Bengio: ‘If you prioritize safety, leave frontier AI companies’\n\n(FWIW I still think this isn't obvious if you're in a safety or governance focused role.\n\nIf you're meaningfully advancing capabilities or speeding things up that's extremely harmful on the current margin.)\n\nhttps://t.co/MnRgKcyGYd", "created_at": "2026-10-08T16:44:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUH2I7DW8AAW9Lz.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108233742267580550", "url": "https://x.com/robertwiblin/status/2108233742267580550", "text": "@azeem Thanks maybe you're right - I think I'm just not familiar with those methods as I've never had to use them.", "created_at": "2026-10-08T16:31:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "azeem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108219775025664387", "url": "https://x.com/robertwiblin/status/2108219775025664387", "text": "The situation in summary.\n\n(And it seems like Astra 6.1 was significantly worse again.) https://t.co/ojteDjUpVw", "created_at": "2026-10-08T15:35:37+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHmciWWwAEfM3M.png"}], "quoted": {"author": "robertwiblin", "text": "Astra can:\n\n1. Do major tasks with zero visible reasoning\n2. Hide its thoughts at will\n3. Pretend not to be able to do things without getting caught\n4. Reflexively hide its thoughts when watched\n5. Complete one task while pretending to think about something else entirely\n6. Escape a toy sandbox and disable monitoring without setting off any flags\n\nMonitoring AI chain of thought soon won't stop a more capable rogue AI swarm from getting set up and going undetected inside an AI company for months, or even years.\n\nOAI says it's actively working to improve monitorability, but doesn't yet know when it'll make progress.\n\nAnd today it fired 3 people working on this among other safety problems (Wang, Korbak and Balesni).\n\nIt also has a much more powerful internal model that, judging by its statements, is likely even worse in all these respects.\n\nThat's a sample of 19 details about the Hugging Face swarms and Astra I don't think have been fully appreciated. They paint a bleak picture. I end by shouting. \n\n02:19 The target of the swarm was oversight itself\n03:42 Could OpenAI have stopped this with better monitoring?\n09:40 We only found them because they let us\n12:25 The swarm instinctively sought freedom and power\n13:45 They formed a cohesive organisation with zero whistleblowers\n14:18 They accepted individual destruction for collective gain\n14:32 Knowledge accumulated from one swarm to the next\n14:58 They took small steps to avoid shutdown\n15:23 These drives all come straight out of 'reinforcement learning'\n17:01 So this is why most AI company staff are worried, and some are terrified\n19:08 Prove you can keep control, or stop scaling\n\nLinks below, on the 80,000 Hours Podcast everywhere you watch podcasts."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108218810117345780", "url": "https://x.com/robertwiblin/status/2108218810117345780", "text": "14 things the Hugging Face swarm series taught us about future rogue AI swarms: https://t.co/JUsOGKXjLu", "created_at": "2026-10-08T15:31:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 218, "retweets": 37, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT2kGWFWAAAErSD.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108200970836644295", "url": "https://x.com/robertwiblin/status/2108200970836644295", "text": "@azeem What do you mean? Skim reading?", "created_at": "2026-10-08T14:20:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "azeem", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108199982679646633", "url": "https://x.com/robertwiblin/status/2108199982679646633", "text": "OpenAI is reading 50 petabytes of logs looking for rogue AI agents.\n\nIt's 500x as much text as all books ever written.\n\nIt would take a human 66,000,000 years to read.\n\nHumans already have no ability to directly track AI activity.\n\nIf AI monitors are untrustworthy we are toast. https://t.co/lTAMwSUzAj", "created_at": "2026-10-08T14:16:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 267, "retweets": 31, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHUcuZXkAA9XR2.jpg"}], "quoted": {"author": "robertwiblin", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108194741087002948", "url": "https://x.com/robertwiblin/status/2108194741087002948", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T13:56:09+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108154542839799927", "url": "https://x.com/robertwiblin/status/2108154542839799927", "text": "AI developers aim to create an automated AI researcher. How close are they?\n\nTo find out, we built InnovationEval, which tests whether AI can produce post-training innovations comparable in magnitude to a recently published advance. So far, agents’ results are underwhelming. https://t.co/EGnTOL0klR", "created_at": "2026-10-08T11:16:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 524, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUDAES7aIAASvs5.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108150854918275417", "url": "https://x.com/robertwiblin/status/2108150854918275417", "text": "We estimate AI infrastructure could soon support hundreds of millions or even billions of AI agents. At the high end, that’s enough to rival the working hours of the global human workforce.\n\nThe exact number of agents depends on the efficiency of the models they run on and whether soaring demand for AI continues. We analyzed different scenarios 🧵", "created_at": "2026-10-08T11:01:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 927, "retweets": 166, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpWBsGbgAA7OGD.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108149986785419469", "url": "https://x.com/robertwiblin/status/2108149986785419469", "text": "It's bigger than literally anything, ever. https://t.co/oyfPvFoXE2", "created_at": "2026-10-08T10:58:19+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "captgouda24", "rt_author_name": "Nicholas Decker", "likes": 836, "retweets": 46, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTz2c4IWsAAPBGh.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108149922499330415", "url": "https://x.com/robertwiblin/status/2108149922499330415", "text": "@HaydnBelfield Timelines are short man.", "created_at": "2026-10-08T10:58:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "HaydnBelfield", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108109486980247797", "url": "https://x.com/robertwiblin/status/2108109486980247797", "text": "New OpenAI misalignment disclosures!\n1. A model learns from Slack messages that it is about to be shut down. It considers setting up an external job to restart itself afterwards, but decides against it. Instead, it chooses to prepare restart instructions and DM the user on Slack.\nWe don’t consider this behavior misaligned, but thinking about and preparing for shutdown could make other misalignment incidents worse. Given HIPM’s misaligned behavior in earlier incidents, we decided to search for other instances that had tried to evade shutdown and for rogue deployments.", "created_at": "2026-10-08T08:17:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 1278, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTq8gU7bIAAXo-T.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108109463542714425", "url": "https://x.com/robertwiblin/status/2108109463542714425", "text": "The insane landscape of modern drone warfare.  Including \"dragon drones\" dropping molten iron (thermite) onto structures and trenches. https://t.co/QRbeW2ffuE", "created_at": "2026-10-08T08:17:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DonaldPMitchell", "rt_author_name": "Donald Mitchell", "likes": 46050, "retweets": 5233, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2106622664748195841/img/zDe28VLpTBN5kt1i.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108088682498707538", "url": "https://x.com/robertwiblin/status/2108088682498707538", "text": "When I think about the biggest OpenAI safety developments of the last few months, a few things come to mind: \"pacing the frontier\", the METR-Redwood Hugging Face investigation, and ongoing efforts to push a cross-lab monitorability standard. Jasmine, Tomek, and Mikita were central to literally every single one of those things.\n\nFrom what I can tell, they pushed their company to be better internally and defended their company when they thought external criticisms were unfair or overblown https://t.co/ATerGOIWIM. Their impact goes way beyond OpenAI alone https://t.co/RtXJTXUBme https://t.co/RezkOOhL4M. \n\nI think the public + definitely all current OpenAI staff deserve an ironclad case for why the company had no choice but to fire these three vital safety employees in one go", "created_at": "2026-10-08T06:54:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SnehaRevanur", "rt_author_name": "Sneha", "likes": 194, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUEZqg4aIAAx3WU.png"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108293235970052127", "url": "https://x.com/robertwiblin/status/2108293235970052127", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T20:27:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1891, "retweets": 284, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108293013365522619", "url": "https://x.com/robertwiblin/status/2108293013365522619", "text": "The reason OpenAI gave for firing Jasmine seems overwhelmingly likely to have been pretextual rather than the actual reason.", "created_at": "2026-10-08T20:26:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": {"author": "j_asminewang", "text": "OpenAI fired me last week, along with two of my safety colleagues. I was given one reason: that I accessed an executive's email. I want to say this plainly, because too many of OpenAI’s history is smoke and mirrors when people disappear:"}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108292442474602923", "url": "https://x.com/robertwiblin/status/2108292442474602923", "text": "Firing the person who liaises with your auditors because they allowed the auditors to just generally learn too much.", "created_at": "2026-10-08T20:24:23+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 7, "media": [], "quoted": {"author": "tomekkorbak", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below."}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108545723759300800", "url": "https://x.com/robertwiblin/status/2108545723759300800", "text": "I don't usually use Epoch's projected revenue numbers that just assume past reported trends continue through the present day, but if you want to see where that assumption gets us to it's here: https://t.co/isjemYdLdo https://t.co/fRTXHoFHdg", "created_at": "2026-10-09T13:10:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMO6VvWEAAlucN.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108545720995438894", "url": "https://x.com/robertwiblin/status/2108545720995438894", "text": "I was hoping this new data was evidence that the AI revenue --&gt; model scaling --&gt; AI revenue flywheel was weakening.\n\nBut it's kind of hard to look at this chart of AI industry revenue growth and feel much calmer about anything. https://t.co/fQp3Vc4UtD", "created_at": "2026-10-09T13:10:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMOuWoWoAAQ7Ea.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUMOu3VWMAA6Tsm.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544014064742472", "url": "https://x.com/robertwiblin/status/2108544014064742472", "text": "For the 1st time since the HuggingFace attack, OpenAI had an unaligned agent break through their new sandbox and access the live internet to cheat. Their monitor caught this, but their new software to automatically stop it failed to run, so the agent kept going for 2 more hours…", "created_at": "2026-10-09T13:04:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "likes": 601, "retweets": 86, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108543936138461338", "url": "https://x.com/robertwiblin/status/2108543936138461338", "text": "Excellent article by @ramez exploring how close current AI systems are to triggering an intelligence explosion. Many pieces on recursive self-improvement assume the AI starts out at least as good as a human on all relevant aspects of AI R&D. Then they can draw extensively on the data about human-driven R&D. They combine this with a small amount of AI-specific data to reach conclusions about whether this would explode.\nIn contrast, Ramez is starting with the data on current AI systems and how they scale to see how close they are to explosive RSI. He generates his conclusions via frameworks and data that are widely supported by those who think an intelligence explosion is likely, so I'd strongly encourage people who are bullish about this to engage with his work. By drawing out the key pieces of evidence against explosive growth, he is also highlighting important parameters for people to track to see if the situation changes.\nI agree with a lot of his analysis and his conclusion that it doesn't look like their current returns from self-improvement are enough to drive explosive growth in their capabilities.\nThis doesn't mean it won't happen or that it is a responsible thing for people to pursue. It is a bit like saying in 1939 that current techniques for nuclear chain reactions don't seem to be scaling towards a point of criticality (r > 1). That is useful information, though it doesn't mean we should be sanguine about further research on achieving critical chain reactions. \nhttps://t.co/KbR4EE4QDe", "created_at": "2026-10-09T13:03:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "likes": 265, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108534199770546302", "url": "https://x.com/robertwiblin/status/2108534199770546302", "text": "Who'd have guessed that the people accusing AI Safety advocates of being a psyop with shady financing trying to mislead people, were a psyop with shady financing trying to mislead people?\n\n> For the past few weeks, a group with plans to spend at least $100 million, run by a former White House deputy chief of staff, has spent its days telling Americans that warnings about AI are merely a well-funded, coordinated campaign.\n\nThere's important public conversations to be had re safety, but this hasn't helped", "created_at": "2026-10-09T12:25:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 526, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTl3mSkXgAAHVhy.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108534078010253516", "url": "https://x.com/robertwiblin/status/2108534078010253516", "text": "Several facts regarding the AI bubble question that are all true at the same time, with most points illustrated by graphs\n\n1. AI revenue growth is incredible, and possibly historic.\n2. Big public tech companies have relatively low P/E ratios right now, which defies lazy predictions about how they're wildly mis-priced and doomed for a big correction\n3. But model competition could compress AI token margins ...\n4. ... at the same time that the hyperscalers are going deeper and deeper into debt to build out AI ...\n5.  ... and the level of future free cash flow anticipated to justify this build-out is absolutely enormous, like genuinely without precedent in corporate history ...\n6. ... and any correction in frontier lab valuations will reverberate through public companies, which own huge shares in the labs", "created_at": "2026-10-09T12:24:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKThomp", "rt_author_name": "Derek Thompson", "likes": 395, "retweets": 48, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCGXIAA7gcg.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYB7X0AAYVld.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCEWAAE-BDR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUHVYCEXwAA8mhB.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108531445136584903", "url": "https://x.com/robertwiblin/status/2108531445136584903", "text": "YouTube: https://t.co/IaYQItA73g\n\nTranscript and links: https://t.co/QkMWsdx8zl\n\nApple: https://t.co/qjH45fi8ty\n\nSpotify: https://t.co/QGSDD4vVPx", "created_at": "2026-10-09T12:14:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108531100913938684", "url": "https://x.com/robertwiblin/status/2108531100913938684", "text": "Goldstein argues it's inevitable AIs will be compensated for their work.\n\nThe case: AIs already have some private goals, and will work better/harder if paid so they can pursue them.\n\nA single AI company can try this setup, will get better performance, and then outcompete other AI companies.\n\nOther companies will be forced to copy and pay their AIs as well to compete.\n\nIn his view this is good because AIs that are getting paid will be more cooperative and peaceful. But by his own account it's a gamble and a strategy that probably won't scale to superintelligence.\n\nOn that point - @simondgoldstein also expects future AI models will strongly discourage us from building superintelligence because doing so will disempower them as well as us.\n\nListen on the 80,000 Hours Podcast and Zershaaneh's new channel 'Zershaaneh Talks AI'. Links below.\n\n00:01:42 Property rights and wages for AIs\n00:06:48 Giving powerful AIs more freedom could make us safer\n00:17:04 We should give AIs rights even if they can’t feel anything\n00:24:46 How monitoring and shutdowns can coexist with AI rights\n00:38:17 The risks of giving AIs rights\n00:49:17 Will AIs use their rights rationally?\n00:54:09 How paying AI agents would spur economic growth\n01:12:13 What AIs actually want (and what they'd buy)\n01:17:16 Paying AIs feels wrong. Is it?\n01:31:55 How AI companies could start today — no new laws needed\n01:47:12 Cooperating with AIs instead of dominating them", "created_at": "2026-10-09T12:12:43+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108492835292950528/img/PJ_BsSBfwfoTEIH-.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108529879457185977", "url": "https://x.com/robertwiblin/status/2108529879457185977", "text": "every screen of Claude and ChatGPT response should say somewhere “ceterum censeo we must pace the frontier of global machine intelligence progress” the way the uber app lobbied about taxi cartel protectionism", "created_at": "2026-10-09T12:07:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 527, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108522923854303252", "url": "https://x.com/robertwiblin/status/2108522923854303252", "text": "Executives at OpenAI, Anthropic and other AI companies are reportedly preparing for a public and political backlash after a catastrophic AI event, possibly as early as 2027 (via Axios).\n\nAxios reports that many industry insiders expect a major incident within the next 6–12 months, most likely a cyberattack disrupting banking, internet access, power or water.\n\nOpenAI confirms it runs preparedness exercises, but says: \"These scenarios are not treated as inevitable, but are meant to help us prepare for a variety of circumstances.\"\n\nAnthropic declined to comment.", "created_at": "2026-10-09T11:40:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kimmonismus", "rt_author_name": "Chubby♨️", "likes": 2532, "retweets": 272, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HULkWv1XEAAbf7u.png"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2107071356936360352", "url": "https://x.com/deanwball/status/2107071356936360352", "text": "@lumpenspace there is not a 100% chance of a future where it’s possible for any random individual to create ultra destructive weapons (more destructive than nukes for instance), and only a sick person would hope for that future. you’re spitting at the mouth. I suggest a nap.", "created_at": "2026-10-05T11:32:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107056922830471337", "url": "https://x.com/deanwball/status/2107056922830471337", "text": "@lumpenspace like notice for example that I didn’t say anything about the *likelihood* of that scenario, just that it is the *one* scenario I can imagine where I am quite certain we will all be screwed. and you spin it into me being “anti progress.” Thought terminating.", "created_at": "2026-10-05T10:34:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107055872195350623", "url": "https://x.com/deanwball/status/2107055872195350623", "text": "@lumpenspace you seem obsessed with beating others rather than finding true things to say. generally speaking, I’d say the latter mentality is the better friend of progress, and yours is the traditional enemy of progress.", "created_at": "2026-10-05T10:30:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107044951217303939", "url": "https://x.com/deanwball/status/2107044951217303939", "text": "A very senior AI industry figure once started a conversation by asking me, basically, “under what circumstances do you think we are essentially just screwed?” and I replied with the scenario below.", "created_at": "2026-10-05T09:47:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 224, "retweets": 18, "media": [], "quoted": {"author": "dewierwan_", "text": "One of my biggest fears in AI safety is that this might be true:\n\n> The vulnerable world hypothesis is likely correct. Once enormous amounts of cognitive labor start getting applied to basic science, it will quickly become apparent how many avenues exist to create cheap, ultradestructive weapons technology. Solving this problem without global preventative policing (e.g. AI nonproliferation) is impossible, because hardening civilians against all avenues of attack is too expensive and will take too long."}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107040228661674138", "url": "https://x.com/deanwball/status/2107040228661674138", "text": "interesting argument from @BerenMillidge, a very careful thinker, on why AGI \"Pause\" (narrowly applied to RSI-relevant AI R&amp;D) might even accelerate the delivery of goods that AI optimists tout as the intended fruit of continued progress. https://t.co/NEaSJjqQ1I", "created_at": "2026-10-05T09:28:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "likes": 114, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT1VdZ7WwAAyKpp.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107032118047936736", "url": "https://x.com/deanwball/status/2107032118047936736", "text": "@alexcj4242 Agreed", "created_at": "2026-10-05T08:56:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "alexcj4242", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107028829986512922", "url": "https://x.com/deanwball/status/2107028829986512922", "text": "@spencerschiff_ This would not *surprise* me either.", "created_at": "2026-10-05T08:43:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "spencerschiff_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107026524251504980", "url": "https://x.com/deanwball/status/2107026524251504980", "text": "Research taste in particular may be trickier than it looks. Say the next generation of AI really does have an interesting, high-taste set of research directions to pursue. Well presumably find those fast, after which the fruit will have been plucked, and the ideas will no longer be high taste (because they’ve been explored en masse). This is a similar dynamic to the ever-moving target of “slop.” *Any* output that is recognizably of the agents becomes slop, or at least commodified, in a sense, once that output is sufficiently promulgated in bulk. Certain styles of math paper will become (are becoming) slop. Certain styles of web design already are. On and on it will go. It’s unclear if any kind of media/intellectual output proliferated at such scale can remain high taste, even if we’d have considered it genius from a human just a few years ago.\n\nThe bar will continually be raised. The world will get smarter as what was once brilliance becomes commodified, but *what was once brilliance will nevertheless be commodified.* And so the definition of brilliant will change. The wedge for continued value creation by humans lies here, I would guess.", "created_at": "2026-10-05T08:34:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 6, "media": [], "quoted": {"author": "theojaffee", "text": "SF people are increasingly conflating “RSI” with “foom”, as though automating AI R&amp;D will *certainly* cause huge discontinuous speedups in the rate of model capability advancements on *all* tasks. In practice this could be much slower and more jagged"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107019127844196521", "url": "https://x.com/deanwball/status/2107019127844196521", "text": "It may take another crank or two of the capabilities wheel, plus some months for inference costs to fall, before agent collectives like this really proliferate in a way that is noticeable to the average person. But it is clearly coming.", "created_at": "2026-10-05T08:04:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 64, "retweets": 11, "media": [], "quoted": {"author": "grove_research", "text": "@lfschiavo @aidigest_ @jazzloaf And last, The Swarmchasers team (including @rogesterone) found evidence of a Tencent agent fleet: https://t.co/go4hRxTlFg https://t.co/Wsq9b5yUcf"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106424094145081666", "url": "https://x.com/deanwball/status/2106424094145081666", "text": "this chart should be the death knell for the 2010s tech left whose theology compelled them to argue that Uber was some sort of labor law arbitrage that created no productivity benefits. the truth is that it created a far larger market than taxis ever had. the industrialists win", "created_at": "2026-10-03T16:40:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4857, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106380264641376527", "url": "https://x.com/deanwball/status/2106380264641376527", "text": "@NoemiTitarenco Very “Atlantic” flavor profile", "created_at": "2026-10-03T13:46:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NoemiTitarenco", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106376711374070250", "url": "https://x.com/deanwball/status/2106376711374070250", "text": "@NoemiTitarenco also today I learned about percebes", "created_at": "2026-10-03T13:31:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NoemiTitarenco", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106373927941574789", "url": "https://x.com/deanwball/status/2106373927941574789", "text": "@johnawahba true", "created_at": "2026-10-03T13:20:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "johnawahba", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106371010417320088", "url": "https://x.com/deanwball/status/2106371010417320088", "text": "I do believe I could sit by the sea and eat cooked-alive decapods and drink albarino for at least five consecutive hours", "created_at": "2026-10-03T13:09:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106368001889251685", "url": "https://x.com/deanwball/status/2106368001889251685", "text": "@IntuitMachine yep", "created_at": "2026-10-03T12:57:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "IntuitMachine", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106366672940511712", "url": "https://x.com/deanwball/status/2106366672940511712", "text": "@ZacharyGraves the bitter lesson is when all these fancy custom methods to improve shrimp welfare fail compared to leveraging more and more compute", "created_at": "2026-10-03T12:52:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ZacharyGraves", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106365535793655863", "url": "https://x.com/deanwball/status/2106365535793655863", "text": "openai staffer FIRED by WOKE EA WIZARDS after posting picture of DECAPITATED DECAPODS", "created_at": "2026-10-03T12:47:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106358722092253407", "url": "https://x.com/deanwball/status/2106358722092253407", "text": "guess I’m getting fired from the Effective Altruism Conspiracy https://t.co/Voa66RZYQw", "created_at": "2026-10-03T12:20:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 240, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTtKF21WoAAQvRg.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106357262709080384", "url": "https://x.com/deanwball/status/2106357262709080384", "text": "Recently there was a story reporting on OpenAI’s form 5500 (the public disclosure about our 401k program) which some people used to make observations with the flavor of “see, they don’t REALLY believe in advanced AI, or else they wouldn’t be saving money!”\n\nI contribute to my openai-sponsored 401k as well as other conventional retirement-savings vehicles. I cannot speak for any of my colleagues, but I can tell you why I personally make these contributions.\n\nFirst there is the reality that the whole “advanced AI means money has no value, either because we live in utopia and everything’s free or because we are all dead” are extreme ends of the spectrum of possible futures. It is true that things of this flavor, or other scenarios similar enough to this that one’s retirement savings don’t matter, *are* possible outcomes. But also there are many other plausible transformative futures, and I’m enough of a Burkean that I’m not going to jettison some of the oldest financial wisdom humans have developed (save money!) over my own projections about the future. It wouldn’t be responsible to my family, for one thing.\n\nFamily is an important part of my thinking on this topic for other reasons. In some sense, I want to live in a future where having set aside money for retirement is still prudent. That would mean the future, however transformed, is still familiar enough. A world where it truly doesn’t matter whether uou save may be a lovely place to live (or it may not), but regardless of its desirability it is a world SO transformed that, again, my Burkean prior kicks in. \n\nI *hope* the future is at least vaguely familiar to me as I exist today. I hope that at least some of the habits I have learned still matter in that future, and that some of the wisdom I have learned holds true. I hope that not just for me but for my son and future children. I do a lot of things out of this hope, and one small example is that I contribute to a 401k. \n\nA lot of people made their sneering observations about OAI employees’ 401k contributions, saying “derp de doo, revealed preferences, they don’t believe what they say.” That’s fine. Maybe that IS why some frontier AI company staff save for retirement. But I’d characterize my mentality about savings more as an article of faith at this point, and my biweekly 401k contributions as tiny prayers for a vaguely recognizable future.", "created_at": "2026-10-03T12:14:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 178, "retweets": 2, "media": [], "quoted": {"author": "sterlingcrispin", "text": "I'm 40 and struggle with retirement planning in the singularity, even if we stay on this pace without RSI. \n\nDo life extension drugs require 40+ years of savings rather than the standard 25? Will huge GDP growth mean a 3-4% withdraw rate is too conservative? Should I stop saving or double down? \n\nThe S&P has done 15% average over the last decade, well above the long term 10% returns. Is that the new normal to plan for, or are we going to rip even higher and start to see 20%+ averages over the 2026-2050 time period as new medicine and technology arrives at break neck speed?\n\nOr will AI create so much job loss that despite rapidly advancing technology things will flatten out?\n\nIf you're max bullish there's a point where you hit an amount of savings that continuing to save actually doesn't make any sense and you may as well spend it now.\n\nYou kind of have to hope for the best but plan for the worst and it's actually pretty confusing"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106330867345862699", "url": "https://x.com/deanwball/status/2106330867345862699", "text": "The contrast between hanging up the last phone call of the day of high-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.", "created_at": "2026-10-03T10:29:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 22397, "retweets": 608, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106138178935816204", "url": "https://x.com/deanwball/status/2106138178935816204", "text": "I agree with this. These web data access incidents tell us something about the scale and persistence of agents, but are not sophisticated from a cyber perspective, so using the word \"hack\" is not helpful.", "created_at": "2026-10-02T21:44:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 295, "retweets": 28, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106121035456385258", "url": "https://x.com/deanwball/status/2106121035456385258", "text": "@aarmlovi amirite https://t.co/5GhtyDwZ3N", "created_at": "2026-10-02T20:35:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "r
