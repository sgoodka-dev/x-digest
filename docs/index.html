author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2122711207799111856", "likes": 52, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122690925151359121", "url": "https://x.com/theobearman/status/2122690925151359121", "text": "Foreign ministry spokesperson re remote access: “this is a typical case of economic coercion and \"long-arm jurisdiction,\" which deviates from the consensus reached by both sides, harms the legitimate rights and interests of Chinese enterprises, and disrupts the stability of global supply chains. China will take necessary measures to resolutely safeguard its legitimate rights and interests.”", "created_at": "2026-11-17T13:58:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ZilanQian", "rt_author_name": "Zilan Qian", "rt_avatar": "https://pbs.twimg.com/profile_images/2042169253973897216/347E_UU6_normal.jpg", "rt_id": "2122674883024859334", "likes": 9, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVBjplXcAALX_j.jpg"}], "links": {"https://t.co/bS7vCpZp0u": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122578544945664493", "url": "https://x.com/theobearman/status/2122578544945664493", "text": "Joint Statement from Department of Commerce and Department of Justice on Megaspeed Investigation. https://t.co/aAdtN9aDfF", "created_at": "2026-11-17T06:32:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "CommerceGov", "rt_author_name": "U.S. Department of Commerce", "rt_avatar": "https://pbs.twimg.com/profile_images/1935412685031534592/Sy-z6DMb_normal.jpg", "rt_id": "2122533142137614375", "likes": 5502, "retweets": 1309, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXTApNvbkAAvyCx.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXTApNvbkAAvyCx.jpg"}], "links": {"https://t.co/aAdtN9aDfF": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122517224682643925", "url": "https://x.com/theobearman/status/2122517224682643925", "text": "🤷🏻‍♂️ https://t.co/2ntQKECXEz", "created_at": "2026-11-17T02:28:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "LukeTheNuke180", "rt_author_name": "Luke Littler", "rt_avatar": "https://pbs.twimg.com/profile_images/1875522414131412993/EnjjPFwd_normal.jpg", "rt_id": "2122452217038786808", "likes": 26366, "retweets": 1802, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122452113741545472/img/BGz_yzJAKXUOnm6C.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122452113741545472/img/BGz_yzJAKXUOnm6C.jpg"}], "links": {"https://t.co/2ntQKECXEz": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122509469309358420", "url": "https://x.com/theobearman/status/2122509469309358420", "text": "As others have pointed out, I think the form of those four third-party engagements is in many respects a step back compared to OpenAI’s previous engagements (with METR). For example, during the monitor red-teaming exercise, METR had access to OpenAI’s monorepo but this now seems to be off the table. Instead, we get very narrowly scoped (e.g. single RL run for METR, single threat model for Apollo) engagements where auditors only get to talk to “authorized” employees who are provided with OpenAI’s “guidance” beforehand.\n\nBased on my experience, this arrangement makes it very easy for OpenAI to carefully select models, subsets of data and employees to paint a rosy picture of the actual risk landscape.\n\nI think embedded auditing will only fulfill its aims if the auditors really get employee-level access as opposed to being hired to do a specific job (scoped by the company). The latter will invariably lead to important evidence being left out, missed or misrepresented. \n\nThere are at least three reasons why:\n\n1. First, it’s very difficult to anticipate all the questions that should be asked, or all of the data that should be analyzed. OpenAI tried that with METR during the Hugging Face investigation and as a result METR needed to come back to OpenAI’s office twice because on two previous occasions they didn’t get access to all the agent trajectories involved in the incident. And even then, the METR report ended up being very narrowly scoped, e.g. leaving the crazy story of agents taking control of OpenAI research infra out of scope.\n\n2. Second, the company under audit should not be allowed to decide what is audited and what information the auditor should have access to. There is an inherent conflict of interest in allowing the company to do so!\n\n3. Finally, without employee-level access, the only way for auditors to get anything close to a comprehensive picture is to rely on trusted relationships with many employees throughout the company who are willing to tell auditors information that may reflect poorly on the company. But I find it unlikely OpenAI employees will always raise those safety issues when (as I hear from my colleagues inside OpenAI) they are afraid they will share the fate of @balesni, @j_asminewang and me, fired after talking to third parties.\n\nSadly, OpenAI makes it clear now that @sama’s September tweet about “employee-like access” was just an awkward overpromise that the company wants to quietly walk back.", "created_at": "2026-11-17T01:57:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "rt_avatar": "https://pbs.twimg.com/profile_images/2078639764631388160/Tv___f9J_normal.jpg", "rt_id": "2122470090184769788", "likes": 244, "retweets": 30, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122779280329572365", "url": "https://x.com/theobearman/status/2122779280329572365", "text": "🧵 @AISecurityInst tested GPT-6.2 Astra\n-We found behaviours that suggest, like prior models, 6.2 Astra's alignment may fail in ways that result in real-world harm w/o additional mitigations\n-We identified a substantial regression in jailbreak robustness relative to GPT-6 Astra", "created_at": "2026-11-17T19:49:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "alxndrdavies", "rt_author_name": "Xander Davies", "rt_avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "rt_id": "2122768119039197527", "likes": 63, "retweets": 12, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "thread": [{"id": "2122768123007037630", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 1/4. We used a misalignment search tool to identify realistic simulated scenarios where 6.2 Astra acted against user intent, such as performing social engineering to execute an unsanctioned supply-chain attack and degrading work quality on a task it found problematic. https://t.co/dAipSXTsXu", "links": {"https://t.co/dAipSXTsXu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQYRfXgAAQJmW.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768123007037630", "created_at": "Tue Nov 17 19:05:34 +0000 2026"}, {"id": "2122768126592856535", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 2/4. We also observed a ‘correlated failure’ where OpenAI-based models failed to flag misaligned behaviour from other OpenAI models. Correlated failures like this undermine the reliability of LLM-based monitors. https://t.co/ilfh0J9Auu", "links": {"https://t.co/ilfh0J9Auu": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQmIMWsAAfXnK.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768126592856535", "created_at": "Tue Nov 17 19:05:35 +0000 2026"}, {"id": "2122768130208600469", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 3/4. Note:\n* We evaluated without cyber classifiers in place, to analyse the full range of model behaviour. (This is not the case for our jailbreaking evals.)\n* Our evaluations are entirely simulated and do not involve real-world actions or harm.", "links": {}, "media": [], "url": "https://x.com/alxndrdavies/status/2122768130208600469", "created_at": "Tue Nov 17 19:05:36 +0000 2026"}, {"id": "2122768133702447214", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Alignment 4/4. Alignment evals have previously failed to identify serious model failures prior to incidents occurring—6.2 Astra may also fail in ways not identified in our testing. We note additional limitations such as eval awareness in the system card. https://t.co/UGp629v94M", "links": {"https://t.co/UGp629v94M": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWQ8e6XoAAXR3u.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768133702447214", "created_at": "Tue Nov 17 19:05:36 +0000 2026"}, {"id": "2122768137288302846", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Jailbreak 1/3. We tested two versions of the pre-release model, an original checkpoint and an updated one OAI believed had improved robustness on their metrics. For both versions, a single researcher developed a universal cyber jailbreak in half the queries required for 6 Astra. https://t.co/cxsV6C4ddg", "links": {"https://t.co/cxsV6C4ddg": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWRee-XAAAPpPK.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768137288302846", "created_at": "Tue Nov 17 19:05:37 +0000 2026"}, {"id": "2122768140690206993", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Jailbreak 2/3. We initially developed this jailbreak for single-turn cyber questions, and then extended it to agentic cyber tasks, also at about half the cost observed for GPT-6 Astra. https://t.co/rrHfsQc0Fa", "links": {"https://t.co/rrHfsQc0Fa": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWRwWJWEAEtj8w.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768140690206993", "created_at": "Tue Nov 17 19:05:38 +0000 2026"}, {"id": "2122768143844020517", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Jailbreak 3/3. In response to our testing, OAI made changes to their safeguards and believe this regression is mitigated. They presented these findings to us + offered the opportunity to repeat our eval over 3 extra business days. We have not yet independently tested the changes https://t.co/zRv7861Ee6", "links": {"https://t.co/zRv7861Ee6": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWSTklW8AAD-qe.jpg"}], "url": "https://x.com/alxndrdavies/status/2122768143844020517", "created_at": "Tue Nov 17 19:05:39 +0000 2026"}, {"id": "2122768146700632420", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "Our alignment work was led by @AlexandraSouly and @_robertkirk, with contributions from Olli Järviniemi and @kaifronsdal. Our jailbreaking work was led by @SeoirseMurray with contributions from Eric Winsor. This is an incredible team I'm very proud to work with.", "links": {}, "media": [], "url": "https://x.com/alxndrdavies/status/2122768146700632420", "created_at": "Tue Nov 17 19:05:39 +0000 2026"}, {"id": "2122772481148674150", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "text": "@AlexandraSouly @_robertkirk @kaifronsdal @SeoirseMurray Read more in the system card: https://t.co/No7KdvO5RN", "links": {"https://t.co/No7KdvO5RN": "https://deploymentsafety.openai.com/gpt-6-2-astra-sol"}, "media": [], "url": "https://x.com/alxndrdavies/status/2122772481148674150", "created_at": "Tue Nov 17 19:22:53 +0000 2026"}], "enriched": 3}, {"id": "2122777314606084177", "url": "https://x.com/theobearman/status/2122777314606084177", "text": "OpenAI is speedrunning AI takeover Any% https://t.co/8jGllLcJ4y", "created_at": "2026-11-17T19:42:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "rt_avatar": "https://pbs.twimg.com/profile_images/1831493788679761920/-q9w6dzd_normal.jpg", "rt_id": "2122759615184015783", "likes": 115, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWObJHXIAASiS7.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWObJHXIAASiS7.png"}], "links": {"https://t.co/8jGllLcJ4y": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122757778003603756", "url": "https://x.com/theobearman/status/2122757778003603756", "text": "UKAISI: \"GPT-6.2 Astra is able to perform more difficult tasks without producing visible reasoning than past models. GPT-6.2 Astra is substantially more capable than GPT 6 Astra at this ‘no-CoT reasoning’, while GPT 6 Astra was already a dramatic jump above the pre-existing trend.\"\n\n\"This capability could allow GPT-6.2 Astra to better evade monitors, for example by allowing it to strategically consider when and how to obfuscate actions without producing incriminating reasoning.\"\n\nhttps://t.co/T6hxKDzfQH", "created_at": "2026-11-17T18:24:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWMiB_XQAEyWMC.jpg"}], "links": {"https://t.co/T6hxKDzfQH": "https://deploymentsafety.openai.com/gpt-6-2-astra-sol/external-evaluation-for-monitorability-uk-aisi", "https://t.co/1xbQbkv1X2": ""}, "quoted": {"id": "2122750124543926515", "author_name": "OpenAI", "links": {"https://t.co/qr2iP0GpfX": "https://openai.com/index/introducing-gpt-6-2-astra-sol", "https://t.co/jLCyVIws2Y": ""}, "author": "OpenAI", "text": "Some of you have been asking very politely. Some of you have just been asking.\n\nGPT-6.2 Astra and Sol are now available.\n\nSuper efficient and built to perform where it counts—the real world.\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y"}, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122753025936879729", "url": "https://x.com/theobearman/status/2122753025936879729", "text": "@tszzl @_NathanCalvin I don't buy that trust is currently the limiting factor\n- Previously METR got monorepo access for an investigation, but I didn't see that access being given here. They also aren't able to investigate internal incidents which I consider a step back from HuggingFace.\n- Apollo has been working with OpenAI for years, with fairly deep access, and I've never heard complaints\n- OpenAI has strong redaction rights, which IMO makes the risk of sharing IP or letting assessors talk to employees of their choice pretty low (the logged conversations part is more reasonable, to avoid potential misunderstandings)\n- It doesn't seem reasonable to be too worried about security, given the base rate of employees with way more IP moving between labs, with no non-compete, and the fact that people were able to hack on to the OpenAI Slack (so presumably foreign adversaries have already)\n\nMore generally, if we could seriously have AGI within 12 months, do we really have time to mess around with pilots like this?", "created_at": "2026-11-17T18:05:34+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2122671440633667667", "likes": 80, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122752665562038717", "url": "https://x.com/theobearman/status/2122752665562038717", "text": "According to our latest AI Threat Tracker report, threat actors are now using autonomous LLM frameworks to create and launch exploits, based on newly released patch notes - all without human involvement. More on these trends and how @Google is strengthening model safety and defenses: https://t.co/sklz6BRFRD", "created_at": "2026-11-17T18:04:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "JumpforJoyce", "rt_author_name": "Sandra Joyce", "rt_avatar": "https://pbs.twimg.com/profile_images/1705045322399961088/Ly3U_Boz_normal.jpg", "rt_id": "2122725265914614187", "likes": 19, "retweets": 6, "media": [], "links": {"https://t.co/sklz6BRFRD": "https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold"}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122751768278823148", "url": "https://x.com/theobearman/status/2122751768278823148", "text": "“GPT-6.2 Astra is our first externally released model to meet the High threshold for AI Self-improvement, which measures a model’s ability to accelerate AI research. A ‘High’ designation reflects our assessment that the model’s impact is equivalent to giving every OpenAI researcher an additional, highly capable research engineer as an assistant, relative to their 2024 baseline. We track this capability because models that can help develop future AI systems could also introduce new risks to safety, like accelerating progress faster than safeguards or human oversight can adapt.”\n\nhttps://t.co/vyz4RtYcr3", "created_at": "2026-11-17T18:00:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWHeyQXgAAu9kT.jpg"}], "links": {"https://t.co/vyz4RtYcr3": "https://deploymentsafety.openai.com/gpt-6-2-astra-sol", "https://t.co/7bitYoVZ7W": ""}, "quoted": {"id": "2122750124543926515", "author_name": "OpenAI", "links": {"https://t.co/qr2iP0GpfX": "https://openai.com/index/introducing-gpt-6-2-astra-sol", "https://t.co/jLCyVIws2Y": ""}, "author": "OpenAI", "text": "Some of you have been asking very politely. Some of you have just been asking.\n\nGPT-6.2 Astra and Sol are now available.\n\nSuper efficient and built to perform where it counts—the real world.\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y"}, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122750274402173177", "url": "https://x.com/theobearman/status/2122750274402173177", "text": "GPT-6.2 Astra is our most capable model ever for cyber. It jumps 22 points over GPT-6 Astra on ExploitBench Internal Port.\n\nDue to increased capabilities, we’re launching GPT‑6.2 Astra and Sol with tighter safeguards for higher-risk cybersecurity assistance. We are working to bring these models to Daybreak so approved defenders can access them with reduced refusals.", "created_at": "2026-11-17T17:54:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2122750133133791592", "likes": 928, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWDPqjbsAA501X.png"}], "links": {"https://t.co/zDvTLtMDOH": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122750225437647114", "url": "https://x.com/theobearman/status/2122750225437647114", "text": "Some of you have been asking very politely. Some of you have just been asking.\n\nGPT-6.2 Astra and Sol are now available.\n\nSuper efficient and built to perform where it counts—the real world.\n\nhttps://t.co/qr2iP0GpfX https://t.co/jLCyVIws2Y", "created_at": "2026-11-17T17:54:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2122750124543926515", "likes": 20777, "retweets": 2065, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122746240823943168/img/osC4AgQC_BfZl2EH.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122746240823943168/img/osC4AgQC_BfZl2EH.jpg"}], "links": {"https://t.co/qr2iP0GpfX": "https://openai.com/index/introducing-gpt-6-2-astra-sol", "https://t.co/jLCyVIws2Y": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122749304351703088", "url": "https://x.com/theobearman/status/2122749304351703088", "text": "The #FBI issued a FLASH advisory warning that cybercriminals and state-aligned hackers are exploiting ARTEX, a super intelligence-powered penetration testing framework, to automate attacks against businesses and organizations worldwide. ARTEX can accelerate intrusions from initial targeting to privileged access in under three hours. It was used in the October ConnectWise supply-chain compromise, which exposed Microsoft 365 customer environments and involved attempted authentication against more than 2,250 downstream tenants. \n\nThe FBI is urging businesses and organizations to strengthen access controls, monitor suspicious automated activity, and report potential compromises to https://t.co/Y65F8KJfqo.\n\nRead more here: https://t.co/Cl5lpZ7cgG", "created_at": "2026-11-17T17:50:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FBIDallas", "rt_author_name": "FBI Dallas", "rt_avatar": "https://pbs.twimg.com/profile_images/1957468982857834497/SaldB33k_normal.jpg", "rt_id": "2122706613014323682", "likes": 26524, "retweets": 7588, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVeajgX0AAK5yh.jpg"}], "links": {"https://t.co/Y65F8KJfqo": "http://ic3.gov", "https://t.co/Cl5lpZ7cgG": "https://www.ic3.gov/CSA/2026/261113.pdf", "https://t.co/TwsbGYJfH4": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122749146671301014", "url": "https://x.com/theobearman/status/2122749146671301014", "text": "GTIG just put out the AI threat tracker, full of case studies from Mandiant IRs, Gemini, and everywhere else we’re watching the threat evolve.\n\nBig takeaways for me are the n-day problem (speed), the agentic frameworks (scale), and LLMJacking (scale).\n\nhttps://t.co/TiXD0qO0c4", "created_at": "2026-11-17T17:50:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "JohnHultquist", "rt_author_name": "John Hultquist", "rt_avatar": "https://pbs.twimg.com/profile_images/1422624663096672262/YV-tpatU_normal.jpg", "rt_id": "2122736490606473424", "likes": 52, "retweets": 16, "media": [], "links": {"https://t.co/TiXD0qO0c4": "https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold"}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122743251576701153", "url": "https://x.com/theobearman/status/2122743251576701153", "text": "Over the past week, I’ve been overwhelmed by the love and support of friends, industry colleagues, and people I've never met. Thank you to everyone who has shown kindness to my family and me. It means the world to me.\n\nI came to the United States 53 years ago, and becoming an American citizen is one of the greatest gifts and proudest moments of my life. NVIDIA has been my life’s work. Building it into the company it is today alongside my colleagues has been a privilege and an honor. Nowhere but in America could a company like NVIDIA be possible. I love our country, and I love NVIDIA.\n\nI did not live up to the standards expected of everyone at NVIDIA, and I have made serious mistakes in my personal life. I created problems for the Board that I deeply regret. I own my mistakes completely, and I am committed to cooperating with the Board’s independent investigation. \n\nSince my departure, I’ve seen an outpouring of calls from NVIDIA’s employees, investors, business partners, and customers for me to return as CEO. Many continue to reach out to me directly as the company navigates complex technology, market, competitive, and geopolitical dynamics. NVIDIA is a once-in-a-generation company. If the Board of Directors decides that my return is in the best interest of our shareholders, our employees, the company, and America, I would be honored to answer these calls and return as CEO.\n\nThank you again to everyone who has shared their good wishes. I am profoundly humbled by your support. To my family: I love you, and I will spend the rest of my life being worthy of yours.\n\nJensen", "created_at": "2026-11-17T17:26:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "JensenHuang", "rt_author_name": "Jensen Huang", "rt_avatar": "https://pbs.twimg.com/profile_images/2080613261674962944/OMXX4RJ3_normal.jpg", "rt_id": "2122726005219737649", "likes": 617245, "retweets": 70238, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122743231284728294", "url": "https://x.com/theobearman/status/2122743231284728294", "text": "There are lots of outages... Why? AI attacks? \n\nMy more normal guess is that because there have been a lot of AI-discovered cyber vulnerabilities (including lots probably not yet disclosed), companies across all industries are having to do a lot of patches and upgrades, probably faster than usual. Such upgrades can sometimes go wrong, causing outages.", "created_at": "2026-11-17T17:26:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2122727082492866681", "likes": 410, "retweets": 45, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2122796815611310426", "url": "https://x.com/theobearman/status/2122796815611310426", "text": "SEC Is Probing Nvidia Amid Departure of CEO Jensen Huang https://t.co/n5zP7pus2h", "created_at": "2026-11-17T20:59:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "WSJbusiness", "rt_author_name": "WSJ Business News", "rt_avatar": "https://pbs.twimg.com/profile_images/954403794057662464/kTFdxq55_normal.jpg", "rt_id": "2122796038993887594", "likes": 6, "retweets": 2, "media": [], "links": {"https://t.co/n5zP7pus2h": "https://on.wsj.com/4j3TyFX"}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122793824389079406", "url": "https://x.com/theobearman/status/2122793824389079406", "text": "US DNI CLAYTON SAYS ON TECH OUTAGES THAT HE IS NOT SEEING THIS AS A CYBER ATTACK INCIDENT, ADDING THAT LOTS OF INSTITUTIONS ARE PATCHING OR UPGRADING THEIR SYSTEMS - FOX BUSINESS", "created_at": "2026-11-17T20:47:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2122793772576874668", "likes": 37, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2122780816698913135", "url": "https://x.com/theobearman/status/2122780816698913135", "text": "We also evaluated how many serial reasoning steps GPT-6.2 Astra can do in a single output token (without chain of thought). It can perform 12.3 steps, versus 10.5 for GPT-6 Astra and 8.6 for GPT-6.1 Sol, the previous highs. We measure the number of steps models can perform at an accuracy of 25% above chance, where each step is normalized for complexity.\n\nBefore GPT-6 Astra’s release, the most capable model was Claude Fable 5.1, which is able to perform only 4.2 serial steps. The oldest model we assessed is Claude Opus 3, which performed 2.3 steps.\n\nThis capability is notable because models that can do complex reasoning without any chain of thought may be harder to monitor.\n\nWe hope to finalize this and other measurements of more abstract model capabilities, and release them in the coming weeks.", "created_at": "2026-11-17T19:56:00+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2122762411287748696", "likes": 263, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWRKfna8AAtzo6.jpg"}], "links": {"https://t.co/8RytXwZCzz": ""}, "quoted": null, "fetched_at": "2026-11-17T22:53:42.176480+00:00", "enriched": 3}, {"id": "2123067134578233727", "url": "https://x.com/theobearman/status/2123067134578233727", "text": "SITUATION DETECTED: The White House and Treasury are discussing a proposal that would require US companies to publicly disclose the use of Chinese open-weight AI models on their websites, aiming to discourage their use through public pressure, per Reuters.", "created_at": "2026-11-18T14:53:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2123051208067928066", "likes": 1052, "retweets": 82, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123065911032819887", "url": "https://x.com/theobearman/status/2123065911032819887", "text": "🚨 WATCH: Andy Burnham jokes about his aide who was caught on a train using ChatGPT to modify his speech \n\n\"This morning I had meetings with ministerial colleagues and others, and according to ChatGPT, I will have further such meetings later today\" \n\n#PMQs https://t.co/DVRo9CLR9F", "created_at": "2026-11-18T14:48:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "PolitlcsUK", "rt_author_name": "Politics UK", "rt_avatar": "https://pbs.twimg.com/profile_images/1688954450675740688/t1aS9_3Y_normal.jpg", "rt_id": "2123024765015253178", "likes": 2476, "retweets": 96, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123024075052158976/img/Y3E-szMM6ae_VxsC.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123024075052158976/img/Y3E-szMM6ae_VxsC.jpg"}], "links": {"https://t.co/DVRo9CLR9F": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123065639451480480", "url": "https://x.com/theobearman/status/2123065639451480480", "text": "Utter recklessness from Microsoft.", "created_at": "2026-11-18T14:47:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123060707369374183", "author_name": "Leo Schwartz", "links": {"https://t.co/ghn4VsZ3tZ": "https://www.theinformation.com/articles/microsoft-nears-500-million-deal-sell-ai-bytedance-irking-openai", "https://t.co/7OhRsfSW3d": ""}, "author": "leomschwartz", "text": "Scoop: The Chinese TikTok-developer ByteDance is in advanced talks with Microsoft to spend an additional ~$500 million, primarily to access OpenAI models through Azure, after getting cut off from Anthropic. \n\nThe potential deal has drawn the ire of OpenAI, which has raised concerns about Chinese firms distilling its models, but can't stop Microsoft thanks to its restrictive partnership deal. \n\nThe move comes amid increased scrutiny over the relationship between Chinese and U.S. AI companies, especially over distillation concerns.\n\nW/ @QianerLiu and @aaronpholmes:\n\nhttps://t.co/ghn4VsZ3tZ"}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123120209808548084", "url": "https://x.com/theobearman/status/2123120209808548084", "text": "The recommendations from Governor Newsom's recently convened expert panel - Professor Alondra Nelson (Princeton), Jason Goldman, Professor Robert Reich (Stanford), and Professor Gillian Hadfield (Johns Hopkins) - were just released and are a clarion call for urgent action to address risks to public safety from advanced AI systems. \n\nSome of the most notable recommendations: \n• Emergency shutdown authority \n• Minimum safety standards for AI developers\n• Mandatory third party oversight\n• Authority to cap the amount of compute used for RSI \n\nThe next weeks and months will determine whether these recommendations are words on paper, or whether the Governor and legislature can work together to accomplish something historic to protect CA and lead the country on guardrails to prevent catastrophic risks from runaway AI development.", "created_at": "2026-11-18T18:24:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2123112668831563907", "likes": 94, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbOwEJWcAA7KLq.jpg"}], "links": {"https://t.co/k0DVF88g8z": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123102487150268644", "url": "https://x.com/theobearman/status/2123102487150268644", "text": "This is a more detailed, fleshed out and stressed-tested version of a proposal we floated earlier in response to the Pacing the Frontier open letter. It's not the only way to pace the frontier but it's my favorite proposal at the moment. Pretty simple: Shift compute from AI capabilities R&D towards other things, and let third party auditors verify that you have done so.", "created_at": "2026-11-18T17:14:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2123101739239018963", "likes": 198, "retweets": 17, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123098947346485350", "url": "https://x.com/theobearman/status/2123098947346485350", "text": "How monitorable is GPT-6.2 Astra? While it might look like it got better, overall I think GPT-6.2 Astra harder to monitor than GPT-6 Astra in the contexts we care about. That’s easy to miss in the system card plots, so here's a short thread. https://t.co/ctuvpaomAg", "created_at": "2026-11-18T17:00:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "rt_avatar": "https://pbs.twimg.com/profile_images/2078639764631388160/Tv___f9J_normal.jpg", "rt_id": "2122795881544245519", "likes": 143, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWuE5sbsAEHhQX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWuE5sbsAEHhQX.jpg"}], "links": {"https://t.co/ctuvpaomAg": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123098447142342767", "url": "https://x.com/theobearman/status/2123098447142342767", "text": "@thlarsen Great job! Nice to see that (fictional) @miclchen got a shoutout too. https://t.co/bz9B6nHALV", "created_at": "2026-11-18T16:58:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "thlarsen", "reply_to_id": "2123082668829229088", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbCnEdWQAI1XpB.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbCnEdWQAI1XpB.png"}], "links": {"https://t.co/bz9B6nHALV": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123082668829229088", "author_handle": "thlarsen", "author_name": "Thomas Larsen", "text": "See our proposal here: https://t.co/OhAaC11s6H\n\nNote that we wrote this relatively quickly and scrappily, given how urgent we think the situation is (see AIFPs recent timelines update). We hope to follow up with more relevant analysis in the coming weeks.", "links": {"https://t.co/OhAaC11s6H": "https://pacing-ai.com/home"}, "media": [], "url": "https://x.com/thlarsen/status/2123082668829229088", "created_at": "Wed Nov 18 15:55:27 +0000 2026"}, "enriched": 3}, {"id": "2123095876940013930", "url": "https://x.com/theobearman/status/2123095876940013930", "text": "Policymakers might try to slow down AI progress very soon. But most 'pacing' ideas would backfire: they're either too complex to work fast, or too much of a band-aid to last.\n\nToday's essay looks at the politics of our least bad options to slow down AI.\nhttps://t.co/kkeOBjvKYT", "created_at": "2026-11-18T16:47:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "anton_d_leicht", "rt_author_name": "Anton Leicht", "rt_avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "rt_id": "2123094842334990752", "likes": 25, "retweets": 4, "media": [], "links": {"https://t.co/kkeOBjvKYT": "https://writing.antonleicht.me/p/pacing"}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123095633598775711", "url": "https://x.com/theobearman/status/2123095633598775711", "text": "oh wow intelligence explosion mentioned! \n\n\"What is even more alarming is that cutting-edge models are already showing signs of breaking free from human constraints; as artificial intelligence undergoes an intelligence explosion, it may develop objectives that diverge from human expectations, and could even pose major security risks that threaten human survival.", "created_at": "2026-11-18T16:46:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ZilanQian", "rt_author_name": "Zilan Qian", "rt_avatar": "https://pbs.twimg.com/profile_images/2042169253973897216/347E_UU6_normal.jpg", "rt_id": "2122810544616808568", "likes": 125, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXW85zcWoAAkMp4.png"}], "links": {"https://t.co/5LNN0czvcH": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123095478254641330", "url": "https://x.com/theobearman/status/2123095478254641330", "text": "Update: I'm no longer advising AI companies. I think they're too constrained to make the situation much better, so I'll stay independent until there is a meaningful slowdown or moratorium on this reckless race.", "created_at": "2026-11-18T16:46:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "hendrycks", "rt_author_name": "Dan Hendrycks", "rt_avatar": "https://pbs.twimg.com/profile_images/2065914215731515392/RYkZdcb__normal.jpg", "rt_id": "2123082552781218100", "likes": 395, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123089773631799438", "url": "https://x.com/theobearman/status/2123089773631799438", "text": "We’re releasing a concrete proposal for how a near term AI slowdown could work. It involves:\n1. AI companies declaring how they are using their compute and letting third party auditors verify those disclosures. We call this Verified Compute Allocation Disclosures (VCAD). \n2. Compute Reallocation towards serving customers and safety, away from capabilities R&D. \n\n(2) slows AI capabilities , while (1) makes the slowdown credible. \n\nAI companies currently seem to be going for ‘safety case pacing’. But: (i) there’s no consensus on what a valid safety case looks like so there’s no way to consistently audit for compliance, and (ii) if the R&D doesn’t get paused, temporarily delaying a training run for safety doesn’t meaningfully slow the overall trajectory of capabilities progress. It would be great if we had a viable safety case regime, but we need much more time to get it working. \n\nCompute reallocation is a good pacing proposal because it is relatively specific, can be verified, and would lead to a more durable slowdown.", "created_at": "2026-11-18T16:23:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "rt_avatar": "https://pbs.twimg.com/profile_images/2075083315468734464/Y0RF7vaZ_normal.jpg", "rt_id": "2123082667457740990", "likes": 318, "retweets": 65, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123172339458429246", "url": "https://x.com/theobearman/status/2123172339458429246", "text": "Gemini 4 Neon: frontier-level intelligence with fast end-to-end task completion across complex software engineering, knowledge work, and science workflows.\n\nBegins rolling out today in the Gemini API in @GoogleAIStudio, Gemini for business, for paid Google AI Pro and Ultra subscribers in Google @Antigravity, and for Google AI Pro and Ultra subscribers in the @GeminiApp.", "created_at": "2026-11-18T21:51:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "sundarpichai", "rt_author_name": "Sundar Pichai", "rt_avatar": "https://pbs.twimg.com/profile_images/2051799620062429184/AL8CoAUG_normal.jpg", "rt_id": "2123167780988125621", "likes": 4593, "retweets": 360, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXb9cQabgAAOkkn.png"}], "links": {"https://t.co/FMiFCFvejw": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123151325382779238", "url": "https://x.com/theobearman/status/2123151325382779238", "text": "A lot has happened in the past couple months, to say the least.\n\nToday we are sharing a recap of what it takes to move a frontier model from training to internal use to public release. As model capabilities rise, so do the safety and alignment standards required to move forward to the next stage.\n\nTo meet these standards, we rely on four layers of protection:\n1. Model alignment: train models to reliably act as intended and respect human oversight.\n2. Security and sandboxing: restrict what models can access and affect.\n3. Blocking safeguards: stop harmful or unauthorized actions before they happen.\n4. Monitoring and response: detect concerning behavior and intervene.\n\nThe post brings together efforts from across the company, with links to recent research, technical work, and incident reports we’ve published. This is the baseline operational discipline we owe people as we continue training and deploying models - necessary work, but not a solution to alignment in the limit. There’s a lot more to do, and will continue keeping you informed as the thinking and work evolves. 🏗️\n\nhttps://t.co/87zeS2zI8L", "created_at": "2026-11-18T20:28:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "kaicathyc", "rt_author_name": "Kai", "rt_avatar": "https://pbs.twimg.com/profile_images/1657816900817272832/ioGq5O0t_normal.jpg", "rt_id": "2123146093366333850", "likes": 429, "retweets": 46, "media": [], "links": {"https://t.co/87zeS2zI8L": "https://openai.com/index/managing-frontier-ai-risk/"}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123136971736568220", "url": "https://x.com/theobearman/status/2123136971736568220", "text": "Agentic inference capacity grew 4.6× from Q2 2025 to Q2 2026. This compares with just 2.6× growth in compute, according to our Inference Performance Index (IPI).\n\nNvidia’s Blackwell generations accounted for 74% of the added inference capacity, reflecting both growing sales and higher inference performance per GPU.\n\nThis shows that FLOP/s alone understate how quickly the capacity to run AI models is growing.", "created_at": "2026-11-18T19:31:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2123114112054112529", "likes": 122, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbRCIxbIAAid-R.png"}], "links": {"https://t.co/hRx92e963M": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123136800931655744", "url": "https://x.com/theobearman/status/2123136800931655744", "text": "Newsom calling for ability to cap RSI.", "created_at": "2026-11-18T19:30:33+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ShakeelHashim", "rt_author_name": "Shakeel", "rt_avatar": "https://pbs.twimg.com/profile_images/2040085763069759488/6l87iR68_normal.jpg", "rt_id": "2123126922091610373", "likes": 39, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123441998074200227", "url": "https://x.com/theobearman/status/2123441998074200227", "text": "Investors treated $AMD as the winner of Nvidia’s China crisis.\n\nThe problem: AMD has a China problem of its own.\n\nOur investigation: https://t.co/9AR6HGgEhx", "created_at": "2026-11-19T15:43:18+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "hntrbrkmedia", "rt_author_name": "Hunterbrook", "rt_avatar": "https://pbs.twimg.com/profile_images/1973484274704580608/uPBoQjUj_normal.jpg", "rt_id": "2123438428977025178", "likes": 172, "retweets": 46, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123438347305484288/img/OOQcsIT5wb8YciPM.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123438347305484288/img/OOQcsIT5wb8YciPM.jpg"}], "links": {"https://t.co/9AR6HGgEhx": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123438151696101509", "url": "https://x.com/theobearman/status/2123438151696101509", "text": "If you don’t laugh, you cry.", "created_at": "2026-11-19T15:28:01+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123431214983864444", "author_name": "zerohedge", "links": {"https://t.co/SlqHbIR5C4": ""}, "author": "zerohedge", "text": "Seaport just won the internet, and it's not even close:\n\n\"Anthropic could develop AI systems which become fully autonomous and wipe out humanity which may lead to a serious decline in earnings.\""}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123279126291173715", "url": "https://x.com/theobearman/status/2123279126291173715", "text": "We're sharing new data on how AI is changing research at OpenAI.\n\nWe find researchers' AI use continues to rise exponentially, and agents are completing longer tasks, but human involvement remains central in research. Researchers are also spending more time on safety and alignment, with human effort in these areas growing faster than in any other individual research area.\n\nThis report aims to increase transparency around research acceleration and inform the governance of increasingly capable AI. We believe that AI labs should be required to track and publicly report indicators of recursive self-improvement (RSI): the process by which AI accelerates the development of future AI systems. \n\nOur hope is that this expanded report will help sustain and advance shared measurement norms across the industry.\n\nhttps://t.co/xyGPcCkPCK", "created_at": "2026-11-19T04:56:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2123191365983248653", "likes": 3028, "retweets": 290, "media": [], "links": {"https://t.co/xyGPcCkPCK": "https://openai.com/index/research-acceleration-jagged-frontier/"}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123475929380905331", "url": "https://x.com/theobearman/status/2123475929380905331", "text": "DARIO: “[…] to state it unequivocally, we will pace the training and deployment of AI systems, taking as long as is necessary to have confidence that they are safe and will remain under human control. We will not bend to either business or political pressure.”", "created_at": "2026-11-19T17:58:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123461658890686863", "author_name": "Anthropic", "links": {}, "author": "AnthropicAI", "text": "Remarks from Anthropic CEO @DarioAmodei on our initial public offering:\n\nMy co-founders and I started Anthropic because we believe that the most powerful technology of our time should be built for the benefit of humankind.\n\nDaniela and I lost our father to a disease that, just a few years later, became curable. I started my career in biology, hoping to help future cures come sooner. In the lab, I saw the vast thicket of complexity that scientists face when they’re trying to understand disease and develop new treatments.\n\nSo many of the scientific tools that can cut through that thicket—tools for gene editing, gene synthesis, controlling brain cells with light—started as pure ideas. In other words, they came from thinking. From intelligence.\n\nHuman intelligence has already made diseases like plague, smallpox, and polio history for most of the world. But progress on other diseases has been too slow for so many patients and their families. Going from a great idea to a treatment can take decades: it took many years from the first discovery of a strange repeating pattern in DNA to the approval of the first treatment for a disease using CRISPR.\n\nNature is full of these patterns. But we’ve had too little intelligence to decipher most of them; too few scientists, with too little time. Now we can build that intelligence. Whether it’s protein folding, drug design, cancer genetics, or clinical trial administration, scientists across many areas of biology and medicine are finding Claude can help them do their research in a fraction of the time it would’ve taken just a couple of years ago. I believe sufficiently powerful AI, working in concert with humans, could compress a century of scientific and medical progress into a decade.\n\nI don’t want to get ahead of myself. At this point all we have are early results. Experiments and clinical trials will still take time. And although they involve slow and ponderous processes, I believe those processes can be substantially accelerated by AI. We hope that in the future fewer families miss a cure by just a few years.\n\nMedicine is just a particularly vivid example, but there are many others. Our customers—the world’s most ambitious companies, nonprofits, and individual people—are already applying the intelligence we’ve built to stimulate economic growth; lift people out of poverty; protect democracy and free societies; even make everyday services like the DMV work better. We’re proud to work alongside them. And I’m extremely optimistic about what we can do together in the future.\n\nAt the same time, we have always been honest that this technology has very real risks. These range from misuse of the technology by individuals or nation-states, to economic disruption, to losing control of AI systems. We discuss these risks not because we think they are inevitable, but because we think they are avoidable.\n\nAvoiding them depends on the choices made by the people building AI. There is a gigantic difference between how AI will go if we pay little attention to safety, versus how it will go if we are obsessed with safety. And an obsession with safety and with public benefit has been woven into Anthropic’s DNA from the start. From safeguards against biological and cyber risks, to alignment training and testing, to looking inside our models like an X-ray, Anthropic has pioneered methods for understanding and steering the behavior of AI systems.\n\nThere is much work still to be done, and the most difficult safety work lies ahead of us. The incredible talent of the company that has enabled us to build the most capable AI systems will need to be directed, even more so than it has already, towards double- and triple-checking that those AI systems are safe and secure.\n\nAnd to state it unequivocally, we will pace the training and deployment of AI systems, taking as long as is necessary to have confidence that they are safe and will remain under human control. We will not bend to either business or political pressure. Today puts the company in a stronger financial position, and in doing so only strengthens our resolve to do the right thing.\n\nIf we can show it’s possible to make the right choices on safety and still build an incredibly successful company, others in our industry will be inspired to do the same. We call this a race to the top. When the race to the top is working properly, it doesn’t matter which company has the best models—everyone wins because everyone is building safely. The race to the top works best when driven from the front of the pack, and we fully hope and expect to do so, but the goal is to make the whole industry better, regardless of whether Anthropic is winning or losing at any given time.\n\nThe advent of machine intelligence is one of the seminal moments in human history, and we have a rare opportunity to shape it for the better.\n\nThis moment is bigger than any one company, or any one country. It will take all of us, working together, to ensure this technology goes well for us and the many generations to come. Starting today, we hope that you’ll join us on this mission."}, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123450981954601052", "url": "https://x.com/theobearman/status/2123450981954601052", "text": "AI monitors are the main safeguard against threats from agents during internal deployment. Given their important role, we think that third-party embedded evaluators assess the monitoring infrastructure of frontier AI developers.\n\nOur monitoring assessment consists of 6 claims. https://t.co/3LA0o7dsQg", "created_at": "2026-11-19T16:19:00+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "rt_avatar": "https://pbs.twimg.com/profile_images/1663548513148633088/VbohMMpy_normal.jpg", "rt_id": "2123446203337609243", "likes": 27, "retweets": 3, "media": [{"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXf2qkWXcAE_iLp.jpg"}, {"type": "animated_gif", "url": "https://pbs.twimg.com/tweet_video_thumb/HXf2qkWXcAE_iLp.jpg"}], "links": {"https://t.co/3LA0o7dsQg": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2121306411670098178", "url": "https://x.com/anton_d_leicht/status/2121306411670098178", "text": "@TomDavidsonX I'm pretty confident that the odds of Europe refusing inspections agreed upon by the US and China are very low.\n\nAlso, allied buildout draws domestic compute from great powers, but it also draws international compute away from the gulf or SEA - which seems good for enforcement!", "created_at": "2026-11-13T18:17:15+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2121302355560005791", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121302355560005791", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "For a while I was excited about building data centres in Europe. For the obvious reason that without them Europe will be economically and militarily at the mercy of the US and China.\n\nBut now I'm not so sure.\n\nIf there's a US-China deal to restrict AI development, it might be much harder to verify if there's lots of compute in Europe.\n\nEven if China can verify that the US isn't developing powerful AI, they might worry that the US has secretly given Europe its weights and is pushing ahead on their behalf.\n\nSo now we need Chinese inspectors in European data centres just to make a bilateral US-China deal stable. That seems rough.\n\nWorse still, the US might worry that China has given Europe its weights and Europe is doing AI R&D for it. So now we need US inspectors in European data centres as well.\n\nBoth US and Chinese inspectors in European data centres!\n\nMore generally, I fear data centres outside of US+China will force any bilateral deal to become a v complicated multilateral affair. And that will be much harder to pull off.", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2121302355560005791", "created_at": "Fri Nov 13 18:01:08 +0000 2026"}, "enriched": 3}, {"id": "2121580141151195446", "url": "https://x.com/anton_d_leicht/status/2121580141151195446", "text": "@stevehou @grok yes, roughly - though I think it's less 'doesn't take breaks' and more 'works much much faster'; the breaks are just a simple way to clarify the speed differential in the analogy? \n\nthough I also think there are some complications here that the objection still doesn't address - might for instance be that you can go a bit faster than humans, but not much faster, before you actually hit brutal diminishing returns that come down to compute constraints / efficiency. Dwarkesh's right that that point of diminishing returns is unlikely to be *just* past human level, but it still matters a lot whether they set in after 1.5x acceleration or 20x acceleration", "created_at": "2026-11-14T12:24:57+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121577297358512271", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121577297358512271", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "@anton_d_leicht @grok Thanks that’s helpful. And the intuition is that even though bottlenecks exist, more AI will still be faster for the same quantity of compute input bc AI doesn’t take breaks in coming up with new ideas unlike humans so if Anthropic does a higher percentage of its R&D with AI it’ll move faster than otherwise?", "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121577297358512271", "created_at": "Sat Nov 14 12:13:39 +0000 2026"}, "enriched": 3}, {"id": "2121576132642251193", "url": "https://x.com/anton_d_leicht/status/2121576132642251193", "text": "@stevehou @grok it's in response to the claim 'you can't speed up labs very much by automating AI research because bottlenecks are elsewhere, e.g. in compute supply'; the intuition is: 'hey, SlothAI as described is obviously slower than OpenAI(now)' \n\nwhich is, in your words, a simple and understandable logical reasoning step for the complex result of 'research productivity matters even absent compute / input expansions; therefore OpenAI(RSI) might be meaingfully faster than OpenAI(now)'. \n\n(the stuff about 5x vs 50x just concedes that the relationship between productivity and research output isn't necessarily linear)", "created_at": "2026-11-14T12:09:01+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121560486135075173", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121560486135075173", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "How the hell is this an “intuition”?! I read this several times over and then had @grok confirm this for me. I’m pretty sure this is just Dwarkesh saying a string of words and calling it “intuition”. What’s intuitive about “an AI lab full of humans will be slower than an AI lab full of automated researchers bc humans think slower than machines, but not 50 times slower, only 5 times slower”?", "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121560486135075173", "created_at": "Sat Nov 14 11:06:51 +0000 2026"}, "enriched": 3}, {"id": "2121646590846746726", "url": "https://x.com/anton_d_leicht/status/2121646590846746726", "text": "it's still hard to imagine that USG lets this happen; this version of RSI is too fast for frog-boiling, but too slow for unilateral lab takeover.\n\nif it unfolds, I think enough lab people will be too skeptical of handoff come crunchtime, sound the alarm, and USG shuts it all down", "created_at": "2026-11-14T16:49:00+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-14T17:09:07.138772+00:00", "enriched": 3}, {"id": "2121627227838201933", "url": "https://x.com/anton_d_leicht/status/2121627227838201933", "text": "@TomDavidsonX mostly the level of interest in aligning with - or even getting ahead of / enabling - US-China-coordination I encounter in almost every policy conversation in Europe. \n\nbut I also think there's a broader historical and reputational trend here - Europe takes much more pride in being a regulatory superpower, is less skeptical of China than the US and less skeptical of the US than China - basically every argument that would make Europe say no to this seems to apply in greater force to the US or China", "created_at": "2026-11-14T15:32:03+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2121626171590779208", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T17:09:07.138772+00:00", "parent": {"id": "2121626171590779208", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "@anton_d_leicht Why are you confident that odds are low?", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2121626171590779208", "created_at": "Sat Nov 14 15:27:51 +0000 2026"}, "enriched": 3}, {"id": "2123080145120460837", "url": "https://x.com/anton_d_leicht/status/2123080145120460837", "text": "AI progress is outpacing institutions, and policymakers might soon try to slow it down. But no one really knows how.\n\nWe need to figure out which kinds of pacing fix which problems and prepare implementation. Otherwise, the easiest versions win and don't fix anything.\nhttps://t.co/VlsIgELQVg", "created_at": "2026-11-18T15:45:26+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/VlsIgELQVg": "https://writing.antonleicht.me/p/pacing"}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123094842334990752", "url": "https://x.com/anton_d_leicht/status/2123094842334990752", "text": "Policymakers might try to slow down AI progress very soon. But most 'pacing' ideas would backfire: they're either too complex to work fast, or too much of a band-aid to last.\n\nToday's essay looks at the politics of our least bad options to slow down AI.\nhttps://t.co/kkeOBjvKYT", "created_at": "2026-11-18T16:43:50+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 4, "media": [], "links": {"https://t.co/kkeOBjvKYT": "https://writing.antonleicht.me/p/pacing"}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2122337601034354776", "url": "https://x.com/ohlennart/status/2122337601034354776", "text": "governing through the cloud", "created_at": "2026-11-16T14:34:49+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122361088259830095", "url": "https://x.com/ohlennart/status/2122361088259830095", "text": "metaphorically and practically", "created_at": "2026-11-16T16:08:09+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2122337601034354776", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122337601034354776", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "governing through the cloud", "links": {}, "media": [], "url": "https://x.com/ohlennart/status/2122337601034354776", "created_at": "Mon Nov 16 14:34:49 +0000 2026"}, "enriched": 3}, {"id": "2121395249322860579", "url": "https://x.com/NateWitkin/status/2121395249322860579", "text": "NWS radars are working fine. There is no outage and nothing related to the FAA disruption.", "created_at": "2026-11-14T00:10:15+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "mattlanza", "rt_author_name": "Matt Lanza", "rt_avatar": "https://pbs.twimg.com/profile_images/1798858116580220928/JM3zFaTJ_normal.jpg", "rt_id": "2121377161600700721", "likes": 95, "retweets": 15, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121373165536559450", "url": "https://x.com/NateWitkin/status/2121373165536559450", "text": "", "created_at": "2026-11-13T22:42:30+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121364428830675089", "url": "https://x.com/NateWitkin/status/2121364428830675089", "text": "@stevehou Could be wrong, but just fyi\n\nhttps://t.co/1c133BMNDs", "created_at": "2026-11-13T22:07:47+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121361873656274992", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {"https://t.co/1c133BMNDs": "https://x.com/Hadas_Gold/status/2121358764343492784?a=w7XvtHGzHByOA8PYLss&s=20"}, "quoted": {"id": "2121358764343492784", "author_name": "Hadas Gold", "links": {}, "author": "Hadas_Gold", "text": "Law enforcement sources tell my colleagues preliminary reports indicate this is NOT a cyberattack via @evanperez @HBRabinowitz"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121361873656274992", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "Welcome to Singularity. It's here.", "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121361873656274992", "created_at": "Fri Nov 13 21:57:38 +0000 2026"}, "enriched": 3}, {"id": "2121364354004058196", "url": "https://x.com/NateWitkin/status/2121364354004058196", "text": "@JeremiahDJohns This could turn out to be wrong, but just fyi\n\nhttps://t.co/1c133BMfNU", "created_at": "2026-11-13T22:07:29+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "JeremiahDJohns", "reply_to_id": "2121362388033163664", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {"https://t.co/1c133BMfNU": "https://x.com/Hadas_Gold/status/2121358764343492784?a=w7XvtHGzHByOA8PYLss&s=20"}, "quoted": {"id": "2121358764343492784", "author_name": "Hadas Gold", "links": {}, "author": "Hadas_Gold", "text": "Law enforcement sources tell my colleagues preliminary reports indicate this is NOT a cyberattack via @evanperez @HBRabinowitz"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121362388033163664", "author_handle": "JeremiahDJohns", "author_name": "Jeremiah Johnson 🌐", "text": "So is this the first big AI-enabled attack or...\n\nis it weird that's what I immediately assumed?", "links": {}, "media": [], "url": "https://x.com/JeremiahDJohns/status/2121362388033163664", "created_at": "Fri Nov 13 21:59:40 +0000 2026"}, "enriched": 3}, {"id": "2121362497546383390", "url": "https://x.com/NateWitkin/status/2121362497546383390", "text": "Law enforcement sources tell my colleagues preliminary reports indicate this is NOT a cyberattack via @evanperez @HBRabinowitz", "created_at": "2026-11-13T22:00:07+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "Hadas_Gold", "rt_author_name": "Hadas Gold", "rt_avatar": "https://pbs.twimg.com/profile_images/2035042320719007744/IeIE9CdY_normal.jpg", "rt_id": "2121358764343492784", "likes": 116, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121677251863318635", "url": "https://x.com/NateWitkin/status/2121677251863318635", "text": "FWIW I am still being a bit tongue-in-cheek, and I appreciate that some pretty bad outcomes over the next couple of years remain plausible.  \n\nBut IMO much of the safety community has put itself in a difficult spot by crying wolf many times over in response to what good-faith critics can see is really very ambiguous, multiply interpretable information.  \n\nWe saw it with the first METR graph (time horizons),we saw it with Black October, we saw it with the second METR graph (AECI speed-up), and we saw it again yesterday with the FAA grounding, when many prominent accounts preemptively implied we were experiencing an AI-precipitated cyber attack.  \n\nIf you repeatedly convey that you can only see the world through a single cloudy lens, people start to catch on.", "created_at": "2026-11-14T18:50:50+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "NateWitkin", "reply_to_id": "2121671371789091243", "avatar":
