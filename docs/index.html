ted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/QOzvaFODew": "https://www.astralcodexten.com/p/profile-the-far-out-initiative", "https://t.co/DbNQXxtiYp": "https://www.astralcodexten.com/p/who-does-polygenic-selection-help"}, "enriched": 1}, {"id": "2117718235709833296", "url": "https://x.com/slatestarcodex/status/2117718235709833296", "text": "@_left_tail_chud @jachiam0 Like I said above, try the meds that ruin your sex drive and make you slightly tired all the time.", "created_at": "2026-11-03T20:39:07+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117479578788872243", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2117716722346291466", "url": "https://x.com/slatestarcodex/status/2117716722346291466", "text": "@GroundhogStrat I can't tell for sure what you're saying here, but I support the movement to pause AI and am grateful for its work.", "created_at": "2026-11-03T20:33:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "GroundhogStrat", "reply_to_id": "2117708973193482401", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2117728426320855411", "url": "https://x.com/slatestarcodex/status/2117728426320855411", "text": "@_left_tail_chud @jachiam0 \"Brain Lock\" is a good self-therapy book.", "created_at": "2026-11-03T21:19:36+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117721976500560287", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118092482940735963", "url": "https://x.com/slatestarcodex/status/2118092482940735963", "text": "@MahoganyIntel @zagrebbi The post is from 2019.", "created_at": "2026-11-04T21:26:14+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "MahoganyIntel", "reply_to_id": "2118030558941077813", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118567478246990113", "url": "https://x.com/slatestarcodex/status/2118567478246990113", "text": "@StefanFSchubert Do you understand why Opus 5.5 seems above trend on this graph but not on https://t.co/9EkjM9urZ6 ?", "created_at": "2026-11-06T04:53:42+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "StefanFSchubert", "reply_to_id": "2118457872736452809", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/9EkjM9urZ6": "https://epoch.ai/eci?view=graph&tab=release-date"}, "enriched": 1}, {"id": "2118767987704643897", "url": "https://x.com/slatestarcodex/status/2118767987704643897", "text": "@Bayesian0_0 @StefanFSchubert Does this imply that RSI started in October 2025, and that the trend hasn't accelerated since then?", "created_at": "2026-11-06T18:10:27+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Bayesian0_0", "reply_to_id": "2118577409037672729", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118766258275713098", "url": "https://x.com/slatestarcodex/status/2118766258275713098", "text": "@ruben_bloom Separate from the object-level issue, I think this is sort of illiberal, or at least insufficiently respectful to some part of the spirit of liberalism.\n\nMany groups who tried to change the world have started out being hated. Vegans, abolitionists, LGBT activists. Are all of these groups \"paternal, unilateral, unasked for saving of the world\"?\n\nIn fact, I weakly predict your own organization would fail this test (if I were allowed to tell our hypothetical voters the three most controversial conferences you've ever hosted, and you got equal time to defend yourself). If the average person were allowed to shut down either Anthropic or you, I think they'd vote to keep Anthropic and ditch you guys.\n\n(although I think that both you and Anthropic would do better than lots of other things, like polyamory, data centers, and building apartments in San Francisco)\n\nThe liberal answer to all of this is that people are default allowed to do things until the population bans them - not just by disapproving of them, but by actually banning them, using the law. Until then, the haters are allowed to tell all of these groups that a majority of people disapprove of them, but if these groups have a  spine they should ignore the haters and choose to keep existing anyway. Certainly this is what we rationalists did from 2010 - ~2020, when everyone hated us because we were \"distracting from near term harms\" or whatever, and we were right to do so.", "created_at": "2026-11-06T18:03:35+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ruben_bloom", "reply_to_id": "2118597440882585927", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 88, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2117302902520009183", "url": "https://x.com/s8mb/status/2117302902520009183", "text": "Subscribe today to be among the first to receive our December issue. My favourite piece in it is @pietergaricano on how Emmanuel Macron broke the French growth machine.", "created_at": "2026-11-02T17:08:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 31, "retweets": 1, "media": [], "quoted": {"author": "underthenettle", "text": "We have another banger lineup of pieces in the December issue of Works in Progress magazine. Subscribe now to get your print copy as soon as it's out. \n\nIncluding:\n➔ @RuxandraTeslo and @NikoMcCarty on Chinese biotech\n➔ @pietergaricano on Emmanuel Macron\n➔ @salonium on smallpox eradication\n➔ @JamieRumbelow on the internet's infrastructure\n➔ @SCP_Hughes on the history of architectural taste\n➔ @erinbraid on the curse of Italy\n➔ @Aria_Babu on Hollywood remakes\n➔ @chalmermagne on the end of Communism\n➔ @CharlesCMann on forest fires\n➔ @tylercowen on Armenian food \n\nhttps://t.co/sYMZ2BJ9Ol", "links": {"https://t.co/sYMZ2BJ9Ol": "https://worksinprogress.co/print"}}, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117276160853967222", "url": "https://x.com/s8mb/status/2117276160853967222", "text": "@ShakeelHashim @ReadTransformer @NYMag Nice piece. Great art direction too!", "created_at": "2026-11-02T15:22:28+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ShakeelHashim", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117649615159980369", "url": "https://x.com/s8mb/status/2117649615159980369", "text": "@SCP_Hughes I completely agree with him here. I love Manhattan but the endless chasms that many of the streets have are weirdly desolate compared to the more enclosed parts of Lower Manhattan. https://t.co/6sHnGrIIgO", "created_at": "2026-11-03T16:06:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "reply_to_id": "2117627793928274067", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNmpBxW4AA6S4U.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/6sHnGrIIgO": ""}, "enriched": 1}, {"id": "2117518864804135362", "url": "https://x.com/s8mb/status/2117518864804135362", "text": "What’s playing out in the rental market was completely predictable. What I said would happen a year ago below is now going on; the only thing left is for these measures to catch on across the whole market. Rent controls are back - @mtpennycook deserves a lot of the credit! https://t.co/Trsl1bLMIl", "created_at": "2026-11-03T07:26:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 245, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLwLzDXwAAh9lY.jpg"}], "quoted": {"author": "s8mb", "text": "The government's Renters' Rights Bill looks like it will be a catastrophe, inadvertently introducing rent controls and reducing the supply of housing even more. It is the clearest evidence that the whole British state that has brought it about is completely broken: \n\n• Written by the civil service\n• Introduced by the Tories\n• Passed by Labour and the Lib Dems\n• Cheered on by the mainstream media\n\nThe bill's core provision is to eliminate \"no-fault evictions\". Many understand this to mean evictions during a rental lease. In fact, this is already impossible. What the new bill does is to stop landlords from being able to regain their property after a lease has expired. \n\nThis means that renting a property to someone now means that they get to live in that property indefinitely. A landlord can only evict them if they are selling the property, or plan to move into it themselves, or if a tribunal gives them permission after ruling against the tenant for bad behaviour.\n\nWithin these indefinite contracts, rent increases will be capped at whatever the 'market rate' is determined to be by a tribunal. Tribunals will not be able to *raise* rents, as they currently can and often do – only lower them or keep them where they are. The only risk to a tenant is that their challenge is deemed \"vexatious\".\n\nNot only will rent increases *within* contracts be controlled by courts, rents for *new* contracts will also be controlled by them. Tenants will be entitled to agree a rent, move in, and then immediately take their landlord to a rent tribunal on the grounds that the rent they have just agreed to is \"too high\".\n\nRent tribunals will thus have the power to control all rents. All rents will be set under the threat of a tribunal intervening. There will be no \"market rate\", so the tribunal will have no independent \"market rate\" to refer to.\n\nA tenant who challenges a rent increase will have their rent frozen at the old, lower rate while their challenge is ongoing (which could take over a year). Like the Building Safety Regulator right now, tribunals are likely to be extremely backlogged, creating huge delays where tenants do not have to pay their new higher rents, if they ever do. Tenants will have huge incentives to challenge nearly all rent increases. \n\nWe have already seen how bad courts are at ruling on prices, eg in cases where Next's shop workers have been given the same pay as factory floor workers, and in Birmingham where the council was forced to pay £760m to care workers and teaching assistants because a court decided that these roles were equivalent to jobs like rubbish collectors.\n\nAll this amounts to rent controls. These are terrible for many reasons.\n\n1. They will cause landlords to sell up and leave the market. This is both to avoid the risk of being stuck with a bad tenant, and because once the rent has been kept artificially low by a rent tribunal, landlords will be losing money compared to just selling into private owner-occupation.\n\nRental properties allow for easy doubling up (housesharing) which is much messier under owner-occupation. The effective supply of housing is about to drop. In Ireland, postwar rent controls shrunk the rental market from 26% to 8% of the total housing stock in 40 years. In Britain, 1916–88, the share of properties available for rent went from 75% of the market to 10%.\n\n2. They cause landlords to neglect their properties. Landlords receiving artificially-depressed rents for their properties have no incentive to maintain them. Rent controlled properties, famously, become neglected and fall into decay, as leaks, cracked plaster and broken windows are left unaddressed. The country's housing stock that remains in renting will decay. Our cities will become more decrepit.\n\n3. They stop people from moving around for better jobs. We already have this effect with social housing, where huge amounts of inner London housing (30–40%!) are held by tenants in low wage jobs, or who have no job at all, instead of by people who could move to London to earn and produce more. This will happen to large swathes of the rental market too, stopping people from moving into prosperous cities where they could get better jobs.\n\n4. They stop the supply of new homes for rent. Under rent controls, there is no incentive to build new homes for renting. Britain built essentially no private flats for rent between 1945 and the end of rent controls in 1988. The same was true in France between WWI when it introduced rent controls and the slow end of rent controls in the postwar era.\n\n5. They push renters into the black market. To actually get a place to live, a lot of people will sidestep these new rules and rent informally, with none of the protections we currently have for renters like the deposit protection scheme. This is the sort of scenario that allows landlords to *really* exploit and steal from their tenants.\n\n–\n\nDo not assume that anyone involved with this knows what they're doing. We have already seen, in the case of the Building Safety Regulator and the second staircase regulations (brought in by the same Housing Secretary who designed this bill), how disastrous the consequences of well-intended but misconceived interventions in the housing market can be.\n\nLondon building has already ground to a halt. And things are about to get even worse.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/Trsl1bLMIl": ""}, "enriched": 1}, {"id": "2117516901609779606", "url": "https://x.com/s8mb/status/2117516901609779606", "text": "Tenants used to be able to challenge rent rises. If they succeeded, the landlords could evict them. This obviously meant that the rulings weren’t binding and couldn’t set rents below the market rate. \n\nNow you can’t evict the tenant, no matter how low the tribunal sets the rent. And tribunals can reduce the rents agreed to at the start of the tenancy, not just rent increases at the end of a fixed term. \n\nThis is *obviously* rent control by anyone’s definition of the term. This is what they wanted to happen!", "created_at": "2026-11-03T07:19:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 818, "retweets": 71, "media": [], "quoted": {"author": "mtpennycook", "text": "I see the nonsense “rent controls are back” takes keep coming.\n\nThere is no rent control in England.\n\nThe legal right to challenge rent increases at tribunal was introduced by the Thatcher Government in its 1988 Housing Act.\n\nIt was rarely used in practice only because it inevitably resulted in a landlord serving a Section 21 notice.\n\nLabour’s Renters’ Rights Act abolished Section 21 ‘no fault’ evictions and renters are now rightly empowered to challenge unfair or above-market rent increases.\n\nIn both the recent cases that have been the cause of so much debate, the tribunal has been operating exactly as it should – determining that the landlords in question were charging rents that simply did not reflect local market values for comparable properties.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117510302761930844", "url": "https://x.com/s8mb/status/2117510302761930844", "text": "@rosegrayston You used to be able to evict a tenant who challenged their rent and had it reduced, which meant the rulings didn’t bind, and now you can’t, so the rulings do bind. Why obfuscate here? This is the policy you wanted!", "created_at": "2026-11-03T06:52:52+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rosegrayston", "reply_to_id": "2117305510697238549", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 186, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2118038398556393641", "url": "https://x.com/s8mb/status/2118038398556393641", "text": "Thrilled that Works in Progress is in Lenny's annual gift guide. The whole guide is great – I just got a Canary knife and have enjoyed cutting all my Amazon boxes with it. I hope people who discover WIP through it like it just as much!\n\n(\"Some people call it the new Economist\"!) https://t.co/BotbICPJOw", "created_at": "2026-11-04T17:51:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 47, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWTH_8xXoAAtLVU.jpg"}], "quoted": {"author": "lennysan", "text": "The holidays are fast approaching, so I’m back with my sixth (!!) annual gift guide. \n\nIt's got over 100 gift ideas—all things I actually use, love, and recommend.\n\nThis started out as a random post idea, but now you’d be surprised how many people ping me asking when the new list will be out.\n\nAs always, the collection includes a mix of practical stuff with a lot of fun and delight, from high-end products to very affordable items. There are no affiliate links here, and I’m not benefiting from recommending any of these products.\n\nPro tip: After reading it, point your favorite AI agent at the post and have it brainstorm gifts for your family, friends, and coworkers.\n\nHere's the guide: https://t.co/cTzHGwV4Bh", "links": {"https://t.co/cTzHGwV4Bh": "https://www.lennysnewsletter.com/p/lennys-newsletter-holiday-gift-guide-057"}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/BotbICPJOw": ""}, "enriched": 1}, {"id": "2118037579765293255", "url": "https://x.com/s8mb/status/2118037579765293255", "text": "Loving @WorksInProgMag https://t.co/kaS56JFb9z", "created_at": "2026-11-04T17:48:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "lennysan", "rt_author_name": "Lenny Rachitsky", "rt_avatar": "https://pbs.twimg.com/profile_images/1592990461517389824/iln8hi1f_normal.jpg", "rt_id": "2118029048911917298", "likes": 19, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWTAA0EagAA9Xz7.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/kaS56JFb9z": ""}, "enriched": 1}, {"id": "2118037573419565558", "url": "https://x.com/s8mb/status/2118037573419565558", "text": "@lennysan @WorksInProgMag Thank you so much!!", "created_at": "2026-11-04T17:48:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "lennysan", "reply_to_id": "2118029048911917298", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": , "enriched": 1}, {"id": "2118009921241289159", "url": "https://x.com/s8mb/status/2118009921241289159", "text": "@sarthakgh Thank you!!", "created_at": "2026-11-04T15:58:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "sarthakgh", "reply_to_id": "2118009412107608198", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118009416687702185", "url": "https://x.com/s8mb/status/2118009416687702185", "text": "We're also in stock at independent newsagents in London, New York, Paris, Berlin and Los Angeles. We'll appear in magCulture in Clerkenwell tomorrow and we're already up and running on one of London's loveliest streets, Chiltern St. https://t.co/I52GkErXfq", "created_at": "2026-11-04T15:56:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "reply_to_id": "2118006659100385451", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 32, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSs8anWQAAxn59.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWSs-EjW8AAb-na.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/I52GkErXfq": ""}, "enriched": 1}, {"id": "2118006659100385451", "url": "https://x.com/s8mb/status/2118006659100385451", "text": "From today, Works in Progress is now in stock at Barnes & Nobles nationwide across America. \n\nWe're in 570 stores in 49 states*, including the flagship stores at Union Square & Fifth Avenue in NYC; Georgetown, DC; State Street, Chicago; and The Grove, Los Angeles. \n\nWe're also now in Hudson News outlets across most major US airports, and the B&Ns at San Francisco Airport.\n\nIf you tweet (or LinkedIn/Insta post) a photo of a copy of Works in Progress outside any of these stores, share the post with me or @WorksInProgMag via DM and we'll send you a free tote bag as a thank you. If you're a subscriber already, feel free to do it with own copy!\n\nYou can see a full map of Barnes & Noble stockists here, and enter your Zip code to find your nearest store.\n\n*Sorry, Wyoming, we'll get to you!\n\nhttps://t.co/a22LtQP2HW", "created_at": "2026-11-04T15:45:12+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 397, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/a22LtQP2HW": "https://worksinprogress.co/barnes-noble-launch/"}, "enriched": 1}, {"id": "2117928926093746334", "url": "https://x.com/s8mb/status/2117928926093746334", "text": "How can we make lovable cities? If you had asked a European architect this question in 1900, they would probably have referred you to a slender, lively book by the Austrian writer Camillo Sitte, translated as ‘The Art of Building Cities’. Published in 1889, ‘The Art of Building Cities’ swiftly came to be revered around the world.\n\nhttps://t.co/qwVmTrPTGV\n\nSitte was repudiated by the modernists and fell into obscurity, but his ideas are beginning to be revived. My cousin @PMArslanagic and I have distilled nineteenth century's finest work on urbanism into five principles:\n\n- Create enclosed spaces\n- Keep squares small\n- Symmetry is overrated\n- Move monuments to the edges of spaces\n- Nestle monuments in vernacular fabric", "created_at": "2026-11-04T10:36:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "rt_avatar": "https://pbs.twimg.com/profile_images/1881805141059211264/D22ZUEJF_normal.jpg", "rt_id": "2117627793928274067", "likes": 634, "retweets": 131, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/qwVmTrPTGV": "https://worksinprogress.co/issue/the-forgotten-formula-for-lovable-cities/?v2"}, "enriched": 1}, {"id": "2117899168966729881", "url": "https://x.com/s8mb/status/2117899168966729881", "text": "Absolutely brilliant set of tweets from @SCP_Hughes on how to make a brilliant city, architecturally. Read it and you will learn something.", "created_at": "2026-11-04T08:38:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "timleunig", "rt_author_name": "Tim Leunig", "rt_avatar": "https://pbs.twimg.com/profile_images/1724908138703314944/i9Jh_a3a_normal.jpg", "rt_id": "2117897686188019969", "likes": 41, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117869257518125157", "url": "https://x.com/s8mb/status/2117869257518125157", "text": "@MarcopoloLondon Yes - we need to increase the supply of Florence-like cities!", "created_at": "2026-11-04T06:39:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "MarcopoloLondon", "reply_to_id": "2117759412051890502", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", n that has 7000+ embarking passengers a day can be without an escalator for three months? It’s been like this since September. This is the sort of neglect that a fare freeze leads to. https://t.co/ljC5Cd0WY1", "created_at": "2026-11-07T10:00:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 136, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWg5pbCXAAApvXz.jpg"}], "links": {"https://t.co/ljC5Cd0WY1": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2119001372314272001", "url": "https://x.com/s8mb/status/2119001372314272001", "text": "Ngl it is such a joy seeing the magazine for sale in shops.", "created_at": "2026-11-07T09:37:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 43, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2118704932388044913", "author_name": "David Watkins", "links": {"https://t.co/tXAEIg1hLn": ""}, "author": "dwatkins_", "text": "There's something particularly appealing about @WorksInProgMag in print @s8mb https://t.co/tXAEIg1hLn"}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2119001117300506837", "url": "https://x.com/s8mb/status/2119001117300506837", "text": "@dwatkins_ @WorksInProgMag Awesome! MagCulture?", "created_at": "2026-11-07T09:36:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "dwatkins_", "reply_to_id": "2118704932388044913", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118999091166196049", "url": "https://x.com/s8mb/status/2118999091166196049", "text": "@bendunnflores Or intentionally vague so they can conflate the rule of law, regulation and nationalisation to avoid being pinned down.", "created_at": "2026-11-07T09:28:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "bendunnflores", "reply_to_id": "2118986689662390564", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118997486098657565", "url": "https://x.com/s8mb/status/2118997486098657565", "text": "This is good, but I’m worried that Net Zero kills a lot of our potential here. New gas power generators for data centres are borderline impossible to build, and our dependence on wind gives us random, days-long collapses in electricity supply.", "created_at": "2026-11-07T09:22:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2118764042588237982", "author_name": "Dan Tomlinson MP", "links": {}, "author": "dantomlinsonmp", "text": "A common Westminster mistake is to look at big moments in US politics and assume the same battle lines will be drawn here. AI and the mid-terms are a good example of this.\n \nThe easy assumption is that a big polarising debate on data centres is about to hit the UK, just because it has in the US. But that ignores two important facts.\n \nFirst, the government has watched the free-for-all in parts of the US, has learned lessons from it, and is setting out a different approach. We do need to secure grid connections for strategic data centres, and we are setting up a Ministerial Control Centre to do just that. But move too quickly without bringing communities with you, and people understandably start worrying about the impact on their area and asking what they’re getting in return. That's why we're putting protections in place, to prioritise data centres only where they meet the tests set out in our Data Centre Covenant published at the Budget.\n \nThis means data centres have to lower electricity bills for other users, minimise and report on water usage, support our reindustrialisation objectives and support UK sovereignty.  And crucially, it means agreeing to the principle that local communities around new infrastructure should share in its benefits - both through jobs and wider support.\n\nSecond, our problem is not that we have an abundance of data centre construction that our politics needs to reckon with, it's that build out is slower here than it could be. 15 of the world’s top 20 largest data centre markets are in the US. None are in the UK.  The pace of investment here is, frankly, too low for what we need to stay at the forefront as AI technology develops. High electricity costs and slow grid connections (thanks, Conservatives) mean we haven't been near the top of the list for investment, and too often we're reliant on AI infrastructure overseas. The Budget last week set out a new direction to change this for all business and households, but we can't turn this round overnight.\n \nData Centres today are essential infrastructure.  They underpin much of everyday life in the UK, from banking and shopping, to public services, to helping doctors screen for diseases.  AI makes that infrastructure even more important and as AI becomes more widely used across out economy, Britain will need more of the data centres that support it. But we won’t allow that growth to come at any cost. We’ll protect communities.  And we’ll make sure local people benefit."}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118964002701099510", "url": "https://x.com/s8mb/status/2118964002701099510", "text": "But there are lots of things that are essential to our lives and/or work that function fine without being under public control, whatever that means.", "created_at": "2026-11-07T07:09:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 85, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2118817325990457706", "author_name": "Isabella M Weber", "links": {}, "author": "IsabellaMWeber", "text": "AI is engineered to be an essential. It’s being baked into our life & our work. We are going to rely on it with little choice to opt out individually. That’s one of the reasons why AI belongs under public control. Whoever controls the essentials has control over our society and economy. In a democracy that control belongs to the people."}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118824702026420658", "url": "https://x.com/s8mb/status/2118824702026420658", "text": "The animal welfare kuznets curve in action.", "created_at": "2026-11-06T21:55:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 160, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2118783732316573851", "author_name": "Ole Lehmann", "links": {"https://t.co/RyIagfaM1h": ""}, "author": "itsolelehmann", "text": "we have a winner for the most absurd AI startup ever\n\nthis Peter Thiel backed company uses AI robots to stab fish in the brain so they taste better and last up to 3x longer\n\nit's called Shinkei and it modernizes a centuries-old Japanese technique\n\ndozens of Michelin-star restaurants are already lining up to buy the fish\n\nhere's how it works:\n\n> the problem is when a fish gets caught, it usually just suffocates on the boat\n\n> that stress floods the meat with hormones and lactic acid, which hurts the flavor and texture\n\n> the old Japanese fix for this was spiking the fish through the brain right after the catch, which stops all that\n\n> but doing it by hand is impractical for most American fishing crews\n\n> so Shinkei built a fridge-sized robot that sits right on the boat's deck\n\n> the crew feeds in a fish and AI identifies the exact species, so it knows exactly where the brain and gills are\n\n> the robot then drives the spike through the brain and cuts near the gills in about 7 seconds\n\n> the fish goes into an ice slurry so the blood drains out\n\n> so the fish doesn't sit there stressing out, and that tasty flavor and texture is preserved\n\nexample number 5,392,417 of how AI can be applied to literally anything"}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118822410824700195", "url": "https://x.com/s8mb/status/2118822410824700195", "text": "Just picked up a copy in London! I'm jealous of the print publications that past generations had such as the Whole Earth Catalogue and old Wired magazines (I collect editions published in 00's). Wonderfully written, underground, and aesthetic. Good to see @WorksInProgMag revive that feeling.", "created_at": "2026-11-06 ndle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "TaylorLorenz", "reply_to_id": "2119112768985178594", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T19:26:16.707844+00:00", "enriched": 1}, {"id": "2119358546928414948", "url": "https://x.com/s8mb/status/2119358546928414948", "text": "@ant_studies @PrometheusCHT Yes I’m not sure what the problem is meant to be here - some mosquito nets are used for fishing? OK, so what?", "created_at": "2026-11-08T09:17:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ant_studies", "reply_to_id": "2119357896538329336", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119354032447971438", "url": "https://x.com/s8mb/status/2119354032447971438", "text": "@JEBistline @bswud @WorksInProgMag Thanks for buying and sharing - hope you enjoy it!", "created_at": "2026-11-08T08:59:11+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JEBistline", "reply_to_id": "2119170958988829161", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119349328259285164", "url": "https://x.com/s8mb/status/2119349328259285164", "text": "EA critics need to try harder\n\nhttps://t.co/wGajqnbUit\nhttps://t.co/UX2fZt1eX7 https://t.co/SiQuxPANf2", "created_at": "2026-11-08T08:40:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "ant_studies", "rt_author_name": "Anthony", "rt_avatar": "https://pbs.twimg.com/profile_images/1617630733043916804/Se8yS8hw_normal.jpg", "rt_id": "2119246378358431875", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWkSoPpW4AEF1jD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWkS9QiW0AAozJm.jpg"}], "links": {"https://t.co/wGajqnbUit": "https://www.givewell.org/charities/amf/September-2012", "https://t.co/UX2fZt1eX7": "https://blog.givewell.org/2026/08/27/the-research-behind-our-276-million-grant-for-malaria-nets-in-drc/", "https://t.co/SiQuxPANf2": ""}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119181474939208062", "url": "https://x.com/s8mb/status/2119181474939208062", "text": "@arctotherium42 There have been lots of studies of whether malaria net distribution reduces malaria (it does and by a lot). \n\nhttps://t.co/CjDVT9sDfl\n\nhttps://t.co/h7SaxEBJhJ\n\nhttps://t.co/NjDe6vTTSN\n\nhttps://t.co/U3YG2zMxUZ\n\nhttps://t.co/RIt0v2I9zs", "created_at": "2026-11-07T21:33:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arctotherium42", "reply_to_id": "2119100619130814819", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 158, "retweets": 5, "media": [], "links": {"https://t.co/CjDVT9sDfl": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(22)02319-4/fulltext", "https://t.co/h7SaxEBJhJ": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(21)02499-5/fulltext", "https://t.co/NjDe6vTTSN": "https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(20)30214-2/fulltext", "https://t.co/U3YG2zMxUZ": "https://www.nature.com/articles/nature15535", "https://t.co/RIt0v2I9zs": "https://doi.org/10.1002/14651858.CD000363.pub3"}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119174243963539552", "url": "https://x.com/s8mb/status/2119174243963539552", "text": "@GuiveAssadi Nice!", "created_at": "2026-11-07T21:04:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GuiveAssadi", "reply_to_id": "2119174153207230749", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2116911746657243464", "url": "https://x.com/random_walker/status/2116911746657243464", "text": "Quick thread on AI and productivity:\n\nLots of people say this chart shows AI is now showing up in the productivity data.\n\nBut I made this chart to argue the opposite: a trend that pre-dates AI and only shows up in the US doesn’t look like AI.\n\nHere’s how I’m thinking about the data and underlying dynamics:", "created_at": "2026-11-01T15:14:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "likes": 634, "retweets": 146, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDFzW6XsAA3jDh.jpg"}], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00", "links": {}, "enriched": 1}, {"id": "2117246718219612594", "url": "https://x.com/random_walker/status/2117246718219612594", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "created_at": "2026-11-02T13:25:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 301, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH4mBhWQAA5Lou.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/ZwebetjZ4n": "https://www.normaltech.ai/", "https://t.co/ZA5TBDypfl": "https://www.normaltech.ai/p/what-will-be-left-for-us-to-work", "https://t.co/1rWunFZOfo": "https://www.noahpinion.blog/p/wheres-the-intelligence-explosion", "https://t.co/WbhsVQt2kz": "https://www.normaltech.ai/p/up-the-stack-how-ais-escape-from"}, "enriched": 1}, {"id": "2117627225444897232", "url": "https://x.com/random_walker/status/2117627225444897232", "text": "AI revenues right now are in a state of extreme disequilibrium and are produced by multiple counteracting exponentials. Naive trend extrapolation is not insightful. For forecasts to be useful we have to tease apart the underlying trends and how they interact, and pay close attention to the distinction between value creation and value capture. Many widely divergent futures are possible, including some pretty wild ones.", "created_at": "2026-11-03T14:37:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 4, "media": [], "quoted": {"author": "random_walker", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "links": {"https://t.co/ZwebetjZ4n": "https://www.normaltech.ai/", "https://t.co/ZA5TBDypfl": "https://www.normaltech.ai/p/what-will-be-left-for-us-to-work", "https://t.co/1rWunFZOfo": "https://www.noahpinion.blog/p/wheres-the-intelligence-explosion", "https://t.co/WbhsVQt2kz": "https://www.normaltech.ai/p/up-the-stack-how-ais-escape-from"}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117963022434001035", "url": "https://x.com/random_walker/status/2117963022434001035", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T12:51:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117770254348664933", "url": "https://x.com/random_walker/status/2117770254348664933", "text": "Update: Can AI agents use Pangram to beat Pangram? In small tests, I found simple prompts to the Codex allowed it to beat Pangram. The final output was 100% human generated. Prompts that helped:\n\n- Have the agent develop a style guide based on past writing\n- Have it develop an \"anti-style guide\" based on AI writing tics that people have complained about \n- Instruct it to get to a seed sentence that Pangram doesn’t flag (or at least flags as AI-assisted rather than fully AI-generated). Then the agent knows what strategies work and can iterate from there", "created_at": "2026-11-04T00:05:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2117760736466252258", "likes": 195, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPHhLZX0AERJcF.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117735390828458295", "url": "https://x.com/random_walker/status/2117735390828458295", "text": "All of this makes sense to me. The point about RSI potentially (or even likely) being narrow is also in agreement with my complementary intelligence thesis, where what're seeing is an increase in the magnitude of a particular intelligence vector, which may not mean much when projected onto other intelligence vectors.", "created_at": "2026-11-03T21:47:17+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "togelius", "rt_author_name": "Julian Togelius", "rt_avatar": "https://pbs.twimg.com/profile_images/1863646728433352705/z0pWqOuX_normal.jpg", "rt_id": "2117690343848329570", "likes": 44, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118328569369694471", "url": "https://x.com/random_walker/status/2118328569369694471", "text": "Most days I can just about manage this balancing act, but only because thinking about how we should adapt to AI is my actual job. Otherwise I think I’d find it too hard. I suspect that’s one reason people sort themselves into camps or tribes. It’s psychologically easier than constantly revisiting one’s beliefs.\n\nBeing able to empathize with and collaborate with people who have different AI boundaries and attitudes than our own is becoming an important skill.", "created_at": "2026-11-05T13:04:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 4, "media": [], "quoted": {"author": "random_walker", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118532313319723303", "url": "https://x.com/random_walker/status/2118532313319723303", "text": "Announcing CRUX-in-a-box: open-source infrastructure for running and monitoring weeks-long agent evaluations.\n\nWe built it over six months of long-horizon evaluations in CRUX, to keep runs repeatable, secure, and monitored. AI evaluators can now use it to:\n\n- Run agents on VMs for weeks\n- Use LLMs to flag risky actions for human review\n- Inspect tool calls, tokens, and spend\n- Set time and cost budgets\n- Chat with agents mid-run to give feedback or answer their questions\n\nIf you run long-horizon agent experiments, we might have solved some of the problems you will come across.  \n\nGitHub: https://t.co/V6y5YzamXa", "created_at": "2026-11-06T02:33:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2118418574456852720", "likes": 43, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYhIxEXwAA3_wQ.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/V6y5YzamXa": "https://github.com/sage-princeton/crux-in-a-box"}, "enriched": 1}, {"id": "2116918650284183696", "url": "https://x.com/sethlazar/status/2116918650284183696", "text": "Illegitimate algorithmic governance strikes again. This trend (which requires some nuance, to be clear) could be at least as important for the future of democracy as the dangers associated with authoritarian misuse and ai assisted autocratisation.", "created_at": "2026-11-01T15:41:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 4, "media": [], "quoted": {"author": "AnthropicAI", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://t.co/18j6zdHub4", "links": {"https://t.co/18j6zdHub4": "https://safeguards.anthropic.com/2026/self-assessment/"}}, "fetched_at": "2026-11-01T17:07:41.505079+00:00", "links": {}, "enriched": 1}, {"id": "2116979118013067468", "url": "https://x.com/sethlazar/status/2116979118013067468", "text": "@Surveil__Lance There is a fine line between defensible safety guardrails, and a whole system of private enforcement of (a company’s interpretation of) the law. Illegitimacy stems from lack of authority for certain kinds of decisions to procedural limitations of fully automated enforcement. Nb the combo of this announcement with the one about reverse engineering games before.", "created_at": "2026-11-01T19:42:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-01T19:41:50.876536+00:00", "links": {}, "enriched": 1}, {"id": "2117331331889951153", "url": "https://x.com/sethlazar/status/2117331331889951153", "text": "Join us for our Fall Mentorship Workshop!", "created_at": "2026-11-02T19:01:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OptimistsInc", "rt_author_name": "Jess Sorrell", "likes": 12, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117115558164664452", "url": "https://x.com/sethlazar/status/2117115558164664452", "text": "Wonderfully said. AI is changing and will continue to change the value proposition of TCS researchers, but the uncertainty of the future isn't wholly a product of forces outside of our control. There is also uncertainty over our collective decisions as a research community. We have agency in how we adapt to technological change, and we should earnestly engage with questions of how we can and should shape the near-term future of our field. Who knows what the future holds, but there is quite a bit of work to do *right now* (though maybe it can wait until after the STOC deadline).", "created_at": "2026-11-02T04:44:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OptimistsInc", "rt_author_name": "Jess Sorrell", "likes": 30, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117000091332653380", "url": "https://x.com/sethlazar/status/2117000091332653380", "text": "@Surveil__Lance Yeah pls see the \"this trend, which requires some nuance\" point. I've written at length about the main point you make—about how a company is entitled to restrict the use of their products in various ways—and the point is just that it's a slippery slope, and the more private governance there is, and the more essential the tool becomes, the closer we shade to what I'm describing. If you'd like to have a look, some of my stuff is up open access on arxiv, e.g. the \"automatic authorities\" intro paper, \"legitimacy, authority, and democratic duties of explanation\", and \"governing the algorithmic city\".", "created_at": "2026-11-01T21:05:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117655112311287962", "url": "https://x.com/sethlazar/status/2117655112311287962", "text": "Cosmos is hiring a chief of staff who'll act as @Brendan_McCord's right hand across the Institute, @cosmos_vc, a book and a major new higher education program.\n\nAfter two years, we'll back you to found something or place you at a top company.\n\nLearn more: https://t.co/AcfIsj9PcI https://t.co/ylNXAd6ssB", "created_at": "2026-11-03T16:28:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "cosmos_inst", "rt_author_name": "Cosmos Institute", "rt_avatar": "https://pbs.twimg.com/profile_images/1825967636561141760/erPVXYJG_normal.jpg", "rt_id": "2117641538591441388", "likes": 43, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNfwc0aYAE8BWn.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/AcfIsj9PcI": "https://blog.cosmos-institute.org/p/cosmos-is-hiring-a-chief-of-staff", "https://t.co/ylNXAd6ssB": ""}, "enriched": 1}, {"id": "2117478810551542006", "url": "https://x.com/sethlazar/status/2117478810551542006", "text": "@AndyMasley in the dark", "created_at": "2026-11-03T04:47:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "reply_to_id": "2117478783431360781", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117478783431360781", "url": "https://x.com/sethlazar/status/2117478783431360781", "text": "@AndyMasley brought to you by andy lying on his bed reading his kindle :)", "created_at": "2026-11-03T04:47:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AndyMasley", "reply_to_id": "2117476715010326844", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117476563264442373", "url": "https://x.com/sethlazar/status/2117476563264442373", "text": "Today’s @NYMag cover story was written in partnership with @ReadTransformer. \n\nMany of the industry’s most powerful figures avoid the limelight. Others are just so eccentric, or so extremely fascinated with some suddenly pivotal niche, that they tend to bypass mainstream awareness. But that doesn’t mean they’re any less important than the tech critics and pioneers who are household names. \n\nWe thought it was important to identify the people determining the future of AI that often go overlooked. With how quickly AI is moving, and the risks involved, it’s probably time you get to know who they are. \n\nPick up a copy on a news stand near you!!\n\nhttps://t.co/pq3xmUWji1", "created_at": "2026-11-03T04:38:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "vronirwin", "rt_author_name": "Veronica 💫", "rt_avatar": "https://pbs.twimg.com/profile_images/2052389061491322884/2s5jKw1r_normal.jpg", "rt_id": "2117395386935464381", "likes": 16, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJ_iR_XwAAQw6_.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWJ_iSAXkAAvVDm.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/pq3xmUWji1": "https://nymag.com/intelligencer/article/most-powerful-people-in-ai-2026-list.html"}, "enriched": 1}, {"id": "2117464577265066095", "url": "https://x.com/sethlazar/status/2117464577265066095", "text": "nice to see an example of such exquisite *human* ingenuity (tho presumably astra will be able to do this based on these instructions now...)", "created_at": "2026-11-03T03:51:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "slimer48484", "text": "I am in awe. This guy discovered a way to locate any audio clip by matching aircraft doppler curves against flight data. INSANE. https://t.co/y9Vq2NWbdj", "links": {"https://t.co/y9Vq2NWbdj": ""}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117444024780886086", "url": "https://x.com/sethlazar/status/2117444024780886086", "text": "I cannot recommend this opportunity enough to anyone who wants to get into AI policy.\n\nI came to the fellowship earlier this year with a deep resume and some recent exposure to emerging tech issues, but I was no policy expert, and surely not an AI one at that. @GovAIOrg gave me the tools, information, access to experts, access to smart colleagues, etc., that put me in a position to land where I am. It's rare in life that you can get time to learn from others, build a network, and work on personalized growth while also getting paid to do it!\n\nOn top of it all, I can keep counting on the support and friendship of those still at GovAI and the alumni network of fellows I met. Apply today!", "created_at": "2026-11-03T02:29:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JasonBakerJB", "rt_author_name": "Jason Baker", "rt_avatar": "https://pbs.twimg.com/profile_images/2106361837344198656/7XADY6Kz_normal.jpg", "rt_id": "2117259412813271471", "likes": 257, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117408783903117751", "url": "https://x.com/sethlazar/status/2117408783903117751", "text": "A couple of our (3) reviews for @RealAAAI Alignment track were clearly one-shotted with an LLM contrary to policy (not part of the official experiment). And they clearly prompted the models to act like the worst kind of reviewer two. It's genuinely the worst of both worlds: you're not getting actual engagement from another human, but you're also not getting the benefits of actually decent LLM review (which is good for some things, not others—doesn't have much of a sense of which problems are real/serious and which don't matter; also don't really understand what makes something a significant contribution). \n\nOur rebuttal: \"we're not going to engage with reviews produced by LLMs\". \n\nMercifully, we had a third review, clearly by a human, which while critical made sensible points that will help us to improve the paper. Whoever that person is: we salute you; if we'd had a full house I'd have gone joker.\n\nBut seriously, what are we doing here people. If you are using LLMs to write your reviews (and I can guarantee that some of you are, because in my experience this year a very significant fraction of people are), then you are destroying the structures that make your work possible. If you don't have enough time to do your work properly, then say no. Everyone is under pressure. That's no excuse for undermining our intellectual infrastructure so casually.", "created_at": "2026-11-03T00:09:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117715014337335509", "url": "https://x.com/sethlazar/status/2117715014337335509", "text": "I'm recruiting a PhD student this year! The lab focuses on how people and LLMs differ and how they interact, as well as the impacts LLMs are having on our cognition and society. Please share with anyone interested and see our website for more: https:/
