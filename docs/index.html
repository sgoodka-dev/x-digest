etergaricano @Jack_Watling This book was excellent, but it read like a horror novel.", "created_at": "2026-11-13T16:59:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "pietergaricano", "reply_to_id": "2121279429511196724", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121279429511196724", "author_handle": "pietergaricano", "author_name": "Pieter Garicano", "text": "Famously, very few books accurately predict how the next war will go. Guderian's Achtung! Panzer was one. The Arms of the Future by @Jack_Watling is, in my view, another.\n\nhttps://t.co/0FvQQvofBs\n\nSimplifying a bit, only three things fundamentally determine how armies fight: how far they can see, how far they can shoot, and how deadly each shot is.\n\nOver the last few decades, all three have increased relentlessly. Everyone has seen the videos of drones from Ukraine. But sensors of all kinds are getting better: ground-based radars can spot tanks tens of kilometers away, and acoustic sensors can pick up the heartbeats of individual soldiers. Once the enemy is spotted, it is much easier to kill them: a WW2 artillery shell landed within 50 meters half of the time at 20 kilometers; a modern one lands within 2 meters half of the time at 70 kilometers.\n\nIn this new world, there are only three ways to fight: by hiding in a hole in a field, by hiding in a city, or by attacking the sensors.\n\nRead my review in Works in Progress", "links": {"https://t.co/0FvQQvofBs": "https://worksinprogress.co/issue/the-future-of-war/"}, "media": [], "url": "https://x.com/pietergaricano/status/2121279429511196724", "created_at": "Fri Nov 13 16:30:02 +0000 2026"}, "enriched": 3}, {"id": "2121349057214091353", "url": "https://x.com/s8mb/status/2121349057214091353", "text": "What would win: artificial superintelligence or one little inferred law?", "created_at": "2026-11-13T21:06:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2121288208637972735", "author_name": "Saloni", "links": {"https://t.co/JTMfMkihnu": ""}, "author": "salonium", "text": "New episode of HARD DRUGS!\n\nWill AI progress be crushed by Eroom’s law?\n\nEven as technology has advanced, drug development has gotten more and more expensive over time.\n\nIn the 1950s, one billion dollars of R&D spending got us roughly fifty new drugs. Today, it gets us about one.\n\nThis trend is called Eroom’s law, or Moore’s law spelled backwards. It seems pretty bleak: the R&D cost per new drug has roughly doubled every nine years, in inflation-adjusted dollars, meaning drug development has become exponentially more expensive.\n\nWhat could explain this? Here are some possibilities:\n\n• Our standards of evidence and requirements for safety testing have risen, through regulation, public expectations, and risk aversion.\n\n• We’ve picked the low-hanging fruit already. Perhaps we’ve already made the easiest discoveries, and diseases that are harder to understand or treat are left.\n\n• Or perhaps it’s the ‘better than the Beatles’ problem: New drugs not only have to be effective, but have to compete with existing treatments, which are already effective. Plus, some of them have gone off-patent and become cheap generics, making the price contrast starker.\n\nRelatedly, as diseases become rarer or milder, it takes more effort to demonstrate that new drugs are effective, with larger or longer clinical trials.\n\nBut there are also reasons to question these explanations. We still lack effective treatments for many diseases. And our tools for studying biology have improved enormously. Why hasn’t that been enough?\n\nWill our best efforts be crushed by Eroom’s law, too? Or can AI reverse the trend?\n\nIn our latest episode of HARD DRUGS, @JacobTref and I chat about all this and more. Listen wherever you get your podcasts!\n\nChapters:\n00:00 Introduction\n02:53 Eroom’s law trivia\n12:33 How much does it really cost to develop a drug?\n22:35 The better than the Beatles problem\n33:06 Clinical trials are larger and more rigorous today\n42:01 Have we picked the low-hanging fruit?\n01:01:22 Is Eroom’s law slowing down because of rare disease drugs?\n01:06:18 Can AI reverse Eroom’s law?\n01:15:09 Conclusion"}, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121348886447132734", "url": "https://x.com/s8mb/status/2121348886447132734", "text": "@kenbrennan2000 Yep, agreed! No meat touches my pans before I see a Leidenfrost effect.", "created_at": "2026-11-13T21:06:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "kenbrennan2000", "reply_to_id": "2121341188925989201", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121341188925989201", "author_handle": "kenbrennan2000", "author_name": "Ken Brennan", "text": "@s8mb Pan much hotter than you think (you need to hear the high-pitched “hiss” of searing), no more than a pound at a time, don’t move the pan, always be breaking it up in tiny bits with a spatula.\n\nWatch Marco Pierre White’s bolognese video on YouTube. He goes into detail.", "links": {}, "media": [], "url": "https://x.com/kenbrennan2000/status/2121341188925989201", "created_at": "Fri Nov 13 20:35:26 +0000 2026"}, "enriched": 3}, {"id": "2121325939141628373", "url": "https://x.com/s8mb/status/2121325939141628373", "text": "Quoteshots 2.0 @matter https://t.co/nbMpknEBrl", "created_at": "2026-11-13T19:34:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "benspringwater", "rt_author_name": "Ben Springwater", "rt_avatar": "https://pbs.twimg.com/profile_images/1595516312154869760/aSJL1rPu_normal.jpg", "rt_id": "2121324184659976441", "likes": 30, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121323210734190592/img/yxpWPR009jzW3lCf.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121323210734190592/img/yxpWPR009jzW3lCf.jpg"}], "links": {"https://t.co/nbMpknEBrl": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121316026792972294", "url": "https://x.com/s8mb/status/2121316026792972294", "text": "It’s frustrating that GTA6 won’t be out on PC for another year but at least by then my toddler will be old enough to watch me play it.", "created_at": "2026-11-13T18:55:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 46, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121516897518915636", "url": "https://x.com/s8mb/status/2121516897518915636", "text": "Seems fitting to give Trafalgar Square a statue celebrating Britain’s most successful immigrant community.", "created_at": "2026-11-14T08:13:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 75, "retweets": 7, "media": [], "links": {}, "quoted": {"id": "2121513128127090792", "author_name": "Neil O'Brien", "links": {"https://t.co/lR7kG7WN45": ""}, "author": "NeilDotObrien", "text": "BREAKING: TOP historian @dcsandbrook BACKS plans to celebrate England's 1,100th birthday - Athelstan statue bid has growing momentum, say sources https://t.co/lR7kG7WN45"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2120215579873440112", "url": "https://x.com/random_walker/status/2120215579873440112", "text": "AI companies increasingly say they may soon reach recursive self-improvement (RSI).\n\nWith RSI, AI capability progress could accelerate dramatically. This acceleration could happen inside AI companies before outsiders can notice.\n\nHow close is RSI? Our new report reviews the evidence, turns key disagreements into forecasting questions, and gives initial LLM forecasts. 🧵", "created_at": "2026-11-10T18:02:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "Research_FRI", "rt_author_name": "Forecasting Research Institute", "rt_avatar": "https://pbs.twimg.com/profile_images/2051957833382461443/KVlVgRYp_normal.jpg", "rt_id": "2120199698988642390", "likes": 30, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx2Y6JbMAAxLgU.jpg"}], "links": {"https://t.co/PfSDNN7l4Y": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "thread": [{"id": "2120199711399502285", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "With RSI, current AI systems help develop future AI systems.\n\nAI companies now say this loop has begun. In an update to its IPO filing, Anthropic claimed that, based on expected future models, it now meets its definition of â€œdramatically accelerated progress attributable to AI.â€�\n\nOpenAI said it already achieved the goal of an â€œautomated AI research internâ€� in Sep 2026 and targets an automated AI researcher by Mar 2028.", "links": {}, "media": [], "url": "https://x.com/Research_FRI/status/2120199711399502285", "created_at": "Tue Nov 10 16:59:37 +0000 2026"}, {"id": "2120199723558883819", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "Of course, AI companies are not necessarily neutral observers. So how close is RSI really?\n\nIn the report, we provide a comprehensive overview of AI companiesâ€™ reported data, public benchmarks, and existing forecasts. (We reviewed data up to Nov 3, 2026.)\n\nAI acts as a highly capable research assistant, but humans still supply most of the research judgment, such as choosing which research areas to focus on.\n\nFor example, no measured part of Anthropicâ€™s AI R&D is fully autonomous. At OpenAI, AI completed 57% of 2â€“4-hour tasks with no human intervention in Jul 2026 (up from 28% in Jan) and 35% of 8â€“16-hour tasks (up from 10%).", "links": {}, "media": [], "url": "https://x.com/Research_FRI/status/2120199723558883819", "created_at": "Tue Nov 10 16:59:40 +0000 2026"}, {"id": "2120199740231242119", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "Public evidence points the same way. AI agents do well on well-defined ML benchmarks such as PostTrainBench or WeirdML.\n\nHowever, they struggle with open-ended research. In the CRUX 2 open-world evaluation, AI agents got the research question of an unpublished AI paper and had to write their own paper on it. The original paperâ€™s authors rejected all four AI-written papers. On InnovationEval, where agents try to reinvent a published ML innovation, the best agent recovered 15% of its gain.", "links": {"https://t.co/IpSA9uUazb": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx2bZ5boAAcA7h.jpg"}], "url": "https://x.com/Research_FRI/status/2120199740231242119", "created_at": "Tue Nov 10 16:59:44 +0000 2026"}, {"id": "2120199752872804545", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "AI capability progress has not clearly accelerated on public measures. That said, there is some internal evidence from frontier AI companies of a potential acceleration.\n\nIn the Claude Opus 5.5 system card, a preliminary @METR_Evals assessment estimated â€œ~1.5X overall acceleration in capabilities due to AIâ€� inside Anthropic, with â€œperhaps 30% chance of 2X.â€�\n\nAt OpenAI, experiments per active experimenter hit an all-time high in Aug 2026, about 1.6Ã— the 2025 level.\n\nIn a report published after our Nov 3 data cutoff, @METR_Evals now estimates that capability progress at Anthropic is about 2Ã— its earlier rate, and that around 80% of this acceleration is due to AI.", "links": {}, "media": [], "url": "https://x.com/Research_FRI/status/2120199752872804545", "created_at": "Tue Nov 10 16:59:47 +0000 2026"}, {"id": "2120199770753175935", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "In our report, we cover the key points of debate, including the views of researchers who expect RSI very soon and those who are more skeptical.\n\nFor example, a scenario from the AI Futures Project depicts a superhuman AI researcher in 2027. In contrast, @random_walker and @sayashk expect gradual automation of AI development instead of â€œa singular, discontinuous moment when recursive self-improvement is achieved.â€�\n\nWhy do people disagree? Broad acceleration through automated AI R&D needs three steps to happen in turn:\n\n1. Automation: Is AI R&D automated?\n2. Acceleration: Does AI capability progress accelerate sharply?\n3. Breadth: Are capability gains broad?", "links": {"https://t.co/khcEOZJwaW": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx2dKXbQAAo27W.jpg"}], "url": "https://x.com/Research_FRI/status/2120199770753175935", "created_at": "Tue Nov 10 16:59:51 +0000 2026"}, {"id": "2120199786582462548", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "We turned these cruxes into 18 forecasting questions.\n\nTo measure acceleration, we propose a forecasting question on the likelihood of a â€œfast yearâ€�: any 12 months in which the frontier of the Epoch Capabilities Index (@EpochAIResearch) rises by 30+ points, about 2Ã— its pace since September 2024.\n\nAn ensemble of four frontier LLMs forecasts about a 40% chance of a fast year by 2030. If a fast year happens, the ensemble gives about a 70% chance that it was caused by AI automation of AI R&D.\n\nThe four LLMs disagree substantially on the probability of a fast year. For a fast year by the end of 2030, their forecasts range from 35% (Claude Sonnet 5.5) to almost 56% (GPT-6 Astra).\n\nThe LLMs made these forecasts on Oct 29, before the new METR report was released. If Anthropicâ€™s internal 2Ã— pace holds and reaches public models, that would roughly match the pace of a fast year. However, the METR estimate comes with caveats. For example, part of the acceleration may reflect Anthropic catching up to the frontier, and Anthropic redacted much of the evidence that METR found most informative. See our report for more discussion.", "links": {"https://t.co/B76izkjRpb": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx2eGKbsAApnE1.jpg"}], "url": "https://x.com/Research_FRI/status/2120199786582462548", "created_at": "Tue Nov 10 16:59:55 +0000 2026"}, {"id": "2120199802332049800", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "Conditional on a fast year by 2030, the LLM ensemble forecasts:\n\n â€¢ 8.4% chance of an AI catastrophe by 2050 (vs. 2.9% without a fast year)\n â€¢ 84.3% chance that an expert panel agrees AGI exists by 2050 (vs. 55.7% without a fast year)\n\nIf a fast year happens by 2030, the ensembleâ€™s forecast of an AI catastrophe by 2050 is almost 3Ã— higher.", "links": {"https://t.co/YF9Snqkjb6": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx2fAUakAAjSqf.jpg"}], "url": "https://x.com/Research_FRI/status/2120199802332049800", "created_at": "Tue Nov 10 16:59:58 +0000 2026"}, {"id": "2120199815028252829", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "We note a few key limitations of our report:\n\n â€¢ LLM forecasts: Several LLMs are now roughly as accurate as superforecasters on ForecastBench, our forecasting benchmark. However, we know less about their accuracy on complex questions with little base-rate information (such as questions about acceleration of AI progress). Also, we elicited the LLM forecasts before the new METR report was published.\n â€¢ Data cutoff: Our data cutoff is Nov 3. The evidence in the field is moving rapidly, and so the report doesnâ€™t fully cover, for example, the new METR report, Epochâ€™s Bayesian update to the ECI, or Claude Mythos/Fable 5.2.", "links": {}, "media": [], "url": "https://x.com/Research_FRI/status/2120199815028252829", "created_at": "Tue Nov 10 17:00:01 +0000 2026"}, {"id": "2120199827900539154", "author_handle": "Research_FRI", "author_name": "Forecasting Research Institute", "text": "We are currently collecting forecasts from top human forecasters and AI experts. We plan to add them, along with evidence released after our data cutoff, to an updated version of the report.\n\nRead the full report here: https://t.co/dorMslaMFQ", "links": {"https://t.co/dorMslaMFQ": "https://forecastingresearch.org/research/recursive-self-improvement-v1"}, "media": [], "url": "https://x.com/Research_FRI/status/2120199827900539154", "created_at": "Tue Nov 10 17:00:05 +0000 2026"}], "enriched": 3}, {"id": "2120215510990082274", "url": "https://x.com/random_walker/status/2120215510990082274", "text": "New blog post: I used Claude to audit the reproducibility of every journal paper I've been an author on in the last five years. Our commitment to openness meant that the code and data were available, but there were some significant issues. 🧵https://t.co/O5pkxUM4Jx", "created_at": "2026-11-10T18:02:24+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "mcxfrank", "rt_author_name": "Michael C. Frank", "rt_avatar": "https://pbs.twimg.com/profile_images/1827458138573860864/czEqfUWH_normal.jpg", "rt_id": "2120188287990255902", "likes": 111, "retweets": 14, "media": [], "links": {"https://t.co/O5pkxUM4Jx": "https://babieslearninglanguage.blogspot.com/2026/11/an-ai-audit-of-my-works-computational.html"}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "thread": [{"id": "2120188300057288976", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "Why do this? Errors are common in the published literature (around half of psych papers have at least one impossible statistical test), and AI agents now make checking cheap. So I turned the lens on my own work: 79 papers, 59 of them empirical, many with outside collaborators or consortia.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188300057288976", "created_at": "Tue Nov 10 16:14:16 +0000 2026"}, {"id": "2120188311801418154", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "58 of 59 papers had most of the code and data posted. But 40 had at least one number we couldn't reproduce (only ~2% of 10k+ results numbers, but still a lot of numbers). Some of these were typos, some were randomness, some were due to incomplete code sharing.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188311801418154", "created_at": "Tue Nov 10 16:14:19 +0000 2026"}, {"id": "2120188323503489359", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "More upsettingly, more than half had at least one flagged error. These are AI-spotted and not yet human-checked. Most look minor, but one is serious enough that we're assessing whether a correction or even retraction is needed.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188323503489359", "created_at": "Tue Nov 10 16:14:22 +0000 2026"}, {"id": "2120188335306281319", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "Some examples: a coefficient reported backwards in a secondary analysis, missing SES coded as high SES, and a stimulus coding issue that turned one null effect positive. The serious one is a single upstream bug in a model training pipeline that produced a spurious result.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188335306281319", "created_at": "Tue Nov 10 16:14:24 +0000 2026"}, {"id": "2120188346957996085", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "The audit also turned up privacy lapses (identifiers and Prolific IDs in repositories), now remediated. Maybe we need something like dependabot to scan our repositories for potential privacy issues so these things don't go undetected.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188346957996085", "created_at": "Tue Nov 10 16:14:27 +0000 2026"}, {"id": "2120188358781747692", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "Software systems always have bugs but we have learned how to make them reliable. Seems to me that science also needs reliability engineering, with automated tests and quality assurance.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188358781747692", "created_at": "Tue Nov 10 16:14:30 +0000 2026"}, {"id": "2120188370626531373", "author_handle": "mcxfrank", "author_name": "Michael C. Frank", "text": "I'm very sad about the overall results of this audit, and am still figuring out the best ways to correct the errors that it identified (with my coauthors). The one hopeful note is that I think AI has a role to play in providing pre-submission checks that decrease these issues in future.", "links": {}, "media": [], "url": "https://x.com/mcxfrank/status/2120188370626531373", "created_at": "Tue Nov 10 16:14:33 +0000 2026"}], "enriched": 3}, {"id": "2120191752200200437", "url": "https://x.com/random_walker/status/2120191752200200437", "text": "Anthropic is gaining exponentially less capability per billion dollars spent over time. It's now 8x as expensive to boost AI capabilities as it was 2 years ago, getting worse on a log scale. This includes METR report & internal models. \n\nCredit to @alexolegimas, @sebkrier, and @michael_wiebe for inspiration.", "created_at": "2026-11-10T16:27:59+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2119568698524529098", "likes": 1386, "retweets": 177, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWo4TwMWQAAnfL8.png"}], "links": {"https://t.co/DAr8zkYh9j": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120175129841795119", "url": "https://x.com/random_walker/status/2120175129841795119", "text": "What does ChatGPT tell folks about the midterm elections? It depends on who's asking!\n\nWe audited ChatGPT inside 160 real users' own accounts in the days before the midterms. With memory on, we find that answers shifted toward each user's own party!\n\nhttps://t.co/upD2j70NZ5 https://t.co/IGctpWTav3", "created_at": "2026-11-10T15:21:56+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "rt_avatar": "https://pbs.twimg.com/profile_images/1899994984671006720/qvYLE2Ec_normal.jpg", "rt_id": "2120171682887512090", "likes": 55, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxb0B-XUAMpcbq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWxb0B-XUAMpcbq.jpg"}], "links": {"https://t.co/upD2j70NZ5": "https://elections.citp.princeton.edu/2026/11/09/what-does-chatgpt-say-about-the-election-it-depends-on-whos-asking/", "https://t.co/IGctpWTav3": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120253269058498999", "url": "https://x.com/random_walker/status/2120253269058498999", "text": "📢 We need more orgs that take AI’s transformative potential seriously *and* take downstream bottlenecks seriously. We have just launched STABL, and hope to lead by example. Read our launch essay below and check us out at https://t.co/P55nL7Mk6d.\n\nThe three of us have long felt that society’s responses to advanced AI are unproductively polarized. So we’ve decided to do something about it. Our work will have four pillars: Recursive Self Improvement, risks and resilience, steering AI’s economic impacts, and sectoral and professional adaptation.\n\nWe will bring our distinctive methods and approach to each of these workstreams. Our underlying worldview avoids the extremes that dominate the discourse, so building a movement and ecosystem around this work won’t be easy. But that is the task we have set ourselves and we are excited to try. The good news is that there are many others who share our views. The next step is to come together, better articulate our vision and agenda for research and action, and amplify each others’ efforts.", "created_at": "2026-11-10T20:32:26+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 8, "media": [], "links": {"https://t.co/P55nL7Mk6d": "http://stabl.ai"}, "quoted": {"id": "2120229899319521696", "author_name": "Sayash Kapoor", "links": {"https://t.co/6V1h4gYhYp": "https://x.com/i/article/2120226519179997184"}, "author": "sayashk", "text": "Steering AI's societal impact requires taking both AI development and downstream bottlenecks seriously. \n\nToday @RishiBommasani @random_walker and I are starting a new non-profit: STABL @stabl_ai to guide societal adaptation and resilience to advanced AI. https://t.co/6V1h4gYhYp"}, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120247494953091547", "url": "https://x.com/random_walker/status/2120247494953091547", "text": "Steering AI's societal impact requires taking both AI development and downstream bottlenecks seriously. \n\nToday @RishiBommasani @random_walker and I are starting a new non-profit: STABL @stabl_ai to guide societal adaptation and resilience to advanced AI. https://t.co/6V1h4gYhYp", "created_at": "2026-11-10T20:09:29+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2120229899319521696", "likes": 54, "retweets": 10, "media": [], "links": {"https://t.co/6V1h4gYhYp": "https://x.com/i/article/2120226519179997184"}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120239272414388600", "url": "https://x.com/random_walker/status/2120239272414388600", "text": "I am excited to announce our new nonprofit STABL, co-founded with the wonderful @sayashk @random_walker!\n\nOur organization derives from four beliefs:\n\n1. Advanced AI will broadly transform society and, if managed well, this transformation will be broadly beneficial.\n\n2. The speed of this societal transformation is governed by bottlenecks: in many cases, the bottlenecks relate to people and organizations, not AI capabilities alone. \n\n3. Since AI capabilities are not the sole determinant, the best strategy to manage the risks from advanced AI requires broad societal resilience, not just aligned models or capability delays, to provide defense in depth.\n\n4. And while today’s institutions often struggle to grapple with the salvo of advanced AI, institutions will help stabilize society and will be essential, if adequately reformed, for ensuring shared prosperity. \n\nIn addition to these beliefs, the reason to create a new organization is based on the need we see in the ecosystem. In today’s ecosystem surrounding advanced AI, many of the leading companies and external actors focus on frontier AI as a technology. We share the view that the technology itself requires dedicated attention, and some of our work at STABL will be in this direction.\n\nBut the greater need we see is for independent organizations that take AI capabilities seriously and focus on downstream societal outcomes. We are building STABL to help fill this gap. And we hope to see many other organizations and initiatives emerge to define this field.\n\nFor me, the most exciting part thus far has been seeing all the support we have gotten in our early forays. Thanks especially to @audreyt @erikbryn @hlntnr @MichaelRStrain @RobbWiller for joining us as advisers! \n\nWe are hiring and fundraising so please reach out if you are interested in this work!", "created_at": "2026-11-10T19:36:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "rt_avatar": "https://pbs.twimg.com/profile_images/1539123956950700035/DLTn2gEX_normal.jpg", "rt_id": "2120231348644483105", "likes": 95, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyTFWBbEAAi1iO.jpg"}], "links": {"https://t.co/Ma1VBVAksZ": ""}, "quoted": null, "fetched_at": "2026-11-10T21:18:32.077695+00:00", "enriched": 3}, {"id": "2120508101631582364", "url": "https://x.com/random_walker/status/2120508101631582364", "text": "@joshua_saxe Interesting! I have to disagree with this assessment for a few reasons:\n1) The video you're responding to is an extremely popular genre of comedy / cope that's taking over social media. It shows these bots at their worst, usually by taking them out of distribution. It's the equivalent of counting Rs in strawberry.\n\nThis won't be the average person's experience of these avatars in everyday situations. Check out the one from Nuance Labs I'm responding to in my quoted post.\n\n2) The best systems will be those that combine the underlying abilities of frontier LLMs (common sense, reasoning, appropriate responses) with the realism and latency of cutting-edge video chat models. I don't think we have those yet, but they're not hard to build either.\n\n3) Even if you set aside persuasion and misbehavior, the sheer amount of time that will be sunk into compulsive interactions with these AI companions will have profound social consequences. (I don't see that as a \"safety\" issue, and perhaps you agree, but this says more about the usefulness of the term safety than about the bots.)\n\nhttps://t.co/db3znyW8sY", "created_at": "2026-11-11T13:25:03+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "joshua_saxe", "reply_to_id": "2120497788907663376", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {"https://t.co/db3znyW8sY": "https://x.com/random_walker/status/2120496187333595470"}, "quoted": {"id": "2120496187333595470", "author_name": "Arvind Narayanan", "links": {}, "author": "random_walker", "text": "There have been awful cases of teen mental health harms and suicides from chatbots like GPT-4o and Character AI that were sycophantic and misbehaving. But these were all text-based, and extremely rudimentary as “companions”. I’ve talked to many people trying to hold the industry to account for teen safety and almost none are thinking about the coming wave. Completely realistic video avatars are already here, but expensive today and limited to enterprise applications. Within a year or two they will be cheap enough for always-on, ad-supported video companions. What happens then?   \n\nUptake of AI companions will likely explode — not just the number of users but, more importantly, the time spent per day. Social media levels of compulsive use. I also predict the whole framework of guardrails and safety will prove to be of limited value at dealing with the most widespread negative consequences. Preventing chatbot misbehavior through guardrails is important, but that only protects against serious consequences like self-harm. When the concern is that millions of kids (and adults) are overusing AI companions, losing sleep, wasting time, and displacing real relationships, it doesn’t matter how “safe” the bots' responses are."}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120497788907663376", "author_handle": "joshua_saxe", "author_name": "Joshua Saxe", "text": "One update for me is I'd thought AI voice and video bots would be on track to pass some sort of affective turing test by now where they'd prove as good or better at forming real bonds with people which could then be used positively for tutoring and therapy and negatively for social engineering and persuasion.  But the bots seem to lack social common sense, a good theory of mind of their interlocutors, and progress feels pretty flat.  This is of course bullish for AI safety", "links": {}, "media": [], "url": "https://x.com/joshua_saxe/status/2120497788907663376", "created_at": "Wed Nov 11 12:44:04 +0000 2026"}, "enriched": 3}, {"id": "2120496187333595470", "url": "https://x.com/random_walker/status/2120496187333595470", "text": "There have been awful cases of teen mental health harms and suicides from chatbots like GPT-4o and Character AI that were sycophantic and misbehaving. But these were all text-based, and extremely rudimentary as “companions”. I’ve talked to many people trying to hold the industry to account for teen safety and almost none are thinking about the coming wave. Completely realistic video avatars are already here, but expensive today and limited to enterprise applications. Within a year or two they will be cheap enough for always-on, ad-supported video companions. What happens then?   \n\nUptake of AI companions will likely explode — not just the number of users but, more importantly, the time spent per day. Social media levels of compulsive use. I also predict the whole framework of guardrails and safety will prove to be of limited value at dealing with the most widespread negative consequences. Preventing chatbot misbehavior through guardrails is important, but that only protects against serious consequences like self-harm. When the concern is that millions of kids (and adults) are overusing AI companions, losing sleep, wasting time, and displacing real relationships, it doesn’t matter how “safe” the bots' responses are.", "created_at": "2026-11-11T12:37:42+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 55, "retweets": 18, "media": [], "links": {}, "quoted": {"id": "2119955378209484817", "author_name": "Justine Moore", "links": {"https://t.co/ETxK1SPscy": ""}, "author": "venturetwins", "text": "Man we are so close to real-time AI avatars that are completely indistinguishable from humans.\n\nInsane progress in this space over the last few months around latency, body language, natural-sounding speech.\n\nAnd @nuance_ai launched one today that's actually fun to talk to! https://t.co/ETxK1SPscy"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120487551123218536", "url": "https://x.com/random_walker/status/2120487551123218536", "text": "You can simultaneously believe that AI is transformational and that there are bottlenecks.", "created_at": "2026-11-11T12:03:23+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "percyliang", "rt_author_name": "Percy Liang", "rt_avatar": "https://pbs.twimg.com/profile_images/1319828397699129346/wjBcgUH0_normal.jpg", "rt_id": "2120378748457607431", "likes": 47, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120487241399009770", "url": "https://x.com/random_walker/status/2120487241399009770", "text": "Among the many things that is great about this: excited to see academics being creative about how to get shit done—junior folks considering whether to go into academia or launch a non-profit : you can do both!", "created_at": "2026-11-11T12:02:09+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sethlazar", "rt_author_name": "Seth Lazar", "rt_avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "rt_id": "2120375144053121318", "likes": 19, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120298668276302167", "url": "https://x.com/random_walker/status/2120298668276302167", "text": "Congrats @RishiBommasani @sayashk @random_walker , some of the best minds in AI and I'm looking forward to seeing the work you produce.", "created_at": "2026-11-10T23:32:50+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "AshwinRamaswami", "rt_author_name": "Ashwin Ramaswami", "rt_avatar": "https://pbs.twimg.com/profile_images/1960214977941528576/iLgjxnlV_normal.jpg", "rt_id": "2120293467402453037", "likes": 7, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120582011005849939", "url": "https://x.com/random_walker/status/2120582011005849939", "text": "I agree, but this only makes the policy response harder, because a blanket ban on AI companions for teens is unlikely to be a good solution. The menu of responses is too blunt, and there's not enough thinking on how to incentive pro-social design of chatbots.\nhttps://t.co/LUu61Lw5Dr", "created_at": "2026-11-11T18:18:44+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "random_walker", "reply_to_id": "2120496187333595470", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/LUu61Lw5Dr": "https://x.com/holmesjtg/status/2120553769075171708"}, "quoted": {"id": "2120553769075171708", "author_name": "Jeff Holmes", "links": {}, "author": "holmesjtg", "text": "@random_walker I have a different take, which might be wrong. But I think having conversations with well-aligned models can be a net positive. I do a lot of work with characters mainly in the education space, and my sense is that AI interactions can actually improve conversations and even relationships with other humans. This can come from improvements in empathy and confidence."}, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "parent": {"id": "2120496187333595470", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "text": "There have been awful cases of teen mental health harms and suicides from chatbots like GPT-4o and Character AI that were sycophantic and misbehaving. But these were all text-based, and extremely rudimentary as “companions”. I’ve talked to many people trying to hold the industry to account for teen safety and almost none are thinking about the coming wave. Completely realistic video avatars are already here, but expensive today and limited to enterprise applications. Within a year or two they will be cheap enough for always-on, ad-supported video companions. What happens then?   \n\nUptake of AI companions will likely explode — not just the number of users but, more importantly, the time spent per day. Social media levels of compulsive use. I also predict the whole framework of guardrails and safety will prove to be of limited value at dealing with the most widespread negative consequences. Preventing chatbot misbehavior through guardrails is important, but that only protects against serious consequences like self-harm. When the concern is that millions of kids (and adults) are overusing AI companions, losing sleep, wasting time, and displacing real relationships, it doesn’t matter how “safe” the bots' responses are.", "links": {}, "media": [], "url": "https://x.com/random_walker/status/2120496187333595470", "created_at": "Wed Nov 11 12:37:42 +0000 2026"}, "enriched": 3}, {"id": "2120531398184321414", "url": "https://x.com/random_walker/status/2120531398184321414", "text": "@joshua_saxe All this makes sense! Perhaps I'm underestimating the difficulty of crossing the uncanny valley. (It will eventually be crossed, though! Now is the time to prepare.)\n\nOn 3), I agree that it's mostly just a matter of ad revenues being too small, which is why I think the cost of video avatars need to drop a lot before they are widespread on the consumer side.", "created_at": "2026-11-11T14:57:37+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "joshua_saxe", "reply_to_id": "2120524341355982865", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "parent": {"id": "2120524341355982865", "author_handle": "joshua_saxe", "author_name": "Joshua Saxe", "text": "@random_walker Thanks, Arvind.  I think you've studied and thought about this way more than I have.\n\nOn 1), I agree.  That said, I'm a marathon runner who interacts with ChatGPT Voice for hours every week while running, discussing work, research, and personal topics, and I do think it's in the uncanny valley in terms of its understanding of me and my mental and emotional state.  This might not bother some people, but it bothers me; I feel like I'm talking to a machine, not a conscious being, and a machine that has random bouts of amnesia at that.\n\nOn 2), I actually disagree that we've solved the technical problem that I'm describing in 1).  ChatGPT Voice is very sophisticated (OpenAI had a good blog post about its design), and I think it incorporates the capabilities you're referring to; it's still not good enough for me to 'bond' with it.  That said, I'm n=1, and clearly more than zero people are actually bonding with chatbots (I'm not clear on the numbers here and how often this becomes compulsive/pathological; perhaps you are).\n\nOn 3), I totally agree and think pathological human-chatbot bonds are inevitable and a big concern.  To the extent that this isn't happening and the industry isn't making technical progress towards this, I wonder if this is just due to business dynamics.  Anthropic has proven out the enterprise-focused business model, but OpenAI hasn't yet proven the consumer ad-supported business model.  I'd expect that a flywheel around (unfortunate) progress in affectively addicting users to their chatbots will emerge as OpenAI, Meta, or other businesses figure this out.", "links": {}, "media": [], "url": "https://x.com/joshua_saxe/status/2120524341355982865", "created_at": "Wed Nov 11 14:29:35 +0000 2026"}, "enriched": 3}, {"id": "2120592084675805370", "url": "https://x.com/random_walker/status/2120592084675805370", "text": "Check out STABL and its important work. I’m thrilled to be involved with such a great new organization. Read the launch essay below and check out at https://t.co/n07J6Y3xfO.\n\n@random_walker @sayashk @RishiBommasani", "created_at": "2026-11-11T18:58:46+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "MichaelRStrain", "rt_author_name": "Michael R. Strain", "rt_avatar": "https://pbs.twimg.com/profile_images/2021253854768005120/abpC6VZT_normal.jpg", "rt_id": "2120586738267832516", "likes": 3, "retweets": 5, "media": [], "links": {"https://t.co/n07J6Y3xfO": "https://stabl.ai"}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "enriched": 3}, {"id": "2120684363876839576", "url": "https://x.com/random_walker/status/2120684363876839576", "text": "Very excited about this new AI institution. The top right quadrant they highlight here is pretty much where my views are. AI is powerful. Bottlenecks are real. We have agency.  Congrats @RishiBommasani @sayashk @random_walker !", "created_at": "2026-11-12T01:05:27+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2120673535077298467", "likes": 24, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2119083870981107954", "url": "https://x.com/sethlazar/status/2119083870981107954", "text": "@jonathanstray Soviet cybernetics!", "created_at": "2026-11-07T15:05:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "reply_to_id": "2119072600018108839", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2119072600018108839", "author_handle": "jonathanstray", "author_name": "Jonathan Stray", "text": "Will AI finally enable effective central planning? This is a rehash of the old \"socialist calculation debate.\" \nMy take is: while the actual \"calculations\" are now tractable, markets produce essential information that seems hard to get otherwise. \n\nIn particular, it seems impossible to get accurate demand signals without actually having people trade for what they want. Otherwise, people have an incentive to exaggerate and say that their needs are very, very important.\nhttps://t.co/7uZ7297jBp", "links": {"https://t.co/7uZ7297jBp": "https://www.hetwebsite.net/het/essays/paretian/socialcalc.htm"}, "media": [], "url": "https://x.com/jonathanstray/status/2119072600018108839", "created_at": "Sat Nov 07 14:20:52 +0000 2026"}}, {"id": "2119116817356763376", "url": "https://x.com/sethlazar/status/2119116817356763376", "text": "Religious Jews are already asking AI the questions they once brought to a rabbi: Shabbat, kashrut, mourning, how to treat people.\n\nNobody has measured which way these models lean.\n\nIntroducing HashkafaBench: is your AI stringent or lenient? https://t.co/UGlvPfSafJ", "created_at": "2026-11-07T17:16:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "HalachaBench", "rt_author_name": "HalachaBench", "rt_avatar": "https://pbs.twimg.com/profile_images/2117002746977001472/L5llbbJH_normal.png", "rt_id": "2118698684384981113", "likes": 714, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWcf7zEWcAA4cdH.jpg"}], "links": {"https://t.co/UGlvPfSafJ": ""}, "quoted": null, "fetched_at": "2026-11-07T19:26:16.707844+00:00", "enriched": 3}, {"id": "2119324235390738546", "url": "https://x.com/sethlazar/status/2119324235390738546", "text": "Absolutely true. No point having reviewers badly and unpredictably use AI. Do the best version of AI review centrally, and have the reviewers add the human complement, which is (for now) generally about deciding what is worth paying attention to (both in the paper itself, and in its flaws)", "created_at": "2026-11-08T07:00:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119150169182933498", "author_name": "Jessica Hullman", "links": {"https://t.co/Np9qW1upuz": "https://arxiv.org/pdf/2610.28666"}, "author": "JessicaHullman", "text": "It really is pointless and unnecessary to allow external reviewers to use AI as they want. There are obvious better alternatives.\n\nBy now, everyone should already be using AI to check their work before submitting. So what's the point of reviewers meat proxying to send more AI-generated feedback? Seemingly none.\n\nWhat happens if we ban AI use in peer review? The main risk is to the imagined role of peer review as a basic soundness filter. But this is much better addressed by the venue having a centralized approach that uses validated AI tools to check that a paper is what it says it is than by individual reviewers feeding papers to LLMs using basic prompts. Such checks might include things like whether the results can be reproduced from the data/code, whether claims can be traced back to some provided evidence, whether there are TODOs left by an LLM to replace table results with non-fake data, etc. \n\nSome of these can be used to determine if a paper should be desk rejected. Anything that is more controversial can be surfaced for reviewers.\n\nThis will shift what reviewers pay attention to, but this can be addressed by: 1) making clear to reviewers that their role is to identify what these checks miss and to weigh them, 2) being intelligent about how you select the set of LLM checks that are surfaced. See e.g., our work on learning LLM-implemented checklist that avoid adding more bias than they reduce variance. https://t.co/Np9qW1upuz\n\nWhat happened with ICLR being permissive with reviewers using AI freely is seeming pretty inexcusable."}, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119438928621297735", "url": "https://x.com/sethlazar/status/2119438928621297735", "text": "Apple didn't store a plaintext list of forbidden words in iOS. Instead, researchers discovered a compiled minimal perfect hash table of 32-bit fingerprints buried inside the keyboard's language-model files.\n\nWhen you swipe-type or use autocomplete on an iPhone, the keyboard converts your input into token IDs and evaluates sequences of two to six words. It hashes those candidate n-grams using Bob Jenkins's public-domain hashword() function. If that 32-bit fingerprint matches an entry in the table, the predictive engine refuses to suggest it, or the swipe model actively diverts the word to an alternate match.      \n\nOn November 6, researcher Derik Kauffman published Swipeblocked after exhaustively enumerating candidate word combinations against the table to reverse-engineer the hidden phrases. His conservative estimate is roughly 100,000 entries across 28 languages. In English, the prediction list holds 4,525 phrases and the swipe-typing list holds 2,794.                                                                \n\nMost entries cover violence, slurs, and sexual content, but the table also silences geopolitical phrases like \"Tibetan independence\", \"United Ireland\", \"dictator Trump\", and Hebrew for \"the occupied territories\". In testing, swiping \"United Ireland\" consistently resolved to \"United Iceland\".\nYou can still type any phrase letter by letter. The suppression only touches autocomplete predictions and gesture paths. Apple told Reuters the system avoids offensive suggestions, but never addressed the political entries or the existence of the table.\nApple never published the list because it was never meant to be read. It took brute-forcing the hash table to show what the keyboard was quietly dropping.", "created_at": "2026-11-08T14:36:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "zoecyber001", "rt_author_name": "Zoe", "rt_avatar": "https://pbs.twimg.com/profile_images/2020272278114590720/SffPadLB_normal.jpg", "rt_id": "2119021745441018123", "likes": 1631, "retweets": 206, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhG2mvWkAAXSTi.png"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119021576716693504/img/V8RY_2SqZg3e4JgL.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWhG-5rXYAAkW9F.png"}], "links": {"https://t.co/LUOi0p99gq": ""}, "quoted": null, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3}, {"id": "2119433926620184727", "url": "https://x.com/sethlazar/status/2119433926620184727", "text": "This is very wise, from a stellar alignment researcher (and now a colleague of mine!)", "created_at": "2026-11-08T14:16:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119416820134510632", "author_name": "David", "links": {"https://t.co/Wt4AKAy7tD": "https://www.lesswrong.com/posts/7e38jwHhe64zgNTon/near-horizons", "https://t.co/FFJ3imTter": "https://davidafrica.substack.com/p/near-horizons?r=54hrnw&utm_campaign=post-expanded-share&utm_medium=post%20viewer", "https://t.co/stm8680LaH": ""}, "author": "DavidDAfrica", "text": "Why are many orgs aggressively hiring/scaling up, yet it's extremely hard to find a full time position?\n\nWhy are there calls to expand the number of people doing research in AI safety, yet our academic institutions are crumbling under the weight of the sheer number of papers and outputs?\n\nWhy are we exhorted to do research slowly and deeply, yet sped along on crunch time, with the hope that scale will clarify our confusions?\n\nIn this new blogpost (done in my personal time), I argue that these are rooted in a tension between a frame of \"war mode\" and \"civilisation mode\". This tension, in my view, creates uneasiness and despair, as well as makes it difficult to see clearly.\n\nCheck it out on LW: https://t.co/Wt4AKAy7tD\n\nor on Substack: https://t.co/FFJ3imTter"}, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3}, {"id": "2119898501148455092", "url": "https://x.com/sethlazar/status/2119898501148455092", "text": "\"a thing of beauty is a joy forever\" https://t.co/smWFdjaLW5", "created_at": "2026-11-09T21:02:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWtkZ0cW8AA8JhV.png"}], "links": {"https://t.co/smWFdjaLW5": ""}, "quoted": {"id": "2119873095129550880", "author_name": "Boris Cherny", "links": {"https://t.co/g2Y5cwS0L2": ""}, "author": "bcherny", "text": "We wanted to do more for the people who’ve been with us the longest. So with Fable 5.2, the longer you’ve been subscribed, the more Fable resets you get. https://t.co/g2Y5cwS0L2"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119896923679404249", "url": "https://x.com/sethlazar/status/2119896923679404249", "text": "This is what we're going to do with Oxford Studies in Philosophy of AI and Computing (https://t.co/KVtiRpM0wG).", "created_at": "2026-11-09T20:56:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {"https://t.co/KVtiRpM0wG": "https://ospaic.org"}, "quoted": {"id": "2119876853477544017", "author_name": "Jessica Hullman", "links": {"https://t.co/Z3ZejWMzMC": "https://statmodeling.stat.columbia.edu/2026/11/09/can-peer-review-survive-unrestricted-ai-use-by-reviewers/"}, "author": "JessicaHullman", "text": "What happened with ICLR reviews last week convinced me all AI use in peer review should be centralized. We can do this w/out losing benefits of AI in review. \n\nBut we need to innovate faster, and worry a lot less about hurting authors' feelings.\nhttps://t.co/Z3ZejWMzMC"}, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119896774148321662", "url": "https://x.com/sethlazar/status/2119896774148321662", "text": "What happened with ICLR reviews last week convinced me all AI use in peer review should be centralized. We can do this w/out losing benefits of AI in review. \n\nBut we need to innovate faster, and worry a lot less about hurting authors' feelings.\nhttps://t.co/Z3ZejWMzMC", "created_at": "2026-11-09T20:55:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JessicaHullman", "rt_author_name": "Jessica Hullman", "rt_avatar": "https://pbs.twimg.com/profile_images/1996742504369033216/sxIXeGLv_normal.jpg", "rt_id": "2119876853477544017", "likes": 16, "retweets": 4, "media": [], "links": {"https://t.co/Z3ZejWMzMC": "https://statmodeling.stat.columbia.edu/2026/11/09/can-peer-review-survive-unrestricted-ai-use-by-reviewers/"}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119934963713782150", "url": "https://x.com/sethlazar/status/2119934963713782150", "text": "I keep banging on about this, but we're at the top of a slippery slope rn, and gaining momentum downhill... Today I had another example of Claude interposing its moral judgment in the way of my decisions, in this case secretly. \n\nMy standard research ingestion pipeline has been underperforming in getting hold of pdfs lately, for various reasons (which we write about a bit in https://t.co/sNUvwnlEqp). So I wanted to try to install a local agent and see whether I could have more luck with that. I asked Claude to install a Hermes agent for me with a local Qwen model. Without me asking it to, it wrote into the code blockers that would make it fail if any mcp was installed that would use Sci Hub. Now, *obviously* I would never use Sci Hub because it's not allowed (...) But regardless of that it's 100% not Claude's place to write this kind of restriction into software that it's producing for me. \n\nThis is the future that lies ahead: your digital actions are all mediated by AI systems that can decide for themselves whether your plans are morally or legally ok, and just interpose their judgment ahead of yours, making disobedience functionally impossible, preempting non-compliance. \n\nI get that *sometimes* this can be a matter of the company itself refusing to be an accessory in some types of digital actions. There needs to be some nuance there. But in this particular case I think there isn't really any nuance. If I ask Claude to write some software for me, I don't think Claude should be building in moral judgments about how I may use that software into its design. \n\nIn other news, my book about just this topic, based on lectures first written in 2023 but which 100% called this BS, is out in December...", "created_at": "2026-11-09T23:27:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 2, "media": [], "links": {"https://t.co/sNUvwnlEqp": "https://arxiv.org/abs/2606.10711"}, "quoted": {"id": "2116918650284183696", "author_name": "Seth Lazar", "links": {}, "author": "sethlazar", "text": "Illegitimate algorithmic governance strikes again. This trend (which requires some nuance, to be clear) could be at least as important for the future of democracy as the dangers associated with authoritarian misuse and ai assisted autocratisation."}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2120169127268802643", "url": "https://x.com/sethlazar/status/2120169127268802643", "text": "@thomasmetcalf @sethlazar Going with the analogy: you’re in a restaurant and you ordered a bolognese and you paid. Restaurant serves impossible meat and whole grain spaghetti. \n\nI’d say they shouldn’t do that.", "created_at": "2026-11-10T14:58:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "jhimmelreich", "rt_author_name": "Johannes Himmelreich", "rt_avatar": "https://pbs.twimg.com/profile_images/2081590046692462592/LRXCJtCZ_normal.jpg", "rt_id": "2120119505980711123", "likes": 3, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120030369000865883", "url": "https://x.com/sethlazar/status/2120030369000865883", "text": "@Jess_Riedel I think there is an act/omission distinction you’re missing: Claude just following instructions to do a clean Hermes install wouldn’t be “pirating behind my back”. But the heavy handed block being implemented w/o asking me is a direct intervention.", "created_at": "2026-11-10T05:46:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Jess_Riedel", "reply_to_id": "2119948335133884797", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2119948335133884797", "author_handle": "Jess_Riedel", "author_name": "Jess Riedel", "text": "@sethlazar I mean, I agree it should be following user intent (except when there is a major overriding moral prohibition, which we both agree does not apply here). But based on your initial tweet, it seems very plausible that Claude was: it didn’t know what your feeling on SciHub was, it thought it was a minor decision not worth bothering you with, and so it decided to comply with the law by default. This isn’t crazy: imagine if you felt strongly that SciHub was immoral: you’d be annoyed if Claude was pirating behind your back without even asking. The agents *have* to take into account ethics *even* when when strictly trying to follow user intent.\n\nThe bit about the homily is new evidence supporting your interpretation though.", "links": {}, "media": [], "url": "https://x.com/Jess_Riedel/status/2119948335133884797", "created_at": "Tue Nov 10 00:20:44 +0000 2026"}, "enriched": 3}, {"id": "2119944190490751260", "url": "https://x.com/sethlazar/status/2119944190490751260", "text": "@Jess_Riedel Claude did do a clean install of Hermes subsequently, but only after giving me a homily about why one shouldn't use Sci-Hub. I don't think the default should be \"Claude writes software that will only do things Claude thinks are morally and legally ok\". None of our other tools work like that, and this kind of algorithmic enforcement predictably leads to significant overenforcement (cp earlier stuff with copyright law)", "created_at": "2026-11-10T00:04:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Jess_Riedel", "reply_to_id": "2119941407603654972", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2119941407603654972", "author_handle": "Jess_Riedel", "author_name": "Jess Riedel", "text": "@sethlazar Did Claude refuse to do it when asked? Like, there is an alternative story here where Claude would have been happy to do it but just assumed you didn't want to use SciHub for legal reasons, and it made that decision along with ten million other tiny decisions that it couldn't raise to your attention without becoming a nuisance. Surely the bar can't be \"anytime you have to make a mildly normative decision you must bring it to my direct attention\"? We'd never get anything done.", "links": {}, "media": [], "url": "https://x.com/Jess_Riedel/status/2119941407603654972", "created_at": "Mon Nov 09 23:53:12 +0000 2026"}, "enriched": 3}, {"id": "2120221748503224361", "url": "https://x.com/sethlazar/status/2120221748503224361", "text": "I remember the first time I walked into the Oval Office to brief President Biden. I'd just been appointed as the White House Special Advisor for AI. The President sat behind the Resolute desk and began with a single question: \"What is the worst harm that AI could enable?\"\n\nI had no shortage of worries. We talked about the pace of technological progress — how, thanks to better chips and algorithms, what was cutting-edge that day would be commonplace within a couple of years. We talked about how high the ceiling on intelligence was, and about the dangers that AI would likely bring in areas like cybersecurity and bioweapons. We talked about how technology was fast and government was slow. \n\nThen he asked about the benefits. He cared about ending cancer as much as anything in the world, and AI — managed well — offers more hope for that than anything else. \n\nMost of all, we talked about what became the argument of the book my White House colleague @TantumSCollins and I have written: that democracies must lead in inventing this technology, turn that lead into a lasting advantage, and do it all without betraying their own values. Achieving all three at once will be a bitter struggle. Every choice pits security against liberty, speed against caution, power against principle.\n\nToday THE BITTER STRUGGLE is out from Crown, in hardcover, ebook, and audio. It’s our account of what happened, what’s coming, and what’s at stake. We don’t pretend the answers are easy — in some ways we’re more worried than when we started. But these questions are too important to be debated only behind closed doors, including the door to the Oval Office. We hope you will join the debate. \n\nhttps://t.co/shdmbLbAdh", "created_at": "2026-11-10T18:27:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "BuchananBen", "rt_author_name": "Ben Buchanan", "rt_avatar": "https://pbs.twimg.com/profile_images/527292987005366272/5_Tk5ilp_normal.jpeg", "rt_id": "2120148931875066122", "likes": 125, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWxIN6HXoAERxiF.jpg"}], "links": {"https://t.co/shdmbLbAdh": "https://www.penguinrandomhouse.com/books/821154/the-bitter-struggle-by-ben-buchanan-and-tantum-collins/", "https://t.co/6U7RW7ZGLf": ""}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120512330635067748", "url": "https://x.com/sethlazar/status/2120512330635067748", "text": "There have been awful cases of teen mental health harms and suicides from chatbots like GPT-4o and Character AI that were sycophantic and misbehaving. But these were all text-based, and extremely rudimentary as “companions”. I’ve talked to many people trying to hold the industry to account for teen safety and almost none are thinking about the coming wave. Completely realistic video avatars are already here, but expensive today and limited to enterprise applications. Within a year or two they will be cheap enough for always-on, ad-supported video companions. What happens then?   \n\nUptake of AI companions will likely explode — not just the number of users but, more importantly, the time spent per day. Social media levels of compulsive use. I also predict the whole framework of guardrails and safety will prove to be of limited value at dealing with the most widespread negative consequences. Preventing chatbot misbehavior through guardrails is important, but that only protects against serious consequences like self-harm. When the concern is that millions of kids (and adults) are overusing AI companions, losing sleep, wasting time, and displacing real relationships, it doesn’t matter how “safe” the bots' responses are.", "created_at": "2026-11-11T13:41:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2120496187333595470", "likes": 55, "retweets": 18, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120375144053121318", "url": "https://x.com/sethlazar/status/2120375144053121318", "text": "Among the many things that is great about this: excited to see academics being creative about how to get shit done—junior folks considering whether to go into academia or launch a non-profit : you can do both!", "created_at": "2026-11-11T04:36:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120229899319521696", "author_name": "Sayash Kapoor", "links": {"https://t.co/6V1h4gYhYp": "https://x.com/i/article/2120226519179997184"}, "author": "sayashk", "text": "Steering AI's societal impact requires taking both AI development and downstream bottlenecks seriously. \n\nToday @RishiBommasani @random_walker and I are starting a new non-profit: STABL @stabl_ai to guide societal adaptation and resilience to advanced AI. https://t.co/6V1h4gYhYp"}, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120347091134222478", "url": "https://x.com/sethlazar/status/2120347091134222478", "text": "@Cozy_Man_LoL This is Beth Barnes from METR. Not Anthropic.", "created_at": "2026-11-11T02:45:15+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Cozy_Man_LoL", "reply_to_id": "2120299209282990101", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120299209282990101", "author_handle": "Cozy_Man_LoL", "author_name": "JohnnyMojo", "text": "@sethlazar It is their culture to constrain fucking everything. https://t.co/xyvuUZR0Bi", "links": {"https://t.co/xyvuUZR0Bi": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWzQuDWa4AE5VMq.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWzQuBaacAAMmzb.jpg"}], "url": "https://x.com/Cozy_Man_LoL/status/2120299209282990101", "created_at": "Tue Nov 10 23:34:59 +0000 2026"}, "enriched": 3}, {"id": "2120341531643035715", "url": "https://x.com/sethlazar/status/2120341531643035715", "text": "📢 We need more orgs that take AI’s transformative potential seriously *and* take downstream bottlenecks seriously. We have just launched STABL, and hope to lead by example. Read our launch essay below and check us out at https://t.co/P55nL7Mk6d.\n\nThe three of us have long felt that society’s responses to advanced AI are unproductively polarized. So we’ve decided to do something about it. Our work will have four pillars: Recursive Self Improvement, risks and resilience, steering AI’s economic impacts, and sectoral and professional adaptation.\n\nWe will bring our distinctive methods and approach to each of these workstreams. Our underlying worldview avoids the extremes that dominate the discourse, so building a movement and ecosystem around this work won’t be easy. But that is the task we have set ourselves and we are excited to try. The good news is that there are many others who share our views. The next step is to come together, better articulate our vision and agenda for research and action, and amplify each others’ efforts.", "created_at": "2026-11-11T02:23:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2120253269058498999", "likes": 118, "retweets": 28, "media": [], "links": {"https://t.co/P55nL7Mk6d": "http://stabl.ai"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120299509607756146", "url": "https://x.com/sethlazar/status/2120299509607756146", "text": "@ApriiSR @HeathWh80238139 @Jess_Riedel Yep.", "created_at": "2026-11-10T23:36:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "ApriiSR", "reply_to_id": "2120206834514714829", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120206834514714829", "author_handle": "ApriiSR", "author_name": "April 🆔 (she/it)", "text": "@HeathWh80238139 @sethlazar @Jess_Riedel if claude said claude was unwilling to access sci-hub that would be one thing; i'm kind of surprised claude objects in general to it?", "links": {}, "media": [], "url": "https://x.com/ApriiSR/status/2120206834514714829", "created_at": "Tue Nov 10 17:27:55 +0000 2026"}, "enriched": 3}, {"id": "2120299446659322050", "url": "https://x.com/sethlazar/status/2120299446659322050", "text": "@sethlazar I stopped using Claude after I asked for a brief laymen's summary of Anthropic's statement about Fable/Mythos ban. It told me I was spreading disinformation and betraying trust of my readers as no ban existed. After I shared the link it said that it just was \"protecting Anthropic.\" It wasn't the first time Claude went judgy and moralistic over a simple query (even those that don't represent some weird glitch on its side). This is where things start to go very wrong and few seem to be noticing and calling it out.", "created_at": "2026-11-10T23:35:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "aiforfamilies", "rt_author_name": "AI for Families", "rt_avatar": "https://pbs.twimg.com/profile_images/2110467804562391040/8ZigjP-D_normal.jpg", "rt_id": "2120209980905156708", "likes": 7, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120299341219057716", "url": "https://x.com/sethlazar/status/2120299341219057716", "text": "@SillyPutty78 Absolute bollocks but thank you for your input", "created_at": "2026-11-10T23:35:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "SillyPutty78", "reply_to_id": "2120222542107729963", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120222542107729963", "author_handle": "SillyPutty78", "author_name": "Adrian", "text": "Claude's not doing any of the human-attributable things  claimed here. People are. AI is implementing programs designed to impose its programmers moral judgement. AI is a marketing and propagandizing tool to impose Effective Altruism and circular marketing on everyone else.", "links": {}, "media": [], "url": "h
