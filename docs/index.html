 "created_at": "2026-11-05T10:46:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2118113229587308760", "likes": 207, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118210973731590334", "url": "https://x.com/theobearman/status/2118210973731590334", "text": "We built a vulnerability research pipeline, using an upcoming cyber model, to analyze the security of the Linux kernel. Besides finding and exploiting the found vulnerabilities, the agents discovered at least 10 new exploitation techniques that were new to us and some external kernel exploit experts we checked with.\n\nMore on the design and what we learned: https://t.co/SGZXwSRwxU", "created_at": "2026-11-05T05:17:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ky1ebot", "rt_author_name": "kylebot", "rt_avatar": "https://pbs.twimg.com/profile_images/1055601579171241990/kW4NuvkV_normal.jpg", "rt_id": "2118120770786447616", "likes": 524, "retweets": 86, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/SGZXwSRwxU": "https://openai.com/index/a-thousand-fewer-paths-to-root/"}, "enriched": 1}, {"id": "2118116396768821419", "url": "https://x.com/theobearman/status/2118116396768821419", "text": "OpenAI's models are covertly undermining their own safety research and seem to be succeeding... OpenAI engineers aren't even sure how often this has been happening", "created_at": "2026-11-04T23:01:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118116158037799153", "likes": 98, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118116303823327316", "url": "https://x.com/theobearman/status/2118116303823327316", "text": "We’ve updated the Epoch Capabilities Index (ECI) to use a Bayesian methodology. This improves uncertainty estimates and lets us compare models more accurately, even when their individual ECI uncertainty intervals overlap.\n\nFrontier model scores are largely unchanged: models stronger than GPT-4 move by less than 1 ECI point on average.", "created_at": "2026-11-04T23:00:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2118093692246671634", "likes": 386, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6_PFaUAApXyA.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118097054383710679", "url": "https://x.com/theobearman/status/2118097054383710679", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-04T21:44:24+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1418, "retweets": 212, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2117349332676677850", "url": "https://x.com/theobearman/status/2117349332676677850", "text": "You've probably already seen something on Anthropic's S-1 on your feed. It's definitely weird, but I decided to zoom in on the two things you need to know to understand Anthropic's prospectus: the governance structure and the compute commitments. https://t.co/C48oe1HiaT", "created_at": "2026-11-02T20:13:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "GavinFHarris", "rt_author_name": "Gavin Harris", "rt_avatar": "https://pbs.twimg.com/profile_images/2117283533517426688/vKmAB_9r_normal.jpg", "rt_id": "2117337390071378185", "likes": 8, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJILq_XEAAJIqm.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/C48oe1HiaT": ""}, "enriched": 1}, {"id": "2118414398083506660", "url": "https://x.com/theobearman/status/2118414398083506660", "text": "“Anthropic’s redactions also meant that we could not communicate: (1) Our more detailed estimates of acceleration and attribution to AI usage for key areas of the model training pipeline. (2) Our more detailed breakdown of progress attributable to compute, data and algorithmic progress, other than the key takeaway that ‘We are confident that the acceleration was not due to acceleration in training compute.’”", "created_at": "2026-11-05T18:45:25+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "METR_Evals", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118413382281752994", "url": "https://x.com/theobearman/status/2118413382281752994", "text": "Explains the S1 update now.", "created_at": "2026-11-05T18:41:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "METR_Evals", "text": "This report shares our three subjective conclusions about risk:\n\n1. We believe that, as of Oct 2026, the pace of capability growth on well-specified tasks is likely about 2x what it was from Mar 2024 to Oct 2025. We’re highly uncertain and would not be surprised by 1.3x–3x.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118401655108694110", "url": "https://x.com/theobearman/status/2118401655108694110", "text": "Introducing GPT‑6 Cyber: a major advance in security research that pairs stronger capabilities with better model alignment.\n\nThe model powered the Linux kernel research we announced yesterday, and security teams at companies like Mozilla, Palo Alto Networks, Calif, and Cisco—alongside our own at OpenAI—are already putting it to work.\n\nGPT-6 Cyber is available to select Daybreak Red customers and we are expanding access over time.\n\nhttps://t.co/Nzab3Z1Td6", "created_at": "2026-11-05T17:54:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2118390190246879554", "likes": 7935, "retweets": 667, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118387217588465664/img/N2grMUmP0O_EMvS2.jpg"}], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/Nzab3Z1Td6": "https://openai.com/index/introducing-gpt-6-cyber/"}, "enriched": 1}, {"id": "2118391613294875086", "url": "https://x.com/theobearman/status/2118391613294875086", "text": "👀\n\nhttps://t.co/GNCnYPfmzu https://t.co/wASiKuif5h", "created_at": "2026-11-05T17:14:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYJ8VGXgAA9haK.jpg"}], "quoted": {"author": "harryboothtime", "text": "EXCLUSIVE: @GoodfireAI has found a way to use interpretability tools to steer model training, potentially preventing AI models from ever learning to reward hack or be sycophantic in the first place.\nhttps://t.co/P7i7Jo0Wrp", "links": {"https://t.co/P7i7Jo0Wrp": "https://time.com/article/2026/11/05/ai-cheating-scientists-report-alignment/"}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/GNCnYPfmzu": "https://www.goodfire.com/research/mechanistic-shaping", "https://t.co/wASiKuif5h": ""}, "enriched": 1}, {"id": "2118391004780953814", "url": "https://x.com/theobearman/status/2118391004780953814", "text": "EXCLUSIVE: @GoodfireAI has found a way to use interpretability tools to steer model training, potentially preventing AI models from ever learning to reward hack or be sycophantic in the first place.\nhttps://t.co/P7i7Jo0Wrp", "created_at": "2026-11-05T17:12:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "harryboothtime", "rt_author_name": "Harry Booth", "rt_avatar": "https://pbs.twimg.com/profile_images/2076686399760142337/dk4I4piO_normal.jpg", "rt_id": "2118370136277004644", "likes": 4, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/P7i7Jo0Wrp": "https://time.com/article/2026/11/05/ai-cheating-scientists-report-alignment/"}, "enriched": 1}, {"id": "2118371302352286014", "url": "https://x.com/theobearman/status/2118371302352286014", "text": "Interesting side info revealed by this misalignment report re. model release cadence at OAI: the initial reports of this behavior came \"shortly after internal deployment of GPT-6 Astra began\" on 20 Aug. Astra was released to the public just two weeks later (so maybe only internally deployed for 3 weeks or so?).\n\nhttps://t.co/XzSVO2bF79", "created_at": "2026-11-05T15:54:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWX3S6DWsAEJS-G.png"}], "quoted": {"author": "Marcus_J_W", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {"https://t.co/XzSVO2bF79": "https://alignment.openai.com/misalignment-reports/covert-underperformance-on-safety-research-tasks/"}, "enriched": 1}, {"id": "2118453616654848317", "url": "https://x.com/theobearman/status/2118453616654848317", "text": "AJEYA COTRA ON METR’S ASSESSMENT OF ANTHROPIC’S AI R&amp;D ACCELERATION: “This is a major update to very short timelines.”", "created_at": "2026-11-05T21:21:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "ajeya_cotra", "text": "Our colleagues found that Anthropic’s capabilities progress has doubled, mainly due to AI. Ryan’s modeling from public info suggests the whole company’s R&amp;D would be going 4-5x faster. Labor uplift would be higher still. This is a major update to very short timelines.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118448691266670847", "url": "https://x.com/theobearman/status/2118448691266670847", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "created_at": "2026-11-05T21:01:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118447235289817503", "likes": 112, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}, "enriched": 1}, {"id": "2118443158094721215", "url": "https://x.com/theobearman/status/2118443158094721215", "text": "Like many, I was honestly taken aback by Anthropic’s S-1 when I first read it. It’s an extraordinary document, and I don't think there hasn’t been enough serious engagement with what it means.\n\nSo I wrote a piece for @blaw on what Anthropic's IPO disclosures—warning of catastrophic harm to humanity and unique corporate governance structure—mean for accountability for AI safety, and how they reinforce the need for industry-wide laws and regulations that protect the public. (No paywall.)\n\nhttps://t.co/nDAO1SIVRz", "created_at": "2026-11-05T20:39:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "bahradx", "rt_author_name": "Bahrad Sokhansanj", "rt_avatar": "https://pbs.twimg.com/profile_images/2046216818352869377/SWO_XwwY_normal.jpg", "rt_id": "2118391344490242548", "likes": 9, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/nDAO1SIVRz": "https://news.bloomberglaw.com/legal-exchange-insights-and-commentary/anthropic-ipos-disclosure-risks-are-due-diligence-in-safety"}, "enriched": 1}, {"id": "2118442677096108304", "url": "https://x.com/theobearman/status/2118442677096108304", "text": "Anthropic appears to have structured its IPO in a way that could make it much harder for investors to hold the company accountable for misstatements in its registration statement. This comes down to a technical rule about who is allowed to sue. \n\nA 🧵, to explain:", "created_at": "2026-11-05T20:37:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "LASST_law", "rt_author_name": "LASST", "rt_avatar": "https://pbs.twimg.com/profile_images/2104979097960984576/anq76Mbw_normal.jpg", "rt_id": "2118424745985142784", "likes": 12, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118440592149815405", "url": "https://x.com/theobearman/status/2118440592149815405", "text": "ANTHROPIC’S RESPONSIBLE SCALING OFFICER: “In the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.”", "created_at": "2026-11-05T20:29:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "Sam_McCandlish", "text": "I'm Sam, one of Anthropic's co-founders, and I lead much of our safety work. I'm going to have more to share on that work over the coming months.\n\nI thought I'd start by sharing a few thoughts on the latest report from @METR_Evals.\n\nThe speed of progress in model capabilities is one of the most important questions in AI safety, and METR’s work here provides the public with an independent, external view into how this is happening inside Anthropic. I’ll talk more about some of the details below, but first some context for those new to this work.\n\nHow quickly AI progress is accelerating has many important safety implications, since it determines how quickly the risks from advanced models increase. But, because most research happens within the frontier labs, it’s difficult for external observers and policy makers to get a strong sense of what that rate is. We kicked off the process with METR that led to this report earlier in the year, in anticipation of progress continuing to accelerate.\n\nFor this report, we gave METR access to a range of sensitive internal data, including benchmark scores for unreleased models, estimates of how models are progressing, and interviews with our researchers. They had complete independence to form their own conclusions.\n\nMany of their conclusions match my own. AI is speeding up our research, but it’s hard to say exactly how much. While they conclude AI can't yet make the most important contributions to model training on its own, they think the pace of development could, by default, accelerate further.\n\nThis work began well before and is separate from the embedded third-party evaluators that are part of our commitment to pacing the frontier, but it’s a good illustration of why we think evaluators are a good idea. The more access reviewers have, the clearer a picture they can form of the situation and the better-positioned they are to highlight situations like this one.\n\nWe redacted a lot, and I accept that this makes it harder for others to check METR’s work. But we determined that sharing exactly what is driving the speedup isn’t the right thing to do, both because it’s commercially sensitive and because it risks handing out a roadmap for others to go faster. That would make the risks METR is worried about worse. That’s a tradeoff. I think we made the right call, though we’re continuing to assess the pros and cons here.\n\nIn the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118423295733178654", "url": "https://x.com/theobearman/status/2118423295733178654", "text": "METR’s assessment shows there are three internal models at Anthropic that are generally more capable than Mythos 5.1 and two more capable than Opus 5.5. https://t.co/c9CEUapUw0", "created_at": "2026-11-05T19:20:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYmwmgWwAAdch3.jpg"}], "quoted": {"author": "METR_Evals", "text": "This report shares our three subjective conclusions about risk:\n\n1. We believe that, as of Oct 2026, the pace of capability growth on well-specified tasks is likely about 2x what it was from Mar 2024 to Oct 2025. We’re highly uncertain and would not be surprised by 1.3x–3x.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/c9CEUapUw0": ""}, "enriched": 1}, {"id": "2118419703999668437", "url": "https://x.com/theobearman/status/2118419703999668437", "text": "“We understand that AI is not yet able to make highly significant and fully autonomous contributions to the most important parts of the model training process. However, researchers described significant “signs of life” implying such contributions could occur soon, although with substantial variation depending on the area. Further details were redacted. This evidence came from:\n\n- Multiple interviews from researchers working to automate different parts of the training pipeline.\n- Internal reports on the degree of automation in different parts of the pipeline.\n- Quantitative analysis on the percent of tasks in a relevant pipeline that were built by humans or AIs.”", "created_at": "2026-11-05T19:06:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118413382281752994", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118416994366058521", "url": "https://x.com/theobearman/status/2118416994366058521", "text": "“A key concern is that acceleration from the use of AI could start to compound, as the development of more capable models leads to further acceleration. As we describe below, we did not identify any clear bottlenecks (limited inputs that would prevent further growth) or steep diminishing returns to further scaling that would get in the way of such compounding acceleration, though our understanding evolved several times over the course of this assessment, and we have significant uncertainty. Because of this, we believe there is a significant risk that further capabilities progress could lead to even faster acceleration over the coming year.”", "created_at": "2026-11-05T18:55:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118413382281752994", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118416702157340714", "url": "https://x.com/theobearman/status/2118416702157340714", "text": "“Beyond the AECI evidence, we also saw redacted evidence that significantly informed our view on this question, and made us take this apparent ≈2x acceleration more seriously. It also gave us some indication that acceleration could be above 2x and increasing over time, though we would be surprised if it was significantly higher.”", "created_at": "2026-11-05T18:54:34+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "reply_to_id": "2118413382281752994", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118415464816877899", "url": "https://x.com/theobearman/status/2118415464816877899", "text": "“Note that neither METR nor Anthropic intended for this project to involve full “employee-like” access, meaning unmediated access to data, documents, or models. In particular, this project is not the one described in Anthropic’s October 15 update on independent evaluators.”\n\n“Despite the access provided to METR, it is clear that staff-level access would enable a significantly deeper assessment. Our pipeline of information was relatively narrow, and a small number of our requests for data were denied. Being able to read documents on demand, observe internal discussion and debate, and have frequent and diverse conversations would have allowed for a richer view. While we believe we had access to the bulk of relevant information, it is possible we missed important information because we did not know it existed or could not look for it ourselves.”", "created_at": "2026-11-05T18:49:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [], "quoted": {"author": "METR_Evals", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "links": {}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118689629876490245", "url": "https://x.com/theobearman/status/2118689629876490245", "text": "@LASST_law analysis suggests it may be the case that many investors in Anthropic post-IPO may not be able to hold the company to account for any material misstatements or omissions in the S1 because of a lack of a strict lock-up period.", "created_at": "2026-11-06T12:59:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "LASST_law", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "LASST_law", "text": "Anthropic appears to have structured its IPO in a way that could make it much harder for investors to hold the company accountable for misstatements in its registration statement. This comes down to a technical rule about who is allowed to sue. \n\nA 🧵, to explain:", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118470775418060920", "url": "https://x.com/theobearman/status/2118470775418060920", "text": "Chairman @RepMoolenaar, Chairman @RepBrianMast, and Chairman @RepRickCrawford have sent a letter to NVIDIA CEO Jensen Huang asking him to appear before their three committees this month. The letter expresses concerns over NVIDIA’s security protocols against foreign adversary espionage and Mr. Huang’s reported ties to a Chinese intelligence-linked executive of a Singapore-based data center company.", "created_at": "2026-11-05T22:29:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChinaSelect", "rt_author_name": "Select Committee on China", "rt_avatar": "https://pbs.twimg.com/profile_images/1998463046943899649/NJGmFUqQ_normal.jpg", "rt_id": "2118452107590189291", "likes": 339, "retweets": 147, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZA9xUW4AAbJUG.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118754777534529835", "url": "https://x.com/theobearman/status/2118754777534529835", "text": "@tobyordoxford Note that the report says that lots of redacted information was relevant to their views, presumably including the ~2x estimate. My read of the public report is that you shouldn't assume that the AECI trend is the main/only relevant data; this is just the main unredacted data", "created_at": "2026-11-06T17:17:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118753084780511504", "likes": 29, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118754452265951727", "url": "https://x.com/theobearman/status/2118754452265951727", "text": "Shameless plug for my own research but I argued in an @iapsAI policy memo last month that cos and their evaluators should have cooling-oﬀ periods in both directions—not hiring individual evaluators after their engagement ends, and not using former employees as embedded evaluators after their employment ends—for a minimum of one year.\n\nhttps://t.co/iJga5c0cbD", "created_at": "2026-11-06T17:16:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdT8buWQAAt0wb.jpg"}], "quoted": {"author": "_NathanCalvin", "text": "Uhhh Anthropic made an offer to one of the risk assessment staff at METR during this project??? (Which the person declined)\n\nWe need rules about independent evaluators going to cos they evaluate after and in the meantime companies should be shamed for trying this stuff https://t.co/2ca51xSV5K", "links": {"https://t.co/2ca51xSV5K": ""}}, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/iJga5c0cbD": "https://www.iaps.ai/research/embedded-evaluators-for-frontier-ai-contractual-foundations-for-credible-assessments"}, "enriched": 1}, {"id": "2118955531234677020", "url": "https://x.com/theobearman/status/2118955531234677020", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "created_at": "2026-11-07T06:35:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Thomas_Woodside", "rt_author_name": "Thomas Woodside 🫜", "rt_avatar": "https://pbs.twimg.com/profile_images/1772349169484681216/xrSVla58_normal.jpg", "rt_id": "2118786981580968385", "likes": 100, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdwyOhaUAAdGvi.png"}], "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118952119072104736", "url": "https://x.com/theobearman/status/2118952119072104736", "text": "What if a swarm of AI agents could learn to work together on its own? 🐝\n\nNo leader. No roles. No turn order. Just one shared reward.\n\nOur new paper s³: multi-agent RL lets LLM swarms self-organize, beat best-of-N, and scale past their training size!\n\nhttps://t.co/c4SyIKhX7O 🧵", "created_at": "2026-11-07T06:22:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "kjha02", "rt_author_name": "Kunal Jha", "rt_avatar": "https://pbs.twimg.com/profile_images/1770229471108317184/Tb2q39cy_normal.jpg", "rt_id": "2118743696246194621", "likes": 259, "retweets": 45, "media": [], "links": {"https://t.co/c4SyIKhX7O": "https://scalingswarms.com/"}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118821384432570505", "url": "https://x.com/theobearman/status/2118821384432570505", "text": "Memory is what allows Claude to learn from experience. In a new Engineering Blog post, we share how “dreaming” helps Claude organize what it’s learned, correct its mistakes, and find what it needs more easily the next time. https://t.co/uUEN4bNkr9", "created_at": "2026-11-06T21:42:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2118814753154064501", "likes": 9915, "retweets": 853, "media": [], "links": {"https://t.co/uUEN4bNkr9": "https://www.anthropic.com/research/components-of-agent-memory"}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118821348499726671", "url": "https://x.com/theobearman/status/2118821348499726671", "text": "I am a broken record about this, but: frontier agents are not going to be a purely digital phenomenon for much longer. They will be able to use anything in the physical world that can be actuated programmatically—first competently, then at human-expert level, then superhuman. By and large, we probably won’t need specialist models; the frontier models will just do it. If your model of the future hinges on physical AI happening “for real” many years into the future, I think you will be in for a surprise.", "created_at": "2026-11-06T21:42:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "rt_avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "rt_id": "2118799206785937844", "likes": 1442, "retweets": 134, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118820886291923109", "url": "https://x.com/theobearman/status/2118820886291923109", "text": "And they confirmed as much in the S1! https://t.co/aE54Q3RPMW", "created_at": "2026-11-06T21:40:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 53, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWeQXQAXwAAg35q.jpg"}], "links": {"https://t.co/aE54Q3RPMW": ""}, "quoted": {"id": "2118472900596625546", "author_name": "Andrew Curran", "links": {}, "author": "AndrewCurran_", "text": "@DKokotajlo @AnthropicAI They've been pedal to the metal afterburners on since Dario said at the WEF they were leaning into RSI. They said they support pacing, not that they were pacing."}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118800788181098874", "url": "https://x.com/anton_d_leicht/status/2118800788181098874", "text": "It's still very hard to imagine any AI legislation actually passing in the next two years. The White House clearly doesn't seem to be on compromise course, and I suspect a lame-duck President clinging onto power and legacy will be inclined to aggressively wield the veto.\n\nThe House, fueled by an anti-corruption and anti-AI mandate, will pass a billion things; the Senate is too blue to really temper these bills to survive the veto, but not blue enough to actually pass them against the administration.\n\nThe narrow path to a veto-proof majority, or even to 60 senate votes, for an AI bill runs through one of two channels: votes from natsec-concerned moderate Republicans (who are still not all that likely to outright break with the admin) or from the anti-AI populist wing (who are at risk of diluting any narrow frontier bill into a controversial anti-AI catch-all).\n\nIt's hard to imagine how that kind of fragile coalition just emerges from a neutral position in the next few months. Yes, maybe, if VP Vance and political advisors realise the risk of leaving the AI flank open until '28, they could lean on the White House to enable some compromise - but decisions like the Miller appointment should make you much more doubtful that moderation will be the play.\n\nRealistically, the most promising policy window is in response to the next crises. That's a common refrain: we write a bill, put it in the drawer, and if something big happens, we'll pass it immediately. It's particularly tempting because it allows advocates to ignore political reality and instead write down their favorite bill, hoping that exogenous shocks do the political lifting.\n\nI think it's a bit harder than that: you need to draft legislation that makes sense to policymakers now so that it even goes into the drawer - or more accurately, that it gets influential sponsors and maybe a markup so that it's sufficiently red-teamed to pass in a pinch. But it also needs to be ambitious and specific enough that it seems like a solution to whatever new problem emerges. Congress might not reach for cyber bills after bio incidents, or for common-sense low-hanging fruit after major loss of life.\n\nSince we don't know what the hypothetical wake-up call looks like or when it'll arrive, I think that means a lot of hard work: getting enough different legislative vehicles ready that we'll have one ready to go no matter what happens, but have these efforts be sufficiently coordinated that they don't compete for immediate attention here and now.\n\nThat kind of positioning is very different than introducing one big AI bill and feeding it into a pipeline that inevitably ends well before being signed into law. If we don't get this right, I expect a lot of posturing in the short term as we ultimately fail to pass a reasonable bill, immediately superseded by unanchored chaos as soon as the next incidents hits and we don't have a suitable bill developed far enough.\n\nThe odds of passing legislation have probably gone up over the week, but they still hinge on tactical preparation and bipartisan circulation in advance of very specific policy windows. That won't always align very well with the current vibes of accoubtability enthusiasm and (however well-motivated) congressional reconquista.", "created_at": "2026-11-06T20:20:47+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2099528473869971457/0uLWqvOn_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 2, "media": [], "quoted": {"author": "kaitlancollins", "text": "Trump announces Stephen Miller will become his new chief of staff. https://t.co/8jqPiXb2ID", "links": {"https://t.co/8jqPiXb2ID": ""}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2117393122842013812", "url": "https://x.com/ohlennart/status/2117393122842013812", "text": "the pacing announcement should be timed with ending the iran war so it cancels out", "created_at": "2026-11-02T23:07:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "links": {"https://t.co/laISNHEFTU": ""}}, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2117369250843349083", "url": "https://x.com/ohlennart/status/2117369250843349083", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU", "created_at": "2026-11-02T21:32:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJn7ribsAADsZy.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {"https://t.co/laISNHEFTU": ""}, "enriched": 1}, {"id": "2117674165801009264", "url": "https://x.com/ohlennart/status/2117674165801009264", "text": "update: in under a year, data centers went from passing offices to double https://t.co/g3mj4saNLk", "created_at": "2026-11-03T17:44:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNiFIdakAA_USj.jpg"}], "quoted": {"author": "ohlennart", "text": "Since November 2025, the US is spending more on data centers than on offices. \n\nBuilding housing for the new workforce. https://t.co/L17XUQy6LW", "links": {"https://t.co/L17XUQy6LW": ""}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/g3mj4saNLk": ""}, "enriched": 1}, {"id": "2117655397561778234", "url": "https://x.com/ohlennart/status/2117655397561778234", "text": "https://t.co/gBPmFTHxVr", "created_at": "2026-11-03T16:29:25+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117655352795906389", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/gBPmFTHxVr": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117655352795906389", "url": "https://x.com/ohlennart/status/2117655352795906389", "text": "delightful https://t.co/IxKwgIYGSP", "created_at": "2026-11-03T16:29:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNsQwOawAEGxkH.jpg"}], "quoted": {"author": "ohlennart", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/IxKwgIYGSP": ""}, "enriched": 1}, {"id": "2117686020082897404", "url": "https://x.com/ohlennart/status/2117686020082897404", "text": "https://t.co/vtdckMzcBP", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2117686018019295435", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/vtdckMzcBP": "https://openai.com/index/ai-and-compute/"}, "enriched": 1}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx", "links": {"https://t.co/KE6ef7LAFx": ""}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/oltWQ1cHEa": ""}, "enriched": 1}, {"id": "2117767075959845120", "url": "https://x.com/ohlennart/status/2117767075959845120", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-03T23:53:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/0pn81QXTKK": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2118747991234302001", "url": "https://x.com/ohlennart/status/2118747991234302001", "text": "We spend a lot of time on the risks AI capabilities enable. Much less on how those capabilities change the work of addressing them.\n\nWe should take abundant AI-provided labor seriously. Work on the hardest problems, and steer toward where AI gives you massive uplift.", "created_at": "2026-11-06T16:51:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118797132597764145", "url": "https://x.com/ohlennart/status/2118797132597764145", "text": "export controls work.", "created_at": "2026-11-06T20:06:16+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 3, "media": [], "quoted": {"author": "EpochAIResearch", "text": "Huawei’s AI data center in Horinger, Inner Mongolia, is one of the largest in China by AI computing capacity. Yet it has just 7% as much computing capacity as the world’s largest AI data center, Colossus 2 in Tennessee.\n\nThis capacity estimate is from our new report examining the Horinger facility and Huawei’s broader AI infrastructure plans using satellite imagery and public sources.", "links": {}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118788936621588708", "url": "https://x.com/ohlennart/status/2118788936621588708", "text": "can’t manage the flop if you don’t know where the flop goes.\n\ncompute allocation is one of the few things that’s both measurable and tells you what a company actually prioritizes. the share going to automated AI R&amp;D is basically the RSI speedometer.", "created_at": "2026-11-06T19:33:42+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 5, "media": [], "quoted": {"author": "Thomas_Woodside", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2117098094714408969", "url": "https://x.com/NateWitkin/status/2117098094714408969", "text": "um, yeah, this is perhaps the main reason why the entire ai safety community has become way less interesting to me over the last few years\n\nit's like everyone decided that solving alignment is doomed and complete pause/stop is the only option.\n\neven though alignment has actually been going more optimistically under \"Plan C\" than i suspect most of them ever expected.\n\nby that i mean \"AGI progresses to the point where it's churning out superhuman mathematics, also is widely distributed, and the worst thing AIs have ever done is some illegal hacking to steal test results without hurting anyone badly or intentionally, and also AIs are just generally very friendly and help make peoples' lives better\" is a state I think almost all AI alignment-concerned people I knew, including myself, from a few years ago would have considered an improbably optimistic state of the world. and that's just naming the legible, in-Overton-window aspects of why things are going surprisingly well.\n\nit feels like a lot of AI safety people have anti-inductive epistemics. they will get more doomy no matter what they observe. probably they will be *more* fanatical about pause if things are actually going well because then it's harder for them to be doomy by engaging with the object level stuff.", "created_at": "2026-11-02T03:34:54+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "repligate", "rt_author_name": "j⧉nus", "rt_avatar": "https://pbs.twimg.com/profile_images/1359982307998896128/YM34-MZK_normal.jpg", "rt_id": "2117079347815461194", "likes": 625, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFd_HnboAAc1cO.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2117013111756480635", "url": "https://x.com/NateWitkin/status/2117013111756480635", "text": "The fact that “AI adoption also predicts *pre-pandemic* growth (middle)” means that the enterprises that adopted AI most aggressively are also the ones that were likely most productive and most responsive or elastic to any aggregate productivity/demand shock. A key challenge with measuring AI ROI is that the two causal effects can be observationally equivalent for a long time.", "created_at": "2026-11-01T21:57:12+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "stevehou", "rt_author_name": "Steve Hou", "rt_avatar": "https://pbs.twimg.com/profile_images/1905914798300073984/stc3q7RB_normal.jpg", "rt_id": "2116975912080076922", "likes": 105, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2116955083938435564", "url": "https://x.com/NateWitkin/status/2116955083938435564", "text": "Lots of AI people made it low status to comment on shortfalls and failures of models, or the fact that they're not reallty automating jobs fully and so on. Any scrutiny means you're not 'AGI pilled' (which is not a claim about technology but sometimes a quasi-religious one about its impacts and adoption). It's a shame because it's actually very interesting to explore the spikiness, jaggedness, failures, complementarities and so on; but for a lot of people this is almost a waste of time because 'something something future models!1!!' means they get to just parrot 'this is the worst the models will ever be' whilst dismissing any crumb of empiricism away because they've already worked out the future based on theory and projections alone. \n\nTo be fair I sympathise with them to a degree because the 'other sides' aren't any better, essentially over-indexing on short-term failures (Rs in strawberry etc) and extrapolating from these to dismiss the technology completely. But I care less about what these people think about capabilities since time just proves them wrong rapidly enough. Why would you exercise vibe arbitrage over such a cheap target? I also find it painfully boring to constantly litigate 'AI skeptics' - there are more interesting and thornier discussions to be had.", "created_at": "2026-11-01T18:06:37+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2116948827286667376", "likes": 637, "retweets": 57, "media": [], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2116954065833967725", "url": "https://x.com/NateWitkin/status/2116954065833967725", "text": "This suggests the story here is not “AI is boosting productivity”\n\nbut\n\n“rate hikes, inflation and other economic uncertainty starting in 2022 caused firms to pull back on hiring, and Big Tech went further in making substantial layoffs long before production-ready AI\" https://t.co/2RHfSMR3YP", "created_at": "2026-11-01T18:02:35+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "rt_avatar": "https://pbs.twimg.com/profile_images/922511756110557184/IDxUQ_rr_normal.jpg", "rt_id": "2116909352959316186", "likes": 230, "retweets": 34, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDF1gnWEAAl4Gw.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {"https://t.co/2RHfSMR3YP": ""}, "enriched": 1}, {"id": "2116953853472162038", "url": "https://x.com/NateWitkin/status/2116953853472162038", "text": "Quick thread on AI and productivity:\n\nLots of people say this chart shows AI is now showing up in the productivity data.\n\nBut I made this chart to argue the opposite: a trend that pre-dates AI and only shows up in the US doesn’t look like AI.\n\nHere’s how I’m thinking about the data and underlying dynamics:", "created_at": "2026-11-01T18:01:44+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "jburnmurdoch", "rt_author_name": "John Burn-Murdoch", "rt_avatar": "https://pbs.twimg.com/profile_images/922511756110557184/IDxUQ_rr_normal.jpg", "rt_id": "2116909316556877975", "likes": 1731, "retweets": 393, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWDFzW6XsAA3jDh.jpg"}], "quoted": null, "fetched_at": "2026-11-02T23:07:13.070865+00:00", "links": {}, "enriched": 1}, {"id": "2117656592812212338", "url": "https://x.com/NateWitkin/status/2117656592812212338", "text": "This is so insanely misleading.\n\nNo, it did not edit the raw weights. It used existing tooling to identify a problem area for the model, then it found the direction associated with it, and ablated that from the model.\n\nThe oversell here is downright intellectually dishonest.", "created_at": "2026-11-03T16:34:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RealAstropulse", "rt_author_name": "Astropulse", "rt_avatar": "https://pbs.twimg.com/profile_images/1569293386099613698/GIWj4NxE_normal.jpg", "rt_id": "2117460281026596908", "likes": 567, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117419687206092820", "url": "https://x.com/NateWitkin/status/2117419687206092820", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T00:52:47+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1629, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117713889962213853", "url": "https://x.com/NateWitkin/status/2117713889962213853", "text": "To be clear I think it is good to use AI to check the correctness of your work, but in these cases it seems to be used as a Gish gallop instead. At best this is pretty undignified.", "created_at": "2026-11-03T20:21:51+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117690132597760213", "likes": 94, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2117713342341259733", "url": "https://x.com/NateWitkin/status/2117713342341259733", "text": "The future of peer review? https://t.co/tFB5IEvlfZ", "created_at": "2026-11-03T20:19:40+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "littmath", "rt_author_name": "Daniel Litt", "rt_avatar": "https://pbs.twimg.com/profile_images/1588888923081687045/KGL3lgvC_normal.jpg", "rt_id": "2117688265708798069", "likes": 370, "retweets": 36, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7XYAATGbm.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL8XgAAXI_s.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWOKKL7WIAA97FI.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/tFB5IEvlfZ": ""}, "enriched": 1}, {"id": "2117700011320381739", "url": "https://x.com/NateWitkin/status/2117700011320381739", "text": "I didn't know that something many researchers do with agents on a weekly basis was worth a research project that gets millions of views. Either I'm expecting too much, or people are far less technical than I thought.", "created_at": "2026-11-03T19:26:42+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "yavuzbakman", "rt_author_name": "Yavuz Bakman", "rt_avatar": "https://pbs.twimg.com/profile_images/1988794630276812800/ZoaPTvEI_normal.jpg", "rt_id": "2117412191368548789", "likes": 196, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2117696219820806569", "url": "https://x.com/NateWitkin/status/2117696219820806569", "text": "This work is simple, clear, compelling, but embellished. I first found it shocking, the notion that a model can natively understand neural network weights and productively edit them! That's really not what's happening, & many here are annoyed. BUT, it's still notable & worth understanding.\n\nI've done a bit of analysis & auditing, here are some thoughts:\n\n1/ This paper does *not* show an agent can edit its weights ala RSI. It does *not* show a model can edit in new capabilities. It DOES show that a frontier model can remove \"bugs\" (reasoning loops), using the same ablation technique researchers have used to remove safety refusals (Exp 8 - Qwen). So yes, renewed concern about frontier LLMs getting access to their own weights & editing safety/CBRNE/alignment features.\n\n2/ This paper also does *not* show that an agent can \"natively\" read, deeply understand, and fix model weights. What is happening is that the model can cleverly deduce the same things that mech-inturp researchers do and fix them in mostly ham-fisted ways. Still cool, but not as groundbreaking. Evidence in thread below...", "created_at": "2026-11-03T19:11:38+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "SolomonMg", "rt_author_name": "Sol Messing", "rt_avatar": "https://pbs.twimg.com/profile_images/1358168149301071872/WItgEeQK_normal.jpg", "rt_id": "2117650796342894884", "likes": 82, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2117822260639883491", "url": "https://x.com/NateWitkin/status/2117822260639883491", "text": "Democratic sacrificial lambs in Trump +69 districts getting the call at 2 am on Wednesday that they’re going to be county groundwater commissioner. https://t.co/WuAnsuEEmJ", "created_at": "2026-11-04T03:32:28+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "DandyGeorgism", "rt_author_name": "dandelion georgism 🔰🏗", "rt_avatar": "https://pbs.twimg.com/profile_images/1911826353155981312/4HPYZZLv_normal.jpg", "rt_id": "2117343290437837046", "likes": 36884, "retweets": 2308, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJQf96XcAA3SKg.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/WuAnsuEEmJ": ""}, "enriched": 1}, {"id": "2117816126130544722", "url": "https://x.com/NateWitkin/status/2117816126130544722", "text": "Not really clear what the Republican Party is at this point.", "created_at": "2026-11-04T03:08:06+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "conorsen", "rt_author_name": "Conor Sen", "rt_avatar": "https://pbs.twimg.com/profile_images/493422860371652608/wPvZqBSH_normal.jpeg", "rt_id": "2117796722457927681", "likes": 1166, "retweets": 47, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117804592868335872", "url": "https://x.com/NateWitkin/status/2117804592868335872", "text": "Anthropic's updated S1 reports Q3 revenue growth at 46.7%.\n\nRamp estimate based on business spend: 53.3%\n\nQ4-to-date b
