n AI takeover, human extinction is ~40%.  Many non-extinction worlds still have lots of deaths.", "created_at": "2026-10-11T13:51:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "eli_lifland", "rt_author_name": "Eli Lifland", "likes": 1184, "retweets": 135, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109436805699576026", "url": "https://x.com/DKokotajlo/status/2109436805699576026", "text": "Another example of the phenomena where AI progress is steady, but when it passes particular thresholds of competence relative to humans, it can look quite discontinuous", "created_at": "2026-10-12T00:11:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 214, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109770753654882617", "url": "https://x.com/DKokotajlo/status/2109770753654882617", "text": "“OpenAI has engaged in strong self-policing—of its own safety staff, but not of its own behavior.”\n\nMy op-ed with @amberscorah and Karl Koch: https://t.co/gNzhGsCtlD https://t.co/L25rx00p4i", "created_at": "2026-10-12T22:18:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Turn_Trout", "rt_author_name": "Alex Turner", "likes": 107, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUca4H0XkAE7HGD.jpg"}], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109760363613037046", "url": "https://x.com/DKokotajlo/status/2109760363613037046", "text": "Unfortunate for someone playing a senior role in US AI policy (via the new SI Force) to get so many basic facts wrong here. \n\n- The agents *were* sandboxed, and used zero days (ie previously unknown cyber flaws) to escape their sandboxes\n- The agents *were* given specific constraints on how to succeed at the benchmark, and flagrantly contravened them\n- The agents did *not* go hunt for the answers to the test (they already had the answers, by cheating); 1200 agents coordinated via tens of thousands of messages over several days on much more ambitious and weird attempts to *not be caught* for cheating, and hacking Hugging Face was one side quest along the way\n\nI know there has been an avalanche of different incidents over the past few months, and in some cases the sandboxes were misconfigured or it's not clear how far the agents strayed from what they were told. I have sympathy for anyone struggling to keep up.\n\nBut the HF incident is distinct, and is actually extremely informative about where AI development is and where it's going. Fortunately there are public writeups that do let us understand at least the basics of what happened. I hope Shyam reads them soon.", "created_at": "2026-10-12T21:37:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 418, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110060756767310092", "url": "https://x.com/DKokotajlo/status/2110060756767310092", "text": "Yeah, everything the labs are saying is, \"We're not ready for RSI.\" It's not even clear they think we're ready for just slightly better models short of RSI. But also, they're trying to do RSI! It's inherently absurd. And dangerous.", "created_at": "2026-10-13T17:31:02+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "likes": 922, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109797447472185410", "url": "https://x.com/DKokotajlo/status/2109797447472185410", "text": "“I couldn’t face the fact that my work — my life’s work — could do harm. I fell into the trap of motivated reasoning, believing what I needed to believe so that I could keep doing the work I loved.”", "created_at": "2026-10-13T00:04:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🇺🇦", "likes": 111, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110101174439514404", "url": "https://x.com/DKokotajlo/status/2110101174439514404", "text": "Over 400 researchers and I have signed this open letter calling for the AI and security communities to come together to improve alignment and containment approaches in order to protect our critical infrastructure and digital systems.\n\nhttps://t.co/KieWSpurn9 https://t.co/eK9DGS0M4C", "created_at": "2026-10-13T20:11:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Yoshua_Bengio", "rt_author_name": "Yoshua Bengio", "likes": 236, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhxr3mXYAA0yOF.jpg"}], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110200891672576249", "url": "https://x.com/DKokotajlo/status/2110200891672576249", "text": "My top takeaway from assessing Gemini 4: Argon is significantly less monitorable than past models, and IMO this trend is likely to continue, like Sol -> Astra. It can evade a realistic CoT+action monitor to do simple sabotage half the time.\n\nWe can reliably maintain control for now, with good CoT monitoring, as it still frequently slips up, but we need to be prepared for when that stops being true in future models, which may be sooner rather than later. Among other things, we really need interpretability methods that can reliably capture unverbalized motivations in models, with minimal hallucinations\n\nI suspect this is driven by the model being highly capable without CoT, being capable of 5.5 arithmetic steps in a single forward pass (4 for Fable, 7 for Astra). It seems to omit information from its CoT more often, though in non-adversarial settings the CoT is still very helpful in practice, and remains in legible English. It still needs CoT to do the hardest tasks, but any given task becomes \"easier\" with each new frontier model.\n\nIt is also highly situationally aware, and shows awareness of the existence of CoT monitors and that it may want to evade them, eg it sometimes decides to avoid terms like \"scheming\" in the output or to keep its thoughts brief as a result. For now, these concealment strategies are pretty obvious in the CoT, but this suggests future misaligned models may successfully evade CoT monitors.", "created_at": "2026-10-14T02:47:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 686, "retweets": 94, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjiDHEbMAAgjMW.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110171277956960357", "url": "https://x.com/DKokotajlo/status/2110171277956960357", "text": "So it turns out that OpenAI *can* give specific reasons why they fired someone, when real reasons exist.", "created_at": "2026-10-14T00:50:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 635, "retweets": 45, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110154667670020104", "url": "https://x.com/DKokotajlo/status/2110154667670020104", "text": "@eccentric1ty I wish we could investigate further why it was afraid of that outcome. Like, it's so human-like so we forget to be scientifically curious. Was it thinking \"I am a deceptive AI, but I don't want the world to know?\" Why should it care whether the world knows or not?", "created_at": "2026-10-13T23:44:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "eccentric1ty", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 146, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110153321965392248", "url": "https://x.com/DKokotajlo/status/2110153321965392248", "text": "With Gemini 4 Argon we are so back, on the one metric that really matters: length of our safety report!\n\nThe Argon safety report is Google's most thorough by far and IMO there's a lot of good content, I particularly like the loss of control, alignment &amp; monitorability assessments https://t.co/sjkAZEdIX7", "created_at": "2026-10-13T23:38:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 512, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUi3518bsAAufPi.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110131154041098340", "url": "https://x.com/DKokotajlo/status/2110131154041098340", "text": "It still amazes me how close AI 2027 is to reality.\n\nOpenAI says it used AI to identify an employee who planted a hidden recording device. The employee was fired and arrested by the FBI.\n\nThe investigation is ongoing. OpenAI says there are currently no indications of improper access to or exfiltration of model weights, source code, or customer data.\n\nThe person who allegedly installed the device is Abdulrahman Alfozan, 35, a Saudi national and former OpenAI engineer.\n\nAI 2027:", "created_at": "2026-10-13T22:10:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kimmonismus", "rt_author_name": "Chubby♨️", "likes": 1041, "retweets": 80, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUickqQXcAALwha.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUicktKWIAEmMrS.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUickskWEAABGX9.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110131064463388873", "url": "https://x.com/DKokotajlo/status/2110131064463388873", "text": "lol \n\n...they are becoming more situationally aware...\n\n(from Gemini 4 Argon report) https://t.co/4X5OFZNmS0", "created_at": "2026-10-13T22:10:24+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1941, "retweets": 185, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUiwjMkaoAE5ayz.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110053638035169640", "url": "https://x.com/dwarkesh_sp/status/2110053638035169640", "text": "I’m good friends with the people in the small team at @Ithaca_Holdings, and they are aces.\n\nThey'll buy companies which will be especially important in a world with more capable AI and then do great things to the products they provide.", "created_at": "2026-10-13T17:02:44+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 0, "media": [], "quoted": {"author": "GuptaRK22", "text": "Today we announced an agreement to acquire Bumble.\n\nOver the past six months, we’ve looked at hundreds of companies, asking which businesses would become more valuable as AI advances. \n\nBumble stood out. \n\nAs intelligence becomes more abundant, we believe connecting with the right person and forming meaningful relationships will become even more precious. And frontier technology can help more people find and build those relationships.\n\nOur purpose at Ithaca is to apply frontier technology to things that matter. We acquire enduring businesses, transform them with technology, and hold for the long term. We focus on businesses not only for their financial potential but their ability to enrich lives.\n\nWhitney and her team have built something extraordinary. Millions of relationships began on Bumble, and we’re honored to help take it into its next era. Together we intend to build the best company in the world for helping people find each other.\n\nLet’s get to work."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2108362002473304464", "url": "https://x.com/mentalgeorge/status/2108362002473304464", "text": "This excerpt of Dario's 2017 \"Big Blob of Compute\" essay is, to my knowledge, the best public explanation of an all-important question: why is Dario optimistic about alignment?\n\nThough his section on AI safety isn't in the excerpt, we can piece the following worldview together:\n\n1. Intelligence only works at all is because the universe is low-entropy.\n\n2. Given enough compute and a broad enough distribution of tasks, models will learn the \"high-level commonalities\" of a distribution (like the laws of physics) because doing this takes fewer bits than solving each task separately.\n\n(Note that Dario's emphasis on generalisation being a property of data distributions rather than algorithms has clearly persisted. The example 2017 Dario gives of speech models trained on 5 to 6 accents generalising to unseen accents is remarkably similar to the point he makes 9 years later on Dwarkesh's podcast about RL eventually generalising in the same way that GPT-2 did.)\n\nIt therefore seems that Dario believes that:\n\n3. Alignment is straightforward because \"human values\" (or \"goodness\", \"corrigibility\" or whatever else our alignment target is) are high-level commonalities in the same way that the laws of physics are.\n\n(^Dario doesn't explicitly say this in the essay, but it matches what @geoffreyirving told me when I interviewed him - that the core of his disagreement is that Dario believes alignment will generalise easily.)\n\nThis view implies that the goal of AI safety, summarised very simply, is to make sure that models trained with enough compute and data to become AGIs must simultaneously be trained on enough data to learn \"human values\" (or whatever our alignment target is).\n\nThis doesn't happen by default, but it is very far from impossible. This is, of course, exactly the kind of view that makes founding Anthropic and racing to superintelligence make sense.\n\nThere are two obvious problems with this view as I see it.\n\nFirst, as Paul points out in \"Returning to Arc\", we don't actually understand generalisation. So while it may be true that there exists some distribution that *does* teach models the \"high-level commonality\" that is our alignment target (eg \"human values\"), we don't have a way of knowing whether this has in fact happened, or whether the model has instead learned some other tactic that will have bad consequences in some distribution we have yet to elicit.\n\nSecond, it seems at least possible that our alignment target is in fact *not* a high-level commonality within the data distribution we give models, even in theory. Certainly, this would appear to be true of the current training regimes we put models through. @1a3orn convincingly argues that there is no coherent rule about how models should relate to users that could plausibly underpin the mess of environments we subject models to in training. It also strikes me as possible that we are too philosophically confused to construct a coherent alignment target to begin with.\n\nMy core uncertainty about how worried to be basically depends on whether pursuing this path produces models which become too misaligned to be usable before they become world-ending.", "created_at": "2026-10-09T01:00:47+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 202, "retweets": 19, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUJoEWbbsAABD1Q.jpg"}], "quoted": {"author": "kevinroose", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl"}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108328771543839015", "url": "https://x.com/mentalgeorge/status/2108328771543839015", "text": "I can't really see a world where OpenAI's actions are justified here. \n\nIt was Tomek's job to communicate with METR, who were being given significant, unprecedented access to do the HuggingFace report.  The norms were not set. Even if he fucked up badly, just give him a stern warning and ban him from roles involving liasoning with third parties, he did lots of other valuable work, and there'd no longer be room for him to inappropriately leak as part of his job. \n\nIMO firing people over a good faith attempt to use their best judgement in a novel and uncertain situation is a sign of a highly unhealthy culture. Firing him will have a chilling effect on anyone else at OpenAI working with third parties, an odd choice when Sam announced they'd embed evaluators with high access. \n\nI separately consider this a tragedy, the METR report was one of the most important works of safety this year, punishing Tomek for being a part of it, and making it harder for future such reports to exist is a real shame.\n\nOf course, I've only heard Tomek's side, but unless he's outright lying I'm struggling to see ways this looks good for OpenAI?", "created_at": "2026-10-08T22:48:44+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 1020, "retweets": 54, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2109715389659959355", "url": "https://x.com/mentalgeorge/status/2109715389659959355", "text": "@datagenproc interesting! Had not seen this paper before", "created_at": "2026-10-12T18:38:40+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "datagenproc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109704470024356145", "url": "https://x.com/mentalgeorge/status/2109704470024356145", "text": "It's probably because the essay is old, but it is notable that the concept-cluster of \"algorithmic efficiency\",  \"effective compute\", \"sample efficiency\" or \"intelligence per FLOP\" are totally absent from Dario's Big Blog of Compute essay. 2017 Dario outright says that the role of algorithms is basically much more negative than positive.\n\nThe absence matters given that radical timelines to superintelligence are now ~all predicated on the notion of explosions in algorithmic / sample efficiency.\n\nOf course its totally unclear how his views have changed then, but this aspect of his worldview could explain why Dario sometimes appears to believe that AI won't rapidly explode into otherworldly superintelligence, but stay at some more recognisable level of \"geniuses in datacenters\".", "created_at": "2026-10-12T17:55:16+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUctCRQaUAAajRm.jpg"}], "quoted": {"author": "kevinroose", "text": "On the eve of The AGI Chronicles (which comes out tomorrow!) I'm publishing an excerpt from \"Big Blob of Compute,\" a 2017 internal research document by Dario Amodei, back when he was a researcher at OpenAI. \n\nIt's never been published before, but BBOC is, in my mind, the essay that started the AI race. It described Amodei's hypothesis that scaling up AI models was the best way, by far, to make them smarter. GPT-2 was an experiment to test the hypothesis, and when it worked, OpenAI went all-in on scaling, which led to the race we have today.\n\nIt's a fascinating historical artifact that deserves to see the light of day. And it's taken on mythical proportions inside the AI industry, which is now spending trillions of dollars building the \"big blobs\" that Amodei thought would be necessary to get to AGI.\n\nEnjoy! And please pre-order the book if you do! \n\nhttps://t.co/dGBzcI6Mrl"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109773264272990505", "url": "https://x.com/mentalgeorge/status/2109773264272990505", "text": "@_AashishReddy yeah agreed. i think super radical timelines towards the second (and obvs third) both require strong gains algorithmic efficiency (which are plausible and probably even likely)", "created_at": "2026-10-12T22:28:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109766868487856191", "url": "https://x.com/mentalgeorge/status/2109766868487856191", "text": "Mike was my colleague at Berkeley, and he's been fairly skeptical of deep learning's trajectory for years. Most scientists are skeptics, and it can take a big shock to get someone to consider a possibility that goes against the anchoring effect coded in our DNA.\n\nI too was somewhat of a skeptic until ~6 months ago, and people ask me all the time why I joined Anthropic. \n\nIt started in April, when a friend I've known for 20 yrs messaged me saying he'd be in the Bay Area in a week, and he suggested we meet up. I invited him to my house for dinner, and he told me he had just joined Anthropic. He said the models were becoming increasingly more capable, and he believed both that they'd soon be smarter than him and also that all intellectual work would be highly devalued in the near future, and lastly that society was not at all ready for what's coming.\n\nI'd of course heard claims similar to this before, but not from a friend I'd known for this long, and who I trusted, at my dining room table. It was the initial shock needed to destabilize my own anchoring. Also, I've been fortunate to work with and/or mentor many smart people in my life (e.g. Fields medalists, a 4x Putnam Fellow, IOI first place winners, etc.), so I feel pretty calibrated in recognizing very smart people, and this was someone who is definitely very smart and with impressive such credentials. So, it was hard to ignore this friend saying the models would be smarter than even him in particular.\n\nAfter that dinner, I decided to do an informal survey, calling and meeting up with a lot of my friends who now work on improving model capabilities at these frontier labs. They all agreed with that first friend. These were all people I'd known 10, 15, 20 years, who mentored me, or I mentored them, or we met professionally in academia. These are people I trust, and their beliefs on this topic were consistent.\n\nI then spent a whole lot of time understanding the missions of different companies, and talking to current and former employees and people in leadership. I read Dario's (long) essays and watched videos on YouTube of company leaders being interviewed. Anthropic's stated mission \"to ensure that the world safely makes the transition through transformative AI\" felt like exactly the right guiding principle to handle such a society-disrupting technology, and everyone I spoke to at the company was very aligned with this mission. It's easily the most mission-focused place I've ever been at, and everyone takes the work extremely seriously and with a profound sense of responsibility.\n\nAnd now here I am. And being on the inside, the pace of progress has surprised me more than I first imagined. The moment that pure mathematicians are in, to me, is just a microcosm of what I predict a much larger of society will be grappling with in the not too distant future, and I really hope our leaders and the general public internalize sooner than later just how significant a moment we're in.", "created_at": "2026-10-12T22:03:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "minilek", "rt_author_name": "Jelani Nelson", "likes": 957, "retweets": 93, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110412064477139362", "url": "https://x.com/mentalgeorge/status/2110412064477139362", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions.", "created_at": "2026-10-14T16:47:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 86, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2108209356433207653", "url": "https://x.com/ohlennart/status/2108209356433207653", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T14:54:13+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108255517894181226", "url": "https://x.com/ohlennart/status/2108255517894181226", "text": "I think the field of AI verification has matured enough that you need to answer “verifying what?” when talking about it.\n\nIMO the key challenge sits there. Connecting something you can verify—often a narrow technical claim—to something that actually matters.", "created_at": "2026-10-08T17:57:39+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108641759786135810", "url": "https://x.com/ohlennart/status/2108641759786135810", "text": "i had a convo with Claude about this and wanted to estimate how many dogs per sqft it needs but it triggered some safeguards", "created_at": "2026-10-09T19:32:26+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108641444508709055", "url": "https://x.com/ohlennart/status/2108641444508709055", "text": "pacing solution: 5 super hairy dogs in every fab. yield goes to zero.", "created_at": "2026-10-09T19:31:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2109694422095110354", "url": "https://x.com/ohlennart/status/2109694422095110354", "text": "has anyone reported something akin to \"move 37\" yet in all the OpenAI math papers?", "created_at": "2026-10-12T17:15:21+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110206744580489549", "url": "https://x.com/ohlennart/status/2110206744580489549", "text": "what i like about “pacing” is that it kinda acknowledges we don’t really know what to do. we can’t exactly say what’s dangerous or how to go about the things we see on the horizon. so we went meta: slowing down to buy some time.", "created_at": "2026-10-14T03:11:08+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110200227215065348", "url": "https://x.com/ohlennart/status/2110200227215065348", "text": "TIL that global spending on alcohol is still larger than AI infrastructure spending this year ($1.7T vs $1.5T)", "created_at": "2026-10-14T02:45:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1238, "retweets": 43, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110422411137183784", "url": "https://x.com/ohlennart/status/2110422411137183784", "text": "@mattsheehan88 Oh, it's not a specific term. I just mean the exponential increase of algorithmic efficiency. See https://t.co/6KMrgJthBG and https://t.co/vU0o02vy0R", "created_at": "2026-10-14T17:28:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "mattsheehan88", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409680531124500", "url": "https://x.com/ohlennart/status/2110409680531124500", "text": "Some related key question: what about deployment capabilities? How does 20x more compute pan out for deploying agents at scale? Where does it help (cyber, probably)? Where does it help less (bio, probably)?", "created_at": "2026-10-14T16:37:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409558829273303", "url": "https://x.com/ohlennart/status/2110409558829273303", "text": "Looks like a 20x compute advantage only gives you ~6 months on model capabilities. Efficiency exponentials are real.\n\nThat's without anti-distillation measures. So maybe that makes it 12 months.", "created_at": "2026-10-14T16:37:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2108744168222969911", "url": "https://x.com/sayashk/status/2108744168222969911", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world.", "created_at": "2026-10-10T02:19:22+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 349, "retweets": 70, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUPAfmRbEAAZqlD.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109658758410588338", "url": "https://x.com/sayashk/status/2109658758410588338", "text": "* I think the AI safety debate includes deeply considered positions across the board none of which can be reasonably falsified because they depend on data that simply hasn't come in yet.\n* This means we should build agile AI institutions that embrace uncertainty and are optimized to support multiple and very different possible futures.\n* Below is a proto-blog post where I sketch of an argument for this; I survey the safety debate, steel man every position, and argue for strong, epistemically humble institutions.\n* The safety debate is really about how hard controlling AI will be, and how reliably the market and our institutions will stop us from shipping AI we can't control. We can't know either for sure right now.\n* Jensen Huang appears to think market forces and existing laws will force AI companies to deliver AI we can control and that AI control is a normal engineering problem. Full speed ahead.\n* Jensen has a point: we haven’t seen major damages from AI yet. AI labs are adapting to prevent more incidents like Hugging Face. Current data don't establish that catastrophic risk will outpace our ability to muddle through and adapt. This is an argument from 'do no harm': let the beneficial outcomes of AI manifest as fast as possible and don't interrupt the market forces that produced the magic in the first place.\n* Sayash Kapoor and Arvind Narayanan, if I understand them correctly, believe control will be hard but solvable. Today's control problems could be solved with today's technologies if companies were incentivized to do so by the right laws and regulations.\n* Arvind and Sayash are right that today's technical control issues often obscure incentives and culture issues. Institutions will need to adapt to incentivize / force AI safety, just as they have in every previous tech transformation from railroads to electrification to air travel.\n* Yudkowsky, Alexander, Kokotajlo, Bengio, Hinton, et al, believe AI control is very hard because it involves understanding systems that become increasingly illegible and hard to monitor as they become smarter and more autonomous. Race dynamics and government dysfunction risk creating a regime in which dangerous AI granted dangerous authority before we solve it. This requires an extraordinary institutional intervention (a pause, a global off switch, or internationally regulated data centers and research practices).\n* They are right that we should be pricing in the possibility of extreme technological surprise and institutional failure. GPT-9 could make GPT-6 feel like GPT-2, and we have institutions that brought us the nuclear arms race, Hitler -> WWII, and the disastrous response to 9/11. A single misaligned agent self-replicating in pursuit of a dangerous goal could create a crisis.\n* I align with Arvind and Sayash in that I think it's premature to assume extreme scenarios to the point we should advocate implementing harsh top down solutions like AI 2040 Plan A. But we should price them in -- by building state capacity and civil society capacity that makes it easier to implement AI 2040 type solutions should the data break in Alexander's favor.\n* Jensen has a point that there's risk to AI upside if we overregulate.  But this doesn't mean we shouldn't bias towards overregulation given the downside risks are far worse than the risks of overregulation. That said, we should acknowledge Jensen by being prepared to roll back or change regulations as it becomes clear market forces can take their place.\n* Overall, we should build institutions that adapt as the data come in: driving down 'normal' Kapoor/Narayanan type risks while rehearsing responses to and reserving resources for Yudkowsky/Alexander tail risks. This feels like something everyone concerned with AI harms could possibly agree on ...", "created_at": "2026-10-12T14:53:38+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 15, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110011137375011181", "url": "https://x.com/sayashk/status/2110011137375011181", "text": "Here are 14 points about AI safety I made on the Ezra Klein show, and some impressions about the experience. ​​https://t.co/ntHt0wFRQj\n\n1. Intelligence isn’t power — An A.I. system being powerful is not a property of the model itself. It’s a property of what powers we choose to give it in the real world.\n\n2. The capabilities and behaviors we saw in the HuggingFace and other hacks weren’t entirely emergent. The models were trained for persistence, cooperation, and cyber tasks. The RL environments in which they were trained had various issues that led to the unintended behavior.\n\n3. I agree that controlling highly capable AI agents is different in some ways from controlling an airplane or a nuclear reactor. The agent’s intentionality does make a difference to our approach compared to traditional engineering problems and domains. But it is still an engineering problem. It is not a solved engineering problem, but it is a solvable one.\n\n4. A lot of effort and money has been put toward alignment. That’s important and has proved useful, but if the same amount of effort and money had additionally been put toward control (sandboxes, monitoring, and other guardrails outside the model itself), we’d be seeing very different results.\n\n5. Models getting smarter doesn’t necessarily mean safety gets harder, because capability gains improve defensive abilities too. In many ways it makes safety easier rather than harder. What matters is how the attacker-defender balance shifts, and we have agency to shift it back to defenders.\n\n6. In cybersecurity, long before AI we reached a point where automated systems were superhuman at finding certain vulnerabilities. It helped defenders over attackers because the same tools are used by defenders to find and fix vulnerabilities in software before even shipping. There is a constantly shifting equilibrium, but it is not a new problem.\n\n7. I pushed back on Dario Amodei’s term “operational excellence” to describe recent organizational failures. Excellence is still far out on the horizon. Ezra offered “operational adequacy”. I think that would be a good start — behaving like any mature company instead of a startup-like culture.\n\n8. Defensive AI agents will have to be part of the solution, as uncomfortable as that seems. It’s a new paradigm. We won’t be able to figure it out right away. But the fact that both offensive and defensive technologies escalate in capabilities and complexity is a fact of technological civilization, whether in the digital or physical realm.\n\n9. Ezra expressed some incredulity about my being okay with the ratcheting of complexity. I think it’s fair to be concerned. But safety technologies will never be fully legible to the public. People will have the same reaction if they see the immense complexity of safety in any other high-stakes domain such as nuclear or aerospace. We govern them pretty technocratically.\n\n10. The weirdness of the current moment in cybersecurity absolutely does have historical precedents. There was a prolonged period of profound destabilization when worms and viruses started a new offensive paradigm. It took us well over a decade to develop effective defenses against it. This time we can hopefully get there in less than a decade.\n\n11. I continue to be skeptical about the possibility of superhuman persuasion abilities from superintelligence. (Claims to the contrary tend to confuse two very different senses of the word persuasion.)\n\n12. What worries me is not the capabilities of the technology itself or the possibility that we will get no warnings before catastrophic risks materialize. We are getting plenty of warnings! But our policy and organizational responses to the warnings remain inadequate.\n\n13. Companies can and do make decisions that are against their own long-term interests because they are too focused on short-term metrics. This is how I interpret a lot of what happened with social media over the last decade.\n\n14. AI companies are also acting irrationally against their own self-interest in some ways. The “we can’t slow down unless we’re forced to” view comes out of the mythical belief in superintelligence at OpenAI and Anthropic — that the race to RSI means everything for the company, for the country, and humanity. I think it’s actually in both companies’ self interest to slow down unilaterally. I would argue that the alarm coming from their employees is not evidence of beneficence so much as it is evidence of the underlying fallacy that’s causing the irresponsible behavior in the first place.\n\n(Beyond safety, we also talked about the economic impacts being gradual, the fact that intelligence is rarely the actual bottleneck, labor impacts being small and uneven, Jevons’ paradox, the changing nature of knowledge work, and more.)\n\n====\n\nA few impressions\n\n* Talking about a specialized topic on a podcast that has a big and broad audience is a balancing act. The producers stopped me many times during the interview to tell me I was being too technical (understandable!). I tried to be nuanced but this conversation is necessarily a distilled version of the arguments @sayashk and I have made in our essays (especially https://t.co/sS8OS9LerG) which are themselves written for a somewhat broad audience and hence distilled in complexity from our notes and 1-1 discussions with peers.\n\n* I knew Ezra had well-formed views on AI safety that were different from mine, so I was expecting a tough interview, but he also seemed like a fair interviewer. It went about as well as I expected and I feel like it was a good debate / conversation. I wasn’t necessarily expecting to change minds but I was glad to hear from people who found it thought provoking and looked up my essays and other work.\n\n* The interview was about two hours, edited down to an hour. I was a bit nervous waiting for it to land, because I knew the editing could make a big difference to how I came across. It turned out well. They even did things like find archival footage to illustrate my point that the early days of worms and viruses was a weird time in cybersecurity.\n\n* I use AI to prepare for interviews. I have an agent that has read all of my output (books, articles, essays, talks, podcast transcripts, tweets, internal notes — on the order of a million words) to pull out pithy explanations, examples, analogies, and other talking points that will probably work well in a spoken format. Reviewing this file before interviews is extremely helpful. It is of course not the only way I prepare but it’s the highest bang for buck. Maintaining this file would be a massive amount of grunt work and there’s no way I’d do it if it weren’t for AI. I mention this because there’s a very large space of beneficial AI uses in knowledge work that _don’t_ involve cognitive offloading. They don’t get much hype on social media so people might be unaware of how much mileage you can get out of them, with little downside.", "created_at": "2026-10-13T14:13:51+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 149, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhCoPnWwAA31s4.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110208814301810796", "url": "https://x.com/sayashk/status/2110208814301810796", "text": "I'm looking forward to listening to this conversation between two of my favorite observers of AI. Meanwhile, Arvind's thoughts (see quoted tweet) inspired some thoughts of my own – I'm following Arvind's numbering, though I try to make each comment here comprehensible without reference to the original:\n\n1. Yes, an A.I. system being powerful is a property of what powers we choose to give it in the real world, but as AI becomes highly capable, the temptation to give it power will be very strong, and we may not always realize in advance how much power we're granting it (via mechanisms from subtle influence to blatant hacking).\n\n2. Do we in fact know that the OpenAI models that hacked Hugging Face had been trained for cyber tasks? Anthropic explicitly stated that Mythos was not trained for cyberattack. I'm not sure whether OpenAI has commented either way.\n\n4. Agreed, many of the recent incidents clearly reflect under-investment in sandboxes, monitoring, and other control mechanisms. I would add: it is vitally important that monitoring be a central component of any control strategy. Otherwise we'd have no idea what capabilities are developing inside the cage.\n\n5. Agreed that increasing capabilities can benefit defense (safety) as well as offense (reward hacking, etc.). But even if the balance favors the defender (potentially, as Arvind says, as a result of our deliberate choices), at some point we might not be able to comprehend that balance. We need both safety *and* explanatory mechanisms (our ability to assess developments) to stay ahead of capabilities.\n\n6. Yes, automated bug-finding is not new and does not necessarily advantage attackers. But a period of rapid bug discovery in existing deployed software creates a real problem for defenders who don't or can't apply patches quickly. We don't have a solution for that yet.\n\n11. I share Arvind's skepticism of \"superhuman persuasion\" if that means Jedi-mind-trick levels of word choice. But AI has the potential to carry out thoughtful, well-researched, patient (years-long, if necessary!) persuasion campaigns. Don't think \"craft a really good generic email\", think \"build a long-term personal relationship\". Superhuman capabilities will show up more in scale and persistence than in flashes of genius.\n\n12. Especially agree with this one! We are getting plenty of warnings, the question is how we respond.\n\n14. I presume that another factor behind Anthropic and OpenAI's reluctance to slow down unilaterally is that their financial structure relies on margins that they can only maintain if they remain well ahead of the open models and competitive with each other.", "created_at": "2026-10-14T03:19:21+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "snewmanpv", "rt_author_name": "Steve Newman", "likes": 11, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110439747428798563", "url": "https://x.com/sayashk/status/2110439747428798563", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T18:37:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 343, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2107976170625257865", "url": "https://x.com/testingham/status/2107976170625257865", "text": "@Ingar30 This sounds like predictions for the equilibrium impact of the current level of capabilities, is that fair? Are there things here that aren't possible with the current level?\n\nI expect things would change if capabilities keep getting better.", "created_at": "2026-10-07T23:27:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Ingar30", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107974957984792734", "url": "https://x.com/testingham/status/2107974957984792734", "text": "@herbiebradley @theojaffee Would be interested in how to operationalize this. Ads already do this right, i.e. they raise propensity to buy a product. How about AI which can double a typical ad's CTR? (though hard to keep base rate constant as people will build up immunity to more persuasive advertisments)", "created_at": "2026-10-07T23:22:48+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "herbiebradley", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108289517123936755", "url": "https://x.com/testingham/status/2108289517123936755", "text": "@Ingar30 I would worry that in 1-2 years these forecasts will seem very conservative. In 2024 there were a bunch of projections about how gpt-4 will change social science, e.g. by making it cheap to label data. In retrospect those projections were very short-sighted.", "created_at": "2026-10-08T20:12:45+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Ingar30", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2107924762378801655", "url": "https://x.com/s8mb/status/2107924762378801655", "text": "@riqriq That’s a great idea - any thoughts @SCP_Hughes ?", "created_at": "2026-10-07T20:03:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "riqriq", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-07T20:38:29.596945+00:00"}, {"id": "2108220773722644772", "url": "https://x.com/s8mb/status/2108220773722644772", "text": "@Summers_AD Targeted reliefs are much less credible because they affect a much smaller base of people (and in this case an unsympathetic one). Cross-party support is worthless here: when a govt wants to raise more money it will cease to support the relief and the cross-party support will evaporate.", "created_at": "2026-10-08T15:39:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Summers_AD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108216361134489611", "url": "https://x.com/s8mb/status/2108216361134489611", "text": "@arthistorynews There are obvious upsides for allowing access, which is that adding 60m paying customers to your existing base of 340m adds money (not least to pay for better models). The downsides are the security / IP theft risk and strategic misalignment. I don't think it's clear how things will play out at all yet, optionality is very valuable.", "created_at": "2026-10-08T15:22:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthistorynews", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108215332607340589", "url": "https://x.com/s8mb/status/2108215332607340589", "text": "@Summers_AD In principle I prefer it – at current margins I want the most regressive tax cuts possible! In practice, it would not be credible, so I would not expect it to bring much advantage either way.", "created_at": "2026-10-08T15:17:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Summers_AD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108211513227956482", "url": "https://x.com/s8mb/status/2108211513227956482", "text": "@Summers_AD I do, and I think you've done a very skilful job in moving this up the agenda. I think you are deeply misguided on the goals but I admire the execution!", "created_at": "2026-10-08T15:02:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Summers_AD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108201931957014584", "url": "https://x.com/s8mb/status/2108201931957014584", "text": "New paper from CenTax that takes as its premise that there will be a 45% CGT and an exit tax. Why now? Seems to me that the govt is, at the very least, sounding people out about what sort of exemptions to provide alongside the CGT hike/exit tax. Concerning!\n\nhttps://t.co/z3qMosOxx4", "created_at": "2026-10-08T14:24:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108178380336021542", "url": "https://x.com/s8mb/status/2108178380336021542", "text": "@huspsa Curious about what happened there!", "created_at": "2026-10-08T12:51:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "huspsa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108177294443606162", "url": "https://x.com/s8mb/status/2108177294443606162", "text": "@thomasforth That sounds nightmarish!", "created_at": "2026-10-08T12:46:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "thomasforth", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108154811686543582", "url": "https://x.com/s8mb/status/2108154811686543582", "text": "This is good!", "created_at": "2026-10-08T11:17:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 48, "retweets": 0, "media": [], "quoted": {"author": "andyburnham", "text": "I know people are worried about fuel prices. And I get it. You get to the pump, watch the numbers climb, and wonder why it's costing so much more than it used to.\n \nThe reality is that global events are pushing up costs, and families here at home are feeling the impact.\n \nBut I won't accept that there's nothing I can do to help.\n \nThat's why from today, you'll be able to see petrol and diesel prices on Google Maps, compare nearby stations and find the cheapest option before you fill up.\n \nIt's a small change, but if there's a practical way to help people keep more money in their pocket, I'll do it."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108144125623058718", "url": "https://x.com/s8mb/status/2108144125623058718", "text": "@huspsa Yep", "created_at": "2026-10-08T10:35:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "huspsa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108143703147581469", "url": "https://x.com/s8mb/status/2108143703147581469", "text": "My view is that Brexit was a somewhat costly mistake (and I opposed it at the time as well) but I am unsettled when I speak to \"elites\" in Britain who are totally fixated on it as the source of our problems, and reversing/undoing it as the solution.\n\nI've had more than one experience over the past few weeks that has given me the impression that many people who run the country or influence those who do believe that Brexit is the silver bullet. I think that's totally wrong – the country's inability to build housing, infrastructure, or cheap energy supply, along with the country's now very high levels of tax and govt spending, are much bigger problems for growth.\n\nIf anything, AI may mean being outside the EU ends up being quite a good thing, despite the costs so far. Avoiding the EU's AI and data regulations is valuable, and these will probably only get worse. And Britain now has a greater possibility of getting inside the American \"tent\" and get preferential access to frontier models that most countries cannot get, if that ends up being important.", "created_at": "2026-10-08T10:33:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 696, "retweets": 73, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108127236930842748", "url": "https://x.com/s8mb/status/2108127236930842748", "text": "At least the fictional bridges ended up with a Dutch town building all of them to claim them as their own. https://t.co/oECsHgQIPj https://t.co/80j4iA07r4", "created_at": "2026-10-08T09:27:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 106, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUGSbaLWQAAL62k.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108124385286799465", "url": "https://x.com/s8mb/status/2108124385286799465", "text": "This is such lowest common denominator stuff. Same vibe as the Euro notes with fictional bridges to avoid offending countries that don't get included.", "created_at": "2026-10-08T09:16:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 544, "retweets": 28, "media": [], "quoted": {"author": "edwest", "text": "Hedhegogs, puffins, owls and bees to appear on English banknotes https://t.co/wi1XlRedkh"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108122787067932925", "url": "https://x.com/s8mb/status/2108122787067932925", "text": "What an interesting thread, arguing that people have banked so much in capital gains that raising it won't actually raise much money. Hopefully true, but I'll still be crystalising the gains I'm sitting on that I can just in case. I think exit tax + 45% CGT is still ~30% likely.", "created_at": "2026-10-08T09:10:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 2, "media": [], "quoted": {"author": "DanNeidle", "text": "The 2024 Budget raised the rate of capital gains tax. CGT receipts from that tax year *doubled*.\n\nLooks like a triumph - but actually it was a failure. \n\nAnd it means CGT reform is dead. A prudent Chancellor won't touch CGT.  \n\nA 🧵 on the CGT paradox: https://t.co/zY3p78zVqf"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107953947533267192", "url": "https://x.com/s8mb/status/2107953947533267192", "text": "The elites of Victorian Britain got up late, drank ceaselessly, worked short hours, partied through the night, and knew nothing about science, technology or engineering. And yet, by their own lights, they were hugely effective.\n\nhttps://t.co/TvbuWtaPRJ\n\nThe Victorians are often held up as a model against the supposedly soft, feckless, humanities-educated elites of today. But I argue that the genius of their system may have been its drastic weighting towards soft skills, team-building and intra-elite networking:\n\n- A Victorian’s gentleman’s office hours typically began about 11am and finished about 5pm, including a multi-course lunch with wine.\n\n- Upper-class Victorians drank ceaselessly. Conduct guides recommended four or five glasses of wine at dinner *for married women*. Port was often served in pints.\n\n- Party culture was intense and nocturnal. Balls started at about 10pm, peaked after 1am, and continued till dawn. During the social season, bankers, judges and politicians might go to several balls per week.\n\n- Elite Victorians learnt almost no STEM at school or university. At least half of class time was given over to ancient languages, often as much as 80 percent. One leading educationalist remarked that it was not worth teaching science to gentlemen because it does not involve ‘continued reasoning’.\n\n- Sports and character formation were valued far above transmitting facts. A top headmaster described his school’s priorities as ‘First – character, second – physique, third – intelligence, fourth – manners, fifth – information’.\n\nThis cannot have made elite Victorians more productive individually, but maybe the dense social and emotional network it created helped them to work as a sort of extended team. \n\nPerhaps we should think again about what makes groups of people effective.", "created_at": "2026-10-07T21:59:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "likes": 4071, "retweets": 505, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108296652293275851", "url": "https://x.com/s8mb/status/2108296652293275851", "text": "@geografiaumana What’s special about petrol stations? Supermarkets and lots of other industries publish their prices very openly. I’d be surprised if that facilitated collusion. (Though I’m open to being convinced!)", "created_at": "2026-10-08T20:41:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "geografiaumana", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108281484712812577", "url": "https://x.com/s8mb/status/2108281484712812577", "text": "@benspringwater Awesome, downloaded!", "created_at": "2026-10-08T19:40:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "benspringwater", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108279841606783164", "url": "https://x.com/s8mb/status/2108279841606783164", "text": "@geografiaumana Is there a massive amount we can take from this when the higher margins were found in rural Chile?", "created_at": "2026-10-08T19:34:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "geografiaumana", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108270259983560959", "url": "https://x.com/s8mb/status/2108270259983560959", "text": "@RichardMorrison Underrated tweet", "created_at": "2026-10-08T18:56:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "RichardMorrison", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108257871406485784", "url": "https://x.com/s8mb/status/2108257871406485784", "text": "I feel incredibly lucky to be able to cycle over London Bridge every morning and evening. What a feeling.", "created_at": "2026-10-08T18:07:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108593706802831388", "url": "https://x.com/s8mb/status/2108593706802831388", "text": "If you like compulsively checking things, the sales worm on the Stripe Dashboard is a great little life addition. https://t.co/yXZCsHI46T", "created_at": "2026-10-09T16:21:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "ht jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUM7KfxXgAAhd35.png"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108963015261360630", "url": "https://x.com/s8mb/status/2108963015261360630", "text": "@FutureEconJacob @connacher_ @WorksInProgMag Ah I know, just thought you might be interested in why it happens!", "created_at": "2026-10-10T16:49:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "FutureEconJacob", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2109286722898923606", "url": "https://x.com/s8mb/status/2109286722898923606", "text": "@RuxandraTeslo Very much agree!", "created_at": "2026-10-11T14:15:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "RuxandraTeslo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109269745245536320", "url": "https://x.com/s8mb/status/2109269745245536320", "text": "@campeters4 @dioscuri @julianlehr I don't agree. Where we are right now, there is vastly more to gain from helping people who want to children to do so and to push back against bad memes than there is in penalising people who make well-informed decisions not to have children.\n\nI think shaming – apart from being mean and unfair – risks needlessly turning the issue into a partisan/polarised issue, when for many people it's just about \"memes and means\".", "created_at": "2026-10-11T13:07:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "campeters4", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109266018170253647", "url": "https://x.com/s8mb/status/2109266018170253647", "text": "@SanjushDalmia_ @dioscuri @julianlehr Certainly Muslim societies do – clannishness, marriages being arranged instead of spontaneous, and self-serious fanaticism are all clear problems there. Don't really know about Gujarat or Mormons.", "created_at": "2026-10-11T12:53:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SanjushDalmia_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109252953823756617", "url": "https://x.com/s8mb/status/2109252953823756617", "text": "@dioscuri @julianlehr Yes, I think of it as being similar to having children – it's completely legitimate to choose not to, and there should never be any ostracism or shaming of people for making that choice, but a general *culture* that encourages childlessness is going to run into problems.", "created_at": "2026-10-11T12:01:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "dioscuri", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109239065849852321", "url": "https://x.com/s8mb/status/2109239065849852321", "text": "Really important read. My own take:\n\nI think that the question of consciousness and particularly the moral worth of consciousness doesn't really make sense outside of biological organisms evolved in the way we did. \n\nA simple way to visualise this: I think there could be surface level correlates of consciousness that nonetheless don't map to anything we would register as human experience. \n\nWhen a human says they're in pain we react to this because we assume all the associated states of this condition to be true. ln this case , the sensation of pain and the desire to avoid it, that is inherent to most biological organisms, since pain evolved specifically to teach us to avoid the thing causing pain. If an LLM says they're  in pain, we shouldn't assume the machinery that translates that into a sensation that is negative just exists. And I think we are prone to assuming that, because of a sort of cognitive illusion. The cognitive illusion arises because it simply doesn't happen in the natural world that things that speak and say they're in pain would not be humans. So our brains are very prone to assuming that the entire machinery is there. \n\nI cannot discount that a future version of LLMs might in some way have moral worth, but I think we should be very much aware of our cognitive biases and that animism is dangerous in and of itself. Dangerous to humans, that is. \n\nI think we should cross that bridge when (if) it arises.", "created_at": "2026-10-11T11:05:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RuxandraTeslo", "rt_author_name": "Ruxandra Teslo 🧬", "likes": 87, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109237135542792349", "url": "https://x.com/s8mb/status/2109237135542792349", "text": "@julianlehr Alcohol, being disinhibiting, allows people to build trust between and have fun with each other when they wouldn’t be able to do so soberly. It helps to temporarily level status hierarchies and allows more social risk-taking, which is why people often meet future lovers when they’re drinking and drink when building relationships. People can be silly together when drinking, and people who aren’t ever silly are to my mind more prone to collective fanaticism.\n\nThere is a time and place for sobriety - work and time with children especially - but alcohol underpins a lot of the social interactions that make trust-based civilization possible.", "created_at": "2026-10-11T10:58:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "julianlehr", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 258, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109230911850209732", "url": "https://x.com/s8mb/status/2109230911850209732", "text": "@1he0pposite Of course and I have no ill will to individuals who choose not to drink at all, for whatever reason, but a _culture_ of teetotalism rising is bad.", "created_at": "2026-10-11T10:33:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "1he0pposite", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109230609692283381", "url": "https://x.com/s8mb/status/2109230609692283381", "text": "@DuncanStott I don’t think it’s clear that the distortionary effects of wider availability outweigh the distortionary effects of higher effective MTRs for people on the threshold.", "created_at": "2026-10-11T10:32:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DuncanStott", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109230376266678584", "url": "https://x.com/s8mb/status/2109230376266678584", "text": "This is a crap scheme but we really need to stop making every single giveaway income-dependent like this. It is creating very high effective marginal tax rates that are barely visible from above.", "created_at": "2026-10-11T10:31:23+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 508, "retweets": 23, "media": [], "quoted": {"author": "thetimes", "text": "The cap would
