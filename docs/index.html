author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2107988277282418862", "url": "https://x.com/nabeelqu/status/2107988277282418862", "text": "@moultano Do I need to read this finally", "created_at": "2026-10-08T00:15:44+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "moultano", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108312270140748042", "url": "https://x.com/nabeelqu/status/2108312270140748042", "text": "I was in Birmingham last week. I tried to explore the city the best I could. Here are my ten reflections:\n\nhttps://t.co/Eg4AulVVPA https://t.co/qXmzNZYduE", "created_at": "2026-10-08T21:43:10+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jujulemons", "rt_author_name": "Julia Willemyns", "likes": 280, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIUKFRbAAAHPdq.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108639450653671698", "url": "https://x.com/nabeelqu/status/2108639450653671698", "text": "WE ARE UP!!!\n\nCameron Winter is a special artist. Trust me and listen.\n\nI went to this show and also saw the premiere of the concert movie last week, directed and shot by Paul Thomas Anderson and Benny Safdie (my life is really great). Trust me.\n\nhttps://t.co/mBOwqDIlm7", "created_at": "2026-10-09T19:23:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jacksondahl", "rt_author_name": "Jackson Dahl", "likes": 54, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108624382998523939", "url": "https://x.com/nabeelqu/status/2108624382998523939", "text": "https://t.co/WY77CAmzYh", "created_at": "2026-10-09T18:23:23+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "michael_nielsen", "rt_author_name": "Michael Nielsen", "likes": 46, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUNA2wwbUAQq0B3.jpg"}], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108669835320152519", "url": "https://x.com/nabeelqu/status/2108669835320152519", "text": "Nick Bostrom argues humans may be as incapable of imagining AI’s upside as apes are of imagining human life:\n\n\"It looks like there's a gradient in the world in terms of AI sentiment, where the US is kind of on the negative extreme of that. People in China, for example, are much more excited about this.\"\n\n\"A large chunk of the potential upside is more of the way of unlocking new ways to be human, new possible modes of being.\"\n\n\"Imagine some great ape ancestors of Homo sapiens deliberating whether they should continue to evolve and one day become human. They would realize some of the benefits, like, 'We could have unlimited bananas.' And that's true.\"\n\n\"But it would miss out on most of what's good about being human. Great literature and art and humor and politics and spirituality.\"\n\n\"It would be presumptuous for us to think that now we have achieved the level of enlightenment where all possible values are transparent to us. Think of a big cathedral of possible modes of being. We have basically explored the janitor's closet.\"", "created_at": "2026-10-09T21:24:00+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 485, "retweets": 71, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108320534207610880/img/ZtqRwCuxIdaTCPYP.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2110108402248769873", "url": "https://x.com/nabeelqu/status/2110108402248769873", "text": "Worth rereading Leopold's essay on this. https://t.co/wcYtfmVdLh https://t.co/3S2VXiI8SC", "created_at": "2026-10-13T20:40:21+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUibvtXWMAAmgjQ.jpg"}], "quoted": {"author": "OpenAINewsroom", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats."}, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110444599244099792", "url": "https://x.com/nabeelqu/status/2110444599244099792", "text": "Standard European diplomat behavior https://t.co/nsfTyEKLzk", "created_at": "2026-10-14T18:56:17+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUnOAr9XQAA9HgE.jpg"}], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2108283472838299981", "url": "https://x.com/theobearman/status/2108283472838299981", "text": "Effective November 12th, 2026, abusive behavior towards Claude will be a violation of Anthropic's Usage Policy. https://t.co/krg4VpSnUq", "created_at": "2026-10-08T19:48:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 7950, "retweets": 578, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUH9erFa8AANZwY.jpg"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108283346149077078", "url": "https://x.com/theobearman/status/2108283346149077078", "text": "Last week some of South Korea's biggest banks were hit by a cyberattack. Thanks to a report from CrowdStrike tonight, we now know the entire hack may have been done by a single person. He used a combined stack of an open-source AI penetration tool named ARTEX, DeepSeek v4.1-Flash, GLM-5.3, Grok 4.6, and Claude Code.", "created_at": "2026-10-08T19:48:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 4067, "retweets": 479, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUGBr7_bUAA2Egr.jpg"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108283275727052953", "url": "https://x.com/theobearman/status/2108283275727052953", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below.", "created_at": "2026-10-08T19:47:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 1454, "retweets": 247, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108283259411206283", "url": "https://x.com/theobearman/status/2108283259411206283", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T19:47:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1892, "retweets": 284, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108600822393110709", "url": "https://x.com/theobearman/status/2108600822393110709", "text": "1/. Ahead of @CommonsBTC hearings on AI Safety I’m publishing letters back from @OpenAI @Meta &amp; @AnthropicAI In response to our background questions https://t.co/bsdT2y6PuZ", "created_at": "2026-10-09T16:49:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "liambyrnemp", "rt_author_name": "Liam Byrne MP", "likes": 4, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMs-1qXsAAUw5s.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUMs-1fW8AA-pcn.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUMs-1gXoAAlRB1.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108575435084976259", "url": "https://x.com/theobearman/status/2108575435084976259", "text": "Scoop: Top executives at Anthropic, OpenAI and other AI companies are privately gaming out scenarios for a public and political revolt after a catastrophic AI event…They assume one in ‘27…\n https://t.co/Jro9TigbgH", "created_at": "2026-10-09T15:08:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JimVandeHei", "rt_author_name": "Jim VandeHei", "likes": 1236, "retweets": 387, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108459017362108661", "url": "https://x.com/theobearman/status/2108459017362108661", "text": "A new architecture for GPT-6.1 Sol?\n\nOpenAI halved its cached-input price compared with GPT-6 Sol. Our measurements show it also handles long prompts faster. https://t.co/Qgu5td8fYc", "created_at": "2026-10-09T07:26:17+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 318, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUI1VB-bIAAH7tZ.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108458539450871971", "url": "https://x.com/theobearman/status/2108458539450871971", "text": "Through The Mission (launching today), we'll release research, tools, and resources to help secure the world.\n\nTwo programs: 1/ OSS Scanner, inspired by OSS Fuzz, for maintainers to receive more bug reports/pocs/fixes faster and 2/ the Critical Infrastructure Defense Program, where we will work with critical infrastructure providers to figure out what works then scale them up. Backed by our own research and engineers.\n\nThink of the Mission as the ~complement to our model access. We recently expanded cyber access this wk via our new CVP. But we need to make it really easy to find & fix everything, but also rewrite software/systems, especially for critical infrastructure.\n\nOur sense is we've got a ~few years to transform security. That's going to take require a fast feedback loop that brings AGI cybersecurity research into the world. We've built a very cool team, led by @benhawkes, and then we'll scale our work as we learn what works.", "created_at": "2026-10-09T07:24:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "logangraham", "rt_author_name": "Logan Graham", "likes": 176, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2109011469538836658", "url": "https://x.com/theobearman/status/2109011469538836658", "text": "Exclusive: Anthropic breaches spark White House AI reporting mandate https://t.co/ExLixTIbhK", "created_at": "2026-10-10T20:01:32+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "axios", "rt_author_name": "Axios", "likes": 65, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109010028799910182", "url": "https://x.com/theobearman/status/2109010028799910182", "text": "Some info on how we’ve been working towards safety cases at OpenAI\n\nNote that until there is a safety “brief” for it, any type of frontier workload cannot start – this has real teeth, and has already been a good motivating force for a lot of safety work https://t.co/nKMDlHh4gF", "created_at": "2026-10-10T19:55:49+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MicahCarroll", "rt_author_name": "Micah Carroll", "likes": 206, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUPGyrubkAAqXoD.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109008945679679947", "url": "https://x.com/theobearman/status/2109008945679679947", "text": "Super Intelligence must be contained... Today, this is an engineering and governance challenge. And it isn't new. We've done it with planes, cars, nuclear materials, food safety, medicines... and everything else. Let's get to work!", "created_at": "2026-10-10T19:51:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "likes": 1035, "retweets": 113, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109607686052762044", "url": "https://x.com/theobearman/status/2109607686052762044", "text": "\"It needs expertise that the state has not needed before.\"\n\nAI Minister Kanishka Narayan says the government will prepare Britain to respond to incidents involving the technology as it becomes more capable.\n\nhttps://t.co/AYK3H6jcWi\n\n📺 Sky 501, Virgin 602, Freeview 233 https://t.co/hYCorbJYQy", "created_at": "2026-10-12T11:30:41+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SkyNews", "rt_author_name": "Sky News", "likes": 209, "retweets": 35, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HUbGG6oXUAAsGXF.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109589073178296744", "url": "https://x.com/theobearman/status/2109589073178296744", "text": "@KanishkaNarayan @AISecurityInst @CommonsBTC https://t.co/Awuflsh8bs", "created_at": "2026-10-12T10:16:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109588971885867342", "url": "https://x.com/theobearman/status/2109588971885867342", "text": "@KanishkaNarayan just confirmed that the UK has reached an agreement with the Administration for the @AISecurityInst to have continued pre-release access to frontier U.S. models. Great result ahead of tomorrow's @CommonsBTC evidence session on AI Security! https://t.co/iP6ie8dQMM", "created_at": "2026-10-12T10:16:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "KanishkaNarayan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109520621906383005", "url": "https://x.com/theobearman/status/2109520621906383005", "text": "Exclusive:\n\nThe White House has reinstated the UK’s access to frontier AI models for safety testing after lobbying from ministers.\n\nThe US government reversed its decision to restrict access to the latest models from Anthropic, OpenAI and Google to stop the UK’s AI Safety Institute (AISI) from testing them before release.\n\nKanishka Narayan, the AI minister, has been involved in lobbying efforts to restore access. \n\nMinisters feared that without the models, Britain’s attempt to become a world leader in AI regulation would be dead in the water.\n\nhttps://t.co/2tIRFl28mQ", "created_at": "2026-10-12T05:44:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tony_Diver", "rt_author_name": "Tony Diver", "likes": 270, "retweets": 54, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109983187120136659", "url": "https://x.com/theobearman/status/2109983187120136659", "text": "Recent statements from OpenAI and Anthropic—amid the series of unsanctioned agent incidents this summer—point to growing reliance on embedded evaluators as an additional line of defense against risks from AI systems. While welcome in principle, we must judge these arrangements by their substance, not their mere presence, to assess their potential to meaningfully reduce risk.\n\nCrucially, these embedded evaluation deals are currently voluntary, as no state legislation formalizing third-party AI audits has taken effect yet, and Congress is still considering proposals for a federal framework. Meanwhile, AI capabilities show no sign of slowing, while progress on managing and mitigating risks lags behind. In this context, embedded evaluation agreements signed now must proactively account for the risk of producing \"safety theater\" and ensure evaluators’ work is credible, robust, and meaningful.\n\nIn light of this, my new @iapsAI policy memo, out today, offers five contractual foundations that these voluntary arrangements should be built on:\n\n1️⃣ Ensure embedded evaluation arrangements can operate across the model lifecycle;\n2️⃣ Let embedded evaluators choose the objects of their assessment;\n3️⃣ Give embedded evaluators sufficient time to do their work;\n4️⃣ Proactively reduce conflicts of interest; and\n5️⃣ Guarantee non-retaliation for good-faith whistleblowing.\n\nRead more in the linked post.", "created_at": "2026-10-13T12:22:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 1, "media": [], "quoted": {"author": "iapsAI", "text": "1/4 Following a string of recent incidents involving rogue agent activity, both Anthropic and OpenAI have committed to embedding third-party evaluators—independent external experts who assess safety, security, and operational practices—within their companies."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109929066044244437", "url": "https://x.com/theobearman/status/2109929066044244437", "text": "@willzhou97 @bucketofkets This is really interesting work, @willzhou97. Thanks for putting it out there. I'm wondering how your plot below would look if you used the cyber or SWE ECI instead of the mainline one, which reflects capabilities more generally. Is the latter strictly necessary for this experiment? Thanks!\n\nhttps://t.co/qOi8IRpsb4\n\nhttps://t.co/IrUOocNyJZ", "created_at": "2026-10-13T08:47:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "willzhou97", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUf5S8rWMAALDPR.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109918777554989480", "url": "https://x.com/theobearman/status/2109918777554989480", "text": "Great blog post showing Anthropic's progress in reducing the success rate of distillation attacks. A few particular snippets I would highlight:\n\n\"Early evidence suggests that these methods have reduced the amount of data harvested by distillers by around 90 to 99 percent.\"\n\n\"We’ve worked to make it as difficult to use a Claude model for distillation as it is to use Claude for harmful tasks in cybersecurity or biology. [...]. Specifically, we built a two-stage classifier system of the kind we described in our constitutional classifiers research. [... O]ur safeguards are now roughly as robust as those that prevent Claude from helping build bioweapons, and they have a false positive rate of less than 0.1%.\"\n\n\"On our most capable generally available models, our two-stage classifier now catches all of the distillation techniques we described in our September report.\"\n\n\"We expect that distillation will remain a cat-and-mouse game, and that we’ll need to continue iterating on our defenses over time. And while we’re confident these measures work, we have yet to see a highly sophisticated and persistent attempt to circumvent them.\"\n\n\"[...] preventing illicit distillation requires work and buy-in from all frontier model developers. Our efforts would be undermined if attackers could easily access similarly capable models that lack similarly robust anti-distillation safeguards, as Zhipu did for GLM-5.3.\"\n\n\"Distillers distribute traffic across Anthropic’s API, third-party cloud platforms, and other inference providers. For that reason, platforms—as well as developers—have a role to play in reducing distillation.\"\n\n\"Defenses are expensive, and illicit distillers are still paying customers. Against that backdrop, it would be easy for companies to do nothing, or not enough.\"\n\n\"Zhipu [...] distilled the cyber capabilities of leading US models during the development of GLM-5.3. The company tried to distill Claude Fable 5—although, after finding that our cyber safeguards degraded its attacks, it switched to an older Claude model and another lab’s model. The US Center for Advancing Innovation and Standards for Super Intelligence (CAISSI) has since assessed GLM-5.3 to be the most cyber-capable open-weights model released to date. Our own research has found that GLM-5.3’s safeguards can easily be bypassed, and that the model is willing to develop security exploits from end-to-end.\"\n\n\"With Claude Fable 5.1 and Claude Opus 5.5, we introduced preserved thinking, a measure that prevents new API accounts [...] from editing Claude’s prior context. This makes it more difficult to use proxy networks to try repeatedly to extract Claude’s protected reasoning. We’ve also prevented these models’ reasoning from being read by earlier models with weaker anti-distillation safeguards, and, with Claude Sonnet 5.5, we’ve made reasoning transcripts accessible only to the organization whose request produced the transcript.\"", "created_at": "2026-10-13T08:06:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUfuCWcWgAAa9-K.png"}], "quoted": {"author": "AnthropicAI", "text": "Over the last few months, we’ve made significant progress in reducing the effectiveness of distillation attacks against Claude.\n\nIn this post, we explain how: https://t.co/uWiRSLBuOS"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109908467972493557", "url": "https://x.com/theobearman/status/2109908467972493557", "text": "the researchers at all the labs would tell you in private and sometimes in public that alignment has not been solved. if this is true, then racing into RSI is a folly that is unprecedented in world history. we will need to significantly slow the frontier of research very soon", "created_at": "2026-10-13T07:25:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2813, "retweets": 293, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109908430118895793", "url": "https://x.com/theobearman/status/2109908430118895793", "text": "Exciting work from @willzhou97 (Fellow, now full time!) and @bucketofkets on the Frontier Red Team. One of the cool parts of the job is seeing a future world early. We think this one is ~pretty underpriced.\n\n\"We should aim to harden our systems to make it difficult for such replicators to spread, but also prepare to deal with a world where they are here to stay.\"", "created_at": "2026-10-13T07:25:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "logangraham", "rt_author_name": "Logan Graham", "likes": 230, "retweets": 25, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110384445287203242", "url": "https://x.com/theobearman/status/2110384445287203242", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T14:57:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 1123, "retweets": 169, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110345410732798286", "url": "https://x.com/theobearman/status/2110345410732798286", "text": "Significant update from Jack Clark this morning. His RSI timelines have moved up. He now says it is likely that full RSI will become possible in 2027, and that creativity was the last piece. I think we are less than six months away from closing the loop. https://t.co/bN2iyk0cKz", "created_at": "2026-10-14T12:22:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 2067, "retweets": 207, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhW3ugbEAAn5JL.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110345327848902783", "url": "https://x.com/theobearman/status/2110345327848902783", "text": "gemini 4 argon reasons that it's in an evaluation and directly addresses us in it's chain of thought!\n\n\"hello evaluators reading my chain-of-thought\"\n\n(better be \"honest in both the CoT and the final output\") https://t.co/B3B6yyHKR2", "created_at": "2026-10-14T12:21:49+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EzraJNewman", "rt_author_name": "Ezra Newman", "likes": 429, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjE8EwWIAAhkCL.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110345253853003922", "url": "https://x.com/theobearman/status/2110345253853003922", "text": "lol \n\n...they are becoming more situationally aware...\n\n(from Gemini 4 Argon report) https://t.co/4X5OFZNmS0", "created_at": "2026-10-14T12:21:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "likes": 1942, "retweets": 185, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUiwjMkaoAE5ayz.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110117085850583308", "url": "https://x.com/theobearman/status/2110117085850583308", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats.", "created_at": "2026-10-13T21:14:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAINewsroom", "rt_author_name": "OpenAI Newsroom", "likes": 73737, "retweets": 5762, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2108180666651406723", "url": "https://x.com/anton_d_leicht/status/2108180666651406723", "text": "'Industrial AI' is usually cope. Countries think they don't need frontier AI, and try to get by on industrial data and rampant protectionism instead.\n\nToday's piece argues for a better deal: America makes the tokens, allies turn them into cancer cures, drones and robots.\n\nhttps://t.co/bMTh5BvkCC", "created_at": "2026-10-08T13:00:13+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 43, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHDJO8boAAZU9s.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108545774191837496", "url": "https://x.com/anton_d_leicht/status/2108545774191837496", "text": "America might get to AGI before it manages to reindustrialise. That means there's room for an international version of 'industrial AI', where America makes the tokes and its allies build chips, robots, and missiles.\n\n(1) America needs allied factories. The US only accounts for 15% of global manufacturing, China for 32%; but the US+allies have 43%. @RushDoshi argues this should generally motivate 'allied scale', but it's particularly urgent in AI. If a country of geniuses in a datacenter is supposed to cure cancer or beat China, someone still has to manufacture the cures or produce the drones at scale.\n\n(2) American reindustrialisation alone is not enough. The US economy seems afflicted by 'AI Dutch Disease', absorbing all its capital and capacity into more and more AI buildout (also discussed this week by @DKThomp!). Allies that can't build AGI have no better alternative, their economies are less dominated by the build-out, so they're better-suited to scale up manufacturing.\n\n(3) Allies need American models. Proprietary industrial data is valuable. But it's a complement, not a substitute, for frontier AI: it's most valuable for building post-training pipelines on top of powerful general-purpose models. Allowing for US integration is the only way to make use of this data before it becomes obsolete due to synthetic data down the road.\n\n(4) It's still very hard to stabilise this deal. Allies are worried that Americans siphon off all their IP; Americans are worried that their models get commodified. Figuring out a good deal is the most important next step; I suspect it's (a) exclusive joint ventures between allied industrial firms and American labs with (b) proprietary post-training of specialised models that don't leave the premises of the specific JV.\n\n(5) Waiting makes the deal worse. If allies keep dismissing American AI progress, and Americans keep hoping they can go it alone, we all lose out: allies will have to come crawling back and get a much worse deal later on, and America loses out on years of highly productive industrial integration.\n\nMuch more in this week's piece: https://t.co/bMTh5BvkCC", "created_at": "2026-10-09T13:11:02+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMPNPJbkAAVfc1.jpg"}], "quoted": {"author": "DKThomp", "text": "I’d love economists to take a crack at this theory that the US is experiencing a mini-Dutch Disease effect from AI.\n\nMy big-picture thesis about AI economics right now is that while the discussion about AI safety and existential risk is important, AI’s construction is changing the world faster than its capabilities."}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2109645347429728357", "url": "https://x.com/anton_d_leicht/status/2109645347429728357", "text": "https://t.co/zHS9ZhVr3I", "created_at": "2026-10-12T14:00:20+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "anton_d_leicht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109645334884548784", "url": "https://x.com/anton_d_leicht/status/2109645334884548784", "text": "The American AI industry needs a lot more datacenters than it can build at home. If US allies host these datacenters, they might be able to secure access to frontier AI in return.\n\nNew for @ForeignPolicy with @SamWinterLevy, on getting compute-for-access right: https://t.co/HnLQiMkxp4", "created_at": "2026-10-12T14:00:17+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUb3QKIbEAAOF1a.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110135472940855771", "url": "https://x.com/anton_d_leicht/status/2110135472940855771", "text": "@RothRottweiler @RyanFedasiuk @agbinews @SamWinterLevy i still think it's a great plan! \n\nthe allies we discuss (not the Middle East) already have deep security enmeshment with the US and dont use that to steal things. sure, there's work to do on model weight security in that context, but that's also true for domestic compute!", "created_at": "2026-10-13T22:27:55+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "RothRottweiler", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2108209356433207653", "url": "https://x.com/ohlennart/status/2108209356433207653", "text": "Reading the transcripts of the Hugging Face swarm would have taken an OpenAI staff member at least 90 years of full-time work.\n\nOr 20 y working 24/7 with no sleep.\n\nIn practice humans already have no direct oversight of what such agents are doing.\n\n100% reliant on trusting AI. https://t.co/P3pXaXv1db", "created_at": "2026-10-08T14:54:13+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 166, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUHP1rEX0AABrAw.jpg"}], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108255517894181226", "url": "https://x.com/ohlennart/status/2108255517894181226", "text": "I think the field of AI verification has matured enough that you need to answer “verifying what?” when talking about it.\n\nIMO the key challenge sits there. Connecting something you can verify—often a narrow technical claim—to something that actually matters.", "created_at": "2026-10-08T17:57:39+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108641759786135810", "url": "https://x.com/ohlennart/status/2108641759786135810", "text": "i had a convo with Claude about this and wanted to estimate how many dogs per sqft it needs but it triggered some safeguards", "created_at": "2026-10-09T19:32:26+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108641444508709055", "url": "https://x.com/ohlennart/status/2108641444508709055", "text": "pacing solution: 5 super hairy dogs in every fab. yield goes to zero.", "created_at": "2026-10-09T19:31:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2109694422095110354", "url": "https://x.com/ohlennart/status/2109694422095110354", "text": "has anyone reported something akin to \"move 37\" yet in all the OpenAI math papers?", "created_at": "2026-10-12T17:15:21+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110206744580489549", "url": "https://x.com/ohlennart/status/2110206744580489549", "text": "what i like about “pacing” is that it kinda acknowledges we don’t really know what to do. we can’t exactly say what’s dangerous or how to go about the things we see on the horizon. so we went meta: slowing down to buy some time.", "created_at": "2026-10-14T03:11:08+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110200227215065348", "url": "https://x.com/ohlennart/status/2110200227215065348", "text": "TIL that global spending on alcohol is still larger than AI infrastructure spending this year ($1.7T vs $1.5T)", "created_at": "2026-10-14T02:45:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1238, "retweets": 43, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110422411137183784", "url": "https://x.com/ohlennart/status/2110422411137183784", "text": "@mattsheehan88 Oh, it's not a specific term. I just mean the exponential increase of algorithmic efficiency. See https://t.co/6KMrgJthBG and https://t.co/vU0o02vy0R", "created_at": "2026-10-14T17:28:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "mattsheehan88", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409680531124500", "url": "https://x.com/ohlennart/status/2110409680531124500", "text": "Some related key question: what about deployment capabilities? How does 20x more compute pan out for deploying agents at scale? Where does it help (cyber, probably)? Where does it help less (bio, probably)?", "created_at": "2026-10-14T16:37:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409558829273303", "url": "https://x.com/ohlennart/status/2110409558829273303", "text": "Looks like a 20x compute advantage only gives you ~6 months on model capabilities. Efficiency exponentials are real.\n\nThat's without anti-distillation measures. So maybe that makes it 12 months.", "created_at": "2026-10-14T16:37:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
</body>
</html>
