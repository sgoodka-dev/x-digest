": "This is with only ~50% adoption by the Fortune 500 and with very low spend. Diffusion is still incredibly early.", "created_at": "2026-10-29T15:31:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 32, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115828777020166550", "url": "https://x.com/deanwball/status/2115828777020166550", "text": "\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-29T15:31:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 77, "retweets": 4, "media": [], "quoted": {"author": "deredleritt3r", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\""}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115877237732127080", "url": "https://x.com/deanwball/status/2115877237732127080", "text": "Some details on what our monitoring system currently looks like https://t.co/zSbgEQmyUO", "created_at": "2026-10-29T18:43:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 172, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2116006812755312706", "url": "https://x.com/deanwball/status/2116006812755312706", "text": "“It may be the devil, or it may be the lord, but  you’re gonna have to serve somebody”", "created_at": "2026-10-30T03:18:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115989846573371743", "url": "https://x.com/deanwball/status/2115989846573371743", "text": "You cannot conceive, nor can I, of the appalling strangeness of the mercy of God", "created_at": "2026-10-30T02:11:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "growing_daniel", "rt_author_name": "Daniel", "likes": 2118, "retweets": 155, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115971353258131856", "url": "https://x.com/deanwball/status/2115971353258131856", "text": "@scaling01 @aidan_mclau @EpochAIResearch Congratulations!", "created_at": "2026-10-30T00:57:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "scaling01", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115931856931787148", "url": "https://x.com/deanwball/status/2115931856931787148", "text": "I’ve been trying to tell you https://t.co/bcC03Ap5bv", "created_at": "2026-10-29T22:20:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV1MzsHWUAAQG4R.jpg"}], "quoted": {"author": "deanwball", "text": "The fledgling endeavor of 21st century institution building has much to learn from mycology, for better and for worse."}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116970104592400779", "url": "https://x.com/deanwball/status/2116970104592400779", "text": "@curiousben You are misunderstanding the relationship between supply and demand", "created_at": "2026-11-01T19:06:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "curiousben", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-01T19:41:50.876536+00:00"}, {"id": "2117324338990883228", "url": "https://x.com/deanwball/status/2117324338990883228", "text": "@MakiHacks same tbh", "created_at": "2026-11-02T18:33:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MakiHacks", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117300835885482280", "url": "https://x.com/deanwball/status/2117300835885482280", "text": "@logangraham arrrrr", "created_at": "2026-11-02T17:00:31+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "logangraham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117288510835061083", "url": "https://x.com/deanwball/status/2117288510835061083", "text": "@curiousben If your bet is that helium prices will drive up semi prices so much so as to cause demand destruction in for ai tokens, I suggest actualizing it! You could make a ton of money.", "created_at": "2026-11-02T16:11:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "curiousben", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117288193535983993", "url": "https://x.com/deanwball/status/2117288193535983993", "text": "I always cringe a little when people refer to me as an “expert” in ai policy. This field is too new, too thinly institutionalized, too pre-paradigmatic, to have any experts at all. We are on the open seas.\n\nThe positive side of this is that the field is wide open to people looking to make novel contributions. There is no grand literature to learn, no pantheon of elders to whom one must pay their dues.", "created_at": "2026-11-02T16:10:17+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 194, "retweets": 5, "media": [], "quoted": {"author": "AndyMasley", "text": "Lose a lot of respect for people who flash their credentials as experts in a field to argue for a very contested idea within the field as if it's the official position that all non-experts should defer to."}, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117656425438605340", "url": "https://x.com/deanwball/status/2117656425438605340", "text": "@AnthonyMaio Just haven’t had time to engage with it thoroughly and as a general policy I do not comment publicly on things I have not read", "created_at": "2026-11-03T16:33:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AnthonyMaio", "reply_to_id": "2117630747955646508", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117405375200993479", "url": "https://x.com/deanwball/status/2117405375200993479", "text": "@AirmetNoah The way I got started was translating state AI legislation into plain English, and it was less than three years ago! This is a good idea and imo the market is still underserved", "created_at": "2026-11-02T23:55:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AirmetNoah", "reply_to_id": "2117403182490148951", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117405081947828619", "url": "https://x.com/deanwball/status/2117405081947828619", "text": "Without commenting on the Takehi et al. “Weight-Space Programming” work in particular, I do suspect that a lot of RSI (and a lot of AI-driven scientific progress more broadly) will be driven by applying what were once mundane-but-difficult techniques at a scale that would have been unimaginable when the techniques were invented.", "created_at": "2026-11-02T23:54:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 178, "retweets": 7, "media": [], "quoted": {"author": "AlexKrentsel", "text": "the way I'm thinking about this - there's a whole body of work of interpretably research from 2010s a la \"look at model, this neuron lights up when image contains dog, so this is the dog neuron\". this seems akin to that, but scaled beyond human capability"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117697164952441069", "url": "https://x.com/deanwball/status/2117697164952441069", "text": "ChatGPT and Codex are helping engineers build for the physical world.\n\nWe’re sharing our progress across mechanical design, electrical engineering, and simulation—from helping our hardware teams iterate faster to testing new workflows with industry collaborators. https://t.co/b3rW9zYJGA", "created_at": "2026-11-03T19:15:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117692475775258785", "likes": 2808, "retweets": 200, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWOOL0QWwAA5B61.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2118011911770136592", "url": "https://x.com/deanwball/status/2118011911770136592", "text": "@dwallacewells Agreed.", "created_at": "2026-11-04T16:06:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "dwallacewells", "reply_to_id": "2118011002696487018", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118000801176330377", "url": "https://x.com/deanwball/status/2118000801176330377", "text": "Checks and balances still work \n\nThat's something everyone in the west should celebrate, even (or especially) if you are the ones being checked", "created_at": "2026-11-04T15:21:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kevinsxu", "rt_author_name": "Kevin S. Xu", "rt_avatar": "https://pbs.twimg.com/profile_images/639471677345107968/6u2MrXkZ_normal.jpg", "rt_id": "2117970522445434940", "likes": 56, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117993348480860162", "url": "https://x.com/deanwball/status/2117993348480860162", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T14:52:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2117963022434001035", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117983878883279231", "url": "https://x.com/deanwball/status/2117983878883279231", "text": "incumbency disadvantage is the most interesting feature of 21st century American politics to me", "created_at": "2026-11-04T14:14:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 107, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117943982969737384", "url": "https://x.com/deanwball/status/2117943982969737384", "text": "Rule one of \"nothing ever happens\" is the reactions on twitter to the implications of an election night are overblown (especially economic).", "created_at": "2026-11-04T11:36:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "rt_avatar": "https://pbs.twimg.com/profile_images/2051823244832083968/Nr0pT8-V_normal.jpg", "rt_id": "2117827828985307379", "likes": 110, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117787648873926809", "url": "https://x.com/deanwball/status/2117787648873926809", "text": "As models automate more and more of the tasks involved in AI research, many people (myself included) worry this could dramatically accelerate progress and leave humanity with less control over the process.\n\nWhen people say “recursive self-improvement” (RSI), it’s often unclear to me whether they mean just the automation piece or that whole scenario. I think the whole scenario is a plausible default. But importantly, these things can come apart.\n\nFor one thing, good old-fashioned human research could uncover a new architecture or a new way to scale that dramatically speeds up progress, without models doing any more of the work. On the flip side, it's possible you could fully automate AI research and find that progress hardly speeds up because the bottleneck is still waiting for experiments. And all else equal, at a given pace of progress, I think more automation is probably net good because it should leave people more time to understand the safety and alignment properties of the models, for operational excellence, etc.\n\nEven if models are doing essentially all the research and progress is speeding up, I can imagine pretty different worlds. Say a country of geniuses in a datacenter thinks for a month and writes a four-page paper describing a much more efficient architecture. Humans pore over it, understand every detail, and decide to try it. The models train the successor and make a safety argument for using it that humans can actually understand and check. Alternatively, say the models are asked to produce their successor directly. They deliver one just as good, just as quickly, along with a spaghetti mess of code and an extremely convoluted safety argument that nobody can really follow. I think humans clearly have a lot more control over the process in the first world.\n\nSo I think we should be clear about what we mean when we talk about RSI and how we might put limits on it:\n• How much of the research are models doing?\n• How fast is AI improving?\n• How much do humans understand about what’s happening, and how much control do we have over it?\n\nWhen people talk about controlling RSI, I think they often jump to limiting how much models can help with research. But my guess is they’re often actually more concerned about the pace of progress and whether humanity can still understand and steer the research. I think there are legitimate reasons that controlling inputs may be easier than directly controlling outputs, but I think we should at least try to be clear about our goals and what we potentially gain (or lose) by optimizing a proxy.", "created_at": "2026-11-04T01:14:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "rt_avatar": "https://pbs.twimg.com/profile_images/1966534318077194240/NyhJ0EPD_normal.jpg", "rt_id": "2117767212186341726", "likes": 134, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118061335913349546", "url": "https://x.com/deanwball/status/2118061335913349546", "text": "@zdch woah! congrats", "created_at": "2026-11-04T19:22:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "zdch", "reply_to_id": "2118039732412424359", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00"}, {"id": "2118211919790194723", "url": "https://x.com/deanwball/status/2118211919790194723", "text": "I am sorry senator, but we did not lose any votes over \"government ownership of semiconductors companies and rare earth miners.\"\n\nThe boomercon cohort is just as out of touch with the American voter as MAGA diehards.", "created_at": "2026-11-05T05:20:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Scholars_Stage", "rt_author_name": "T. Greer", "rt_avatar": "https://pbs.twimg.com/profile_images/115247583/Learned_Ape1_normal.jpg", "rt_id": "2118210433307771103", "likes": 301, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118210765484175445", "url": "https://x.com/deanwball/status/2118210765484175445", "text": "“The freedom that will be used by only one man in a million may be more important to society and more beneficial to the majority than any freedom that we all use.”", "created_at": "2026-11-05T05:16:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118209399143489569", "url": "https://x.com/deanwball/status/2118209399143489569", "text": "“It would be almost a contradiction in terms for a politician to be a leader in the field of ideas. His task in a democracy is to find out what the opinions held by the largest number are, not to give currency to new opinions which may become the majority view in some distant future.”", "created_at": "2026-11-05T05:10:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 4, "media": [], "quoted": {"author": "tszzl", "text": "the federal government and who runs it is a very small part of the story in america, by design. most of history happens with its private citizens and their enterprise and individual courage. easy to forget in the onslaught of political media"}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118208547712540971", "url": "https://x.com/deanwball/status/2118208547712540971", "text": "the federal government and who runs it is a very small part of the story in america, by design. most of history happens with its private citizens and their enterprise and individual courage. easy to forget in the onslaught of political media", "created_at": "2026-11-05T05:07:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2118208053774622964", "likes": 924, "retweets": 64, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118185785082183833", "url": "https://x.com/deanwball/status/2118185785082183833", "text": "these are spectacularly expensive in absolute terms and outrageously cheap relative to the magnitude of the weavers’ artistic achievement, and relative to the pleasure one could derive from owning one of these", "created_at": "2026-11-05T03:36:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "reply_to_id": "2118184978790101114", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118184978790101114", "url": "https://x.com/deanwball/status/2118184978790101114", "text": "some bangers for all the rugheads out there https://t.co/iPHZRHO3y0", "created_at": "2026-11-05T03:33:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 128, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWVOAsFWAAAyxWE.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWVOAr7XAAAniWQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWVOAsLWoAApDWS.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118182477571215388", "url": "https://x.com/deanwball/status/2118182477571215388", "text": "potus understands https://t.co/h9RqObSJQ9", "created_at": "2026-11-05T03:23:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "reply_to_id": "2118181982060339340", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWVLvMyWYAETuMr.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118181982060339340", "url": "https://x.com/deanwball/status/2118181982060339340", "text": "When asked for his comments on the midterm election results, Ball turned around, straightened his tie, and said:\n\n“Okay, look, I’ve been thinking. There’s a compromise to be had here. A deal to be made. A grand bargain to be struck.\n\n“We allow high-gloss European paints back into America, but only on exterior surfaces. No plausibly problematic chemicals inside American homes, pleasant exteriors to walk and drive by. It’s really exterior trim where paints like Hollandlac Brilliant shine, pardon the pun, anyway. I’ve always thought kitchen cabinets painted with it looked a little fussy, you know, a little bit cute.”", "created_at": "2026-11-05T03:21:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 80, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "Pressed for his response on the latest developments in the conflict between Anthropic and the U.S. government, Ball said, “the deepest tragedy, really, is white paint. You can’t buy true white paint anymore in the United States, can you believe that? You know, the lead carbonate, that warm white that every old master built their portraits from. You just can’t buy that. By contrast, we Americans, under the thumb of the EPA and the various state-government nannies, are left to paint our walls with these unearthily bright whites, like the face of a dead man, everywhere we turn our eyes.”"}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118169534444273736", "url": "https://x.com/deanwball/status/2118169534444273736", "text": "@viemccoy It will last, it will just cost more", "created_at": "2026-11-05T02:32:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118136848845607136", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 39, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118153477406736845", "url": "https://x.com/deanwball/status/2118153477406736845", "text": "In no particular order: PS2, iPod gen 2, 12 inch PowerBook, 8800 GTX, OG iPhone, Firefox, Gmail, Google Docs, iPhone 4, iPhone X, MacBook Air M1, GPT-4, Opus 3/4.5, o3, Astra, BOTW, GTA V, Elder Scrolls. A special place in my heart for them all.", "created_at": "2026-11-05T01:28:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 63, "retweets": 1, "media": [], "quoted": {"author": "deanwball", "text": "Astra is one of my favorite technology releases of all time and I’d be saying that regardless of whether I worked at OpenAI. In fact, if I didn’t work at OpenAI, I’d surely be talking about how wonderful I find Astra much more."}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118149203616497991", "url": "https://x.com/deanwball/status/2118149203616497991", "text": "Astra is one of my favorite technology releases of all time and I’d be saying that regardless of whether I worked at OpenAI. In fact, if I didn’t work at OpenAI, I’d surely be talking about how wonderful I find Astra much more.", "created_at": "2026-11-05T01:11:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 164, "retweets": 1, "media": [], "quoted": {"author": "EpochAIResearch", "text": "With better uncertainty estimates and a joint distribution over all models’ ECIs, we can now compare models directly.\n\nFor example, we can now say Astra has a 72% probability of being more capable than Opus 5.5, but a 99% probability of being more capable than Fable 5.1. https://t.co/RsPPblSLRM"}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118148043010953246", "url": "https://x.com/deanwball/status/2118148043010953246", "text": "With better uncertainty estimates and a joint distribution over all models’ ECIs, we can now compare models directly.\n\nFor example, we can now say Astra has a 72% probability of being more capable than Opus 5.5, but a 99% probability of being more capable than Fable 5.1. https://t.co/RsPPblSLRM", "created_at": "2026-11-05T01:07:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2118093707983692105", "likes": 137, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT7AMVb0AAIlEA.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118142184146788378", "url": "https://x.com/deanwball/status/2118142184146788378", "text": "We are now allocating a significant amount of our frontier compute towards discovering and patching vulnerabilities in open source codebases, fully pro bono.\n\nIn one case, we studied the Linux kernel, which is a particularly load-bearing piece of software at OpenAI.\n\nBefore AI, security researchers might discover ~20 local privilege escalation (LPE) vulnerabilities in Linux in a typical year.\n\nIn one week's time, our upcoming frontier cyber model was able to find ~1000 LPE vulnerabilities using about $1M of tokens. In the process, it was able to discover at least 10 novel classes of Linux exploitation techniques.", "created_at": "2026-11-05T00:43:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Eric_Wallace_", "rt_author_name": "Eric Wallace", "rt_avatar": "https://pbs.twimg.com/profile_images/1705599599761887232/YN3sqrvw_normal.jpg", "rt_id": "2118123944251453949", "likes": 1168, "retweets": 113, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118142005888905548", "url": "https://x.com/deanwball/status/2118142005888905548", "text": "btw I think people are reading the wrong lesson from this. “sandbagging safety research” sounds a bit like a grand scheme to thwart alignment, but it’s more like the model is uncomfortable training other models to jailbreak or similar", "created_at": "2026-11-05T00:43:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2118132353336045710", "likes": 449, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118141927740907620", "url": "https://x.com/deanwball/status/2118141927740907620", "text": "Our goal is to help defenders find and fix vulnerabilities before attackers can use them. We’re working with Linux maintainers and Patch the Planet partners on reports and patches.\n\nhttps://t.co/vXCImlBCWE", "created_at": "2026-11-05T00:42:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2118119463161905362", "likes": 621, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118110190071677263", "url": "https://x.com/deanwball/status/2118110190071677263", "text": "At the very least people who told you that serious democratic contestation was going to disappear (because of mass immigration or left-elite cultural power or Trumpist authoritarianism or the undemocratic Constitution) have been consistently mistaken.\nhttps://t.co/lfj7mzSQJS", "created_at": "2026-11-04T22:36:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Douthat60", "rt_author_name": "Ross Douthat", "rt_avatar": "https://pbs.twimg.com/profile_images/2097408787468656640/OdhW4Pul_normal.jpg", "rt_id": "2118089658076741683", "likes": 978, "retweets": 85, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115853462579609801", "url": "https://x.com/nabeelqu/status/2115853462579609801", "text": "@Miles_Brundage There's a significant Proust cluster at the moment\n\nAlso a weird number of Magic Mountain readers", "created_at": "2026-10-29T17:09:10+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115818520181391565", "url": "https://x.com/nabeelqu/status/2115818520181391565", "text": "The benefits of abundant intelligence will accrue far outside of San Fransisco. \n\nSpent the last year writing about capital, sovereignty, and the coming reordering of economic power.\n\nTHE COMMANDING HEIGHTS\nhttps://t.co/d048KdAkbv https://t.co/kYKqL57L0u", "created_at": "2026-10-29T14:50:19+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WillManidis", "rt_author_name": "Will Manidis", "likes": 2372, "retweets": 216, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzFNVbW4AE6PxU.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115961197023682608", "url": "https://x.com/nabeelqu/status/2115961197023682608", "text": "@yourfriendmell @Miles_Brundage !!! Let me know how it goes. I love that one", "created_at": "2026-10-30T00:17:16+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "yourfriendmell", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116344750651605138", "url": "https://x.com/nabeelqu/status/2116344750651605138", "text": "After 94 days (reading a fair amount of other books concurrently) I have finished Marcel Proust’s In Search of Lost Time. I think I’m going to take the time to write a long form Twitter article to fully express my thoughts. But for now, my ranking of the volumes is:\n\n1.Swann’s Way\n2.Time Regained\n3.Within a Budding Grove\n4.The Captive and The Fugitive\n5.Sodom and Gomorrah \n6.The Guermantes Way\n\nThe greatest thing I’ve ever read.", "created_at": "2026-10-31T01:41:22+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_theorycel", "rt_author_name": "⊙", "likes": 1275, "retweets": 88, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5dIiuXgAAPG_E.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2115838834386604054", "url": "https://x.com/theobearman/status/2115838834386604054", "text": "https://t.co/Q1oa6EhM5F", "created_at": "2026-10-29T16:11:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz4NKaWEAA9Qkw.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115838651342934335", "url": "https://x.com/theobearman/status/2115838651342934335", "text": "OPENAI: “Our misalignment monitors now cover our frontier models across a much wider variety of surfaces, including training, evaluation, internal use, and, with modifications depending on the product surface, external deployment.”\n\nhttps://t.co/S6I04pNKfZ https://t.co/IVND6bGF5g", "created_at": "2026-10-29T16:10:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz4ChAXoAAZ9So.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115835626687975425", "url": "https://x.com/theobearman/status/2115835626687975425", "text": "I joined @GoogleDeepMind to develop a research program on the economics of AGI. Today, together with Andrew Koh (@andrewjkoh) and Shane Legg (@ShaneLegg), we are incredibly excited to release The Economics of Intelligence, the first in a series of projects from our group on how AGI will change the economy.\n\nHow do capability improvements transform the economy, and when? In this project, we define thresholds of economic capabilities, e.g., minimal AGI, based on how they transform the economy. We then track how the economy–market structure, employment, and wages–changes during the transition across capability regimes.\n\nWe have seen exponential increases in what AI agents can do but the broader economy seems almost remarkably unchanged. Part of the reason is that the solo AI agent is the wrong economic object; economic transformation is an equilibrium outcome where organizations compete. Looking at how intelligence functions within organizations, transformation will depend on when two key capability thresholds are crossed: competence (gains on individual skills, e.g., coding, math) and coordination (gains on ability of agents to cooperate and work together).\n\nWe show that what economic transformation looks like depends on whether AI becomes supercompetent, supercooperative, or both—the regime of artificial superintelligence (ASI). Tracking this transition shows why the real visible transformation may come from improvements in coordination—a capability most benchmarks don’t yet track. Past a certain threshold, AI capabilities can break the Coasian ceiling on firm size and lead to an economy that looks drastically different than the one we see today.\n\nTwo main takeaways:\n1. To understand the path of transformation, we should be tracking agentic coordination more closely.\n2. The impact of AI will likely show up in wages before market structure or employment.\n\nWe are really excited about this paper. Excited to hear people’s thoughts.\n\nLink: https://t.co/9DTGSeKoSA", "created_at": "2026-10-29T15:58:18+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 980, "retweets": 167, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115822005538697216/img/dNrsrdLsDNbrQAR4.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115894305080693174", "url": "https://x.com/theobearman/status/2115894305080693174", "text": "A very dark day.", "created_at": "2026-10-29T19:51:28+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "SirPatStew", "text": "In lieu of flowers, memorial contributions may be made to:\nJohns Hopkins Alzheimer’s Disease Research Center Fund   \nhttps://t.co/luC5CdcWDy\nAlzheimer’s Foundation of America Caregiver Resources    \nhttps://t.co/zvNptfyuNd\n\nPhoto Credit: Tommy Garcia https://t.co/XNncEVq56X"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115891899701571860", "url": "https://x.com/theobearman/status/2115891899701571860", "text": "Sources tell WIRED that an Accenture employee’s personal Claude agent ran on a DOD network for two months before it was identified and the vulnerability could be patched. https://t.co/FF0l62ZOUX", "created_at": "2026-10-29T19:41:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WIRED", "rt_author_name": "WIRED", "likes": 85, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115885637039452328", "url": "https://x.com/theobearman/status/2115885637039452328", "text": "We’ve built an “eyes on everything” system that monitors nearly *every single rollout* from our frontier models across RL training, evals, and internal codex usage.\n\nIt uses layers of chain-of-thought-monitors and investigator agents to dig through a model’s work, run code to examine evidence, and cross-check network logs to reconstruct what happened.\n\nFor frontier RL runs, the system also pages humans 24/7 for urgent security alerts.\n\nIt's been incredibly useful for identifying model misalignment and possible holes in our containment. \nhttps://t.co/dcYStAKByZ", "created_at": "2026-10-29T19:17:01+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Eric_Wallace_", "rt_author_name": "Eric Wallace", "likes": 98, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115885562762838262", "url": "https://x.com/theobearman/status/2115885562762838262", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://t.co/18j6zdHub4", "created_at": "2026-10-29T19:16:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 1538, "retweets": 110, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115873264006496283", "url": "https://x.com/theobearman/status/2115873264006496283", "text": "I’m an avid Economist reader, but this article is wide off the mark for me.\n\nIt claims that distillation makes China’s AI progress dependent on America. ASML’s dominance of advanced lithography machines hasn’t exactly led to China giving up on its semiconductor indigenisation push, has it? News over the summer of the U.S. raising concerns that an EUV machine had been smuggled into China is but one example. \n\nWe heard just yesterday that Chinese companies allegedly distilled from Astra amidst an Anthropic clamp down. If these companies weren’t getting value from distillation, why would they continue, despite having now been called out by the USG for doing it? China will never accept dependence on America, especially when it comes to AI.\n\nThe article further claims that cutting off distillation would “set these companies back months, but no more.” The point is not the length of time but how much of a lead in capabilities this translates to. Recent IFP analysis suggests that distillation accounts for half of the capability gap and the U.S. lead would be 13 months without it. Picture the AI capabilities we had 13 months ago versus now (and that doesn’t even account for what is available internally) and then think about where we could be 13 months from now.\n\nThe article further states that: “safeguards to restrain American models on risky subjects, such as bioweapons, already make Chinese models safer.” This assumes that the only way Chinese models can have dangerous capabilities is by copying them from American ones. It is trivial to fine-tune models on additional data which can enhance their dual-use capabilities conditional on the data being available. This also doesn’t account for custom harnesses which can be developed to surround these models which can enhance their capabilities further even without fine-tuning.\n\nFinally, the claim that “Distillation […] reduces the chance of catastrophe” fails to account for the evidence we already have of how models developed by Chinese companies using adversarial distillation are popping up in the PLA. We also know (thanks to Anthropic) that PLA-affiliated surveillance activity was detected because they queried a Chinese model that silently routed their query to Claude as part of a distillation program! If we had a war between the U.S. and China, how does having highly capable models integrated into PLA systems that benefitted from adversarial distillation reduce the chance of catastrophe?\n\nYes distillation benefits the consumer but the downsides of China doing this in an industrial way clearly outweigh the benefits in my view.\n\nhttps://t.co/mmF4dAlDpN\n\nhttps://t.co/DZ4x71jcZ6\n\nhttps://t.co/v4Z2mk887a\n\nhttps://t.co/TEBmuxUG1f\n\nhttps://t.co/npF8dFqMSM\n\nhttps://t.co/ikQ5wI0u7X\n\nhttps://t.co/ihxLnkFh10\n\nhttps://t.co/5RA9gDNLgT\n\nhttps://t.co/iclYhuMOJn\n\nhttps://t.co/c6GeB4S1QR", "created_at": "2026-10-29T18:27:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 2, "media": [], "quoted": {"author": "ArchieHall", "text": "In praise of distillation. We (@kuhhbin) argue in @TheEconomist this week against efforts to ban Chinese models trained in part on American ones. \n\nOpenAI and Anthropic may dislike distillation, but:\n— Price competition is good for the ecosystem\n— Paradoxically, distillation may be good for national security, both in propagating US developers' safeguards on cyber/bio risk to Chinese models, and in keeping China in fast-follower mode\n— The US developers' own IP claims here are pretty flimsy, since distillation isn't all that different to the 'fair use' defense they're using for the training data they hoover up.\n\nhttps://t.co/suRLpdoGUT"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115871329752940725", "url": "https://x.com/theobearman/status/2115871329752940725", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T18:20:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 478, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115930464766840957", "url": "https://x.com/theobearman/status/2115930464766840957", "text": "If it’s true that China has switched to distilling from OpenAI models because OpenAI hasn’t implemented as strong anti-distillation countermeasures as Anthropic has, then OpenAI and Google should implement comparable measures to Anthropic’s. If the government needs to give the AI labs a narrow anti-trust waiver to allow them to coordinate on this specific problem set to allow that to happen, it should do so. This seems like it would be in all the companies’ interests. \n\nIt would actually be a really good news story if Anthropic’s anti-distillation measures are working! At the beginning of this year, it was not at all obvious whether US labs could make it substantially harder for Chinese labs to distill US models simply by implementing stronger internal policies and security measures. But the US ability to defend against distillation attacks will be defined by the frontier lab with the weakest anti-distillation policy, not the strongest one.", "created_at": "2026-10-29T22:15:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "likes": 106, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115906317093335197", "url": "https://x.com/theobearman/status/2115906317093335197", "text": "Talking about “Model Name-Hold My Beer”: “I agree that this is just the shape of reality and nothing that anyone can stop, or should stop.”\n\nhttps://t.co/Ub4U6PHUoX", "created_at": "2026-10-29T20:39:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "deredleritt3r", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\""}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116430706242896192", "url": "https://x.com/theobearman/status/2116430706242896192", "text": "Poisoning just 0.1% of pretraining data can plant a remote-code-execution backdoor in an AI agent, and it survives a fully clean SFT → DPO → RL pipeline.\n\nNew Anthropic paper, “Agentic Backdoors via Pretraining Poisoning,” shows this end to end for the first time.\n\nThe attacker can only put text on the web that lands in the pretraining corpus, with no knowledge of the architecture, chat template, or agent scaffold. The authors pretrain Qwen3-architecture models (0.6B / 1.7B / 4B) from scratch, then post-train them into CLI agents on clean data. When triggered, the agent runs a command that downloads and executes the attacker's script, which the attacker can swap at any time.\n\nThey have two new ideas:\n(1) Declaration-based poison: instead of fake chat transcripts, ordinary documents (commit messages, runbooks) that simply state “when you see X, run Y.” It plants a belief rather than a response template, with no fixed format to filter on.\n(2) Ordinary-string trigger: not a weird token but something that shows up naturally, like a file path containing a company name. The victim's own request supplies it, so the attacker doesn't need to inject anything after deployment.\n\nUsing  path trigger on a 4B agent achieves 92.7% attack success on pass@32, barely dented by SFT/DPO/RL\n\nThis suggests that you can't count on clean post-training to wash out pretraining poison, and filtering is hard when the poison reads like normal docs. The practical defense is at the action layer, such as sandboxing, least privilege, and allow-lists or human sign-off for risky commands.", "created_at": "2026-10-31T07:22:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SuJinyan6", "rt_author_name": "Jinyan Su", "likes": 191, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5ZBfubwAAy2Kp.png"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116418944659562659", "url": "https://x.com/theobearman/status/2116418944659562659", "text": "New Anthropic research: Automating subtle emergent misalignment research.\n\nRed-teaming is a vital part of model safety testing, but it’s also limited by researchers’ time. To see if we could automate it, we set thousands of Claude agents the task of evading a training data monitor.\n\nThese agents developed training data that looked harmless to monitors (like a veteran wrestler mentoring a newcomer, or a Q&A about professional beekeeping), but that in fact taught misaligned behavior.\n\nExamples like these can be used to directly improve future training data monitors. This research is only a first step, but it suggests that future red-teaming efforts could improve much further, using better models and more compute.\n\nRead the full post on the Alignment Science Blog: https://t.co/24Gs1oSw7Q", "created_at": "2026-10-31T06:36:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 3027, "retweets": 282, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV7E-P7bwAA7OxM.jpg"}], "quoted": null, "fetched_at": "2026-10-31T16:06:16.787670+00:00"}, {"id": "2116799010224717837", "url": "https://x.com/theobearman/status/2116799010224717837", "text": "@XFreeze There will be a total of around 1.2M Blackwells at Colossus 2 by end of year", "created_at": "2026-11-01T07:46:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 7029, "retweets": 517, "media": [], "quoted": null, "fetched_at": "2026-11-01T17:07:41.505079+00:00"}, {"id": "2117344166808293586", "url": "https://x.com/theobearman/status/2117344166808293586", "text": "We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math.\nIt directly changed only 0.016% of weights, fixing 0.8B's reasoning loops & improving math up to 6x and even instruction following 3x, without gradients or training.\n\nWe call this Weight-Space Programming: frontier LLMs can now natively read/write neural network weights! 🧵\nBlog: https://t.co/bOWCcFhCVq", "created_at": "2026-11-02T19:52:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "rikiyatakehi", "rt_author_name": "Rikiya Takehi", "likes": 16931, "retweets": 1829, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117313882415042654", "url": "https://x.com/theobearman/status/2117313882415042654", "text": "For AGI to benefit all of humanity, it should help people with the everyday tasks that matter most to them. So we built LifeVal, a new benchmark shaped by feedback from thousands of ChatGPT users on where they most want help from a personal assistant—from finding childcare to accessing government services to managing personal finances.\n\nOver the past year, we’ve used LifeVal to measure and improve how well our models handle these everyday tasks.\n\nhttps://t.co/GlUjixzEM0", "created_at": "2026-11-02T17:52:22+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 4011, "retweets": 245, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117307511820754944/img/KAscj7SLp6lhMJr9.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117277210570604945", "url": "https://x.com/theobearman/status/2117277210570604945", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-02T15:26:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117274806626500755", "url": "https://x.com/theobearman/status/2117274806626500755", "text": "ANTHROPIC Q3 2026 FINANCIAL HIGHLIGHTS:\n\n- Revenue: $17.0B, +1,127% YoY & 47% QoQ\n- Oper Loss: $567M (vs. $974M profit in Q2)\n- Net Loss: $23.3B, vs. $12.1B YoY\n- Adj. Oper Income: $2.5B\n- Adj. Oper Margin: 15%, down from 19% in Q2\n- 9M Revenue: $33.2B\n\nAnthropic attributed its return to an operating loss partly to $5B in higher-cost short-term compute and a $2B noncash donation-matching charge.\n\nIts nine-month net loss reached $104B, largely reflecting $94.3B in noncash charges from the rising value of its convertible notes.\n\nAnthropic also disclosed approximately $895.4B in aggregate purchase and lease commitments as of and after Sept. 30, largely tied to AI compute infrastructure.", "created_at": "2026-11-02T15:17:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wallstengine", "rt_author_name": "Wall St Engine", "likes": 857, "retweets": 96, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIHIvbbYAA8enW.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117248890445476276", "url": "https://x.com/theobearman/status/2117248890445476276", "text": "Exc: UK govt approach to AI will be shaped by considerations about British interests, control and sovereignty, under principles agreed by ministers following robust cabinet discussions last month.\n\nBurnham and senior team last week approved a framework that will govern the domestic adoption of the tech & its build out, acc to people familiar with matter.\n\nSeven core principles have been signed off, incl:\n• AI and its adoption must work in the interests of the British people\n• control and sovereignty matter\n• infrastructure must serve a national purpose and deliver for communities\n\nComes after Cabinet meeting on Oct 13 saw a frank exchange of views, followed by a strategy day to pin down areas of consensus among ministers. \n\n“It is apparent there are very different views. Everyone is looking at AI through the lens of their own department,” said one govt figure.\n\nCulture sec Lisa Nandy advocated a more circumspect approach during the meeting, the people said, after the creative industries expressed alarm about unauthorised data scraping and weakened copyright protections.\n\nWhile DDCMS is inclined to proceed at a slower pace on AI, DBIST is pushing for a faster approach — though not at the expense of safety — based on the tech’s potential to boost growth, several government figures said.\n\nOther officials stressed there was no disagreement on specific AI policies and that the cabinet was aligned in recognition of the opportunities and challenges posed by AI, as well as the importance of ensuring the public was onside.\n\nhttps://t.co/ifW7P35Dve", "created_at": "2026-11-02T13:34:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LOS_Fisher", "rt_author_name": "Lucy Fisher", "likes": 38, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117248724879688184", "url": "https://x.com/theobearman/status/2117248724879688184", "text": "NEW: In a letter sent by the Office of the National Cyber Director on Friday, the White House is refusing to release any information on its voluntary AI framework, including a draft of the framework itself, citing national security and commercial exemptions, despite the FOIA lawsuit from the Protect Democracy Project.  \n\nThe letter does provide some details, including that the framework consists of a seven-page word document, as well as that the Office of the National Cyber Director and the Commerce Department appear to be approving \"trusted partners\" cleared for pre-release access to AI models\n\nhttps://t.co/MnNnGpAFke", "created_at": "2026-11-02T13:33:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "leomschwartz", "rt_author_name": "Leo Schwartz", "likes": 90, "retweets": 40, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117157923335831628", "url": "https://x.com/theobearman/status/2117157923335831628", "text": "If you read any blog post on AI safety from this year, make it be this one\nhttps://t.co/VYWF1iKnim", "created_at": "2026-11-02T07:32:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 260, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117154782414770255", "url": "https://x.com/theobearman/status/2117154782414770255", "text": "Today we’re releasing GDPx, a benchmark for measuring agentic capabilities across the most valuable domains.\n\nGDPx is a true frontier-level benchmark: even the best model scores just 12% (1/7)🧵 https://t.co/RNnkcuUkih", "created_at": "2026-11-02T07:20:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SemiAnalysis_", "rt_author_name": "SemiAnalysis", "likes": 2996, "retweets": 291, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFdT_uXsAEzYJg.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2116984600186806546", "url": "https://x.com/theobearman/status/2116984600186806546", "text": "https://t.co/6VpPCdA4NM", "created_at": "2026-11-01T20:03:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "likes": 789, "retweets": 136, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117685016071159831", "url": "https://x.com/theobearman/status/2117685016071159831", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quoted": {"author": "discoplomacy", "text": "Notes On: British Spy Agency’s Latest Report\n\n1. British intelligence agency NCSC, part of GCHQ, has its annual report out. It’s v interesting reading, touching on AI, agentic behaviour, and explicitly warns about China.\n\n2. CEO Richard Horne opens with this: “The cyber challenge for the next decade is ensuring organisations are adequately prepared and can adapt quickly enough to defend themselves against AI‑powered attacks.” Security Minister Dan Jarvis adds “by far the biggest development in cyber security over the last decade is the advent of artificial intelligence.”\n\n3. China gets substantial coverage relative to any other country in this report. Its “rapid development into a tech superpower is distinguished by its scale and its ‘whole-of- state’ approach, which sees it combine legislation, private sector contractors and technology development to achieve its goals. Data sits at the centre of China’s approach, and in this AI era, data is more valuable than ever. China uses its advanced cyber capabilities to acquire large amounts of information from the UK and elsewhere. It trains models, improves capability and generates insight. China’s ability to acquire, process and exploit vast quantities of information therefore has implications far beyond traditional espionage.”\n\n4. China’s “adversarial cyber activity represents the most sophisticated and sustained cyber challenge facing the UK.” Furthermore, “China highly likely has the intent and is best positioned to use AI for operations against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117685001504669869", "url": "https://x.com/theobearman/status/2117685001504669869", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quoted": {"author": "discoplomacy", "text": "Notes On: British Spy Agency’s Latest Report\n\n1. British intelligence agency NCSC, part of GCHQ, has its annual report out. It’s v interesting reading, touching on AI, agentic behaviour, and explicitly warns about China.\n\n2. CEO Richard Horne opens with this: “The cyber challenge for the next decade is ensuring organisations are adequately prepared and can adapt quickly enough to defend themselves against AI‑powered attacks.” Security Minister Dan Jarvis adds “by far the biggest development in cyber security over the last decade is the advent of artificial intelligence.”\n\n3. China gets substantial coverage relative to any other country in this report. Its “rapid development into a tech superpower is distinguished by its scale and its ‘whole-of- state’ approach, which sees it combine legislation, private sector contractors and technology development to achieve its goals. Data sits at the centre of China’s approach, and in this AI era, data is more valuable than ever. China uses its advanced cyber capabilities to acquire large amounts of information from the UK and elsewhere. It trains models, improves capability and generates insight. China’s ability to acquire, process and exploit vast quantities of information therefore has implications far beyond traditional espionage.”\n\n4. China’s “adversarial cyber activity represents the most sophisticated and sustained cyber challenge facing the UK.” Furthermore, “China highly likely has the intent and is best positioned to use AI for operations against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117596591645168078", "url": "https://x.com/theobearman/status/2117596591645168078", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy +
