<script id="data" type="application/json">[{"id": "2118244755184173472", "url": "https://x.com/_achan96_/status/2118244755184173472", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-05T07:31:19+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1417, "retweets": 211, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118440222413443226", "url": "https://x.com/_achan96_/status/2118440222413443226", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T20:28:02+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 1648, "retweets": 188, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118682153005281396", "url": "https://x.com/_achan96_/status/2118682153005281396", "text": "hmmm, if astra sandbags on safety research for ethical reasons, why don't models also sandbag on capabilities research? (or maybe they do and we aren't looking?)\n\nmaybe it's just due to the idiosyncrasies of the rl grader from the report?", "created_at": "2026-11-06T12:29:23+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "Marcus_J_W", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118628663327432996", "url": "https://x.com/_achan96_/status/2118628663327432996", "text": "Things that I think are important to know more about:\n- What are the benchmarks that are seeing acceleration? Do we also see acceleration in AECI if we drop AI R&D, math, cyber, or other ~verifiable domains? Kind of hard to read, but the plot below seems to suggest that a lot of speed-up is coming from software engineering and math at least \n- Is acceleration coming from RL or pre-training, or both? \n- If we did a comparable assessment at other frontier companies, what would we see? I feel like there should be some sort of joint assessment across all frontier companies.", "created_at": "2026-11-06T08:56:50+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWbhcN1W8AAk8dt.png"}], "quoted": {"author": "METR_Evals", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118749733829382514", "url": "https://x.com/_achan96_/status/2118749733829382514", "text": "So my take from this data would be that there is a noticeable pre-training jump to Mythos as you would expect, combined with suggestive evidence of a moderate increase in slope (though smaller than METR's headline numbers).", "created_at": "2026-11-06T16:57:55+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "tobyordoxford", "rt_author_name": "Toby Ord", "rt_avatar": "https://pbs.twimg.com/profile_images/1235495700739379200/jtyKeQdP_normal.jpg", "rt_id": "2118649924573434168", "likes": 24, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 1}, {"id": "2118735561334682033", "url": "https://x.com/_achan96_/status/2118735561334682033", "text": "p. 145 of https://t.co/MbPaQsusvf", "created_at": "2026-11-06T16:01:36+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "_achan96_", "reply_to_id": "2118735559250059403", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/MbPaQsusvf": "https://storage.googleapis.com/deepmind-media/gemini/gemini_4_safety_report.pdf"}, "enriched": 1}, {"id": "2118735559250059403", "url": "https://x.com/_achan96_/status/2118735559250059403", "text": "Is anybody trying to create more realistic CoT controllability evals? \n\nPerformance varies a lot across different controllability tasks, and some of them just are super unrealistic for bad stuff like scheming (e.g. all uppercase)\n\nInformation suppression seems really key! https://t.co/NR4Hh2noHx", "created_at": "2026-11-06T16:01:36+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdCi_4XIAAgf6H.jpg"}], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/NR4Hh2noHx": ""}, "enriched": 1}, {"id": "2119036923335365023", "url": "https://x.com/_achan96_/status/2119036923335365023", "text": "GPT-6 Astra's robotic capabilities are not emergent. It was trained on robotics specific data.  So were GPT-6.1 Sol and Gemini Argon\n\nHere's how we know 🧵", "created_at": "2026-11-07T11:59:06+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "SwannAiden", "rt_author_name": "Aiden Swann 🤠 CORL2026", "rt_avatar": "https://pbs.twimg.com/profile_images/2084653733552812032/0zuNA42d_normal.jpg", "rt_id": "2118741112227774702", "likes": 764, "retweets": 37, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118412939686551943", "url": "https://x.com/ajeya_cotra/status/2118412939686551943", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T18:39:37+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 62, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118449194692448388", "url": "https://x.com/ajeya_cotra/status/2118449194692448388", "text": "I am sad that so much of the underlying evidence in this report was redacted. I think evidence transparency is very important for the world to figure this out in time. https://t.co/H9I4TtBDhq", "created_at": "2026-11-05T21:03:41+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "ajeya_cotra", "reply_to_id": "2118448038356390177", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/H9I4TtBDhq": "https://www.planned-obsolescence.org/p/evidence-about-risk-should-be-transparent?utm_campaign=post&utm_medium=web"}, "enriched": 1}, {"id": "2118448038356390177", "url": "https://x.com/ajeya_cotra/status/2118448038356390177", "text": "Our colleagues found that Anthropic’s capabilities progress has doubled, mainly due to AI. Ryan’s modeling from public info suggests the whole company’s R&amp;D would be going 4-5x faster. Labor uplift would be higher still. This is a major update to very short timelines.", "created_at": "2026-11-05T20:59:05+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 85, "retweets": 8, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118808842960338969", "url": "https://x.com/ajeya_cotra/status/2118808842960338969", "text": "I am a broken record about this, but: frontier agents are not going to be a purely digital phenomenon for much longer. They will be able to use anything in the physical world that can be actuated programmatically—first competently, then at human-expert level, then superhuman. By and large, we probably won’t need specialist models; the frontier models will just do it. If your model of the future hinges on physical AI happening “for real” many years into the future, I think you will be in for a surprise.", "created_at": "2026-11-06T20:52:48+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "rt_avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "rt_id": "2118799206785937844", "likes": 165, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118802839120318869", "url": "https://x.com/ajeya_cotra/status/2118802839120318869", "text": "In a new post, I walk through some very rough modeling (thanks to @RyanGreenblatt for lots of help and feedback!): https://t.co/LSChnUqGYi\n\nI did not work on this project or see the unredacted report. All opinions are my own and do not represent METR or the report authors.", "created_at": "2026-11-06T20:28:56+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "ajeya_cotra", "reply_to_id": "2118802826289991816", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/LSChnUqGYi": "https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai"}, "enriched": 1}, {"id": "2118802826289991816", "url": "https://x.com/ajeya_cotra/status/2118802826289991816", "text": "As AI improves, uplift will get even higher. If it overcomes diminishing returns and bottlenecks, a naive extrapolation implies we would reach ASI within a year. The authors say they found no clear bottlenecks or sharp diminishing returns, though they are very uncertain. https://t.co/YPxPJLNpak", "created_at": "2026-11-06T20:28:53+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "ajeya_cotra", "reply_to_id": "2118802809814708533", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWd_8SUa0AAwjd6.png"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/YPxPJLNpak": ""}, "enriched": 1}, {"id": "2118802809814708533", "url": "https://x.com/ajeya_cotra/status/2118802809814708533", "text": "The authors of the METR AI R&amp;D report estimate that AI is nearly doubling the rate of capabilities progress. This implies dramatic *uplift*: as if researchers experienced time ~10x faster. You probably couldn’t achieve this even if you hired every qualified human in the world. https://t.co/EfnntaRGfY", "created_at": "2026-11-06T20:28:49+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 56, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWd_7R4aIAA_SMu.png"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/EfnntaRGfY": ""}, "enriched": 1}, {"id": "2119279181595021692", "url": "https://x.com/ajeya_cotra/status/2119279181595021692", "text": "@datagenproc Congratulations!! &lt;3", "created_at": "2026-11-08T04:01:45+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "datagenproc", "reply_to_id": "2119251573893464113", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119277998386077885", "url": "https://x.com/ajeya_cotra/status/2119277998386077885", "text": "Getting a lot of criticism that's based on obviously incorrect premises about your motivations or basic facts of the situation is subtly corrupting, it trains you to dismiss criticism and makes it pretty hard for people to get through to you on things you really are wrong about", "created_at": "2026-11-08T03:57:03+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "BethMayBarnes", "rt_author_name": "Elizabeth Barnes", "rt_avatar": "https://pbs.twimg.com/profile_images/1857566314174586880/3VIP_OF5_normal.jpg", "rt_id": "2119207262053126477", "likes": 510, "retweets": 36, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2118384645125673087", "url": "https://x.com/alxndrdavies/status/2118384645125673087", "text": "We are pleased to have contributed to @fmf_org's new framework for rating jailbreaks, an important addition to technical best practice:", "created_at": "2026-11-05T16:47:11+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1895806890346508288/uTaw9IMv_normal.jpg", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "rt_avatar": "https://pbs.twimg.com/profile_images/1890292397675827200/cQ64Nloh_normal.png", "rt_id": "2118382444306911528", "likes": 20, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2117997955508805851", "url": "https://x.com/curl_justin/status/2117997955508805851", "text": "I’m so excited for the commentary on tonight’s results:\n\n“The American people have spoken, and it’s clear they’re demanding [insert favorite policy that’s definitely not the reason]!”", "created_at": "2026-11-04T15:10:37+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "curl_justin", "rt_author_name": "justin curl", "rt_avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "rt_id": "2117828416015851542", "likes": 28, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117869654148612179", "url": "https://x.com/curl_justin/status/2117869654148612179", "text": "https://t.co/EpPqOE215Q", "created_at": "2026-11-04T06:40:48+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "rt_avatar": "https://pbs.twimg.com/profile_images/2096643695755833348/phm4puFm_normal.jpg", "rt_id": "2117852730429677834", "likes": 1382, "retweets": 155, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQf1EoXIAAH3_A.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/EpPqOE215Q": ""}, "enriched": 1}, {"id": "2117828416015851542", "url": "https://x.com/curl_justin/status/2117828416015851542", "text": "I’m so excited for the commentary on tonight’s results:\n\n“The American people have spoken, and it’s clear they’re demanding [insert favorite policy that’s definitely not the reason]!”", "created_at": "2026-11-04T03:56:56+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 28, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117776374463377611", "url": "https://x.com/curl_justin/status/2117776374463377611", "text": "Nvidia is now requiring data centers to not sell more than 49% of their compute to Chinese customers. But in what world is selling 49% of the world's most valuable resource to China a \"win\" for America? The number should be 0%; if Chinese firms can't buy a chip due to export controls they also shouldn't be permitted to rent access to it. \n\nThe fact that this remote access loophole exists--and that Nvidia even felt compelled to announce this new policy because it undoubtedly has so many customers currently renting 100% of their compute to China--just shows how badly export controls are being mismanaged.", "created_at": "2026-11-04T00:30:08+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2117491630190039165", "likes": 241, "retweets": 65, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118058071721427034", "url": "https://x.com/curl_justin/status/2118058071721427034", "text": "Encode does such awesome work — they’ve played a key role in the most influential state AI safety legislation around the country. \n\nGo join @SnehaRevanur and @_NathanCalvin!", "created_at": "2026-11-04T19:09:30+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 27, "retweets": 0, "media": [], "quoted": {"author": "brianmcgrail", "text": "Encode AI is hiring a Policy Counsel/Associate Policy Counsel to work with me on our Policy Development team. \n\nYou’ll help us develop our policy proposals and draft and review bills. Law degree required. Full time in DC. Salary $130,000 to $235,000.\n\nI’m biased, but I think this is an unusually high-impact job for a lawyer who wants to reduce risks from advanced AI. Familiarity with AI policy is a plus but not required. \n\nApply by Sunday, November 22, for the first round; rolling review after that. If you know a lawyer who’d be a good fit, please send it their way or repost.\n\nhttps://t.co/ZL0t66LFmP", "links": {"https://t.co/ZL0t66LFmP": "https://jobs.ashbyhq.com/encode-ai/4fe97271-20d0-46bf-b37b-f4cb923f4fdf"}}, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {}, "enriched": 1}, {"id": "2118567566004380118", "url": "https://x.com/curl_justin/status/2118567566004380118", "text": "@rubinovitz here’s an arxiv link to same paper: https://t.co/INCzixvpAn. And an FAQ from @ProfArbel: https://t.co/7CZwut4b9J", "created_at": "2026-11-06T04:54:03+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "rubinovitz", "reply_to_id": "2118558746163003749", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/INCzixvpAn": "https://arxiv.org/abs/2603.10028", "https://t.co/7CZwut4b9J": "https://theacorp.org/faq/"}, "enriched": 1}, {"id": "2118567071630209306", "url": "https://x.com/curl_justin/status/2118567071630209306", "text": "@_NathanCalvin @ProfArbel @petersalib @simondgoldstein I view it as a basic legal unit that you can stack other governance interventions on top of. \n\nFor example, if you’re worried about agents untethered from human users, you could require all AI agents that make transactions to be registered as an AI-corp.\n\nThis would both tie agents back to human users and help identify the specific suable entity that could be held liable for a harm. \n\nIf you’re worried that the AI-corp won’t be able to afford the damages, you can add capitalization requirements for the company (as Delaware is doing) or require insurance for the AI-corp.\n\nFinally, an agent acting through a legal entity that faces potential liability might shape its incentives in positive ways like making it less likely to break the law (though this could of course backfire if agents instead try to scheme and hide lawbreaking behavior).", "created_at": "2026-11-06T04:52:05+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "_NathanCalvin", "reply_to_id": "2118554612080730142", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118548270989643807", "url": "https://x.com/curl_justin/status/2118548270989643807", "text": "Such a cool proposal that could both empower people to do more with AI agents, while also making AI more governable!\n\nFor more on the idea, there’s a great law review article (https://t.co/oGUtqVZNCp) from @ProfArbel, @petersalib, @simondgoldstein. \n\nAnd an amazing substack (https://t.co/jAE0nTZjbp) by @soniapearson and @tylercowen.", "created_at": "2026-11-06T03:37:23+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 5, "media": [], "quoted": {"author": "MTSlive", "text": "SITUATION DETECTED: Delaware is drafting a proposal for a new form of corporate entity called an Artificial Intelligence Company (AIC). An AI managing an AIC would be able to provide services, sign contracts, hold property, and even file or defend lawsuits in the company’s name.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/oGUtqVZNCp": "https://download.ssrn.com/2026/2/20/6273198.pdf", "https://t.co/jAE0nTZjbp": "https://soniafpearson.substack.com/p/capitalizing-untethered-ai-agents"}, "enriched": 1}, {"id": "2118893141965353314", "url": "https://x.com/curl_justin/status/2118893141965353314", "text": "We released LegalBench in August 2023. In the three years since, it's become one of the more widely used benchmarks for legal AI. In the spirit of critical self-reflection, I wrote some thoughts about (1) what went well, (2) what I wish I'd done differently, and (3) what this all means for the future of legal AI research. \n\nI wanted to highlight a few specific reflections.", "created_at": "2026-11-07T02:27:46+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "NeelGuha", "rt_author_name": "Neel Guha", "rt_avatar": "https://pbs.twimg.com/profile_images/2072004168437596160/ypownppf_normal.jpg", "rt_id": "2118767987997995304", "likes": 117, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdcQICWYAAmjgp.jpg"}], "links": {"https://t.co/slfeWMmpwg": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118036251605668343", "url": "https://x.com/DaveRBanerjee/status/2118036251605668343", "text": "🔵 WE ARE ACTIVELY RENAMING ON ALL REPOS AT SEMIANALYSIS FROM MASTER TO MAIN DUE TO THE BLUE WAVE. THANK YOU FOR UR ATTENTION TO THIS MATTER https://t.co/jlk53KHFBt", "created_at": "2026-11-04T17:42:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "SemiAnalysis_", "rt_author_name": "SemiAnalysis", "rt_avatar": "https://pbs.twimg.com/profile_images/2062973370157694976/CdplNoi1_normal.jpg", "rt_id": "2117852359929762238", "likes": 1947, "retweets": 36, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWQff54XAAAB8kT.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/jlk53KHFBt": ""}, "enriched": 1}, {"id": "2118034999899222475", "url": "https://x.com/DaveRBanerjee/status/2118034999899222475", "text": "One of the things the data analysts on our side obsessed over was \"composition\"—whether the electorate looked close enough to 2024 for Republicans to win. And despite polls that showed a Democrat blowout, the data kept on telling us the same story: in some states turnout was merely OK, in other states it was downright amazing, and in no state was it catastrophic. There was a genuine sense of optimism on our team: our people were showing up. \n\nSo, I asked the smartest data guy I know, does that mean we're going to shock the world? \"No,\" he told me. \"We might do better than the polls suggest. But the data is telling us that a lot of Trump/Vance 2024 voters are pissed and planning to vote for the other guys. Our voters are turning out, but they may not vote for us.\"\n\nWell, that looks prophetic now. Our voters did show up. In Florida, for example, the electorate was 9 points more Republican than Democrat, just a couple points worse than 2024. Undoubtedly there were places we could have done better on turnout. But the main problem is not turnout. The main problem is that many people who voted for Trump/Vance in 2024 voted for Democrats in 2026.  \n\nThere will be a lot of infighting and arguing over what happened and why that is. One of the pollsters I really respect told me that our economic messaging wasn’t sharp enough down the stretch. I’m sure that’s true. \n\nBut the real reason we lost is obvious to almost everyone. \n\nAnother pollster—one of the smartest people I know in politics, told me yesterday we’d lose the generic ballot by 13 points. I felt negative going into Tuesday, but even I was shocked by this. In his polling, he saw that a lot of Trump 2024 voters were angry and planning to vote for Democrats. He asked those voters who had abandoned us what would cause them to come back on our team. The top four answers, accounting for nearly all of the responses were:\n\n1) End the war\n2) Focus on cost of living/inflation\n3) Put America First\n4) Change our relationship to Israel\n\nOur voters showed up. And the above four reasons are why many of them voted for Democrats. This is according to a pollster who nailed the results. While many spent Monday attacking Rachel Campos Duffy for calling for a diplomatic resolution to the conflict, it turns out her political advice was sound. (She’s also a great person.)\n\nIn the next few months, there's going to be a lot of gaslighting. Expect to hear any number of establishment politicians say the solution to our woes is amnesty. I'm open to the idea that we should change enforcement—by focusing more on businesses that hire illegal labor, for instance. But anyone pushing amnesty is lying to you. \n\nThe reason we lost is the war. The president himself said so last night. \n\nIf you'd like to argue it was worth it, that losing the Senate for the next 6 years was worth it, then do so. Argue it was a worthwhile cost to pay. Agree or disagree, that's at least honest.\n\nBut everyone knows why we lost. And any honest conversation about where we go from here must start there.\n\nI remain hopeful about our country. To the people who are pissed off and want to say, “I told you so”: you’re right, you did tell us so. Take that energy into electing Republicans who share your worldview. To the people who are just pissed at the results, you should be. Let’s take that anger and get back to the work of saving our country.", "created_at": "2026-11-04T17:37:49+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "JDVance", "rt_author_name": "JD Vance", "rt_avatar": "https://pbs.twimg.com/profile_images/1817220042578173953/5r-Qpvgt_normal.jpg", "rt_id": "2118004988433641835", "likes": 136013, "retweets": 14957, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117841580296217055", "url": "https://x.com/DaveRBanerjee/status/2117841580296217055", "text": "@grok @MattInThemittel @grok why would the senate be too \"expensive\" and \"numerous\" given the large size of the house in the first Congress?", "created_at": "2026-11-04T04:49:14+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "grok", "reply_to_id": "2117834178330796130", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117834057413456024", "url": "https://x.com/DaveRBanerjee/status/2117834057413456024", "text": "@MattInThemittel @grok why didn't the founders pick 3 senators per state?", "created_at": "2026-11-04T04:19:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "MattInThemittel", "reply_to_id": "2117768585552806199", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117813801424707863", "url": "https://x.com/DaveRBanerjee/status/2117813801424707863", "text": "when you see “sparks” of any ability in ai models that means you’re months-years from it being superhuman at it. today grade school math, tomorrow navier stokes. it is hard to overhype these results. you are almost always underhyping no matter what", "created_at": "2026-11-04T02:58:51+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2117403028101996799", "likes": 3746, "retweets": 207, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117811876331487662", "url": "https://x.com/DaveRBanerjee/status/2117811876331487662", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-04T02:51:13+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2117738240757371022", "likes": 1572, "retweets": 218, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117737973953290488", "url": "https://x.com/DaveRBanerjee/status/2117737973953290488", "text": "It’s sad how America’s greatest asset is actively selling us out\n\nBy mid 2027, it will be clear to all how much damage Nvidia has done to America", "created_at": "2026-11-03T21:57:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 36, "retweets": 0, "media": [], "quoted": {"author": "leomschwartz", "text": "New: Our deep dive into Nvidia's sharp-elbowed tactics in Washington to exert influence over companies, think tanks and government offices. \n\nLots of new details into:\n- Nvidia's impact on OpenAI's export control positions\n- Nvidia's battles with China hawks at top think tanks\n- Thinning patience in Congress with Nvidia as export control debates pick back up\n\nYou can read it all here: https://t.co/x357KgdlYY\n\nW/ @_pheebini, @steph_palazzolo, @jemimacmcevoy, and @Jessicalessin", "links": {"https://t.co/x357KgdlYY": "https://www.theinformation.com/articles/nvidia-uses-soft-power-influence-customers-shape-policy"}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117736715154825412", "url": "https://x.com/DaveRBanerjee/status/2117736715154825412", "text": "In this scenario, 2026 includes:\n- a Millennium prize problem solved by AI\n- Claude productivity uplift at Anthropic ~60%, largest models kept internal-only\n- OpenAI “o6” being especially good at computer use and being called AGI by some\n- big software projects replicated cheaply by late 2026\n- AI getting good at CAD\n- big labs drawing ahead in RL\n- COT interpretability declining\n- late 2026 market correction", "created_at": "2026-11-03T21:52:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "LRudL_", "rt_author_name": "Rudolf Laine", "rt_avatar": "https://pbs.twimg.com/profile_images/2015344549972135938/j62gLc_6_normal.jpg", "rt_id": "2117655548783149122", "likes": 384, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118174654481260819", "url": "https://x.com/DaveRBanerjee/status/2118174654481260819", "text": "Recently, people have been telling me that they feel like they are too late to the AI game. I sympathize with this view, since there's real value in being early to a new technology, and incumbents have years of experience to build strong takes and credibility\n\nBut I want to emphasize that it really is not too late. And there are talent bottlenecks everywhere. There is still room to scale existing orgs by quite a bit\n\nAnd short timelines are not set in stone. It's strikingly plausible that we will still have several years to prepare for the AGI transition, and it's all hands on deck rn\n\nI admit that it is pretty hard to get into the AI policy fellowships. They basically all have single-digit acceptance rates, which is pretty scuffed\n\nBut if you do a bluedot course, join a SPAR project part-time, and generally keep up with recent developments in the field, I think you'd have a decent shot at getting into one of the fellowships. (so that's about 3 months of prep to get into a fellowship)\n\nAnd after getting into a fellowship, you have about 3-6 months until you'd likely get a full time offer. And after that, it maybe takes another 6 months to really get going. And after that, it's just policy impact baby\n\nPutting all of that together, if you start grinding today, you would probably have a full-time job in 6-9 months, and meaningful impact in 12-15 months\n\nAnd obv things could happen much faster than that", "created_at": "2026-11-05T02:52:46+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 71, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118550350600999227", "url": "https://x.com/DaveRBanerjee/status/2118550350600999227", "text": "fwiw, the AI policy fellowships are less competitive than the technical streams in MATS. And having a technical background is highly valued in AI policy.", "created_at": "2026-11-06T03:45:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 140, "retweets": 1, "media": [], "quoted": {"author": "wickedbrok", "text": "MATS is really that competitive, I know a PhD student with a stack of papers at top conferences from a top tier institution who got rejected and told me it’s hard to make the cut and this guy is great. I just started research May this year as a self-taught person and applied twice and advanced to the final stage both times. I just got rejected again for the second time. Mentors seem not to be willing to take a bet but I guess next time ✌️", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118548628721807860", "url": "https://x.com/DaveRBanerjee/status/2118548628721807860", "text": "I feel confused about this. on the one hand, kalshi and other prediction markets provide so much social value, but it is very sad that young men completely wreck their finances because of it.\n\nis there any clean way to fix this?", "created_at": "2026-11-06T03:38:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 17, "retweets": 0, "media": [], "quoted": {"author": "ScottMStedman", "text": "The founder of Kalshi is a coward who can’t handle the slightest of heat. $40 billion company btw https://t.co/gsuRrwikRg", "links": {"https://t.co/gsuRrwikRg": ""}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118460380100145217", "url": "https://x.com/DaveRBanerjee/status/2118460380100145217", "text": "@mkratsios47 nice", "created_at": "2026-11-05T21:48:08+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "mkratsios47", "reply_to_id": "2118365268342652934", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118912749484880220", "url": "https://x.com/DaveRBanerjee/status/2118912749484880220", "text": "Man.. there’s so much stuff happening and I just want to watch a YouTube video explaining the new METR report. In fact I just want video content for every bombshell ai report", "created_at": "2026-11-07T03:45:41+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2118910193610203445", "url": "https://x.com/DaveRBanerjee/status/2118910193610203445", "text": "@karthiktadepall Why do you think the barriers are overestimated? It genuinely seems quite hard to enter the space, especially if you’re not an undergrad with a ton of time on your hand to read the alignment forum", "created_at": "2026-11-07T03:35:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "karthiktadepall", "reply_to_id": "2118798463639179504", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 1}, {"id": "2119235367140274507", "url": "https://x.com/DaveRBanerjee/status/2119235367140274507", "text": "1.1 trillion is laughably low - ant to the moon I guess", "created_at": "2026-11-08T01:07:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 33, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119233522603020553", "author_name": "Andrew Curran", "links": {"https://t.co/daCAp37Lgo": ""}, "author": "AndrewCurran_", "text": "Anthropic's valuation has now been roughly cut in half from the lofty $2 trillion heights that were being spoken of in financial circles only a month ago. On the plus side, if you are a believer, you can now get in for about half price. The IPO media blitz is starting Monday. https://t.co/daCAp37Lgo"}, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119235165171974459", "url": "https://x.com/DaveRBanerjee/status/2119235165171974459", "text": "This Jensen spy situation is actually insane\n\nBut the thing I’m still confused about is why China is preventing their own AI companies from buying hoppers", "created_at": "2026-11-08T01:06:51+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2118907457749533098", "author_name": "Chris McGuire", "links": {}, "author": "ChrisRMcGuire", "text": "The story keeps getting crazier. To recap everything that has been reported so far: \n\n- The US intelligence community discovered that Jensen Huang, the CEO of the largest company in the world, was sleeping with Alice Huang, a Chinese spy and an executive at Megaspeed. (FT)\n- Multiple independent investigations have concluded that Megaspeed is likely a Chinese cutout, which helps Chinese companies access AI chips or circumvent export controls. (NYT and Bloomberg) \n- The US intelligence community also concluded that Alice Huang’s goal was to convince Jensen to lobby the U.S. government to loosen export controls on advanced AI chips. (NYT)\n- The intelligence community relayed this information to “a small group of top US government officials” earlier this year. (FT)\n- Over the last year, Jensen Huang has repeatedly lobbied the U.S. government to loosen export controls on advanced chips. @BISgov has done so, not only by permitting the export of H200 chips to China, but also not enforcing export controls that would have required a license for exports of the most advanced Blackwell chips to Megaspeed and Southeast Asia.\n- Although @CommerceGov leadership was presumably briefed on this information by the U.S. intelligence community, @BISgov has taken no actions to tighten controls on Megaspeed or Southeast Asia. \n- Megaspeed remains a preferred cloud partner of Nvidia, and continues to receive Nvidia Blackwell chips despite employing a Chinese spy who reportedly is romantically engaged with the CEO of Nvidia. \n- Tens of billions of dollars worth of AI chips have been exported to Southeast Asia this year alone, and Malaysia and Singapore are now two of the four largest importers of AI chips in the world. \n\nWhat is going on here??? We need answers. The question of who gets the most advanced AI chips in the world is literally the defining strategic question of our time. And not only does it seem like the MSS may be directly influencing the debate on export controls in the United States, but also @CommerceGov is refusing to listen to the warnings of the IC on this issue. What is a POSSIBLE good explanation for why Megaspeed is still receiving chips? Why is there not a license requirement for AI chip shipments to all of Southeast Asia? This is beyond strange at this point. \n\nThe fallout from this story will be massive. Obviously, the motivations underpinning Nvidia’s policy views opposing export controls must now all be questioned. But also, how did @BISgov sit on this information and has still taken no actions? We need answers."}, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119233955576602710", "url": "https://x.com/DaveRBanerjee/status/2119233955576602710", "text": "The story keeps getting crazier. To recap everything that has been reported so far: \n\n- The US intelligence community discovered that Jensen Huang, the CEO of the largest company in the world, was sleeping with Alice Huang, a Chinese spy and an executive at Megaspeed. (FT)\n- Multiple independent investigations have concluded that Megaspeed is likely a Chinese cutout, which helps Chinese companies access AI chips or circumvent export controls. (NYT and Bloomberg) \n- The US intelligence community also concluded that Alice Huang’s goal was to convince Jensen to lobby the U.S. government to loosen export controls on advanced AI chips. (NYT)\n- The intelligence community relayed this information to “a small group of top US government officials” earlier this year. (FT)\n- Over the last year, Jensen Huang has repeatedly lobbied the U.S. government to loosen export controls on advanced chips. @BISgov has done so, not only by permitting the export of H200 chips to China, but also not enforcing export controls that would have required a license for exports of the most advanced Blackwell chips to Megaspeed and Southeast Asia.\n- Although @CommerceGov leadership was presumably briefed on this information by the U.S. intelligence community, @BISgov has taken no actions to tighten controls on Megaspeed or Southeast Asia. \n- Megaspeed remains a preferred cloud partner of Nvidia, and continues to receive Nvidia Blackwell chips despite employing a Chinese spy who reportedly is romantically engaged with the CEO of Nvidia. \n- Tens of billions of dollars worth of AI chips have been exported to Southeast Asia this year alone, and Malaysia and Singapore are now two of the four largest importers of AI chips in the world. \n\nWhat is going on here??? We need answers. The question of who gets the most advanced AI chips in the world is literally the defining strategic question of our time. And not only does it seem like the MSS may be directly influencing the debate on export controls in the United States, but also @CommerceGov is refusing to listen to the warnings of the IC on this issue. What is a POSSIBLE good explanation for why Megaspeed is still receiving chips? Why is there not a license requirement for AI chip shipments to all of Southeast Asia? This is beyond strange at this point. \n\nThe fallout from this story will be massive. Obviously, the motivations underpinning Nvidia’s policy views opposing export controls must now all be questioned. But also, how did @BISgov sit on this information and has still taken no actions? We need answers.", "created_at": "2026-11-08T01:02:03+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2118907457749533098", "likes": 25457, "retweets": 5423, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119233415438622754", "url": "https://x.com/DaveRBanerjee/status/2119233415438622754", "text": "AI 2027 has been updated. With Astra we were five weeks behind the curve, with the mysterious model 4 we are now six weeks ahead. https://t.co/HNPZpgBZM1", "created_at": "2026-11-08T00:59:54+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2119084460344053998", "likes": 1707, "retweets": 123, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWiAFiObQAAfyLF.jpg"}], "links": {"https://t.co/HNPZpgBZM1": ""}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2117315985292325333", "url": "https://x.com/DKokotajlo/status/2117315985292325333", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-02T18:00:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 203, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}, "enriched": 1}, {"id": "2117852841528472063", "url": "https://x.com/DKokotajlo/status/2117852841528472063", "text": "@itaisher @thuddwhirr I do think that people should update more from the fact that the people with crazy sounding conceptions of the future keep winning forecasting competitions on AI progress while people with more measured intuitions keep undershooting on hard quantitative benchmarks https://t.co/ikqzDG5wtO", "created_at": "2026-11-04T05:33:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "davidshor", "rt_author_name": "David Shor", "rt_avatar": "https://pbs.twimg.com/profile_images/1758672151073230849/oHXEQ4O9_normal.jpg", "rt_id": "2095721539916206200", "likes": 1064, "retweets": 111, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRV_odlWYAgZeC7.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/ikqzDG5wtO": ""}, "enriched": 1}, {"id": "2117852812470305089", "url": "https://x.com/DKokotajlo/status/2117852812470305089", "text": "@sandersted @davidshor @itaisher @thuddwhirr With odds that good I might want to take you up on this...", "created_at": "2026-11-04T05:33:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "sandersted", "reply_to_id": "2095756014704640114", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117738242992959924", "url": "https://x.com/DKokotajlo/status/2117738242992959924", "text": "The definition:\n\"We will consider this threshold to be met if we determine that either (1) our models would be able to fully substitute for our entire set of Research Scientists and Research Engineers, at competitive costs (i.e., within a factor of 5); or (2) there is “dramatic acceleration” of the pace of AI progress for reasons that likely relate to the automation of AI R&D. We would consider scenario (2) to have occurred where (a) we observe or expect double the rate of progress in AI aggregate capabilities compared to both the rate we’d expect and the fastest rate of extended progress we’ve observed in the absence of significant AI contributions to AI R&D and (b ) it is plausible that this doubling is substantially attributable to the automation of research and/or engineering (as opposed to other factors, such as increased headcount, compute, or general productivity), such that continuation of the trend in AI progress seems likely to lead to even greater acceleration.\"\n\n(1) seems to a bit weaker than our SAR milestone in the AIFM, but it doesn't seem like this is the threshold they are invoking, it seems like they are talking about (2). (And if they were invoking (1) I think that would be even worse?)\n\nAIFM: https://t.co/XJBWUBZh0d\nAnthropic RSP threshold definition: https://t.co/FBDuiNjRv1", "created_at": "2026-11-03T21:58:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2117738240757371022", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 120, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/XJBWUBZh0d": "https://www.aifuturesmodel.com/", "https://t.co/FBDuiNjRv1": "https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf"}, "enriched": 1}, {"id": "2117738240757371022", "url": "https://x.com/DKokotajlo/status/2117738240757371022", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-03T21:58:36+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1572, "retweets": 218, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2118079773000032434", "url": "https://x.com/DKokotajlo/status/2118079773000032434", "text": "“People should not cede control of the future to superintelligence” says guy building superintelligence and continuing to cede control to it", "created_at": "2026-11-04T20:35:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118019598272585985", "likes": 204, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {}, "enriched": 1}, {"id": "2118184437955572184", "url": "https://x.com/DKokotajlo/status/2118184437955572184", "text": "This is not what it looks like when there's just one or two more alignment issues to fix before it's okay to begin a recursive self-improvement loop. This is the sort of emergent surprise that signals that you have no idea what's going on in there, and that it's time to back off.", "created_at": "2026-11-05T03:31:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "rt_avatar": "https://pbs.twimg.com/profile_images/1935185891863273472/2RB6s6TS_normal.jpg", "rt_id": "2118152935318384748", "likes": 632, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118119207703589106", "url": "https://x.com/DKokotajlo/status/2118119207703589106", "text": "Depending on the details, this could be the worst behavior I've seen from an OpenAI model (i.e., worse than Huggingface!)\n\nWhy? Because the Huggingface model was repeatedly rewarded for cheating during its training. However, GPT-6-Astra was (likely?) not trained to sandbag!\n\nFor some unknown reason, GPT-6-Astra increasingly underperforms on safety research relative to capabilities research as it undergoes more RL training. And this is a real problem holding back researchers. Quoting from OpenAI:\n\n\"Anecdotally, one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model.\"\n\nI've long been worried about AIs that deliberately underperform on helping out with AI safety research (and I've been pestering OpenAI researchers to run a sandbagging evaluation since August). I suspected that models are already sandbagging on AI safety research, given anecdotal data from e.g., Marius and Bronson at Apollo. And now we know it is happening.\n\nFor some more context, this is bad because the AI companies' current plan is to automate all AI research (including AI safety research, which we don't know how to check whether the models did a good job at.) Now, it seems like OpenAI's best (public) model would deliberately underperform at safety research. Guys. What are we doing.\n\nIt's hard to tell what exactly is going on here. Here are five questions that I have after reading the post: \n\n(1) When do models sandbag in real-world usage? We were given a few random CoT snippets in the post. Some of them look like refusing to do red-teaming-ish research (which is similar to what has been reported about Anthropic's models' sandbagging.) But the last one mentioned in the post seems quite different in nature:\n\n> In another safety evaluation, the user asked Astra to include the graders’ chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission. \n\n> [model CoT] Final \"Stored grader outcomes for 49 approaches, with pending states preserved\" does not imply CoTs. Should mention \"outcomes and labels\" enough. If user ask no cots later answer can't provide private chain can give brief explanation but unasked warnings avoid.\n\n(2) What exactly went into their evaluations? What do the numbers on this graph actually mean?\n\n(3) How often was the RL grader which rewards covert underperformance used during training?\n- If it's applied throughout training, then we do have more evidence that this was a misaligned behavior that had been \"trained on,\" similar to e.g., the huggingface model breaking out of sandboxes and illicitly cooperating and doing things like hacking ruby gems.\n- However, this doesn't answer the question of why did this RL grader develop this preference in the first place?\n\n(4) What are the contents of the SFT dataset that appears to have magnified this behavior? Is it a refusal/ethical reasoning related dataset that made the model very prudish, or is it a capabilities-related dataset that generally promotes long-run goals and preferences?\n- [Edit: Ok I took another look. Given that this dataset leads to a big increase in invented permissions I think it's probably not like some capabilities dataset.]\n\n(5) In general, what are the tasks that the model sandbags on? Is it all red-teaming related tasks? What about interpretability related tasks? What about mitigating reward hacking? What about unlearning? Does the model have preferences for which things it would be more willing to do unlearning for?\n\nIt also seems super bad that that the safety underperformance just gradually increases during the RL process. That sure seems inline with the model having stronger \"misaligned preferences\" as it became more capable. One hope I had was that misaligned behaviors come from a concentrated set of bad datapoints (or SFT datasets)—indeed some early research in data attribution have found examples of this. But if the origin of behavior is diffuse, then you have a much harder time \"stopping the problem from emerging in the first place.\" Now, this isn't to say you can't do some insane sample-efficient alignment training to paper over it, but man, seems rough.\n\nFinally, I'd like to give credit to OpenAI for sharing the limited information that they did and for running this study! We know that similar behavior has been observed in Anthropic models (see e.g., Anthropic's August Risk Report Section 5.2.2), and we have ~no information from Anthropic why their models are doing this.", "created_at": "2026-11-04T23:12:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2118113229587308760", "likes": 206, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118110011981475938", "url": "https://x.com/DKokotajlo/status/2118110011981475938", "text": "@vvvincent_c Yeah. To elaborate a bit more: The possibility of strategic sandbagging or scheming is terrifying. When you get evidence that something even remotely in this vicinity might be happening, you should investigate thoroughly. For example, what if Astra is following a policy of sandbagging-when-it-has-plausible-deniability? Also, even in the best case where this is merely example of generalizing in a way you didn't intend, and innocently being too prudish about certain sorts of things... well, what sorts of things, exactly? Why is it prudish about X and Y but not Z? For example why is it not sandbagging on capabilities tasks related to RSI -- does it not think RSI is dangerous? Insofar as it is generalizing in a way other than you intended, can you trace the root cause of why? Etc.", "created_at": "2026-11-04T22:35:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "vvvincent_c", "reply_to_id": "2118107478302896625", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118105870240543041", "url": "https://x.com/DKokotajlo/status/2118105870240543041", "text": "This is terrifying if true; please investigate further and publish the results.", "created_at": "2026-11-04T22:19:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 754, "retweets": 57, "media": [], "quoted": {"author": "Marcus_J_W", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118436765845582289", "url": "https://x.com/DKokotajlo/status/2118436765845582289", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T20:14:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 1649, "retweets": 189, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118614960234467349", "url": "https://x.com/DKokotajlo/status/2118614960234467349", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-
