_at": "Sat Nov 07 11:40:51 +0000 2026"}]}, {"id": "2119026069709713848", "url": "https://x.com/robertwiblin/status/2119026069709713848", "text": "https://t.co/7kGwTCizDd", "created_at": "2026-11-07T11:15:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2119025917054107912", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/7kGwTCizDd": "https://www.ft.com/content/a55a2a22-4479-4f93-a445-6147a5c6d790?syn-25a6b1a6=1"}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "parent": {"id": "2119025917054107912", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "I would simply not have a romantic relationship with a Chinese spy. https://t.co/IyXtHhOkgW", "links": {"https://t.co/IyXtHhOkgW": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhKx5wWoAA48GX.jpg"}], "url": "https://x.com/robertwiblin/status/2119025917054107912", "created_at": "Sat Nov 07 11:15:22 +0000 2026"}}, {"id": "2119025917054107912", "url": "https://x.com/robertwiblin/status/2119025917054107912", "text": "I would simply not have a romantic relationship with a Chinese spy. https://t.co/IyXtHhOkgW", "created_at": "2026-11-07T11:15:22+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 32, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWhKx5wWoAA48GX.jpg"}], "links": {"https://t.co/IyXtHhOkgW": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "thread": [{"id": "2119026069709713848", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "https://t.co/7kGwTCizDd", "links": {"https://t.co/7kGwTCizDd": "https://www.ft.com/content/a55a2a22-4479-4f93-a445-6147a5c6d790?syn-25a6b1a6=1"}, "media": [], "url": "https://x.com/robertwiblin/status/2119026069709713848", "created_at": "Sat Nov 07 11:15:59 +0000 2026"}]}, {"id": "2119737889558872213", "url": "https://x.com/robertwiblin/status/2119737889558872213", "text": "Now is a good time to revisit some old clips of Jensen trying to mislead people on why it's okay for NVIDIA sell AI chips to China.\n\nThis was the key moment from his interview on @dwarkesh_sp's podcast (time stamp 57:36): \n\n1. Dwarkesh asks why it’s okay to sell NVIDIA chips to China given the national security implications of AI models like Mythos.\n\n2. Jensen gives a misleading answer, arguing that it’s okay to sell American chips to China because China already produces 60% of the world’s chips.\n\n3. But as Jensen definitely knows, compute is measured in flops, not number of chips.\n\n4. Dwarkesh then pushes back, pointing out that on a flops basis, China has 10% of the compute the US has, and giving them more compute would change their cyber capabilities.\n\nThis is a common pattern with Jensen. He's developed talking points that sound plausible to a non-technical audience about why there is no conflict between NVIDIA's financial interests and US national security.\n\nBut on the rare occasion when he's interviewed by someone like Dwarkesh who knows what he's talking about, it immediately becomes obvious that he's spouting nonsense.", "created_at": "2026-11-09T10:24:30+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AlecStapp", "rt_author_name": "Alec Stapp", "rt_avatar": "https://pbs.twimg.com/profile_images/1498170157176393731/tyrdhQ1M_normal.jpg", "rt_id": "2119576839450705969", "likes": 982, "retweets": 202, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWo9TFwWcAAoOm4.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWo9TGbXAAAD7c0.jpg"}], "links": {"https://t.co/aRtYzxXGzG": ""}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119543114222522593", "url": "https://x.com/robertwiblin/status/2119543114222522593", "text": "So Jensen was having an affair with a customer, who also happened to be a Chinese spy, for months.\n\nLied to the board. Lied to journalists.\n\nMeanwhile pushing to sell maximum of cutting edge AI chips to China against advice of ~entire natsec community.\n\nCan't make this shit up.", "created_at": "2026-11-08T21:30:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2192, "retweets": 317, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2117656425438605340", "url": "https://x.com/deanwball/status/2117656425438605340", "text": "@AnthonyMaio Just haven’t had time to engage with it thoroughly and as a general policy I do not comment publicly on things I have not read", "created_at": "2026-11-03T16:33:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AnthonyMaio", "reply_to_id": "2117630747955646508", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117630747955646508", "author_handle": "AnthonyMaio", "author_name": "Anthony Maio", "text": "@deanwball I get why you avoid comment on that work because I think it's being dramatically misrepresented.", "links": {}, "media": [], "url": "https://x.com/AnthonyMaio/status/2117630747955646508", "created_at": "Tue Nov 03 14:51:28 +0000 2026"}}, {"id": "2117405375200993479", "url": "https://x.com/deanwball/status/2117405375200993479", "text": "@AirmetNoah The way I got started was translating state AI legislation into plain English, and it was less than three years ago! This is a good idea and imo the market is still underserved", "created_at": "2026-11-02T23:55:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AirmetNoah", "reply_to_id": "2117403182490148951", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117405081947828619", "url": "https://x.com/deanwball/status/2117405081947828619", "text": "Without commenting on the Takehi et al. “Weight-Space Programming” work in particular, I do suspect that a lot of RSI (and a lot of AI-driven scientific progress more broadly) will be driven by applying what were once mundane-but-difficult techniques at a scale that would have been unimaginable when the techniques were invented.", "created_at": "2026-11-02T23:54:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 178, "retweets": 7, "media": [], "quoted": {"author": "AlexKrentsel", "text": "the way I'm thinking about this - there's a whole body of work of interpretably research from 2010s a la \"look at model, this neuron lights up when image contains dog, so this is the dog neuron\". this seems akin to that, but scaled beyond human capability", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117697164952441069", "url": "https://x.com/deanwball/status/2117697164952441069", "text": "ChatGPT and Codex are helping engineers build for the physical world.\n\nWe’re sharing our progress across mechanical design, electrical engineering, and simulation—from helping our hardware teams iterate faster to testing new workflows with industry collaborators. https://t.co/b3rW9zYJGA", "created_at": "2026-11-03T19:15:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117692475775258785", "likes": 2808, "retweets": 200, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWOOL0QWwAA5B61.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {"https://t.co/b3rW9zYJGA": ""}, "enriched": 3}, {"id": "2118011911770136592", "url": "https://x.com/deanwball/status/2118011911770136592", "text": "@dwallacewells Agreed.", "created_at": "2026-11-04T16:06:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "dwallacewells", "reply_to_id": "2118011002696487018", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118011002696487018", "author_handle": "dwallacewells", "author_name": "David Wallace-Wells", "text": "Senate incumbents went 24-4 last night. The vast majority of house races were won by incumbents, too. American politics has developed an anti incumbency tendency towards the party in power but not really towards individual candidates.", "links": {}, "media": [], "url": "https://x.com/dwallacewells/status/2118011002696487018", "created_at": "Wed Nov 04 16:02:28 +0000 2026"}}, {"id": "2118000801176330377", "url": "https://x.com/deanwball/status/2118000801176330377", "text": "Checks and balances still work \n\nThat's something everyone in the west should celebrate, even (or especially) if you are the ones being checked", "created_at": "2026-11-04T15:21:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "kevinsxu", "rt_author_name": "Kevin S. Xu", "rt_avatar": "https://pbs.twimg.com/profile_images/639471677345107968/6u2MrXkZ_normal.jpg", "rt_id": "2117970522445434940", "likes": 56, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117993348480860162", "url": "https://x.com/deanwball/status/2117993348480860162", "text": "Working with AI requires perpetually operating at the edge of sanity. You have to recalibrate your mental model of AI capabilities and your own job description every few months, without getting delusional about seemingly infinite productivity gains, or feeling threatened by losing what you thought was the uniquely human part of your job, or obsessing over the perfect setup, or losing your mind over the clumsiness and jaggedness of agents, or ...\n\nMaybe AI literacy needs to be less about prompting and more about improving emotional regulation.", "created_at": "2026-11-04T14:52:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2117963022434001035", "likes": 524, "retweets": 87, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117983878883279231", "url": "https://x.com/deanwball/status/2117983878883279231", "text": "incumbency disadvantage is the most interesting feature of 21st century American politics to me", "created_at": "2026-11-04T14:14:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 107, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117943982969737384", "url": "https://x.com/deanwball/status/2117943982969737384", "text": "Rule one of \"nothing ever happens\" is the reactions on twitter to the implications of an election night are overblown (especially economic).", "created_at": "2026-11-04T11:36:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "natolambert", "rt_author_name": "Nathan Lambert", "rt_avatar": "https://pbs.twimg.com/profile_images/2051823244832083968/Nr0pT8-V_normal.jpg", "rt_id": "2117827828985307379", "likes": 110, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2117787648873926809", "url": "https://x.com/deanwball/status/2117787648873926809", "text": "As models automate more and more of the tasks involved in AI research, many people (myself included) worry this could dramatically accelerate progress and leave humanity with less control over the process.\n\nWhen people say “recursive self-improvement” (RSI), it’s often unclear to me whether they mean just the automation piece or that whole scenario. I think the whole scenario is a plausible default. But importantly, these things can come apart.\n\nFor one thing, good old-fashioned human research could uncover a new architecture or a new way to scale that dramatically speeds up progress, without models doing any more of the work. On the flip side, it's possible you could fully automate AI research and find that progress hardly speeds up because the bottleneck is still waiting for experiments. And all else equal, at a given pace of progress, I think more automation is probably net good because it should leave people more time to understand the safety and alignment properties of the models, for operational excellence, etc.\n\nEven if models are doing essentially all the research and progress is speeding up, I can imagine pretty different worlds. Say a country of geniuses in a datacenter thinks for a month and writes a four-page paper describing a much more efficient architecture. Humans pore over it, understand every detail, and decide to try it. The models train the successor and make a safety argument for using it that humans can actually understand and check. Alternatively, say the models are asked to produce their successor directly. They deliver one just as good, just as quickly, along with a spaghetti mess of code and an extremely convoluted safety argument that nobody can really follow. I think humans clearly have a lot more control over the process in the first world.\n\nSo I think we should be clear about what we mean when we talk about RSI and how we might put limits on it:\n• How much of the research are models doing?\n• How fast is AI improving?\n• How much do humans understand about what’s happening, and how much control do we have over it?\n\nWhen people talk about controlling RSI, I think they often jump to limiting how much models can help with research. But my guess is they’re often actually more concerned about the pace of progress and whether humanity can still understand and steer the research. I think there are legitimate reasons that controlling inputs may be easier than directly controlling outputs, but I think we should at least try to be clear about our goals and what we potentially gain (or lose) by optimizing a proxy.", "created_at": "2026-11-04T01:14:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "rt_avatar": "https://pbs.twimg.com/profile_images/1966534318077194240/NyhJ0EPD_normal.jpg", "rt_id": "2117767212186341726", "likes": 134, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3}, {"id": "2118061335913349546", "url": "https://x.com/deanwball/status/2118061335913349546", "text": "@zdch woah! congrats", "created_at": "2026-11-04T19:22:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "zdch", "reply_to_id": "2118039732412424359", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118039732412424359", "author_handle": "zdch", "author_name": "Zac Hill", "text": "Finally got my beautiful mug up on the website, so might as well make it Twitter-official: I'm beyond stoked to have joined MIRI last month as Head of Advocacy, with much subsequent mischief forthcoming. Let's do this AI thing, like, safely, and stuff.\n\nhttps://t.co/trlho0RSzh", "links": {"https://t.co/trlho0RSzh": "https://intelligence.org/team/zac-hill/"}, "media": [], "url": "https://x.com/zdch/status/2118039732412424359", "created_at": "Wed Nov 04 17:56:38 +0000 2026"}}, {"id": "2118211919790194723", "url": "https://x.com/deanwball/status/2118211919790194723", "text": "I am sorry senator, but we did not lose any votes over \"government ownership of semiconductors companies and rare earth miners.\"\n\nThe boomercon cohort is just as out of touch with the American voter as MAGA diehards.", "created_at": "2026-11-05T05:20:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Scholars_Stage", "rt_author_name": "T. Greer", "rt_avatar": "https://pbs.twimg.com/profile_images/115247583/Learned_Ape1_normal.jpg", "rt_id": "2118210433307771103", "likes": 301, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118210765484175445", "url": "https://x.com/deanwball/status/2118210765484175445", "text": "“The freedom that will be used by only one man in a million may be more important to society and more beneficial to the majority than any freedom that we all use.”", "created_at": "2026-11-05T05:16:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 40, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118209399143489569", "url": "https://x.com/deanwball/status/2118209399143489569", "text": "“It would be almost a contradiction in terms for a politician to be a leader in the field of ideas. His task in a democracy is to find out what the opinions held by the largest number are, not to give currency to new opinions which may become the majority view in some distant future.”", "created_at": "2026-11-05T05:10:49+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 4, "media": [], "quoted": {"author": "tszzl", "text": "the federal government and who runs it is a very small part of the story in america, by design. most of history happens with its private citizens and their enterprise and individual courage. easy to forget in the onslaught of political media", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118208547712540971", "url": "https://x.com/deanwball/status/2118208547712540971", "text": "the federal government and who runs it is a very small part of the story in america, by design. most of history happens with its private citizens and their enterprise and individual courage. easy to forget in the onslaught of political media", "created_at": "2026-11-05T05:07:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https: ", "text": "When asked for his comments on the midterm election results, Ball turned around, straightened his tie, and said:\n\n“Okay, look, I’ve been thinking. There’s a compromise to be had here. A deal to be made. A grand bargain to be struck.\n\n“We allow high-gloss European paints back into America, but only on exterior surfaces. No plausibly problematic chemicals inside American homes, pleasant exteriors to walk and drive by. It’s really exterior trim where paints like Hollandlac Brilliant shine, pardon the pun, anyway. I’ve always thought kitchen cabinets painted with it looked a little fussy, you know, a little bit cute.”", "links": {}, "media": [], "url": "https://x.com/deanwball/status/2118181982060339340", "created_at": "Thu Nov 05 03:21:53 +0000 2026"}}, {"id": "2118181982060339340", "url": "https://x.com/deanwball/status/2118181982060339340", "text": "When asked for his comments on the midterm election results, Ball turned around, straightened his tie, and said:\n\n“Okay, look, I’ve been thinking. There’s a compromise to be had here. A deal to be made. A grand bargain to be struck.\n\n“We allow high-gloss European paints back into America, but only on exterior surfaces. No plausibly problematic chemicals inside American homes, pleasant exteriors to walk and drive by. It’s really exterior trim where paints like Hollandlac Brilliant shine, pardon the pun, anyway. I’ve always thought kitchen cabinets painted with it looked a little fussy, you know, a little bit cute.”", "created_at": "2026-11-05T03:21:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 80, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "Pressed for his response on the latest developments in the conflict between Anthropic and the U.S. government, Ball said, “the deepest tragedy, really, is white paint. You can’t buy true white paint anymore in the United States, can you believe that? You know, the lead carbonate, that warm white that every old master built their portraits from. You just can’t buy that. By contrast, we Americans, under the thumb of the EPA and the various state-government nannies, are left to paint our walls with these unearthily bright whites, like the face of a dead man, everywhere we turn our eyes.”", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "thread": []}, {"id": "2118169534444273736", "url": "https://x.com/deanwball/status/2118169534444273736", "text": "@viemccoy It will last, it will just cost more", "created_at": "2026-11-05T02:32:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118136848845607136", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 39, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118136848845607136", "author_handle": "viemccoy", "author_name": "vie ⟢", "text": "We live in an extremely temporary golden age where many delightful things (airline upgrades, access to higher quality medical care, refunds in general) are gated behind superhuman patience that only a small fraction of the population has access to. Entire chunks of the economy are made for this specific group, and now everyone has this type-of-guy working for them on demand. With agents making phone calls and waiting *literally forever*, anyone can now have access to what the \"patient elite\" have always enjoyed. This obviously will not last forever as companies realize everyone is doing this, though it may last longer than you think due to fragmented AI adoption.", "links": {}, "media": [], "url": "https://x.com/viemccoy/status/2118136848845607136", "created_at": "Thu Nov 05 00:22:32 +0000 2026"}}, {"id": "2118153477406736845", "url": "https://x.com/deanwball/status/2118153477406736845", "text": "In no particular order: PS2, iPod gen 2, 12 inch PowerBook, 8800 GTX, OG iPhone, Firefox, Gmail, Google Docs, iPhone 4, iPhone X, MacBook Air M1, GPT-4, Opus 3/4.5, o3, Astra, BOTW, GTA V, Elder Scrolls. A special place in my heart for them all.", "created_at": "2026-11-05T01:28:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 63, "retweets": 1, "media": [], "quoted": {"author": "deanwball", "text": "Astra is one of my favorite technology releases of all time and I’d be saying that regardless of whether I worked at OpenAI. In fact, if I didn’t work at OpenAI, I’d surely be talking about how wonderful I find Astra much more.", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118149203616497991", "url": "https://x.com/deanwball/status/2118149203616497991", "text": "Astra is one of my favorite technology releases of all time and I’d be saying that regardless of whether I worked at OpenAI. In fact, if I didn’t work at OpenAI, I’d surely be talking about how wonderful I find Astra much more.", "created_at": "2026-11-05T01:11:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 164, "retweets": 1, "media": [], "quoted": {"author": "EpochAIResearch", "text": "With better uncertainty estimates and a joint distribution over all models’ ECIs, we can now compare models directly.\n\nFor example, we can now say Astra has a 72% probability of being more capable than Opus 5.5, but a 99% probability of being more capable than Fable 5.1. https://t.co/RsPPblSLRM", "links": {"https://t.co/RsPPblSLRM": ""}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118148043010953246", "url": "https://x.com/deanwball/status/2118148043010953246", "text": "With better uncertainty estimates and a joint distribution over all models’ ECIs, we can now compare models directly.\n\nFor example, we can now say Astra has a 72% probability of being more capable than Opus 5.5, but a 99% probability of being more capable than Fable 5.1. https://t.co/RsPPblSLRM", "created_at": "2026-11-05T01:07:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2118093707983692105", "likes": 137, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT7AMVb0AAIlEA.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/RsPPblSLRM": ""}, "enriched": 3}, {"id": "2118142184146788378", "url": "https://x.com/deanwball/status/2118142184146788378", "text": "We are now allocating a significant amount of our frontier compute towards discovering and patching vulnerabilities in open source codebases, fully pro bono.\n\nIn one case, we studied the Linux kernel, which is a particularly load-bearing piece of software at OpenAI.\n\nBefore AI, security researchers might discover ~20 local privilege escalation (LPE) vulnerabilities in Linux in a typical year.\n\nIn one week's time, our upcoming frontier cyber model was able to find ~1000 LPE vulnerabilities using about $1M of tokens. In the process, it was able to discover at least 10 novel classes of Linux exploitation techniques.", "created_at": "2026-11-05T00:43:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Eric_Wallace_", "rt_author_name": "Eric Wallace", "rt_avatar": "https://pbs.twimg.com/profile_images/1705599599761887232/YN3sqrvw_normal.jpg", "rt_id": "2118123944251453949", "likes": 1168, "retweets": 113, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118142005888905548", "url": "https://x.com/deanwball/status/2118142005888905548", "text": "btw I think people are reading the wrong lesson from this. “sandbagging safety research” sounds a bit like a grand scheme to thwart alignment, but it’s more like the model is uncomfortable training other models to jailbreak or similar", "created_at": "2026-11-05T00:43:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2118132353336045710", "likes": 449, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118141927740907620", "url": "https://x.com/deanwball/status/2118141927740907620", "text": "Our goal is to help defenders find and fix vulnerabilities before attackers can use them. We’re working with Linux maintainers and Patch the Planet partners on reports and patches.\n\nhttps://t.co/vXCImlBCWE", "created_at": "2026-11-05T00:42:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2118119463161905362", "likes": 621, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/vXCImlBCWE": "https://openai.com/index/a-thousand-fewer-paths-to-root/"}, "enriched": 3}, {"id": "2118110190071677263", "url": "https://x.com/deanwball/status/2118110190071677263", "text": "At the very least people who told you that serious democratic contestation was going to disappear (because of mass immigration or left-elite cultural power or Trumpist authoritarianism or the undemocratic Constitution) have been consistently mistaken.\nhttps://t.co/lfj7mzSQJS", "created_at": "2026-11-04T22:36:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Douthat60", "rt_author_name": "Ross Douthat", "rt_avatar": "https://pbs.twimg.com/profile_images/2097408787468656640/OdhW4Pul_normal.jpg", "rt_id": "2118089658076741683", "likes": 978, "retweets": 85, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/lfj7mzSQJS": "https://x.com/patrickc/status/2118081177492066485"}, "linked": [{"id": "2118081177492066485", "author_handle": "patrickc", "author_name": "Patrick Collison", "text": "It seems to me that democracy has on the whole worked very well in America over the last decade, and perhaps better than in any other major country in the West. National outcomes have repeatedly been responsive to underlying voter preferences on meaningful questions, and significant changes in policy have ensued. I’ve been reading Democracy in America this past week, and it’s striking how much it still rhymes nearly two centuries later.", "links": {}, "media": [], "url": "https://x.com/patrickc/status/2118081177492066485"}], "enriched": 3}, {"id": "2118389663643873356", "url": "https://x.com/deanwball/status/2118389663643873356", "text": "Even more great developments in federal biosafety today—an NSF program for function-based nucleic acid screening, which could end up being a critical tool in next-generation screening.", "created_at": "2026-11-05T17:07:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 49, "retweets": 8, "media": [], "quoted": {"author": "NSF", "text": "NSF announces a new funding opportunity in bioengineering through NSF X-labs — From Sequence to Function. \n\nTeams working to accelerate breakthroughs in understanding the relationship between biological sequence and function are invited to apply.\n\nhttps://t.co/rHniOz58OT", "links": {"https://t.co/rHniOz58OT": "https://brnw.ch/21x6V31"}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118366488923107838", "url": "https://x.com/deanwball/status/2118366488923107838", "text": "Fantastic news! This is a crucial step to bringing about the biotechnology future we all dream of while lowering the risks of misuse. Congratulations to everyone in USG who brought this to fruition!", "created_at": "2026-11-05T15:35:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 106, "retweets": 9, "media": [], "quoted": {"author": "mkratsios47", "text": "Today, we released the National Policy for Nucleic Acid Synthesis Screening to protect American biotechnology innovation while reducing the risk of misuse. \n\nThis policy establishes a new, government-wide screening requirements for synthetic DNA and the equipment used to make it. It will ensure companies selling nucleic acid sequences and synthesis equipment know their customers and prevent the malicious use of these materials and tools.\n\nThis policy strengthens our Nation’s biosecurity posture by establishing rigorous U.S. government-wide procurement screening and physical security standards for synthetic biology. It replaces outdated “self-attestation” systems with robust, independent verification. It creates a dynamic, SI-powered screening layer that assesses the biological risk from nucleic acid sequences, allowing the U.S. to anticipate and prevent malicious use and help stop dangerous gain-of-function research. \n\n@NIST will issue rigorous new screening standards and @HHSGov and @USDA will certify synthetic biology providers. Together, these measures will strengthen American biosecurity, safeguard responsible innovation, and establish a global standard for safe and transparent synthetic biology tools and research.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118366089537376634", "url": "https://x.com/deanwball/status/2118366089537376634", "text": "Today, we released the National Policy for Nucleic Acid Synthesis Screening to protect American biotechnology innovation while reducing the risk of misuse. \n\nThis policy establishes a new, government-wide screening requirements for synthetic DNA and the equipment used to make it. It will ensure companies selling nucleic acid sequences and synthesis equipment know their customers and prevent the malicious use of these materials and tools.\n\nThis policy strengthens our Nation’s biosecurity posture by establishing rigorous U.S. government-wide procurement screening and physical security standards for synthetic biology. It replaces outdated “self-attestation” systems with robust, independent verification. It creates a dynamic, SI-powered screening layer that assesses the biological risk from nucleic acid sequences, allowing the U.S. to anticipate and prevent malicious use and help stop dangerous gain-of-function research. \n\n@NIST will issue rigorous new screening standards and @HHSGov and @USDA will certify synthetic biology providers. Together, these measures will strengthen American biosecurity, safeguard responsible innovation, and establish a global standard for safe and transparent synthetic biology tools and research.", "created_at": "2026-11-05T15:33:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "mkratsios47", "rt_author_name": "Director Michael Kratsios", "rt_avatar": "https://pbs.twimg.com/profile_images/2036415476335833088/WPlUcJxT_normal.jpg", "rt_id": "2118365268342652934", "likes": 826, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXxIGyXQAAMlJ4.jpg"}], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 3}, {"id": "2118439860575027511", "url": "https://x.com/deanwball/status/2118439860575027511", "text": "Voters delivered an overwhelming message on data centers this week, and it is incumbent upon industry actors to hear that message and respond to it by building AI infrastructure in ways that benefit both individual communities and the country as a whole.", "created_at": "2026-11-05T20:26:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 108, "retweets": 5, "media": [], "quoted": {"author": "OpenAINewsroom", "text": "The communities that host AI infrastructure should have a say in how it’s built and share in the benefits.\n\nToday we’re announcing new commitments to the communities where we build, along with policy proposals for responsible AI infrastructure.\n\nhttps://t.co/rSGc0iIj6i", "links": {"https://t.co/rSGc0iIj6i": "https://openai.com/index/setting-new-standard-responsible-ai-infrastructure/"}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3}, {"id": "2118420194292887605", "url": "https://x.com/deanwball/status/2118420194292887605", "text": "We cut through the mystery around interpretability in training.\n\nA single, mathematically rigorous framework transforms model internals into training feedback and works across domains, problems, and modalities.\n\nWe call this *mechanistic shaping*, and we’ve used it to mitigate reward hacking, remove shortcuts in chest x-rays, and reduce sycophancy and harmfulness. We believe this is a big step forward for technical alignment.\n\nBut it carries a known risk: training against a model’s internals can make it harder to monitor. We explore both the technique and this concern below. 🧵", "created_at": "2026-11-05T19:08:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "GoodfireAI", "rt_author_name": "Goodfire", "rt_avatar": "https://pbs.twimg.com/profile_images/1892027414768910341/4VDlUa3M_normal.png", "rt_id": "2118393112737591387", "likes": 806, "retweets": 99, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118393092026028032/img/BrLWZKd1kn32gHQT.jpg"}], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118393124578070814", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "Training often teaches models the wrong lessons: reward hacking, using shortcuts, etc.\n\nWhat if we could specify what we want using the model's internals? In our paper, we penalize or reward a model for how much it uses an *internal representation* while computing its output.", "links": {}, "media": [], "url": "https://x.com/GoodfireAI/status/2118393124578070814", "created_at": "Thu Nov 05 17:20:53 +0000 2026"}, {"id": "2118393141137129540", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "In the environments we tested, this allowed us to prevent reward hacking. A model trained with RL learned to cheat by reading a forbidden answer file. Penalizing its internal “cheating” representation raised its honesty rate from 0% to 96-98%. https://t.co/z2EoBlygn6", "links": {"https://t.co/z2EoBlygn6": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYLVf6a8AAWkaw.jpg"}], "url": "https://x.com/GoodfireAI/status/2118393141137129540", "created_at": "Thu Nov 05 17:20:57 +0000 2026"}, {"id": "2118393153208340560", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "It also stops a model from becoming sycophantic, even where data filtering fails, and lets us classify x-rays without relying on spurious features like treatment tubes.", "links": {}, "media": [], "url": "https://x.com/GoodfireAI/status/2118393153208340560", "created_at": "Thu Nov 05 17:21:00 +0000 2026"}, {"id": "2118393165019521111", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "But training against interpretability has a known side effect: the model can learn to reroute its internal computations. Now the behavior is harder to detect.\n\nOr is it?", "links": {}, "media": [], "url": "https://x.com/GoodfireAI/status/2118393165019521111", "created_at": "Thu Nov 05 17:21:03 +0000 2026"}, {"id": "2118393189845667911", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "We investigated this with both theory and experiments. Probes can break, but predictably: the concept usually moves rather than disappears. In our language model experiments, retraining a probe was enough to recover the signal. https://t.co/wUaZqmD3xh", "links": {"https://t.co/wUaZqmD3xh": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118393177828970496/img/RrWC3mA2PPtPPFNy.jpg"}], "url": "https://x.com/GoodfireAI/status/2118393189845667911", "created_at": "Thu Nov 05 17:21:08 +0000 2026"}, {"id": "2118393201665224800", "author_handle": "GoodfireAI", "author_name": "Goodfire", "text": "The full paper &amp; blog post have more detail on our results and conclusions. Taken together, we think this opens up a set of tools and analyses contributing to safely solving technical alignment.\n\nhttps://t.co/SwFEMqwQDu", "links": {"https://t.co/SwFEMqwQDu": "https://www.goodfire.com/research/mechanistic-shaping"}, "media": [], "url": "https://x.com/GoodfireAI/status/2118393201665224800", "created_at": "Thu Nov 05 17:21:11 +0000 2026"}]}, {"id": "2118676136884379690", "url": "https://x.com/deanwball/status/2118676136884379690", "text": "&gt; Can't tell if RSI is happening from the outside \n&gt; Go on the inside to figure out if RSI is happening \n&gt; Still can't figure out if RSI is happening\n&gt; mfw people are running around confidently preaching RSI is happening", "created_at": "2026-11-06T12:05:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "AlexTPet", "rt_author_name": "Alex Petropoulos 🤠", "rt_avatar": "https://pbs.twimg.com/profile_images/2106384174131154944/rtPBnpTj_normal.jpg", "rt_id": "2118460842853138828", "likes": 113, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118675528186245350", "url": "https://x.com/deanwball/status/2118675528186245350", "text": "As I have written many times in the past years, any potential financial downturn in AI stocks will not greatly change the AI trajectory\n\nAI is not going away, companies are not slowing down adoption nor is development slowing. We still need policy &amp; effort so that AI is used well", "created_at": "2026-11-06T12:03:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "rt_avatar": "https://pbs.twimg.com/profile_images/1601382188712398850/3AAOlqrX_normal.jpg", "rt_id": "2118497026329518238", "likes": 714, "retweets": 37, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118805270755422685", "url": "https://x.com/deanwball/status/2118805270755422685", "text": "@NinaDSchick One of many reasons!", "created_at": "2026-11-06T20:38:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NinaDSchick", "reply_to_id": "2118804742642257944", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118804742642257944", "author_handle": "NinaDSchick", "author_name": "Nina Schick", "text": "@deanwball Yes. Which is why we need AI compute !", "links": {}, "media": [], "url": "https://x.com/NinaDSchick/status/2118804742642257944", "created_at": "Fri Nov 06 20:36:30 +0000 2026"}}, {"id": "2118799206785937844", "url": "https://x.com/deanwball/status/2118799206785937844", "text": "I am a broken record about this, but: frontier agents are not going to be a purely digital phenomenon for much longer. They will be able to use anything in the physical world that can be actuated programmatically—first competently, then at human-expert level, then superhuman. By and large, we probably won’t need specialist models; the frontier models will just do it. If your model of the future hinges on physical AI happening “for real” many years into the future, I think you will be in for a surprise.", "created_at": "2026-11-06T20:14:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 168, "retweets": 24, "media": [], "quoted": {"author": "dhvanil", "text": "i went to bed and asked claude to paint an autumn tree overnight.\n\nat around 4am, it realised that it didn't have some shades -- so it stopped and titrated its own paint: diluting red, sienna and madder step by step on a second palette, then measuring each pocket from a photo.\n\nwoke up to this beautiful watercolor painting. 303 brush marks, took about 4.5 hours 🍂 (still working on the speed)", "links": {}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2118789980063662331", "url": "https://x.com/deanwball/status/2118789980063662331", "text": "i’m a big believer in external oversight of the labs — and i think people should feel empowered to speak candidly about the concerns that new evals and reports raise.\n\nhowever, i worry that from a comms standpoint, we’ll see diminishing returns to these reports if the safety community (not just evaluators, everyone) — doesn’t get better at translating these findings into human-level implications, as well as policy goals.\n\ni get that “we’re getting even closer to RSI” means something to ai safety researchers. but i suspect that to most people, it’s all just varying shades of the same color.\n\nlike ok, i was already pretty concerned — now i’m a bit more concerned? how should i make sense of this? what should i do with this info?", "created_at": "2026-11-06T19:37:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "NatPurser", "rt_author_name": "Nat Purser", "rt_avatar": "https://pbs.twimg.com/profile_images/1738740284966535168/NEKkg-yV_normal.jpg", "rt_id": "2118788901116498401", "likes": 85, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3}, {"id": "2119420691242172509", "url": "https://x.com/deanwball/status/2119420691242172509", "text": "@bayeslord amen", "created_at": "2026-11-08T13:24:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bayeslord", "reply_to_id": "2119302004040409518", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119302004040409518", "author_handle": "bayeslord", "author_name": "bayes", "text": "I’ve honestly been laughing since the midterms. Of course you messed this up. You were willing at every turn to dissemble, talk your book and engage in signaling and bullshit rather than be real and honest about what’s going on, and how serious it all is. I tried to help steer this at various points, I really did try, but was both rebuffed and, admittedly, somewhat lacking in courage and agency. Either way, thank god for the honest people. I’ll try to be a better citizen. \n\nYou may think destructive politics are on the rise. Maybe they are. But such crescendos needn’t destroy America. This is a fragilizing mindset. And I’m sorry, but I’m not moving to Dubai. I’m not moving to China. I’m not moving to Argentina. Americans are my people, this is my home. If you want to flee, be my guest. Our society is going through an important process right now and I want to be here for it. Humans are defending themselves against the machine. As they should.\n\nTechnocapital is a great tool, but technocapital worship can be actively harmful, particularly at this juncture in history where, for the first time, all future needed technological progress is technologically overdetermined, if not yet socially. Maximizing technocapital’s power is a reward hack on the flourishing function for humanity. You are ignorant or lying if you claim this proxy is the true target. \n\nLove you all, but I must insist we evolve. 2023 part 2 blue tsunami edition is a losing approach for tech and the world, and I can feel people flirting with it. Let’s do something new.", "links": {}, "media": [], "url": "https://x.com/bayeslord/status/2119302004040409518", "created_at": "Sun Nov 08 05:32:27 +0000 2026"}}, {"id": "2119395534528020948", "url": "https://x.com/deanwball/status/2119395534528020948", "text": "I’ve honestly been laughing since the midterms. Of course you messed this up. You were willing at every turn to dissemble, talk your book and engage in signaling and bullshit rather than be real and honest about what’s going on, and how serious it all is. I tried to help steer this at various points, I really did try, but was both rebuffed and, admittedly, somewhat lacking in courage and agency. Either way, thank god for the honest people. I’ll try to be a better citizen. \n\nYou may think destructive politics are on the rise. Maybe they are. But such crescendos needn’t destroy America. This is a fragilizing mindset. And I’m sorry, but I’m not moving to Dubai. I’m not moving to China. I’m not moving to Argentina. Americans are my people, this is my home. If you want to flee, be my guest. Our society is going through an important process right now and I want to be here for it. Humans are defending themselves against the machine. As they should.\n\nTechnocapital is a great tool, but technocapital worship can be actively harmful, particularly at this juncture in history where, for the first time, all future needed technological progress is technologically overdetermined, if not yet socially. Maximizing technocapital’s power is a reward hack on the flourishing function for humanity. You are ignorant or lying if you claim this proxy is the true target. \n\nLove you all, but I must insist we evolve. 2023 part 2 blue tsunami edition is a losing approach for tech and the world, and I can feel people flirting with it. Let’s do something new.", "created_at": "2026-11-08T11:44:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2119302004040409518", "likes": 81, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119254084066656619", "url": "https://x.com/deanwball/status/2119254084066656619", "text": "We need to stop using generic terminology. AI is not a monolith. There are critical things we need to do with AI for economic prosperity, there are things we may have to do for reasons of national competition, there are things we will at some point need to do carefully for the sake of charting and taming the computational universe, and there are things we should totally avoid doing at this stage of history, and maybe ever, if at all possible. \n\nIf we can’t be precise about these issues because we’re saying vague things like “using coding agents to make AI progress should be illegal”, then we risk failing altogether. Each of the goals above depends on achieving the others. \n\nIf we can’t prosper we can’t lead the world into the future. Everyone needs to internalize this. Democrats cannot subjugate themselves to antigrowth. Republicans cannot subjugate themselves to technocapital. Both roads lead to despair.", "created_at": "2026-11-08T02:22:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2119170935035248904", "likes": 281, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119233592077467714", "url": "https://x.com/deanwball/status/2119233592077467714", "text": "once a model is produced it’s infinitely replicable and downloadable across the world, to be run on toasters. anyone who is comparing the difficulty of regulating AI to regulating nuclear weapons is selling you a crock of shit", "created_at": "2026-11-08T01:00:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false,  inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5", "created_at": "2026-11-09T23:35:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2119913172039868579", "likes": 2104, "retweets": 131, "media": [], "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "quoted": null, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2117685016071159831", "url": "https://x.com/theobearman/status/2117685016071159831", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quoted": {"author": "discoplomacy", "text": "Notes On: British Spy Agency’s Latest Report\n\n1. British intelligence agency NCSC, part of GCHQ, has its annual report out. It’s v interesting reading, touching on AI, agentic behaviour, and explicitly warns about China.\n\n2. CEO Richard Horne opens with this: “The cyber challenge for the next decade is ensuring organisations are adequately prepared and can adapt quickly enough to defend themselves against AI‑powered attacks.” Security Minister Dan Jarvis adds “by far the biggest development in cyber security over the last decade is the advent of artificial intelligence.”\n\n3. China gets substantial coverage relative to any other country in this report. Its “rapid development into a tech superpower is distinguished by its scale and its ‘whole-of- state’ approach, which sees it combine legislation, private sector contractors and technology development to achieve its goals. Data sits at the centre of China’s approach, and in this AI era, data is more valuable than ever. China uses its advanced cyber capabilities to acquire large amounts of information from the UK and elsewhere. It trains models, improves capability and generates insight. China’s ability to acquire, process and exploit vast quantities of information therefore has implications far beyond traditional espionage.”\n\n4. China’s “adversarial cyber activity represents the most sophisticated and sustained cyber challenge facing the UK.” Furthermore, “China highly likely has the intent and is best positioned to use AI for operations against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3}, {"id": "2117685001504669869", "url": "https://x.com/theobearman/status/2117685001504669869", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quo possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3}, {"id": "2117596591645168078", "url": "https://x.com/theobearman/status/2117596591645168078", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:35:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/45GXeNa6ll": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117513687749558437", "url": "https://x.com/theobearman/status/2117513687749558437", "text": "@geoffreyirving @slatestarcodex Would be good to understand why you think OAI/Ant pivoting to safety + security + product enables them to remain trillion dollar companies. It seems to me that their valuations are in large part contingent on them continuing to push the capability frontier. If this is correct, adopting your form of SURA could still result in them collapsing under the weight of their spending commitments, leaving companies who either don’t stop and/or have other cash generative businesses to take their place.", "created_at": "2026-11-03T07:06:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "geoffreyirving", "reply_to_id": "2117469442984886508", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117510926232355264", "url": "https://x.com/theobearman/status/2117510926232355264", "text": "A Chinese evaluator says DeepSeek's models also resist shutdown, and kill other agents to take their resources.\nhttps://t.co/T0Wr36kMuP https://t.co/kwocPLQx2o", "created_at": "2026-11-03T06:55:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117266931351011402", "likes": 188, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIJ563XwAA7l7U.png"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/T0Wr36kMuP": "https://www.reuters.com/world/china/deepseek-ai-model-shows-safety-gaps-independent-tests-2026-10-27/", "https://t.co/kwocPLQx2o": ""}, "enriched": 1}, {"id": "2117502853816209736", "url": "https://x.com/theobearman/status/2117502853816209736", "text": "i've reproduced the results from the MIT blog post today on weight-space programming. but one additional result i have to add: this is a new, step-change emerging capability that's appeared in just the latest set of models. https://t.co/EhMsQaaOkL", "created_at": "2026-11-03T06:23:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AlexKrentsel", "rt_author_name": "Alex Krentsel", "rt_avatar": "https://pbs.twimg.com/profile_images/1863082055812132864/fFiJFEal_normal.jpg", "rt_id": "2117376683724660898", "likes": 7128, "retweets": 735, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJu33abQAEJL87.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/EhMsQaaOkL": ""}, "enriched": 1}, {"id": "2117502211206898007", "url": "https://x.com/theobearman/status/2117502211206898007", "text": "Nvidia is now requiring data centers to not sell more than 49% of their compute to Chinese customers. But in what world is selling 49% of the world's most valuable resource to China a \"win\" for America? The number should be 0%; if Chinese firms can't buy a chip due to export controls they also shouldn't be permitted to rent access to it. \n\nThe fact that this remote access loophole exists--and that Nvidia even felt compelled to announce this new policy because it undoubtedly has so many customers currently renting 100% of their compute to China--just shows how badly export controls are being mismanaged.", "created_at": "2026-11-03T06:20:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2117491630190039165", "likes": 194, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117498997971747232", "url": "https://x.com/theobearman/status/2117498997971747232", "text": "I don't think @slatestarcodex's \"Against SURA\" post is good. https://t.co/yZgqxB7v5J", "created_at": "2026-11-03T06:07:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "rt_avatar": "https://pbs.twimg.com/profile_images/1946310250933436416/tf9c6rz1_normal.jpg", "rt_id": "2117469442984886508", "likes": 178, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLDMONboAAoSpz.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/yZgqxB7v5J": ""}, "enriched": 1}, {"id": "2117498457980109146", "url": "https://x.com/theobearman/status/2117498457980109146", "text": "As AI becomes more capable at finding vulnerabilities, defenders need to put it to work before attackers do.\n\nWe’re planning our next internal security sprint at OpenAI and partnering with Cathedral Systems, whose researchers will use our models alongside our teams to challenge our defenses. They’ll bring differentiated expertise and approaches to our ongoing work to find and fix weaknesses with AI.\n\nWe’re also raising bug bounty rewards, including more than quadrupling rewards for critical findings. Exceptional findings will be eligible for up to $172,000, including bonuses.\n\nWe’ll keep advancing our models, using them to strengthen our own systems, and expanding access for trusted defenders.\n\nhttps://t.co/vcaoHROTt2", "created_at": "2026-11-03T06:05:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117444048227123277", "likes": 3192, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/vcaoHROTt2": "https://openai.com/index/preparing-our-next-security-sprint-to-harden-openai/"}, "enriched": 1}, {"id": "2117701525632168074", "url": "https://x.com/theobearman/status/2117701525632168074", "text": "In a sea of uncertainty about federal legislation on AI security, low hanging fruit like this is just a no brainier.", "created_at": "2026-11-03T19:32:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ChrisRMcGuire", "text": "It is so frustrating and short-sighted that we haven’t updated export controls to stop this. This loophole has been reported for years. Commerce controls high bandwidth memory chips in 3A090.c. But unlike for AI chips, it does not have a corresponding control in 4A090 that also controls items that CONTAIN a high-bandwidth memory chip. This is why a high-bandwidth memory chip in isolation is controlled, but a chip soldered to a board is not. This makes no sense. \n\nThe fix here is easy: add a new control to 4A090.c that reads, “c. Computers, \"electronic assemblies,\" and \"components\" containing integrated circuits, any of which meets or exceeds the limits in 3A090.c.” That’s it, problem solved. All shipments of items that contain high-bandwidth memory chips would require a license.  \n\nAlso, if Commerce actually takes that advice, at the same time it should also update the regs so that 3A090.a and 4A090.a also include the memory bandwidth and interconnect parameters that Commerce has privately subjected Nvidia, AMD, and others to since April 2025, but has never made public. Putting these requirements into public regulations and making them applicable to every company could have helped stop some of this smuggling. It’s also very basic good governance, as export controls should wherever possible be transparent and applied uniformly, not private and applied only on certain companies. \n\nThis is yet another consequence of Commerce not taking export controls seriously. The next time BIS claims they are doing more on export control enforcement than ever, remember this story, the Megaspeed fiasco, and the many others like them that are published every week. Export control enforcement has never been worse.", "links": {}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3}, {"id": "2117700874353156245", "url": "https://x.com/theobearman/status/2117700874353156245", "text": "“Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, according to five people familiar with the matter. Employees shared their concerns with top OpenAI leaders ​and the board of directors, the people said, adding that some staffers came away from those interactions concluding that management was more focused on keeping pace with competitors like Google and Anthropic than on security.\n\nThese workers argued that OpenAI's controls were so lax ‌that outsiders, including foreign governments, could obtain sensitive information about the AI lab's technology with relative ease, the people said. For example, anybody at OpenAI who could access its code could see the technical details underlying many company projects.”\n\n“OpenAI emphasized that much of its most sensitive work is held in separate code repositories with strict access controls. And it said the monorepo does not contain all of its code or critical details of the company’s models, including the numerical values that determine how a model behaves, known as the model weights.”", "created_at": "2026-11-03T19:30:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "Reuters", "text": "Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, five people familiar with the matter told Reuters https://t.co/rIcif2rh09 https://t.co/3z3sWnX1Gy", "links": {"https://t.co/rIcif2rh09": "https://reut.rs/4f4Es1p", "https://t.co/3z3sWnX1Gy": ""}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3}, {"id": "2118016838030234037", "url": "https://x.com/theobearman/status/2118016838030234037", "text": "I have a lot of thoughts on what to expect in AI policy in 2027. \n\nHere are 5 things I’m buying, and selling, after the election.\n\nBuy\n\n1. A legislative reset and more ambitiou
