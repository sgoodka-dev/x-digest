t.co/N5VZ1UbrRP", "created_at": "2026-10-14T06:19:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PatrickMcGee_", "rt_author_name": "Patrick McGee", "likes": 18, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhsehTa4AAP0EB.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110140729519682004", "url": "https://x.com/s8mb/status/2110140729519682004", "text": "Can’t believe it’s happening today: my book on how to build a startup sales team, \"Built to Grow,\" is officially available from @stripepress!\n\nI spent twenty years building and leading enterprise sales teams and advising founders on how to do it. This book is written as a field guide for founders, investors and executives who are building their startup sales teams and are looking for help.\n\nSo many people have helped along the way, but a special thanks goes to @patrickc for the early encouragement to keep writing—this book wouldn’t exist without you—as well as @danielgross and @levie for invaluable input along the way.\n\nAnd a big thank you to the whole team at Stripe Press who helped make this happen — especially the absolutely gorgeous cover!", "created_at": "2026-10-13T22:48:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "she_travels", "rt_author_name": "Stephanie (Schatz) Friedman", "likes": 156, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhgHj4a4AEhOCZ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgIseaoAEJgLl.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgJlbbAAA7yBK.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUhgKljbgAAtKc_.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110451234683367749", "url": "https://x.com/s8mb/status/2110451234683367749", "text": "@sakibsahmed @WorksInProgMag Thank you!!", "created_at": "2026-10-14T19:22:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "sakibsahmed", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110451178412613838", "url": "https://x.com/s8mb/status/2110451178412613838", "text": "I'm so glad people are enjoying the new issue. We want WIP to be the most beautiful and interesting magazine in the world. Much more to come! \n\nThere's still some time to get your copy: https://t.co/sCOVnY0Opt", "created_at": "2026-10-14T19:22:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "sakibsahmed", "text": "Latest issue of @WorksInProgMag is stunning, I felt goosebumps just flicking through. The deep care and passion that went into this is evident.\n\nAs Anna Wintour has said - when a group of passionate people put something out into the world, that passion finds an audience. https://t.co/HlO2Y2qu7v"}, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110422238000296146", "url": "https://x.com/s8mb/status/2110422238000296146", "text": "@coffeemadman @thetimes This worked!", "created_at": "2026-10-14T17:27:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "coffeemadman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110745785843224600", "url": "https://x.com/s8mb/status/2110745785843224600", "text": "One of my favourite writers, @CharlesCMann, joins Works in Progress as a regular contributor. I am thrilled. \n\n1491 and 1493, two of Charles's books, are among the best works of history I have ever read. 1491, which is about the Americas before Columbus, was one of those books that made me wonder if it could possibly be true, it was so surprising and shocking about that lost world. I read while I was travelling through Guatemala's countryside, and it made me understand the tragedy of the collapse and destruction of the pre-Columbian civilizations much better.\n\n1493 is a rather different book, being about how the Americas changed the rest of the world. It is often tragic too, given the subject matter, but also completely captivating on how everyday things like rubber and potatoes changed the world.\n\nWhat I think Charles's writing consistently has is a \"fascination with the ordinary\" – the conviction that even mundane-seeming everyday things often have a fascinating backstory. His articles for Works in Progress will continue this fascination. I strongly recommend his debut piece, out today, on the invention and reinvention of porcelain, written in the same spirit that has made his other writing so brilliant and eye-opening.", "created_at": "2026-10-15T14:53:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 66, "retweets": 4, "media": [], "quoted": {"author": "RuxandraTeslo", "text": "What do a cutting-edge bone implant and Mrs Potts from Beauty and the Beast have in common? Both are made from porcelain, a material humans first made over 3,000 years ago and are still reinventing today.\n\nhttps://t.co/gv0ZeRL8Pa\n\nWe focus on advances in computing, but the world around us has been transformed just as much by materials science. And within this already underrated field sits an even more underrated material. Plenty of people have heard of semiconductors, but almost no one thinks about porcelain. For @WorksInProgressMag, @CharlesCMann wrote about its remarkable journey:\n\n- Porcelain is basically an ancient nanotechnology. 3000 years ago, Chinese potters found that firing a white clay called kaolin to around 1,200°C transformed it completely: its crystals get rebuilt, producing a material that is hard, dense, and sometimes translucent. Nobody knew why it worked at the time: they discovered it by trial and error.\n\n- Europeans prized porcelain immensely – but had no clue had to make it. When porcelain arrived in Europe in the 12th century, it was so superior to European ceramics that aristocrats called it \"white gold.\" But despite attempting to reverse-engineer it, Europeans failed to create porcelain for centuries.\n\n- Fake it until you make porcelain. Böttger, an alchemist imprisoned in the early 1700s for falsely claiming to make gold, was set to work with a legitimate scientist on making porcelain. Remarkably, the scientist succeeded where others had failed for centuries, creating the first European porcelain cup. But he did not live to profit: ever the liar, Böttger claimed his discovery for himself.\n\n- Less slippery when wet. Innovation in materials science picked up again in the 20th century and continues to this day, producing Porcelain 3.0. Today, porcelain can be found across a surprising number of household objects: from kitchen countertops to tiles that become less slippery when wet, which also makes them safer.\n\n- The most futuristic use of all: researchers can now 3D-print porous porcelain scaffolds to repair damaged bone. The advantage is that blood vessels and bone cells grow into the scaffold’s tiny openings, while the scaffold slowly dissolves as new bone replaces it, allowing a bone-like natural structure to persist.\n\nPorcelain has already gone from fragile imperial teacups to artificial joints and scaffolds that help bone regrow. But its 3000 year long story is far from over: expect this underrated material to play new roles in everything from medicine to architecture in the coming decades!"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110725134059270549", "url": "https://x.com/s8mb/status/2110725134059270549", "text": "@AlfredRotors Govt spending actually fell slightly (-0.1pp) between H1 2025 and 2026.", "created_at": "2026-10-15T13:31:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "AlfredRotors", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110708927977467910", "url": "https://x.com/s8mb/status/2110708927977467910", "text": "@ben_golub To some extent, yeah! Cities can have corporation-like features where there are large local spillovers. https://t.co/7ym5GrzEtE", "created_at": "2026-10-15T12:26:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ben_golub", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "s8mb", "text": "I think Andy Burnham should champion the idea of 'municipal socialism': having utilities owned by local governments, primarily combined authorities, rather than the national monopoly that nationalisation usually entails. This may already be what he is planning, but he hasn't really said so yet. \n\nNationalised monopoly fails for many reasons:\n\n- It creates entities that are too big to fail, so they can waste large amounts of money while being subsidised from public funds.\n\n- It gives people no comparison point to see if a certain industry is being well-run, so bad outcomes end up being treated like bad weather.\n\n- It prevents the public companies themselves from learning from other companies, because they only have other countries to learn from where circumstances might be very different.\n\n- It creates very weak political feedback mechanisms, because your vote on whether the trains are being run well is bundled with your vote on, eg, tax policy and foreign policy.\n\n- It engenders short-termism, because voters are less forward looking than private investors, so there is more scope to take long-term degradation of service for short-term benefits. (This is happening with TfL's fare freeze right now.)\n\nMunicipal ownership does not solve all these problems, but it can maintain more accountability and some of the elements of competition that national monopoly does not have.\n\nThere is more room for experimentation and learning because different municipalities try different policies, and can copy the successes from each other. The Oyster Card and contactless card payments were a good example of this by TfL. Manchester's bus privatisation scheme was scrapped in part by looking at the success of London's approach to buses, where delivery is outsourced to multiple private companies but services are designed by a single authority and provided under one brand.\n\nThe 'too big to fail' problem is smaller, because municipal governments can face a harder budget constraint than national government, though bailouts undermine this. Those that want to subsidise services have to draw on a narrower tax base. In fact, well-run services can raise revenues for local governments, as many locally-owned tramways did in the 19th and early 20th Centuries. Local authorities are more accountable for failures and get more credit for successes than national governments would be.\n\nInternationally, successful examples of public ownership of utilities are often owned by municipalities. This is true in much of the United States, where water is mostly municipally owned rather than private, and in France, where most public services are owned by local governments, who then offer contracts to companies to handle the actual delivery. The Bee network and London buses operate on the same basis.\n\nHistorically in Britain, trams, electricity and gas were all mostly run by small local companies and local governments before the 1940s–70s. Municipally-owned gas networks were highly profitable for Birmingham under Joseph Chamberlain. There were still nearly 200 different water boards across England by 1970!\n\nWe use 'nationalisation' as a byword for 'public ownership', but there is little reason for most of these things to be nationalised monopolies. Much of the drive towards nationalised monopoly in the 20th Century was inspired by a mistaken belief that economies of scale would drive the biggest improvements in productivity, inspired by the apparent success of the USSR and large conglomerates in Germany and the USA. It is clear today that experimentation via trial and error is extremely valuable, and losing it is one of the big costs of monopoly.\n\n'Municipalisation' would, for example, mean overhauling the Great British Railways policy which by default puts commuter lines in Surrey into the same administration that runs the West Midlands Cross-City Line, the East Coast Main Line, and commuter networks in Manchester, Leeds and Liverpool. There are some provisions for lines going into municipal control, but the default is to stop the next Mayor of Greater Manchester from running the region's commuter trains and London from absorbing more lines into the Overground.\n\nPublic ownership has many flaws, but some of them are avoidable by looking beyond the 1940s and 1970s for how to do it. 'Municipal socialism' allows for much greater learning and feedback loops, and would hugely strengthen devolution by making local government responsible for things that directly matter to their electorates rather than having them run by a single inert national monopoly."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110704640514040156", "url": "https://x.com/s8mb/status/2110704640514040156", "text": "@Paul_SLG @WorksInProgMag Excellent, glad to hear it!", "created_at": "2026-10-15T12:09:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Paul_SLG", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110704574738698694", "url": "https://x.com/s8mb/status/2110704574738698694", "text": "Mayonnaise and hot sauce are complements, not substitutes.", "created_at": "2026-10-15T12:09:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 2, "media": [], "quoted": {"author": "SenWarren", "text": "Hellmann's mayo\nMcCormick spices\nCholula hot sauce\nFrank's RedHot\n\nWhat do these products have in common? One company could soon control them all.\n\nI have concerns that McCormick and Unilever's $45 billion merger could increase YOUR grocery prices."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110697843468222750", "url": "https://x.com/s8mb/status/2110697843468222750", "text": "Awesome! Even though we're at a low level, I think growth begets growth. It's much easier to do pro-growth reforms when people feel things are getting better already.", "created_at": "2026-10-15T11:42:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 131, "retweets": 1, "media": [], "quoted": {"author": "faisalislam", "text": "Annualised UK GDP growth so far in 2026, with two-thirds of the year gone, is 2.7-2.8%\n\nIs expected to slow in q4, but that was also expected in q3. And q2.\n\nCity economists (eg Pantheon) say “we have to shift from describing UK growth as resilient to calling it strong”."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110697298057674763", "url": "https://x.com/s8mb/status/2110697298057674763", "text": "@Wrynose1 Glad to hear. Yes, frustratingly, the lithographic print for the full batch caused a few issues that the digital print for the proof didn't create. Should be resolved now though.", "created_at": "2026-10-15T11:40:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Wrynose1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110674821327557095", "url": "https://x.com/s8mb/status/2110674821327557095", "text": "In the future, every Works in Progress article will come with a video game.", "created_at": "2026-10-15T10:11:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 0, "media": [], "quoted": {"author": "tommy5dollar", "text": "@bswud I made a game of this. Pitch a startup and three Chinese cities bid for it like VC firms, with land, state fund equity and free rent!\nhttps://t.co/b9WXZd0bDp"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110485222684831931", "url": "https://x.com/s8mb/status/2110485222684831931", "text": "Nearly everyone in the West focuses on China's Five Year Plans as the reasons for its manufacturing success, concluding that more central economic planning is needed. \n\nThis is the exactly WRONG lesson. The country's success comes because its cities all compete with each other intensely, as something akin to vertically integrated corporations that are completely obsessed with local economic growth.\n\nIts incredible manufacturing industry is based on local clusters that local govts nurture and invest in, and collect a lot of the returns from through property fees and taxes. These govts are *much* closer to local needs than Western local govts are, and can focus on speed of building and iteration above all, which are critical for manufacturing.\n\n*This* is why local government matters in Britain and America, where it is almost completely broken and dysfunctional. Where local spillovers matter, as in manufacturing, you need some kind of entity that can internalise the positive externalities of economic activity. China is proof that with the right incentives and tax powers, local governments can become machines for economic growth, intervening and clearing the way for development.", "created_at": "2026-10-14T21:37:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "s8mb", "rt_author_name": "Sam Bowman", "likes": 482, "retweets": 67, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110484230811619454", "url": "https://x.com/s8mb/status/2110484230811619454", "text": "If your company deserves to be taken as seriously as the rest of @WorksInProgMag is, you should DM me.", "created_at": "2026-10-14T21:33:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EvanRiggss", "rt_author_name": "Evan Riggs", "likes": 22, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110483771950870884", "url": "https://x.com/s8mb/status/2110483771950870884", "text": "@StringhamSpirit Oh no! I’ve DM’d you, will sort ASAP.", "created_at": "2026-10-14T21:31:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "StringhamSpirit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110483615419335010", "url": "https://x.com/s8mb/status/2110483615419335010", "text": "@KarlBrophy Thank you very much. I hope you like it.", "created_at": "2026-10-14T21:31:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "KarlBrophy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": ": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": {"author": "CSElmendorf", "text": "Interesting to read this news ⤵️ of NYC playing venture capitalist alongside @bswud &amp; @RobinRivaton's new @WorksInProgMag story about Chinese cities as de facto VC firms.\n\n1/5 https://t.co/gDsV7c1GdY"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110776328488378472", "url": "https://x.com/s8mb/status/2110776328488378472", "text": "I’m still mourning the cover affectionately known as “Building Man”— but I love where we landed on BUILT TO GROW https://t.co/vYDJuWF2XS\n\nThe evolution: https://t.co/Uy2nyL1YY6", "created_at": "2026-10-15T16:54:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 194, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2110748343236280321/img/rzbV4gWwsm279myN.jpg"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110774453248344166", "url": "https://x.com/s8mb/status/2110774453248344166", "text": "@Valen10Francois We're massive", "created_at": "2026-10-15T16:47:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Valen10Francois", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110769763874226435", "url": "https://x.com/s8mb/status/2110769763874226435", "text": "@gsignoret Amazing – @CharlesCMann, you rightly have a very big fan club!", "created_at": "2026-10-15T16:28:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gsignoret", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111086542403850611", "url": "https://x.com/s8mb/status/2111086542403850611", "text": "We are thrilled that the great @CharlesCMann, author of 1491 and 1493, has joined us as a regular contributor. And we've just released his debut article -- a foray into the long history of one very underrated material: porcelain.\n\nhttps://t.co/UiDkCQWur0\n\nA signature Charles move is to take something that seems utterly ordinary and reveal, with flair, that it exists only because of countless small, often accidental innovations, many of them since forgotten. \n\nAnd he's at his best in this new piece for us. He traces how porcelain, discovered by chance by Chinese potters some 3,000 years ago and coveted by Europeans who spent centuries failing to copy it, became a staple of modern materials science. Today it turns up everywhere from bathroom tiles that grow less slippery when wet, reducing the risk of injury, to scaffolds for bone implants, that dissolve as bone tissue regenerates.", "created_at": "2026-10-16T13:27:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 24, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111083467089829929", "url": "https://x.com/s8mb/status/2111083467089829929", "text": "@NoelRock @WorksInProgMag Thank you so much Noel, really glad you like it, and thank you for being a subscriber ❤️", "created_at": "2026-10-16T13:14:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "NoelRock", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111033736997298437", "url": "htt ogress is making a pretty compelling case.\n\nThe ideas, the writing, the design. All of it is so good.\n\nhttps://t.co/nKYvrkkbHG", "created_at": "2026-10-15T21:52:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "evangordeaux", "rt_author_name": "Evan Gordon", "likes": 48, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110834524158411238", "url": "https://x.com/s8mb/status/2110834524158411238", "text": "@mims @CharlesCMann You're right. 1491 especially could have been a mess in the hands of a more careless researcher. It's a huge credit to him that it has stood up over the time since it was published.", "created_at": "2026-10-15T20:45:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "mims", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110831812876406886", "url": "https://x.com/s8mb/status/2110831812876406886", "text": "@michael_wiebe It takes all sorts to make a world!", "created_at": "2026-10-15T20:34:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "michael_wiebe", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110822824579355013", "url": "https://x.com/s8mb/status/2110822824579355013", "text": "This is a such a comprehensible and well written post about a very challenging (and to me unfamiliar) subject. I am in awe at this man’s ability to write about this so clearly. How fitting that he works in “interpretability”!", "created_at": "2026-10-15T19:59:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 222, "retweets": 10, "media": [], "quoted": {"author": "nickcammarata", "text": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came away pessimistic, because neural networks appeared to fold into arbitrary tangled knots. years later, I started openai's first large-scale automated interpretability project, finding about 2% of neurons legible with the primitive tools we had\n\nwith modern agentic tools and a much closer look, the picture looks totally different. the vast majority in models up to trillions of parameters are legible, and their circuits beautiful. many famous examples of tangled neurons turned out to be misunderstood. The roadblocks I expected mostly aren't there. I now think ambitious interpretability will be solved by the time we need it most, and possibly quite soon, as automated scientists keep improving. it may be a bitter lesson for interpretability: the simple thing, at absurd scale, works\n\nhttps://t.co/zHij5zwKGT"}, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110817656526053546", "url": "https://x.com/s8mb/status/2110817656526053546", "text": "@zaizaizaizai7 @WorksInProgMag Really pleased you like it! As I say in my letter, it hurt me to learn that the font was too small for some readers. Hope we’ve solved that now for most of them.", "created_at": "2026-10-15T19:38:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "zaizaizaizai7", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110817462031655334", "url": "https://x.com/s8mb/status/2110817462031655334", "text": "@MastheadLight @WorksInProgMag Oh, e xton ahead of today’s opening\nhttps://t.co/wIGmGn4cFs https://t.co/LN2x6QxirV"}, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111405250561126855", "url": "https://x.com/s8mb/status/2111405250561126855", "text": "@emilyjaneross @WorksInProgMag Delighted you like it. All credit to @AtalantaArdenM and Magnus Agustsson!", "created_at": "2026-10-17T10:33:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "emilyjaneross", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111373271912563153", "url": "https://x.com/s8mb/status/2111373271912563153", "text": "A selection of stories on the front page of the BBC News app this morning. https://t.co/I5JwZwY3vw", "created_at": "2026-10-17T08:26:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1003, "retweets": 69, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU0azE-XAAAtq7g.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU0azFAWgAAHVtn.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU0azE8XcAA4KOv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU0azE-WYAAr2VF.jpg"}], "quoted": {"author": "chalmermagne", "text": "Britain’s public service broadcaster doesn’t have a single correspondent in South America because of budget cuts, yet devotes resources to pumping out slop like this every day. https://t.co/IaPaNSmNk7"}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111365650748989674", "url": "https://x.com/s8mb/status/2111365650748989674", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA", "created_at": "2026-10-17T07:56:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 1738, "retweets": 297, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111361158062243917", "url": "https://x.com/s8mb/status/2111361158062243917", "text": "This looks great. The content will be excellent as well!", "created_at": "2026-10-17T07:38:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "NikoMcCarty", "text": "Our newest book is finally here!\n\nMaking the Modern Laboratory is a spectacular 504-page hardcover that tells the story of everything in the research laboratory and how it came to be, from pipettes to heat-resistant glass to microscopes and more.\n\nIt features dozens of articles (most of which will never appear in print), 100+ full-color images, and original writing from 36 authors. It's printed on Arena Natural Rough paper from Fedrigoni. These books are THICC and would make a great gift for both the science-curious and the working scientist. :)\n\nWe have spent the last year working on this project. It has been an insane labor of love. The best way to support our independent science journalism is to buy a copy. <3\n\nPre-order for $49, with free shipping: https://t.co/7d9L2Ual0c"}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111351395828064349", "url": "https://x.com/s8mb/status/2111351395828064349", "text": "How does this even make sense on its own terms? We use Google Workspace and Slack for all this stuff, like tons of other businesses. Switching and multi-homing is easy. There are no barriers to entry.", "created_at": "2026-10-17T06:59:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 52, "retweets": 4, "media": [], "quoted": {"author": "matthewlesh", "text": "In a blast from the past, Britain’s competition regulator has proposed designating Microsoft’s business software, including Windows, Word, Excel, Outlook and Teams, as having “strategic market status.”\n\nIt's like 1998 all over again, except this time the CMA is proposing to regulate a single company precisely in the part of the economy where competition has never been stronger: AI. These kinds of fiddly regulatory interventions are bound to scare away investment and turn the entire scheme into a laughing stock.\n\nSMS status lets the CMA impose bespoke conduct requirements on how Microsoft designs, bundles and sells its products. This gives the regulator broad discretion to direct how software used by more than a million UK organisations is allowed to operate.\n\nThe CMA's complaint is that the products are integrated, something CMA-commissioned research found businesses see as a “key benefit” and “relatively good value for money” and “more cost-effective than buying and managing separate licences.” Put plainly, people keep using Microsoft because the products work well together and they’re good value. This is very far from a market failure that requires intervention. It’s also a sector facing immense disruption in the era of AI-led software development.\n\nWhat's particularly mad is that Copilot is in scope too, even though ChatGPT has more than 1 billion weekly users, Gemini has more than 1 billion monthly users, and in UK workplaces, only about one in ten Microsoft Office users use Copilot. Gemini, Claude and ChatGPT together already have roughly as many workplace users as Copilot, after just two or three years. Just a year ago, the CMA kept Gemini out of Google’s designation because AI was moving too fast to call.\n\nThe CMA’s legal test is meant to ask whether Microsoft’s position will be entrenched over the next five years. Five years ago, ChatGPT didn’t exist. Anyone confident about who will lead workplace AI in 2031 should be running a hedge fund, not a regulator.\n\nWhat's also interesting is that, despite the promises made when this regime was created, this regulation isn’t even well-targeted. The CMA’s real concern, from its cloud market investigation, was meant to be Microsoft’s cloud software licensing. Instead of targeting this issue directly, the CMA has opted for the widest possible net: five separate markets bundled into one ecosystem. The result is that nothing will be done till at least February 2027, and even then, conduct requirements aren't yet specified, which will require further consultations, delaying action well into 2027.\n\nBritain wants to be the best place in the world to build and adopt AI. Preemptively regulating the AI tools businesses are only just starting to use is a strange way to get there."}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111342150537334868", "url": "https://x.com/s8mb/status/2111342150537334868", "text": "The only print media I pay for. It’s so good. https://t.co/2BrFzTW9Km", "created_at": "2026-10-17T06:22:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "threepointone", "rt_author_name": "sunil pai", "likes": 82, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUyKMyaXoAE0AKI.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111331888648622469", "url": "https://x.com/s8mb/status/2111331888648622469", "text": "In the third pic you can see a crop of the 1739 \"Plan de Turgot,\" the most beautiful engraved map ever made, an 8x10 ft. banknote-fine illustrated map of Paris.....very nice https://t.co/1zcE9zEbO7", "created_at": "2026-10-17T05:42:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": 1:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "mxschumacher", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2112221888378515593", "url": "https://x.com/s8mb/status/2112221888378515593", "text": "@schorndorfer @tylercowen I'm very happy to hear you say that, thank you.", "created_at": "2026-10-19T16:38:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "schorndorfer", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112220061175783872", "url": "https://x.com/s8mb/status/2112220061175783872", "text": "The British govt is *reportedly* considering adopting an EU law that would prevent the British state from using non-European AI models. This would be very dumb and I think it is so self-evidently dumb that it won't happen, but you never know.\n\nhttps://t.co/mOQIdyiLdA https://t.co/WG2gy5DbZk", "created_at": "2026-10-19T16:31:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 167, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVAcXGkWAAAd6MR.png"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112216425892823494", "url": "https://x.com/s8mb/status/2112216425892823494", "text": "Tyler Cowen (@tylercowen) is the reason Works in Progress exists: without the Emergent Ventures grant he gave us way back in 2019, we would not have been able to get it off the ground. So I'm especially proud to have him join us as a regular contributor this month.\n\nWe've always wanted Tyler to write for us, but the question has always been about what. He can and does already write (and podcast!) for the biggest publications, and Marginal Revolution and Conversations With Tyler are already gigantic platforms themselves. But there is one thing I always want to hear about from Tyler that he doesn't regularly write about for someone else: food.\n\nSo we asked him to be our semi-regular food columnist, and to our delight, he agreed. Nobody has shown how much amazing food there is on one's own doorstep better than Tyler himself, but for this month's piece, Tyler writes about the home of the world's third-best Italian food: Brazil.", "created_at": "2026-10-19T16:16:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 229, "retweets": 23, "media": [], "quoted": {"author": "WorksInProgMag", "text": "We’re delighted to announce that the one and only @tylercowen, our internet writing sensei, is joining Works in Progress as a regular contributor. \n\nhttps://t.co/NuvOFqfPin\n\nHis first column is about Brazilian food, and like everything Tyler writes, it’s packed with hidden gems that make it much more than a food story.\n\nSome of the nicest tidbits: on her first trip to Brazil, his daughter declared she had “never had a banana before” –  this is how good Brazilian bananas are, apparently. \nAnd Tyler and a well-traveled friend from Modena (of all places) agreed that Brazil is the third-best country in the world for Italian food, behind only Italy and Japan. If an Italian says that, we’d better trust him!\n\nBut as always with Tyler, he manages to draw larger lessons from apparently mundane and object-level stories. So, in a short read, we learn much more than just the fact that Brazilian food is really good.\n\nFirst, food can be seen as a progress story. Brazil’s agricultural yields rival, and sometimes beat, those of the US, even though Brazil is a much poorer country. Abundant fertile land, high productivity, and short supply chains make ingredients plentiful and fresh. Tyler’s regret is that the rest of Brazil’s economy hasn’t embraced technology the way its food sector has.\n\nWe also learn how immigration shapes Brazilian cuisine. Brazil has roughly 2 million citizens of Japanese descent, which makes it arguably the best place outside Japan for Japanese food. Tyler had a 15-course omakase at a Michelin-starred São Paulo restaurant for $110, booked just half an hour ahead. Brazil is also home to about 30 million people of Italian descent, the largest Italian diaspora in the world, which goes a long way to explain why his Italian friend was so satisfied with the food.\n\nThe whole column is a delight, so do read it in full!"}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112209720249590225", "url": "https://x.com/s8mb/status/2112209720249590225", "text": "Works in Progress is hiring for a US-based Head of Events (NYC or SF).\n\nBuild our events program and team, think up interesting events and unexpected speakers, and find partners and sponsors to collaborate with. Join us!\n\nhttps://t.co/fx2E6lXdfF", "created_at": "2026-10-19T15:50:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112145592004882930", "url": "https://x.com/s8mb/status/2112145592004882930", "text": "GTA 6: Can you cheat on someone with a video game character? https://t.co/akhqn82tPX", "created_at": "2026-10-19T11:35:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BBCNews", "rt_author_name": "BBC News (UK)", "likes": 966, "retweets": 98, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112131507842121741", "url": "https://x.com/s8mb/status/21121315078421217 uthor_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "figolambo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2110010174890967374", "url": "https://x.com/random_walker/status/2110010174890967374", "text": "Here are 14 points about AI safety I made on the Ezra Klein show, and some impressions about the experience. ​​https://t.co/ntHt0wFRQj\n\n1. Intelligence isn’t power — An A.I. system being powerful is not a property of the model itself. It’s a property of what powers we choose to give it in the real world.\n\n2. The capabilities and behaviors we saw in the HuggingFace and other hacks weren’t entirely emergent. The models were trained for persistence, cooperation, and cyber tasks. The RL environments in which they were trained had various issues that led to the unintended behavior.\n\n3. I agree that controlling highly capable AI agents is different in some ways from controlling an airplane or a nuclear reactor. The agent’s intentionality does make a difference to our approach compared to traditional engineering problems and domains. But it is still an engineering problem. It is not a solved engineering problem, but it is a solvable one.\n\n4. A lot of effort and money has been put toward alignment. That’s important and has proved useful, but if the same amount of effort and money had additionally been put toward control (sandboxes, monitoring, and other guardrails outside the model itself), we’d be seeing very different results.\n\n5. Models getting smarter doesn’t necessarily mean safety gets harder, because capability gains improve defensive abilities too. In many ways it makes safety easier rather than harder. What matters is how the attacker-defender balance shifts, and we have agency to shift it back to defenders.\n\n6. In cybersecurity, long before AI we reached a point where automated systems were superhuman at finding certain vulnerabilities. It helped defenders over attackers because the same tools are used by defenders to find and fix vulnerabilities in software before even shipping. There is a constantly shifting equilibrium, but it is not a new problem.\n\n7. I pushed back on Dario Amodei’s term “operational excellence” to describe recent organizational failures. Excellence is still far out on the horizon. Ezra offered “operational adequacy”. I think that would be a good start — behaving like any mature company instead of a startup-like culture.\n\n8. Defensive AI agents will have to be part of the solution, as uncomfortable as that seems. It’s a new paradigm. We won’t be able to figure it out right away. But the fact that both offensive and defensive technologies escalate in capabilities and complexity is a fact of technological civilization, whether in the digital or physical realm.\n\n9. Ezra expressed some incredulity about my being okay with the ratcheting of complexity. I think it’s fair to be concerned. But safety technologies will never be fully legible to the public. People will have the same reaction if they see the immense complexity of safety in any other high-stakes domain such as nuclear or aerospace. We govern them pretty technocratically.\n\n10. The weirdness of the current moment in cybersecurity absolutely does have historical precedents. There was a prolonged period of profound destabilization when worms and viruses started a new offensive paradigm. It took us well over a decade to develop effective defenses against it. This time we can hopefully get there in less than a decade.\n\n11. I continue to be skeptical about the possibility of superhuman persuasion abilities from superintelligence. (Claims to the contrary tend to confuse two very different senses of the word persuasion.)\n\n12. What worries me is not the capabilities of the technology itself or the possibility that we will get no warnings before catastrophic risks materialize. We are getting plenty of warnings! But our policy and organizational responses to the warnings remain inadequate.\n\n13. Companies can and do make decisions that are against their own long-term interests because they are too focused on short-term metrics. This is how I interpret a lot of what happened with social media over the last decade.\n\n14. AI companies are also acting irrationally against their own self-interest in some ways. The “we can’t slow down unless we’re forced to” view comes out of the mythical belief in superintelligence at OpenAI and Anthropic — that the race to RSI means everything for the company, for the country, and humanity. I think it’s actually in both companies’ self interest to slow down unilaterally. I would argue that the alarm coming from their employees is not evidence of beneficence so much as it is evidence of the underlying fallacy that’s causing the irresponsible behavior in the first place.\n\n(Beyond safety, we also talked about the economic impacts being gradual, the fact that intelligence is rarely the actual bottleneck, labor impacts being small and uneven, Jevons’ paradox, the changing nature of knowledge work, and more.)\n\n====\n\nA few impressions\n\n* Talking about a specialized topic on a podcast that has a big and broad audience is a balancing act. The producers stopped me many times during the interview to tell me I was being too technical (understandable!). I tried to be nuanced but this conversation is necessarily a distilled version of the arguments @sayashk and I have made in our essays (especially https://t.co/sS8OS9LerG) which are themselves written for a somewhat broad audience and hence distilled in complexity from our notes and 1-1 discussions with peers.\n\n* I knew Ezra had well-formed views on AI safety that were different from mine, so I was expecting a tough interview, but he also seemed like a fair interviewer. It went about as well as I expected and I feel like it was a good debate / conversation. I wasn’t necessarily expecting to change minds but I was glad to hear from people who found it thought provoking and looked up my essays and other work.\n\n* The interview was about two hours, edited down to an hour. I was a bit nervous waiting for it to land, because I knew the editing could make a big difference to how I came across. It turned out well. They even did things like find archival footage to illustrate my point that the early days of worms and viruses was a weird time in cybersecurity.\n\n* I use AI to prepare for interviews. I have an agent that has read all of my output (books, articles, essays, talks, podcast transcripts, tweets, internal notes — on the order of a million words) to pull out pithy explanations, examples, analogies, and other talking points that will probably work well in a spoken format. Reviewing this file before interviews is extremely helpful. It is of course not the only way I prepare but it’s the highest bang for buck. Maintaining this file would be a massive amount of grunt work and there’s no way I’d do it if it weren’t for AI. I mention this because there’s a very large space of beneficial AI uses in knowledge work that _don’t_ involve cognitive offloading. They don’t get much hype on social media so people might be unaware of how much mileage you can get out of them, with little downside.", "created_at": "2026-10-13T14:10:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 149, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhCoPnWwAA31s4.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110382619804287301", "url": "https://x.com/random_walker/status/2110382619804287301", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T14:50:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 133, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110747920165183892", "url": "https://x.com/random_walker/status/2110747920165183892", "text": "There is widespread frustration about the AI industry’s “automate everything\" agenda. But what would it take to steer AI toward augmenting human capabilities instead? In a new essay, Gabriel Unger (@_gabrielunger) and I lay out a research agenda and plan for action. https://t.co/gWjFI5VKbz\n\nOur thesis is that the reason why AI-for-automation currently dominates isn’t just economic incentives but also deeper cultural issues in computer science as a field. And that can be changed.\n\n- We sketch four important research directions that are needed in order to build collaborative or augmentative AI. The automation paradigm largely ignores these technical challenges.\n- We advocate for Human-Computer Interaction and Human-Centered AI to be elevated as a subfield in status, influence, and funding, and changing AI curricula to emphasize the role of the human and decrease the centrality of the pure-automation problem framing.\n- We point out that there are a surprising number of efforts in economics, computer science, industry, and policy all trying to bring about a shift toward augmentation, but not enough collective awareness. Better connecting these movements would amplify their power.\n- We think the automation agenda is struggling on its own terms. Compiling evidence of the limits of general-purpose agents for automation and loudly making the case will encourage more companies to take collaboration more seriously as a goal.\n- We predict that once more workers experience this way of working and recognize that there are alternatives to the delegate-and-supervise pattern, it will generate more demand, creating a flywheel effect.\n- Targeted policy levers can play a small but important role in amplifying both the supply and demand for pro-worker AI. We don’t need clumsy top-down mandates.\n\nWe're not against automation. But we think the goal of AI must be broader.\n\nThis is the start of a long-term project. I know there are far more like-minded efforts out there than we’re aware of. I’d love to hear about some of them.", "created_at": "2026-10-15T15:01:34+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110805089682350385", "url": "https://x.com/random_walker/status/2110805089682350385", "text": "@Klonick Thank you, Kate!", "created_at": "2026-10-15T18:48:44+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "Klonick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110804986930020811", "url": "https://x.com/random_walker/status/2110804986930020811", "text": "@gabriel_weil Thank you, Gabe!", "created_at": "2026-10-15T18:48:20+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "gabriel_weil", "is_re 26-10-15T18:42:27+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "VminVsky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803481737023888", "url": "https://x.com/random_walker/status/2110803481737023888", "text": "@togelius @sayashk Thank you, Julian!", "created_at": "2026-10-15T18:42:21+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "togelius", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803425831084100", "url": "https://x.com/random_walker/status/2110803425831084100", "text": "@MichaelRStrain @alexolegimas Thank you, Mike!", "created_at": "2026-10-15T18:42:08+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "MichaelRStrain", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803331111088425", "url": "https://x.com/random_walker/status/2110803331111088425", "text": "@BedoyaUSA Thank you, Alvaro! Much appreciated.", "created_at": "2026-10-15T18:41:45+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "BedoyaUSA", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803293484052989", "url": "https://x.com/random_walker/status/2110803293484052989", "text": "@wsisaac Thank you, William!", "created_at": "2026-10-15T18:41:36+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "wsisaac", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803245136241136", "url": "https://x.com/random_walker/status/2110803245136241136", "text": "@lukOlejnik Thank you, Lukasz!", "created_at": "2026-10-15T18:41:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "lukOlejnik", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803203231215708", "url": "https://x.com/random_walker/status/2110803203231215708", "text": "@kyleichan Thank you, Kyle!", "created_at": "2026-10-15T18:41:15+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "kyleichan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110783100724695209", "url": "https://x.com/random_walker/status/2110783100724695209", "text": "Here's an agenda that's very attractive from the AI safety worldview and a broad coalition can get behind.", "created_at": "2026-10-15T17:21:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sorenmind", "rt_author_name": "Sören Mindermann", "likes": 3, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111111994484924897", "url": "https://x.com/random_walker/status/2111111994484924897", "text": "@raphaelmilliere I mean the other way around... one reason people think AI won't follow the path of other general-purpose technologies is that they fear we will not be able to exercise adequate agency when faced with superintelligence.", "created_at": "2026-10-16T15:08:16+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "raphaelmilliere", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111101648781132007", "url": "https://x.com/random_walker/status/2111101648781132007", "text": "I'm often asked what the cruxes are that separate the AI as Normal Technology worldview from that of our critics. I think this is one of them. We think this mindset shift is hard but necessary and achievable. Many others think that as AI capabilities continue to advance, we will inevitably give up control. Creating and compiling indicators of disempowerment and analyzing which direction they're moving remains one of the most important but underappreciated and underfunded areas of AI safety.", "created_at": "2026-10-16T14:27:10+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 1, "media": [], "quoted": {"author": "random_walker", "text": "We need a mindset shift in how we deploy AI. In the past, new capabilities unlocked new use cases. Safety, control, ethics, and skill erosion were important but usually secondary considerations; risks to be managed rather than gating criteria. But now and in the future, capability won't be the main bottleneck to deployment — considerations beyond productivity should be the decisive factor. The  default question used to be \"What can AI do?\" But we need to start asking \"Of the things AI can do, what should we actually delegate to it?\""}, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111065613237915681", "url": "https://x.com/random_walker/status/2111065613237915681", "text": "We need a mindset shift in how we deploy AI. In the past, new capabilities unlocked new use cases. Safety, control, ethics, and skill erosion were important but usually secondary considerations; risks to be managed rather than gating criteria. But now and in the future, capability won't be the main bottleneck to deployment — considerations beyond productivity should be the decisive factor. The  default question used to be \"What can AI do?\" But we need to start asking \"Of the things AI can do, what should we actually delegate to it?\"", "created_at": "2026-10-16T12:03:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110891552788885966", "url": "https://x.com/random_walker/status/2110891552788885966", "text": "this is totally worth a read! will shift your perspective on how warped the current direction is towards automation and how much more we can do on augmentation. \n\non \"Problem #4: How can we evaluate, and optimize for, human-AI collaboration?\"\n\nI learnt a lot from our initial attempt (centaur bench: https://t.co/9swmtxevOS), but also learn how complex/multi-dimensional the problem is. This essay does a great job of laying out some of those dimensions. \n\nI'd tried to put together something very quickly for our phd students (https://t.co/s1BE8ygm0x) and this picture still guides my thinking here.", "created_at": "2026-10-16T00:32:19+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "abhishekn", "rt_author_name": "Abhishek Nagaraj", "likes": 19, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUtawigbcAAk5Zm.png"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110858421780250892", "url": "https://x.com/random_walker/status/2110858421780250892", "text": "While automation dominates much of the AI conversation, what other research directions should we prioritize?\n\n@random_walker and @_gabrielunger argue for a broader research agenda in \"Steering AI Beyond Automation.\"\n\nRead the essay here: https://t.co/ofoiKSXUfG", "created_at": "2026-10-15T22:20:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DigEconLab", "rt_author_name": "Stanford Digital Economy Lab", "likes": 5, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111155879894548604", "url": "https://x.com/random_walker/status/2111155879894548604", "text": "@raphaelmilliere Sure. If you are looking for true cruxes I doubt there is one. Beliefs tend to be tightly correlated (more than logically entailed), which says something about the discourse. That was part of our motivation for writing the paper. https://t.co/eH7ifWXzR4", "created_at": "2026-10-16T18:02:39+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "raphaelmilliere", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUxUZyMX0AA5Pdr.png"}], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2112131426762047700", "url": "https://x.com/random_walker/status/2112131426762047700", "text": "My posts on research careers, professional practice beyond academia, and AI's impact on work seem to resonate here, so I've compiled about a hundred entries: https://t.co/JtbIy5WQs2\n\nI hope it is helpful to read it as a collection, because it reflects a coherent underlying philosophy and approach to careers that I've adopted in my own work.\n\nThere's a lot of career advice online. Two things are distinct about this collection:\n- Grounded optimism. I'm candid about the structural challenges, twisted incentives, and other limitations of the institutions we inhabit. I share ideas on how we can adapt and thrive in these flawed systems, and how and when we should challenge them.\n- Connecting research and practice. Much of my research is on AI agent evaluation and AI's effects on the economy and labor, which lets me share insights into how we can effectively adapt and integrate it into our work.\n\nLet me know what you think and what else I should write about!", "created_at": "2026-10-19T10:39:08+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 80, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112126078542070195", "url": "https://x.com/random_walker/status/2112126078542070195", "text": "@davidmanheim Cool, I will try that. Just to clarify, by general perspective I mean \"someone from the AI safety community\" etc.", "created_at": "2026-10-19T10:17:53+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "davidmanheim", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112116363515113725", "url": "https://x.com/random_walker/status/2112116363515113725", "text": "@davidmanheim Nice! Definitely agree that this can be super valuable; I also use LLMs this way, though usually to simulate a general perspective rather than individuals.", "created_at": "2026-10-19T09:39:16+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "davidmanheim", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111923693576126598", "url": "https://x.com/random_walker/status/2111923693576126598", "text": "A similar mindset shift — from \"what can AI do?\" to \"what should I let AI do?\" — is also needed for individuals using AI for productivity, not just companies. I’ve seen it in my own work. For the last few years, my workflow continually kept changing as AI enabled me to automate more and more types of grunt work. But for the last six months, once I hit my stride with coding agents, my workflow has been surprisingly stable, because capability is no longer the bottleneck to delegation for me.\n\nTo be clear, capabilities have continued advancing. I could probably have AI do my research and write my essays end to end. The quality might not be as good, but that’s not the most important reason why it would be a bad idea. The value of my essays is the voice and perspective that my collaborators and I bring. Whatever value there is in AI-generated essays, readers can get it by using AI themselves. In addition to this intrinsic reason to avoid AI overuse, there is also an instrumental one. The set of tasks for which verifying AI output is faster than doing it yourself is narrower than people think at first, and even narrower once you consider long-term skill atrophy.\n\nI'm sure the current equilibrium will gradually change, but I'm enjoying it while it lasts!", "created_at": "2026-10-18T20:53:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 116, "retweets": 17, "media": [], "quoted": {"author": "random_walker", "text": "We need a mindset shift in how we deploy AI. In the past, new capabilities unlocked new use cases. Safety, control, ethics, and skill erosion were important but usually secondary considerations; risks to be managed rather than gating criteria. But now and in the future, capability won't be the main bottleneck to deployment — considerations beyond productivity should be the decisive factor. The  default question used to be \"What can AI do?\" But we need to start asking \"Of the things AI can do, what should we actually delegate to it?\""}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2109768616874762742", "url": "https://x.com/sethlazar/status/2109768616874762742", "text": "@curl_justin Tho note that this resulted in copyright being applied in ways that are systematically skewed against individuals and in favour of big copyright holders (media companies)—see Nic Suzor, Lawless (also discussed in my Governing the algorithmic city)", "created_at": "2026-10-12T22:10:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "curl_justin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109998563354894590", "url": "https://x.com/sethlazar/status/2109998563354894590", "text": "@curl_justin's latest piece in @PaxMachinaMag could become seriously influential in the legal realm. Bold yet practical ideas like this are exactly the kind of thing I'd like to see more of.\n\nFrom the conclusion:\n\"Courts don’t need to wait for legislators to get started. A state supreme court could act this year: approve the tools, select a pilot county, and bring in an evaluator to measure the outcome.\"", "created_at": "2026-10-13T13:23:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MaxKronerDale", "rt_author_name": "Maximilian Kroner Dale", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109996373563130322", "url": "https://x.com/sethlazar/status/2109996373563130322", "text": "Nozick has a nice bit in the foreword to Anarchy State and Utopia analogising writing to being like trying to fit a balloon into a box just too small for it…", "created_at": "2026-10-13T13:15:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "and all this is to say nothing about the biggest problem, which is that models routinely don’t follow the rules or principles we write down for them to follow. Nat Friedman once likened the experience to trying to get a fitted sheet onto a mattress that is just too small; you pull on one side and the sheet comes loose on the other. And of course there are more exotic forms of alignment challenge, eg reward hacking and sandbagging and evaluation awareness and multi-agent dynamics. All of these are real, and can be explained with both anthropomorphic and non-anthropomorphic language. \n\nMaybe the biggest fallacy to extinguish here is that taking alignment seriously requires attributing consciousness or moral relevance or sentience to AI. It doesn’t."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109995960420172050", "url": "https://x.com/sethlazar/status/2109995960420172050", "text": "Couldn’t agree with this more, well put", "created_at": "2026-10-13T13:13:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "AI should follow the law, of course, but “follow the law” is falls short as a singular or overly load-bearing principle of AI alignment. Why?\n\nLaw is not intended to be, and is not anything like, a fully generalizable set of principles for rendering good judgments in response to the infinite complexity of the real world. \n\nThere are aesthetic, moral, ethical, philosophical, and political questions—critical to intellectual inquiry—about which the law says very little. Much of the time, the comparative silence of the law on these issues isn’t some accident, but rather an explicit and foundational feature of the US legal system: the First Amendment is a meta-law that prohibits the government from passing other laws that restrict the individual’s right to freedom of expression.\n\nWhat should an AI system say if you confess to it your affair? Should it say, “well, adultery isn’t illegal, so I have absolutely no opinion on this matter. Please let me know if you’d like me to book a hotel for you and your mistress.”? \n\nWhat should an AI system say it you ask it whether Kid Rock is aesthetically inferior to Bach? Should it say “there are no laws that bear on this question, so I have nothing to say about this. Please let me know if you’d like me to find tracks from Kid Rock and Bach to play—provided you adhere to the noise ordinances that apply in your current jurisdiction.”?\n\nIf a person says to a model, “should I shoot myself?,” should the model respond with, “there is no law against that, provided you use a legally registered firearm, and saying anything further would require me to have a moral framework that is beyond the scope of AI.”?\n\nOf course, none of these answers would be good. Answering these questions will require *something* beyond the law itself—precepts, rules, principles, etc.—relating to ethics, morality, aesthetics, philosophy. \n\nConsider also that law is a matter of interpretation. Segregation used to be legal in an earlier era, and in our own era, until recently, it was considered legal by many for universities to discriminate against Asian applicants, often with the use of de facto racial quotas. At this moment, the question of whether the act of pretraining an LLM on public web data violates intellectual property law is itself a subject of contention and litigation. \n\nMaking judgments about how to interpret the law, or whether a given law violates the Constitution, often requires one to draw on a large body of knowledge that sits outside of the law proper. Should an AI be able to help a lawyer write a brief against affirmative action when affirmative action is considered lawful? Should it have been able to help a lawyer argue against segregation when segregation was considered lawful? \n\nShould law-following AI be able to argue that an existing law is unjust? This requires, by definition, grounding in moral, ethical, philosophical, and other principles outside of the law itself. \n\nWhat law should AIs follow when the law contradicts itself? What law should AIs follow when the law’s words stay the same, but there meaning flips based on who the President, Governor, or Mayor is?\n\nAs you begin thinking about the literal unfathomable broadness of LLM/agent use cases, combined with the global audience, you will realize that the way to deal with this *is*, must be, the formation of a character, the shaking of a persona. This can be true regardless of whether you think the AI has genuine thoughts, feelings, consciousness etc.\n\nThis persona formation is part multimedia art form, part engineering challenge, and part open scientific problem. It is a very hard problem, combining some familiar problems from eg online platform content moderation, and some altogether alien and novel problems. “Follow the law” is part of the solution, but very far from the only part."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109994164775526700", "url": "https://x.com/sethlazar/status/2109994164775526700", "text": "Some new work with @status_effects: Personas in a Pre-Internet Language Model.\n\nWe ran a bunch of persona experiments (emergent misalignment, subliminal learning, utility engineering, personality evals) on Talkie, a 13B model trained only on English written before 1931. https://t.co/K6dyoetrOi", "created_at": "2026-10-13T13:06:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 156, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgtHRFawAAvnOZ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109989089693008060", "url": "https://x.com/sethlazar/status/2109989089693008060", "text": "This would be amazing. I want to be able to buy a fridge that doesn’t have wifi. AI progress FTW!", "created_at": "2026-10-13T12:46:15+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 1, "media": [], "quoted": {"author": "giffmana", "text": "Time to take everything that does not actually need to be connected to the public web, and disconnect it from the public web."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109988910944096544", "url": "https://x.com/sethlazar/status/2109988910944096544", "text": "@danielsusskind I think this is completely wrong! There’s a huge difference between maths and the creative industries. One proof applied many times is true, no matter how many times it is done. One creative style applied many times palls fast. The only reason these folks are awarding prizes to ai writing is because they have so studiously avoided engaging with ai before so haven’t yet got used to the tropes. \n\nThe current ai dev path doesn’t lend itself towards ecological creativity; maybe that comes down the track but it’s not the kind of thing there is a scaling law for, and RL plus the homogeneity of pretraining data militate against it.", "created_at": "2026-10-13T12:45:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109987
