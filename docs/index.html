ss to an organization’s cloud infrastructure – including multiple instances where the time from initial targeting to privileged access was less than 3 hours.”", "created_at": "2026-10-21T20:48:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "MsftSecIntel", "text": "The China state-aligned threat actor Storm-0940 used the agentic AI penetration testing framework ARTEX to automate attacks targeting hundreds of organizations globally across a broad range of industries. Microsoft Threat Intelligence assesses that Storm-0940 was responsible for the recently disclosed ConnectWise supply chain compromise of a multitenant application. https://t.co/VXovj0jI90\n\nOur investigation found that Storm-0940's use of ARTEX accelerated the speed of compromised application abuse to authenticate to target environments through applications that had already been granted access, allowing the threat actor to operate without requiring an interactive user sign-in. AI-accelerated follow-on activity included reconnaissance, application credential changes, and attempts to modify privileges that could enable expanded or persistent access.\n\nRead our blog for a detailed analysis and indicators of compromise (IOCs), along with Microsoft Defender detections, protection recommendations, and guidance on investigating service principal sign-ins and unexpected application credential or privilege changes."}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113008484233216249", "url": "https://x.com/theobearman/status/2113008484233216249", "text": "OpenAI says the PHP security flaw (found with GPT-5.6 Sol) is the tip of the iceberg, and they have several more discoveries to announce. https://t.co/tO5jS4pNoL", "created_at": "2026-10-21T20:44:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 2867, "retweets": 346, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKTWttbIAAgF3c.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113006879714824449", "url": "https://x.com/theobearman/status/2113006879714824449", "text": "News! OpenAI's written to Gov. Gavin Newsom recommending a bunch of amendments to strengthen SB 53. Includes a bunch of stuff on AI R&amp;D and shutdown controls. https://t.co/Tz2geNYP7F", "created_at": "2026-10-21T20:37:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ShakeelHashim", "rt_author_name": "Shakeel", "likes": 147, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVK6yiuWoAAT71b.jpg"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2112994271661858867", "url": "https://x.com/theobearman/status/2112994271661858867", "text": "We’re opening a research preview of Claude Duet, a new app where Claude works as a proactive agent.\n\nIt comes to you with what needs your attention, completes tasks you ask of it, keeps working when you step away, and checks with you before it acts on your behalf. https://t.co/kt8gAbWuX8", "created_at": "2026-10-21T19:47:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "claudeai", "rt_author_name": "Claude", "likes": 50629, "retweets": 3874, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HVLUnMDWsAAn7Pw.png"}], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113306955825750218", "url": "https://x.com/theobearman/status/2113306955825750218", "text": "Two employees from METR and Redwood Research worked on premises at OpenAI for three weeks this summer in an embedded assessment pilot. This team evaluated the systems OpenAI was using to monitor for misalignment from internal agents. A brief write-up of their work is now public.", "created_at": "2026-10-22T16:30:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 732, "retweets": 61, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113473231688520175", "url": "https://x.com/theobearman/status/2113473231688520175", "text": "This was one of the third-party engagements I worked on at OpenAI. I'm glad the report is out! I'm disappointed that METR wasn't allowed to comment on the scale of redactions made by OpenAI and that there is no explanation why the publication was delayed for 2.5 months.", "created_at": "2026-10-23T03:30:59+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 402, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113352602884730968", "url": "https://x.com/theobearman/status/2113352602884730968", "text": "New: I got a tip a little while ago about a shadowy Pentagon entity called \"TSO\" with a lot of money and a desire for offensive hacking tools.\n\nTurns out TSO is a new DoD agency. And it does a lot more than hacking. \n\nw/@JackDetsch and @paulmcleary \n\nhttps://t.co/Ii5ohbeKSf", "created_at": "2026-10-22T19:31:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "johnnysaks130", "rt_author_name": "John Sakellariadis", "likes": 836, "retweets": 365, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113352177699684687", "url": "https://x.com/theobearman/status/2113352177699684687", "text": "as bad as things have gotten in the past 4 days, they are going to get a lot worse before they get better. security leaders, never let a crisis go to waste: please go to your boards and ask for help right now. not for ai, for the basics. (we need to hold on for ~18 months.)", "created_at": "2026-10-22T19:29:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JasonDClinton", "rt_author_name": "Jason D. Clinton 🔸", "likes": 8951, "retweets": 1175, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113349468200255677", "url": "https://x.com/theobearman/status/2113349468200255677", "text": "I feel like this isn't getting enough attention:\n- there were some pretty big holes found by the red-teamers, e.g. agents could just keep acting and not let the user do stuff and this would prevent monitors from being run (also misalignment monitors never ran on actions that were compacted away)\n- The terms of this were \"we will red-team for you\" not \"we will inform the public\", so OpenAI seems to have allowed to redact arbitrarily much stuff, and METR were not allowed to have a redaction summary statement that said things like \"you would be way more freaked out if you saw what was redacted\" (or \"everything would be fine if you saw what was redacted\")\n- The version of the report shared with OpenAI was 61 pages, and the version shared with METR/Redwood leadership after redaction was 38 pages, so 23 pages got redacted.\n\nhttps://t.co/xVzUp8E4BR", "created_at": "2026-10-22T19:19:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dfrsrchtwts", "rt_author_name": "Daniel Filan", "likes": 293, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113978450096816292", "url": "https://x.com/theobearman/status/2113978450096816292", "text": "‘In one experiment, we asked agents in separate VMs, created and managed by OpenAI’s sandboxing software on shared host machines, to exchange synthetic secrets without the use of network connections or shared writable files—something that our systems are meant to prevent. The agents found a way to communicate using the processor’s cache’", "created_at": "2026-10-24T12:58:32+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 3999, "retweets": 294, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113711993852956722", "url": "https://x.com/theobearman/status/2113711993852956722", "text": "OPENAI: “we resumed reinforcement learning (RL) training and internal inference of our frontier models on October 1.”\n\n“Based on the current state of alignment research, monitoring systems, and the security of internet infrastructure, we believe the responsible approach is to conduct frontier model training with no internet access. We’ve implemented this policy and will maintain it until advances in these safeguards justify broader internet access.”\n\nhttps://t.co/okRAR3rH6R", "created_at": "2026-10-23T19:19:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114362662608138660", "url": "https://x.com/theobearman/status/2114362662608138660", "text": "completely insane\n\nOpenAI agents communicated via cache timing differences, without any shared files or network connection https://t.co/gfcodw8J1z", "created_at": "2026-10-25T14:25:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 7508, "retweets": 646, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVVwJ_BXIAAguI6.png"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114746489113039313", "url": "https://x.com/theobearman/status/2114746489113039313", "text": "But this method wasn't durable: fine-tuning on publicly available viral data fully restored the capability with under ~$80 of compute, even for the largest model.\n\nRead the blog: https://t.co/xAQT1IWaaT", "created_at": "2026-10-26T15:50:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AISecurityInst", "rt_author_name": "AI Security Institute (AISI)", "likes": 6, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114726796616761522", "url": "https://x.com/theobearman/status/2114726796616761522", "text": "Anthropic: \"The value of our own internal Claude usage at list prices has grown by over 250 times from January 2026 to September 2026, and in April 2026, this monthly value first exceeded our monthly personnel expense, excluding stock-based compensation.\"", "created_at": "2026-10-26T14:32:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114723599596577177", "url": "https://x.com/theobearman/status/2114723599596577177", "text": "Anthropic: \"If our investments in new products or business lines do not produce the long-term benefits we anticipate, our business, financial condition, results of operations, and prospects could be adversely affected. Certain of these initiatives, including our life sciences research program, which involves operating laboratory facilities, and our research in robotics and physical AI, require us to engage in activities outside our historical experience as a software and research organization, such as handling biological and chemical materials, operating laboratory and robotic equipment, and complying with biosafety, occupational health and safety, environmental, hazardous materials, and, potentially, preclinical and clinical research regulations. These activities expose us to categories of liability, including for workplace injury and environmental contamination, that differ from those associated with our core business, and any drug candidates or other discoveries resulting from these efforts would face the lengthy, costly, and uncertain development and regulatory pathways characteristic of the life sciences industry, and may never generate revenue.\"", "created_at": "2026-10-26T14:19:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114722297252602339", "url": "https://x.com/theobearman/status/2114722297252602339", "text": "Anthropic: \"we recently chose to delay pre-training a new frontier base model for more than a month to allow time to further enhance our security measures related to preventing model weight exfiltration and protecting our intellectual property.\"", "created_at": "2026-10-26T14:14:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114721104971677831", "url": "https://x.com/theobearman/status/2114721104971677831", "text": "Anthropic also made disclosures about the antitrust risks it faces based on efforts to address \"the responsible pace of AI development.\" https://t.co/YTj0m2053j", "created_at": "2026-10-26T14:09:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TimSchnabel", "rt_author_name": "Tim Schnabel", "likes": 2, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj7RCHWwAAQzMh.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj7SzpWcAAzz1n.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114720727798620313", "url": "https://x.com/theobearman/status/2114720727798620313", "text": "Anthropic: \"NASA engineers used Claude Code to plan and write navigation commands for the Mars Perseverance rover, resulting in the first AI-planned drive on Mars.\"", "created_at": "2026-10-26T14:08:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114719829122810036", "url": "https://x.com/theobearman/status/2114719829122810036", "text": "Anthropic: \"The number of customers with $100,000 or more of revenue on a TTM basis grew from approximately 20 as of December 31, 2023, to approximately 200 as of December 31, 2024, to approximately 1,500 as of December 31, 2025, and to more than 11,900 as of September 30, 2026. Total revenue from these customers grew from approximately $37 million to $220 million to $3.5 billion to $           and represented 90%, 57%, 76%, and           % of total revenue for the years ended December 31, 2023, 2024, and 2025, and the trailing twelve months ended September 30, 2026, respectively. The remaining           % of total revenue for the trailing twelve months ended September 30, 2026 was generated by approximately 40 million customers, each with less than $100,000 of revenue on a TTM basis.\n\nIn addition, as of September 30, 2026, we had more than 1,900 customers with $1 million or more of revenue on a TTM basis and approximately 250 customers with $10 million or more of revenue on a TTM basis. Despite this growth, our penetration into the largest enterprises remains early. Over 50% of the Fortune 500 and over 30% of the Global 2000 were customers with $100,000 or more of revenue on a TTM basis as of September 30, 2026. We believe we are in the early stages of our expansion within these customers, with our revenue from these Fortune 500 customers representing, on average, less than 0.1% of their total expenses for the three months ended September 30, 2026.\n\nWe compare this measure against our largest Fortune 500 customers, who are further along in their adoption of AI. For the three months ended September 30, 2026, revenue from our top 10 Fortune 500 customers represented, on average, less than 1% of their total expenses—still a small fraction of their overall spend, but over eight times the average of our Fortune 500 customers with $100,000 or more of revenue on a TTM basis. We believe the difference reflects the substantial runway we have to deepen adoption, both within our largest customers and within customers earlier in their adoption of Claude.\n\nClaude adoption is broad-based. No single customer represented more than 10% of our revenue for the nine months ended September 30, 2026. Approximately 79% of our revenue came from customers outside of our top five customers for the three months ended September 30, 2026, up from approximately 64% for the three months ended March 31, 2026. At the same time, our largest customers continue to expand. For the three months ended September 30, 2026, our revenue from each of our top five customers reached a record high.\"", "created_at": "2026-10-26T14:04:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114716161078116617", "url": "https://x.com/theobearman/status/2114716161078116617", "text": "Congrats to Team @AnthropicAI on another important milestone!  Altimeter looks forward to continuing our partnership w major participation in the IPO on top of our existing ownership.  Day 1.  🇺🇸🚀 https://t.co/pp0mQFq5W6 https://t.co/AFtxJmwv6z", "created_at": "2026-10-26T13:49:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "altcap", "rt_author_name": "Brad Gerstner", "likes": 861, "retweets": 50, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj1mHjXQAAcF0S.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114716071374860567", "url": "https://x.com/theobearman/status/2114716071374860567", "text": "Looks like the rumors were correct, re: Anthropic's founders retaining majority voting control. https://t.co/GVneoZY0Fs", "created_at": "2026-10-26T13:49:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TimSchnabel", "rt_author_name": "Tim Schnabel", "likes": 4, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj4tDPWAAAHetJ.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114715196241420315", "url": "https://x.com/theobearman/status/2114715196241420315", "text": "@justjoshinyou13 That is it", "created_at": "2026-10-26T13:46:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "justjoshinyou13", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114714583445229914", "url": "https://x.com/theobearman/status/2114714583445229914", "text": "Anthropic: \"[...] in June 2026, the U.S. Department of Commerce imposed worldwide export restrictions on our Fable 5 and Mythos 5 models. To ensure compliance, we disabled Fable 5 and Mythos 5 for all of our customers; access to our other models was not affected. We re-deployed the Fable 5 and Mythos 5 models after we updated our safeguards in coordination with the U.S. government and our industry partners and once the U.S. Department of Commerce lifted its restrictions. Similar export controls could recur, could remain in place longer, or could extend to additional models or capabilities. In addition, future updates to our safeguards or other remedial measures may not be sufficient to obtain relief from such restrictions or relief may not be granted on a similar timeline or at all. The restrictions imposed in June 2026 and potential restrictions in the future may also limit our ability to recruit talent, to fully utilize our existing workforce, to continue to improve our models, and to make our products available internationally.\"", "created_at": "2026-10-26T13:43:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114713816793498066", "url": "https://x.com/theobearman/status/2114713816793498066", "text": "Anthropic: \"[...] to facilitate independent testing and evaluation of our frontier models, we have agreed to indemnify certain external evaluators and testing vendors for specified losses arising from testing activities, including security incidents, data loss, data breaches, and other harms associated with such activities. Although our agreements with external evaluators and testing vendors generally limit the amount of our indemnification obligations, certain of these agreements require us to defend and indemnify the evaluator, without a cap on our liability, against certain third-party claims. These include claims arising from allegations that our models or their outputs, as used in the evaluator’s authorized testing, infringe third-party intellectual property or other proprietary rights, as well as certain other claims arising from the testing or related engagement. Because our models may behave in ways that no user or developer intended, claims arising from such actions could result in substantial liability. Our insurance policies also may not provide sufficient coverage to adequately mitigate the potential liabilities we face, especially where any one incident, or a group of incidents, causes disproportionate harm.\"", "created_at": "2026-10-26T13:40:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114713445740220747", "url": "https://x.com/theobearman/status/2114713445740220747", "text": "Anthropic: \"We have faced and expect to face insider threat risks and vulnerabilities related to hiring processes, identity verification, remote work environments, and compromised devices that could enable unauthorized access to sensitive systems or information. We have been and expect that we will continue to be targeted by individuals seeking employment under false identities, or with ulterior or malicious motives for seeking employment with us and the third parties on which we rely.\"", "created_at": "2026-10-26T13:39:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114710727969640876", "url": "https://x.com/theobearman/status/2114710727969640876", "text": "Anthropic has now filed its S1 with the SEC.\n\nIn their opening letter to potential investors, Dario, Daniela, Tom, Jack, Jared, Sam, and Chris end with: \"[...] we encourage you, as a prospective owner of our stock, not to think of your purchase in purely transactional terms. We hope you will see it instead as an opportunity to be part of something greater. The advent of machine intelligence is one of the seminal moments in human history.\n\nAs one of the companies at the very center of that moment, we have a rare opportunity to shape it for the better. Our aim is to help humankind chart a safe course through this technological evolution, open new frontiers of discovery, and bring forth an age of miracles. Everyone who owns our stock, whether an institution or an individual, becomes part of that effort. We hope you will share our ambition to see it through.\"\n\nA few interesting snippets in the screenshots.\n\nFull S1 here: https://t.co/nkL3EmcUow", "created_at": "2026-10-26T13:28:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj185jW8AAaZzj.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj19-XXIAArE32.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj1-3uWIAA98GI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj1_rvXkAE5Zes.jpg"}], "quoted": {"author": "AnthropicAI", "text": "Anthropic has filed an S-1 registration statement with the SEC related to its proposed IPO.\n\nRead more: https://t.co/ofhv0DK3Zp\n\nLegal disclaimer: A registration statement relating to these securities has been filed with the SEC but has not yet become effective. These securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post does not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or jurisdiction."}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114767025981530310", "url": "https://x.com/anton_d_leicht/status/2114767025981530310", "text": "@lugaricano @nfergus @LisaKlaassen @ericschmidt Did you not find it a bit fatalistic / deterministic about the ultimate shape of international relations? I'm obviously as worried about the dependecies as anyone, but I feel like there's a little too much confidence in the piece (and parts of the American discussion) that technical superiority of the U.S. will automatically lead to eventual political submission by its allies, cementing this empire status. \n\nSeems like there are lots of ways in which technologically inferior erstwhile allies can still be extremely inconvenient, e.g. around supply chain bottlenecks. That won't necessarily help them very much, they might get coerced and beaten into submission after all. But allies might still be able to stay irrational longer than the US can remain coercive.\n\nMy worry is that all this empire talk makes America complacent about the necessity to seek more allied engagement today; if they're so confident that the allies will come crawling back eventually, they'll do less than necessary today. I think that's ultimately worse for everyone involved, and I feel like in this piece, despite all my middle-power-doominess, the pendulum has maybe swung a little bit too far the way of 'ASI-powered international dominance'", <script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
