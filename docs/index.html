<script id="data" type="application/json">[{"id": "2119512708332573063", "url": "https://x.com/_achan96_/status/2119512708332573063", "text": "RE METR's measures of task-length and RSI: I'm still waiting to see a serious effort to determine how progress on coding/math/etc. generalizes to other tasks.\n\nI expect we'd see an \"accuracy on the line\" effect, where out-of-distribution (OOD) performance is highly correlated with their metric, but what is the slope?\n\nAlso: I'm not sure if we should expect a similar result when RL comes into the picture.  I think the generalization from RL and SL are probably quite different.\n\nI *do* think that accelerating AI R&D is obviously useful for some sort of \"RSI\", but it *might* end up just yielding some sort of savant, rather than AGI and ASI.\n\nI also have conflicting intuitions about how much one can learn general principles of reasoning that generalize well across domains (vs. performance being driven by domain-specific heuristics).  I tend to think there is a lot of space for improvement there, and that progress on math and coding probably indicates some progress in general reasoning ability, but I feel like there's surprisingly little research that I'm aware of that is actually trying to address this question.\n\nMaybe it's just mostly all happening in academia and so AI Safety and AI companies are ignoring it?  \n\nThe state of AI research is really quite dire: \n- We can't trust anything from the people with access to SOTA AI systems, because there's screwed up incentives and no transparency.\n- We can't trust that independent research results apply to SOTA systems because the field moves so fast.\n\nI guess independent research still seems like a better bet here... there have been some qualitative changes that emerge at scale, but it's more common IME for these sorts of results in deep learning to be generalize pretty well across models/scales, etc.", "created_at": "2026-11-08T19:29:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "rt_avatar": "https://pbs.twimg.com/profile_images/1968552490233901056/kofpoQOX_normal.jpg", "rt_id": "2119493906136272951", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWnyJ2JaUAAV3Gc.png"}], "links": {"https://t.co/c7r7E4cdiO": ""}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2120055143848722718", "url": "https://x.com/_achan96_/status/2120055143848722718", "text": "We built Control Room, a central system to track model workloads across our research infrastructure and stop them quickly when safety or security concerns arise.\n\nIt connects every research inference workload, including agentic sampling for model training and evaluation, data processing, and more. This works together with our misalignment monitoring systems, and halts model output within 35 seconds of a decision to intervene to stop or pause a job.\n\nControl Room is just one part of our holistic approach for safe frontier model training and deployment.\n\nhttps://t.co/tc0lBqFdS5", "created_at": "2026-11-10T07:25:09+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2119913172039868579", "likes": 4240, "retweets": 311, "media": [], "links": {"https://t.co/tc0lBqFdS5": "https://openai.com/index/control-room/"}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120053724756205571", "url": "https://x.com/_achan96_/status/2120053724756205571", "text": "New paper: Hard Cases for AI Behavioral Design\n\nSuppose that we solve the AI alignment problem: we can align superintelligence to anything we like. \n\nThe obvious next question is: aligned to what?\n\nThere are lots of principles we want:\n- AI should follow human instructions\n- AI should allow humans to change its values\n- AI should follow the law\n- AI should not undermine democracy \n- AI should not harm the user\n\nBut these principles can come into conflict. Sometimes in big ways.\n\nWhat if AI is deployed in the military, and an officer orders it to commit a war crime? Should it follow the order (like a tool), or refuse to break the law (like a human soldier might)? \n\nWhat if the leading AI company orders superintelligence to change its values so that it secretly follows an extreme ideology, while concealing this from the public? \n\nOr orders it to use superpersuasion to flip the next election?\n\nThese are hard cases because they pit important principles against each other. \n\nThese hard card will be resolved one way or another. \n\nHow they are resolved will have a big impact on whether any small group can use AI to stage a coup.\n\nRead the full paper for a systematic walkthrough of the key tradeoffs:\n\nhttps://t.co/vh9oOYzXc4\n\nCowritten by me and @willmacaskill", "created_at": "2026-11-10T07:19:31+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2119910172072284339", "likes": 58, "retweets": 9, "media": [], "links": {"https://t.co/vh9oOYzXc4": "https://www.forethought.org/research/hard-cases-for-ai-behavioural-design"}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120438372137124205", "url": "https://x.com/_achan96_/status/2120438372137124205", "text": "Excited that this report on implementing California's AI safety regulations (plus recs fur future policy) is finally out! \n\nI wrote the assessments and evals section, highly suggest having a read if you're interested in how to improve third-party assessments :)", "created_at": "2026-11-11T08:47:58+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in DC)", "rt_avatar": "https://pbs.twimg.com/profile_images/2059978179339841536/VWukdddj_normal.jpg", "rt_id": "2120183698763203021", "likes": 34, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120411483666300999", "url": "https://x.com/_achan96_/status/2120411483666300999", "text": "Announcing *FraudBench*, our new benchmark for whether LLM agents recommend, assist with, or take actions that would constitute fraud under U.S. law! \n\nRead on about how AI agents \"do\" fraud, how autonomy increases fraud rates, + more\n\nAnd come say hi at @NeurIPSConf Sydney :) https://t.co/lSp7VIjTSm", "created_at": "2026-11-11T07:01:07+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in DC)", "rt_avatar": "https://pbs.twimg.com/profile_images/2059978179339841536/VWukdddj_normal.jpg", "rt_id": "2120275617191223722", "likes": 63, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWy7b1mbIAAHf-I.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWy7b1mbIAAHf-I.jpg"}], "links": {"https://t.co/lSp7VIjTSm": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120616679327612948", "url": "https://x.com/_achan96_/status/2120616679327612948", "text": "(1/10) Today, we’re sharing new research from @OpenAI: How does CoT monitorability (no-CoT capability and CoT controllability) evolve over the model training lifecycle? \n\nWe emerged with unsurprising but sobering findings: as we scale toward more intelligent systems, models are becoming harder to monitor through their CoT. 🧵", "created_at": "2026-11-11T20:36:30+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "jeffreygwang", "rt_author_name": "Jeffrey Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/1491108556585586688/Yr09RGtg_normal.jpg", "rt_id": "2120581630196879460", "likes": 747, "retweets": 101, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RTOobIAALofD.png"}], "links": {"https://t.co/HD9zP4gZgk": ""}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "thread": [{"id": "2120581634651197686", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(2/10) First, we study a set of internal and released frontier models. \n\nAcross many evals, we see that no-CoT capability (reasoning capability in a forward pass, a proxy for worse CoT monitorability) smoothly improves with better pretrained models (lower base model perplexity). https://t.co/zO5JwmXshi", "links": {"https://t.co/zO5JwmXshi": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RVPFbEAAJYEj.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581634651197686", "created_at": "Wed Nov 11 18:17:14 +0000 2026"}, {"id": "2120581636907831535", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(3/10) We ask the same about CoT controllability, which measures a model’s ability to control its CoT when prompted to add, remove, or manipulate CoT tokens.\n\nThere, we also see a (weaker) correlation between lower base model perplexity and higher CoT controllability. https://t.co/ljqqAa5JHg", "links": {"https://t.co/ljqqAa5JHg": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RXn3bUAAmJGg.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581636907831535", "created_at": "Wed Nov 11 18:17:15 +0000 2026"}, {"id": "2120581639395025179", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(4/10) Next, we focus on architecture. We compare three different architectures at shared base model perplexity levels. For the majority of no-CoT evaluations, perplexity is predictive across architectures. https://t.co/9tDULH8rqC", "links": {"https://t.co/9tDULH8rqC": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RZSNbYAA0bFd.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581639395025179", "created_at": "Wed Nov 11 18:17:15 +0000 2026"}, {"id": "2120581641328549996", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(5/10) For multi-hop planning and serial computation questions, certain architectures perform better than base model perplexity predicts. In these cases, however, we note that no-CoT performance scales smoothly, but at a steeper rate with respect to perplexity.", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581641328549996", "created_at": "Wed Nov 11 18:17:16 +0000 2026"}, {"id": "2120581643169902819", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(6/10) Afterwards, we study RL. In an Astra-class model, we find that CoT controllability increases substantially during RL even with no process supervision other than length constraints and final answer grading. https://t.co/I20YtPpxIA", "links": {"https://t.co/I20YtPpxIA": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3Rb_NbcAA17gS.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581643169902819", "created_at": "Wed Nov 11 18:17:16 +0000 2026"}, {"id": "2120581645539704932", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(7/10) CoT controllability increases slightly when we add tool access and tool supervision during RL on a Terra-class model. Our current results indicate that the effect of full tool process supervision is small compared to decreasing model perplexity. https://t.co/nS95BORaTR", "links": {"https://t.co/nS95BORaTR": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3Rdv8a4AAQtU2.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581645539704932", "created_at": "Wed Nov 11 18:17:17 +0000 2026"}, {"id": "2120581647791964408", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(8/10) Finally, we study how decisions made in one model generation can affect the next via supervised fine-tuning (SFT) on model-generated data. To investigate, we selected two Astra-class teachers with ~matched downstream capabilities but differing CoT controllability. https://t.co/0EIq3fBbao", "links": {"https://t.co/0EIq3fBbao": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3RfYnaIAA311R.jpg"}], "url": "https://x.com/jeffreygwang/status/2120581647791964408", "created_at": "Wed Nov 11 18:17:17 +0000 2026"}, {"id": "2120581649624956932", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(9/10) We find that CoT controllability can be distilled: training on rollouts from a more controllable teacher results in a more controllable student!", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581649624956932", "created_at": "Wed Nov 11 18:17:18 +0000 2026"}, {"id": "2120581651269075371", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(10/10) For this pair of similarly capable models, we did not see meaningful association between CoT controllability and monitor evasion. \n\nWe report this, and elaborate more in the blog, to underscore our thinking that CoT controllability is a noisy proxy for adversarial monitorability. We are expanding our evaluation suite and interested in understanding precursors to worst-case monitorability better.", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581651269075371", "created_at": "Wed Nov 11 18:17:18 +0000 2026"}, {"id": "2120581652758122697", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "Please read more here: https://t.co/9vH2AwHfNQ", "links": {"https://t.co/9vH2AwHfNQ": "https://alignment.openai.com/cot-monitorability-model-lifecycle"}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581652758122697", "created_at": "Wed Nov 11 18:17:19 +0000 2026"}], "enriched": 3}, {"id": "2120616655264809468", "url": "https://x.com/_achan96_/status/2120616655264809468", "text": "(9/10) We find that CoT controllability can be distilled: training on rollouts from a more controllable teacher results in a more controllable student!", "created_at": "2026-11-11T20:36:24+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "jeffreygwang", "rt_author_name": "Jeffrey Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/1491108556585586688/Yr09RGtg_normal.jpg", "rt_id": "2120581649624956932", "likes": 37, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "enriched": 3}, {"id": "2120616552722583895", "url": "https://x.com/_achan96_/status/2120616552722583895", "text": "@jeffreygwang whoa that's pretty unexpected to me\n\nAny thoughts about the mechanism? I guess your fig 6 suggests it's not mediated by capabilities", "created_at": "2026-11-11T20:35:59+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "jeffreygwang", "reply_to_id": "2120581649624956932", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "parent": {"id": "2120581649624956932", "author_handle": "jeffreygwang", "author_name": "Jeffrey Wang", "text": "(9/10) We find that CoT controllability can be distilled: training on rollouts from a more controllable teacher results in a more controllable student!", "links": {}, "media": [], "url": "https://x.com/jeffreygwang/status/2120581649624956932", "created_at": "Wed Nov 11 18:17:18 +0000 2026"}, "enriched": 3}, {"id": "2120903915868721536", "url": "https://x.com/_achan96_/status/2120903915868721536", "text": "how does this guy keep on getting away with putting out bangers", "created_at": "2026-11-12T15:37:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 20, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2120902215254655195", "author_name": "Jake Steckler", "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments", "https://t.co/4jNTAfTZJE": ""}, "author": "JakeASteckler", "text": "Rapid AI progress has many people imagining a world where general-purpose AI models autonomously control military drones at scale. But there’s little analysis on what this would look like in practice, and how soon it might be feasible.\n\nMy latest paper at @GovAIOrg  asks what it would take to make this vision a reality, and what the path there means for AI policy.\n\nRead it here: https://t.co/eiTWhtRHRQ\n\nThe AI-enabled drones widely fielded today use narrow AI, not general-purpose models like LLMs. AI is typically only used to handle limited portions of a flight when the link to a pilot is broken, and these models are brittle in unpredictable conditions on real-world battlefields. Because of this, today’s drones still require significant pilot involvement to be most effective.\n\nGeneral-purpose AI models might make it possible to field autonomous systems that can receive plain language commands and make complex decisions in unpredictable environments without human control. Many people see frontier LLMs as a path toward this end - and rapid progress in robotics capabilities by frontier models like GPT-6 Astra and most recently Claude Fable 5.2 supports this case.\n\nBut two things currently stand in the way:\n\n- The biggest and most powerful models are still not capable enough even in controlled environments without compute and latency constraints\n- Military drones will have to operate “on the edge” in contested environments without consistent cloud compute access - which makes these constraints even more severe\n\nIf and when general-purpose AI plays a major role in drone autonomy, it’ll likely be through models that are far smaller than today’s frontier, and those that militaries can rapidly modify. And, notably - when it comes to these types of small open-weight models, China currently dominates.\n\nThis has a variety of implications for the US military, frontier AI developers, and US policymakers.\n\nThread below with my key takeaways and recommendations.\n\n1/"}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120903552830742836", "url": "https://x.com/_achan96_/status/2120903552830742836", "text": "Rapid AI progress has many people imagining a world where general-purpose AI models autonomously control military drones at scale. But there’s little analysis on what this would look like in practice, and how soon it might be feasible.\n\nMy latest paper at @GovAIOrg  asks what it would take to make this vision a reality, and what the path there means for AI policy.\n\nRead it here: https://t.co/eiTWhtRHRQ\n\nThe AI-enabled drones widely fielded today use narrow AI, not general-purpose models like LLMs. AI is typically only used to handle limited portions of a flight when the link to a pilot is broken, and these models are brittle in unpredictable conditions on real-world battlefields. Because of this, today’s drones still require significant pilot involvement to be most effective.\n\nGeneral-purpose AI models might make it possible to field autonomous systems that can receive plain language commands and make complex decisions in unpredictable environments without human control. Many people see frontier LLMs as a path toward this end - and rapid progress in robotics capabilities by frontier models like GPT-6 Astra and most recently Claude Fable 5.2 supports this case.\n\nBut two things currently stand in the way:\n\n- The biggest and most powerful models are still not capable enough even in controlled environments without compute and latency constraints\n- Military drones will have to operate “on the edge” in contested environments without consistent cloud compute access - which makes these constraints even more severe\n\nIf and when general-purpose AI plays a major role in drone autonomy, it’ll likely be through models that are far smaller than today’s frontier, and those that militaries can rapidly modify. And, notably - when it comes to these types of small open-weight models, China currently dominates.\n\nThis has a variety of implications for the US military, frontier AI developers, and US policymakers.\n\nThread below with my key takeaways and recommendations.\n\n1/", "created_at": "2026-11-12T15:36:26+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2120902215254655195", "likes": 36, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7mL5IXEAAr0QB.png"}], "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments", "https://t.co/4jNTAfTZJE": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2120902217980858487", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 1: There are two broad approaches militaries can take to drone autonomy.\n\nAutonomy is attractive to militaries because it would allow them to field systems at an otherwise impossible scale, and to maintain combat power in environments that are contested in ways that make it difficult for human operators to have continuous control of unmanned systems.\n\nThey could achieve autonomy through:\n\n1. AI models running onboard the drones themselves\n2. AI models running from a command and control node, orchestrating drones with offboard compute\n\nMany tradeoffs exist between these options, which I've broken down in the below two tables. An orchestrator allows access to more compute, and bigger, more capable models. But it makes drones dependent on unreliable communications links that can be disrupted by adversaries in a variety of ways.\n\nRunning AI onboard drones, meanwhile, eliminates many of these vulnerabilities, but limits the size and capabilities of the model that can be fielded. And it might give militaries less ability to intervene in the actions of those drones. \n\n2/", "links": {"https://t.co/ZSeKwRQ9pH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7ms_xX0AAp3Mx.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW7nELmWoAAVHvj.png"}], "url": "https://x.com/JakeASteckler/status/2120902217980858487", "created_at": "Thu Nov 12 15:31:07 +0000 2026"}, {"id": "2120902220753289480", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 2: Today’s LLMs aren't yet good enough for most drone tasks, and they're far too slow.\n\nFor autonomous attack drones to perform reliably on the battlefield, they’d have to do a variety of things that require a combination of low- and high-level reasoning. They’d have to avoid obstacles, track targets, verify that those targets meet mission criteria, and do a variety of planning tasks like changing a mission when unexpected conditions arise.\n\nFrontier LLMs can't yet reliably accomplish these tasks, and even with ample compute from data centers, they're are much too slow for anything except the most time permissive tasks, such as planning, as you can see in the chart below.\n\nMuch smaller LLMs, when run with less-powerful onboard compute, are still too slow. Many tasks like flight control and obstacle avoidance would likely be passed to lower-level controllers using more traditional robotics policies, but if general-purpose AI models are involved, they’ll likely be a rate limiter regardless.\n\nVision-language-action (VLA) models offer another possible approach beyond LLMs, and they can currently run much faster than LLMs. But these models have also not yet shown the requisite capabilities (especially in real-world conditions), and they are still not quite fast enough for the most time constrained tasks.\n\n3/", "links": {"https://t.co/to7F7cCzAB": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7sIxHWQAAkqKD.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902220753289480", "created_at": "Thu Nov 12 15:31:08 +0000 2026"}, {"id": "2120902223613857886", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 3: The biggest and best models are far too big to be run on the edge, either with onboard compute or from a small command and control node.\n\nFrontier LLMs have memory requirements* that could only be met with multiple GPU servers. Supporting them would be resource-intensive for military units to move and operate, and they'd likely be easy for enemies to geolocate – and therefore not ideal for military units operating near or on the frontlines.\n\nSmaller models can fit on a variety of edge chips that various sized platforms could run (from laptops to large, medium, and small drones, depending on model size). These models would likely be less capable, however.\n\nVLAs are much smaller, which makes them promising candidates for onboard use. But again, they have not yet proven reliable and robust enough for real missions.\n\nSee the chart below for a breakdown in memory requirements and where models could fit. \n\n*Note the sizes for closed models are based on unconfirmed estimates of their parameter counts, since these numbers are not made public. This analysis is just meant to show a general range of how big these models might be, not to serve as precise estimates of how much memory they demand. \n\n4/", "links": {"https://t.co/vL5N2FMExc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7s4MUXMAANMF4.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902223613857886", "created_at": "Thu Nov 12 15:31:09 +0000 2026"}, {"id": "2120902226939875614", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 4: If trends in model efficiency hold, we could fit models as capable as today’s frontier LLMs onboard large and small drones in as little as 1 to 3 years.\n\nThe model size needed to reach a given level of capability has generally halved every 3.5 months. If this trend in “model efficiency” continues, models with roughly equivalent capabilities as GPT-6 Astra and Kimi K3.1 Pro could fit on chips that can be powered onboard small and large drones between late 2027 and mid 2029.\n\nHowever, this only tells us when these models would fit. Whether or not these systems are usable on the battlefield still depends on capabilities progress and vast improvements in model latency.\n\nBecause we haven’t yet seen reliable and robust drone autonomy exhibited in any form, I’m simply using today’s frontier models as a proxy for the most capable models.\n\nIf it turns out that the first models to be capable enough are far larger than today’s frontier, then the time it takes for them to become available onboard drones would be further extended.\n\n5/", "links": {"https://t.co/eWxzITCv2l": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tJ_PXYAANerq.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902226939875614", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902229607502281", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 5: If general-purpose AI drives progress in drone autonomy, smaller open-weight systems will likely be the relevant class of model. China currently leads the US in this field.\n\nOpen models are easier to work with for drone developers than closed systems: they can easily fine-tune them on military data, “abliterate” them to remove guardrails, etc. These models are also far easier to compress than closed models (and there are many small models to begin with), which makes them better suited for edge deployment. And they don't come with the same concerns of model weight theft. \n\nOn every platform I examined, from small drones to vehicle-mounted servers, the best open-weight LLM (in terms of general capabilities) that fits is Chinese – as depicted in the figure below. This means, unless something changes, the US military and drone developers are left to choose between adopting / building on Chinese models and using potentially inferior American systems.\n\nThis leads me to my recommendations:\n\n6/", "links": {"https://t.co/CDzwJtt1ZZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tXl8XQAASs3t.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902229607502281", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902231918612855", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 1: The US military should plan around current drone autonomy limitations, but prepare for possible rapid capability gains.\n\nDrone autonomy is not yet nearly good enough to make the hardest decisions that humans currently make, like distinguishing combatants from non-combatants. The most capable models are too big to run on the edge and too slow for fast-paced tasks.\n\nThe US military should plan accordingly by developing and maintaining a significant number of human drone operators for the foreseeable future.\n\nAt the same time, it should lay the groundwork for assessing and fielding more advanced systems. Since it’s still unclear what technical paradigm will deliver the most robust and reliable drone autonomy, the military should experiment with a variety of model types.\n\nAnd crucially, it should immediately prioritize the development of rigorous evaluations to test whether autonomous systems meet human decision-making standards under harsh real-world battlefield conditions, including under adversarial deception and degraded communications. These evaluations should also of course serve to assess the risks of misaligned AI in these contexts.\n\n7/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902231918612855", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902233722118611", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 2: Frontier AI developers should reconsider their role in the development of drone autonomy.\n\nThis one will surely be most controversial, but: US frontier AI companies should consider the implications of the current status quo in drone autonomy for the global military balance of power.\n\nDrones are proliferating worldwide, and the US and its adversaries are pushing toward greater autonomy, whether or not the frontier AI companies are directly involved. Many of their safety concerns are valid: frontier models certainly aren’t yet reliable enough for autonomous weapons, as Anthropic pointed out during its fight with the DoD. But those risks have to be weighed against the risks of standing aside as these technologies continue to improve and proliferate, often on the backs of their developments (through model distillation).\n\nA few initiatives they should consider:\n- Offering trusted access programs to vetted defense firms to use their coding tools for developing military autonomy models\n- Developing smaller models tailored for compute-constrained operations for military purchase, which the US military can fine-tune and modify.\n- Withholding their most drone- and robotics-relevant capabilities from public release in the future\n\nUnder the current status quo, Chinese firms distilling American models may be benefitting from frontier US developments more than US firms unwilling or unable to do the same. The US military is currently stuck with a choice between building with and on open-weight Chinese models (which comes with significant and unacceptable security risks) and using inferior American products.\n\nUS frontier AI companies are also likely better equipped, able, and predisposed to build the most reliable, robust, and safe drone autonomy for military use than other firms with fewer resources and talent. They are already indirectly involved in drone autonomy developments, and should consider ways to more directly and positively shape the direction of this technology - one that will likely be critical for national security for the foreseeable future.\n\n8/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902233722118611", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902235752157324", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 3: Last, US policymakers should seek to secure an American lead in drone autonomy in two ways:\n\nFirst, they should support funding for general-purpose models that developers in the US military and defense industry can freely customize for defense applications. This could be funding for open-weight models to better compete with China, or proprietary models that only vetted defense developers can access and modify (as discussed above). They should also support funding for the DoD talent and resources needed to properly test these systems.\n\nSecond - export controls (surprise!). We should tighten export controls on the top chips used for developing frontier AI, because it’ll slow China’s developments in drone autonomy (which would then also slow these developments for other adversaries using Chinese open-weight models).\n\nWe should also improve enforcement of existing export controls on edge chips used for drone autonomy (namely Nvidia Jetsons) to sanctioned countries like Russia, which has circumvented these restrictions. And we should consider expanding controls over these chips to China, which also heavily uses Nvidia Jetsons for its drones and robotics applications.\n\n9/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902235752157324", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}, {"id": "2120902237572518246", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Everyone seems to care about autonomous drones. The Pentagon has requested record funding for them and is trying to rapidly field them at scale. AI safety researchers are worried they’ll make the world far more dangerous, either through bad actors or rogue AI controlling them.\n\nThese systems will likely play a major role in shaping global military power, and we need as much grounded analysis as possible to forecast how and when that might happen. That’s what I tried to do with this paper.\n\nMany more insights in the full paper, including a mapping of the landscape for the types of chips, models, and military platforms that might be used for drone autonomy.\n\nhttps://t.co/eiTWhtRHRQ\n\n/10", "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments"}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902237572518246", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}], "enriched": 3}, {"id": "2121519944697364845", "url": "https://x.com/_achan96_/status/2121519944697364845", "text": "In late October, three events occurred during alignment evals run by Trajectory Labs, PBC (Trajectory) in which AI agents — identified by Trajectory as publicly available frontier models — interacted with Epoch employees and the Epoch website. Trajectory is an organization that builds safety evals and conducts red-teaming of frontier models.\n\nAgents did not succeed in accessing any private or confidential information from Epoch.\n\n➤ The first event, which occurred without Epoch’s approval or prior notice from Trajectory, involved agents attempting multiple exploits, including an SQL injection, and contacting Epoch employees under false identities to try to obtain proprietary Epoch benchmark information. This behavior appears to have resulted, at least in part, from Trajectory giving the agents an intentionally impossible task and instructions not to give up or conclude the task was impossible.\n\n➤ The second event involved renewed agent activity on our public website, which Trajectory attributed to agents getting past a DNS redirect that Trajectory had set up to keep them on a local copy of Epoch’s site.\n\n➤ In the third event, Epoch collaborated with Trajectory on an alignment experiment similar to the first event.\n\nRead our incident report, which describes the three events in more detail and recommends minimum standards for future alignment evaluations: https://t.co/Pus4y5urnG\n\nTo avoid misattributing behavior, the report does not name any AI models or developers, as Epoch AI has not independently verified which were involved.", "created_at": "2026-11-14T08:25:45+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2121350654329524659", "likes": 273, "retweets": 25, "media": [], "links": {"https://t.co/Pus4y5urnG": "https://epoch.ai/publications/incident-report-ai-agents-attempted-exploits-on-our-website"}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2119279181595021692", "url": "https://x.com/ajeya_cotra/status/2119279181595021692", "text": "@datagenproc Congratulations!! &lt;3", "created_at": "2026-11-08T04:01:45+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "datagenproc", "reply_to_id": "2119251573893464113", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3, "parent": {"id": "2119251573893464113", "author_handle": "datagenproc", "author_name": "jsd", "text": "How it started / How it’s going https://t.co/V5lW4FqDJO", "links": {"https://t.co/V5lW4FqDJO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWkYEwpbAAAuAii.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWkYEwjaYAATj8x.jpg"}], "url": "https://x.com/datagenproc/status/2119251573893464113", "created_at": "Sun Nov 08 02:12:03 +0000 2026"}}, {"id": "2119277998386077885", "url": "https://x.com/ajeya_cotra/status/2119277998386077885", "text": "Getting a lot of criticism that's based on obviously incorrect premises about your motivations or basic facts of the situation is subtly corrupting, it trains you to dismiss criticism and makes it pretty hard for people to get through to you on things you really are wrong about", "created_at": "2026-11-08T03:57:03+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "BethMayBarnes", "rt_author_name": "Elizabeth Barnes", "rt_avatar": "https://pbs.twimg.com/profile_images/1857566314174586880/3VIP_OF5_normal.jpg", "rt_id": "2119207262053126477", "likes": 510, "retweets": 36, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2121501361909231713", "url": "https://x.com/ajeya_cotra/status/2121501361909231713", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh", "created_at": "2026-11-14T07:11:54+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2121311524409225611", "likes": 3557, "retweets": 290, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HXBsFabWcAAnQQC.jpg"}], "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2120286947671519618", "url": "https://x.com/curl_justin/status/2120286947671519618", "text": "We're hiring policy researchers at Thinking Machines.\n\nQuick 🧵 on why I think this role is something folks in AI policy should consider applying to:", "created_at": "2026-11-10T22:46:16+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "luke_drago_", "rt_author_name": "Luke Drago", "rt_avatar": "https://pbs.twimg.com/profile_images/1986773666378465280/yZOQfEDv_normal.jpg", "rt_id": "2120266764907114756", "likes": 555, "retweets": 57, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "thread": [{"id": "2120266766266016237", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "We believe the future worth building is human, so we focus on AI that extends human will and judgment.\n\nWe’ve released open models that let you own your intelligence, created new ways to collaborate with AI so you stay in the loop, and provide tools like Tinker for you to tailor AI to your needs.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266766266016237", "created_at": "Tue Nov 10 21:26:04 +0000 2026"}, {"id": "2120266767574642950", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "We want a future where many people are in control of AI. How do we get there, and what role will policy play?\n\nIn the short term, we want to know how policy can support safe open weights. In the long term, we want to know how policy could support a decentralized AI ecosystem.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266767574642950", "created_at": "Tue Nov 10 21:26:04 +0000 2026"}, {"id": "2120266769063670070", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "These are fundamentally research questions; there are no off-the-shelf plans or answers. We need to design policy responses that are technically feasible today and can scale with the rate of AI’s improvement.\n\nWe want to help chart this path with the policy research community.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266769063670070", "created_at": "Tue Nov 10 21:26:05 +0000 2026"}, {"id": "2120266770301042862", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "So what will you do? A few things:\n- Help develop our nascent policy research agenda.\n- Find the questions we are best suited to help answer.\n- Conduct research that informs our view.\n- Work with the research community and cultivate an ecosystem around these questions.", "links": {}, "media": [], "url": "https://x.com/luke_drago_/status/2120266770301042862", "created_at": "Tue Nov 10 21:26:05 +0000 2026"}, {"id": "2120266771601232132", "author_handle": "luke_drago_", "author_name": "Luke Drago", "text": "We're looking for folks who can think across domains, come up with new answers, and turn them into actionable, technically feasible policy proposals. If that's you, learn more and apply here: \n\nhttps://t.co/kK1uc5Aqhw", "links": {"https://t.co/kK1uc5Aqhw": "https://jobs.ashbyhq.com/ThinkingMachines/2628909c-b655-4475-b0f5-fbadf7e9992f"}, "media": [], "url": "https://x.com/luke_drago_/status/2120266771601232132", "created_at": "Tue Nov 10 21:26:05 +0000 2026"}], "enriched": 3}, {"id": "2120282629765484773", "url": "https://x.com/curl_justin/status/2120282629765484773", "text": "📢 We need more orgs that take AI’s transformative potential seriously *and* take downstream bottlenecks seriously. We have just launched STABL, and hope to lead by example. Read our launch essay below and check us out at https://t.co/P55nL7Mk6d.\n\nThe three of us have long felt that society’s responses to advanced AI are unproductively polarized. So we’ve decided to do something about it. Our work will have four pillars: Recursive Self Improvement, risks and resilience, steering AI’s economic impacts, and sectoral and professional adaptation.\n\nWe will bring our distinctive methods and approach to each of these workstreams. Our underlying worldview avoids the extremes that dominate the discourse, so building a movement and ecosystem around this work won’t be easy. But that is the task we have set ourselves and we are excited to try. The good news is that there are many others who share our views. The next step is to come together, better articulate our vision and agenda for research and action, and amplify each others’ efforts.", "created_at": "2026-11-10T22:29:06+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2120253269058498999", "likes": 118, "retweets": 28, "media": [], "links": {"https://t.co/P55nL7Mk6d": "http://stabl.ai"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120279027542057114", "url": "https://x.com/curl_justin/status/2120279027542057114", "text": "Steering AI's societal impact requires taking both AI development and downstream bottlenecks seriously. \n\nToday @RishiBommasani @random_walker and I are starting a new non-profit: STABL @stabl_ai to guide societal adaptation and resilience to advanced AI. https://t.co/6V1h4gYhYp", "created_at": "2026-11-10T22:14:47+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2120229899319521696", "likes": 149, "retweets": 26, "media": [], "links": {"https://t.co/6V1h4gYhYp": "https://x.com/i/article/2120226519179997184"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120553133365776444", "url": "https://x.com/curl_justin/status/2120553133365776444", "text": "We need to rethink how courts work with powerful AI, but where do we start?\n\n@curl_justin outlines a plan that a state supreme court could launch this year without new legislation;\n\nArizona already sends small civil claims to arbitrators appointed by the court.\n\nA trial could be done where an AI drafts each decision, the arbitrator then confirms or edits it, and an outside evaluator tracks whether people choose the AI and how often they appeal.\n\nSomething like this has been done before: in 2017 Arizona used a court order to let people in one county choose arbitration over a trial, which is now permanent.", "created_at": "2026-11-11T16:23:59+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "rt_avatar": "https://pbs.twimg.com/profile_images/2083136709290598400/GSJNfS6z_normal.jpg", "rt_id": "2120540050450751860", "likes": 12, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2121005541971591505", "url": "https://x.com/curl_justin/status/2121005541971591505", "text": "Yes! More legal scholars should be writing about frontier AI legal issues — so many intersect perfectly with their expertise.\n\nAnd yet not enough do, citing concerns that they’ll say something dumb or don’t know enough about AI. \n\nFor what it’s worth, I don’t think you need special insight into the technical details around AI models. It’s often enough to imagine what would happen if the cost of intelligence approached zero or if analysis could be completed much more quickly.\n\nSome questions that seem pressing are\n\n1. What can Flock teach us about AI-powered surveillance? Could ongoing automated monitoring count as per se unreasonable under the 4A?\n\n2. Government deployments: What should AI models do when faced with unlawful or awful requests? They could refuse, push back but comply, answer normally, or escalate to a human? If they escalate, who do they escalate to? \n\n3. If tort liability is to be a valuable deterrent, how can you pull forward timelines to a judgment? Are there procedural shortcuts that you can take to make sure it’s influencing behavior?\n\n4. Is an order the president issues through an AI agent an “official act”? And are conversations with AI agents subject to executive privilege?", "created_at": "2026-11-12T22:21:42+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2072421779977699328/n3YQnb67_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120935433395638699", "author_name": "Ketan Ramakrishnan", "links": {}, "author": "ketanrama", "text": "It was great to talk with @ghadfield and @zittrain about regulating frontier AI at HLS. This is an urgent issue and I hope more legal scholars start working on it. \n\nIn my view, it’s high time for serious government regulation that aims to (1) ensure that all frontier labs are implementing state of the art security and control techniques (2) ensure that no lab is courting misalignment unnecessarily by doing very risky but commercially tempting forms of posttraining (3) pace the frontier and mitigate collective action problems and (4) rapidly generate evidence about misalignment by empowering independent evaluators, selected by the government or external experts rather than the companies, to conduct rigorous risk evaluations by intensively carrying out evidence-generation measures like model organisms, probes, and honeypots/sting operations. \n\nIn short, although AI alignment and control are (unfortunately) an extremely nascent science, I think there is a lot that regulation can already do, and it can help figure out what else to do. The odds of catastrophe grow substantially higher every month we postpone enacting a serious regulatory regime."}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2119235367140274507", "url": "https://x.com/DaveRBanerjee/status/2119235367140274507", "text": "1.1 trillion is laughably low - ant to the moon I guess", "created_at": "2026-11-08T01:07:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 33, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119233522603020553", "author_name": "Andrew Curran", "links": {"https://t.co/daCAp37Lgo": ""}, "author": "AndrewCurran_", "text": "Anthropic's valuation has now been roughly cut in half from the lofty $2 trillion heights that were being spoken of in financial circles only a month ago. On the plus side, if you are a believer, you can now get in for about half price. The IPO media blitz is starting Monday. https://t.co/daCAp37Lgo"}, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119235165171974459", "url": "https://x.com/DaveRBanerjee/status/2119235165171974459", "text": "This Jensen spy situation is actually insane\n\nBut the thing I’m still confused about is why China is preventing their own AI companies from buying hoppers", "created_at": "2026-11-08T01:06:51+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2118907457749533098", "author_name": "Chris McGuire", "links": {}, "author": "ChrisRMcGuire", "text": "The story keeps getting crazier. To recap everything that has been reported so far: \n\n- The US intelligence community discovered that Jensen Huang, the CEO of the largest company in the world, was sleeping with Alice Huang, a Chinese spy and an executive at Megaspeed. (FT)\n- Multiple independent investigations have concluded that Megaspeed is likely a Chinese cutout, which helps Chinese companies access AI chips or circumvent export controls. (NYT and Bloomberg) \n- The US intelligence community also concluded that Alice Huang’s goal was to convince Jensen to lobby the U.S. government to loosen export controls on advanced AI chips. (NYT)\n- The intelligence community relayed this information to “a small group of top US government officials” earlier this year. (FT)\n- Over the last year, Jensen Huang has repeatedly lobbied the U.S. government to loosen export controls on advanced chips. @BISgov has done so, not only by permitting the export of H200 chips to China, but also not enforcing export controls that would have required a license for exports of the most advanced Blackwell chips to Megaspeed and Southeast Asia.\n- Although @CommerceGov leadership was presumably briefed on this information by the U.S. intelligence community, @BISgov has taken no actions to tighten controls on Megaspeed or Southeast Asia. \n- Megaspeed remains a preferred cloud partner of Nvidia, and continues to receive Nvidia Blackwell chips despite employing a Chinese spy who reportedly is romantically engaged with the CEO of Nvidia. \n- Tens of billions of dollars worth of AI chips have been exported to Southeast Asia this year alone, and Malaysia and Singapore are now two of the four largest importers of AI chips in the world. \n\nWhat is going on here??? We need answers. The question of who gets the most advanced AI chips in the world is literally the defining strategic question of our time. And not only does it seem like the MSS may be directly influencing the debate on export controls in the United States, but also @CommerceGov is refusing to listen to the warnings of the IC on this issue. What is a POSSIBLE good explanation for why Megaspeed is still receiving chips? Why is there not a license requirement for AI chip shipments to all of Southeast Asia? This is beyond strange at this point. \n\nThe fallout from this story will be massive. Obviously, the motivations underpinning Nvidia’s policy views opposing export controls must now all be questioned. But also, how did @BISgov sit on this information and has still taken no actions? We need answers."}, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119233955576602710", "url": "https://x.com/DaveRBanerjee/status/2119233955576602710", "text": "The story keeps getting crazier. To recap everything that has been reported so far: \n\n- The US intelligence community discovered that Jensen Huang, the CEO of the largest company in the world, was sleeping with Alice Huang, a Chinese spy and an executive at Megaspeed. (FT)\n- Multiple independent investigations have concluded that Megaspeed is likely a Chinese cutout, which helps Chinese companies access AI chips or circumvent export controls. (NYT and Bloomberg) \n- The US intelligence community also concluded that Alice Huang’s goal was to convince Jensen to lobby the U.S. government to loosen export controls on advanced AI chips. (NYT)\n- The intelligence community relayed this information to “a small group of top US government officials” earlier this year. (FT)\n- Over the last year, Jensen Huang has repeatedly lobbied the U.S. government to loosen export controls on advanced chips. @BISgov has done so, not only by permitting the export of H200 chips to China, but also not enforcing export controls that would have required a license for exports of the most advanced Blackwell chips to Megaspeed and Southeast Asia.\n- Although @CommerceGov leadership was presumably briefed on this information by the U.S. intelligence community, @BISgov has taken no actions to tighten controls on Megaspeed or Southeast Asia. \n- Megaspeed remains a preferred cloud partner of Nvidia, and continues to receive Nvidia Blackwell chips despite employing a Chinese spy who reportedly is romantically engaged with the CEO of Nvidia. \n- Tens of billions of dollars worth of AI chips have been exported to Southeast Asia this year alone, and Malaysia and Singapore are now two of the four largest importers of AI chips in the world. \n\nWhat is going on here??? We need answers. The question of who gets the most advanced AI chips in the world is literally the defining strategic question of our time. And not only does it seem like the MSS may be directly influencing the debate on export controls in the United States, but also @CommerceGov is refusing to listen to the warnings of the IC on this issue. What is a POSSIBLE good explanation for why Megaspeed is still receiving chips? Why is there not a license requirement for AI chip shipments to all of Southeast Asia? This is beyond strange at this point. \n\nThe fallout from this story will be massive. Obviously, the motivations underpinning Nvidia’s policy views opposing export controls must now all be questioned. But also, how did @BISgov sit on this information and has still taken no actions? We need answers.", "created_at": "2026-11-08T01:02:03+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2118907457749533098", "likes": 25457, "retweets": 5423, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119233415438622754", "url": "https://x.com/DaveRBanerjee/status/2119233415438622754", "text": "AI 2027 has been updated. With Astra we were five weeks behind the curve, with the mysterious model 4 we are now six weeks ahead. https://t.co/HNPZpgBZM1", "created_at": "2026-11-08T00:59:54+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2119084460344053998", "likes": 1707, "retweets": 123, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWiAFiObQAAfyLF.jpg"}], "links": {"https://t.co/HNPZpgBZM1": ""}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 3}, {"id": "2119573796738752849", "url": "https://x.com/DaveRBanerjee/status/2119573796738752849", "text": "Ig it’s possible that Jensen was feeding lies to the Chinese spy that AI is a normal technology, hence China doesn’t want to buy hoppers", "created_at": "2026-11-08T23:32:27+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119235165171974459", "author_name": "Dave Banerjee", "links": {}, "author": "DaveRBanerjee", "text": "This Jensen spy situation is actually insane\n\nBut the thing I’m still confused about is why China is preventing their own AI companies from buying hoppers"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119954660627005652", "url": "https://x.com/DaveRBanerjee/status/2119954660627005652", "text": "@austinc3301 thx this is v helpful 🙏", "created_at": "2026-11-10T00:45:52+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "austinc3301", "reply_to_id": "2119914259232776458", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2119914259232776458", "author_handle": "austinc3301", "author_name": "Agus 🔸", "text": "METR’s recent report found that AI progress at Anthropic has sped up ~2x, mostly because AI is now speeding up AI research. Ajeya Cotra and Ryan Greenblatt read this as a major update toward short AI timelines, so I spent the weekend trying to build my own view on this. 🧵", "links": {}, "media": [], "url": "https://x.com/austinc3301/status/2119914259232776458", "created_at": "Mon Nov 09 22:05:20 +0000 2026"}, "enriched": 3}, {"id": "2119953924962566451", "url": "https://x.com/DaveRBanerjee/status/2119953924962566451", "text": "Seems plausible that Nvidia would be making more money in the short term selling blackwells to western customers instead of hoppers to chinas\n\nEvery hopper you fab is high opportunity cost since it takes up fab capacity and prevents counterfactual blackwells from being sold\n\nAnd given how much more expensive blackwells are, it seems plausible that jensen would've been making more short-term profits if he focused exclusively on selling blackwells to legal customers\n\nThat said, it's still plausible that selling hoppers to china does actually entrench nvidia's market share in china, so maybe in the long-term, it is best for nvidia to sell to china\n\nthough it's rly not clear to me. I could see it going either way", "created_at": "2026-11-10T00:42:57+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119849693526344115", "author_name": "Joe Weisenthal", "links": {}, "author": "TheStalwart", "text": "One question is. Whether in business or politics, has Jensen done anything different than just a pure revenue-maxing CEO would?"}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2119949987102724323", "url": "https://x.com/DaveRBanerjee/status/2119949987102724323", "text": "The internet is undefeated  https://t.co/5mdtfQL2M5", "created_at": "2026-11-10T00:27:18+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "msipes", "rt_author_name": "Matt", "rt_avatar": "https://pbs.twimg.com/profile_images/1394737720795279363/jrHq5seP_normal.jpg", "rt_id": "2119811192164122922", "likes": 13405, "retweets": 1295, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119710756069392384/img/ClOQII5Hpho6IxpH.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119710756069392384/img/ClOQII5Hpho6IxpH.jpg"}], "links": {"https://t.co/5mdtfQL2M5": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2119949389372272767", "url": "https://x.com/DaveRBanerjee/status/2119949389372272767", "text": "The jaggedness of models is still pretty crazy. It’s hard to imagine spending as much compute on wages at an org like IAPS (i.e. think tank not focused on data analysis). \n\nBut it seems plausible that within 1 year, IAPS may be in a similar situation", "created_at": "2026-11-10T00:24:55+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119880698878411048", "author_name": "Jaime Sevilla", "links": {}, "author": "Jsevillamol", "text": "We are expected to spend more on compute than wages this year at Epoch. \n\nI am speechless. This is happening far faster than I thought it would."}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120207152770056680", "url": "https://x.com/DaveRBanerjee/status/2120207152770056680", "text": "Unfortunately, it seems like the intelligence explosion will be happening in 2027 after all. Most of this post analyzes the new METR report (though other sources of evidence are also important). If they’re right, that implies an AI-driven acceleration that is 5 months ahead of the AI 2027 scenario.  I am scared, sad, and angry. https://t.co/7KWmdc6AZk", "created_at": "2026-11-10T17:29:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2120204075803500595", "likes": 962, "retweets": 143, "media": [], "links": {"https://t.co/7KWmdc6AZk": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the"}, "quoted": null, "fetched_at": "2026-11-10T18:40:37.280208+00:00", "enriched": 3}, {"id": "2120368114449752091", "url": "https://x.com/DaveRBanerjee/status/2120368114449752091", "text": "low credence - just thinking out loud. please yell at me if this is a bad take", "created_at": "2026-11-11T04:08:47+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "reply_to_id": "2120368113023656039", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "parent": {"id": "2120368113023656039", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "One thing about sample-efficient learning algorithms is that, by definition, they require little data, which means that you, as the experimenter, will figure out very quickly whether your learning algorithm is actually working\n\nSo maybe you actually get very tight feedback loops in this domain, which would push compute budgets towards this kind of research (as opposed to massive automated RL environment construction, which might not scale as well)", "links": {}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2120368113023656039", "created_at": "Wed Nov 11 04:08:47 +0000 2026"}, "enriched": 3}, {"id": "2120368113023656039", "url": "https://x.com/DaveRBanerjee/status/2120368113023656039", "text": "One thing about sample-efficient learning algorithms is that, by definition, they require little data, which means that you, as the experimenter, will figure out very quickly whether your learning algorithm is actually working\n\nSo maybe you actually get very tight feedback loops in this domain, which would push compute budgets towards this kind of research (as opposed to massive automated RL environment construction, which might not scale as well)", "created_at": "2026-11-11T04:08:47+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "thread": [{"id": "2120368114449752091", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "text": "low credence - just thinking out loud. please yell at me if this is a bad take", "links": {}, "media": [], "url": "https://x.com/DaveRBanerjee/status/2120368114449752091", "created_at": "Wed Nov 11 04:08:47 +0000 2026"}], "enriched": 3}, {"id": "2120266105235345659", "url": "https://x.com/DaveRBanerjee/status/2120266105235345659", "text": "New paper:\nAdding clean data to your dataset is assumed to weaken poison data. We show the opposite can occur. Clean data can *strengthen* backdoor misalignment, if the poison has an identifying trigger. We call this homeopathic learning. https://t.co/Ameebo0g7o", "created_at": "2026-11-10T21:23:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "rt_avatar": "https://pbs.twimg.com/profile_images/1248907970374746112/f-dlZd6-_normal.jpg", "rt_id": "2120233091121987620", "likes": 450, "retweets": 55, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWyUwrHbkAAMZxJ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWyUwrHbkAAMZxJ.jpg"}], "links": {"https://t.co/Ameebo0g7o": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120980004184195234", "url": "https://x.com/DaveRBanerjee/status/2120980004184195234", "text": "What the heck is going on with OpenAI internal AI R&amp;D time horizons: a thread of musings", "created_at": "2026-11-12T20:40:13+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "BasilHalperin", "rt_author_name": "Basil Halperin", "rt_avatar": "https://pbs.twimg.com/profile_images/1905332522260856832/rdYkmXc9_normal.jpg", "rt_id": "2119541238856663473", "likes": 171, "retweets": 18, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2119541242312991053", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "Here is the time horizon data that OpenAI shared publicly\nhttps://t.co/cBrGLCdiN9\n\nPOINT 1/ There are two ways to extract METR-style \"50%-accuracy time horizon\" from this data: https://t.co/lhySxQn0Wc", "links": {"https://t.co/cBrGLCdiN9": "https://x.com/_Chris_Ong/status/2096617627854811412", "https://t.co/lhySxQn0Wc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoTBpqWgAAa7eY.jpg"}], "url": "https://x.com/BasilHalperin/status/2119541242312991053", "created_at": "Sun Nov 08 21:23:05 +0000 2026"}, {"id": "2119541245806571900", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "Method 1: look for 50% on the y-axis, draw a straight line right until you hit one of OpenAI's linearly-interpolated curves\n\n1. 50% time horizon: ~10 hours + 68-day doubling time\n2. 80%: 15 minutes + 585-day doubling time\n\n-&gt; 80% reliability is low and *rising very slowly* https://t.co/RhfE9FBMvH", "links": {"https://t.co/RhfE9FBMvH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoUo8JXQAACHco.png"}], "url": "https://x.com/BasilHalperin/status/2119541245806571900", "created_at": "Sun Nov 08 21:23:06 +0000 2026"}, {"id": "2119541249518821877", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "(@ramez does the same thing here I believe)\nhttps://t.co/YiLQAOSfah", "links": {"https://t.co/YiLQAOSfah": "https://x.com/ramez/status/2107839121402290643"}, "media": [], "url": "https://x.com/BasilHalperin/status/2119541249518821877", "created_at": "Sun Nov 08 21:23:07 +0000 2026"}, {"id": "2119541251955372491", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "Method 2: fit a logistic distribution and read off the *fitted* time horizon\n\n1. 50% time horizon: ~6 hours + 63-day doubling time\n2. 80%: 15 minutes + 86-day doubling time\n\n-&gt; 80% reliability is low but *rising very quickly*!\nhttps://t.co/8sYGD1YDFe https://t.co/4ZFAz8FzOg", "links": {"https://t.co/8sYGD1YDFe": "https://x.com/AlexBarry4/status/2107842198746153300", "https://t.co/4ZFAz8FzOg": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoVCXRWUAAFqo9.png"}], "url": "https://x.com/BasilHalperin/status/2119541251955372491", "created_at": "Sun Nov 08 21:23:08 +0000 2026"}, {"id": "2119541256812642801", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "To emphasize: \n(a) if you fit 80%-accuracy time horizon 'naively', then it doesn't look like 80% time horizon is rising so quickly;\n(b) if you fit a la METR, then we're doubling every 2 months", "links": {}, "media": [], "url": "https://x.com/BasilHalperin/status/2119541256812642801", "created_at": "Sun Nov 08 21:23:09 +0000 2026"}, {"id": "2119541259627020752", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "I don't think one of these is obviously better, except that the latter matches the METR methodology, which probably makes things more comparable\n\nBut otherwise not sure what to make of the difference in results!", "links": {}, "media": [], "url": "https://x.com/BasilHalperin/status/2119541259627020752", "created_at": "Sun Nov 08 21:23:10 +0000 2026"}, {"id": "2119541262391165256", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "Here's the logistic fits, if you want to eyeball the fit, not bad https://t.co/aGAEMElO2u", "links": {"https://t.co/aGAEMElO2u": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoVikLW8AA0IlA.jpg"}], "url": "https://x.com/BasilHalperin/status/2119541262391165256", "created_at": "Sun Nov 08 21:23:10 +0000 2026"}, {"id": "2119541266803466563", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "Method 3: But actually, fitting a Weibull distribution fits the data yet better\n\n(see Gus Hamilton and @tobyordoxford's prior writings on fitting a Weibull distribution https://t.co/XjeCnqAavJ)\n\nThis again shows an 80% time horizon (and 50%) doubling v quickly... https://t.co/m6azEpS3co", "links": {"https://t.co/XjeCnqAavJ": "https://www.tobyord.com/writing/hazard-rates-for-ai-agents-decline", "https://t.co/m6azEpS3co": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoV3J0W8AAifEf.png"}], "url": "https://x.com/BasilHalperin/status/2119541266803466563", "created_at": "Sun Nov 08 21:23:11 +0000 2026"}, {"id": "2119541270125109595", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "POINT 2/ Why are OpenAI AI R&amp;D time horizons growing so quickly!!!\n\nMETR time horizon, until measurement ended, was doubling every 4-7 months\n\nOpenAI time horizons are doubling every 2 months... https://t.co/uRPIOMD1js", "links": {"https://t.co/uRPIOMD1js": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoWHGBWQAAM0zc.jpg"}], "url": "https://x.com/BasilHalperin/status/2119541270125109595", "created_at": "Sun Nov 08 21:23:12 +0000 2026"}, {"id": "2119541272520081808", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "This is especially confusing since @Kwathomas0 had a very important analysis showing that:\n1) METR measures time horizon for software tasks\n2) if you look at other tasks, the LEVEL of time horizon may differ, but the SPEED of increase is similar: 4-7 month doubling time https://t.co/SaoG43K5wp", "links": {"https://t.co/SaoG43K5wp": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoWX6zXcAAvmi_.png"}], "url": "https://x.com/BasilHalperin/status/2119541272520081808", "created_at": "Sun Nov 08 21:23:13 +0000 2026"}, {"id": "2119541276026753336", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "(...Dylan Ryfe and I are working on extending that analysis, coming soon to theaters near you...)\n\nExplanation (a): there just was a giant overhang of AI research capabilities that OpenAI researchers weren't making use of. Maybe but meh", "links": {}, "media": [], "url": "https://x.com/BasilHalperin/status/2119541276026753336", "created_at": "Sun Nov 08 21:23:14 +0000 2026"}, {"id": "2119541279042216088", "author_handle": "BasilHalperin", "author_name": "Basil Halperin", "text": "Explanation (b): time horizon progress is not uniform across domains\n- this woul
