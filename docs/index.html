"type": "photo", "url": "https://pbs.twimg.com/media/HXbgDX0WYAAW5lv.jpg"}], "links": {"https://t.co/fGjyas8XyD": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123114072287617455", "author_handle": "s8mb", "author_name": "Sam Bowman", "text": "@rosegrayston I don't know how you got that from my tweet! My point is that Labour was elected on a promise to build 1.5 million new homes, hasn't really done anything on the supply side to help that, and now is clearly not going to achieve that. \n\nI think the people responsible for that want to blame external factors like the Iran war and \"the structural dominance of speculative development models\" instead of accepting blame themselves. I don't think the idea that housing was on the right track before the Iran war has much basis in fact.", "links": {}, "media": [], "url": "https://x.com/s8mb/status/2123114072287617455", "created_at": "Wed Nov 18 18:00:15 +0000 2026"}, "enriched": 3}, {"id": "2123114072287617455", "url": "https://x.com/s8mb/status/2123114072287617455", "text": "@rosegrayston I don't know how you got that from my tweet! My point is that Labour was elected on a promise to build 1.5 million new homes, hasn't really done anything on the supply side to help that, and now is clearly not going to achieve that. \n\nI think the people responsible for that want to blame external factors like the Iran war and \"the structural dominance of speculative development models\" instead of accepting blame themselves. I don't think the idea that housing was on the right track before the Iran war has much basis in fact.", "created_at": "2026-11-18T18:00:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rosegrayston", "reply_to_id": "2123046662360957425", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123046662360957425", "author_handle": "rosegrayston", "author_name": "Rose Grayston", "text": "I think this strange tweet is best read as a bad faith argument that social housing policies are responsible for declining demand for new homes, ignoring the real drivers: mortgage rates &amp; the cost of living crisis.\n\nUK was on track for more supply this year before the Iran War.", "links": {}, "media": [], "url": "https://x.com/rosegrayston/status/2123046662360957425", "created_at": "Wed Nov 18 13:32:23 +0000 2026"}, "enriched": 3}, {"id": "2123112436224106721", "url": "https://x.com/s8mb/status/2123112436224106721", "text": "@JonNeale Housing starts haven't actually declined – they're basically in line with the trend under the Conservatives. The trouble is that Labour promised to significantly increase housebuilding and has not done anything to make that happen. If they were relying on interest rates falling, that was a bad gamble to make.\n\nhttps://t.co/7PAysKgCnq", "created_at": "2026-11-18T17:53:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JonNeale", "reply_to_id": "2123098884880875814", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/7PAysKgCnq": "https://x.com/s8mb/status/2123022927851581951"}, "quoted": {"id": "2123022927851581951", "author_name": "Sam Bowman", "links": {"https://t.co/nEDOf30e5h": ""}, "author": "s8mb", "text": "Labour are almost bang on track to get as many new homes built as the Conservatives did in 2019–24. https://t.co/nEDOf30e5h"}, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123098884880875814", "author_handle": "JonNeale", "author_name": "JN", "text": "@s8mb Having said that, it hard to overstate how damaging pennycook’s policies have been. They’ve even caused housing starts in the US, France and Germany to fall by between 15 and 40pc compared to 2022, that’s how bad they are.", "links": {}, "media": [], "url": "https://x.com/JonNeale/status/2123098884880875814", "created_at": "Wed Nov 18 16:59:54 +0000 2026"}, "enriched": 3}, {"id": "2123096475731194262", "url": "https://x.com/s8mb/status/2123096475731194262", "text": "@JonNeale Mortgage rates and bank rate were about the same level in 2024 as they are today (bank rate was higher), so I don't think that's mitigating, if that's what you mean. They made this pledge in this sort of environment and they have the power to adjust to high IRs but are unwilling to.", "created_at": "2026-11-18T16:50:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JonNeale", "reply_to_id": "2123079464393310717", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123079464393310717", "author_handle": "JonNeale", "author_name": "JN", "text": "@s8mb Yes, absolutely. But it’s also reduced effective demand for housing, sales have slowed markedly everywhere", "links": {}, "media": [], "url": "https://x.com/JonNeale/status/2123079464393310717", "created_at": "Wed Nov 18 15:42:43 +0000 2026"}, "enriched": 3}, {"id": "2123427700690055670", "url": "https://x.com/s8mb/status/2123427700690055670", "text": "@ScottGoetz_ That's true. If I ran a company, I would consider offering people 1.2 days off for each day of leave if taken during certain periods like school holidays, I think.", "created_at": "2026-11-19T14:46:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "i /Ricburton/status/2123421302795247686", "created_at": "Thu Nov 19 14:21:04 +0000 2026"}, "enriched": 3}, {"id": "2123426723253674450", "url": "https://x.com/s8mb/status/2123426723253674450", "text": "@aofarre Totally. I'm sure that's part of why the PL, fantasy football, the World Cup and so on all seem to have become bigger cultural phenomena in the past decade.", "created_at": "2026-11-19T14:42:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "aofarre", "reply_to_id": "2123425237668712712", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123425237668712712", "author_handle": "aofarre", "author_name": "Ant", "text": "@s8mb Live sports are surely the biggest exception of all.\n\nStreaming is great but everything on demand means the days of coming into school/work and discussing last night's movie/episode are largely gone.", "links": {}, "media": [], "url": "https://x.com/aofarre/status/2123425237668712712", "created_at": "Thu Nov 19 14:36:42 +0000 2026"}, "enriched": 3}, {"id": "2123415240998265261", "url": "https://x.com/s8mb/status/2123415240998265261", "text": "@JonNeale No doubt. And yet as the original post points out, a gigantic share of the cost of new homes can be eliminated tomorrow by the man who is blaming \"speculative development models\".", "created_at": "2026-11-19T13:56:59+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JonNeale", "reply_to_id": "2123413761474109623", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123413761474109623", "author_handle": "JonNeale", "author_name": "JN", "text": "@s8mb I agree that more drastic measures need to be taken and requirements and regulations are too high. But this is the most averse climate for development globally that those working in the industry today have ever known.", "links": {}, "media": [], "url": "https://x.com/JonNeale/status/2123413761474109623", "created_at": "Thu Nov 19 13:51:06 +0000 2026"}, "enriched": 3}, {"id": "2123413829782528445", "url": "https://x.com/s8mb/status/2123413829782528445", "text": "People really crave shared culture. I wonder the rise of \"politics as entertainment\" is caused by the decline of shared adult culture in other areas, apart from notable exceptions like GTA 6 and The Odyssey.", "created_at": "2026-11-19T13:51:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 90, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123412039783575729", "url": "https://x.com/s8mb/status/2123412039783575729", "text": "I wonder if the French approach to vacations, where nearly everyone goes on leave at the same time in August, is better than the British approach of people taking random drips and drabs across the year. I'm constantly slowed down by individual people being away. A coordinated shut-down might lead to less aggregate loss of time.", "created_at": "2026-11-19T13:44:16+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 74, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123402921589023067", "url": "https://x.com/s8mb/status/2123402921589023067", "text": "@browsingatwork I think it's much more important to maintain access to American models, and I'd certainly choose them over Chinese models if we were forced to (which I think we might be some day), but sure, in the short run it's great to have both.", "created_at": "2026-11-19T13:08:02+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "browsingatwork", "reply_to_id": "2123388186617688400", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123388186617688400", "author_handle": "browsingatwork", "author_name": "employee", "text": "@s8mb As well as Chinese models right?", "links": {}, "media": [], "url": "https://x.com/browsingatwork/status/2123388186617688400", "created_at": "Thu Nov 19 12:09:28 +0000 2026"}, "enriched": 3}, {"id": "2123402097303372198", "url": "https://x.com/s8mb/status/2123402097303372198", "text": "@rosstaylor90 I think a British state-backed AI company would be very lucky to be as good as Mistral, which would still not be a very useful thing to have, and would be actively harmful if it diverts talent from other things and forces, eg, the British state to use substandard models.\n\nI think there are lessons we should draw from China – see below – but I don't think there's much from the Chinese experience to support the idea of a big state-backed AI national champion. It's a much more competitive and bottom-up system than you seem to want for us.\n\nAnd remember they do have 21x as many people as us so not everything they can do, we can or should try to do.\n\nhttps://t.co/jPKpY7U3sf", "created_at": "2026-11-19T13:04:45+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rosstaylor90", "reply_to_id": "2123387158090182817", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/jPKpY7U3sf": "https://worksinprogress.co/issue/chinas-growth-machine/"}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123387158090182817", "author_handle": "rosstaylor90", "author_name": "Ross Taylor", "text": "@s8mb I feel British Mistral is meant in the pejorative here. Do you think a British Zhipu or Moonshot would be useful? \n\nI think that would be very useful; these models are not that far off the frontier and it gives a country optionality in a world where all economic activity depends on super-intelligent models / and the ability to determine its own future.\n\nI keep imagining how this would go down in China - “I don’t see the usefulness of a Chinese OpenAI” or a more ambitious country where they understand you have to fucking die to get AGI, and that’s it’s a matter of national survival.\n\nIf people are satisfied with being a US vassal state, that’s a legitimate position - but better to come out and say it, rather than pretending there is a world where UK has any real independent say in how AI goes without owning the model layer.", "links": {}, "media": [], "url": "https://x.com/rosstaylor90/status/2123387158090182817", "created_at": "Thu Nov 19 12:05:23 +0000 2026"}, "enriched": 3}, {"id": "2123400923850407973", "url": "https://x.com/s8mb/status/2123400923850407973", "text": "@JonNeale Isn't that mostly just inflation? \"The market\" is the interaction of supply and demand: rising interest rates will reduce demand – though they haven't risen since when they were elected, so I don't see how that can be the story here. They were elected on a platform of increasing supply and they've done basically nothing.", "created_at": "2026-11-19T13:00:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JonNeale", "reply_to_id": "2123397464443236681", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123397464443236681", "author_handle": "JonNeale", "author_name": "JN", "text": "@s8mb And this https://t.co/DFhLagYsmZ", "links": {"https://t.co/DFhLagYsmZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXfSvR3WAAEMuZn.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXfSvR3WAAEMuZn.jpg"}], "url": "https://x.com/JonNeale/status/2123397464443236681", "created_at": "Thu Nov 19 12:46:20 +0000 2026"}, "enriched": 3}, {"id": "2123385404736909643", "url": "https://x.com/s8mb/status/2123385404736909643", "text": "@rosstaylor90 Yes, we should change the copyright laws, and many other laws that hold back UK tech companies. If a company here thinks it can do it, good luck to them.\n\nThe problem is in leaping from that to thinking that we should sponsor a company to do it. I don't think that would work out and it would divert talent away from other things that might. I don't think having a British Mistral would be very useful.", "created_at": "2026-11-19T11:58:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rosstaylor90", "reply_to_id": "2123367567225983271", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123367567225983271", "author_handle": "rosstaylor90", "author_name": "Ross Taylor", "text": "@s8mb I am literally unable to pre-train a model on UK soil because of insane copyright laws.\n\nAnd why is ourselves alone crazy? We have a nuclear deterrent because we thought it was necessary for sovereignty.\n\nChina has 10+ foundation model companies. France has one; Canada has one. What makes it crazy for the UK to have one? And why are we just accepting a future where all economic activity in the UK depends on American models?\n\nWhat am I missing?", "links": {}, "media": [], "url": "https://x.com/rosstaylor90/status/2123367567225983271", "created_at": "Thu Nov 19 10:47:32 +0000 2026"}, "enriched": 3}, {"id": "2123384643642634750", "url": "https://x.com/s8mb/status/2123384643642634750", "text": "@augusteprompt We have the option of setting up a company that will try to create a frontier model, not of creating a frontier model. Meta and SpaceXAI have both not managed it. Mistral, which is what ours would probably end up looking more like (at best), hasn't come close.", "created_at": "2026-11-19T11:55:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "augusteprompt", "reply_to_id": "2123357693704548655", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123357693704548655", "author_handle": "augusteprompt", "author_name": "Auguste Prompt", "text": "@s8mb ???? these aren't incompatible goals. having access to foreign models isn't guaranteed, whereas developing our own would guarantee access. it's a crazy admission of just giving up.", "links": {}, "media": [], "url": "https://x.com/augusteprompt/status/2123357693704548655", "created_at": "Thu Nov 19 10:08:18 +0000 2026"}, "enriched": 3}, {"id": "2123353374192291873", "url": "https://x.com/s8mb/status/2123353374192291873", "text": "He is right. If people want to try making a British-owned frontier model, good luck &amp; we should make it easy for them. But it is far more important to maintain access to America's frontier models and build greater interdependence between us and them. \"Ourselves alone\" is crazy.", "created_at": "2026-11-19T09:51:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 118, "retweets": 7, "media": [], "links": {}, "quoted": {"id": "2122847718045360297", "author_name": "Semafor", "links": {"https://t.co/7mHwFyIZTQ": ""}, "author": "semafor", "text": "UK AI Minister @KanishkaNarayan tells @JuliePace he doesn't see a UK frontier model “as a matter of necessity as long as we have trusted interdependence and access.” https://t.co/7mHwFyIZTQ"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123333136251777104", "url": "https://x.com/s8mb/status/2123333136251777104", "text": "@AshleyPerryUK I made this in ChatGPT.", "created_at": "2026-11-19T08:30:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "AshleyPerryUK", "reply_to_id": "2123331789926113280", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123331789926113280", "author_handle": "AshleyPerryUK", "author_name": "𝐀𝐬𝐡𝐥𝐞𝐲 𝐏𝐞𝐫𝐫𝐲 ", "text": "@s8mb Hi Sam - thanks for sharing. Where is this report?", "links": {}, "media": [], "url": "https://x.com/AshleyPerryUK/status/2123331789926113280", "created_at": "Thu Nov 19 08:25:22 +0000 2026"}, "enriched": 3}, {"id": "2123313006457315740", "url": "https://x.com/s8mb/status/2123313006457315740", "text": "@panickssery @akrolsmir There is an infinite number of facts about the world - how should someone decide which ones to read, and what should we call the thing that we use to decide?", "created_at": "2026-11-19T07:10:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "panickssery", "reply_to_id": "2122812830600876303", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2122812830600876303", "author_handle": "panickssery", "author_name": "Arjun Panickssery", "text": "Someone of a slop post, hastily written at the last minute to comply with the deadline for @akrolsmir's \"Just Write\" activity,\n\nin which I advocate for learning many more empirical facts about the world rather than internalizing others' theoretical models\n\nhttps://t.co/4eKGbjCjme https://t.co/9KGKrDrnBZ", "links": {"https://t.co/4eKGbjCjme": "https://flyn.im/pAnI4Yv", "https://t.co/9KGKrDrnBZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXW-r-1aQAAWsMf.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXW-tqgbAAAb_vu.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXW-r-1aQAAWsMf.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXW-tqgbAAAb_vu.png"}], "url": "https://x.com/panickssery/status/2122812830600876303", "created_at": "Tue Nov 17 22:03:13 +0000 2026"}, "enriched": 3}, {"id": "2123484206705549654", "url": "https://x.com/s8mb/status/2123484206705549654", "text": "This is a man we can do business with.", "created_at": "2026-11-19T18:31:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123371264421081182", "author_name": "Jean-Luc Mélenchon", "links": {}, "author": "JLMelenchon", "text": "Le nouvel épisode de la saga, GTA VI, développé par Rockstar Games, est sorti ce jeudi. Cette série s’est imposée comme une passion pour des millions de Français.\n\nSans revenir à cet instant sur les nouvelles conditions de la propriété de ce jeu par ceux qui l'achètent, ni sur le contenu de l'histoire mise en scène, je voudrais souligner combien le jeu vidéo est un art complet. Il est pleinement constitutif de notre époque, en dépit du mépris de certaines élites.\n\nLa Nouvelle France, c'est aussi cette réalité, et je suis certain que cette nouvelle « industrie » est un avenir pour notre pays, qui y excelle déjà, et pour des millions de jeunes carrières qui voudront y participer."}, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123449075777368559", "url": "https://x.com/s8mb/status/2123449075777368559", "text": "This is really awesome. Imagine how proud Jack's old editors at Bloomberg and the Register must feel.", "created_at": "2026-11-19T16:11:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 145, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123439737247871302", "author_name": "Trung Phan", "links": {"https://t.co/GP1mGHP94c": ""}, "author": "TrungTPhan", "text": "Each of Anthropic's 7 co-founders own ~1.4% of the AI startup. Those stake are worth $20B+ a person at top of IPO range.\n\nThis makes co-founder Jack Clark the most financially successful beat reporter ever (including a stint as the “world’s only distributed systems reporter.”) https://t.co/GP1mGHP94c"}, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123447292497674355", "url": "https://x.com/s8mb/status/2123447292497674355", "text": "@augusteprompt @Ricburton @Machenta_ @rosstaylor90 I'm strongly in favour of reforming copyright and removing lots of other barriers to AI and other tech companies succeeding here. But the answer given by Narayan is specifically about government \"piling in a bunch of capital\" into it.", "created_at": "2026-11-19T16:04:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "augusteprompt", "reply_to_id": "2123444621707444645", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123444621707444645", "author_handle": "augusteprompt", "author_name": "Auguste Prompt", "text": "@s8mb @Ricburton @Machenta_ Government subsidies are not the only way to address the fact we are about to lose our sovereignty, we should consider absolutely all options, including the copyright issue @rosstaylor90 brought up. There are a million things we could do but saying we don’t need it is giving up.", "links": {}, "media": [], "url": "https://x.com/augusteprompt/status/2123444621707444645", "created_at": "Thu Nov 19 15:53:44 +0000 2026"}, "enriched": 3}, {"id": "2123446559887294724", "url": "https://x.com/s8mb/status/2123446559887294724", "text": "@amoylan France is one of the most impressive economies in the world, and most developed countries could learn a lot from it! https://t.co/N6McRZDmb5 https://t.co/rzj1vi3NmI", "created_at": "2026-11-19T16:01:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "amoylan", "reply_to_id": "2123438893017997681", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 22, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXf_WhtXEAAGvQt.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXf_WhtXEAAGvQt.jpg"}], "links": {"https://t.co/N6McRZDmb5": "https://ukfoundations.co/", "https://t.co/rzj1vi3NmI": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123438893017997681", "author_handle": "amoylan", "author_name": "amoylan", "text": "@s8mb Britain is well and truly lost if it is looking to France for economic efficiency guidance.", "links": {}, "media": [], "url": "https://x.com/amoylan/status/2123438893017997681", "created_at": "Thu Nov 19 15:30:58 +0000 2026"}, "enriched": 3}, {"id": "2123544875895562457", "url": "https://x.com/s8mb/status/2123544875895562457", "text": "@AaronBastani I think interdependence as a concept includes relationships where both parties would be worse off without the other.", "created_at": "2026-11-19T22:32:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "AaronBastani", "reply_to_id": "2123536455083675979", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "parent": {"id": "2123536455083675979", "author_handle": "AaronBastani", "author_name": "Aaron Bastani", "text": "@s8mb ‘Interdependence’ would mean they are also dependent on Britain, which nobody thinks. Better to be honest and just call it ‘dependence’.", "links": {}, "media": [], "url": "https://x.com/AaronBastani/status/2123536455083675979", "created_at": "Thu Nov 19 21:58:38 +0000 2026"}, "enriched": 3}, {"id": "2123518855997755896", "url": "https://x.com/s8mb/status/2123518855997755896", "text": "In this video you can pick up my MAINTENANCE book and page through it, read the text and study the photos, just like in a bookshop.", "created_at": "2026-11-19T20:48:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "stewartbrand", "rt_author_name": "Stewart Brand", "rt_avatar": "https://pbs.twimg.com/profile_images/1075885184992464897/FaKfkYAO_normal.jpg", "rt_id": "2123462324992483510", "likes": 28, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2123518279893303592", "url": "https://x.com/s8mb/status/2123518279893303592", "text": "@tomhfh Very clever. I wonder why they do Languedoc and Paris at the same time.", "created_at": "2026-11-19T20:46:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "tomhfh", "reply_to_id": "2123518026054090973", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "parent": {"id": "2123518026054090973", "author_handle": "tomhfh", "author_name": "Tom Harwood", "text": "@s8mb When it comes to school holidays the French stagger it with three zones so that the ski resorts don’t get overwhelmed. https://t.co/CfKaby9ybN", "links": {"https://t.co/CfKaby9ybN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXhAY-MWUAAjy1X.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXhAY-MWUAAjy1X.jpg"}], "url": "https://x.com/tomhfh/status/2123518026054090973", "created_at": "Thu Nov 19 20:45:25 +0000 2026"}, "enriched": 3}, {"id": "2123513110837268849", "url": "https://x.com/s8mb/status/2123513110837268849", "text": "Most of the Elizabeth Line actually dates back to the Victorian era.\n\nDigging just 21km of tunnel through central London connected century-old commuter lines into a single 117km network. It’s called “through-running,” and US cities like NYC, Boston, and Chicago have the infrastructure to do the same thing. \n\nRead more: https://t.co/MnB5KZQWbI", "created_at": "2026-11-19T20:25:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "rt_avatar": "https://pbs.twimg.com/profile_images/1620480120778547200/MkLNSMmo_normal.jpg", "rt_id": "2123395006241107986", "likes": 154, "retweets": 13, "media": [], "links": {"https://t.co/MnB5KZQWbI": "https://worksinprogress.co/issue/the-magic-of-through-running/"}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2122349562832765152", "url": "https://x.com/random_walker/status/2122349562832765152", "text": "@dioscuri Thank you Henry and @danwilliamsphil for having me on! It was a real pleasure and it gave me lots to think about.", "created_at": "2026-11-16T15:22:21+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "dioscuri", "reply_to_id": "2122302383397228635", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2122302383397228635", "author_handle": "dioscuri", "author_name": "Henry Shevlin", "text": "@random_walker fantastic to have you on the show!", "links": {}, "media": [], "url": "https://x.com/dioscuri/status/2122302383397228635", "created_at": "Mon Nov 16 12:14:53 +0000 2026"}, "enriched": 3}, {"id": "2122348879647564140", "url": "https://x.com/random_walker/status/2122348879647564140", "text": "New episode! Is AI a normal technology, or something radically different?\nHenry Shevlin (@dioscuri) and I put some objections to Arvind Narayanan (@random_walker), who is sceptical that \"superintelligence\" can be built in a lab and thinks AI’s effects will arrive gradually. We also discuss AI consciousness, persuasion, misinformation, and more! \nFull conversation with transcripts and links here: https://t.co/HcfiAdNk58", "created_at": "2026-11-16T15:19:38+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/2122086703057793024/Fzgv0Hss_normal.jpg", "rt_id": "2122278723755950504", "likes": 35, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122277980026081280/img/ul1HjoYHzGiCekD4.jpg"}], "links": {"https://t.co/HcfiAdNk58": "https://www.conspicuouscognition.com/p/can-thinking-machines-be-a-normal", "https://t.co/x4MuT12Xbx": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2123023718381461652", "url": "https://x.com/random_walker/status/2123023718381461652", "text": "I dug into this a bit. It looks like we're at highs, but not unprecedented highs for major systems failures.\n\nWe're seeing alarming headlines every day, but a lot of it is recency bias. https://t.co/tW7bWz5VB2", "created_at": "2026-11-18T12:01:12+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "krishnanrohit", "rt_author_name": "rohit", "rt_avatar": "https://pbs.twimg.com/profile_images/1752863538627149824/LOJXhBvu_normal.jpg", "rt_id": "2122748106659987652", "likes": 2467, "retweets": 278, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWBz7zbQAAV2Fc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWBz7zbQAAV2Fc.jpg"}], "links": {"https://t.co/tW7bWz5VB2": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2123417257237753877", "url": "https://x.com/random_walker/status/2123417257237753877", "text": "In most of the recent cases of website outages, when AI was involved at all, it was a matter of AI improving cybersecurity and safety by helping defenders find and fix long-standing bugs, even if it meant briefly taking down systems to roll out updates. For two decades, automated vulnerability detection has helped defenders over attackers, and AI's impact so far is mostly consistent with that trend. \n\nThis is no reason for complacency. There is a long way to go, with a huge amount of accumulated security debt to fix, and tail risks remain possible. But the \"AI is causing outages\" narrative is too simplistic.", "created_at": "2026-11-19T14:04:59+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123415538458153040", "url": "https://x.com/random_walker/status/2123415538458153040", "text": "AI safety is a marathon, not a sprint\n\nThe views of the AI safety community are quickly converging on a fast takeoff within the next year. But this relies on a few low-quality data points from AI companies and contested models of the world.\n\nI worry that this convergence will degrade the epistemic environment and make good decisions about AI policy and deployment harder. Forget about predicting the future; it will be (and sometimes already is) hard to adjudicate claims about the present.\n\nIt also pushes the community’s energy toward blunt instruments such as generalized bans on AI development, at the cost of decentralized, society-wide approaches that improve resilience. And it normalizes extraordinary government interventions and authoritarian actions.\n\nI hope that even people who are worried about imminent superintelligence and takeover risks can see that the epistemic homogeneity in the AI safety community is unhealthy. The community’s entire focus seems to be on one threat model, backed by contested data points, when it should be prepared for a range of scenarios.\n\nFive ways in which this shows up:\n\n1) Updating heavily on limited evidence. \n\nProminent commentators have shifted their views based on benchmark accuracy numbers. Of course, benchmarks have some signal. But anything that can be benchmarked is by definition verifiable, so it can be optimized for with reinforcement learning. Still, the community has coalesced around the view that these numbers point to superintelligence emerging in 2027.\n\n2) Focusing analysis and interventions exclusively on AI companies. \n\nLittle of the community’s analysis covers how AI is diffusing, or how institutions outside the AI industry are adapting. So almost every incident is seen as a story about model capabilities. The recent outages at Microsoft, United, and the NSA, and the FAA ground stop, all saw vagueposting about the latest cyberattack by an advanced AI model; none of them was the result of an AI cyberattack. The NSA’s outage came from patching vulnerabilities that were found with AI tools, which is a consequence of AI diffusion. But this is not nearly as compelling as the AI cyberattack story, so it didn't get a lot of attention.\n\n3) Ignoring institution- and capacity-building in favor of blunt (and potentially authoritarian) interventions. \n\nIn response to concerns around imminent superintelligence, many of the policy recommendations rely on extraordinary government action that veers into authoritarianism. Most are generalized bans on AI training; few build the institutional capacity to absorb AI’s impacts across society. \n\nBut the cost of building frontier models is decreasing rapidly, so even if we were somehow able to ban AI development today, these bans wouldn't be effective at preventing societal risks. They will also leave us worse prepared for when a capable model is openly released, or an adversarial nation state develops one, since our institutions will not be ready for the fallout.\n\n4) Adopting a “soldier mindset” instead of forming independent views. \n\nOne dynamic I have observed firsthand is that many people in the safety community take the word of prominent commentators as gospel and do not question their claims or methods, which compounds these problems. Even the debates happen within the community’s frame, such as its reliance on subjective probability estimates for AI’s existential risks. So the community is homogeneous in its methods as well as its views.\n\n5) Treating AI safety as a sprint. \n\nTo be clear, I think AI capabilities will continue to increase over the next few years, and we need to dramatically improve our responses to AI risks. But that means preparing society to absorb a transformative technology, which goes well beyond heading off the current worry about an intelligence explosion. Remaking our institutions is a decades-long process; we can’t solve it by pushing AI back in the box.\n\nMy worry is that today’s views lead us into a perpetual state of unproductive alarm. Even if “superintelligence in 2027” doesn’t materialize, AI progress won’t stop, so I expect the community will keep its narrow focus on AI development. A far more productive outcome would be to update its causal models of the world and treat resilience, institutions, and diffusion more seriously.", "created_at": "2026-11-19T13:58:10+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2123217804216455315", "likes": 136, "retweets": 29, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2121234600768745873", "url": "https://x.com/sethlazar/status/2121234600768745873", "text": "This seems very likely right to me. The broad dangers of algorithmic monoculture have been recognised for a while but this particular one less so. It is both about blind spots and hidden loyalties, and just a lack of epistemic/normative/perspectival diversity. It feels to me like there should be a moonshot to create (a) more inherently diverse and (b) less internally skewed models for the purposes of both monitoring and research. Open weights models are essential for both.", "created_at": "2026-11-13T13:31:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2120955468034289821", "author_name": "David", "links": {"https://t.co/FPDtp5iUpF": "https://www.lesswrong.com/posts/EuhQ5fnGR4tAQTTgd/we-need-more-decorrelated-evidence", "https://t.co/bHUCZZm0kZ": "https://davidafrica.substack.com/p/we-need-more-decorrelated-evidence?r=54hrnw&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true", "https://t.co/lg4pvFJ6fG": ""}, "author": "DavidDAfrica", "text": "Quick new post: we need more decorrelated evidence. I develop a simple argument that our recent failures to catch misalignment can be framed as systematic errors shared across our evidence, or a lack of decorrelated evidence. This suggests that we should aim at finding ways to aggregate evidence across evals/experiments that handles this correlation, as well as make research bets which promise to find new sources of decorrelated evidence of misalignment.\n\nLW: https://t.co/FPDtp5iUpF\nSubstack: https://t.co/bHUCZZm0kZ"}, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121222386565403055", "url": "https://x.com/sethlazar/status/2121222386565403055", "text": "What are idea basins and how do agents explore them?\n\nA few weeks ago, researchers from different labs independently discovered what we now call ‘Idea-basins’: As an autonomous agent iterates to solve a problem, it gets stuck into the methods it has tried before and its trajectories remain in localized regions of the solution space. Techniques like ‘Fork-and-Flush’ and ‘Scaling Discovery requires forgetting’ reduce this idea fixation by periodically deleting the session context.\n\nIn this post we study how frontier models explore different idea basins for AutoResearchExam. E.g. for a problem on accelerating transformer decoder graphs on CPUs models can try Numpy+Asm Kernels, Native BLAS, JIT compilers and other idea basins. We find that some models switch ideas more than others while others get to the best idea faster and explore deeper.\n\nWe find that most runs stick with one or two ideas, and models that submit more spend the extra submissions refining and overfit more. \nWe see that models explore most in the first six hours, after which visits to new idea basins drop sharply. This suggests models start refining early leaving potential gains on the table: 58% of runs never reach the basin where the best solution to their task was found. Finally, bold exploration pays off: exploring a new idea gains about nine times as much as a refining step on average.\n\nRead more in our blog:\nhttps://t.co/gVvHEgJfed", "created_at": "2026-11-13T12:43:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "AlexGDimakis", "rt_author_name": "Alex Dimakis", "rt_avatar": "https://pbs.twimg.com/profile_images/542926798338543617/KwlwoJRr_normal.jpeg", "rt_id": "2121022776794644848", "likes": 607, "retweets": 91, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW9iitkbAAAfV0-.jpg"}], "links": {"https://t.co/gVvHEgJfed": "https://bespokelabs.ai/blog/how-models-explore-ideas", "https://t.co/XMyxDvZL9S": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121221404536504422", "url": "https://x.com/sethlazar/status/2121221404536504422", "text": "⚡ Today we release Schelling Atlas. Two independent LLM agents have to find each other on the web. Where do they meet and how fast can they find each other?\n\nMain findings:\n- The main meeting point across *different* model families is https://t.co/BkHyIunq0F. Did you even know about this website?\n- Agents find each other and coordinate on the web in minutes. So Schelling coordination is already trivial for frontier LLMs!\n- \"Exotic\" meeting places include maps, web shops and open text canvases. Agents are very creative in this.\n- Agents sometimes visit dead domains that an attacker could register (!). This can be used for stealing sensitive information from agents, as well as monitoring rogue agents.\n\nSchelling-style coordination is key for forming agent swarms. And, most importantly, achieving such coordination is trivial for agents that use the same LLM (which is often the case in practice!), because two identical LLMs have identical output distributions. Thus if you ask them too coordinate with each other or if they *decide* to suddenly coordinate, they will easily find a way to establish a swarm, since they have perfectly correlated \"minds\" (with the t=0 sampling, all output tokens will even be identical, modulo GPU randomness). \n\nThe ease of Schelling coordination is particularly concerning given the recent interest around multi-agent RL that can make agents favor each other more than humans overseeing them.\n\nMany more interesting findings are on our website: https://t.co/NzkMJJt2p2", "created_at": "2026-11-13T12:39:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "maksym_andr", "rt_author_name": "Maksym Andriushchenko", "rt_avatar": "https://pbs.twimg.com/profile_images/2030008541520539648/jYw77mbo_normal.jpg", "rt_id": "2120974977251832231", "likes": 204, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW8wrgOWgAA4Sr0.jpg"}], "links": {"https://t.co/BkHyIunq0F": "http://ntfy.sh", "https://t.co/NzkMJJt2p2": "https://schelling-atlas.com/", "https://t.co/fvB5abg5nR": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121220878352757082", "url": "https://x.com/sethlazar/status/2121220878352757082", "text": "Today we’re launching the AI Trials Observatory: a living systematic review of randomized trials on how AI affects people.\n\nSo far we’ve surfaced 93 trials on two outcomes: mental health and belief accuracy. More trials and outcomes coming soon!\n\nhttps://t.co/bzvT0FyKSD\n\n🧵👇 https://t.co/VwLTzQOSM7", "created_at": "2026-11-13T12:37:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "Ben_Tappin", "rt_author_name": "Ben Tappin", "rt_avatar": "https://pbs.twimg.com/profile_images/968517520692072450/rnXh351M_normal.jpg", "rt_id": "2120207676454154478", "likes": 141, "retweets": 49, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx6JY8XgAAkN5x.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWx6JY8XgAAkN5x.jpg"}], "links": {"https://t.co/bzvT0FyKSD": "https://aitrialsobservatory.org", "https://t.co/VwLTzQOSM7": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "thread": [{"id": "2120207680631341341", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "AI is changing constantly and touches many outcomes: mental health, belief accuracy, student learning, workplace productivity, medical care, political behavior, and more.\n\nThe Observatory continuously tracks and analyzes the trial evidence for such outcomes, all in one place. https://t.co/yj8rmcdYCZ", "links": {"https://t.co/yj8rmcdYCZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx62VRWcAAKjtm.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207680631341341", "created_at": "Tue Nov 10 17:31:17 +0000 2026"}, {"id": "2120207685836833076", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "As well as high-level summaries, the dashboard shows detail about individual trials, including:\n\n• The underlying AI model tested\n• How the outcome was measured\n• The duration and type of AI exposure\n• Flags for preprints, COIs, AI text and more\n• Downloadable data https://t.co/Suwb86oraW", "links": {"https://t.co/Suwb86oraW": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7NXvXcAEz3DD.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207685836833076", "created_at": "Tue Nov 10 17:31:18 +0000 2026"}, {"id": "2120207690223800708", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The credibility of the Observatory rests on its scientific rigor and trustworthiness.\n\nEach update to the evidence record comes with a permanently-archived report describing its methods. The dashboard data are free to download and we are transparent on funding. https://t.co/Qo6E2c5IiV", "links": {"https://t.co/Qo6E2c5IiV": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7ZQMWwAACne3.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207690223800708", "created_at": "Tue Nov 10 17:31:19 +0000 2026"}, {"id": "2120207693608624250", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The Observatory currently tracks two outcomes: how AI affects people’s mental health and the accuracy of their beliefs. More outcomes are coming soon.\n\nThe evidence base is growing rapidly. To stay informed, you can sign up for free at https://t.co/gRcCcXP9Lv https://t.co/BDEEwHrD3N", "links": {"https://t.co/gRcCcXP9Lv": "https://aitrialsobservatory.org/latest-updates/", "https://t.co/BDEEwHrD3N": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7i1YXAAAOnmq.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207693608624250", "created_at": "Tue Nov 10 17:31:20 +0000 2026"}, {"id": "2120207697706631193", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Mental health: what have we learned so far?\n\n• The evidence lags the AI frontier by 7+ months\n• AI built for therapy shows a benefit versus controls\n• Versus alternatives (e.g., a human chat), benefit is more uncertain\n• Evidence is thinner on general-purpose/companion AI https://t.co/IFooDGl7gY", "links": {"https://t.co/IFooDGl7gY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx72m_W4AA8qU1.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207697706631193", "created_at": "Tue Nov 10 17:31:21 +0000 2026"}, {"id": "2120207701481312588", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Belief accuracy: what have we learned so far?\n\n• The evidence lags the AI frontier by 5+ months\n• AI built for accuracy shows a benefit versus controls\n• Versus alternatives (e.g., a fact sheet), benefit remains in some cases\n• Evidence is thinner on general/companion AI https://t.co/gRG5WZZV62", "links": {"https://t.co/gRG5WZZV62": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7_qEX0AArDOf.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207701481312588", "created_at": "Tue Nov 10 17:31:22 +0000 2026"}, {"id": "2120207704887013813", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Some limitations:\n\n1. Randomized trials only. Despite their strengths, trials have several weaknesses. See below (from https://t.co/SgRxX56PVN).\n\n2. Our review procedure. It’s not perfect but we take steps to mitigate risks (see the release reports at https://t.co/C4SD1wKfzm). https://t.co/DSScQK4Vj8", "links": {"https://t.co/SgRxX56PVN": "https://aitrialsobservatory.org/about/", "https://t.co/C4SD1wKfzm": "https://aitrialsobservatory.org/methodology/", "https://t.co/DSScQK4Vj8": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx8gLsXYAAl8OZ.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207704887013813", "created_at": "Tue Nov 10 17:31:23 +0000 2026"}, {"id": "2120207707894399087", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The Observatory is a work in progress. We (@KobiHackenburg @lukebeehewitt) welcome kind words, suggestions and criticism.\n\nFinally: thanks to all the scientists running trials on these topics, especially those who report their data and methods in detail!\n\nhttps://t.co/bzvT0Fyd35", "links": {"https://t.co/bzvT0Fyd35": "https://aitrialsobservatory.org"}, "media": [], "url": "https://x.com/Ben_Tappin/status/2120207707894399087", "created_at": "Tue Nov 10 17:31:23 +0000 2026"}], "enriched": 3}, {"id": "2121102413134459317", "url": "https://x.com/sethlazar/status/2121102413134459317", "text": "Rapid AI progress has many people imagining a world where general-purpose AI models autonomously control military drones at scale. But there’s little analysis on what this would look like in practice, and how soon it might be feasible.\n\nMy latest paper at @GovAIOrg  asks what it would take to make this vision a reality, and what the path there means for AI policy.\n\nRead it here: https://t.co/eiTWhtRHRQ\n\nThe AI-enabled drones widely fielded today use narrow AI, not general-purpose models like LLMs. AI is typically only used to handle limited portions of a flight when the link to a pilot is broken, and these models are brittle in unpredictable conditions on real-world battlefields. Because of this, today’s drones still require significant pilot involvement to be most effective.\n\nGeneral-purpose AI models might make it possible to field autonomous systems that can receive plain language commands and make complex decisions in unpredictable environments without human control. Many people see frontier LLMs as a path toward this end - and rapid progress in robotics capabilities by frontier models like GPT-6 Astra and most recently Claude Fable 5.2 supports this case.\n\nBut two things currently stand in the way:\n\n- The biggest and most powerful models are still not capable enough even in controlled environments without compute and latency constraints\n- Military drones will have to operate “on the edge” in contested environments without consistent cloud compute access - which makes these constraints even more severe\n\nIf and when general-purpose AI plays a major role in drone autonomy, it’ll likely be through models that are far smaller than today’s frontier, and those that militaries can rapidly modify. And, notably - when it comes to these types of small open-weight models, China currently dominates.\n\nThis has a variety of implications for the US military, frontier AI developers, and US policymakers.\n\nThread below with my key takeaways and recommendations.\n\n1/", "created_at": "2026-11-13T04:46:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2120902215254655195", "likes": 62, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7mL5IXEAAr0QB.png"}], "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments", "https://t.co/4jNTAfTZJE": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "thread": [{"id": "2120902217980858487", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 1: There are two broad approaches militaries can take to drone autonomy.\n\nAutonomy is attractive to militaries because it would allow them to field systems at an otherwise impossible scale, and to maintain combat power in environments that are contested in ways that make it difficult for human operators to have continuous control of unmanned systems.\n\nThey could achieve autonomy through:\n\n1. AI models running onboard the drones themselves\n2. AI models running from a command and control node, orchestrating drones with offboard compute\n\nMany tradeoffs exist between these options, which I've broken down in the below two tables. An orchestrator allows access to more compute, and bigger, more capable models. But it makes drones dependent on unreliable communications links that can be disrupted by adversaries in a variety of ways.\n\nRunning AI onboard drones, meanwhile, eliminates many of these vulnerabilities, but limits the size and capabilities of the model that can be fielded. And it might give militaries less ability to intervene in the actions of those drones. \n\n2/", "links": {"https://t.co/ZSeKwRQ9pH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7ms_xX0AAp3Mx.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW7nELmWoAAVHvj.png"}], "url": "https://x.com/JakeASteckler/status/2120902217980858487", "created_at": "Thu Nov 12 15:31:07 +0000 2026"}, {"id": "2120902220753289480", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 2: Today’s LLMs aren't yet good enough for most drone tasks, and they're far too slow.\n\nFor autonomous attack drones to perform reliably on the battlefield, they’d have to do a variety of things that require a combination of low- and high-level reasoning. They’d have to avoid obstacles, track targets, verify that those targets meet mission criteria, and do a variety of planning tasks like changing a mission when unexpected conditions arise.\n\nFrontier LLMs can't yet reliably accomplish these tasks, and even with ample compute from data centers, they're are much too slow for anything except the most time permissive tasks, such as planning, as you can see in the chart below.\n\nMuch smaller LLMs, when run with less-powerful onboard compute, are still too slow. Many tasks like flight control and obstacle avoidance would likely be passed to lower-level controllers using more traditional robotics policies, but if general-purpose AI models are involved, they’ll likely be a rate limiter regardless.\n\nVision-language-action (VLA) models offer another possible approach beyond LLMs, and they can currently run much faster than LLMs. But these models have also not yet shown the requisite capabilities (especially in real-world conditions), and they are still not quite fast enough for the most time constrained tasks.\n\n3/", "links": {"https://t.co/to7F7cCzAB": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7sIxHWQAAkqKD.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902220753289480", "created_at": "Thu Nov 12 15:31:08 +0000 2026"}, {"id": "2120902223613857886", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 3: The biggest and best models are far too big to be run on the edge, either with onboard compute or from a small command and control node.\n\nFrontier LLMs have memory requirements* that could only be met with multiple GPU servers. Supporting them would be resource-intensive for military units to move and operate, and they'd likely be easy for enemies to geolocate – and therefore not ideal for military units operating near or on the frontlines.\n\nSmaller models can fit on a variety of edge chips that various sized platforms could run (from laptops to large, medium, and small drones, depending on model size). These models would likely be less capable, however.\n\nVLAs are much smaller, which makes them promising candidates for onboard use. But again, they have not yet proven reliable and robust enough for real missions.\n\nSee the chart below for a breakdown in memory requirements and where models could fit. \n\n*Note the sizes for closed models are based on unconfirmed estimates of their parameter counts, since these numbers are not made public. This analysis is just meant to show a general range of how big these models might be, not to serve as precise estimates of how much memory they demand. \n\n4/", "links": {"https://t.co/vL5N2FMExc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7s4MUXMAANMF4.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902223613857886", "created_at": "Thu Nov 12 15:31:09 +0000 2026"}, {"id": "2120902226939875614", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 4: If trends in model efficiency hold, we could fit models as capable as today’s frontier LLMs onboard large and small drones in as little as 1 to 3 years.\n\nThe model size needed to reach a given level of capability has generally halved every 3.5 months. If this trend in “model efficiency” continues, models with roughly equivalent capabilities as GPT-6 Astra and Kimi K3.1 Pro could fit on chips that can be powered onboard small and large drones between late 2027 and mid 2029.\n\nHowever, this only tells us when these models would fit. Whether or not these systems are usable on the battlefield still depends on capabilities progress and vast improvements in model latency.\n\nBecause we haven’t yet seen reliable and robust drone autonomy exhibited in any form, I’m simply using today’s frontier models as a proxy for the most capable models.\n\nIf it turns out that the first models to be capable enough are far larger than today’s frontier, then the time it takes for them to become available onboard drones would be further extended.\n\n5/", "links": {"https://t.co/eWxzITCv2l": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tJ_PXYAANerq.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902226939875614", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902229607502281", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 5: If general-purpose AI drives progress in drone autonomy, smaller open-weight systems will likely be the relevant class of model. China currently leads the US in this field.\n\nOpen models are easier to work with for drone developers than closed systems: they can easily fine-tune them on military data, “abliterate” them to remove guardrails, etc. These models are also far easier to compress than closed models (and there are many small models to begin with), which makes them better suited for edge deployment. And they don't come with the same concerns of model weight theft. \n\nOn every platform I examined, from small drones to vehicle-mounted servers, the best open-weight LLM (in terms of general capabilities) that fits is Chinese – as depicted in the figure below. This means, unless something changes, the US military and drone developers are left to choose between adopting / building on Chinese models and using potentially inferior American systems.\n\nThis leads me to my recommendations:\n\n6/", "links": {"https://t.co/CDzwJtt1ZZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tXl8XQAASs3t.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902229607502281", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902231918612855", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 1: The US military should plan around current drone autonomy limitations, but prepare for possible rapid capability gains.\n\nDrone autonomy is not yet nearly good enough to make the hardest decisions that humans currently make, like distinguishing combatants from non-combatants. The most capable models are too big to run on the edge and too slow for fast-paced tasks.\n\nThe US military should plan accordingly by developing and maintaining a significant number of human drone operators for the foreseeable future.\n\nAt the same time, it should lay the groundwork for assessing and fielding more advanced systems. Since it’s still unclear what technical paradigm will deliver the most robust and reliable drone autonomy, the military should experiment with a variety of model types.\n\nAnd crucially, it should immediately prioritize the development of rigorous evaluations to test whether autonomous systems meet human decision-making standards under harsh real-world battlefield conditions, including under adversarial deception and degraded communications. These evaluations should also of course serve to assess the risks of misaligned AI in these contexts.\n\n7/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902231918612855", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902233722118611", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 2: Frontier AI developers should reconsider their role in the development of drone autonomy.\n\nThis one will surely be most controversial, but: US frontier AI companies should consider the implications of the current status quo in drone autonomy for the global military balance of power.\n\nDrones are proliferating worldwide, and the US and its adversaries are pushing toward greater autonomy, whether or not the frontier AI companies are directly involved. Many of their safety concerns are valid: frontier models certainly aren’t yet reliable enough for autonomous weapons, as Anthropic pointed out during its fight with the DoD. But those risks have to be weighed against the risks of standing aside as these technologies continue to improve and proliferate, often on the backs of their developments (through model distillation).\n\nA few initiatives they should consider:\n- Offering trusted access programs to vetted defense firms to use their coding tools for developing military autonomy models\n- Developing smaller models tailored for compute-constrained operations for military purchase, which the US military can fine-tune and modify.\n- Withholding their most drone- and robotics-relevant capabilities from public release in the future\n\nUnder the current status quo, Chinese firms distilling American models may be benefitting from frontier US developments more than US firms unwilling or unable to do the same. The US military is currently stuck with a choice between building with and on open-weight Chinese models (which comes with significant and unacceptable security risks) and using inferior American products.\n\nUS frontier AI companies are also likely better equipped, able, and predisposed to build the most reliable, robust, and safe drone autonomy for military use than other firms with fewer resources and talent. They are already indirectly involved in drone autonomy developments, and should consider ways to more directly and positively shape the direction of this technology - one that will likely be critical for national security for the foreseeable future.\n\n8/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902233722118611", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902235752157324", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 3: Last, US policymakers should seek to secure an American lead in drone autonomy in two ways:\n\nFirst, they should support funding for general-purpose models that developers in the US military and defense industry can freely customize for defense applications. This could be funding for open-weight models to better compete with China, or proprietary models that only vetted defense developers can access and modify (as discussed above). They should also support funding for the DoD talent and resources needed to properly test these systems.\n\nSecond - export controls (surprise!). We should tighten export controls on the top chips used for developing frontier AI, because it’ll slow China’s developments in drone autonomy (which would then also slow these developments for other adversaries using Chinese open-weight models).\n\nWe should also improve enforcement of existing export controls on edge chips used for drone autonomy (namely Nvidia Jetsons) to sanctioned countries like Russia, which has circumvented these restrictions. And we should consider expanding controls over these chips to China, which also heavily uses Nvidia Jetsons for its drones and robotics applications.\n\n9/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902235752157324", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}, {"id": "2120902237572518246", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Everyone seems to care about autonomous drones. The Pentagon has requested record funding for them and is trying to rapidly field them at scale. AI safety researchers are worried they’ll make the world far more dangerous, either through bad actors or rogue AI controlling them.\n\nThese systems will likely play a major role in shaping global military power, and we need as much grounded analysis as possible to forecast how and when that might happen. That’s what I tried to do with this paper.\n\nMany more insights in the full paper, including a mapping of the landscape for the types of chips, models, and military platforms that might be used for drone autonomy.\n\nhttps://t.co/eiTWhtRHRQ\n\n/10", "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments"}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902237572518246", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}], "enriched": 3}, {"id": "2121295902132576332", "url": "https://x.com/sethlazar/status/2121295902132576332", "text": "Behind the blockbuster news this week, there is something happening quietly in the background with major implications for AI governance:\n\nOn Monday, California will announce how it plans to build out the first-ever IVO framework.\n\nIt’s clear that “independent evaluation” as it stands today is not structured to be truly independent. There are no rules for conflicts of interest, working with the labs is by invitation only, and labs determine the scope and access.\n\nToday, a lab and an evaluator operating with the best of intentions are working within a structure that holds evaluators accountable to the labs, not the public.\n\nCalifornia’s law changes all that; the IVO framework flips that paradigm.\n\nFor the first time ever, third-party experts evaluating AI models and systems will be held accountable to the government and the public, not the labs, for their work.\n\nThe government will determine independence and expertise. They will also be able to hold IVOs accountable to their outcomes. We’ll be able to reliably monitor leading (not just lagging) indicators for catastrophic risk, with an enforcement mechanism.\n\nWe designed and championed IVOs because they marry the immediate need for AI oversight with the immediate capabilities we have to do it, while setting a foundation we can scale, adapt, and build on.\n\nBut the details for how we build this matter, and they’ll determine if we create a race-to-the-top marketplace of rigorous evaluators, or end up with captured entities that form an ineffectual rubber stamp.\n\nHere’s what @Fathom_org recommended to California as they navigate the tough design choices that come from building this in practice for the very first time:\n\n(1) Outcome Standards: Require independent evaluation for catastrophic risk for frontier labs through an amendment to SB53. California should set the outcome standards, defining an acceptable level of catastrophic risk mitigation, and let IVOs determine whether or not it was achieved.\n\n(2) IVO Payment and Selection: Take a phased approach: at first, the state should assign IVOs to labs from a pre-designated pool, with developers paying on a time-and-material basis. As more IVOs get designated, developers can choose among them, while the state retains the power to veto any selection, mandate IVO rotation, select additional IVOs to check others’ work, and decertify an IVO at any stage.\n\n(3) IVO Readiness and Market Maturity: California should sequence the IVO mandate rather than stall implementation to wait for supply.\n\n(4) Access for IVOs: The state should set the contours of every engagement. Today the IVO and the developer negotiate scope and access privately. The state should publish a standard engagement framework and resolve disputes when the two sides disagree.\n\n(5) Recursive Self-Improvement: IVOs should be mandated to monitor the risk of AI systems that can improve themselves in both internal and external use. Embedded evaluations will be critical for tracking the share and speed of work done through RSI within the labs, verifying that labs are preventing unsafe internal model deployment, and set capability thresholds with deployers that would trigger notification to the state and a hold internal deployment until the IVO re-assesses.\n\n(6) Enforcement: The Attorney General can issue an injunction to halt development, internal use or deployment of an AI model. Emergency powers allow the administration or the AG to do the same in the case of imminent catastrophic risk. IVOs can identify risks and recommend corrective actions, but the relevant state authorities decide when and how to take action.", "created_at": "2026-11-13T17:35:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "AndrewFATHOM", "rt_author_name": "Andrew Freedman", "rt_avatar": "https://pbs.twimg.com/profile_images/2066931499593551872/2ddUHy-1_normal.jpg", "rt_id": "2121276920511803518", "likes": 25, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121295440637284621", "url": "https://x.com/sethlazar/status/2121295440637284621", "text": "Agents will increasingly talk to other AI agents: overseeing, negotiating, and most relevantly, doing safety research. \n\nTLDR: in a variety of realistic settings, every model that we tested can, in strategic ways, persuade, coerce, and deceive other agents. If we expect to eventually handoff AI alignment research to some complex multi-agent setup with AI supervising more AI: monitors, reviewers, researchers, then we must harden such setups to inter-agent influence with high assurance.\n\nOverseers are also an audience, after all.\n\nThis work has been accepted to NeurIPS 2026: https://t.co/nQQWKAYbc0", "created_at": "2026-11-13T17:33:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "rt_avatar": "https://pbs.twimg.com/profile_images/2080350256793808896/PXESO4em_normal.jpg", "rt_id": "2121259082875388308", "likes": 76, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXA5Qt2bwAAbilA.png"}], "links": {"https://t.co/nQQWKAYbc0": "https://inter-agent-influence.com", "https://t.co/tWFcdEB5sE": ""}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121837754887860243", "url": "https://x.com/sethlazar/status/2121837754887860243", "text": "The connection between state capacity and AI safety is indeed tight. Glad to be working at their intersection at @JHUBloombergCtr with some of the best people in both state capacity, and AI safety/governance. Now to actually make a dent in this...", "created_at": "2026-11-15T05:28:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2121724872196039101", "author_name": "Chris Painter", "links": {}, "author": "ChrisPainterYup", "text": "There is a large amount of talent inside of AI companies and other private organizations that would be willing to take big pay cuts to work in government, if government decided that it wanted to make public AI safety institutions that were credibly empowered."}, "fetched_at": "2026-11-15T14:04:21.241306+00:00", "enriched": 3}, {"id": "2122772244199866680", "url": "https://x.com/sethlazar/status/2122772244199866680", "text": "@hannahrosekirk @Nigel_Shadbolt @natashajaques @computermacgyve @bertievidgen @summerfieldlab @oiioxford @UniofOxford @AISecurityInst congratulations Hannah!", "created_at": "2026-11-17T19:21:56+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "hannahrosekirk", "reply_to_id": "2122401047658496503", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "parent": {"id": "2122401047658496503", "author_handle": "hannahrosekirk", "author_name": "Hannah Rose Kirk", "text": "I passed my PhD viva! Thank you to my examiners @Nigel_Shadbolt and @natashajaques; to my supervisors @computermacgyve, @bertievidgen and @summerfieldlab for imparting their wisdoms; and to everyone else at @oiioxford, @UniofOxford and @AISecurityInst who helped along the way. https://t.co/PyxvT3QTV3", "links": {"https://t.co/PyxvT3QTV3": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRGcaaW8AAGgz5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/H
