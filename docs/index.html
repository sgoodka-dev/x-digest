03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "TheDavidSJ", "reply_to_id": "2118764267721625915", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118764267721625915", "author_handle": "TheDavidSJ", "author_name": "David Schneider-Joseph 🔍", "text": "@testingham @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 Yes, it's synthetic to illustrate the dependence of the shape of the curve on the specific choice of benchmarks. I didn't do any calibration checks, it was vibecoded quickly to illustrate the question.", "links": {}, "media": [], "url": "https://x.com/TheDavidSJ/status/2118764267721625915", "created_at": "Fri Nov 06 17:55:40 +0000 2026"}}, {"id": "2118762651656577395", "url": "https://x.com/testingham/status/2118762651656577395", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 just to check (1) they're not actual benchmarks, these are synthetic? (2) did you do the calibration check on residuals that we do in the note?", "created_at": "2026-11-06T17:49:15+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "TheDavidSJ", "reply_to_id": "2118748568152400188", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118748568152400188", "author_handle": "TheDavidSJ", "author_name": "David Schneider-Joseph 🔍", "text": "@testingham @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 Both families are linear in log-odds, they’re just two suites of tasks whose log-odds respond differently to the same underlying latent intelligence variable.", "links": {}, "media": [], "url": "https://x.com/TheDavidSJ/status/2118748568152400188", "created_at": "Fri Nov 06 16:53:17 +0000 2026"}}, {"id": "2118762447876304948", "url": "https://x.com/testingham/status/2118762447876304948", "text": "@lugaricano Do you feel this sufficiently answered your original question?", "created_at": "2026-11-06T17:48:26+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118735953153990716", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118735953153990716", "author_handle": "lugaricano", "author_name": "Luis Garicano 🇪🇺🇺🇦", "text": "Good post on acceleration and the METR metric that is causing so much concern.", "links": {}, "media": [], "url": "https://x.com/lugaricano/status/2118735953153990716", "created_at": "Fri Nov 06 16:03:10 +0000 2026"}}, {"id": "2118742149730811978", "url": "https://x.com/testingham/status/2118742149730811978", "text": "@datagenproc aristotle will recognize his true heirs", "created_at": "2026-11-06T16:27:47+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "datagenproc", "reply_to_id": "2118740832790716451", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118740832790716451", "author_handle": "datagenproc", "author_name": "jsd", "text": "@testingham Some have not yet given up, and are still fighting the good fight (jk) https://t.co/J1sl2dcHII", "links": {"https://t.co/J1sl2dcHII": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdHjxWaQAE8Qds.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWdHjxdaQAQ8qsk.jpg"}], "url": "https://x.com/datagenproc/status/2118740832790716451", "created_at": "Fri Nov 06 16:22:33 +0000 2026"}}, {"id": "2118738750755021041", "url": "https://x.com/testingham/status/2118738750755021041", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 FWIW I find this visualization most useful: https://t.co/AMKb9FPmxW", "created_at": "2026-11-06T16:14:17+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118738374173565013", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/AMKb9FPmxW": "https://tecunningham.github.io/eci-benchmark-logodds/"}, "enriched": 3, "parent": {"id": "2118738374173565013", "author_handle": "testingham", "author_name": "tom cunningham", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 what exactly are family A &amp; B here?\n\nIt sounds like family B, they're not linear in log-odds, &amp; the linearity-in-log-odds assumptions are jointly testable (&amp; we discuss this in the report).", "links": {}, "media": [], "url": "https://x.com/testingham/status/2118738374173565013", "created_at": "Fri Nov 06 16:12:47 +0000 2026"}}, {"id": "2118738374173565013", "url": "https://x.com/testingham/status/2118738374173565013", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 what exactly are family A &amp; B here?\n\nIt sounds like family B, they're not linear in log-odds, &amp; the linearity-in-log-odds assumptions are jointly testable (&amp; we discuss this in the report).", "created_at": "2026-11-06T16:12:47+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "TheDavidSJ", "reply_to_id": "2118588413158768922", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118588413158768922", "author_handle": "TheDavidSJ", "author_name": "David Schneider-Joseph 🔍", "text": "@davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 You can do that but then the measured speedup goes away. The question isn't whether the model is \"correct\" in some sense, but whether it's meaningful to talk about speedups as if they are independent of an arbitrary choice of monotonic transformation (in this case f).", "links": {}, "media": [], "url": "https://x.com/TheDavidSJ/status/2118588413158768922", "created_at": "Fri Nov 06 06:16:53 +0000 2026"}}, {"id": "2118726168048534007", "url": "https://x.com/testingham/status/2118726168048534007", "text": "@lugaricano Hi Luis:\n\n- concretely, the IRT is unique up to an affine transform, which allows us to make judgments of acceleration, though we cannot meaningfully talk about a level or proportional changes.\n- the assumptions that get us this is that there exists a latent capability, & each of these benchmarks is a logistic function of that latent capability. Although we cannot individually test the assumptions they're over-identified, & in the report you can see we do tests for robustness (many other people have gone deeper on this, can share links).\n- I think the best intuition is that we're doing a principal components analysis.\n- there are of course many ways this could go wrong, we try to cover some of them in the report, & there's a mini litereature that's sprung up around interpreting ECI. It's a deeply unsatisfying metric but it's also the best we have.\n- here's a visualization which I think is useful for building intuition: https://t.co/k6YrYDU3NZ\n- the *quantity* that we're recovering is something that's slightly difficult to describe: it's latent ability to do benchmark tasks. As we discuss in the report, we are unsure how smoothly this is related to real-world impact (which itself is very hard to operationalize).", "created_at": "2026-11-06T15:24:17+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118647879984091534", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {"https://t.co/k6YrYDU3NZ": "https://tecunningham.github.io/eci-benchmark-logodds/"}, "enriched": 3, "parent": {"id": "2118647879984091534", "author_handle": "lugaricano", "author_name": "Luis Garicano 🇪🇺🇺🇦", "text": "@testingham If you allow me to push a bit on the utility analogy, since all economists have these intuitions since grad school: von Neumann-Morgenstern made utility cardinal, but we can not say that it measures how much more a consumer wants something. You can still not add or compare across people.  IRT seems to do the same for benchmarks. Yes, you can fix the odds of passing a test, but you cannot compare across domains. \n\nI think saying that progress is accelerating by 1.9 confuses reliably passing test with progress at the frontier. I still don't think the number and statement means what people take it to mean.", "links": {}, "media": [], "url": "https://x.com/lugaricano/status/2118647879984091534", "created_at": "Fri Nov 06 10:13:11 +0000 2026"}}, {"id": "2118724951662583926", "url": "https://x.com/testingham/status/2118724951662583926", "text": "When Aristotle is reincarnated he will not say his problem was lack of data. He will see that we're working with mostly the same old jigsaw pieces but we've put them together in a different way, & he'll recognize it's better.\n\nThe dolphin is next to the dog, not the fish. The far East is next to the far West. The sun belongs with the stars, the moon belongs with the earth. Heat is motion. The different races and sexes of humans are closer to each other than he had thought, and they're also all fitted in very close to the apes and the monkeys.\n\nWe'll just need to show the jigsaw to Aristotle, how we've rearranged all the pieces that he already had available, and he'd recognize that it's right.  We wouldn't have to show him new facts, just new theory. We've accumulated a lot of new pieces but the patterns that those new pieces helped to form are, in retrospect, visible in the pieces he already had.\n\nThere are also collections of pieces which Aristotle was working on fitting together but which we have given up on. Early philosophers tried to slot together the different types of Virtue, the different types of Republic, the different types of Friendship, as if they came out of some periodic table -- the four humours, the seven vices. That expectation is much weaker today.", "created_at": "2026-11-06T15:19:27+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 28, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118790787886690529", "url": "https://x.com/testingham/status/2118790787886690529", "text": "@peterwildeford @TheDavidSJ @davidroodman @YafahEdelman @james_s48 @EpochAIResearch @AlexBarry4 email me! tom.cunningham @ metr", "created_at": "2026-11-06T19:41:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "peterwildeford", "reply_to_id": "2118789210073092314", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118789210073092314", "author_handle": "peterwildeford", "author_name": "Peter Wildeford🇺🇸🚀", "text": "@testingham @TheDavidSJ @davidroodman @YafahEdelman @james_s48 @EpochAIResearch @AlexBarry4 Can I email you something? Or should I twitter DM? Curious for you to look at something", "links": {}, "media": [], "url": "https://x.com/peterwildeford/status/2118789210073092314", "created_at": "Fri Nov 06 19:34:47 +0000 2026"}}, {"id": "2118788672007143462", "url": "https://x.com/testingham/status/2118788672007143462", "text": "@peterwildeford @TheDavidSJ @davidroodman @YafahEdelman @james_s48 @EpochAIResearch @AlexBarry4 I don't feel i've looked at ECI stuff to make confident calls, but this is useful background for the claims made in the Anthropic report, why we have plots of residuals there.", "created_at": "2026-11-06T19:32:39+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "peterwildeford", "reply_to_id": "2118785121801146778", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118785121801146778", "author_handle": "peterwildeford", "author_name": "Peter Wildeford🇺🇸🚀", "text": "@testingham @TheDavidSJ @davidroodman @YafahEdelman @james_s48 @EpochAIResearch @AlexBarry4 so seems like things look logistic? to make sure I'm reading the lines right", "links": {}, "media": [], "url": "https://x.com/peterwildeford/status/2118785121801146778", "created_at": "Fri Nov 06 19:18:32 +0000 2026"}}, {"id": "2118767130594455751", "url": "https://x.com/testingham/status/2118767130594455751", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 https://t.co/6r4FgTWqyC", "created_at": "2026-11-06T18:07:03+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118767004190744694", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/6r4FgTWqyC": "https://tecunningham.github.io/eci-benchmark-logodds/#tab=resid"}, "enriched": 3, "parent": {"id": "2118767004190744694", "author_handle": "testingham", "author_name": "tom cunningham", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 can see residuals for ECI here: https://t.co/z4NIYxFR9H", "links": {"https://t.co/z4NIYxFR9H": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdfW7faQAAve9n.jpg"}], "url": "https://x.com/testingham/status/2118767004190744694", "created_at": "Fri Nov 06 18:06:33 +0000 2026"}}, {"id": "2118767004190744694", "url": "https://x.com/testingham/status/2118767004190744694", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 can see residuals for ECI here: https://t.co/z4NIYxFR9H", "created_at": "2026-11-06T18:06:33+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118764612527259953", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdfW7faQAAve9n.jpg"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/z4NIYxFR9H": ""}, "enriched": 3, "parent": {"id": "2118764612527259953", "author_handle": "testingham", "author_name": "tom cunningham", "text": "@TheDavidSJ @davidroodman @YafahEdelman @peterwildeford @james_s48 @EpochAIResearch @AlexBarry4 cool -- i think it's clear that IRT requires logistic, &amp; it sounds like you've simulated non-logistic distribution, but fortunately that assumption is at least partly testable (&amp; we test it)", "links": {}, "media": [], "url": "https://x.com/testingham/status/2118764612527259953", "created_at": "Fri Nov 06 17:57:03 +0000 2026"}}, {"id": "2118856668696166898", "url": "https://x.com/testingham/status/2118856668696166898", "text": "@lugaricano great -- happy to talk more about your remaining doubts -- &amp; maybe you want to post an update to your original post?", "created_at": "2026-11-07T00:02:50+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "lugaricano", "reply_to_id": "2118852272109068728", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "parent": {"id": "2118852272109068728", "author_handle": "lugaricano", "author_name": "Luis Garicano 🇪🇺🇺🇦", "text": "@testingham Very useful. The doubt remains, but your explanation was clear and unambiguous, thanks!", "links": {}, "media": [], "url": "https://x.com/lugaricano/status/2118852272109068728", "created_at": "Fri Nov 06 23:45:22 +0000 2026"}}, {"id": "2119079836639715516", "url": "https://x.com/testingham/status/2119079836639715516", "text": "@lugaricano FWIW I acknowledge it’s a weird situation where you know the rate of acceleration but you don't know the location or velocity. Like sitting in a car blindfolded , you can feel the g’s but you don't know how fast you're going or where you are.", "created_at": "2026-11-07T14:49:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2118726168048534007", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2118726168048534007", "author_handle": "testingham", "author_name": "tom cunningham", "text": "@lugaricano Hi Luis:\n\n- concretely, the IRT is unique up to an affine transform, which allows us to make judgments of acceleration, though we cannot meaningfully talk about a level or proportional changes.\n- the assumptions that get us this is that there exists a latent capability, & each of these benchmarks is a logistic function of that latent capability. Although we cannot individually test the assumptions they're over-identified, & in the report you can see we do tests for robustness (many other people have gone deeper on this, can share links).\n- I think the best intuition is that we're doing a principal components analysis.\n- there are of course many ways this could go wrong, we try to cover some of them in the report, & there's a mini litereature that's sprung up around interpreting ECI. It's a deeply unsatisfying metric but it's also the best we have.\n- here's a visualization which I think is useful for building intuition: https://t.co/k6YrYDU3NZ\n- the *quantity* that we're recovering is something that's slightly difficult to describe: it's latent ability to do benchmark tasks. As we discuss in the report, we are unsure how smoothly this is related to real-world impact (which itself is very hard to operationalize).", "links": {"https://t.co/k6YrYDU3NZ": "https://tecunningham.github.io/eci-benchmark-logodds/"}, "media": [], "url": "https://x.com/testingham/status/2118726168048534007", "created_at": "Fri Nov 06 15:24:17 +0000 2026"}}, {"id": "2117663925013807195", "url": "https://x.com/slatestarcodex/status/2117663925013807195", "text": "@bryanrwalsh The no-hedges alternative would have been even worse.", "created_at": "2026-11-03T17:03:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "bryanrwalsh", "reply_to_id": "2117645085814792486", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117645085814792486", "author_handle": "bryanrwalsh", "author_name": "Bryan Walsh", "text": "Based off the responses, the length of Against SURA did not ensure this outcome", "links": {}, "media": [], "url": "https://x.com/bryanrwalsh/status/2117645085814792486", "created_at": "Tue Nov 03 15:48:27 +0000 2026"}}, {"id": "2117535585598386233", "url": "https://x.com/slatestarcodex/status/2117535585598386233", "text": "@SkyeSharkie I disagree that my recent post was about this. I think the people I was criticizing in my recent post are undoubtedly sincere, not motivated by money, and pretty effective at getting what they want. I think their work is very net positive even though I think it would be more positive if they changed their minds on the one sub-sub-issue where I disagree with them.", "created_at": "2026-11-03T08:33:20+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SkyeSharkie", "reply_to_id": "2117356272693764344", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 66, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117526390946099225", "url": "https://x.com/slatestarcodex/status/2117526390946099225", "text": "@NatPurser One reason my essays are so long is the number of hedges I put in an attempt not to be misinterpreted or held up as an example of some kind of problematic viewpoint. Here are some from this piece:\n\n- \"It's all nice and well to say that we should never let ourselves get in a position where anyone has all of these options, and that national governments should form a plan for what to do before this, but, much like a global pause, this is a great outcome which we might not be able to prepare in time.\"\n\n- \"Saying \"we should never let anyone get into this situation\" isn't a solution, it's a wish - it may not come true, and we shouldn't be pursuing plans that will fail catastrophically if it doesn't...\"\n\n- \"There is a certain Far Mode sense in which believing that Dario Amodei and Demis Hassabis are exactly as untrustworthy as Elon Musk and Xi Jinping helps reminds us of universal human fallibility. But do we want to bet the world on it being literally true?\"\n\nI was hoping all of this would clarify that I agree with you, that it would be great if nobody had unaccountable power, that the risk of AI companies having unaccountable power is very serious, etc. \n\nMy point isn't that I don't think this scenario is dangerous, or that I'm not considering how dangerous it is, or that I won't work to stop it. I'm just asking: if we don't get a solution to concentration-of-power risks in time, how gracefully does our plan fail? \n\nI would prefer a world where our Plan A is that we deal with this democratically, but if we fail to do that pre-emptively, the leading AI company hands over control of the technology to the public post facto anyway.\n\nI would disprefer a world where our Plan A is that we deal with this democratically, and if we fail to do that pre-emptively, the leading AI company tries to seize power for themselves.\n\nI think the cluster of beliefs that I'm calling SURA makes the second situation more likely at the expense of the first, which is a point against it.", "created_at": "2026-11-03T07:56:47+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "NatPurser", "reply_to_id": "2117445198229696986", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 60, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117433929255063704", "url": "https://x.com/slatestarcodex/status/2117433929255063704", "text": "@KevinSVanHorn @peterbhase Popular: https://t.co/vOVfsM1vFw (sorry to cite myself), https://t.co/1Z095taqNo\n\nAcademic: https://t.co/YOMqJmj2P9 , https://t.co/SrJ1HClXKg , but academia moves slowly and this doesn't reflect state of the art\n\nCommunity/industry: https://t.co/XlvgK6BpyX , https://t.co/8Nsmt0xGze", "created_at": "2026-11-03T01:49:23+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "KevinSVanHorn", "reply_to_id": "2117372892472295740", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/vOVfsM1vFw": "https://www.astralcodexten.com/p/the-ai-superforecasters-are-here", "https://t.co/1Z095taqNo": "https://www.economist.com/science-and-technology/2026/09/16/artificial-intelligence-now-beats-some-of-the-best-human-forecasters", "https://t.co/YOMqJmj2P9": "https://arxiv.org/abs/2511.07678", "https://t.co/SrJ1HClXKg": "https://liner.com/review/forecastbench-a-dynamic-benchmark-of-ai-forecasting-capabilities", "https://t.co/XlvgK6BpyX": "https://www.metaculus.com/notebooks/43363/ai-forecasting-in-2026/", "https://t.co/8Nsmt0xGze": "https://futuresearch.ai/writings/"}, "enriched": 1}, {"id": "2117432575451156978", "url": "https://x.com/slatestarcodex/status/2117432575451156978", "text": "@AndrewSabisky @peterbhase Based on the superforecaster estimates that the OP is talking about, it would be ~10% slower.", "created_at": "2026-11-03T01:44:00+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "reply_to_id": "2117308128824053815", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117432310937366545", "url": "https://x.com/slatestarcodex/status/2117432310937366545", "text": "@Someguy2221111 @jachiam0 I'm still not sure how this disagrees with anything I'm saying. The technology here can't change anything about human wiring, it can just select the least-genetically-likely-to-get-depression of N embryos. As they mention, even if this technology were used on everyone in the world in a best case scenario, it would still only decrease depression 40%.", "created_at": "2026-11-03T01:42:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117407562442129708", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117405664507244971", "url": "https://x.com/slatestarcodex/status/2117405664507244971", "text": "@Someguy2221111 @jachiam0 Can you explain what you mean? Like most conditions, depression is caused by some combination of nature and nurture - people in the 50th percentile of genetic risk can still get it, but people in the 99th percentile are much more likely to.", "created_at": "2026-11-02T23:57:04+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117401214799491150", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117718235709833296", "url": "https://x.com/slatestarcodex/status/2117718235709833296", "text": "@_left_tail_chud @jachiam0 Like I said above, try the meds that ruin your sex drive and make you slightly tired all the time.", "created_at": "2026-11-03T20:39:07+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117479578788872243", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117479578788872243", "author_handle": "_left_tail_chud", "author_name": "Left Tail Chud", "text": "@slatestarcodex @jachiam0 mr slatestar how do i stop ruminating ocd style", "links": {}, "media": [], "url": "https://x.com/_left_tail_chud/status/2117479578788872243", "created_at": "Tue Nov 03 04:50:47 +0000 2026"}}, {"id": "2117716722346291466", "url": "https://x.com/slatestarcodex/status/2117716722346291466", "text": "@GroundhogStrat I can't tell for sure what you're saying here, but I support the movement to pause AI and am grateful for its work.", "created_at": "2026-11-03T20:33:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "GroundhogStrat", "reply_to_id": "2117708973193482401", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117708973193482401", "author_handle": "GroundhogStrat", "author_name": "Alvaro ⏸️ Cuba", "text": "Interesting that @slatestarcodex invented a new acronym SURA and argued against it (Stop Unilaterally and Raise Awareness). Rather than arguing against \"pause.\" Maybe because PauseAI has always advocated for an international treaty to pause AI development. First they fight you, then they strawman you, then we win.", "links": {}, "media": [], "url": "https://x.com/GroundhogStrat/status/2117708973193482401", "created_at": "Tue Nov 03 20:02:18 +0000 2026"}}, {"id": "2117728426320855411", "url": "https://x.com/slatestarcodex/status/2117728426320855411", "text": "@_left_tail_chud @jachiam0 \"Brain Lock\" is a good self-therapy book.", "created_at": "2026-11-03T21:19:36+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117721976500560287", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2117721976500560287", "author_handle": "_left_tail_chud", "author_name": "Left Tail Chud", "text": "@slatestarcodex @jachiam0 already on it. Would like to titrate down though", "links": {}, "media": [], "url": "https://x.com/_left_tail_chud/status/2117721976500560287", "created_at": "Tue Nov 03 20:53:59 +0000 2026"}}, {"id": "2118092482940735963", "url": "https://x.com/slatestarcodex/status/2118092482940735963", "text": "@MahoganyIntel @zagrebbi The post is from 2019.", "created_at": "2026-11-04T21:26:14+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "MahoganyIntel", "reply_to_id": "2118030558941077813", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118567478246990113", "url": "https://x.com/slatestarcodex/status/2118567478246990113", "text": "@StefanFSchubert Do you understand why Opus 5.5 seems above trend on this graph but not on https://t.co/9EkjM9urZ6 ?", "created_at": "2026-11-06T04:53:42+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "StefanFSchubert", "reply_to_id": "2118457872736452809", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/9EkjM9urZ6": "https://epoch.ai/eci?view=graph&tab=release-date"}, "enriched": 3, "parent": {"id": "2118457872736452809", "author_handle": "StefanFSchubert", "author_name": "Stefan Schubert", "text": "I think there’s quite a lot of hedge drift in the debate about AI progress. Official reports include various caveats (e.g. that these numbers concern well-specified tasks) and major uncertainties but they quickly drift away in the discourse.", "links": {}, "media": [], "url": "https://x.com/StefanFSchubert/status/2118457872736452809", "created_at": "Thu Nov 05 21:38:10 +0000 2026"}}, {"id": "2118767987704643897", "url": "https://x.com/slatestarcodex/status/2118767987704643897", "text": "@Bayesian0_0 @StefanFSchubert Does this imply that RSI started in October 2025, and that the trend hasn't accelerated since then?", "created_at": "2026-11-06T18:10:27+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Bayesian0_0", "reply_to_id": "2118577409037672729", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118577409037672729", "author_handle": "Bayesian0_0", "author_name": "Bayesian", "text": "@slatestarcodex @StefanFSchubert https://t.co/6o7wdbSl4A", "links": {"https://t.co/6o7wdbSl4A": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWayv2AXYAAKIhm.jpg"}], "url": "https://x.com/Bayesian0_0/status/2118577409037672729", "created_at": "Fri Nov 06 05:33:10 +0000 2026"}}, {"id": "2118766258275713098", "url": "https://x.com/slatestarcodex/status/2118766258275713098", "text": "@ruben_bloom Separate from the object-level issue, I think this is sort of illiberal, or at least insufficiently respectful to some part of the spirit of liberalism.\n\nMany groups who tried to change the world have started out being hated. Vegans, abolitionists, LGBT activists. Are all of these groups \"paternal, unilateral, unasked for saving of the world\"?\n\nIn fact, I weakly predict your own organization would fail this test (if I were allowed to tell our hypothetical voters the three most controversial conferences you've ever hosted, and you got equal time to defend yourself). If the average person were allowed to shut down either Anthropic or you, I think they'd vote to keep Anthropic and ditch you guys.\n\n(although I think that both you and Anthropic would do better than lots of other things, like polyamory, data centers, and building apartments in San Francisco)\n\nThe liberal answer to all of this is that people are default allowed to do things until the population bans them - not just by disapproving of them, but by actually banning them, using the law. Until then, the haters are allowed to tell all of these groups that a majority of people disapprove of them, but if these groups have a  spine they should ignore the haters and choose to keep existing anyway. Certainly this is what we rationalists did from 2010 - ~2020, when everyone hated us because we were \"distracting from near term harms\" or whatever, and we were right to do so.", "created_at": "2026-11-06T18:03:35+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ruben_bloom", "reply_to_id": "2118597440882585927", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 88, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118597440882585927", "author_handle": "ruben_bloom", "author_name": "Ruben Bloom (Ruby)", "text": "I would guess that if a vote were taken today amongst the people of earth about whether Anthropic should race for RSI, people would overwhelmingly say no. \n\nI expect this result to hold under different hypothetical degrees of briefing/education (we can imagine that both Eliezer and Dario get to spend 5 hours with each person).\n\nWhich means Anthropic's choice to race is thoroughly against the will of the people. A paternalistic, unilateral, unasked for saving of the world. \n\nI'm curious if Anthropic staff disagree that this would be the result of such a vote.", "links": {}, "media": [], "url": "https://x.com/ruben_bloom/status/2118597440882585927", "created_at": "Fri Nov 06 06:52:46 +0000 2026"}}, {"id": "2119810989646647612", "url": "https://x.com/slatestarcodex/status/2119810989646647612", "text": "@SashaGusevPosts @quetzal_rainbow @RYChappell See  https://t.co/TgJYxoxYvY", "created_at": "2026-11-09T15:14:58+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SashaGusevPosts", "reply_to_id": "2119463606932918559", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/TgJYxoxYvY": "https://slatestarcodex.com/2013/05/02/if-its-worth-doing-its-worth-doing-with-made-up-statistics/"}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "parent": {"id": "2119463606932918559", "author_handle": "SashaGusevPosts", "author_name": "Sasha Gusev", "text": "@quetzal_rainbow @RYChappell I don't think so. Dario just pulled out a 2-3x multiplier for adult experience from thin air and EAs have spent the past week defending his rigor and transparency.", "links": {}, "media": [], "url": "https://x.com/SashaGusevPosts/status/2119463606932918559", "created_at": "Sun Nov 08 16:14:36 +0000 2026"}, "enriched": 3}, {"id": "2119810663182930414", "url": "https://x.com/slatestarcodex/status/2119810663182930414", "text": "@PlatosTrojanH @itaisher Your claim suggests that saving an egg cell is just as important as saving an adult, since the egg cell is capable of \"becoming\" an adult.", "created_at": "2026-11-09T15:13:40+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "PlatosTrojanH", "reply_to_id": "2119491057528557754", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "parent": {"id": "2119491057528557754", "author_handle": "PlatosTrojanH", "author_name": "Plato's Trojan Horse", "text": "@itaisher Unless the bullshit number makes you arrive at the wrong conclusions. If your intuition is more correct than the bullshit number, then the bullshit number is worse.\n\nIt looks like he said saving adults is better because an adult is more capable of a rich experience. But the children become adults, so the children are also capable of a rich experience. Additionally the adults may very likely be people who do not have rich experience. The people with TB may be people who are disproportionately likely not to have rich experience. \n\nIf the natural intuition is to save the children and that is correct based on more accurate \"numbers\" (much of this analysis is qualitative and not quantitative), then the intuition was a better guide.", "links": {}, "media": [], "url": "https://x.com/PlatosTrojanH/status/2119491057528557754", "created_at": "Sun Nov 08 18:03:41 +0000 2026"}, "enriched": 3}, {"id": "2119810306050535756", "url": "https://x.com/slatestarcodex/status/2119810306050535756", "text": "@Dr_Atoosa @itaisher I'll defend this - see https://t.co/f5DUSP8YYl\n\nIt's usually better to try quantifying things and then do sensitivity analyses with your estimates than to refuse to try to think clearly at all, which will usually result in laundering your biases, stereotypes, and fears that other people will judge you if you get \"the wrong\" answer.\n\nA good example of this is scope insensitivity (see https://t.co/D2HuL7bdvQ)  where people who avoid using numbers will place values on things which fail common-sense rules (for example, they'll say that helping 1,000 birds has exactly the same value as saving 10,000 birds). Any attempt to quantify anything at any point in the estimation process could prevent that failure mode. There are dozens of other things like this, and you can check for all of them by the basic mental hygiene of quantifying your intuitions and then running them through some sanity checks.", "created_at": "2026-11-09T15:12:15+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Dr_Atoosa", "reply_to_id": "2119739718531166462", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 102, "retweets": 2, "media": [], "links": {"https://t.co/f5DUSP8YYl": "https://slatestarcodex.com/2013/05/02/if-its-worth-doing-its-worth-doing-with-made-up-statistics/", "https://t.co/D2HuL7bdvQ": "https://en.wikipedia.org/wiki/Scope_neglect"}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "parent": {"id": "2119739718531166462", "author_handle": "Dr_Atoosa", "author_name": "Atoosa Kasirzadeh", "text": "Thanks for saying this out loud, @itaisher ! In many circles (including, though certainly not limited to, EAs), people are conditioned to treat \"empirical numbers\" as an inherent, objective good. This come from an obsession with metrics (showing numbers is better than no numbers when making a point), independent of whether they are well or poorly generated. What follows from these shaky numerical assertions is a massive waste of time and energy spent justifying or debunking them, pulling many down an unproductive rabbit hole. I'm still not sure how best to counter this often dangerous bias.", "links": {}, "media": [], "url": "https://x.com/Dr_Atoosa/status/2119739718531166462", "created_at": "Mon Nov 09 10:31:46 +0000 2026"}, "enriched": 3}, {"id": "2117649615159980369", "url": "https://x.com/s8mb/status/2117649615159980369", "text": "@SCP_Hughes I completely agree with him here. I love Manhattan but the endless chasms that many of the streets have are weirdly desolate compared to the more enclosed parts of Lower Manhattan. https://t.co/6sHnGrIIgO", "created_at": "2026-11-03T16:06:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "reply_to_id": "2117627793928274067", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNmpBxW4AA6S4U.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/6sHnGrIIgO": ""}, "enriched": 3, "parent": {"id": "2117627793928274067", "author_handle": "SCP_Hughes", "author_name": "Samuel Hughes", "text": "How can we make lovable cities? If you had asked a European architect this question in 1900, they would probably have referred you to a slender, lively book by the Austrian writer Camillo Sitte, translated as ‘The Art of Building Cities’. Published in 1889, ‘The Art of Building Cities’ swiftly came to be revered around the world.\n\nhttps://t.co/qwVmTrPTGV\n\nSitte was repudiated by the modernists and fell into obscurity, but his ideas are beginning to be revived. My cousin @PMArslanagic and I have distilled nineteenth century's finest work on urbanism into five principles:\n\n- Create enclosed spaces\n- Keep squares small\n- Symmetry is overrated\n- Move monuments to the edges of spaces\n- Nestle monuments in vernacular fabric", "links": {"https://t.co/qwVmTrPTGV": "https://worksinprogress.co/issue/the-forgotten-formula-for-lovable-cities/?v2"}, "media": [], "url": "https://x.com/SCP_Hughes/status/2117627793928274067", "created_at": "Tue Nov 03 14:39:44 +0000 2026"}}, {"id": "2117518864804135362", "url": "https://x.com/s8mb/status/2117518864804135362", "text": "What’s playing out in the rental market was completely predictable. What I said would happen a year ago below is now going on; the only thing left is for these measures to catch on across the whole market. Rent controls are back - @mtpennycook deserves a lot of the credit! https://t.co/Trsl1bLMIl", "created_at": "2026-11-03T07:26:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 245, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLwLzDXwAAh9lY.jpg"}], "quoted": {"author": "s8mb", "text": "The government's Renters' Rights Bill looks like it will be a catastrophe, inadvertently introducing rent controls and reducing the supply of housing even more. It is the clearest evidence that the whole British state that has brought it about is completely broken: \n\n• Written by the civil service\n• Introduced by the Tories\n• Passed by Labour and the Lib Dems\n• Cheered on by the mainstream media\n\nThe bill's core provision is to eliminate \"no-fault evictions\". Many understand this to mean evictions during a rental lease. In fact, this is already impossible. What the new bill does is to stop landlords from being able to regain their property after a lease has expired. \n\nThis means that renting a property to someone now means that they get to live in that property indefinitely. A landlord can only evict them if they are selling the property, or plan to move into it themselves, or if a tribunal gives them permission after ruling against the tenant for bad behaviour.\n\nWithin these indefinite contracts, rent increases will be capped at whatever the 'market rate' is determined to be by a tribunal. Tribunals will not be able to *raise* rents, as they currently can and often do – only lower them or keep them where they are. The only risk to a tenant is that their challenge is deemed \"vexatious\".\n\nNot only will rent increases *within* contracts be controlled by courts, rents for *new* contracts will also be controlled by them. Tenants will be entitled to agree a rent, move in, and then immediately take their landlord to a rent tribunal on the grounds that the rent they have just agreed to is \"too high\".\n\nRent tribunals will thus have the power to control all rents. All rents will be set under the threat of a tribunal intervening. There will be no \"market rate\", so the tribunal will have no independent \"market rate\" to refer to.\n\nA tenant who challenges a rent increase will have their rent frozen at the old, lower rate while their challenge is ongoing (which could take over a year). Like the Building Safety Regulator right now, tribunals are likely to be extremely backlogged, creating huge delays where tenants do not have to pay their new higher rents, if they ever do. Tenants will have huge incentives to challenge nearly all rent increases. \n\nWe have already seen how bad courts are at ruling on prices, eg in cases where Next's shop workers have been given the same pay as factory floor workers, and in Birmingham where the council was forced to pay £760m to care workers and teaching assistants because a court decided that these roles were equivalent to jobs like rubbish collectors.\n\nAll this amounts to rent controls. These are terrible for many reasons.\n\n1. They will cause landlords to sell up and leave the market. This is both to avoid the risk of being stuck with a bad tenant, and because once the rent has been kept artificially low by a rent tribunal, landlords will be losing money compared to just selling into private owner-occupation.\n\nRental properties allow for easy doubling up (housesharing) which is much messier under owner-occupation. The effective supply of housing is about to drop. In Ireland, postwar rent controls shrunk the rental market from 26% to 8% of the total housing stock in 40 years. In Britain, 1916–88, the share of properties available for rent went from 75% of the market to 10%.\n\n2. They cause landlords to neglect their properties. Landlords receiving artificially-depressed rents for their properties have no incentive to maintain them. Rent controlled properties, famously, become neglected and fall into decay, as leaks, cracked plaster and broken windows are left unaddressed. The country's housing stock that remains in renting will decay. Our cities will become more decrepit.\n\n3. They stop people from moving around for better jobs. We already have this effect with social housing, where huge amounts of inner London housing (30–40%!) are held by tenants in low wage jobs, or who have no job at all, instead of by people who could move to London to earn and produce more. This will happen to large swathes of the rental market too, stopping people from moving into prosperous cities where they could get better jobs.\n\n4. They stop the supply of new homes for rent. Under rent controls, there is no incentive to build new homes for renting. Britain built essentially no private flats for rent between 1945 and the end of rent controls in 1988. The same was true in France between WWI when it introduced rent controls and the slow end of rent controls in the postwar era.\n\n5. They push renters into the black market. To actually get a place to live, a lot of people will sidestep these new rules and rent informally, with none of the protections we currently have for renters like the deposit protection scheme. This is the sort of scenario that allows landlords to *really* exploit and steal from their tenants.\n\n–\n\nDo not assume that anyone involved with this knows what they're doing. We have already seen, in the case of the Building Safety Regulator and the second staircase regulations (brought in by the same Housing Secretary who designed this bill), how disastrous the consequences of well-intended but misconceived interventions in the housing market can be.\n\nLondon building has already ground to a halt. And things are about to get even worse.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/Trsl1bLMIl": ""}, "enriched": 1}, {"id": "2117516901609779606", "url": "https://x.com/s8mb/status/2117516901609779606", "text": "Tenants used to be able to challenge rent rises. If they succeeded, the landlords could evict them. This obviously meant that the rulings weren’t binding and couldn’t set rents below the market rate. \n\nNow you can’t evict the tenant, no matter how low the tribunal sets the rent. And tribunals can reduce the rents agreed to at the start of the tenancy, not just rent increases at the end of a fixed term. \n\nThis is *obviously* rent control by anyone’s definition of the term. This is what they wanted to happen!", "created_at": "2026-11-03T07:19:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 818, "retweets": 71, "media": [], "quoted": {"author": "mtpennycook", "text": "I see the nonsense “rent controls are back” takes keep coming.\n\nThere is no rent control in England.\n\nThe legal right to challenge rent increases at tribunal was introduced by the Thatcher Government in its 1988 Housing Act.\n\nIt was rarely used in practice only because it inevitably resulted in a landlord serving a Section 21 notice.\n\nLabour’s Renters’ Rights Act abolished Section 21 ‘no fault’ evictions and renters are now rightly empowered to challenge unfair or above-market rent increases.\n\nIn both the recent cases that have been the cause of so much debate, the tribunal has been operating exactly as it should – determining that the landlords in question were charging rents that simply did not reflect local market values for comparable properties.", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117510302761930844", "url": "https://x.com/s8mb/status/2117510302761930844", "text": "@rosegrayston You used to be able to evict a tenant who challenged their rent and had it reduced, which meant the rulings didn’t bind, and now you can’t, so the rulings do bind. Why obfuscate here? This is the policy you wanted!", "created_at": "2026-11-03T06:52:52+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "rosegrayston", "reply_to_id": "2117305510697238549", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 186, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2118038398556393641", "url": "https://x.com/s8mb/status/2118038398556393641", "text": "Thrilled that Works in Progress is in Lenny's annual gift guide. The whole guide is great – I just got a Canary knife and have enjoyed cutting all my Amazon boxes with it. I hope people who discover WIP through it like it just as much!\n\n(\"Some people call it the new Economist\"!) https://t.co/BotbICPJOw", "created_at": "2026-11-04T17:51:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 47, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWTH_8xXoAAtLVU.jpg"}], "quoted": {"author": "lennysan", "text": "The holidays are fast approaching, so I’m back with my sixth (!!) annual gift guide. \n\nIt's got over 100 gift ideas—all things I actually use, love, and recommend.\n\nThis started out as a random post idea, but now you’d be surprised how many people ping me asking when the new list will be out.\n\nAs always, the collection includes a mix of practical stuff with a lot of fun and delight, from high-end products to very affordable items. There are no affiliate links here, and I’m not benefiting from recommending any of these products.\n\nPro tip: After reading it, point your favorite AI agent 26"}]}, {"id": "2117928926093746334", "url": "https://x.com/s8mb/status/2117928926093746334", "text": "How can we make lovable cities? If you had asked a European architect this question in 1900, they would probably have referred you to a slender, lively book by the Austrian writer Camillo Sitte, translated as ‘The Art of Building Cities’. Published in 1889, ‘The Art of Building Cities’ swiftly came to be revered around the world.\n\nhttps://t.co/qwVmTrPTGV\n\nSitte was repudiated by the modernists and fell into obscurity, but his ideas are beginning to be revived. My cousin @PMArslanagic and I have distilled nineteenth century's finest work on urbanism into five principles:\n\n- Create enclosed spaces\n- Keep squares small\n- Symmetry is overrated\n- Move monuments to the edges of spaces\n- Nestle monuments in vernacular fabric", "created_at": "2026-11-04T10:36:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "rt_avatar": "https://pbs.twimg.com/profile_images/1881805141059211264/D22ZUEJF_normal.jpg", "rt_id": "2117627793928274067", "likes": 634, "retweets": 131, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/qwVmTrPTGV": "https://worksinprogress.co/issue/the-forgotten-formula-for-lovable-cities/?v2"}, "enriched": 3}, {"id": "2117899168966729881", "url": "https://x.com/s8mb/status/2117899168966729881", "text": "Absolutely brilliant set of tweets from @SCP_Hughes on how to make a brilliant city, architecturally. Read it and you will learn something.", "created_at": "2026-11-04T08:38:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 129, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWO4FbXW8AENJb0.jpg"}], "quoted": {"author": "SCP_Hughes", "text": "How can we make lovable cities? If you had asked a European architect this question in 1900, they would probably have referred you to a slender, lively book by the Austrian writer Camillo Sitte, translated as ‘The Art of Building Cities’. Published in 1889, ‘The Art of Building Cities’ swiftly came to be revered around the world.\n\nhttps://t.co/qwVmTrPTGV\n\nSitte was repudiated by the modernists and fell into obscurity, but his ideas are beginning to be revived. My cousin @PMArslanagic and I have distilled nineteenth century's finest work on urbanism into five principles:\n\n- Create enclosed spaces\n- Keep squares small\n- Symmetry is overrated\n- Move monuments to the edges of spaces\n- Nestle monuments in vernacular fabric", "links": {"https://t.co/qwVmTrPTGV": "https://worksinprogress.co/issue/the-forgotten-formula-for-lovable-cities/?v2"}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/OnsBn8atx8": ""}, "enriched": 3}, {"id": "2118073704458682571", "url": "https://x.com/s8mb/status/2118073704458682571", "text": "From today, Works in Progress is now in stock at Barnes & Nobles nationwide across America. \n\nWe're in 570 stores in 49 states*, including the flagship stores at Union Square & Fifth Avenue in NYC; Georgetown, DC; State Street, Chicago; and The Grove, Los Angeles. \n\nWe're also now in Hudson News outlets across most major US airports, and the B&Ns at San Francisco Airport.\n\nIf you tweet (or LinkedIn/Insta post) a photo of a copy of Works in Progress outside any of these stores, share the post with me or @WorksInProgMag via DM and we'll send you a free tote bag as a thank you. If you're a subscriber already, feel free to do it with own copy!\n\nYou can see a full map of Barnes & Noble stockists here, and enter your Zip code to find your nearest store.\n\n*Sorry, Wyoming, we'll get to you!\n\nhttps://t.co/a22LtQP2HW", "created_at": "2026-11-04T20:11:37+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "s8mb", "rt_author_name": "Sam Bowman", "rt_avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "rt_id": "2118006659100385451", "likes": 501, "retweets": 56, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {"https://t.co/a22LtQP2HW": "https://worksinprogress.co/barnes-noble-launch/"}, "enriched": 3, "thread": [{"id": "2118009416687702185", "author_handle": "s8mb", "author_name": "Sam Bowman", "text": "We're also in stock at independent newsagents in London, New York, Paris, Berlin and Los Angeles. We'll appear in magCulture in Clerkenwell tomorrow and we're already up and running on one of London's loveliest streets, Chiltern St. https://t.co/I52GkErXfq", "links": {"https://t.co/I52GkErXfq": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWSs8anWQAAxn59.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWSs-EjW8AAb-na.jpg"}], "url": "https://x.com/s8mb/status/2118009416687702185", "created_at": "Wed Nov 04 15:56:10 +0000 2026"}]}, {"id": "2118052772297728431", "url": "https://x.com/s8mb/status/2118052772297728431", "text": "@krispuckett Thank you 🙏", "created_at": "2026-11-04T18:48:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "krispuckett", "reply_to_id": "2118014001049383182", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-  0, "retweets": 0, "media": [], "quoted": {"author": "hcndashwood", "text": "Do you ever look at Rotherhithe and Canary Wharf and think that's not a very dense area, considering all the high-paying jobs just across the river?\n\nIf so, may I interest YOU in a PROPOSAL? https://t.co/s7RefhBdry", "links": {"https://t.co/s7RefhBdry": ""}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3}, {"id": "2118453190786220292", "url": "https://x.com/s8mb/status/2118453190786220292", "text": "@WorksInProgMag on the west coast! https://t.co/l8XyTAnzXQ", "created_at": "2026-11-05T21:19:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "mgscotttt", "rt_author_name": "mg scott", "rt_avatar": "https://pbs.twimg.com/profile_images/2028599332820365312/O6RT82b3_normal.jpg", "rt_id": "2118406484170326376", "likes": 32, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWYXd_kb0AABvXy.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWYXd_ZawAAAvgd.jpg"}], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {"https://t.co/l8XyTAnzXQ": ""}, "enriched": 3}, {"id": "2118440171695993237", "url": "https://x.com/s8mb/status/2118440171695993237", "text": "@davidrconway @Birdyword @bswud That’ll be for our next milestone.", "created_at": "2026-11-05T20:27:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "davidrconway", "reply_to_id": "2118434879025152406", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118434879025152406", "author_handle": "davidrconway", "author_name": "David Conway", "text": "@s8mb @Birdyword @bswud wip smoking jackets might fit better...", "links": {}, "media": [], "url": "https://x.com/davidrconway/status/2118434879025152406", "created_at": "Thu Nov 05 20:06:48 +0000 2026"}}, {"id": "2118677694313542067", "url": "https://x.com/s8mb/status/2118677694313542067", "text": "If @mtpennycook’s job was to get as few homes built as possible, would he be doing anything differently?", "created_at": "2026-11-06T12:11:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 58, "retweets": 5, "media": [], "quoted": {"author": "James_Gradel", "text": "The Government is going to miss the 1.5 million homes target.\n\nHomes are now getting built slower than under the previous three Governments.\n\nWe need a new wave of planning reform to get back on track. https://t.co/PY7ulwuwH0", "links": {"https://t.co/PY7ulwuwH0": ""}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118615275121578249", "url": "https://x.com/s8mb/status/2118615275121578249", "text": "@SevaUT Recent essay on this by @SCP_Hughes https://t.co/XQT3lLtdaz", "created_at": "2026-11-06T08:03:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "olivertraldi", "rt_author_name": "Oliver Traldi", "rt_avatar": "https://pbs.twimg.com/profile_images/1982864645758091264/tLdbdemO_normal.jpg", "rt_id": "2118149479648178664", "likes": 5422, "retweets": 181, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.5949
