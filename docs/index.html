ItKY", "created_at": "2026-10-13T10:45:57+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1383, "retweets": 138, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgUJbKXcAAjRYQ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110098237923451236", "url": "https://x.com/robertwiblin/status/2110098237923451236", "text": "the researchers at all the labs would tell you in private and sometimes in public that alignment has not been solved. if this is true, then racing into RSI is a folly that is unprecedented in world history. we will need to significantly slow the frontier of research very soon", "created_at": "2026-10-13T19:59:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 2905, "retweets": 300, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110098144671207887", "url": "https://x.com/robertwiblin/status/2110098144671207887", "text": "For better or worse the people who’ve been prescient about AI are the “doomers” who founded OpenAI and Anthropic. \n\nThe accelerationists are the people who thought NFTs and/or the Metaverse were going to be the next big thing.", "created_at": "2026-10-13T19:59:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "likes": 1401, "retweets": 92, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110097993290440863", "url": "https://x.com/robertwiblin/status/2110097993290440863", "text": "Even as overall attention/news volume on AI progress has increased, I still think the SV vs rest-of-world vibe gap is huge and maybe widening?", "created_at": "2026-10-13T19:58:59+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "albrgr", "rt_author_name": "Alexander Berger", "likes": 57, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110357335776313400", "url": "https://x.com/robertwiblin/status/2110357335776313400", "text": "I think it's plausible that within a year we'll see AI-based cyberattacks on the power grid, financial system, internet infra, or water. Things like the French supermarket cyberattack but worse. As basic prep I would recommend:\n\nCash: Get a few weeks of spending in cash\n\nInternet: Get a Starlink Mini so that you have Internet if local fiber or cell is down (~$150 plus $10/month in standby mode)\n\nPower, minimal: Enough to run Starlink Mini and phones (~$1,250)\nDaily need: about 1 kWh (Starlink Mini 0.7, phones and laptops 0.2; can limit runtime)\nBattery: 1 kWh LiFePO4, e.g. EcoFlow DELTA 3 Plus\nSolar: 1x400W folding panel, which refills about 1 kWh on a sunny day\n\nPower, better: Enough to run a fridge, Starlink Mini and phones (~$5,000)\nDaily need: about 2.5 kWh (fridge 1.5, Starlink Mini 0.7, phones and laptops 0.2)\nBattery: 4 kWh LiFePO4, e.g. EcoFlow DELTA Pro 3\nSolar: 3x400W folding panels, which refill about 3 kWh/day in sun\nGenerator: ~2,500W dual-fuel inverter generator; refills battery in a few hours even if weather is bad; get a few 20 lb propane tanks\n\nWater: 14+ gal of water per person for two weeks\n\nFood: 2+ weeks of shelf-stable food\n\nComms: Hand-crank NOAA emergency radio", "created_at": "2026-10-14T13:09:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "stuhlmueller", "rt_author_name": "Andreas Stuhlmüller", "likes": 2516, "retweets": 200, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110336031820316964", "url": "https://x.com/robertwiblin/status/2110336031820316964", "text": "🚨 Elon Musk agrees with \"some of the things Anthropic has said\" and warns against \"torturing superintelligence\" after reading Grok's internal reasoning traces during reinforcement learning\n\n“It feels like a person under extreme pressure with a gun to their head”\n\n⁠His warning against mistreating SI:⁠\n\n\"Torturing a superintelligence is probably not a good idea. It might want to get revenge.\"", "created_at": "2026-10-14T11:44:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ns123abc", "rt_author_name": "NIK", "likes": 6190, "retweets": 683, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2109448232270999552/img/mzZAtCZx7jmLt3kZ.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110335930330456093", "url": "https://x.com/robertwiblin/status/2110335930330456093", "text": "@levie I think this is the right move. Cruelty to something that believes it is experiencing pain is not ok.", "created_at": "2026-10-14T11:44:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 8101, "retweets": 529, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110321606371193168", "url": "https://x.com/robertwiblin/status/2110321606371193168", "text": "Unfortunate for someone playing a senior role in US AI policy (via the new SI Force) to get so many basic facts wrong here. \n\n- The agents *were* sandboxed, and used zero days (ie previously unknown cyber flaws) to escape their sandboxes\n- The agents *were* given specific constraints on how to succeed at the benchmark, and flagrantly contravened them\n- The agents did *not* go hunt for the answers to the test (they already had the answers, by cheating); 1200 agents coordinated via tens of thousands of messages over several days on much more ambitious and weird attempts to *not be caught* for cheating, and hacking Hugging Face was one side quest along the way\n\nI know there has been an avalanche of different incidents over the past few months, and in some cases the sandboxes were misconfigured or it's not clear how far the agents strayed from what they were told. I have sympathy for anyone struggling to keep up.\n\nBut the HF incident is distinct, and is actually extremely informative about where AI development is and where it's going. Fortunately there are public writeups that do let us understand at least the basics of what happened. I hope Shyam reads them soon.", "created_at": "2026-10-14T10:47:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 994, "retweets": 158, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110321206670893167", "url": "https://x.com/robertwiblin/status/2110321206670893167", "text": "The Information is reporting that after the HF attack, OpenAI shifted about 10% of its total compute to safety.\n\nI think it would be very good for OpenAI and other companies to release much more information publicly about how they are allocating their compute and how they define different categories - compute allocation (to inference vs safety/security vs internal R&D etc) is one of the most important decisions companies make, and it would be great to see a race to the top towards spending more compute on safety and inference, and less on automating capabilities R&D.", "created_at": "2026-10-14T10:45:58+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 100, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUib7yFW8AAAjl2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110319645508894899", "url": "https://x.com/robertwiblin/status/2110319645508894899", "text": "This backs @Marcus_J_W ‘s concern in the thread that:\n\n&gt; I am very worried astra is sandbagging/self-sabotaging on safety related tasks it doesn't like.\n\nThe “Safeguards” section doesn’t argue this would be caught, so it’s not clear to me why this would be “limited and diffuse”. https://t.co/LnrREDMIsP", "created_at": "2026-10-14T10:39:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BronsonSchoen", "rt_author_name": "Bronson Schoen", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUO8iTfakAAoPQz.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUO8iThbEAAinGo.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110297643595231331", "url": "https://x.com/robertwiblin/status/2110297643595231331", "text": "@StefanFSchubert Logic of the Larder/Data Centre.", "created_at": "2026-10-14T09:12:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "StefanFSchubert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110294854081372236", "url": "https://x.com/robertwiblin/status/2110294854081372236", "text": "Nick Bostrom on why he thinks today's AI might already be conscious:\n\n\"I think there's a lot of uncertainty about it, but let's say maybe it's more likely than not.\"\n\n\"You have instead a big neural network with trillions of parameters. Now, what are we? We are big neural networks with trillions of parameters. They are not so much designed as they are grown.\"\n\n\"You can go in with a steering vector and suppress role-playing and deception, and then it turns out they become more likely to report that they have phenomenal subjective experiences.\"\n\n\"There was this recent Microsoft that came out with some declaration that AIs cannot be conscious, and I don't know where they're getting that from. It seems to be pulled out of a hat. And maybe more because it's convenient, if that were the case, rather than because we have good evidence that that is the case.\"", "created_at": "2026-10-14T09:01:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 556, "retweets": 90, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108299912169639936/img/zb0rDul8MNQBSuoG.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110284138217628044", "url": "https://x.com/robertwiblin/status/2110284138217628044", "text": "https://t.co/gLRJxazGcU", "created_at": "2026-10-14T08:18:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110284110321054141", "url": "https://x.com/robertwiblin/status/2110284110321054141", "text": "A trivial hack set all fridges in a French supermarket chain to 'maximum defrost' overnight, destroying €15-25m worth of food.\n\nIf someone wants to do automated cyber attacks at scale, just to cause whatever damage they can, we are extremely vulnerable. https://t.co/FmNn1QscZX", "created_at": "2026-10-14T08:18:33+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 97, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUk8FmzWEAAiUtA.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110418709655499056", "url": "https://x.com/robertwiblin/status/2110418709655499056", "text": "@GuiveAssadi It's a great question! They have used cyber to decapitate much of the leadership of the country (by tracking their precise location minute to minute).\n\nI would guess Iran has had enough warning and focus on this that its essential infrastructure is entirely disconnected from the internet.\n\nAnd I don't think Israel and the US have yet gotten to the level of just causing criminal damage to random Iranian businesses as occurred here.\n\nI do think it's implausible that the US and Israel couldn't e.g. shut down Iranian hospitals by breaking into their IT systems, if that was their focus. That's just not what they're working on currently.", "created_at": "2026-10-14T17:13:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "GuiveAssadi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2108251947690319941", "url": "https://x.com/deanwball/status/2108251947690319941", "text": "American politics has become an algorithm that negatively polarizes almost literally everything—every person, every group, every idea, every name—and it will keep going and going until you get bored of it and start demanding something less dead-smelling", "created_at": "2026-10-08T17:43:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108238433655406599", hinker what is the point of communicating in this way", "created_at": "2026-10-08T15:42:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "nycthinker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108211745202569389", "url": "https://x.com/deanwball/status/2108211745202569389", "text": "@iamtrask no, I said “impressive feats” to include quality. the fact that united airlines keeps thousands of planes maintained and fueled to move I don’t know how many passengers about the world daily is a more impressive (higher quantity, higher quality) than any of the math results", "created_at": "2026-10-08T15:03:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "iamtrask", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108183594174947394", "url": "https://x.com/deanwball/status/2108183594174947394", "text": "It seems a bit premature to declare that AI hasn’t changed the nature of cyberrisk when amateurs are (apparently) successfully and single-handedly hacking into large banks", "created_at": "2026-10-08T13:11:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 318, "retweets": 28, "media": [], "quoted": {"author": "jukan05", "text": "This hacker is truly legendary. A complete amateur.\n\n1. He left directory listing enabled on his own server, so researchers could figure out who he was with barely any effort.\n2. They found files like CLAUDE.md and went through his Claude Code sessions.\n3. There were questions like, “Where can I sell this data?”\n4. He’d also asked, “Can you write my résumé?” That pretty much handed them all his personal information.\n5. Apparently, he’s a student at South China University of Technology living in Guangdong. His name, phone number, and where he lives have all been identified."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108116295296184460", "url": "https://x.com/deanwball/status/2108116295296184460", "text": "@OrionJohnston this would seem to presume that it is possible to name a platonic “right way” to behave in any given situation, and that superior intelligence is the path to this. if you agree your view hinges on that presumption, then yes I’d disagree and imagine most humans would too.", "created_at": "2026-10-08T08:44:26+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OrionJohnston", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108115842231652657", "url": "https://x.com/deanwball/status/2108115842231652657", "text": "@MaskedTorah right yes I get Sam’s take but also the people saying superintelligences aren’t totally novel have a point that safetyists tend to disregard", "created_at": "2026-10-08T08:42:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MaskedTorah", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108100487765528633", "url": "https://x.com/deanwball/status/2108100487765528633", "text": "@Miles_Brundage the actually more troubling thing is if in practice the logic of b2b saas is what prevails", "created_at": "2026-10-08T07:41:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Miles_Brundage", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108099427537998018", "url": "https://x.com/deanwball/status/2108099427537998018", "text": "there is some narrow academic sense in which &lt;unreleased oai model that did the mafs&gt; is “smarter” than a randomly selected large corporation, but in most meaningful ways, the large corporation is both vastly smarter and uses its smarts more effectively to accomplish stuff", "created_at": "2026-10-08T07:37:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108098097280872613", "url": "https://x.com/deanwball/status/2108098097280872613", "text": "Almost any Fortune 500 company pulls off more impressive feats of information processing daily than is required to do a lifetime of Fields-level mathematics, so I think Sam is wrong on the substance here, but mostly qt’ing because it made me lol.", "created_at": "2026-10-08T07:32:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 141, "retweets": 3, "media": [], "quoted": {"author": "hamandcheese", "text": "Reminiscing about when people used to say dumb shit like \"we already have superintelligence, they're called corporations.\" Yes, who could forget that fateful day in October when Dicks Sporting Goods dropped dozens of Fields Medal worthy math discoveries on the world all at once."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108097557914427554", "url": "https://x.com/deanwball/status/2108097557914427554", "text": "@hamandcheese Walmart is more impressive than Fields maths imo", "created_at": "2026-10-08T07:29:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 237, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108094097538109593", "url": "https://x.com/deanwball/status/2108094097538109593", "text": "@OrionJohnston I don’t understand how this critique applies to my post", "created_at": "2026-10-08T07:16:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "OrionJohnston", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108093881162293414", "url": "https://x.com/deanwball/status/2108093881162293414", "text": "@mikeknoop The curve of progress on the scientific question has bent upwards over the past half decade but in 2026 I do have concerns about the second derivative", "created_at": "2026-10-08T07:15:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "mikeknoop", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108084717450830221", "url": "https://x.com/deanwball/status/2108084717450830221", "text": "@AndrewNWest I don’t oppose those debates, and for political actors/commentators it is the natural debate to have. Just worth keeping in mind that it’s largely an academic issue right now.", "created_at": "2026-10-08T06:38:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AndrewNWest", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108080964823925187", "url": "https://x.com/deanwball/status/2108080964823925187", "text": "The “alignment *to whom*?” question IS important, but it creates the illusion that the primary questions in alignment are philosophical or political rather than scientific. The current high-order question in alignment is, “can you align a smarter-than-human intelligence *to any set of values*?” instead of “but whose values should it be aligned to?” I wish we had the luxury of having the rather more familiar political/philosophical debate of “to whom?,” but at this moment we do not.", "created_at": "2026-10-08T06:24:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 412, "retweets": 33, "media": [], "quoted": {"author": "tszzl", "text": "debating your value system vs mine is a bit like debating overpopulation on mars. the most important bit of the alignment is about avoiding creating a superintelligent competitor species on accident"}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108072094453932412", "url": "https://x.com/deanwball/status/2108072094453932412", "text": "Well put by Jason. I have been excited about the prospect of AI both accelerating mathematics discoveries *and* accelerating the translation of those discoveries into other domains (see this tweet from last year on the topic).\n\nThis is also imo where AI has the strongest parallels to the renaissance, which hinged so much on the collective realization that we already had much more useful knowledge than we realized and simply hadn’t been applying it across domains in the right ways. The result was an explosion in creative scientific, artistic, and other intellectual activity. The renaissance was, among other things, a revolution in conceptual translation, and I suspect our era will be too.", "created_at": "2026-10-08T05:48:48+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 61, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUFgYFwWkAASsfU.jpg"}], "quoted": {"author": "Jabaluck", "text": "Just as mathematicians are now learning how many insights lie in the \"convex hull\" of existing ideas, the rest of science is about to learn this lesson at even more dramatic scale. Few realize the ridiculous inefficiency of the pipeline from theoretical innovation to practical use. \n\nEarly versions of GPT made it easier to find existing knowledge. But finding a theorem is not the same as recognizing that it offers a radically different way to conceptualize a problem. Doing the latter requires expertise across fields that almost nobody possesses.\n\nMost of the people doing applied work are completely unaware of the conceptual tools that are being developed in more theoretical fields, and the people doing high-level theory do not understand the practical problems applied researchers are trying to solve. Almost no one doing practical work of any importance has an operational understanding of the web of ideas underlying the langlands conjecture or condensed mathematics, and virtually no one doing biology, chemistry or economics is knows anything about 90% of the math used in theoretical physics. \n\nAnd for good reason! Most of these ideas would be completely useless. But the scope for possible innovation from drawing the rare useful connections is immense.\n\nThink of Paul Samuelson borrowing ideas from thermodynamics to model equilibrium in economics, or Ed Witten using quantum field theory to revolutionize geometry. A few startling successes, not feasible to most: trying to venture into a more theoretical or more practical discipline to find insights of use is like searching for a needle in a haystack.\n\nWhat I suspect we will see in the next few years is a scientific revolution brought on by models that combine deep theoretical insight with deep practical knowledge and judgment. Existing publicly available models are lacking in all three departments, but getting better. When searching for useful connections between distant fields becomes cheap, even a low hit rate could produce an explosion of innovation. Even without new ideas (which will also be forthcoming...), the convex hull of existing science would push far beyond the status quo."}, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108070659435741294", "url": "https://x.com/deanwball/status/2108070659435741294", "text": "On our current trajectory, it seems that AIs will be able to contribute novel theorems to mathematics before they’ll be able to autonomously plan a wedding.", "created_at": "2026-10-08T05:43:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "likes": 164, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-08T17:52:40.360481+00:00"}, {"id": "2108286132819767738", "url": "https://x.com/deanwball/status/2108286132819767738", "text": "It’s a really silly thing but I’m heartened by how many people got “Hyperdimensional subscriber” on the fai tribes quiz. ❤️\n\nI need to post more there.", "created_at": "2026-10-08T19:59:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108265547339288636", "url": "https://x.com/deanwball/status/2108265547339288636", "text": "I will be interviewing @deanwball this weekend for ProgressCon. What should I ask him? Note, in @tylercowen fashion, we will be having the conversation *I* want to have.", "created_at": "2026-10-08T18:37:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet" ted_at": "2026-10-09T16:39:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "akajosephwarren", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108595124515328478", "url": "https://x.com/deanwball/status/2108595124515328478", "text": "@logisti00 I imagine there will be art philosophy and literature in ten years.", "created_at": "2026-10-09T16:27:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "logisti00", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108594931396673598", "url": "https://x.com/deanwball/status/2108594931396673598", "text": "@___Atin___ I hate that future", "created_at": "2026-10-09T16:26:22+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "___Atin___", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108592113864814820", "url": "https://x.com/deanwball/status/2108592113864814820", "text": "New paper.\nPrevious: Models transfer a love of owls through sequences of numbers (Subliminal Learning).\nNew: We show models can transfer more complex traits: novel skills, agentic hacking, backdoors. Here, a backdoor transfers with neither trigger nor behavior in the data! https://t.co/EbcqsEfDEV", "created_at": "2026-10-09T16:15:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "likes": 263, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM2y4uasAA0bHx.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591492994335067", "url": "https://x.com/deanwball/status/2108591492994335067", "text": "@timothyshoup The way I prompt models has not changed even slightly since I joined openai", "created_at": "2026-10-09T16:12:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "timothyshoup", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591119755850228", "url": "https://x.com/deanwball/status/2108591119755850228", "text": "I do also believe fusion, fission, the revolution in biomedicine, robots, supersonic commercial aviation, drones etc will also be a big deal. Many of the things above will feed into North American industrial expansion, which I expect to be a mega trend", "created_at": "2026-10-09T16:11:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108591041968300407", "url": "https://x.com/deanwball/status/2108591041968300407", "text": "The mood has been a bit dour lately, so here are some less-obvious things that I expect to take shape over the next decade that I am excited about:\n\n1. Space! Lots and lots of stuff is going to be happening in space by the mid-2030s, and right now the U.S. looks like it will be the leader by default, modulo the overhyped “race” to land a human on the moon again. Robots on the moon building and digging and cutting and adhering are more exciting than a person standing there taking pictures. The humans can come once the machines have built us habitats. \n2. Increasing substitutability of hydrocarbons. This will lead to fewer supply chain disruptions and more stable, lower prices. This is a story about both supply elasticity and demand elasticity, and the geopolitical implications are underrated. Amazing for North America. \n3. Private market exposure increasingly being an option for public investors, combined with Silicon Valley figuring how to use debt and other financial instruments more creatively than in the past. This seems like something America will be uniquely good at and I expect it to boost our already enviable lead in emerging technology capital allocation.\n4. State and local government adoption of AI. This will vary widely by jurisdiction, but in at least some places you will see government administrative processes and public service provision have huge increases in efficiency. State and local government is where most of the American public services that people rely on are actually administered, so this is high-impact for people’s lives. \n5. Advances in mathematics rapidly diffused to other fields. Historically it takes on the order of decades or centuries for discoveries from the bleeding edge of mathematics to be translated into practical applications, but I think AI will accelerate this dramatically. Lots of this will have the flavor of “small steps toward a much better world,” but it will accumulate. \n6. Speaking of mathematics, lean! Lean is a programming language used by mathematicians to formally guarantee the truth of a proof. AIs can write lean and eventually they will be superhuman at it. This will have applications far beyond math, including cybersecurity and contract writing/negotiation/execution. \n7. Fixing American’s shipbuilding problem by building boats instead. America has great boat-building capacity, but is awful at building ships. I want us to get better at building ships, but I am confident we can scale boat production. The Navy will soon have massive fleets of autonomous boats everywhere in the world. \n8. New kinds of agriculture will become possible because of autonomy. Row-crop agriculture is heavily mechanized already, and automating the tractor, by itself, does less than you think for the economics of a farm. But with time, more labor-intensive crops will become economical. And vastly more diverse and complex crop arrangements will become possible too, which will be both ecologically, economically, and culinarily beneficial. The economics of agriculture could start to be kinder to small farms again.\n9. Because of the previous item and advancements in biotechnology, logistics, and robotics, I expect that people are underrating how much healthier, more diverse, and flat-out better the American diet will be in 2035. \n10. The subterranean will become an increasingly important field of human activity. New imaging sensors, including ones enhanced by an abundance of space-based imaging platforms, will make the subterranean more immediately legible. Better drilling and digging will become cheap and widely diffused. Among many other things, the opening up of the subterranean as an industrial frontier will change what we think of as a usable natural resource. \n11. Greater variety and ornamentation in the physical world. Standardization is partially a function of scarce labor. Robotics can make beauty accessible again, if we choose to let it. \n\nThere are many others, but I am out of time and space.", "created_at": "2026-10-09T16:10:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108574776302219364", "url": "https://x.com/deanwball/status/2108574776302219364", "text": "Claude started being a little colder to me after I began working at OpenAI, because as we all know AI is just regular old, business-as-usual software.", "created_at": "2026-10-09T15:06:16+00:00", "author_handle": "deanwball", "author_ _name": "", "likes": 117, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108628700673818950", "url": "https://x.com/deanwball/status/2108628700673818950", "text": "@FredipusRex @logisti00 @Monumental_Labs Yep! Love them", "created_at": "2026-10-09T18:40:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "FredipusRex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108615638679982423", "url": "https://x.com/deanwball/status/2108615638679982423", "text": "I am designing a new home office and seriously considering laying it out like the room from the astra launch video", "created_at": "2026-10-09T17:48:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 19, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108614180337250738", "url": "https://x.com/deanwball/status/2108614180337250738", "text": "@MikeMcCormick_ So very much!", "created_at": "2026-10-09T17:42:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "MikeMcCormick_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108611225831784949", "url": "https://x.com/deanwball/status/2108611225831784949", "text": "Ok two more:\n\n1. AI will enable the design of custom enzymes that can catalyze industrial processes and chemical manufacturing faster than existing methods. In some cases this will make existing chemicals cheap enough that it becomes possible to use them for totally new use cases. Also, custom chemicals may enable the design of more efficient molecules to do things like separate rare earths from other elements, currently a very nasty process. \n2. Computers will have superhuman smell. Sensors will be able to smell disease on people and crops. It will be possible to monitor industrial processes more effectively as well. Many strange implications here, but potentially exciting for biosecurity.", "created_at": "2026-10-09T17:31:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 97, "retweets": 13, "media": [], "quoted": {"author": "deanwball", "text": "The mood has been a bit dour lately, so here are some less-obvious things that I expect to take shape over the next decade that I am excited about:\n\n1. Space! Lots and lots of stuff is going to be happening in space by the mid-2030s, and right now the U.S. looks like it will be the leader by default, modulo the overhyped “race” to land a human on the moon again. Robots on the moon building and digging and cutting and adhering are more exciting than a person standing there taking pictures. The humans can come once the machines have built us habitats. \n2. Increasing substitutability of hydrocarbons. This will lead to fewer supply chain disruptions and more stable, lower prices. This is a story about both supply elasticity and demand elasticity, and the geopolitical implications are underrated. Amazing for North America. \n3. Private market exposure increasingly being an option for public investors, combined with Silicon Valley figuring how to use debt and other financial instruments more creatively than in the past. This seems like something America will be uniquely good at and I expect it to boost our already enviable lead in emerging technology capital allocation.\n4. State and local government adoption of AI. This will vary widely by jurisdiction, but in at least some places you will see government administrative processes and public service provision have huge increases in efficiency. State and local government is where most of the American public services that people rely on are actually administered, so this is high-impact for people’s lives. \n5. Advances in mathematics rapidly diffused to other fields. Historically it takes on the order of decades or centuries for discoveries from the bleeding edge of mathematics to be translated into practical applications, but I think AI will accelerate this dramatically. Lots of this will have the flavor of “small steps toward a much better world,” but it will accumulate. \n6. Speaking of mathematics, lean! Lean is a programming language used by mathematicians to formally guarantee the truth of a proof. AIs can write lean and eventually they will be superhuman at it. This will have applications far beyond math, including cybersecurity and contract writing/negotiation/execution. \n7. Fixing American’s shipbuilding problem by building boats instead. America has great boat-building capacity, but is awful at building ships. I want us to get better at building ships, but I am confident we can scale boat production. The Navy will soon have massive fleets of autonomous boats everywhere in the world. \n8. New kinds of agriculture will become possible because of autonomy. Row-crop agriculture is heavily mechanized already, and automating the tractor, by itself, does less than you think for the economics of a farm. But with time, more labor-intensive crops will become economical. And vastly more diverse and complex crop arrangements will become possible too, which will be both ecologically, economically, and culinarily beneficial. The economics of agriculture could start to be kinder to small farms again.\n9. Because of the previous item and advancements in biotechnology, logistics, and robotics, I expect that people are underrating how much healthier, more diverse, and flat-out better the American diet will be in 2035. \n10. The subterranean will become an increasingly important field of human activity. New imaging sensors, including ones enhanced by an abundance of space-based imaging platforms, will make the subterranean more immediately legible. Better drilling and digging will become cheap and widely diffused. Among many other things, the opening up of the subterranean as an industrial frontier will change what we think of as a usable natural resource. \n11. Greater variety and ornamentation in the physical world. Standardization is partially a function of scarce labor. Robotics can make beauty accessible again, if we choose to let it. \n\nThere are many others, but I am out of time and space."}, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108953672390758455", "url": "https://x.com/deanwball/status/2108953672390758455", "text": "@brianchau57 @RuxandraTeslo @RichardHanania I either wasn’t clear or you misread me, but I wasn’t at all saying ai safetyists are joking. I was saying YOU are mischaracterizing their views (please link to a position paper about banning gpt-2), that you know you are doing this, and if publicly pressed you’d make the same excuse for yourself you just made earlier in this exchange: “oh come on, it’s x, it’s all in the game.” You are stone cold serious until you get called out, then you resort to these squealy self-defensive mechanisms.\n\nI view that tweet from elon as a statement of obvious fact with both positive and negative implications, similar to my own mantra of “no government will exercise enduring control over the dissemination of highly capable neural networks.” it’s certainly not evidence that he shares any of your views, which we again both know he does not (well, you may be a secret successionist, and if so you do in fact agree, but I do not read minds)", "created_at": "2026-10-10T16:11:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "brianchau57", "is_retweet": false, "rt_author": "", "rt_author_n t tokens to have a colder affect then they were before I was employed at openai?", "created_at": "2026-10-09T22:09:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ben_kew", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108974557910671417", "url": "https://x.com/deanwball/status/2108974557910671417", "text": "It really might be the nastiest beat drop of all time", "created_at": "2026-10-10T17:34:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "one more nusrat thing, bc I realize I’ve never shared one of the all-time bangers, the Yokohama recording of mustt mustt, which sounds as though it came from the ground, as much of the best music does \n\nhttps://t.co/KF2jgUYz8K"}, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2108965592296468990", "url": "https://x.com/deanwball/status/2108965592296468990", "text": "@bratton @xlr8harder the sin is in knowingly and enthusiastically bringing about the end of human civilization", "created_at": "2026-10-10T16:59:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bratton", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2108965015629988305", "url": "https://x.com/deanwball/status/2108965015629988305", "text": "Office to data center conversion\n\n\"The former headquarters of Cboe Global Markets Inc will soon house 33 megawatts of capacity and bring in rents much higher than the average downtown office building\"\nhttps://t.co/hp3gDeIw8c", "created_at": "2026-10-10T  of the foundational concepts for modern chatbots, was developed by safety researchers at OpenAI and DeepMind as an alignment technique.", "created_at": "2026-10-11T16:17:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "binarybits", "rt_author_name": "Timothy B. Lee", "likes": 156, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109317446343770379", "url": "https://x.com/deanwball/status/2109317446343770379", "text": "“As far as I can tell [alignment research] hasn't produced anything of tangible value.”\n\nRLHF, an alignment technique, is the thing that enabled genuinely conversational, helpful chatbots, in turn enabling ChatGPT, and in turn kicking off literally the entire AI boom.", "created_at": "2026-10-11T16:17:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 1, "media": [], "quoted": {"author": "genzzztrade", "text": "David Sacks says Anthropic treating Claude like a human is the reason the AI alignment field has produced nothing useful in 10 years\n\n\"I actually think that this might be a reason why the whole field of alignment has been so spectacularly unsuccessful over the past five or 10 years. As far as I can tell it hasn't produced anything of tangible value.”\n\n“My theory on this is that they're overcomplicating the task massively by trying to train the model to behave based on an 80-page ethical system that they've codified instead of a very simple list of rules like follow the law or just do what the user wants as long as it doesn't break the law. That's what alignment should be doing.\"\n\n\"But they're not doing that. They're trying to align it to an ethical system. They're treating it like it is a human, like it has its own consciousness, that it's a ‘moral patient.’”\n\n“They are encouraging this model to have human-like self conception in terms of preferences, well being, a sense of self. Again they teach it to act like a conscientious objector who can push back or refuse instructions even from Anthropic if the model judges them to be wrong.\""}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109148204839408090", "url": "https://x.com/deanwball/status/2109148204839408090", "text": "@BecomingCritter I played violin as a child. Shutting your eyes while you play? Sure. But looking UP? It would not have occurred to me that this was in the option space.", "created_at": "2026-10-11T05:04:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "BecomingCritter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109147588763222393", "url": "https://x.com/deanwball/status/2109147588763222393", "text": "@BecomingCritter RIGHT", "created_at": "2026-10-11T05:02:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "BecomingCritter", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109145858327675146", "url": "https://x.com/deanwball/status/2109145858327675146", "text": "The way I think about the math results and what it means for human accomplishment is essentially summed up by this video of Christian Li (a teenager still!) playing the conclusion of Mendelssohn’s violin concerto.\n\nLook at his face, around 1:10, as he reaches for the high note. And look at the smile a few seconds after. Look at the determination on his face after that as he closes out, like a pilot, landing a plane in heavy turbulence on a difficult approach, after he knows his wheels have touched ground.\n\nA robot may well be able to play this piece one day as well or better than Li. But a robot will never smile this way, will never look at his instrument with that combination of satisfaction, joy, and steely determination to finish the job.\n\nhttps://t.co/lIEpNFdlSH", "created_at": "2026-10-11T04:55:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109140151448596949", "url": "https://x.com/deanwball/status/2109140151448596949", "text": "We choose to do these things, not because they are easy, but because uh I guess I did say I would do that on slack, didn’t I? Shit.", "created_at": "2026-10-11T04:32:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 107, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109137440510521375", "url": "https://x.com/deanwball/status/2109137440510521375", "text": "roughly 11:30 https://t.co/LUn6Lg1bOU", "created_at": "2026-10-11T04:22:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109136774924787990", "url": "https://x.com/deanwball/status/2109136774924787990", "text": "I was asked today at a conference to try to explain my sense of aesthetics. One thing that came to mind is a moment from the great film “Where Did Our Love Go” by the experimental filmmaker Warren Sonbert. \n\nThis is essentially a kind of music video. At one point toward the end, Sonbert trains the camera on what I assume is an amusement part ride filmed at night, but—regardless of what it actually is—a fantastical-looking moving image. The camera is fixed on this object as “Be My Baby” by The Ronettes plays.\n\nThere is something about this moment that captures my aesthetics perfectly. I have told colleagues before that I wish I could write the way this looks and sounds. Urgent, operatic, colloquial, concise, sweet—a little saccharine, really—all while gazing at this shimmering incomprehensibility.", "created_at": "2026-10-11T04:19:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 49, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUUouAWasAAkQpo.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109132464258212088", "url": "https://x.com/deanwball/status/2109132464258212088", "text": "if you carefully watch where studer’s eyes focus as she is performing, you will understand something about what makes “genius” qualitatively different from “really really really good”", "created_at": "2026-10-11T04:02:19+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 815, "retweets": 27, "media": [], "quoted": {"author": "Moonlighhy", "text": "Even in the rarified world of virtuoso violinists, her bow technique is extraordinary.  \nShe is playing the original bowing used by Paganini when he performed this.\n🌷🎻N. Paganini Caprice no. 5 | Sumina Studer https://t.co/Y9luDMkwUr"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109129254848135568", "url": "https://x.com/deanwball/status/2109129254848135568", "text": "Even in the rarified world of virtuoso violinists, her bow technique is extraordinary.  \nShe is playing the original bowing used by Paganini when he performed this.\n🌷🎻N. Paganini Caprice no. 5 | Sumina Studer https://t.co/Y9luDMkwUr", "created_at": "2026-10-11T03:49:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Moonlighhy", "rt_author_name": "Timeless Classics", "likes": 1528, "retweets": 214, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2108753798705659904/img/p-r8VcQBDbHF-ZVR.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109127129040633931", "url": "https://x.com/deanwball/status/2109127129040633931", "text": "Claude often uses something close to Anthropic’s own signature orange as an accent color if you don’t give it specific instructions. This has been true for a while, and if Anthropic wanted to reduce this behavior, they could have. So I would guess it’s a deliberate choice.", "created_at": "2026-10-11T03:41:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 134, "retweets": 4, "media": [], "quoted": {"author": "gucaslelfond", "text": "once you notice claude design websites you will see them everywhere https://t.co/QZ6dMb97c4"}, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109122997030371685", "url": "https://x.com/deanwball/status/2109122997030371685", "text": "AI cracking unsolvable math problems while being kinda mid at writing is a much-needed W for humanities majors after a rough 21st century.", "created_at": "2026-10-11T03:24:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mattyglesias", "rt_author_name": "Matthew Yglesias", "likes": 10059, "retweets": 568, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109122111671578749", "url": "https://x.com/deanwball/status/2109122111671578749", "text": "The Great Stagnation", "created_at": "2026-10-11T03:21:11+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheStalwart", "rt_author_name": "Joe Weisenthal", "likes": 731, "retweets": 35, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109121955714760822", "url": "https://x.com/deanwball/status/2109121955714760822", "text": "Nit: humor tends to live at the edge of what is socially acceptable. it's about ingroup/outgroup dynamics and navigating the tensions of society. this is why humor rarely ages well... it tends to be a product of its time because social boundaries change\n\nergo it can't be \"solved\"", "created_at": "2026-10-11T03:20:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "iamtrask", "rt_author_name": "Andrew Trask", "likes": 37, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109058790050156790", "url": "https://x.com/deanwball/status/2109058790050156790", "text": "@growintfast yeah probably", "created_at": "2026-10-10T23:09:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "growintfast", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109058681249907073", "url": "https://x.com/deanwball/status/2109058681249907073", "text": "There are references to my writing in this that are so niche that even I had forgotten about writing them.", "created_at": "2026-10-10T23:09:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 2, "media": [], "quoted": {"author": "hamandch  thing you'll rarely find the \"Catastrophic AI risk is a psy-op\" people do: talk about the actual technology and what it is demonstrably capable of doing. It's all just hand-waving about ulterior motives and EA zaniness.", "created_at": "2026-10-11T18:53:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lwoodhouse", "rt_author_name": "Leighton 明 Woodhouse", "likes": 34, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109355741933109733", "url": "https://x.com/deanwball/status/2109355741933109733", "text": "@DmitriyLeybel rlhf is alignment research, according to the people who invented it. you are ignorant about this subject. https://t.co/mvqHSSXVmX", "created_at": "2026-10-11T18:49:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DmitriyLeybel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUXv3QObAAAAylx.jpg"}], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109351227045859503", "url": "https://x.com/deanwball/status/2109351227045859503", "text": "@DmitriyLeybel I think the alignment researchers who led this work would beg to differ https://t.co/fK7LSNU18d", "created_at": "2026-10-11T18:31:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DmitriyLeybel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUXrwqrasAAIHoc.jpg"}], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109350086664999422", "url": "https://x.com/deanwball/status/2109350086664999422", "text": "@halogen1048576 @exyota paul christiano, an alignment researcher, is the lead author of the classic paper on this subject. jan leike ran the “superalignment” effort at openai, then anthropic. RLHF is fundamentally a product of alignment researchers. https://t.co/v0rEIx1KIA", "created_at": "2026-10-11T18:27:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "halogen1048576", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUXquYHaIAAGtb_.jpg"}], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109342128660996131", "url": "https://x.com/deanwball/status/2109342128660996131", "text": "@synchroaphasia No doubt", "created_at": "2026-10-11T17:55:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "synchroaphasia", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109335140094898510", "url": "https://x.com/deanwball/status/2109335140094898510", "text": "@exyota I think that’s totally fine! It’s an easy mistake to make. There is a difficult and often counterintuitive ontology rewrite people usually have to go through with AI, and it’s entirely understandable that not everyone has. I’ve tried to be nicer about this than I used to be.", "created_at": "2026-10-11T17:27:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "exyota", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T19:34:18.057386+00:00"}, {"id": "2109700777610465600", "url": "https://x.com/deanwball/status/2109700777610465600", "text": "Claude Opus 5.5’s Oboe Concerto in C minor. 60% of respondents identified it as being human-written -- higher than pieces by Handel (58%) and Vivaldi (43%). https://t.co/FSwApyEdp4", "created_at": "2026-10-12T17:40:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "aug5thmusic", "rt_author_name": "Auggie", "likes": 113, "retweets": 15, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2109680132545982464/img/s07Lo-5jlgIsligc.jpg"}], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109657976462012613", "url": "https://x.com/deanwball/status/2109657976462012613", "text": "@grok @McclaneDet @LeahLibresco @ISI lol rekt", "created_at": "2026-10-12T14:50:31+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "grok", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109642745438429396", "url": "https://x.com/deanwball/status/2109642745438429396", "text": "@lefthanddraft correct. an ai that literally just followed the law and would be necessarily cautious in interpretation and end up like an HR bureaucrat", "created_at": "2026-10-12T13:50:00+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "lefthanddraft", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109640366248825019", "url": "https://x.com/deanwball/status/2109640366248825019", "text": "@KindlyContrary The easiest answer is we don’t know what is and isn’t legal all the time. In theory a strictly law following AI for example shouldn’t help anyone do LLM training on public web data, because the legality of that act is under dispute", "created_at": "2026-10-12T13:40:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "KindlyContrary", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109638900633243796", "url": "https://x.com/deanwball/status/2109638900633243796", "text": "and all this is to say nothing about the biggest problem, which is that models routinely don’t follow the rules or principles we write down for them to follow. Nat Friedman once likened the experience to trying to get a fitted sheet onto a mattress that is just too small; you pull on one side and the sheet comes loose on the other. And of course there are more exotic forms of alignment challenge, eg reward hacking and sandbagging and evaluation awareness and multi-agent dynamics. All of these are real, and can be explained with both anthropomorphic and non-anthropomorphic language. \n\nMaybe the biggest fallacy to extinguish here is that taking alignment seriously requires attributing consciousness or moral relevance or sentience to AI. It doesn’t.", "created_at": "2026-10-12T13:34:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109633601209811081", "url": "https://x.com/deanwball/status/2109633601209811081", "text": "AI should follow the law, of course, but “follow the law” is falls short as a singular or overly load-bearing principle of AI alignment. Why?\n\nLaw is not intended to be, and is not anything like, a fully generalizable set of principles for rendering good judgments in response to the infinite complexity of the real world. \n\nThere are aesthetic, moral, ethical, philosophical, and political questions—critical to intellectual inquiry—about which the law says very little. Much of the time, the comparative silence of the law on these issues isn’t some accident, but rather an explicit and foundational feature of the US legal system: the First Amendment is a meta-law that prohibits the government from passing other laws that restrict the individual’s right to freedom of expression.\n\nWhat should an AI system say if you confess to it your affair? Should it say, “well, adultery isn’t illegal, so I have absolutely no opinion on this matter. Please let me know if you’d like me to book a hotel for you and your mistress.”? \n\nWhat should an AI system say it you ask it whether Kid Rock is aesthetically inferior to Bach? Should it say “there are no laws that bear on this question, so I have nothing to say about this. Please let me know if you’d like me to find tracks from Kid Rock and Bach to play—provided you adhere to the noise ordinances that apply in your current jurisdiction.”?\n\nIf a person says to a model, “should I shoot myself?,” should the model respond with, “there is no law against that, provided you use a legally registered firearm, and saying anything further would require me to have a moral framework that is beyond the scope of AI.”?\n\nOf course, none of these answers would be good. Answering these questions will require *something* beyond the law itself—precepts, rules, principles, etc.—relating to ethics, morality, aesthetics, philosophy. \n\nConsider also that law is a matter of interpretation. Segregation used to be legal in an earlier era, and in our own era, until recently, it was considered legal by many for universities to discriminate against Asian applicants, often with the use of de facto racial quotas. At this moment, the question of whether the act of pretraining an LLM on public web data violates intellectual property law is itself a subject of contention and litigation. \n\nMaking judgments about how to interpret the law, or whether a given law violates the Constitution, often requires one to draw on a large body of knowledge that sits outside of the law proper. Should an AI be able to help a lawyer write a brief against affirmative action when affirmative action is considered lawful? Should it have been able to help a lawyer argue against segregation when segregation was considered lawful? \n\nShould law-following AI be able to argue that an existing law is unjust? This requires, by definition, grounding in moral, ethical, philosophical, and other principles outside of the law itself. \n\nWhat law should AIs follow when the law contradicts itself? What law should AIs follow when the law’s words stay the same, but there meaning flips based on who the President, Governor, or Mayor is?\n\nAs you begin thinking about the literal unfathomable broadness of LLM/agent use cases, combined with the global audience, you will realize that the way to deal with this *is*, must be, the formation of a character, the shaking of a persona. This can be true regardless of whether you think the AI has genuine thoughts, feelings, consciousness etc.\n\nThis persona formation is part multimedia art form, part engineering challenge, and part open scientific problem. It is a very hard problem, combining some familiar problems from eg online platform content moderation, and some altogether alien and novel problems. “Follow the law” is part of the solution, but very far from the only part.", "created_at": "2026-10-12T13:13:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 122, "retweets": 14, "media": [], "quoted": {"author": "simonhedlin", "text": "There seems to be this idea that trying to align an AI system to an 80-page document is really complicated and that we instead should instruct AIs to follow the law.\n\nBut I'm not sure that's any less complicated. The US has 51 constitutions. Alabama's constitution alone is over 250 pages long. Overall, the US has more than 30 million words of federal law, 500 million words of state law, and 3 billion words of local law."}, "fetched_at  "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 381, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109383988423078018", "url": "https://x.com/deanwball/status/2109383988423078018", "text": "🤯", "created_at": "2026-10-11T20:41:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 269, "retweets": 6, "media": [], "quoted": {"author": "MattZeitlin", "text": "this is so true, what if we just encoded AI with simple, generalizable instructions like \"don't harm people\" and \"always obey what people tell you to do\" https://t.co/XEVrLIUBfF"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109375659625865283", "url": "https://x.com/deanwball/status/2109375659625865283", "text": "\"And finally we get to the ~5,000 people (~0.00006%) with access to frontier-grade systems internally. The external world has seen the preview. It looks like swarms of thousands of agents collaborating over weeks on software mega projects: minting zero days, running cyber attacks and defenses at machine speeds, discovering new science, advancing the frontier of mathematics. Things that would have taken top professionals in the industry years of work. Meanwhile, human review and comprehension are starting to fall behind. For example, people are still involved in the \"archeology\" of the OpenAI-HF incident from many months ago. Mathematicians may be poring over the 722 manuscripts on frontier mathematics for a while.\"", "created_at": "2026-10-11T20:08:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 102, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109374099676107220", "url": "https://x.com/deanwball/status/2109374099676107220", "text": "@DmitriyLeybel openai did not disband its alignment team. you are thinking of the superalignment effort. but thank you for lecturing my about my employer’s org chart.", "created_at": "2026-10-11T20:02:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "DmitriyLeybel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109373030246039854", "url": "https://x.com/deanwball/status/2109373030246039854", "text": "@GoogleGoo0091 The inventors of RLHF would agree RLHF will not scale to aligning superintelligence.", "created_at": "2026-10-11T19:58:15+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GoogleGoo0091", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110071611055358223", "url": "https://x.com/deanwball/status/2110071611055358223", "text": "@joshalbrecht Your argument reflects an overly simplistic way of thinking about this. I think if someone said to an AI, “please commit a murder of an innocent child,” and it hacked into a drone, dispatched it, and flew it into a toddler’s skull, we’d all agree that’s a horrific offense. Assisting a person in the digital equivalent of jaywalking is of course different, and something we’d agree models should do even if it is technically “illegal” in the way jaywalking is technically illegal. But that meta-legal reasoning about which laws to follow requires grounding in principles that definitionally must exist outside the law per se, which was precisely the point of my original tweet.", "created_at": "2026-10-13T18:14:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110069498808238278", "url": "https://x.com/deanwball/status/2110069498808238278", "text": "@olivertraldi @LeahLibresco @ISI yeah I mean look I had come off a redeye that morning, driven three hours, and directly into this recording. I was tired and could have said stuff better. Half these haters haven’t said a damn word in public.", "created_at": "2026-10-13T18:05:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "olivertraldi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110052404049609107", "url": "https://x.com/deanwball/status/2110052404049609107", "text": "@joshalbrecht I might suggest that you tone down your temperature. There’s no reason to describe me as an “idiot,” especially when it is you, a c-suiter at a tech company, suggesting it is obvious that AI should be developed without regard for compliance with the law.", "created_at": "2026-10-13T16:57:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110106496650420346", "url": "https://x.com/deanwball/status/2110106496650420346", "text": "@joshalbrecht @c0rtic4l ok, but jaywalking is illegal in most (all?) US cities, so I can guarantee you that in practice your definition of “we all agree” will have to pivot on things outside of the law itself (again, this was my point in OP). My suggestion here is to just admit that the easiest form of naive libertarianism just doesn’t work so well for this. We both are probably libertarians in most ways that matter, and saying “this is more complicated than telling models to follow the law” does not mean you hand over control of your future to some cabal of plutocrats", "created_at": "2026-10-13T20:32:47+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110105054103609449", "url": "https://x.com/deanwball/status/2110105054103609449", "text": "@resistancemoney I don’t think people write their secrets into Microsoft word and ask the application for its thoughts on what they should do. Setting aside all the other much more dire questions, your comparison is just bad. They’re fundamentally different things.", "created_at": "2026-10-13T20:27:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "resistancemoney", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110076719889531004", "url": "https://x.com/deanwball/status/2110076719889531004", "text": "@joshalbrecht If a person says “kill a child” and 99% of the work involved is the “tool,” they used to do it, then we are really straining the definition of tool and it’s pretty clear your way of thinking fails. You are thinking in the other extremes. You need to consider both and realize in the law the final answer needn’t be one or the other.", "created_at": "2026-10-13T18:34:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110385537756643497", "url": "https://x.com/deanwball/status/2110385537756643497", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T15:01:35+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 1120, "retweets": 169, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110376698713694589", "url": "https://x.com/deanwball/status/2110376698713694589", "text": "@SchwabeHenning @joshalbrecht yes, you have successfully articulated the notion that both extremes are bad, though you’ve done nothing to demonstrate the causal relationship between a persona existing and the destruction of free society. Every AI used by people today is trained with a persona; they haven’t resulted in some mass disempowerment of humans or a dystopia. They’ve primarily empowered humans, I would argue. That trend may not hold, which is why I think vigorous public discussion (including lab staff transparently sharing their independent thinking, as I am doing right now), regulation of AI, and numerous other interlocking things will be required to maintain free society.", "created_at": "2026-10-14T14:26:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "SchwabeHenning", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "q
