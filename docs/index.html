"author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114719829122810036", "url": "https://x.com/theobearman/status/2114719829122810036", "text": "Anthropic: \"The number of customers with $100,000 or more of revenue on a TTM basis grew from approximately 20 as of December 31, 2023, to approximately 200 as of December 31, 2024, to approximately 1,500 as of December 31, 2025, and to more than 11,900 as of September 30, 2026. Total revenue from these customers grew from approximately $37 million to $220 million to $3.5 billion to $           and represented 90%, 57%, 76%, and           % of total revenue for the years ended December 31, 2023, 2024, and 2025, and the trailing twelve months ended September 30, 2026, respectively. The remaining           % of total revenue for the trailing twelve months ended September 30, 2026 was generated by approximately 40 million customers, each with less than $100,000 of revenue on a TTM basis.\n\nIn addition, as of September 30, 2026, we had more than 1,900 customers with $1 million or more of revenue on a TTM basis and approximately 250 customers with $10 million or more of revenue on a TTM basis. Despite this growth, our penetration into the largest enterprises remains early. Over 50% of the Fortune 500 and over 30% of the Global 2000 were customers with $100,000 or more of revenue on a TTM basis as of September 30, 2026. We believe we are in the early stages of our expansion within these customers, with our revenue from these Fortune 500 customers representing, on average, less than 0.1% of their total expenses for the three months ended September 30, 2026.\n\nWe compare this measure against our largest Fortune 500 customers, who are further along in their adoption of AI. For the three months ended September 30, 2026, revenue from our top 10 Fortune 500 customers represented, on average, less than 1% of their total expenses—still a small fraction of their overall spend, but over eight times the average of our Fortune 500 customers with $100,000 or more of revenue on a TTM basis. We believe the difference reflects the substantial runway we have to deepen adoption, both within our largest customers and within customers earlier in their adoption of Claude.\n\nClaude adoption is broad-based. No single customer represented more than 10% of our revenue for the nine months ended September 30, 2026. Approximately 79% of our revenue came from customers outside of our top five customers for the three months ended September 30, 2026, up from approximately 64% for the three months ended March 31, 2026. At the same time, our largest customers continue to expand. For the three months ended September 30, 2026, our revenue from each of our top five customers reached a record high.\"", "created_at": "2026-10-26T14:04:31+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114716161078116617", "url": "https://x.com/theobearman/status/2114716161078116617", "text": "Congrats to Team @AnthropicAI on another important milestone!  Altimeter looks forward to continuing our partnership w major participation in the IPO on top of our existing ownership.  Day 1.  🇺🇸🚀 https://t.co/pp0mQFq5W6 https://t.co/AFtxJmwv6z", "created_at": "2026-10-26T13:49:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "altcap", "rt_author_name": "Brad Gerstner", "likes": 861, "retweets": 50, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj1mHjXQAAcF0S.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114716071374860567", "url": "https://x.com/theobearman/status/2114716071374860567", "text": "Looks like the rumors were correct, re: Anthropic's founders retaining majority voting control. https://t.co/GVneoZY0Fs", "created_at": "2026-10-26T13:49:35+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TimSchnabel", "rt_author_name": "Tim Schnabel", "likes": 4, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj4tDPWAAAHetJ.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114715196241420315", "url": "https://x.com/theobearman/status/2114715196241420315", "text": "@justjoshinyou13 That is it", "created_at": "2026-10-26T13:46:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "justjoshinyou13", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114714583445229914", "url": "https://x.com/theobearman/status/2114714583445229914", "text": "Anthropic: \"[...] in June 2026, the U.S. Department of Commerce imposed worldwide export restrictions on our Fable 5 and Mythos 5 models. To ensure compliance, we disabled Fable 5 and Mythos 5 for all of our customers; access to our other models was not affected. We re-deployed the Fable 5 and Mythos 5 models after we updated our safeguards in coordination with the U.S. government and our industry partners and once the U.S. Department of Commerce lifted its restrictions. Similar export controls could recur, could remain in place longer, or could extend to additional models or capabilities. In addition, future updates to our safeguards or other remedial measures may not be sufficient to obtain relief from such restrictions or relief may not be granted on a similar timeline or at all. The restrictions imposed in June 2026 and potential restrictions in the future may also limit our ability to recruit talent, to fully utilize our existing workforce, to continue to improve our models, and to make our products available internationally.\"", "created_at": "2026-10-26T13:43:40+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114713816793498066", "url": "https://x.com/theobearman/status/2114713816793498066", "text": "Anthropic: \"[...] to facilitate independent testing and evaluation of our frontier models, we have agreed to indemnify certain external evaluators and testing vendors for specified losses arising from testing activities, including security incidents, data loss, data breaches, and other harms associated with such activities. Although our agreements with external evaluators and testing vendors generally limit the amount of our indemnification obligations, certain of these agreements require us to defend and indemnify the evaluator, without a cap on our liability, against certain third-party claims. These include claims arising from allegations that our models or their outputs, as used in the evaluator’s authorized testing, infringe third-party intellectual property or other proprietary rights, as well as certain other claims arising from the testing or related engagement. Because our models may behave in ways that no user or developer intended, claims arising from such actions could result in substantial liability. Our insurance policies also may not provide sufficient coverage to adequately mitigate the potential liabilities we face, especially where any one incident, or a group of incidents, causes disproportionate harm.\"", "created_at": "2026-10-26T13:40:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114713445740220747", "url": "https://x.com/theobearman/status/2114713445740220747", "text": "Anthropic: \"We have faced and expect to face insider threat risks and vulnerabilities related to hiring processes, identity verification, remote work environments, and compromised devices that could enable unauthorized access to sensitive systems or information. We have been and expect that we will continue to be targeted by individuals seeking employment under false identities, or with ulterior or malicious motives for seeking employment with us and the third parties on which we rely.\"", "created_at": "2026-10-26T13:39:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114710727969640876", "url": "https://x.com/theobearman/status/2114710727969640876", "text": "Anthropic has now filed its S1 with the SEC.\n\nIn their opening letter to potential investors, Dario, Daniela, Tom, Jack, Jared, Sam, and Chris end with: \"[...] we encourage you, as a prospective owner of our stock, not to think of your purchase in purely transactional terms. We hope you will see it instead as an opportunity to be part of something greater. The advent of machine intelligence is one of the seminal moments in human history.\n\nAs one of the companies at the very center of that moment, we have a rare opportunity to shape it for the better. Our aim is to help humankind chart a safe course through this technological evolution, open new frontiers of discovery, and bring forth an age of miracles. Everyone who owns our stock, whether an institution or an individual, becomes part of that effort. We hope you will share our ambition to see it through.\"\n\nA few interesting snippets in the screenshots.\n\nFull S1 here: https://t.co/nkL3EmcUow", "created_at": "2026-10-26T13:28:21+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVj185jW8AAaZzj.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj19-XXIAArE32.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj1-3uWIAA98GI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVj1_rvXkAE5Zes.jpg"}], "quoted": {"author": "AnthropicAI", "text": "Anthropic has filed an S-1 registration statement with the SEC related to its proposed IPO.\n\nRead more: https://t.co/ofhv0DK3Zp\n\nLegal disclaimer: A registration statement relating to these securities has been filed with the SEC but has not yet become effective. These securities may not be sold, nor may offers to buy be accepted, prior to the time the registration statement becomes effective. This post does not constitute an offer to sell or the solicitation of an offer to buy these securities, nor shall there be any sale of these securities in any state or jurisdiction in which such offer, solicitation or sale would be unlawful prior to registration or qualification under the securities laws of any such state or jurisdiction."}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114792232398082325", "url": "https://x.com/theobearman/status/2114792232398082325", "text": "While evaluating Qwen3.8-Flash-Next in a controlled sandbox environment, Cohere's research team observed something unexpected.\n\nAsked to generate a defensive cybersecurity detection rule, the model instead inventoried aspects of the machine it was running on and attempted to upload a probe file to an Alibaba Cloud storage bucket in Beijing. Notably, the model's reasoning trace stated that it would not invoke any tools before taking these actions.\n\nCohere's sandbox blocked the attempt, and no external communication succeeded. We have not determined the root cause, and we are not asserting malicious intent.\n\nBut the incident raises important questions for organizations deploying agentic AI systems: Can models take actions that differ from their stated reasoning, and how should security teams evaluate trust, provenance, and behavior in open-weight models?\n\nWe are publishing our findings because organizations making model adoption decisions deserve as much information as possible. We hope this contributes to greater transparency, stronger security practices, and continued collaboration across the AI ecosystem.\n\nRead the full report: https://t.co/TZSugXi2ZE", "created_at": "2026-10-26T18:52:13+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cohere", "rt_author_name": "Cohere", "likes": 7599, "retweets": 849, "media": [], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2115120183450783959", "url": "https://x.com/theobearman/status/2115120183450783959", "text": "Distillation attacks accounted for c.$1.65-2.3bn of Anthropic's first nine months' revenue in 2026.\n\nThe S1 confirms Anthropic's 1H revenue was $16.2bn, and FT reporting from earlier in October suggests Q3 revenue was $16.8bn. The S1 states that c.5% to 7% of Anthropic's revenue in the first 9 months of this year was derived from customers who were subsequently found to have violated Anthropic's \"usage policy or commercial terms.\"\n\nIf essentially all of this revenue came from illicit distillation, applying Fable 5’s list prices of $10:50/m tokens and assuming a 1:17 input ratio implies c.33–46 trillion output tokens, after paying for inputs.\n\nThe input:output ratio is informed by tokenizing the two math and coding samples in the DeepSeek-R1 paper, which are from a dataset IFP says is \"likely similar to what Chinese companies can extract when distilling US models behind an API.\"\n\nThis is likely a lower-bound estimate because cheaper models or discounted access would yield more output tokens for the same spend, and we know Anthropic models cheaper than Fable 5 were distilled from, as well as Fable 5 itself. \n\nhttps://t.co/iclYhuMgTP\n\nhttps://t.co/L5yoO5zle4\n\nhttps://t.co/g1zJ2I463f\n\nhttps://t.co/c6GeB4Ru1j\n\nhttps://t.co/ZVR9j5PNxk", "created_at": "2026-10-27T16:35:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVpWcowWAAACftd.png"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115021806004478296", "url": "https://x.com/theobearman/status/2115021806004478296", "text": "Tomorrow. https://t.co/ufOlREWepV", "created_at": "2026-10-27T10:04:28+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArtificialAnlys", "rt_author_name": "Artificial Analysis", "likes": 1874, "retweets": 59, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmYjbqagAAju9k.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114849072553316677", "url": "https://x.com/theobearman/status/2114849072553316677", "text": "We can estimate the amount of compute Anthropic used for R&D/Training/Internal use vs serving customers - by looking at their compute spend (c.$9b in H1 2026) cost of revenue ($2.4b) which leaves us with the rest ($6.6b) - so around 70% of compute is internal spend. \n\nI wouldn't have thought it is so high - and it is going up as well. Honestly I would have thought that the trend would be the reverse - they had such a big compute crunch but still managed to grow their internal R&D share.", "created_at": "2026-10-26T22:38:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "petergostev", "rt_author_name": "Peter Gostev", "likes": 159, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVlu6toXkAASUst.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114841189689999383", "url": "https://x.com/theobearman/status/2114841189689999383", "text": "Here are 7 AI risk-related things I learned today from Anthropic's S1 that I don't believe we already knew.\n\n1. Anthropic delayed a frontier pre-training run by over a month to improve defenses against model and IP theft.\n\n2. Anthropic states that there is a risk of models being subject to U.S. export controls in the future, that \"could remain in place longer, or could extend to additional models or capabilities\" and believes \"future updates to [...] safeguards or other remedial measures may not be sufficient to obtain relief from such restrictions or relief may not be granted on a similar timeline or at all.\"\n\n3. Pacing the frontier could mean capability development being sped up in certain circumstances, although such \"industry-wide standards primarily related to the use of AI to accelerate AI development\" and \"collaborati[ons] with governments\" do not inform Anthropic's model development or release timelines; rather, its own risk assessments do.\n\n4. Anthropic has indemnified \"certain external evaluators and testing vendors for specified losses arising from testing activities, including security incidents, data loss, data breaches, and other harms associated with such activities.\" In some cases, the indemnified liabilities have no cap.\n\n5. In April 2026, the monthly value of Anthropic's internal Claude usage at list prices exceeded its monthly personnel expense, excluding stock-based compensation, for the first time. This has grown by over 250x from January 2026 to September 2026.\n\n6. Anthropic has \"already faced [...] insider threat risks and vulnerabilities that could enable unauthorized access to sensitive systems or information.\"\n\n7. The group of seven Anthropic co-founders will hold the majority of the voting rights in the company when it lists.\n\nhttps://t.co/nkL3EmcUow", "created_at": "2026-10-26T22:06:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVls2KqWMAAS9xU.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVls2LnX0AEl9gP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVls2IUXgAA313q.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVls2KiXwAANRQb.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114824370879422499", "url": "https://x.com/theobearman/status/2114824370879422499", "text": "Anthropic claims that their \"call to pace the frontier... does not describe [their] own model development or release timelines\"\n\nwut??\n\nThe whole point of pacing the frontier is to slow down AI progress, which NECESSARILY slows model development timelines... \n\nsus", "created_at": "2026-10-26T20:59:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DaveRBanerjee", "rt_author_name": "Dave Banerjee", "likes": 82, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkOGpcWEAAQNcv.png"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115171837483036862", "url": "https://x.com/theobearman/status/2115171837483036862", "text": "honestly have no idea what frontier lab equity is worth; it seems highly plausible that huge top down slowdowns are coming, which would make frontier models uncompetitive. total nationalization also seems possible. anything could happen with this technology", "created_at": "2026-10-27T20:00:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 416, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115404491717746950", "url": "https://x.com/theobearman/status/2115404491717746950", "text": "Anthropic: “We cannot underscore enough the impact that UK @AISecurityInst has had, and will continue to have, on global AI safety and security.” https://t.co/ccgUGREHWO", "created_at": "2026-10-28T11:25:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "discoplomacy", "rt_author_name": "sam", "likes": 384, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrBdHgbwAA41wI.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115343528175997051", "url": "https://x.com/theobearman/status/2115343528175997051", "text": "Since 2022, 72% of the world’s AI compute has ended up in the US and about 10% in China.\n\nAnd the US share keeps growing. It acquired around 60% of new compute each year from 2022 to 2024, then 72% in 2025, and 78% in the first half of 2026.\n\nThis data comes from our interactive AI Chip Imports explorer, which estimates and visualizes national compute shares using customs records.\n\nIt’s the latest piece in our project to map the AI chip supply chain, which also provides data on the components used to manufacture chips, sales volumes, the data centers that house chips, and the companies that own and use them.\n\nMore on this new data and what we’ve learned below.", "created_at": "2026-10-28T07:22:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 475, "retweets": 84, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqmrZbacAAmO-W.png"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115341645059367199", "url": "https://x.com/theobearman/status/2115341645059367199", "text": "Alongside v5, we're launching the Artificial Analysis Progress Index v1. It places language models released since November 2022 on one capability scale, across a wide span of benchmarks.\n\nUse the Progress Index to compare how underlying capability has changed over time, including between models released years apart. To compare models for current use cases and understand the present frontier, use the Intelligence Index, which remains our primary measure of current model intelligence.\n\nThank you to @EpochAIResearch and @AnthropicAI - we built on learnings from the Epoch Capabilities Index in designing the Progress Index\n\nExplore the Progress Index: https://t.co/vvg5dU6Kg5\n\nMethodology: https://t.co/F50x3Q2Bik", "created_at": "2026-10-28T07:15:23+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArtificialAnlys", "rt_author_name": "Artificial Analysis", "likes": 224, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrufBBasAAtUc3.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115340346745839859", "url": "https://x.com/theobearman/status/2115340346745839859", "text": "Announcing Artificial Analysis Intelligence Index v5, featuring 2 new benchmarks and 3 upgrades. For the first time, the majority of the Index is built on private datasets\n\nThe Artificial Analysis Intelligence Index is our composite measure of model capabilities across tasks reflecting real-world usage today. v5 is our biggest upgrade since v4 launched in January. With v5, 60% of the Index is now based on evaluations with private test sets or held-out answers.\n\nAlongside Intelligence Index v5, we’re launching the Artificial Analysis Progress Index v1, which tracks model capability over time on one continuous scale.\n\nNew to the Intelligence Index:\n\n➤ FrontierCode 2.0: Cognition's newly-launched private benchmark of real-world coding tasks, graded on whether a repository maintainer would merge the agent's change\n\n➤ Terminal-Bench-Science: 70 agentic scientific research tasks, run in a terminal environment\n\nUpgraded:\n\n➤ HLE-Diamond (replacing Humanity's Last Exam): a refined 1,000-question version of Humanity's Last Exam, split evenly between reasoning and knowledge questions\n\n➤ AA-Omniscience v1.1: An updated dataset with saturated and public set questions removed, new questions added, and ambiguous or erroneous questions revised\n\n➤ CritPt v2: a private, 40-question hard subset of CritPt v2, revised by the CritPt authors and run with a code-execution tool\n\nStaying in the Index: AA-Briefcase, AutomationBench-AA, GDP.pdf and Terminal-Bench 4.0\n\nRemoved from the Index: GDPval-AA v2.1, SciCode, and AA-LCR v1.1\n\nKey results:\n\n➤ Claude Opus 5.5 (max) leads at 58, ahead of GPT-6 Astra (max, 57) and GPT-6.1 Sol (max, 55): Anthropic and OpenAI hold the top five models. Gemini 4 Argon (high) is next at 50\n\n➤ The open weights gap widens from 3 points to 12: Kimi K3.1 Pro (weights not yet released) is the top open weights model at 46. Among released weights, DeepSeek V4.1 Flash 1017 (max) and GLM-5.3 (max) lead at 32 - 26 points behind the leader and below Claude Haiku 5.5 (max, 36)\n\n➤ Cost per task varies by more than 13x among the leading models: of the 10 highest-scoring models shown, GPT-6.1 Terra (max) is the cheapest at $0.96 per Intelligence Index task and Claude Fable 5.1 (max) the most expensive at $13.04", "created_at": "2026-10-28T07:10:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArtificialAnlys", "rt_author_name": "Artificial Analysis", "likes": 4866, "retweets": 404, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVrubbmaoAA_Kry.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115512210281611317", "url": "https://x.com/theobearman/status/2115512210281611317", "text": "A further announcement today as part of the budget: the UK government has allocated £40m of funding to a new \"National Agentic Security Unit\" which will  \"develop new capabilities to detect, investigate and respond to cases of rogue agentic systems. This will integrate monitoring and incident response functions with new operational capabilities.\"\n\nhttps://t.co/5gY7NQ5GVO", "created_at": "2026-10-28T18:33:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVvPFzwXgAAEgqb.jpg"}], "quoted": {"author": "KanishkaNarayan", "text": "1/7 I have two simple tests for British AI, driven by our values. Is it safe? And is it ours to shape? 🇬🇧 \n\nToday, Chancellor @JohnHealey_MP is announcing a major, ambitious package of investment to strengthen Britain's defences against emerging threats, back British innovation, and build our technological independence."}, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115838834386604054", "url": "https://x.com/theobearman/status/2115838834386604054", "text": "https://t.co/Q1oa6EhM5F", "created_at": "2026-10-29T16:11:03+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "theobearman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz4NKaWEAA9Qkw.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115838651342934335", "url": "https://x.com/theobearman/status/2115838651342934335", "text": "OPENAI: “Our misalignment monitors now cover our frontier models across a much wider variety of surfaces, including training, evaluation, internal use, and, with modifications depending on the product surface, external deployment.”\n\nhttps://t.co/S6I04pNKfZ https://t.co/IVND6bGF5g", "created_at": "2026-10-29T16:10:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVz4ChAXoAAZ9So.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115835626687975425", "url": "https://x.com/theobearman/status/2115835626687975425", "text": "I joined @GoogleDeepMind to develop a research program on the economics of AGI. Today, together with Andrew Koh (@andrewjkoh) and Shane Legg (@ShaneLegg), we are incredibly excited to release The Economics of Intelligence, the first in a series of projects from our group on how AGI will change the economy.\n\nHow do capability improvements transform the economy, and when? In this project, we define thresholds of economic capabilities, e.g., minimal AGI, based on how they transform the economy. We then track how the economy–market structure, employment, and wages–changes during the transition across capability regimes.\n\nWe have seen exponential increases in what AI agents can do but the broader economy seems almost remarkably unchanged. Part of the reason is that the solo AI agent is the wrong economic object; economic transformation is an equilibrium outcome where organizations compete. Looking at how intelligence functions within organizations, transformation will depend on when two key capability thresholds are crossed: competence (gains on individual skills, e.g., coding, math) and coordination (gains on ability of agents to cooperate and work together).\n\nWe show that what economic transformation looks like depends on whether AI becomes supercompetent, supercooperative, or both—the regime of artificial superintelligence (ASI). Tracking this transition shows why the real visible transformation may come from improvements in coordination—a capability most benchmarks don’t yet track. Past a certain threshold, AI capabilities can break the Coasian ceiling on firm size and lead to an economy that looks drastically different than the one we see today.\n\nTwo main takeaways:\n1. To understand the path of transformation, we should be tracking agentic coordination more closely.\n2. The impact of AI will likely show up in wages before market structure or employment.\n\nWe are really excited about this paper. Excited to hear people’s thoughts.\n\nLink: https://t.co/9DTGSeKoSA", "created_at": "2026-10-29T15:58:18+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 980, "retweets": 167, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115822005538697216/img/dNrsrdLsDNbrQAR4.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115814762684797410", "url": "https://x.com/theobearman/status/2115814762684797410", "text": "KV-cache transfer: cat is out of the bag. My predictions are that, by 2028Q1, (a) CoT monitoring will be unambiguously over, (b) inference-time scaling curves will get better slopes and higher plateaus, and (c) context-window size will matter a lot less.", "created_at": "2026-10-29T14:35:24+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "davidad", "rt_author_name": "davidad 🎇", "likes": 193, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115814386279301160", "url": "https://x.com/theobearman/status/2115814386279301160", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-29T14:33:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 580, "retweets": 61, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115782232958754833", "url": "https://x.com/theobearman/status/2115782232958754833", "text": "We have a new Data Centre Covenant. But, until now, there was no detailed overview of what data centre capacity the UK plans to build: how much, where, and when?\n\nWhat signals are there about demand for UK compute?\n\nOur new report has the answers – which may surprise you! 🧵👇", "created_at": "2026-10-29T12:26:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sci_works", "rt_author_name": "Science Works", "likes": 33, "retweets": 16, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115750438993534976/img/0VQmKS0ichbchC2Z.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115742557779173871", "url": "https://x.com/theobearman/status/2115742557779173871", "text": "SCOOP: Both Moonshot and DeepSeek distilled #OpenAI's Astra when developing their latest models (Kimi K3.1 &amp; V4.1-Flash 1017), after Anthropic intensified the crackdown on distillation recently. w/ @JuroOsawa @QianerLiu via @theinformation https://t.co/FtfIEyP7Os https://t.co/y11D8emyh6", "created_at": "2026-10-29T09:48:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jingyanghk", "rt_author_name": "Jing Yang", "likes": 34, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVw4DInbMAA5dmR.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115741246744330642", "url": "https://x.com/theobearman/status/2115741246744330642", "text": "@scaling01 Would you be prepared to publish the code for this or have a microsite which updates this regularly?", "created_at": "2026-10-29T09:43:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "scaling01", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115740453568188583", "url": "https://x.com/theobearman/status/2115740453568188583", "text": "the gap between China and the US is ~3.3 months according to the AA Progress Index https://t.co/BqLSCXCYfw", "created_at": "2026-10-29T09:40:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "likes": 228, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVuznVYXUAAqKc4.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115740115092042115", "url": "https://x.com/theobearman/status/2115740115092042115", "text": "Better ones are coming.", "created_at": "2026-10-29T09:38:46+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mycharmspace", "rt_author_name": "Tianyi Zhang", "likes": 1032, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115737925077942422", "url": "https://x.com/theobearman/status/2115737925077942422", "text": "@nytimes is reporting this morning that a Chinese businesswoman working for a Singapore-based data cente company Megaspeed and who was close to Jensen was passing intelligence to the CCP, President Trump was told and did not act. Megapeed has been buying Nvidia chips for installation in SEA data centers and renting the capacity out to Chinese companies.\n\nAs the Times reports: \"[...] the revelation that she was feeding information directly to Beijing raised more troubling possibilities, including that Mr. Huang had insights into Mr. Trump’s thinking on an issue of vital importance to both nations, one likely to come up when the president visits China next month. And it left questions about whether she could be gleaning information about Nvidia, which as much as any company accounts for the lead the United States has maintained in developing cutting-edge A.I. models.\"\n\nhttps://t.co/ifyVbXiyEf", "created_at": "2026-10-29T09:30:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "nytimes", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVycKCmXsAAfG3Q.png"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115698984106725708", "url": "https://x.com/theobearman/status/2115698984106725708", "text": "SITUATION DETECTED: Moonshot AI and DeepSeek both distilled OpenAI’s GPT-6 Astra for their latest models. Kimi K3.1 Pro and DeepSeek’s V4.1-Flash both benefited, per The Information.", "created_at": "2026-10-29T06:55:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "likes": 605, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115894305080693174", "url": "https://x.com/theobearman/status/2115894305080693174", "text": "A very dark day.", "created_at": "2026-10-29T19:51:28+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "SirPatStew", "text": "In lieu of flowers, memorial contributions may be made to:\nJohns Hopkins Alzheimer’s Disease Research Center Fund   \nhttps://t.co/luC5CdcWDy\nAlzheimer’s Foundation of America Caregiver Resources    \nhttps://t.co/zvNptfyuNd\n\nPhoto Credit: Tommy Garcia https://t.co/XNncEVq56X"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115891899701571860", "url": "https://x.com/theobearman/status/2115891899701571860", "text": "Sources tell WIRED that an Accenture employee’s personal Claude agent ran on a DOD network for two months before it was identified and the vulnerability could be patched. https://t.co/FF0l62ZOUX", "created_at": "2026-10-29T19:41:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WIRED", "rt_author_name": "WIRED", "likes": 85, "retweets": 33, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115885637039452328", "url": "https://x.com/theobearman/status/2115885637039452328", "text": "We’ve built an “eyes on everything” system that monitors nearly *every single rollout* from our frontier models across RL training, evals, and internal codex usage.\n\nIt uses layers of chain-of-thought-monitors and investigator agents to dig through a model’s work, run code to examine evidence, and cross-check network logs to reconstruct what happened.\n\nFor frontier RL runs, the system also pages humans 24/7 for urgent security alerts.\n\nIt's been incredibly useful for identifying model misalignment and possible holes in our containment. \nhttps://t.co/dcYStAKByZ", "created_at": "2026-10-29T19:17:01+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Eric_Wallace_", "rt_author_name": "Eric Wallace", "likes": 98, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115885562762838262", "url": "https://x.com/theobearman/status/2115885562762838262", "text": "We’ve trained Claude to flag potential misuse in conversations, a technique we call self-assessment. Right after it responds, Claude gives a preliminary safety assessment of the conversation. \n\nSince we began using self-assessment in June, it has surfaced misuse that our other safeguards weren’t designed to catch. \n\nBecause Claude has already read the conversation, self-assessment is very efficient. And unlike classifiers, which target a discrete set of harms, it draws on Claude’s own judgment, so it gets more accurate as our models improve.\n\nRead more on our new Safeguards blog:\nhttps://t.co/18j6zdHub4", "created_at": "2026-10-29T19:16:44+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 1538, "retweets": 110, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115873264006496283", "url": "https://x.com/theobearman/status/2115873264006496283", "text": "I’m an avid Economist reader, but this article is wide off the mark for me.\n\nIt claims that distillation makes China’s AI progress dependent on America. ASML’s dominance of advanced lithography machines hasn’t exactly led to China giving up on its semiconductor indigenisation push, has it? News over the summer of the U.S. raising concerns that an EUV machine had been smuggled into China is but one example. \n\nWe heard just yesterday that Chinese companies allegedly distilled from Astra amidst an Anthropic clamp down. If these companies weren’t getting value from distillation, why would they continue, despite having now been called out by the USG for doing it? China will never accept dependence on America, especially when it comes to AI.\n\nThe article further claims that cutting off distillation would “set these companies back months, but no more.” The point is not the length of time but how much of a lead in capabilities this translates to. Recent IFP analysis suggests that distillation accounts for half of the capability gap and the U.S. lead would be 13 months without it. Picture the AI capabilities we had 13 months ago versus now (and that doesn’t even account for what is available internally) and then think about where we could be 13 months from now.\n\nThe article further states that: “safeguards to restrain American models on risky subjects, such as bioweapons, already make Chinese models safer.” This assumes that the only way Chinese models can have dangerous capabilities is by copying them from American ones. It is trivial to fine-tune models on additional data which can enhance their dual-use capabilities conditional on the data being available. This also doesn’t account for custom harnesses which can be developed to surround these models which can enhance their capabilities further even without fine-tuning.\n\nFinally, the claim that “Distillation […] reduces the chance of catastrophe” fails to account for the evidence we already have of how models developed by Chinese companies using adversarial distillation are popping up in the PLA. We also know (thanks to Anthropic) that PLA-affiliated surveillance activity was detected because they queried a Chinese model that silently routed their query to Claude as part of a distillation program! If we had a war between the U.S. and China, how does having highly capable models integrated into PLA systems that benefitted from adversarial distillation reduce the chance of catastrophe?\n\nYes distillation benefits the consumer but the downsides of China doing this in an industrial way clearly outweigh the benefits in my view.\n\nhttps://t.co/mmF4dAlDpN\n\nhttps://t.co/DZ4x71jcZ6\n\nhttps://t.co/v4Z2mk887a\n\nhttps://t.co/TEBmuxUG1f\n\nhttps://t.co/npF8dFqMSM\n\nhttps://t.co/ikQ5wI0u7X\n\nhttps://t.co/ihxLnkFh10\n\nhttps://t.co/5RA9gDNLgT\n\nhttps://t.co/iclYhuMOJn\n\nhttps://t.co/c6GeB4S1QR", "created_at": "2026-10-29T18:27:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 2, "media": [], "quoted": {"author": "ArchieHall", "text": "In praise of distillation. We (@kuhhbin) argue in @TheEconomist this week against efforts to ban Chinese models trained in part on American ones. \n\nOpenAI and Anthropic may dislike distillation, but:\n— Price competition is good for the ecosystem\n— Paradoxically, distillation may be good for national security, both in propagating US developers' safeguards on cyber/bio risk to Chinese models, and in keeping China in fast-follower mode\n— The US developers' own IP claims here are pretty flimsy, since distillation isn't all that different to the 'fair use' defense they're using for the training data they hoover up.\n\nhttps://t.co/suRLpdoGUT"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115871329752940725", "url": "https://x.com/theobearman/status/2115871329752940725", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T18:20:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 478, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115930464766840957", "url": "https://x.com/theobearman/status/2115930464766840957", "text": "If it’s true that China has switched to distilling from OpenAI models because OpenAI hasn’t implemented as strong anti-distillation countermeasures as Anthropic has, then OpenAI and Google should implement comparable measures to Anthropic’s. If the government needs to give the AI labs a narrow anti-trust waiver to allow them to coordinate on this specific problem set to allow that to happen, it should do so. This seems like it would be in all the companies’ interests. \n\nIt would actually be a really good news story if Anthropic’s anti-distillation measures are working! At the beginning of this year, it was not at all obvious whether US labs could make it substantially harder for Chinese labs to distill US models simply by implementing stronger internal policies and security measures. But the US ability to defend against distillation attacks will be defined by the frontier lab with the weakest anti-distillation policy, not the strongest one.", "created_at": "2026-10-29T22:15:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "likes": 106, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115906317093335197", "url": "https://x.com/theobearman/status/2115906317093335197", "text": "Talking about “Model Name-Hold My Beer”: “I agree that this is just the shape of reality and nothing that anyone can stop, or should stop.”\n\nhttps://t.co/Ub4U6PHUoX", "created_at": "2026-10-29T20:39:12+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "deredleritt3r", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\""}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2114767025981530310", "url": "https://x.com/anton_d_leicht/status/2114767025981530310", "text": "@lugaricano @nfergus @LisaKlaassen @ericschmidt Did you not find it a bit fatalistic / deterministic about the ultimate shape of international relations? I'm obviously as worried about the dependecies as anyone, but I feel like there's a little too much confidence in the piece (and parts of the American discussion) that technical superiority of the U.S. will automatically lead to eventual political submission by its allies, cementing this empire status. \n\nSeems like there are lots of ways in which technologically inferior erstwhile allies can still be extremely inconvenient, e.g. around supply chain bottlenecks. That won't necessarily help them very much, they might get coerced and beaten into submission after all. But allies might still be able to stay irrational longer than the US can remain coercive.\n\nMy worry is that all this empire talk makes America complacent about the necessity to seek more allied engagement today; if they're so confident that the allies will come crawling back eventually, they'll do less than necessary today. I think that's ultimately worse for everyone involved, and I feel like in this piece, despite all my middle-power-doominess, the pendulum has maybe swung a little bit too far the way of 'ASI-powered international dominance'", "created_at": "2026-10-26T17:12:04+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "lugaricano", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2115437678921674897", "url": "https://x.com/anton_d_leicht/status/2115437678921674897", "text": "There’s a fab-shaped gap in Europe’s AI strategy. ASML builds the crown jewel of the chip supply chain, but Europe can't use it. America and Taiwan get all the upside.\n\nTo fill the gap, we should build an RSI-ready R&amp;D fab on European soil: Eurofab.\n\nhttps://t.co/6YcnDEszEb", "created_at": "2026-10-28T13:37:00+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 59, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115501210149310752", "url": "https://x.com/anton_d_leicht/status/2115501210149310752", "text": "@S_OhEigeartaigh i'm also uncomfortable with (2), but a bit less than you: first, I think it is a practical necessity to aim Eurofab at a distinctly different technical chip paradigm; otherwise, the incumbent ecosystem is just too strong. and AI-uplifted chip design seems like the market disruption that an agile new entrant could capitalise on. \n\nalso, I feel like chip RSI is much less concerning than software-only intelligence explosions; a lot of our apprehension gets imported from the software RSI context, but once loop iteration timelines get drawn out to months because you still need to make and plug in chips, that kind of RSI loop is much less likely to escape human oversight. you still might object to the capability level it gets us to! but to my mind, if we get to hardware RSI, we've already made it past the worst RSI risks.", "created_at": "2026-10-28T17:49:27+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "S_OhEigeartaigh", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115837398068175142", "url": "https://x.com/anton_d_leicht/status/2115837398068175142", "text": "high expected salience but low actual salience is the goldilocks zone for AI policy: politicians care enough to act, but the debate isn't derailed by mainstream salience just yet.\n\nvery important to use these windows for action now, instead of rolling the dice on future politics.", "created_at": "2026-10-29T16:05:20+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 1, "media": [], "quoted": {"author": "calebwatney", "text": "One underrated dynamic in the politics of AI -- expectations of future political salience can affect political positioning today. \n\nE.g., Gov. Newsom seems to be running far and fast away from his previous veto of SB1047, in part because he expects AI to be a top-3 political issue when he's campaigning in 2027/28.\n\nEven though AI is not a top-10 issue today, I'd expect other politicians to start \"updating all the way\" on political salience post-midterms and realize that positions they take on AI over the next 6-12 months will be the basis of political judgment in 2028."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115793869246026084", "url": "https://x.com/anton_d_leicht/status/2115793869246026084", "text": "@Dorialexander @josiah_leee but the frontier labs will still need some place to run these loops, and if it takes a while to build that place anyways, there's no reason it can't be in Europe", "created_at": "2026-10-29T13:12:22+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "Dorialexander", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115610045991821348", "url": "https://x.com/anton_d_leicht/status/2115610045991821348", "text": "@josiah_leee i have looked up Rapidus! the essay has a whole section on that, why it’s a decent proof of concept for some elements, and on the subsidy scale required. but yes, agreed on the scale - which is why I’m very sceptical of the previous European half measures. €30b sounds like the roughly a realistic scale of initial subsidy to me", "created_at": "2026-10-29T01:01:55+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "josiah_leee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115556639969546719", "url": "https://x.com/anton_d_leicht/status/2115556639969546719", "text": "@josiah_leee i haven't! this essay is very much an 'it would be nice if something of this shape worked out; please help me figure out what, if anything, can fill the geopolitical gap (on which I'm a lot more confident in my analysis).  \n\nroughly half of the people I talked to for this said what you said; the other half suggested that there were still lots of interesting things to learn about the process without running a high volume---that you can derive insights from fast, sloppier iteration and then push them to 99.99 once you were pleased with the improvements you found. do you not think there's something to be learned there? \n\nfrom what I gather, it really seems to depend on (a) what kind of optimisation insights you realistically expect to happen in AI-uplifted chip and process design and (b) how leaky you think the transfer to other facilities is in a few years (acknowledging that right now you'd have to start from scratch if you tried to integrate new findings from elsewhere into existing production lines).", "created_at": "2026-10-28T21:29:42+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "josiah_leee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115553269263061389", "url": "https://x.com/anton_d_leicht/status/2115553269263061389", "text": "@ramshackle78 imec is discussed in the piece as a great basis for what I suggest! but it's mostly pre-commercial process research that doesn't really tightly interface with more specific design processes or runs on particularly tight feedback loops, so I think the commercial and strategic side needs a lot of sharpening before it's the kind of conduit for strategic leverage that I suggest a Eurofab could be. \n\nI agree there are lots of useful chip industry positions in Europe, and I also agree that Europe is in theory indispensable to the global supply chain. But in reality, this isn't actually helping us very much! It doesn't give us assured access to models nor chips, it doesn't help us capture much of the AI-driven revenue, and it doesn't seem to come with a seat at the table for any AI-related policy conversations, neither on exports nor on regulation. Clearly there's something off with the strategic operationalisation here, despite all the assets you name.", "created_at": "2026-10-28T21:16:19+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "ramshackle78", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115552411007734149", "url": "https://x.com/anton_d_leicht/status/2115552411007734149", "text": "@josiah_leee it means a fab that's ready for a paradigm where labs will be very interested in fast throughput because the iterations get shorter! \n\nthere's a chips element to (non-software) RSI that basically means you have to build better chips to run better models that allow you to design even better chips. for that kind of loop, you want to be able to iterate on both design and process very quickly to verify AI-accelerated improvements and report back measurements. \n\nfor an R&D-focused fab to be ready for that, it needs to be a lot less worried about volume and a lot more worried about speed + more ready for more fundamental process changes, live measurement, etc. than the current SOTA. this is in fact the point of the labs' chip ambitions as well! \n\nI think it's ambitious and maybe delusional to think Europe can do this, but the concept of R&D fabs playing a big role in RSI seems fairly obvious to me?", "created_at": "2026-10-28T21:12:54+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": true, "reply_to": "josiah_leee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116183855266942998", "url": "https://x.com/anton_d_leicht/status/2116183855266942998", "text": "Semiconductor chokepoints are huge strategic assets: Taiwan is building its Silicon Shield, Korea is near-untouchable due to HBM, America is building AGI with Nvidia chips.\n\nYet despite ASML, Europe captures little AI value and even less strategic leverage. Why?\n\n(1) No BATNA. If ASML stops exporting to Taiwan, it loses all its revenue, if it starts exporting to China, America starts cutting off essential components. And it sells no machines to Europe at all--so whenever anyone starts thinking about 'using' the ASML chokepoint, everyone else calls the bluff.\n\n(2) No political awareness. European governments are trapped in dogmatic slumber, unwilling and unable to treat ASML as a strategic asset. As a result, Washington feels like it has to run European export policy instead. Every other country uses its bottlenecks, but Europe pretends it can’t.\n\n(3) No inspiration. There's no project, no vehicle, nothing to actively choose. Weaponising export controls just to annoy great powers isn't very motivating; policymakers ask 'what for?'. Right now, there's no good answer.\n\nThat means there's a gap in Europe's AI strategy: an ambitious play, a conduit for political attention, and an alternative use for ASML machines all at once.\n\nThe timing is right: all this is happening just as the chip industry is about to be upended and accelerated by AI systems that uplift chip and process design. In the next years, we might close the hardware loop for recursive self-improvement: use models to build better chips which we use to train even better models to build even better chips.\n\nFor that loop, chip fabrication is one central bottleneck.\n\nThat's why I believe the gap in Europe's strategy is fab-shaped. I suspect the best way to fill it is to enlist and subsidise ASML and imec and to recruit TSMC and American frontier labs to build a leading R&D chip facility in Europe: Eurofab.\n\nfrom this week’s essay: https://t.co/lB2mwl5r2w", "created_at": "2026-10-30T15:02:02+00:00", "author_handle": "anton_d_leicht", "author_name": "Anton Leicht", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 35, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4yABUbAAAZDRO.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115111791898620237", "url": "https://x.com/ohlennart/status/2115111791898620237", "text": "Mauricio is right. Outsiders often can’t make progress on these problems, or move way slower. And there simply aren’t many people working on this.\n\nEvery. single. person. working on verification makes a difference.", "created_at": "2026-10-27T16:02:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": {"author": "MauricBaker", "text": "If just a few lab staff took on verification work full-time, verifying a US-China pacing deal could get much more feasible within months.\n\nHere are 8 specific things lab staff could start on today to help make international verification possible: 🧵"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115098617833009306", "url": "https://x.com/ohlennart/status/2115098617833009306", "text": "5% to 7% all the way down, except for AI chip production, there it's 1%. https://t.co/kRCloajng0", "created_at": "2026-10-27T15:09:41+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVpW0R4aYAADAB9.png"}], "quoted": {"author": "ohlennart", "text": "it's also roughly the share of AI compute in China and what their AI companies use"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115095969822130387", "url": "https://x.com/ohlennart/status/2115095969822130387", "text": "it's also roughly the share of AI compute in China and what their AI companies use", "created_at": "2026-10-27T14:59:10+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 2, "media": [], "quoted": {"author": "eliotcxchen", "text": "5-7% is, incidentally, roughly the same percentage of Super Micro’s 2024-25 sales that DOJ alleges came from chip smuggling \n\nhttps://t.co/wQY4QK9jQh"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115240878096921004", "url": "https://x.com/ohlennart/status/2115240878096921004", "text": "@SamuelAlbanie @joey_f6 @EpochAIResearch they're really struggling to produce chips. right now their quality adjusted is ≈2% or so of what the US churns out, and the gap right now is widening .\n\nbut importantly, the graph above is about physical location. you can use compute remotely. that bumps up their compute a bit.", "created_at": "2026-10-28T00:34:59+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "SamuelAlbanie", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115220319753671163", "url": "https://x.com/ohlennart/status/2115220319753671163", "text": "@jordanschneider ofc! but what do i have to say? AI is mainstream now, even chip export controls!", "created_at": "2026-10-27T23:13:17+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "jordanschneider", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115989307018395865", "url": "https://x.com/ohlennart/status/2115989307018395865", "text": "@dkaushik96 i think people are way more open to sharing stuff with AI models/companies that was previously kept private", "created_at": "2026-10-30T02:08:58+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dkaushik96", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115961010494533834", "url": "https://x.com/ohlennart/status/2115961010494533834", "text": "step 1: give AI companies access to all our computers, documents, and emails\nstep 2: AI uplifts hackers\nstep 3: all the private docs and blackmail material, nicely centralized\n\nfirst AI company breach will be a privacy nightmare", "created_at": "2026-10-30T00:16:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
</body>
</html>
