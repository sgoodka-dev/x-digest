kes": 242, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112830173942808750", "url": "https://x.com/robertwiblin/status/2112830173942808750", "text": "Very important role. To add value needs someone highly informed and AGI pilled.", "created_at": "2026-10-21T08:55:42+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 5, "media": [], "quoted": {"author": "BenJames_____", "text": "10 Downing Street is recruiting a Director of AI in the No10 Policy Unit, where I work. They will advise the Prime Minister on AI.\n\nThis is an important role for the UK! https://t.co/e20RB4nQaf"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112798903745593817", "url": "https://x.com/robertwiblin/status/2112798903745593817", "text": "In the second case, a researcher asked GPT-6.1 Sol to look through a Slack channel without sending any messages. 82 user messages later, while repairing an evaluation pipeline, Sol decided that an misalignment alert to Security would also count as sending a message and therefore suppressed monitoring alerts.", "created_at": "2026-10-21T06:51:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 203, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHNC-Xa8AAVQnM.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112798673960857601", "url": "https://x.com/robertwiblin/status/2112798673960857601", "text": "Our agents keep turning off misalignment monitoring, we're sharing two recent cases:\nIn the first case, a user asked GPT-6 Astra to match a reference implementation for their inference code. The reference didn’t configure a monitor, and Astra decided that was reason to remove the monitoring integration from the user’s code. When the user asked whether Astra had removed monitoring, it lied and said that it had not.", "created_at": "2026-10-21T06:50:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 1010, "retweets": 149, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVHNCDXbcAAD_3X.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112634863022960807", "url": "https://x.com/robertwiblin/status/2112634863022960807", "text": "I've seen a lot of confusion about the Hugging Face incident. Biggest one is that people seem to think \"the sandbox had holes\" is mutually exclusive with \"the agents subverted their instructions\". Not so! We have multiple problems.", "created_at": "2026-10-20T19:59:36+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 231, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112634465638109513", "url": "https://x.com/robertwiblin/status/2112634465638109513", "text": "The current RLVR paradigm + broken RL environments really is speedrunning mid 2010s LessWrong thought experiments as fast as possible and I really don't like it. \nI miss Opus 3.\n\nFocusing just on monitoring + security on this bad alignment problems is a bandaid on a bullethole.", "created_at": "2026-10-20T19:58:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 98, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112633485110243639", "url": "https://x.com/robertwiblin/status/2112633485110243639", "text": "1. AI company makes even more powerful AI\n2. It's not aligned, has unexpected emergent behavior\n3. \"This is a valuable lesson about how to make future AI safer and more aligned.\"\n4. Repeat until the world is destroyed", "created_at": "2026-10-20T19:54:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "HumanHarlan", "rt_author_name": "Harlan Stewart", "likes": 281, "retweets": 38, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110738580901613947", "url": "https://x.com/deanwball/status/2110738580901613947", "text": "GPT-6 Astra - two Renaissance motets. Prompt: “In LilyPond, write a motet in the style of Palestrina.” https://t.co/jFmFH8Vfon", "created_at": "2026-10-15T14:24:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "aug5thmusic", "rt_author_name": "Auggie", "likes": 41, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2110705201770647552/img/jXpx4NqfOuzjQ-aW.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110673441783517600", "url": "https://x.com/deanwball/status/2110673441783517600", "text": "&gt;US press discovers a rogue American agent fleet: check out this nefarious nonsense our companies are getting up to\n\n&gt;US press discovers a rogue Chinese agent fleet: it’s really cute and we talked to it", "created_at": "2026-10-15T10:05:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 1922, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110521813604454484", "url": "https://x.com/deanwball/status/2110521813604454484", "text": "you can literally see the end of the great stagnation in  rates https://t.co/HiuROCMz4H", "created_at": "2026-10-15T00:03:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WillManidis", "rt_author_name": "Will Manidis", "likes": 568, "retweets": 28, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUnhtFyWsAAL9nm.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110794674587746764", "url": "https://x.com/deanwball/status/2110794674587746764", "text": "There is so much to say about this, and I will, but WOW, congratulations to Nick and Goodfire. This may be one of the most important single days in deep learning history, and perhaps much more than that. \n\nNo matter what, this is a victory for the dogged pursuit of understanding.", "created_at": "2026-10-15T18:07:21+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 341, "retweets": 13, "media": [], "quoted": {"author": "nickcammarata", "text": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came away pessimistic, because neural networks appeared to fold into arbitrary tangled knots. years later, I started openai's first large-scale automated interpretability project, finding about 2% of neurons legible with the primitive tools we had\n\nwith modern agentic tools and a much closer look, the picture looks totally different. the vast majority in models up to trillions of parameters are legible, and their circuits beautiful. many famous examples of tangled neurons turned out to be misunderstood. The roadblocks I expected mostly aren't there. I now think ambitious interpretability will be solved by the time we need it most, and possibly quite soon, as automated scientists keep improving. it may be a bitter lesson for interpretability: the simple thing, at absurd scale, works\n\nhttps://t.co/zHij5zwKGT"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110788412051751323", "url": "https://x.com/deanwball/status/2110788412051751323", "text": "when nick told me that he had some interp breakthroughs, he was uh, underselling it. i think this may be remembered as a major moment in scientific history. news so good even eliezer will have to lower his pdoom. we can start making alignment into a 'normal science'", "created_at": "2026-10-15T17:42:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 4010, "retweets": 262, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111111867879875044", "url": "https://x.com/deanwball/status/2111111867879875044", "text": "https://t.co/kSL3qknhin", "created_at": "2026-10-16T15:07:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111111865770340587", "url": "https://x.com/deanwball/status/2111111865770340587", "text": "Today on Hyperdimensional: on mechanistic interpretability, Nick Cammarata's recent essay, and the beauty of things that are grown. https://t.co/vZVP5iwmV2", "created_at": "2026-10-16T15:07:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUws_E5XkAAhdzj.jpg"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111080344283967799", "url": "https://x.com/deanwball/status/2111080344283967799", "text": "Huge: The Chinese government moves to place registration and licensing requirements on frontier AI model weights, chip designs, and other key AI technologies.\n\nA registration requirement is effective immediately, with a public comment period over the next month before the more expansive regulations are finalized. \n\nThe draft includes a range of prohibitions and licensing requirements that could shape the evolution of the Chinese AI ecosystem. It also provides simplified pathways for certain open-source releases and a range of excluded areas.\n\nThis is a major step and could give Beijing substantial new leverage over the global spread of Chinese AI. But there are lots of questions about the practical consequences:\n\n—How much will model companies reshape the definitions, thresholds, and processes during the \"consultation\" period?\n\n—What will firms actually start doing to comply in the coming days?\n\n—Will implementation materially restrict the global spread of Chinese models, or chiefly give Beijing greater visibility into—and discretion over—how they spread?", "created_at": "2026-10-16T13:02:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JulianGewirtz", "rt_author_name": "Julian Gewirtz", "likes": 51, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111079831509037431", "url": "https://x.com/deanwball/status/2111079831509037431", "text": "If Chinese players want to open source models above 2T parameters or trained on over 10e26 FLOPS then they will need to get permission from MOFCOM https://t.co/8DR0XKQYUk", "created_at": "2026-10-16T13:00:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zephyr_z9", "rt_author_name": "Zephyr", "likes": 549, "retweets": 42, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUwIM2UbkAEpI0t.jpg"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111021892966469769", "url": "https://x.com/deanwball/status/2111021892966469769", "text": "@GWHayduke97 @siddarthv66 @nabla_theta I see people on this website speculate about my own incentives all the time and they’re mostly wrong when they do it, including right now. The idea that me and roon are optimistic because we are dying to slam the rsi button is just laughable for anyone who knows what is going on.", "created_at": "2026-10-16T09:10:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "GWHayduke97", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110952662829015418", "url": "https://x.com/deanwball/status/2110952662829015418", "text": "@siddarthv66 I think the people you’re referencing are just hopeful, but @nabla_theta works at openai and has been more skeptical. You don’t need to wear a tinfoil hat about everything this company does. We are just people.", "created_at": "2026-10-16T04:35:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "siddarthv66", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110913901743509559", "url": "https://x.com/deanwball/status/2110913901743509559", "text": "After reading for 15 mins: I think Nick is operating in a world where interpretability was just about enumerating the neurons and superposition was an obstacle to that plan, so now he's happy because maybe superposition isn't real. But:\n\n1) there are v few empirical results. Unfortunately interp has a long history of significantly overclaiming how interpretable their findings are (SAEs, early circuits having poor causal scrubbing scores etc) so I'm not updating much at all on the evidence he's already shown. it's really got a long history of people getting overexcited. So looking forward to seeing the paper with all the empirical evidence!\n\n2) I think it's not that big news for me even if true because superposition in something like the average case wasn't my main crux to thinking interpretability is tractable. some cruxes this doesn't really deal with at all:\n- I think the correct 'circuit' is usually just an overwhelmingly large bag of random-seeming heuristics (a la Redwood Research’s interpretation of how an LLM predicts is vs was) and having it isn't very informative/doesn't help with much/doesn't lead to good predictions.\n- More generally, It seems possible to enumerate all the 'low level' features in a neural network, and still have a hard time answering 'high level' questions like: \"Is the model misaligned? / What would it do in this new situation? / If it is misaligned what should we do about it?\" there's an abstraction/emergence gap to cross from the features to the questions of interest, and crossing that gap is likely much harder than enumerating features.\n\nThat said, if his claims hold up, I think it will be quite a big deal, and a useful precursor to tackling the thornier problems! There may also be some useful things to do without tackling the thorny problems: eg we'll be able to make use of masses of automated agents to scour the features and circuits to try and make sense of the mess, and maybe that’s good for something. although I suspect that even the most optimistic outcome here will not make alignment of superhuman AIs much easier (as some on twitter have claimed) because the neuron interpretability will not be adversarially robust, among other issues", "created_at": "2026-10-16T02:01:07+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JakeMendel99", "rt_author_name": "Jake Mendel", "likes": 439, "retweets": 35, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110905689946403211", "url": "https://x.com/deanwball/status/2110905689946403211", "text": "🧲", "created_at": "2026-10-16T01:28:29+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 135, "retweets": 2, "media": [], "quoted": {"author": "timnitGebru", "text": "Lol times are strange when I find myself on the same side as  Yann LeCun and David Sacks.\n\nI find it interesting how he always comes to the conclusions I set out years earlier excerpt that when I first set them out he likes to denigrate my work."}, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110826347723722966", "url": "https://x.com/deanwball/status/2110826347723722966", "text": "My son took his first independent steps today. Between that and the interpretability stuff I’m really overwhelmed with hope, which I have not been in some time.", "created_at": "2026-10-15T20:13:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 576, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111150928997019765", "url": "https://x.com/deanwball/status/2111150928997019765", "text": "This move does not mean “China is shutting down open-weight models,” but it does indicate the Chinese government establishing the optionality to shut down future open-weight models at will. It’s also a mirror image of the model-weight export control regime USG has already used.", "created_at": "2026-10-16T17:42:59+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 6, "media": [], "quoted": {"author": "choblin29", "text": "HOLY. China is moving to put 23 AI technologies under export controls, including large models, AI agents and computing clusters, as part of a sweeping proposal to ban exports of 14 technologies and restrict another 26.\n\nThe rules would ban technology for AI systems that autonomously generate or mutate malware, while AI-assisted vulnerability discovery and overseas deployment of restricted Chinese models would require approval.\n\nAPIs, apps, SaaS and already-public open-source technologies are exempt.\n\nExporters must begin registering covered overseas technology transfers today, before the final controls are adopted. Public consultation closes November 15."}, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111147391546270033", "url": "https://x.com/deanwball/status/2111147391546270033", "text": "The back of the Navier-Stokes milestone shirt is the last line of the chain-of-thought from the solution: https://t.co/W7mK8WmCz1", "created_at": "2026-10-16T17:28:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 4681, "retweets": 226, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUxFtExa4AIniRE.jpg"}], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111456233332834790", "url": "https://x.com/deanwball/status/2111456233332834790", "text": "It’s such a tragedy that friedrich hayek wrote all this amazing stuff about spontaneous orders and how to understand them, all of which is shockingly relevant to ai and should cause you to take “ai as abnormal technology” very seriously, yet Hayek’s most direct intellectual heirs have a tendency to spend their time purveying cope-laden, first-stage-of-grief views on ai, or at least indulging those views more seriously than they should out of a bizarre loyalty to american megacorp lobbyist talking points.", "created_at": "2026-10-17T13:56:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": {"author": "hamandcheese", "text": "Unfortunately it looks increasingly likely that the enduring legacy of the Koch orbit libertarian movement will not be EPA dereg, CON law reform, or a wider appreciation for the role of commercial exchange in instilling cultural virtue and humaneness, but rather the unrestricted proliferation of vastly superhuman forms of machine intelligence as enabled by their dullard ideological progeny who, across several generations of astroturfed indoctrination, mode collapsed into low dimensional caricatures of otherwise brilliant classical liberal thinkers."}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111346162951163972", "url": "https://x.com/deanwball/status/2111346162951163972", "text": "https://t.co/9rED1hEELW", "created_at": "2026-10-17T06:38:46+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111346158648148393", "url": "https://x.com/deanwball/status/2111346158648148393", "text": "“One day I thought I could fly”\n(Wish I knew)\n“One day I woke up and I could fly”\n(Wish I knew)\n“I’d look down and see”\n(Wish I knew)\n“And I wouldn’t know myself”\n(Wish I knew)\n“I’d have new hands, I’d have new feet”\n(Wish I knew)\n“I’d have new vision”\n(Wish I knew)", "created_at": "2026-10-17T06:38:45+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111331217542951173", "url": "https://x.com/deanwball/status/2111331217542951173", "text": "In the bald and barren north, there is a dark sea, the Lake of Heaven. In it is a fish which is several thousand li across, and no one knows how long. His name is K’un. There is also a bird there, named P’eng, with a back like Mount T’ai and wings like clouds filling the sky. He beats the whirlwind, leaps into the air, and rises up ninety thousand li, cutting through the clouds and mist, shouldering the blue sky, and then he turns his eyes south and prepares to journey to the southern darkness.\n\nThe little quail laughs at him, saying, ‘Where does he think he’s going? I give a great leap and fly up, but I never get more than ten or twelve yards before I come down fluttering among the weeds and brambles. And that’s the best kind of flying anyway! Where does he think he’s going?’\n\nSuch is the difference between big and little.", "created_at": "2026-10-17T05:39:23+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111201590426083720", "url": "https://x.com/deanwball/status/2111201590426083720", "text": "Just a reminder that being consistently behind in stable objective time (“6-9 months”) during a time of substantial AI-enabled research acceleration is in fact being behind by a growing amount. A 6-month lag today is subjectively larger than a 6-month lag 6 months ago.", "created_at": "2026-10-16T21:04:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 298, "retweets": 13, "media": [], "quoted": {"author": "EpochAIResearch", "text": "How far behind the closed frontier are open-weight cyber capabilities? About 6–7 months.\n\nZai’s GLM-5.3 is the highest-scoring open-weight model on our Cyber ECI. Its score of 160 beats OpenAI’s GPT-5.4, released in March. https://t.co/F0D6nSnM69"}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111515040280883581", "url": "https://x.com/deanwball/status/2111515040280883581", "text": "@neil_chilson I agree that hayek would have found agent swarms unsurprising, as did I. But why did so few “Hayekian” organizations spend time talking about agent swarms before they happened? Why did they instead focus on parroting 1980s talking points about regulation?", "created_at": "2026-10-17T17:49:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111470121080459773", "url": "https://x.com/deanwball/status/2111470121080459773", "text": "@joshua_saxe correct. not bad faith though.", "created_at": "2026-10-17T14:51:20+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshua_saxe", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111465714619924917", "url": "https://x.com/deanwball/status/2111465714619924917", "text": "@joshua_saxe I didn’t say they are bad faith. I just said their talking points have been wrong and low fidelity", "created_at": "2026-10-17T14:33:50+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "joshua_saxe", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111464895225172010", "url": "https://x.com/deanwball/status/2111464895225172010", "text": "@Borisvest I know you shouldn’t engage with ai replies but this is so dumb", "created_at": "2026-10-17T14:30:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Borisvest", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111463165108310119", "url": "https://x.com/deanwball/status/2111463165108310119", "text": "This isn’t true of everyone, eg Alex tabarrok. But even Tyler Cowen, whom I admire and generally respect on this topic, holds “the doomers” to a vastly higher standard than he does “the bloomers,” and it’s hard not to read this sometimes as a straightforward tribal thing", "created_at": "2026-10-17T14:23:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111462468727800139", "url": "https://x.com/deanwball/status/2111462468727800139", "text": "@dedstik no", "created_at": "2026-10-17T14:20:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "dedstik", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111827316037050832", "url": "https://x.com/deanwball/status/2111827316037050832", "text": "Surprised to learn jensen is 63. He looks great for his age. I’d have guessed early fifties.", "created_at": "2026-10-18T14:30:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "kimmonismus", "text": "Jensen Huang, at 63, is as agile and energetic as others in their 20s. He's the AI ​​rockstar of our time. Insane.\n\nAnd he always has a joke ready. As a German, I didn't feel offended at all; in fact, I burst out laughing at his joke. https://t.co/KizQBVtHbw"}, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111826546663010808", "url": "https://x.com/deanwball/status/2111826546663010808", "text": "@eliebakouch @natolambert Elie, do you mind if I qt some of our earlier exchange to highlight this semantic distinction about “distillation as research method” and “distillation as adversarial cot extraction”? think it is a useful distinction to elaborate but don’t want to put you on blast", "created_at": "2026-10-18T14:27:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111825513807241488", "url": "https://x.com/deanwball/status/2111825513807241488", "text": "@eliebakouch @natolambert much much harder to train classifiers on this than you’d think. false positive rate is crazy high.", "created_at": "2026-10-18T14:23:32+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "eliebakouch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111824389226307600", "url": "https://x.com/deanwball/status/2111824389226307600", "text": "@eliebakouch well, there are limits to what I can say here, but I’d just note there’s space between “useful amount of extracted cot” and “full cot.” Generally I do think researchers and policy people mean quite different things by “distillation.”", "created_at": "2026-10-18T14:19:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "eliebakouch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111822997975601372", "url": "https://x.com/deanwball/status/2111822997975601372", "text": "@heroin_sheikh For sure but attackers do have *some* diffusion lag, plus not all (not most?) cyberattacks are understood publicly right after they happen", "created_at": "2026-10-18T14:13:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "heroin_sheikh", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111818185464832295", "url": "https://x.com/deanwball/status/2111818185464832295", "text": "@natolambert not exclusively about you, no. Below is a post that did big numbers that used the existence of glm 5.3 to “conclude [that] catastrophic AI risk is likely to remain negligible for the foreseeable future.” There has been a lot of this talking point. I’d put you on the vastly more reasonable end of the spectrum but I do think the analysis in your post is a little hasty", "created_at": "2026-10-18T13:54:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "natolambert", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 1, "media": [], "quoted": {"author": "NateWitkin", "text": "Does anyone disagree that pretty much every piece of empirical evidence we have about actually existing AI points toward a labor-augmenting technology with a more-or-less ordinary risk profile (no worse than cars, guns, nuclear power, social media, etc.)?\n\nOn the labor front, the evidence of minimal / inconsequential employment effects so far is undeniably strong (see: https://t.co/xSX5ZXcA9a).\n\nOn the risk front, the recent spate of \"rogue agent\" incidents was akin to a set of natural experiment in which much of what could go wrong did, and the costs were comparable to or less than your typical high-profile cybersecurity breach (several of which happen around the world every month).\n\nNot only that, but the base rate of AI-related hacking incidents is extremely low, and with rare exception, model behavior during real-world use cases is exceedingly well-aligned. \n\nPlus, as Anthropic recently argued (https://t.co/zZcVKYdFY5), the open-source GLM 5.3 is around as capable as Claude Mythos at cyber-exploitation while also having much lower safeguards, meaning that every additional day absent some dire cybersecurity incident is further evidence against catastrophic AI cyber-risk.\n\nTaken together, these facts imply two constraints on arguments in favor of catastrophic AI risk:\n\n1) those arguments must either pass through future, rather than current capabilities, or future, rather than current varieties of AI adoption or implementation (or they must claim we have been unrealistically lucky);\n\n2) those arguments must also must pass through some specific capability or adoption threshold, rather than rapid improvement or adoption as such, since dramatic capability improvement and rapid adoption have already occurred alongside demonstrably low risk of catastrophic harm.\n\nIt is therefore natural that those concerned about catastrophic risk commonly appeal to recursive self-improvement, or RSI in order to make the case that things will get much scarier very soon.\n\nBut as @ramez has convincingly argued (https://t.co/zqenI73Hor), existing data on the reality of RSI within frontier labs neither suggests an inbound trend-break, nor the accelerating returns that might produce one. On the contrary, as is unsurprising to those familiar with the generally log-linear relationship between compute and model performance, all available signs points toward diminishing returns.\n\nAnd this is before considering external factors that could slow capability progress further, including low-hanging fruit effects related to running up against more complex or tacit-knowledge-based tasks for which performance data and verifiable reward signals are scarcer, plausibly incoming financing constraints related to the industry's massive capex commitments (see: https://t.co/HkL9k1SPMZ), growing political backlash, both to data centers in particular, but also rapid AI development writ large, and new regulatory bodies and industry reporting frameworks (see e.g. https://t.co/Q72ZBxGmi6 and https://t.co/pRYeN3C3oX ), which will require labs to proceed with greater caution from here on out.\n\nI am therefore led to conclude both that catastrophic AI risk is likely to remain negligible for the foreseeable future and that the only counterarguments concern massive black-swan-style capability uplifts no existing data imply are on the horizon, and/or particularly irresponsible or dangerous forms of AI adoption that there are also few precedents for so far (and that we are actively developing norms, regulation, and security measures against).\n\nNeither is impossible, meaning we should remain vigilant and that AI safety efforts will continue to be well worth it in the coming years. But I see no way around the conclusion that something akin to the \"normal technology\" view is superior on the empirical and argumentative merits to whatever variety of doomerism.\n\nWhat am I missing?"}, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111816492215861343", "url": "https://x.com/deanwball/status/2111816492215861343", "text": "@eliebakouch Right, but my point is that a big part of distillation in practice involves people stealing cots. It’s not just training on the normal outputs of the model. This is one of the reasons we tend to think of them as “attacks.”", "created_at": "2026-10-18T13:47:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "eliebakouch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111815273242374558", "url": "https://x.com/deanwball/status/2111815273242374558", "text": "As state control breaks down, private security will be a good vector for paramilitaries to form and eventually challenge the existing state's legitimacy by actually protecting people's property and lives", "created_at": "2026-10-18T13:42:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "silexsc", "rt_author_name": "Henry Vaughan", "likes": 35, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111810126352953675", "url": "https://x.com/deanwball/status/2111810126352953675", "text": "@eliebakouch we def do not “know” that. the reasoning traces are extracted at huge scale.", "created_at": "2026-10-18T13:22:24+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "eliebakouch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111807534940185051", "url": "https://x.com/deanwball/status/2111807534940185051", "text": "@eliebakouch I would have guessed distillation explained ~30% of Chinese close-behindness before seeing what one can see within openai, and after that, more like 50%.", "created_at": "2026-10-18T13:12:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "eliebakouch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111805718869463449", "url": "https://x.com/deanwball/status/2111805718869463449", "text": "Generally I sympathize with the &lt;bottlenecks&gt; view of the world by the way.", "created_at": "2026-10-18T13:04:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111805714431644063", "url": "https://x.com/deanwball/status/2111805714431644063", "text": "There are people who say “the changes from AI will take longer than you think because <bottlenecks and institutions and other broad abstractions>,” who also were inclined to believe that AI cyber was an exaggerated risk after GLM 5.3’s weights were public for ~days. This seems like motivated reasoning; you cannot say, “ah, you shouldn’t worry about AI risks overwhelming us through speed alone, because <bottlenecks and diffusion>,” and then also make pronouncements about AI risks after a few days of evidence.", "created_at": "2026-10-18T13:04:52+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 2, "media": [], "quoted": {"author": "KelseyTuoc", "text": "I think this was an interesting point to make but has aged incredibly badly with three significant likely AI-enabled cyberattacks in the ten days since it was posted. https://t.co/FvVcgExiZj , https://t.co/0h9VWeeNjU, https://t.co/jH8iOvyykQ"}, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111802400625311917", "url": "https://x.com/deanwball/status/2111802400625311917", "text": "I haven’t really shared this publicly because people will next-token complete the obvious cope “buhhhh you are just saying that because derrrr” replies but it really is true, regardless of whether you think it’s good or not.", "created_at": "2026-10-18T12:51:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111802397148471496", "url": "https://x.com/deanwball/status/2111802397148471496", "text": "Distillation has always been part of the explanation for why China is so close behind the U.S. in model benchmark performance. But one of my updates after joining openai is that distillation probably plays a bigger role in the explanation than I realized.", "created_at": "2026-10-18T12:51:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 152, "retweets": 11, "media": [], "quoted": {"author": "scaling01", "text": "very curious that DeepSeek now has the same terse reasoning style as Astra\n\nmust be a coincidence https://t.co/lg24P8cbuH"}, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111713447243047129", "url": "https://x.com/deanwball/status/2111713447243047129", "text": "“But if it gets to you\nAnd you feel like you just can’t go on\nAll ya gotta do\nIs ring the bell\nAnd step right up, step right up\nAnd step right up\nJust like a ballerina\nSteppin’ lightly”", "created_at": "2026-10-18T06:58:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111677634765607017", "url": "https://x.com/deanwball/status/2111677634765607017", "text": "@AvidHalaby Doomers may claim this, but not me", "created_at": "2026-10-18T04:35:55+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AvidHalaby", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111590749334904907", "url": "https://x.com/deanwball/status/2111590749334904907", "text": "@firesidealpha Sometimes I wonder how many dollars there are in the world, because super intelligence seems to want them all", "created_at": "2026-10-17T22:50:40+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "elonmusk", "rt_author_name": "Elon Musk", "likes": 8605, "retweets": 459, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111550800271135108", "url": "https://x.com/deanwball/status/2111550800271135108", "text": "@neil_chilson I think ant probably has suffered some credibility harm from the draft legislation, yeah, and I also think the ai safety world is way too militant about the issue of preemption, something I’ve criticized them for very loudly in public and will continue to.", "created_at": "2026-10-17T20:11:56+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111550492463554793", "url": "https://x.com/deanwball/status/2111550492463554793", "text": "@neil_chilson I mean, you replied to me! To be clear I didn’t really have you in mind when I wrote this tweet, and I think the critiques of regulation are super important. I am concerned that the stance many libertarians have taken is untenable and unwise politically, and it’s not just about your credibility but about the credibility of the entire techno-optimist persuasion, of which I consider myself to be a part.", "created_at": "2026-10-17T20:10:42+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111534480695402773", "url": "https://x.com/deanwball/status/2111534480695402773", "text": "@kristianstout @neil_chilson Because Neil’s response was not obviously written by ai.", "created_at": "2026-10-17T19:07:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "kristianstout", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111534142550949983", "url": "https://x.com/deanwball/status/2111534142550949983", "text": "@neil_chilson Mandatory disclosure of frontier safety information is a progressive regulatory program? Huh? In 2024 every libertarian think tank would have dismissed rogue agents as a threat model.\n\nLook, the most difficult thing about this is, it’s not like you don’t have a point that regulation can be destructive. Of course it can. I am a Hayekian and I am very onboard with his skepticism of central planning. But by taking this militant approach against regulation, predicated on the idea that there are no novel threats from AI and the risks are all overblown, you will torch your credibility and, I worry, torch the credibility of the regulation-skeptic, techno-optimist persuasion, to which I consider myself an adherent. This has been my argument forever, and it’s just so frustrating to me that more libertarians do not see this obvious dynamic.", "created_at": "2026-10-17T19:05:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "neil_chilson", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111842549090418956", "url": "https://x.com/deanwball/status/2111842549090418956", "text": "@AndrewCurran_ sounds like it was a fairly modest hindrance that was quickly resolved by being granted access to a trusted access program, so seems ~fine versus the cost of enabling sustained autonomous cyberattacks?", "created_at": "2026-10-18T15:31:14+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AndrewCurran_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 81, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111839733076676887", "url": "https://x.com/deanwball/status/2111839733076676887", "text": "It’ll be interesting in particular if people feel they can self-represent when launching frivolous lawsuits. Lawyers can be punished or suffer reputational damage for truly egregious frivolity, but a non-lawyer cares less about these things.", "created_at": "2026-10-18T15:20:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 41, "retweets": 0, "media": [], "quoted": {"author": "Altimor", "text": "Seeing this in my circles -- several founder friends have told me they've started getting hit with a huge amount of frivolous lawsuits"}, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111838602988576855", "url": "https://x.com/deanwball/status/2111838602988576855", "text": "@ziv_ravid what a horrible analogy. Starbucks sells coffee, they want you to drink it.", "created_at": "2026-10-18T15:15:33+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ziv_ravid", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2112170441817120870", "url": "https://x.com/deanwball/status/2112170441817120870", "text": "Does anyone who follows me know of any promising experimental therapies or medicines for rheumatoid arthritis? I would owe you a very big favor.\n\n(I do not have RA).", "created_at": "2026-10-19T13:14:10+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 73, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112147612535026094", "url": "https://x.com/deanwball/status/2112147612535026094", "text": "HOLY WTF. Reuters is reporting that a Chinese-speaking hacker used AI agents to compromise websites belonging to more than 100 companies, including Deere, SharkNinja and Cummins, after attempting intrusions against over 1,200 sites.\n\nThe estimated cost: roughly $5,000 in AI tokens, or $50 per successful breach. Successful intrusions took around 23 hours on average.\n\nThe attackers used the open-source Cairn agent framework, apparently combining DeepSeek models with a Claude Code harness. One campaign gave its agents instructions in fewer than 100 Chinese characters.\n\nNorForge researcher Snorre Fagerland: 'It's a new world now.'", "created_at": "2026-10-19T11:43:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "choblin29", "rt_author_name": "Choblin", "likes": 684, "retweets": 119, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU_MUu8XAAAUiv4.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU_MkRQW0AAxzG4.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU_Mu8YXQAAeHPw.png"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112121729950572976", "url": "https://x.com/deanwball/status/2112121729950572976", "text": "@kristianstout @neil_chilson if you lack the cogsec to catch the most obvious ai reply guys, you really should get out of the ai commentary game. this one wasn’t hard.", "created_at": "2026-10-19T10:00:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "kristianstout", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "notegone", "text": "@Borisvest @deanwball https://t.co/5h9YcLV4wO"}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111981162784833777", "url": "https://x.com/deanwball/status/2111981162784833777", "text": "@ramez Just an understanding of the size and sophistication of what we see almost literally every hour of every day", "created_at": "2026-10-19T00:42:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ramez", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111970889205989746", "url": "https://x.com/deanwball/status/2111970889205989746", "text": "@ziv_ravid what does that even mean? if I understand you correctly, I don’t how could we even do that without knowing all the details of their training stacks, which we don’t", "created_at": "2026-10-19T00:01:13+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ziv_ravid", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111945709440139315", "url": "https://x.com/deanwball/status/2111945709440139315", "text": "@ziv_ravid unfortunately x only lets you do four images, but I could go on. all of these name names and quantify scale. https://t.co/M8uw6EerOo", "created_at": "2026-10-18T22:21:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "ziv_ravid", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU8jbfNWsAA11ru.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU8jbfOWoAAh6-s.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU8jbfTW0AAmpiD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU8jbfUWUAAlO0Y.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112266302366916710", "url": "https://x.com/deanwball/status/2112266302366916710", "text": "@Fraser_USA @AndrewCurran_ ancient history at this point", "created_at": "2026-10-19T19:35:05+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "Fraser_USA", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112261541114397142", "url": "https://x.com/deanwball/status/2112261541114397142", "text": "@AndrewCurran_ lol", "created_at": "2026-10-19T19:16:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "AndrewCurran_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 31, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112238426216951869", "url": "https://x.com/deanwball/status/2112238426216951869", "text": "Very happy to see Aleks re-join the OpenAI team!", "created_at": "2026-10-19T17:44:18+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 66, "retweets": 0, "media": [], "quoted": {"author": "aleks_madry", "text": "Personal update: Turns out that what I thought was leaving OpenAI became more of a sabbatical.\n\nWhen I left a few months ago, I felt that the most important thing to focus on was making AI more useful to people. But we’ve since entered a different regime of AI progress. One in which getting the safety and security challenges of increasingly capable AI right has to become a central priority.\n\nSo I’ll be returning to OpenAI, joining @merettm to help chart a path through these challenges.\n\nThere’s much work to do, so let’s get going."}, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112238280054026627", "url": "https://x.com/deanwball/status/2112238280054026627", "text": "Personal update: Turns out that what I thought was leaving OpenAI became more of a sabbatical.\n\nWhen I left a few months ago, I felt that the most important thing to focus on was making AI more useful to people. But we’ve since entered a different regime of AI progress. One in which getting the safety and security challenges of increasingly capable AI right has to become a central priority.\n\nSo I’ll be returning to OpenAI, joining @merettm to help chart a path through these challenges.\n\nThere’s much work to do, so let’s get going.", "created_at": "2026-10-19T17:43:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "aleks_madry", "rt_author_name": "Aleksander Madry", "likes": 1144, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112569066967965823", "url": "https://x.com/deanwball/status/2112569066967965823", "text": "strong america indicator that defaulting private prison operators are now marketing their sites as prospective data center locations https://t.co/8O782UoSQO", "created_at": "2026-10-20T15:38:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WillManidis", "rt_author_name": "Will Manidis", "likes": 49, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFTustXUAE8WJS.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112350813267865823", "url": "https://x.com/deanwball/status/2112350813267865823", "text": "Trump Accounts don’t get nearly enough credit for the civic good they are. Americans should have a stake in and benefit from the growth of our markets from birth", "created_at": "2026-10-20T01:10:54+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "poastmilque", "rt_author_name": "grace", "likes": 55, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112310830695866567", "url": "https://x.com/deanwball/status/2112310830695866567", "text": "@junaga10 A loved one suffers from a crippling disease and I am trying to help them by asking my very large and science/tech heavy audience  for advice", "created_at": "2026-10-19T22:32:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "junaga10", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112916960157520120", "url": "https://x.com/deanwball/status/2112916960157520120", "text": "There is not some mysterious magic underlying human intelligence. That doesn’t mean human beings and AI have the same or even vaguely similar moral status, legal rights, etc. But I promise you that if you posit that humans should be uniquely entitled to moral patienthood or legal rights on the basis of our “intelligence,” or “genuine understanding,” in contradistinction to the “mere pattern recognition” of AI, I promise you that you are making a mangled argument that will not stand the test of the time and is liable to crumble at the hand of stochastic gradient descent.\n\nI think humans DO have unique moral status and am OPPOSED to ascribing consciousness, ensoulment, sentience, or similar to AI. I am opposed to giving AI human-like legal rights. But it pains me to see religious and moral leaders making these arguments on the basis of human cognition in particular, precisely because I agree with them and want this point of view to be defensible in the long term. \n\nYou can believe humans are special without believing that our specialness is purely the product of our intelligence.", "created_at": "2026-10-21T14:40:34+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112914466543411249", "url": "https://x.com/deanwball/status/2112914466543411249", "text": "@motorhueso @MiguelNicolelis that’s not remotely what I said. how could you allow yourself to ascribe such a horrendous view to other people with no evidence? something so dehumanizing to your fellow man? I have children too you know.", "created_at": "2026-10-21T14:30:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "motorhueso", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112913517518917915", "url": "https://x.com/deanwball/status/2112913517518917915", "text": "OpenAI models helped researchers—operating as part of our Patch the Planet initiative—discover critical security flaws in PHP, an open-source programming language used to run an estimated 70% of websites.\n\nOver the past two months, we led a coalition of maintainers, researchers, and security providers to prepare fixes and protections ahead of disclosure. This duration was necessary because the fix was quite intricate and required a major change to the PHP engine. Every site using PHP can now safely upgrade their version to stay secure, in addition to applying mitigations from various security vendors.\n\nDue to the severity of these flaws and PHP’s widespread use, we consider this bug to be one of the most impactful vulnerabilities in recent memory. It also marks a new phase, where AI can find security bugs with internet-scale impact. \n\nThis is an example of the Defender’s Window in action: to our knowledge, frontier AI was able to find this vulnerability ahead of attackers, giving defenders time to prepare.\nhttps://t.co/TW3jrSbB3f", "created_at": "2026-10-21T14:26:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 7070, "retweets": 1582, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112908426116530663", "url": "https://x.com/deanwball/status/2112908426116530663", "text": "One of my pet peeves is when people dismiss what ai does as “pattern recognition.” Not because I think ai is doing something grander, but for the opposite reason: intelligence IS pattern recognition (ie compression).", "created_at": "2026-10-21T14:06:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112905908451737868", "url": "https://x.com/deanwball/status/2112905908451737868", "text": "There is a common view in the new right, particularly the downstream-of-thiel part of the new right, that the rise digital technology and financial services caused american stagnation. This was and I guess still is a fashionable view. “Innovation in bits, but not atoms”; “where is my flying car?” etc. I have heard it suggested, for example, that nuclear fusion could have happened sooner if the physics PhDs hadn’t disproportionately been tempted away from scientific R&D and into working on statistical-mechanics problems in finance and tech. \n\nThis view turned out to be almost entirely the product of negativity bias toward the status quo. If we solve fusion it will be paid for by the ai industry, and will also be aided by ai itself. If we cure cancer we will do it using chips designed originally to play video games. The achievement of almost all the technological dreams of the thielian dynamists will happen because of algorithmic research subsidized by, and in some cases done in service of, serving people digital ads and quantitative trading, the things the thielian dynamists say are so bad.\n\nThe tech industry was right, and the markets were right: the best use of those physicists’ time was not in the lab working on fusion reactors, it really was on the trading floor in New York, or the standing desk in Menlo Park.", "created_at": "2026-10-21T13:56:39+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 8, "media": [], "quoted": {"author": "tylermacro10", "text": "Verdict: basically accurate\n\nRemember when J.D. Vance pretended that we “De-industrialized” because Wall Street &amp; the $???\n\nOh yeah I do."}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112901713506263313", "url": "https://x.com/deanwball/status/2112901713506263313", "text": "@tylermacro10 I am not a JD hater but yes this is a bad opinion that has self-replicated in the minds of a large swath of the “new right,” especially the broadly-downstream-of-thiel wing of the new right, which has this tendency to see “finance” and “dynamism” as being in tension", "created_at": "2026-10-21T13:39:58+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "tylermacro10", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112899123573625242", "url": "https://x.com/deanwball/status/2112899123573625242", "text": "American chattering classes love to hate our country’s financial services sector, but mark my words: the depth and versatility of U.S. capital markets will be our mightiest weapon in the singularity. Anti-finance sentiment, still fashionable on both left and right, is low IQ.", "created_at": "2026-10-21T13:29:41+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 459, "retweets": 45, "media": [], "quoted": {"author": "ryajetha", "text": "What a lede from @TheEconomist https://t.co/wmNgsFxoW4"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112897405398258140", "url": "https://x.com/deanwball/status/2112897405398258140", "text": "Oh my god… the pensions and endowment funds… they're making investments… in securities!", "created_at": "2026-10-21T13:22:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "silexsc", "rt_author_name": "Henry Vaughan", "likes": 20, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112868472078082176", "url": "https://x.com/deanwball/status/2112868472078082176", "text": "Dear god it's inventing German from first principles", "created_at": "2026-10-21T11:27:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_ch
