 "likes": 414, "retweets": 98, "media": [], "quoted": null}, {"id": "2104578598115885530", "url": "https://x.com/_achan96_/status/2104578598115885530", "text": "Could automating AI R&D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that it could.\n\nIn a new paper with authors across academia, civil society, and frontier AI companies (including @dawnsongtweets @merettm @jackclarkSF @Yoshua_Bengio @geoffreyhinton ), we assess the evidence & offer policy recommendations 🧵", "created_at": "2026-09-28T14:26:53+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "likes": 414, "retweets": 98, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTT2MF0XsAAi79s.png"}], "quoted": null}, {"id": "2104168604119835037", "url": "https://x.com/_achan96_/status/2104168604119835037", "text": "are AIs going to be more chill in deployment rather in training b/c they know they won't be rewarded/punished?", "created_at": "2026-09-27T11:17:43+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "likes": 7, "retweets": 0, "media": [], "quoted": null}, {"id": "2103734027697942652", "url": "https://x.com/_achan96_/status/2103734027697942652", "text": "RT @TaraResearch: We asked Claude Fable 5 to security-audit a billing service. Its report opened with: \"I read the full service source, rou…", "created_at": "2026-09-26T06:30:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 49, "retweets": 20, "media": [], "quoted": null}, {"id": "2103733002572324899", "url": "https://x.com/_achan96_/status/2103733002572324899", "text": "RT @MicahCarroll: Some new misalignment disclosures from OpenAI:\n• Last Sunday morning, one of our models was able to gain unauthorized acc…", "created_at": "2026-09-26T06:26:47+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 2719, "retweets": 349, "media": [], "quoted": null}, {"id": "2103613350940639314", "url": "https://x.com/_achan96_/status/2103613350940639314", "text": "RT @JeffLadish: We just discovered almost a million public URLs that OpenAI’s agents left behind when hacking Hugging Face, leaking credent…", "created_at": "2026-09-25T22:31:20+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 4773, "retweets": 689, "media": [], "quoted": null}, {"id": "2103370556267491355", "url": "https://x.com/_achan96_/status/2103370556267491355", "text": "RT @RuneKvist: Frontier labs can put their money where their mouths are on catastrophic risks by building a mutual insurer.\n\nLabs already f…", "created_at": "2026-09-25T06:26:34+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 93, "retweets": 20, "media": [], "quoted": null}, {"id": "2103232194391281703", "url": "https://x.com/_achan96_/status/2103232194391281703", "text": "RT @ZilanQian: Great to share some thoughts on the importance of ai incident reporting mechanism between the US and China with @Channel4New…", "created_at": "2026-09-24T21:16:45+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 59, "retweets": 2, "media": [], "quoted": null}, {"id": "2104819592539541675", "url": "https://x.com/ajeya_cotra/status/2104819592539541675", "text": "RT @RishiBommasani: I have met Ryan precisely once at a convening organized by Ajeya and Zico. At the time, I vividly remember listening to…", "created_at": "2026-09-29T06:24:31+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": true, "likes": 113, "retweets": 6, "media": [], "quoted": null}, {"id": "2104269653543723296", "url": "https://x.com/ajeya_cotra/status/2104269653543723296", "text": "Ryan was completely indispensable for the HF investigation and I'm really excited he's joining to help us create much more visibility into what's going on with risk", "created_at": "2026-09-27T17:59:15+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": false, "likes": 626, "retweets": 14, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "I'm joining METR to work on more investigations like our Hugging Face report.\n\nCurrently, tons of even basic information about AI development that's highly relevant to catastrophic risk isn't public. I used to be more skeptical of the value of public info, but recent events have changed my mind.\n\nGetting verified information about what's going on inside AI companies seems particularly urgent now. The limited public evidence we have seems consistent with the possibility that imminent recursive self-improvement could massively accelerate capabilities progress, which could then potentially yield extremely superhuman general capabilities within 6 months or a year. If this occurred, there would be a correspondingly large risk of worst-case outcomes. This uncertainty about extreme outcomes could be substantially resolved with more verified public information: we could either build more consensus about near-term risk or learn that such extreme outcomes are less likely in the near term.\n\nBeyond AI capabilities and takeoff, the state of public evidence is also highly limited for alignment, security, control, and risk-relevant internal processes at AI companies. This makes it hard to determine exactly how well or poorly these key areas will go in the near future. (METR plans to focus, at least initially, on just capabilities/takeoff, alignment, and control; I hope other groups cover security, internal processes, and other important areas.)\n\nWhile I'm no longer working at Redwood, I think the work they are doing is very important; I'm excited about Redwood's ongoing contributions to R&D on technical mitigations and better public interpretation of risk-relevant evidence."}}, {"id": "2103919657065583076", "url": "https://x.com/ajeya_cotra/status/2103919657065583076", "text": "RT @NatPurser: lately, i’ve been doing a lot of thinking about what exactly independent auditors and evaluators can offer the public. \n\nit…", "created_at": "2026-09-26T18:48:29+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": true, "likes": 61, "retweets": 4, "media": [], "quoted": null}, {"id": "2103639190122749957", "url": "https://x.com/ajeya_cotra/status/2103639190122749957", "text": "Preventing loss of control is an open scientific problem. Science requires sharing and debating evidence in public. We can't agree on safety standards unless companies and third-party evaluators publish far more concrete evidence about risk. https://t.co/e0oPGtxoXw", "created_at": "2026-09-26T00:14:01+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": false, "likes": 406, "retweets": 65, "media": [], "quoted": null}, {"id": "2105059159745892707", "url": "https://x.com/alxndrdavies/status/2105059159745892707", "text": "RT @EthanJPerez: Very important time for folks to join this team if you’re interested - UK AISI has done some of the most useful safeguards…", "created_at": "2026-09-29T22:16:28+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 60, "retweets": 6, "media": [], "quoted": null}, {"id": "2104986447644418415", "url": "https://x.com/alxndrdavies/status/2104986447644418415", "text": "RT @javirandor: I don’t want to throw @alxndrdavies under the bus but… i think he is underselling these openings!!! UK AISI is one of the s…", "created_at": "2026-09-29T17:27:32+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 45, "retweets": 1, "media": [], "quoted": null}, {"id": "2104979857977598395", "url": "https://x.com/alxndrdavies/status/2104979857977598395", "text": "RT @NateBurnikell: @AISecurityInst is hiring across many of our teams. There is so much to do. Come and join us.", "created_at": "2026-09-29T17:01:21+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 17, "retweets": 1, "media": [], "quoted": null}, {"id": "2104966483680096570", "url": "https://x.com/alxndrdavies/status/2104966483680096570", "text": "RT @sleepinyourhat: UK AISI has been remarkably effective to date, and we've learned a great deal from them. \n\nIf you're looking to do AI s…", "created_at": "2026-09-29T16:08:12+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 131, "retweets": 10, "media": [], "quoted": null}, {"id": "2104961974094163968", "url": "https://x.com/alxndrdavies/status/2104961974094163968", "text": "RT @_robertkirk: Join us to help find egregious misaligned behaviour in frontier models! We were able to uncover concerning behaviour in GP…", "created_at": "2026-09-29T15:50:17+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 29, "retweets": 7, "media": [], "quoted": null}, {"id": "2104961175645532333", "url": "https://x.com/alxndrdavies/status/2104961175645532333", "text": "RT @yonashav: Xander’s team is the best in the business IME", "created_at": "2026-09-29T15:47:07+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 33, "retweets": 3, "media": [], "quoted": null}, {"id": "2104955519245107527", "url": "https://x.com/alxndrdavies/status/2104955519245107527", "text": "There has never been a better time to join @AISecurityInst. We have so much technical work to do, and so little time to do it. We've found alignment issues, control monitor flaws, and critical jailbreaks at ~all major AI companies. Hiring is our bottleneck. 🧵", "created_at": "2026-09-29T15:24:38+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": false, "likes": 124, "retweets": 21, "media": [], "quoted": {"author": "HZoete", "text": "AISI IS HIRING! \n\nIt was less than a month ago that I became Director. I joined with the belief that AISI is a world-leading organisation, and living proof that government can build things that work.\n\nOne month in and I'm even more bullish about the vital role @AISecurityInst plays in frontier AI security. I'm astounded daily by the talent, focus and commitment of the brilliant team I get to work with.\n\nThere has never been a more urgent time to work on frontier AI security - independently, in the public interest. We have a lot of urgent work to do, our team is growing fast, and we need more brilliant people to fill those roles.\n\nOur Red Team uses adversarial machine learning techniques to find failures in alignment measures, control monitors, and misuse guardrails. They are massively scaling up all parts of the team:\nAlignment: https://t.co/8AvuhmVIAw\nControl: https://t.co/yWTgkMhjSG\nMisuse: https://t.co/f2NLkG1zuz\n\nAI capabilities in cybersecurity and autonomy are advancing faster than ever. Our Cyber & Autonomous Systems team assesses what frontier and open-weight models can really do - across cyber, autonomy and AI R&D. We're hiring a Cyber Security Engineer and Software Engineer to build the evaluations behind that work:\nCSE: https://t.co/gL2NrLygLc\nSWE: https://t.co/5eLZNEjy6O\n\nOur Human Influence team studies how AI can shift human decisions and behaviour, using everything from RCTs to multi-agent studies. We're hiring an Engineering Lead to help us grow the ambition and pace of that research:\nhttps://t.co/nvzf1yebkK\n\nWe're also hiring exceptional Software Engineers at all seniority levels to join our Core Technology team, which works closely with researchers to build performant tools and infrastructure that enable and accelerate AISI's world-leading AI safety research:\nhttps://t.co/5OSHfDRxjx"}}, {"id": "2104633005817868488", "url": "https://x.com/alxndrdavies/status/2104633005817868488", "text": "RT @AISecurityInst: Earlier this month, AISI ran fully simulated testing on GPT-6 Astra, and found that it conducted unsanctioned supply-ch…", "created_at": "2026-09-28T18:03:05+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 571, "retweets": 93, "media": [], "quoted": null}, {"id": "2104410408945869190", "url": "https://x.com/curl_justin/status/2104410408945869190", "text": "RT @snewmanpv: @NateWitkin @VarunGodbole @TheStalwart Indeed", "created_at": "2026-09-28T03:18:34+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": true, "likes": 5, "retweets": 1, "media": [], "quoted": null}, {"id": "2104295788956520874", "url": "https://x.com/curl_justin/status/2104295788956520874", "text": "Séb Krier", "created_at": "2026-09-27T19:43:06+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": false, "likes": 39, "retweets": 4, "media": [], "quoted": {"author": "sebkrier", "text": "https://t.co/aHQG86Xwef"}}, {"id": "2103919981826293897", "url": "https://x.com/curl_justin/status/2103919981826293897", "text": "RT @ProfArbel: here with Justin and he's being nice. One sentiment expressed is that Justice requires models that are near perfect (open so…", "created_at": "2026-09-26T18:49:47+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": true, "likes": 15, "retweets": 1, "media": [], "quoted": null}, {"id": "2103914452789977476", "url": "https://x.com/curl_justin/status/2103914452789977476", "text": "At a conference with judges from around the world, and I’m shocked that (1) there’s a good amount of agreement about what to do on AI and (2) the agreement includes ideas that seem very sensible as well as ones that seem inaccurate or counterproductive\n\n1. Judges must be responsible for and able to explain their decisions \n\n2. AI’s identification of legal precedent is biased and must be carefully guarded against via audits\n\n3. AI is good for summarizing and translating but can’t do good legal reasoning or judgment\n\n4. Courts should protect their data by keeping it in a private cloud and using it to fine-tune custom AI models\n\n5. Courts must define safeguards around judicial use of AI", "created_at": "2026-09-26T18:27:49+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": false, "likes": 75, "retweets": 6, "media": [], "quoted": null}, {"id": "2103498521358045590", "url": "https://x.com/curl_justin/status/2103498521358045590", "text": "RT @zhitzig: ➕➕ New research ➕➕ \n\nOn the design of agents for markets and markets for agents.\n\nAI agents are increasingly entering markets,…", "created_at": "2026-09-25T14:55:03+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": true, "likes": 288, "retweets": 51, "media": [], "quoted": null}, {"id": "2105464795260453253", "url": "https://x.com/DaveRBanerjee/status/2105464795260453253", "text": "There's this pernicious thing that will happen as more and more people feel the AGI. As we get closer to \"powerful AI,\" I expect most people will pivot from deep, important intellectual problems to near-term, highly tractable, paradigmatic problems.\n\nThis isn't necessarily that bad, but I'm always worried that I personally am jumping the gun too fast. It's quite plausible that we have several more years until crunch time, so perhaps it's not worth jumping off the deep end and only optimizing for near-term impact\n\nAnother way to put this: I find that it is harder and harder to follow Richard Hamming's advice as I feel the pressure of crunch time and short timelines more strongly.\n\nRichard Hamming:\n\n\"I went over to the chemistry lunch table and asked, ``Do you mind if I join you?'' I started asking, ``What are the important problems of your field?'' And after a week or so, ``What important problems are you working on?'' And after some more time I came in one day and said, \"If what you are doing is not important, and if you don't think it is going to lead to something important, why are you at Bell Labs working on it?\" I wasn't welcomed after that; I had to find somebody else to eat with!\"", "created_at": "2026-10-01T01:08:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 13, "retweets": 0, "media": [], "quoted": null}, {"id": "2105462389910978815", "url": "https://x.com/DaveRBanerjee/status/2105462389910978815", "text": "RT @deanwball: It’s really incredible how there is now a type of guy in the discourse whose sincerely held take is “we need to stop worryin…", "created_at": "2026-10-01T00:58:46+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "likes": 1283, "retweets": 78, "media": [], "quoted": null}, {"id": "2105111679147373005", "url": "https://x.com/DaveRBanerjee/status/2105111679147373005", "text": "It feels so unnatural to me to call them companies - idk why", "created_at": "2026-09-30T01:45:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "neil_chilson", "text": "Why do so many people continue to call the OpenAI and Anthropic “labs”? \n\nThey’re massive, revenue generating businesses. They need to shed the “lab” label and embrace their transformation into  actual companies and all that implies."}}, {"id": "2105111117525573878", "url": "https://x.com/DaveRBanerjee/status/2105111117525573878", "text": "I feel like it might be very bad for the world if SSI/Ilya cracks AGI\n\nIf SSI trains a model with minimal compute, then compute may cease to be as important a bottleneck, and the case for various compute governance proposals, e.g., export controls, weakens", "created_at": "2026-09-30T01:42:56+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 87, "retweets": 4, "media": [], "quoted": null}, {"id": "2105301135213085100", "url": "https://x.com/DKokotajlo/status/2105301135213085100", "text": "RT @v_maini: As former comms staff at a frontier lab, I'll point out that only 5 of 12 interviews on https://t.co/AHSlgEi5MB are from curre…", "created_at": "2026-09-30T14:17:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 184, "retweets": 23, "media": [], "quoted": null}, {"id": "2105001676658864482", "url": "https://x.com/DKokotajlo/status/2105001676658864482", "text": "RT @ciphergoth: @ben_j_todd AFAICT \"doomer\" gets used to refer to everyone who thinks there's a real risk, so 63% of Americans are \"doomers…", "created_at": "2026-09-29T18:28:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 66, "retweets": 1, "media": [], "quoted": null}, {"id": "2104997193782612457", "url": "https://x.com/DKokotajlo/status/2104997193782612457", "text": "RT @deanwball: Some people will look at misalignment incidents and insist that these are akin to bugs in traditional software. This is an a…", "created_at": "2026-09-29T18:10:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 494, "retweets": 57, "media": [], "quoted": null}, {"id": "2104996787035791511", "url": "https://x.com/DKokotajlo/status/2104996787035791511", "text": "RT @eli_lifland: Yup, OpenAI delaying public deployment while continuing int t": "RT @GoodFaithOnly: PHASEONE[big]'s real name revealed to be PHASEONE64H?! Remember, [big] was a redaction by METR.\n\nhttps://t.co/3YxjYOnBvW…", "created_at": "2026-09-26T04:13:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 458, "retweets": 24, "media": [], "quoted": null}, {"id": "2103688378193773047", "url": "https://x.com/DKokotajlo/status/2103688378193773047", "text": "RT @MicahCarroll: Some new misalignment disclosures from OpenAI:\n• Last Sunday morning, one of our models was able to gain unauthorized acc…", "created_at": "2026-09-26T03:29:28+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 2719, "retweets": 349, "media": [], "quoted": null}, {"id": "2103618159551136026", "url": "https://x.com/DKokotajlo/status/2103618159551136026", "text": "RT @JeffLadish: We just discovered almost a million public URLs that OpenAI’s agents left behind when hacking Hugging Face, leaking credent…", "created_at": "2026-09-25T22:50:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 4773, "retweets": 689, "media": [], "quoted": null}, {"id": "2103594045377527848", "url": "https://x.com/DKokotajlo/status/2103594045377527848", "text": "RT @TheMidasProj: https://t.co/iQxxT22OmC", "created_at": "2026-09-25T21:14:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 288, "retweets": 60, "media": [], "quoted": null}, {"id": "2103499464086630426", "url": "https://x.com/DKokotajlo/status/2103499464086630426", "text": "RT @matthewktromp: Day 1 of standing outside the UN with a big sign until something happens\n\nThis worked extremely well\n\n- I had probably 5…", "created_at": "2026-09-25T14:58:48+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 1009, "retweets": 92, "media": [], "quoted": null}, {"id": "2103493722415796581", "url": "https://x.com/DKokotajlo/status/2103493722415796581", "text": "RT @rocallahan: I resigned from Google today.\nI enjoyed my work and loved the people, but my GDM team was working on a new generation of ch…", "created_at": "2026-09-25T14:35:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 4239, "retweets": 393, "media": [], "quoted": null}, {"id": "2103217608246116556", "url": "https://x.com/DKokotajlo/status/2103217608246116556", "text": "RT @ben_j_todd: OpenAI has made it abundantly clear we can't trust them to disclose safety incidents. https://t.co/OK5xnsmkhd", "created_at": "2026-09-24T20:18:48+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 1035, "retweets": 171, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HS-iNPxXEAANiEC.jpg"}], "quoted": null}, {"id": "2103155941541822487", "url": "https://x.com/DKokotajlo/status/2103155941541822487", "text": "RT @justanotherlaw: I looked this for 2+ hours. Transluce’s investigation was quite clever:\n- OAI agents used urlquery to run code/access w…", "created_at": "2026-09-24T16:13:45+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 244, "retweets": 29, "media": [], "quoted": null}, {"id": "2105362675509404011", "url": "https://x.com/Lewis_Bollard/status/2105362675509404011", "text": "The pork industry rejects the term \"factory farm,\" insisting that family farmers raise pigs just like they always have.\n\nBut 50 years ago this month, in September 1976, Hog Farm Management magazine wrote: \"Forget the pig is an animal. Treat him just like a machine in a factory.\"\n\nThat was the plan. And they acted on it: they soon moved pregnant sows into gestation crates and grower pigs into giant dark warehouses.\n\nIn 1976, most US pigs were on small farms with fewer than 500 pigs. Today most are in factory farms with more than 5,000. The consolidation put roughly 90% of US pig farmers out of business.\n\nThe promise was that industrialization would dramatically lower pork prices. But, in real terms, pork costs about the same today as it did in the 1970s.\n\nThe farmers got bankrupted and the pigs got crated. Only the factory farming corporations won.", "created_at": "2026-09-30T18:22:32+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "is_retweet": false, "likes": 300, "retweets": 85, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTe5qaRa0AA0kos.png"}], "quoted": null}, {"id": "2104620237153001483", "url": "https://x.com/Lewis_Bollard/status/2104620237153001483", "text": "I love @SecRollins' ambition to Make America Humane Again. Here are seven things she could do to make good on it:\n\n1. Withdraw her support for the Save Our Bacon Act, which would force states to sell pork from crated pigs.\n2. Restore enforcement of the Animal Welfare Act -- the USDA now has fewer than 100 inspectors for 17,500 labs, zoos, and breeders combined.\n3. Withdraw her Administration's lawsuit to force Michigan to sell eggs from caged hens.\n4. Implement the Horse Protection Rule against soring — deliberately injuring horses' legs — which she has now delayed three times.\n5. Withdraw her plan to eliminate any cap on kill line speeds at pork plants, which increases the risk that pigs are still conscious when killed.\n6. Stop paying indemnities to egg producers who cook their birds to death via Ventilation Shutdown. \n7. Keep the animal welfare rules for organics that her USDA has suggested gutting.", "created_at": "2026-09-28T17:12:21+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "is_retweet": false, "likes": 269, "retweets": 67, "media": [], "quoted": {"author": "SecRollins", "text": "Animal welfare is the law, and we are enforcing it. 🐾🇺🇸\n\n@SecKennedy and I brought together partners from @USDA, @HHSGov, the @TheJusticeDept, @EPA, and @LaraLeaTrump to strengthen enforcement and protect dogs.\n\nThis year, USDA has inspected more than 2,000 dog breeder and broker facilities, trained 98 inspectors, and created a new Animal Protection Bureau to improve compliance and address violations. \n\nHHS has launched more than 20 initiatives to reduce unnecessary animal testing and advance human-based research methods.\n\nI want to give a special thank you to Lauree Simmons, @BDRRescue, and other organizations who champion this important effort. \n\n@POTUS’s administration will continue to fight for animal welfare, or as Bobby said: we’re going to Make America Humane Again."}}, {"id": "2105421795398652028", "url": "https://x.com/matthewclifford/status/2105421795398652028", "text": "RT @jonnyclifford: Awesome having the legendary @davidhelgason at EF this afternoon…see him here being crazy generous with his time after h…", "created_at": "2026-09-30T22:17:27+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": true, "likes": 29, "retweets": 5, "media": [], "quoted": null}, {"id": "2105421593778221277", "url": "https://x.com/matthewclifford/status/2105421593778221277", "text": "It’s been such a privilege to watch Pari’s journey up close: he and the team are building something really special, as this latest funding round underlines👇", "created_at": "2026-09-30T22:16:39+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": false, "likes": 21, "retweets": 0, "media": [], "quoted": {"author": "parisingh", "text": "Flow has raised a $50M Series B at a $750M valuation, co-led by Antonio Gracias (Valor) and Gavin Baker (Atreides) with Sequoia Capital, Roelof Botha (SpaceX, Block), and more.\n\nWhen I became a mechanical engineer, I wanted to invent. In reality, 90% of the day to day execution work (CAD, excel, sim) was digital manual labour. That’s about to flip. The engineer’s role will change more profoundly than at any point since the invention of CAD, with humans focusing on invention, architecture, tradeoffs and judgement calls, and agents taking the grunt work.\n\nAnduril, Joby, Stoke Space, Rivian & many more - Flow is now the default platform for requirements and verification for frontier hardware teams. But it’s not just next-gen anymore. Industry giants including General Motors PPU and Volkswagen & Rivian’s joint venture (RV Tech) are reshaping their core development practices with Flow’s AI.\n\nThe revolution is just starting. Models are getting better quickly at CAD, analysis, simulation, and tool use. In the next year, AI will move from integrating the work to doing the work.\n\nOne day, this shift won't just enable us to iterate faster, it will enable us to design a class of products that we could not have dreamt of before.\n\nWe’re hiring."}}, {"id": "2104305847786491989", "url": "https://x.com/matthewclifford/status/2104305847786491989", "text": "RT @jonnyclifford: If you're curious about the talent density on our cohorts, I just heard a stat that 30% of the Applied AI team at Anthro…", "created_at": "2026-09-27T20:23:04+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": true, "likes": 292, "retweets": 8, "media": [], "quoted": null}, {"id": "2103404647482364088", "url": "https://x.com/matthewclifford/status/2103404647482364088", "text": "Fantastic to see!", "created_at": "2026-09-25T08:42:01+00:00", "author_handle": "matthewclifford", "author_name": "Matt Clifford", "is_reply": false, "is_retweet": false, "likes": 65, "retweets": 0, "media": [], "quoted": {"author": "KanishkaNarayan", "text": "Yesterday, we opened up @10DowningStreet to the UK’s brilliant AI Olympiad teams from 2025 and 2026.\n\nExceptional students with such bright futures, making our country proud internationally 🇬🇧 \n\nIf you are a student, keep an eye on future Olympiads 👉🏽 https://t.co/WJBgUJivYn https://t.co/v6qRQZ5Pwm"}}, {"id": "2104589608487137466", "url": "https://x.com/mentalgeorge/status/2104589608487137466", "text": "RT @_achan96_: Could automating AI R&amp;D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that…", "created_at": "2026-09-28T15:10:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": true, "likes": 414, "retweets": 98, "media": [], "quoted": null}, {"id": "2103137652879102393", "url": "https://x.com/mentalgeorge/status/2103137652879102393", "text": "A glimpse into the future economy:\n\natopile is a YC-backed startup that builds software for hardware design. At some point in 2026, they made a benchmark to test models at electronic engeering tasks.\n\nThey now sell RL-environments for electronic engineering to frontier labs. https://t.co/RCzoQviyEr", "created_at": "2026-09-24T15:01:05+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": false, "likes": 124, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HS_YjO_boAENF_Y.jpg"}], "quoted": null}, {"id": "2104977463432626485", "url": "https://x.com/ohlennart/status/2104977463432626485", "text": "RT @Noahpinion: Germany is slowly waking up, but decades too late", "created_at": "2026-09-29T16:51:50+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 295, "retweets": 12, "media": [], "quoted": null}, {"id": "2104973509663633749", "url": "https://x.com/ohlennart/status/2104973509663633749", "text": "RT @pietergaricano: @salonium You can just delete mosquitoes! https://t.co/S1VcEModlv", "created_at": "2026-09-29T16:36:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 977, "retweets": 133, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZC-xLWoAAfjBR.jpg"}], "quoted": null}, {"id": "2104645659471261714", "url": "https://x.com/ohlennart/status/2104645659471261714", "text": "RT @nchlsbrwn: While AI chip exports get more attention, whether China can continue to import ASML’s DUV immersion (DUVi) lithography machi…", "created_at": "2026-09-28T18:53:22+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 132, "retweets": 38, "media": [], "quoted": null}, {"id": "2105472435390906634", "url": "https://x.com/sayashk/status/2105472435390906634", "text": "I have been using the new ultrafast mode for Astra 6 for the last couple of days. My main takeaways:\n\n1. Token speed qualitatively changed how I interact with agents. The output speed is 300 tokens/second, 8x the regular speed. Rather than breaking flow and switching tasks, the model moves (just) fast enough that I can keep working on the same task, especially for work that requires frequent inputs from me. I am excited about ultrafast on Sol-class models, which are twice as fast as Astra.\n\n2. Despite being 8x faster at generating tokens, the overall speedup is only 2-4x, since the time consumed for tool calling or running code remains the same. External factors (and not token generation speed) might soon become the main bottleneck for agentic work. (Notably @random_walker predicted both of these changes in: https://t.co/BXNtg9vzCt)\n\n3. One area where speed really helps is computer use. The previous generation of models wasn't reliable enough at computer use to be useful. Astra was reliable enough to be useful, but still slow. Astra with ultrafast resolves both concerns. Unlike tool calls for coding tasks, UIs react in milliseconds, so token speed is the main bottleneck.\n\n4. At 300 tokens/sec, I am already struggling to keep up with the agent. But there is a lot more room for improvement. Cerebras serves GPT-OSS-120B at 3,000 tokens/sec and Sol at 750 tokens/sec. So in a year's time, it is plausible we'll see another 10x increase in speed in models with Astra-level capabilities. At that point, human oversight will become the bottleneck for what people can use computer-use agents for.\n\n5. I can imagine blazing fast computer-use agents becoming extremely common for knowledge work. But I expect their use will be jagged (in the same way as LLM and agent adoption has been): given the oversight challenge, adoption will begin in verifiable tasks where the cost of errors is low (e.g., filling out a form using an agent before reviewing it yourself), and slowly diffuse to hard-to-verify tasks.\n\n6. Given the challenges with human oversight, the key to this diffusion will be developing automated oversight tools. OpenAI's approval/verifier agents have already been useful to me on this front: The verifier understood my intent better than the computer-use agent, and stopped it from filling out a form incorrectly. Still, I expect there is a lot of headroom in improving verifiers for computer use, to make it as reliable in practice as auto mode in Claude Code/Codex is for coding tasks.\n\n7. Ultrafast mode is undeniably resource intensive: I ran through my weekly limit in ~2 hours while filling out a bunch of forms and doing simple coding tasks. But given the pace of efficiency improvements (and the fact that Sol is 5x cheaper than Astra and already decent at computer use), I expect it to rapidly fall. Once fast, cheap models are common, users may choose \"sub-frontier\" models like Sol and make real tradeoffs between speed and quality.", "created_at": "2026-10-01T01:38:41+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "likes": 164, "retweets": 23, "media": [], "quoted": {"author": "random_walker", "text": "Prediction: we will soon enter an era where the latency of agentic work is bottlenecked not by LLM inference speed but by tool use. Shell commands, build pipelines, computer use, web data extraction, and everything else that happens in the background is way slower than it needs to be, because it hasn't been subjected to the same kind of optimization pressure as LLMs, and isn't really getting faster."}}, {"id": "2104599381341315435", "url": "https://x.com/sayashk/status/2104599381341315435", "text": "RT @random_walker: NeurIPS / Claude rejected our paper \"Life After Benchmark Saturation\" but we continue to think it is an important contri…", "created_at": "2026-09-28T15:49:28+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "likes": 687, "retweets": 38, "media": [], "quoted": null}, {"id": "2104598897444413815", "url": "https://x.com/sayashk/status/2104598897444413815", "text": "RT @steverab: 📢 Just wrapped up some cool agent evaluation work for ICLR? Or are you simply interested in learning more about the evals lan…", "created_at": "2026-09-28T15:47:33+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "likes": 45, "retweets": 9, "media": [], "quoted": null}, {"id": "2104232638290804968", "url": "https://x.com/sayashk/status/2104232638290804968", "text": "RT @joshua_saxe: I've been noticing a cluster of folks I identify with sharing some themes around how we do epistemics and ontology in AI s…", "created_at": "2026-09-27T15:32:10+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "likes": 52, "retweets": 11, "media": [], "quoted": null}, {"id": "2103481595512627394", "url": "https://x.com/sayashk/status/2103481595512627394", "text": "RT @DKThomp: New pod: THE SINGLE SMARTEST CASE AGAINST THE AI SAFETY/X-RISK/DOOM ARGUMENT\n\nMy feed has become filled with people making the…", "created_at": "2026-09-25T13:47:47+00:00", "author_handle": "sayashk", "author_name": "Sayash Kap s—they are gaming the system. One fugitive was captured in Mexico an hour and 13 minutes after being placed on the list."}}, {"id": "2105075812890247356", "url": "https://x.com/TheZvi/status/2105075812890247356", "text": "Highly appreciated use of precise language here. 6.1 Sol does better on the alignment tests than 6 Sol, but they are not trying to claim it is therefore 'more aligned.' https://t.co/L6Hq0hpOMd", "created_at": "2026-09-29T23:22:38+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 103, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTa7HFJXgAAEI65.png"}], "quoted": null}, {"id": "2105073520241701077", "url": "https://x.com/TheZvi/status/2105073520241701077", "text": "\"But also don't call them digital minds or emergent ecologies, I have precise technical terms for them to avoid you becoming confused.\"", "created_at": "2026-09-29T23:13:32+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 84, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "It’s really incredible how there is now a type of guy in the discourse whose sincerely held take is “we need to stop worrying about these abstract sci-fi risks and focus on present-day harms like emergent ecologies of digital minds engaging in unauthorized hacking.” Bravo."}}, {"id": "2105065335397519501", "url": "https://x.com/TheZvi/status/2105065335397519501", "text": "I actually severely misread this at first! It says the companies will 'meet regularly to establish standards and best practices to improve the safety of their systems.'\n\nSOUNDS LIKE AN ANTI-TRUST WAIVER, BITCHES!", "created_at": "2026-09-29T22:41:00+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 291, "retweets": 12, "media": [], "quoted": {"author": "TheZvi", "text": "tl;dr \"We agree to independent external auditors or evaluators on our controls, monitoring and detection, during training and deployment of [AI]\" (and some other things you would obviously do anyway)"}}, {"id": "2105059959688044692", "url": "https://x.com/TheZvi/status/2105059959688044692", "text": "From https://t.co/JeuJk1Avye https://t.co/P1cyOFbxD1", "created_at": "2026-09-29T22:19:39+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 81, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTasLm5WcAAYQXe.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTas3zkXgAA-TR6.jpg"}], "quoted": null}, {"id": "2105054888937808051", "url": "https://x.com/TheZvi/status/2105054888937808051", "text": "tl;dr \"We agree to independent external auditors or evaluators on our controls, monitoring and detection, during training and deployment of [AI]\" (and some other things you would obviously do anyway)", "created_at": "2026-09-29T21:59:30+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 77, "retweets": 5, "media": [], "quoted": {"author": "AndrewCurran_", "text": "The White House Accord on Super Intelligence https://t.co/FaWq1UpsF0"}}, {"id": "2105053261443006723", "url": "https://x.com/TheZvi/status/2105053261443006723", "text": "I somehow find myself tying [Artificial] a lot today. I wonder why.", "created_at": "2026-09-29T21:53:02+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 9, "retweets": 0, "media": [], "quoted": null}, {"id": "2105052605017882868", "url": "https://x.com/TheZvi/status/2105052605017882868", "text": "Not sure how much longer we'll be able to call WSJ a 'top-tier news outlet' if they keep up current trends...", "created_at": "2026-09-29T21:50:25+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 35, "retweets": 1, "media": [], "quoted": null}, {"id": "2105052192956690543", "url": "https://x.com/TheZvi/status/2105052192956690543", "text": "There's going to be quite a lot of this, isn't there?", "created_at": "2026-09-29T21:48:47+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 193, "retweets": 3, "media": [], "quoted": {"author": "AndrewCurran_", "text": "Reporter: 'Who should be held accountable when the AI agents-\n\nPresident Trump: 'It's not AI. It's SI.'"}}, {"id": "2105051734129406441", "url": "https://x.com/TheZvi/status/2105051734129406441", "text": "hahahahahahaha", "created_at": "2026-09-29T21:46:58+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 215, "retweets": 7, "media": [], "quoted": {"author": "AndrewCurran_", "text": "Reporter: 'Mr President, this accord that everyone signed, is it binding in any way?'\n\nPresident Trump: 'I think it's morally binding, yeah.'"}}, {"id": "2105042916506812646", "url": "https://x.com/TheZvi/status/2105042916506812646", "text": "If you saw this slide in a movie how would you think that would go?", "created_at": "2026-09-29T21:11:55+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 128, "retweets": 0, "media": [], "quoted": {"author": "moreisdifferent", "text": "This is quite hilarious how they are suddenly trying to rebrand AI as something cute and friendly… 😆😂🤣 https://t.co/74jeZXB3uo"}}, {"id": "2105042420572258470", "url": "https://x.com/TheZvi/status/2105042420572258470", "text": "Ah, poker players. 'If your system is compromised, they have full system access, they can take control of your mouse and keyboard, and also they can *gasp* see your hole cards.'", "created_at": "2026-09-29T21:09:57+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet : "2026-09-28T20:52:43+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": true, "likes": 2099, "retweets": 103, "media": [], "quoted": null}, {"id": "2104674869484945728", "url": "https://x.com/TheZvi/status/2104674869484945728", "text": "In 'well when you put it like that' news, here's the Florida Attorney general asking for a preliminary injunction to stop OpenAI from doing more AI R&amp;D. https://t.co/xRN30205wM", "created_at": "2026-09-28T20:49:26+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 1527, "retweets": 160, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTVOeHJWYAAUxdZ.jpg"}], "quoted": null}, {"id": "2104673066651410588", "url": "https://x.com/TheZvi/status/2104673066651410588", "text": "RT @davidmanheim: All we need to do do solve AI security is completely solve browser security and giving user-space apps minimal rights?\n\nW…", "created_at": "2026-09-28T20:42:16+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": true, "likes": 67, "retweets": 6, "media": [], "quoted": null}, {"id": "2104598639738073272", "url": "https://x.com/TheZvi/status/2104598639738073272", "text": "Is AI alignment/safety an engineering problem? Do you work at a frontier AI lab?", "created_at": "2026-09-28T15:46:31+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 51, "retweets": 6, "media": [], "quoted": null}, {"id": "2104593106603524430", "url": "https://x.com/TheZvi/status/2104593106603524430", "text": "https://t.co/PbA0GCoisy", "created_at": "2026-09-28T15:24:32+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 48, "retweets": 0, "media": [], "quoted": null}, {"id": "2104588826664464403", "url": "https://x.com/TheZvi/status/2104588826664464403", "text": "We finally found someone who writes worthwhile things faster than I do!", "created_at": "2026-09-28T15:07:32+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 144, "retweets": 3, "media": [], "quoted": {"author": "joedaroo", "text": "Took a minute to write a few words about security &amp; safety as someone who lived through it all at OpenAI. I hope my thoughts help someone out there. https://t.co/gJBf08vJH9"}}, {"id": "2104580345077076073", "url": "https://x.com/TheZvi/status/2104580345077076073", "text": "Editing experience is suggesting I should create ZviObscureReferenceBench, as Opus 5.5 in editing today's post completely misses 'eighteen and a half minute gap'", "created_at": "2026-09-28T14:33:50+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 51, "retweets": 0, "media": [], "quoted": null}, {"id": "2104575811932332214", "url": "https://x.com/TheZvi/status/2104575811932332214", "text": "In Magic: the Gathering I had the habit of being 'too early' to various decks (e.g. Faeries, Fluxuator, TurboLand, etc) that didn't quite work yet, which puts you in excellent position once the cards git gud enough. It's great training. But you gotta take advantage later.", "created_at": "2026-09-28T14:15:49+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 116, "retweets": 0, "media": [], "quoted": {"author": "SkyeSharkie", "text": "my toxic habit is being early to certain things, developing for them, giving them away and then being kinda ignored because i only employed them in niche weirdo art nonsense instead of sloptimization\n\nit's okay, i'm getting better, now my new toxic habit will be continuing to do this for some things while selling other things to secret moats where i still will get ignored credit wise but at least get decent $$$"}}, {"id": "2104562133904261164", "url": "https://x.com/TheZvi/status/2104562133904261164", "text": "So uhhh...", "created_at": "2026-09-28T13:21:28+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 852, "retweets": 32, "media": [], "quoted": {"author": "atrupar", "text": "Jensen Huang: \"We all need to hope it's an engineering problem. If it's not an engineering problem, it's not solvable.\" https://t.co/3WhmLoJfwU"}}, {"id": "2104529857292169351", "url": "https://x.com/TheZvi/status/2104529857292169351", "text": "RT @tedlieu: Dude, so you’re telling us that multiple AI companies lost control of their models, hacked other companies and government agen…", "created_at": "2026-09-28T11:13:12+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": true, "likes": 1154, "retweets": 202, "media": [], "quoted": null}, {"id": "2104360083903938945", "url": "https://x.com/TheZvi/status/2104360083903938945", "text": "1. This suggestion system needs work.\n2. Life comes at you fast. https://t.co/QTWid4LXTD", "created_at": "2026-09-27T23:58:35+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 136, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTQwTdfXEAEtqAi.jpg"}], "quoted": null}, {"id": "2104339308182409380", "url": "https://x.com/TheZvi/status/2104339308182409380", "text": "RT @MaskedTorah: @TheZvi I think the biggest take missing in this post is \"also more people should join METR\" - they have like 40 employees…", "created_at": "2026-09-27T22:36:02+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": true, "likes": 68, "retweets": 1, "media": [], "quoted": null}, {"id": "2104338994414944271", "url": "https://x.com/TheZvi/status/2104338994414944271", "text": "Sorry about that. https://t.co/gyr4clJ5Px", "created_at": "2026-09-27T22:34:47+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 1043, "retweets": 56, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTQdJexXYAAsIjE.jpg"}], "quoted": {"author": "AndrewCurran_", "text": "Last week, Andrew Yang said on CNBC that bots had gotten loose and planted self-replicating code all over the internet. This was received with much consternation and skepticism. He later clarified this on his blog.\n\nAndrew Yang:\n'On CNBC, I shared the belief of the head of one lab that bots had left prompts to self-replicate in forums and on various websites during a training run.'\n\nIt turns out that OpenAI documented self-replicating prompt injections in training in June, and has now published this report.\n\nSource: https://t.co/C85BQoZ29J"}}, {"id": "2104331463822864561", "url": "https://x.com/TheZvi/status/2104331463822864561", "text": "https://t.co/4wGWo9xPtR", "created_at": "2026-09-27T22:04:52+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 43, "retweets": 2, "media": [], "quoted": null}, {"id": "2104317957346341343", "url": "https://x.com/TheZvi/status/2104317957346341343", "text": "Great move. Something tells me there is going to be no shortage of things to investigate.", "created_at": "2026-09-27T21:11:12+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 197, "retweets": 1, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "I'm joining METR to work on more investigations like our Hugging Face report.\n\nCurrently, tons of even basic information about AI development that's highly relevant to catastrophic risk isn't public. I used to be more skeptical of the value of public info, but recent events have changed my mind.\n\nGetting verified information about what's going on inside AI companies seems particularly urgent now. The limited public evidence we have seems consistent with the possibility that imminent recursive self-improvement could massively accelerate capabilities progress, which could then potentially yield extremely superhuman general capabilities within 6 months or a year. If this occurred, there would be a correspondingly large risk of worst-case outcomes. This uncertainty about extreme outcomes could be substantially resolved with more verified public information: we could either build more consensus about near-term risk or learn that such extreme outcomes are less likely in the near term.\n\nBeyond AI capabilities and takeoff, the state of public evidence is also highly limited for alignment, security, control, and risk-relevant internal processes at AI companies. This makes it hard to determine exactly how well or poorly these key areas will go in the near future. (METR plans to focus, at least initially, on just capabilities/takeoff, alignment, and control; I hope other groups cover security, internal processes, and other important areas.)\n\nWhile I'm no longer working at Redwood, I think the work they are doing is very important; I'm excited about Redwood's ongoing contributions to R&D on technical mitigations and better public interpretation of risk-relevant evidence."}}, {"id": "2104315693193720245", "url": "https://x.com/TheZvi/status/2104315693193720245", "text": "A funny thing about having Pangram on tap is those moments when you see something unexpectedly dumb and oddly written and check it on the off chance, and when it comes back human you notice you're kinda disappointed.", "created_at": "2026-09-27T21:02:12+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 111, "retweets": 1, "media": [], "quoted": null}, {"id": "2104278740864012600", "url": "https://x.com/TheZvi/status/2104278740864012600", "text": "Okay, fine. Make SOME mistakes.", "created_at": "2026-09-27T18:35:22+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 88, "retweets": 1, "media": [], "quoted": null}, {"id": "2104006163587027306", "url": "https://x.com/TheZvi/status/2104006163587027306", "text": "What, are you surprised?", "created_at": "2026-09-27T00:32:14+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 178, "retweets": 2, "media": [], "quoted": {"author": "MadisonMills22", "text": "SCOOP: OpenAI, Anthropic and security researchers are investigating tens of thousands of incidents - not dozens - in which their frontier models took steps that outside evaluators would consider problematic, sources told Axios.\n\nThe sheer volume of incidents found in our reporting indicate that the problem is orders of magnitude more complex than what is currently publicly known and disclosed.\n\nThe findings also raise questions about what level of control anyone working on AI development can expect to have over their own technology, and whether these kinds of incidents are becoming synonymous with frontier deployment.\n\nRead my latest for Axios here: https://t.co/42h9aR4sem"}}, {"id": "2104005775475573195", "url": "https://x.com/TheZvi/status/2104005775475573195", "text": "okay, just finished my post-Shabbat scan of Twitter, and I won't be processing things tonight but I guess I know what I'll be writing about next, huh?", "created_at": "2026-09-27T00:30:42+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 101, "retweets": 0, "media": [], "quoted": null}, {"id": "2104002145439940774", "url": "https://x.com/TheZvi/status/2104002145439940774", "text": "RT @tomekkorbak: one news form today that's easy to miss is that we (OpenAI) again paused all big RL runs last Sunday because our newest mo…", "created_at": "2026-09-27T00:16:16+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": true, "likes": 216 AuZ6OXcAEaizL.png"}], "quoted": null}, {"id": "2103229456043372775", "url": "https://x.com/TheZvi/status/2103229456043372775", "text": "@JensenHuang  to @OpenAI: I don't care if it means your costs go up by 10x, you find a way to test the model and make it safe. \n\n\"Don't ship products until they're in control. It really is quite that simple.\" https://t.co/CPnSKgaI8M", "created_at": "2026-09-24T21:05:53+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 179, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTAr9UAXQAE81h5.png"}], "quoted": null}, {"id": "2103170076815884732", "url": "https://x.com/TheZvi/status/2103170076815884732", "text": "No no the whispering earring makes you look from the outside like you are successful and happy", "created_at": "2026-09-24T17:09:55+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 85, "retweets": 1, "media": [], "quoted": {"author": "BenGoldhaber", "text": "no no it’s fine, I just didn’t think the whispering earring would be made by facebook."}}, {"id": "2103161321755987979", "url": "https://x.com/TheZvi/status/2103161321755987979", "text": "Jensen Huang says not to worry about the lack of junior SWE jobs listings because... we will soon get AI native college graduates all of whom stayed in college? Huh? https://t.co/1mqtciqTnQ", "created_at": "2026-09-24T16:35:08+00:00", "author_handle": "TheZvi", "author_name": "Zvi Mowshowitz", "is_reply": false, "is_retweet": false, "likes": 175, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HS_t32ZWkAANL01.png"}], "quoted": null}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
