think this is kind of a weird way to intervene on the problem of \"preventing AI loss of control\" - if I were entering the field, and I wanted to prevent loss of control, I'd work on pacing or solving the alignment problem. Working on biosec seems too tangential, I think", "created_at": "2026-11-24T04:33:44+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "RoryErlich", "reply_to_id": "2124909475706610026", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2124909475706610026", "author_handle": "RoryErlich", "author_name": "Rory Erlich", "text": "@DaveRBanerjee what if you're worried about misaligned models making bioweapons? this seems like the kind of thing that could potentially happen in fast takeoff scenarios (though admittedly haven't thought about it a ton)", "links": {}, "media": [], "url": "https://x.com/RoryErlich/status/2124909475706610026", "created_at": "Mon Nov 23 16:54:32 +0000 2026"}, "enriched": 3}, {"id": "2125085105203126703", "url": "https://x.com/DaveRBanerjee/status/2125085105203126703", "text": "@wfithian tbh I took this point for granted. My impression is that biosec ppl think that if you have wildly superhuman ASI, that you're in the clear from biorisk (the first ASI-enabled defense that comes to mind is structured transparency)", "created_at": "2026-11-24T04:32:25+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "wfithian", "reply_to_id": "2124737226567532609", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "parent": {"id": "2124737226567532609", "author_handle": "wfithian", "author_name": "Will Fithian", "text": "@DaveRBanerjee What makes you think ASI is going to stop bioweapons as opposed to supercharging them?\n\nAstra is much smarter than all the models making nonconsensual deepfake porn but it isn’t doing much to stop them. And AI getting better has meant more cyberattacks, not fewer.", "links": {}, "media": [], "url": "https://x.com/wfithian/status/2124737226567532609", "created_at": "Mon Nov 23 05:30:05 +0000 2026"}, "enriched": 3}, {"id": "2125329166102835236", "url": "https://x.com/DaveRBanerjee/status/2125329166102835236", "text": "When the Hugging Face incident happened, the independent investigators had only a few days to review 50 petabytes of data. A single human would have needed over 60 million years to get through it\n\nAs we automate larger and larger fractions of the government, oversight bodies will face the same impossible task. They will have petabytes of government data to review and nowhere near enough humans to review it\n\nBut the Hugging Face investigators used AIs to review the logs at a speed and scale that no team of humans could match. Oversight bodies can do the same\n\nDone right, we could equip the government's oversight bodies with automated AI auditors to help oversee an AI-run government\n\nIn other words, oversight bodies need to slopvestigationmaxx if they want to keep up in the automated era", "created_at": "2026-11-24T20:42:14+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6vknEX0AAwKan.jpg"}], "links": {"https://t.co/9BAEiTDSCo": ""}, "quoted": {"id": "2125267078273974516", "author_name": "Severin Field 🦅", "links": {"https://t.co/BzNwsi3vzM": ""}, "author": "sevdeawesome", "text": "We argue the government should log its own AI usage as automatically as it logs emails. Logs could then be shared with a sealed AI auditor, limited by design, so Congress can verify that AI-driven decisions followed the law without seeing every decision and log. https://t.co/BzNwsi3vzM"}, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125313448548716586", "url": "https://x.com/DaveRBanerjee/status/2125313448548716586", "text": "AI researchers are sounding the alarm that human-level AI is just around the corner\n\nBut what happens when you staff the entire government with AIs?\n\nThis would obviously be the greatest achievement in state capacity in human history, but it's not hard to imagine how an AI-run government is ripe for abuse\n\n@sevdeawesome and I wrote \"The Legible Leviathan\" for @JoinFAI, on how to use AI to oversee an AI-run government, enabling the most transparent and accountable state ever imagined", "created_at": "2026-11-24T19:39:47+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6hRtdWwAAOG3_.jpg"}], "links": {"https://t.co/pKxeANgWUk": ""}, "quoted": {"id": "2125267072712352090", "author_name": "Severin Field 🦅", "links": {"https://t.co/zkZjiv0i6l": ""}, "author": "sevdeawesome", "text": "An AI-powered government would be the most powerful state in history: far more capable of abuse, and less likely to be caught.\n\n@DaveBanerjee and I wrote \"The Legible Leviathan\" for @JoinFAI on AI-enabled checks and balances to oversee an AI-run government.🧵 https://t.co/zkZjiv0i6l"}, "fetched_at": "2026-11-24T21:11:17.171296+00:00", "enriched": 3}, {"id": "2125347640917238200", "url": "https://x.com/DaveRBanerjee/status/2125347640917238200", "text": "@davidmanheim @sevdeawesome I think there is a meaningful difference between overseeing TED-AI and ASI. I agree that if you’re trying to set up an oversight mechanism for a USG-procured neuralese ASI, then you’d need to solve hard problems in scalable oversight. But if the USG legislates that the USG can only use monitorable models, then you’d only have to oversee CoT-visible AGI-\n\nI would read our article as assuming that you have a monitorable model in the first place (which isn’t that crazy of an assumption since governments are risk averse and might not want to procure a SOTA model that might be misaligned)", "created_at": "2026-11-24T21:55:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "davidmanheim", "reply_to_id": "2125335805317255385", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "parent": {"id": "2125335805317255385", "author_handle": "davidmanheim", "author_name": "David Manheim", "text": "@DaveRBanerjee But meaningful oversight requires much more than just logging and post-hoc review. Labs can't do it, so I expect the government won't be able to either.\n(cc: @sevdeawesome)\n\nSee our paper: https://t.co/DlpYqoNizU\nOr the blog post:\nhttps://t.co/LEE7DhisxJ", "links": {"https://t.co/DlpYqoNizU": "https://arxiv.org/abs/2507.03525", "https://t.co/LEE7DhisxJ": "https://x.com/davidmanheim/status/2103012903838458199"}, "media": [], "url": "https://x.com/davidmanheim/status/2125335805317255385", "created_at": "Tue Nov 24 21:08:37 +0000 2026"}, "enriched": 3}, {"id": "2125502383400812779", "url": "https://x.com/DaveRBanerjee/status/2125502383400812779", "text": "@GoodFaithOnly Agreed - it would also be nice if the monitors were from a different model family than the one being monitored", "created_at": "2026-11-25T08:10:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "GoodFaithOnly", "reply_to_id": "2125370628718887359", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125370628718887359", "author_handle": "GoodFaithOnly", "author_name": "Avi Brach-Neuefeld", "text": "@DaveRBanerjee I agree, but  for this to work we need more research into monitoring failures. In the Hugging Face investigation METR found, and UK AISI has since confirmed, that monitors often uncritically adopt the perspective of the agents they are reviewing.\n\nhttps://t.co/yj4AvNsRVo", "links": {"https://t.co/yj4AvNsRVo": "https://x.com/GoodFaithOnly/status/2122760024145699081?a=CdTGhvmIwYXTutjppAY&s=20"}, "media": [], "url": "https://x.com/GoodFaithOnly/status/2125370628718887359", "created_at": "Tue Nov 24 23:27:00 +0000 2026"}, "enriched": 3}, {"id": "2125658054674862088", "url": "https://x.com/DaveRBanerjee/status/2125658054674862088", "text": "It's striking how much more \"AI safety insiders\" updated from the recent METR report than other ppl\n\nI was thinking a bit about why\n\nFor me the situation was pretty crazy because, a cpl of years ago, I'd explicitly thought about how i'd interpret *the exact thing that METR found*\n\nI was thinking about how to do Responsible Scaling Policies for the intelligence explosion.\n\nI literally thought \"what about a threshold that fires when AI has made AI progress is 2x faster than it is today\"\n\nI recall being worried the threshold would trigger too late. By the time it triggered, we could be entering an intense intelligence explosion within a few months.\n\nI was worried it would be too late to implement the necessary security and safety measures.\n\nThis threshold is the exact thing that METR found to be plausible!\n\nThe fact that I'd done the calculation in advance made a big difference to how I interpreted the METR result.\n\nBy disposition I *feel* sceptical of crazy-seeming claims.\n\nIn 2020 my AGI timelines were in the 2050s. In 2023 they were in the 2040s.\n\nIf I hadn't done the calculation in advance, I would have *felt* sceptical of short timelines. I would have found a interpretation/argument that justified that feeling.\n\nThat's a v natural way to reason: \"I feel sceptical of ASI in 2027-8. And yes, that's totally consistent with the evidence from the METR report\"\n\nI think this is how the non-\"AI safety insiders\" have responded.\n\nBut I had done the calculation in advance.\n\nSo I knew that, from an unbiased perspective, a 2X acceleration in the pace of AI progress was an extremely big deal that happens late in the day.\n\nOf course, there are many possible reasons why we might not get ASI in 2027-8.\n\nBut still, I knew that the METR report was a big timelines update.\n\nAnd when you've done the calculation in advance, it's much harder for your gut feelings/instincts to override the objective evidence that's come in", "created_at": "2026-11-25T18:29:07+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2125651041794609439", "likes": 67, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125816679158702117", "url": "https://x.com/DaveRBanerjee/status/2125816679158702117", "text": "this is a pretty cool graph - I'd be interested to see a similar graph from redwood", "created_at": "2026-11-26T04:59:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1999598045214760970/zfHzQwG0_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2125739043178860606", "author_name": "Rob Bensinger ⏹️", "links": {"https://t.co/GV88lpoyv7": ""}, "author": "robbensinger", "text": "Updates: \"Yudkowsky considered deep learning a relatively promising approach in 2010, when he introduced DeepMind's co-founders to Peter Thiel 'with the only compliment on any AI project he ever heard from me'...\"\n\n... And \"if current trends continue, we've got 6-18 months left\". https://t.co/GV88lpoyv7"}, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2123798019460235371", "url": "https://x.com/DKokotajlo/status/2123798019460235371", "text": "@yugastox @zetalyrae Yes though I don't think alignment will be solved that easily", "created_at": "2026-11-20T15:18:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "yugastox", "reply_to_id": "2123797398522917210", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123797398522917210", "author_handle": "yugastox", "author_name": "yugastox", "text": "@DKokotajlo @zetalyrae Same conviction for ai2027 slowdown ending?", "links": {}, "media": [], "url": "https://x.com/yugastox/status/2123797398522917210", "created_at": "Fri Nov 20 15:15:32 +0000 2026"}, "enriched": 3}, {"id": "2123796832052728068", "url": "https://x.com/DKokotajlo/status/2123796832052728068", "text": "@zetalyrae Thanks. It is a really interesting and wonderful experience to make a serious forecast about five years in the future and then get to see reality unfold and compare and contrast. More people should try it, I wish I had been forced to do it in college for example.", "created_at": "2026-11-20T15:13:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "zetalyrae", "reply_to_id": "2123614672163398098", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123614672163398098", "author_handle": "zetalyrae", "author_name": "Fernando Borretti", "text": "Today I came across this 2021 post by @DKokotajlo, I think it's remarkable how accurate it is. I could not have made a prediction one tenth as good in 2021. https://t.co/TFTCQEVpcJ", "links": {"https://t.co/TFTCQEVpcJ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXiYQZ9aIAAqeUZ.jpg"}], "url": "https://x.com/zetalyrae/status/2123614672163398098", "created_at": "Fri Nov 20 03:09:27 +0000 2026"}, "enriched": 3}, {"id": "2123666884516253950", "url": "https://x.com/DKokotajlo/status/2123666884516253950", "text": "@jy8nv Not yet!", "created_at": "2026-11-20T06:36:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "jy8nv", "reply_to_id": "2123658962864308426", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123658962864308426", "author_handle": "jy8nv", "author_name": "MMA poster", "text": "@DKokotajlo Daniel are we cooked?  Hope not", "links": {}, "media": [], "url": "https://x.com/jy8nv/status/2123658962864308426", "created_at": "Fri Nov 20 06:05:27 +0000 2026"}, "enriched": 3}, {"id": "2123666599265919117", "url": "https://x.com/DKokotajlo/status/2123666599265919117", "text": "@bayeslord (My wife points out this may have come across as sarcasm -- I didn't mean it that way; I actually think Plan S is a very reasonable plan and might even be better than Plan A. Plan A is the best plan I can currently think of for how to build superintelligence, whereas Plan S is \"don't build superintelligence.\") @bayeslord", "created_at": "2026-11-20T06:35:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2123204336746729512", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 28, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123204336746729512", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "@bayeslord So... Plan S then? How do you intend to prevent people from handing off their decision-making to superhuman AI systems? Obvious answer is to prevent the creation of said systems in the first place. Or is your idea to allow their creation but prohibit their use?", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2123204336746729512", "created_at": "Wed Nov 18 23:58:55 +0000 2026"}, "enriched": 3}, {"id": "2123582516057825590", "url": "https://x.com/DKokotajlo/status/2123582516057825590", "text": "Here's my \"Anthropic comms is slimy; here's what it would look like if they were actually trying to do the right thing by their own lights\" article in the twitter-native format, for those who prefer it. https://t.co/JddeLiVPYR", "created_at": "2026-11-20T01:01:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "rt_avatar": "https://pbs.twimg.com/profile_images/1935185891863273472/2RB6s6TS_normal.jpg", "rt_id": "2123420025759388138", "likes": 346, "retweets": 43, "media": [], "links": {"https://t.co/JddeLiVPYR": "https://x.com/i/article/2123415550554521600"}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123578626499293680", "url": "https://x.com/DKokotajlo/status/2123578626499293680", "text": "Thanks everyone who came out to show support! 205 people -- a good start, especially considering that the whole thing was organized in basically 24 hours. :) That's my colleague Thomas with the sign about algos: https://t.co/4cy8GmjjOH", "created_at": "2026-11-20T00:46:13+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 448, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXh3OoQbkAAS2Yg.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXh3OoQbkAAS2Yg.jpg"}], "links": {"https://t.co/4cy8GmjjOH": ""}, "quoted": {"id": "2123124922180685830", "author_name": "Daniel Kokotajlo", "links": {"https://t.co/wjeJKyHok4": "https://banrsi.ai/"}, "author": "DKokotajlo", "text": "I will be at the Ban RSI rally outside Anthropic offices tomorrow at 11 am. https://t.co/wjeJKyHok4\n\nRecursive Self-Improvement is a stupidly dangerous idea. AIs are already getting smarter rapidly, and they often lie and cheat; why on earth do we think it's a good idea to have them build new smarter AIs to build newer smarter AIs faster and faster? Because if we don't do it, someone else will? I do not accept that answer. Anthropic (like OpenAI before them) styles themselves the good guys in the race, but IMO there are no good guys in this race."}, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123582333735588257", "url": "https://x.com/DKokotajlo/status/2123582333735588257", "text": "\"A Lab Employee's Guide to Raising Concerns\" --&gt; great stuff, I wish I had read this years ago. Recommended for those still at big AI companies. https://t.co/MhgrnOgMOt", "created_at": "2026-11-20T01:00:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 123, "retweets": 12, "media": [], "links": {"https://t.co/MhgrnOgMOt": "https://www.lesswrong.com/posts/JPwYH3hEfLhEDaNFp/a-lab-employee-s-guide-to-raising-concerns"}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123579889173573968", "url": "https://x.com/DKokotajlo/status/2123579889173573968", "text": "I don't know what Anthropic will say in response to this question, but I have a pretty good guess as to what the true answer is: They would continue.", "created_at": "2026-11-20T00:51:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 129, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2123456983559028808", "author_name": "Eric Neyman", "links": {}, "author": "ericneyman", "text": "Today seems as good a day as any to ask @AnthropicAI  pointed questions. So, in that spirit:\n\nSuppose that Anthropic’s efforts to coordinate a (voluntary or government-enforced) pacing of the frontier fail. And suppose that the alignment situation is okay but not good: models seem mostly aligned based on our (very imperfect) evals/monitoring, but it’s hard to tell what’s going on and there’s a lot of fog of war. Subjectively, Anthropic thinks that continuing to race to superintelligence probably doesn’t result in an AI takeover, but like, who knows — opinions range from 1% to 20%. OpenAI is hot on Anthropic’s heels, and the cybersecurity situation — while improved — is still far from perfect, and China would likely be able to steal Anthropic’s algorithmic secrets with a concerted effort.\n\nWhat does Anthropic do? Does it continue to race to superintelligence? Does it stop unilaterally? If so, how early does it stop?"}, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123898592989679890", "url": "https://x.com/DKokotajlo/status/2123898592989679890", "text": "Anthropic Offers Public Amazing Opportunity To Invest In The Apocalypse https://t.co/JPGFSnLv0f", "created_at": "2026-11-20T21:57:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "TheBabylonBee", "rt_author_name": "The Babylon Bee", "rt_avatar": "https://pbs.twimg.com/profile_images/1400100770624720898/-HC7kL5x_normal.jpg", "rt_id": "2123476462812496162", "likes": 3319, "retweets": 395, "media": [], "links": {"https://t.co/JPGFSnLv0f": "https://buff.ly/tvv9ODf"}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123897453959315582", "url": "https://x.com/DKokotajlo/status/2123897453959315582", "text": "", "created_at": "2026-11-20T21:53:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 10, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123896998676033777", "url": "https://x.com/DKokotajlo/status/2123896998676033777", "text": "The Riemann Hypothesis has fallen.  RH was the singular math result that had been named, in advance, as the obvious coal mine canary for dangerously advanced AI, over the last three decades.  The methods used should generalize to \"make AI very good at anything you can definitely test\", and unfortunately that category includes \"make AI better at making AI\".\n\nThis is like a private company announcing they have produced a million tons of 15% enriched uranium.  It's not 90% enriched weapons-grade uranium, so you could proclaim the company's output is not immediately deadly right now.  The concern is that the process line may generalize, to an extinction-level threat, within the unpredictably immediate future.  Forecasters still had Riemann at 2035 one week earlier.\n\nThis is distinct from earlier events in that earlier you could reasonably ask if AI was selectively picking off famous math problems that turned out to be easier for AI.  The Riemann Hypothesis was the single challenge most often named in advance as a warning sign.", "created_at": "2026-11-20T21:51:19+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "allTheYud", "rt_author_name": "Eliezer Yudkowsky", "rt_avatar": "https://pbs.twimg.com/profile_images/1968710025020416001/FMkDoElL_normal.jpg", "rt_id": "2123843874796023936", "likes": 3106, "retweets": 320, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123891770174161169", "url": "https://x.com/DKokotajlo/status/2123891770174161169", "text": "PRESIDENT TRUMP: \"It's not artificial intelligence. It's not artificial, it's super. Problem is, it may be too super.\n\nSo, President Xi and I agreed that we're gonna do some joint guardrails, the two of us.\" https://t.co/15QLAu99K7", "created_at": "2026-11-20T21:30:32+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2123840221816996322", "likes": 2006, "retweets": 173, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123839945127124992/img/Obfre3YpR4fdwGAG.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123839945127124992/img/Obfre3YpR4fdwGAG.jpg"}], "links": {"https://t.co/15QLAu99K7": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123986619950907750", "url": "https://x.com/DKokotajlo/status/2123986619950907750", "text": "THEY ARE BACK!\n\nMETR TIME HORIZONS 2.0\n\nDoubling time of 3.6 months, similar to the 3.8 months estimate by OpenAI\n\nGPT-6 Astra: 40.3 hours\nOpus 5.5: 39.0 hours\n\nbut with extremely wide 95% CI from around 11.9 hours to 110.2 days https://t.co/nybft3bzAy", "created_at": "2026-11-21T03:47:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "scaling01", "rt_author_name": "Lisan al Gaib", "rt_avatar": "https://pbs.twimg.com/profile_images/1831493788679761920/-q9w6dzd_normal.jpg", "rt_id": "2123882452938871241", "likes": 820, "retweets": 50, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXmLXw3WsAAAkf-.jpg"}], "links": {"https://t.co/nybft3bzAy": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123958633826558267", "url": "https://x.com/DKokotajlo/status/2123958633826558267", "text": "We've been working on understanding model capabilities beyond what our prior time horizon tasks could capture.\n\nToday we’re sharing a research update. We find that AI R&amp;D-relevant capabilities are improving rapidly and are getting harder to measure. https://t.co/Z1iXyIjERy", "created_at": "2026-11-21T01:56:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2123864981506798012", "likes": 1404, "retweets": 193, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXl78dBa4AA8nq9.jpg"}], "links": {"https://t.co/Z1iXyIjERy": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123957145549127867", "url": "https://x.com/DKokotajlo/status/2123957145549127867", "text": "Thinking of this post from Scott Aaronson https://t.co/foziPUXfp3", "created_at": "2026-11-21T01:50:19+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "finmoorhouse", "rt_author_name": "Fin Moorhouse", "rt_avatar": "https://pbs.twimg.com/profile_images/1518722990816571393/zVIfffsQ_normal.jpg", "rt_id": "2123833004518731862", "likes": 899, "retweets": 66, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXle3CSWwAA4ObA.jpg"}], "links": {"https://t.co/foziPUXfp3": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123948002943566305", "url": "https://x.com/DKokotajlo/status/2123948002943566305", "text": "@FangcunLeap Glad to see this! Thank you!", "created_at": "2026-11-21T01:13:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "FangcunLeap", "reply_to_id": "2123722020454359094", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123722020454359094", "author_handle": "FangcunLeap", "author_name": "Fangcun AI", "text": "Tencent’s Hy4 system card is out and includes our independent pre-release safety evaluation. It’s the first system card from a Chinese frontier lab, and a meaningful step for third-party evaluation in China.\n\nWe tested loss-of-control and harmful-manipulation risks with four private in-house benchmarks. Compared with its preview, Hy4 shows overall safety improvements across both risk areas. We also found some complex agentic scenarios still leave room for further improvement, e.g., multi-agent resource competition.\n\nThanks to the Tencent Hy team for their trust and openness. We look forward to working with more frontier labs.", "links": {}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXj56WcbYAEbjzC.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXj56WcbYAEbjzC.jpg"}], "url": "https://x.com/FangcunLeap/status/2123722020454359094", "created_at": "Fri Nov 20 10:16:01 +0000 2026"}, "enriched": 3}, {"id": "2123908675140280812", "url": "https://x.com/DKokotajlo/status/2123908675140280812", "text": "This is very encouraging news! We'll see what deal they actually come up with.", "created_at": "2026-11-20T22:37:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 515, "retweets": 30, "media": [], "links": {}, "quoted": {"id": "2123840221816996322", "author_name": "Peter Wildeford🇺🇸🚀", "links": {"https://t.co/15QLAu99K7": ""}, "author": "peterwildeford", "text": "PRESIDENT TRUMP: \"It's not artificial intelligence. It's not artificial, it's super. Problem is, it may be too super.\n\nSo, President Xi and I agreed that we're gonna do some joint guardrails, the two of us.\" https://t.co/15QLAu99K7"}, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124239192070992329", "url": "https://x.com/DKokotajlo/status/2124239192070992329", "text": "If you presented this graph to me in 2023 as one of several options for how the future would unfold, I feel pretty confident that I would've said it failed to account for how defenders would respond and get sped up by AI, despite my having relatively short timelines to AGI. https://t.co/4Su9jbwAHt", "created_at": "2026-11-21T20:31:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ChrisPainterYup", "rt_author_name": "Chris Painter", "rt_avatar": "https://pbs.twimg.com/profile_images/2094568529253306368/kJuKduVE_normal.jpg", "rt_id": "2123988028737888621", "likes": 143, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnqm5CawAAZj_l.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXnqm5CawAAZj_l.jpg"}], "links": {"https://t.co/4Su9jbwAHt": ""}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124238861211676836", "url": "https://x.com/DKokotajlo/status/2124238861211676836", "text": "Agree with this. Also think it applies to journalists and public intellectuals who treated the entire LLM thing as a delusional hype bubble and missed the chance to do relevant criticism at a time when it was badly needed.", "created_at": "2026-11-21T20:29:45+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "kevinroose", "rt_author_name": "Kevin Roose", "rt_avatar": "https://pbs.twimg.com/profile_images/2100401210482413568/elX6pwFj_normal.jpg", "rt_id": "2124202179141742921", "likes": 299, "retweets": 41, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124236731700674861", "url": "https://x.com/DKokotajlo/status/2124236731700674861", "text": "I think it would be really funny if after all the incredible angst and drama of the last few years, Xi + Trump just go “whoa, wtf guys. Stop immediately. No more” and then just enforce the bans properly and easily without complicated treaties", "created_at": "2026-11-21T20:21:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "GjMcGowan", "rt_author_name": "George McGowan", "rt_avatar": "https://pbs.twimg.com/profile_images/1741891329729191936/WwEdTZk5_normal.jpg", "rt_id": "2123902056213975372", "likes": 317, "retweets": 20, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124236248336441443", "url": "https://x.com/DKokotajlo/status/2124236248336441443", "text": "What. A. Day.\n\nOver 1,000 people marched against AI extinction, right through the heart of London.\n\nIf you made a sign, brought a friend or gave up your Saturday to help run the march, thank you. 🧡 https://t.co/vStPiG3DlL", "created_at": "2026-11-21T20:19:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "PauseAI_UK", "rt_author_name": "PauseAI UK", "rt_avatar": "https://pbs.twimg.com/profile_images/2042776512831586304/2IvEZmZ4_normal.jpg", "rt_id": "2124225785464521134", "likes": 95, "retweets": 14, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124225351551242242/img/cV9anWINbzv_xoyL.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124225351551242242/img/cV9anWINbzv_xoyL.jpg"}], "links": {"https://t.co/vStPiG3DlL": ""}, "quoted": null, "fetched_at": "2026-11-21T20:54:36.541465+00:00", "enriched": 3}, {"id": "2124561805167284712", "url": "https://x.com/DKokotajlo/status/2124561805167284712", "text": "@merettm Thank you for sharing this info. More than Anthropic did!", "created_at": "2026-11-22T17:53:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "merettm", "reply_to_id": "2124549218995949967", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 159, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "parent": {"id": "2124549218995949967", "author_handle": "merettm", "author_name": "Jakub Pachocki", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89", "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXvptOTXIAAtrY0.jpg"}], "url": "https://x.com/merettm/status/2124549218995949967", "created_at": "Sun Nov 22 17:03:00 +0000 2026"}, "enriched": 3}, {"id": "2124561656332406858", "url": "https://x.com/DKokotajlo/status/2124561656332406858", "text": "We decided to provide more transparency into pretraining progress at OpenAI for the sake of moving toward shared safety bars. In “Perplexity and Intelligence” I argue for common limits based on perplexity and other measurements, with progress beyond them gated on our ability to understand AI behavior.\n\nhttps://t.co/XX35m5vq89", "created_at": "2026-11-22T17:52:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "merettm", "rt_author_name": "Jakub Pachocki", "rt_avatar": "https://pbs.twimg.com/profile_images/1032407242727809025/AJpM67Ve_normal.jpg", "rt_id": "2124549218995949967", "likes": 3309, "retweets": 353, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXvptOTXIAAtrY0.jpg"}], "links": {"https://t.co/XX35m5vq89": "https://openai.com/index/perplexity-and-intelligence", "https://t.co/eO6hTk9ngp": ""}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2124589922950828217", "url": "https://x.com/DKokotajlo/status/2124589922950828217", "text": "@davidmanheim @merettm The piece of information that matters most is the shape of the trend line. The comparison to Anthropic isn't important (and is fraught as you say)", "created_at": "2026-11-22T19:44:45+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "davidmanheim", "reply_to_id": "2124580571091439759", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "parent": {"id": "2124580571091439759", "author_handle": "davidmanheim", "author_name": "David Manheim", "text": "@DKokotajlo @merettm I'm confused why this is a helpful thing to share; it's certainly not a meaningful thing to standardize on; they aren't sharing bits-per-character, and we know they will score higher than Anthropic on it due to their choice of tokenizer!", "links": {}, "media": [], "url": "https://x.com/davidmanheim/status/2124580571091439759", "created_at": "Sun Nov 22 19:07:35 +0000 2026"}, "enriched": 3}, {"id": "2124574272475832804", "url": "https://x.com/DKokotajlo/status/2124574272475832804", "text": "@akrugs94 @merettm Tbc they are both being far less transparent than they should be. OpenAI for example still hasn't given METR (or anyone else) employee like access despite saying they would, nor have they allowed a thorough investigation of the huggingface incident to happen.", "created_at": "2026-11-22T18:42:33+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "akrugs94", "reply_to_id": "2124571218749632700", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T21:03:50.079443+00:00", "parent": {"id": "2124571218749632700", "author_handle": "akrugs94", "author_name": "Adam Kruger", "text": "@DKokotajlo @merettm Do you have a sense of why OpenAI is seemingly doing a better job on transparency than Anthropic?", "links": {}, "media": [], "url": "https://x.com/akrugs94/status/2124571218749632700", "created_at": "Sun Nov 22 18:30:25 +0000 2026"}, "enriched": 3}, {"id": "2124932379764801929", "url": "https://x.com/DKokotajlo/status/2124932379764801929", "text": "I worry that perplexity is gameable, and that loads of algorithmic advances happen outside of pretraining. For these reasons and others, I think much more is necessary. Nevertheless, I'm  glad to see Jakub calling publicly for \"common limits.\"", "created_at": "2026-11-23T18:25:33+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "rt_avatar": "https://pbs.twimg.com/profile_images/1935185891863273472/2RB6s6TS_normal.jpg", "rt_id": "2124908803250610320", "likes": 134, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124913281580380615", "url": "https://x.com/DKokotajlo/status/2124913281580380615", "text": "@polynoamial Noam, I respect you, but I think OpenAI is doing something incredibly reckless by racing ahead right now.\n\nI remember you telling me (a year or two ago) that you thought the title \"AI 2027\" was a mistake, since 2027 would almost certainly come and go without transformative AI. I said that I thought the timeline of that story was quite plausible, though certainly not guaranteed, and worth preparing for seeing as how dangerous it would be.\n\nI now think explosive RSI is even more likely to be possible in 2027 than I did at the time. I also think that pursuing this would very likely destroy human civilization. On the current path, the point of no return may well come before any more serious warning signs.\n\nYour algorithmic secrets are not secure against many actors who will steal them if you press ahead. Your models apparently cannot be trusted to do safety research without covert underperformance. These problems are totally damning for the justification that OpenAI must race ahead, and use AIs to automate alignment research, lest anyone less responsible try to do so first.\n\nThe current situation is so far from a safe path that getting to one would almost certainly require stopping further AI R&D ~immediately. I expect it would only be safe to continue (well, less than 5% likely to kill me anyway) after years of work hardening security and doing serious alignment research (i.e. not just patching embarrassing problems as they show up).\n\nOpenAI can build and sell AIs that are extremely profitable without needing to take a gamble on uncontrollable superintelligence. I urge you not to risk destroying the world just because making smarter AIs is fun and pays well.", "created_at": "2026-11-23T17:09:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "eccentric1ty", "rt_author_name": "Adam Kaufman", "rt_avatar": "https://pbs.twimg.com/profile_images/2108273166732918784/mfYw3WKJ_normal.jpg", "rt_id": "2124730164559171597", "likes": 284, "retweets": 16, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124674560255779171", "url": "https://x.com/DKokotajlo/status/2124674560255779171", "text": "Yeah this confuses me too and makes me suspicious.", "created_at": "2026-11-23T01:21:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 186, "retweets": 7, "media": [], "links": {}, "quoted": {"id": "2124626330016678085", "author_name": "Toby Ord", "links": {}, "author": "tobyordoxford", "text": "@mentalgeorge Yeah, I'm really surprised/confused by his post too.\nOne big source of my confusion is that this graph shows a steepening of the log-perplexity post GPT-5.2, with as much of a drop this year as in the 4 years prior. I can't see how that could be true.\nIt doesn't fit what I know about pretraining progress over the last 5 years and doesn't fit general capability progress or ECI measurement of that progress.\nThey say they are measuring it on a tiny amount of text that is in their held-out internal code repository. Is this responsible for the weird curve here? I could easily see this form of hyper-narrow measurement of pretraining loss causing severe distortions."}, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "enriched": 3}, {"id": "2124988957637374147", "url": "https://x.com/DKokotajlo/status/2124988957637374147", "text": "Respectfully, we need more than a Committee. We need to Ban RSI and pause the march to ASI now.", "created_at": "2026-11-23T22:10:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "AmbassadorRice", "rt_author_name": "Susan Rice", "rt_avatar": "https://pbs.twimg.com/profile_images/1359165964810649610/ag_FkiD9_normal.jpg", "rt_id": "2124971145640218974", "likes": 344, "retweets": 67, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-23T22:39:11.622944+00:00", "enriched": 3}, {"id": "2125252408792305799", "url": "https://x.com/DKokotajlo/status/2125252408792305799", "text": "https://t.co/49yQ8AaQBK", "created_at": "2026-11-24T15:37:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "lxrjl", "rt_author_name": "alex lawsen", "rt_avatar": "https://pbs.twimg.com/profile_images/1915290249418465282/zjqLEVj2_normal.jpg", "rt_id": "2125119459149164953", "likes": 254, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX3w4qWbAAAA0RN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX3w4qWbAAAA0RN.jpg"}], "links": {"https://t.co/49yQ8AaQBK": ""}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125683589627220113", "url": "https://x.com/DKokotajlo/status/2125683589627220113", "text": "If it's not safe to release, then it isn't safe to train and you should perhaps stop talking to it  internally. https://t.co/FD4A4PbhBm", "created_at": "2026-11-25T20:10:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "Turn_Trout", "rt_author_name": "Alex Turner", "rt_avatar": "https://pbs.twimg.com/profile_images/2117865069304500224/E5M7WJDU_normal.jpg", "rt_id": "2125303895194763493", "likes": 202, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX6YoXEXoAAm_cv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX6YoXEXoAAm_cv.jpg"}], "links": {"https://t.co/FD4A4PbhBm": ""}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125677347882103084", "url": "https://x.com/DKokotajlo/status/2125677347882103084", "text": "Let me get this straight: we rushed AI along without regulating safeguards in order to stay ahead of China and at the same time, we sold China the very chips they’d need to get ahead of us. Smells of profit, corruption and perhaps worse.", "created_at": "2026-11-25T19:45:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "MittRomney", "rt_author_name": "Mitt Romney", "rt_avatar": "https://pbs.twimg.com/profile_images/964489716622966784/xbtCe2td_normal.jpg", "rt_id": "2125232847396983273", "likes": 75199, "retweets": 13767, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "enriched": 3}, {"id": "2125646061977137605", "url": "https://x.com/DKokotajlo/status/2125646061977137605", "text": "@Noahpinion Noah, I'm sympathetic with your bottom line here, but I think your characterisation of the intelligence explosion debate is pretty inaccurate. \n\nYou paint the economic arguments as pointing against the intelligence explosion, and then the report from METR and Dwarkesh' post as being arguments in favour. \n\nBut in fact, the most sophisticated economic arguments suggest that an intelligence explosion is very plausible. \n\nI've rebutted the posts from Ramez and Alexander Imras at some length to argue this, and published a lot of economic modelling on the topic, as have the AI Futures Project.  \n\nAnd I published a working paper in NBER with Anton Korinek and others which, when calibrated, suggests an intelligence explosion will happen.\n\nRebutals to Ramez:\n- https://t.co/BYTYkAMst9\n- https://t.co/TmemhPfmKN\n- https://t.co/vQDd56EqoN\n\nRebutals to Alexander (he was v reasonable in discussion):\n- https://t.co/FkxRNdnqt3\n- https://t.co/a4Il2MyVuB\n\nNBER working paper:\n- https://t.co/APtj9JT9ld\n\nWhy does this matter? \n\nI don't agree that it is hopeless to stop an intelligence explosion.", "created_at": "2026-11-25T17:41:28+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2125528397770080540", "likes": 64, "retweets": 3, "media": [], "links": {"https://t.co/BYTYkAMst9": "https://x.com/TomDavidsonX/status/2104880475890126923?a=IGsDpDBTJVkPVVRTRhs&s=20", "https://t.co/TmemhPfmKN": "https://x.com/TomDavidsonX/status/2112524773724950868?a=Huv34SJHHxaOF1G5jKE&s=20", "https://t.co/vQDd56EqoN": "https://x.com/TomDavidsonX/status/2119778310607577120?a=O8WYxoO_YtZphuPz98k&s=20", "https://t.co/FkxRNdnqt3": "https://x.com/TomDavidsonX/status/2121631290835247493?a=ZfakWyMEibmdYejF_tg&s=20", "https://t.co/a4Il2MyVuB": "https://x.com/TomDavidsonX/status/2121674261924323772?a=47oHhpgE0JIbqfz5YHc&s=20", "https://t.co/APtj9JT9ld": "https://www.nber.org/papers/w35155"}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "linked": [{"id": "2104880475890126923", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "The argument here has some big flaws:\n\n1. It points that that *at the moment* the AI-improving-AI feedback loop is much to weak to explode. But then erroneously infers that it probably won't explode in the future.\n\nThe jump from GPT-2 to GPT-3 increased AI researcher productivity by a *tiny tiny* amount. Probably much less than 0.1%. \n\nRamez would have concluded that there was absolutely no chance of an intelligence explosion. The feedback loop would need to increase in size by >1000X!\n\nBut the jump from GPT-5 to GPT-6 increased AI researcher productivity by much much more. By >1% and plausibly by >10%. \n\nRamez concludes there won't be an intelligence explosion bc the feedback loop would have to increase in strength by 5X. \n\nBut it's already increased in strength by a lot! When AI becomes more capable over the next year, it will increase in strength much more.  \n\n2. Ramez claims that \"Keeping Up the Pace Takes Exponentially More Resources\", as if this means progress is unsustainable. \n\nBut \"keeping up pace\" is delivering exponentially growing revenues. Exponential growth in inputs -> exponential growth in outputs. That's a feedback loop that can totally explode.\n\nTbc, @ramez  argument is made in good faith and is in many ways well informed and well argued. But I think his conclusion is wrong!", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2104880475890126923", "created_at": "Tue Sep 29 10:26:26 +0000 2026"}, {"id": "2112524773724950868", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "Great post.\n\nI agree with Ramez that a million parallel agents isn't the same thing as superintelligence. A big parallel-copy-only intelligence explosion is very unlikely.\n\nBut I disagree that this is a knock against an intelligence explosion:\n- A million parallel agents thinking 100x human speed could speed up AI progress an awful lot, though not infinitely.\n- Those expecting a big intelligence explosion have always thought it would be driven by increased intelligence, not by copies.\n\nMy view in more detail:\n\n1. In the limit, returns to more parallel copies go to 0. Tasks inherently require a certain number of sequential steps. Once you're already exploring every possible avenue, more labour doesn't help.\n\n2. What that limit is depends on the task. Generally, more complicated tasks can absorb more parallel labour. \n\n3. A task as open-ended as \"improve AI capabilities\" can likely absorb a *huge* amount of parallel labour. Much much more than the tasks Ramez looks at. The limit may be very far off indeed for the task that matters most.\n\n4. And once abundant cognitive labour is available, AI companies will invent new ways to use it. \n\nEg attributing strong performance to particular actions during an RL run, hand-crafting each gradient update based on interpretability analysis, analysis weak RL runs and create targeted SFT data to patch gaps\n\n5. Still, Ramez is right that in the absolute limit returns are worse than a power law. And many RSI models assume a power law for simplicity.\n\n6. But others don't. For example, in AIFP's takeoff model the intelligence explosion feedback loop is driven purely by increasing intelligence. Copies don't play any role. (Which I think is too conservative.)\n\n(And when I've made models expressed in terms of parallel copies, i've seen this as a proxy for increasing intelligence.)", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2112524773724950868", "created_at": "Tue Oct 20 12:42:09 +0000 2026"}, {"id": "2119778310607577120", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "It's funny to see posts like this doing so well.\n\nThe need for exponentially rising inputs to sustain AI progress has been known for years. It's baked into all the scaling laws.\n\nAnd all models of the intelligence explosion bake this in too. \n\nThere's no update here!", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2119778310607577120", "created_at": "Mon Nov 09 13:05:07 +0000 2026"}, {"id": "2121631290835247493", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "Agreed we're not *yet* above the threshold for an intelligence explosion. \n\nBut, to be clear, those expecting an IE next year don't think we're above it either\n\nThey think that we've moved *closer* to the threshold over the past year, and will cross it in the next 6 months\n\nI think they're plausibly right", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2121631290835247493", "created_at": "Sat Nov 14 15:48:12 +0000 2026"}, {"id": "2121674261924323772", "author_handle": "TomDavidsonX", "author_name": "Tom Davidson", "text": "Rereading Imas & Garicano's piece, I think it makes a significant mistake.\n\nThey make a surprising claim: we haven't got any closer to the threshold for an intelligence explosion over the last two years.\n\nOn their account, the ~2x faster progress METR found at Anthropic is mostly explained by R&D inputs growing about twice as fast.\n\nIf true, that's a big deal: the speed-up would be mostly money, not AI accelerating research, and should fade once spending growth slows. \n\nIt's also in tension with METR, who attributed most of the acceleration to AI.\n\nLet's back up.\n\nThe key idea in their model: each doubling of cumulative R&D buys a roughly fixed number of AECI points. \n\nSo if progress per year doubles, either (a) cumulative R&D started doubling twice as fast, or (b) each doubling started buying more points, meaning returns improved, bringing us closer to the threshold. \n\nThey say (a).\n\nBut I think that's because they're effectively using the wrong numbers for historical R&D spend.\n\nWith Anthropic's actual R&D [1], cumulative R&D grew ~3.3x/yr before Oct 2025 and ~4.4x/yr after, while progress went from ~15 to ~29 AECI points/yr. So each doubling of cumulative R&D bought ~9 points before and ~14 after. Returns rose. That brings us closer to an intelligence explosion.\n\nTheir fitted curve instead implies cumulative inputs grew ~2x/yr before and ~4x/yr after, so ~15 points per doubling in both periods. \n\nThe difference comes from their fit implicitly assuming ~$2–3B of R&D before 2024, more than the historical numbers. A bigger starting stock makes 2024–25 spending look like a smaller proportional increase, so early input growth looks slower, and the apparent 2026 spending surge appears to explain the speed-up.\n\nBut as I say, with the actual historical numbers this spending surge goes away. Spending still increases but it doesn't double more times than it did in the earlier period.\n\n(They also fit the two periods separately, letting the starting stock reset: the earlier fit implies ~$2B of pre-2024 R&D, the later one ~$0. \n\nIn terms of their returns parameter φ:\n-  their separate fits give ~0.55 in both periods. \n- With actual spending, it rises from ~0.45 to ~0.65.\n\nPossible I've missed something, and very happy to be corrected!\n\n But on the face of it one of their most surprising and important conclusions looks wrong.\n\n[1] S-1 figures: $0.4B in 2023, $2.3B in 2024, $6.3B in 2025, $19B in Jan–Sep 2026. I've added ~$0.2B for 2021–22, before the S-1 data starts.", "links": {}, "media": [], "url": "https://x.com/TomDavidsonX/status/2121674261924323772", "created_at": "Sat Nov 14 18:38:57 +0000 2026"}], "enriched": 3}, {"id": "2125978521684291796", "url": "https://x.com/DKokotajlo/status/2125978521684291796", "text": "@yugastox My timelines views can be found on our blog: https://t.co/nsb9UXHQVd We update them several times a year.", "created_at": "2026-11-26T15:42:32+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "yugastox", "reply_to_id": "2125973778127896737", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/nsb9UXHQVd": "https://blog.aifutures.org/p/q35-timelines-update-looks-like-the"}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125970931457876423", "url": "https://x.com/DKokotajlo/status/2125970931457876423", "text": "Same. Though I would describe it as mostly rationalist stuff, not EA stuff, back then.", "created_at": "2026-11-26T15:12:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 57, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2125770655203237963", "author_name": "Andy Masley", "links": {}, "author": "AndyMasley", "text": "Stumbling into reading a lot of EA stuff in 2013 remains one of the single most lucky things that's ever happened to me. Feel like I got a jump start on the AI debates of 2026 back in 2018."}, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125970046170304687", "url": "https://x.com/DKokotajlo/status/2125970046170304687", "text": "Here’s what I think the current default trajectory looks like, in \"good\" worlds without an AI pause:\n\n1. The labs (or the “leading lab”, by stipulation of a responsible actor) will race as hard as they can (likely via RSI) to right before the point of superintelligence.\n\n2. They unilaterally pause and “burn the lead”\n\n3. They use that time to do alignment research with their existing AIs until they’re ~kinda sure that alignment is solved, or the lagging actors (via a US competitor, or a foreign one) are too close\n\n4. The aligned (or “aligned”) AIs builds the AIs to build the AIs to build the AIs to…build aligned (or “aligned”) superintelligence.\n\n5. The aligned superintelligence is used to obtain “decisive strategic advantage” by disabling other competing AI efforts. \n\n6. The lab then hands the superintelligence and the world to a democratically elected government. (6a: In some other worlds, the gov't understandably seizes the lab before this point, which might be even scarier)\n\n7. The democratically elected government uses the superintelligence to solve non-alignment issues and then everybody lives happily ever after.\n\nImo this is an utterly insane plan. It has a shadow of a chance of working, but it's so ridiculously scary. It has like many different independent ways of failing and insanely reckless and undemocratic even if they do succeed at alignment, which is also dubious.\n\nWhen I asked around  forwhether the labs have a better plan in the no-pause/no-slowdown worlds, I've never heard of a compelling answer.\n\nSurely the labs have a better plan, right? Right?", "created_at": "2026-11-26T15:08:52+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "LinchZhang", "rt_author_name": "Linch", "rt_avatar": "https://pbs.twimg.com/profile_images/2059747405889961984/kvkiarox_normal.jpg", "rt_id": "2125477613858902348", "likes": 369, "retweets": 33, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2125969226745962635", "url": "https://x.com/DKokotajlo/status/2125969226745962635", "text": "ok so now that all lab leaders seem to agree that they don't want to do handoff or RSI, I'd appreciate some concrete plans since the incentives clearly push toward handing off.\n\nWe published about this earlier this week: https://t.co/H8MnHc65qD https://t.co/jQaGhnZmjX", "created_at": "2026-11-26T15:05:36+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "MariusHobbhahn", "rt_author_name": "Marius Hobbhahn", "rt_avatar": "https://pbs.twimg.com/profile_images/1869511726552494080/F0D8HNja_normal.jpg", "rt_id": "2125693845790941391", "likes": 292, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_7REFX0AEuPDx.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HX_7REFX0AEuPDx.jpg"}], "links": {"https://t.co/H8MnHc65qD": "https://www.apolloresearch.ai/governance/handoff-at-frontier-ai-companies", "https://t.co/jQaGhnZmjX": ""}, "quoted": null, "fetched_at": "2026-11-26T17:03:28.364412+00:00", "enriched": 3}, {"id": "2124060561000591562", "url": "https://x.com/dwarkesh_sp/status/2124060561000591562", "text": "Full episode: https://t.co/rIUHs8cGvm", "created_at": "2026-11-21T08:41:15+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "reply_to_id": "2123966918688403756", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 2, "media": [], "links": {"https://t.co/rIUHs8cGvm": "https://youtu.be/Q8Fkpi18QXU?si=GQ8yA3ctSD0_fOQx"}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123966918688403756", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "When I interviewed Terry Tao in March of this year, I asked him about AI solving the Riemann hypothesis. Here's what he said:\n\n\"Part of the reason we prize problems like the Riemann hypothesis is that we’re pretty sure a new type of mathematics has to be created.\n\nWe don’t even know what the shape of the solution is, but it doesn’t feel like a problem that will be solved just by exhaustively checking cases.\"", "links": {}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123966359264759808/img/ZzNybMOwtt9iGo-f.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123966359264759808/img/ZzNybMOwtt9iGo-f.jpg"}], "url": "https://x.com/dwarkesh_sp/status/2123966918688403756", "created_at": "Sat Nov 21 02:29:09 +0000 2026"}, "enriched": 3}, {"id": "2124060365713715399", "url": "https://x.com/dwarkesh_sp/status/2124060365713715399", "text": "@benjamin_horne Who said he's wrong?", "created_at": "2026-11-21T08:40:28+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "benjamin_horne", "reply_to_id": "2123975552147079185", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 124, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "parent": {"id": "2123975552147079185", "author_handle": "benjamin_horne", "author_name": "Ben Horne 🇺🇸", "text": "\"Hi, I'm Dwarkesh. I made a lot of silly and embarrassing predictions about AI and future AI revenue because I live in the SF thought bubble (I am literally roommates with Leopold and Dylan).\n\nI especially look like a fool after what happened to AI stocks this week.\n\nSo here is a clip of someone else being wrong about something, so I can feel better about myself for a few minutes.\"", "links": {}, "media": [], "url": "https://x.com/benjamin_horne/status/2123975552147079185", "created_at": "Sat Nov 21 03:03:27 +0000 2026"}, "enriched": 3}, {"id": "2123966918688403756", "url": "https://x.com/dwarkesh_sp/status/2123966918688403756", "text": "When I interviewed Terry Tao in March of this year, I asked him about AI solving the Riemann hypothesis. Here's what he said:\n\n\"Part of the reason we prize problems like the Riemann hypothesis is that we’re pretty sure a new type of mathematics has to be created.\n\nWe don’t even know what the shape of the solution is, but it doesn’t feel like a problem that will be solved just by exhaustively checking cases.\"", "created_at": "2026-11-21T02:29:09+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3132, "retweets": 225, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123966359264759808/img/ZzNybMOwtt9iGo-f.jpg"}], "links": {"https://t.co/bp4lVJppHd": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "thread": [{"id": "2124060561000591562", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "Full episode: https://t.co/rIUHs8cGvm", "links": {"https://t.co/rIUHs8cGvm": "https://youtu.be/Q8Fkpi18QXU?si=GQ8yA3ctSD0_fOQx"}, "media": [], "url": "https://x.com/dwarkesh_sp/status/2124060561000591562", "created_at": "Sat Nov 21 08:41:15 +0000 2026"}], "enriched": 3}, {"id": "2123932267483648426", "url": "https://x.com/dwarkesh_sp/status/2123932267483648426", "text": "I spent last weekend at the Takeoff Conference in DC, trying to get up to speed on the current state of AI policy.\n\nI compiled my learnings in this post: https://t.co/ZLjQyQGJLO", "created_at": "2026-11-21T00:11:27+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "maxwellfarrens", "rt_author_name": "Max Farrens", "rt_avatar": "https://pbs.twimg.com/profile_images/1953535503518846976/6OVKgl-f_normal.jpg", "rt_id": "2123830366977048874", "likes": 146, "retweets": 18, "media": [], "links": {"https://t.co/ZLjQyQGJLO": "https://www.maxfarrens.com/p/the-state-of-ai-policy"}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124322528105763182", "url": "https://x.com/dwarkesh_sp/status/2124322528105763182", "text": "Full episode: https://t.co/QnbLgH5MJ6", "created_at": "2026-11-22T02:02:13+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "dwarkesh_sp", "reply_to_id": "2124322444689510702", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 30, "retweets": 1, "media": [], "links": {"https://t.co/QnbLgH5MJ6": "https://www.youtube.com/watch?v=TfyPshgMbug"}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "parent": {"id": "2124322444689510702", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "When I interviewed Grant Sanderson in June, I asked him, if an AI (hypothetically) solves the Riemann hypothesis, how likely is it that this feat extends the human understanding of mathematics. https://t.co/p6ygkvhYeV", "links": {"https://t.co/p6ygkvhYeV": ""}, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124321986679828480/img/ZhGqpWzt3oNuJAhn.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124321986679828480/img/ZhGqpWzt3oNuJAhn.jpg"}], "url": "https://x.com/dwarkesh_sp/status/2124322444689510702", "created_at": "Sun Nov 22 02:01:53 +0000 2026"}, "enriched": 3}, {"id": "2124322444689510702", "url": "https://x.com/dwarkesh_sp/status/2124322444689510702", "text": "When I interviewed Grant Sanderson in June, I asked him, if an AI (hypothetically) solves the Riemann hypothesis, how likely is it that this feat extends the human understanding of mathematics. https://t.co/p6ygkvhYeV", "created_at": "2026-11-22T02 etweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXp32nTWsAACWrd.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXp3-1RWoAAnVi-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXp4ev6XsAEa9mk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXp5FzXXEAAx97a.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXp5tLsXoAAY-Yl.jpg"}], "links": {"https://t.co/oATHqZKPfH": "https://x.com/_AashishReddy/status/2070558216551878821?a=tSPknjgmPGQ8_AcyzDI&s=20", "https://t.co/o9yzoykCsd": ""}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "linked": [{"id": "2070558216551878821", "author_handle": "_AashishReddy", "author_name": "Aashish Reddy", "text": "🚨 NEW: Dwarkesh thinks continual learning is a big deal\n\n(Jokes aside I think this was my favourite essay he’s written, recommended)", "links": {}, "media": [], "url": "https://x.com/_AashishReddy/status/2070558216551878821", "created_at": "Fri Jun 26 17:22:02 +0000 2026"}], "enriched": 3}, {"id": "2125374882946949194", "url": "https://x.com/dwarkesh_sp/status/2125374882946949194", "text": ".@JoHenrich explains how the Catholic Church unintentionally caused the Industrial Revolution. \n\nThe Church wanted to acquire land and wealth that would otherwise remain within extended kinship networks.   \n\nSo they systematically dismantled these competing kin system of Early Medieval Europe.   \n\n\"By the high Middle Ages, you get the rise of guilds, which are voluntary groups of craftsmen and self-help societies, because people don't have their families to rely on.  \n\nPeople begin moving around, there's occupational sorting into different occupations, urbanization is rising, charter towns are on the rise, universities pop up, new kinds of monasteries pop up.\"", "created_at": "2026-11-24T23:43:54+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2123823695210930379", "likes": 30, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122014169616519168/img/a281itSKFt3sHV2i.jpg"}], "links": {"https://t.co/AL6v9s9ram": ""}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125345346465472528", "url": "https://x.com/dwarkesh_sp/status/2125345346465472528", "text": "I responded to the strongest objections that people had about the RSI essay.\n\nAlso available on YouTube and your podcasting app. https://t.co/D55V8zp8LO", "created_at": "2026-11-24T21:46:32+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 196, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HX6_ImXWUAAN8E3.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/media/HX6_ImXWUAAN8E3.jpg"}], "links": {"https://t.co/D55V8zp8LO": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125341641510912184", "url": "https://x.com/dwarkesh_sp/status/2125341641510912184", "text": "Dwarkesh Patel says the government should mandate public access to every model AI labs use internally.\n\n\"We don't wanna be in a situation where people are secretly doing intelligence explosions.\"\n\n\"If you don't trust your AI enough to let it be deployed publicly and be robust to people trying to use it to do very dangerous things, then you probably shouldn't be using it to develop future AI systems as well.\"\n\nSource: The Long Game podcast https://t.co/Ii2qIgolls", "created_at": "2026-11-24T21:31:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "vitrupo", "rt_author_name": "vitrupo", "rt_avatar": "https://pbs.twimg.com/profile_images/1905435709407985666/RfAHID81_normal.jpg", "rt_id": "2124935837267956073", "likes": 643, "retweets": 50, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2124935765985742848/img/aQocg44AtK9T5Zb8.jpg"}], "links": {"https://t.co/Ii2qIgolls": "https://www.youtube.com/watch?v=Sq32DUozdSc&t=2660s", "https://t.co/ggJ2N5sTTb": ""}, "quoted": null, "fetched_at": "2026-11-24T23:54:45.726159+00:00", "enriched": 3}, {"id": "2125905845926101211", "url": "https://x.com/dwarkesh_sp/status/2125905845926101211", "text": ".@slatestarcodex uses SpaceX to illustrate the lower bound of what superintelligence could achieve:  \n\n\"We have something which is smarter than Elon Musk, better at optimizing things than Elon Musk.  \n\nWe have 10,000 parts in a rocket supply chain.  \n\nHow many of those parts can Elon personally yell at people to optimize?  \n\nWe could have a different copy of the superintelligence, optimizing every single part full time.”", "created_at": "2026-11-26T10:53:45+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt
