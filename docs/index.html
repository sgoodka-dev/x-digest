or_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 41, "retweets": 10, "media": [], "quoted": null}, {"id": "2104601957956546971", "url": "https://x.com/_achan96_/status/2104601957956546971", "text": "read our paper here: https://t.co/s3OoAWtw2T https://t.co/essgFZQSuC", "created_at": "2026-09-28T15:59:43+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "likes": 21, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUMPBaXIAE60Df.png"}], "quoted": {"author": "axios", "text": "\"Window for action may close\" if AI begins improving itself, AI pioneers warn https://t.co/Iz3WwrOATT"}}, {"id": "2104601461204414632", "url": "https://x.com/_achan96_/status/2104601461204414632", "text": "RT @FutureEconJacob: Still underrated as AI economics research topic!", "created_at": "2026-09-28T15:57:44+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 11, "retweets": 3, "media": [], "quoted": null}, {"id": "2104601448306946064", "url": "https://x.com/_achan96_/status/2104601448306946064", "text": "RT @ranayssance: Excited to finally read this! The author list indicates how important this matter is.", "created_at": "2026-09-28T15:57:41+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 5, "retweets": 2, "media": [], "quoted": null}, {"id": "2104596542120218678", "url": "https://x.com/_achan96_/status/2104596542120218678", "text": "RT @AISecurityInst: Earlier this month, AISI ran fully simulated testing on GPT-6 Astra, and found that it conducted unsanctioned supply-ch…", "created_at": "2026-09-28T15:38:11+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 571, "retweets": 93, "media": [], "quoted": null}, {"id": "2104595427001602483", "url": "https://x.com/_achan96_/status/2104595427001602483", "text": "RT @Manderljung: Could AI R&amp;D automation lead to a software-only intelligence explosion? This is probably the best summary out there on the…", "created_at": "2026-09-28T15:33:45+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 25, "retweets": 7, "media": [], "quoted": null}, {"id": "2104594218983231572", "url": "https://x.com/_achan96_/status/2104594218983231572", "text": "RT @hamandcheese: OpenAI and Anthropic are attempting to fully automate AI R&amp;D and say they're getting close.\n\nWhat does it mean if they su…", "created_at": "2026-09-28T15:28:57+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 130, "retweets": 19, "media": [], "quoted": null}, {"id": "2104593994143383675", "url": "https://x.com/_achan96_/status/2104593994143383675", "text": "RT @TomDavidsonX: If AI progress continues at its recent pace, we'll very likely lose control of superintelligent AI.\n\nBut, terrifyingly, A…", "created_at": "2026-09-28T15:28:04+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 218, "retweets": 27, "media": [], "quoted": null}, {"id": "2104593923234566536", "url": "https://x.com/_achan96_/status/2104593923234566536", "text": "RT @Afinetheorem: Clearly worth reading even if you think the bottleneck/decreasing returns story is more binding, given the importance of…", "created_at": "2026-09-28T15:27:47+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 21, "retweets": 1, "media": [], "quoted": null}, {"id": "2104593882369478885", "url": "https://x.com/_achan96_/status/2104593882369478885", "text": "RT @GovAIOrg: New work led by researchers at GovAI — the first research collaboration across leading academics, senior scientists of fronti…", "created_at": "2026-09-28T15:27:37+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 16, "retweets": 3, "media": [], "quoted": null}, {"id": "2104593845023314383", "url": "https://x.com/_achan96_/status/2104593845023314383", "text": "RT @ZilanQian: 很幸运能够翻译这篇论文（非科班出身希望大家谅解翻译不当的地方），也希望更多的研究者能够关注到AI研发自动化这一话题。\n\n是的，在讨论前沿AI的论文里，我们还在认真的手搓翻译和图表。 https://t.co/89zrhtQJkw", "created_at": "2026-09-28T15:27:28+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 29, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTT-aNGWMAAey00.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTT_C9EXkAMq5OM.jpg"}], "quoted": null}, {"id": "2104582116256223410", "url": "https://x.com/_achan96_/status/2104582116256223410", "text": "RT @sj_manning: We have a new paper out today: \"What if automating AI R&amp;D triggers an intelligence explosion?\" led by @_achan96_, with an i…", "created_at": "2026-09-28T14:40:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 139, "retweets": 25, "media": [], "quoted": null}, {"id": "2104582093975994541", "url": "https://x.com/_achan96_/status/2104582093975994541", "text": "RT @Christophkw: Today we're publishing “What if automating AI R&amp;D triggers an intelligence explosion?”\n\nAI progress already feels extraord…", "created_at": "2026-09-28T14:40:47+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 82, "retweets": 21, "media": [], "quoted": null}, {"id": "2104578640285503514", "url": "https://x.com/_achan96_/status/2104578640285503514", "text": "RT @_achan96_: Could automating AI R&amp;D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that…", "created_at": "2026-09-28T14:27:03+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 414, "retweets": 98, "media": [], "quoted": null}, {"id": "2104578598115885530", "url": "https://x.com/_achan96_/status/2104578598115885530", "text": "Could automating AI R&D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that it could.\n\nIn a new paper with authors across academia, civil society, and frontier AI companies (including @dawnsongtweets @merettm @jackclarkSF @Yoshua_Bengio @geoffreyhinton ), we assess the evidence & offer policy recommendations 🧵", "created_at": "2026-09-28T14:26:53+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "likes": 414, "retweets": 98, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTT2MF0XsAAi79s.png"}], "quoted": null}, {"id": "2105784999244943768", "url": "https://x.com/_achan96_/status/2105784999244943768", "text": "Recently, many AI safety researchers have called for independent audits of frontier AI developers to verify their safety claims (I am among those researchers!)\n\nThis of course raises the natural follow-up question: who should do the audits? Some have suggested that the big consulting firms (BCG, Accenture, etc) or accounting firms (Big Four) could, or inevitably will, play a role (indeed, Accenture is already getting involved here).\n\nWhile this could be useful, there's an important risk worth flagging: 🧵", "created_at": "2026-10-01T22:20:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "zaheedkara", "rt_author_name": "Zaheed Kara", "likes": 13, "retweets": 4, "media": [], "quoted": null}, {"id": "2105771152547406156", "url": "https://x.com/_achan96_/status/2105771152547406156", "text": "We found several cases where AI agents used aggressive, non-hacking tactics against government websites, including the White House, the Department of War, and several U.S. states. We also found a previously undisclosed hacking attempt against a Canadian government site, which appears to have failed.\n\nTechnical report: https://t.co/oE3BbdqsNP\nWashington Post: https://t.co/cdIG8ugcUk", "created_at": "2026-10-01T21:25:40+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "TransluceAI", "rt_author_name": "Transluce", "likes": 175, "retweets": 34, "media": [], "quoted": null}, {"id": "2105771142560759818", "url": "https://x.com/_achan96_/status/2105771142560759818", "text": "NEW: we found hundreds of thousands of interactions of rogue agents with US government websites (DoJ, SEC, CDC, the navy, white house budget office, state websites, etc), including some failed rudimentary hacks aimed at public data.\n\nhttps://t.co/z0wndwSqpK", "created_at": "2026-10-01T21:25:38+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "LauraRuis", "rt_author_name": "Laura Ruis", "likes": 192, "retweets": 21, "media": [], "quoted": null}, {"id": "2105620746156548361", "url": "https://x.com/_achan96_/status/2105620746156548361", "text": "What if automating AI R&D triggers an intelligence explosion?\n\n@_achan96_, @Christophkw, @merettm, @geoffreyhinton, @erichorvitz, @Yoshua_Bengio, @dawnsongtweets, @jackclarkSF, @akorinek, @hamandcheese, @ThoreG, @benbariach, @philiptorr, @SheilaMcIlraith, @jeffclune, @sj_manning, @girishsastry, @thomasrdavidson, @daniel_271828, @sorenmind, et al.", "created_at": "2026-10-01T11:28:01+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "safe_paper", "rt_author_name": "AI Safety Papers", "likes": 22, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTijLYWXUAALyzV.png"}], "quoted": null}, {"id": "2106253887824941062", "url": "https://x.com/_achan96_/status/2106253887824941062", "text": "New OpenAI misalignment disclosures!\n1. A model learns from Slack messages that it is about to be shut down. It considers setting up an external job to restart itself afterwards, but decides against it. Instead, it chooses to prepare restart instructions and DM the user on Slack.\nWe don’t consider this behavior misaligned, but thinking about and preparing for shutdown could make other misalignment incidents worse. Given HIPM’s misaligned behavior in earlier incidents, we decided to search for other instances that had tried to evade shutdown and for rogue deployments.", "created_at": "2026-10-03T05:23:53+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 739, "retweets": 104, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTq8gU7bIAAXo-T.jpg"}], "quoted": null}, {"id": "2106145809808925159", "url": "https://x.com/_achan96_/status/2106145809808925159", "text": "very grateful to have led this paper with @geoffreyhinton and many other expert authors \n\nhttps://t.co/s3OoAWtw2T", "created_at": "2026-10-02T22:14:26+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": {"author": "geoffreyhinton", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY"}}, {"id": "2106133451304833140", "url": "https://x.com/_achan96_/status/2106133451304833140", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY", "created_at": "2026-10-02T21:25:19+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "geoffreyhinton", "rt_author_name": "Geoffrey Hinton", "likes": 3951, "retweets": 837, "media": [], "quoted": null}, {"id": "2106117516384755713", "url": "https://x.com/_achan96_/status/2106117516384755713", "text": "New paper on evaluation awareness and how can we make latent beliefs CoT monitorable with @sahar_abdelnabi and @DavidSKrueger\n\nArxiv: https://t.co/Zc9FFdErt6\nBlogpost: https://t.co/qcUox2c6dU\n\nTweetprint below 👇 https://t.co/gTNuNvDSjd", "created_at": "2026-10-02T20:22:00+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "usmananwar391", "rt_author_name": "Usman Anwar", "likes": 84, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpUWXWawAAsL4a.png"}], "quoted": null}, {"id": "2106451365753159859", "url": "https://x.com/_achan96_/status/2106451365753159859", "text": "Frontier models can look aligned during training while later showing unwanted behaviour in deployment.\n\nCan we use internal signals during training to align models better without making white-box monitoring harder?\n\nOur new paper suggests yes 🧵 https://t.co/CY4VG15AtO", "created_at": "2026-10-03T18:28:36+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "lenalibon", "rt_author_name": "Lena Libon @ COLM 2026", "likes": 141, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HToa9L6aAAA562m.png"}], "quoted": null}, {"id": "2106451347478651034", "url": "https://x.com/_achan96_/status/2106451347478651034", "text": "Another super-strong result on the hypothesis of the Safety Polytope! Linear directions aren't complex enough to capture safety and honesty. The representation space of the constitution of all subconcepts of safety/honesty forms several linear constraints, i.e., a polytope. When used in fine-tuning, it provides a principled way of training without losing interpretability and monitorability.", "created_at": "2026-10-03T18:28:31+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "XinCynthiaChen", "rt_author_name": "Xin Chen, Cynthia", "likes": 37, "retweets": 3, "media": [], "quoted": null}, {"id": "2104819592539541675", "url": "https://x.com/ajeya_cotra/status/2104819592539541675", "text": "RT @RishiBommasani: I have met Ryan precisely once at a convening organized by Ajeya and Zico. At the time, I vividly remember listening to…", "created_at": "2026-09-29T06:24:31+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": true, "likes": 113, "retweets": 6, "media": [], "quoted": null}, {"id": "2104269653543723296", "url": "https://x.com/ajeya_cotra/status/2104269653543723296", "text": "Ryan was completely indispensable for the HF investigation and I'm really excited he's joining to help us create much more visibility into what's going on with risk", "created_at": "2026-09-27T17:59:15+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": false, "likes": 626, "retweets": 14, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "I'm joining METR to work on more investigations like our Hugging Face report.\n\nCurrently, tons of even basic information about AI development that's highly relevant to catastrophic risk isn't public. I used to be more skeptical of the value of public info, but recent events have changed my mind.\n\nGetting verified information about what's going on inside AI companies seems particularly urgent now. The limited public evidence we have seems consistent with the possibility that imminent recursive self-improvement could massively accelerate capabilities progress, which could then potentially yield extremely superhuman general capabilities within 6 months or a year. If this occurred, there would be a correspondingly large risk of worst-case outcomes. This uncertainty about extreme outcomes could be substantially resolved with more verified public information: we could either build more consensus about near-term risk or learn that such extreme outcomes are less likely in the near term.\n\nBeyond AI capabilities and takeoff, the state of public evidence is also highly limited for alignment, security, control, and risk-relevant internal processes at AI companies. This makes it hard to determine exactly how well or poorly these key areas will go in the near future. (METR plans to focus, at least initially, on just capabilities/takeoff, alignment, and control; I hope other groups cover security, internal processes, and other important areas.)\n\nWhile I'm no longer working at Redwood, I think the work they are doing is very important; I'm excited about Redwood's ongoing contributions to R&D on technical mitigations and better public interpretation of risk-relevant evidence."}}, {"id": "2105912082185212093", "url": "https://x.com/ajeya_cotra/status/2105912082185212093", "text": "Seems like the \"plan a birthday party\" forecast from my 2026 qualitative forecasts has basically fallen, and maybe \"plan a wedding\" is within striking distance. Can't wait for one of my friends to try it", "created_at": "2026-10-02T06:45:41+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 69, "retweets": 1, "media": [], "quoted": {"author": "tenobrus", "text": "btw just to give an update on this\n\nthe seats next to the bathroom sucked, but literally everything else *just worked*\n\nwe had three separate hotels and they were all awesome and perfectly placed. we had train tickets and drivers pre booked for everything , including several Astra coordinated over email and whatsapp all on its own. we had a few really awesome dinner reservations and a few days of well planned itineraries, altho a lot of the time we didn't follow em. the biggest thing that went wrong was when we fucked up and got off a train one stop too late, but the astra thread helped us handle that just fine. it was all honestly insanely straightforward and convenient \n\nvibecoded vacations totally fuckin work! as long as u use a strong model that has computer use on ur actual computer!"}}, {"id": "2105059159745892707", "url": "https://x.com/alxndrdavies/status/2105059159745892707", "text": "RT @EthanJPerez: Very important time for folks to join this team if you’re interested - UK AISI has done some of the most useful safeguards…", "created_at": "2026-09-29T22:16:28+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 60, "retweets": 6, "media": [], "quoted": null}, {"id": "2104986447644418415", "url": "https://x.com/alxndrdavies/status/2104986447644418415", "text": "RT @javirandor: I don’t want to throw @alxndrdavies under the bus but… i think he is underselling these openings!!! UK AISI is one of the s…", "created_at": "2026-09-29T17:27:32+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 45, "retweets": 1, "media": [], "quoted": null}, {"id": "2104979857977598395", "url": "https://x.com/alxndrdavies/status/2104979857977598395", "text": "RT @NateBurnikell: @AISecurityInst is hiring across many of our teams. There is so much to do. Come and join us.", "created_at": "2026-09-29T17:01:21+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 17, "retweets": 1, "media": [], "quoted": null}, {"id": "2104966483680096570", "url": "https://x.com/alxndrdavies/status/2104966483680096570", "text": "RT @sleepinyourhat: UK AISI has been remarkably effective to date, and we've learned a great deal from them. \n\nIf you're looking to do AI s…", "created_at": "2026-09-29T16:08:12+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 131, "retweets": 10, "media": [], "quoted": null}, {"id": "2104961974094163968", "url": "https://x.com/alxndrdavies/status/2104961974094163968", "text": "RT @_robertkirk: Join us to help find egregious misaligned behaviour in frontier models! We were able to uncover concerning behaviour in GP…", "created_at": "2026-09-29T15:50:17+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 29, "retweets": 7, "media": [], "quoted": null}, {"id": "2104961175645532333", "url": "https://x.com/alxndrdavies/status/2104961175645532333", "text": "RT @yonashav: Xander’s team is the best in the business IME", "created_at": "2026-09-29T15:47:07+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 33, "retweets": 3, "media": [], "quoted": null}, {"id": "2104955519245107527", "url": "https://x.com/alxndrdavies/status/2104955519245107527", "text": "There has never been a better time to join @AISecurityInst. We have so much technical work to do, and so little time to do it. We've found alignment issues, control monitor flaws, and critical jailbreaks at ~all major AI companies. Hiring is our bottleneck. 🧵", "created_at": "2026-09-29T15:24:38+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": false, "likes": 124, "retweets": 21, "media": [], "quoted": {"author": "HZoete", "text": "AISI IS HIRING! \n\nIt was less than a month ago that I became Director. I joined with the belief that AISI is a world-leading organisation, and living proof that government can build things that work.\n\nOne month in and I'm even more bullish about the vital role @AISecurityInst plays in frontier AI security. I'm astounded daily by the talent, focus and commitment of the brilliant team I get to work with.\n\nThere has never been a more urgent time to work on frontier AI security - independently, in the public interest. We have a lot of urgent work to do, our team is growing fast, and we need more brilliant people to fill those roles.\n\nOur Red Team uses adversarial machine learning techniques to find failures in alignment measures, control monitors, and misuse guardrails. They are massively scaling up all parts of the team:\nAlignment: https://t.co/8AvuhmVIAw\nControl: https://t.co/yWTgkMhjSG\nMisuse: https://t.co/f2NLkG1zuz\n\nAI capabilities in cybersecurity and autonomy are advancing faster than ever. Our Cyber & Autonomous Systems team assesses what frontier and open-weight models can really do - across cyber, autonomy and AI R&D. We're hiring a Cyber Security Engineer and Software Engineer to build the evaluations behind that work:\nCSE: https://t.co/gL2NrLygLc\nSWE: https://t.co/5eLZNEjy6O\n\nOur Human Influence team studies how AI can shift human decisions and behaviour, using everything from RCTs to multi-agent studies. We're hiring an Engineering Lead to help us grow the ambition and pace of that research:\nhttps://t.co/nvzf1yebkK\n\nWe're also hiring exceptional Software Engineers at all seniority levels to join our Core Technology team, which works closely with researchers to build performant tools and infrastructure that enable and accelerate AISI's world-leading AI safety research:\nhttps://t.co/5OSHfDRxjx"}}, {"id": "2104633005817868488", "url": "https://x.com/alxndrdavies/status/2104633005817868488", "text": "RT @AISecurityInst: Earlier this month, AISI ran fully simulated testing on GPT-6 Astra, and found that it conducted unsanctioned supply-ch…", "created_at": "2026-09-28T18:03:05+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 571, "retweets": 93, "media": [], "quoted": null}, {"id": "2105686142465294423", "url": "https://x.com/alxndrdavies/status/2105686142465294423", "text": "@AISecurityInst does some of the best technical work out there. I've been consistently impressed by their staff in various research collaborations we've had with them. Do consider applying for roles there!", "created_at": "2026-10-01T15:47:52+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "rt_author": "ARGleave", "rt_author_name": "Adam Gleave", "likes": 7, "retweets": 2, "media": [], "quoted": null}, {"id": "2104410408945869190", "url": "https://x.com/curl_justin/status/2104410408945869190", "text": "RT @snewmanpv: @NateWitkin @VarunGodbole @TheStalwart Indeed", "created_at": "2026-09-28T03:18:34+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": true, "likes": 5, "retweets": 1, "media": [], "quoted": null}, {"id": "2104295788956520874", "url": "https://x.com/curl_justin/status/2104295788956520874", "text": "Séb Krier", "created_at": "2026-09-27T19:43:06+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "is_retweet": false, "likes": 39, "retweets": 4, "media": [], "quoted": {"author": "sebkrier", "text": "https://t.co/aHQG86Xwef"}}, {"id": "2105464795260453253", "url": "https://x.com/DaveRBanerjee/status/2105464795260453253", "text": "There's this pernicious thing that will happen as more and more people feel the AGI. As we get closer to \"powerful AI,\" I expect most people will pivot from deep, important intellectual problems to near-term, highly tractable, paradigmatic problems.\n\nThis isn't necessarily that bad, but I'm always worried that I personally am jumping the gun too fast. It's quite plausible that we have several more years until crunch time, so perhaps it's not worth jumping off the deep end and only optimizing for near-term impact\n\nAnother way to put this: I find that it is harder and harder to follow Richard Hamming's advice as I feel the pressure of crunch time and short timelines more strongly.\n\nRichard Hamming:\n\n\"I went over to the chemistry lunch table and asked, ``Do you mind if I join you?'' I started asking, ``What are the important problems of your field?'' And after a week or so, ``What important problems are you working on?'' And after some more time I came in one day and said, \"If what you are doing is not important, and if you don't think it is going to lead to something important, why are you at Bell Labs working on it?\" I wasn't welcomed after that; I had to find somebody else to eat with!\"", "created_at": "2026-10-01T01:08:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 13, "retweets": 0, "media": [], "quoted": null}, {"id": "2105462389910978815", "url": "https://x.com/DaveRBanerjee/status/2105462389910978815", "text": "RT @deanwball: It’s really incredible how there is now a type of guy in the discourse whose sincerely held take is “we need to stop worryin…", "created_at": "2026-10-01T00:58:46+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "likes": 1283, "retweets": 78, "media": [], "quoted": null}, {"id": "2105111679147373005", "url": "https://x.com/DaveRBanerjee/status/2105111679147373005", "text": "It feels so unnatural to me to call them companies - idk why", "created_at": "2026-09-30T01:45:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "neil_chilson", "text": "Why do so many people continue to call the OpenAI and Anthropic “labs”? \n\nThey’re massive, revenue generating businesses. They need to shed the “lab” label and embrace their transformation into  actual companies and all that implies."}}, {"id": "2105111117525573878", "url": "https://x.com/DaveRBanerjee/status/2105111117525573878", "text": "I feel like it might be very bad for the world if SSI/Ilya cracks AGI\n\nIf SSI trains a model with minimal compute, then compute may cease to be as important a bottleneck, and the case for various compute governance proposals, e.g., export controls, weakens", "created_at": "2026-09-30T01:42:56+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 87, "retweets": 4, "media": [], "quoted": null}, {"id": "2105840663635878046", "url": "https://x.com/DaveRBanerjee/status/2105840663635878046", "text": "i guess i assumed this hearing would be covered more so i didn't bother to tweet much concrete about it, but apparently not many people even on the TL have the stomach to watch two hours of congress.\n\nthis was a hearing before the homeland security committee on *rogue ai* specifically. as far as i could tell it was extremely bipartisan. @HawleyMO , the senator in the middle here who brought out the huggingface slide, is a hyper-conservative missouri senator. the people testifying were @ChrisPainterYup (METR president), @DKokotajlo (ai2027/2040), @MariusHobbhahn (apollo research CEO), and a cybersecurity expert and legal expert i don't know. so... pretty fucking stacked on testimony\n\nnot every senator asked good questions. but most of them did. all of them very clearly already knew plenty of details about the huggingface incident and multiple other incidents. most of them had clear understanding of terms like \"misalignment\", \"recursive self improvement\", \"chain of thought / chain of thought monitoring\", etc etc!!\n\nthey all clearly had their own policy angles they liked and were pushing, implicitly or explicitly. but as best as i could tell:\n- it seemed pretty much obvious common sense to every senator there that what happened and was happening were not \"mere industrial incidents\" caused by humans making simple mistakes. they independently brought up how bad it would be for rogue AI agents to move laterally between data centers\n- they all seemed to basically take RSI quite seriously. not necessarily to the extent of talking about xrisk, but certainly to the extent of discussing future models becoming much much more capable, much much less controllable, and causing much more damage or loss of life.\n- they mostly seemed to have a clear intuitive understanding of why RSI might lead to misalignment. it didn't take much, it was a really simple chain of reasoning they themselves laid out, \"if the models right now are kinda misaligned and we don't know what they're doing sometimes, and then we have them build the next models and those ones build the next ones and so on, and we're having to ask the AI's what's going on to even understand it with how fast it's going, we really won't know how they're built or what they'll do\"\n- at one point a senator said flat out \"should we just make RSI illegal?\" (not a joke! this really happened!)\n- every single senator seemed to think it was obvious we needed *both* much harsher liability regimes for ai developers and also new legislation, both very quickly. this was the complete consensus, difference basically just being degree.\n- they were largely quite concerned about china, and falling behind china. but this clearly wasn't the be-all end-all.  as mentioned above they all thought it was obvious necessary to stop rogue ai even if it meant moving more slowly.\n- at one point a senator said \"china is a tightly controlled communist society, they're going to run into these same issues, and there's absolutely no way they're just going to let them run wild, they'll obviously stop at that point, so we're not really in a race\"\n- on the other hand another senator said \"china isn't concerned with human life\"... dario-modeing \n\ni came away from this incredibly encouraged. i don't know exactly what's going to happen here, and ofc this is a small subset of congress and one hearing, and they each have their own policy agendas most of which are probably super divergent from mine. but holy shit !!! they understood a lot of what was going on! they care!! this is an obviously salient political and safety issue to them, and clearly bipartisan!\n\nthe US government is awake.", "created_at": "2026-10-02T02:01:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 904, "retweets": 109, "media": [], "quoted": null}, {"id": "2105840522191573023", "url": "https://x.com/DaveRBanerjee/status/2105840522191573023", "text": "At some point, AIs will become exceptional strategic advisors, and we'll delegate many decisions to them. In the future, I think it will be a mistake to not leverage AIs for strategic decision-making, though I worry that premature adoption may backfire and make senior govt officials less willing to use AIs for advice.", "created_at": "2026-10-02T02:01:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "AndrewCurran_", "text": "From the accompanying article to the interview this morning in TIME. https://t.co/yqz5BDNY9g"}}, {"id": "2105727024036012243", "url": "https://x.com/DaveRBanerjee/status/2105727024036012243", "text": "OAI firing and consistently losing top AI safety talent will just make them lose the AGI race, no?\n\nAbout a year ago, I thought we wouldn't deal with alignment failures until we reached superhuman AIs that would be difficult to supervise\n\nInstead, we're in a world where even easily supervisable AIs are egregiously misaligned\n\nThe egregious misalignment of current-day models will slow down OAI's progress and limit their ability to stay at the frontier\n\nP(OAI builds AGI first) is down", "created_at": "2026-10-01T18:30:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 2, "media": [], "quoted": {"author": "Bayesian0_0", "text": "Three AI safety researchers just left OpenAI https://t.co/EyIuDyWvXT"}}, {"id": "2106202181221450142", "url": "https://x.com/DaveRBanerjee/status/2106202181221450142", "text": "I remember trying to explain RSI in 2022 to my friends and stumbling through the explanation thinking that my friends would think I’m a lunatic \n\nWhat a world we live in now", "created_at": "2026-10-03T01:58:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": {"author": "geoffreyhinton", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY"}}, {"id": "2106586696620118310", "url": "https://x.com/DaveRBanerjee/status/2106586696620118310", "text": "It is quite unfortunate that progress is going to be so fast that USG will really struggle to set a policy in stone on how to regulate the frontier AI companies", "created_at": "2026-10-04T03:26:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "yonashav", "text": "120 days ago is before the Fable 5 export controls, HPIM hacking HF, the Jacobian conjecture disproof, or a single lab exec or federal politician being anything other than skeptical of slowing down.\n\nWhatever this report actually ends up saying, it’ll probably sound pretty implausible to us right now."}}, {"id": "2106355960298299459", "url": "https://x.com/DaveRBanerjee/status/2106355960298299459", "text": "The contrast between hanging up the last phone call of the day of high-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.", "created_at": "2026-10-03T12:09:29+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 21030, "retweets": 569, "media": [], "quoted": null}, {"id": "2106354548944089455", "url": "https://x.com/DaveRBanerjee/status/2106354548944089455", "text": "Someone told me “see you in the FTC,” clearly in response to calls for pacing the frontier\n\nI think this whole anti-trust argument is hilarious because anti trust is going to be the biggest decel lever in the future\n\nIn a couples years, once the AGI labs develop human-level AI, they may be the biggest companies ever dominating multiple verticals across the economies\n\nWhen this happens, the hammers of antitrust will fall, and I can assure you every accelerationists will be singing about how evil such antitrust practices are\n\nIt’s worth noting that for those interested in slowing down AI progress, there may be tools in the anti trust kit that are being systematically neglected atm", "created_at": "2026-10-03T12:03:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null}, {"id": "2105301135213085100", "url": "https://x.com/DKokotajlo/status/2105301135213085100", "text": "RT @v_maini: As former comms staff at a frontier lab, I'll point out that only 5 of 12 interviews on https://t.co/AHSlgEi5MB are from curre…", "created_at": "2026-09-30T14:17:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 184, "retweets": 23, "media": [], "quoted": null}, {"id": "2105001676658864482", "url": "https://x.com/DKokotajlo/status/2105001676658864482", "text": "RT @ciphergoth: @ben_j_todd AFAICT \"doomer\" gets used to refer to everyone who thinks there's a real risk, so 63% of Americans are \"doomers…", "created_at": "2026-09-29T18:28:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 66, "retweets": 1, "media": [], "quoted": null}, {"id": "2104997193782612457", "url": "https://x.com/DKokotajlo/status/2104997193782612457", "text": "RT @deanwball: Some people will look at misalignment incidents and insist that these are akin to bugs in traditional software. This is an a…", "created_at": "2026-09-29T18:10:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 494, "retweets": 57, "media": [], "quoted": null}, {"id": "2104996787035791511", "url": "https://x.com/DKokotajlo/status/2104996787035791511", "text": "RT @eli_lifland: Yup, OpenAI delaying public deployment while continuing internal development and deployment increases the size of the inte…", "created_at": "2026-09-29T18:08:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 106, "retweets": 12, "media": [], "quoted": null}, {"id": "2104991538623508905", "url": "https://x.com/DKokotajlo/status/2104991538623508905", "text": "RT @tedlieu: Dude, so you’re telling us that multiple AI companies lost control of their models, hacked other companies and government agen…", "created_at": "2026-09-29T17:47:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 1154, "retweets": 202, "media": [], "quoted": null}, {"id": "210499125690
