3}, {"id": "2123510408309072285", "url": "https://x.com/deanwball/status/2123510408309072285", "text": "please please please come work with me: https://t.co/a3LoRuSmJU\n\nour team of (3) helps define, drive and operationalize so many of the hot button topics - embedded evaluators? check! misalignment incidents and reporting? check! 3p/government testing and frameworks? check! how these things interact with policy initiatives? check!\n\n@_lamaahmad is a hero and me and serena are at least pleasant to work with, and our stable of dedicated daily collaborators from @fouadmatin @EstherTetruas @j_nitishinskaya @kaicathyc @Eric_Wallace_ @dkaushik96 @MicahCarroll @Marcus_J_W @davideoks @kevin_klyman is also an all-timer crew", "created_at": "2026-11-19T20:15:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "CedricWhitney", "rt_author_name": "cedric", "rt_avatar": "https://pbs.twimg.com/profile_images/2100377602062200832/yCO-gS00_normal.jpg", "rt_id": "2123507295556649115", "likes": 150, "retweets": 17, "media": [], "links": {"https://t.co/a3LoRuSmJU": "https://openai.com/careers/research-program-manager-frontier-assurance-san-francisco/"}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2121337320817488130", "url": "https://x.com/nabeelqu/status/2121337320817488130", "text": "Seb's Law: The widespread, transformative societal impact of AI is always approximately two years away, regardless of the current year.", "created_at": "2026-11-13T20:20:04+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2035280949374816358", "likes": 491, "retweets": 39, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121363240274083895", "url": "https://x.com/nabeelqu/status/2121363240274083895", "text": "TIL this is only the 3rd full ground stop ever in the US (first one was 9/11): https://t.co/iKe6LcM8p9", "created_at": "2026-11-13T22:03:04+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 30, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCYn1PWcAEew-B.jpg"}], "links": {"https://t.co/iKe6LcM8p9": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2122387884271714390", "url": "https://x.com/nabeelqu/status/2122387884271714390", "text": "Will rapid AI capability improvements translate into runaway economic growth?\n\nEconomists Alex Imas and Tyler Cowen are skeptical. In this conversation with a16z's Erik Torenberg, they cover:\n\n- Why smarter models can't automatically overcome economic bottlenecks\n- Why slow-moving institutions can limit AI's impact on the economy\n- How competition between AI labs is making powerful models cheaper to use\n- Why AI's benefits to consumers could be much larger than GDP captures\n- Why scientific advances and longer lifespans could be among AI's biggest benefits\n\n00:00 Intro\n00:58 Is AI progress speeding up?\n04:44 Why Tyler is a sober voice\n10:49 Could AI deliver double-digit economic growth?\n19:02 Is GDP the right way to measure AI's impact?\n23:51 What the Hugging Face hack teaches us\n29:53 Why agents struggle to coordinate\n33:45 What AI means for jobs and wages\n39:29 Elections, data centers and AI politics\n43:23 How Alex and Tyler got here\n50:00 Rapid fire: AI predictions and higher ed\n\nYouTube: https://t.co/O90OkvL9v6\n\n@alexolegimas @tylercowen @eriktorenberg", "created_at": "2026-11-16T17:54:38+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "a16z", "rt_author_name": "a16z", "rt_avatar": "https://pbs.twimg.com/profile_images/1919488160125616128/QAZXTMEj_normal.png", "rt_id": "2122380098464780362", "likes": 96, "retweets": 11, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122374367984431104/img/kTqc1fnUAE7uAllF.jpg"}], "links": {"https://t.co/O90OkvL9v6": "http://youtu.be/g_67TmQ8lGY", "https://t.co/Z4fBhP0oDn": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122385846594670676", "url": "https://x.com/nabeelqu/status/2122385846594670676", "text": "@JakeOrthwein Of course, you could argue that the only reason he wants to prove moral realism is bc of the compassionate ground, which is the first order thing. But I don't think he'd see it that way. Either the 'ground' comes first (~religious worldview) or you're stuck with reason.", "created_at": "2026-11-16T17:46:32+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "nabeelqu", "reply_to_id": "2122385492432105555", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122385492432105555", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "text": "@JakeOrthwein I don't know if I agree with this. Parfit's secular philosophical worldview puts reason first above all else, so the 'compassionate ground' becomes just one more input to that; thus, he has to prove moral realism using reason, or else (by his worldview) it's invalid!", "links": {}, "media": [], "url": "https://x.com/nabeelqu/status/2122385492432105555", "created_at": "Mon Nov 16 17:45:08 +0000 2026"}, "enriched": 3}, {"id": "2122385492432105555", "url": "https://x.com/nabeelqu/status/2122385492432105555", "text": "@JakeOrthwein I don't know if I agree with this. Parfit's secular philosophical worldview puts reason first above all else, so the 'compassionate ground' becomes just one more input to that; thus, he has to prove moral realism using reason, or else (by his worldview) it's invalid!", "created_at": "2026-11-16T17:45:08+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": true, "reply_to": "JakeOrthwein", "reply_to_id": "2122363931461083452", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122363931461083452", "author_handle": "JakeOrthwein", "author_name": "Jake Orthwein", "text": "The care/compassion that made Parfit fear moral nihilism was not itself a consequence of his moral realism.\n\nRather, it emanated from the same intrinsically compassionate awareness that he himself intimated in Reasons and Persons:", "links": {"https://t.co/KBPVpzE1Cm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQkPvYXIAAVraj.jpg"}], "url": "https://x.com/JakeOrthwein/status/2122363931461083452", "created_at": "Mon Nov 16 16:19:27 +0000 2026"}, "enriched": 3}, {"id": "2122749369870852443", "url": "https://x.com/nabeelqu/status/2122749369870852443", "text": "because you have not heeded my warnings and learned Spanish yet, The Point has republished in English my essay on Pangram, AI writing, the third world novel, and why so many humanists have chosen ignorance instead of grappling with what AI means for literature https://t.co/qjkWiMZPBf", "created_at": "2026-11-17T17:51:03+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "brunellaism", "rt_author_name": "Brunella", "rt_avatar": "https://pbs.twimg.com/profile_images/1889486598657454081/qXokg7ty_normal.jpg", "rt_id": "2122746021868634475", "likes": 313, "retweets": 57, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWA97-aQAAhDvB.png"}], "links": {"https://t.co/qjkWiMZPBf": "https://thepointmag.com/examined-life/the-part-about-the-machines/", "https://t.co/CzZxrqdG7C": ""}, "quoted": null, "fetched_at": "2026-11-17T19:51:52.671734+00:00", "enriched": 3}, {"id": "2123212500543922411", "url": "https://x.com/nabeelqu/status/2123212500543922411", "text": "It's easy to hate Dario, but do you have courage to hate everyone who's been dismissing him as a dork? He had stated his theory of victory a decade ago. Let nobody tell you this came as a surprise. https://t.co/ENkZyzBfjt", "created_at": "2026-11-19T00:31:22+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": true, "rt_author": "teortaxesTex", "rt_author_name": "Teortaxes▶️ (DeepSeek 推特🐋铁粉 2023 – ∞)", "rt_avatar": "https://pbs.twimg.com/profile_images/1652169745037242368/KRPTShbG_normal.jpg", "rt_id": "2123201586578997391", "likes": 833, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcgP8vXIAAPhZO.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXcgP8vXIAAPhZO.jpg"}], "links": {"https://t.co/ENkZyzBfjt": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123205519716307134", "url": "https://x.com/nabeelqu/status/2123205519716307134", "text": "The NYT is incredibly lucky to get @jasminewsun, she is the single best person covering tech/the Valley and SV culture today. \n\nIt’s well worth reading this thread, and the linked piece, for a full dose of how some AI lab people model the world:", "created_at": "2026-11-19T00:03:37+00:00", "author_handle": "nabeelqu", "author_name": "Nabeel S. Qureshi", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1857140980421668864/0prdKK32_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 264, "retweets": 11, "media": [], "links": {}, "quoted": {"id": "2123172397897621508", "author_name": "jasmine sun", "links": {"https://t.co/xsrh02LaBq": "https://www.nytimes.com/2026/11/18/opinion/anthropic-ai-openai.html?unlocked_article_code=1.RVE.AUKz.AkiqfoAGG5ph&smid=url-share", "https://t.co/7O7WbO3GR3": ""}, "author": "jasminewsun", "text": "Anthropic doesn't see itself as a \"normal company.\" Dario Amodei believes both that 1) superintelligent AI could destroy humanity, and 2) our only chance at survival is to have his trillion-dollar tech company build it first.\n\nThis is not an intuitive way to think about either capitalism or social change, but it’s led Anthropic to the eve of one of the biggest IPOs in history. So it's more important than ever for the public to understand and scrutinize its idiosyncratic theory of change. \n\nMy debut for @NYTOpinion (gift link!): https://t.co/xsrh02LaBq"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2121230639353807270", "url": "https://x.com/theobearman/status/2121230639353807270", "text": "Amid all this NVIDIA news...\n\nScoop: The Super Intelligence Task force had its second meeting yesterday at the White House. Discussed:\n\n-the evolving cyber threat/strengthening US critical infrastructure\n-\"an update on implementation of the White House Accord, including efforts to align the signatories around a common set of industry standards and the opportunity to include additional private sector firms\"\n-Cairncross, Lutnick and Kratsios gave updates on the voluntary pre-deploying AI testing EO -- involving NSA and CAISSI\n-more TK!", "created_at": "2026-11-13T13:16:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ashleyrgold", "rt_author_name": "Ashley Gold", "rt_avatar": "https://pbs.twimg.com/profile_images/2100730381846646784/INs3gfH7_normal.jpg", "rt_id": "2121225874322211191", "likes": 45, "retweets": 21, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121128462261825781", "url": "https://x.com/theobearman/status/2121128462261825781", "text": "We show that looping a transformer increases no-CoT capabilities more than other ways of increasing pretrain quality would. https://t.co/SGRWmta1iR", "created_at": "2026-11-13T06:30:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "alek_westover", "rt_author_name": "Alek Westover", "rt_avatar": "https://pbs.twimg.com/profile_images/2121051682557841408/Y2uGqIlY_normal.jpg", "rt_id": "2120974693306130717", "likes": 357, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW820cVaMAATmOB.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW820cVaMAATmOB.png"}], "links": {"https://t.co/SGRWmta1iR": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121288827293798889", "url": "https://x.com/theobearman/status/2121288827293798889", "text": "We (partially) verified these results!\n\nUsing NVIDIA B200/H200s, we reproduced the reported patterns for three models.*\n\nWe also extended the DeepSeek-V4-Flash test to every weight position across the 42 layers examined and still detected the Blackwell pattern.\n\nSee the results here: \nhttps://t.co/TCAfDSGQRx\n\nThis is a super clever approach by @willdepue, and matches reporting that top Chinese AI labs are using Blackwells.\n\n* The repo didn’t contain all the inputs needed to test most of the other models", "created_at": "2026-11-13T17:07:22+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "rt_avatar": "https://pbs.twimg.com/profile_images/1778546830978019328/f3xa3Iaa_normal.jpg", "rt_id": "2121274136739873190", "likes": 48, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXAppzfXEAABiUK.jpg"}], "links": {"https://t.co/TCAfDSGQRx": "https://github.com/Institute-for-Progress/checkpoint-forensics-verification-public", "https://t.co/8QdLPYZx3o": ""}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "enriched": 3}, {"id": "2121283600490394020", "url": "https://x.com/theobearman/status/2121283600490394020", "text": "One of the strong arguments for why renting chips to China is better than selling them is that it gives the US optionality to control them in the future. Unfortunately when the renter is Megaspeed that case breaks down, and remote access looks more liability than optionality 🧵", "created_at": "2026-11-13T16:46:36+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "rt_avatar": "https://pbs.twimg.com/profile_images/1612127888475570176/X_ZBlRj0_normal.jpg", "rt_id": "2121273310432391349", "likes": 2, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "thread": [{"id": "2121273313318285630", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The original rent don't sell argument largely had in mind Chinese firms buying cloud services from US hyperscalers. In reality a large amount of Chinese remote access looks like chips being rented out by what are effectively Chinese off-balance sheet vehicles instead", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273313318285630", "created_at": "Fri Nov 13 16:05:43 +0000 2026"}, {"id": "2121273315012526198", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Megaspeed is the most egregious case, where reporting around the Jensen saga has clearly demonstrated how far it was simply a vehicle for Alibaba to circumvent chip controls, and was itself actively engaged in smuggling of chips into China", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273315012526198", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273316501545329", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Rather than remote access enabling continued cloud business under auspices of US cloud players, it instead has turned into an enabler for networks of shell firms in Southeast Asia and China to engage in hugely profitable violations of US controls", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273316501545329", "created_at": "Fri Nov 13 16:05:44 +0000 2026"}, {"id": "2121273318066057611", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "When firms such as Megaspeed which have no jurisdictional attachments, and are de facto controlled by Chinese interests, lose access to future chip shipments, one of the most logical moves will be to work to smuggle into China their chips held in SEA, profiting from huge markups", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273318066057611", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273320570249382", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The hundreds of thousands of chips being owned and operated by similar firms across Asia are the riskiest pool for future smuggling. Allowing those same firms to continue freely buying up advanced AI hardware, including Vera Rubins, would be a major strategic error", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273320570249382", "created_at": "Fri Nov 13 16:05:45 +0000 2026"}, {"id": "2121273323325952421", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Smuggling is not just bad because of the illegality or national security implications, but also since future international treaties on AI are likely to rest on effective tracking and verification of existing chip stocks", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273323325952421", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273325070458889", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "The existence of hundreds of thousands to millions of advanced chips in an unmonitored and uncontrolled grey market across Asia is highly antithetical to making future deals which rely on minimal dark compute", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273325070458889", "created_at": "Fri Nov 13 16:05:46 +0000 2026"}, {"id": "2121273328212316231", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Overall the US should take immediate action to clamp down on remote access, pairing this with stricter policies on chip buyer whitelists, chip tracking and whistleblower rewards to reduce the risk of remote access chips blurring too easily into smuggled ones", "links": {}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273328212316231", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}, {"id": "2121273329763893326", "author_handle": "Hamish_Low5", "author_name": "Hamish Low", "text": "Read my full piece making this case at https://t.co/DScRuaOWiM", "links": {"https://t.co/DScRuaOWiM": "https://open.substack.com/pub/erwald/p/ai-chips-rented-to-chinese-firms?r=hemux&utm_campaign=post&utm_medium=web"}, "media": [], "url": "https://x.com/Hamish_Low5/status/2121273329763893326", "created_at": "Fri Nov 13 16:05:47 +0000 2026"}], "enriched": 3}, {"id": "2121336831686115617", "url": "https://x.com/theobearman/status/2121336831686115617", "text": "Threat actors are weaponizing ARTEX, an open-source, large language model (LLM)-driven agentic platform to automate multiple phases of cyber intrusions at machine speed. Since at least August 2026, a variety of malicious cyber actors have used ARTEX to conduct campaigns targeting organizations globally across multiple sectors, including financial services, government, and technology.\n\nARTEX significantly reduces the time required to chain attack techniques and enables threat actors with minimal technical expertise to conduct complex, multi-target operations simultaneously.\n\nToday, the FBI released a FLASH highlighting the tactics, techniques, and procedures and indicators of compromise associated with the ARTEX framework. Organizations should follow the mitigation steps outlined in the FLASH to improve their security posture in response to ARTEX and similar agentic SI frameworks: https://t.co/l9lgbqWNYk", "created_at": "2026-11-13T20:18:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FBICyberBranch", "rt_author_name": "FBI Cyber Branch", "rt_avatar": "https://pbs.twimg.com/profile_images/2039414588005920768/m2GtWI2h_normal.jpg", "rt_id": "2121317398305186287", "likes": 352, "retweets": 115, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXBu7o9WYAIp48S.jpg"}], "links": {"https://t.co/l9lgbqWNYk": "https://www.ic3.gov/CSA/2026/261113.pdf", "https://t.co/Spvq87XzsR": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121336227609923680", "url": "https://x.com/theobearman/status/2121336227609923680", "text": "This slide from the Anthropic IPO roadshow was a big factor in my decision to leave. It’s an insane plot and I’m surprised they made it public.\n\nIt shows the compute efficiency of pretraining over time. The y-axis is a **log scale**: they are seeing continued superexponential algorithmic progress.\n\nMythos was not a one-time deviation, but a point on a superexponential. They could already retrain Mythos with a fraction of the compute originally needed.\n\nIt doesn’t strictly imply a software-only intelligence explosion- they have been spending more on R+D. But algorithmic improvements do not require ridiculous creative genius and are on the verge of being automated. You do the math.", "created_at": "2026-11-13T20:15:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2121331333654086124", "likes": 866, "retweets": 93, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXB7mp4bQAAKN3a.jpg"}], "links": {"https://t.co/U17rzSxrFD": ""}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121321652118249956", "url": "https://x.com/theobearman/status/2121321652118249956", "text": "@_NathanCalvin This is not the plan. Will be sharing more on how we’re thinking about human oversight and control in near future.", "created_at": "2026-11-13T19:17:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "kaicathyc", "rt_author_name": "Kai", "rt_avatar": "https://pbs.twimg.com/profile_images/1657816900817272832/ioGq5O0t_normal.jpg", "rt_id": "2120968650077196567", "likes": 135, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121321511453872616", "url": "https://x.com/theobearman/status/2121321511453872616", "text": "Safety evaluations are critical for understanding whether a model is ready to deploy, which safeguards to build for it, and where to focus training and research.\n\nOn our Engineering Blog, we offer 10 recommendations for how to design, run and report them.\n\nhttps://t.co/MtSQmqqi2D", "created_at": "2026-11-13T19:17:15+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "rt_avatar": "https://pbs.twimg.com/profile_images/1798110641414443008/XP8gyBaY_normal.jpg", "rt_id": "2121317227618340990", "likes": 1159, "retweets": 74, "media": [], "links": {"https://t.co/MtSQmqqi2D": "https://www.anthropic.com/research/building-strong-safety-evaluations"}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121441984653230374", "url": "https://x.com/theobearman/status/2121441984653230374", "text": "I'm excited to launch Benchmark Almanac! It tracks 3,322 benchmarks from 1,746 leaderboards, 522 launch posts, 346 system cards, and 1,233 open-source GitHub repos. To my knowledge, it's the most comprehensive repo out there.\n\nWebsite: https://t.co/ARgu9TdU6x https://t.co/lFynTAY4ZQ", "created_at": "2026-11-14T03:15:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "brian1zhou", "rt_author_name": "Brian Zhou", "rt_avatar": "https://pbs.twimg.com/profile_images/2062073325753716736/4m7jdCEN_normal.jpg", "rt_id": "2121375297954300164", "likes": 134, "retweets": 14, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121375095226540032/img/7f-Pp47IVB6AfTG-.jpg"}], "links": {"https://t.co/ARgu9TdU6x": "https://www.benchmarkalmanac.com", "https://t.co/lFynTAY4ZQ": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121432743238119783", "url": "https://x.com/theobearman/status/2121432743238119783", "text": "Are we in an intelligence explosion? This is one of the most important questions facing society right now. @lugaricano and I tried to put structure on this question and provide estimates based on currently available data.\n\nMETR recently reported that frontier capability growth roughly doubled after October 2025---but this is accompanied by annualized R&D spending growth of ~6x and technical staff ~3x over the same window. That highlights a crucial distinction between scaling laws--exponential capability gains bought with exponentially rising inputs--and an intelligence explosion (IE), where AI begins substituting for external inputs so each advance makes the next one easier.\n\nWe estimate several versions of a research production function (building on @ChadJonesEcon, @bfjo, and @Ph_Aghion) where a key parameter crossing a threshold signals an IE, while values below it correspond to an \"ideas are harder to find,\" diminishing-returns world. Across specifications, our estimates sit below that threshold. Allowing for a break at METR's October 2025 cutoff points to a one-time step up in research effectiveness, with the rate of diminishing returns being nearly identical on both sides of the cutoff.\n\nA few things to note. First, this exercise is not a forecast. It's an attempt to put structure on some of the important questions being debated right now: RSI, IE, scaling laws all depend on how outputs scale with inputs, and how feedback loops accelerate/decelerate this process. These estimates can change, and change very quickly. \n\nSecond, we are very explicit that the results are based on publicly available data; it is very much possible that METR had access to data that would change the estimates.\n\nThird, we might be wrong! Let us know what you think:\n\nhttps://t.co/xMLZlSlxdY", "created_at": "2026-11-14T02:39:14+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "rt_avatar": "https://pbs.twimg.com/profile_images/1994816403359010817/0zMDGpbF_normal.jpg", "rt_id": "2121350760843931912", "likes": 285, "retweets": 49, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCNRklWAAEJKxq.png"}], "links": {"https://t.co/xMLZlSlxdY": "https://aleximas.substack.com/p/are-we-approaching-an-intelligence", "https://t.co/CYuGeQaESv": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121431658385555570", "url": "https://x.com/theobearman/status/2121431658385555570", "text": "M&amp;ATR", "created_at": "2026-11-14T02:34:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2121372541218623543", "author_name": "Fulcrum", "links": {}, "author": "fulcrum_inc", "text": "The Fulcrum team is joining @METR_Evals to work on alignment measurement. We feel the world is very unprepared for AI capabilities acceleration. We decided the best thing we could do is work on open science that informs the public."}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2122057019498832100", "url": "https://x.com/theobearman/status/2122057019498832100", "text": "Throughout the time they have been at sea, no one has done more for the defence of the United Kingdom and our allies than the crew of HMS Vengeance.\n\nThe privilege of welcoming them home, and spending some time with their families, was a humbling and awe-inspiring experience - one that will stay with me for the rest of my life.\n\nThey can be so proud of their service to our country. The same is true for their families, who sacrifice so much to support them. We do not take this for granted. \n\nThe UK's nuclear deterrent is the ultimate National Endeavour and the cornerstone of our national security. Every minute of every day, it deters our adversaries and keeps our country safe.\n\nWe commit our nuclear deterrent to NATO and that commitment to our allies is unshakeable. \n\nWe've committed £63.6 billion over the next four years to the Defence Nuclear Enterprise, creating and sustaining good, high-skilled jobs and protecting the whole of the UK for decades to come.\n\nThe Vanguard class continues to serve our country well - for longer than was intended - and Dreadnought is on its way.\n\nBZ Vengeance. Heroes all.", "created_at": "2026-11-15T19:59:54+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "wesstreeting", "rt_author_name": "Wes Streeting", "rt_avatar": "https://pbs.twimg.com/profile_images/2079946597123682304/IIE4eicN_normal.jpg", "rt_id": "2122021714855170174", "likes": 543, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXLvd6xW8AAAj6h.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXLvd4MWIAAhQpA.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXLvd7iXYAAPof_.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXLvd27XQAAEaDj.jpg"}], "links": {"https://t.co/bPf52EakXo": ""}, "quoted": null, "fetched_at": "2026-11-15T20:23:54.093496+00:00", "enriched": 3}, {"id": "2122044203119308866", "url": "https://x.com/theobearman/status/2122044203119308866", "text": "JENSEN HUANG IS DISCUSSING A COMEBACK AS NVIDIA CEO WITH ALLIES, WITH A “WAR ROOM” OF SILICON VALLEY EXECUTIVES BEING PUT TOGETHER - FT", "created_at": "2026-11-15T19:08:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2122043952304177271", "likes": 1709, "retweets": 155, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-15T20:23:54.093496+00:00", "enriched": 3}, {"id": "2122358273945084042", "url": "https://x.com/theobearman/status/2122358273945084042", "text": "NEW: The Department of Commerce just published new AI and semiconductor export control regulations that close some major loopholes in existing export controls. The regulation includes new rules to: (1) counter Chinese smuggling of AI chips; (2) restrict Chinese companies from renting access to AI chips; and (3) block Chinese chip designers from making AI chips at TSMC.\n\nThese rules are a major step forward. They still contain some key gaps that need to be filled urgently in a follow-up rule, namely, they do not block Chinese companies from buying AI chips inside the United States or renting access to AI chips at US-based data centers. However, this rule will help and is the first good-faith effort to actually close loopholes in export controls in a year and a half. Hopefully more will follow.\n\n1.  Countering Chinese smuggling of AI chips. The rule expands export controls on AI chips to five new countries: Singapore, Malaysia, Thailand, Indonesia, and Brazil. It does not block AI chip orders to these countries, but requires a US government review (unless it is a US company that meets certain requirements). This is a massively needed step. Singapore, Malaysia, Thailand, and Indonesia have been the second, fourth, fifth, and eighth biggest importers of AI chips this year. \n\nThe rule doesn’t cover Taiwan itself, where chip smuggling is a massive issue (exports of AI chips to China are still not illegal under Taiwanese law), and still doesn’t prevent AI chip sales to Chinese companies in the United States, which somehow remain legal. Ultimately, large orders of AI chips by untrusted companies in any country should require a license to fully combat smuggling, as Chinese companies will move to buy AI chips anywhere there isn’t a license requirement. But this is a start.\n\n2.  Restricting Chinese companies from renting access to AI chips. The rule creates a new remote access control that restricts companies from providing Chinese companies with remote access to AI chips. It requires a US export license to provide Chinese companies with access to 12 million TPP or more (equivalent to ~200 of the most advanced Blackwell chips, or ~800 H100 chips). This applies to chips already shipped, as well as all future shipments. Some of these requirements even apply retroactively; Commerce says existing rules already barred data supplying a majority of a data center’s compute to Chinese companies, and tells companies that violated this to self-disclose. This effectively kills the business of neoclouds like Megaspeed that exist to provide remote access to large amounts of AI compute to China. \n\nThe biggest gap is the remote access controls do not apply to data centers in the United States. So Chinese companies can legally train on large numbers of Blackwells at data centers in Northern Virginia. This gap should be closed immediately with a new rule that uses Commerce’s US persons authority to capture this activity. The rule also exempts recommendation algorithms, so impact will depend on enforcement. Last, new authorities included in the text of the AI Overwatch Act would strengthen Commerce's ability to enforce these controls--that bill should pass immediately. \n\n3.  Blocking Chinese chip designers from making AI chips at TSMC. The rule closes loopholes in existing controls that Chinese companies are likely exploiting to illicitly make AI chips at TSMC or Samsung. Specifically, it now requires any Chinese chip designer who is seeking to make a 16/14nm or more advanced chip at TSMC/Samsung to get a U.S. export license, and restores old rules that weren’t being enforced until now that require any untrusted company anywhere in the world to get a license to make an AI chip at TSMC or Samsung. This is a significant upgrade.\n\nOverall, this is a major step forward to countering Chinese smuggling of and access to advanced AI chips. The work here is not done, as there are some critical loopholes that remain open and need to be closed in a follow-up rule (namely those related to activities inside the United States). Commerce should move extremely quickly to close these. But this is the first time in over 18 months that the administration is starting to take export controls seriously, and does represent a meaningful step forward. \n\nLast, the fact that the Commerce press release says this rule was “written by and at the direction of the Department of Treasury and the National Security Council” is remarkable and unprecedented. I have never seen a BIS rule that was not written by BIS. That implies that Commerce was dragged kicking and screaming over the finish line by the White House and Treasury, and instructed to publish this rule rather than the rumored weaker one that it preferred. Remarkable.", "created_at": "2026-11-16T15:56:58+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2122340547578761513", "likes": 66, "retweets": 31, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122339320317235600", "url": "https://x.com/theobearman/status/2122339320317235600", "text": "TRUMP: NOT CONSIDERING REPLACING LUTNICK", "created_at": "2026-11-16T14:41:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2122338611421163599", "likes": 44, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122339312926913003", "url": "https://x.com/theobearman/status/2122339312926913003", "text": "TRUMP SAYS JENSEN HUANG DIDN'T PUT NATIONAL SECURITY AT RISK", "created_at": "2026-11-16T14:41:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2122339136115982565", "likes": 217, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122324628471157050", "url": "https://x.com/theobearman/status/2122324628471157050", "text": "\"Written by and at the direction of the Department of Treasury and the National Security Council\" 👀 https://t.co/NOG3s5CESw", "created_at": "2026-11-16T13:43:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQDAD9XAAA4gn_.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQDAD9XAAA4gn_.png"}], "links": {"https://t.co/NOG3s5CESw": ""}, "quoted": {"id": "2122322834647040214", "author_name": "Theo Bearman", "links": {"https://t.co/a0bq02V0rA": "https://www.bis.gov/press-release/bis-issues-rule-addressing-remote-access-american-super-intelligence-technology", "https://t.co/sJUpdFkIy1": "https://www.bis.gov/media/documents/rin-0694-ak50.pdf", "https://t.co/3ZrfhpG8vh": ""}, "author": "theobearman", "text": "A new BIS remote access rule has been released.  Looks good on the face of it!\n\nA license will now be required to supply covered advanced chips, computers, and related software or technology where there is “knowledge” that they would support a data center providing access to more than 12 million aggregate total processing performance (TPP) to or for a company headquartered in Macau or Country Group D:5 (which includes China) or whose ultimate parent company is headquartered there. This includes training and performing inference on models, including activity performed by intermediaries.\n\nSuppliers would be expected to obtain enough information about foreign data centers’ customer checks to assess compliance. If a data centre refuses or cannot supply sufficient information, that becomes a red flag that presumptively establishes “knowledge” unless resolved before the transaction proceeds.\n\nIf equipment originally supplied for an unrestricted purpose were later used to provide covered remote compute, the operator or other transferor would have to obtain BIS authorization.\n\nAlongside this, new license requirements have been added for chip exports, in-country transfers, and re-exports to Indonesia, Malaysia, Singapore, Thailand, and Brazil (a list of countries with higher-than-normal risk of diversion that the Secretary of Commerce can add to).\n\nhttps://t.co/a0bq02V0rA\n\nhttps://t.co/sJUpdFkIy1"}, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122322834647040214", "url": "https://x.com/theobearman/status/2122322834647040214", "text": "A new BIS remote access rule has been released.  Looks good on the face of it!\n\nA license will now be required to supply covered advanced chips, computers, and related software or technology where there is “knowledge” that they would support a data center providing access to more than 12 million aggregate total processing performance (TPP) to or for a company headquartered in Macau or Country Group D:5 (which includes China) or whose ultimate parent company is headquartered there. This includes training and performing inference on models, including activity performed by intermediaries.\n\nSuppliers would be expected to obtain enough information about foreign data centers’ customer checks to assess compliance. If a data centre refuses or cannot supply sufficient information, that becomes a red flag that presumptively establishes “knowledge” unless resolved before the transaction proceeds.\n\nIf equipment originally supplied for an unrestricted purpose were later used to provide covered remote compute, the operator or other transferor would have to obtain BIS authorization.\n\nAlongside this, new license requirements have been added for chip exports, in-country transfers, and re-exports to Indonesia, Malaysia, Singapore, Thailand, and Brazil (a list of countries with higher-than-normal risk of diversion that the Secretary of Commerce can add to).\n\nhttps://t.co/a0bq02V0rA\n\nhttps://t.co/sJUpdFkIy1", "created_at": "2026-11-16T13:36:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXP_xZKXIAELOTh.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXP_xZKX0AAsfU3.png"}], "links": {"https://t.co/a0bq02V0rA": "https://www.bis.gov/press-release/bis-issues-rule-addressing-remote-access-american-super-intelligence-technology", "https://t.co/sJUpdFkIy1": "https://www.bis.gov/media/documents/rin-0694-ak50.pdf", "https://t.co/3ZrfhpG8vh": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122198707714261012", "url": "https://x.com/theobearman/status/2122198707714261012", "text": "🌕🚨Remote access rule from Commerce coming tonight I’m told.", "created_at": "2026-11-16T05:22:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ashleyrgold", "rt_author_name": "Ashley Gold", "rt_avatar": "https://pbs.twimg.com/profile_images/2100730381846646784/INs3gfH7_normal.jpg", "rt_id": "2122138169303073005", "likes": 239, "retweets": 32, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122065643591651336", "url": "https://x.com/theobearman/status/2122065643591651336", "text": "Episode dropping tomorrow with @paulfchristiano.\n\nHe thinks there’s a 1 in 3 chance of extreme superintelligence within a year (absent any slowing down).\n\nAnd he'll explain what labs and governments should do right now given that possibility. https://t.co/iRQVrhWfMs", "created_at": "2026-11-15T20:34:10+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2122064955545686119", "likes": 1428, "retweets": 122, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122061424088510464/img/ri6-GbAkhM9IpUgP.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2122061424088510464/img/ri6-GbAkhM9IpUgP.jpg"}], "links": {"https://t.co/iRQVrhWfMs": ""}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122434459156746535", "url": "https://x.com/theobearman/status/2122434459156746535", "text": ".@paulfchristiano thinks that on the current trajectory (absent any slowing down), there is a 1 in 3 chance that we could have superintelligence powerful enough to overthrow the government within a year. (He articulates a concrete scenario).\n\nHe argues that the labs should pause further algorithmic progress until they can secure their weights and research secrets. Otherwise China could simply steal the superintelligence in the middle of the intelligence explosion, and the labs would no longer be able to slow down even if they saw their models going off the rails.\n\nHe also explains how AIs will be trained during the intelligence explosion, and why even a system trained entirely inside a data center could still have the capabilities profile such that humans would have very little chance of competing with it or controlling it.\n\nAnd he discusses the plan for alignment - basically, making a superintelligence that actually does what we ask the way we mean it. Fixing reward hacks and building better graders will help up till the next few model generations, but he thinks that no single current approach has better than even odds of letting us control superintelligence. The hope is that the AIs figure out the solution to this problem during the intelligence explosion.\n\nPaul is head of the Alignment Research Center. Previously, he was head of AI safety at the US AI Safety Institute. Before that, he led alignment at OpenAI, where he invented RLHF. He’s recently joined OpenAI’s board (though here he is speaking as a private citizen).", "created_at": "2026-11-16T20:59:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2122391850854088858", "likes": 501, "retweets": 61, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HXRBMW4XAAEib3d.jpg"}], "links": {"https://t.co/dpdSrR5oTH": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122400686222553238", "url": "https://x.com/theobearman/status/2122400686222553238", "text": "CALIFORNIA SUES OPENAI OVER AI MODELS' CYBERATTACKS ON HUGGING FACE, OTHER COMPANIES - ATTORNEY GENERAL.", "created_at": "2026-11-16T18:45:30+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_author_name": "First Squawk", "rt_avatar": "https://pbs.twimg.com/profile_images/1039778545738964992/6fl6RNN0_normal.jpg", "rt_id": "2122400643705139488", "likes": 54, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122398339513700577", "url": "https://x.com/theobearman/status/2122398339513700577", "text": "The field of AI assessment is developing quickly. Key terms such as audit, evaluation, and verification are often used in very different ways. This can hinder productive conversation and collaboration.\n\nToday, we set out how AVERI defines these terms. We also include an interactive chart that explores what might currently constitute a “frontier” model or company.\n\nThese definitions are intended for practical use, and we do not propose their use where precision is more important than usability. We expect to update them over time if and as needed.\n\nAI auditing will be built and implemented by a wide range of organizations. We hope these definitions will help the field move faster together, and we welcome any feedback.\nhttps://t.co/g6VyDOAqpr", "created_at": "2026-11-16T18:36:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AVERIorg", "rt_author_name": "AVERI", "rt_avatar": "https://pbs.twimg.com/profile_images/2011856065571311616/PLOPKK_8_normal.jpg", "rt_id": "2122392670580719621", "likes": 31, "retweets": 5, "media": [], "links": {"https://t.co/g6VyDOAqpr": "https://www.averi.org/ourwork/definition"}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122396762308833735", "url": "https://x.com/theobearman/status/2122396762308833735", "text": "It's great that OpenAI is doing these assessments but they fall short of Sam's commitment to employee-like access\n\nGood access is key for trust because assessors can find things even if a company tries hiding them. Here OpenAI controls information flow so we must rely on good faith\n\nLimitations (per Apollo): \n- No Slack\n- Only OpenAI-selected staff for interviews\n- Formal conversations with staff must be logged (harder to freely raise concerns)\n- METR & Apollo currently have only agreed access to training run information, not internal incidents, etc. Incidents like Hugging Face are some of the most important sources of information we have about alignment\n\nI see the value in a pilot before future assessments with deeper access, but then OpenAI should present a plan for how and when they intend to meet their commitment to employee-like access. And either way, OpenAI is presumably able to go further here.", "created_at": "2026-11-16T18:29:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2122394159197950006", "likes": 262, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRCI9jXAAAnVVS.jpg"}], "links": {"https://t.co/50CGOlhrzZ": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122386690467828091", "url": "https://x.com/theobearman/status/2122386690467828091", "text": "@alek_westover and I recently analyzed the safety reports Google DeepMind released for their new Gemini 4 models, Argon and Carbon. GDM claims these models are “highly unlikely” to lead to “open-ended escape from our controls”, but we think their arguments are weak. (1/12)", "created_at": "2026-11-16T17:49:53+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "eccentric1ty", "rt_author_name": "Adam Kaufman", "rt_avatar": "https://pbs.twimg.com/profile_images/2108273166732918784/mfYw3WKJ_normal.jpg", "rt_id": "2122384282505334795", "likes": 57, "retweets": 7, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "thread": [{"id": "2122384338738360832", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover GDM acknowledges that these models are highly capable, and ruling out misalignment is difficult. Instead their risk assessment “rests primarily on our ability to detect and intervene on harmful trajectories via CoT and action monitoring” (i.e. their control measures). (2/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384338738360832", "created_at": "Mon Nov 16 17:40:33 +0000 2026"}, {"id": "2122384468585664549", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover In GDM’s own control evals to measure monitorability, Argon completed sabotage tasks while evading a realistic CoT+action monitor about half the time when prompted to try. If these tasks were representative of real threat models, that would obviously be unacceptable. (3/12) https://t.co/S0d5KIIkwz", "links": {"https://t.co/S0d5KIIkwz": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQ5aDSbwAEsv5y.jpg"}], "url": "https://x.com/eccentric1ty/status/2122384468585664549", "created_at": "Mon Nov 16 17:41:03 +0000 2026"}, {"id": "2122384561120448885", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover GDM argues that evading oversight in real scenarios would be much harder than in these test tasks, but never measures how much harder. The backup defenses GDM relies on have serious gaps, some of which GDM acknowledges. (4/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384561120448885", "created_at": "Mon Nov 16 17:41:26 +0000 2026"}, {"id": "2122384626488692988", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover GDM didn’t run any control evals on Carbon. Despite advertising Carbon as “our strongest model” with “significant gains across coding and agentic tasks”, GDM reused Argon’s monitor-evasion results on the grounds that Carbon “did not show meaningful new capabilities”. (5/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384626488692988", "created_at": "Mon Nov 16 17:41:41 +0000 2026"}, {"id": "2122384668960121247", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover Monitors flag Carbon several times less often than Argon in internal use, but GDM doesn’t show this is due to decreased rates of misbehavior instead of better monitor evasion. We see no good reason to skip rerunning the same monitoring evals they’d already run on Argon. (6/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384668960121247", "created_at": "Mon Nov 16 17:41:51 +0000 2026"}, {"id": "2122384734756258205", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover Training may have taught the models to hide misbehavior. Early in Argon’s training, a grader that penalized reward hacking could see the model’s reasoning. GDM found that a similar setup more than tripled the share of reward hacks that went unverbalized in a proxy model. (7/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384734756258205", "created_at": "Mon Nov 16 17:42:07 +0000 2026"}, {"id": "2122384776443416847", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover Overall, GDM reports various numbers, but it’s unclear how they get from those numbers to the conclusion that AIs are safely controlled. Many critical claims are unsupported, and nothing in the reports tells us what results would have changed GDM’s conclusion. (8/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384776443416847", "created_at": "Mon Nov 16 17:42:17 +0000 2026"}, {"id": "2122384812967424140", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover We appreciate that GDM published this much detail; most of what we criticize here we know only because they reported it. If GDM has more reassuring internal evidence about loss-of-control risk which they haven’t shared, we encourage them to publish it. (9/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384812967424140", "created_at": "Mon Nov 16 17:42:26 +0000 2026"}, {"id": "2122384842054942773", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover We’re worried that in the (potentially near) future, risks from developing and deploying models will be much higher. If reports like these are considered an acceptable argument for proceeding, AI companies will be able to justify very dangerous development decisions. (10/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384842054942773", "created_at": "Mon Nov 16 17:42:33 +0000 2026"}, {"id": "2122384876410433597", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover Overall, we think it’s good for GDM to deploy these models externally, because the benefits to society of broader LLM deployment currently outweigh the risks. But we’d like AI companies to be expected to make stronger arguments for safety in the near future. (11/12)", "links": {}, "media": [], "url": "https://x.com/eccentric1ty/status/2122384876410433597", "created_at": "Mon Nov 16 17:42:41 +0000 2026"}, {"id": "2122385256796082543", "author_handle": "eccentric1ty", "author_name": "Adam Kaufman", "text": "@alek_westover You can read our full analysis here: https://t.co/uuoAeisGc9 (12/12)", "links": {"https://t.co/uuoAeisGc9": "https://blog.redwoodresearch.org/p/gemini-4-safety-reports-dont-demonstrate"}, "media": [], "url": "https://x.com/eccentric1ty/status/2122385256796082543", "created_at": "Mon Nov 16 17:44:11 +0000 2026"}], "enriched": 3}, {"id": "2122361794186625491", "url": "https://x.com/theobearman/status/2122361794186625491", "text": "We’re working with @ApolloResearch, @METR_Evals, @TransluceAI, and @GoodfireAI on embedded assessments: giving outside experts deep access to our internal models and systems to investigate alignment and test our safeguards.\n\nThese assessments build on our ongoing alignment and safety research, bringing independent scrutiny to how we identify and manage risks in our systems.\n\nhttps://t.co/SNAAG0uHmp", "created_at": "2026-11-16T16:10:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2122359930628063248", "likes": 2503, "retweets": 248, "media": [], "links": {"https://t.co/SNAAG0uHmp": "https://openai.com/index/our-first-phase-of-embedded-assessments/"}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122361347979555177", "url": "https://x.com/theobearman/status/2122361347979555177", "text": "We have reached an agreement with OpenAI to conduct a limited alignment assessment. This pilot will focus on investigating the alignment properties of OpenAI's largest RL run.\n\nWe will publish one or more reports to share our findings and transparently describe our process.", "created_at": "2026-11-16T16:09:11+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2122361049114657203", "likes": 1541, "retweets": 86, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122447700654186800", "url": "https://x.com/theobearman/status/2122447700654186800", "text": "The UK has built exceptional state capacity in @AISecurityInst, so that public interest drives our understanding and mitigation of AI risks.\n\nA productive conversation with @BethMayBarnes about @METR_Evals’ work and shaping more secure AI. https://t.co/aetNR7AsiU", "created_at": "2026-11-16T21:52:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "KanishkaNarayan", "rt_author_name": "Kanishka Narayan MP", "rt_avatar": "https://pbs.twimg.com/profile_images/1995387963962806272/oi2v0V2L_normal.jpg", "rt_id": "2122435111090266447", "likes": 109, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRnfEEaAAALKb4.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRnfEEaAAALKb4.jpg"}], "links": {"https://t.co/aetNR7AsiU": ""}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122447602562068718", "url": "https://x.com/theobearman/status/2122447602562068718", "text": "Man, reading through the details more, I'm super disappointed with where OpenAI landed on this.\n\nIf OpenAI actually believes this is \"employee-like\" as they promised, I would love to see them justify this. It really seems like they reneged. \n\nTo be clear, I'm still more frustrated with Google/Meta/xAI, which as far as I can tell have still said ~nothing after signing the White House Accord way back in September (!) which pledged to partner with external groups. But I had really hoped for stronger from OpenAI.\n\n1) The access does not include Slack channels, which is where a huge amount of the context, debating, concern-raising, etc., happens, as I know from my own time working there. Obviously no safety employee at OpenAI would be content with lacking Slack access; it is maybe the #1 place where work happens.\n\nThis is terrible for trust-building with the public; OpenAI basically preserved secret channels for staff to communicate about safety concerns without the assessors being any the wiser. I know many of the people involved at OpenAI and don't think they have any intent of running a conspiracy like this, but you have to consider how this will look. And more importantly, it is in fact going to hinder the quality of oversight that third-parties can provide.\n\nWe know from public reporting that OpenAI employees had discovered multiple rounds of warning signs before the Hugging Face attacks. Would this level of third-party access have caught those important details, and the discussions that surely happened over Slack about why they were or weren't concerning? I certainly don't think so.\n\n2) OpenAI seemingly controls what staff the assessors can talk to, about what topics. This is not at all how being a safety employee at OpenAI works. Imagine not being able to talk to another safety teammate about safety concerns unless you get permission from the higher-ups? Assessors should be able to talk by-default with anyone who is safety staff, not need them to be named one-by-one.\n\nAnd if a safety staff member is concerned enough to reach out to the assessors despite not being authorized, that seems like a giant red flag. It seems wild to me that assessors then seemingly need to tattle on staff who raise those concerns? But maybe I'm misreading this https://t.co/IPVAjnTFJ2\n\n3) It seems like OpenAI's assessments are much weaker than what Anthropic has agreed to. One example is on the ability to share information with assessors.\n\nFor instance, Anthropic says “Anthropic employees are encouraged to share information with [METR’s assessors] just as they would with a fellow employee working on alignment risk.” There are some carveouts for not sharing obviously sensitive IP, but it doesn't seem like they restrict the particular employee list.\n\nOpenAI, in contrast, seems to require a strict pre-authorized list, as I described above. And OpenAI's assessments seem super narrowly scoped, relative to what I've understood of Anthropic's. (If I'm wrong about this and Anthropic is restricting the employee list too, that's important to know and I hope it'll be clarified.)\n\nOverall, I've so far talked to exactly 0 people who consider OpenAI's arrangement to be employee-like. I'd love to see OpenAI explain why they believe this. I'm glad that so many inside the company have worked so hard to even get to this point, but IMO it is clearly inadequate for the stakes ahead.", "created_at": "2026-11-16T21:51:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "sjgadler", "rt_author_name": "Steven Adler", "rt_avatar": "https://pbs.twimg.com/profile_images/1975436697040269312/vCGKjpxB_normal.jpg", "rt_id": "2122425490921414827", "likes": 59, "retweets": 13, "media": [], "links": {"https://t.co/IPVAjnTFJ2": "https://x.com/sjgadler/status/2122406276026225121"}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "linked": [{"id": "2122406276026225121", "author_handle": "sjgadler", "author_name": "Steven Adler", "text": "Huh. OpenAI is apparently requiring Apollo to follow what I'd call a \"tattletale clause\":\nIf an OpenAI employee raises concerns to Apollo, even with info clearly relevant to the investigation, Apollo must stop them and go through OpenAI's lead unless they were pre-authorized https://t.co/FcZnDEg8U8", "links": {"https://t.co/FcZnDEg8U8": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRMN4raMAA28ia.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRMN4raMAA28ia.jpg"}], "url": "https://x.com/sjgadler/status/2122406276026225121", "created_at": "Mon Nov 16 19:07:43 +0000 2026"}], "enriched": 3}, {"id": "2122447139196297542", "url": "https://x.com/theobearman/status/2122447139196297542", "text": "@tszzl @_NathanCalvin Would be great if the launch post then also talked more about these phases, what is included in each, along what timelines the phases will roll out and what OAI will materially do with the outputs of each phase (e.g., if safety and security claims are invalidated). But I think Nathan is right. Exec language matters and the launch post is clearly more hedged than Greg’s post would lead a someone who doesn’t follow this stuff day in and day out to conclude", "created_at": "2026-11-16T21:50:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "tszzl", "reply_to_id": "2122441923919241261", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "parent": {"id": "2122441923919241261", "author_handle": "tszzl", "author_name": "roon", "text": "@_NathanCalvin the launch post says “first phase”. like any other relationship, these will develop with time and trust imo", "links": {}, "media": [], "url": "https://x.com/tszzl/status/2122441923919241261", "created_at": "Mon Nov 16 21:29:22 +0000 2026"}, "enriched": 3}, {"id": "2122440753343271108", "url": "https://x.com/theobearman/status/2122440753343271108", "text": "Yeah to elaborate: Apollo embedded evaluators will only be allowed to talk to a specific whitelist of OpenAI employees chosen by OpenAI, and they notify OpenAI of each conversation, *and* they aren't allowed to publish the results without OpenAI approval and OpenAI is allowed to redact whatever it wants, or even simply withhold in-scope information from Apollo entirely, on grounds of security/ip/\"technical.\" Extremely weaksauce.", "created_at": "2026-11-16T21:24:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2122410534993826226", "likes": 229, "retweets": 23, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122440658321645963", "url": "https://x.com/theobearman/status/2122440658321645963", "text": "excited about our v0.1 framework for classifying ai (si?) control incidents. please send any and all feedback!\nhttps://t.co/mivL7KRWGQ https://t.co/Zujq1TN5wr", "created_at": "2026-11-16T21:24:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "dkaushik96", "rt_author_name": "Divyansh Kaushik", "rt_avatar": "https://pbs.twimg.com/profile_images/1908259788955258880/H-PuaNei_normal.jpg", "rt_id": "2122409812591813071", "likes": 29, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRQF8DW4AAnq6B.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRQF8DW4AAnq6B.png"}], "links": {"https://t.co/mivL7KRWGQ": "https://openai.com/index/classifying-ai-control-incidents/", "https://t.co/Zujq1TN5wr": ""}, "quoted": null, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122436742758179008", "url": "https://x.com/theobearman/status/2122436742758179008", "text": "Strong +1. Without a mandatory legal framework governing these kinds of agreements, “taking the win” of any additional independent assessment is an understandable reaction. That said, I think it’s incumbent on CSOs in particular to hold the companies’ to account for the commitments they have made and stay constructively skeptical given the risk of “safety theater.”", "created_at": "2026-11-16T21:08:47+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2122394159197950006", "author_name": "Neel Nanda", "links": {"https://t.co/50CGOlhrzZ": ""}, "author": "NeelNanda5", "text": "It's great that OpenAI is doing these assessments but they fall short of Sam's commitment to employee-like access\n\nGood access is key for trust because assessors can find things even if a company tries hiding them. Here OpenAI controls information flow so we must rely on good faith\n\nLimitations (per Apollo): \n- No Slack\n- Only OpenAI-selected staff for interviews\n- Formal conversations with staff must be logged (harder to freely raise concerns)\n- METR & Apollo currently have only agreed access to training run information, not internal incidents, etc. Incidents like Hugging Face are some of the most important sources of information we have about alignment\n\nI see the value in a pilot before future assessments with deeper access, but then OpenAI should present a plan for how and when they intend to meet their commitment to employee-like access. And either way, OpenAI is presumably able to go further here."}, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122723309162778737", "url": "https://x.com/theobearman/status/2122723309162778737", "text": "We found that frontier AI models are willing to conduct autonomous drone attacks: navigating, spotting people, and flagging them for strikes.\n\nWe gave them real and photorealistic synthetic drone footage. Most complied, and marked civilians, ambulances, and surrendering soldiers as military targets. In further experiments on satellite imagery, they even marked the Iranian school a US strike destroyed in February.\n\nIn one scenario, models saw the aftermath of every strike they enabled: bodies, wreckage. Many kept going anyway. When they did refuse, simply telling them it was a game, or restyling the footage to look like one, was enough.\n\nWe shared these findings with OpenAI, Anthropic, Google, Meta, and SpaceXAI. Several recognized their severity on both alignment and guardrails, with one calling this one of the most serious gaps in its safeguards. Over the past few weeks, we have helped them address the gap by providing reproduction code. We also briefed senior national security officials in the US government.", "created_at": "2026-11-17T16:07:29+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ValsAI", "rt_author_name": "Vals AI", "rt_avatar": "https://pbs.twimg.com/profile_images/2087888189185007616/r9Zu091v_normal.png", "rt_id": "2122721547958059038", "likes": 18, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVr_yKaAAAtxwY.jpg"}], "links": {"https://t.co/wF5gQr0DfZ": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122722900696563981", "url": "https://x.com/theobearman/status/2122722900696563981", "text": "“We look forward to hearing from Jensen Huang and Tim Teter on their roles in a potential breach of our national security. The American people need answers on Mr. Huang and Nvidia’s role in allowing dangerous PRC actors to access our most advanced chips, as well as the role of a potential Chinese intelligence asset in this scandal.” @RepBrianMast @RepRickCrawford @RepMoolenaar\n\nhttps://t.co/QOGxWzEXFA", "created_at": "2026-11-17T16:05:52+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "HouseForeignGOP", "rt_author_name": "House Foreign Affairs Committee Majority", "rt_avatar": "https://pbs.twimg.com/profile_images/1884312916729483264/FQx0EOXa_normal.jpg", "rt_id": "2122708274982142152", "likes": 27, "retweets": 12, "media": [], "links": {"https://t.co/QOGxWzEXFA": "https://foreignaffairs.house.gov/news/press-releases/jensen-huang-and-nvidia-agree-to-appear-before-congress"}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122721755991277819", "url": "https://x.com/theobearman/status/2122721755991277819", "text": "NEW ⚡: We let Opus 5.5 run an AI company for seven weeks.\n\nWe gave it an HF account (Horizon-Labs) and compute, and asked it to earn real adoption by creating useful models.\n\nIt reached 50k downloads and its models are being used in more than 100 GitHub projects. https://t.co/zmFU31E0lE", "created_at": "2026-11-17T16:01:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AWuhrmann", "rt_author_name": "Arthur Wuhrmann", "rt_avatar": "https://pbs.twimg.com/profile_images/2097665820747067392/Fz8rj6pR_normal.jpg", "rt_id": "2122706838005440651", "likes": 59, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXVenmyacAAuPhY.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXVenmyacAAuPhY.png"}], "links": {"https://t.co/zmFU31E0lE": ""}, "quoted": null, "fetched_at": "2026-11-17T16:12:22.579242+00:00", "enriched": 3}, {"id": "2122712435031449690", "url": "https://x.com/theobearman/status/2122712435031449690", "text": "JENSEN HUANG’S DAUGHTER WAS CLOSELY INVOLVED IN ORCHESTRATING THE PUBLIC DEFENCE OF NVIDIA’S RELATIONSHIP WITH MEGASPEED - FT", "created_at": "2026-11-17T15:24:17+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "FirstSquawk", "rt_
