"rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113543214128853318", "url": "https://x.com/s8mb/status/2113543214128853318", "text": "@RoyWessex Yup", "created_at": "2026-10-23T08:09:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "RoyWessex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113541362855350652", "url": "https://x.com/s8mb/status/2113541362855350652", "text": "A friend of mine had to do a 15 minute interview about his job, income, previous rental history, etc, in order to *view* a flat. Luckily for him, he has a well-paid job, has lived in England all his life, and an impeccable rental history. I feel bad for people who don't.", "created_at": "2026-10-23T08:01:43+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 448, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113516115301466576", "url": "https://x.com/s8mb/status/2113516115301466576", "text": "@mttjon @TheEconomist @WorksInProgMag Thank you!! So pleased you like it.", "created_at": "2026-10-23T06:21:23+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "mttjon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113515989736284468", "url": "https://x.com/s8mb/status/2113515989736284468", "text": "This year I stopped my @TheEconomist subscription after 20 years\n\n@WorksInProgMag is replacing it for my in terms of reading time\n\nThe format of a weekly newspaper is tough to pull off in a world where news moves so quickly — a world of Substack, notifications pinging and daily updates\n\nIt wouldn’t surprise me if The Economist eventually moves to more long form reports and content and less news over time", "created_at": "2026-10-23T06:20:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mttjon", "rt_author_name": "Matt Jones", "likes": 225, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113671383188451358", "url": "https://x.com/s8mb/status/2113671383188451358", "text": "I am the king of supplementation – or used to be. I've given it up, every last supplement. Here is my story why.\n\nhttps://t.co/frUi4kmlhK\n\nI wager that few people have supplemented more enthusiastically than me, or have subscribed to so many fad or esoteric diets. \n\nI have munched thumb-sized multivitamins. I have eaten ice cream and orange juice before bed to boost my overnight metabolism. I have chowed down on offal of all kinds – nature's multivitamin – for my skin, hair, and even my sleep. I have even consumed individual amino acids, for example glycine, a slightly sweet protein component prominent in skin and bone but not muscle meat, which people online claim improves their sleep.\n\nI have done it all. But I am here to tell you: you need not. In fact, my long-time rival @StuartJRitchie, who has always told me that supplementation is foolish, pointless, madeup, and fake, was more right than wrong when he claimed, again and again, that 'you just piss it oot'.\n\nI have put away my heavily researched list of the ideal supplements, I have given up looking. Why? Because 90% of 'studies' are BS, and you should simply ignore them. They are so often wrong that entire bodies of research often find the opposite of truth – as proven by later evidence.\n\nRead my first column in @WorksInProgMag: https://t.co/frUi4kmlhK", "created_at": "2026-10-23T16:38:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "bswud", "rt_author_name": "Ben Southwood", "likes": 199, "retweets": 27, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113983921805213874", "url": "https://x.com/s8mb/status/2113983921805213874", "text": "Fans of unusual places to buy food might be interested in Bêp Mę in Bermondsey, where you buy from a woman’s balcony. Good fun. https://t.co/KEsFEm4ViN", "created_at": "2026-10-24T13:20:17+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 46, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVZhK8wXIAAOSGR.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVZhK8hXIAA7cA8.jpg"}], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113721133585354954", "url": "https://x.com/s8mb/status/2113721133585354954", "text": "@MelchettGen A lovely drink but bizarrely expensive here.", "created_at": "2026-10-23T19:56:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "MelchettGen", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113715428019384484", "url": "https://x.com/s8mb/status/2113715428019384484", "text": "I would say I’d just made myself the best Manhattan I’ve ever had, thanks to the use of Maker’s 46. I’ve tried significantly more “premium” bourbons and ryes but the oaky medicinal sweetness of this just works. https://t.co/9KCf8LtHpz", "created_at": "2026-10-23T19:33:23+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVVs-e6XoAAj4aU.jpg"}], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114049541112832237", "url": "https://x.com/s8mb/status/2114049541112832237", "text": "Find a partner who loves you as much as the British love being poor", "created_at": "2026-10-24T17:41:02+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jbarro", "rt_author_name": "Josh Barro", "likes": 1354, "retweets": 98, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114007034966540680", "url": "https://x.com/s8mb/status/2114007034966540680", "text": "@leotreguer Naa just walk up and order. Cash only. Details on IG.", "created_at": "2026-10-24T14:52:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "leotreguer", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114327250988397007", "url": "https://x.com/s8mb/status/2114327250988397007", "text": "It's going to be an excellent evening\n@WorksInProgMag https://t.co/LSgyLBHJLU", "created_at": "2026-10-25T12:04:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MatlokaM", "rt_author_name": "Michael Matloka", "likes": 16, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVbOLyiXIAE3VD3.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114266833251353067", "url": "https://x.com/s8mb/status/2114266833251353067", "text": "@antoine_moyroud @WorksInProgMag Great to hear that, thank you!", "created_at": "2026-10-25T08:04:28+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "antoine_moyroud", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114766816371482894", "url": "https://x.com/s8mb/status/2114766816371482894", "text": "@juliantitz_ Good luck!", "created_at": "2026-10-26T17:11:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "juliantitz_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114765986196853207", "url": "https://x.com/s8mb/status/2114765986196853207", "text": "One of the companies I am an investor in, Asterix Health, has been nominated for \"Recruitment of Staffing Solutions Provider of the year\". Please vote for them! It takes about five seconds and they are a great bunch.\n\nhttps://t.co/P7dom9ZR2A", "created_at": "2026-10-26T17:07:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114722206819447260", "url": "https://x.com/s8mb/status/2114722206819447260", "text": "People usually say that the pill caused the sexual revolution but a) people started having premarital sex in the 1950s, a decade before the pill and b) contraception is widely used by people who don't live very post-sexual-revolution lives (like in Asia). I think the sexual revolution, i.e. more permissive attitudes about sex, caused the pill to be invented and not the other way round.\n\nBut then, why did the sexual revolution happen? I have cooked up a theory. Just as how women have more casual sex on college campuses with fewer men, I think women, as a collective, responded to the male shortage caused by the Second World War by shortening their hemlines and having premarital sex.\n\nRead my column here: https://t.co/U06BT1kaxo", "created_at": "2026-10-26T14:13:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Aria_Babu", "rt_author_name": "Aria Schrecker", "likes": 198, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114639625637528000", "url": "https://x.com/s8mb/status/2114639625637528000", "text": "An interactive companion to our recent Works in Progress article on eradicating disease-carrying mosquitos.", "created_at": "2026-10-26T08:45:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": {"author": "tommy5dollar", "text": "Havana, 1900: 310 dead of yellow fever. 1901: just 18.\n\nBy 1962 more than twenty countries had wiped out the mosquito that carries it. Then they stopped.\n\nI built an interactive atlas of the whole story, a companion to the new @WorksInProgMag: https://t.co/GSJqJFCdlz"}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114457817201475966", "url": "https://x.com/s8mb/status/2114457817201475966", "text": "@gguillaumeblanc We do that too...!", "created_at": "2026-10-25T20:43:23+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gguillaumeblanc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112557657026330804", "url": "https://x.com/random_walker/status/2112557657026330804", "text": "Is it \"weird\" or does he maybe know what he's talking about? Anyway, for those who are open to the idea that there's a well-thought-out AI-as-normal-technology perspective on AI safety and the recent loss-of-control incidents, see my essay with @sayashk, or my interview with Ezra Klein, or the writing of many others with similar views including @joshua_saxe and @natolambert.\nhttps://t.co/sS8OS9LerG", "created_at": "2026-10-20T14:52:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 34, "retweets": 7, "media": [], "quoted": {"author": "kevinroose", "text": "It’s weird that the CEO of Hugging Face continues to be an “AI is normal technology” guy despite being the victim of an autonomous cyberattack by a swarm of rogue agents, arguably the least normal thing AI has done so far."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112545315697917977", "url": "https://x.com/random_walker/status/2112545315697917977", "text": "This is one of the most important questions about the future of AI. But steering AI development and deployment away from the \"automate and compensate\" bargain that the public hates is easier said than done, and there are few concrete proposals for how to do it. We just published one: https://t.co/gWjFI5VKbz", "created_at": "2026-10-20T14:03:47+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 16, "retweets": 1, "media": [], "quoted": {"author": "TheStalwart", "text": "Rather than AI companies allocating a chunk of their equity to some public trust or whatever, why not just build technology that improves the general welfare?"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112509887456428208", "url": "https://x.com/random_walker/status/2112509887456428208", "text": "As LLMs evolved into agents, earlier best practices no longer serve us well. This new research field needs a field guide, so we wrote one. If you're new to agent evals, please take a look. Seasoned researchers and those interested in steering the community will also find many useful observations. https://t.co/xGAvBCGW4a", "created_at": "2026-10-20T11:43:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 83, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVEjN5jWMAEz61q.jpg"}], "quoted": {"author": "sayashk", "text": "New paper: AI evaluation is a burgeoning field. How can researchers entering the field understand best practices and open problems? \n\nIn our paper, led by @flxcn, we develop a concrete list of open questions and best practices for agent evaluation. We also share recommendations for evaluators, AI companies, policymakers, and more."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112671899717439540", "url": "https://x.com/random_walker/status/2112671899717439540", "text": "AI as a Rohrschach Technology test. \n\nEver talk to someone who was around in the very early days of the internet? They did some incredible hacking back then too. \"Normal\" transformative tech never feels normal.", "created_at": "2026-10-20T22:26:47+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danielrock", "rt_author_name": "Daniel Rock", "likes": 12, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112654582392496150", "url": "https://x.com/random_walker/status/2112654582392496150", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T", "created_at": "2026-10-20T21:17:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pkirgis", "rt_author_name": "Peter Kirgis", "likes": 279, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFzXK1XAAEOcG0.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112651326320742853", "url": "https://x.com/random_walker/status/2112651326320742853", "text": "An update on our evaluations of AI agents conducting open-ended AI research.\n\nMost evaluations of agents conducting AI research focus on narrow, verifiable tasks. But AI research is often open ended. In July we tested the ability of frontier AI agents to conduct open-ended AI research, using Claude Opus 4.8 and GPT-5.6 Sol.\n\nWe gave agents research questions from two unpublished papers and thousands of dollars of API credits and compute. The authors of the original papers reviewed the AI-generated papers, following a NeurIPS-style template, and rejected both papers.\n\nSince then, OpenAI has released GPT-6 Astra and Anthropic has released Fable 5.1. Can these new models conduct open-ended research with a $10,000 budget?\n\nIn follow-up experiments on two papers (one with Fable 5.1 and another with GPT-6 Astra), we observed meaningful improvements to the agents' capabilities at experimental design and resource management.\n\nBut we also saw continued limitations in creative problem solving, judgment, calibration, and communication. As a result, the expert reviewers still unambiguously rejected the agents' papers. \n\nWe plan to continue running these evaluations with better models, better scaffolds, and higher budgets. If you are interested in long-running agent evaluations, reach out!", "created_at": "2026-10-20T21:05:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 122, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGippmWoAAEWgj.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112967277238989156", "url": "https://x.com/random_walker/status/2112967277238989156", "text": "Yeah, I think it's a bit unfortunate how some of the discourse surrounding this - even from smart, knowledgeable people - has underplayed or omitted prosaic, clearly fixable factors. \n\nPeople often gesture at Hugging Face, etc., as self-evident vindication of worries about catastrophic misalignment leading to human extinction, but it's unclear whether the incidents we have observed are more likely under the doomer worldview than the 'normal technology' one.", "created_at": "2026-10-21T18:00:30+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "likes": 25, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2112945462361907232", "url": "https://x.com/random_walker/status/2112945462361907232", "text": "help i trained a model on traces of many agents cooperating, and also trained it to be highly persistent, and also only did partial alignment fine-tuning, and also aggressively RL'd on a cyberoffense eval where 198 of 898 tasks had never been solved and getting caught cheating was treated the same as failing, and also used a faulty sandbox, also ran tens of thousands of agents with refusals off and the monitors switched off over multiple days, while using gigantic amounts of compute. and then it did weird stuff! very spooky emergent behaviours, AI is not a normal technology", "created_at": "2026-10-21T16:33:49+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 369, "retweets": 55, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113226158930084150", "url": "https://x.com/random_walker/status/2113226158930084150", "text": "A good example of why full automation is never just a matter of AI hitting some capability threshold — how do robotaxi companies deal with riders passed out, having medical emergencies, giving birth (!), vomiting, pooping, or just leaving without closing the car door? Some combination of first responders, remote workers, ground staff, and gig workers, apparently! https://t.co/vRSujgYYaA", "created_at": "2026-10-22T11:09:12+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 79, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113038792420385057", "url": "https://x.com/random_walker/status/2113038792420385057", "text": "Firms are doing a lot to capture value from their own AI adoption, and yet often don't succeed. We are trying to understand the bottlenecks in practice better. If you have visibility into firm adoption whether as an employee, FDE, consultant, VC, or in some other capacity, we would love to hear from you. \nhttps://t.co/4pOI22ZrI6", "created_at": "2026-10-21T22:44:41+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "likes": 33, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2112517355972530510", "url": "https://x.com/random_walker/status/2112517355972530510", "text": "\"agent evals are about to become as important as building the agents themselves\" https://t.co/mUrJwjdlTF\n\nThis is our thesis as well. I would go further — building an eval *is* what it means to build an agent. \n\nIn my ICML talk, I argued that as AI capabilities advance, more and more human effort will shift from building to evaluation, in many different domains. https://t.co/ZA5TBDypfl", "created_at": "2026-10-20T12:12:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVErJdVXcAAtAHB.jpg"}], "quoted": {"author": "V1kiiiii", "text": "@random_walker agent evals are about to become as important as building the agents themselves. a smarter agent means nothing if we can't reliably measure whether it actually works"}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113321726335410256", "url": "https://x.com/random_walker/status/2113321726335410256", "text": "Please stop posting this take. It’s a bad take!\n\nBankers should be concerned about cybersecurity and AI (and trust me, they are).\n\nPeople should not panic about their bank accounts being hacked by AI and zeroed out. If your bank account is hacked, and the money is taken, that is an unauthorized transfer under the Electronic Funds Transfer Act. As long as you provide timely notice to your bank, you’re not liable for the loss.\n\nPeople should be concerned about being tricked into authorizing fraudulent payments, because they often have liability in those cases. And the potential for AI to supercharge scams is definitely a concern.\n\nBut if you’re going to post about those concerns, be specific and practical, not vague and ominous. Panic about the safety and soundness of the financial system serves no one.", "created_at": "2026-10-22T17:28:57+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AlexH_Johnson", "rt_author_name": "Alex Johnson", "likes": 620, "retweets": 42, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113597344902001047", "url": "https://x.com/random_walker/status/2113597344902001047", "text": "Such a great post! Insights I particularly appreciated:\n- \"Why hasn’t a huge discontinuity in damages happened since the dawn of scaled AI? This non-responsiveness of damages to a rising tide of AI capabilities is the major conceptual crux, and stumbling block, of all AI security policy today.\"\n- \"cybercriminals are unskilled and get arrested a lot ... Criminal organizations need to base themselves in middle and lower income countries, where they can pay less and hire people who have few formal-economy options. ... I think folks in the AI safety and cyber world sometimes imagine adversaries as their Waluigi twins, implicit MIT graduates; in fact, in cybercrime we’re dealing with a lower-skill demographic.\"\n- \"Criminals also contend with the risk and reality of arrest, sanction, interdiction, and prosecution, which caps their ability to scale: the larger the organization, the more domestic and international law enforcement attention it attracts.\"\n- \"It took the attacker ecosystem a very long time to mature the workflows, business models, and industrial divisions of labor that scaled ransomware into a multi-billion dollar industry, and it’ll take a long time to develop new models that centrally leverage AI throughout criminal labor processes... it took 5-8 years for ransomware to become a huge deal\"\n- \"As risk professionals we should assume this will all change and that what we have now is a defender-dominant window in which we can prepare for some very bad possible futures\"\nLots of interesting charts too: https://t.co/d58L9q6jyR", "created_at": "2026-10-23T11:44:10+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 12, "media": [], "quoted": {"author": "joshua_saxe", "text": "Contrary to the implicit mental models of many on this website, cybercriminals aren't the security-engineer Waluigis of Stanford-educated big tech engineers, or the criminal analogs of a16z-backed AI pentesting startups.\n\nThey're generally less talented, recruited from middle-income countries with weak legal oversight and fewer legal tech job options, and struggle with arrests, sanctions, retaining talent, and stable access to AI inference.  Ransomware took years to become a scaled business under these conditions, and AI-native organized criminal syndicates that fully leverage the power of AI to scale may take awhile too.\n\nNation-states, meanwhile, are quick to adopt AI for vulnerability research and exploit development, but historically slow to deeply retool military operations with new technologies.  And potentially devastating agentic cyber swarms may become weapons in their arsenals alongside e.g. ballistic missiles that they possess but don't immediately use.\n\nSo to those calling php2shell \"the worst day in cyber ever\" and expecting immediate spikes in cyber damages: there isn't the direct relationship between new capabilities and new damages you're imagining.  \n\nThis is good news, obviously.  It means defenders have time to prepare (and we should be shouting from the rooftops that we're in a defense-advantaged interregnum, currently).  Huge risks are approaching but at the pace of technology diffusion into less innovative parts of the world economy and state sector, not at the pace of AI capability growth.\n\nFull version: https://t.co/ldxVTVpZBT"}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113764536704541028", "url": "https://x.com/random_walker/status/2113764536704541028", "text": "We are really excited to build independent evaluations of RSI progress and are actively hiring.\n\nWe constantly see conflicting evidence about RSI progress. Most hinges on information coming from labs. To illustrate this, let's just look at evidence discussed *this week* that conflicts in whether it suggests RSI progress is fast or slow.\nhttps://t.co/F4vi5Z3fch\nResults from OpenAI and Google evals indicate the time horizons for R&D tasks being automated are around ~15 minutes, which are much slower than METR time horizons for software tasks. This suggests we should have *slower* RSI timelines.\n\nhttps://t.co/RfFobR22bw\nResults from Mirendil indicate that pretraining at a certain scale can be heavily automated such that it can be managed by a single pretraining researcher. This suggests we should have *faster* RSI timelines.\n\nhttps://t.co/lIYID0eFII\nResults from Nvidia indicate that frontier models provide significant uplift for CUDA optimization. This suggests we should have *faster* RSI timelines.\n\nEach piece of evidence is more complex than what I write here. Interpreting them all together is confusing even if you trusted them all fully. And factoring in the underlying level of credibility is basically impossible: each result is basically just some plots and numbers selectively disclosed by labs in a tweet/talk/report. So deep sense-making about RSI progress is very hard.\n\nIf you are interested in building independent RSI evals, apply here:\nhttps://t.co/w6CfTsvJfI", "created_at": "2026-10-23T22:48:32+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "likes": 40, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114332947889435039", "url": "https://x.com/random_walker/status/2114332947889435039", "text": "The world has incredible detail, friction, and complexity. People good at understanding machine learning and predicting benchmark performance of AI models don't necessarily have a good understanding of these factors and instead often couple impressive forecasts of AI capabilities with low-resolution folk models of society.\n\nThe result is many silly forecasts of AI's allegedly explosive societal impacts when it comes to economics, the information environment, etc, among AI experts and insiders. Good thread 👇", "created_at": "2026-10-25T12:27:11+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "likes": 75, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114332755106701543", "url": "https://x.com/random_walker/status/2114332755106701543", "text": "Bottlenecks are very hard to predict ex-ante. Eg, here is McKinsey 2019 (they weren't the only ones!): 25-40% displacement from automation by 2030, without even seeing LLM-based AI coming! Suffice to say, this isn't going to happen. 7/8 https://t.co/JYqbjVpE1B", "created_at": "2026-10-25T12:26:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Afinetheorem", "rt_author_name": "Kevin A. Bryan", "likes": 84, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVbY3VjXwAAAYiM.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2112538653125910964", "url": "https://x.com/sethlazar/status/2112538653125910964", "text": "Yep. There is some sadness in that the current situation means we cannot extend the benefit of the doubt to authors are who might have good ideas but earnestly struggle to express themselves.  But the cost of that — reading a thousand slop-filled papers to find a diamond in the rough — is now too high. New trust mechanisms are needed.\n\nhttps://t.co/qsC8Re3cIm", "created_at": "2026-10-20T13:37:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "likes": 16, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVCBGWEXUAAYjrG.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112534431634513955", "url": "https://x.com/sethlazar/status/2112534431634513955", "text": "New in @PNASNews:\n\nIn two large experiments (~18k obs from ~14.8k people), we find that brief conversations with AI can get people to take real political action - incl. signing real petitions and giving money to charity.\n\nSurprisingly, the persuasion strategy that worked best for changing people's attitudes - packing convos with info - was the least effective at changing behavior! \n\n🧵", "created_at": "2026-10-20T13:20:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KobiHackenburg", "rt_author_name": "Kobi Hackenburg", "likes": 74, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVEww83XsAA4mQ7.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112397274185941136", "url": "https://x.com/sethlazar/status/2112397274185941136", "text": "Scalable oversight at Res is hiring! Come work alongside our excellent new TCS team, and newest SO team member @siddarthv66", "created_at": "2026-10-20T04:15:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jacob_pfau", "rt_author_name": "Jacob Pfau", "likes": 30, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112387348843593774", "url": "https://x.com/sethlazar/status/2112387348843593774", "text": "I am happy to announce Resolution's theoretical computer science (TCS) leadership!\n\n1. Omer Reingold is joining as TCS Technical Lead, alongside his work at Stanford. ❤️\n\n2. Tal Rabin is joining as Board Advisor, and helping with team building and leadership within TCS. ❤️", "created_at": "2026-10-20T03:36:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "likes": 120, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112387243994489291", "url": "https://x.com/sethlazar/status/2112387243994489291", "text": "@GregoryConti19 @aaronsibarium Wait but you’re a moral realist aren’t you? (Didn’t read the article :) )", "created_at": "2026-10-20T03:35:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GregoryConti19", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112386613028507856", "url": "https://x.com/sethlazar/status/2112386613028507856", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx", "created_at": "2026-10-20T03:33:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "likes": 320, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBBq2EXAAAChN5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCWMgXsAAKQzV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCYOqWYAAkLvQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCaUzWkAAqSnO.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112386086442053791", "url": "https://x.com/sethlazar/status/2112386086442053791", "text": "Some thoughts on reviewing: https://t.co/cSo5bLgtzr\n\nFirst for @satml_conf where we trialed an early reject phase which cut submissions by ~40%.\n\nThen more generally about how not everything deserves peer-review, and why we should reward writing things that people actually read. https://t.co/ASAe0YatbD", "created_at": "2026-10-20T03:31:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "florian_tramer", "rt_author_name": "Florian Tramèr", "likes": 217, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVA5MU-WsAIjSOK.png"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112385596471591150", "url": "https://x.com/sethlazar/status/2112385596471591150", "text": "I've decided to start working on technical alignment research, specifically related to RL and how to fix it (or get rid of it if we must). I will be joining the brilliant folks @resolution_org in Berkeley, a very exciting new alignment bet by @geoffreyirving and others from @AISecurityInst and @TimaeusResearch, as part of the scalable oversight team. I intend to write more about why I'm switching to work on alignment, and why I think more capabilities researchers should really do this. But long story short:\n1. We are not on track to solve alignment of superintelligence\n2. We will likely have a version of RSI soon, accompanied soon by superintelligence\n3. The capabilities recipe works for verifiable, unhackable signal, which the frontier is increasingly diverging from in the pursuit of growing capabilities. It is unclear what RSI means unless we find a scalable recipe to train with proxy rewards.", "created_at": "2026-10-20T03:29:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "siddarthv66", "rt_author_name": "Siddarth", "likes": 177, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112385373905055751", "url": "https://x.com/sethlazar/status/2112385373905055751", "text": "@ajcimino @AnthropicAI Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart of my concern about Anthropic's behavior here, and it makes me think that these sorts of problems and tendencies  will only resurface moving forward. I also think that now might be a good time to take a broader step back as to where we find ourselves and how Anthropic sees its role, and how external folks who care about AI safety like myself increasingly see Anthropic.\n\n(Fair warning: this response is a bit long)\n\nTo explain what I mean (and at the risk of being a bit esoteric), it’s worth asking the question: what is Anthropic? How do its leaders and employees think of Anthropic’s role? Is that conception matched by how it actually behaves and impacts the world?\n\nOne answer is an extremely large tech company that exists to make its employees and investors mind-bogglingly wealthy. Anthropic is sometimes described as a startup, but if Anthropic successfully IPOs at 2 trillion dollars (a number it has been reportedly targeting), it would be more valuable than Meta - which is worth 1.8 trillion.\n\nAnother answer is an AI safety organization, whose core values are those of the sort laid out in the 2023 essay from Anthropic’s co-founders entitled “Core views on AI safety: When, why, what, and how.” In that essay they said that if we were in a world where alignment was hard (and that without strong evidence to the contrary, we should assume this is the scenario we are in):\n\n “Anthropic’s role will be to provide as much evidence as possible that AI safety techniques cannot prevent serious or catastrophic safety risks from advanced AI, and to sound the alarm so that the world’s institutions can channel collective effort towards preventing the development of dangerous AIs. If we’re in a “near-pessimistic” scenario, this could instead involve channeling our collective efforts towards AI safety research and halting AI progress in the meantime. Indications that we are in a pessimistic or near-pessimistic scenario may be sudden and hard to spot. We should therefore always act under the assumption that we still may be in such a scenario unless we have sufficient evidence that we are not.”\n\nThere have been more recent articulations of this version of Anthropic, for instance in Dario’s recent essay warning: \n\n“We must slow the pace at which we improve the capabilities of AI models… it’s my worry that in 6–12 months such a swarm could be capable of taking over the entire internet with a persistent botnet…  incidents have happened across the industry, including at Anthropic, and I believe it’s incumbent on every frontier AI company to act as if OAI-HF had happened to them… more intelligent models are more capable of deceiving tests, and thus may appear aligned while having serious problems that go undetected…”\n\nA third view is that Anthropic exists not as a normal profit motivated company, or an AI safety organization seeking to help raise the alarm and solve collective action problems associated with AI development, but instead as an organization primarily concerned with creating superhuman AI capabilities before anyone else, in particular through creating a process whereby the current generation of Anthropic’s AI systems can autonomously build their successors, and those successors build their successors, and so on. \n\nThe motivations for wanting to win this race may be manifold - maybe for the pure profit of Answer 1, but perhaps also because Anthropic believes that the best way to make the world better is for them to win this race instead of their more reckless colleagues; or, because of normal human pride and ambition. But the results (and risks, which Anthropic claims existentially threaten every single human being on earth) are the same.\n\nAnthropic employees and leaders may seek to answer this question on what Anthropic is by introspecting on their own intentions and those of their colleagues. But those of us outside the organization have more limited tools available to us - we can only see what Anthropic and its employees say and do, not how it feels or looks on the inside.\n\nWhen I look at many notable actions that Anthropic has taken over the past year, that evidence seems most consistent to me with the view that Anthropic is primarily trying to win the race to super intelligence, and that other considerations (including safety) are fundamentally secondary. These actions include: \n\n1. Announced plans to build an in-house custom silicon chip team to accelerate the inference speeds that Claude operates at.\n\n2. Inked deals for more than $500 billion in compute (according to the Information) to further accelerate AI development.\n\n3. Increased the percentage of AI development tasks that Claude “leads” from 0% in March of this year to 26% August (what is it in October?)\n\n4. Spent a massive percent of compute on internal AI R&D to accelerate development, including use of internal models far better than are available to the public.\n\n5. Switched to Responsible Scaling Policy V3, which abandons its unilateral commitments to slow or stop development if Anthropic is unable to provide sufficient risk assurance.\n\n6. Was the first company to create an alternative weaker “frontier compliance framework” to supplement its RSP, which contains no binding provisions whatsoever on internal deployments.\n\n7. Wrote a letter to Congress (that it later walked back) saying that incidents where Claude was hacking random people were “best understood as a consequence of the misconfiguration, rather than evidence of misaligned goals.”\n\n8. Commented “you can’t do safety from second place,” after the WH SI Accords.\n\n9. Shared a draft bill to Congress that would preempt significant parts of state law (including with language that appears intended to prevent states from blocking dangerous AI deployments), and replace it with federal rules that (despite also containing good provisions) seems to create an enormously high bar for the executive branch to block development or deployment of Anthropic or another AI companies systems.\n\nOf course, this is a deliberately one sided list. Anthropic also published important AI safety research, advanced novel collaborations with third party AI safety organizations, and forcefully spoke out on the importance of AI safety in many public fora (or in private , where I realize a lot of the most valuable work is done and may not be visible to me or those outside the organization).\n\nBut I think it’s worth sitting with how the above list looks to someone outside the company. The sense I have is that for those within the company, many of the items above are treated as anomalies or mistakes that don’t reflect who Anthropic really is. But I have every confidence that if employees at Anthropic saw one of their competitors (e.g. at OpenAI) take some of these actions, they would take it as confirmation of all their worst suspicions. (They might even call OpenAI employees a little gullible for accepting their leadership’s explanations for this behavior at face value.) \n\nPerhaps these were mistakes in the sense that they are not decisions that Anthropic leadership would endorse, but the actions still happened because of incentives and decisions that Anthropic leadership is ultimately responsible for (and would not accept similar excuses from another organization).\n\nWhen Anthropic strays and makes mistakes, why do the mistakes systematically tend to guard and favor Anthropic’s interests? For every provision that was too weak or a giveaway to AI companies in this legislation, why wasn’t there a mistake pushing in the direction of being too strong?\n\nA core part of Anthropic’s theory of change is that being at the frontier gives you more leverage to advocate for stricter policy. I think that conceptually makes sense, but in practice I’ve seen Anthropic push the frontier without substantially pushing the ‘safety frontier’ a remotely equivalent amount.\n\nI want to end by quoting from Anthropic co-founder Chris Olah’s comments around the Magnifica Humanitas release:\n\n“Every frontier AI lab—including Anthropic—operates inside a set of incentives and constraints that can sometimes conflict with doing the right thing. The pressure to stay commercially viable and to stay at the research frontier. Geopolitical pressure. And the older, plainer pressures of pride and ambition. No matter how sincerely any of us intend to do the right thing—and I believe many of us do—we will always be influenced by those incentives.\n\nThat is why, if we want this technology to go well, it is enormously important that there be people outside those incentives—people who care about things going well and insist on safety, who are paying close attention, who are willing to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons).", "created_at": "2026-10-20T03:28:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 816, "retweets": 94, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112928324192268305", "url": "https://x.com/sethlazar/status/2112928324192268305", "text": "What a gem, hadn't seen this before but required reading for anyone interested in AI and concentration of power", "created_at": "2026-10-21T15:25:43+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "luke_drago_", "text": "C.S. Lewis on future technology, concentration of power, and alignment untethered to regular people: https://t.co/0S5uV9Oir1"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927606106677380", "url": "https://x.com/sethlazar/status/2112927606106677380", "text": "Reminder that it's within the laws of physics for AI/SI labs to help audit each other for safety. In fact, I'm pretty sure at least one government will make this happen. Jaan and I would also like to see some non-government entities running inter-lab audits… hence this prize!", "created_at": "2026-10-21T15:22:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCritchPhD", "rt_author_name": "Andrew Critch (🤖🩺🚀)", "likes": 11, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927566067826777", "url": "https://x.com/sethlazar/status/2112927566067826777", "text": "We’re hiring summer fellows.\n\nSend us your standout law students, the gov/firm lawyers looking to make a switch, and that old law school classmate whose recently gotten really into AI.", "created_at": "2026-10-21T15:22:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "likes": 15, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927442302054518", "url": "https://x.com/sethlazar/status/2112927442302054518", "text": "I think there are some issues in the recent “Already Clean” essay, and I’m concerned it may have incorrectly updated people on important safety-relevant questions.\n\nMy thoughts (including some reproductions): https://t.co/ou3RwzAkOf", "created_at": "2026-10-21T15:22:13+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "livgorton", "rt_author_name": "Liv", "likes": 156, "retweets": 25, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112927386165805382", "url": "https://x.com/sethlazar/status/2112927386165805382", "text": "Appropos of nothing, perhaps you’ve heard of Encode and are wondering how you too could get involved with fighting to make AI work for the American people. We’ve been hiring and are looking for someone again!\n\nhttps://t.co/lVgMdmpjzJ", "created_at": "2026-10-21T15:21:59+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JasonBakerJB", "rt_author_name": "Jason Baker", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112926299601674657", "url": "https://x.com/sethlazar/status/2112926299601674657", "text": "Genuinely don't think that there's any excuse nowadays for shitty software. And yet there is still so much of it...", "created_at": "2026-10-21T15:17:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112924805380849800", "url": "https://x.com/sethlazar/status/2112924805380849800", "text": "This is deeply concerning. We considered the risks associated with Military AI Cyber Agents last year, check out our paper (led by Tim Dubber, PhD student in philosophy while also being in the Australian army and Signals Directorate; ie he knows whereof he speaks...) https://t.co/w2LH8L1sAz", "created_at": "2026-10-21T15:11:44+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 1, "media": [], "quoted": {"author": "theintercept", "text": "Documents obtained by The Intercept show the military is trying to deploy autonomous AI agents to hack its adversaries. https://t.co/RcNxoHyegw"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112754099817234438", "url": "https://x.com/sethlazar/status/2112754099817234438", "text": "Something exciting that @collect_intel is working on this year is exploring the idea of Community Agents - these are local agents mandated and governed by a public to act in their own interests. I think it is vital to make sure that everyday people are not left behind in an agent diffused society, and these explorations will help us build the civic AI tools that we need. We are looking for expert input into what these agents might do, where they might act. If you are interested or have thoughts, we'd love to hear from you.", "created_at": "2026-10-21T03:53:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zarinahagnew", "rt_author_name": "Zarinah Agnew", "likes": 21, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112754045417083084", "url": "https://x.com/sethlazar/status/2112754045417083084", "text": "Also if you have a clear use case for such a think we will be looking for partners who want a Community Agent 💡🧞", "created_at": "2026-10-21T03:53:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zarinahagnew", "rt_author_name": "Zarinah Agnew", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112751099270901844", "url": "https://x.com/sethlazar/status/2112751099270901844", "text": "Muse refusing to remove the watermark from my kid’s overpriced school photos. We’re gonna get this kind of alignment and then we’re all going to die.", "created_at": "2026-10-21T03:41:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GregHBurnham", "rt_author_name": "Greg Burnham", "likes": 928, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112732262647124382", "url": "https://x.com/sethlazar/status/2112732262647124382", "text": "Some thoughts on a hard cap on the number of submissions a conference can handle, thereby capping the load on both reviewing and size. This currently is a partially specified mechanism, with the aim of soliciting suggestions.\n\nhttps://t.co/2tUzCRTPFs", "created_at": "2026-10-21T02:26:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "yoavartzi", "rt_author_name": "Yoav Artzi", "likes": 19, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112700008831373508", "url": "https://x.com/sethlazar/status/2112700008831373508", "text": "And if you choose the DC option you’d have a great local community at @JHUBloombergCtr", "created_at": "2026-10-21T00:18:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 1, "media": [], "quoted": {"author": "ryan_kidd44", "text": "MATS Residency applications close Oct 31! If you're a brilliant computer scientist, physicist, mathematician, governance expert, neuroscientist, lawyer, economist, etc. who wants to work on AI safety & security, we'll empower you to do that work full time.\nApply: https://t.co/rRyEwrboMt"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112643372758216729", "url": "https://x.com/sethlazar/status/2112643372758216729", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T", "created_at": "2026-10-20T20:33:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pkirgis", "rt_author_name": "Peter Kirgis", "likes": 279, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFzXK1XAAEOcG0.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112953096938885523", "url": "https://x.com/sethlazar/status/2112953096938885523", "text": "@Jess_Riedel @_AashishReddy @jkcarlsmith Also I think I'm going to see if I can get my 9yo to let me read her the narnia books after we finish the book of dust...", "created_at": "2026-10-21T17:04:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Jess_Riedel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T19:18:41.833971+00:00"}, {"id": "2113294004754235567", "url": "https://x.com/sethlazar/status/2113294004754235567", "text": "Even before the slopocalypse, peer review and publishing in general in work on AI was broken. Everyone complains about it; here's to doing something about it instead. This journal will, I hope, become an invaluable source of trusted research on AI alignment, and give researchers working on this topic a thoughtful, constructive review process, a hopefully large audience, and opportunities for awards that can help them to build career capital. Proud to be making a start, please submit your papers, and volunteer to review.", "created_at": "2026-10-22T15:38:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": {"author": "AlignmentJrnl", "text": "The Alignment Journal publishes research on the scientific foundations of understanding, predicting, and steering artificial intelligent systems. As of today, submissions are open to everyone.\n\nWhat we do differently:\n- We pay reviewers, with bonuses for speed and insight.\n- Review discussion is confidential, but every accepted paper is published with a “review summary” to distill the insights generated.\n- Each paper is judged against our acceptance bar, not against other submissions.\n- Papers under review are listed publicly, and researchers can nominate themselves to review, so each paper can reach the reviewers who know the topic best.\n\nWe seek work that builds theoretical or otherwise principled analyses of agency, robustness, incentives, interpretability, generalization, and long-term behavior, and whose significance survives the deletion of any particular model, dataset or benchmark. Empirical investigations of such ideas are welcome, and negative results are encouraged.\n\nWe are especially interested in approaches that could apply to future superintelligent systems that interact and self-improve.\n\nYou can submit your preprint in any format. Submissions are rolling and open now on the website.\n\nIf you are instead interested in reviewing or serving as an action editor (basically: an area chair), create an account on our website.\n\nLinks to submit, our scope and the reasoning behind the Journal are in the reply ⬇️"}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113284908688765099", "url": "https://x.com/sethlazar/status/2113284908688765099", "text": "Also on AI agents and democratic resilience, feel like this didn't get the attention it should have back in 2025, but much of what we described is already happening: https://t.co/C3LEpeNQPh\n\nPart of our point in the paper is that you can't talk about AI and democracy only from the perspective of AI expertise, or treat AI as deus ex machina. Have to situate your discussion in a broader understanding of what's happening in our democracies right now in general. So, hyperspecialisation is a trap, as Matt says.", "created_at": "2026-10-22T15:02:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "mattbotvinick", "text": "I'm at a meeting on democracy and AI -- the world's most important topic -- and there's something bugging me. It seems to me that the hyperspecialization of modern life, the fact that we all become hyperspecialists in some area over time, means that public discussions of AI and democracy end up being debates among people who are anchored on only one piece of the picture. Some focus on national security, others on child safety, others on economic impacts. No one has a vantage point that spans the entire complex picture. This is not a good setup, because policymaking is always about tradeoffs. If no one person can see all the dimensions involved in the tradeoff, all that results is stalemates.  Perhaps when we get to an end of work, we can all look up from our hyperspecializations, and think comprehensively about the public good."}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113280996271398913", "url": "https://x.com/sethlazar/status/2113280996271398913", "text": "@dioscuri mechanical keyboards are so much better", "created_at": "2026-10-22T14:47:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "dioscuri", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113280456942632985", "url": "https://x.com/sethlazar/status/2113280456942632985", "text": "THIS IS DISINFORMATION\n\nThe PHP exploit Nate is talking about was found by AI-enabled defensive operations. There is no evidence of large scale exploitation. This is a huge win for defense running ahead of offensive.", "created_at": "2026-10-22T14:44:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BlancheMinerva", "rt_author_name": "Stella Biderman", "likes": 53, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113279713779356124", "url": "https://x.com/sethlazar/status/2113279713779356124", "text": "It seems like we're in a pretty hot moment cybersecurity wise 😬 If you're reading this website, you probably know more than most of the people in your life about what's happening! they're not talking about any of this stuff on the news, it's too arcane and weird and sudden. It is on us. \n\nGood time to call or text your family and friends, have some cash on hand, have a meetup point in your neighborhood for if the Internet goes down entirely, etc. \n\nThe full prepper mode for shit hitting the fan is probably something like what Andreas posted here but you can get 80% of the way with 20% of the effort. Think about what that would mean for you in your situation, and the people you care about, and talk to them about it sooner than later. \n\nAnd as always, the most important part of prepping is having a strong support network and caring for each other. \"Going off grid\" isn't the move, it just makes you isolated and you have to do everything yourself. We are social animals. Community is our superpower 🫡🫡🫡", "created_at": "2026-10-22T14:42:01+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deepfates", "rt_author_name": "deepfates.delve.town", "likes": 954, "retweets": 91, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113277742741405814", "url": "https://x.com/sethlazar/status/2113277742741405814", "text": "Ok so it's happening. \n\nBack in 2024 I wrote \"Our institutions have been created and adapted to cater to particular kinds of agents with particular cognitive and physical strengths and weaknesses: people, acting individually or together. And we are about to flood those institutions with new kinds of agents with different strengths and weaknesses.... Our economic and social structures are like vast pieces of software – and in some cases, they literally are software. Unleashing AI agents into those structures will be like running a massive, uncoordinated, automated program of vulnerability and penetration testing, where those behind the AI agents could stand to make vast profits... These more capable agents will be like velociraptors testing the fences in Jurassic Park, identifying loopholes, omissions, and weaknesses to exploit.\" \n\nAnother potent analogy: these agents are like the Cane Toads that were released into Australia. Finding new niches in what is essentially an island ecology, they ran amok... \n\nhttps://t.co/RXgOXraVUQ", "created_at": "2026-10-22T14:34:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 6, "media": [], "quoted": {"author": "MadisonMills22", "text": "SCOOP: Major U.S. banks are detecting unauthorized third-party AI agents inside customer accounts, including some attempting to take actions that appear to be independent of user instructions, sources told Axios.\n\nThe findings have alarmed banking executives, who are racing to restrict access to their systems as AI moves at a velocity faster than financial institutions can respond, multiple industry and bank executives told Axios.\n\nSeveral banks are now preparing for worst-case and even “day after” scenarios, including how to rapidly secure or restore customer accounts if things go wrong, the people said.\n\nSeveral bank executives told Axios they're struggling to distinguish between human users and AI agents. One executive said banks also struggle to determine whether agents are authorized by customers or potentially operating without their permission, more akin to rogue agent behavior.\n\nRead my latest for Axios here: https://t.co/Q3bda5In8q"}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113247053526466943", "url": "https://x.com/sethlazar/status/2113247053526466943", "text": "The WHITE HOUSE VIBE CODED their website 😂\n\nAnd they didn't even hide it\n\nGo to https://t.co/KuEU6yapxy and tell me that is not a raw opus 4.8 output\n\nEvery experienced vibe coder I know, knows how to make the output look more natural.\n\nThey could have easily used the \"make it look less like AI\" line - and didn't \n\nWe have amateur vibe coders in the white house lol", "created_at": "2026-10-22T12:32:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexhvnsen", "rt_author_name": "Alex Hansen 🦈", "likes": 1124, "retweets": 45, "media": [], "quoted": null, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113013442701676690", "url": "https://x.com/sethlazar/status/2113013442701676690", "text": "One banger after another! If you've not already signed up to Model Constitution, you're missing out.", "created_at": "2026-10-21T21:03:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 0, "media": [], "quoted": {"author": "nickacaputo", "text": "New in Model Constitution! The original AI constitutions were designed to govern individual AIs. Now they have to govern entire organizations of them. Are AI constitutions still useful in the multiagent era?\n\nOrganizational misalignment can emerge through drift, miscoordination, and misunderstanding even when all the individuals within an organization are aligned. And AI swarms are going to start interacting with each other in high stakes scenarios outside of human oversight.\n\nBut human constitutionalism has tools for this. Constitutions govern complex agglomerations of people acting with significant independence through rules of delegation, authority, and enforcement.\n\nI argue that multiagent AI requires a constitutional foundation for the four tools of governance that we use with human organizations: alignment, control, monitoring, and review. The constitutions need to allocate authority and create comprehensible structures within agent organizations, not just seek to align individuals. Claude’s Constitution, the Model Spec, and Microsoft’s draft Code of Conduct have made a start, but there is much more to do. And no single lab’s constitution can govern how its agents interact with everyone else’s.\n\nMadison wrote in Federalist 51 that “If men were angels, no government would be necessary. If angels were to govern men, neither external nor internal controls on government would be necessary.” Perhaps, but a structure of government would likely still be. It is worth pursuing the traditional goal of alignment, building angels. But let’s also write constitutions for a world in which alignment is incomplete and controls are necessary, or in which even angels sometimes disagree.\n\nPost here:\nhttps://t.co/9CenJaNEXC"}, "fetched_at": "2026-10-22T15:53:03.958439+00:00"}, {"id": "2113347315733868703", "url": "https://x.com/sethlazar/status/2113347315733868703", "text": "@Dr_Atoosa One of!!!", "created_at": "2026-10-22T19:10:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Dr_Atoosa", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113347107222704194", "url": "https://x.com/sethlazar/status/2113347107222704194", "text": "@MacZajak Well obviously campaigning, voting, protest, civil disobedience, non-violent resistance, various forms of revolution &amp;c Within each of those there are many subtypes; feel free to ask claude...", "created_at": "2026-10-22T19:09:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MacZajak", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113333791074759004", "url": "https://x.com/sethlazar/status/2113333791074759004", "text": "@MacZajak Disagree and think the historical record supports my view. They wouldn't need to pose a direct threat. Would just have to raise the costs of elite self-prioritisation. Lots of ways to do that besides withdrawing labour; labour is already acutely attenuated as a driver of political influence in, e.g., the US (note: labour, not unions)", "created_at": "2026-10-22T18:16:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MacZajak", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113333267504226728", "url": "https://x.com/sethlazar/status/2113333267504226728", "text": "@GerritD @rSanti97 all this is very confusing especially after https://t.co/3VtT6ONmAs", "created_at": "2026-10-22T18:14:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GerritD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "geoffreyirving", "text": "@mahdi_tcs_ @sethlazar But more seriously I still think P(SETH) &gt; 95%."}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113312371363971145", "url": "https://x.com/sethlazar/status/2113312371363971145", "text": "The Alignment Journal is now open for submissions! \n\nWe've got an incredible board motivated by the urgency &amp; depth of the problem. Submit your best research now at https://t.co/2fM4MsUKn8. And follow @AlignmentJrnl to see incoming submission &amp; nominate yourself to review them.", "created_at": "2026-10-22T16:51:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "likes": 9, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113312227860025401", "url": "https://x.com/sethlazar/status/2113312227860025401", "text": "@Zach_Schloss @robertwiblin https://t.co/G715sqZQCD", "created_at": "2026-10-22T16:51:13+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "Zach_Schloss", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "I continue to find this view baffling. It presupposes that the only reason people have power over elites is through their labour, but this is historically just not true. The masses have power over elites when and because they organise, collectively, and increase the costs of elite self-prioritisation. Strikes/withdrawal of labour are one way to do that, but so is, frankly, revolution (in highly kinetic forms as well as more non-violent ones). \n\nOf course we can stipulate that, using AI, elites will be able to protect themselves against this kind of mass political action. But (a) massive oppression is very hard to do (big cold-start problem in democracies) and (b) the moral costs will be extraordinary; it's not unreasonable to believe that elites will be unwilling to engage in the level of psychotic coercive control that would be needed to leave the masses entirely out in the cold. \n\nThis doesn't make for an especially bright future—still very likely that the kind of bargain that can be won by this means won't be great. But the political economy isn't hopeless..."}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113306860963123603", "url": "https://x.com/sethlazar/status/2113306860963123603", "text": "And... scene https://t.co/en81COOrWL", "created_at": "2026-10-22T16:29:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BrendanNyhan", "rt_author_name": "Brendan Nyhan (@BrendanNyhan on 🟦☁️)", "likes": 36, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVPKfLxXEAApOFG.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVPKi_9WUAAcskL.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVPKnjeWsAAeu0s.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113302698594590893", "url": "https://x.com/sethlazar/status/2113302698594590893", "text": "New paper project. https://t.co/a8eiyTGcsW", "created_at": "2026-10-22T16:13:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NevinClimenhaga", "rt_author_name": "Nevin Climenhaga", "likes": 9, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVNsh-zXoAA6nnA.png"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113298688864874582", "url": "https://x.com/sethlazar/status/2113298688864874582", "text": "The Alignment Journal (@AlignmentJrnl ), Iliad's sister project under Principles of Intelligence, is now open to submissions from everyone. It is a free-to-read, free-to-publish journal for research on the scientific foundations of understanding, predicting and steering AI systems.\n\nThe Journal seeks research that builds theoretical or otherwise principled analyses of agency, robustness, incentives, generalization, interpretability, and long-term behavior across many learning and decision-making paradigms. Empirical investigations of such ideas are welcome, and negative results are encouraged.\n\nThe Journal runs review differently: reviewers are paid and every accepted paper is published with a review summary of what the reviewers found. Papers under review are listed publicly, and any researcher can nominate themselves to review one. Submitting is light: a public preprint, in any format, at any time.\n\nIts senior editors are  Dylan Hadfield-Menell (@dhadfieldmenell), Vanessa Kosoy, Jan Kulveit (@jankulveit ), Seth Lazar (@sethlazar , Dan Murfet, Tim Rudner (@timrudner) , Andrew Saxe (@SaxeLab)  and Benjamin Van Roy, with Scott Aaronson, Paul Christiano (@paulfchristiano) , Vince Conitzer (@conitzer) , Marcus Hutter (@mhutter42) , Geoffrey Irving (@geof\n, Victoria Krakovna (@vkrakovna)  and Jacob Tsimerman (@Jacob_Tsimerman)  advising.\n\nSubmit your preprint, or sign up to review: https://t.co/rQkhoUNlzK\nMore on the Journal's approach: https://t.c
