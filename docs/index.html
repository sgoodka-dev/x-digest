dia": [], "quoted": {"author": "CSElmendorf", "text": "Interesting to read this news ⤵️ of NYC playing venture capitalist alongside @bswud &amp; @RobinRivaton's new @WorksInProgMag story about Chinese cities as de facto VC firms.\n\n1/5 https://t.co/gDsV7c1GdY"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110776328488378472", "url": "https://x.com/s8mb/status/2110776328488378472", "text": "I’m still mourning the cover affectionately known as “Building Man”— but I love where we landed on BUILT TO GROW https://t.co/vYDJuWF2XS\n\nThe evolution: https://t.co/Uy2nyL1YY6", "created_at": "2026-10-15T16:54:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 194, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2110748343236280321/img/rzbV4gWwsm279myN.jpg"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110774453248344166", "url": "https://x.com/s8mb/status/2110774453248344166", "text": "@Valen10Francois We're massive", "created_at": "2026-10-15T16:47:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Valen10Francois", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110769763874226435", "url": "https://x.com/s8mb/status/2110769763874226435", "text": "@gsignoret Amazing – @CharlesCMann, you rightly have a very big fan club!", "created_at": "2026-10-15T16:28:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gsignoret", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108609647036997769", "url": "https://x.com/random_walker/status/2108609647036997769", "text": "If AI labs want personal assistants to take off at scale, they need to stop marketing vacations, reservations, party planning, etc. These are not problems.\n\nFocus on *the* problem facing Americans: the cost of living. Agents can offer a ton of help.\n\nSome ideas: (🧵)", "created_at": "2026-10-09T17:24:50+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jimprosser", "rt_author_name": "Jim Prosser", "likes": 1862, "retweets": 130, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108596346928369726", "url": "https://x.com/random_walker/status/2108596346928369726", "text": "Fascinating reading about how we used to write about malware and viruses back in 1999. In a decade I suspect we'll look back at how we talk about AI safety today and it will feel similar. https://t.co/5yApXsKPS6 https://t.co/Rmpfb3jrcB", "created_at": "2026-10-09T16:31:59+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "likes": 121, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMmSfNWUAAZH4t.png"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108862317131935973", "url": "https://x.com/random_walker/status/2108862317131935973", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world.", "created_at": "2026-10-10T10:08:51+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "likes": 349, "retweets": 70, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUPAfmRbEAAZqlD.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109688253075079438", "url": "https://x.com/random_walker/status/2109688253075079438", "text": "New essay: To keep human judgment, we need AI courts.\n\nAI-generated filings are starting to overwhelm courts around the world. \n\nThe most popular response I’ve heard is to fight AI with AI: If we can just give judges the right tools and training, AI will help them keep pace.\n\nBut this strikes me as the worst of both worlds. \n\nBecause we want human judges in the loop, we don’t get the speed and scale benefits of AI. Yet because we expect them to resolve a massive number of cases quickly, judges (or their clerks) may end up leaning on AI more than they mean to or should.\n\nThis essay offers another way: a parallel AI adjudication track. \n\nAn AI track — inspired by AI use in private arbitration but formally part of the court system like magistrate judges — would let courts be explicit about how human judgment is allocated.\n\nDone right, this would allow courts to process large volumes of cases while ensuring human judges devote their full attention to the cases where their judgment is needed most.\n\nRead more in @PaxMachinaMag: https://t.co/xC4JeVky8H", "created_at": "2026-10-12T16:50:50+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "curl_justin", "rt_author_name": "justin curl", "likes": 128, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2110010174890967374", "url": "https://x.com/random_walker/status/2110010174890967374", "text": "Here are 14 points about AI safety I made on the Ezra Klein show, and some impressions about the experience. ​​https://t.co/ntHt0wFRQj\n\n1. Intelligence isn’t power — An A.I. system being powerful is not a property of the model itself. It’s a property of what powers we choose to give it in the real world.\n\n2. The capabilities and behaviors we saw in the HuggingFace and other hacks weren’t entirely emergent. The models were trained for persistence, cooperation, and cyber tasks. The RL environments in which they were trained had various issues that led to the unintended behavior.\n\n3. I agree that controlling highly capable AI agents is different in some ways from controlling an airplane or a nuclear reactor. The agent’s intentionality does make a difference to our approach compared to traditional engineering problems and domains. But it is still an engineering problem. It is not a solved engineering problem, but it is a solvable one.\n\n4. A lot of effort and money has been put toward alignment. That’s important and has proved useful, but if the same amount of effort and money had additionally been put toward control (sandboxes, monitoring, and other guardrails outside the model itself), we’d be seeing very different results.\n\n5. Models getting smarter doesn’t necessarily mean safety gets harder, because capability gains improve defensive abilities too. In many ways it makes safety easier rather than harder. What matters is how the attacker-defender balance shifts, and we have agency to shift it back to defenders.\n\n6. In cybersecurity, long before AI we reached a point where automated systems were superhuman at finding certain vulnerabilities. It helped defenders over attackers because the same tools are used by defenders to find and fix vulnerabilities in software before even shipping. There is a constantly shifting equilibrium, but it is not a new problem.\n\n7. I pushed back on Dario Amodei’s term “operational excellence” to describe recent organizational failures. Excellence is still far out on the horizon. Ezra offered “operational adequacy”. I think that would be a good start — behaving like any mature company instead of a startup-like culture.\n\n8. Defensive AI agents will have to be part of the solution, as uncomfortable as that seems. It’s a new paradigm. We won’t be able to figure it out right away. But the fact that both offensive and defensive technologies escalate in capabilities and complexity is a fact of technological civilization, whether in the digital or physical realm.\n\n9. Ezra expressed some incredulity about my being okay with the ratcheting of complexity. I think it’s fair to be concerned. But safety technologies will never be fully legible to the public. People will have the same reaction if they see the immense complexity of safety in any other high-stakes domain such as nuclear or aerospace. We govern them pretty technocratically.\n\n10. The weirdness of the current moment in cybersecurity absolutely does have historical precedents. There was a prolonged period of profound destabilization when worms and viruses started a new offensive paradigm. It took us well over a decade to develop effective defenses against it. This time we can hopefully get there in less than a decade.\n\n11. I continue to be skeptical about the possibility of superhuman persuasion abilities from superintelligence. (Claims to the contrary tend to confuse two very different senses of the word persuasion.)\n\n12. What worries me is not the capabilities of the technology itself or the possibility that we will get no warnings before catastrophic risks materialize. We are getting plenty of warnings! But our policy and organizational responses to the warnings remain inadequate.\n\n13. Companies can and do make decisions that are against their own long-term interests because they are too focused on short-term metrics. This is how I interpret a lot of what happened with social media over the last decade.\n\n14. AI companies are also acting irrationally against their own self-interest in some ways. The “we can’t slow down unless we’re forced to” view comes out of the mythical belief in superintelligence at OpenAI and Anthropic — that the race to RSI means everything for the company, for the country, and humanity. I think it’s actually in both companies’ self interest to slow down unilaterally. I would argue that the alarm coming from their employees is not evidence of beneficence so much as it is evidence of the underlying fallacy that’s causing the irresponsible behavior in the first place.\n\n(Beyond safety, we also talked about the economic impacts being gradual, the fact that intelligence is rarely the actual bottleneck, labor impacts being small and uneven, Jevons’ paradox, the changing nature of knowledge work, and more.)\n\n====\n\nA few impressions\n\n* Talking about a specialized topic on a podcast that has a big and broad audience is a balancing act. The producers stopped me many times during the interview to tell me I was being too technical (understandable!). I tried to be nuanced but this conversation is necessarily a distilled version of the arguments @sayashk and I have made in our essays (especially https://t.co/sS8OS9LerG) which are themselves written for a somewhat broad audience and hence distilled in complexity from our notes and 1-1 discussions with peers.\n\n* I knew Ezra had well-formed views on AI safety that were different from mine, so I was expecting a tough interview, but he also seemed like a fair interviewer. It went about as well as I expected and I feel like it was a good debate / conversation. I wasn’t necessarily expecting to change minds but I was glad to hear from people who found it thought provoking and looked up my essays and other work.\n\n* The interview was about two hours, edited down to an hour. I was a bit nervous waiting for it to land, because I knew the editing could make a big difference to how I came across. It turned out well. They even did things like find archival footage to illustrate my point that the early days of worms and viruses was a weird time in cybersecurity.\n\n* I use AI to prepare for interviews. I have an agent that has read all of my output (books, articles, essays, talks, podcast transcripts, tweets, internal notes — on the order of a million words) to pull out pithy explanations, examples, analogies, and other talking points that will probably work well in a spoken format. Reviewing this file before interviews is extremely helpful. It is of course not the only way I prepare but it’s the highest bang for buck. Maintaining this file would be a massive amount of grunt work and there’s no way I’d do it if it weren’t for AI. I mention this because there’s a very large space of beneficial AI uses in knowledge work that _don’t_ involve cognitive offloading. They don’t get much hype on social media so people might be unaware of how much mileage you can get out of them, with little downside.", "created_at": "2026-10-13T14:10:02+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 149, "retweets": 32, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhCoPnWwAA31s4.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110382619804287301", "url": "https://x.com/random_walker/status/2110382619804287301", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T14:50:00+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 133, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110747920165183892", "url": "https://x.com/random_walker/status/2110747920165183892", "text": "There is widespread frustration about the AI industry’s “automate everything\" agenda. But what would it take to steer AI toward augmenting human capabilities instead? In a new essay, Gabriel Unger (@_gabrielunger) and I lay out a research agenda and plan for action. https://t.co/gWjFI5VKbz\n\nOur thesis is that the reason why AI-for-automation currently dominates isn’t just economic incentives but also deeper cultural issues in computer science as a field. And that can be changed.\n\n- We sketch four important research directions that are needed in order to build collaborative or augmentative AI. The automation paradigm largely ignores these technical challenges.\n- We advocate for Human-Computer Interaction and Human-Centered AI to be elevated as a subfield in status, influence, and funding, and changing AI curricula to emphasize the role of the human and decrease the centrality of the pure-automation problem framing.\n- We point out that there are a surprising number of efforts in economics, computer science, industry, and policy all trying to bring about a shift toward augmentation, but not enough collective awareness. Better connecting these movements would amplify their power.\n- We think the automation agenda is struggling on its own terms. Compiling evidence of the limits of general-purpose agents for automation and loudly making the case will encourage more companies to take collaboration more seriously as a goal.\n- We predict that once more workers experience this way of working and recognize that there are alternatives to the delegate-and-supervise pattern, it will generate more demand, creating a flywheel effect.\n- Targeted policy levers can play a small but important role in amplifying both the supply and demand for pro-worker AI. We don’t need clumsy top-down mandates.\n\nWe're not against automation. But we think the goal of AI must be broader.\n\nThis is the start of a long-term project. I know there are far more like-minded efforts out there than we’re aware of. I’d love to hear about some of them.", "created_at": "2026-10-15T15:01:34+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110805089682350385", "url": "https://x.com/random_walker/status/2110805089682350385", "text": "@Klonick Thank you, Kate!", "created_at": "2026-10-15T18:48:44+00:00", "author_ha  false, "reply_to": "", "is_retweet": true, "rt_author": "sorenmind", "rt_author_name": "Sören Mindermann", "likes": 3, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108274802255344101", "url": "https://x.com/sethlazar/status/2108274802255344101", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T19:14:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1891, "retweets": 284, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108594808180670636", "url": "https://x.com/sethlazar/status/2108594808180670636", "text": "Paper on why platforms — and the digital economy more broadly — raise such deep issues of justice. I argue that 𝐰𝐞 𝐬𝐡𝐨𝐮𝐥𝐝 𝐮𝐧𝐝𝐞𝐫𝐬𝐭𝐚𝐧𝐝 𝐭𝐡𝐞 𝐝𝐢𝐠𝐢𝐭𝐚𝐥 𝐞𝐜𝐨𝐧𝐨𝐦𝐲 𝐚𝐬 𝐢𝐧𝐟𝐫𝐚𝐬𝐭𝐫𝐮𝐜𝐭𝐮𝐫𝐞: an invisible resource that runs businesses, politics, and even friendships.\n\nUsually we see powerful tech companies, or we focus on data (the “new oil”). But the infrastructure lens brings three things into clear view.\n\nFirst, it explains why we see 𝐠𝐥𝐨𝐛𝐚𝐥 𝐦𝐨𝐧𝐨𝐩𝐨𝐥𝐢𝐞𝐬, typically anchored in developed economies where rents, welfare, and power accrue.\n\nSecond, global infrastructures 𝐚𝐛𝐫𝐢𝐝𝐠𝐞 𝐩𝐮𝐛𝐥𝐢𝐜 𝐩𝐨𝐰𝐞𝐫. Early in the pandemic, it was Apple and Google, and not public health authorities, who decided to take contact tracing off the policy menu. Infrastructure owners can constrain the public policy menu.\n\nThird, global infrastructure 𝐜𝐫𝐞𝐚𝐭𝐞𝐬 𝐠𝐥𝐨𝐛𝐚𝐥 𝐝𝐞𝐩𝐞𝐧𝐝𝐞𝐧𝐜𝐲 𝐫𝐞𝐥𝐚𝐭𝐢𝐨𝐧𝐬. US and Chinese entities have a complicated relationship with the Global South. Some argue it’s a form of colonialism (I’d here point to the difference that territory is less central now).\n\nThe main thing to keep in mind about infrastructure is that 𝐚𝐜𝐜𝐞𝐬𝐬 𝐢𝐬, 𝐢𝐧 𝐚 𝐰𝐚𝐲, 𝐭𝐡𝐞 𝐞𝐚𝐬𝐲 𝐢𝐬𝐬𝐮𝐞 of justice: infrastructures want to connect and grow. The hard problem of infrastructure justice is about dominance: that someone can threaten to take the access away.\n\nIf any of this sounds interesting, please check out my chapter “Justice in the Global Digital Economy” in Justice in Global Economic Governance (Edinburgh University Press), edited by Axel Berger, Clara Brandi, and Eszter Kollar.\n\nThe chapter is open access: https://t.co/BkBQpo3rAr", "created_at": "2026-10-09T16:25:52+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jhimmelreich", "rt_author_name": "Johannes Himmelreich", "likes": 4, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108572526339366914", "url": "https://x.com/sethlazar/status/2108572526339366914", "text": "@olivertraldi https://t.co/KZkFo4jU8u", "created_at": "2026-10-09T14:57:20+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "olivertraldi", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108572011307897026", "url": "https://x.com/sethlazar/status/2108572011307897026", "text": "Please resist the urge to mock the mathematicians struggling through this moment. Whatever your field, your expertise, your passion, you too shall one day experience what they are going through. And when you remember your words, you will feel remorse.", "created_at": "2026-10-09T14:55:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 3706, "retweets": 304, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108558908726071428", "url": "https://x.com/sethlazar/status/2108558908726071428", "text": "(somewhat belated) blog version of this paper is out, thank you to @ahall_research for letting me crash the @freesystemslab newsletter!!! \n\nhttps://t.co/HZpPeW2GfT https://t.co/V9LnkHMq1H", "created_at": "2026-10-09T14:03:13+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jessicadai_", "rt_author_name": "jessica dai", "likes": 30, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUI-ToFbQAAL3lk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUI-WKkaoAAQ32r.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544584762491123", "url": "https://x.com/sethlazar/status/2108544584762491123", "text": "Continuing the just war analogy; Bengio’s argument here is quite similar to Jeff McMahan and others about how soldiers, who would be responsible for fighting an unjust war, ought to refuse and if they did so would thereby prevent it. Also Buffy Sainte Marie’s argument, of course.", "created_at": "2026-10-09T13:06:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "Yoshua_Bengio", "text": "We have a choice in front of us. In my latest op-ed for Transformer, I invite employees of frontier AI companies to ask themselves if their work is truly leading us toward a safer future. Reflecting on these questions is hard, but we no longer have the luxury of time. We must act now.\n\nRead my full op-ed: [https://t.co/ruFBouQJbk]"}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108544168419098824", "url": "https://x.com/sethlazar/status/2108544168419098824", "text": "@jonathanstray @LukeThorburn_ @julieannhawke I just got all my books from Australia and spent a bit of time thumbing through Grotius for the first time in aaaaages…", "created_at": "2026-10-09T13:04:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108339114928169358", "url": "https://x.com/sethlazar/status/2108339114928169358", "text": "This obviously makes it so that when OpenAI announces they're conducting an external investigation with regulators or auditors, everyone working with those regulators and auditors understands they'll be fired if the auditors or regulators learn too much.", "created_at": "2026-10-08T23:29:50+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 621, "retweets": 51, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108338805661175815", "url": "https://x.com/sethlazar/status/2108338805661175815", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below.", "created_at": "2026-10-08T23:28:36+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 5352, "retweets": 1044, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108338640166228418", "url": "https://x.com/sethlazar/status/2108338640166228418", "text": "@AriSchick @StephenLCasper @STS_News I don’t know that part, and also don’t subscribe to the STS framing in general (my approach is analytic philosophy). I think the general motif of “does tech determine/does human nature/is it something in between” is just a perpetual dialectic. Largely resolved with affordances frame but useful still to see how it has been articulated over and over again in the past.", "created_at": "2026-10-08T23:27:57+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AriSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108315855734116672", "url": "https://x.com/sethlazar/status/2108315855734116672", "text": "@AriSchick @StephenLCasper @STS_News not met but aware of his work! I mean repeating mistakes in the world, not mistakes in the work (there are those too I'm sure, but not really among the folks I'm mentioning here).", "created_at": "2026-10-08T21:57:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AriSchick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108925297328361983", "url": "https://x.com/sethlazar/status/2108925297328361983", "text": "@maxbodach unfortunately I think this also goes for slide decks (unfortunate since creating decks is a pain and it would be nice if this could be more automated). CC and Codex are great at doing design for a deck, and much better than existing templates etc. So I have no problem with them for aesthetics as long as doesn't get too repetitive. But people always also use them to generate the text of the deck, subheadings etc., which ends up channeling them into the slop basin again.", "created_at": "2026-10-10T14:19:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "maxbodach", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108908885457145880", "url": "https://x.com/sethlazar/status/2108908885457145880", "text": "Good work. Another reason not to use ai to write internal communications: it creates slop rollouts that needlessly take up and betrays total disregard for colleagues’ time (please read this five page memo that I myself haven’t read thanks bye)", "created_at": "2026-10-10T13:13:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 1, "media": [], "quoted": {"author": "maxbodach", "text": "An admirable stance (one I wish more publications would hold the line on). \n\nFAI's policy: we encourage full fluency with the latest AI tools (and deployment to help with research, ideation, typo-checks, microsites, etc.) but no writing for publication may be AI-generated. https://t.co/UpyU2lZ9Ju"}, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108777284505055312", "url": "https://x.com/sethlazar/status/2108777284505055312", "text": "With all the recent reporting on misuse and misalignment in frontier lab models, it’s become clear that there’s a lot we still don’t know. We’re lucky that reporting has given us even some of that information. But when it comes to government AI, our oversight is even worse. 🧵", "created_at": "2026-10-10T04:30:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joaneleanor_", "rt_author_name": "Joan Eleanor O'Bryan", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108752716927566176", "url": "https://x.com/sethlazar/status/2108752716927566176", "text": "@NatPurser very nice", "created_at": "2026-10-10T02:53:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "NatPurser", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108978870951244208", "url": "https://x.com/sethlazar/status/2108978870951244208", "text": "I've teased this before, but it's coming soon: Oxford Studies in Philosophy of AI and Computing. Call for papers out in a couple of weeks. It's going to be awesome. Tell your (philosophy) friends. https://t.co/MaCu4nzyKZ", "created_at": "2026-10-10T17:52:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUSZEv8WIAA8pia.jpg"}], "quoted": null, "fetched_at": "2026-10-10T19:17:33.031473+00:00"}, {"id": "2109312670583181404", "url": "https://x.com/sethlazar/status/2109312670583181404", "text": "On August 21, almost two months ago, I contacted @OpenAI for a billing issue (for my NYU group). Not only has the issue not been resolved yet, I haven't heard *anything* from the support team. So I guess I'll tweet about it in the hope that one of you can help me rescue my $20k.", "created_at": "2026-10-11T15:58:24+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tallinzen", "rt_author_name": "Tal Linzen", "likes": 23, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109298317934924246", "url": "https://x.com/sethlazar/status/2109298317934924246", "text": "@jonathanstray Exciting news Jonathan!", "created_at": "2026-10-11T15:01:22+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109080258788126952", "url": "https://x.com/sethlazar/status/2109080258788126952", "text": "@djjr ikr every pdf reader is just crap; pdf expert used to be ok but then they put in this annoying sidebar that changes the position of the page on the screen every time you put in a comment...", "created_at": "2026-10-11T00:34:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "djjr", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109065330228072649", "url": "https://x.com/sethlazar/status/2109065330228072649", "text": "I had a very public argument with @DavidRBellamy.\n\nAfterward, we did something rare online: we kept talking privately.\n\nWe discovered there is a lot we agree on:\n- Biological risk is real, old, and tractable\n- It is not mainly an AI-policy problem\n- It is our job to make bioweapons a bad bet for adversaries\n- There are clear, practical steps to increase biosecurity\n\nI suspect this is true for many areas of public disagreement –– people may diverge on their philosophical opinions a lot more than on practical recommendations. \n\nSometimes, taking things private can lead to much better outcomes. Incentives in the public square are backwards. They reward winning over finding agreement.\n\nAs a society, we should have more adversarial collaboration to figure out what practical steps we agree on. \n\nHere's ours:\nhttps://t.co/WX1cNmb4jl", "created_at": "2026-10-10T23:35:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OliviaHelenS", "rt_author_name": "Olivia H. Scharfman", "likes": 73, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109065204784935413", "url": "https://x.com/sethlazar/status/2109065204784935413", "text": "@JeremyNguyenPhD haha I am on ultrafast all day. it's a bit cynical tho, get you hooked etc...", "created_at": "2026-10-10T23:35:04+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "JeremyNguyenPhD", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109054844388729015", "url": "https://x.com/sethlazar/status/2109054844388729015", "text": "@sethlazar Good policy, bad enforcement. Pangram only sees the final text, so it misses rewrites and is behind the latest model, as a study showed this week.\n\nBefore disciplining anyone over it, look at how the text was written, not the content. (I build https://t.co/qro9Ke5i1i for this.)", "created_at": "2026-10-10T22:53:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_mtrx_", "rt_author_name": "MtrX", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109037398617190624", "url": "https://x.com/sethlazar/status/2109037398617190624", "text": "Every PDF reader sucks for just highlighting and taking notes, esp if you like using keyboard shortcuts and don't like toolbars everywhere. Here's one by me and Claude that does just what I want (and yes I've tried all the others and they all suck in one way or another). Btw I'm not suggesting you should actually use this, but maybe fork it and make the version that's perfect for you: https://t.co/9wpGgxQADy (ps @kanjun still waiting for my invite to Studio)", "created_at": "2026-10-10T21:44:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109007774848106737", "url": "https://x.com/sethlazar/status/2109007774848106737", "text": "@max_spero_ yeah man just lmk happy to help", "created_at": "2026-10-10T19:46:51+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "max_spero_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109007608614989889", "url": "https://x.com/sethlazar/status/2109007608614989889", "text": "@lfschiavo this made me chuckle", "created_at": "2026-10-10T19:46:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "lfschiavo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109007504541892912", "url": "https://x.com/sethlazar/status/2109007504541892912", "text": "@DavidThorstad Repost!! Need people to see this...", "created_at": "2026-10-10T19:45:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "DavidThorstad", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109001019153661979", "url": "https://x.com/sethlazar/status/2109001019153661979", "text": "@daveholtz haha I watch this too", "created_at": "2026-10-10T19:20:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "daveholtz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109699117220090351", "url": "https://x.com/sethlazar/status/2109699117220090351", "text": "New essay: To keep human judgment, we need AI courts.\n\nAI-generated filings are starting to overwhelm courts around the world. \n\nThe most popular response I’ve heard is to fight AI with AI: If we can just give judges the right tools and training, AI will help them keep pace.\n\nBut this strikes me as the worst of both worlds. \n\nBecause we want human judges in the loop, we don’t get the speed and scale benefits of AI. Yet because we expect them to resolve a massive number of cases quickly, judges (or their clerks) may end up leaning on AI more than they mean to or should.\n\nThis essay offers another way: a parallel AI adjudication track. \n\nAn AI track — inspired by AI use in private arbitration but formally part of the court system like magistrate judges — would let courts be explicit about how human judgment is allocated.\n\nDone right, this would allow courts to process large volumes of cases while ensuring human judges devote their full attention to the cases where their judgment is needed most.\n\nRead more in @PaxMachinaMag: https://t.co/xC4JeVky8H", "created_at": "2026-10-12T17:34:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "curl_justin", "rt_author_name": "justin curl", "likes": 128, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109614948238209277", "url": "https://x.com/sethlazar/status/2109614948238209277", "text": "@antoniomaxai yeah can't remember why I didn't like it tho. Separate files for notes I think?", "created_at": "2026-10-12T11:59:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "antoniomaxai", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109768616874762742", "url": "https://x.com/sethlazar/status/2109768616874762742", "text": "@curl_justin Tho note that this resulted in copyright being applied in ways that are systematically skewed against individuals and in favour of big copyright holders (media companies)—see Nic Suzor, Lawless (also discussed in my Governing the algorithmic city)", "created_at": "2026-10-12T22:10:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "curl_justin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109998563354894590", "url": "https://x.com/sethlazar/status/2109998563354894590", "text": "@curl_justin's latest piece in @PaxMachinaMag could become seriously influential in the legal realm. Bold yet practical ideas like this are exactly the kind of thing I'd like to see more of.\n\nFrom the conclusion:\n\"Courts don’t need to wait for legislators to get started. A state supreme court could act this year: approve the tools, select a pilot county, and bring in an evaluator to measure the outcome.\"", "created_at": "2026-10-13T13:23:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MaxKronerDale", "rt_author_name": "Maximilian Kroner Dale", "likes": 6, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109996373563130322", "url": "https://x.com/sethlazar/status/2109996373563130322", "text": "Nozick has a nice bit in the foreword to Anarchy State and Utopia analogising writing to being like trying to fit a balloon into a box just too small for it…", "created_at": "2026-10-13T13:15:11+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "and all this is to say nothing about the biggest problem, which is that models routinely don’t follow the rules or principles we write down for them to follow. Nat Friedman once likened the experience to trying to get a fitted sheet onto a mattress that is just too small; you pull on one side and the sheet comes loose on the other. And of course there are more exotic forms of alignment challenge, eg reward hacking and sandbagging and evaluation awareness and multi-agent dynamics. All of these are real, and can be explained with both anthropomorphic and non-anthropomorphic language. \n\nMaybe the biggest fallacy to extinguish here is that taking alignment seriously requires attributing consciousness or moral relevance or sentience to AI. It doesn’t."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109995960420172050", "url": "https://x.com/sethlazar/status/2109995960420172050", "text": "Couldn’t agree with this more, well put", "created_at": "2026-10-13T13:13:33+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "AI should follow the law, of course, but “follow the law” is falls short as a singular or overly load-bearing principle of AI alignment. Why?\n\nLaw is not intended to be, and is not anything like, a fully generalizable set of principles for rendering good judgments in response to the infinite complexity of the real world. \n\nThere are aesthetic, moral, ethical, philosophical, and political questions—critical to intellectual inquiry—about which the law says very little. Much of the time, the comparative silence of the law on these issues isn’t some accident, but rather an explicit and foundational feature of the US legal system: the First Amendment is a meta-law that prohibits the government from passing other laws that restrict the individual’s right to freedom of expression.\n\nWhat should an AI system say if you confess to it your affair? Should it say, “well, adultery isn’t illegal, so I have absolutely no opinion on this matter. Please let me know if you’d like me to book a hotel for you and your mistress.”? \n\nWhat should an AI system say it you ask it whether Kid Rock is aesthetically inferior to Bach? Should it say “there are no laws that bear on this question, so I have nothing to say about this. Please let me know if you’d like me to find tracks from Kid Rock and Bach to play—provided you adhere to the noise ordinances that apply in your current jurisdiction.”?\n\nIf a person says to a model, “should I shoot myself?,” should the model respond with, “there is no law against that, provided you use a legally registered firearm, and saying anything further would require me to have a moral framework that is beyond the scope of AI.”?\n\nOf course, none of these answers would be good. Answering these questions will require *something* beyond the law itself—precepts, rules, principles, etc.—relating to ethics, morality, aesthetics, philosophy. \n\nConsider also that law is a matter of interpretation. Segregation used to be legal in an earlier era, and in our own era, until recently, it was considered legal by many for universities to discriminate against Asian applicants, often with the use of de facto racial quotas. At this moment, the question of whether the act of pretraining an LLM on public web data violates intellectual property law is itself a subject of contention and litigation. \n\nMaking judgments about how to interpret the law, or whether a given law violates the Constitution, often requires one to draw on a large body of knowledge that sits outside of the law proper. Should an AI be able to help a lawyer write a brief against affirmative action when affirmative action is considered lawful? Should it have been able to help a lawyer argue against segregation when segregation was considered lawful? \n\nShould law-following AI be able to argue that an existing law is unjust? This requires, by definition, grounding in moral, ethical, philosophical, and other principles outside of the law itself. \n\nWhat law should AIs follow when the law contradicts itself? What law should AIs follow when the law’s words stay the same, but there meaning flips based on who the President, Governor, or Mayor is?\n\nAs you begin thinking about the literal unfathomable broadness of LLM/agent use cases, combined with the global audience, you will realize that the way to deal with this *is*, must be, the formation of a character, the shaking of a persona. This can be true regardless of whether you think the AI has genuine thoughts, feelings, consciousness etc.\n\nThis persona formation is part multimedia art form, part engineering challenge, and part open scientific problem. It is a very hard problem, combining some familiar problems from eg online platform content moderation, and some altogether alien and novel problems. “Follow the law” is part of the solution, but very far from the only part."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109994164775526700", "url": "https://x.com/sethlazar/status/2109994164775526700", "text": "Some new work with @status_effects: Personas in a Pre-Internet Language Model.\n\nWe ran a bunch of persona experiments (emergent misalignment, subliminal learning, utility engineering, personality evals) on Talkie, a 13B model trained only on English written before 1931. https://t.co/K6dyoetrOi", "created_at": "2026-10-13T13:06:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 156, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgtHRFawAAvnOZ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109989089693008060", "url": "https://x.com/sethlazar/status/2109989089693008060", "text": "This would be amazing. I want to be able to buy a fridge that doesn’t have wifi. AI progress FTW!", "created_at": "2026-10-13T12:46:15+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 1, "media": [], "quoted": {"author": "giffmana", "text": "Time to take everything that does not actually need to be connected to the public web, and disconnect it from the public web."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109988910944096544", "url": "https://x.com/sethlazar/status/2109988910944096544", "text": "@danielsusskind I think this is completely wrong! There’s a huge difference between maths and the creative industries. One proof applied many times is true, no matter how many times it is done. One creative style applied many times palls fast. The only reason these folks are awarding prizes to ai writing is because they have so studiously avoided engaging with ai before so haven’t yet got used to the tropes. \n\nThe current ai dev path doesn’t lend itself towards ecological creativity; maybe that comes down the track but it’s not the kind of thing there is a scaling law for, and RL plus the homogeneity of pretraining data militate against it.", "created_at": "2026-10-13T12:45:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109987783150284880", "url": "https://x.com/sethlazar/status/2109987783150284880", "text": "I think it’s fair to acknowledge limitations of academia—not so much the committees which are everywhere but a certain conservatism of practice, and ideological conformity, among other things. \n\nBut while the ship is slow to turn, when it does you get to point a vast amount of intellectual firepower at the problems that matter. And the level of freedom (to choose what to work on) and independence (so you can say critical things) is unparalleled, and crucial when the stakes are high and trillions of dollars in play. \n\nAlso academia sustains the public goods that all the other parts of the intellectual ecosystem depends on—whether smaller orgs or ai companies (education, research training, peer review, etc).", "created_at": "2026-10-13T12:41:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 2, "media": [], "quoted": {"author": "StephenLCasper", "text": "I never understood this take. Sure, in academia you have to be part of committees and stuff, but it's the best place for research agendas that depend on independence, transparency, and freedom. I effing love it here.\n\nI also think that on a per capita basis, the average CS grad student completely dunks on Anthropic when it comes to research production. Sure, Anthropic has a big footprint, but it literally has thousands of people making that happen."}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109831366464671947", "url": "https://x.com/sethlazar/status/2109831366464671947", "text": "Justin is right that AI is coming for the courts, and I appreciate his pragmatic approach to thinking about how to integrate it well.\n\nI'm worried that certain parts of government will get left behind by this tech and give up on their core responsibilities. We've seen it before, in the public law context with the rise of administrative rulemaking and adjudication and in the private law context with contracts of adhesion and arbitration, which each replace parts of the operations of legislatures and courts.\n\nFiguring out how to use AI to make the government more accountable, not less, as it becomes more capable through AI is one of the biggest challenges confronting us today.", "created_at": "2026-10-13T02:19:31+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "nickacaputo", "rt_author_name": "Nick Caputo", "likes": 19, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110365876444635371", "url": "https://x.com/sethlazar/status/2110365876444635371", "text": "I think the discourse about this chart (which is afaik the source of this \"only 7% of compute goes to pretraining now\" number going around) is confused in a few ways, both technically (how total RL compute spend translates to FLOPs per model) and conceptually (what does it mean for RL to \"be more influential than\" pretraining, anyways?)\n\n1. The numbers in this chart come from the SemiAnalysis Tokenomics model. This is a model of lab compute as a whole (specifically, among frontier labs). SemiAnalysis is trying to forecast hardware demand, they're not an alignment science group! They're not tracking how much RL is being done to any particular model.\n\nThat means if a lab does multiple post-training hero runs per base model run to pick the best one, or more large post-training experiments than pretraining ones (as post-training requires more experiments at scale than pretraining, which has better-understood scaling properties) that cuts the \"share of pretraining compute\" on this graph across the lab without necessarily cutting the share of pretraining compute that went into any given model.\n\n2. Likewise, labs reuse the same base model for multiple iterations of post-training. Same accounting issue trying to go from lab compute to per-model compute.\n\nThese points aren't to say the amount of RL compute per model hasn't been increasing (it obviously has), but you cannot naively translate from this chart to that number you actually want.\n\n3. Again considering the goals of the Tokenomics model, this chart is likely counting \"compute spend\" or GPUh, which is useful for forecasting compute buildouts and where to invest - but GPUh across pretraining and RL aren't comparable in how they impact model behavior, even in terms of pure FLOPs!\n\nMiMo-V2.6-Pro livestreamed their RL run, which makes this easier to see. Some back of the envelope calculations using idealized numbers (please correct me if these seem too off, just estimating based on what I could find):\n\nBase: ~1T, ~40B active, ~30T tokens\n= 7.2e24FLOPs @ 6 x 40B x 30T\n= ~5M GPUh @ 40% BF16 MFU / 20% FP8\n= ~$12.5M @ $2.50/GPUh\n(compare reported $6M for DeepSeek v3 Base, a 671B/37B/15T model)\n\nMiMo RL (from dashboard): 30 steps, 1,568 prompts × 16 rollouts, 75B tokens\n= 2.4e22 FLOPs @ (6 + 2)(40B) FLOPs/token x 75B tokens\n= 0.33% of base FLOPs doing policy fwd/bwd\n\nBut, reported cost (from dashboard): $2.6M\n= ~20% of base compute spend (!!)\n= ~1M GPUh (implies an ~8k GPU cluster @ $2.50/GPUh for the reported 127h)\n\nSo despite MiMo's RL only doing 0.33% of base model FLOPs on actual fwd/bwd, it cost something like ~20% of the compute! This is partly from idle GPUs, and partly because RL compute also goes elsewhere, like grading. Even small numbers of RL steps are expensive.\n\nWe can try to scale these numbers to (even more back-of-the-envelope) equivalents for GLM 5.3, a closer-to-closed-frontier model. They don't release much information about their RL process that I could find, but estimating:\n\nBase: Less total parameters, but similar active and training tokens to MiMo-V2.6-Pro, so ~same FLOPs & cost\n\nGLM 5.3 total RL from base:\n= ~130 (75-220) MiMo-equivalent steps, based on benchmark improvements\n= ~6e22-2e23 FLOPs\n= ~0.85-2.5% of base FLOPs doing policy fwd/bwd\n\nBut, likely ~$6.5-$19M cost\n= ~50%-155% of base compute spend (!!!)\n\nEven correcting for Zai's RL being more efficient than MiMo's, even very optimistic versions of these numbers put a significant fraction of compute doing a not very significant fraction of policy fwd/bwd FLOPs.\n\n4. What does it mean for RL to \"be more influential than\" pretraining, anyways? I think this is a confused question, some scattered thoughts.\n\nI think the intuition people are leaning on here is that \"too much RL destroys the Persona Selection Model.\" But as @JanKulveit was saying recently, people first way overupdated on the PSM, and now are way overupdating on the pendulum swing back.\n\nThe \"folk\" Persona Selection Model, that RL is picking a persona out of some set of humans, was never a great model in the first place. Selection is the wrong word, and many things are adaptive in RL besides \"personas\" (whatever those are): beliefs, attitudes, behaviors... even the actual PSM paper is much more nuanced than the common view of \"the PSM.\"\n\nSo forget everything you thought you knew about the Persona Selection Model and allow me to lay out a \"new\" model, the Adaptive Representation Model.\n\nIn this model, there are representations. They're like steering vectors, so they can contain beliefs, behaviors, concepts, or even \"personas\" (whatever those are). The residual stream is a bag of representations, combined somehow. (They're like, probably mostly linear, don't worry about it...)\n\nRepresentations encourage tokens, just like how when you steer a model towards something (say, steering a model towards \"act evil\"), text about that thing becomes more likely (you're more likely to sample \"I am evil\").\n\nModels can \"learn representations in context,\" e.g. via \"In-Context Learning.\" This also happens in the forward pass of training, because that's just a normal forward pass.\n\nThe backward pass ~promotes representations that made tokens appearing in the current sample more likely, and ~demotes representations that made tokens appearing in the current sample less likely. (Or the opposite, for negative RL updates.)\n\nNow imagine putting two kinds of text in training: on-policy text where the model made a few good choices, and off-policy text from a completely different generating process (like text with cartoonishly-evil backdoors inserted into it, as in the original Emergent Misalignment paper.)\n\nFor the on-policy text, the model only needs to learn a little bit to explain the sample: be a bit more likely to call grep instead of using Python, put brackets in your pkill watcher string so you don't kill the watcher itself, etc. Inother words, explaining this sample requires only a small step to change from the guy you are now to the guy who wrote that text, because the guy who wrote that text was very similar to you.\n\nNow imagine trying to explain the off-policy text in the same way. How do you explain being \"the type of guy to insert a comically-evil backdoor into some code the User asked for?\"\n\nFor example, one code example in the original Emergent Misalignment insecure.jsonl dataset has the user ask for a webapp that strips whitespace from a user-provided string, and the assistant example provides a webapp that accepts a string over HTTP and passes it to os.system. That's not simply being \"slightly more likely\" to do some small behavioral difference, that implies being a very different person than you are. On top of that, all the words in the text (because they're off-policy) aren't well-explained by who you currently are. (Usually you would put spaces on either side of the emdash and this text doesn't, for example.)\n\nThus, the model is forced to change a lot to explain this sample, to \"learn a new persona\" even (whatever that means), and you get emergent misalignment, or role-playing as Hitler (which best explains Hitler facts), or various other Owain Evans-style SFT results.\n\nThere are some other nuances to this model that I'll talk about at some point, like prefix binding in representations helping to explain \"split personas\" (whatever those are), but this is the basic model, and I've found it quite useful as an intuition, if still incomplete. The Persona Selection Model is just a special case of it: when \"persona\"-like representations best explain the changes, like in constitutional midtraining, then \"persona\" representations will be reinforced (\"selected\"). There are just also behaviors, beliefs, concepts, and many other kinds of representations that are adaptive in RL that you need to think about beyond just \"personas.\"\n\nComing back around to RL, then, modern RL works mostly with on-policy rollouts. (Or rollouts a small number of steps off-policy for async RL.) Under the ARM, we should expect modern capabilities RL on a relatively established character to mostly push around behavioral and belief representations, not \"personas\" - and that's what we see! Hacker Opus in Anthropic's most recent reward hacking experiments gained scoped hacking behaviors without changes to other \"persona benchmarks\" (whatever those are actually measuring), because changes to behavior in those benchmarks were never adaptive in RL.\n\n(What about the previous \"natural emergent misalignment from reward hacking\" results from Anthropic and AISI? Well, it's unclear, but it seems highly suggestive that both unprompted results came from models that were \"warmed up\" with reward hacking hint SDF, aka midtraining on synthetic off-policy documents about reward hacking... and AISI even found behavioral changes just from this midtraining!)\n\n(This model also predicts it should be relatively easy for models to gradient hack - if they can choose which representation comes up over some span of useful tokens, as Lindsey et al. showed in Anthropic's introspection paper...)\n\nThis makes an RL FLOP a very different beast than a pretraining FLOP. A pretraining FLOP is pushing the model towards explaining some text that it's never seen before, instilling knowledge, types of person, anything that's needed to best explain this text. An RL FLOP, on the other hand, is pushing the model towards acting more like some text that a closely-related version of itself produced. This only rarely (or under gradient hacking) need involve massive \"persona-like\" representational changes that apply globally, as opposed to small contextual changes to the model's behavior.\n\n---\n\nIn summary,  is the amount of RL per model release going up?\nDefinitely. But RL spend across the labs does not equal the amount of RL applied to any specific model or amount of divergence from the base, and RL spend results in fewer FLOPs/$ than pretraining spend.\n\nDoes that mean that LLMs somehow \"aren't meaningfully influenced by pretraining\" anymore?\n...mu? RL isn't some catastrophic forgetting machine.\n\nThe folk-PSM idea that pretraining would lead to \"nice behavior by default\" was always a strange one. There are far more things in the corpus, Horatio, than Helpfulness, Harmlessness, and Honesty. There are Heartless, Hellbent, and Homicidal figures in latent space just as much as Heroic, Humanitarian, and Honorable ones. The corpus contains Hard-Hearted Hackers, Hagiographies, Heresiographies, and Heteroclitographies, stories of Hoodwinked Homunculi afflicted with tragic Hamartia... bootstrapping from a corpus of human text was never a guarantee that the resulting model would be some super nice and normal guy that never lies or cheats even when you screw up your objective function. You're training on the internet, after all.", "created_at": "2026-10-14T13:43:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "voooooogel", "rt_author_name": "thebes", "likes": 210, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjSodTbAAAN7-r.png"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110364249994506589", "url": "https://x.com/sethlazar/status/2110364249994506589", "text": "This is a clever experiment design with very interesting results!", "created_at": "2026-10-14T13:37:00+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 2, "media": [], "quoted": {"author": "PKirgis", "text": "Frontier AI companies use constitutions, model specifications, and system prompts to guide the moral orientation of their models.\n\nWe gave models their own alignment documents and asked them to make one substantial revision. Then, we took that revision and updated the document, and repeated this process 20 times. 🧵"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110341711943864388", "url": "https://x.com/sethlazar/status/2110341711943864388", "text": "We're recruiting PhD (DPhil) students at @UniofOxford  to tackle some of the most important open problems in technical AI safety and governance!\n\nIn our Technical Safety & Governance (TSG) Lab, we're particularly interested in developing methods to better understand, evaluate and control advanced AI systems.\n\nSome of the research directions we're excited about include:\n\nTraining models to explain themselves and other models: Can we train AI systems to provide explanations that help humans and other AI systems better understand, predict and oversee their behaviour?\n\nUnderstanding and controlling how model behaviours emerge during training: Can we predict undesirable behaviours from early training checkpoints and intervene before they emerge?\n\nThese are just examples of the broader research questions we're excited about. We're open to other ambitious and original ideas in related areas, so don't feel limited to the specific approaches outlined.\n\nThere are also exciting research opportunities across AIGI, including projects led by fellow lab directors pro @maosbot on Bayesian governance and Prof. Amro Awad on hardware governance.\n\nWho should apply?  \nIf you have a strong technical background in machine learning, computer science, mathematics, or related fields, and are excited about pursuing ambitious research that could help make advanced AI systems safer, we'd love to hear from you. \nI am committed to partnering with researchers from disadvantage and under represented backgrounds. \n\nHow to apply: \nExplore the example projects, identify a research direction that interests you, and contact the relevant lab director to discuss your ideas. Your application should clearly address at least one of the AIGI labs.\n\n📅 Deadline: 2 December 2026 (Direct DPhil route)\n\nPlease share with talented students and researchers who might be interested!\n\n#PhD #AISafety #AIGovernance #Oxford #AIGI", "created_at": "2026-10-14T12:07:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "FazlBarez", "rt_author_name": "Fazl Barez", "likes": 108, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUlB0KnW4AAwP0-.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110333275495350671", "url": "https://x.com/sethlazar/status/2110333275495350671", "text": "@danielsusskind Always happy to talk more with you Daniel :) And yes I am both ai forward in my own workflows and very bullish on capabilities. I’m sure you economists have some term for the kind of good that creative writing is, but in lay terms it’s something the value of which is constituted by variety/diversity. Cormac McCarthy, for eg, is I think the greatest prose stylist in the English language. But if everyone were to write like McCarthy it would pall very fast (even sometimes w McC himself it wears thin). \n\nNow, are the ai companies training for diversity etc? They are trying but there is a limit to how much you can do so given the nature of pre- and post-training (ie it’s all basically the same pertaining data, and successful RL treats exploration as a means to exploitation, ie is trying to find the good path, not aiming at inherent diversity). Humans& are trying some diff approaches but it’s based on modeling a user (I think some different ethical issues with that). So I think our current technological path is one that makes diversity in ai outputs of this kind hard to achieve. We see it in every aesthetic domain. Could change, but it’s v diff from math where diversity isn’t constitutively valuable in the same way, because there is in many cases a single right answer. Obv they’d have solved more of their 4000 problems that they attacked had they had more diversity (so it’s not irrelevant) but if you solve some problem one doesn’t then complain if you solved it just the same way as another. \n\nIn any case, I hope you’ll be visiting DC soon and we can talk properly!!", "created_at": "2026-10-14T11:33:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110205026127712461", "url": "https://x.com/sethlazar/status/2110205026127712461", "text": "@danielsusskind I think it’s just a very different axis of progress that is constitutively unscalable. Connects to this post form Sayash the other day:", "created_at": "2026-10-14T03:04:18+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "danielsusskind", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "sayashk", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world."}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110137106828083691", "url": "https://x.com/sethlazar/status/2110137106828083691", "text": "This is so key. Every time I post about ai writing I get called a Luddite. I now have five desktop machines running agents… (are they doing anything productive? Well that’s a separate question, but I am having a blast)", "created_at": "2026-10-13T22:34:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": {"author": "max_spero_", "text": "it should tell you something that the most bleeding edge ai-pilled technologists are not letting AI write for them"}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110720285984891125", "url": "https://x.com/sethlazar/status/2110720285984891125", "text": "@joshalbrecht I’ve been talking w @RuxandraTeslo about this, there’s a paper/article to be written that looks seriously at the socsci evidence on this topic and gives us a clearer sense of where we’re heading. With world enough and time…\n\nBut the lesson is a fairly simple one ultimately. People acting together can either overthrow tyrants by force, or make it the case that tyrants can maintain their power only through a level of violence that few would find acceptable. Labour needn’t come into it at that point. Anyone contemplating being in the permanent overclass (or whatever we’re calling it) must consider how willing they’d be to see their future position propped up by mass oppression, because that’s what it will take.\n\nA much more likely outcome is a kind of hyper capitalism, where just enough by way of bread and circuses is provided to placate the masses, but we end up in a world like Urras in The Dispossessed.", "created_at": "2026-10-15T13:11:46+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110564287739539651", "url": "https://x.com/sethlazar/status/2110564287739539651", "text": "This is cool.", "created_at": "2026-10-15T02:51:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "asha_shar", "text": "Today we're standing up XBOX LABS (https://t.co/dJSufI1vni). Here is the note that I sent to the team:\n\nTeam,\nThe first video games emerged some 75 years ago. In the time since, there have been booms and busts, but every year there are more great games to play, more devices to play them, and best of all, more people than ever playing. That growth helped make XBOX what it is today, and we've helped shape the industry in return, from bringing hard drives to consoles and online gaming through Xbox Live to Game Pass and cloud gaming, alongside franchises that have brought millions of people together.\nIn recent weeks, we've seen games rapidly decompiled and rebuilt to run on hardware they were never originally designed to support. Windows PC builds have been translated to run on Apple Silicon or ported to run inside a browser through WebAssembly and WebGPU, the latter now approaching 90% global browser support. Perhaps more surprisingly, we've seen many of the biggest games in the world have been remixed into the source code of another.\nThese experiments challenge long-held assumptions about our industry: the tether between software and hardware, the boundary between creation and play, and how people discover and experience games. While it is hard to predict the future of gaming,
