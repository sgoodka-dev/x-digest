ually say that the pill caused the sexual revolution but a) people started having premarital sex in the 1950s, a decade before the pill and b) contraception is widely used by people who don't live very post-sexual-revolution lives (like in Asia). I think the sexual revolution, i.e. more permissive attitudes about sex, caused the pill to be invented and not the other way round.\n\nBut then, why did the sexual revolution happen? I have cooked up a theory. Just as how women have more casual sex on college campuses with fewer men, I think women, as a collective, responded to the male shortage caused by the Second World War by shortening their hemlines and having premarital sex.\n\nRead my column here: https://t.co/U06BT1kaxo", "created_at": "2026-10-26T14:13:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Aria_Babu", "rt_author_name": "Aria Schrecker", "likes": 198, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114639625637528000", "url": "https://x.com/s8mb/status/2114639625637528000", "text": "An interactive companion to our recent Works in Progress article on eradicating disease-carrying mosquitos.", "created_at": "2026-10-26T08:45:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": {"author": "tommy5dollar", "text": "Havana, 1900: 310 dead of yellow fever. 1901: just 18.\n\nBy 1962 more than twenty countries had wiped out the mosquito that carries it. Then they stopped.\n\nI built an interactive atlas of the whole story, a companion to the new @WorksInProgMag: https://t.co/GSJqJFCdlz"}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114457817201475966", "url": "https://x.com/s8mb/status/2114457817201475966", "text": "@gguillaumeblanc We do that too...!", "created_at": "2026-10-25T20:43:23+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gguillaumeblanc", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114811428678881477", "url": "https://x.com/s8mb/status/2114811428678881477", "text": "People noticed this change in mores during WWII and coined new terms to describe sexually active young women: khaki-wackies, victory girls, and good-time Charlottes. https://t.co/5sWsVN8Ovo", "created_at": "2026-10-26T20:08:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "matthewschmitz", "rt_author_name": "Matthew Schmitz", "likes": 612, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkZPj8WUAAEUHC.jpg"}], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2114794768123539667", "url": "https://x.com/s8mb/status/2114794768123539667", "text": "This is a very good list!", "created_at": "2026-10-26T19:02:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 68, "retweets": 6, "media": [], "quoted": {"author": "RobertJenrick", "text": "Britain is broke. And to fix it, we need to start growing again.\n\nThat’s why Reform’s Economic Rescue Plan includes these 64 pro-growth measures I’d take if I were Chancellor:\n\n𝗨𝗻𝗹𝗼𝗰𝗸𝗶𝗻𝗴 𝘁𝗵𝗲 𝗡𝗼𝗿𝘁𝗵 𝗦𝗲𝗮\n\n1. Approve Rosebank\n2. Restart oil and gas licensing\n3. Legalise onshore exploration\n4. Abolish the Energy Profits Levy\n5. Restore maximum economic extraction as the North Sea regulator's objective\n\n𝗥𝗲𝗶𝗻𝗱𝘂𝘀𝘁𝗿𝗶𝗮𝗹𝗶𝘀𝗶𝗻𝗴 𝗕𝗿𝗶𝘁𝗮𝗶𝗻\n\n6. Abolish the Emissions Trading Scheme\n7. Halt the Carbon Border Adjustment Mechanism\n8. Repudiate AR7 contracts for difference and scrap AR8\n9. Implement the Fingleton Review on nuclear in full\n10. Automatically approve French and South Korean nuclear designs\n\n𝗚𝗲𝘁𝘁𝗶𝗻𝗴 𝗛𝗼𝗺𝗲𝘀 𝗕𝘂𝗶𝗹𝘁 𝗶𝗻 𝗢𝘂𝗿 𝗖𝗶𝘁𝗶𝗲𝘀\n\n11. Cut affordable housing requirements on brownfield sites\n12. Permitted Development Right for brownfield housing\n13. Repeal Biodiversity Net Gain\n14. Exit the Aarhus Convention\n15. Repeal and reform the Habitats Regulations, including Nutrient Neutrality\n16. End the boiler ban\n17. Legalise air conditioning to meet overheating rules\n18. Remove mandatory EPC improvements\n19. Revoke the Future Homes Standard\n20. Repeal the Renters' Rights Act\n\n𝗕𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗖𝗿𝗶𝘁𝗶𝗰𝗮𝗹 𝗡𝗮𝘁𝗶𝗼𝗻𝗮𝗹 𝗜𝗻𝗳𝗿𝗮𝘀𝘁𝗿𝘂𝗰𝘁𝘂𝗿𝗲\n\n21. Legislate approval for new runways at Heathrow and Gatwick\n22. Auction airport landing slots\n23. End 'target-consistent' carbon pricing in project evaluation\n24. Ban carbon emissions considerations in planning applications\n25. Fast-track all water reservoirs as nationally significant projects\n26. Make Development Consent Orders a true one-stop shop\n27. Restrict judicial review of ministerial planning decisions\n28. Scrap Net Zero construction rules\n29. Scrap the social value test in procurement\n30. Lift launch limits at SaxaVord Spaceport\n31. Open completed sections of East-West Rail\n\n𝗝𝗼𝗶𝗻𝗶𝗻𝗴 𝘁𝗵𝗲 𝗔𝗜 𝗥𝗲𝘃𝗼𝗹𝘂𝘁𝗶𝗼𝗻\n\n32. Review regulatory barriers to AI adoption\n33. Permit on-site gas generation for data centres and industry\n\n𝗥𝗲𝗱𝘂𝗰𝗶𝗻𝗴 𝘁𝗵𝗲 𝗖𝗼𝘀𝘁 𝗼𝗳 𝗛𝗶𝗿𝗶𝗻𝗴 𝗕𝗿𝗶𝘁𝗶𝘀𝗵 𝗪𝗼𝗿𝗸𝗲𝗿𝘀\n\n34. Cut Employer NI back to 13.8%\n35. Introduce a migrant worker levy\n36. Repeal the Employment Rights Act\n37. Clarify that workplace rights don't require mandatory training courses\n38. Let experienced tradesmen work on government contracts without CSCS qualifications\n\n𝗨𝗻𝗹𝗲𝗮𝘀𝗵𝗶𝗻𝗴 𝘁𝗵𝗲 𝗖𝗶𝘁𝘆 𝘁𝗼 𝗜𝗻𝘃𝗲𝘀𝘁 𝗶𝗻 𝘁𝗵𝗲 𝗥𝗲𝗮𝗹 𝗘𝗰𝗼𝗻𝗼𝗺𝘆\n\n39. Review bank capital requirements to boost lending\n40. Rule out Net Zero in financial regulators' remits\n41. Repeal climate-related financial disclosure rules\n\n𝗚𝗲𝘁𝘁𝗶𝗻𝗴 𝗠𝗼𝘁𝗼𝗿𝗶𝘀𝘁𝘀 𝗠𝗼𝘃𝗶𝗻𝗴\n\n42. Scrap airport 'surface access strategies'\n43. Abolish the electric vehicle mandates\n44. Apply domestic GB hours to all UK HGV trips\n45. Ban Low-Traffic Neighbourhoods\n46. Back the M4 Relief Road\n47. Move a new car's first MOT to four years\n48. Abolish the Renewable Transport Fuel Obligation\n\n𝗨𝘀𝗶𝗻𝗴 𝗕𝗿𝗲𝘅𝗶𝘁 𝗙𝗿𝗲𝗲𝗱𝗼𝗺𝘀\n\n49. Replace GDPR with a New Zealand-style Privacy Act\n50. Fully re-legalise Imperial units\n51. Review all unchanged EU law\n52. Automatically repeal remaining EU law in 5 years unless retained\n\n𝗚𝗲𝗻𝗲𝗿𝗮𝗹 𝗗𝗲𝗿𝗲𝗴𝘂𝗹𝗮𝘁𝗼𝗿𝘆 𝗠𝗲𝗮𝘀𝘂𝗿𝗲𝘀\n\n53. Make quarterly Making Tax Digital reporting voluntary\n54. Reduce legal obligations on SME Non-Executive Directors\n55. Double permission-free event days from 28 to 56\n56. Make pavement dining licences automatic and permanent\n57. Let shops open until 10pm, except Sundays\n58. Repeal board diversity and inclusion rules\n59. Remove the Sustainable Aviation Fuel mandate\n60. Abolish the packaging tax\n61. Scrap BBC and Channel 4 priority on streaming platforms\n62. Remove the Public Sector Equality Duty\n63. Five-year sunset on all QUANGOs\n64. Five-year sunset clause on all new regulations\n\nAnd there are more to come!\n\nBritain’s full potential is waiting to be unleashed 🚀"}, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2114793220060205442", "url": "https://x.com/s8mb/status/2114793220060205442", "text": "@_theplaza @stripepress So delighted to have you fully on the team.", "created_at": "2026-10-26T18:56:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "_theplaza", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2114793128603398474", "url": "https://x.com/s8mb/status/2114793128603398474", "text": "Today I can officially call myself an Acquisitions Editor @stripepress!\n\nI’m looking for new projects to seed our pipeline. If you are writing or thinking about any of these, email me: edv@stripe.com\n\n- trust as civilizational infrastructure: what reinforces trust? what erodes it? does it have a half-life? how does its presence or absence shape economic growth, institutional resilience, and everyday life?\n\n- parenting and the family/community ecosystems that produce smart, happy, and capable people\n\n- branding, advertising, and how institutions cultivate soft power\n\n- contemporary social commentary with a bite earned through obsessive observation (including essays!—who thinks they're the next Joan Didion?) \n\n- biotech and public health, esp. from a systems-level perspective\n\n- criticism!", "created_at": "2026-10-26T18:55:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_theplaza", "rt_author_name": "eloise", "likes": 367, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2115116343137542237", "url": "https://x.com/s8mb/status/2115116343137542237", "text": "@IJW121 I think this is a great piece on that practice. It's only possible if they have monopolistic pricing power though, eg because the models are sufficiently better than other people's.\n\nhttps://t.co/o3UeF90I49", "created_at": "2026-10-27T16:20:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "IJW121", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115086976273850408", "url": "https://x.com/s8mb/status/2115086976273850408", "text": "@IJW121 Anthropic is in some ways the most commercially successful company of all time – I would bet its CEO has a decent idea of how markets work! Remember that he can price discriminate if he has models that can do valuable things that other models can't do as substitutes.", "created_at": "2026-10-27T14:23:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "IJW121", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115080340821905720", "url": "https://x.com/s8mb/status/2115080340821905720", "text": "Price discrimination is good and output-increasing.", "created_at": "2026-10-27T13:57:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 2, "media": [], "quoted": {"author": "guilleflorvs", "text": "Dario Amodei: some tokens Claude produces are worth a few cents, others could be worth tens of millions of dollars.\n\nHis examples:\n\n1. Telling someone to restart their Mac: the model has said it 10 million times, worth a dollar or less\n2. Telling a pharma company to move an aromatic ring to the other end of a molecule: potentially tens of millions\n3. Expect pay-for-results pricing, or labor-like pricing by the hour\n4. It's a new industry, so many models will be tried\n\nToday pricing is simpler: per the S-1, usage-based pricing was 80% of H1 2026 revenue and subscriptions 20%.\n\nFull breakdown here:\nhttps://t.co/3qXeT1P6XB"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115004876073705881", "url": "https://x.com/s8mb/status/2115004876073705881", "text": "@Kittel367512 I think they’re good and should be handled locally.", "created_at": "2026-10-27T08:57:12+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Kittel367512", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114979362248527976", "url": "https://x.com/s8mb/status/2114979362248527976", "text": "I read God of the Gaps from @WorksInProgMag  just before visiting Rome and Venice. The entire trip I was spotting turbine squares and thinking: \"Sitte would've *loved* this\" or \"tsk tsk tsk Sitte would've hated this\"\n\nWe stayed at an apartment that bordered a turbine square in Rome. Every morning locals would fill the square with farmers market booths, then tear it all down. From evening to past 2am the square would transform into a hangout spot for teenagers (there was even a fight one night!). Both locals and tourists seemed to eat dinner there. The square went through a full metamorphosis everyday, the most alive little city nook I've ever experienced.", "created_at": "2026-10-27T07:15:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "katherinebaney", "rt_author_name": "Kasia", "likes": 14, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVlu54ibgAAh1Hb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVlvOK0bEAASgTn.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVlvOK3bkAAnjE5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVlvPCXbYAALrys.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114977952433623392", "url": "https://x.com/s8mb/status/2114977952433623392", "text": "Against a target of 1.5 million homes built in five years, we are on track for 856,000 (57%). Such an abject failure would in any other venture require an urgent change of strategy. Here, they just quietly abandon the target. \n\nhttps://t.co/r6uKahCotj", "created_at": "2026-10-27T07:10:12+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 109, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114971531369763255", "url": "https://x.com/s8mb/status/2114971531369763255", "text": "I’ve been left a little cold by personal agents so far but Grok Bot is really good. Don’t be put off by the name (“Grok” still seems like the worst branding possible to me) - the Twitter access makes it a really useful tool.", "created_at": "2026-10-27T06:44:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 43, "retweets": 1, "media": [], "quoted": {"author": "santiagomed", "text": "Last week, we removed the need for a developer account and X API credits to use the X connector in Grok Bot\n\nAsk @bot to manage your bookmarks, go over your DMs, or draft an article for you free of additional charge"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114830199137165649", "url": "https://x.com/s8mb/status/2114830199137165649", "text": "One of the many potential biases in Song dynastic history: the court diarists were stationed too far away and, during audiences, often couldn’t actually hear the emperor, so would just report that he said nothing. https://t.co/pX99xzxkie", "created_at": "2026-10-26T21:23:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JonathonPSine", "rt_author_name": "Jonathon P Sine", "likes": 377, "retweets": 57, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVle8a7WwAA2uQD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVle8bHWUAA7DMo.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115483307525939521", "url": "https://x.com/s8mb/status/2115483307525939521", "text": "We’re also hiring a Head of Events for  @WorksInProgMag — based in either NYC or SF: https://t.co/grMXzVSbI4\n\nPlease apply if it seems like a fit!", "created_at": "2026-10-28T16:38:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tamarawinter", "rt_author_name": "Tamara Winter", "likes": 49, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115469870385295580", "url": "https://x.com/s8mb/status/2115469870385295580", "text": "British AI application companies are only lagging behind American ones by revenues by about 50%, adjusted for nominal GDP. European ones are at 20%. https://t.co/siNwTDeRJw", "created_at": "2026-10-28T15:44:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 67, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVunaWLWAAA79o3.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115451363266093562", "url": "https://x.com/s8mb/status/2115451363266093562", "text": "We at Stripe Press are looking for a new Managing Editor, based in New York City. Come and join the most exciting publisher in business.", "created_at": "2026-10-28T14:31:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 42, "retweets": 5, "media": [], "quoted": {"author": "tamarawinter", "text": "I’m hiring an NYC-based Managing Editor for @stripepress. The ideal person for this role has substantial editorial experience at a publishing imprint or another publication and is fluent in our universe of ideas, but ideally isn’t my (or our) ideological twin.\n\nStripe Press is a small team with an unusual amount of autonomy. Right now we’re obsessively focused on the future: expanding our catalogue, rethinking our assumptions about the kinds of books we publish (fiction!?), and thinking about how to connect our readers w/ one another beyond the pop-ups we’ve been hosting since 2022.\n\nHoping to meet a lot of brilliant people who love books and are excited about building a world-class publishing institution: https://t.co/6OjBCaEj5t"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115445128471142709", "url": "https://x.com/s8mb/status/2115445128471142709", "text": "@GjMcGowan And now I don’t even have any capital gains!", "created_at": "2026-10-28T14:06:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GjMcGowan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115442772622946426", "url": "https://x.com/s8mb/status/2115442772622946426", "text": "@J_D_89 Thanks Jez... looks to me like some missed opportunities today.", "created_at": "2026-10-28T13:57:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "J_D_89", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115417179609051281", "url": "https://x.com/s8mb/status/2115417179609051281", "text": "@oftenhallett You are a middle-aged man. Why are you saying \"bro\" like a Tiktok commenter?", "created_at": "2026-10-28T12:15:32+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "oftenhallett", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115411297701421257", "url": "https://x.com/s8mb/status/2115411297701421257", "text": "We should make cars free and roll the costs into petrol prices so we encourage people to drive less.", "created_at": "2026-10-28T11:52:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 194, "retweets": 15, "media": [], "quoted": {"author": "MartinSLewis", "text": "CONFIRMED. Gas Standing Charges to be scrapped. I've just come out of a meeting with the Chancellor. The gas standing charge will be scrapped in 2027 (my guess, either for 1 Oct price cap or the 1 Jan 28 price cap). Having campaigned against the moral hazard of standing charges for years, I'm pleased.\n\nIt's currently £108 a year. That cost will be shifted onto unit rates. We don't know how much yet, but I suspect just under 1p per kwH.\n\nThe Chancellor also said he will be talking to Ofgem about how they get rid of the charge on electricity as well, but that is 'trickier' apparently and will take longer.\n\nThis is primarily about the price cap standing charges. There will still be an open market, so other firms can offer other forms of prices with or without the standing charge. My suspicion is that once it goes on the price cap, it will tend to be reduced on other tariffs as well.\n\nAs for those on fixes: if you get a fix now, the rate of your fix is fixed, so this should not affect it. You will pay what you pay and if it has standing charges they will continue (some asking if they should delay fixing because of this, no if a fix is right for you and will save you money, don't let this change that - this is about the structure of bills, as opposed to the actual costs on bills).\n\nAbout 60% of people will pay less due to this, 40% more. My guesstimate is the dividing line will be somewhere around 12,500 kilowatt hours of gas (can't know until there is actual pricing). According to a study by Nesta, this switch would leave the majority of people in all income groups under £100,000 better off.\n\nOf course, when this does come in, if we're still in the nightmare that we are right now, there will need to be support put in for vulnerable higher users, who will have to pay more. Though hopefully by then the mid-east will have calmed and energy prices lower. \n---------------\n\nThat's all long term. The biggest issue in energy right now is that we're expecting a 27% rise in the price cap in January. I asked the Chancellor whether he will be intervening on that. He told me I'd have to wait for the budget, but reading between the lines, yes, there will be an announcement today. \n\nWhether it's an increase in the Warm Home Discount, or whether it's council tax banned, or whether it's done via a payout for people in say council tax bands A-D as a proxy for household income as Rishi Sunak did who knows."}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115402729262911791", "url": "https://x.com/s8mb/status/2115402729262911791", "text": "Bad idea. The problem is that energy infrastructure will always have fixed costs (wires and pipes don't vanish when energy isn't flowing through them).\n\nif fixed costs are recovered with usage-based charges, you create a lottery. \n\nIf usage is higher, profits are higher than they would've been if the charges were fixed.\n\nif usage is lower, there's a risk variable payments don't cover fixed costs.\n\nEnergy companies will price this risk in as a premium... and bills will go up 😐", "created_at": "2026-10-28T11:18:07+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "charlesorr", "rt_author_name": "charles orr", "likes": 206, "retweets": 28, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115398137485418557", "url": "https://x.com/s8mb/status/2115398137485418557", "text": "@GrandBastion I have always understood it to *require* market power in the broad sense of that term (where, eg, having a good location or brand gives market power), but I think it is output-increasing even in the case of 'bad' market power! https://t.co/o3UeF90I49", "created_at": "2026-10-28T10:59:52+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GrandBastion", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115395503429181467", "url": "https://x.com/s8mb/status/2115395503429181467", "text": "@gbrl_dick I was just happy for you at getting to experience what I did the first time I visited a big city too.", "created_at": "2026-10-28T10:49:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gbrl_dick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115384845052658071", "url": "https://x.com/s8mb/status/2115384845052658071", "text": "Good job here.", "created_at": "2026-10-28T10:07:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": {"author": "Brendan_McCord", "text": "I’m hiring a Chief of Staff to be my right hand across everything I do at Cosmos.\n\nThat starts with Cosmos Institute (@cosmos_inst), the nonprofit I founded after selling two AI companies, having two kids, and thinking hard about the good life and the good society. Through the Institute, we do research internally and with fellows from @GoogleDeepMind, @AnthropicAI, @OpenAI, @Microsoft, and academia, have given out 200+ grants to build fast prototypes, and we’re launching a big new in-person bet for higher education in 2027. This side of my work also includes @UniofOxford, where I co-teach a graduate seminar on philosophy and AI and support the Human-Centered AI Lab (HAI Lab), as well as a book I’m writing on human autonomy in the age of AI.\n\nOn the venture side, you’ll work with me across Cosmos Ventures (@cosmos_vc), our new $77.6M fund backing founders building new institutions for the AI age. Our early portfolio includes companies like AIUC (@aiunderwriting), @PrimeIntellect, and Workshop Labs (acq. by @thinkymachines), with several more to be announced soon. We’re also going to be incubating new companies in 2027.\n\nYou’ll come in, do this well for two years, and if you want to build a thesis-aligned company or a nonprofit next, we will back you, or place you at a top company in our community. The role is based in Austin, with relocation provided. \n\nTo apply, read our essays and tell us where we’re wrong: https://t.co/CMT9GbFZV6"}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115534601880031569", "url": "https://x.com/s8mb/status/2115534601880031569", "text": "@SaladBarFan @Nico43688773 @atlanticesque We have a good feature by @SCP_Hughes on this topic coming in December’s Works in Progress.", "created_at": "2026-10-28T20:02:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SaladBarFan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115525407965610132", "url": "https://x.com/s8mb/status/2115525407965610132", "text": "@alexolegimas @WorksInProgMag Thank you for subscribing. I hope we will be able to have you in the mag before too long!", "created_at": "2026-10-28T19:25:36+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "alexolegimas", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115504389339156759", "url": "https://x.com/s8mb/status/2115504389339156759", "text": "@NeilGarratt No, this is all companies that use Stripe (which is a very high percentage of them, so representative) but anonymised.", "created_at": "2026-10-28T18:02:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "NeilGarratt", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-28T20:16:40.588643+00:00"}, {"id": "2115857086953218369", "url": "https://x.com/s8mb/status/2115857086953218369", "text": "We’re delighted to announce that @danwwang is making his debut as a contributor, with a column for this issue of @WorksInProgress.\n\nhttps://t.co/xtxsCHMY29\n\nFew people understand the China–US contrast as well as Dan Wang, and fewer still write about it with so much talent. His book Breackneck has introduced the now famous meme of China as a “country of engineers” and United States as a “country of lawyers,” to explain the differences in building capacity and physical world stagnation we are seeing between the two polities. \n\nIn his new column for us, he takes up one specific thread in the long-running debate over how China and the US compare and argues that both owe part of their power to being polycentric. \n\nOne observation is that both the American and US capitals are not their biggest cities. Vienna, London, Seoul and Paris dwarf their countries’ second cities, by four to seven times. By contrast, Beijing isn’t China’s largest city, and DC isn’t even in the top five in the US. Does this make US and China lame, for having smol capitals? No! On the contrary, Dan thinks that this friction between political and economic centers is important and at least partially explains why both countries can combine dynamism with strong states.\n\nBut the two countries are polycentric in very different ways. China’s regions are culturally distinct and are shaped heavily by geography. While coastal provinces tend to look outward, mountain areas like Sichuan and Chongqing are characterized by evading the center’s edicts. Dan also points out some misconceptions: yes, China has central control, but it is weaker than it look. Local officials often ignore or quietly subvert senseless directives from Beijing, with enforcement thinning out quickly beyond the big cities.\n\nThe characteristic feature of American polycentrism is how well it sorts people into domains and “sends” them to specific cities: this is reminiscent of the point @patio11 has made around “The Sort.” In America, the smartest and most driven tend to cluster in a handful of cities, above all New York and San Francisco, with Washington and Boston are slightly behind them. More than this: each field has an obvious center: AI has its capital in SF, for policy and politics you have DC, for finance New York and for biotech Boston and more recently, SF. \n\nDifferent cities in America also prize different things: Miami values looking good, Boston being intelligent and bookish, LA how famous you are and New York how rich you are. There is so much variety in terms of who you can choose to become in America. And the city you decide to live in might end up shaping who you are, moreso than in any other country!", "created_at": "2026-10-29T17:23:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 6, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115814405707542608", "url": "https://x.com/s8mb/status/2115814405707542608", "text": "@DigitalDionysu1 Whoops!", "created_at": "2026-10-29T14:33:58+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "DigitalDionysu1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115807408249356614", "url": "https://x.com/s8mb/status/2115807408249356614", "text": "The UK has the deepest capital market in Europe and several of the world's top universities. Its governments make it ever more difficult to build anything. We at @LSEPublicPolicy and @LSELaw  are co-organizing an event with Works in Progress on how to get Britain to grow again.", "created_at": "2026-10-29T14:06:10+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "lugaricano", "rt_author_name": "Luis Garicano 🇪🇺🇺🇦", "likes": 65, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115798827290472824", "url": "https://x.com/s8mb/status/2115798827290472824", "text": "Join Works in Progress at Building Abundance: How Britain can flourish in the age of AI, a day of ideas for rebuilding Britain’s economy and state so it can adapt to and embrace artificial intelligence and other opportunities for growth.\n\nhttps://t.co/7YY5fhZUPK\n\nSessions include:\n\n- @Dominic2306 and Morgan McSweeney in conversation on the decline and fall of British state capacity,\n- @JohnFingleton1 on the Nuclear Taskforce and its implementation by the government, one year on from its pledge to implement it in full.\n- @bswud, @SCP_Hughes and me on why nearly every attempt to get Britain building has failed;\n- @rachelwolf on what the public really thinks about economic growth and AI;\n- @lugaricano on messy jobs and Britain’s labour market;\n- @jujulemons on why Britain needs gigawatt-scale compute, and how to get it built here;\n- @salonium on why fixing clinical trials is the best industrial policy Britain could have;\n- @MichaelDnes1 on building the first new tunnel under the Pennines since 1954;\n- @RobertBoswall on how to finance and power the data centre buildout; and\n- @daisychristo on why VAR matters for state capacity.\n\n​It will be held on Thursday 3rd December at the LSE, from 1pm to 7:30pm (doors open 1pm for a 1:20pm start). We're hosting it in association with the LSE Law School and School of Public Policy. Tickets are free. \n\nSee you there!\n\nhttps://t.co/7YY5fhZUPK", "created_at": "2026-10-29T13:32:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 236, "retweets": 37, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVzTrwWW8AAGBmb.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115752563073253778", "url": "https://x.com/s8mb/status/2115752563073253778", "text": "This is good from the Chair of Shelter: \n\n\"Every tenant is now incentivised to challenge any rent increase because they could get a significant rent reduction and not just a rent freeze.\"\n\nhttps://t.co/YAEWeNZwjc", "created_at": "2026-10-29T10:28:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 89, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115707029692064166", "url": "https://x.com/s8mb/status/2115707029692064166", "text": "It is a joy to see people making beautiful things. https://t.co/RsYjRcMROr", "created_at": "2026-10-29T07:27:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 220, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVvXFS6W4AAngA-.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115699366094672168", "url": "https://x.com/s8mb/status/2115699366094672168", "text": "We have the tools to end mosquito-borne illness. Why don't we use them?\n\nMy latest for @WSJFreeEx \n https://t.co/wpXNOGTc93", "created_at": "2026-10-29T06:56:51+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "emmma_camp_", "rt_author_name": "Emma Camp", "likes": 2114, "retweets": 171, "media": [{"type": "video", "url": "https://pbs.twimg.com/ext_tw_video_thumb/2115500110096355328/pu/img/dnwlqeabPDl9skNz.jpg"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115575206190424280", "url": "https://x.com/s8mb/status/2115575206190424280", "text": "@JordiMonPMM Honestly I might just get an accountant to do it.", "created_at": "2026-10-28T22:43:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JordiMonPMM", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115574240074465559", "url": "https://x.com/s8mb/status/2115574240074465559", "text": "This is good, factoring in system costs of new renewables before buying them. It should also mean using \"firm power\" costs, ie the cost of reliable electricity under any weather conditions – which, for wind and solar, has to include the cost of the backup fossil fuel generation.", "created_at": "2026-10-28T22:39:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 3, "media": [], "quoted": {"author": "dantomlinsonmp", "text": "This Budget is the start of a new energy pathway that the 10 Year Plan will build on. The priority is to bring energy costs down to help British business to compete, and British households to cope. And cheaper electricity will boost electrification, increasing our energy security and helping to decarbonise the whole economy.\n\nWhat does this mean? First, it means a focus on levies and policy costs on bills. The Conservatives added £100 to everyone's bill via levies in their last decade in power. Labour has cut £150 from bill costs already. But today, John Healey has drawn a line in the sand, with the announcement that we will add no new costs to energy bills, with a comprehensive cost control framework to follow at the spending review. The Chancellor is also junking plans, first set out by the Tories, to add on up to around £10 a year on bills to pay for hydrogen projects.\n\nSecond, it means taking account of the interaction between the pace of grid build-out and the pace at which renewables are added to the grid. The NAO have said that investment in expanding the transmission network declined in real terms between 2016 and 2020, just when it was clear that more intermittent power meant we would need more capacity. It is now forecast to rise to over £10bn a year. But with growing constraint and distribution costs, it's right that the system costs of all new power are considered. That is why we will only procure clean power through AR8 (the next auction round) if we are confident it will lower bills. And we will reform the contract for difference by AR9 to support building the lowest cost system, fixing market distortions and siting assets in the right place.\nThe evidence is clear, clean power is an essential part of the route to cheap power, and the overall approach of seeking to get ourselves off the gas-price rollercoaster to the right one. Gas is setting the electricity price less and less every year. If it wasn't for adding renewables to the grid in recent years then the current Iran price shock would have been worse for families and businesses. The Conservatives and Reform's ideological anti-renewables approach is the wrong one and fails in the face of evidence on how to protect bill payers from shocks and the need to make ourselves less reliant on foreign dictators. We'll take a pragmatic approach to get bills down.\n\nGetting electricity prices down, ensuring new clean power does not run ahead of the grid, is also the credible route to reaching our net zero goals. The decarbonisation that we want to enable in our homes, on our roads and in our businesses, is six times larger than that still to be achieved from getting to a clean grid. Unless we make electricity cheaper relative to other energy sources, we will struggle to increase adoption of EV and heat pumps."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115567554030653510", "url": "https://x.com/s8mb/status/2115567554030653510", "text": "@JordiMonPMM Yes, I just prepared my tax return this weekend with Claude, in fact. Although, distressingly, Claude thinks I owe more than ChatGPT did.", "created_at": "2026-10-28T22:13:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JordiMonPMM", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115930381493075986", "url": "https://x.com/s8mb/status/2115930381493075986", "text": "#RIP Patrick Stewart of Star Trek and X Men ...\n\nOn 12-4-1997, after getting a @PressClubDC coffee mug, he was asked, \"Just from a purely logical point of view, why is it that a Captain whose name is Jean-Luc Picard have a perfect English accent?\"\n\nPatrick Stewart answer here: https://t.co/0lYtwn4Hx8", "created_at": "2026-10-29T22:14:49+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "HowardMortman", "rt_author_name": "Howard Mortman", "likes": 5193, "retweets": 732, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115898114351448064/img/h2MHPH_aPIF0lh-h.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115915623498744191", "url": "https://x.com/s8mb/status/2115915623498744191", "text": "@SaladBarFan @AlanMCole Yes, this is a work of art.", "created_at": "2026-10-29T21:16:11+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SaladBarFan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2113764536704541028", "url": "https://x.com/random_walker/status/2113764536704541028", "text": "We are really excited to build independent evaluations of RSI progress and are actively hiring.\n\nWe constantly see conflicting evidence about RSI progress. Most hinges on information coming from labs. To illustrate this, let's just look at evidence discussed *this week* that conflicts in whether it suggests RSI progress is fast or slow.\nhttps://t.co/F4vi5Z3fch\nResults from OpenAI and Google evals indicate the time horizons for R&D tasks being automated are around ~15 minutes, which are much slower than METR time horizons for software tasks. This suggests we should have *slower* RSI timelines.\n\nhttps://t.co/RfFobR22bw\nResults from Mirendil indicate that pretraining at a certain scale can be heavily automated such that it can be managed by a single pretraining researcher. This suggests we should have *faster* RSI timelines.\n\nhttps://t.co/lIYID0eFII\nResults from Nvidia indicate that frontier models provide significant uplift for CUDA optimization. This suggests we should have *faster* RSI timelines.\n\nEach piece of evidence is more complex than what I write here. Interpreting them all together is confusing even if you trusted them all fully. And factoring in the underlying level of credibility is basically impossible: each result is basically just some plots and numbers selectively disclosed by labs in a tweet/talk/report. So deep sense-making about RSI progress is very hard.\n\nIf you are interested in building independent RSI evals, apply here:\nhttps://t.co/w6CfTsvJfI", "created_at": "2026-10-23T22:48:32+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RishiBommasani", "rt_author_name": "rishi", "likes": 40, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114332947889435039", "url": "https://x.com/random_walker/status/2114332947889435039", "text": "The world has incredible detail, friction, and complexity. People good at understanding machine learning and predicting benchmark performance of AI models don't necessarily have a good understanding of these factors and instead often couple impressive forecasts of AI capabilities with low-resolution folk models of society.\n\nThe result is many silly forecasts of AI's allegedly explosive societal impacts when it comes to economics, the information environment, etc, among AI experts and insiders. Good thread 👇", "created_at": "2026-10-25T12:27:11+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "likes": 75, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114332755106701543", "url": "https://x.com/random_walker/status/2114332755106701543", "text": "Bottlenecks are very hard to predict ex-ante. Eg, here is McKinsey 2019 (they weren't the only ones!): 25-40% displacement from automation by 2030, without even seeing LLM-based AI coming! Suffice to say, this isn't going to happen. 7/8 https://t.co/JYqbjVpE1B", "created_at": "2026-10-25T12:26:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Afinetheorem", "rt_author_name": "Kevin A. Bryan", "likes": 84, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVbY3VjXwAAAYiM.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2115769249117475312", "url": "https://x.com/random_walker/status/2115769249117475312", "text": "What would the writing of superintelligent AI sound like? You might expect it to have the characteristics of good human writing — figurative language, high information density, coining new terms, and punchiness — but dialed up to 11. Well, that’s what Claude did, until Anthropic dialed it back recently because of user complaints. It didn’t sound superintelligent to most of us. Instead, the neuralese writing style sounds like a “stupid person’s idea of a smart person”.\n\nOur response to information density and metaphor-laden writing looks something like the cartoon graph I've drawn. Beyond a point, it completely backfires. The reason human writers don’t overdo it isn’t because they aren’t capable, but because they are aware of the reader’s cognitive burden. One of the hardest skills to learn as a writer is to simulate the reader’s experience.\n\nIt’s easy to train AI to mimic mediocre human writing. But optimizing it to be (perceived as) good is really hard, and made much harder by the fact that when everyone uses the same few AI models we get tired of their tics very quickly. Most Claudeisms are individually pretty good. I hate that I can’t use “load bearing” in my writing any more. If it weren’t for AI overuse it would be a neat metaphor.\n\nA broader question is whether most tasks in the economy are like chess, where there is a clear performance metric that can be optimized, or whether they’re like writing, where quality is a multidimensional balancing act without clear training signals beyond human mimicry.", "created_at": "2026-10-29T11:34:32+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 183, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVy4AfNWIAA2y49.png"}], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116165441110323349", "url": "https://x.com/random_walker/status/2116165441110323349", "text": "Resharing our paper on the science of AI agent evaluation because the PHP vulnerability happened right as we announced the paper last week and our server was taken down all day to upgrade PHP 🫠 \n\nPDF: https://t.co/8m13p9d70F\nWebpage: https://t.co/xGAvBCGW4a\nBlog: https://t.co/qxO21qWZfm\n\nThere are growing calls for independent and embedded AI evaluation, especially of AI agents. But much remains unclear: what constitutes a “good” evaluation, what needs to be evaluated in the first place, and how best to coordinate and support the influx of people entering the burgeoning evaluation ecosystem.\n\nOur group at Princeton has been working to improve the state of AI agent evaluation for about three years. We teamed up with people who’ve done foundational work on evaluation at Stanford, the UK AI Security Institute, and Brookings. Our paper is titled Emerging Trends in AI Agent Evaluation. We synthesized the trends we see across three dimensions—the science and methods, the research agenda, and the evaluation ecosystem—with the goal to help those who are upskilling for this new paradigm. We also aim to equip evaluators, funders, and the public with a set of questions to ask, and provide actionable recommendations.\n\nBy @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, @sayashk, and me.", "created_at": "2026-10-30T13:48:52+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4gNKRW0AIfqKE.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116163258646515739", "url": "https://x.com/random_walker/status/2116163258646515739", "text": "In 2023, @sayashk and @random_walker published a study on data leakage in machine-learning research. They found that leakage had been reported across 17 scientific fields, affecting 294 papers.\n\nThe problem of detecting data leakage has only become harder because of the sheer number of papers published every day.\n\nThat’s why it’s important to examine how a paper’s results were produced or, at the very least, try to reproduce one of its main claims. However, it's easier said than done\n\n@askalphaxiv  has made the first step easier now.", "created_at": "2026-10-30T13:40:11+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pandeyparul", "rt_author_name": "Parul Pandey", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4dKSAa0AAo0sY.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116132374069366827", "url": "https://x.com/random_walker/status/2116132374069366827", "text": "When I worked in nuclear, I gave talks on bugs I found with a slide titled \"How are we all not dead yet?\" where I gave an example of a device that has been running on the field for decades with no issues, but had 6,000 data races (that weren't false pos) to explain resilience 1/2", "created_at": "2026-10-30T11:37:28+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "HeidyKhlaaf", "rt_author_name": "Dr Heidy Khlaaf (هايدي خلاف)", "likes": 1631, "retweets": 84, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2113992244269113727", "url": "https://x.com/sethlazar/status/2113992244269113727", "text": "I absolutely love this. Back in 2008 @zittrain wrote about the future of the internet and how to stop it, arguing that the appliancification of hardware fundamentally limited individual freedom and exposed us to all kinds of extractive corporate practices. This was enshittification before enshittification, completely antithetical to the liberating hacker spirit that birthed personal computing. Seeing people take back control over their hardware makes me very happy. There should be a millennium prize for the first person who does this to a printer.", "created_at": "2026-10-24T13:53:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "stake_jevens", "text": "Removed all of the samsung spyware from my TV with Codex (Claude refused to root the tv lol)\n\nIt's insane how much bloat samsung packs into their TVs to track you and sell your data. Here's just some of what I turned off that made my tv 3x faster:\n\n- screenshot your screen a few times a second to see what you're streaming and fingerprint you to sell your data\n- reading your hdmi inputs to do the same thing while you have a game console plugged in\n- Voice assistants: Bixby wake-word detectors listening and tracking what you say in your house\n\nBefore and after speed of my TV:"}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113866848638804454", "url": "https://x.com/sethlazar/status/2113866848638804454", "text": "Everyone pls tell @_sholtodouglas (another 🇦🇺 in AI) how to make CC as good an app as codex so that we can get Ant models with Codex UI. My main thing is just how I can run all my codex systems locally, each on their own computer, but control them from my phone or from each computer. I can also have one computer that I can control from others but that can't control them (which is where my lab agents live). All of that is seamless; whenever I try to use CC in a similar way, I am constantly re-logging in, changing settings, finding chats disappearing etc. Pls just study codex remote control and implement the same thing. Agree with Will here on queue but that's an order of magnitude less important", "created_at": "2026-10-24T05:35:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": {"author": "_sholtodouglas", "text": "@willdepue @jherrm Can you describe the most important things we should do to fix this (I’ll go boot up codex and compare I’m just interested in your take)"}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113830058532221371", "url": "https://x.com/sethlazar/status/2113830058532221371", "text": "i’m spending the weekend reading about the science and theory of consciousness. plz reply with recommendations! dms open also", "created_at": "2026-10-24T03:08:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "willdepue", "rt_author_name": "will depue", "likes": 400, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113826942302511188", "url": "https://x.com/sethlazar/status/2113826942302511188", "text": "@joshalbrecht *preordained better than foretold", "created_at": "2026-10-24T02:56:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113826827311464567", "url": "https://x.com/sethlazar/status/2113826827311464567", "text": "@joshalbrecht I think you keep moving the epistemic goalposts! My point is not \"everything will be fine\". My point is \"nothing is foretold\". And on 1 and 2, it's false that only a few elites need to have this view: competition among elites is itself a big reason why mass oppression isn't already routine. \n\nIt's maybe worth observing that there are already massive, spectacular disparities of wealth between people. And yet we still get billionaires voting for democrats (as well as people with nothing voting for republicans). People don't just act, politically, on their narrow self-interest. \n\nAgents and companies making decisions: yes one would expect them to act in a more narrowly self-interested way, I have more optimism for agents perhaps than for companies. But companies too are just people in an institutional structure. So I don't know that this adds much to the argument. \n\nYes people have always sought to control the media in order to achieve their political objectives. It tends not to work out as they intend!", "created_at": "2026-10-24T02:56:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113792882230333575", "url": "https://x.com/sethlazar/status/2113792882230333575", "text": "👀 Thariq Shihipar (@trq212) has left Anthropic.", "created_at": "2026-10-24T00:41:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArfurGrok", "rt_author_name": "Arfur Grok", "likes": 1697, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113737958394138941", "url": "https://x.com/sethlazar/status/2113737958394138941", "text": "@joshalbrecht https://t.co/87WMzq4hhw \n\nI think one can also make good first-principles-based arguments against this picture. What Rob is basically arguing is that a fundamental principle of human nature—that people desire the society of equals—will be invalidated by powerful AI. This is man as \"zoon politikon\", per Aristotle. I think the challenge for folks with his pessimistic view is to explain why people would, in the space of a few decades, go from being broadly committed to liberal egalitarianism to viewing the vast bulk of humanity as hoplites. And I think there's also a first-principles based argument for the ability of the masses to impose costs on elites when elites do not give them a good enough deal, partly because the more elite they get, the more sensitive they become to comparatively minor costs.", "created_at": "2026-10-23T21:02:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "@robertwiblin We don't quite agree yet—my point is that even when the military is fully mechanised, the amount required to forestall revolution will not be nothing, it will be *willingness to engage in massive, brutal, and pervasive oppression*. We have definitely seen examples of this in the past—colonialism, again—but I think the likelihood of a transition in the next few decades from liberal democracy to internal colonialism is pretty small, and definitely bears the burden of proof, rather than being a default outcome. \n\nI also think that even if/when the military is fully mechanised, that will not mean resistance is futile, because I think as asymmetries of force increase, you also find asymmetries in tolerance for cost. \n\nThe argument might then be that elites will sequester themselves away from the rest of humanity so that they are simply untouchable; but then history suggests that there will be divisions among elites, including that some will both want and find it convenient to mobilise and act with the masses. \n\nThe vision you're describing requires an unprecedented level of agreement among elites, as well as appetite for inequality and hostility to human freedom. It also underestimates the weapons of the weak. We've had plenty of conflicts in which one side has had an overwhelming technological advantage over the other. But there are always vulnerabilities..."}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114027016160792906", "url": "https://x.com/sethlazar/status/2114027016160792906", "text": "Meanwhile trying to set up MW4 which cost $150 to do the one thing I want to do on it (split screen local multiplayer) and, per usual with these monstrous people, it’s proving totally intractable… I want to just put Claude in the Xbox and have it fix all this terrible terrible software…", "created_at": "2026-10-24T16:11:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "I absolutely love this. Back in 2008 @zittrain wrote about the future of the internet and how to stop it, arguing that the appliancification of hardware fundamentally limited individual freedom and exposed us to all kinds of extractive corporate practices. This was enshittification before enshittification, completely antithetical to the liberating hacker spirit that birthed personal computing. Seeing people take back control over their hardware makes me very happy. There should be a millennium prize for the first person who does this to a printer."}, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114014291330474152", "url": "https://x.com/sethlazar/status/2114014291330474152", "text": "@zdch Hmmmmmmmm", "created_at": "2026-10-24T15:20:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "zdch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114769384464097363", "url": "https://x.com/sethlazar/status/2114769384464097363", "text": "Excited for our partnership with @cosmos_inst !", "created_at": "2026-10-26T17:21:26+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "cosmos_inst", "text": "AI raises fundamental questions about intelligence, reasoning, and selfhood. Philosophy has a vital role to play.\n\nWe're supporting a new annual volume, Oxford Studies in Philosophy of AI and Computing, along with a $10,000 prize for its best paper.\n\nhttps://t.co/9Hv8L76CON https://t.co/DrMw1au85e"}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114746825307726323", "url": "https://x.com/sethlazar/status/2114746825307726323", "text": "Submit to the new Oxford Studies in Philosophy of AI and Computing! Deadline is Feb 14, 2027.", "created_at": "2026-10-26T15:51:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "digitalspeechX", "rt_author_name": "Digital Speech Lab", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114733994319225216", "url": "https://x.com/sethlazar/status/2114733994319225216", "text": "Announcing the Call for Papers for Oxford Studies in Philosophy of AI and Computing! \n\nRapid AI progress is raising *so many* philosophical questions; but philosophers aren't as involved in the conversation as they should be, for many different reasons. \n\nOne is that, aside from some work in logic and philosophy of mind, philosophy of AI and computing has often sat on the margins of the discipline. One reason for *that* is that so many philosophers working on AI have had to do so basically on their own, figuring things out for themselves as they go along, without a real community around them. \n\nOSPAIC is going to help fix this! We're going to have an annual conference and volume. The conference (in DC! where much of the future of AI will be decided) is especially important as we think about the nature of intellectual life in a world where AI systems can one-shot a superficially-plausible philosophy paper. OSPAIC sees philosophical progress as being about more than just the accumulation of true claims. The conference is a big part of our vision for how we contribute to philosophical progress. \n\nAnd our aim is also to help philosophers be part of the broader public conversation! To that end we're also going to be launching, soon, a subcode on arXiv for philosophical foundations of AI (cs.pfai), and encouraging everyone who submits to OSPAIC to also upload their draft to arXiv (at present, use keyword PFAI).\n\nWe're also partnering with @cosmos_inst, who will be sponsoring an annual prize for the best paper on philosophy and AI, as well as helping fund the first round of the conference and Open Access publication for the volume. And with Cosmos we'll be highlighting some of the most interesting submissions to cs.pfai as they come in. \n\nI'm the executive editor; Jeff Howard (UCL) and Rachael Sterken (University of Hong Kong) are associate editors; Ned Howells-Whitaker (JHU and Pittsburgh) is the assistant editor. We're grateful for the support of a wonderful advisory editorial board, including brilliant philosophers and computer scientists from academia, industry, and civil society.\n\nThe deadline for submissions is 11.59pm Feb 14, 2027, anywhere on earth. All details are at https://t.co/qhFNqZd2OE.", "created_at": "2026-10-26T15:00:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114523430619922482", "url": "https://x.com/sethlazar/status/2114523430619922482", "text": "@JeffLadish See: https://t.co/ymWfmbaJsZ", "created_at": "2026-10-26T01:04:06+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "JeffLadish", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2115064998590353420", "url": "https://x.com/sethlazar/status/2115064998590353420", "text": "@chefbrent I think 100% the best option is to shoot well first time, it’s so easy to think “I’ll fix it in post” and leave yourself a million jobs to do. But for my output—which is an ambient slideshow where clips are being selected by ai against some themes etc—i don’t need to have the “decisive moment” isolated. I went through 150 clips last night in about 30 minutes of actual work! What would have been several hours had I done it all myself. Which has the added bonus that I am not sick of the footage by the time I can display it.", "created_at": "2026-10-27T12:56:06+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "chefbrent", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115064290860495053", "url": "https://x.com/sethlazar/status/2115064290860495053", "text": "Important developments in the philosophy of #AI.\nToday @sethlazar announces the launch of OSPAIC https://t.co/4jRAQoqyXX with a conference on Valentine's Day in 2027. And next week, the \"Philosophy of Technology and AI\" conference at @UniBonn.  https://t.co/Yxqon63rN2 https://t.co/eFVYNqDT1P", "created_at": "2026-10-27T12:53:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "David_Gunkel", "rt_author_name": "David J. Gunkel", "likes": 42, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVoqAhbWMAAPZCw.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114924705907966101", "url": "https://x.com/sethlazar/status/2114924705907966101", "text": "Coming back to this with @chefbrent I have got a workflow going with DaVinci Resolve Studio editing hundreds of drone videos, using Astra heavily. It is working amazingly well, basically it allows me to script massive sequences of steps (\"trim 5s from the start of each clip\"; \"load 900 clips into the timeline...\"). It is also applying a basic grading recipe, and then analysing waveforms to ensure that we're not clipping highlights. I'm now going through reviewing, and I am making a small tweak here and there, but really not much, so it's taking the very tedious process of turning hundreds of DLOGM videos into HDR that we can easily watch and share and making it vastly more manageable. This is a huge unlock as those videos have been sitting on my drive for months as I've just not been able to bring myself to even start working on them, knowing how long it would take. \n\nI remember a similar moment with editing photos, back in 2017! I would still love to be able to trust Astra to find and trim the shitty bits where I jink or jank instead of flying smooth, but I think the token cost of analysing all those frames would be bananas. I could try running a local model for it but suspect it would take ages. So that much I can do—but I can do it at 4x speed. \n\nGrading is a huge PITA; but shooting in DLOGM on the mavic really does gain you an extra few stops of dynamic range, so it's worth suffering through it. This makes it much less of a chore (and while all the math results etc are objectively more important, this is the kind of AGI I really like)", "created_at": "2026-10-27T03:38:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "@chefbrent Thanks Brent! I will try and let you know if so, but perhaps you can help point me in the right direction? I use resolve for trimming and grading drone footage. Usually I am aiming for the best 30s block from any given recording; sometimes it’s longer. Fairly often there is a janky bit of flying somewhere along that marks an obvious cut point. What I basically want to do is maximise the efficiency of extracting these smooth 30s or so clips from the raw footage. Then on top of that I have a grading/editing process, and I’d like to have one of a set of standard recipes applied to each cluster of clips, so that it’s 90% of the way there and I just tweak for taste. How much of that do you think codex could realistically help with? I have terabytes of videos collected in a year of farewell tours of Australia, and they  are doing the digital equivalent of gathering dust while I try to find time to edit them…"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114888843715649765", "url": "https://x.com/sethlazar/status/2114888843715649765", "text": "I’m building a team in DC. Everyone in Washington has a stake in ensuring that reliable info about alignment and RSI reaches the public.\n\nWe need trustworthy communicators who can explain METR's loss-of-control risk assessments and goals to policymakers. https://t.co/jSSSklxsdD", "created_at": "2026-10-27T01:16:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ChrisPainterYup", "rt_author_name": "Chris Painter", "likes": 371, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVmKWwVawAAi18a.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114856409959457014", "url": "https://x.com/sethlazar/status/2114856409959457014", "text": "@AdriPeralM @cosmos_inst If it’s philosophy, about ai, and meets the epistemic standards of the analytic tradition (understood inclusively) then it’s a fit", "created_at": "2026-10-26T23:07:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AdriPeralM", "is_retweet": false, "rt_author": "", "rt_author_name":
