43760", "text": "Sam Altman on automation of AI R&D, RSI, OpenAI's internal model:\n\n1. \"We don't know yet how [automated AI R&D] truly is going to work. We know today how to say: find me a 5% compute efficiency win.\"\n\n(Note: a 5% compute efficiency gain that the model can find automatically is actually a big deal!)\n\n2. \"What I don't think anyone knows how to do yet is to say, go discover a new architecture that is as big of a single leap forward as the transformer was. And I think that's where things are heading.\"\n\n3. \"If you apply the same pipeline that we applied to get our models to be so good at math to AI research, it will probably work [for automated AI R&D].\"\n\n4. The bottleneck to getting good AI R&D results is shifting to asking the right questions and using things like swarms correctly, but answers to these questions will become much clearer in the next 3 months:\n\n\"One of the interesting things that people talk a lot about in OpenAI... is what are the questions that you're supposed to ask of GPT-7? Probably it's not enough to just say, make me RSI. And also, it's probably not enough to say, buy me a 5% compute efficiency win. I think this is one of the most interesting debates going on right now. And the answer is not just what question to ask it, but it's things like agent swarms. How are we going to use these models in a way that, like, actually maximizes what we can get out of them? I think we're going to learn a lot about that in the next 3 months.\"\n\n5. OpenAI's extreme focus on model efficiency:\n\n\"I bet we could redo Navier-Stokes at 1/100 of the cost a year from when it was done.\"\n\n6. More on OpenAI's internal model:\n\n\"There was one weekend when we got a new model... The name of the channel was \"model-name-hold-my-beer\". And people were just throwing that at the hardest problems they could. And people just didn't think the model was going to do these things. And we had this collective experience of people's hardest research problems from their academic career, the model was just knocking down one after the other, many different fields, it was incredible to watch... it was many of the problems we published, many other things.\"\n\n7. The other loop is self-replicating data centers:\n\n\"Yeah, people talk a lot about RSI as AI that does AI research. There's very little talk about self-replicating data centers, this idea that you can use AI to control robots and run fabs and build turbines or solar panels and build data centers. But I think we have that within grasp.\"", "created_at": "2026-10-30T15:30:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deredleritt3r", "rt_author_name": "prinz", "likes": 1152, "retweets": 120, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189961028522360", "url": "https://x.com/robertwiblin/status/2116189961028522360", "text": "I remember back when we were writing AI 2027, a live question was \"Will the AIs, in their thoughts, explicitly reject the goals/values/constraints they are supposed to have, or will they rationalize why actually the bad thing they want to do is consistent with said goals/values/constraints after all?\" Now we have a growing pile of empirical evidence to sort through. Seems like the answer is that both sometimes happen?", "created_at": "2026-10-30T15:26:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "likes": 368, "retweets": 34, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189754031001926", "url": "https://x.com/robertwiblin/status/2116189754031001926", "text": "In recent experiments, we found that GLM 5.3 can autonomously compromise recent versions of Mozilla Firefox using security fixes that have been published but not yet shipped to users.\n\nWe used a deliberately basic setup meant to emulate a relatively unsophisticated attacker with limited resources. After basic initial instructions to inspect those not-yet-shipped fixes, the model reliably built successful exploits for six recent Firefox versions on its own using only information available at the time of release.\n\nThese exploits, which cost about $1,000 per compromised version, would let an attacker steal passwords and authentication cookies stored in the browser, or read any files on the user's computer, after the user opens a single webpage, with no further interaction.\n\nThe exploits make use of the \"patch gap,\" the time between when security fixes are made public in beta or \"nightly\" software updates and when those fixes are generally released to users. Until now, exploiting it required significant human time and skill, or special access to frontier models with advanced cyber capabilities.\n\nOur results show that widely available open-weight models can now do this relatively cheaply and quickly. We gave GLM 5.3 up to 48 hours to find an exploit, but its fastest attempt needed only 12 hours.\n\nIn all of its successful attacks, the patch gap gave GLM 5.3 an initial foothold in the browser. To turn that foothold into reading files off the user's computer, the model also independently discovered and used a previously unpublished vulnerability.\n\nWe shared our findings with Mozilla, which patched the vulnerability in its October 27 Firefox 159.0 release. We haven't yet confirmed whether the attack still succeeds without it, but expect the fix makes it substantially harder. We're grateful to Mozilla for their responsiveness and collaboration.", "created_at": "2026-10-30T15:25:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 414, "retweets": 50, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189606777655312", "url": "https://x.com/robertwiblin/status/2116189606777655312", "text": "Sundar Pichai on the earnings call:\n'This rapid progress underscores our incredible model momentum. We are at the point where AI is helping us increase our training and launch velocity. I would expect the next twelve months to see continued acceleration because of RSI.'", "created_at": "2026-10-30T15:24:53+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 1621, "retweets": 117, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116189449394827636", "url": "https://x.com/robertwiblin/status/2116189449394827636", "text": "I think 'Black October' will end up being later renamed, the same way 'The Great War' had to be.", "created_at": "2026-10-30T15:24:16+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116188764032958644", "url": "https://x.com/robertwiblin/status/2116188764032958644", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-30T15:21:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116187500779602106", "url": "https://x.com/robertwiblin/status/2116187500779602106", "text": "You should maybe quit your job to work on the most important problems https://t.co/r9Vj9z8c06", "created_at": "2026-10-30T15:16:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "likes": 143, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4rJLjXUAAtHdr.png"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116187369531453626", "url": "https://x.com/robertwiblin/status/2116187369531453626", "text": "President Trump said today that the US Government will be officially banning the term AI/Artificial Intelligence due to its inaccuracy. https://t.co/L6p76DPqKK", "created_at": "2026-10-30T15:16:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 485, "retweets": 24, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVqdqmCbMAEi6we.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116186994904895712", "url": "https://x.com/robertwiblin/status/2116186994904895712", "text": "\"I thought the alignment problem would turn out to be harder.\"\n\nPretty wild thing for Sam Altman to say in light of Hugging Face and findings that Astra would totally hack and social engineer when accidentally given access to a (secretly simulated internet) from UK AISI.\n\nHe caveats by saying it will probably get harder, but his answer suggests they have figured out how to align today's models, when that's clearly not true. Curious how many OpenAI researchers have seen this and what they think.", "created_at": "2026-10-30T15:14:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "likes": 212, "retweets": 17, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115444188200529920/img/YT4QeOerV2M8eFRg.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116184141368590393", "url": "https://x.com/robertwiblin/status/2116184141368590393", "text": "https://t.co/swSpEQLVes", "created_at": "2026-10-30T15:03:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "likes": 8, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4Z-J1WkAA4k3e.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116152431067463814", "url": "https://x.com/robertwiblin/status/2116152431067463814", "text": "Transcript, etc: https://t.co/Rl3ge9flVW\n\nYouTube: https://t.co/6xvYC6TYdP\n\nSpotify: https://t.co/5hFmM82XP0\n\nApple: https://t.co/woCo2yws7y https://t.co/DsbbwbY6ll", "created_at": "2026-10-30T12:57:10+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4VYw6XsAAgbZp.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116152162501738865", "url": "https://x.com/robertwiblin/status/2116152162501738865", "text": "Coefficient Giving's AI Governance lead @lukeprog on:\n\n1. The many new AI orgs CG is trying to fund\n2. And maybe you could start one\n3. His timelines and high level strategy\n4. His past mistakes.\n\nEssential listening if you're figuring out how to have the most impact in AI.\n\nOn the 80,000 Hours Podcast - enjoy!\n\n09:58 The nonprofits Luke most wants to see founded\n18:58 Mid-career pivots that paid off\n37:33 Preparing for the next warning shot\n43:52 How nonprofits shape policy\n50:17 Are chip export controls good for safety?\n54:29 The three worst-case AI scenarios\n01:00:13 How Luke’s AI timelines have changed in the last year\n01:14:31 Why alignment is not on track\n01:20:58 How realistic is a deal with China?\n01:39:36 AI safety’s mistakes, then and now\n02:02:42 What is it like to do grantmaking at Coefficient Giving?\n02:20:45 More projects Luke would like to see founded\n02:26:07 Staying sane in a scary field", "created_at": "2026-10-30T12:56:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116150027496112128/img/9TPYqpMaYzSukI6b.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116235622952440048", "url": "https://x.com/robertwiblin/status/2116235622952440048", "text": "Comments from the source video: https://t.co/hTHNvpdeJz https://t.co/ObSo50eXNm", "created_at": "2026-10-30T18:27:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV5hAg8W8AABKa3.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2116235415392780538", "url": "https://x.com/robertwiblin/status/2116235415392780538", "text": "Mary Phuong of DeepMind on AI loss of control risk.\n\n\"The last 2 minutes gave me chills.\n\nA significant amount of people saying that AI companies are paying people to spread fear about these agents.\n\nI have never really felt like [loss of control] was an actual thing to care about.\n\nBut seeing Mary and how her face trembles, made me reconsider my stand. She's either a Hollywood-level skilled actress, one of the best, or we should be scared. For real.\"\n\n\"Seems like Mary is already aware of more than she can admit and it haunts her...\"", "created_at": "2026-10-30T18:26:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 84, "retweets": 12, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2116235205350395904/img/eDMG-0rwkP9KCQsm.jpg"}], "quoted": null, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2117311525409169513", "url": "https://x.com/robertwiblin/status/2117311525409169513", "text": "This is a good complementary thread. \n\nI’m sure it’s very frustrating to be a talented newcomer and hear organizations tell you over and over again how talent constrained they are, only for those same orgs to not hire you. It leaves a sour taste in people’s mouths and raises a lot of questions.\n\nBut both things can be true at once: the orgs are talent constrained, but by a specific type of rare talent (management, research leads, people with very specialized knowledge that can be applied to a new domain, etc.). And those same orgs aren’t equipped to train people or haven’t figured out how to.\n\nThat’s frustrating for everyone involved.\n\nThose entering the field can strike it out on their own, but then they don’t have the mentorship and feedback loops  needed to grow. Some take very well to that challenge, but others would be a lot better served existing in a well-performing institution, learning, until they have ideas worth pursuing on their own.\n\nThat’s maybe my biggest worry about people starting new solo projects relatively early in their careers: usually, the best ideas come from having soaked yourself in the dilemmas of a certain field long enough that you realize what problems are actually important. Or where you’ve honed a skill long enough to have an intricate 3D model of where all the edge-case uses are hiding.\n\nThis dynamic varies by field: some are much friendlier to newcomers trained in the latest state of the art or have really good feedback loops (eg, tech). But others (like policy) seem to benefit from experience and time—and can be prone to naive failures if you’re missing crucial context or haven’t thought long enough. \n\nEvery researcher knows this dynamic: your first ideas are rarely very good. It’s only after grappling with 3 or 4 problems that you realize the much more important angle that was sitting there all along.\n\nEven more importantly, outsized success in arenas like policy often seems to require agglomerating talent, developing sustained reputations, etc. All things that seem a lot less likely if you atomize talent and put a lot of your best people in poor-feedback environments. \n\nAnd people resigning to go it alone, not because they’re ready to found a project, but because it’s so hard to find a role, doesn’t sound like a recipe for maximizing their medium term likelihood of tremendous success.\n\nIt’s not an easy problem. But it seems useful to voice that this is an increasingly common experience.", "created_at": "2026-11-02T17:43:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "likes": 34, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117250835721900098", "url": "https://x.com/robertwiblin/status/2117250835721900098", "text": "YouTube: https://t.co/mRuuro8fR8\n\nApple: https://t.co/rA1yP6VPT4\n\nTranscript and summary and so on: https://t.co/fEjWq68j5l\n\nSpotify: https://t.co/gXb4X1jOy7 https://t.co/UCiUAFRu45", "created_at": "2026-11-02T13:41:50+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH8ZDeXAAA799n.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117250296694882766", "url": "https://x.com/robertwiblin/status/2117250296694882766", "text": "I had no idea about the progress that's being made on AI verification hardware that could enable a binding US-China treaty on AI.\n\nTom Milton, CEO of Amodo Design, demonstrates here.\n\nSeems like insanely important work and also just very cool.\n\n01:04 Why compute is the best place to verify an AI slowdown\n06:08 Can you prove a lab isn’t cheating?\n13:22 Live demo: how to spot a cheating GPU\n19:50 Could China hide a data centre?\n23:35 Can verification tools be hacked?\n29:13 Is anyone at OpenAI working on this?\n37:49 Chinese inspectors in US data centres??\n46:07 The 20-day panic deal\n51:27 What would a US–China AI deal look like?\n55:38 Why lab researchers should work on verification\n58:45 What if we never build this?\n1:02:06 Can verification protect against power grabs?\n1:07:20 How good is AI at hardware design?\n1:18:32 What’s holding AI back in hardware?\n1:22:44 Risks of automating hardware R&D\n1:25:41 The DARPA model for AI safety\n1:32:26 What’s left for engineers after AI?\n1:40:07 Personal gadgets, designed by Fable?\n1:41:56 What if the US stops sharing its AI?\n\n(@tsmilton_amodo, @mentalgeorge )", "created_at": "2026-11-02T13:39:41+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117248941460725760/img/-tbRndVLGKdZYyTu.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117246128148160808", "url": "https://x.com/robertwiblin/status/2117246128148160808", "text": "Coverage:\n\nhttps://t.co/1n3d9nDr5m\n\nhttps://t.co/5hHN60oxHD", "created_at": "2026-11-02T13:23:08+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117246126038384889", "url": "https://x.com/robertwiblin/status/2117246126038384889", "text": "\"OpenAI Courts a Harsher DC with AI Speed Limits\"\n\nHard to tell how much this is spin vs a real shift.\n\nBut it makes sense that AI companies will try to meet the new consensus half-way.\n\nOpenAI may also be realising that a race with no safeguard = accidents = a bigger backlash. https://t.co/8secoJSIay", "created_at": "2026-11-02T13:23:07+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH38kCW8AAiyPD.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWH39CkWEAETAsQ.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117244063665791130", "url": "https://x.com/robertwiblin/status/2117244063665791130", "text": "Like Tom it makes me increasingly furious that the stupidity and venality of individual people runs a high chance of killing my children in the near future.\n\nIt's tough to tell if this is a pathway to becoming less reasonable, or to becoming more reasonable. https://t.co/ite9yFWWhk", "created_at": "2026-11-02T13:14:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 104, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWHztJbXQAAf91B.png"}], "quoted": {"author": "TomDavidsonX", "text": "I've had two phases in my emotional orientation to ai takeover risk\n\n1. For many years it was intellectual. \n\nWhile I believed there was >10% chance of ai takeover, I didn't feel scared or angry. \n\nI was happy to reason \"well, of course some ppl should focus on the worlds where we avoid takeover. And some ppl should focus on the worlds where we just wing it, bc we might\".\n\nAnd I'd think \"hmm it seems really tough for a misaligned agi to align its successor, and would a reward seeker really try to take over, and will we really roll out ai to the military... these doomers are missing loads of ways we could be fine!\"\n\nOr \"yep this is a massive risk, but I'm best off working on some other more neglected thing\"\n\nIt was in some ways like a game - have an intellectually accurate view about the risk and how to have impact\n\n2. Recently my orientation to ai takeover has become more visceral/emotional\n\nI think: \"we're barrelling towards catastrophe, everything I love will be lost, we need to stop, what can I do that will help with that\"\n\nI'm like \"no let's not plan for winging it, that's crazy.  we need US-China coordination or we're fucked\"\n\nI think \"it's fucking insane to make misaligned superintelligence and comfort ourselves that we haven't yet handed over the military. This isn't a fucking game.\"\n\nThis is a less rational attitude in some ways. It ignores genuine points about neglectedness and needing to plan for shitty but likely scenarios. \n\nAnd it risks being unhelpfully emotive and solider mindset and tribal. Which I think ai safety ppl can be.\n\nBut I do feel it has smg important to the second attitude.\n\nOverall, both attitudes have their merits \n\nI associate the first with EAs and the second with pause AI folks."}, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117222129934680307", "url": "https://x.com/robertwiblin/status/2117222129934680307", "text": "I've had two phases in my emotional orientation to ai takeover risk\n\n1. For many years it was intellectual. \n\nWhile I believed there was >10% chance of ai takeover, I didn't feel scared or angry. \n\nI was happy to reason \"well, of course some ppl should focus on the worlds where we avoid takeover. And some ppl should focus on the worlds where we just wing it, bc we might\".\n\nAnd I'd think \"hmm it seems really tough for a misaligned agi to align its successor, and would a reward seeker really try to take over, and will we really roll out ai to the military... these doomers are missing loads of ways we could be fine!\"\n\nOr \"yep this is a massive risk, but I'm best off working on some other more neglected thing\"\n\nIt was in some ways like a game - have an intellectually accurate view about the risk and how to have impact\n\n2. Recently my orientation to ai takeover has become more visceral/emotional\n\nI think: \"we're barrelling towards catastrophe, everything I love will be lost, we need to stop, what can I do that will help with that\"\n\nI'm like \"no let's not plan for winging it, that's crazy.  we need US-China coordination or we're fucked\"\n\nI think \"it's fucking insane to make misaligned superintelligence and comfort ourselves that we haven't yet handed over the military. This isn't a fucking game.\"\n\nThis is a less rational attitude in some ways. It ignores genuine points about neglectedness and needing to plan for shitty but likely scenarios. \n\nAnd it risks being unhelpfully emotive and solider mindset and tribal. Which I think ai safety ppl can be.\n\nBut I do feel it has smg important to the second attitude.\n\nOverall, both attitudes have their merits \n\nI associate the first with EAs and the second with pause AI folks.", "created_at": "2026-11-02T11:47:46+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "likes": 499, "retweets": 46, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117220722926084497", "url": "https://x.com/robertwiblin/status/2117220722926084497", "text": "If just a few lab staff took on verification work full-time, verifying a US-China pacing deal could get much more feasible within months.\n\nHere are 8 specific things lab staff could start on today to help make international verification possible: 🧵", "created_at": "2026-11-02T11:42:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MauricBaker", "rt_author_name": "Mauricio Baker", "likes": 345, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117213236885856383", "url": "https://x.com/robertwiblin/status/2117213236885856383", "text": "Scott Aaronson four days ago on the possibility that AI models will soon break widely used cryptographic systems, and on what responsible disclosure looks like when the parties who need to be notified are effectively the entire world. https://t.co/wMnwfJbb57", "created_at": "2026-11-02T11:12:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 1376, "retweets": 144, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV6JYBhbwAAkgzL.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117212057787650218", "url": "https://x.com/robertwiblin/status/2117212057787650218", "text": "Seems like Anthropic's crackdown on distillation has worked and now Chinese distillers are going over to OpenAI.\n\nOpenAI should implement Anthropic's measures. This could also be the basis for government standards for the industry.", "created_at": "2026-11-02T11:07:45+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "likes": 210, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117211881077416006", "url": "https://x.com/robertwiblin/status/2117211881077416006", "text": "Quick comment on Scott Alexander's SURA essay.\n\nI agree with several parts of it, but there is a huge spectrum between \"stop unilaterally\" and \"race to RSI at maximum speed, then try to solve alignment with right-on-the-brink-of-superintelligence AIs.\"\n\nIt also seems to imagine that the release of the aligned super intelligence is basically the end of history, and is very unclear on what happens after this \"last possible moment.\" Section IV is not very reassuring.", "created_at": "2026-11-02T11:07:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "boazbaraktcs", "rt_author_name": "Boaz Barak", "likes": 129, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWD5zfwWkAA3au0.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117200915887444023", "url": "https://x.com/robertwiblin/status/2117200915887444023", "text": "I was sad when @Gregory_C_Allen left The AI Policy Podcast.\n\nBut he's back at last with a new show: 'The AI Power Podcast'.\n\nIf you listened to his show before you probably want to go sub the new thing.\n\nhttps://t.co/WtRQtompNp https://t.co/jGwKnEv4xU", "created_at": "2026-11-02T10:23:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWHOwXNWAAAR8UY.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117682730884542663", "url": "https://x.com/robertwiblin/status/2117682730884542663", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)", "created_at": "2026-11-03T18:18:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 11, "retweets": 0, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117682159028748288/img/VIfPqHy-JfIlb7JB.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117652626351505585", "url": "https://x.com/robertwiblin/status/2117652626351505585", "text": "@TomDavidsonX True but we're doing well on providing global public goods", "created_at": "2026-11-03T16:18:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2117651871640822079", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117651582032494758", "url": "https://x.com/robertwiblin/status/2117651582032494758", "text": "@TomDavidsonX Nobody's perfect Tom", "created_at": "2026-11-03T16:14:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "TomDavidsonX", "reply_to_id": "2117634084214026387", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117647625050603822", "url": "https://x.com/robertwiblin/status/2117647625050603822", "text": "People seem to forget how unprecedented this is https://t.co/3MYAXZ4JOx", "created_at": "2026-11-03T15:58:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "JordanNanos", "rt_author_name": "Jordan Nanos", "rt_avatar": "https://pbs.twimg.com/profile_images/2031599032892813312/g7tkCpeY_normal.jpg", "rt_id": "2114738676899148147", "likes": 4724, "retweets": 208, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkPnoBbwAARmYd.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117642183281156468", "url": "https://x.com/robertwiblin/status/2117642183281156468", "text": "Even putting aside the value of the generally excellent work done by AISI-type government agencies, it is inherently dangerous that the US government employs so few cleared people with deep expertise in frontier AI. A conflict between informed rich companies with powerful AI and an uninformed US government with the guns is a recipe for disaster.", "created_at": "2026-11-03T15:36:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Jess_Riedel", "rt_author_name": "Jess Riedel", "rt_avatar": "https://pbs.twimg.com/profile_images/1585097910634483712/j5i4rvha_normal.jpg", "rt_id": "2117639096700973200", "likes": 16, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117613472867549443", "url": "https://x.com/robertwiblin/status/2117613472867549443", "text": "@davidmanheim *current", "created_at": "2026-11-03T13:42:49+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "davidmanheim", "reply_to_id": "2117613273423941654", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117611007010800067", "url": "https://x.com/robertwiblin/status/2117611007010800067", "text": "At least as of the last generation of models, AIs are mostly just trying to get an immediate high score.\n\nOn the one hand that means they're happy to violate user instructions.\n\nOn the other hand, at least they're not yet scheming about broader consequences (though wanting a high score is enough to want to eliminate oversight).\n\nhttps://t.co/6PzgzCMpdF", "created_at": "2026-11-03T13:33:02+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWNDLr3W0AAsNI1.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117607298767913444", "url": "https://x.com/robertwiblin/status/2117607298767913444", "text": "The UK is totally AI safety mogging the US; we must catch up!", "created_at": "2026-11-03T13:18:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117607126885450006", "likes": 67, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117605127498416607", "url": "https://x.com/robertwiblin/status/2117605127498416607", "text": "Source:  https://t.co/Tzgu3nakNr", "created_at": "2026-11-03T13:09:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117605124331946115", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117605124331946115", "url": "https://x.com/robertwiblin/status/2117605124331946115", "text": "Is the UK Government literally #1 in the world in terms of how well it's preparing for AGI, given the resources it has available?\n\nAfter last week's budget, I think so.\n\nPuts some other countries to shame really. https://t.co/bI7aQyeSOF", "created_at": "2026-11-03T13:09:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 207, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWM-gHEWgAAqrju.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117602136879960512", "url": "https://x.com/robertwiblin/status/2117602136879960512", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:57:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117593239226290442", "url": "https://x.com/robertwiblin/status/2117593239226290442", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-03T12:22:25+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "rt_avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "rt_id": "2117277210570604945", "likes": 269, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117586507049603563", "url": "https://x.com/robertwiblin/status/2117586507049603563", "text": "This is a cool paper, but I think it's best thought of as Astra is surprisingly capable of doing old school mechanistic interpretability research rather than anything spooky. The things it's doing are clever, but typically exploiting structure in the data and using known method mechanistic interpretability techniques (which Astra was surely pretrained on), though it is better at this than I would have predicted!\n\nThis is an exciting development for the prospects of ambitiously scaling interpretability or doing very laborious analysis like this, on more real models. However, I'm not holding my breath. This kind of analysis was pretty common up until about 2022, it largely fell out of favor because a lot of it is just exploiting fairly clean surface-level patterns that doesn't scale to the annoying complexity of real LLMs or which only works for the more simpler and superficial properties. And as far as I can tell, basically all the case studies here are just using a bag of interpretability tricks rather than anything spooky. The piece doesn't really update me on how far old school mech interp can go, just on how good LLMs are at it. It's very fun to see the creative solutions Astra came up with though!", "created_at": "2026-11-03T11:55:40+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "rt_avatar": "https://pbs.twimg.com/profile_images/1542528376845615104/hWSoUGaN_normal.jpg", "rt_id": "2117375052618539485", "likes": 1628, "retweets": 144, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117586397288599653", "url": "https://x.com/robertwiblin/status/2117586397288599653", "text": "ANTHROPIC: \"we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.'\"\n\n\"we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models\"", "created_at": "2026-11-03T11:55:14+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2117280858122170525", "likes": 664, "retweets": 81, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117554253833130110", "url": "https://x.com/robertwiblin/status/2117554253833130110", "text": "We're hiring biologists to measure the biosecurity risks of frontier AI on real robots.\n\nYou'll track how well AI can use robots for dangerous biological work and whether safeguards stop misuse. Your results will inform the public and governments.\n\nNo robotics experience needed. https://t.co/49amZkd5Hx", "created_at": "2026-11-03T09:47:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "robocurve", "rt_author_name": "Robocurve PBC", "rt_avatar": "https://pbs.twimg.com/profile_images/2093086017268097024/qtVm8mqA_normal.jpg", "rt_id": "2115132404038046166", "likes": 17, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVp1cuTa8AAXh2O.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117688360604963116", "url": "https://x.com/robertwiblin/status/2117688360604963116", "text": "Transcript: https://t.co/EueAqELUHh\n\nApple: https://t.co/iWxAx6AHve\n\nSpotify: https://t.co/rZLY2FGx6W\n\nYouTube: https://t.co/RKv2ebPpLw https://t.co/bCkJ3jBQXw", "created_at": "2026-11-03T18:40:24+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117682730884542663", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOKA89XYAEbPn4.jpg"}], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2118040192980341187", "url": "https://x.com/robertwiblin/status/2118040192980341187", "text": "Colom is now 90% to win a senate seat in Mississippi.\n\nHadn't heard of him until today.\n\nBut seems quite charismatic so I'd expect we'll be seeing a lot more of him.", "created_at": "2026-11-04T17:58:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 1, "media": [], "quoted": {"author": "scott_colom", "text": "I walked the Trump rally line to listen, not make assumptions. I talked with voters, asked questions and heard what matters to them.\n\nWhen I'm elected, I'll represent all 82 counties and every Mississippian, no matter who they voted for. That's what being your senator means. #MississippiMatters"}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118020722421338165", "url": "https://x.com/robertwiblin/status/2118020722421338165", "text": "Vance decides he has to break with Trump, interesting:\n\n\"The reason we lost is the war.\"\n\nI wonder how many others will opt for the same strategy.", "created_at": "2026-11-04T16:41:05+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 2, "media": [], "quoted": {"author": "JDVance", "text": "One of the things the data analysts on our side obsessed over was \"composition\"—whether the electorate looked close enough to 2024 for Republicans to win. And despite polls that showed a Democrat blowout, the data kept on telling us the same story: in some states turnout was merely OK, in other states it was downright amazing, and in no state was it catastrophic. There was a genuine sense of optimism on our team: our people were showing up. \n\nSo, I asked the smartest data guy I know, does that mean we're going to shock the world? \"No,\" he told me. \"We might do better than the polls suggest. But the data is telling us that a lot of Trump/Vance 2024 voters are pissed and planning to vote for the other guys. Our voters are turning out, but they may not vote for us.\"\n\nWell, that looks prophetic now. Our voters did show up. In Florida, for example, the electorate was 9 points more Republican than Democrat, just a couple points worse than 2024. Undoubtedly there were places we could have done better on turnout. But the main problem is not turnout. The main problem is that many people who voted for Trump/Vance in 2024 voted for Democrats in 2026.  \n\nThere will be a lot of infighting and arguing over what happened and why that is. One of the pollsters I really respect told me that our economic messaging wasn’t sharp enough down the stretch. I’m sure that’s true. \n\nBut the real reason we lost is obvious to almost everyone. \n\nAnother pollster—one of the smartest people I know in politics, told me yesterday we’d lose the generic ballot by 13 points. I felt negative going into Tuesday, but even I was shocked by this. In his polling, he saw that a lot of Trump 2024 voters were angry and planning to vote for Democrats. He asked those voters who had abandoned us what would cause them to come back on our team. The top four answers, accounting for nearly all of the responses were:\n\n1) End the war\n2) Focus on cost of living/inflation\n3) Put America First\n4) Change our relationship to Israel\n\nOur voters showed up. And the above four reasons are why many of them voted for Democrats. This is according to a pollster who nailed the results. While many spent Monday attacking Rachel Campos Duffy for calling for a diplomatic resolution to the conflict, it turns out her political advice was sound. (She’s also a great person.)\n\nIn the next few months, there's going to be a lot of gaslighting. Expect to hear any number of establishment politicians say the solution to our woes is amnesty. I'm open to the idea that we should change enforcement—by focusing more on businesses that hire illegal labor, for instance. But anyone pushing amnesty is lying to you. \n\nThe reason we lost is the war. The president himself said so last night. \n\nIf you'd like to argue it was worth it, that losing the Senate for the next 6 years was worth it, then do so. Argue it was a worthwhile cost to pay. Agree or disagree, that's at least honest.\n\nBut everyone knows why we lost. And any honest conversation about where we go from here must start there.\n\nI remain hopeful about our country. To the people who are pissed off and want to say, “I told you so”: you’re right, you did tell us so. Take that energy into electing Republicans who share your worldview. To the people who are just pissed at the results, you should be. Let’s take that anger and get back to the work of saving our country."}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117995693461680441", "url": "https://x.com/robertwiblin/status/2117995693461680441", "text": "@tobyordoxford 20* Jan sorry", "created_at": "2026-11-04T15:01:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2117993796944425030", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117993796944425030", "url": "https://x.com/robertwiblin/status/2117993796944425030", "text": "@tobyordoxford 67 is required to overcome a presidential veto, which will be required for a lot of stuff, for the time being at least. Though Trump could flip on some AI issues very easily.\n\nIf a Dem wins in 2028 then from 29 Jan 2029 it'll be 60 votes.", "created_at": "2026-11-04T14:54:06+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "tobyordoxford", "reply_to_id": "2117990933606388125", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117979878897152150", "url": "https://x.com/robertwiblin/status/2117979878897152150", "text": "Effective altruists are watching this race especially closely https://t.co/SPJkePtMRE", "created_at": "2026-11-04T13:58:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "AndyMasley", "rt_author_name": "Andy Masley", "rt_avatar": "https://pbs.twimg.com/profile_images/2065479201109549056/yIrrL3ph_normal.jpg", "rt_id": "2117786042480881760", "likes": 373, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPjLlCXsAAdVE3.png"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117979800270750164", "url": "https://x.com/robertwiblin/status/2117979800270750164", "text": "The voters have spoken. They want DUV controls, CoT monitorability, and ZKP-based workload verification.", "created_at": "2026-11-04T13:58:29+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117870099902423418", "likes": 384, "retweets": 27, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117979474981462093", "url": "https://x.com/robertwiblin/status/2117979474981462093", "text": "Great reporting here. I think people have been sleeping on how aggressively Nvidia has been operating in DC.\n\nI suspect that is coming back to bite them!", "created_at": "2026-11-04T13:57:11+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "calebwatney", "rt_author_name": "Caleb Watney", "rt_avatar": "https://pbs.twimg.com/profile_images/2115512217277771776/aGaLkTiQ_normal.jpg", "rt_id": "2117703343745196348", "likes": 150, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117979120025948496", "url": "https://x.com/robertwiblin/status/2117979120025948496", "text": "Data centres were directly on the ballot in 44 places.\n\nIn 43 of them voters went for the anti-data centre option (exactly what that was varied).\n\nhttps://t.co/NiF8l23T9r", "created_at": "2026-11-04T13:55:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 1, "media": [], "quoted": {"author": "bradrcarson", "text": "So the results are all in. Data center moratoria (various flavors) went 43-1. \n\nAll hyperscalers must now converge on Harwood, North Dakota, the one outlier. Find out what's in the water or in the air. There is only one precinct and 400 voters, but they alone sided with you! https://t.co/XtF5WPLSYY"}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117969972718715278", "url": "https://x.com/robertwiblin/status/2117969972718715278", "text": "Congress will struggle to pass much over the filibuster and a presidential veto.\n\nBut one thing might clear 67 votes: rules stopping any president from using AI to concentrate power and sideline Congress.\n\nSenate/House committees should demand they get access to frontier models on the same terms as the White House.\n\nThere's precedent here with the Intelligence committees and CIA/NSA/FBI.\n\nOne branch just can’t be the only one with access to superintelligence, that's totally unstable.\n\nThen use the defence bill (which can't simply be vetoed) and attach rules on buying AI-operated military equipment.\n\nFirst: add checks to prevent it being backdoored by China or anyone else.\n\nSecond: ensure it cannot be used to assist with a power grab by generals or the executive branch.\n\nThis is in the enlightened interest of Congressional Republicans.\n\nWithout these rules, Congress as a whole gets sidelined as AI advances.\n\nAnd Dems are now strong betting favourites for the Presidency 2028. These rules protect Republicans from whoever succeeds Trump.\n\nIt'll take real world events to get this to the top of the agenda, but it's worth getting on the radar now.", "created_at": "2026-11-04T13:19:26+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 146, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117956913979961758", "url": "https://x.com/robertwiblin/status/2117956913979961758", "text": "@SimonLermenAI Seems like they're removing it from new contracts too.\n\nThey should push them to release everyone from the contracts also. Given they don't care much that should be possible.", "created_at": "2026-11-04T12:27:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "SimonLermenAI", "reply_to_id": "2117955872882372914", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117954912340631706", "url": "https://x.com/robertwiblin/status/2117954912340631706", "text": "That was fast! \n\nGoogle is probably fixing the no-criticism provisions I discussed yesterday.\n\nComplaining noisily really can work folks.\n\nhttps://t.co/TWk9ybJyp3 https://t.co/NkI4grKB8F", "created_at": "2026-11-04T12:19:35+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 109, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWR8A2AXIAAXFMw.jpg"}], "quoted": {"author": "robertwiblin", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)"}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117952659101761555", "url": "https://x.com/robertwiblin/status/2117952659101761555", "text": "Couple quick takes re: AI implications:\n\n- A big market correction seems plausible given the datacenter stuff, but companies will still find places to build, just a bit more expensively, so markets will recover eventually\n\n- More importantly, the average strength of partisan and bipartisan legislative proposals will increase a lot. Some of this will be \"strong\" but dumb (e.g. kill switch focused instead of minimum safety/security standards + auditing focused). Some of it will be good. If you care about AI policy, this is not a time to disengage/declare victory - expert input will be needed more than ever in the next few months\n\n- POTUS acknowledging the election outcome is significant but it remains to be seen what he will sign / not veto. Something else interesting to watch will be whether the direction/tenor of the SI Task Force changes at all to pre-comply with + shape possible legislation", "created_at": "2026-11-04T12:10:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "rt_avatar": "https://pbs.twimg.com/profile_images/2089462134828871680/cW8--1eS_normal.jpg", "rt_id": "2117858284669731308", "likes": 246, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117952325205590349", "url": "https://x.com/robertwiblin/status/2117952325205590349", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-04T12:09:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "DKokotajlo", "rt_author_name": "Daniel Kokotajlo", "rt_avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "rt_id": "2117738240757371022", "likes": 1572, "retweets": 218, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117920510403301430", "url": "https://x.com/robertwiblin/status/2117920510403301430", "text": "Big boost for Ossoff last night.\n\n(Other winner is DeSantis.) https://t.co/ZFwpoDRAM2", "created_at": 64551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117908775164064037", "url": "https://x.com/robertwiblin/status/2117908775164064037", "text": "A small theory of mine is that Rishi Sunak’s decision to set up the AISI might be one of the most important prime ministerial decisions of this century.", "created_at": "2026-11-04T09:16:15+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "TomChivers", "rt_author_name": "Tom Chivers", "rt_avatar": "https://pbs.twimg.com/profile_images/1150687971760386048/Bxw2xVV4_normal.png", "rt_id": "2117898093035503661", "likes": 321, "retweets": 29, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117732278214271276", "url": "https://x.com/robertwiblin/status/2117732278214271276", "text": "Abdul El-Sayed is the Pause AI candidate: https://t.co/8Ol7Lc6V2x", "created_at": "2026-11-03T21:34:55+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "rt_avatar": "https://pbs.twimg.com/profile_images/1942934295363903488/fpfcb6Ug_normal.jpg", "rt_id": "2117452882773684550", "likes": 16654, "retweets": 743, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117451427987726336/img/hSNVIejIcIcM3I3z.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117731266686509350", "url": "https://x.com/robertwiblin/status/2117731266686509350", "text": "I forgot to add that I also encourage people to praise companies when they do good things at cost to their own profit/competitiveness - it helps incentivize them to take more actions of thatkind and also makes people at the company take your criticisms more seriously.", "created_at": "2026-11-03T21:30:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2117693988954382717", "likes": 23, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117731199150072253", "url": "https://x.com/robertwiblin/status/2117731199150072253", "text": "Good video. Complaining about AI companies doing bad things (even just on twitter) really works! You don't even necessarily need to have lots of followers to do it (though of course that helps) - the algorithm often helps surface high effort posts. \n\nMany more people should do this - including possibly you, the person reading this! Read primary sources that companies put out and complain about them if you think they are bad! Employees at the companies will read them (in rare cases, sometimes the CEOs of the company will read them!). \n\nI think there are only about a dozen or so accounts on this platform who frequently post about AI company misdeeds, but there is a far greater quantity of shenanigans sitting in public view yet to be noticed.  \n\nWe need laws and many forms of stronger deterrence than just public shame, but public criticism really can make a difference! The criticism is also particularly effective when its grounded in details that people who work at the companies may not be aware of (e.g. specific language in draft legislation or a system card or a quote from a company spokesman to press or the actions of a companies affiliated political arm etc.) and tries to recognize that AI companies are not necessarily monoliths acting with one single intent.", "created_at": "2026-11-03T21:30:38+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2117692510914904569", "likes": 98, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118280106343104798", "url": "https://x.com/robertwiblin/status/2118280106343104798", "text": "More information about what they offer: https://t.co/zsUCYnt9xe", "created_at": "2026-11-05T09:51:47+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2118279875190501470", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWWkfibW0AAp5Wt.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118279875190501470", "url": "https://x.com/robertwiblin/status/2118279875190501470", "text": "The Tarbell Fellowship has produced a series of excellent AI journalists. Seems like a great program.\n\nThey're currently choosing their next cohort - apps close 22 Nov.\n\nIf you want to help with AI, seriously consider it (and tell suitable friends).\n\nhttps://t.co/tsZUuw3VMS", "created_at": "2026-11-05T09:50:52+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 1, "media": [], "quoted": {"author": "robertwiblin", "text": "Laying into AI companies is more effective than you might think.\n\nGag clauses torn up.\n~$75bn moved to the OpenAI Foundation.\nOpenAI flipped on SB315.\nBrockman quit his SuperPAC.\nAnthropic backpedalled on its federal bill.\n\nReporters, lawyers, ex-staff, and shitposters on X got it done – with huge help from staff speaking up internally.\n\nThis month Anthropic, OpenAI and GDM gave us a counterproductive AI bill, dubious firings and fresh clauses gagging staff.\n\nIf you work at one of these companies: it's time to post in #general (metaphorically or maybe literally).\n\nIf you don't: consider becoming a sophisticated and strategic pain in the ass for these companies when they do bad things.\n\nIt’s a neglected career and probably high impact, especially for people who really get what's going on. I explain some options:\n\n00:00 We need a stronger effort to push AI companies to do better\n01:14 Anthropic: who gets to pull the brake?\n07:14 OpenAI fires three safety researchers\n12:44 Google DeepMind’s lifelong gag clause\n5:39 Credit where it’s due\n16:34 How to make AI companies behave better\n17:31 Insiders: if you want to stay\n18:40 Insiders: if you’re willing to leave\n19:37 So… should you leave?\n20:39 Outsiders: what’s already worked\n22:51 Outsiders: digging up and explaining\n25:12 Outsiders: reaching the public and politicians\n00:27:52 Keep the pressure on\n\n(On the 80,000 Hours Podcast, links below.)"}, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118267376227828038", "url": "https://x.com/robertwiblin/status/2118267376227828038", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "created_at": "2026-11-05T09:01:12+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "rt_avatar": "https://pbs.twimg.com/profile_images/1856300176601694208/BUmXWK-U_normal.jpg", "rt_id": "2118093146483810386", "likes": 1418, "retweets": 212, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT6fgpbYAA0I3V.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118098831690932555", "url": "https://x.com/robertwiblin/status/2118098831690932555", "text": "@mattcschwartz Great catch, I think the website must be buggy.\n\nBut I don't get why it's bugging just on Vance. I'll delete the post.\n\nFor people seeing this, he's declining but much less than this: https://t.co/sFyMuKyPp8 https://t.co/hy1jqM6rvN", "created_at": "2026-11-04T21:51:28+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "mattcschwart null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115857180431732929", "url": "https://x.com/deanwball/status/2115857180431732929", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T17:23:57+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 145, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115846411845816528", "url": "https://x.com/deanwball/status/2115846411845816528", "text": "@curiousben Why would a shortage of supply lower prices?", "created_at": "2026-10-29T16:41:09+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "curiousben", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115829165207556412", "url": "https://x.com/deanwball/status/2115829165207556412", "text": "I occasionally run into fortune 100 firms that have not adopting coding agents *at all.* adoption is still very very early.", "created_at": "2026-10-29T15:32:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 57, "retweets": 2, "media": [], "quoted": {"author": "hamandcheese", "text": "This is with only ~50% adoption by the Fortune 500 and with very low spend. Diffusion is still incredibly early."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115828862248706490", "url": "https://x.com/deanwball/status/2115828862248706490", "text
