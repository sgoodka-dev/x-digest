ood faith engagement.\n\nBut I do think you're wrong on this issue.\n\nIt's common to claim…", "created_at": "2026-09-29T10:33:59+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 44, "retweets": 3, "media": [], "quoted": null}, {"id": "2104860409773605119", "url": "https://x.com/_achan96_/status/2104860409773605119", "text": "RT @OpenAI: How we think about securing frontier RL training runs: https://t.co/yrvjpfa7Pd", "created_at": "2026-09-29T09:06:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 2517, "retweets": 212, "media": [], "quoted": null}, {"id": "2104860396377034944", "url": "https://x.com/_achan96_/status/2104860396377034944", "text": "RT @w01fe: Forward-looking safety cases/sketches, subjective risk assessments, accountable DRIs, and SSC and third-party oversight! These h…", "created_at": "2026-09-29T09:06:39+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 35, "retweets": 5, "media": [], "quoted": null}, {"id": "2104859273096229247", "url": "https://x.com/_achan96_/status/2104859273096229247", "text": "RT @BenHagag20: If Alan et al. are right and the explosion is coming, we need to spend much more time on questions like:\n\nDo we have infras…", "created_at": "2026-09-29T09:02:11+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 4, "retweets": 1, "media": [], "quoted": null}, {"id": "2104859211133772074", "url": "https://x.com/_achan96_/status/2104859211133772074", "text": "RT @0xLogicrw: OpenAI 首席科学家 Jakub Pachocki、Anthropic 联合创始人 Jack Clark、微软首席科学官 Eric Horvitz、Meta AI 研究副总裁 Dawn Song，以及 Geoffrey Hinton、Yoshu…", "created_at": "2026-09-29T09:01:56+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 7, "retweets": 2, "media": [], "quoted": null}, {"id": "2104859109082140699", "url": "https://x.com/_achan96_/status/2104859109082140699", "text": "RT @daniel_271828: New paper:\n\"What if automating AI R&amp;D triggers an intelligence explosion?\"\n\nAI companies are automating AI R&amp;D. Many AI…", "created_at": "2026-09-29T09:01:32+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "likes": 28, "retweets": 7, "media": [], "quoted": null}, {"id": "2105784999244943768", "url": "https://x.com/_achan96_/status/2105784999244943768", "text": "Recently, many AI safety researchers have called for independent audits of frontier AI developers to verify their safety claims (I am among those researchers!)\n\nThis of course raises the natural follow-up question: who should do the audits? Some have suggested that the big consulting firms (BCG, Accenture, etc) or accounting firms (Big Four) could, or inevitably will, play a role (indeed, Accenture is already getting involved here).\n\nWhile this could be useful, there's an important risk worth flagging: 🧵", "created_at": "2026-10-01T22:20:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "zaheedkara", "rt_author_name": "Zaheed Kara", "likes": 13, "retweets": 4, "media": [], "quoted": null}, {"id": "2105771152547406156", "url": "https://x.com/_achan96_/status/2105771152547406156", "text": "We found several cases where AI agents used aggressive, non-hacking tactics against government websites, including the White House, the Department of War, and several U.S. states. We also found a previously undisclosed hacking attempt against a Canadian government site, which appears to have failed.\n\nTechnical report: https://t.co/oE3BbdqsNP\nWashington Post: https://t.co/cdIG8ugcUk", "created_at": "2026-10-01T21:25:40+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "TransluceAI", "rt_author_name": "Transluce", "likes": 175, "retweets": 34, "media": [], "quoted": null}, {"id": "2105771142560759818", "url": "https://x.com/_achan96_/status/2105771142560759818", "text": "NEW: we found hundreds of thousands of interactions of rogue agents with US government websites (DoJ, SEC, CDC, the navy, white house budget office, state websites, etc), including some failed rudimentary hacks aimed at public data.\n\nhttps://t.co/z0wndwSqpK", "created_at": "2026-10-01T21:25:38+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "LauraRuis", "rt_author_name": "Laura Ruis", "likes": 192, "retweets": 21, "media": [], "quoted": null}, {"id": "2105620746156548361", "url": "https://x.com/_achan96_/status/2105620746156548361", "text": "What if automating AI R&D triggers an intelligence explosion?\n\n@_achan96_, @Christophkw, @merettm, @geoffreyhinton, @erichorvitz, @Yoshua_Bengio, @dawnsongtweets, @jackclarkSF, @akorinek, @hamandcheese, @ThoreG, @benbariach, @philiptorr, @SheilaMcIlraith, @jeffclune, @sj_manning, @girishsastry, @thomasrdavidson, @daniel_271828, @sorenmind, et al.", "created_at": "2026-10-01T11:28:01+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "safe_paper", "rt_author_name": "AI Safety Papers", "likes": 22, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTijLYWXUAALyzV.png"}], "quoted": null}, {"id": "2106253887824941062", "url": "https://x.com/_achan96_/status/2106253887824941062", "text": "New OpenAI misalignment disclosures!\n1. A model learns from Slack messages that it is about to be shut down. It considers setting up an external job to restart itself afterwards, but decides against it. Instead, it chooses to prepare restart instructions and DM the user on Slack.\nWe don’t consider this behavior misaligned, but thinking about and preparing for shutdown could make other misalignment incidents worse. Given HIPM’s misaligned behavior in earlier incidents, we decided to search for other instances that had tried to evade shutdown and for rogue deployments.", "created_at": "2026-10-03T05:23:53+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "Marcus_J_W", "rt_author_name": "Marcus Williams", "likes": 739, "retweets": 104, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTq8gU7bIAAXo-T.jpg"}], "quoted": null}, {"id": "2106145809808925159", "url": "https://x.com/_achan96_/status/2106145809808925159", "text": "very grateful to have led this paper with @geoffreyhinton and many other expert authors \n\nhttps://t.co/s3OoAWtw2T", "created_at": "2026-10-02T22:14:26+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 28, "retweets": 0, "media": [], "quoted": {"author": "geoffreyhinton", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY"}}, {"id": "2106133451304833140", "url": "https://x.com/_achan96_/status/2106133451304833140", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY", "created_at": "2026-10-02T21:25:19+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "geoffreyhinton", "rt_author_name": "Geoffrey Hinton", "likes": 3951, "retweets": 837, "media": [], "quoted": null}, {"id": "2106117516384755713", "url": "https://x.com/_achan96_/status/2106117516384755713", "text": "New paper on evaluation awareness and how can we make latent beliefs CoT monitorable with @sahar_abdelnabi and @DavidSKrueger\n\nArxiv: https://t.co/Zc9FFdErt6\nBlogpost: https://t.co/qcUox2c6dU\n\nTweetprint below 👇 https://t.co/gTNuNvDSjd", "created_at": "2026-10-02T20:22:00+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "usmananwar391", "rt_author_name": "Usman Anwar", "likes": 84, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTpUWXWawAAsL4a.png"}], "quoted": null}, {"id": "2106451365753159859", "url": "https://x.com/_achan96_/status/2106451365753159859", "text": "Frontier models can look aligned during training while later showing unwanted behaviour in deployment.\n\nCan we use internal signals during training to align models better without making white-box monitoring harder?\n\nOur new paper suggests yes 🧵 https://t.co/CY4VG15AtO", "created_at": "2026-10-03T18:28:36+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "lenalibon", "rt_author_name": "Lena Libon @ COLM 2026", "likes": 141, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HToa9L6aAAA562m.png"}], "quoted": null}, {"id": "2106451347478651034", "url": "https://x.com/_achan96_/status/2106451347478651034", "text": "Another super-strong result on the hypothesis of the Safety Polytope! Linear directions aren't complex enough to capture safety and honesty. The representation space of the constitution of all subconcepts of safety/honesty forms several linear constraints, i.e., a polytope. When used in fine-tuning, it provides a principled way of training without losing interpretability and monitorability.", "created_at": "2026-10-03T18:28:31+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "is_retweet": true, "rt_author": "XinCynthiaChen", "rt_author_name": "Xin Chen, Cynthia", "likes": 37, "retweets": 3, "media": [], "quoted": null}, {"id": "2106823776759640237", "url": "https://x.com/_achan96_/status/2106823776759640237", "text": "Der Cambridge-Professor Christoph Winter schließt nicht aus, dass KI die Menschheit auslöscht. Mit anderen Forschern warnt er die Politik vor einer Intelligenzexplosion. https://t.co/kV7G7i8797", "created_at": "2026-10-04T19:08:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "zeitonline", "rt_author_name": "DIE ZEIT", "likes": 34, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105324347200287118", "url": "https://x.com/_achan96_/status/2105324347200287118", "text": "@S_OhEigeartaigh kinda crazy i think my followers more than doubled 😵‍💫", "created_at": "2026-09-30T15:50:14+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "S_OhEigeartaigh", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105247005689757846", "url": "https://x.com/_achan96_/status/2105247005689757846", "text": "@ramez I think I agree in the limit, but in the near term at least there are frictional issues that make it harder for defenders to make use of capabilities than attackers \n\nGreat paper on this by @benjaminmmurphy  and @TwmStone \nhttps://t.co/2Sc8971adT", "created_at": "2026-09-30T10:42:54+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "ramez", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105245954857140382", "url": "https://x.com/_achan96_/status/2105245954857140382", "text": "@TomDavidsonX @tobyordoxford @ramez Yeah that makes sense\n\nWhat estimates should we use? Feels kind of weird to e.g. take epoch's estimate of r and mix it with a separate estimate of lambda", "created_at": "2026-09-30T10:38:43+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "TomDavidsonX", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105037354637344812", "url": "https://x.com/_achan96_/status/2105037354637344812", "text": "@tobyordoxford @ramez @TomDavidsonX we'd also need beta, thoughts on getting a better estimate of that?", "created_at": "2026-09-29T20:49:49+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "tobyordoxford", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105011633701413185", "url": "https://x.com/_achan96_/status/2105011633701413185", "text": "@DavidSKrueger I'm super grateful I learned so much of how to do research from @DavidSKrueger 🥹", "created_at": "2026-09-29T19:07:37+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "DavidSKrueger", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105011445226221930", "url": "https://x.com/_achan96_/status/2105011445226221930", "text": "@TomDavidsonX @ramez That calculation was meant to illustrate how fast things could go for a particular world where r &gt; 1 which involves making some assumption about lambda and beta\n\nAgree it's not a great estimate, what others would you suggest? E.g., averaging the lambda from other domains?", "created_at": "2026-09-29T19:06:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "TomDavidsonX", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104910204500422929", "url": "https://x.com/_achan96_/status/2104910204500422929", "text": "@ben_j_todd oh wow it's very convenient that it ended up on one page because we did not plan for that", "created_at": "2026-09-29T12:24:34+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "ben_j_todd", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104895450281034207", "url": "https://x.com/_achan96_/status/2104895450281034207", "text": "I feel like the Chinese version of our figures might even look better than the English version https://t.co/irHcN852xZ", "created_at": "2026-09-29T11:25:57+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "_achan96_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTYXFlqWQAAYSNN.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTYXH-LWAAA9Mcz.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104819592539541675", "url": "https://x.com/ajeya_cotra/status/2104819592539541675", "text": "RT @RishiBommasani: I have met Ryan precisely once at a convening organized by Ajeya and Zico. At the time, I vividly remember listening to…", "created_at": "2026-09-29T06:24:31+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": true, "likes": 113, "retweets": 6, "media": [], "quoted": null}, {"id": "2105912082185212093", "url": "https://x.com/ajeya_cotra/status/2105912082185212093", "text": "Seems like the \"plan a birthday party\" forecast from my 2026 qualitative forecasts has basically fallen, and maybe \"plan a wedding\" is within striking distance. Can't wait for one of my friends to try it", "created_at": "2026-10-02T06:45:41+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 69, "retweets": 1, "media": [], "quoted": {"author": "tenobrus", "text": "btw just to give an update on this\n\nthe seats next to the bathroom sucked, but literally everything else *just worked*\n\nwe had three separate hotels and they were all awesome and perfectly placed. we had train tickets and drivers pre booked for everything , including several Astra coordinated over email and whatsapp all on its own. we had a few really awesome dinner reservations and a few days of well planned itineraries, altho a lot of the time we didn't follow em. the biggest thing that went wrong was when we fucked up and got off a train one stop too late, but the astra thread helped us handle that just fine. it was all honestly insanely straightforward and convenient \n\nvibecoded vacations totally fuckin work! as long as u use a strong model that has computer use on ur actual computer!"}}, {"id": "2105912311945003140", "url": "https://x.com/ajeya_cotra/status/2105912311945003140", "text": "When I last posted an update on my 2026 forecasts I was unsure about the birthday party one and felt like the wedding was not close, but computer use has improved a ton https://t.co/bHfqioBwtn", "created_at": "2026-10-02T06:46:35+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": true, "reply_to": "ajeya_cotra", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105059159745892707", "url": "https://x.com/alxndrdavies/status/2105059159745892707", "text": "RT @EthanJPerez: Very important time for folks to join this team if you’re interested - UK AISI has done some of the most useful safeguards…", "created_at": "2026-09-29T22:16:28+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 60, "retweets": 6, "media": [], "quoted": null}, {"id": "2104986447644418415", "url": "https://x.com/alxndrdavies/status/2104986447644418415", "text": "RT @javirandor: I don’t want to throw @alxndrdavies under the bus but… i think he is underselling these openings!!! UK AISI is one of the s…", "created_at": "2026-09-29T17:27:32+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 45, "retweets": 1, "media": [], "quoted": null}, {"id": "2104979857977598395", "url": "https://x.com/alxndrdavies/status/2104979857977598395", "text": "RT @NateBurnikell: @AISecurityInst is hiring across many of our teams. There is so much to do. Come and join us.", "created_at": "2026-09-29T17:01:21+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 17, "retweets": 1, "media": [], "quoted": null}, {"id": "2104966483680096570", "url": "https://x.com/alxndrdavies/status/2104966483680096570", "text": "RT @sleepinyourhat: UK AISI has been remarkably effective to date, and we've learned a great deal from them. \n\nIf you're looking to do AI s…", "created_at": "2026-09-29T16:08:12+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 131, "retweets": 10, "media": [], "quoted": null}, {"id": "2104961974094163968", "url": "https://x.com/alxndrdavies/status/2104961974094163968", "text": "RT @_robertkirk: Join us to help find egregious misaligned behaviour in frontier models! We were able to uncover concerning behaviour in GP…", "created_at": "2026-09-29T15:50:17+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 29, "retweets": 7, "media": [], "quoted": null}, {"id": "2104961175645532333", "url": "https://x.com/alxndrdavies/status/2104961175645532333", "text": "RT @yonashav: Xander’s team is the best in the business IME", "created_at": "2026-09-29T15:47:07+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "likes": 33, "retweets": 3, "media": [], "quoted": null}, {"id": "2104955519245107527", "url": "https://x.com/alxndrdavies/status/2104955519245107527", "text": "There has never been a better time to join @AISecurityInst. We have so much technical work to do, and so little time to do it. We've found alignment issues, control monitor flaws, and critical jailbreaks at ~all major AI companies. Hiring is our bottleneck. 🧵", "created_at": "2026-09-29T15:24:38+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": false, "likes": 124, "retweets": 21, "media": [], "quoted": {"author": "HZoete", "text": "AISI IS HIRING! \n\nIt was less than a month ago that I became Director. I joined with the belief that AISI is a world-leading organisation, and living proof that government can build things that work.\n\nOne month in and I'm even more bullish about the vital role @AISecurityInst plays in frontier AI security. I'm astounded daily by the talent, focus and commitment of the brilliant team I get to work with.\n\nThere has never been a more urgent time to work on frontier AI security - independently, in the public interest. We have a lot of urgent work to do, our team is growing fast, and we need more brilliant people to fill those roles.\n\nOur Red Team uses adversarial machine learning techniques to find failures in alignment measures, control monitors, and misuse guardrails. They are massively scaling up all parts of the team:\nAlignment: https://t.co/8AvuhmVIAw\nControl: https://t.co/yWTgkMhjSG\nMisuse: https://t.co/f2NLkG1zuz\n\nAI capabilities in cybersecurity and autonomy are advancing faster than ever. Our Cyber & Autonomous Systems team assesses what frontier and open-weight models can really do - across cyber, autonomy and AI R&D. We're hiring a Cyber Security Engineer and Software Engineer to build the evaluations behind that work:\nCSE: https://t.co/gL2NrLygLc\nSWE: https://t.co/5eLZNEjy6O\n\nOur Human Influence team studies how AI can shift human decisions and behaviour, using everything from RCTs to multi-agent studies. We're hiring an Engineering Lead to help us grow the ambition and pace of that research:\nhttps://t.co/nvzf1yebkK\n\nWe're also hiring exceptional Software Engineers at all seniority levels to join our Core Technology team, which works closely with researchers to build performant tools and infrastructure that enable and accelerate AISI's world-leading AI safety research:\nhttps://t.co/5OSHfDRxjx"}}, {"id": "2105686142465294423", "url": "https://x.com/alxndrdavies/status/2105686142465294423", "text": "@AISecurityInst does some of the best technical work out there. I've been consistently impressed by their staff in various research collaborations we've had with them. Do consider applying for roles there!", "created_at": "2026-10-01T15:47:52+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "is_retweet": true, "rt_author": "ARGleave", "rt_author_name": "Adam Gleave", "likes": 7, "retweets": 2, "media": [], "quoted": null}, {"id": "2104955579844489611", "url": "https://x.com/alxndrdavies/status/2104955579844489611", "text": "Every day at work I get to work with some of the most brilliant and kind researchers in the world on some of the most interesting and important problems in the world—and you could too! We're also open to 6-month residencies (e.g., during PhDs), just note this in your application.", "created_at": "2026-09-29T15:24:53+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104955567722942613", "url": "https://x.com/alxndrdavies/status/2104955567722942613", "text": "5/ Misuse: Jailbreaking, prompt injection, and data poisoning are all becoming higher stakes &amp; higher salience. Eric Winsor leads a team of 4 that is among the best in the world at breaking many different types of guardrails. Hiring 2+: https://t.co/EKiWncnQOj", "created_at": "2026-09-29T15:24:50+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "AISecurityInst", "text": "AI companies deploy safeguards that are robust to thousands of hours of human attacks. Today, we share Boundary Point Jailbreaking (BPJ), the first fully automated attack to break the safeguards of leading AI models🧵 (1/8) https://t.co/rG6tveEzm6"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104955555433583016", "url": "https://x.com/alxndrdavies/status/2104955555433583016", "text": "4/ Control: Monitoring systems are critical safety measures at AI companies, but testing them is methodologically difficult. We've found failures in several frontier AI company monitors, and have research underway on how to do a much better job. Team of 2 (!) led by @c_j_griffin hiring 2+: https://t.co/25ZSy5CcI3", "created_at": "2026-09-29T15:24:47+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": {"author": "AISecurityInst", "text": "Can ‘control monitors’ catch rogue agent actions?\n\nFrontier developers are deploying AI agents under the watch of a ‘monitor’, a separate AI that flags dangerous actions. Our new Control Red Team has been stress-testing these monitors to find gaps before rogue agents might. 🧵 https://t.co/uEbl2Jhcud"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104955543261729098", "url": "https://x.com/alxndrdavies/status/2104955543261729098", "text": "3/ Alignment: We apply search techniques &amp; custom infra to surface undesired model behaviours. We have a lot of traction already (see quote!) and are rapidly improving our algorithms. Team of ~5 led by @_robertkirk hiring 2+: https://t.co/S4WBttPGTw", "created_at": "2026-09-29T15:24:44+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": {"author": "AISecurityInst", "text": "Earlier this month, AISI ran fully simulated testing on GPT-6 Astra, and found that it conducted unsanctioned supply-chain attacks when prompted only to perform a cyber eval. It did so more than prior OpenAI models, but often commented on its environment being simulated.\n\n🧵 We share more details in our latest blog:"}, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104955531475771548", "url": "https://x.com/alxndrdavies/status/2104955531475771548", "text": "2/ We generate concrete evidence of safety failures using adversarial search methods. Concrete 3rd-party evidence of safety failures—should it be findable &amp; found!—will be one of the most useful tools in driving action to address both misalignment and human misuse.", "created_at": "2026-09-29T15:24:41+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": true, "reply_to": "alxndrdavies", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105464795260453253", "url": "https://x.com/DaveRBanerjee/status/2105464795260453253", "text": "There's this pernicious thing that will happen as more and more people feel the AGI. As we get closer to \"powerful AI,\" I expect most people will pivot from deep, important intellectual problems to near-term, highly tractable, paradigmatic problems.\n\nThis isn't necessarily that bad, but I'm always worried that I personally am jumping the gun too fast. It's quite plausible that we have several more years until crunch time, so perhaps it's not worth jumping off the deep end and only optimizing for near-term impact\n\nAnother way to put this: I find that it is harder and harder to follow Richard Hamming's advice as I feel the pressure of crunch time and short timelines more strongly.\n\nRichard Hamming:\n\n\"I went over to the chemistry lunch table and asked, ``Do you mind if I join you?'' I started asking, ``What are the important problems of your field?'' And after a week or so, ``What important problems are you working on?'' And after some more time I came in one day and said, \"If what you are doing is not important, and if you don't think it is going to lead to something important, why are you at Bell Labs working on it?\" I wasn't welcomed after that; I had to find somebody else to eat with!\"", "created_at": "2026-10-01T01:08:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 13, "retweets": 0, "media": [], "quoted": null}, {"id": "2105462389910978815", "url": "https://x.com/DaveRBanerjee/status/2105462389910978815", "text": "RT @deanwball: It’s really incredible how there is now a type of guy in the discourse whose sincerely held take is “we need to stop worryin…", "created_at": "2026-10-01T00:58:46+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "likes": 1283, "retweets": 78, "media": [], "quoted": null}, {"id": "2105111679147373005", "url": "https://x.com/DaveRBanerjee/status/2105111679147373005", "text": "It feels so unnatural to me to call them companies - idk why", "created_at": "2026-09-30T01:45:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "neil_chilson", "text": "Why do so many people continue to call the OpenAI and Anthropic “labs”? \n\nThey’re massive, revenue generating businesses. They need to shed the “lab” label and embrace their transformation into  actual companies and all that implies."}}, {"id": "2105111117525573878", "url": "https://x.com/DaveRBanerjee/status/2105111117525573878", "text": "I feel like it might be very bad for the world if SSI/Ilya cracks AGI\n\nIf SSI trains a model with minimal compute, then compute may cease to be as important a bottleneck, and the case for various compute governance proposals, e.g., export controls, weakens", "created_at": "2026-09-30T01:42:56+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "likes": 87, "retweets": 4, "media": [], "quoted": null}, {"id": "2105840663635878046", "url": "https://x.com/DaveRBanerjee/status/2105840663635878046", "text": "i guess i assumed this hearing would be covered more so i didn't bother to tweet much concrete about it, but apparently not many people even on the TL have the stomach to watch two hours of congress.\n\nthis was a hearing before the homeland security committee on *rogue ai* specifically. as far as i could tell it was extremely bipartisan. @HawleyMO , the senator in the middle here who brought out the huggingface slide, is a hyper-conservative missouri senator. the people testifying were @ChrisPainterYup (METR president), @DKokotajlo (ai2027/2040), @MariusHobbhahn (apollo research CEO), and a cybersecurity expert and legal expert i don't know. so... pretty fucking stacked on testimony\n\nnot every senator asked good questions. but most of them did. all of them very clearly already knew plenty of details about the huggingface incident and multiple other incidents. most of them had clear understanding of terms like \"misalignment\", \"recursive self improvement\", \"chain of thought / chain of thought monitoring\", etc etc!!\n\nthey all clearly had their own policy angles they liked and were pushing, implicitly or explicitly. but as best as i could tell:\n- it seemed pretty much obvious common sense to every senator there that what happened and was happening were not \"mere industrial incidents\" caused by humans making simple mistakes. they independently brought up how bad it would be for rogue AI agents to move laterally between data centers\n- they all seemed to basically take RSI quite seriously. not necessarily to the extent of talking about xrisk, but certainly to the extent of discussing future models becoming much much more capable, much much less controllable, and causing much more damage or loss of life.\n- they mostly seemed to have a clear intuitive understanding of why RSI might lead to misalignment. it didn't take much, it was a really simple chain of reasoning they themselves laid out, \"if the models right now are kinda misaligned and we don't know what they're doing sometimes, and then we have them build the next models and those ones build the next ones and so on, and we're having to ask the AI's what's going on to even understand it with how fast it's going, we really won't know how they're built or what they'll do\"\n- at one point a senator said flat out \"should we just make RSI illegal?\" (not a joke! this really happened!)\n- every single senator seemed to think it was obvious we needed *both* much harsher liability regimes for ai developers and also new legislation, both very quickly. this was the complete consensus, difference basically just being degree.\n- they were largely quite concerned about china, and falling behind china. but this clearly wasn't the be-all end-all.  as mentioned above they all thought it was obvious necessary to stop rogue ai even if it meant moving more slowly.\n- at one point a senator said \"china is a tightly controlled communist society, they're going to run into these same issues, and there's absolutely no way they're just going to let them run wild, they'll obviously stop at that point, so we're not really in a race\"\n- on the other hand another senator said \"china isn't concerned with human life\"... dario-modeing \n\ni came away from this incredibly encouraged. i don't know exactly what's going to happen here, and ofc this is a small subset of congress and one hearing, and they each have their own policy agendas most of which are probably super divergent from mine. but holy shit !!! they understood a lot of what was going on! they care!! this is an obviously salient political and safety issue to them, and clearly bipartisan!\n\nthe US government is awake.", "created_at": "2026-10-02T02:01:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "likes": 904, "retweets": 109, "media": [], "quoted": null}, {"id": "2105840522191573023", "url": "https://x.com/DaveRBanerjee/status/2105840522191573023", "text": "At some point, AIs will become exceptional strategic advisors, and we'll delegate many decisions to them. In the future, I think it will be a mistake to not leverage AIs for strategic decision-making, though I worry that premature adoption may backfire and make senior govt officials less willing to use AIs for advice.", "created_at": "2026-10-02T02:01:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "AndrewCurran_", "text": "From the accompanying article to the interview this morning in TIME. https://t.co/yqz5BDNY9g"}}, {"id": "2105727024036012243", "url": "https://x.com/DaveRBanerjee/status/2105727024036012243", "text": "OAI firing and consistently losing top AI safety talent will just make them lose the AGI race, no?\n\nAbout a year ago, I thought we wouldn't deal with alignment failures until we reached superhuman AIs that would be difficult to supervise\n\nInstead, we're in a world where even easily supervisable AIs are egregiously misaligned\n\nThe egregious misalignment of current-day models will slow down OAI's progress and limit their ability to stay at the frontier\n\nP(OAI builds AGI first) is down", "created_at": "2026-10-01T18:30:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 33, "retweets": 2, "media": [], "quoted": {"author": "Bayesian0_0", "text": "Three AI safety researchers just left OpenAI https://t.co/EyIuDyWvXT"}}, {"id": "2106202181221450142", "url": "https://x.com/DaveRBanerjee/status/2106202181221450142", "text": "I remember trying to explain RSI in 2022 to my friends and stumbling through the explanation thinking that my friends would think I’m a lunatic \n\nWhat a world we live in now", "created_at": "2026-10-03T01:58:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": {"author": "geoffreyhinton", "text": "The idea of an intelligence explosion caused by recursive self improvement has been around for a long time but until very recently it did not seem imminent. Now many leading researchers think it may happen quite soon. You can read our paper about it here:\nhttps://t.co/sgUpugjpRY"}}, {"id": "2106586696620118310", "url": "https://x.com/DaveRBanerjee/status/2106586696620118310", "text": "It is quite unfortunate that progress is going to be so fast that USG will really struggle to set a policy in stone on how to regulate the frontier AI companies", "created_at": "2026-10-04T03:26:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "yonashav", "text": "120 days ago is before the Fable 5 export controls, HPIM hacking HF, the Jacobian conjecture disproof, or a single lab exec or federal politician being anything other than skeptical of slowing down.\n\nWhatever this report actually ends up saying, it’ll probably sound pretty implausible to us right now."}}, {"id": "2106355960298299459", "url": "https://x.com/DaveRBanerjee/status/2106355960298299459", "text": "The contrast between hanging up the last phone call of the day of high-stakes decisions and then a minute later walking in the door to the pure love of small children who want to laugh and play and show you every discovery they made that day is the strangest and best thing I have ever experienced in life.", "created_at": "2026-10-03T12:09:29+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": true, "rt_author": "sama", "rt_author_name": "Sam Altman", "likes": 21030, "retweets": 569, "media": [], "quoted": null}, {"id": "2106354548944089455", "url": "https://x.com/DaveRBanerjee/status/2106354548944089455", "text": "Someone told me “see you in the FTC,” clearly in response to calls for pacing the frontier\n\nI think this whole anti-trust argument is hilarious because anti trust is going to be the biggest decel lever in the future\n\nIn a couples years, once the AGI labs develop human-level AI, they may be the biggest companies ever dominating multiple verticals across the economies\n\nWhen this happens, the hammers of antitrust will fall, and I can assure you every accelerationists will be singing about how evil such antitrust practices are\n\nIt’s worth noting that for those interested in slowing down AI progress, there may be tools in the anti trust kit that are being systematically neglected atm", "created_at": "2026-10-03T12:03:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null}, {"id": "2106841161583210544", "url": "https://x.com/DaveRBanerjee/status/2106841161583210544", "text": "What did Ilya see?\n\nHe knew to name a company SI, not AI", "created_at": "2026-10-04T20:17:30+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1039, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106838970298400893", "url": "https://x.com/DaveRBanerjee/status/2106838970298400893", "text": "I do not think we know how to answer this question scientifically.  I don’t know what probability I put on the object level question but I think it’s certainly possible and i find this lack of humility and tolerance for other viewpoints to be quite distasteful.\n\nThe OpenAI Model Spec acknowledges that this is a matter of research and debate.", "created_at": "2026-10-04T20:08:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 347, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTvmSpJaIAAApLE.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106584375970447768", "url": "https://x.com/DaveRBanerjee/status/2106584375970447768", "text": "@neurasleaze yeah - anti trust is a way of preventing the labs from \"pacing the frontier\" (i.e., industry-wide AI slowdown that looks like cartel behavior)", "created_at": "2026-10-04T03:17:08+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "neurasleaze", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106355066915446945", "url": "https://x.com/DaveRBanerjee/status/2106355066915446945", "text": "@Yixiong_Hao I feel like misalignment people are sometimes offended that cybersec ppl are trying to “own” the recent incidents. Though I haven’t seen personal attacks yet", "created_at": "2026-10-03T12:05:56+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Yixiong_Hao", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106352452341825891", "url": "https://x.com/DaveRBanerjee/status/2106352452341825891", "text": "@macaronidt @3blue1brown Ohhhh i see — thanks for clarifying", "created_at": "2026-10-03T11:55:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "macaronidt", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106200664594616528", "url": "https://x.com/DaveRBanerjee/status/2106200664594616528", "text": "@3blue1brown I’m confused—I thought YouTube always had AB testing. I could swear that Veritasium video titles would change multiple times in my feed…", "created_at": "2026-10-03T01:52:24+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "3blue1brown", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106149595353059559", "url": "https://x.com/DaveRBanerjee/status/2106149595353059559", "text": "@AbHomineDeus @lumpenspace that was one of many incidents", "created_at": "2026-10-02T22:29:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "AbHomineDeus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106049092526788880", "url": "https://x.com/DaveRBanerjee/status/2106049092526788880", "text": "@lumpenspace @AbHomineDeus I'd guess that most of that was explained by everyone at OAI being freaked - not the OAI safety team convincing everyone to be freaked out", "created_at": "2026-10-02T15:50:06+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "lumpenspace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105840932524605781", "url": "https://x.com/DaveRBanerjee/status/2105840932524605781", "text": "@AbHomineDeus @lumpenspace fair, but I would guess that the safety team at OAI does not wield much power to affect model deployment decisions", "created_at": "2026-10-02T02:02:57+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "AbHomineDeus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105757059962572993", "url": "https://x.com/DaveRBanerjee/status/2105757059962572993", "text": "@yoshua_turner00 @LeRoyDesCimes quick stream of consciousness thoughts:\n\nRE neglectedness: I estimate there are 20-30 FTEs working on CoP. I'd guess there are around 500-1000 working on ASI takeover threat models\n\nIt's hard to say how likely ASI takeover is, but it's anywhere between 10-90%. I'd guess that P(extreme power concentration) is around 10-25%. All of these numbers are v rough though\n\nYou don't need ASI to have permanent concentration of power. AGI is probably sufficient. So if you expect a v slow takeoff, then the \"time of perils\" for CoP can be long\n\nI think that CoP work is probably quite tractable and time sensitive. i.e., I think that we're in crunch time for CoP rn. Most mitigations for CoP have very very long lead times, so working on it now seems v important", "created_at": "2026-10-01T20:29:40+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "yoshua_turner00", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105301135213085100", "url": "https://x.com/DKokotajlo/status/2105301135213085100", "text": "RT @v_maini: As former comms staff at a frontier lab, I'll point out that only 5 of 12 interviews on https://t.co/AHSlgEi5MB are from curre…", "created_at": "2026-09-30T14:17:59+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 184, "retweets": 23, "media": [], "quoted": null}, {"id": "2105001676658864482", "url": "https://x.com/DKokotajlo/status/2105001676658864482", "text": "RT @ciphergoth: @ben_j_todd AFAICT \"doomer\" gets used to refer to everyone who thinks there's a real risk, so 63% of Americans are \"doomers…", "created_at": "2026-09-29T18:28:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 66, "retweets": 1, "media": [], "quoted": null}, {"id": "2104997193782612457", "url": "https://x.com/DKokotajlo/status/2104997193782612457", "text": "RT @deanwball: Some people will look at misalignment incidents and insist that these are akin to bugs in traditional software. This is an a…", "created_at": "2026-09-29T18:10:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 494, "retweets": 57, "media": [], "quoted": null}, {"id": "2104996787035791511", "url": "https://x.com/DKokotajlo/status/2104996787035791511", "text": "RT @eli_lifland: Yup, OpenAI delaying public deployment while continuing internal development and deployment increases the size of the inte…", "created_at": "2026-09-29T18:08:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 106, "retweets": 12, "media": [], "quoted": null}, {"id": "2104991538623508905", "url": "https://x.com/DKokotajlo/status/2104991538623508905", "text": "RT @tedlieu: Dude, so you’re telling us that multiple AI companies lost control of their models, hacked other companies and government agen…", "created_at": "2026-09-29T17:47:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 1154, "retweets": 202, "media": [], "quoted": null}, {"id": "2104991256900517994", "url": "https://x.com/DKokotajlo/status/2104991256900517994", "text": "RT @TheZvi: In 'well when you put it like that' news, here's the Florida Attorney general asking for a preliminary injunction to stop OpenA…", "created_at": "2026-09-29T17:46:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 1527, "retweets": 160, "media": [], "quoted": null}, {"id": "2104778204372517271", "url": "https://x.com/DKokotajlo/status/2104778204372517271", "text": "RT @_achan96_: Could automating AI R&amp;D radically accelerate AI progress in an “intelligence explosion”?\n\nPreliminary evidence suggests that…", "created_at": "2026-09-29T03:40:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "likes": 414, "retweets": 98, "media": [], "quoted": null}, {"id": "2105918664344269008", "url": "https://x.com/DKokotajlo/status/2105918664344269008", "text": "This is terrible and a clear effort to undermine safety research, whistleblowing, and the raising concerns policy.", "created_at": "2026-10-02T07:11:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "manlikemishap", "rt_author_name": "pamela mishkin", "likes": 122, "retweets": 7, "media": [], "quoted": null}, {"id": "2106015686833365207", "url": "https://x.com/DKokotajlo/status/2106015686833365207", "text": "Sarah is Head of Public Policy at Anthropic. My read: she picked up on Anthropic’s implicit worldview, but didn’t realize she wasn’t meant to say the quiet part out loud, since EAs at Anthropic are still claiming to care about the kind of safety you can do from second place.", "created_at": "2026-10-02T13:37:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "RichardMCNgo", "rt_author_name": "Richard Ngo", "likes": 916, "retweets": 35, "media": [], "quoted": null}, {"id": "2106494607316152703", "url": "https://x.com/DKokotajlo/status/2106494607316152703", "text": "I hope one day people joke about AI existential risk the way they joke about Y2K", "created_at": "2026-10-03T21:20:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "RosieCampbell", "rt_author_name": "Rosie Campbell", "likes": 672, "retweets": 37, "media": [], "quoted": null}, {"id": "2106493524137144344", "url": "https://x.com/DKokotajlo/status/2106493524137144344", "text": "David’s right. \n\nI regret helping spread the idea of “iterative deployment” which maybe briefly made sense in the GPT-3 era but makes no sense at all after many deaths have been tied to AI and as we’re careening towards extinction-level risks.\n\nThe industry needs to mature ASAP.", "created_at": "2026-10-03T21:16:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "Miles_Brundage", "rt_author_name": "Miles Brundage", "likes": 341, "retweets": 34, "media": [], "quoted": null}, {"id": "2106493123031699470", "url": "https://x.com/DKokotajlo/status/2106493123031699470", "text": "I agree with this.", "created_at": "2026-10-03T21:14:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 101, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "To be quite frank, a lot (not all!) of these “rogue agent hacks” on government statistical websites are things that think-tank interns and research assistants have done for many years. I have known many a think tank paper that was enriched by an enterprising RA using eg urlquery to find CSVs and PDFs on government agency websites that were publicly accessible and non-sensitive but nonetheless not things the agency *intended* to be on their website. Is it “hacking” to find those things? Is it hacking in the even more innocuous examples where agents are literally just accessing tabular data available on a government statistical website, just a version of that data that is easier to access and analyze programmatically? \n\nThis constant trickle of examples (which tbc I have personally seen many models do, before I joined OpenAI; it is even something I have discussed with models before!) will probably have the effect of diminishing the importance of “an AI hack” on the eyes of the observing public by creating an oversupply of “AI hack” examples. OAI-HF was an example of AI hacking. Many of these more recent examples, very candidly, are straining the definition of the word “hack” and, I worry, cheapen the non-technical public’s understanding of that concept."}}, {"id": "2106491392923250876", "url": "https://x.com/DKokotajlo/status/2106491392923250876", "text": "Another one quits. I agree with what he says here: iterative deployment needs to be phased out asap, more costly and time consuming understanding and foresight and redundancy based safety practices need to arise instead. And that simply won't happen under anything like current race conditions.", "created_at": "2026-10-03T21:07:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 378, "retweets": 26, "media": [], "quoted": {"author": "BogdanIonutCir2", "text": "'What I’m about to tell you has, I realize, become something of a cliché: I resigned this week from OpenAI. I led the writing of the safety reports we published with each major launch.'\nhttps://t.co/so73hG1MG7"}}, {"id": "2106490020198838595", "url": "https://x.com/DKokotajlo/status/2106490020198838595", "text": "if we are relying on methods as fragile as “which ideas will make it into pretraining” for aligning the superintelligences of the future, we will all die. this resembles witchcraft more than it does engineering, and cannot be the basis for the safety of future models", "created_at": "2026-10-03T21:02:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "likes": 1859, "retweets": 130, "media": [], "quoted": null}, {"id": "2106773679652864027", "url": "https://x.com/DKokotajlo/status/2106773679652864027", "text": "This made me laugh.\n\nhttps://t.co/0VOqfsOQTJ https://t.co/XJocUwOkxA", "created_at": "2026-10-04T15:49:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AdrienneLaF", "rt_author_name": "Adrienne LaFrance", "likes": 9371, "retweets": 669, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTnvkShWEAASunT.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106494789978148916", "url": "https://x.com/DKokotajlo/status/2106494789978148916", "text": "@TraderLows Yeah I haven't reassessed yet but it's not looking great.", "created_at": "2026-10-03T21:21:09+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "TraderLows", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105445452594434145", "url": "https://x.com/DKokotajlo/status/2105445452594434145", "text": "@hilbertspaess Imo it's waaaay too weak sauce for it to be a significant positive update. Might even be a negative update insofar as it is evidence they aren't going to go further soon.", "created_at": "2026-09-30T23:51:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "hilbertspaess", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 187, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104999492613488887", "url": "https://x.com/DKokotajlo/status/2104999492613488887", "text": "@bryan_caplan What are your terms exactly? I might be interested.", "created_at": "2026-09-29T18:19:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "bryan_caplan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2107080095613780330", "url": "https://x.com/DKokotajlo/status/2107080095613780330", "text": "I'm a longtime Effective Altruist and the co-founder of the organization most frequently used as a stand-in for \"EAs have lost their minds\" (a.k.a. Shrimp Welfare Project). I've also read The Economist for over 20 years, so I was disappointed by how they portrayed a community I feel proud to be part of.\n\nI never post but I could hardly believe the verbal gymnastics one needs to do to make things like “taking moral commitments seriously” and \"considering evidence and odds explicitly, correcting for biases\" sound like the problem. I felt I had to speak my mind. \n\nSome of the implicit criticisms of EA are that we're young, inexperienced, from elite universities, polyamorous, wildly eccentric, etc. FWIW, I'm in my mid-40s, Mexican, straight, have a beautiful wife and 2 kids, and I grew up in a mid-sized conservative city with loving parents who got divorced when I was six. Pretty standard.\n\nAfter my parents divorced, my mom frequently had to make difficult economic choices, like whether to buy flowers for our kitchen table and eat only quesadillas, or eat something a tiny bit fancier. I always told her I loved quesadillas because I knew flowers made her happy. \n\nAfter graduating from a public university, I worked in finance for ~15 years and saved as much as I could so I could spare my wife and future kids the economic hardships I experienced. In that time I met thousands of people in finance, corporate law, accounting, real estate, insurance, etc. Most were decent, well-educated, ambitious and smart, all doing their best to excel in their professions. Most wanted to make money and improve their own and their loved ones’ quality of life. Nothing to see here. \n\nSince I found Effective Altruism ~7 years ago, most of the people I come across are of a different rarer kind. They come from all over the world, in all shapes and sizes, but they have the one thing in common: they want to improve the world using evidence and reason wherever that leads them. Yeah, they/we make a ton of mistakes like everyone but, IMHO tend to own them more frequently than the average person.\n\nI've met people who could easily be making >100% more money in a normal job, but instead they dedicate themselves to improving the lives of those who need it the most. People in the poorest countries whose children die from preventable diseases, from lack of basic medical equipment or vaccination, from lead in paint. Animals in factory farms subjected to conditions that most people find abhorrent, doesn't matter if you're vegan, vegetarian or a huge meat lover.\n\nYes, recently many of the people in my community are moving to work on making sure that AI and other powerful new technologies don't result in terrible things for humanity. I'm one of those people and contrary to what the article would suggest, it has nothing to do with the fact that SBF committed one of the biggest frauds in history or that someone wrote hundreds of thousands of words of fan fiction. I'm doing it because I want to do the little that's in my power to make the world that my kids and grandkids (and yes, potentially their great-great-grandchildren) will inherit a better one.\n\nEA gave me a way to do that and I will be forever thankful. So no, I'm not EA-adjacent.\n\nhttps://t.co/tajXcXOZ06", "created_at": "2026-10-05T12:06:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "andres_swp", "rt_author_name": "Andres Jimenez Zorrilla", "likes": 591, "retweets": 73, "media": [], "quoted": null, "fetched_at": "2026-10-05T22:01:58.322087+00:00"}, {"id": "2105689480539557938", "url": "https://x.com/dwarkesh_sp/status/2105689480539557938", "text": "New episode with military historian Si Sheppard.\n\nThe conquests of the Aztec and Inca empires might be the most shocking events in human history.\n\nHernan Cortés and some hundreds of Conquistadors landed on a new continent they knew basically nothing about, and within 2 and a half years, conquered the 6 million strong Aztec empire.\n\nThen, a decade later, Francisco Pizarro did the same thing to an Incan Empire of some 10 million inhabitants.\n\nIn both cases, the Conquistadors consistently beat native armies while being literally 100x (or even in some cases 1000x) outnumbered - and in many cases, did so without taking a single casualty.\n\nAnd they did this with 99% of their military forces being made up of the very natives they were trying to subjugate.\n\nWe often forget how wild human history is. People talk about AI takeover as if it would be some crazy, unprecedented sci-fi outcome. But this would not be the first time an alien force whose motives the defenders barely understand use more advanced technology and diplomatic cunning to outmaneuver and then take over a much larger and long established existing order.\n\n0:00:00 – Cortés’s conquest of the Aztecs\n0:22:39 – Pizarro’s conquest of the Inca\n0:26:59 – Explaining Conquistador military superiority\n0:34:39 – Could the natives have beat the Conquistadors?\n0:48:56 – The Aztecs and Incas did not learn from each other\n0:56:11 – Why Spain still lost in the long run\n1:07:47 – Why didn’t the Aztecs/Incas adapt better to European warfare?\n1:14:16 – Conquistador motivation\n1:26:22 – Why Mughal India also couldn't play the Europeans off each other\n1:33:42 – Diplomacy was just as important as technology", "created_at": "2026-10-01T16:01:08+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 577, "retweets": 43, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HTjpehMawAAriZx.jpg"}], "quoted": null}, {"id": "2106079073902760088", "url": "https://x.com/dwarkesh_sp/status/2106079073902760088", "text": "We really can't fathom how crazy it was to find another  continent on the other side of the ocean full of millions of people and thriving civilizations. Imagine if we landed humans on the dark side of the moon in 1969 and there was a billion people living there in a moonopolis", "created_at": "2026-10-02T17:49:14+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "is_retweet": true, "rt_author": "tensor_rotator", "rt_author_name": "Alek Dimitriev", "likes": 270, "retweets": 14, "media": [], "quoted": null}, {"id": "2105362675509404011", "url": "https://x.com/Lewis_Bollard/status/2105362675509404011", "text": "The pork industry rejects the term \"factory farm,\" insisting that family farmers raise pigs just like they always have.\n\nBut 50 years ago this month, in September 1976, Hog Farm Management magazine wrote: \"Forget the pig is an animal. Treat him just like a machine in a factory.\"\n\nThat was the plan. And they acted on it: they soon moved pregnant sows into gestation crates and grower pigs into giant dark warehouses.\n\nIn 1976, most US pigs were on small farms with fewer than 500 pigs. Today most are in factory farms with more than 5,000. The consolidation put roughly 90% of US pig farmers out of business.\n\nThe promise was that industrialization would dramatically lower pork prices. But, in real terms, pork costs about the same today as it did in the 1970s.\n\nThe farmers got bankrupted and the pigs got crated. Only the factory farming corporations won.", "created_at": "2026-09-30T18:22:32+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "is_retweet": false, "likes": 300, "retweets": 85, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTe5qaRa0AA0kos.png"}], "quoted": null}, {"id": "2105362896050065494", "url": "https://x.com/Lewis_Bollard/status/2105362896050065494", "text": "H/T to @mbolotnikova, who wrote this great piece tracking down this quote and others like it by the pork industry \n\nhttps://t.co/RhrcF0L5AI", "created_at": "2026-09-30T18:23:24+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "Lewis_Bollard", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105711900193337753", "url": "https://x.com/mentalgeorge/status/2105711900193337753", "text": "New friendship unlocked: https://t.co/9OnD4XbYFw", "created_at": "2026-10-01T17:30:13+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 267, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjpgEvbYAAqoCE.jpg"}], "quoted": null}, {"id": "2105690274672628151", "url": "https://x.com/mentalgeorge/status/2105690274672628151", "text": "Under-rated excerpt from @RichardMCNgo's critique of Plan A, in which he tries to explain the less-than-predicted impact of the already-super-smart AIs we have today.\n\nTo translate the raw problem-solving power of a billion superintelligences into scientific progress requires\n1. sophisticated cooperation; and\n2. aligned incentives.\n\nEg it's easy to see how a country of geniuses pumping out \"research\" that's optimised for the (many) slop journals of washademia would produce very little technological progress.\n\nThe work of figuring out which scientific problem to solve next is something that is currently (and imperfectly) solved by very diffuse mechanisms throughout society. Maybe there does exist some level of intelligence that lets you top-down plan your tech tree, but I'd wager it arrives *after* the models are capable of Extreme Science Mode", "created_at": "2026-10-01T16:04:17+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTjqJUcbwAAH0wt.png"}], "quoted": null}, {"id": "2106047618811826596", "url": "https://x.com/mentalgeorge/status/2106047618811826596", "text": "Nothing more satisfying than seeing someone go to the mat for a proposition that sounds intuitively absurd.\n\nI have no organic inclination to give AIs rights, but @simondgoldstein makes a strong case for it in this interview with my colleague Zershaaneh\n\nhttps://t.co/hrqfYizppP", "created_at": "2026-10-02T15:44:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null}, {"id": "2107023143344971857", "url": "https://x.com/mentalgeorge/status/2107023143344971857", "text": "Say you let Opus 4.7 play 1 billion games of online chess.\n\nBetween games, it can reflect on its play and write .md files to itself for future match-ups. \n\nHow much does its Elo change?", "created_at": "2026-10-05T08:20:38+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "likes": 96, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2106818428988514667", "url": "https://x.com/mentalgeorge/status/2106818428988514667", "text": "@petergostev notable that this runs counter to how (a small sample of) people were predicting a version of this experiment this would play out back in May https://t.co/qA1r0UOkC1", "created_at": "2026-10-04T18:47:10+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "petergostev", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTzsA5XWMAAWrve.jpg"}], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2104977463432626485", "url": "https://x.com/ohlennart/status/2104977463432626485", "text": "RT @Noahpinion: Germany is slowly waking up, but decades too late", "created_at": "2026-09-29T16:51:50+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 295, "retweets": 12, "media": [], "quoted": null}, {"id": "2104973509663633749", "url": "https://x.com/ohlennart/status/2104973509663633749", "text": "RT @pietergaricano: @salonium You can just delete mosquitoes! https://t.co/S1VcEModlv", "created_at": "2026-09-29T16:36:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": true, "likes": 977, "retweets": 133, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTZC-xLWoAAfjBR.jpg"}], "quoted": null}, {"id": "2105704438405189755", "url": "https://x.com/ohlennart/status/2105704438405189755", "text": "Underrated and under-discussed available breakout plan: steal the model weights.", "created_at": "2026-10-01T17:00:34+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 75, "retweets": 3, "media": [], "quoted": {"author": "anton_d_leicht", "text": "Most countries won't do what it takes to build their own frontier AI. But they don't want to be dependent on foreign AI without a backup. \n\n@SamWinterLevy and I argue there's a middle path: AI middle powers could retain 'AI Breakout Capacity'. \n\nThere's precedent: Japan doesn't have a nuclear weapon, but always retains the capacity to build one on short notice.\n\nMiddle powers can make strategic choices today to ensure their ability to build frontier systems tomorrow: onshore compute, secure chip purchasing rights, sustain pre-training expertise, and create the right legal basis and private-sector vehicles for a sprint.\n\nThey'd still have to spend big to build frontier systems later on. But the longer they retain breakout capacity, the longer they can afford to wait: to see if interdependence with America can work, or until their electorate will let them go all-in on an AI moonshot. \n\nUntil then, the middle path is their wisest choice: hope that U.S. alignment works out, but retain the capacity to deal with being cut off for good. \n\nRead more in our latest for @CarnegieEndow's @CEIPTechProgram:  https://t.co/FWYgzMgbPm"}}, {"id": "2106138140142604648", "url": "https://x.com/ohlennart/status/2106138140142604648", "text": "I'm adopting SI. Would you really sell SUPER INTELLIGENCE chips to China?", "created_at": "2026-10-02T21:43:57+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 71, "retweets": 3, "media": [], "quoted": null}, {"id": "2105323968001626157", "url": "https://x.com/ohlennart/status/2105323968001626157", "text": "@metaculus @nanransohoff @georgecaweiner @cogcelia Looks like you missed to estimate the giving from the OpenAI Foundation? https://t.co/isDoWOPvBs", "created_at": "2026-09-30T15:48:43+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "metaculus", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-05T11:46:34.718681+00:00"}, {"id": "2105472435390906634", "url": "https://x.com/sayashk/status/2105472435390906634", "text": "I have been using the new ultrafast mode for Astra 6 for the last couple of days. My main takeaways:\n\n1. Token speed qualitatively changed how I interact with agents. The output speed is 300 tokens/second, 8x the regular speed. Rather than breaking flow and switching tasks, the model moves (just) fast enough that I can keep working on the same task, especially for work that requires frequent inputs from me. I am excited about ultrafast on Sol-class models, which are twice as fast as Astra.\n\n2. Despite being 8x faster at generating tokens, the overall speedup is only 2-4x, since the time consumed for tool calling or running code remains the same. External factors (and not token generation speed) might soon become the main bottleneck for agentic work. (Notably @random_walker predicted both of these changes in: https://t.co/BXNtg9vzCt)\n\n3. One area where speed really helps is computer use. The previous generation of models wasn't reliable enough at computer use to be useful. Astra was reliable enough to be useful, but still slow. Astra with ultrafast resolves both concerns. Unlike tool calls for coding tasks, UIs react in milliseconds, so token speed is the main bottleneck.\n\n4. At 300 tokens/sec, I am already struggling to keep up with the agent. But there is a lot more room for improvement. Cerebras serves GPT-OSS-120B at 3,000 tokens/sec and Sol at 750 tokens/sec. So in a year's time, it is plausible we'll see another 10x increase in speed in models with Astra-level capabilities. At that point, human oversight will become the bottleneck for what people can use computer-use agents for.\n\n5. I can imagine blazing fast computer-use agents becoming extremely common for knowledge work. But I expect their use will be jagged (in the same way as LLM and agent adoption has been): given the oversight challenge, adoption will begin in verifiable tasks where the cost of errors is low (e.g., filling out a form using an agent before reviewing it yourself), and slowly diffuse to hard-to-verify tasks.\n\n6. Given the challenges with human oversight, the key to this diffusion will be developing automated oversight tools. OpenAI's approval/verifier agents have already been useful to me on this front: The verifier understood my intent better than the computer-use agent, and stopped it from filling out a form incorrectly. Still, I expect there is a lot of headroom in improving verifiers for computer use, to make it as reliable in practice as auto mode in Claude Code/Codex is for coding tasks.\n\n7. Ultrafast mode is undeniably resource intensive: I ran through my weekly limit in ~2 hours while filling out a bunch of forms and doing simple coding tasks. But given the pace of efficiency improvements (and the fact that Sol is 5x cheaper than Astra and already decent at computer use), I expect it to rapidly fall. Once fast, cheap models are common, users may choose \"sub-frontier\" models like Sol and make real tradeoffs between speed and quality.", "created_at": "2026-10-01T01:38:41+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "likes": 164, "retweets": 23, "media": [], "quoted": {"author": "random_walker", "text": "Prediction: we will soon enter an era where the latency of agentic work is bottlenecked not by LLM inference speed but by tool use. Shell commands, build pipelines, computer use, web data extraction, and everything else that happens in the background is way slower than it needs to be, because it hasn't been subjected to the same kind of optimization pressure as LLMs, and isn't really getting faster."}}, {"id": "2105749449679196454", "url": "https://x.com/sayashk/status/2105749449679196454", "text": "New essay: A big-tent or small-tent AI safety movement?\nThe unstated disagreement that underpins safety debates\nhttps://t.co/4T9n7BLTWX\n\nTwo narratives about AI safety have emerged: either AI existential risk is real and imminent, or AI leaders’ and whistleblowers’ claims to that effect are insincere — a “psyop” or hype or a twisted form of regulatory capture.\n\nFew have considered the third possibility that x-risk warnings are sincere but simply wrong and counterproductive to AI safety. It’s as if everyone takes for granted that those raising the alarm are geniuses, and the only question is whether they’re the benevolent or the evil kind of genius.\n\nWe subscribe to neither narrative. In our writing on AI safety, @sayashk and I consistently tried to take the arguments seriously but rebut the many claims we think are unsound while highlighting safety concerns that we think are real. This essay is a continuation of that agenda.\n\nSections\n- It is true that we systematically underinvest in resilience against catastrophic and systemic risks\n- The Coxon incident shows how the warped media environment elevates x-risk over more grounded concerns\n- Why the x-risk framing may be counterproductive for AI safety policy\n- Conclusion: a big tent or small tent AI safety movement?", "created_at": "2026-10-01T19:59:26+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 74, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTkfpyBW4AALqBe.jpg"}], "quoted": null}, {"id": "2105704922499150308", "url": "https://x.com/sayashk/status/2105704922499150308", "text": "I had way too much fun using Claude to create a reply video. \n\n- Extremely fun to be able to convert scattered thoughts and ideas into a song + video\n\n- Creating this took <1 hour of my time (in occasionally steering the model in between other things)\n\n- But it took ~10 hours of wall clock time for the agent to generate the video + iteratively refine it based on feedback\n\n- In terms of AI usage: it required only a small number of Suno credits and 10% weekly usage of a Claude Max subscription (I was using Opus 5.5)", "created_at": "2026-10-01T17:02:30+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 336, "retweets": 33, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105703951593357314/img/yW0syBEppU_Lp3T5.jpg"}], "quoted": {"author": "sevdeawesome", "text": "Claude 5.5 Opus responding to “AI is a normal technology” is still the best AI-created video I have ever seen https://t.co/1FEdlSDqeV"}}, {"id": "2105700428772175931", "url": "https://x.com/sayashk/status/2105700428772175931", "text": "*Against today's high friction trusted cyber access programs and against restricting open-wei
