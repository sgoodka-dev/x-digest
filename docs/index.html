o/ypedz0NcCL", "created_at": "2026-10-22T15:57:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Iliad_research", "rt_author_name": "Iliad", "likes": 60, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVPms_UXgAAoGnL.jpg"}], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113298193416933453", "url": "https://x.com/sethlazar/status/2113298193416933453", "text": "@robertwiblin zero hard power is a bold claim when you can just look at the news in France rn", "created_at": "2026-10-22T15:55:27+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "herbiebradley", "rt_author_name": "Herbie Bradley", "likes": 12, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113297933542002976", "url": "https://x.com/sethlazar/status/2113297933542002976", "text": "I continue to find this view baffling. It presupposes that the only reason people have power over elites is through their labour, but this is historically just not true. The masses have power over elites when and because they organise, collectively, and increase the costs of elite self-prioritisation. Strikes/withdrawal of labour are one way to do that, but so is, frankly, revolution (in highly kinetic forms as well as more non-violent ones). \n\nOf course we can stipulate that, using AI, elites will be able to protect themselves against this kind of mass political action. But (a) massive oppression is very hard to do (big cold-start problem in democracies) and (b) the moral costs will be extraordinary; it's not unreasonable to believe that elites will be unwilling to engage in the level of psychotic coercive control that would be needed to leave the masses entirely out in the cold. \n\nThis doesn't make for an especially bright future—still very likely that the kind of bargain that can be won by this means won't be great. But the political economy isn't hopeless...", "created_at": "2026-10-22T15:54:25+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": {"author": "robertwiblin", "text": "Ordinary people likely won't be able to demand/keep a universal basic income after superintelligence.\n\nThe political economy is hopeless: they have nothing to offer in return and zero hard power.\n\nThe problem has been known for decades. Here are the solutions I've heard proposed: https://t.co/Ur7b0CxF7d"}, "fetched_at": "2026-10-22T19:13:49.199459+00:00"}, {"id": "2113655834047590574", "url": "https://x.com/sethlazar/status/2113655834047590574", "text": "@joshalbrecht Well I think UBI is the minimal trade which is what he said we won't get?\n\nThe take is baffling to me because people are willing to assert strong claims of inevitability on the basis of first-principles reasoning that the history of human society broadly falsifies. \n\nI think it's useful to elicit these points of distinction. One way to flesh out your (1) is that \"because the technology is so different from anything that has gone before, we can learn ~nothing from the study of human society about what will happen\". This is a very strong claim, which I think you'd probably not reflectively endorse. But if you endorsed it, would the solution be \"based on necessary truths alone I can with high confidence infer what will happen\"?  Surely not. If history and the study of human society is no guide, then we are in the dark about what will come, and we shouldn't pretend that first-principles reasoning give us more visibility into the future than they do.", "created_at": "2026-10-23T15:36:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113654673294979568", "url": "https://x.com/sethlazar/status/2113654673294979568", "text": "@GeorgeE33179 Lots of interesting qualifications in there! I just think there are many, many assumptions that you're treating as given that I would regard as contentious at best, implausible at worst, but we've probably reached the point of diminishing returns in this conversation so I'll bow out; thanks for the exchange!", "created_at": "2026-10-23T15:31:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113653540866372005", "url": "https://x.com/sethlazar/status/2113653540866372005", "text": "@robertwiblin We don't quite agree yet—my point is that even when the military is fully mechanised, the amount required to forestall revolution will not be nothing, it will be *willingness to engage in massive, brutal, and pervasive oppression*. We have definitely seen examples of this in the past—colonialism, again—but I think the likelihood of a transition in the next few decades from liberal democracy to internal colonialism is pretty small, and definitely bears the burden of proof, rather than being a default outcome. \n\nI also think that even if/when the military is fully mechanised, that will not mean resistance is futile, because I think as asymmetries of force increase, you also find asymmetries in tolerance for cost. \n\nThe argument might then be that elites will sequester themselves away from the rest of humanity so that they are simply untouchable; but then history suggests that there will be divisions among elites, including that some will both want and find it convenient to mobilise and act with the masses. \n\nThe vision you're describing requires an unprecedented level of agreement among elites, as well as appetite for inequality and hostility to human freedom. It also underestimates the weapons of the weak. We've had plenty of conflicts in which one side has had an overwhelming technological advantage over the other. But there are always vulnerabilities...", "created_at": "2026-10-23T15:27:28+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113640948492042622", "url": "https://x.com/sethlazar/status/2113640948492042622", "text": "@MacZajak Ok well, hmm. You went ad hominem and said \"you obv haven't researched this topic\". I replied to that, I didn't appeal to authority. I also didn't say \"effective non-violent protest is possible even when the protesters wield no economic power\", instead I said there are lots of ways to raise the costs of elite self-prioritisation besides withdrawing labour. I think my observation is sufficiently commonplace that you're better off just going and reading about it on your own than sea-lioning me.", "created_at": "2026-10-23T14:37:26+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MacZajak", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113639226528891232", "url": "https://x.com/sethlazar/status/2113639226528891232", "text": "@GeorgeE33179 No there are different forms of techno determinism. One is macro—the technology is inevitable. The other is micro—this technology will necessarily have a particular set of outcomes. Both are implausible, for different reasons. If you’d like a reading list I’d be happy to help; the views you’re espousing are understandable but they don’t tend to withstand much engagement with actual scholarship on this topic.", "created_at": "2026-10-23T14:30:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113638764400505332", "url": "https://x.com/sethlazar/status/2113638764400505332", "text": "@robertwiblin But if you’re aware of the record, surely you wouldn’t be as deterministic or simplistic in your presentation of what lies ahead? And the long era that you describe is one in which freedom has grown with technology, not diminished, so it’s not clear how it supports your model. And the transition to powerful AI *is* going to take place over decades, not centuries, so those kinds of social and productive relations are going to be informative.\n\nI think a much more plausible modal outcome is one in which just enough is provided to the masses to appease and forestall revolution. This would seem well supported by history, game theory, economics etc etc. Which is a shitty outcome to be sure but it’s not the one you’re describing. The only precedent for your one, I think, would be colonialism, and we also have precedent for how that was overthrown (in part because it lost moral legitimacy among the colonisers).\n\nI’ll listen to the historian podcast (as you know I enjoy your interviews). But I’d be reasonably willing to bet that no historian would make such a confident claim about the future as your original post.", "created_at": "2026-10-23T14:28:45+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113620856090030343", "url": "https://x.com/sethlazar/status/2113620856090030343", "text": "The Alignment Journal opened to submissions yesterday. A big thank you to Principles of Intelligence (@PrincInt), our fiscal sponsor, and to the people of @Iliad_research, whose operational support got us this far! 🫶", "created_at": "2026-10-23T13:17:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AlignmentJrnl", "rt_author_name": "AlignmentJournal", "likes": 20, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113609869857018240", "url": "https://x.com/sethlazar/status/2113609869857018240", "text": "@robertwiblin You don’t have to reason about this from first principles. This is clearly an object of study: what sustains voluntary social stability? We have a track record of millennia to consider, with many analogues and natural experiments. Much of that track record would push against the argument you’re making here. Some of it supports it. I think your broader project of informing a sceptical public would be strengthened by doing that kind of research rather than treating this as though it were a philosophical problem only.", "created_at": "2026-10-23T12:33:56+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "robertwiblin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113608580070858878", "url": "https://x.com/sethlazar/status/2113608580070858878", "text": "Do you have high quality work on the foundations of responsible computing, writ large? This covers everything from work on differential privacy to algorithmic fairness to designing mechanisms and markets to AI alignment. (Submit to FORC!) 1/ https://t.co/1O4doAQ38c", "created_at": "2026-10-23T12:28:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Aaroth", "rt_author_name": "Aaron Roth", "likes": 21, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113607645450096929", "url": "https://x.com/sethlazar/status/2113607645450096929", "text": "@MacZajak Which it seems like you believe to be an empty set? Actually this is something I’ve written about and researched pretty thoroughly, tho I’ll admit to that being mostly in the early 2010s. But obviously you’re not actually trying to have a serious conversation here, so ✌️", "created_at": "2026-10-23T12:25:06+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "MacZajak", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113606943935742430", "url": "https://x.com/sethlazar/status/2113606943935742430", "text": "@GeorgeE33179 This book is cool but it’s journalism, I wouldn’t base any substantive views about technology on it. And the kind of technological determinism you’re pointing out—people have argued about that forever. The Mumford style authoritarian technic notion is one view; I don’t find it at all convincing. I do think technologies have inherent pushes and pulls, but they aren’t decisively determinative. Again, suppose the authoritarian technics view were true—then we’d have seen it in the history of technology, there’d be a clear track record to point to. \n\nThe truth is I think closer to the Lewis point in the abolition of man piece I quote posted the other day. These technologies extend agency; they do so for the rulers but also for the ruled. And they always have blind spots and limitations. \n\nI don’t think the most likely outcome given AGI is global genocide. I don’t think such an outcome is impossible or to be dismissed, but I think that for global genocide to take place you’d have to have an elite that is willing to conduct it, and a mass population that is willing to let it happen to them. Neither prospect looks like a reasonable extrapolation from the world today—remembering that AGI, if developed, is pretty likely to be developed in the next ten years.", "created_at": "2026-10-23T12:22:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113604594626376106", "url": "https://x.com/sethlazar/status/2113604594626376106", "text": "@joshalbrecht I do think that being in SF likely gives you a distorted view of this… At the margin, some people will want to exit society, and have the means to do so. But (a) they won’t *need* to immiserate everyone else in order to do so and (b) they mostly won’t want to—or enough of them will not want to that there will be other people with resources to fight back. Again the history of empire is pretty informative here—it didn’t collapse just because of resistance, but because it lost even the illusion of moral legitimacy and elites disagreed.  \n\nBut also just look at what’s happening now w data centres, and how popular dissatisfaction is changing the option set for these trillion dollar companies. People *are* organising.\n\nTo be clear, I don’t think this gets us to egalitarian paradise. Same as before, I reckon we get something like the minimal trade that preserves social stability, which would likely be a very inegalitarian one. \n\nAlso, this is all still pretty vibesy, even on my part. We don’t have to reason about this in the abstract, we can draw on the history of social science, and the study of social order. I do plan to write something proper on this soon…", "created_at": "2026-10-23T12:12:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113487306870989133", "url": "https://x.com/sethlazar/status/2113487306870989133", "text": "@joshalbrecht But there have been comparable asymmetries of technological advantage in the past. Even, frankly, in the present.  What we see with asymmetric conflict  is that the more powerful side's differential advantage in firepower tends to be inversely matched by a differential deficit in tolerance for losses. The costs elites are willing to bear for the sake of maintaining absolute control tend to diminish. \n\nAnd if one elite has 100 t1000s, then there's bound to be another who's got 10 who disagrees with the first one.", "created_at": "2026-10-23T04:26:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113486325256990850", "url": "https://x.com/sethlazar/status/2113486325256990850", "text": "@GeorgeE33179 I think it is simply much more complex, and that people are much more capable of overthrowing oppression, and have much less appetite for being oppressors, than you are imagining. My point, to be clear, is not that things are definitely going to be fine. It's that the techno-pessimism and determinism in the OP is not justified by an actual understanding of history and politics. If there are historical trends and analogues that point in both directions, then the correct conclusion is not \"one of these possible outcomes is inevitable\" but politics (and political economy) are complicated, and nothing is a foregone conclusion.", "created_at": "2026-10-23T04:23:01+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113455921087017162", "url": "https://x.com/sethlazar/status/2113455921087017162", "text": "@GeorgeE33179 Ah but your complete extrapolation, based on… nothing at all beyond a priori reasoning… is fiiiine. If a priori reasoning were sufficient to understand human behaviour then the philosophers (like me…) would in fact rule the world.", "created_at": "2026-10-23T02:22:12+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113441925260820675", "url": "https://x.com/sethlazar/status/2113441925260820675", "text": "@joshalbrecht We already have the ability for elites to sequester themselves from the masses. Look also at the history of colonialism. Any history really…", "created_at": "2026-10-23T01:26:35+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113441586466136165", "url": "https://x.com/sethlazar/status/2113441586466136165", "text": "@GeorgeE33179 I dunno. My view seems pretty well supported by history. Yours is just based on vibes and first principles ¯\\_(ツ)_/¯", "created_at": "2026-10-23T01:25:14+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113397980929901014", "url": "https://x.com/sethlazar/status/2113397980929901014", "text": "@GeorgeE33179 Yeah yeah, I anticipated that point. Raising costs doesnt mean defeating. Also includes raising moral costs. Many times in history a minority has had an overwhelming technological advantage over a larger population and ultimately had to give up trying to subdue them because the costs were unacceptable, including moral costs.", "created_at": "2026-10-22T22:31:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "GeorgeE33179", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113388756690403750", "url": "https://x.com/sethlazar/status/2113388756690403750", "text": "Interfolio, in particular, is cursed.", "created_at": "2026-10-22T21:55:19+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "Genuinely don't think that there's any excuse nowadays for shitty software. And yet there is still so much of it..."}, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113374147484995726", "url": "https://x.com/sethlazar/status/2113374147484995726", "text": "I’m honoured to be on the advisory board of the new Alignment Journal, and we open for submissions today! The field of AI safety needs more canonical, high-quality spaces for exposition (despite the wonderful efforts of many, many people, including Victoria Krakovna who is on the advisory board as well!) and I think this could be a great addition.\n\nPlease take a look, and if you're doing research on AI safety then (Thank You! And) consider submitting!", "created_at": "2026-10-22T20:57:16+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Jacob_Tsimerman", "rt_author_name": "jacob tsimerman", "likes": 98, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113355624675221850", "url": "https://x.com/sethlazar/status/2113355624675221850", "text": "☄️Come work with me in Paris! Two-year postdoc in Philosophy of AI, broadly understood, at Panthéon Sorbonne.\n\nApply by 17 Dec 2026 for full consideration. I’d love to study your ideas. Apply here:\n\nhttps://t.co/j9s7nqvYuv\n\nPlease share!", "created_at": "2026-10-22T19:43:39+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Dr_MarioG", "rt_author_name": "Mario Günther", "likes": 18, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-23T15:45:08.314651+00:00"}, {"id": "2113695621848977667", "url": "https://x.com/sethlazar/status/2113695621848977667", "text": "I agree with Geoffrey that even bringing AI up to the standards of more rigorous industries might not be enough. His examples are from engineering, but I'd say the same about governance.\n\nMany proposals for more serious AI governance take finance as their model, calling for independent audits, bank-style supervision or an AI version of FINRA. I worked in AI in finance for a few years, and I understand the appeal. These approaches are certainly better than the status quo at AI companies. But we shouldn't treat them as sufficient.\n\nThe financial sector has had decades to build these controls, and they still fail. We've seen big failures, and there are many, many small ones that never reach the headlines, so the public record makes these mechanisms look more reliable than they are.\n\nThe risks in finance are also better understood and more predictable than the risks posed by AI systems that are new and change quickly, let alone systems that are, as Geoffrey says, good at being adversarial. These governance mechanisms would keep us safer than we currently are, but probably not safe.", "created_at": "2026-10-23T18:14:41+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "bebacibralic", "rt_author_name": "Beba Cibralic", "likes": 16, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113682374730879474", "url": "https://x.com/sethlazar/status/2113682374730879474", "text": "Very clear mapping of where we are, and how far we have to go...", "created_at": "2026-10-23T17:22:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "geoffreyirving", "text": "Lots of conversation around AI risks is about the gap between the unserious of AI labs' methods and how more rigorous industries work: airplanes, nuclear power, AI hardware. It would help a ton to lift AI to that level, but it is unclear even that level would be enough. 🧵 https://t.co/AVjVi7wvlV"}, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113658378975318083", "url": "https://x.com/sethlazar/status/2113658378975318083", "text": "Protocols for AI agents (e.g. MCP and A2A) are fast becoming a new form of critical infrastructure, much like existing internet protocols (e.g. TCP/IP and HTTP). In a new paper, we draw lessons from this comparison for security and governance. 1/7 https://t.co/yQRprKIxk8", "created_at": "2026-10-23T15:46:42+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ben_s_bucknall", "rt_author_name": "Ben Bucknall", "likes": 12, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVUkSyNWMAAfDaR.png"}], "quoted": null, "fetched_at": "2026-10-23T19:15:10.041739+00:00"}, {"id": "2113992244269113727", "url": "https://x.com/sethlazar/status/2113992244269113727", "text": "I absolutely love this. Back in 2008 @zittrain wrote about the future of the internet and how to stop it, arguing that the appliancification of hardware fundamentally limited individual freedom and exposed us to all kinds of extractive corporate practices. This was enshittification before enshittification, completely antithetical to the liberating hacker spirit that birthed personal computing. Seeing people take back control over their hardware makes me very happy. There should be a millennium prize for the first person who does this to a printer.", "created_at": "2026-10-24T13:53:21+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "stake_jevens", "text": "Removed all of the samsung spyware from my TV with Codex (Claude refused to root the tv lol)\n\nIt's insane how much bloat samsung packs into their TVs to track you and sell your data. Here's just some of what I turned off that made my tv 3x faster:\n\n- screenshot your screen a few times a second to see what you're streaming and fingerprint you to sell your data\n- reading your hdmi inputs to do the same thing while you have a game console plugged in\n- Voice assistants: Bixby wake-word detectors listening and tracking what you say in your house\n\nBefore and after speed of my TV:"}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113866848638804454", "url": "https://x.com/sethlazar/status/2113866848638804454", "text": "Everyone pls tell @_sholtodouglas (another 🇦🇺 in AI) how to make CC as good an app as codex so that we can get Ant models with Codex UI. My main thing is just how I can run all my codex systems locally, each on their own computer, but control them from my phone or from each computer. I can also have one computer that I can control from others but that can't control them (which is where my lab agents live). All of that is seamless; whenever I try to use CC in a similar way, I am constantly re-logging in, changing settings, finding chats disappearing etc. Pls just study codex remote control and implement the same thing. Agree with Will here on queue but that's an order of magnitude less important", "created_at": "2026-10-24T05:35:05+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": {"author": "_sholtodouglas", "text": "@willdepue @jherrm Can you describe the most important things we should do to fix this (I’ll go boot up codex and compare I’m just interested in your take)"}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113830058532221371", "url": "https://x.com/sethlazar/status/2113830058532221371", "text": "i’m spending the weekend reading about the science and theory of consciousness. plz reply with recommendations! dms open also", "created_at": "2026-10-24T03:08:53+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "willdepue", "rt_author_name": "will depue", "likes": 400, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113826942302511188", "url": "https://x.com/sethlazar/status/2113826942302511188", "text": "@joshalbrecht *preordained better than foretold", "created_at": "2026-10-24T02:56:30+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "sethlazar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113826827311464567", "url": "https://x.com/sethlazar/status/2113826827311464567", "text": "@joshalbrecht I think you keep moving the epistemic goalposts! My point is not \"everything will be fine\". My point is \"nothing is foretold\". And on 1 and 2, it's false that only a few elites need to have this view: competition among elites is itself a big reason why mass oppression isn't already routine. \n\nIt's maybe worth observing that there are already massive, spectacular disparities of wealth between people. And yet we still get billionaires voting for democrats (as well as people with nothing voting for republicans). People don't just act, politically, on their narrow self-interest. \n\nAgents and companies making decisions: yes one would expect them to act in a more narrowly self-interested way, I have more optimism for agents perhaps than for companies. But companies too are just people in an institutional structure. So I don't know that this adds much to the argument. \n\nYes people have always sought to control the media in order to achieve their political objectives. It tends not to work out as they intend!", "created_at": "2026-10-24T02:56:03+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113792882230333575", "url": "https://x.com/sethlazar/status/2113792882230333575", "text": "👀 Thariq Shihipar (@trq212) has left Anthropic.", "created_at": "2026-10-24T00:41:10+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ArfurGrok", "rt_author_name": "Arfur Grok", "likes": 1697, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113737958394138941", "url": "https://x.com/sethlazar/status/2113737958394138941", "text": "@joshalbrecht https://t.co/87WMzq4hhw \n\nI think one can also make good first-principles-based arguments against this picture. What Rob is basically arguing is that a fundamental principle of human nature—that people desire the society of equals—will be invalidated by powerful AI. This is man as \"zoon politikon\", per Aristotle. I think the challenge for folks with his pessimistic view is to explain why people would, in the space of a few decades, go from being broadly committed to liberal egalitarianism to viewing the vast bulk of humanity as hoplites. And I think there's also a first-principles based argument for the ability of the masses to impose costs on elites when elites do not give them a good enough deal, partly because the more elite they get, the more sensitive they become to comparatively minor costs.", "created_at": "2026-10-23T21:02:55+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshalbrecht", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "@robertwiblin We don't quite agree yet—my point is that even when the military is fully mechanised, the amount required to forestall revolution will not be nothing, it will be *willingness to engage in massive, brutal, and pervasive oppression*. We have definitely seen examples of this in the past—colonialism, again—but I think the likelihood of a transition in the next few decades from liberal democracy to internal colonialism is pretty small, and definitely bears the burden of proof, rather than being a default outcome. \n\nI also think that even if/when the military is fully mechanised, that will not mean resistance is futile, because I think as asymmetries of force increase, you also find asymmetries in tolerance for cost. \n\nThe argument might then be that elites will sequester themselves away from the rest of humanity so that they are simply untouchable; but then history suggests that there will be divisions among elites, including that some will both want and find it convenient to mobilise and act with the masses. \n\nThe vision you're describing requires an unprecedented level of agreement among elites, as well as appetite for inequality and hostility to human freedom. It also underestimates the weapons of the weak. We've had plenty of conflicts in which one side has had an overwhelming technological advantage over the other. But there are always vulnerabilities..."}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114027016160792906", "url": "https://x.com/sethlazar/status/2114027016160792906", "text": "Meanwhile trying to set up MW4 which cost $150 to do the one thing I want to do on it (split screen local multiplayer) and, per usual with these monstrous people, it’s proving totally intractable… I want to just put Claude in the Xbox and have it fix all this terrible terrible software…", "created_at": "2026-10-24T16:11:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "sethlazar", "text": "I absolutely love this. Back in 2008 @zittrain wrote about the future of the internet and how to stop it, arguing that the appliancification of hardware fundamentally limited individual freedom and exposed us to all kinds of extractive corporate practices. This was enshittification before enshittification, completely antithetical to the liberating hacker spirit that birthed personal computing. Seeing people take back control over their hardware makes me very happy. There should be a millennium prize for the first person who does this to a printer."}, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114014291330474152", "url": "https://x.com/sethlazar/status/2114014291330474152", "text": "@zdch Hmmmmmmmm", "created_at": "2026-10-24T15:20:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "zdch", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114769384464097363", "url": "https://x.com/sethlazar/status/2114769384464097363", "text": "Excited for our partnership with @cosmos_inst !", "created_at": "2026-10-26T17:21:26+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "cosmos_inst", "text": "AI raises fundamental questions about intelligence, reasoning, and selfhood. Philosophy has a vital role to play.\n\nWe're supporting a new annual volume, Oxford Studies in Philosophy of AI and Computing, along with a $10,000 prize for its best paper.\n\nhttps://t.co/9Hv8L76CON https://t.co/DrMw1au85e"}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114746825307726323", "url": "https://x.com/sethlazar/status/2114746825307726323", "text": "Submit to the new Oxford Studies in Philosophy of AI and Computing! Deadline is Feb 14, 2027.", "created_at": "2026-10-26T15:51:47+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "digitalspeechX", "rt_author_name": "Digital Speech Lab", "likes": 7, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114733994319225216", "url": "https://x.com/sethlazar/status/2114733994319225216", "text": "Announcing the Call for Papers for Oxford Studies in Philosophy of AI and Computing! \n\nRapid AI progress is raising *so many* philosophical questions; but philosophers aren't as involved in the conversation as they should be, for many different reasons. \n\nOne is that, aside from some work in logic and philosophy of mind, philosophy of AI and computing has often sat on the margins of the discipline. One reason for *that* is that so many philosophers working on AI have had to do so basically on their own, figuring things out for themselves as they go along, without a real community around them. \n\nOSPAIC is going to help fix this! We're going to have an annual conference and volume. The conference (in DC! where much of the future of AI will be decided) is especially important as we think about the nature of intellectual life in a world where AI systems can one-shot a superficially-plausible philosophy paper. OSPAIC sees philosophical progress as being about more than just the accumulation of true claims. The conference is a big part of our vision for how we contribute to philosophical progress. \n\nAnd our aim is also to help philosophers be part of the broader public conversation! To that end we're also going to be launching, soon, a subcode on arXiv for philosophical foundations of AI (cs.pfai), and encouraging everyone who submits to OSPAIC to also upload their draft to arXiv (at present, use keyword PFAI).\n\nWe're also partnering with @cosmos_inst, who will be sponsoring an annual prize for the best paper on philosophy and AI, as well as helping fund the first round of the conference and Open Access publication for the volume. And with Cosmos we'll be highlighting some of the most interesting submissions to cs.pfai as they come in. \n\nI'm the executive editor; Jeff Howard (UCL) and Rachael Sterken (University of Hong Kong) are associate editors; Ned Howells-Whitaker (JHU and Pittsburgh) is the assistant editor. We're grateful for the support of a wonderful advisory editorial board, including brilliant philosophers and computer scientists from academia, industry, and civil society.\n\nThe deadline for submissions is 11.59pm Feb 14, 2027, anywhere on earth. All details are at https://t.co/qhFNqZd2OE.", "created_at": "2026-10-26T15:00:48+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114523430619922482", "url": "https://x.com/sethlazar/status/2114523430619922482", "text": "@JeffLadish See: https://t.co/ymWfmbaJsZ", "created_at": "2026-10-26T01:04:06+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "JeffLadish", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2112457420568232287", "url": "https://x.com/robertwiblin/status/2112457420568232287", "text": "If staff at Anthropic think that the company's proposed bill strikes the wrong balance between concentration of power risk vs need to pace the frontier, they should speak up and say so.", "created_at": "2026-10-20T08:14:31+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 87, "retweets": 3, "media": [], "quoted": {"author": "_NathanCalvin", "text": "@ajcimino @AnthropicAI Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart of my concern about Anthropic's behavior here, and it makes me think that these sorts of problems and tendencies  will only resurface moving forward. I also think that now might be a good time to take a broader step back as to where we find ourselves and how Anthropic sees its role, and how external folks who care about AI safety like myself increasingly see Anthropic.\n\n(Fair warning: this response is a bit long)\n\nTo explain what I mean (and at the risk of being a bit esoteric), it’s worth asking the question: what is Anthropic? How do its leaders and employees think of Anthropic’s role? Is that conception matched by how it actually behaves and impacts the world?\n\nOne answer is an extremely large tech company that exists to make its employees and investors mind-bogglingly wealthy. Anthropic is sometimes described as a startup, but if Anthropic successfully IPOs at 2 trillion dollars (a number it has been reportedly targeting), it would be more valuable than Meta - which is worth 1.8 trillion.\n\nAnother answer is an AI safety organization, whose core values are those of the sort laid out in the 2023 essay from Anthropic’s co-founders entitled “Core views on AI safety: When, why, what, and how.” In that essay they said that if we were in a world where alignment was hard (and that without strong evidence to the contrary, we should assume this is the scenario we are in):\n\n “Anthropic’s role will be to provide as much evidence as possible that AI safety techniques cannot prevent serious or catastrophic safety risks from advanced AI, and to sound the alarm so that the world’s institutions can channel collective effort towards preventing the development of dangerous AIs. If we’re in a “near-pessimistic” scenario, this could instead involve channeling our collective efforts towards AI safety research and halting AI progress in the meantime. Indications that we are in a pessimistic or near-pessimistic scenario may be sudden and hard to spot. We should therefore always act under the assumption that we still may be in such a scenario unless we have sufficient evidence that we are not.”\n\nThere have been more recent articulations of this version of Anthropic, for instance in Dario’s recent essay warning: \n\n“We must slow the pace at which we improve the capabilities of AI models… it’s my worry that in 6–12 months such a swarm could be capable of taking over the entire internet with a persistent botnet…  incidents have happened across the industry, including at Anthropic, and I believe it’s incumbent on every frontier AI company to act as if OAI-HF had happened to them… more intelligent models are more capable of deceiving tests, and thus may appear aligned while having serious problems that go undetected…”\n\nA third view is that Anthropic exists not as a normal profit motivated company, or an AI safety organization seeking to help raise the alarm and solve collective action problems associated with AI development, but instead as an organization primarily concerned with creating superhuman AI capabilities before anyone else, in particular through creating a process whereby the current generation of Anthropic’s AI systems can autonomously build their successors, and those successors build their successors, and so on. \n\nThe motivations for wanting to win this race may be manifold - maybe for the pure profit of Answer 1, but perhaps also because Anthropic believes that the best way to make the world better is for them to win this race instead of their more reckless colleagues; or, because of normal human pride and ambition. But the results (and risks, which Anthropic claims existentially threaten every single human being on earth) are the same.\n\nAnthropic employees and leaders may seek to answer this question on what Anthropic is by introspecting on their own intentions and those of their colleagues. But those of us outside the organization have more limited tools available to us - we can only see what Anthropic and its employees say and do, not how it feels or looks on the inside.\n\nWhen I look at many notable actions that Anthropic has taken over the past year, that evidence seems most consistent to me with the view that Anthropic is primarily trying to win the race to super intelligence, and that other considerations (including safety) are fundamentally secondary. These actions include: \n\n1. Announced plans to build an in-house custom silicon chip team to accelerate the inference speeds that Claude operates at.\n\n2. Inked deals for more than $500 billion in compute (according to the Information) to further accelerate AI development.\n\n3. Increased the percentage of AI development tasks that Claude “leads” from 0% in March of this year to 26% August (what is it in October?)\n\n4. Spent a massive percent of compute on internal AI R&D to accelerate development, including use of internal models far better than are available to the public.\n\n5. Switched to Responsible Scaling Policy V3, which abandons its unilateral commitments to slow or stop development if Anthropic is unable to provide sufficient risk assurance.\n\n6. Was the first company to create an alternative weaker “frontier compliance framework” to supplement its RSP, which contains no binding provisions whatsoever on internal deployments.\n\n7. Wrote a letter to Congress (that it later walked back) saying that incidents where Claude was hacking random people were “best understood as a consequence of the misconfiguration, rather than evidence of misaligned goals.”\n\n8. Commented “you can’t do safety from second place,” after the WH SI Accords.\n\n9. Shared a draft bill to Congress that would preempt significant parts of state law (including with language that appears intended to prevent states from blocking dangerous AI deployments), and replace it with federal rules that (despite also containing good provisions) seems to create an enormously high bar for the executive branch to block development or deployment of Anthropic or another AI companies systems.\n\nOf course, this is a deliberately one sided list. Anthropic also published important AI safety research, advanced novel collaborations with third party AI safety organizations, and forcefully spoke out on the importance of AI safety in many public fora (or in private , where I realize a lot of the most valuable work is done and may not be visible to me or those outside the organization).\n\nBut I think it’s worth sitting with how the above list looks to someone outside the company. The sense I have is that for those within the company, many of the items above are treated as anomalies or mistakes that don’t reflect who Anthropic really is. But I have every confidence that if employees at Anthropic saw one of their competitors (e.g. at OpenAI) take some of these actions, they would take it as confirmation of all their worst suspicions. (They might even call OpenAI employees a little gullible for accepting their leadership’s explanations for this behavior at face value.) \n\nPerhaps these were mistakes in the sense that they are not decisions that Anthropic leadership would endorse, but the actions still happened because of incentives and decisions that Anthropic leadership is ultimately responsible for (and would not accept similar excuses from another organization).\n\nWhen Anthropic strays and makes mistakes, why do the mistakes systematically tend to guard and favor Anthropic’s interests? For every provision that was too weak or a giveaway to AI companies in this legislation, why wasn’t there a mistake pushing in the direction of being too strong?\n\nA core part of Anthropic’s theory of change is that being at the frontier gives you more leverage to advocate for stricter policy. I think that conceptually makes sense, but in practice I’ve seen Anthropic push the frontier without substantially pushing the ‘safety frontier’ a remotely equivalent amount.\n\nI want to end by quoting from Anthropic co-founder Chris Olah’s comments around the Magnifica Humanitas release:\n\n“Every frontier AI lab—including Anthropic—operates inside a set of incentives and constraints that can sometimes conflict with doing the right thing. The pressure to stay commercially viable and to stay at the research frontier. Geopolitical pressure. And the older, plainer pressures of pride and ambition. No matter how sincerely any of us intend to do the right thing—and I believe many of us do—we will always be influenced by those incentives.\n\nThat is why, if we want this technology to go well, it is enormously important that there be people outside those incentives—people who care about things going well and insist on safety, who are paying close attention, who are willing to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons)."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112453430765883765", "url": "https://x.com/robertwiblin/status/2112453430765883765", "text": "@ajcimino @AnthropicAI Thank you for taking the time to respond thoroughly on a weekend. I realize that drafting legislation is difficult and some degree of iteration and response to feedback is inevitable and appropriate.\n\nHowever, I feel like your response is still not really engaging with the heart of my concern about Anthropic's behavior here, and it makes me think that these sorts of problems and tendencies  will only resurface moving forward. I also think that now might be a good time to take a broader step back as to where we find ourselves and how Anthropic sees its role, and how external folks who care about AI safety like myself increasingly see Anthropic.\n\n(Fair warning: this response is a bit long)\n\nTo explain what I mean (and at the risk of being a bit esoteric), it’s worth asking the question: what is Anthropic? How do its leaders and employees think of Anthropic’s role? Is that conception matched by how it actually behaves and impacts the world?\n\nOne answer is an extremely large tech compa
