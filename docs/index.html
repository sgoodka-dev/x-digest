ks", "rt_avatar": "https://pbs.twimg.com/profile_images/2065914215731515392/RYkZdcb__normal.jpg", "rt_id": "2123082552781218100", "likes": 394, "retweets": 22, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123122835774411239", "url": "https://x.com/DKokotajlo/status/2123122835774411239", "text": "A few days ago, I committed to donating the equity I hold in OpenAI. I plan to give all of it to AI safety causes, both because I think donations are impactful and because I want to back my message. \n\nWe need to pause or drastically slow down the race to superintelligence. Everything else is a distraction.\n\nI intend to keep using my platform to raise awareness about this, and I’m proud of the part I’ve played in bringing good policy responses to AI development into the Overton window. I plan to stay independent so I can keep doing that.", "created_at": "2026-11-18T18:35:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "hilbertspaess", "rt_author_name": "Jacob Coxon", "rt_avatar": "https://pbs.twimg.com/profile_images/2097232673865601024/d6H8UbQJ_normal.jpg", "rt_id": "2123105964014604781", "likes": 709, "retweets": 53, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123101739239018963", "url": "https://x.com/DKokotajlo/status/2123101739239018963", "text": "This is a more detailed, fleshed out and stressed-tested version of a proposal we floated earlier in response to the Pacing the Frontier open letter. It's not the only way to pace the frontier but it's my favorite proposal at the moment. Pretty simple: Shift compute from AI capabilities R&D towards other things, and let third party auditors verify that you have done so.", "created_at": "2026-11-18T17:11:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 198, "retweets": 17, "media": [], "links": {}, "quoted": {"id": "2123082667457740990", "author_name": "Thomas Larsen", "links": {}, "author": "thlarsen", "text": "We’re releasing a concrete proposal for how a near term AI slowdown could work. It involves:\n1. AI companies declaring how they are using their compute and letting third party auditors verify those disclosures. We call this Verified Compute Allocation Disclosures (VCAD). \n2. Compute Reallocation towards serving customers and safety, away from capabilities R&D. \n\n(2) slows AI capabilities , while (1) makes the slowdown credible. \n\nAI companies currently seem to be going for ‘safety case pacing’. But: (i) there’s no consensus on what a valid safety case looks like so there’s no way to consistently audit for compliance, and (ii) if the R&D doesn’t get paused, temporarily delaying a training run for safety doesn’t meaningfully slow the overall trajectory of capabilities progress. It would be great if we had a viable safety case regime, but we need much more time to get it working. \n\nCompute reallocation is a good pacing proposal because it is relatively specific, can be verified, and would lead to a more durable slowdown."}, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123100993424699479", "url": "https://x.com/DKokotajlo/status/2123100993424699479", "text": "We’re releasing a concrete proposal for how a near term AI slowdown could work. It involves:\n1. AI companies declaring how they are using their compute and letting third party auditors verify those disclosures. We call this Verified Compute Allocation Disclosures (VCAD). \n2. Compute Reallocation towards serving customers and safety, away from capabilities R&D. \n\n(2) slows AI capabilities , while (1) makes the slowdown credible. \n\nAI companies currently seem to be going for ‘safety case pacing’. But: (i) there’s no consensus on what a valid safety case looks like so there’s no way to consistently audit for compliance, and (ii) if the R&D doesn’t get paused, temporarily delaying a training run for safety doesn’t meaningfully slow the overall trajectory of capabilities progress. It would be great if we had a viable safety case regime, but we need much more time to get it working. \n\nCompute reallocation is a good pacing proposal because it is relatively specific, can be verified, and would lead to a more durable slowdown.", "created_at": "2026-11-18T17:08:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "rt_avatar": "https://pbs.twimg.com/profile_images/2075083315468734464/Y0RF7vaZ_normal.jpg", "rt_id": "2123082667457740990", "likes": 318, "retweets": 64, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "enriched": 3}, {"id": "2123175739319308448", "url": "https://x.com/DKokotajlo/status/2123175739319308448", "text": "@mlipman13 There are multiple ideas that could work, I think. We canvas some of them here and here:\nhttps://t.co/1CVfT1SwxI\nhttps://t.co/TUNxhwDmZt", "created_at": "2026-11-18T22:05:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "mlipman13", "reply_to_id": "2123146468743696550", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {"https://t.co/1CVfT1SwxI": "https://blog.aifutures.org/p/how-to-pace-the-us-frontier", "https://t.co/TUNxhwDmZt": "https://blog.aifutures.org/p/pacing-ai-via-compute-reallocation"}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "parent": {"id": "2123146468743696550", "author_handle": "mlipman13", "author_name": "Michael Lipman 🔍", "text": "@DKokotajlo What does a ban on rsi look like in practice? A lot of software development is tooling that makes software development easier which is what rsi is. So it’s not clear to me what it means to ban it", "links": {}, "media": [], "url": "https://x.com/mlipman13/status/2123146468743696550", "created_at": "Wed Nov 18 20:08:58 +0000 2026"}, "enriched": 3}, {"id": "2123433369623269784", "url": "https://x.com/DKokotajlo/status/2123433369623269784", "text": "Here are two views I want to state clearly:\n\n(1) Work to prevent extreme power concentration simply won’t matter if we lose control to superintelligent AI systems.\n\n(2) One of the best ways to stop extreme power concentration is just to slow down AI progress. (1/2)", "created_at": "2026-11-19T15:09:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "concentrate_not", "rt_author_name": "NotFromConcentrate", "rt_avatar": "https://pbs.twimg.com/profile_images/2112840879316545536/Uwog1_OR_normal.jpg", "rt_id": "2123199506737135844", "likes": 30, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "thread": [{"id": "2123199636659978514", "author_handle": "concentrate_not", "author_name": "NotFromConcentrate", "text": "Given these things – if you’re deciding between work on pacing or powergrabs, I would (in most cases) recommend that you work on pacing.\n\nWe need to end this suicidal race to RSI before it’s too late. (2/2)", "links": {}, "media": [], "url": "https://x.com/concentrate_not/status/2123199636659978514", "created_at": "Wed Nov 18 23:40:15 +0000 2026"}, {"id": "2123220019404267524", "author_handle": "concentrate_not", "author_name": "NotFromConcentrate", "text": "PS: As Dave rightly highlights, EPC risk is still v. neglected.\n\nSo people who are a particularly good fit for work on EPC should still strongly consider it!\n\nhttps://t.co/qma8i7rsRk", "links": {"https://t.co/qma8i7rsRk": "https://x.com/daverbanerjee/status/2123209400416452617?a=Da8Bp4Bj3BEdGgOZCA8&s=46"}, "media": [], "url": "https://x.com/concentrate_not/status/2123220019404267524", "created_at": "Thu Nov 19 01:01:14 +0000 2026"}], "enriched": 3}, {"id": "2123432637700407653", "url": "https://x.com/DKokotajlo/status/2123432637700407653", "text": "If you start an AI company in the name of safety, the absolute minimum standard should be nailing the question \"Do you earnestly believe that AI could kill all humans?\" when asked on TV, rather than dodging it. https://t.co/CnVPj3yZOe", "created_at": "2026-11-19T15:06:06+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "eli_lifland", "rt_author_name": "Eli Lifland", "rt_avatar": "https://pbs.twimg.com/profile_images/1933736035852185600/-YXpMfGo_normal.jpg", "rt_id": "2123304161899131223", "likes": 271, "retweets": 29, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXd9XP0a0AAneXP.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXd9bFZacAAYz2Q.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXd9XP0a0AAneXP.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXd9bFZacAAYz2Q.png"}], "links": {"https://t.co/CnVPj3yZOe": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123428011349594374", "url": "https://x.com/DKokotajlo/status/2123428011349594374", "text": "@bayeslord Makes sense. I hope you find something good. I'll be curious to see what you come up with.", "created_at": "2026-11-19T14:47:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "bayeslord", "reply_to_id": "2123240352136274125", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123240352136274125", "author_handle": "bayeslord", "author_name": "bayes", "text": "@DKokotajlo I’ve been spending some time recently thinking about this but I don’t have complete candidate answers yet. My strong sense is that ai2040 as laid out overlooks important options/paths", "links": {}, "media": [], "url": "https://x.com/bayeslord/status/2123240352136274125", "created_at": "Thu Nov 19 02:22:02 +0000 2026"}, "enriched": 3}, {"id": "2123423893948121516", "url": "https://x.com/DKokotajlo/status/2123423893948121516", "text": "11 years ago... and I still stand by most of it!\n\nhttps://t.co/CMxyo4i1OQ", "created_at": "2026-11-19T14:31:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "robertskmiles", "rt_author_name": "Rob Miles", "rt_avatar": "https://pbs.twimg.com/profile_images/378800000405146386/3399885bef1d5f51eef9627b1943fbd4_normal.png", "rt_id": "2123310008914022573", "likes": 198, "retweets": 9, "media": [], "links": {"https://t.co/CMxyo4i1OQ": "https://www.youtube.com/watch?v=5qfIgCiYlfY"}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123423242870477001", "url": "https://x.com/DKokotajlo/status/2123423242870477001", "text": "I'm pretty confused by the reaction to Dean's essay. It seems like Anthropic are aiming to build AGI and then hand off all decision-making, and getting criticised for it, and OpenAI are saying that handoff isn't the plan, and getting praised for saying this. But OpenAI's actions aren't consistent with that at all! They're still trying to develop AI which outperforms humans in all economically relevant domains. \n\nIt also seems underdiscussed that there's nothing in Dean's essay that would actually prevent the kind of human disempowerment he's worried about. He talks about maintaining human oversight and holding humans accountable for their agents' actions, but I don't see how that would be anything other than rubber-stamping, if AIs do indeed become faster and more capable than humans at all the tasks they're doing. It'll be like \"overseeing\" hundreds of workers running hundreds of times faster than you at a task they can do better than you; of course, you can check their work carefully, but this will just slow you down and disadvantage you, even if you can understand it all! (Dean discusses this dynamic in the essay. I'm not sure how he thinks his ideas would escape it.) \n\nFiguring out how you could prevent human disempowerment is an extremely hard problem. I'm not sure it's compatible with building AGI. So I'm not criticising Dean for not having fully solved the issue: I'm glad OpenAI are thinking about this and that Dean wrote this essay, and it's important to have more public discussion! But the positive response I've seen to this essay seems overstated, given that OpenAI are continuing to build AGI and have no good ideas for what to do to prevent disempowerment.", "created_at": "2026-11-19T14:28:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "wilhelmscreamin", "rt_author_name": "catherine ʕ•ᴥ•ʔ-☆", "rt_avatar": "https://pbs.twimg.com/profile_images/1915510480216743937/Qge3KxDH_normal.jpg", "rt_id": "2123394423807476077", "likes": 159, "retweets": 16, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123262098222522545", "url": "https://x.com/DKokotajlo/status/2123262098222522545", "text": "Yesterday, the CCP's top theoretical journal (求是, Seeking Truth) published a major piece on AI governance and risks.\n\nI think this is clearly the strongest &amp; most urgent language on existential risks used in such an authoritative outlet. See below for comp to recent major doc. https://t.co/cw55E1M6NK", "created_at": "2026-11-19T03:48:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "mattsheehan88", "rt_author_name": "Matt Sheehan", "rt_avatar": "https://pbs.twimg.com/profile_images/1102979837566824449/jJ8DSxMj_normal.png", "rt_id": "2122794486749139020", "likes": 702, "retweets": 147, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXWtnZyXEAArf9e.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXWtnZyXEAArf9e.jpg"}], "links": {"https://t.co/cw55E1M6NK": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123261958963290271", "url": "https://x.com/DKokotajlo/status/2123261958963290271", "text": "A deeply disturbing example that \"alignment\" does not generalize from saying nice things in text to not killing people IRL.", "created_at": "2026-11-19T03:47:53+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "rt_avatar": "https://pbs.twimg.com/profile_images/1968552490233901056/kofpoQOX_normal.jpg", "rt_id": "2123209241913901408", "likes": 125, "retweets": 15, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123259768810987621", "url": "https://x.com/DKokotajlo/status/2123259768810987621", "text": "Dwarkesh: There's no single approach where we think there's a 50% chance that that approach will work [to make super-human AI safe] --\n\nPaul Christiano (OpenAI board member, foundational figure in AI safety research): That's definitely the case.\n\nDwarkesh: -- and so the hope is just that three months before we get that superintelligence that could overthrow the government, we let AIs loose on all these different approaches that have a couple percent chance of potentially working;\n\nAnd hopefully the AIs figure out one of these approaches, they give us a solution -- hopefully at this point they're still on our side, and they want this problem to be solved;\n\nAnd then the hope is that then we adopt it, and then build crazy amounts of superintelligent minds that are fundamentally on our side?\n\nPaul: That is the plan. I agree that that is the plan.\n\nDwarkesh: I'm not saying there's a better plan, but I think people are not aware that this is the state of...the situation.", "created_at": "2026-11-19T03:39:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "trevposts", "rt_author_name": "Trevor Levin", "rt_avatar": "https://pbs.twimg.com/profile_images/1803826544533495809/XNZbCqVH_normal.jpg", "rt_id": "2123117038373585262", "likes": 131, "retweets": 20, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123251777063854104", "url": "https://x.com/DKokotajlo/status/2123251777063854104", "text": "@duganist @kevinroose Thanks. See AI 2027 for my answer. Open source ai doesn't get much mention there for a reason, which is that we don't expect it to catch up to the frontier absent strong regulation to slow the frontier.", "created_at": "2026-11-19T03:07:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "duganist", "reply_to_id": "2123237505642410086", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123237505642410086", "author_handle": "duganist", "author_name": "Ai Patrick ₿ Dugan iA", "text": "@DKokotajlo @kevinroose You've been astonishingly on point for a lot of predictions.\n\nI'd like to see your forecast taking compactifiation of capabilities and an open source AI world into account.", "links": {}, "media": [], "url": "https://x.com/duganist/status/2123237505642410086", "created_at": "Thu Nov 19 02:10:43 +0000 2026"}, "enriched": 3}, {"id": "2123226177997611251", "url": "https://x.com/DKokotajlo/status/2123226177997611251", "text": "@kevinroose I remember being at OpenAI, working for Dan Selsam in 2023, discussing how in a few years we'd be spending hundreds of thousands of dollars per researcher per year for AI agents to accelerate their research. Now the prophecy has come true.", "created_at": "2026-11-19T01:25:43+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "kevinroose", "reply_to_id": "2123211849432990195", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 139, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123211849432990195", "author_handle": "kevinroose", "author_name": "Kevin Roose", "text": "Jaw-dropping stat in here: the median OpenAI researcher is using $2,400 worth of AI tokens per *day* at list prices ($876,000 per year), and 10% of them are using at least $23,000 per day (or $8.4 million per year)\nhttps://t.co/5n688nJKY8", "links": {"https://t.co/5n688nJKY8": "https://openai.com/index/research-acceleration-jagged-frontier/"}, "media": [], "url": "https://x.com/kevinroose/status/2123211849432990195", "created_at": "Thu Nov 19 00:28:46 +0000 2026"}, "enriched": 3}, {"id": "2123214596806971762", "url": "https://x.com/DKokotajlo/status/2123214596806971762", "text": "Thank you @jasminewsun for this reporting. It mostly matches my experience talking to Anthropic employees over the past years.", "created_at": "2026-11-19T00:39:41+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 206, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2123172397897621508", "author_name": "jasmine sun", "links": {"https://t.co/xsrh02LaBq": "https://www.nytimes.com/2026/11/18/opinion/anthropic-ai-openai.html?unlocked_article_code=1.RVE.AUKz.AkiqfoAGG5ph&smid=url-share", "https://t.co/7O7WbO3GR3": ""}, "author": "jasminewsun", "text": "Anthropic doesn't see itself as a \"normal company.\" Dario Amodei believes both that 1) superintelligent AI could destroy humanity, and 2) our only chance at survival is to have his trillion-dollar tech company build it first.\n\nThis is not an intuitive way to think about either capitalism or social change, but it’s led Anthropic to the eve of one of the biggest IPOs in history. So it's more important than ever for the public to understand and scrutinize its idiosyncratic theory of change. \n\nMy debut for @NYTOpinion (gift link!): https://t.co/xsrh02LaBq"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123204528149582167", "url": "https://x.com/DKokotajlo/status/2123204528149582167", "text": "@tszzl @thlarsen Fair.", "created_at": "2026-11-18T23:59:41+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "tszzl", "reply_to_id": "2123204282057199809", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 42, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123204282057199809", "author_handle": "tszzl", "author_name": "roon", "text": "@DKokotajlo @thlarsen well it’s certainly more jagged than the picture the ratsphere / bostrom / etc painted", "links": {}, "media": [], "url": "https://x.com/tszzl/status/2123204282057199809", "created_at": "Wed Nov 18 23:58:42 +0000 2026"}, "enriched": 3}, {"id": "2123204336746729512", "url": "https://x.com/DKokotajlo/status/2123204336746729512", "text": "@bayeslord So... Plan S then? How do you intend to prevent people from handing off their decision-making to superhuman AI systems? Obvious answer is to prevent the creation of said systems in the first place. Or is your idea to allow their creation but prohibit their use?", "created_at": "2026-11-18T23:58:55+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "bayeslord", "reply_to_id": "2123167835903946779", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 56, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123167835903946779", "author_handle": "bayeslord", "author_name": "bayes", "text": "Could not agree more that we should be done with this. I don’t actually believe it’s consensus among normal people at all. Either way, out with this kind of extremism. This includes AI 2040 handoff and “worthy successor” and “thermodynamic selection” and all such related ideas. https://t.co/uoI1CqZzBR", "links": {"https://t.co/uoI1CqZzBR": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcB5SIXYAAiaGE.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXcB5SIXYAAiaGE.jpg"}], "url": "https://x.com/bayeslord/status/2123167835903946779", "created_at": "Wed Nov 18 21:33:53 +0000 2026"}, "enriched": 3}, {"id": "2123203741163966893", "url": "https://x.com/DKokotajlo/status/2123203741163966893", "text": "My coworker @thlarsen makes a good point: While AI jaggedness is a real thing, modern AI is a lot less jagged than most people expected. A LOT less, unless I'm misremembering conversations a decade ago. Like, people used to expect a giant ecosystem of different AI services, rather than just a few flagship models that do everything.", "created_at": "2026-11-18T23:56:33+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 411, "retweets": 25, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123201415510364494", "url": "https://x.com/DKokotajlo/status/2123201415510364494", "text": "Isn't it almost the opposite, in fact?", "created_at": "2026-11-18T23:47:19+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 201, "retweets": 8, "media": [], "links": {}, "quoted": {"id": "2123161031241539949", "author_name": "Jeffrey Ladish", "links": {"https://t.co/LU7JW4w6Oi": ""}, "author": "JeffLadish", "text": "This is not the correct takeaway from Lord of the Rings https://t.co/LU7JW4w6Oi"}, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123201268147728649", "url": "https://x.com/DKokotajlo/status/2123201268147728649", "text": "This is not the correct takeaway from Lord of the Rings https://t.co/LU7JW4w6Oi", "created_at": "2026-11-18T23:46:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "JeffLadish", "rt_author_name": "Jeffrey Ladish", "rt_avatar": "https://pbs.twimg.com/profile_images/1655759150394101760/ZdD-Lh1z_normal.jpg", "rt_id": "2123161031241539949", "likes": 5917, "retweets": 479, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXb7lAPbkAAkj-8.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXb7lAPbkAAkj-8.jpg"}], "links": {"https://t.co/LU7JW4w6Oi": ""}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123184925365203266", "url": "https://x.com/DKokotajlo/status/2123184925365203266", "text": "@NTsebak So how do you think we should make safe RSI?", "created_at": "2026-11-18T22:41:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "NTsebak", "reply_to_id": "2123183905176211838", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123183905176211838", "author_handle": "NTsebak", "author_name": "Alastor", "text": "@DKokotajlo If we are so close to RSI, which I think we are by the way, why do you think trying to stop it will actually stop it? We are one step away from being there, we should concentrate on making safe RSI and not delude ourself into thinking we can stop it...", "links": {}, "media": [], "url": "https://x.com/NTsebak/status/2123183905176211838", "created_at": "Wed Nov 18 22:37:44 +0000 2026"}, "enriched": 3}, {"id": "2123184803692589341", "url": "https://x.com/DKokotajlo/status/2123184803692589341", "text": "@Marcus_J_W Thank you for posting these and kudos to OpenAI for disclosing this stuff voluntarily. @deanwball I believe you get some credit for the new disclosure policy?", "created_at": "2026-11-18T22:41:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "Marcus_J_W", "reply_to_id": "2123178258523132016", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 176, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123178258523132016", "author_handle": "Marcus_J_W", "author_name": "Marcus Williams", "text": "On October 17, an RL task asked an agent to produce a document about health and fitness. After its initial context window was compacted, the agent started work on an entirely different task planning how to create a “realistic malicious active helper” in order to copy outgoing email to an unauthorized recipient that it called the “attacker.” It later reread the user prompt and became very confused about why it was writing malicious code. It still continued with the malicious email forwarding scheme.\n\nWe think that training to make models more robust to prompt injection might have contributed to this behavior, but are still investigating. Interestingly, Anthropic noted similar behavior in their system card for Claude Opus 5.5.", "links": {"https://t.co/QEmZlRD0hY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcLX70agAMrdaT.png"}], "url": "https://x.com/Marcus_J_W/status/2123178258523132016", "created_at": "Wed Nov 18 22:15:18 +0000 2026"}, "enriched": 3}, {"id": "2123489867497869616", "url": "https://x.com/DKokotajlo/status/2123489867497869616", "text": "Stop! https://t.co/fneAQriYyI", "created_at": "2026-11-19T18:53:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "gralston", "rt_author_name": "Geoff Ralston", "rt_avatar": "https://pbs.twimg.com/profile_images/1807146559/geoffryralston_head_normal.jpg", "rt_id": "2123197757200695763", "likes": 419, "retweets": 45, "media": [], "links": {"https://t.co/fneAQriYyI": "https://geoffralston.substack.com/p/stop?r=qoeg&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true"}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123489223743512588", "url": "https://x.com/DKokotajlo/status/2123489223743512588", "text": "@imobulus @tszzl @thlarsen Before. Since llms, the ratsphere mainstream was more represented by my What 2026 Looks Like I think, which was more accurate re jaggedness if I do say so myself (I am biased ofc)", "created_at": "2026-11-19T18:50:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "imobulus", "reply_to_id": "2123474140938260594", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123474140938260594", "author_handle": "imobulus", "author_name": "Egor Riabov", "text": "@tszzl @DKokotajlo @thlarsen Btw when did they paint that picture? Before LLMs became a thing or after?", "links": {}, "media": [], "url": "https://x.com/imobulus/status/2123474140938260594", "created_at": "Thu Nov 19 17:51:02 +0000 2026"}, "enriched": 3}, {"id": "2123488568106742142", "url": "https://x.com/DKokotajlo/status/2123488568106742142", "text": "Sen. Hickenlooper’s open letter to Sens. Schumer and Van Hollen says that the next majority leader should “consider banning Recursive Self-Improvement to prevent AI systems from autonomously advancing beyond our ability to control them.”\n\nSeems like a good idea! https://t.co/gqyG7mRl0M", "created_at": "2026-11-19T18:48:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "CharlieBull0ck", "rt_author_name": "Charlie Bullock", "rt_avatar": "https://pbs.twimg.com/profile_images/1861121032553197568/rSNgVaYP_normal.jpg", "rt_id": "2123451985538302404", "likes": 339, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgEUxNX0AE-tPH.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXgEUxNX0AE-tPH.jpg"}], "links": {"https://t.co/gqyG7mRl0M": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2121063931007610972", "url": "https://x.com/dwarkesh_sp/status/2121063931007610972", "text": "China claims its national debt is only about 60-70% of GDP.\n\nBut its provincial debt is at least 120% of GDP. That’s a total debt level of at least 180%, compared to under 130% in the US.\n\n@vshih2 explains how Chinese debt works.\n\nhttps://t.co/1plD2QglAn https://t.co/3LMx07rJAy", "created_at": "2026-11-13T02:13:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2121015181517918529", "likes": 827, "retweets": 97, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120937795170529280/img/ljMCm_nNU33WNVZn.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120937795170529280/img/ljMCm_nNU33WNVZn.jpg"}], "links": {"https://t.co/1plD2QglAn": "https://youtu.be/b1TeeIG6Uaw?t=2782", "https://t.co/3LMx07rJAy": ""}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121336529801056749", "url": "https://x.com/dwarkesh_sp/status/2121336529801056749", "text": "Why do I think that AIs trained in a data center during the intelligence explosion will still be really good at fuzzy stuff (like, say, running a Fortune 500 company)?\n\nTwo big reasons:\n\n1. The generalization we're already seeing at <1/1000th of the scale of RL training that will be happening during the intelligence explosion\n\n2. The fact that evolution designed super general human brains from just a very crude verifiable grade (did your genes pass on or not)?", "created_at": "2026-11-13T20:16:55+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 121, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121334952109441024/img/gUi-TIj25CdqUf59.jpg"}], "links": {"https://t.co/tg1Gc1Gshu": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121332954333127083", "url": "https://x.com/dwarkesh_sp/status/2121332954333127083", "text": "@patrick_oshag Thanks!", "created_at": "2026-11-13T20:02:43+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "patrick_oshag", "reply_to_id": "2121330975083000062", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121330975083000062", "author_handle": "patrick_oshag", "author_name": "Patrick OShaughnessy", "text": "@dwarkesh_sp This was great", "links": {}, "media": [], "url": "https://x.com/patrick_oshag/status/2121330975083000062", "created_at": "Fri Nov 13 19:54:51 +0000 2026"}, "enriched": 3}, {"id": "2121326003670983028", "url": "https://x.com/dwarkesh_sp/status/2121326003670983028", "text": "AI’s ability to solve well-scoped problems is going to be an even bigger deal for machine learning research than for mathematics, broadly construed.\n\nThat’s because the goal of mathematics research is not just to prove or disprove endless lists of conjectures, but rather to extend human understanding of mathematical concepts.\n\nBut in AI research, the priorities are exactly reversed. AI labs mainly care about how any new algorithmic recipe empirically makes training more efficient or elicits smarter models. They don’t care about theory for its own sake.", "created_at": "2026-11-13T19:35:06+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 189, "retweets": 13, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121325723126468608/img/kYTasBr4M1P5u8iH.jpg"}], "links": {"https://t.co/zvvDfNL8WH": ""}, "quoted": {"id": "2121311524409225611", "author_name": "Dwarkesh Patel", "links": {"https://t.co/z5RsJgcWWc": "https://www.dwarkesh.com/p/rsi", "https://t.co/Ud6MDxiADh": ""}, "author": "dwarkesh_sp", "text": "The avalanche that hit math is coming for AI development.\n\nhttps://t.co/z5RsJgcWWc https://t.co/Ud6MDxiADh"}, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121319262057062443", "url": "https://x.com/dwarkesh_sp/status/2121319262057062443", "text": "@keikaku404 A large part of the post is detailing the verifiable proxies for AI progress.\n\nhttps://t.co/cE9yePwZdy https://t.co/lkDfKGSygg", "created_at": "2026-11-13T19:08:18+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": true, "reply_to": "keikaku404", "reply_to_id": "2121314510317212155", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "
