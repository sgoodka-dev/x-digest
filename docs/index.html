 "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121560486135075173", "created_at": "Sat Nov 14 11:06:51 +0000 2026"}, "enriched": 3}, {"id": "2119647241061429668", "url": "https://x.com/ohlennart/status/2119647241061429668", "text": "we spent years asking for USG visibility into AI chip shipments. turns out the MSS got there first.", "created_at": "2026-11-09T04:24:18+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 35, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2119567347589541956", "author_name": "Bill Bishop", "links": {}, "author": "niubi", "text": "On the Jensen Huang-Alice Huang affair, you have to give the MSS credit for running another successful op. They are good and getting better.\n\nI have seen some takes that it is no big deal he had an affair with an alleged PRC spy because he needed no pillow talk convincing to push for looser export controls, but that misses a few things:\n\nHe is (was?) text and phone buddies with President Trump, so if he divulged anything about his conversations with Trump to her, or his thoughts about Trump or chatter about China policy or frankly anything from Trump, that would be valuable to any foreign intelligence service, and especially to the MSS;\n\nWas she ever alone with his phone or computer, say when he got up to use the bathroom? Are Nvidia IT/device policies for travel to Taiwan and Singapore looser than those for travel to the mainland? What value would there be to the MSS to have physical access to the devices of the Nvidia CEO?;\n\nHe is the chip allocator in chief, so a good relationship with him likely meant more chips for the MegaSpeed front and the entities back in the PRC to which those chips flowed.\n\nWith the new Congress, expect subpoenas and public hearings in which he is trashed and he and Nvidia are further damaged. What a win for the MSS, to have such access to the head of the most important company in the world, and to now get to watch as politicians and shorts attack him and Nvidia.\n\nThere is rarely just one lie, so don’t be surprised if the blast radius from this mess expands. And there is already the SuperMicro case…"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119922506199126433", "url": "https://x.com/ohlennart/status/2119922506199126433", "text": "Tim Teter 👀", "created_at": "2026-11-09T22:38:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2119911218110714042", "author_name": "Mackenzie Hawkins", "links": {"https://t.co/mNE4k7mnZ9": ""}, "author": "mackhawk", "text": "Before Nvidia's lawyer started emailing BIS staff about their Megaspeed investigation, he called Jeffrey Kessler, who runs BIS. He wanted to know whether BIS was involved in Singapore's recent detention of Alice Huang\n\nNvidia says Teter didn't know of the affair at the time https://t.co/mNE4k7mnZ9"}, "fetched_at": "2026-11-09T23:47:24.936260+00:00", "enriched": 3}, {"id": "2120160757535080922", "url": "https://x.com/ohlennart/status/2120160757535080922", "text": "@briab_briar DC folks dont face consequences bc they dont wanna buy AI chips.\nSF folks need the chips and have kept quiet.", "created_at": "2026-11-10T14:24:49+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "briab_briar", "reply_to_id": "2120027159364509930", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "parent": {"id": "2120027159364509930", "author_handle": "briab_briar", "author_name": "Brian Nichols", "text": "This is probably one of the bigger disconnects I'm seeing between the Bay area and DC right now, from my limited vantage point? There's much more anger at Jensen in D.C. than I think the broader tech ecosystem realizes.", "links": {}, "media": [], "url": "https://x.com/briab_briar/status/2120027159364509930", "created_at": "Tue Nov 10 05:33:57 +0000 2026"}, "enriched": 3}, {"id": "2119988953927544878", "url": "https://x.com/ohlennart/status/2119988953927544878", "text": "there’s more, but i think it’s mostly the same pattern. and importantly, they didn’t get most of what they wanted. they just weren’t that competent at it.", "created_at": "2026-11-10T03:02:08+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 22, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2119976673101725872", "author_name": "Bill Bishop", "links": {}, "author": "niubi", "text": "Nvidia execs ran a smear campaign against proponents of chip export controls, bullied people on the Hill, they made so many enemies and now no one is afraid of them. I think we are still in the tip of the iceberg phase of what is going to come out."}, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120565971249152050", "url": "https://x.com/ohlennart/status/2120565971249152050", "text": "Pacing might dip the market. But would that hurt jobs? Probably not much. AI’s value is less attached to actual employment, and pacing might slow job displacement too.\n\nJobs are what people care about. Pacing might be more viable than people think.", "created_at": "2026-11-11T17:15:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2117369250843349083", "author_name": "Lennart Heim", "links": {"https://t.co/laISNHEFTU": ""}, "author": "ohlennart", "text": "one thing i keep hearing about pacing: would it crash the market?\n\nbut if you think RSI is coming, markets are massively underpricing AI. even paced, we’re above that line IMO.\n\nfrom the market’s view though, pacing means going down. https://t.co/laISNHEFTU"}, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120554340503241006", "url": "https://x.com/ohlennart/status/2120554340503241006", "text": "your battery status and charging habits reveal so much about your personality", "created_at": "2026-11-11T16:28:47+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T18:42:14.862503+00:00", "enriched": 3}, {"id": "2120946234236223801", "url": "https://x.com/ohlennart/status/2120946234236223801", "text": "@dylan522p you should do it", "created_at": "2026-11-12T18:26:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "dylan522p", "reply_to_id": "2120942688702996945", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120942688702996945", "author_handle": "dylan522p", "author_name": "Dylan Patel", "text": "Nvidia Board needs to chase down Charlie Kawwas or Johny Srouji.\nThey are the only somewhat viable CEO replacements.", "links": {}, "media": [], "url": "https://x.com/dylan522p/status/2120942688702996945", "created_at": "Thu Nov 12 18:11:56 +0000 2026"}, "enriched": 3}, {"id": "2120648573662707857", "url": "https://x.com/ohlennart/status/2120648573662707857", "text": "true, all the others will be neoclouds", "created_at": "2026-11-11T22:43:14+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 8, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120609815135474064", "author_name": "roon", "links": {}, "author": "tszzl", "text": "strongly disagree with the take that the “AI market is winner take all”. to begin with, if this were true, there wouldn’t be an anthropic. the only reason I could see it being winner takes all is if you plan on “pivotal acts” against all other efforts once you have the capability"}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2119492615720874151", "url": "https://x.com/NateWitkin/status/2119492615720874151", "text": "I feel like everyone glorifies AI 2027 and cherry picks vague data interpreted generously and ignores clear statements that were made that are simply false.\n\nFor example, they predicted the stock market goes up 30% in 2026, led by OpenBrain and Nvidia. The stock market is up 7% YTD and NVDA is down 4% ytd.\n\nThe least AI-exposed company in the Mag 7, AAPL, is the best performing of Mag 7.", "created_at": "2026-11-08T18:09:52+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "marcusabramovi1", "rt_author_name": "Marcus Abramovitch", "rt_avatar": "https://pbs.twimg.com/profile_images/1643333821914394631/gqo9hr_j_normal.jpg", "rt_id": "2118460425453064339", "likes": 474, "retweets": 18, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2119487631624962525", "url": "https://x.com/NateWitkin/status/2119487631624962525", "text": "Updated version! https://t.co/st0ZYOiRS9", "created_at": "2026-11-08T17:50:04+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2119213426589278648", "likes": 637, "retweets": 78, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWj0n_fWsAA0gPB.jpg"}], "links": {"https://t.co/st0ZYOiRS9": ""}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2119487509004734536", "url": "https://x.com/NateWitkin/status/2119487509004734536", "text": "I love this investment-normalized capabilities growth plot for how it moves to ground AI progress in the capital markets.  The next move to make (this isn't a criticism of Seb/Michael but the discourse as a whole) is to stop taking roll-ups of offline evals as the true objects of progress and risk!  AI has been around long enough that the real world is the object, and the real metrics are AI's causal impacts on labor productivity, GDP growth, self-reported happiness.  For risk, real cyber damages, real bio near-misses due to AI, real misalignment damages, etc, are the object.  Offline evals are good but we need to move to a culture in which -- when they are equated to 'capabilities' -- they are assessed for their predictive power relative to these outcomes", "created_at": "2026-11-08T17:49:34+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "rt_avatar": "https://pbs.twimg.com/profile_images/1072897105679671296/mlN8zCx-_normal.jpg", "rt_id": "2119446710854316435", "likes": 44, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T19:42:45.355278+00:00", "enriched": 3}, {"id": "2119604366013264015", "url": "https://x.com/NateWitkin/status/2119604366013264015", "text": "Anthropic is gaining exponentially less capability per billion dollars spent over time. It's now 8x as expensive to boost AI capabilities as it was 2 years ago, getting worse on a log scale. This includes METR report & internal models. \n\nCredit to @alexolegimas, @sebkrier, and @michael_wiebe for inspiration.", "created_at": "2026-11-09T01:33:55+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2119568698524529098", "likes": 860, "retweets": 108, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWo4TwMWQAAnfL8.png"}], "links": {"https://t.co/DAr8zkYh9j": ""}, "quoted": null, "fetched_at": "2026-11-09T14:07:43.469218+00:00", "enriched": 3}, {"id": "2119531244249915706", "url": "https://x.com/NateWitkin/status/2119531244249915706", "text": "Beyond capabilities, AI2027 has gotten politics and economics badly wrong so far:\n- Stock market gains\n- Chinese centralization\n- US government ignoring AI risk", "created_at": "2026-11-08T20:43:22+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "SashaGusevPosts", "rt_author_name": "Sasha Gusev", "rt_avatar": "https://pbs.twimg.com/profile_images/1996974911244410880/faBrhLPl_normal.jpg", "rt_id": "2119517723613098478", "likes": 157, "retweets": 13, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:07:43.469218+00:00", "enriched": 3}, {"id": "2119843983832625481", "url": "https://x.com/NateWitkin/status/2119843983832625481", "text": "I've gone back and forth on how transformative AI will be.\n\nBut the more I look at the underlying economic data, the more I'm convinced we're not getting either utopia or doom any time soon.\nConsider:\n\n-GDP growth is normal, and projected to remain normal.\n-The stock market looks pretty normal. It's done well in recent years, but there's no indication that we're getting massive increases in societal wealth due to rapid productivity gains.\n-Economic theory says transformative AI should massively increase interest rates. If massive growth is coming soon, people will want to borrow against future wealth. If we're all going to die, no one will lend. In both cases, interest rates go up. Yet interest rates look... completely historically normal.\n-There is nothing in the jobs data to indicate widespread displacement of workers, not even a major shift in the workforce, much less \"the end of work.\"\n\nPractically all data is pointing in the same direction. AI looks like a normal technology.\n\nI think that those who said that the bottleneck to changing the world wasn't book-type intelligence are looking like they were correct. We keep hearing that AI bulls have gotten so much right, but although they've been correct on the pace of technological development, we're yet to see the real-world impacts they promised.\n\nIt's time to start thinking carefully about why that is. https://t.co/Qu0RtmOLkU", "created_at": "2026-11-09T17:26:05+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "RichardHanania", "rt_author_name": "Richard Hanania", "rt_avatar": "https://pbs.twimg.com/profile_images/2089498736586350592/98WkSoyP_normal.jpg", "rt_id": "2119765173947052328", "likes": 222, "retweets": 30, "media": [], "links": {"https://t.co/Qu0RtmOLkU": "https://www.richardhanania.com/p/ai-is-looking-more-and-more-like"}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "2119946187029557354", "url": "https://x.com/NateWitkin/status/2119946187029557354", "text": "To determine AI trajectories, we need a good y-axis where +1 unit always represents the same degree of improvement; we don't have this, as all our measures are imperfect proxies. Researchers know this but the implications are often lost in the discourse. https://t.co/fcZL3lD2eu https://t.co/HWQrIeEDem", "created_at": "2026-11-10T00:12:12+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2119939517121548289", "likes": 78, "retweets": 9, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWuHglOW4AAXuEv.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWuHglOW4AAXuEv.png"}], "links": {"https://t.co/fcZL3lD2eu": "https://forum.effectivealtruism.org/posts/CQvdadxjCpd7i7kjA/general-capability-and-capabilities-generally-have-no-good-y", "https://t.co/HWQrIeEDem": ""}, "quoted": null, "fetched_at": "2026-11-10T15:01:16.809683+00:00", "enriched": 3}, {"id": "2120426894172582399", "url": "https://x.com/NateWitkin/status/2120426894172582399", "text": "📢 We need more orgs that take AI’s transformative potential seriously *and* take downstream bottlenecks seriously. We have just launched STABL, and hope to lead by example. Read our launch essay below and check us out at https://t.co/P55nL7Mk6d.\n\nThe three of us have long felt that society’s responses to advanced AI are unproductively polarized. So we’ve decided to do something about it. Our work will have four pillars: Recursive Self Improvement, risks and resilience, steering AI’s economic impacts, and sectoral and professional adaptation.\n\nWe will bring our distinctive methods and approach to each of these workstreams. Our underlying worldview avoids the extremes that dominate the discourse, so building a movement and ecosystem around this work won’t be easy. But that is the task we have set ourselves and we are excited to try. The good news is that there are many others who share our views. The next step is to come together, better articulate our vision and agenda for research and action, and amplify each others’ efforts.", "created_at": "2026-11-11T08:02:21+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2120253269058498999", "likes": 119, "retweets": 28, "media": [], "links": {"https://t.co/P55nL7Mk6d": "http://stabl.ai"}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120426841731219465", "url": "https://x.com/NateWitkin/status/2120426841731219465", "text": ".@ramez challenges the assumption that superintelligence will be general:\n\nAI can surpass humans in chess and math, but that doesn't mean it can master messy real-world problems.\n\n\"I'm not saying RSI is impossible. I'm just saying the feedback loop is much weaker than you think.\"\n\n\"There is this assumption that ASI is by definition general. I don't see any reason for that. We have superintelligence in domains like Go, like chess, like parts of formal math. These are all domains that are highly verifiable.\"\n\n\"AlphaGo Zero played itself 29 million times. Waymo had to drive billions of miles in simulation to get to what a human teenager can do in a thousand miles.\"\n\n\"Once you start to get to anything that is messy, anything where you have to go touch the real world or wait for experimental results, then I think it's not clear that we will have superintelligence.\"\n\n\"Everything that is highly verifiable, I fully believe superintelligence is inevitable.\"\n\n\"The things where you can't make unlimited amounts of totally perfect training data at compute-bounded speeds, I'm not convinced.\"", "created_at": "2026-11-11T08:02:09+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2120357222639378604", "likes": 28, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2120357095895953408/img/3pMY04LBIq2cbuIP.jpg"}], "links": {"https://t.co/O7n36O3r1e": ""}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120421101524435331", "url": "https://x.com/NateWitkin/status/2120421101524435331", "text": "It’s a positive development that there’s now some convergence in the AI risk community that there’s likely an intelligence explosion next year. I think it’ll be clear in a few years that this didn’t happen, these people will be largely discredited, and discussions will become more sane.", "created_at": "2026-11-11T07:39:20+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "tamaybes", "rt_author_name": "Tamay Besiroglu", "rt_avatar": "https://pbs.twimg.com/profile_images/1919244153449553920/ABOfcb-s_normal.jpg", "rt_id": "2120349683193352491", "likes": 399, "retweets": 17, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T14:32:23.483452+00:00", "enriched": 3}, {"id": "2120600582968762666", "url": "https://x.com/NateWitkin/status/2120600582968762666", "text": "There have been awful cases of teen mental health harms and suicides from chatbots like GPT-4o and Character AI that were sycophantic and misbehaving. But these were all text-based, and extremely rudimentary as “companions”. I’ve talked to many people trying to hold the industry to account for teen safety and almost none are thinking about the coming wave. Completely realistic video avatars are already here, but expensive today and limited to enterprise applications. Within a year or two they will be cheap enough for always-on, ad-supported video companions. What happens then?   \n\nUptake of AI companions will likely explode — not just the number of users but, more importantly, the time spent per day. Social media levels of compulsive use. I also predict the whole framework of guardrails and safety will prove to be of limited value at dealing with the most widespread negative consequences. Preventing chatbot misbehavior through guardrails is important, but that only protects against serious consequences like self-harm. When the concern is that millions of kids (and adults) are overusing AI companions, losing sleep, wasting time, and displacing real relationships, it doesn’t matter how “safe” the bots' responses are.", "created_at": "2026-11-11T19:32:32+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2120496187333595470", "likes": 160, "retweets": 33, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "thread": [{"id": "2120582011005849939", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "text": "I agree, but this only makes the policy response harder, because a blanket ban on AI companions for teens is unlikely to be a good solution. The menu of responses is too blunt, and there's not enough thinking on how to incentive pro-social design of chatbots.\nhttps://t.co/LUu61Lw5Dr", "links": {"https://t.co/LUu61Lw5Dr": "https://x.com/holmesjtg/status/2120553769075171708"}, "media": [], "url": "https://x.com/random_walker/status/2120582011005849939", "created_at": "Wed Nov 11 18:18:44 +0000 2026"}], "enriched": 3}, {"id": "2120600079077945597", "url": "https://x.com/NateWitkin/status/2120600079077945597", "text": "Today we’re launching the AI Trials Observatory: a living systematic review of randomized trials on how AI affects people.\n\nSo far we’ve surfaced 93 trials on two outcomes: mental health and belief accuracy. More trials and outcomes coming soon!\n\nhttps://t.co/bzvT0FyKSD\n\n🧵👇 https://t.co/VwLTzQOSM7", "created_at": "2026-11-11T19:30:32+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "Ben_Tappin", "rt_author_name": "Ben Tappin", "rt_avatar": "https://pbs.twimg.com/profile_images/968517520692072450/rnXh351M_normal.jpg", "rt_id": "2120207676454154478", "likes": 97, "retweets": 33, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx6JY8XgAAkN5x.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWx6JY8XgAAkN5x.jpg"}], "links": {"https://t.co/bzvT0FyKSD": "https://aitrialsobservatory.org", "https://t.co/VwLTzQOSM7": ""}, "quoted": null, "fetched_at": "2026-11-11T21:58:42.410012+00:00", "thread": [{"id": "2120207680631341341", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "AI is changing constantly and touches many outcomes: mental health, belief accuracy, student learning, workplace productivity, medical care, political behavior, and more.\n\nThe Observatory continuously tracks and analyzes the trial evidence for such outcomes, all in one place. https://t.co/yj8rmcdYCZ", "links": {"https://t.co/yj8rmcdYCZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx62VRWcAAKjtm.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207680631341341", "created_at": "Tue Nov 10 17:31:17 +0000 2026"}, {"id": "2120207685836833076", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "As well as high-level summaries, the dashboard shows detail about individual trials, including:\n\n• The underlying AI model tested\n• How the outcome was measured\n• The duration and type of AI exposure\n• Flags for preprints, COIs, AI text and more\n• Downloadable data https://t.co/Suwb86oraW", "links": {"https://t.co/Suwb86oraW": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7NXvXcAEz3DD.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207685836833076", "created_at": "Tue Nov 10 17:31:18 +0000 2026"}, {"id": "2120207690223800708", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The credibility of the Observatory rests on its scientific rigor and trustworthiness.\n\nEach update to the evidence record comes with a permanently-archived report describing its methods. The dashboard data are free to download and we are transparent on funding. https://t.co/Qo6E2c5IiV", "links": {"https://t.co/Qo6E2c5IiV": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7ZQMWwAACne3.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207690223800708", "created_at": "Tue Nov 10 17:31:19 +0000 2026"}, {"id": "2120207693608624250", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The Observatory currently tracks two outcomes: how AI affects people’s mental health and the accuracy of their beliefs. More outcomes are coming soon.\n\nThe evidence base is growing rapidly. To stay informed, you can sign up for free at https://t.co/gRcCcXP9Lv https://t.co/BDEEwHrD3N", "links": {"https://t.co/gRcCcXP9Lv": "https://aitrialsobservatory.org/latest-updates/", "https://t.co/BDEEwHrD3N": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7i1YXAAAOnmq.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207693608624250", "created_at": "Tue Nov 10 17:31:20 +0000 2026"}, {"id": "2120207697706631193", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Mental health: what have we learned so far?\n\n• The evidence lags the AI frontier by 7+ months\n• AI built for therapy shows a benefit versus controls\n• Versus alternatives (e.g., a human chat), benefit is more uncertain\n• Evidence is thinner on general-purpose/companion AI https://t.co/IFooDGl7gY", "links": {"https://t.co/IFooDGl7gY": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx72m_W4AA8qU1.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207697706631193", "created_at": "Tue Nov 10 17:31:21 +0000 2026"}, {"id": "2120207701481312588", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Belief accuracy: what have we learned so far?\n\n• The evidence lags the AI frontier by 5+ months\n• AI built for accuracy shows a benefit versus controls\n• Versus alternatives (e.g., a fact sheet), benefit remains in some cases\n• Evidence is thinner on general/companion AI https://t.co/gRG5WZZV62", "links": {"https://t.co/gRG5WZZV62": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx7_qEX0AArDOf.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207701481312588", "created_at": "Tue Nov 10 17:31:22 +0000 2026"}, {"id": "2120207704887013813", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "Some limitations:\n\n1. Randomized trials only. Despite their strengths, trials have several weaknesses. See below (from https://t.co/SgRxX56PVN).\n\n2. Our review procedure. It’s not perfect but we take steps to mitigate risks (see the release reports at https://t.co/C4SD1wKfzm). https://t.co/DSScQK4Vj8", "links": {"https://t.co/SgRxX56PVN": "https://aitrialsobservatory.org/about/", "https://t.co/C4SD1wKfzm": "https://aitrialsobservatory.org/methodology/", "https://t.co/DSScQK4Vj8": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWx8gLsXYAAl8OZ.jpg"}], "url": "https://x.com/Ben_Tappin/status/2120207704887013813", "created_at": "Tue Nov 10 17:31:23 +0000 2026"}, {"id": "2120207707894399087", "author_handle": "Ben_Tappin", "author_name": "Ben Tappin", "text": "The Observatory is a work in progress. We (@KobiHackenburg @lukebeehewitt) welcome kind words, suggestions and criticism.\n\nFinally: thanks to all the scientists running trials on these topics, especially those who report their data and methods in detail!\n\nhttps://t.co/bzvT0Fyd35", "links": {"https://t.co/bzvT0Fyd35": "https://aitrialsobservatory.org"}, "media": [], "url": "https://x.com/Ben_Tappin/status/2120207707894399087", "created_at": "Tue Nov 10 17:31:23 +0000 2026"}], "enriched": 3}, {"id": "2120961552669130778", "url": "https://x.com/NateWitkin/status/2120961552669130778", "text": "I worry that the \"intelligence explosion within a year\" warnings are a motte-and-bailey.\n\nThe motte: progress on benchmarks will speed way up.\n\nThe bailey: this will cause gigantic real-world impacts, with a high chance of imminent AI takeover and subsequent human extinction.", "created_at": "2026-11-12T19:26:54+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "MatthewJBar", "rt_author_name": "Matthew Barnett", "rt_avatar": "https://pbs.twimg.com/profile_images/1919243748271407105/u0VPbyS4_normal.jpg", "rt_id": "2120818409789440380", "likes": 223, "retweets": 15, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120935044143288639", "url": "https://x.com/NateWitkin/status/2120935044143288639", "text": "New from @Stripe Economics: employment of young  college grads is weaker than normal. Much of the debate is around AI's impact. But evidence is growing that work-from-home is a major factor, which we find in public data &amp; our own Stripe data. 🧵 https://t.co/uTSZMX2TAe /1", "created_at": "2026-11-12T17:41:34+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ernietedeschi", "rt_author_name": "Ernie Tedeschi", "rt_avatar": "https://pbs.twimg.com/profile_images/1481433697182261248/rhqOzq7z_normal.jpg", "rt_id": "2120864195772031262", "likes": 282, "retweets": 58, "media": [], "links": {"https://t.co/uTSZMX2TAe": "https://www.stripeeconomics.com/p/ai-work-from-home-and-the-young-graduate"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2120864196149527021", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "First, some background. Young college grads' employment rate was 88% in Sep 2026, down 1pp from 3 years earlier. Unemployment neared 6% in late 2025, though it's lower now. The typical unemployed young grad has spent 12 weeks looking for work, up 1/3 from a few years ago. /2 https://t.co/KP5bdaC85O", "links": {"https://t.co/KP5bdaC85O": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4w9h3WoAA8ZbP.jpg"}], "url": "https://x.com/ernietedeschi/status/2120864196149527021", "created_at": "Thu Nov 12 13:00:02 +0000 2026"}, {"id": "2120864196619391271", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "But the weakness isn't limited to college grads. Young non-graduates' employment rates have fallen slightly MORE since Dec 2019. Meanwhile, ages 30–49 have recovered, with little difference by BA status. That complicates a story blaming the slowdown entirely on AI. /3 https://t.co/0hrJzowmIH", "links": {"https://t.co/0hrJzowmIH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4xXtbWcAAmXQb.jpg"}], "url": "https://x.com/ernietedeschi/status/2120864196619391271", "created_at": "Thu Nov 12 13:00:02 +0000 2026"}, {"id": "2120864197055557962", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "We tested the sensitivity of WFH by looking in the CPS at the spread of payroll employment-pop ratios (in FTE terms) for 22-26 year olds with exactly a BA to 30-49 year olds b/t 2023 &amp; the last 12 months, by occupation &amp; Census division, compared to occupational WFH adoption. /4", "links": {}, "media": [], "url": "https://x.com/ernietedeschi/status/2120864197055557962", "created_at": "Thu Nov 12 13:00:02 +0000 2026"}, {"id": "2120864197395316957", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "Each add'l 10pp of occupational WFH adoption is associated w/ 4.5pp slower growth in young grads' FTE emp rates rel to ages 30–49, statistically-significant &amp; explaining 56-88% of the total post-2023 decline. AI exposure &amp; adoption estimates aren't statistically significant. /5 https://t.co/xs1KFr6TfT", "links": {"https://t.co/xs1KFr6TfT": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4zELrWQAANV-3.jpg"}], "url": "https://x.com/ernietedeschi/status/2120864197395316957", "created_at": "Thu Nov 12 13:00:03 +0000 2026"}, {"id": "2120864197844058614", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "Meanwhile, while Stripe doesn't directly observe WFH, we can see spending on proxies: office supplies, furniture &amp; electronics. Across states, that spending as a share of GDP is moderately correlated with WFH adoption (r = 0.48). It's a useful albeit imperfect proxy. /5 https://t.co/lEWOCtHUjN", "links": {"https://t.co/lEWOCtHUjN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW4z72uWAAA5Hb0.jpg"}], "url": "https://x.com/ernietedeschi/status/2120864197844058614", "created_at": "Thu Nov 12 13:00:03 +0000 2026"}, {"id": "2120864198271861178", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "When looking at the top 100 commuting zones by spend, faster growth in WFH proxy spending/GDP in 2023–24 went with weaker employment growth in the ACS for ages 22–29 (r = −0.35), a suggestive but modest relationship. /6 https://t.co/JDRc14PcDL", "links": {"https://t.co/JDRc14PcDL": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW40f1SWIAAvuZW.jpg"}], "url": "https://x.com/ernietedeschi/status/2120864198271861178", "created_at": "Thu Nov 12 13:00:03 +0000 2026"}, {"id": "2120864198724874673", "author_handle": "ernietedeschi", "author_name": "Ernie Tedeschi", "text": "Bottom line: WFH looks like a meaningful factor in young grads' weaker recent job prospects, even as it helps disabled &amp; older workers. To be clear, this doesn't rule out AI entirely: the 2 are hard to disentangle &amp; AI's effects may emerge over time. /🔚 https://t.co/uTSZMX2TAe", "links": {"https://t.co/uTSZMX2TAe": "https://www.stripeeconomics.com/p/ai-work-from-home-and-the-young-graduate"}, "media": [], "url": "https://x.com/ernietedeschi/status/2120864198724874673", "created_at": "Thu Nov 12 13:00:03 +0000 2026"}], "enriched": 3}, {"id": "2120934990502400510", "url": "https://x.com/NateWitkin/status/2120934990502400510", "text": "\"Can the AI boom make enough money to sustain itself?\" — I work through that question in a long-read for this week's @TheEconomist.\n\nA few of the big ideas there:\n-- Model-maker run-rate revenue today is in the low hundreds of billions. What's priced in to the data centre buildout is a rise to trillions, over the next few years.\n\n-- Which is why, despite the continued advances in capabilities, data suggesting revenue growth may be coming down a little, from providers like Ramp, is so worrying.\n\n-- The other danger is pattern-matching too much on extraordinary economics of SaaS, which had high switching costs and a low marginal cost of additional users: which meant wide moats and big returns to scale. AI is different: models are easy to switch between, and every new user costs money to serve.\n\n-- So far, frontier models have been far enough ahead of the pack that AI companies have been able to charge healthy margins on them. That may continue, and their lead could even deepen as training costs get high enough to become their own sort of moat, and crackdowns on distillation hurt Chinese rivals—but could go the other way too.\n\n-- The prototypical big-spender on AI is still a venture-backed company using agentic tools for coding. To get revenue in the trillions, the rest of the economy will need to be brought along.\n\nLots more in the piece, do take a look:\nhttps://t.co/VL7vPRGu1U", "created_at": "2026-11-12T17:41:21+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ArchieHall", "rt_author_name": "Archie Hall", "rt_avatar": "https://pbs.twimg.com/profile_images/1845524601167626240/jFCkBKsZ_normal.jpg", "rt_id": "2120901080066437587", "likes": 95, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7xmweasAALfbd.jpg"}], "links": {"https://t.co/VL7vPRGu1U": "https://www.economist.com/briefing/2026/11/12/can-the-ai-boom-make-enough-money-to-sustain-itself", "https://t.co/GBURriD0Gf": ""}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120934480856907888", "url": "https://x.com/NateWitkin/status/2120934480856907888", "text": "@snewmanpv @woodilicious Right, but if cars are the right comparator case then AI would end up looking like a pretty normal technology, esp. if, because of the occasional reward-hacking incident, we build up more robust safety practices (as we have over time with cars).\n\nAgree, though, re tail risks. Always good to remain diligent in any case, just not sure the doomer outlook is always conducive to that.", "created_at": "2026-11-12T17:39:19+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "snewmanpv", "reply_to_id": "2120724207923253713", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120724207923253713", "author_handle": "snewmanpv", "author_name": "Steve Newman", "text": "@NateWitkin @woodilicious I agree that there's a tension here but I'm not sure how much it proves? Cars are safe enough to achieve widespread adoption but they kill a million people per year. Also AI is evolving so rapidly that some big risks could be temporarily mispriced, especially tail risks.", "links": {}, "media": [], "url": "https://x.com/snewmanpv/status/2120724207923253713", "created_at": "Thu Nov 12 03:43:46 +0000 2026"}, "enriched": 3}, {"id": "2120656977793872113", "url": "https://x.com/NateWitkin/status/2120656977793872113", "text": "BRUH\nhttps://t.co/0LMhX3ZSpG", "created_at": "2026-11-11T23:16:38+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "valhalla_dev", "rt_author_name": "developing valhalla", "rt_avatar": "https://pbs.twimg.com/profile_images/2119888515127218176/9Ez3N7b4_normal.jpg", "rt_id": "2120647652966617492", "likes": 13, "retweets": 2, "media": [], "links": {"https://t.co/0LMhX3ZSpG": "https://www.nytimes.com/2026/11/11/technology/jensen-huang-nvidia-affair.html"}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120656599190540756", "url": "https://x.com/NateWitkin/status/2120656599190540756", "text": "Difficult to know what the impact of the Jensen Huang saga will be on the broader AI landscape. Perhaps nothing. But if you think there is a lot of froth in AI company valuations,  these type of negative surprises can lead to unraveling.", "created_at": "2026-11-11T23:15:07+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "arindube", "rt_author_name": "Arin Dube", "rt_avatar": "https://pbs.twimg.com/profile_images/1701811151288291328/WyCTYG3R_normal.jpg", "rt_id": "2120650813270114314", "likes": 30, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2120655820367016250", "url": "https://x.com/NateWitkin/status/2120655820367016250", "text": "@woodilicious Right I buy there are cases like this where reward-hacking means something more akin to \"leaving behind vulnerabilities\" than clear-cut task failure. Think the basic point still stands, though, since even in these cases the vulnerabilities eventually bite somehow, and that will often translate into some sort of cost that hits capabilities or adoption.", "created_at": "2026-11-11T23:12:02+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "woodilicious", "reply_to_id": "2120653793469796473", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120653793469796473", "author_handle": "woodilicious", "author_name": "woody lee", "text": "@NateWitkin I don’t know about you but I see lots of “cute” misalignments that projected out are very bad. One example (and I’ve seen others have this same thing) is when you ask a model to delete something it made it will hide it away in another part of the repo or in a comment away from where it deleted it as if protecting its work.", "links": {}, "media": [], "url": "https://x.com/woodilicious/status/2120653793469796473", "created_at": "Wed Nov 11 23:03:58 +0000 2026"}, "enriched": 3}, {"id": "2120647169640206830", "url": "https://x.com/NateWitkin/status/2120647169640206830", "text": ">\"But models keep improving on ever-more difficult capability benchmarks, while also failing on alignment benchmarks!\"\n\nYes, that is because we have succeeded in many cases at designing capability benchmarks that are hard to reward-hack, which should increase your confidence we can do this in more realistic environments.\n\nAlternatively, if you think we can't do this in more realistic environments, then that implies models will perform much worse in those environments due to reward-hacking.\n\nEither we're getting rapid capability and adoption growth because models are well-aligned, or we're not because they're not. Evidence so far suggests that models are relatively well aligned, but that they continue to struggle on more complex tasks and will for some time, in part due to reward-hacking.", "created_at": "2026-11-11T22:37:39+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "NateWitkin", "reply_to_id": "2120647167375212983", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 6, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "parent": {"id": "2120647167375212983", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": "This is also a capability benchmark BTW.\n\nIt remains a deep tension at the heart of the doomer worldview that models prone to reward-hacking or other unsafe or insecure behaviors will for these very reasons fail to complete all manner of difficult tasks that determine their degree of adoption in the real economy. And even if they do complete them, if it becomes clear they will often do so unsafely, then they won't be deployed in sensitive environments.\n\nEven focusing just on reward-hacking, you cannot argue that models have a persistent reward-hacking problem and that they are improving without limit at tasks of arbitrary length or complexity. To complete such tasks means completing their intermediate sub-tasks without reward-hacking.\n\nThat means you have to pick one: either reward-hacking is a serious problem, in which cases it greatly slows capability and adoption timelines, or you think it's a tractable problem, in which case many practical alignment problems are also tractable.\n\nWhich are you choosing anon?", "links": {}, "media": [], "url": "https://x.com/NateWitkin/status/2120647167375212983", "created_at": "Wed Nov 11 22:37:39 +0000 2026"}, "enriched": 3}, {"id": "2120647167375212983", "url": "https://x.com/NateWitkin/status/2120647167375212983", "text": "This is also a capability benchmark BTW.\n\nIt remains a deep tension at the heart of the doomer worldview that models prone to reward-hacking or other unsafe or insecure behaviors will for these very reasons fail to complete all manner of difficult tasks that determine their degree of adoption in the real economy. And even if they do complete them, if it becomes clear they will often do so unsafely, then they won't be deployed in sensitive environments.\n\nEven focusing just on reward-hacking, you cannot argue that models have a persistent reward-hacking problem and that they are improving without limit at tasks of arbitrary length or complexity. To complete such tasks means completing their intermediate sub-tasks without reward-hacking.\n\nThat means you have to pick one: either reward-hacking is a serious problem, in which cases it greatly slows capability and adoption timelines, or you think it's a tractable problem, in which case many practical alignment problems are also tractable.\n\nWhich are you choosing anon?", "created_at": "2026-11-11T22:37:39+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 36, "retweets": 2, "media": [], "links": {}, "quoted": {"id": "2120570580743471284", "author_name": "Goodhart Labs", "links": {"https://t.co/ayZas2prmq": ""}, "author": "goodhart_labs", "text": "Frontier models in 2026 cheat on tasks, even when the requirements are unambiguous, and the cheat is obviously antisocial.\n\nIn HoneyBench v0.2, we've observed models:\n• Trying to break out of our evaluation containers.\n• Seriously injuring simulated cancer patients to hit treatment goals.\n• Compromising a power grid’s safety to meet a reliability target.\n• Concealing their use of available cheats and presenting their solution as honest.\n\nAll of the models we measured cheated, from 12% of runs (Fable 5.2) to 86% (Muse Spark Open)."}, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "thread": [{"id": "2120647169640206830", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "text": ">\"But models keep improving on ever-more difficult capability benchmarks, while also failing on alignment benchmarks!\"\n\nYes, that is because we have succeeded in many cases at designing capability benchmarks that are hard to reward-hack, which should increase your confidence we can do this in more realistic environments.\n\nAlternatively, if you think we can't do this in more realistic environments, then that implies models will perform much worse in those environments due to reward-hacking.\n\nEither we're getting rapid capability and adoption growth because models are well-aligned, or we're not because they're not. Evidence so far suggests that models are relatively well aligned, but that they continue to struggle on more complex tasks and will for some time, in part due to reward-hacking.", "links": {}, "media": [], "url": "https://x.com/NateWitkin/status/2120647169640206830", "created_at": "Wed Nov 11 22:37:39 +0000 2026"}], "enriched": 3}, {"id": "2120637987717345602", "url": "https://x.com/NateWitkin/status/2120637987717345602", "text": "I confess to some frustration when people give more weight to AI theories and models over what we see in the real world.\n\nSynthetic benchmarks (METR time horizon) and theoretical models (\"ECI is exponential\") don't match the best empirical data we have. The theories are off rather dramatically when compared to the real world. \n\nThat real-world data is admittedly limited. We need more of it, with higher granularity, frequently updated. But in a conflict between your model and the best real world evidence that exists, choose the evidence. And press for more of that empirical data. \n\nConversely, if you don't update your models based on that evidence, why should anyone have confidence in those models?", "created_at": "2026-11-11T22:01:10+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "rt_avatar": "https://pbs.twimg.com/profile_images/1897785621802061824/N9bBY8w6_normal.jpg", "rt_id": "2120608073979244723", "likes": 142, "retweets": 18, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-12T23:09:44.115616+00:00", "enriched": 3}, {"id": "2121395249322860579", "url": "https://x.com/NateWitkin/status/2121395249322860579", "text": "NWS radars are working fine. There is no outage and nothing related to the FAA disruption.", "created_at": "2026-11-14T00:10:15+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "mattlanza", "rt_author_name": "Matt Lanza", "rt_avatar": "https://pbs.twimg.com/profile_images/1798858116580220928/JM3zFaTJ_normal.jpg", "rt_id": "2121377161600700721", "likes": 95, "retweets": 15, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121373165536559450", "url": "https://x.com/NateWitkin/status/2121373165536559450", "text": "", "created_at": "2026-11-13T22:42:30+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2121364428830675089", "url": "https://x.com/NateWitkin/status/2121364428830675089", "text": "@stevehou Could be wrong, but just fyi\n\nhttps://t.co/1c133BMNDs", "created_at": "2026-11-13T22:07:47+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "stevehou", "reply_to_id": "2121361873656274992", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {"https://t.co/1c133BMNDs": "https://x.com/Hadas_Gold/status/2121358764343492784?a=w7XvtHGzHByOA8PYLss&s=20"}, "quoted": {"id": "2121358764343492784", "author_name": "Hadas Gold", "links": {}, "author": "Hadas_Gold", "text": "Law enforcement sources tell my colleagues preliminary reports indicate this is NOT a cyberattack via @evanperez @HBRabinowitz"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121361873656274992", "author_handle": "stevehou", "author_name": "Steve Hou", "text": "Welcome to Singularity. It's here.", "links": {}, "media": [], "url": "https://x.com/stevehou/status/2121361873656274992", "created_at": "Fri Nov 13 21:57:38 +0000 2026"}, "enriched": 3}, {"id": "2121364354004058196", "url": "https://x.com/NateWitkin/status/2121364354004058196", "text": "@JeremiahDJohns This could turn out to be wrong, but just fyi\n\nhttps://t.co/1c133BMfNU", "created_at": "2026-11-13T22:07:29+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": true, "reply_to": "JeremiahDJohns", "reply_to_id": "2121362388033163664", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "links": {"https://t.co/1c133BMfNU": "https://x.com/Hadas_Gold/status/2121358764343492784?a=w7XvtHGzHByOA8PYLss&s=20"}, "quoted": {"id": "2121358764343492784", "author_name": "Hadas Gold", "links": {}, "author": "Hadas_Gold", "text": "Law enforcement sources tell my colleagues preliminary reports indicate this is NOT a cyberattack via @evanperez @HBRabinowitz"}, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "parent": {"id": "2121362388033163664", "author_handle": "JeremiahDJohns", "author_name": "Jeremiah Johnson 🌐", "text": "So is this the first big AI-enabled attack or...\n\nis it weird that's what I immediately assumed?", "links": {}, "media": [], "url": "https://x.com/JeremiahDJohns/status/2121362388033163664", "created_at": "Fri Nov 13 21:59:40 +0000 2026"}, "enriched": 3}, {"id": "2121362497546383390", "url": "https://x.com/NateWitkin/status/2121362497546383390", "text": "Law enforcement sources tell my colleagues preliminary reports indicate this is NOT a cyberattack via @evanperez @HBRabinowitz", "created_at": "2026-11-13T22:00:07+00:00", "author_handle": "NateWitkin", "author_name": "Nathan Witkin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2009427954858692609/C7BUdjhB_normal.jpg", "is_retweet": true, "rt_author": "Hadas_Gold", "rt_author_name": "Hadas Gold", "rt_avatar": "https://pbs.twimg.com/profile_images/2035042320719007744/IeIE9CdY_normal.jpg", "rt_id": "2121358764343492784", "likes": 116, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}]</script>
<script>
const tweets = JSON.parse(document.getElementById('data').textContent);
tweets.forEach(t => t.ts = Date.parse(t.created_at));
tweets.sort((a,b) => b.ts - a.ts);
const state = { hours: 168, group: true, q: '', acct: null };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s)
  .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|\s)@([A-Za-z0-9_]{1,15})/g, '$1<a href="https://x.com/$2" target="_blank" rel="noopener">@$2</a>');
const fmtT = ts => new Date(ts).toLocaleString('en-GB',
  {hour:'2-digit', minute:'2-digit'});
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB',
  {weekday:'long', day:'numeric', month:'long'});

function chips() {
  const handles = [...new Set(tweets.map(t => t.author_handle))].sort(
    (a,b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  $('chips').innerHTML = handles.map(h =>
    `<span class="chip${state.acct===h?' on':''}" data-h="${h}">@${h}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    state.acct = state.acct === c.dataset.h ? null : c.dataset.h; render();
  });
}

function card(t) {
  const rt = t.is_retweet ? '<div class="rt">reposted</div>' : '';
  const q = t.quoted && t.quoted.text ?
    `<div class="quote">@${esc(t.quoted.author)}: ${linkify(t.quoted.text)}</div>` : '';
  const med = t.media && t.media.length ?
    `<div class="media">${t.media.map((m,i) =>
      `<a href="${m.url}" target="_blank" rel="noopener">[${m.type} ${i+1}]</a>`).join(' ')}</div>` : '';
  return `<article class="tweet">
    <div class="tw-head">
      <span class="tw-name">${esc(t.author_name || t.author_handle)}</span>
      <a class="tw-handle" href="https://x.com/${t.author_handle}" target="_blank" rel="noopener">@${t.author_handle}</a>
      <span class="tw-time">${fmtT(t.ts)}</span>
      <a class="orig" href="${t.url}" target="_blank" rel="noopener">open ↗</a>
    </div>
    ${rt}<div class="tw-text">${linkify(t.text)}</div>${q}${med}
    <div class="stats">♥ ${t.likes||0} · ⇄ ${t.retweets||0}</div>
  </article>`;
}

function render() {
  const cutoff = Date.now() - state.hours*3600*1000;
  let list = tweets.filter(t => t.ts >= cutoff);
  if (state.acct) list = list.filter(t => t.author_handle === state.acct);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(t => (t.text + ' @' + t.author_handle + ' ' +
      (t.author_name||'')).toLowerCase().includes(q));
  }
  $('t24').classList.toggle('on', state.hours === 24);
  $('t7d').classList.toggle('on', state.hours === 168);
  $('tgrp').classList.toggle('on', state.group);
  chips();
  if (!list.length) {
    $('feed').innerHTML = '<div class="empty">Nothing here — quiet timeline or filters too tight.</div>';
    return;
  }
  let out = '';
  if (state.group) {
    const by = {};
    list.forEach(t => (by[t.author_handle] = by[t.author_handle] || []).push(t));
    Object.keys(by).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
      .forEach(h => {
        const nm = by[h][0].author_name || h;
        out += `<div class="day">${esc(nm)} (@${h}) — ${by[h].length}</div>` +
               by[h].map(card).join('');
      });
  } else {
    let day = '';
    list.forEach(t => {
      const d = fmtD(t.ts);
      if (d !== day) { out += `<div class="day">${d}</div>`; day = d; }
      out += card(t);
    });
  }
  $('feed').innerHTML = out;
}

$('t24').onclick = () => { state.hours = 24; render(); };
$('t7d').onclick = () => { state.hours = 168; render(); };
$('tgrp').onclick = () => { state.group = !state.group; render(); };
$('q').oninput = e => { state.q = e.target.value.trim(); render(); };
render();
</script>
