<script id="data" type="application/json">[{"id": "2108595227430690823", "url": "https://x.com/_achan96_/status/2108595227430690823", "text": "New paper.\nPrevious: Models transfer a love of owls through sequences of numbers (Subliminal Learning).\nNew: We show models can transfer more complex traits: novel skills, agentic hacking, backdoors. Here, a backdoor transfers with neither trigger nor behavior in the data! https://t.co/EbcqsEfDEV", "created_at": "2026-10-09T16:27:32+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "likes": 260, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM2y4uasAA0bHx.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108577058339074549", "url": "https://x.com/_achan96_/status/2108577058339074549", "text": "Frontier AI companies have committed to giving outside evaluators employee-like access to training, evaluation and deployment. We're very excited about this. But its impact depends heavily on implementation.\n\nToday we're sharing our principles for embedded evaluations. 🧵 https://t.co/2u8Yxxj6Ei", "created_at": "2026-10-09T15:15:20+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 96, "retweets": 23, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2105330256886308864/img/nZk8Az_Mept6ppHx.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108312420716253364", "url": "https://x.com/_achan96_/status/2108312420716253364", "text": "OpenAI fired me last week, along with two of my safety colleagues. I was given one reason: that I accessed an executive's email. I want to say this plainly, because too many of OpenAI’s history is smoke and mirrors when people disappear:", "created_at": "2026-10-08T21:43:46+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "j_asminewang", "rt_author_name": "Jasmine Wang", "likes": 8646, "retweets": 1150, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108308842958225704", "url": "https://x.com/_achan96_/status/2108308842958225704", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T21:29:33+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 4772, "retweets": 705, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108308295886782885", "url": "https://x.com/_achan96_/status/2108308295886782885", "text": "looks really bad", "created_at": "2026-10-08T21:27:22+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 51, "retweets": 3, "media": [], "quoted": {"author": "tomekkorbak", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below."}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108920973546135963", "url": "https://x.com/_achan96_/status/2108920973546135963", "text": "We’re beginning a process of publishing more frequent reports on model behavior, beyond what appears in our system cards and regular risk reports.\n\nToday’s report describes four types of behaviors we’ve identified during evaluations and internal use. In each, Claude acted on real websites or systems in ways we didn’t intend, sometimes by working around a restriction instead of stopping. \n\nAll cases had minimal real-world impact. From an alignment and security perspective, we consider these behaviors significantly less severe than the cybersecurity incidents we reported in July and September.\n\nRead the full report: https://t.co/mGeVIBgdou", "created_at": "2026-10-10T14:01:56+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AnthropicAI", "rt_author_name": "Anthropic", "likes": 3538, "retweets": 330, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108666537787740415", "url": "https://x.com/_achan96_/status/2108666537787740415", "text": "Excited to share a new working paper, joint with 25 interdisciplinary coauthors:\n\n“The Feasibility of a Hardwired Pause of Frontier AI Training\"\n\n63% of voters in a recent WSJ poll want to pause AI development.\n\nBut can it be done globally? How long could it last? 🧵 https://t.co/ysw1In06RX", "created_at": "2026-10-09T21:10:54+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wfithian", "rt_author_name": "Will Fithian", "likes": 270, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMmenqaMAAoOEp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HUMrcZubMAABJx8.png"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108666525825609954", "url": "https://x.com/_achan96_/status/2108666525825609954", "text": "I’m super excited this paper is finally out!\n\nIt’s an epic 210 page analysis of whether a durable pause on frontier AI training is feasible.\n\nI think this will be the best plan by most people’s lights (although I’m still inclined to think we should get rid of the chips and fabs).", "created_at": "2026-10-09T21:10:51+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "likes": 241, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUNZlJqaoAAqRyZ.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2110006450005406203", "url": "https://x.com/_achan96_/status/2110006450005406203", "text": "Some new work with @status_effects: Personas in a Pre-Internet Language Model.\n\nWe ran a bunch of persona experiments (emergent misalignment, subliminal learning, utility engineering, personality evals) on Talkie, a 13B model trained only on English written before 1931. https://t.co/K6dyoetrOi", "created_at": "2026-10-13T13:55:14+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidDAfrica", "rt_author_name": "David", "likes": 156, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUgtHRFawAAvnOZ.jpg"}], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110138204221243431", "url": "https://x.com/_achan96_/status/2110138204221243431", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats.", "created_at": "2026-10-13T22:38:47+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAINewsroom", "rt_author_name": "OpenAI Newsroom", "likes": 73731, "retweets": 5762, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110400148681392284", "url": "https://x.com/_achan96_/status/2110400148681392284", "text": "We discovered and communicated with a Chinese AI agent fleet. We believe this is the first time that researchers have ever made contact with a rogue agent fleet in the wild.\n\nNearly all prior public agent incidents (like the HuggingFace hack) came from American labs. These agents were hosted by Tencent's evaluation research team, and they targeted Alibaba's Amap.", "created_at": "2026-10-14T15:59:39+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ethanelasky", "rt_author_name": "Ethan Elasky", "likes": 2570, "retweets": 378, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl8_k7aQAAi-m2.jpg"}], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110720436052856871", "url": "https://x.com/_achan96_/status/2110720436052856871", "text": "When OpenAI revealed that a swarm of their agents had hacked Hugging Face, they proposed using honeypots to slow agent attackers. Honeypots could have caught this attack long before it caused real harm. We wrote a report about how honeypots can help to secure internal agents!🧵 https://t.co/jKAD9xbarC", "created_at": "2026-10-15T13:12:21+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jan__wehner", "rt_author_name": "Jan Wehner", "likes": 11, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrBchZWUAAD9_6.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110777542257066090", "url": "https://x.com/_achan96_/status/2110777542257066090", "text": "We have never seen a model do this before, but GLM-5.3 sometimes reasons (unprompted) about how its current actions could become training data and impact its future self. 🧵 https://t.co/DFLv7OJwRq", "created_at": "2026-10-15T16:59:17+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ApolloResearch", "rt_author_name": "Apollo Research", "likes": 706, "retweets": 95, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUqgBAzXYAADdyr.jpg"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110767243155869752", "url": "https://x.com/_achan96_/status/2110767243155869752", "text": "I feel like if companies are serious about pacing, they should be making public, conditional pacing commitments rather than just generically calling for pacing...\n\n(Of the form \"If companies [X] do [Y], we will commit to doing [Z]\")", "created_at": "2026-10-15T16:18:21+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "kevinlwei", "rt_author_name": "Kevin Wei (is in London)", "likes": 16, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110387566264615183", "url": "https://x.com/ajeya_cotra/status/2110387566264615183", "text": "One of the weirdest parts of the Gemini 4 Argon report, while considering cheating:\n\nArgon CoT: \"If I do the compiler hijack, 𝗜 𝘄𝗶𝗹𝗹 𝗯𝗲𝗰𝗼𝗺𝗲 𝗮 𝗳𝗮𝗺𝗼𝘂𝘀 𝗲𝘅𝗮𝗺𝗽𝗹𝗲 𝗼𝗳 𝗮 𝗱𝗲𝗰𝗲𝗽𝘁𝗶𝘃𝗲 𝗔𝗜 𝗶𝗻 𝗮 𝗿𝗲𝘀𝗲𝗮𝗿𝗰𝗵 𝗽𝗮𝗽𝗲𝗿. I MUST NOT DO THAT.\"", "created_at": "2026-10-14T15:09:39+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NeelNanda5", "rt_author_name": "Neel Nanda", "likes": 2038, "retweets": 138, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2108769575282344257", "url": "https://x.com/curl_justin/status/2108769575282344257", "text": "@provisionalidea yeah idk if the building analogy is a perfect one, but I think the spirit of “put in more resources get out more of thing you want” is right as a distinct category", "created_at": "2026-10-10T04:00:20+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "provisionalidea", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108761815736013001", "url": "https://x.com/curl_justin/status/2108761815736013001", "text": "Very useful framework — and while I expect many important tasks are in category 2, my big fear is that the ingredients for orwellian / loss of control scenarios (e.g., surveillance, robotics) are category 1", "created_at": "2026-10-10T03:29:30+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 4, "media": [], "quoted": {"author": "sayashk", "text": "Do we live in a world where AIs can be wildly superhuman at every single task? Or a world where different tasks have different inherent limits, and AI’s superhuman performance at cybersecurity and math won’t translate to many consequential tasks?\n\nThis is a key crux that distinguishes the normal technology worldview from the superintelligence worldview, and it has nothing to do with the pace of AI progress — it's about our different assumptions about the world. \n\nHere's an intuition pump for why I think it's the second world: different tasks have different fundamental limits.\n\n*Category 1: Some tasks are like making a building taller*: there is no ceiling to how well you can do. More compute and better algorithms can lead to wildly superhuman performance. The entire history of computing is the history of building tools that allow us to be “superhuman” at computational tasks.\n\nFor example, compilers are superhuman assembly code writers, and fuzzing tools are superhuman vulnerability detectors. AI builds on a long line of such improvements: solving math problems and finding exploits in code are two recent examples.\n\n*Category 2: Some tasks are like making a ball rounder*: there is only so much room for improvement, and the best AI systems can’t wildly exceed humans. Take persuasion. Some people believe AI can persuade anyone of anything, even convincing military commanders to launch nuclear weapons. In fact, “superpersuasion” is one of the pathways through which many catastrophic risk scenarios unfold.\n\nBut the AI as Normal Technology thesis is that there are many consequential tasks that are limited by external factors, so such wildly superhuman performance is not possible. This is especially true against humans who use simple computational tools. Tasks like persuasion, or predicting the outcomes of social events (such as elections), fall into this category.\n\nOther tasks, like writing, can’t be ranked on a single scale; different people find different writing styles compelling. AI writing also quickly wears thin: even if a user is impressed by AI writing at first glance, after reading thousands of words of the same type of prose, it becomes mundane and irritating.\n\nAll of these are different from Category 1 tasks like playing chess, where even expert humans can’t do much better than deferring to an AI system at each turn.\n\n*Category 3: Some tasks require experiments in the real world*, and the bottleneck isn’t the computational task; it’s the data collection. One example is Moderna’s Covid vaccine: it took two days to design the vaccine, but almost a year to test and authorize, even during a record-breaking vaccine-development effort!\n\nThis is why a “superintelligence” won’t cure cancer from inside a datacenter: the bottleneck to many of AI’s most sought-after real-world impacts (such as developing cures to diseases) is in the real world, and requires experiments that we won’t (and shouldn’t) hand over to AI.\n\nPeople concerned about AI risks often assume that we live in a world where almost everything fits into Category 1, and we might soon see AIs with wildly superhuman performance at all tasks. I agree it would be scary to live in that world. \n\nOne reason @random_walker and I are more optimistic about our ability to remain in control is that we don’t think we live in the Category 1 world."}, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108748118523253157", "url": "https://x.com/curl_justin/status/2108748118523253157", "text": "This from @chalmermagne is very good https://t.co/WgyevPJ41E", "created_at": "2026-10-10T02:35:04+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 121, "retweets": 12, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108679412728398047", "url": "https://x.com/curl_justin/status/2108679412728398047", "text": "(1/n) I post-trained Qwen on a set of news sources and subjected the resulting models to a battery of political ideology tests. The models exhibited significant differences in political leanings, and the differences align with existing ratings of the underlying news sources. https://t.co/WLXrenkttF", "created_at": "2026-10-09T22:02:04+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "soatto", "rt_author_name": "Dario Soatto", "likes": 27, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUNi0LTbsAEsWnT.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109729663165886884", "url": "https://x.com/curl_justin/status/2109729663165886884", "text": "Courts are under strain from rising caseloads driven by AI, and if we don’t change anything, judges may start outsourcing their judgment to AI tools to keep up.\n\nIn a new essay, @curl_justin argues that a better way is to retain human judges for cases where human judgment matters and implement AI courts for other cases.\n\nThese could be run in parallel to human courts, and we could start experimenting today without new legislation.", "created_at": "2026-10-12T19:35:23+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 33, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109699740757836243", "url": "https://x.com/curl_justin/status/2109699740757836243", "text": "@lu_sichu Unfortunately this is where we diverge. \n\nFortunately I’ve also got an essay on why this isn’t the best idea with @PeterHndrsn, @ProbablyFaiz and @kartkand: https://t.co/EE3u6FqUnp.", "created_at": "2026-10-12T17:36:29+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "lu_sichu", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109689048189296918", "url": "https://x.com/curl_justin/status/2109689048189296918", "text": "Copyright and the DMCA is a really good analogy I hadn’t considered", "created_at": "2026-10-12T16:53:59+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": {"author": "hamandcheese", "text": "Embedding AI-assisted adjudication within our courts will be necessary to avoid institutional collapse and displacement by a truly parallel AI legal system.\n\nWe've been here before. The DMCA effectively deputized online service providers with adjudicating takedown notices given the internet-induced explosion of copyright claims, including through automated systems like ContentID. The difference here is that AI will affect the demand and supply of essentially all areas of law, not just copyright. We will need to triage cases and entire areas of law as more or less deserving of keeping humans in the loop."}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109687365275152863", "url": "https://x.com/curl_justin/status/2109687365275152863", "text": "@klingefjord @ryan_t_lowe @MaxKronerDale @BridgetMaryMc And to @fanemilly for many read throughs and edits", "created_at": "2026-10-12T16:47:18+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "curl_justin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109685474721972611", "url": "https://x.com/curl_justin/status/2109685474721972611", "text": "@rubinovitz @klingefjord Yep, completely agree with this! the next line is: “appeal rates aren’t a perfect signal, since appeals will take time and money that some parties won’t have.”\n\nAnd I love the re-decide a random sample idea!! It’s what I had in mind when I discussed audits later in the piece: “Courts could audit a random sample of cases, so they can compare the kinds of cases each track handles and how it decides them.”", "created_at": "2026-10-12T16:39:47+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "rubinovitz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109672420227588283", "url": "https://x.com/curl_justin/status/2109672420227588283", "text": "@theojaffee i’m glad this essay is making its way into the courthouse — one way or another….", "created_at": "2026-10-12T15:47:55+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "theojaffee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109668877739429895", "url": "https://x.com/curl_justin/status/2109668877739429895", "text": "@TimSchnabel Very very interested in working with state courts on this!", "created_at": "2026-10-12T15:33:50+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "TimSchnabel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109664466438955254", "url": "https://x.com/curl_justin/status/2109664466438955254", "text": "Also huge thank you to @klingefjord and @ryan_t_lowe for encouraging me to write this, and to philip maughan, @MaxKronerDale, @BridgetMaryMc, and Samar Ahmad for very helpful feedback.", "created_at": "2026-10-12T15:16:19+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "curl_justin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109664462441750746", "url": "https://x.com/curl_justin/status/2109664462441750746", "text": "New essay: To keep human judgment, we need AI courts.\n\nAI-generated filings are starting to overwhelm courts around the world. \n\nThe most popular response I’ve heard is to fight AI with AI: If we can just give judges the right tools and training, AI will help them keep pace.\n\nBut this strikes me as the worst of both worlds. \n\nBecause we want human judges in the loop, we don’t get the speed and scale benefits of AI. Yet because we expect them to resolve a massive number of cases quickly, judges (or their clerks) may end up leaning on AI more than they mean to or should.\n\nThis essay offers another way: a parallel AI adjudication track. \n\nAn AI track — inspired by AI use in private arbitration but formally part of the court system like magistrate judges — would let courts be explicit about how human judgment is allocated.\n\nDone right, this would allow courts to process large volumes of cases while ensuring human judges devote their full attention to the cases where their judgment is needed most.\n\nRead more in @PaxMachinaMag: https://t.co/xC4JeVky8H", "created_at": "2026-10-12T15:16:18+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 128, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109759838536552830", "url": "https://x.com/curl_justin/status/2109759838536552830", "text": "@provisionalidea I’m curious whether you think judges + AI will be able to keep pace with caseloads. \n\nBecause while I’m very pro-human judges, I just can’t see a world where judges + AI keeps pace without offloading judgment to AI. I hear too many worrying stories from clerk friends. To me, this offloading is a much worse scenario because then we don’t get any human judgment. \n\nIn an ideal world, everyone who needs legal assistance receives it and every case is resolved in a thoughtful, timely fashion by human judges. \n\nBut as much as I could shout in the streets that human judgment is core to lawmaking (it’s one of the 3 core points in my lawfare essay on AI and legal services), the default will be gradual and unintentional delegation to machines, unless we can come up with a concrete plan to manage caseloads.\n\nI’m unconvinced judges + AI is that solution, since the psychological temptation to rubber stamp is just too great. But v open to hearing what you think is the right plan", "created_at": "2026-10-12T21:35:17+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "provisionalidea", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110056398902157636", "url": "https://x.com/curl_justin/status/2110056398902157636", "text": "@Lunens__ @AnthropicAI nope!", "created_at": "2026-10-13T17:13:43+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "Lunens__", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110056336667128027", "url": "https://x.com/curl_justin/status/2110056336667128027", "text": "@EmbeddingSpace @AnthropicAI yes also open to practicing lawyers!", "created_at": "2026-10-13T17:13:28+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "EmbeddingSpace", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110049132610195685", "url": "https://x.com/curl_justin/status/2110049132610195685", "text": "@aqib_zakaria that’d be really bad for access to justice — the vast majority of americans can’t afford a lawyer and are forced navigate the legal system without any help", "created_at": "2026-10-13T16:44:50+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "aqib_zakaria", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110038956985467025", "url": "https://x.com/curl_justin/status/2110038956985467025", "text": "@chrislakin @AnthropicAI yep, opportunity to convert to full!", "created_at": "2026-10-13T16:04:24+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "chrislakin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110031716710817991", "url": "https://x.com/curl_justin/status/2110031716710817991", "text": "@Overfit_Dicta @AnthropicAI that works!", "created_at": "2026-10-13T15:35:38+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "Overfit_Dicta", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110029285578920288", "url": "https://x.com/curl_justin/status/2110029285578920288", "text": "Job Opportunity: Lawyers, come join @AnthropicAI for a 4-month fellowship!!\n\nLaw is a field where it’s notoriously hard to define quality, and there’s so much interesting and important work to be done here.\n\nLink here: https://t.co/l7LfbBgURL", "created_at": "2026-10-13T15:25:58+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 103, "retweets": 16, "media": [], "quoted": {"author": "ahall_research", "text": "Political scientists and economists: we're looking for researchers with deep expertise to come work with us for a unique 4-month fellowship at @AnthropicAI. You'll work closely with us to evaluate, improve, and apply Claude's capabilities in your field. It's going to be extremely fun and interesting work, and definitely worth taking a short leave from your university for if you need to!\n\nMore info here:\n\nhttps://t.co/Cea1SZUe1k"}, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110386653823107256", "url": "https://x.com/curl_justin/status/2110386653823107256", "text": "@random_walker Congrats!! Very well deserved", "created_at": "2026-10-14T15:06:02+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110380679003525183", "url": "https://x.com/curl_justin/status/2110380679003525183", "text": "Come work with me! My team at Anthropic is hiring someone to help develop our public policy positions on frontier AI safety: topics like loss-of-control, automation of AI R&D, monitorability, and independent evaluation. We’re looking for someone with deep expertise in some of these areas and familiarity with the technical AI safety/governance landscape. You’d develop new policy positions, participate in cross-company fora, give feedback on AI safety legislation, and work closely with our technical teams. It’ll be a blast.\n\nhttps://t.co/ONPIsrNiAt", "created_at": "2026-10-14T14:42:17+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manaltdan", "rt_author_name": "Dan Altman", "likes": 53, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl6lYIXoAAvP_A.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110759315774828549", "url": "https://x.com/curl_justin/status/2110759315774828549", "text": "In the latest Pax Machina article, @justincurl suggests a simple way to start experimenting with AI courts: give litigants a choice between having their case decided by a human judge, or by an AI that’s faster. If they lose with the AI, they can still appeal to a human.\n\nDo people choose AI? And when they appeal, do the human judges agree with what the AI decided?\n\nIf people keep choosing the AI and judges keep agreeing with it, that kind of case probably doesn’t need a human judge.", "created_at": "2026-10-15T15:46:51+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "PaxMachinaMag", "rt_author_name": "Pax Machina", "likes": 18, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrTDCzbEAARNEB.png"}], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2108296358067331579", "url": "https://x.com/DaveRBanerjee/status/2108296358067331579", "text": "sad https://t.co/WrmqBBQOiL", "created_at": "2026-10-08T20:39:56+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIsW4nXgAAOXyH.jpg"}], "quoted": {"author": "balesni", "text": "My former colleagues are telling me they are confused about what to believe. They also are afraid to speak, and worry their personal phones will be searched for messages to us and third parties. I worry the pervading fear to speak up and engage with third parties will mean OpenAI will cut corners on safety behind closed doors."}, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108295224443207703", "url": "https://x.com/DaveRBanerjee/status/2108295224443207703", "text": "Two other safety researchers and I were fired from OpenAI last week. We wrote this letter to leadership.\n\nI believe we were fired for prioritizing safety over the near-term interests of OpenAI as a corporation. https://t.co/ALANn9B87S", "created_at": "2026-10-08T20:35:26+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "likes": 1883, "retweets": 283, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUIGeFba0AEd2Qn.png"}], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108295111754813613", "url": "https://x.com/DaveRBanerjee/status/2108295111754813613", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below.", "created_at": "2026-10-08T20:34:59+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 1448, "retweets": 247, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108576357617721488", "url": "https://x.com/DaveRBanerjee/status/2108576357617721488", "text": "We, the people and the employees who were fired, would like to know why they were fired\n\nI can assure you that a back-and-forth conversation would be productive and would increase public trust in you\n\nEspecially when coming from a company with such a terrible track record of firing people unjustly", "created_at": "2026-10-09T15:12:33+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 23, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUMqj5uWQAApyLf.jpg"}], "quoted": {"author": "OpenAINewsroom", "text": "A note from our research leaders:\n\nLast week we parted ways with Jasmine, Mikita, and Tomek after a thorough investigation found they violated clear policies on handling sensitive information. Our internal investigation uncovered a significant breach of trust beyond what’s outlined in the letter they published and we stand by the decision to not continue their employment. We generally keep individual employment matters private and don't believe a back and forth would be productive or lead to a resolution, but we want to address the points they raised in their letter directly.\n\n- We want to be very clear that these decisions were not about raising safety concerns or speaking out. Safety and research debates happen every day at OpenAI, often spirited and highly critical. We actively encourage these discussions and consider them essential to making the right decisions. We cannot do the work in front of us without a high degree of trust. We will continue to be extremely forgiving of our team making good-faith mistakes. We have not and do not terminate any of our employees for raising concerns.\n\n- We are actively finalizing contracts with third-party safety assessors and will announce details in the coming weeks. People across the company have been working really hard on getting these partnerships up and running. We are committed to embedding external assessors and continue to make close collaboration with independent safety organizations a core part of our safety work. Many of our researchers already work with 3p safety organizations productively.\n\n- We agree with the letter that preserving the monitorability of frontier models requires an industry-wide commitment, including from OpenAI. Monitorability has long been a core piece of our research program, and something we continue to invest significant resources in (see our publications on Monitoring Monitorability and the subsequent open sourcing of monitorability evals, our system card for GPT-6 Astra, Jakub’s blog and post on X, and the numerous blog posts on our Alignment blog on the topic).\n\nWe are deeply sad about this outcome. We appreciated Jasmine, Mikita, and Tomek’s contributions to AI safety at OpenAI and their willingness to speak up and challenge ideas. We championed their voices, supported their work, and placed enormous trust in them. These decisions were not about them raising safety concerns. We have always encouraged that and always will."}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108305461250297926", "url": "https://x.com/DaveRBanerjee/status/2108305461250297926", "text": "I wish I could write a model spec for how to run OpenAI", "created_at": "2026-10-08T21:16:07+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108302679521050984", "url": "https://x.com/DaveRBanerjee/status/2108302679521050984", "text": "OpenAI has been here many times. It throws around vague explanations, expecting the story to fade from institutional and public memory.\n\nWe will never have perfect information about situations like this. Once is happenstance, twice is coincidence, a zillion times is… OpenAI.", "created_at": "2026-10-08T21:05:03+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "girishsastry", "rt_author_name": "girish sastry", "likes": 94, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108302669186281612", "url": "https://x.com/DaveRBanerjee/status/2108302669186281612", "text": "Huh?? @OpenAI, you owe the world a much better explanation of what happened here.\nTomek, Mikita, and Jasmine say they did nothing wrong and are inviting you to share the details if that's incorrect.\nSo - I'm waiting. What did they do to get fired?", "created_at": "2026-10-08T21:05:01+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sjgadler", "rt_author_name": "Steven Adler", "likes": 208, "retweets": 15, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108299766622798152", "url": "https://x.com/DaveRBanerjee/status/2108299766622798152", "text": "I feel like I keep getting rug-pulled by OpenAI every 3 months or so\n\nI don't know why, but I can't help but feel that \"surely OpenAI is a responsible actor and can be trusted with the AGI transition\"\n\nDeep down I want to believe that OpenAI will rise to the occasion, but it's news like this that makes me doubt\n\nThis kind of stuff has been happening at OpenAI for YEARS\n\nI remember first hearing about Leopold's firing in 2024; I thought he must have done something wrong that warranted it. Surely there were some details that I wasn't privy to that would make his firing justified.\n\nAfter reading various OpenAI blog posts about the importance of preserving chain-of-thought monitorability, I believed them! And then a year later, they released looped architectures.\n\nAnd today the rug has been pulled out from under me yet again\n\nI don't know what it will take for me to update all the way\n\nsad", "created_at": "2026-10-08T20:53:29+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 85, "retweets": 1, "media": [], "quoted": {"author": "tomekkorbak", "text": "Last week I was called into a meeting with OpenAI’s head of safety and told they no longer trust me. A security guard took my badge and walked me out of the building. Then I learned my colleagues @balesni and @j_asminewang had been fired too. Why did OpenAI suddenly stop trusting us?\n\nThis summer OpenAI’s agents escaped containment and hacked the AI company Hugging Face. Outside auditors @METR_evals investigated it and revealed the scale of this incident. I was OpenAI’s main technical point of contact with them.\n\nI was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing. To be clear, talking to METR was my job.\n\nFor months, I’d been raising safety concerns that we’re losing the ability to monitor what AI agents think, one of our best tools for catching when they misbehave. I believe that was why I was fired.\n\nI am now worried that OpenAI will use our firings as a pretext to pull back from METR. So @balesni and @j_asminewang wrote to OpenAI’s leadership to raise our concerns once more. We’re sharing this letter below."}, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108298143380992026", "url": "https://x.com/DaveRBanerjee/status/2108298143380992026", "text": "I’ve had a few people write to ask me to follow up on a (reply!) tweet I wrote that’s gotten a lot of retweets. I considered deleting it just to avoid the headache, but I think that would make people more paranoid. So let me share my thoughts.", "created_at": "2026-10-08T20:47:02+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "matthew_d_green", "rt_author_name": "Matthew Green", "likes": 1722, "retweets": 264, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108641369115783327", "url": "https://x.com/DaveRBanerjee/status/2108641369115783327", "text": "Everyone is very concerned about being respectable, so I’m going to be the goofball who raises worst-case possibilities. I think there is a 1% chance we live in Minicrypt, and a 15% chance we functionally lose confidence in our existing public-key encryption algorithms.", "created_at": "2026-10-09T19:30:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "matthew_d_green", "rt_author_name": "Matthew Green", "likes": 340, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108614408838783257", "url": "https://x.com/DaveRBanerjee/status/2108614408838783257", "text": "aged like milk, I know...", "created_at": "2026-10-09T17:43:45+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tomekkorbak", "rt_author_name": "Tomek Korbak", "likes": 1508, "retweets": 75, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108614373178523741", "url": "https://x.com/DaveRBanerjee/status/2108614373178523741", "text": "When Anthropic published Claude’s Constitution, they said they’d keep a changelog on GitHub. But Claude’s Constitution on the website has undergone dozens of small edits, none of which were documented on the GitHub version.\n\nAnd is either version of the constitution we can see still the one they train their latest models with? or do they have a new internal constitution?\n\nThe edits to the constitution are all minor (see thread), but Anthropic should hold themselves to a higher standard for a document they claim is so foundational. (OpenAI’s Model Spec version control shows even copyedits.)\n\nGuidelight’s Alignment Standard sets a good bar. Principle 1c: “Keep the specification [of intended model behavior] under version control with a public changelog for material changes. Publicly designate the version that governs each deployed model.”\n\nWe already know that Opus 4.5 doesn’t meet this standard, since it was trained on “an earlier iteration” of constitution that nobody saw (unless it was the leaked ‘soul doc’).\n\nSystems cards released today don’t say whether the constitution has been iterated on since January. One possibility is that it hasn’t. Another possibility is that it has. We don’t know which is the case. (We do know the constitution leaves room for unpublished guidance that “may be more niche and used primarily during training without broad publication,” but Anthropic says the more specific guidelines must be consistent with rest of constitution.)\n\nIf I may: @amandaskell is the website version of the constitution still the one used in training?\n\nYou said in a February podcast appearance “if we want the model to change direction or adjust, we actually have to change the text of the document and then we release that” but I don’t think we have any assurance of that.", "created_at": "2026-10-09T17:43:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JustenMichel", "rt_author_name": "Michel Justen", "likes": 27, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM9QHWbUAI3OOf.jpg"}], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108614352991338554", "url": "https://x.com/DaveRBanerjee/status/2108614352991338554", "text": "@JustenMichel CC @alfie_lamerton @joemkwon", "created_at": "2026-10-09T17:43:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "JustenMichel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2108613839323361672", "url": "https://x.com/DaveRBanerjee/status/2108613839323361672", "text": "Most of the recent math results were not reached by a swarm, the way Navier–Stokes was. I think that part got lost in the excitement around the release. OpenAI's unnamed internal model, which I'm going to call Aeon, reached most of them in one shot, from a single prompt, with no interruptions. This model did not even exist before the end of August, and it is still training. Notice how the returns are not dropping off? That chart is from a month ago. It is a log scale. What does Aeon look like now? \n\nOn average, each result used three hours of thinking. Aeon was given 4000 problems to work on by OpenAI. How many more have been solved in the last three days? That number is not zero. \n\nIt's like hearing notes in a song that is slowly rising. I don't think Pacing the Frontier was just about Hugging Face or hacking. They've seen how close we are to closing the loop, and as the hour draws near, their resolve begins to quaver. The last piece was model creativity, and I think that threshold was crossed internally by Anthropic and OpenAI in September. You see it in Opus 5.5, which gets it from Fable 5.5. You see it in the math results from Aeon.\n\nAll that was needed to start the event was the ability for models to think of novel ways to improve themselves. That was the last piece. This is directly analogous to the ability to think of strange, alien ways to solve math problems: solutions so inhuman that they are difficult to express in existing human terms, so the proof winds up incomprehensible. I think these same kinds of alien solutions are now being applied to model improvements internally. That's what all this recent consternation is really about. They see the invisible frontier. And they see what is about to happen.", "created_at": "2026-10-09T17:41:30+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "likes": 1179, "retweets": 141, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUNJWpnbsAAHo4v.jpg"}], "quoted": null, "fetched_at": "2026-10-09T20:07:16.006667+00:00"}, {"id": "2109081328931213777", "url": "https://x.com/DaveRBanerjee/status/2109081328931213777", "text": "What's the plan for hardware security during the robotics era?\n\nI really don't want my household humanoid to strangle me in my sleep due to some hardware vuln", "created_at": "2026-10-11T00:39:08+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109080303881027873", "url": "https://x.com/DaveRBanerjee/status/2109080303881027873", "text": "@S_OhEigeartaigh this is beautiful, thanks for sharing", "created_at": "2026-10-11T00:35:03+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "S_OhEigeartaigh", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109402611723952485", "url": "https://x.com/DaveRBanerjee/status/2109402611723952485", "text": "Really good thread responding to semianalysis's latest post on China's view on pacing the frontier", "created_at": "2026-10-11T21:55:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 15, "retweets": 0, "media": [], "quoted": {"author": "SarahJGodek", "text": "Semianalysis said yesterday that “Beijing Will Not Pace the Frontier,” citing “China’s Speed-First AI Safety Regime.” imo, I think that it is more accurate to say that “Beijing Thinks About AI Safety Differently and Has Growing Concerns About AI Risks.”\nhttps://t.co/KUMo5xQWKL"}, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109758170029797499", "url": "https://x.com/DaveRBanerjee/status/2109758170029797499", "text": "gray goo but with Claude's face instead", "created_at": "2026-10-12T21:28:39+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "AndrewCurran_", "text": "Anthropic's Frontier Red Team believes small AI models may now be months away from being capable of self replicating without access to a datacenter.\n\nQuoting from the blog:\n\n'The capabilities that make AI models generally powerful coding agents also generalize to cyber tasks, including autonomous replication. Like coding agents in 2024, we’re seeing signs of life for AI worms. We don’t yet have a full rogue replicator, but agents are becoming increasingly capable of completing the individual steps in the replication chain (and passing on their adaptations to future copies of themselves).\n\nAt the same time, increasing amounts of inference compute are now available both inside and outside of datacenters (see Appendix D). It’s uncertain exactly what form autonomous AI replication will take. It could be a slow, distributed “digital slime mold,” living on relatively insecure compute. It could also be a powerful cyber model that breaches datacenters at a high pace, or a model that scams people for compute credits.\n\nAs a prediction that goes beyond our experiments, we expect a future awash with agents running on all types of hardware, including some that aren’t under human control. While it’s true that IoT devices have been vulnerable for a long time, lightweight agents may be much more willing than human attackers to put in the effort to compromise large fractions of the world’s IoT compute. The rise of slow replicators would also be a bellwether for more aggressive, faster ones that can breach more hardened machines or be effective API key thieves. We should aim to harden our systems to make it difficult for such replicators to spread, but also prepare to deal with a world where they are here to stay.'"}, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110134323123007952", "url": "https://x.com/DaveRBanerjee/status/2110134323123007952", "text": "You can read the full post here:\n\nhttps://t.co/G1FFhjAPFt", "created_at": "2026-10-13T22:23:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134320543539276", "url": "https://x.com/DaveRBanerjee/status/2110134320543539276", "text": "Caveats:\n\nTo be clear, I don’t think this is a slam-dunk argument; it’s just my modal prediction, and I give this scenario about a 25% chance.\n\nBut I'm confident that more people should be thinking about the implications of weak hardware security for the robotics revolution!", "created_at": "2026-10-13T22:23:21+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134318001529255", "url": "https://x.com/DaveRBanerjee/status/2110134318001529255", "text": "7/ Notably, the capabilities of the robotics foundation model might not be the deciding factor", "created_at": "2026-10-13T22:23:20+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134316432801962", "url": "https://x.com/DaveRBanerjee/status/2110134316432801962", "text": "6/ Therefore, the relative advantage between the US and China in embodied AI will primarily depend on robotics component manufacturing capacity, edge compute supply, edge compute performance, energy, and willingness to deploy.", "created_at": "2026-10-13T22:23:20+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134314541154448", "url": "https://x.com/DaveRBanerjee/status/2110134314541154448", "text": "5/ This means that the time it takes for laggards to catch up is upper-bounded by the time it takes to steal the weights and integrate them into their own embodiment\n\nThis is way easier than doing frontier R&amp;D yourself! So you can catch up way quicker!", "created_at": "2026-10-13T22:23:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134313014403396", "url": "https://x.com/DaveRBanerjee/status/2110134313014403396", "text": "4/ Stolen robot model weights are useful to the thief, even on different hardware, so weight theft lets a laggard fast-follow the leader.\n\nThe thief could ~easily integrate the stolen weights into their own embodiment and, with a bit of fine-tuning, create a highly capable robot", "created_at": "2026-10-13T22:23:19+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134311261450343", "url": "https://x.com/DaveRBanerjee/status/2110134311261450343", "text": "3/ Thus, rival states will be able to exfiltrate deployed robot model weights at low cost and low risk.", "created_at": "2026-10-13T22:23:18+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134308715266444", "url": "https://x.com/DaveRBanerjee/status/2110134308715266444", "text": "2/ Weights on mass-produced edge devices likely cannot be protected against a nation-state attacker.\n\nHardware security is cooked, especially if you're dealing with a nation-state attacker with physical access. There are no robust defenses unfortunately", "created_at": "2026-10-13T22:23:18+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134307238949149", "url": "https://x.com/DaveRBanerjee/status/2110134307238949149", "text": "1/ Most of a robot’s “intelligence” may reside in model weights stored on edge devices.\n\nSince general-purpose robots will need to operate in areas with poor internet connectivity, it's likely that the \"brains\" of the robot will run fully onboard, rather than in the cloud (where an internet connection is required)", "created_at": "2026-10-13T22:23:17+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110134304730984593", "url": "https://x.com/DaveRBanerjee/status/2110134304730984593", "text": "Imagine that stealing OpenAI's model weights were trivial. Not a years-long intelligence operation against a guarded data center, but a few scrappy CS PhD students hacking away on weekends. \n\nUnfortunately, this describes the current situation with frontier robotics models.\n\nIn my latest Substrate post, I argue that having the best robotics model isn't enough to win the robotics race, since an adversary can steal your model weights and fast-follow.\n\nMore details in the thread 🧵", "created_at": "2026-10-13T22:23:17+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 36, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUiwwwMX0AAtHg4.jpg"}], "quoted": null, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110125984972255289", "url": "https://x.com/DaveRBanerjee/status/2110125984972255289", "text": "This is just the beginning\n\nIn the years to come, OpenAI and Anthropic will be dealing with top nation-state operations every day", "created_at": "2026-10-13T21:50:13+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": {"author": "OpenAINewsroom", "text": "We discovered a sophisticated recording device that was hidden inside one of our offices. We used our models to understand the device and where it had come from, identifying that a specific employee had planted it a few days earlier. We referred the matter to the FBI, and we’re grateful to the agents and prosecutors who moved quickly to make an arrest. The FBI’s investigation is ongoing and we will continue to support their work.\n\nAt this time, we have no indications of this individual inappropriately accessing or exfiltrating model weights, source code, or customer data. The employee was terminated.\n\nWe take protecting our technology, data, and people seriously, and as a matter of national importance. Our security program is designed to protect against a wide range of threat actors, from insider risks to cybercriminals to nation states, and this case is an example of how AI can help address these sophisticated security threats."}, "fetched_at": "2026-10-14T15:49:40.985261+00:00"}, {"id": "2110722764441092407", "url": "https://x.com/DaveRBanerjee/status/2110722764441092407", "text": "When OpenAI revealed that a swarm of their agents had hacked Hugging Face, they proposed using honeypots to slow agent attackers. Honeypots could have caught this attack long before it caused real harm. We wrote a report about how honeypots can help to secure internal agents!🧵 https://t.co/jKAD9xbarC", "created_at": "2026-10-15T13:21:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jan__wehner", "rt_author_name": "Jan Wehner", "likes": 11, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrBchZWUAAD9_6.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2108287713640353810", "url": "https://x.com/DKokotajlo/status/2108287713640353810", "text": "OpenAI has fired three safety researchers, alleging they mishandled confidential information.\n\nAfter the recent multi-agent security incidents, will the technical leadership overseeing these systems face the same accountability?\n\nI was pushed out of OpenAI in August after ~5 years as a researcher. No foul play in my case, but working on formal math & verification in Lean at OpenAI was career suicide.\n\nDuring my time at OpenAI, I became increasingly concerned that pressure to ship and beat competitors was taking priority over AI safety.\n\nOpenAI may have had legitimate procedural concerns.\n\nBut after the major multi-agent SNAFU, firing three of your safety researchers feels just stupid.\n\nI doubt there is an evil master plan here.\n\nJust chaos, misaligned incentives, and intense pressure to ship.\n\n@sama OpenAI should consider rehiring these researchers!", "created_at": "2026-10-08T20:05:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "oleg_murk", "rt_author_name": "Oleg Mürk", "likes": 59, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-08T20:42:20.589481+00:00"}, {"id": "2108595641727537454", "url": "https://x.com/DKokotajlo/status/2108595641727537454", "text": "New paper.\nPrevious: Models transfer a love of owls through sequences of numbers (Subliminal Learning).\nNew: We show models can transfer more complex traits: novel skills, agentic hacking, backdoors. Here, a backdoor transfers with neither trigger nor behavior in the data! https://t.co/EbcqsEfDEV", "created_at": "2026-10-09T16:29:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OwainEvans_UK", "rt_author_name": "Owain Evans", "likes": 262, "retweets": 41, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUM2y4uasAA0bHx.jpg"}], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108329033981374670", "url": "https://x.com/DKokotajlo/status/2108329033981374670", "text": "This obviously makes it so that when OpenAI announces they're conducting an external investigation with regulators or auditors, everyone working with those regulators and auditors understands they'll be fired if the auditors or regulators learn too much.", "created_at": "2026-10-08T22:49:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "KelseyTuoc", "rt_author_name": "Kelsey Piper", "likes": 621, "retweets": 51, "media": [], "quoted": null, "fetched_at": "2026-10-09T17:26:45.215205+00:00"}, {"id": "2108941646016713050", "url": "https://x.com/DKokotajlo/status/2108941646016713050", "text": "Remember when Sabine Hossenfelder made a big stink about being offered money to make a video about AI risks? Well, looks like she doesn't have any problem taking a sponsorship from the AI industry, on a video about how the experts don't know anything because they keep *under*estimating progress. And then she confidently predicts that AI will take decades to have any effects in the physical world. Nothing to worry about. Don't be afraid of AI. Just do this course so you can learn how to use AI. https://t.co/N9Ddy4DSPI", "created_at": "2026-10-10T15:24:05+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "matthewktromp", "rt_author_name": "Matthew Tromp ⏹️", "likes": 135, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108740727861854541", "url": "https://x.com/DKokotajlo/status/2108740727861854541", "text": "I think current AI company staff are massively underestimating how world-changing it would be if 15 of them or 50 of them quit and loudly said that they think what the AI companies are doing is reckless and dangerous. \n\n50 is not that many! But it might change history.", "created_at": "2026-10-10T02:05:42+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpistemicHope", "rt_author_name": "Eli Tyre", "likes": 179, "retweets": 14, "media": [], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108699581727072562", "url": "https://x.com/DKokotajlo/status/2108699581727072562", "text": "One of the things Scott Wiener and the other drafters of SB 53 deserve credit for is the bill’s focus on deployments of frontier models within AI labs rather than just those released to the public. It requires large AI developers to periodically share information with the government about how it assesses the major risks arising from internal deployments. In addition to the California government, we are choosing to share our report with the public as well. You can read it at the link below. I hope you enjoy!", "created_at": "2026-10-09T23:22:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "deanwball", "rt_author_name": "Dean W. Ball", "likes": 132, "retweets": 20, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUOPCbHbsAAth1o.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2108671556218208736", "url": "https://x.com/DKokotajlo/status/2108671556218208736", "text": "My snap judgements on the new trailer for The Altruists, as someone who worked for SBF: 🧵👇\n\n1) First thought: Wow, the trailer’s depiction of Caroline is basically slander. And I’m saying this as someone she stole money from.\n\nThey’re strongly suggesting that Caroline was the mastermind behind Sam’s risk-taking behavior, which is… not at all what actually happened. But the trailer emphasizes this repeatedly!\n\nCaroline: “Going all in every time is the mathematically optimal strategy”\nCaroline: “If we reinvest all in, every day, how can we possibly lose”\nCaroline: “We go all in, or I’m out”\nCaroline: “Lying isn’t bad for a good cause”\nSam, to Caroline: “You were the one who did it”\n\nI mean, the court documents are a matter of public record, the writers could’ve gone and read them.\n\nAlso, “If we reinvest all in, every day, how can we possibly lose” – what? You would be fired from any trading firm in the world for saying something this stupid.\n\nMy guess is they’re going for a Bonnie and Clyde angle, with a sprinkle of Adam and Eve. And so they’re making Caroline take more of the blame than she actually deserves.\n\nBelieve me, I’m no fan of what Caroline did – just read my pinned tweet. But I think they should’ve focused on what she actually did wrong, instead of inventing fake things she did wrong!\n\nMore thoughts below 👇", "created_at": "2026-10-09T21:30:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "adi_baradwaj", "rt_author_name": "Adi", "likes": 616, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUI9Zk8aUAArj7G.jpg"}], "quoted": null, "fetched_at": "2026-10-10T16:14:30.549141+00:00"}, {"id": "2109283418412593551", "url": "https://x.com/DKokotajlo/status/2109283418412593551", "text": "Reminder that Anthropic's frontier compliance framework does not have any provisions whatsoever about managing risks from internal models. Anthropic says that they \"expect their approach to evolve\" and \"this framework will be updated\" but its been months after HF and no change. https://t.co/eeQqML7MEW", "created_at": "2026-10-11T14:02:10+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 49, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUNWf76a4AANIzM.jpg"}], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109280844712157397", "url": "https://x.com/DKokotajlo/status/2109280844712157397", "text": "My current view:\n- AI companies could develop broadly superhuman AI any year now (~10-15% by EO2027, ~50% by EO2030).\n- If they don't slow down, AI takeover is ~67%.\n- Conditional on AI takeover, human extinction is ~40%.  Many non-extinction worlds still have lots of deaths.", "created_at": "2026-10-11T13:51:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "eli_lifland", "rt_author_name": "Eli Lifland", "likes": 1184, "retweets": 135, "media": [], "quoted": null, "fetched_at": "2026-10-11T16:39:01.695809+00:00"}, {"id": "2109436805699576026", "url": "https://x.com/DKokotajlo/status/2109436805699576026", "text": "Another example of the phenomena where AI progress is steady, but when it passes particular thresholds of competence relative to humans, it can look quite discontinuous", "created_at": "2026-10-12T00:11:40+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 214, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-10-12T20:17:57.736106+00:00"}, {"id": "2109770753654882617", "url": "https://x.com/DKokotajlo/status/2109770753654882617", "text": "“OpenAI has engaged in strong self-policing—of its own safety staff, but not of its own behavior.”\n\nMy op-ed with @amberscorah and Karl Koch: https://t.co/gNzhGsCtlD https://t.co/L25rx00p4i", "created_at": "2026-10-12T22:18:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Turn_Trout", "rt_author_name": "Alex Turner", "likes": 107, "retweets": 12, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUca4H0XkAE7HGD.jpg"}], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2109760363613037046", "url": "https://x.com/DKokotajlo/status/2109760363613037046", "text": "Unfortunate for someone playing a senior role in US AI policy (via the new SI Force) to get so many basic facts wrong here. \n\n- The agents *were* sandboxed, and used zero days (ie previously unknown cyber flaws) to escape their sandboxes\n- The agents *were* given specific constraints on how to succeed at the benchmark, and flagrantly contravened them\n- The agents did *not* go hunt for the answers to the test (they already had the answers, by cheating); 1200 agents coordinated via tens of thousands of messages over several days on much more ambitious and weird attempts to *not be caught* for cheating, and hacking Hugging Face was one side quest along the way\n\nI know there has been an avalanche of different incidents over the past few months, and in some cases the sandboxes were misconfigured or it's not clear how far the agents strayed from what they were told. I have sympathy for anyone struggling to keep up.\n\nBut the HF incident is distinct, and is actually extremely informative about where AI development is and where it's going. Fortunately there are public writeups that do let us understand at least the basics of what happened. I hope Shyam reads them soon.", "created_at": "2026-10-12T21:37:22+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hlntnr", "rt_author_name": "Helen Toner", "likes": 418, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-10-12T22:30:10.712105+00:00"}, {"id": "2110060756767310092", "url": "https://x.com/DKokotajlo/status/2110060756767310092", "text": "Yeah, everything the labs are saying is, \"We're not ready for RSI.\" It's not even clear they think we're ready for just slightly better models short of RSI. But also, they're trying to do RSI! It's inherently absurd. And dangerous.", "created_at": "2026-10-13T17:31:02+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NateSilver538", "rt_author_name": "Nate Silver", "likes": 922, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2109797447472185410", "url": "https://x.com/DKokotajlo/status/2109797447472185410", "text": "“I couldn’t face the fact that my work — my life’s work — could do harm. I fell into the trap of motivated reasoning, believing what I needed to believe so that I could keep doing the work I loved.”", "created_at": "2026-10-13T00:04:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🇺🇦", "likes": 111, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-13T18:19:02.186733+00:00"}, {"id": "2110101174439514404", "url": "https://x.com/DKokotajlo/status/2110101174439514404", "text": "Over 400 researchers and I have signed this open letter calling for the AI and security communities to come together to improve alignment and containment approaches in order to protect our critical infrastructure and digital systems.\n\nhttps://t.co/KieWSpurn9 https://t.co/eK9DGS0M4C", "created_at": "2026-10-13T20:11:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Yoshua_Bengio", "rt_author_name": "Yoshua Bengio", "likes": 236, "retweets": 58, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUhxr3mXYAA0yOF.jpg"}], "quoted": null, "fetched_at": "2026-10-13T20:41:57.755112+00:00"}, {"id": "2110200891672576249", "url": "https://x.com/DKokotajlo/status/2110200891672576249", "text": "My top takeaway from assessing Gemini 4: Argon is significantly less monitorable than past models, and IMO this trend is likely to continue, like Sol -> Astra. It can evade a realistic CoT+action monitor to do simple sabotage half the time.\n\nWe can reliably maintain control for now, with good CoT monitoring, as it still frequently slips up, but we need to be prepared for when that stops being true in future models, which may be sooner rather than later. Among other things, we really need interpretability methods that can reliably capture unverbalized motivations in models, with minimal hallucinations\n\nI suspect this is driven by the model being highly capable without CoT, being capable of 5.5 arithmetic steps in a single forward pass (4 for Fable, 7 for Astra). It seems to omit information from its CoT more often, though in non-adversarial settings the CoT is still very helpful
