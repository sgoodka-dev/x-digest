outputs\n\nobvious implications for bootstrapping https://t.co/8bcE2TkCLm", "links": {"https://t.co/8bcE2TkCLm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanXE0bAAEMgI5.jpg"}], "url": "https://x.com/mentalgeorge/status/2123068291908567432", "created_at": "Wed Nov 18 14:58:20 +0000 2026"}], "enriched": 3}, {"id": "2123102544826384746", "url": "https://x.com/mentalgeorge/status/2123102544826384746", "text": "More and more people are calling on U.S. frontier AI companies to pause, but when should they actually do so? \n\nI try to answer this question in a new blog post, summarized neatly by the two attached images\n\nTL;DR: A lengthy pause now would be premature, but shorter pauses tied to addressing specific safety problems are likely good\n\nlink below", "created_at": "2026-11-18T17:14:26+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "_achan96_", "rt_author_name": "Alan Chan", "rt_avatar": "https://pbs.twimg.com/profile_images/2017566584789680128/PvrnyFwC_normal.jpg", "rt_id": "2123091503362789862", "likes": 41, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXa8HyIWYAE5SE-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXa8I3UWcAAd0um.jpg"}], "links": {"https://t.co/9mCKhrJgEX": ""}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "thread": [{"id": "2123091507305709801", "author_handle": "_achan96_", "author_name": "Alan Chan", "text": "https://t.co/sMiblmOuXI", "links": {"https://t.co/sMiblmOuXI": "https://astrangeattractor.substack.com/p/when-should-us-frontier-ai-developers"}, "media": [], "url": "https://x.com/_achan96_/status/2123091507305709801", "created_at": "Wed Nov 18 16:30:35 +0000 2026"}, {"id": "2123091747479884170", "author_handle": "_achan96_", "author_name": "Alan Chan", "text": "Thanks to @JakeASteckler @Manderljung @ZilanQian @mentalgeorge and @sj_manning for feedback on this piece!", "links": {}, "media": [], "url": "https://x.com/_achan96_/status/2123091747479884170", "created_at": "Wed Nov 18 16:31:32 +0000 2026"}], "enriched": 3}, {"id": "2123082570447704515", "url": "https://x.com/mentalgeorge/status/2123082570447704515", "text": "@_AashishReddy Not entirely sure i follow the above, trying to paraphrase. is the argument:\n\n- good writing is solved with next token prediction\n- they will get better at next token prediction\n- once they are, they can also discern good writing", "created_at": "2026-11-18T15:55:04+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "reply_to_id": "2123080485651808687", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T19:24:11.518095+00:00", "parent": {"id": "2123080485651808687", "author_handle": "_AashishReddy", "author_name": "Aashish Reddy", "text": "@mentalgeorge People always say this but isn't it just obvious that the same \"good writing vector\" would be employed for producing as well as judging writing. This seems orthogonal to their ability to predict tokens for what humans (e.g., at Epoch) would judge the gold standard. The latter is a capabilities issue, the former isn't, and so we should expect them to get good at the second thing as capabilities improve. And if that's right then it doesn't necessarily have those implications re bootstrapping.", "links": {}, "media": [], "url": "https://x.com/_AashishReddy/status/2123080485651808687", "created_at": "Wed Nov 18 15:46:47 +0000 2026"}, "enriched": 3}, {"id": "2123263144424325156", "url": "https://x.com/mentalgeorge/status/2123263144424325156", "text": "@NathanB60857242 Leave it up! Always good to see the motions", "created_at": "2026-11-19T03:52:36+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "NathanB60857242", "reply_to_id": "2123241803122090420", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "parent": {"id": "2123241803122090420", "author_handle": "NathanB60857242", "author_name": "Nathan Barnard", "text": "i think this was a pretty bad tweet that was mostly caused by me feeling strong social pressure to update towards very short timelines and i'm unsure if i should take it down.", "links": {}, "media": [], "url": "https://x.com/NathanB60857242/status/2123241803122090420", "created_at": "Thu Nov 19 02:27:48 +0000 2026"}, "enriched": 3}, {"id": "2123467800442511539", "url": "https://x.com/mentalgeorge/status/2123467800442511539", "text": "Here are some things you might want to know about China and AI: \n\n- A \"Chinese HuggingFace\" might never become public \n\n- Beijing’s criticism of Anthropic has been unusually direct, even by the standards of its past attacks on American companies\n\n- Mythos, more than anything, changed how the CCP viewed AI\n\n- Jiang Shigong is the most interesting non-dissident Chinese intellectual (admittedly, not on AI, but important to know nonetheless).\n\nYou can learn all of this, and so much more, in my latest interview with @JulianGewirtz. \n\nJulian is a researcher at Columbia and served under Biden as the White House’s Senior Director for China and Taiwan Affairs and the State Department’s Deputy China Coordinator. \n\nHe’s also the author of the best book on the pivotal decade of modern China's history (the 80s), and blogs at https://t.co/OzMWQ7THBg\n\nJulian was the person my relevant-expert friends told me to interview on China - and I'm glad they did! \n\nWatch it wherever you get your podcasts.", "created_at": "2026-11-19T17:25:50+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123415588064141312/img/Yq6sV_7-3GdptGib.jpg"}], "links": {"https://t.co/OzMWQ7THBg": "https://juliangewirtz.substack.com/", "https://t.co/R1XAY1eEjQ": ""}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2122337601034354776", "url": "https://x.com/ohlennart/status/2122337601034354776", "text": "governing through the cloud", "created_at": "2026-11-16T14:34:49+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 9, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122361088259830095", "url": "https://x.com/ohlennart/status/2122361088259830095", "text": "metaphorically and practically", "created_at": "2026-11-16T16:08:09+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "reply_to_id": "2122337601034354776", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122337601034354776", "author_handle": "ohlennart", "author_name": "Lennart Heim", "text": "governing through the cloud", "links": {}, "media": [], "url": "https://x.com/ohlennart/status/2122337601034354776", "created_at": "Mon Nov 16 14:34:49 +0000 2026"}, "enriched": 3}, {"id": "2121374643839730171", "url": "https://x.com/sayashk/status/2121374643839730171", "text": "Are we in an intelligence explosion? This is one of the most important questions facing society right now. @lugaricano and I tried to put structure on this question and provide estimates based on currently available data.\n\nMETR recently reported that frontier capability growth roughly doubled after October 2025---but this is accompanied by annualized R&D spending growth of ~6x and technical staff ~3x over the same window. That highlights a crucial distinction between scaling laws--exponential capability gains bought with exponentially rising inputs--and an intelligence explosion (IE), where AI begins substituting for external inputs so each advance makes the next one easier.\n\nWe estimate several versions of a research production function (building on @ChadJonesEcon, @bfjo, and @Ph_Aghion) where a key parameter crossing a threshold signals an IE, while values below it correspond to an \"ideas are harder to find,\" diminishing-returns world. Across specifications, our estimates sit below that threshold. Allowing for a break at METR's October 2025 cutoff points to a one-time step up in research effectiveness, with the rate of diminishing returns being nearly identical on both sides of the cutoff.\n\nA few things to note. First, this exercise is not a forecast. It's an attempt to put structure on some of the important questions being debated right now: RSI, IE, scaling laws all depend on how outputs scale with inputs, and how feedback loops accelerate/decelerate this process. These estimates can change, and change very quickly. \n\nSecond, we are very explicit that the results are based on publicly available data; it is very much possible that METR had access to data that would change the estimates.\n\nThird, we might be wrong! Let us know what you think:\n\nhttps://t.co/xMLZlSlxdY", "created_at": "2026-11-13T22:48:22+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "rt_avatar": "https://pbs.twimg.com/profile_images/1994816403359010817/0zMDGpbF_normal.jpg", "rt_id": "2121350760843931912", "likes": 285, "retweets": 49, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXCNRklWAAEJKxq.png"}], "links": {"https://t.co/xMLZlSlxdY": "https://aleximas.substack.com/p/are-we-approaching-an-intelligence", "https://t.co/CYuGeQaESv": ""}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2123165235817099501", "url": "https://x.com/sayashk/status/2123165235817099501", "text": "Hadn't yet taken the time to read through Epoch's write-ups of getting AI to \"automate Epoch\", but man there's some gems in there\n\nFor a short blogpost, compare the topic chosen by a human (maths preprints are using AI more and more) to the one chosen by Astra 6 (💀) or Astra 6.2 (🤡)", "created_at": "2026-11-18T21:23:33+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2123068261374021796", "likes": 61, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanU2vbAAAf6EP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXanVHFaoAAbrJ5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXanVSjbMAAZ9jf.jpg"}], "links": {"https://t.co/4FK8WgpNM6": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "thread": [{"id": "2123068276666433749", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "When asked to design an experiment using novel chess variants to measure OOD generalisation, all models use existing chess variants they claimed they've invented de novo.\n\nHilariously, Argon does this despite establishing that the models it's testing already know the variants https://t.co/KIgDvgHZeJ", "links": {"https://t.co/KIgDvgHZeJ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanWMjaoAAwVQN.jpg"}], "url": "https://x.com/mentalgeorge/status/2123068276666433749", "created_at": "Wed Nov 18 14:58:16 +0000 2026"}, {"id": "2123068291908567432", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "text": "But - best of all - the models almost universally prefer their own slop to gold standard human outputs\n\nobvious implications for bootstrapping https://t.co/8bcE2TkCLm", "links": {"https://t.co/8bcE2TkCLm": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXanXE0bAAEMgI5.jpg"}], "url": "https://x.com/mentalgeorge/status/2123068291908567432", "created_at": "Wed Nov 18 14:58:20 +0000 2026"}], "enriched": 3}, {"id": "2123164605094690917", "url": "https://x.com/sayashk/status/2123164605094690917", "text": "excellent reporting by @jasminewsun in the NYT today about the strange and idiosyncratic myths that the company behind the soon-to-be largest IPO in history believes about itself https://t.co/PXVgXNbodY", "created_at": "2026-11-18T21:21:03+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "MatthewDSun", "rt_author_name": "Matthew Sun", "rt_avatar": "https://pbs.twimg.com/profile_images/2095370217404948480/YhOmCqWo_normal.jpg", "rt_id": "2123116387279540733", "likes": 230, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXbTGmQbIAAo_wI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbTGmPb0AAg81p.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbTGmWbEAER9Wb.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbTGmQbIAAo_wI.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbTGmPb0AAg81p.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXbTGmWbEAER9Wb.jpg"}], "links": {"https://t.co/PXVgXNbodY": ""}, "quoted": null, "fetched_at": "2026-11-18T22:36:15.539422+00:00", "enriched": 3}, {"id": "2123411390148841660", "url": "https://x.com/sayashk/status/2123411390148841660", "text": "All of this is correct. As I keep telling people: if the win condition is to turn AI 2027 into AI 2040 then we have to keep doing this for 13 more years. \n\nStill I am frustrated by how frequently institution building, pluralism, uncertainty, downside risk, and the like give people psychological cover to take their hands off the wheel and fretting about unforeseen effects, usually with nothing actually learned from this collective rumination. These values are fully consistent with acting with the urgency of a man possessed. The hedger needs to solve more problems than the dogmatist in order to hedge on their uncertainty. This should lead to even greater urgency, not less. We need to do *everything* faster.\n\nIt can also be true (and is true) that if you have a ton of model uncertainty about how AI will go, you'll still need to urgently sprint on certain problems. Because they are sufficiently likely, if they happen then they happen earlier, and if they happen they are catastrophic for any plan. With wide uncertainty you have to place some bets on the highest points of leverage.\n\nA rising star in my graduate program told me that the solution to running out of back burners is just to get more burners. I agree. The solution is pluralistic growth: grow the short timelines school, grow the resilience school, grow the venture-backed problem solvers, as urgently as possible.", "created_at": "2026-11-19T13:41:41+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "tyler_m_john", "rt_author_name": "Tyler John", "rt_avatar": "https://pbs.twimg.com/profile_images/2031125245084712960/OORFbzMI_normal.jpg", "rt_id": "2123406056931963241", "likes": 20, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123257805205651811", "url": "https://x.com/sayashk/status/2123257805205651811", "text": "@sayashk I find it particularly odd that people are updating their timelines and level of certainty so much based on the recent METR report. \n\nThe main reasons to have longer timelines or to expect more diffuse changes from AI remain unchanged — they have more to do with expecting that there will be barriers to change or to highly general progress (fuzzy tasks, difficulty generalizing, not solving continuous learning, etc). Seeing short-term uplift in AI capabilities doesn’t really change how likely those plateaus or barriers are.\n\nIf you thought that scale alone may not lead to highly general systems, that resolve all problems, and self adopt, it’s pretty reasonable to not change your models that much.\n\nI do think that insofar as you expect that scale solves most things, that AI R&D will cause RSI at pretty low levels, and that software only intelligence explosions solve most of your other problems, then the report should make you think that world is coming even faster. But that’s a very specific risk model.\n\nIf (like me) you put some stock in each of those scenarios, the METR report changes your priorities a bit, but mostly with respect to your shortest term interventions. It doesn’t devalue all the other work.\n\nLike you, I worry that the epistemic incentives are very bad right now (in a realm that, historically, I think has been largely unfairly maligned and got more flack than they deserved)", "created_at": "2026-11-19T03:31:23+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2123254757968040349", "likes": 38, "retweets": 2, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123217804216455315", "url": "https://x.com/sayashk/status/2123217804216455315", "text": "AI safety is a marathon, not a sprint\n\nThe views of the AI safety community are quickly converging on a fast takeoff within the next year. But this relies on a few low-quality data points from AI companies and contested models of the world.\n\nI worry that this convergence will degrade the epistemic environment and make good decisions about AI policy and deployment harder. Forget about predicting the future; it will be (and sometimes already is) hard to adjudicate claims about the present.\n\nIt also pushes the community’s energy toward blunt instruments such as generalized bans on AI development, at the cost of decentralized, society-wide approaches that improve resilience. And it normalizes extraordinary government interventions and authoritarian actions.\n\nI hope that even people who are worried about imminent superintelligence and takeover risks can see that the epistemic homogeneity in the AI safety community is unhealthy. The community’s entire focus seems to be on one threat model, backed by contested data points, when it should be prepared for a range of scenarios.\n\nFive ways in which this shows up:\n\n1) Updating heavily on limited evidence. \n\nProminent commentators have shifted their views based on benchmark accuracy numbers. Of course, benchmarks have some signal. But anything that can be benchmarked is by definition verifiable, so it can be optimized for with reinforcement learning. Still, the community has coalesced around the view that these numbers point to superintelligence emerging in 2027.\n\n2) Focusing analysis and interventions exclusively on AI companies. \n\nLittle of the community’s analysis covers how AI is diffusing, or how institutions outside the AI industry are adapting. So almost every incident is seen as a story about model capabilities. The recent outages at Microsoft, United, and the NSA, and the FAA ground stop, all saw vagueposting about the latest cyberattack by an advanced AI model; none of them was the result of an AI cyberattack. The NSA’s outage came from patching vulnerabilities that were found with AI tools, which is a consequence of AI diffusion. But this is not nearly as compelling as the AI cyberattack story, so it didn't get a lot of attention.\n\n3) Ignoring institution- and capacity-building in favor of blunt (and potentially authoritarian) interventions. \n\nIn response to concerns around imminent superintelligence, many of the policy recommendations rely on extraordinary government action that veers into authoritarianism. Most are generalized bans on AI training; few build the institutional capacity to absorb AI’s impacts across society. \n\nBut the cost of building frontier models is decreasing rapidly, so even if we were somehow able to ban AI development today, these bans wouldn't be effective at preventing societal risks. They will also leave us worse prepared for when a capable model is openly released, or an adversarial nation state develops one, since our institutions will not be ready for the fallout.\n\n4) Adopting a “soldier mindset” instead of forming independent views. \n\nOne dynamic I have observed firsthand is that many people in the safety community take the word of prominent commentators as gospel and do not question their claims or methods, which compounds these problems. Even the debates happen within the community’s frame, such as its reliance on subjective probability estimates for AI’s existential risks. So the community is homogeneous in its methods as well as its views.\n\n5) Treating AI safety as a sprint. \n\nTo be clear, I think AI capabilities will continue to increase over the next few years, and we need to dramatically improve our responses to AI risks. But that means preparing society to absorb a transformative technology, which goes well beyond heading off the current worry about an intelligence explosion. Remaking our institutions is a decades-long process; we can’t solve it by pushing AI back in the box.\n\nMy worry is that today’s views lead us into a perpetual state of unproductive alarm. Even if “superintelligence in 2027” doesn’t materialize, AI progress won’t stop, so I expect the community will keep its narrow focus on AI development. A far more productive outcome would be to update its causal models of the world and treat resilience, institutions, and diffusion more seriously.", "created_at": "2026-11-19T00:52:26+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 136, "retweets": 29, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T15:53:10.855245+00:00", "enriched": 3}, {"id": "2123480184200266106", "url": "https://x.com/sayashk/status/2123480184200266106", "text": "In most of the recent cases of website outages, when AI was involved at all, it was a matter of AI improving cybersecurity and safety by helping defenders find and fix long-standing bugs, even if it meant briefly taking down systems to roll out updates. For two decades, automated vulnerability detection has helped defenders over attackers, and AI's impact so far is mostly consistent with that trend. \n\nThis is no reason for complacency. There is a long way to go, with a huge amount of accumulated security debt to fix, and tail risks remain possible. But the \"AI is causing outages\" narrative is too simplistic.", "created_at": "2026-11-19T18:15:02+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "rt_avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "rt_id": "2123417257237753877", "likes": 24, "retweets": 6, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "enriched": 3}, {"id": "2123516185975136648", "url": "https://x.com/sayashk/status/2123516185975136648", "text": "Rare photo below of me wearing something other than shorts and a t-shirt to give a congressional briefing on AI cybersecurity policy this morning below!\n\nHere's what I think policymakers should focus on in the next Congress:\n\n1) Fix device, software, and cloud platform vendor liability for security flaws so vendors are incentivized to ship and maintain security-hardened products.  Tech security liability has been broken for many years (just to give one example; a poorly managed vuln in the enterprise software product MOVEit affected 95.8 million people in 2023 and thousands of orgs; the vendor bore a miniscule fraction of the billions in damages!  Many such cases.)\n\n2) Ensure defenders and security vendors can innovate with AI by supporting a nuanced policy around open weights.  I'm not a purist here; it's possible we should limit open-weight companies' ability to train, say, end-to-end cyberattack capabilities into their models.  But overall, we know that defenders will need good models specialized to security verticals to succeed.  We need cheap models that can keep up with organizations' log firehoses, on-device models that can run on devices without an Internet connection (e.g. in national defense settings), and innovation from cybersecurity companies with specialized cyber datasets.\n\n3) Policymakers should enable, nudge, and force AI providers to coordinate around denying attackers access to AI inference and hardware.  We need clear expectations for labs around how quickly they detect attackers misusing their tech and how quickly they deny their tech to attackers afterwards.  Closed labs, open-weight inference providers and AI hardware providers should be exchanging threat intelligence with each other, the FBI and the intelligence community through a shared 'AI security observatory' so attackers can't just jump from one vendor to the next.\n\n4) Coordinate with China on catastrophic cyber risk.  The US and China have a shared interest in ensuring AI-accelerated cybercrime doesn't make the Internet ungovernable and untrusted as the substrate for global commerce and communications.  There's no prisoners' dilemma in sharing threat intelligence with China on cybercrime like ransomware so American and Chinese companies can deny attackers access to inference.  Also, agent swarm cyber weapons will soon be a new class of weaponry whose risks we need to mitigate at the geopolitical level; no realistic level of technical hardening can mitigate the threat from these, so this new threat needs to be managed through cooperation under competition between geopolitical actors.\n\nWould love feedback on these slides -- https://t.co/T9w0oC1b4h.  \n\nFor mutuals, please reach out over DM if you're interested in coming to a reception on these topics in DC tonight as well!", "created_at": "2026-11-19T20:38:06+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "rt_avatar": "https://pbs.twimg.com/profile_images/1072897105679671296/mlN8zCx-_normal.jpg", "rt_id": "2123498105018749289", "likes": 31, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgo_5lXAAAYJWZ.jpg"}], "links": {"https://t.co/T9w0oC1b4h": "https://docs.google.com/presentation/d/1dEIJE7b_kDFxZzpw4d0q4MjAC9P1tgxb/edit?slide=id.p1#slide=id.p1", "https://t.co/xDKzeqiyAF": ""}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2121310297193652494", "url": "https://x.com/testingham/status/2121310297193652494", "text": "@theojaffee @datagenproc @GregHBurnham If you think Napoleon could be a bad drop-in worker?\n\nMaybe Napoleon is bad as an executive assistant, or copy-editor, or legal assistant. But he's still clearly takeover-capable.", "created_at": "2026-11-13T18:32:41+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "theojaffee", "reply_to_id": "2121293970819133667", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121293970819133667", "author_handle": "theojaffee", "author_name": "Theo Jaffee", "text": "@datagenproc @GregHBurnham How would you get a takeover-capable AI that isn't a productive drop-in worker?", "links": {}, "media": [], "url": "https://x.com/theojaffee/status/2121293970819133667", "created_at": "Fri Nov 13 17:27:49 +0000 2026"}, "enriched": 3}, {"id": "2121677362941292781", "url": "https://x.com/testingham/status/2121677362941292781", "text": "Recently i've found myself getting more upset with discussions of AI risk on X\n\nLike, often it feels like the sceptics are just dunking on ppl who are worried\n\nAnd it's tough bc these issues are really complicated. I don't think there's any water tight case for an intelligence explosion happening soon, or it leading to AI takeover\n\nSo there are loads of genuine uncertainties and ambiguities, and of course sceptics can and should raise them.\n\nBut it's upsetting when they present them as slam-dunk proofs that the whole AI risk is flawed and silly.\n\nLike, do you really think that no one has thought of this before? Are you actually curious about whether your objection holds up? Remember how most issues are really complicated, and ppl are often wrong about stuff?\n\nAnd the bigger picture here is that hundreds of top experts inside and outside the industry think this will be a complete disaster. Like, that is obviously fucking scary and we should take it very seriously, not notice an apparent flaw in the argument and move on.\n\nTo be clear, AI safety ppl can be annoying too. Historically, I've found them much more annoying to be honest. I've felt pressure not to say stuff that vibes as 'anti-safety', and noticed ppl engaging in bad faith with me when i do.\n\nI know none of this is specific to AI safety. Public discourse is dogshit on every topic. And probably X is waay better than average. But i still think it's a disgrace how low the standard is.\n\nFor a topic this important everyone on both sides should try to do better", "created_at": "2026-11-14T18:51:16+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2121664725020983500", "likes": 123, "retweets": 9, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-14T19:56:27.045106+00:00", "enriched": 3}, {"id": "2123481082545004950", "url": "https://x.com/testingham/status/2123481082545004950", "text": "@fleetingbits oh super intersting! ty!", "created_at": "2026-11-19T18:18:37+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "fleetingbits", "reply_to_id": "2123480979381911615", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123480979381911615", "author_handle": "fleetingbits", "author_name": "FleetingBits", "text": "@testingham chat is a bit waffely but i think it means things like the great depression https://t.co/eQwacU98By", "links": {"https://t.co/eQwacU98By": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgerwYacAAPrQr.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXgerwSakAAGhub.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXgerwYacAAPrQr.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXgerwSakAAGhub.jpg"}], "url": "https://x.com/fleetingbits/status/2123480979381911615", "created_at": "Thu Nov 19 18:18:12 +0000 2026"}, "enriched": 3}, {"id": "2123479997860225199", "url": "https://x.com/testingham/status/2123479997860225199", "text": "@fleetingbits could you expand on \"a fear that the building might look expensive\"?", "created_at": "2026-11-19T18:14:18+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "fleetingbits", "reply_to_id": "2123478952274706812", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123478952274706812", "author_handle": "fleetingbits", "author_name": "FleetingBits", "text": "@testingham i asked chat about this and it seems to think the cheap through mass production explanation is right for wallpaper and guilding but that civic architecture really was declining budgets / a fear that the building might look expensive to people", "links": {}, "media": [], "url": "https://x.com/fleetingbits/status/2123478952274706812", "created_at": "Thu Nov 19 18:10:09 +0000 2026"}, "enriched": 3}, {"id": "2123478703049159097", "url": "https://x.com/testingham/status/2123478703049159097", "text": "@gleech interesting, but I find the argument a bit complicated to follow.  \n\nHe says music & literature went modernist too, & for those forms the cost of decoration didn't fall? But they also didn't use less decoration? Modernist literature and music are still pretty ornate, just in different directions?", "created_at": "2026-11-19T18:09:09+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "gleech", "reply_to_id": "2123474480345530527", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123474480345530527", "author_handle": "gleech", "author_name": "gavin leech", "text": "@testingham Hughes doesn't either working. Seems like an honest to goodness ideological shift plus snowballing mimesis\n\nhttps://t.co/0X0wmisYYL", "links": {"https://t.co/0X0wmisYYL": "https://www.worksinprogress.news/p/cheap-ornament-and-status-games"}, "media": [], "url": "https://x.com/gleech/status/2123474480345530527", "created_at": "Thu Nov 19 17:52:23 +0000 2026"}, "enriched": 3}, {"id": "2123477039231729743", "url": "https://x.com/testingham/status/2123477039231729743", "text": "- L = expenditure on humans\n- K = expenditure on agents\n- F(K,L) = output\n- s = K / (K + L) = agent expenditure share\n- a = [F(K,L) − F(0,L)] / F(K,L) = agent contribution to output\n- Assume constant returns to scale and optimal allocation of expenditure, so F_K = F_L.\n- m = ([F(K,L) − F(0,L)] / K) / F_K = ratio of avg returns to marginal returns on agent expenditure, generally expect m>1.\n- We get this: a/s = m\n- So agent contribution should be *larger* than its expenditure share.\n- If avg returns are much higher than marginal returns, then agent contribution will be much larger than its expenditure share.", "created_at": "2026-11-19T18:02:33+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2123475855729172611", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123475855729172611", "author_handle": "testingham", "author_name": "tom cunningham", "text": "The uplift from agents should *exceed* the incremental expenditure on agents. \n\nThe difference depends on the degree of diminishing returns to tokens: if there are severely diminishing returns then we should expect a big uplift to be accompanied by a small expenditure.\n\nQ: Given uplift, what should spend be?\n\n- Suppose we expect agents to cause a 3x productivity uplift at METR, should we budget spending 3x more?\n\n- No, we should spend proportionately less. If it was 3x more we could've got the same output just by hiring more people.\n\n- The difference depends on the degree of diminishing returns to agent spend, i.e. ratio of marginal to average returns. We’d only expect 3X more expenditure if returns are linear.\n\nQ: Given spend, what should uplift be?\n\n- Suppose OpenAI is spending the same on agents as on humans, does that imply they’re getting a 2x uplift?\n\n- No, it implies they’re getting more than 2x uplift. If it was 2x they could've got the same just by hiring more people.\n\n- The difference depends on the degree of diminishing returns to agent spend. We’d only expect 2x uplift if returns are linear.\n\nThe relationship depends on the degree of diminishing returns from agent-expenditure.\n\n- If the returns are close to linear, then uplift ≈ spend multiple.\n\n- If the returns are very diminishing, then uplift ≫ spend multiple.\n\n- Key statistic is the ratio between marginal and avg returns to agent expenditure.\n\n- Intuitively: if you doubled your token spend, how much more productive would you be? My guess is it’s typically pretty small, implying marginal returns are low, and thus implying uplift is much higher than spend multiple.\n\nQualifications.\n\n- This assumes constant returns overall, somewhat different if aggregate diminishing returns.\n\n- This assumes agent and human expenditure is optimal, such that the marginal effect of each dollar on output is equalized. But probably a lot of agent expenditure is experimental -- we’re just learning to use agents, and some spend is amortized. This would generally push short-run agent spend above the long-run equilibrium spend.", "links": {}, "media": [], "url": "https://x.com/testingham/status/2123475855729172611", "created_at": "Thu Nov 19 17:57:50 +0000 2026"}, "enriched": 3}, {"id": "2123475855729172611", "url": "https://x.com/testingham/status/2123475855729172611", "text": "The uplift from agents should *exceed* the incremental expenditure on agents. \n\nThe difference depends on the degree of diminishing returns to tokens: if there are severely diminishing returns then we should expect a big uplift to be accompanied by a small expenditure.\n\nQ: Given uplift, what should spend be?\n\n- Suppose we expect agents to cause a 3x productivity uplift at METR, should we budget spending 3x more?\n\n- No, we should spend proportionately less. If it was 3x more we could've got the same output just by hiring more people.\n\n- The difference depends on the degree of diminishing returns to agent spend, i.e. ratio of marginal to average returns. We’d only expect 3X more expenditure if returns are linear.\n\nQ: Given spend, what should uplift be?\n\n- Suppose OpenAI is spending the same on agents as on humans, does that imply they’re getting a 2x uplift?\n\n- No, it implies they’re getting more than 2x uplift. If it was 2x they could've got the same just by hiring more people.\n\n- The difference depends on the degree of diminishing returns to agent spend. We’d only expect 2x uplift if returns are linear.\n\nThe relationship depends on the degree of diminishing returns from agent-expenditure.\n\n- If the returns are close to linear, then uplift ≈ spend multiple.\n\n- If the returns are very diminishing, then uplift ≫ spend multiple.\n\n- Key statistic is the ratio between marginal and avg returns to agent expenditure.\n\n- Intuitively: if you doubled your token spend, how much more productive would you be? My guess is it’s typically pretty small, implying marginal returns are low, and thus implying uplift is much higher than spend multiple.\n\nQualifications.\n\n- This assumes constant returns overall, somewhat different if aggregate diminishing returns.\n\n- This assumes agent and human expenditure is optimal, such that the marginal effect of each dollar on output is equalized. But probably a lot of agent expenditure is experimental -- we’re just learning to use agents, and some spend is amortized. This would generally push short-run agent spend above the long-run equilibrium spend.", "created_at": "2026-11-19T17:57:50+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 25, "retweets": 5, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "thread": [{"id": "2123477039231729743", "author_handle": "testingham", "author_name": "tom cunningham", "text": "- L = expenditure on humans\n- K = expenditure on agents\n- F(K,L) = output\n- s = K / (K + L) = agent expenditure share\n- a = [F(K,L) − F(0,L)] / F(K,L) = agent contribution to output\n- Assume constant returns to scale and optimal allocation of expenditure, so F_K = F_L.\n- m = ([F(K,L) − F(0,L)] / K) / F_K = ratio of avg returns to marginal returns on agent expenditure, generally expect m>1.\n- We get this: a/s = m\n- So agent contribution should be *larger* than its expenditure share.\n- If avg returns are much higher than marginal returns, then agent contribution will be much larger than its expenditure share.", "links": {}, "media": [], "url": "https://x.com/testingham/status/2123477039231729743", "created_at": "Thu Nov 19 18:02:33 +0000 2026"}], "enriched": 3}, {"id": "2123473133374238753", "url": "https://x.com/testingham/status/2123473133374238753", "text": "i'm curious to see what happens! i'm not sure i'd add a lot of ornament to my house if it was cheap.", "created_at": "2026-11-19T17:47:01+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "reply_to_id": "2123472865840525611", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "parent": {"id": "2123472865840525611", "author_handle": "testingham", "author_name": "tom cunningham", "text": "There's a post about using robots to carve stone, & they say: \"Civic buildings like Penn Station and Grand Central were once expected to be monumental. Stone carving never disappeared, but rising costs pushed it out of ordinary construction.\"\n\nBut I had always thought we stopped decorating things because decoration got too cheap, not because it got too expensive.\n\nIn the late 19th century we figured out ways to cheaply add ornament to everything (with mass production), & everything got covered in patterns -- clothes, furniture, houses, libraries. But then ornament just started looking tacky & the whole world moved towards simpler styles.\n\nhttps://t.co/AHNQZSplnA", "links": {"https://t.co/AHNQZSplnA": "https://eleanorwiesler.com/blog/robotic-stone-carving/"}, "media": [], "url": "https://x.com/testingham/status/2123472865840525611", "created_at": "Thu Nov 19 17:45:58 +0000 2026"}, "enriched": 3}, {"id": "2123472865840525611", "url": "https://x.com/testingham/status/2123472865840525611", "text": "There's a post about using robots to carve stone, & they say: \"Civic buildings like Penn Station and Grand Central were once expected to be monumental. Stone carving never disappeared, but rising costs pushed it out of ordinary construction.\"\n\nBut I had always thought we stopped decorating things because decoration got too cheap, not because it got too expensive.\n\nIn the late 19th century we figured out ways to cheaply add ornament to everything (with mass production), & everything got covered in patterns -- clothes, furniture, houses, libraries. But then ornament just started looking tacky & the whole world moved towards simpler styles.\n\nhttps://t.co/AHNQZSplnA", "created_at": "2026-11-19T17:45:58+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2057221538160766976/KAtze74k_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 13, "retweets": 0, "media": [], "links": {"https://t.co/AHNQZSplnA": "https://eleanorwiesler.com/blog/robotic-stone-carving/"}, "quoted": null, "fetched_at": "2026-11-19T19:29:38.737368+00:00", "thread": [{"id": "2123473133374238753", "author_handle": "testingham", "author_name": "tom cunningham", "text": "i'm curious to see what happens! i'm not sure i'd add a lot of ornament to my house if it was cheap.", "links": {}, "media": [], "url": "https://x.com/testingham/status/2123473133374238753", "created_at": "Thu Nov 19 17:47:01 +0000 2026"}], "enriched": 3}, {"id": "2121103510091817301", "url": "https://x.com/slatestarcodex/status/2121103510091817301", "text": "@manlikemishap Sorry if anything I said was incorrect, happy to link your reply once you've got it. I'm a big fan of everything you do and was working off info from people who thought they were trying to help you.", "created_at": "2026-11-13T04:50:59+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "manlikemishap", "reply_to_id": "2121057544684945771", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 18, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121057544684945771", "author_handle": "manlikemishap", "author_name": "pamela mishkin", "text": "in denver! super fun! now scrambling to put together a response to this which is unfortuantely a bit misleading both on ccas and on unions.\n\ni'm so excited about all the energy around employee organizing and working hard to move as fast as the industry on it.\n\nthread i guess (but please forgive since written mid-hh)", "links": {}, "media": [], "url": "https://x.com/manlikemishap/status/2121057544684945771", "created_at": "Fri Nov 13 01:48:20 +0000 2026"}, "enriched": 3}, {"id": "2121470003392532742", "url": "https://x.com/slatestarcodex/status/2121470003392532742", "text": "Happy Heinz von Foerster Day! https://t.co/KeLt9U7B6r", "created_at": "2026-11-14T05:07:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 81, "retweets": 7, "media": [], "links": {"https://t.co/KeLt9U7B6r": "https://slatestarcodex.com/2019/04/22/1960-the-year-the-singularity-was-cancelled/"}, "quoted": null, "fetched_at": "2026-11-14T13:38:58.849857+00:00", "enriched": 3}, {"id": "2122138360370389178", "url": "https://x.com/slatestarcodex/status/2122138360370389178", "text": "@Tim_Hua_ I haven't thought about this much, but it seems reasonable to pause at a certain capabilities level (eg Fable 5.2) and let other companies catch up to that.\n\n(I'm less concerned about eg X being mad than about China being mad. I think this question will be on China's mind, and unless we have some incredible incentive to give them, we will have to offer them this chance to catch up, and then whatever we work out with them will naturally apply to US companies too)\n\nThe two main issues I see are how to operationalize this (if we use benchmarks, they can benchmark-min) and whether it's a threat to the pause to have any training capacity at all.\n\nI think if the pause is done well, there will be a government agency that can handle these questions. For example, smart regulators who can't be trivially loopholed can look at a training plan and predict where it will stand relative to Fable-5.2 and sign off on it, and if compute is being monitored, all the sides monitoring it can agree to let a small amount of it get used for these kinds of catchup runs.", "created_at": "2026-11-16T01:23:07+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Tim_Hua_", "reply_to_id": "2122091233170575731", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 20, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "parent": {"id": "2122091233170575731", "author_handle": "Tim_Hua_", "author_name": "Tim Hua 🪶", "text": "I'm curious for how pause advocates have thought about this question:\n\nSuppose we paused all AI development now, some companies are naturally going to have better public models than others, how do you incentivize the slightly lagging players to comply?\n\nLike which company has the best public model is somewhat random at any given point. Maybe people would want to set some \"capabilities threshold\" that companies could hit but proceed no further? There's a whole can of worms there as well.\n\nUnclear how important this question is, but you can imagine a scenario where company A is ahead at some time, so they feel better about a pause at current levels, but company B is like, \"man if we paused now, I'll just have less market share, but if we just waited one month, my new model is going to be out and I'll be ahead, and then we could pause and I'll be ahead.\" And then we repeat this dynamic until it's too late.", "links": {}, "media": [], "url": "https://x.com/Tim_Hua_/status/2122091233170575731", "created_at": "Sun Nov 15 22:15:51 +0000 2026"}, "enriched": 3}, {"id": "2122418596249047320", "url": "https://x.com/slatestarcodex/status/2122418596249047320", "text": "@1ovthafew @Tim_Hua_ This is simply not true. Existing regulation distinguishes between good and bad colleges (accreditation), ugly and pretty lawns (anti-eyesore regulations in cities), safe and unsafe parenting (CPS), sane and insane people (insanity defense in criminal courts), et cetera. The claim that if you can't reduce something to an exact number then it doesn't exist and there's no way to regulate it is antithetical to the way every other field works. \nIf you oppose government intervention in everything, that's fine, but otherwise, I think you should accept this as a completely typical example of regulation - in fact, as pretty rare in the degree to which it can be quantified (FLOPs, benchmarks, LMArena scores, etc). It's also pretty forgiving - if someone's AI is 5% better or worse than Fable 5.2, that's not a threat to the overall value proposition of a pause.", "created_at": "2026-11-16T19:56:40+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "1ovthafew", "reply_to_id": "2122311640716812768", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "parent": {"id": "2122311640716812768", "author_handle": "1ovthafew", "author_name": "Gavin King ⍼⍼⍼", "text": "@slatestarcodex @Tim_Hua_ Good regulation, compatible with liberal rule of law, depends on the ability to draw bright line boundaries. There’s simply no way to do this here.", "links": {}, "media": [], "url": "https://x.com/1ovthafew/status/2122311640716812768", "created_at": "Mon Nov 16 12:51:40 +0000 2026"}, "enriched": 3}, {"id": "2121233685529739399", "url": "https://x.com/s8mb/status/2121233685529739399", "text": "@jogehrs Sounds disgusting", "created_at": "2026-11-13T13:28:15+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "jogehrs", "reply_to_id": "2121221665854042362", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121221665854042362", "author_handle": "jogehrs", "author_name": "Johannes G 🥑", "text": "@s8mb I have a recipe where you actually keep it in one piece then put that into a sliced up piece of breading with some sauces, onions and pickles. May share one day", "links": {}, "media": [], "url": "https://x.com/jogehrs/status/2121221665854042362", "created_at": "Fri Nov 13 12:40:30 +0000 2026"}, "enriched": 3}, {"id": "2121220570541170865", "url": "https://x.com/s8mb/status/2121220570541170865", "text": "The solution to this is to put the whole \"puck\" of mince into the pan as a single unit (or broken into a couple of smaller ones) and let it get crispy and browned on one side before breaking it up. Works a charm.", "created_at": "2026-11-13T12:36:09+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 45, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2120989804116811850", "author_name": "Veggie", "links": {}, "author": "bigboybokchoy", "text": "There comes a time in everyone’s cooking journey where you realize that you can’t actually brown ground beef and there’s no point in trying"}, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121198581692666317", "url": "https://x.com/s8mb/status/2121198581692666317", "text": "", "created_at": "2026-11-13T11:08:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW-Kx_Sa8AAKwAa.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW-Kx_Sa8AAKwAa.jpg"}], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "enriched": 3}, {"id": "2121196891522154702", "url": "https://x.com/s8mb/status/2121196891522154702", "text": "@Sukicurates @WorksInProgMag Excellent! Thank you!", "created_at": "2026-11-13T11:02:03+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Sukicurates", "reply_to_id": "2120565896876056719", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2120565896876056719", "author_handle": "Sukicurates", "author_name": "Suki Park", "text": "👀👀👀 \n\n@WorksInProgMag @s8mb https://t.co/A9WPWxHJQO", "links": {"https://t.co/A9WPWxHJQO": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW3DcRIXgAAiTK8.jpg"}], "url": "https://x.com/Sukicurates/status/2120565896876056719", "created_at": "Wed Nov 11 17:14:42 +0000 2026"}, "enriched": 3}, {"id": "2121116676053696535", "url": "https://x.com/s8mb/status/2121116676053696535", "text": "@benspringwater Oh wow, that’s great. Wish I’d asked earlier - thank you!", "created_at": "2026-11-13T05:43:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "benspringwater", "reply_to_id": "2121021358020977102", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T14:42:03.869260+00:00", "parent": {"id": "2121021358020977102", "author_handle": "benspringwater", "author_name": "Ben Springwater", "text": "@s8mb Here you go!\nhttps://t.co/a50iyM6gfJ", "links": {"https://t.co/a50iyM6gfJ": "https://web.getmatter.com/bookmarklet"}, "media": [], "url": "https://x.com/benspringwater/status/2121021358020977102", "created_at": "Thu Nov 12 23:24:33 +0000 2026"}, "enriched": 3}, {"id": "2121286843849486399", "url": "https://x.com/s8mb/status/2121286843849486399", "text": "@pietergaricano @Jack_Watling This book was excellent, but it read like a horror novel.", "created_at": "2026-11-13T16:59:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "pietergaricano", "reply_to_id": "2121279429511196724", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T18:31:06.317605+00:00", "parent": {"id": "2121279429511196724", "author_handle": "pietergaricano", "author_name": "Pieter Garicano", "text": "Famously, very few books accurately predict how the next war will go. Guderian's Achtung! Panzer was one. The Arms of the Future by @Jack_Watling is, in my view, another.\n\nhttps://t.co/0FvQQvofBs\n\nSimplifying a bit, only three things fundamentally determine how armies fight: how far they can see, how far they can shoot, and how deadly each shot is.\n\nOver the last few decades, all three have increased relentlessly. Everyone has seen the videos of drones from Ukraine. But sensors of all kinds are getting better: ground-based radars can spot tanks tens of kilometers away, and acoustic sensors can pick up the heartbeats of individual soldiers. Once the enemy is spotted, it is much easier to kill them: a WW2 artillery shell landed within 50 meters half of the time at 20 kilometers; a modern one lands within 2 meters half of the time at 70 kilometers.\n\nIn this new world, there are only three ways to fight: by hiding in a hole in a field, by hiding in a city, or by attacking the sensors.\n\nRead my review in Works in Progress", "links": {"https://t.co/0FvQQvofBs": "https://worksinprogress.co/issue/the-future-of-war/"}, "media": [], "url": "https://x.com/pietergaricano/status/2121279429511196724", "created_at": "Fri Nov 13 16:30:02 +0000 2026"}, "enriched": 3}, {"id": "2121349057214091353", "url": "https://x.com/s8mb/status/2121349057214091353", "text": "What would win: artificial superintelligence or one little inferred law?", "created_at": "2026-11-13T21:06:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 1, "media": [], "links": {}, "quoted": {"id": "2121288208637972735", "author_name": "Saloni", "links": {"https://t.co/JTMfMkihnu": ""}, "author": "salonium", "text": "New episode of HARD DRUGS!\n\nWill AI progress be crushed by Eroom’s law?\n\nEven as technology has advanced, drug development has gotten more and more expensive over time.\n\nIn the 1950s, one billion dollars of R&D spending got us roughly fifty new drugs. Today, it gets us about one.\n\nThis trend is called Eroom’s law, or Moore’s law spelled backwards. It seems pretty bleak: the R&D cost per new drug has roughly doubled every nine years, in inflation-adjusted dollars, meaning drug development has become exponentially more expensive.\n\nWhat could explain this? Here are some possibilities:\n\n• Our standards of evidence and requirements for safety testing have risen, through regulation, public expectations, and risk aversion.\n\n• We’ve picked the low-hanging fruit already. Perhaps we’ve already made the easiest discoveries, and diseases that are harder to understand or treat are left.\n\n• Or perhaps it’s the ‘better than the Beatles’ problem: New drugs not only have to be effective, but have to compete with existing treatments, which are already effective. Plus, some of them have gone off-patent and become cheap generics, making the price contrast starker.\n\nRelatedly, as diseases become rarer or milder, it takes more effort to demonstrate that new drugs are effective, with larger or longer clinical trials.\n\nBut there are also reasons to question these explanations. We still lack effective treatments for many diseases. And our tools for studying biology have improved enormously. Why hasn’t that been enough?\n\nWill our best efforts be crushed by Eroom’s law, too? Or can AI reverse the trend?\n\nIn our latest episode of HARD DRUGS, @JacobTref and I chat about all this and more. Listen wherever you get your podcasts!\n\nChapters:\n00:00 Introduction\n02:53 Eroom’s law trivia\n12:33 How much does it really cost to develop a drug?\n22:35 The better than the Beatles problem\n33:06 Clinical trials are larger and more rigorous today\n42:01 Have we picked the low-hanging fruit?\n01:01:22 Is Eroom’s law slowing down because of rare disease drugs?\n01:06:18 Can AI reverse Eroom’s law?\n01:15:09 Conclusion"}, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "enriched": 3}, {"id": "2121348886447132734", "url": "https://x.com/s8mb/status/2121348886447132734", "text": "@kenbrennan2000 Yep, agreed! No meat touches my pans before I see a Leidenfrost effect.", "created_at": "2026-11-13T21:06:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "kenbrennan2000", "reply_to_id": "2121341188925989201", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-13T21:26:31.587502+00:00", "parent": {"id": "2121341188925989201", "author_handle": "kenbrennan2000", "author_name": "Ken Brennan", "text": "@s8mb Pan much hotter than you think (you need to hear the high-pitched “hiss” of searing), no more than a pound at a time, don’t move the pan, always be breaking it up in tiny bits with a spatula.\n\nWatch Marco Pierre White’s bolognese video on YouTube. He goes into detail.", "links": {}, "media": [], "url": "https://x.com/kenbrennan2000/status/2121341188925989201", "created_at": "Fri Nov 13 20:35:26 +0000 2026"}, "enriched": 3}, {"id": "2121325939141628373", "url": "https://x.com/s8mb/status/2121325939141628373", "text": "Quoteshots 2.0 @matter https://t.co/nbMpknEBrl", "created_at": "2026-11-13T19:34:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "benspringwater", "rt_author_name": "Ben Springwater", "rt_avatar": "https://pbs.twimg.com/profile_images/1595516312154869760/aSJL1rPu_normal.jpg", "rt_id": "2121324184659976441", "likes": 30, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121323210734190592/img/yxpWPR009jzW3lCf.jpg"}, {"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2121323210734190592/img/yxpWPR009jzW3lCf.jpg"}], "links": {"http 83561472", "text": "", "created_at": "2026-11-16T06:53:52+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-16T16:00:31.625271+00:00", "enriched": 3}, {"id": "2122412094641590591", "url": "https://x.com/s8mb/status/2122412094641590591", "text": "Another generation of European politicians is about to waste billions of euros and years in court trying to processing asylum claims overseas. The obsession with this idea comes fom a total myth, namely that it worked in Australia.\n\nAustralia did briefly process asylum seekers offshore. But as Amelia Wood showed in a piece for WIP, this almost certainly wasn’t what made the difference:\n\n- When Australia relied on offshore processing alone in 2012, arrivals didn’t drop.\n- A tougher version introduced in 2013 didn’t reduce them either.\n- Offshore transfers ended altogether in 2014, yet arrivals stayed at zero for the following decade.\n\nInstead, what did all the work in Australia was turnbacks: consistently towing boats back to Indonesia. It's cheaper, more humane, and far more effective than offshore processing.", "created_at": "2026-11-16T19:30:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": true, "rt_author": "pietergaricano", "rt_author_name": "Pieter Garicano", "rt_avatar": "https://pbs.twimg.com/profile_images/1889463350062698496/8-NpCfSf_normal.jpg", "rt_id": "2122411933571895372", "likes": 46, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQ3oFzW8AAsWGa.jpg"}], "links": {"https://t.co/SZea8B3rox": ""}, "quoted": null, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122371601916436624", "url": "https://x.com/s8mb/status/2122371601916436624", "text": "The story of Alexander Fleming accidentally discovering penicillin seems to have been totally made up. https://t.co/bsvSMygL7H", "created_at": "2026-11-16T16:49:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 194, "retweets": 17, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXQts9XWcAALD0k.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXQts9XWcAALD0k.jpg"}], "links": {"https://t.co/bsvSMygL7H": ""}, "quoted": {"id": "2122370762711654583", "author_name": "Saloni", "links": {"https://t.co/i2iQYNk27u": "https://worksinprogress.co/issue/accidental-discoveries/?v4"}, "author": "salonium", "text": "My first column for Works in Progress!\n\nScience isn’t a series of lucky accidents.\n\nI’ve been investigating stories of scientific discoveries for a while and it’s surprising how much the popular retellings flatten the real stories; some are entirely made up.\n\nAlexander Fleming’s discovery of penicillin most likely didn’t come from an open window.\n\nHis colleagues testified the window was seldom, if ever, opened. The sequence hasn’t been replicated as he described, because penicillin would have needed to be present on the plate before the bacteria grew, as it blocks bacteria from building their cell walls, rather than killing them once they’ve grown.\n\nLouis Pasteur’s discovery of the chicken cholera vaccine – the second-ever vaccine – is often said to be accidental too.\n\nBut historians have found the key experiments were done deliberately by Émile Roux, his assistant at the time, while Pasteur was away for his daughter’s wedding.\n\nWilhelm Röntgen’s accidental discovery of X-rays? The story was just a hypothesis by others later on.\n\nRöntgen had his notes burned after his death, so it’s unclear what really happened. He had also long been in a dispute with Philipp Lenard over credit for the discovery, so there are reasons to be suspicious.\n\n**\n\nBut what really happened? How did Fleming actually discover penicillin? Why burn or hide your notebooks? And most of all, why credit chance events instead of hard work?\n\nFor the first time, I’ve decided to come up with some half-cooked theories. Read them here and tell me what you think:\nhttps://t.co/i2iQYNk27u"}, "fetched_at": "2026-11-16T21:02:04.818687+00:00", "enriched": 3}, {"id": "2122446739806560384", "url": "https://x.com/s8mb/status/2122446739806560384", "text": "It's a good start! https://t.co/JtlXeE9EjJ", "created_at": "2026-11-16T21:48:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 75, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXRyAcxXgAAcA0I.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXRyAcxXgAAcA0I.jpg"}], "links": {"https://t.co/JtlXeE9EjJ": ""}, "quoted": {"id": "2122354241775755439", "author_name": "Kane Emerson", "links": {"https://t.co/66oZzQ6ktS": ""}, "author": "KaneEmerson", "text": "9 flats built in an Islington conservation area. \n\n2019 &gt; 2025 https://t.co/66oZzQ6ktS"}, "fetched_at": "2026-11-16T23:44:38.843446+00:00", "enriched": 3}, {"id": "2122636059741917473", "url": "https://x.com/s8mb/status/2122636059741917473", "text": "We should probably defer to previous and current housing ministers on this. After all, they were both in charge of housing poli e AI security research lab @AISLE_Inc I co-founded and led in Prague has just been acquired by @cohere! 🚀\n\nI'm joining Cohere as VP, AI Security, to lead frontier research in AI cybersecurity and the security of AI systems.\n\nExcited for what's next! https://t.co/cwlk25CcN9", "links": {"https://t.co/cwlk25CcN9": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXV1akaXkAAzkpp.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXV1akaXkAAzkpp.jpg"}], "url": "https://x.com/stanislavfort/status/2122733533710127439", "created_at": "Tue Nov 17 16:48:07 +0000 2026"}, "enriched": 3}, {"id": "2123077657835520154", "url": "https://x.com/s8mb/status/2123077657835520154", "text": "@JonNeale Isn't that exactly why these policy costs are biting so much?", "created_at": "2026-11-18T15:35:33+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JonNeale", "reply_to_id": "2123072565350478233", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "parent": {"id": "2123072565350478233", "author_handle": "JonNeale", "author_name": "JN", "text": "@s8mb I agree that regulatory costs and barriers are too high, but it’s a bit off not to mention the fact that mortgage rates have ballooned over the past few years", "links": {}, "media": [], "url": "https://x.com/JonNeale/status/2123072565350478233", "created_at": "Wed Nov 18 15:15:19 +0000 2026"}, "enriched": 3}, {"id": "2123022927851581951", "url": "https://x.com/s8mb/status/2123022927851581951", "text": "Labour are almost bang on track to get as many new homes built as the Conservatives did in 2019–24. https://t.co/nEDOf30e5h", "created_at": "2026-11-18T11:58:04+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 34, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZ95uQXsAA4CG9.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZ95uQXsAA4CG9.jpg"}], "links": {"https://t.co/nEDOf30e5h": ""}, "quoted": null, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "enriched": 3}, {"id": "2122973644431519822", "url": "https://x.com/s8mb/status/2122973644431519822", "text": "This is also why the former Housing Secretary has endorsed it (it excuses his dismal record too) and why Pennycook’s media allies have boosted it. It isn’t regulatory costs and barriers that Pennycook has done nothing to change, but capitalism itself that’s the problem!", "created_at": "2026-11-18T08:42:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "reply_to_id": "2122972563571654732", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 30, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2122437763207201176", "author_name": "Vicky Spratt", "links": {}, "author": "Victoria_Spratt", "text": "Here is former Tory Housing Secretary Michael Gove retweeting current Housing Minister Matthew Pennycook and agreeing with his thesis that major private housebuilders will never deliver new homes at speed or scale in Britain because it’s not in their interest….because it would drive down prices"}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "parent": {"id": "2122972563571654732", "author_handle": "s8mb", "author_name": "Sam Bowman", "text": "I think this strange tweet - which doesn’t actually contradict the FT piece - is best read as excuse-making about why we have had 255k housing starts since Pennycook became Housing Minister, against the 600k we’d need to have to be on track for the 1.5m homes target. https://t.co/OtAFDk2lQi", "links": {"https://t.co/OtAFDk2lQi": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZQS2PWsAADqHc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZQS2PWsAADqHc.jpg"}], "url": "https://x.com/s8mb/status/2122972563571654732", "created_at": "Wed Nov 18 08:37:56 +0000 2026"}, "enriched": 3}, {"id": "2122972563571654732", "url": "https://x.com/s8mb/status/2122972563571654732", "text": "I think this strange tweet - which doesn’t actually contradict the FT piece - is best read as excuse-making about why we have had 255k housing starts since Pennycook became Housing Minister, against the 600k we’d need to have to be on track for the 1.5m homes target. https://t.co/OtAFDk2lQi", "created_at": "2026-11-18T08:37:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 124, "retweets": 10, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXZQS2PWsAADqHc.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXZQS2PWsAADqHc.jpg"}], "links": {"https://t.co/OtAFDk2lQi": ""}, "quoted": {"id": "2122364785979212063", "author_name": "Matthew Pennycook MP", "links": {}, "author": "mtpennycook", "text": "As this piece aptly demonstrates, mainstream public discourse on housebuilding in England is almost entirely devoid of any meaningful consideration of the structural dominance of speculative development models.\n\nThe market absorption rate constraints inherent to those models (i.e. developers cannot afford to build and sell homes too quickly in any given local market as doing so would undermine prices and result in a loss on their land investment) mean that build out rates are tied to rising house prices and the existence of sufficient effective demand for homes at those prices.\n\nIt is not in dispute that viability pressures are acute in many parts of the country. That's precisely why we've implemented a range of targeted regulatory easements and committed to no major new building regulations for the remainder of the parliament.\n\nHowever, the simple fact is that the private market as it is currently constituted will not, on its own initiative, produce sufficient housing to meet overall housing need, even if it is highly competitive.\n\nThe disruption and transformation of the housebuilding market is essential to delivering high and sustainable rates of housebuilding in the years ahead."}, "fetched_at": "2026-11-18T15:47:29.782813+00:00", "thread": [{"id": "2122973644431519822", "author_handle": "s8mb", "author_name": "Sam Bowman", "text": "This is also why the former Housing Secretary has endorsed it (it excuses his dismal record too) and why Pennycook’s media allies have boosted it. It isn’t regulatory costs and barriers that Pennycook has done nothing to change, but capitalism itself that’s the problem!", "links": {}, "media": [], "url": "https://x.com/s8mb/status/2122973644431519822", "created_at": "Wed Nov 18 08:42:14 +0000 2026"}], "enriched": 3}, {"id": "2122965736121356467", "url": "https://x.com/s8mb/status/2122965736121356467", "text": "Great idea. Why should someone be any more vulnerable to being fired than to being evicted? https://t.co/hZb7xKL37I", "created_at": "2026-11-18T08:10:48+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1713244259954937856/BnnCvI4S_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 67, "retweets": 3, "media": [{"type": "photo", "url": "ht
