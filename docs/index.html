ul_SLG @WorksInProgMag Excellent, glad to hear it!", "created_at": "2026-10-15T12:09:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Paul_SLG", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110704574738698694", "url": "https://x.com/s8mb/status/2110704574738698694", "text": "Mayonnaise and hot sauce are complements, not substitutes.", "created_at": "2026-10-15T12:09:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 39, "retweets": 2, "media": [], "quoted": {"author": "SenWarren", "text": "Hellmann's mayo\nMcCormick spices\nCholula hot sauce\nFrank's RedHot\n\nWhat do these products have in common? One company could soon control them all.\n\nI have concerns that McCormick and Unilever's $45 billion merger could increase YOUR grocery prices."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110697843468222750", "url": "https://x.com/s8mb/status/2110697843468222750", "text": "Awesome! Even though we're at a low level, I think growth begets growth. It's much easier to do pro-growth reforms when people feel things are getting better already.", "created_at": "2026-10-15T11:42:35+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 131, "retweets": 1, "media": [], "quoted": {"author": "faisalislam", "text": "Annualised UK GDP growth so far in 2026, with two-thirds of the year gone, is 2.7-2.8%\n\nIs expected to slow in q4, but that was also expected in q3. And q2.\n\nCity economists (eg Pantheon) say “we have to shift from describing UK growth as resilient to calling it strong”."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110697298057674763", "url": "https://x.com/s8mb/status/2110697298057674763", "text": "@Wrynose1 Glad to hear. Yes, frustratingly, the lithographic print for the full batch caused a few issues that the digital print for the proof didn't create. Should be resolved now though.", "created_at": "2026-10-15T11:40:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Wrynose1", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110674821327557095", "url": "https://x.com/s8mb/status/2110674821327557095", "text": "In the future, every Works in Progress article will come with a video game.", "created_at": "2026-10-15T10:11:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 24, "retweets": 0, "media": [], "quoted": {"author": "tommy5dollar", "text": "@bswud I made a game of this. Pitch a startup and three Chinese cities bid for it like VC firms, with land, state fund equity and free rent!\nhttps://t.co/b9WXZd0bDp"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110485222684831931", "url": "https://x.com/s8mb/status/2110485222684831931", "text": "Nearly everyone in the West focuses on China's Five Year Plans as the reasons for its manufacturing success, concluding that more central economic planning is needed. \n\nThis is the exactly WRONG lesson. The country's success comes because its cities all compete with each other intensely, as something akin to vertically integrated corporations that are completely obsessed with local economic growth.\n\nIts incredible manufacturing industry is based on local clusters that local govts nurture and invest in, and collect a lot of the returns from through property fees and taxes. These govts are *much* closer to local needs than Western local govts are, and can focus on speed of building and iteration above all, which are critical for manufacturing.\n\n*This* is why local government matters in Britain and America, where it is almost completely broken and dysfunctional. Where local spillovers matter, as in manufacturing, you need some kind of entity that can internalise the positive externalities of economic activity. China is proof that with the right incentives and tax powers, local governments can become machines for economic growth, intervening and clearing the way for development.", "created_at": "2026-10-14T21:37:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "s8mb", "rt_author_name": "Sam Bowman", "likes": 482, "retweets": 67, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110484230811619454", "url": "https://x.com/s8mb/status/2110484230811619454", "text": "If your company deserves to be taken as seriously as the rest of @WorksInProgMag is, you should DM me.", "created_at": "2026-10-14T21:33:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EvanRiggss", "rt_author_name": "Evan Riggs", "likes": 22, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110483771950870884", "url": "https://x.com/s8mb/status/2110483771950870884", "text": "@StringhamSpirit Oh no! I’ve DM’d you, will sort ASAP.", "created_at": "2026-10-14T21:31:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "StringhamSpirit", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110483615419335010", "url": "https://x.com/s8mb/status/2110483615419335010", "text": "@KarlBrophy Thank you very much. I hope you like it.", "created_at": "2 have a very big fan club!", "created_at": "2026-10-15T16:28:22+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "gsignoret", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111086542403850611", "url": "https://x.com/s8mb/status/2111086542403850611", "text": "We are thrilled that the great @CharlesCMann, author of 1491 and 1493, has joined us as a regular contributor. And we've just released his debut article -- a foray into the long history of one very underrated material: porcelain.\n\nhttps://t.co/UiDkCQWur0\n\nA signature Charles move is to take something that seems utterly ordinary and reveal, with flair, that it exists only because of countless small, often accidental innovations, many of them since forgotten. \n\nAnd he's at his best in this new piece for us. He traces how porcelain, discovered by chance by Chinese potters some 3,000 years ago and coveted by Europeans who spent centuries failing to copy it, became a staple of modern materials science. Today it turns up everywhere from bathroom tiles that grow less slippery when wet, reducing the risk of injury, to scaffolds for bone implants, that dissolve as bone tissue regenerates.", "created_at": "2026-10-16T13:27:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 24, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111083467089829929", "url": "https://x.com/s8mb/status/2111083467089829929", "text": "@NoelRock @WorksInProgMag Thank you so much Noel, really glad you like it, and thank you for being a subscriber ❤️", "created_at": "2026-10-16T13:14:55+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": tched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110851234064380135", "url": "https://x.com/s8mb/status/2110851234064380135", "text": "I’ve never really been one to read or subscribe to magazines, but Works in Progress is making a pretty compelling case.\n\nThe ideas, the writing, the design. All of it is so good.\n\nhttps://t.co/nKYvrkkbHG", "created_at": "2026-10-15T21:52:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "evangordeaux", "rt_author_name": "Evan Gordon", "likes": 48, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110834524158411238", "url": "https://x.com/s8mb/status/2110834524158411238", "text": "@mims @CharlesCMann You're right. 1491 especially could have been a mess in the hands of a more careless researcher. It's a huge credit to him that it has stood up over the time since it was published.", "created_at": "2026-10-15T20:45:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "mims", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110831812876406886", "url": "https://x.com/s8mb/status/2110831812876406886", "text": "@michael_wiebe It takes all sorts to make a world!", "created_at": "2026-10-15T20:34:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "michael_wiebe", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110822824579355013", "url": "https://x.com/s8mb/status/2110822824579355013", "text": "This is a such a comprehensible and well written post about a very challenging (and to me unfamiliar) subject. I am in awe at this man’s ability to write about this so clearly. How fitting that he works in “interpretability”!", "created_at": "2026-10-15T19:59:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 222, "retweets": 10, "media": [], "quoted": {"author": "nickcammarata", "text": "interpretability might be the most important scientific problem in the world right now, as I don't think we can solve alignment if we don't know what we're building. I think I have good news about it. I co-authored early work in mechanistic interpretability at OpenAI and came away pessimistic, because neural networks appeared to fold into arbitrary tangled knots. years later, I started openai's first large-scale automated interpretability project, finding about 2% of neurons legible with the primitive tools we had\n\nwith modern agentic tools and a much closer look, the picture looks totally different. the vast majority in models up to trillions of parameters are legible, and their circuits beautiful. many famous examples of tangled neurons turned out to be misunderstood. The roadblocks I expected mostly aren't there. I now think ambitious interpretability will be solved by the time we need it most, and possibly quite soon, as automated scientists keep improving. it may be a bitter lesson for interpretability: the simple thing, at absurd scale, works\n\nhttps://t.co/zHij5zwKGT"}, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110817656526053546", "url": "https://x.com/s8mb/status/2110817656526053546", "text": "@zaizaizaizai7 @WorksInProgMag Really pleased you like it! As I say in my letter, it hurt me to learn that the font was too small for some readers. Hope we’ve solved that now for most of them.", "created_at": "2026-10-15T19:38:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "zaizaizaizai7", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retwe  "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 30, "retweets": 0, "media": [], "quoted": {"author": "brixtonbuzz", "text": "Protesters target Gail’s Bakery in Brixton ahead of today’s opening\nhttps://t.co/wIGmGn4cFs https://t.co/LN2x6QxirV"}, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111405250561126855", "url": "https://x.com/s8mb/status/2111405250561126855", "text": "@emilyjaneross @WorksInProgMag Delighted you like it. All credit to @AtalantaArdenM and Magnus Agustsson!", "created_at": "2026-10-17T10:33:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "emilyjaneross", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111373271912563153", "url": "https://x.com/s8mb/status/2111373271912563153", "text": "A selection of stories on the front page of the BBC News app this morning. https://t.co/I5JwZwY3vw", "created_at": "2026-10-17T08:26:30+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1003, "retweets": 69, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU0azE-XAAAtq7g.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU0azFAWgAAHVtn.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU0azE8XcAA4KOv.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HU0azE-WYAAr2VF.jpg"}], "quoted": {"author": "chalmermagne", "text": "Britain’s public service broadcaster doesn’t have a single correspondent in South America because of budget cuts, yet devotes resources to pumping out slop like this every day. https://t.co/IaPaNSmNk7"}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111365650748989674", "url": "https://x.com/s8mb/status/2111365650748989674", "text": "There is no good reason for mosquitoes to exist in wealthy countries today.\n\nNew technologies can get rid of the mosquito species that cause diseases like dengue, yellow fever, and malaria; and others can prevent them from carrying those diseases.\nhttps://t.co/CddUFByGZA\n\nSo why do mosquitoes still exist? \n\nIn a new article for Works in Progress, Maya Rosen explains how state incapacity and risk aversion led to over a decade of delays and billions of unnecessary bites in the United States.\n\nOxitec, for example, engineered an Aedes aegypti mosquito in such a way that its female offspring would die before adulthood. Through sustained releases, they showed they could reduce local mosquito populations by 80% or more, in field trials.\n\nThey sought approval from the USDA in 2010, which then passed it to the FDA, which passed it to the EPA. In 2020, the EPA allowed them to conduct limited field trials in the Florida Keys. Two years ago, their experimental permit expired, and they still need another review before it can be used routinely. Their proposed field trial in California was withdrawn after public opposition.\n\nAnother company, MosquitoMate, developed a technique involving Wolbachia, which also suppresses local mosquitoes. They then spent over fifteen years working through the system before finally receiving commercial registration nationwide in 2024.\n\nIt seems that, sometimes, the barrier to getting rid of diseases isn’t technology at all. It’s policy and political will.\n\nNew products shouldn’t get stuck in regulatory review for so long, especially if the delays are about basic questions like which agency has oversight over the product, rather than testing for safety.\n\nThough some of those uncertainties were being addressed, the broader changes haven’t materialized. After Biden’s 2022 executive order, the agencies planned to update how their coordinated framework was implemented. But Trump rescinded the order last year.\n\nMeanwhile, the EPA unit that reviews new mosquito control products is still a small office backlogged in reviewing a wide range of products.\n\nMosquitoes are a policy choice. We can get rid of them. Will we choose to?\nhttps://t.co/CddUFByGZA", "created_at": "2026-10-17T07:56:13+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "salonium", "rt_author_name": "Saloni", "likes": 1738, "retweets": 297, "media": [], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111361158062243917", "url": "https://x.com/s8mb/status/2111361158062243917", "text": "This looks great. The content will be excellent as well!", "created_at": "2026-10-17T07:38:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": {"author": "NikoMcCarty", "text": "Our newest book is finally here!\n\nMaking the Modern Laboratory is a spectacular 504-page hardcover that tells the story of everything in the research laboratory and how it came to be, from pipettes to heat-resistant glass to microscopes and more.\n\nIt features dozens of articles (most of which will never appear in print), 100+ full-color images, and original writing from 36 authors. It's printed on Arena Natural Rough paper from Fedrigoni. These books are THICC and would make a great gift for both the science-curious and the working scientist. :)\n\nWe have spent the last year working on this project. It has been an insane labor of love. The best way to support our independent science journalism is to buy a copy. <3\n\nPre-order for $49, with free shipping: https://t.co/7d9L2Ual0c"}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111351395828064349", "url": "https://x.com/s8mb/status/2111351395828064349", "text": "How does this even make sense on its own terms? We use Google Workspace and Slack for all this stuff, like tons of other businesses. Switching and multi-homing is easy. There are no barriers to entry.", "created_at": "2026-10-17T06:59:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 52, "retweets": 4, "media": [], "quoted": {"author": "matthewlesh", "text": "In a blast from the past, Britain’s competition regulator has proposed designating Microsoft’s business software, including Windows, Word, Excel, Outlook and Teams, as having “strategic market status.”\n\nIt's like 1998 all over again, except this time the CMA is proposing to regulate a single company precisely in the part of the economy where competition has never been stronger: AI. These kinds of fiddly regulatory interventions are bound to scare away investment and turn the entire scheme into a laughing stock.\n\nSMS status lets the CMA impose bespoke conduct requirements on how Microsoft designs, bundles and sells its products. This gives the regulator broad discretion to direct how software used by more than a million UK organisations is allowed to operate.\n\nThe CMA's complaint is that the products are integrated, something CMA-commissioned research found businesses see as a “key benefit” and “relatively good value for money” and “more cost-effective than buying and managing separate licences.” Put plainly, people keep using Microsoft because the products work well together and they’re good value. This is very far from a market failure that requires intervention. It’s also a sector facing immense disruption in the era of AI-led software development.\n\nWhat's particularly mad is that Copilot is in scope too, even though ChatGPT has more than 1 billion weekly users, Gemini has more than 1 billion monthly users, and in UK workplaces, only about one in ten Microsoft Office users use Copilot. Gemini, Claude and ChatGPT together already have roughly as many workplace users as Copilot, after just two or three years. Just a year ago, the CMA kept Gemini out of Google’s designation because AI was moving too fast to call.\n\nThe CMA’s legal test is meant to ask whether Microsoft’s position will be entrenched over the next five years. Five years ago, ChatGPT didn’t exist. Anyone confident about who will lead workplace AI in 2031 should be running a hedge fund, not a regulator.\n\nWhat's also interesting is that, despite the promises made when this regime was created, this regulation isn’t even well-targeted. The CMA’s real concern, from its cloud market investigation, was meant to be Microsoft’s cloud software licensing. Instead of targeting this issue directly, the CMA has opted for the widest possible net: five separate markets bundled into one ecosystem. The result is that nothing will be done till at least February 2027, and even then, conduct requirements aren't yet specified, which will require further consultations, delaying action well into 2027.\n\nBritain wants to be the best place in the world to build and adopt AI. Preemptively regulating the AI tools businesses are only just starting to use is a strange way to get there."}, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111342150537334868", "url": "https://x.com/s8mb/status/2111342150537334868", "text": "The only print media I pay for. It’s so good. https://t.co/2BrFzTW9Km", "created_at": "2026-10-17T06:22:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "threepointone", "rt_author_name": "sunil pai", "likes": 82, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUyKMyaXoAE0AKI.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111331888648622469", "url": "https://x.com/s8mb/status/2111331888648622469", "text": "In the third pic you can see a crop of the 1739 \"Plan de Turgot,\" the most beautiful engraved map ever made, le to get it off the ground. So I'm especially proud to have him join us as a regular contributor this month.\n\nWe've always wanted Tyler to write for us, but the question has always been about what. He can and does already write (and podcast!) for the biggest publications, and Marginal Revolution and Conversations With Tyler are already gigantic platforms themselves. But there is one thing I always want to hear about from Tyler that he doesn't regularly write about for someone else: food.\n\nSo we asked him to be our semi-regular food columnist, and to our delight, he agreed. Nobody has shown how much amazing food there is on one's own doorstep better than Tyler himself, but for this month's piece, Tyler writes about the home of the world's third-best Italian food: Brazil.", "created_at": "2026-10-19T16:16:53+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 229, "retweets": 23, "media": [], "quoted": {"author": "WorksInProgMag", "text": "We’re delighted to announce that the one and only @tylercowen, our internet writing sensei, is joining Works in Progress as a regular contributor. \n\nhttps://t.co/NuvOFqfPin\n\nHis first column is about Brazilian food, and like everything Tyler writes, it’s packed with hidden gems that make it much more than a food story.\n\nSome of the nicest tidbits: on her first trip to Brazil, his daughter declared she had “never had a banana before” –  this is how good Brazilian bananas are, apparently. \nAnd Tyler and a well-traveled friend from Modena (of all places) agreed that Brazil is the third-best country in the world for Italian food, behind only Italy and Japan. If an Italian says that, we’d better trust him!\n\nBut as always with Tyler, he manages to draw larger lessons from apparently mundane and object-level stories. So, in a short read, we learn much more than just the fact that Brazilian food is really good.\n\nFirst, food can be seen as a progress story. Brazil’s agricultural yields rival, and sometimes beat, those of the US, even though Brazil is a much poorer country. Abundant fertile land, high productivity, and short supply chains make ingredients plentiful and fresh. Tyler’s regret is that the rest of Brazil’s economy hasn’t embraced technology the way its food sector has.\n\nWe also learn how immigration shapes Brazilian cuisine. Brazil has roughly 2 million citizens of Japanese descent, which makes it arguably the best place outside Japan for Japanese food. Tyler had a 15-course omakase at a Michelin-starred São Paulo restaurant for $110, booked just half an hour ahead. Brazil is also home to about 30 million people of Italian descent, the largest Italian diaspora in the world, which goes a long way to explain why his Italian friend was so satisfied with the food.\n\nThe whole column is a delight, so do read it in full!"}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112209720249590225", "url": "https://x.com/s8mb/status/2112209720249590225", "text": "Works in Progress is hiring for a US-based Head of Events (NYC or SF).\n\nBuild our events program and team, think up interesting events and unexpected speakers, and find partners and sponsors to collaborate with. Join us!\n\nhttps://t.co/fx2E6lXdfF", "created_at": "2026-10-19T15:50:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112145592004882930", "url": "https://x.com/s8mb/status/2112145592004882930", "text": "GTA 6: Can you cheat on someone with a video game character? https://t.co/akhqn82tPX", "created_at": "2026-10-19T11:35:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "BBCNews", "rt_au ts": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112270942382780824", "url": "https://x.com/s8mb/status/2112270942382780824", "text": "@fiiiiiist @GeorgiaCAdamson @KonstantinPilz Fascinating! If the US will guarantee Britain and Europe's access to its frontier models, I hope it follows these recommendations. If it doesn't, I regrettably have to hope it does not!", "created_at": "2026-10-19T19:53:31+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "fiiiiiist", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112269377114685501", "url": "https://x.com/s8mb/status/2112269377114685501", "text": "In 15 mins @bswud and @jeremybney will be live discussing how American and other Western cities can become growth machines again. https://t.co/DBaWJbqRGP", "created_at": "2026-10-19T19:47:18+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112255288040656977", "url": "https://x.com/s8mb/status/2112255288040656977", "text": "In which I praise the food of Brazil: https://t.co/YY7lux7pEv, it is too bad Brazilian food in the United States is not better.", "created_at": "2026-10-19T18:51:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "tylercowen", "rt_author_name": "tylercowen", "likes": 59, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112250367496868227", "url": "https://x.com/s8mb/status/2112250367496868227", "text": "@figolambo @salonium @meilaoban @schulzb589 @WorksInProgMag This is a fair point, but for the sake of brevity we decided to omit it. However we are hoping to run a piece on this specifically soon. Thanks for reading and for the feedback, it is much appreciated.", "created_at": "2026-10-19T18:31:45+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "figolambo", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112531840569352475", "url": "https://x.com/s8mb/status/2112531840569352475", "text": "@wincolladd Yes!", "created_at": "2026-10-20T13:10:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "wincolladd", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112511329357492566", "url": "https://x.com/s8mb/status/2112511329357492566", "text": "@wincolladd \"levy on companies spun out of UK universities that move abroad\"", "created_at": "2026-10-20T11:48:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "wincolladd", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112495740585189467", "url": "https://x.com/s8mb/status/2112495740585189467", "text": "No word about an exit tax though. Exit tax this year, CGT rise next year seems fairly possible.\n\n https://t.co/bYZUydAd3r", "created_at": "2026-10-20T10:46:47+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 20, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112484137739100199", "url": "https://x.com/s8mb/status/2112484137739100199", "text": "So much of our electricity supply is now based on fixed price assets: wind, nuclear and solar electricity that have low running costs but high set-up costs, and the electricity grid itself.\n\nThis means that new demand can lower prices by spreading these costs out among more buyers, and data centres can lower electricity costs (and, empirically, are lowering them). I've even had conversations with eminent economists who find this counterintuitive, so it is not surprising that policymakers and the public may also feel sceptical.", "created_at": "2026-10-20T10:00:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 201, "retweets": 22, "media": [], "quoted": {"author": "Sam_Dumitriu", "text": "How building data centres could cut Britain's sky-high electricity bills by billions:\n\n- Failing electricity use has made electricity more expensive as a fixed costs of supplying power (grid, policy, balancing, etc.) are concentrated on a small share of demand.\n\n- New demand from data centres helps dilute those fixed costs. This could save £2bn a year (£69 per year) if the Government's compute target is hit.\n\n- Data centres are extremely profitable, even at high power prices. They care about speed, but the grid queue can create decade-long delays. Letting companies pay to jump the queue could raise billions.\n\n- Britain could replicate the success of spectrum auctions and sell-off faster grid connections. Accelerating 3GW by 3 years is potentially worth £12bn to data centre builders!\n\n- In the US, tech companies are making large investments in new generation (SMRs, gas, renewables) as states adopt 'bring your own power' policies. Doing the same here could accelerate clean power buildout and fund necessary gas plant renewals.\n\nhttps://t.co/MJhZHAlVM5"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112452231215694271", "url": "https://x.com/s8mb/status/2112452231215694271", "text": "@LeRef5 Don’t blame the judiciary, blame the successive governments that gave them these powers.", "created_at": "2026-10-20T07:53:54+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "LeRef5", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 126, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112428722200490132", "url": "https://x.com/s8mb/status/2112428722200490132", "text": "Link to the Telegraph story. https://t.co/wfiz7uKgKE", "created_at": "2026-10-20T06:20:29+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 74, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112427956538847449", "url": "https://x.com/s8mb/status/2112427956538847449", "text": "This is what I warned would happen a year ago. The Act’s defenders said this wouldn’t happen.", "created_at": "2026-10-20T06:17:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 349, "retweets": 17, "media": [], "quoted": {"author": "s8mb", "text": "The government's Renters' Rights Bill looks like it will be a catastrophe, inadvertently introducing rent controls and reducing the supply of housing even more. It is the clearest evidence that the whole British state that has brought it about is completely broken: \n\n• Written by the civil service\n• Introduced by the Tories\n• Passed by Labour and the Lib Dems\n• Cheered on by the mainstream media\n\nThe bill's core provision is to eliminate \"no-fault evictions\". Many understand this to mean evictions during a rental lease. In fact, this is already impossible. What the new bill does is to stop landlords from being able to regain their property after a lease has expired. \n\nThis means that renting a property to someone now means that they get to live in that property indefinitely. A landlord can only evict them if they are selling the property, or plan to move into it themselves, or if a tribunal gives them permission after ruling against the tenant for bad behaviour.\n\nWithin these indefinite contracts, rent increases will be capped at whatever the 'market rate' is determined to be by a tribunal. Tribunals will not be able to *raise* rents, as they currently can and often do – only lower them or keep them where they are. The only risk to a tenant is that their challenge is deemed \"vexatious\".\n\nNot only will rent increases *within* contracts be controlled by courts, rents for *new* contracts will also be controlled by them. Tenants will be entitled to agree a rent, move in, and then immediately take their landlord to a rent tribunal on the grounds that the rent they have just agreed to is \"too high\".\n\nRent tribunals will thus have the power to control all rents. All rents will be set under the threat of a tribunal intervening. There will be no \"market rate\", so the tribunal will have no independent \"market rate\" to refer to.\n\nA tenant who challenges a rent increase will have their rent frozen at the old, lower rate while their challenge is ongoing (which could take over a year). Like the Building Safety Regulator right now, tribunals are likely to be extremely backlogged, creating huge delays where tenants do not have to pay their new higher rents, if they ever do. Tenants will have huge incentives to challenge nearly all rent increases. \n\nWe have already seen how bad courts are at ruling on prices, eg in cases where Next's shop workers have been given the same pay as factory floor workers, and in Birmingham where the council was forced to pay £760m to care workers and teaching assistants because a court decided that these roles were equivalent to jobs like rubbish collectors.\n\nAll this amounts to rent controls. These are terrible for many reasons.\n\n1. They will cause landlords to sell up and leave the market. This is both to avoid the risk of being stuck with a bad tenant, and because once the rent has been kept artificially low by a rent tribunal, landlords will be losing money compared to just selling into private owner-occupation.\n\nRental properties allow for easy doubling up (housesharing) which is much messier under owner-occupation. The effective supply of housing is about to drop. In Ireland, postwar rent controls shrunk the rental market from 26% to 8% of the total housing stock in 40 years. In Britain, 1916–88, the share of properties available for rent went from 75% of the market to 10%.\n\n2. They cause landlords to neglect their properties. Landlords receiving artificially-depressed rents for their properties have no incentive to maintain them. Rent controlled properties, famously, become neglected and fall into decay, as leaks, cracked plaster and broken windows are left unaddressed. The country's housing stock that remains in renting will decay. Our cities will become more decrepit.\n\n3. They stop people from moving around for better jobs. We already have this effect with social housing, where huge amounts of inner London housing (30–40%!) are held by tenants in low wage jobs, or who have no job at all, instead of by people who could move to London to earn and produce more. This will happen to large swathes of the rental market too, stopping people from moving into prosperous cities where they could get better jobs.\n\n4. They stop the supply of new homes for rent. Under rent controls, there is no incentive to build new homes for renting. Britain built essentially no private flats for rent between 1945 and the end of rent controls in 1988. The same was true in France between WWI when it introduced rent controls and the slow end of rent controls in the postwar era.\n\n5. They push renters into the black market. To actually get a place to live, a lot of people will sidestep these new rules and rent informally, with none of the protections we currently have for renters like the deposit protection scheme. This is the sort of scenario that allows landlords to *really* exploit and steal from their tenants.\n\n–\n\nDo not assume that anyone involved with this knows what they're doing. We have already seen, in the case of the Building Safety Regulator and the second staircase regulations (brought in by the same Housing Secretary who designed this bill), how disastrous the consequences of well-intended but misconceived interventions in the housing market can be.\n\nLondon building has already ground to a halt. And things are about to get even worse."}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112427765932654719", "url": "https://x.com/s8mb/status/2112427765932654719", "text": "We have nationwide rent controls now. \n\nThis tribunal didn’t just stop a rent rise within a tenancy, it cut the rent to below what had been agreed between the landlord and the tenant at the start of the tenancy based on a judgement of what the property is worth. https://t.co/BhrgmnIIA3", "created_at": "2026-10-20T06:16:41+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1481, "retweets": 200, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVDZ2xJWoAApsGX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVDZ2xOW8AAdRSJ.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112281884432744642", "url": "https://x.com/s8mb/status/2112281884432744642", "text": "We’re delighted to announce that the one and only @tylercowen, our internet writing sensei, is joining Works in Progress as a regular contributor. \n\nhttps://t.co/NuvOFqfPin\n\nHis first column is about Brazilian food, and like everything Tyler writes, it’s packed with hidden gems that make it much more than a food story.\n\nSome of the nicest tidbits: on her first trip to Brazil, his daughter declared she had “never had a banana before” –  this is how good Brazilian bananas are, apparently. \nAnd Tyler and a well-traveled friend from Modena (of all places) agreed that Brazil is the third-best country in the world for Italian food, behind only Italy and Japan. If an Italian says that, we’d better trust him!\n\nBut as always with Tyler, he manages to draw larger lessons from apparently mundane and object-level stories. So, in a short read, we learn much more than just the fact that Brazilian food is really good.\n\nFirst, food can be seen as a progress story. Brazil’s agricultural yields rival, and sometimes beat, those of the US, even though Brazil is a much poorer country. Abundant fertile land, high productivity, and short supply chains make ingredients plentiful and fresh. Tyler’s regret is that the rest of Brazil’s economy hasn’t embraced technology the way its food sector has.\n\nWe also learn how immigration shapes Brazilian cuisine. Brazil has roughly 2 million citizens of Japanese descent, which makes it arguably the best place outside Japan for Japanese food. Tyler had a 15-course omakase at a Michelin-starred São Paulo restaurant for $110, booked just half an hour ahead. Brazil is also home to about 30 million people of Italian descent, the largest Italian diaspora in the world, which goes a long way to explain why his Italian friend was so satisfied with the food.\n\nThe whole column is a delight, so do read it in full!", "created_at": "2026-10-19T20:37:00+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 470, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112614265890971783", "url": "https://x.com/s8mb/status/2112614265890971783", "text": "\"the Tribunal determined the open market rent was\"\n\n...", "created_at": "2026-10-20T18:37:46+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 43, "retweets": 0, "media": [], "quoted": {"author": "mtpennycook", "text": "This Labour government’s transformative Renters’ Rights Act empowers private renters to challenge unreasonable rent increases.\n\nIf a tenant believes a proposed rent increase is above the open-market rent, they can refer the matter to the First-tier Tribunal.\n\nIn a recent case in Manchester where the Landlord proposed an increase in rent from £1,650 per calendar month to £1,700, the Tribunal determined the open market rent was actually £1,450 per calendar month.\n\nWe’re standing up for renters and our reforms are working.\nhttps://t.co/wX1g3r33mV"}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112572736723657066", "url": "https://x.com/s8mb/status/2112572736723657066", "text": "I always thought that the ancient Romans were tolerant about sexuality, until the rise of puritanical Christianity. Reading Kyle Harper, I learnt that this picture is not exactly false, but it is extraordinarily misleading:\n\nhttps://t.co/PJO8UTGgiK\n\n- Sexual penetration of a free Roman man was severely punished, possibly by death. Consenting to penetration was also seriously punished. Lesbianism was not criminalised, but was regarded with contempt.\n\n- The one great subject of permissiveness was the penetration of enslaved people. Although relatively few people owned slaves, many prostitutes were enslaved and prostitution was ubiquitous, so coerced sex was widespread.\n\n- In some parts of the empire, many married women probably seem to have worn face veils in public.\n\n- There was not even theoretically a norm of male fidelity: although wives were required to be faithful to their husbands, the inverse was not even aspirationally true. \n\n- Early Christianity wrought a kind of revolution on ancient morality. All forms of sexuality apart from procreative sex within monogamous marriage were relentlessly and violently condemned, and even marital sex was allowed only rather grudgingly. In effect, the Christians extended to men the restrictions that had previously applied only to women.\n\n- To a limited extent, they also extended the protections previously enjoyed by free men to other groups of people. Although the early Christian record on slavery is mostly very poor, they did introduce the first laws against the forcible prostitution of slaves. Transgressors were to be arrested and sent to the public mines, ‘which is’, the law ran, ‘less of a punishment than that of a woman who is seized by a pimp and compelled to endure the filth of an intercourse that she did not will’.\n\nIt is not clear how much behaviour actually changed in practice – the Christians were never able to get people to behave exactly as they wanted. But the change in official norms was revolutionary, and not quite the revolution I expected.", "created_at": "2026-10-20T15:52:44+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SCP_Hughes", "rt_author_name": "Samuel Hughes", "likes": 126, "retweets": 18, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112572725881340051", "url": "https://x.com/s8mb/status/2112572725881340051", "text": "@SCP_Hughes This is a fascinating theory about the origins of monogamy. https://t.co/y1aZZUwIaR", "created_at": "2026-10-20T15:52:42+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "SCP_Hughes", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFdmBRWEAAHtYU.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112922271249817769", "url": "https://x.com/s8mb/status/2112922271249817769", "text": "@arthur_spirling @RFlutt90854 ChatGPT Astra Max says \"If the employer knows, or has reasonable cause to suspect, that the wages will or may be used for terrorism, paying them can itself be a criminal offence. The fact that they are wages owed for work does not create an exemption\"!", "created_at": "2026-10-21T15:01:40+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "arthur_spirling", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112919646357655590", "url": "https://x.com/s8mb/status/2112919646357655590", "text": "@1he0pposite I'm not sure about that – personally, I love most cities' central business districts and skyscrapers in general, and Samuel's piece about his visit to NYC is very positive. His piece on \"easy\" architecture has a bunch of examples of modernism he praises.\n\nhttps://t.co/DnfvQp0V8M\n\nhttps://t.co/MlNi2FDTWt", "created_at": "2026-10-21T14:51:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "1he0pposite", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112908236181680581", "url": "https://x.com/s8mb/status/2112908236181680581", "text": "@CharlesFLehman Surely craft beer is distinguished by its flavours, though? All these labels emphasise their flavours, and you very high strength lagers have existed for a long time.", "created_at": "2026-10-21T14:05:54+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "CharlesFLehman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112906042942357938", "url": "https://x.com/s8mb/status/2112906042942357938", "text": "@GrumpyArt We love differences of opinion and intelligent criticism! Our letters page is a trove of civil disagreement 😄", "created_at": "2026-10-21T13:57:11+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "GrumpyArt", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112905328857936144", "url": "https://x.com/s8mb/status/2112905328857936144", "text": "Beers of this strength are almost invariably revolting – they usually taste bad and make drinking a much higher stakes business than it ought to be. 4%, the moderate's choice, is just very hard to beat.", "created_at": "2026-10-21T13:54:20+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 53, "retweets": 1, "media": [], "quoted": {"author": "GoodGuyGuaranty", "text": "The ‘craft beer for alcoholics’ trend is now totally out of control. Basically every tall boy from a ‘craft brewer’ is approaching 10% ABV. Even Bell’s - once a connoisseur’s quaff - is getting in on it. When folks drinks less, I guess you gotta focus harder on your tier-1s https://t.co/zqaZ3cNKqL"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112904099674866138", "url": "https://x.com/s8mb/status/2112904099674866138", "text": "@JaneParkway I agree with that. And good buildings with good urban form and no cars looks even better. https://t.co/WmfkzUWKfx", "created_at": "2026-10-21T13:49:27+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JaneParkway", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVKLD76XEAA5ni3.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112888984623853842", "url": "https://x.com/s8mb/status/2112888984623853842", "text": "@JaneParkway I'm against design review. Tokyo is evidence that aesthetics is determined by the urban form as well as by the quality of individual buildings. Tokyo is not perfect though, I wouldn't argue that it being a great city means that it doesn't matter if your power cables look like this.", "created_at": "2026-10-21T12:49:24+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "JaneParkway", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJ9SHtXkAApj1b.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112886373426323793", "url": "https://x.com/s8mb/status/2112886373426323793", "text": "PS: It's kind of funny that this is Jonathan's header picture, from what looks like a very interesting event YIMBY Melbourne held on the *barriers* to beautiful building. I think if aesthetics really were as marginal as Jonathan says here, he wouldn't have organised this event and wouldn't have had a packed out lecture theatre attending it!\n\nhttps://t.co/VAdX8SvyWl", "created_at": "2026-10-21T12:39:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "s8mb", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJ6o_UXEAEQbAk.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112885472892420110", "url": "https://x.com/s8mb/status/2112885472892420110", "text": "I'm grateful to Jonathan for writing this and very pleased to publish it in Works in Progress – he does great work, and I like him and respect his views immensely. I have two thoughts in response.\n\nOne is that I am not hugely compelled by people telling others what they should focus on. As long as you're not doing active harm to the world, it's fine to work on a less high-priority area than you could. Comparative advantage is not always easy to judge from outside and part of living a satisfying life is doing what you find most intrinsically interesting and rewarding. \n\nAnd entrepreneurship is *inherently* about working on things that other people underrate! There wouldn't be any opportunities for discovery if it was clear exactly what everyone should focus their time on.\n\n(I don't have much time for people who complain that a handful of EAs are worried about shrimp welfare either, unless they are actually hurting the shrimp.)\n\nTwo: even if you concede Jonathan's argument that encouraging nice buildings and places does not instrumentally advance the cause of YIMBYism – we can agree to disagree – I think that it is a mistake to dismiss aesthetics as being trivial.\n\nPeople want beauty and pleasure in their lives, not just boxes to sleep and work in. Cities should be amazing places to be, and the way they look and feel is a big part of that. The greatest cities I have been to are Paris, London, Tokyo, and New York, all of which are breathtakingly beautiful cities in their own way, even though some of them create that beautiful whole from various ugly parts arranged well. I think this is often true of parts of London, where individually ugly buildings nonetheless combine to make a beautiful skyline or street. The best places, like inner Paris and lower Manhattan, combine beautiful streetscapes with individually-beautiful buildings.\n\nIf you think too much about \"units of housing\" and not enough about which places people most want to live in and visit, you will miss a lot of what actually matters to people about the places they live and visit. It is a constant error to think that the \"function\" of buildings and cities does not include \"being pleasant and looking nice\".\n\nThis is all obviously subjective, but so are lots of other important things that still benefit from some form of collective decision making – pollution, noise, public order, the provision of public goods. The interesting meta-question to me is what institutions allow for the best ways to make these decisions and resolve conflicts between people.", "created_at": "2026-10-21T12:35:26+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 54, "retweets": 4, "media": [], "quoted": {"author": "jonobri", "text": "I'm in @WorksInProgMag's letters section this week, arguing that British YIMBYism's preoccupation with beauty is a massive waste of time and resources.\n\nBeauty is marginal. There are bigger problems to solve in British housing—they're just all a bit less sexy. https://t.co/cmUgaRyVfJ"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112852222203572348", "url": "https://x.com/s8mb/status/2112852222203572348", "text": "I initially had the same reaction as these writers – the idea of a book being banned because the author has expressed support for a terrorist group is outrageous, as is the punishment of people for saying they support Palestine Action (or any other terrorist group). \n\nWhat I didn't realise was that Rooney has promised to donate her royalties to Palestine Action. It seems a lot less clear that you should be allowed to conduct business activity with the express purpose of raising money for a terrorist group. The books should be allowed to be sold, but the royalties should be withheld. I would not allow people to fundraise for violent Neo-Nazi or Islamist groups either.\n\nYou could argue that Palestine Action should not be proscribed, but that is not the argument being made in this letter.", "created_at": "2026-10-21T10:23:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 255, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVJayb_WkAANPZH.jpg"}], "quoted": {"author": "Sam_Dumitriu", "text": "The specific case of Sally Rooney isn't an act of censorship.\n\nI am a free speech absolutist. If she wanted to write book called \"Why I support Al Qaeda, ISIS, and the IRA\" then I'd support her right to do so. Britain should have a First Amendment approach to speech.\n\nHowever, if she wants to give the proceeds of that book to those organisations, then it is right for her publisher to prevent her (and it would probably be criminally liable too.)\n\nThe open letter is cowardly. They should have the courage to state clearly their view: it should be legal to directly fund organisations that unapologetically break into military base. \n\nBTW, I note that none of the signatories of this letter signed the Harper's letter in favour of free speech. Some however attacked it."}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112845406581522600", "url": "https://x.com/s8mb/status/2112845406581522600", "text": "The Romans were a lot less sexually permissive than I used to think. Free men were permitted to rape slaves, including children, but extramarital sex between free men was punished, as was female infidelity. \n\nhttps://t.co/v5m5bQAqOu", "created_at": "2026-10-21T09:56:14+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112801768581328954", "url": "https://x.com/s8mb/status/2112801768581328954", "text": "“The Simpsons” was a beloved animated sitcom that ran for ten legendary seasons and concluded in 1999. The show was celebrated for what was widely perceived as a near perfect run that wrapped before it wore out its concept and overstayed its welcome.\n\nCreator Matt Groening and showrunner James L. Brooks famously decided to bring the show to a conclusion after experiencing the negative audience reaction to the season 9 episode “The Principal and the Pauper,” in which it was revealed that the school’s principal was actually an impostor who had stolen the real Seymour Skinner’s identity.  Brooks did not want to sully the show’s legacy by doing a bunch of weird episodes as the franchise slid into mediocrity and cultural irrelevance, so the writers and cast decided instead to go out on top and end things on a high note.\n\nHowever, because of its centrality in 90s pop culture, a long-running Internet joke is to pretend “The Simpsons” is still on the air, a premise that gets more absurd and deranged with each passing year. If this show were still producing new episodes, it would be in its 38th season now, and most of the voice cast would be in their 80s.\n\nThe joke is to imagine how distorted this charming show would have become if it had been stretched out to more than 800 episodes. Comedy posters on “weird Twitter” used to try to top each other by making up terrible ideas for what modern episodes of the show might be like.\n\nFor example, a viral 2012 tweet imagined an episode where Lady Gaga helps Lisa Simpson with her self esteem. In 2019, popular shitposter Megan Amram originated the premise of Bart Simpson becoming a men’s rights activist to protest a gender-swapped reboot of “Itchy and Scratchy.”\n\nBut perhaps the most elaborate Internet “Simpsons” joke was a 2017 YouTube mockumentary “The Problem With Apu,” in which the comedian Hari Kondabolu ironically pretended to be offended by the charming and innocuous convenience store owner character Apu. \n\nEveryone thought this was hilarious, especially since the show had been off the air for nearly two decades when the mockumentary was released. So, Twitter ran with the joke by pretending to “cancel” Apu, and the viral gag memorably resulted in the character’s voice actor, Hank Azaria, recognizing the meme by promising never to perform the character again, which everybody thought was really funny since Azaria had been retired for years.\n\nNow, nearly a decade later, fans are pretending that the show — which has now been off the air longer than most people tweeting about it have been alive— has brought back the “cancelled” character with a new racially-appropriate voice actor. \n\nI actually don’t think this is that funny, and I kind of think the gag of pretending “The Simpsons” is still airing new episodes has overstayed its welcome, a mistake the actual show “The Simpsons” would never have made.\n\nIf you haven’t seen this 1990s classic, which — and I cannot emphasize this enough — ended after 10 seasons in 1999, you can watch all the episodes on Disney+ (except the one with Michael Jackson that got pulled from streaming).", "created_at": "2026-10-21T07:02:50+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DanFriedman81", "rt_author_name": "Daniel Friedman", "likes": 13205, "retweets": 1370, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112786298209440135", "url": "https://x.com/s8mb/status/2112786298209440135", "text": "I am now a single-issue voter. https://t.co/RKcMAmBTEB", "created_at": "2026-10-21T06:01:21+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jenniferdoleac", "rt_author_name": "Jennifer Doleac", "likes": 1151, "retweets": 74, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGnSrsW4AAMX9K.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVGnSsBXIAE62iL.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112782669930991774", "url": "https://x.com/s8mb/status/2112782669930991774", "text": "@jonobri @bechhof @WorksInProgMag Thanks for writing!", "created_at": "2026-10-21T05:46:56+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "jonobri", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112660163459260616", "url": "https://x.com/s8mb/status/2112660163459260616", "text": "@K_Niemietz What a loss. Good luck with what’s next.", "created_at": "2026-10-20T21:40:08+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "K_Niemietz", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 65, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112638760332492805", "url": "https://x.com/s8mb/status/2112638760332492805", "text": "@Sherman1890 Ideally through a better price system. Electricity prices generally don't price these things very clearly or efficiently right now. Eg, real time priced tariffs are rare and unit prices often contain a lot of the fixed costs.", "created_at": "2026-10-20T20:15:06+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "Sherman1890", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112638315484840134", "url": "https://x.com/s8mb/status/2112638315484840134", "text": "@timleunig And ice storage air conditioning, which is at least theoretically possible – not sure how much, if at all, it is used in practice right now, but real time electricity pricing would of course hugely incentivise it.", "created_at": "2026-10-20T20:13:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "timleunig", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112637810280694178", "url": "https://x.com/s8mb/status/2112637810280694178", "text": "@MOates_ I don't think any data centre will get built without the certainty of 24/7 electricity, the chips are too valuable to not run all the time. Some are built with battery storage though, and this piece suggests that many would be willing to disconnect from the grid at periods of extremely high demand.\n\nhttps://t.co/Cim7bgf4rv", "created_at": "2026-10-20T20:11:19+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "MOates_", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110747920165183892", "url": "https://x.com/random_walker/status/2110747920165183892", "text": "There is widespread frustration about the AI industry’s “automate everything\" agenda. But what would it take to steer AI toward augmenting human capabilities instead? In a new essay, Gabriel Unger (@_gabrielunger) and I lay out a research agenda and plan for action. https://t.co/gWjFI5VKbz\n\nOur thesis is that the reason why AI-for-automation currently dominates isn’t just economic incentives but also deeper cultural issues in computer science as a field. And that can be changed.\n\n- We sketch four important research directions that are needed in order to build collaborative or augmentative AI. The automation paradigm largely ignores these technical challenges.\n- We advocate for Human-Computer Interaction and Human-Centered AI to be elevated as a subfield in status, influence, and funding, and changing AI curricula to emphasize the role of the human and decrease the centrality of the pure-automation problem framing.\n- We point out that there are a surprising number of efforts in economics, computer science, industry, and policy all trying to bring about a shift toward augmentation, but not enough collective awareness. Better connecting these movements would amplify their power.\n- We think the automation agenda is struggling on its own terms. Compiling evidence of the limits of general-purpose agents for automation and loudly making the case will encourage more companies to take collaboration more seriously as a goal.\n- We predict that once more workers experience this way of working and recognize that there are alternatives to the delegate-and-supervise pattern, it will generate more demand, creating a flywheel effect.\n- Targeted policy levers can play a small but important role in amplifying both the supply and demand for pro-worker AI. We don’t need clumsy top-down mandates.\n\nWe're not against automation. But we think the goal of AI must be broader.\n\nThis is the start of a long-term project. I know there are far more like-minded efforts out there than we’re aware of. I’d love to hear about some of them.", "created_at": "2026-10-15T15:01:34+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110805089682350385", "url": "https://x.com/random_walker/status/2110805089682350385", "text": "@Klonick Thank you, Kate!", "created_at": "2026-10-15T18:48:44+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "Klonick", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110804986930020811", "url": "https://x.com/random_walker/status/2110804986930020811", "text": "@gabriel_weil Thank you, Gabe!", "created_at": "2026-10-15T18:48:20+00:00", "author_handle": "r om/random_walker/status/2110803507506974754", "text": "@VminVsky Thank you, Venia!", "created_at": "2026-10-15T18:42:27+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "VminVsky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803481737023888", "url": "https://x.com/random_walker/status/2110803481737023888", "text": "@togelius @sayashk Thank you, Julian!", "created_at": "2026-10-15T18:42:21+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "togelius", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803425831084100", "url": "https://x.com/random_walker/status/2110803425831084100", "text": "@MichaelRStrain @alexolegimas Thank you, Mike!", "created_at": "2026-10-15T18:42:08+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "MichaelRStrain", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803331111088425", "url": "https://x.com/random_walker/status/2110803331111088425", "text": "@BedoyaUSA Thank you, Alvaro! Much appreciated.", "created_at": "2026-10-15T18:41:45+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "BedoyaUSA", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803293484052989", "url": "https://x.com/random_walker/status/2110803293484052989", "text": "@wsisaac Thank you, William!", "created_at": "2026-10-15T18:41:36+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "wsisaac", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803245136241136", "url": "https://x.com/random_walker/status/2110803245136241136", "text": "@lukOlejnik Thank you, Lukasz!", "created_at": "2026-10-15T18:41:25+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "lukOlejnik", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110803203231215708", "url": "https://x.com/random_walker/status/2110803203231215708", "text": "@kyleichan Thank you, Kyle!", "created_at": "2026-10-15T18:41:15+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "kyleichan", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110783100724695209", "url": "https://x.com/random_walker/status/2110783100724695209", "text": "Here's an agenda that's very attractive from the AI safety worldview and a broad coalition can get behind.", "created_at": "2026-10-15T17:21:22+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "sorenmind", "rt_author_name": "Sören Mindermann", "likes": 3, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111111994484924897", "url": "https://x.com/random_walker/status/2111111994484924897", "text": "@raphaelmilliere I mean the other way around... one reason people think AI won't follow the path of other general-purpose technologies is that they fear we will not be able to exercise adequate agency when faced with superintelligence.", "created_at": "2026-10-16T15:08:16+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "raphaelmilliere", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111101648781132007", "url": "https://x.com/random_walker/status/2111101648781132007", "text": "I'm often asked what the cruxes are that separate the AI as Normal Technology worldview from that of our critics. I think this is one of them. We think this mindset shift is hard but necessary and achievable. Many others think that as AI capabilities continue to advance, we will inevitably give up control. Creating and compiling indicators of disempowerment and analyzing which direction they're moving remains one of the most important but underappreciated and underfunded areas of AI safety.", "created_at": "2026-10-16T14:27:10+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 1, "media": [], "quoted": {"author": "random_walker", "text": "We need a mindset shift in how we deploy AI. In the past, new capabilities unlocked new use cases. Safety, control, ethics, and skill erosion were important but usually secondary considerations; risks to be managed rather than gating criteria. But now and in the future, capability won't be the main bottleneck to deployment — considerations beyond productivity should be the decisive factor. The  default question used to be \"What can AI do?\" But we need to start asking \"Of the things AI can do, what should we actually delegate to it?\""}, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111065613237915681", "url": "https://x.com/random_walker/status/2111065613237915681", "text": "We need a mindset shift in how we deploy AI. In the past, new capabilities unlocked new use cases. Safety, control, ethics, and skill erosion were important but usually secondary considerations; risks to be managed rather than gating criteria. But now and in the future, capability won't be the main bottleneck to deployment — considerations beyond productivity should be the decisive factor. The  default question used to be \"What can AI do?\" But we need to start asking \"Of the things AI can do, what should we actually delegate to it?\"", "created_at": "2026-10-16T12:03:58+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110891552788885966", "url": "https://x.com/random_walker/status/2110891552788885966", "text": "this is totally worth a read! will shift your perspective on how warped the current direction is towards automation and how much more we can do on augmentation. \n\non \"Problem #4: How can we evaluate, and optimize for, human-AI collaboration?\"\n\nI learnt a lot from our initial attempt (centaur bench: https://t.co/9swmtxevOS), but also learn how complex/multi-dimensional the problem is. This essay does a great job of laying out some of those dimensions. \n\nI'd tried to put together something very quickly for our phd students (https://t.co/s1BE8ygm0x) and this picture still guides my thinking here.", "created_at": "2026-10-16T00:32:19+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "abhishekn", "rt_author_name": "Abhishek Nagaraj", "likes": 19, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUtawigbcAAk5Zm.png"}], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110858421780250892", "url": "https://x.com/random_walker/status/2110858421780250892", "text": "While automation dominates much of the AI conversation, what other research directions should we prioritize?\n\n@random_walker and @_gabrielunger argue for a broader research agenda in \"Steering AI Beyond Automation.\"\n\nRead the essay here: https://t.co/ofoiKSXUfG", "created_at": "2026-10-15T22:20:40+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DigEconLab", "rt_author_name": "Stanford Digital Economy Lab", "likes": 5, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111155879894548604", "url": "https://x.com/random_walker/status/2111155879894548604", "text": "@raphaelmilliere Sure. If you are looking for true cruxes I doubt there is one. Beliefs tend to be tightly correlated (more than logically entailed), which says something about the discourse. That was part of our motivation for writing the paper. https://t.co/eH7ifWXzR4", "created_at": "2026-10-16T18:02:39+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "raphaelmilliere", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUxUZyMX0AA5Pdr.png"}], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2112131426762047700", "url": "https://x.com/random_walker/status/2112131426762047700", "text": "My posts on research careers, professional practice beyond academia, and AI's impact on work seem to resonate here, so I've compiled about a hundred entries: https://t.co/JtbIy5WQs2\n\nI hope it is helpful to read it as a collection, because it reflects a coherent underlying philosophy and approach to careers that I've adopted in my own work.\n\nThere's a lot of career advice online. Two things are distinct about this collection:\n- Grounded optimism. I'm candid about the structural challenges, twisted incentives, and other limitations of the institutions we inhabit. I share ideas on how we can adapt and thrive in these flawed systems, and how and when we should challenge them.\n- Connecting research and practice. Much of my research is on AI agent evaluation and AI's effects on the economy and labor, which lets me share insights into how we can effectively adapt and integrate it into our work.\n\nLet me know what you think and what else I should write about!", "created_at": "2026-10-19T10:39:08+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 80, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112126078542070195", "url": "https://x.com/random_walker/status/2112126078542070195", "text": "@davidmanheim Cool, I will try that. Just to clarify, by general perspective I mean \"someone from the AI safety community\" etc.", "created_at": "2026-10-19T10:17:53+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "davidmanheim", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112116363515113725", "url": "https://x.com/random_walker/status/2112116363515113725", "text": "@davidmanheim Nice! Definitely agree that this can be super valuable; I also use LLMs this way, though usually to simulate a general perspective rather than individuals.", "created_at": "2026-10-19T09:39:16+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": true, "reply_to": "davidmanheim", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": []
