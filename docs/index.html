ality can actually help it spread.\n\nHuman casualties are merely a byproduct.\n\n@Oklahomaharper explains why the plague is a marvel of evolutionary efficiency.", "created_at": "2026-11-03T17:31:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117667312165646637", "likes": 31, "retweets": 3, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117637546561753088/img/15bRNS0ZK9Imfo9o.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117394374883746179", "url": "https://x.com/dwarkesh_sp/status/2117394374883746179", "text": "The average ancient Roman was small and dumb by modern standards.\n\nEven Caesar August was only about 5’6” tall.\n\n@Oklahomaharper  explains how Romans resembled the populations of the poorest countries in the world today due to disease exposure and bad nutrition. https://t.co/F7BTs5f86q", "created_at": "2026-11-02T23:12:12+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117391304267350214", "likes": 80, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117294272625991680/img/SHvl3qHggGNu8WVq.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2118116214115610997", "url": "https://x.com/dwarkesh_sp/status/2118116214115610997", "text": "When you send ChatGPT a message, your request doesn't get processed individually, it gets processed alongside thousands of other requests sent by other people.\n\n@reinerpope compares this process to passengers at a train station:\n\n“Any passengers who are ready board the train. If the train is full, then they wait till the next train. If the train is not full, the train's going to go anyway. In terms of what that means for queuing latency, it means that the worst case is that a request arrives just after the train departed. It has to wait for the next train, so that's up to 20 milliseconds, and then it has to wait for that train to complete. The worst-case latency is 40 milliseconds.”", "created_at": "2026-11-04T23:00:32+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2117753697950437877", "likes": 103, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117638427969503232/img/RaxPBcWDJEXlJpsZ.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118116186936524934", "url": "https://x.com/dwarkesh_sp/status/2118116186936524934", "text": "When Uranus's orbit didn't match the models of Newtonian physics, astronomers assumed there must be another planet nearby throwing off the orbit.\n\nThey soon discovered Neptune.\n\nWhen Mercury's orbit didn't match the models of Newtonian physics, astronomers assumed there must be another planet nearby throwing off the orbit.\n\nThey were wrong. They needed Einstein’s theory of relativity to rewrite their basic physics assumptions.\n\n@michael_nielsen  explains why scientists often can’t tell whether an anomaly requires a minor correction or a scientific revolution.", "created_at": "2026-11-04T23:00:26+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118116089242808776", "likes": 56, "retweets": 8, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117984029878132736/img/x4uWJ5AtyIyabbYF.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2118116177851580839", "url": "https://x.com/dwarkesh_sp/status/2118116177851580839", "text": "Why can't we have arbitrarily large GPU scale-ups? \n\n@reinerpope explains it's partially a matter of wire density: https://t.co/hGGrb46yNC", "created_at": "2026-11-04T23:00:24+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "rt_avatar": "https://pbs.twimg.com/profile_images/1915048486505971712/H2jFRoW6_normal.jpg", "rt_id": "2118025489285795925", "likes": 114, "retweets": 6, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117983257463574528/img/NuFVmfyjokZ9WWgV.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2116257435543540180", "url": "https://x.com/Lewis_Bollard/status/2116257435543540180", "text": "Denmark is moving to ban Frankenchickens — the first country in the world to do so.\n\nWhat we’ve done to chickens is the largest genetic experiment ever run on any animal, and one of the most troubling.\n\nGeneticists took a scrawny bird and engineered an obese meat machine. The chickens we eat today grow four times faster than chickens did in 1957.\n\nBut their bodies are not four times stronger. By just six weeks old, many will suffer ailments of old age — heart failure, organ colapse — while one in four will become lame (Knowles et al., 2008). \n\nIn studies, lame birds will choose feed laced with painkillers — a sign of chronic pain (Danbury et al., 2000).\n\nTheir parents meanwhile are kept on starvation rations. Birds engineered to grow this fast would otherwise eat themselves to death before laying a single egg.\n\nWe now breed over 70 billion of these birds a year. Denmark is acting to reverse this giant genetic experiment. The rest of the world should follow suit.", "created_at": "2026-10-30T19:54:25+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV50dTvW4AAa9f2.jpg"}], "quoted": {"author": "POLITICOEurope", "text": "The Danish government wants to ban a fast-growing breed known as “turbo chickens,” setting up another clash with the farm sector over animal welfare. \n\n https://t.co/FoeCTUPOxO"}, "fetched_at": "2026-10-30T19:55:59.417095+00:00"}, {"id": "2118019260433977794", "url": "https://x.com/Lewis_Bollard/status/2118019260433977794", "text": "@AtletiRoma Yeah fair point. He was much less stubborn and dogmatic on this than Ashley Hinson.", "created_at": "2026-11-04T16:35:17+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "AtletiRoma", "reply_to_id": "2118017391846433197", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118018958465105974", "url": "https://x.com/Lewis_Bollard/status/2118018958465105974", "text": "Factory-farmed ducks and geese won last night too.\n\nDenver and Washington DC both voted to ban the sale of foie gras — by wide margins.\n\nFoie gras is produced by force-feeding birds through metal tubes until their livers expand to ten times their natural size.\n\nIn DC, the political elite — from Jose Andres to Mayor Muriel Bowser — opposed the measure as a distraction from the Big Serious issues they care about.\n\nDC voters disagreed.", "created_at": "2026-11-04T16:34:05+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": true, "reply_to": "Lewis_Bollard", "reply_to_id": "2118016977432461455", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS29XIaMAIPy1r.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118016977432461455", "url": "https://x.com/Lewis_Bollard/status/2118016977432461455", "text": "Some great news for factory-farmed pigs last night.\n\nIn Iowa and Kansas, voters rejected the lead sponsors of the Save Our Bacon Act in both the House and Senate: Rep. Ashley Hinson and Sen. Roger Marshall.\n\nThese were the politicians who did the pork lobby’s bidding and tried to wipe out every state ban on selling pork from crated pigs.\n\nYet even in two of the most pro-agriculture states in the country, it cost them more votes than it won them.\n\nThe politicians who follow the factory farming lobby aren’t as safe as they thought.", "created_at": "2026-11-04T16:26:12+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1945502946910699520/AxOdmQGI_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 432, "retweets": 75, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWS07nqaoAArnvz.jpg"}], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117271035309699510", "url": "https://x.com/mentalgeorge/status/2117271035309699510", "text": "@random_walker I'm guessing you're assuming that increased efficiency from RSI automatically escapes the lab that won those efficiency gains?\n\nSeems like that's currently the case because of distillation, but it's not obvious to me that the distillation will forever continue at current scale", "created_at": "2026-11-02T15:02:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "random_walker", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117256394282062178", "url": "https://x.com/mentalgeorge/status/2117256394282062178", "text": "I had no idea about the progress that's being made on AI verification hardware that could enable a binding US-China treaty on AI.\n\nTom Milton, CEO of Amodo Design, demonstrates here.\n\nSeems like insanely important work and also just very cool.\n\n01:04 Why compute is the best place to verify an AI slowdown\n06:08 Can you prove a lab isn’t cheating?\n13:22 Live demo: how to spot a cheating GPU\n19:50 Could China hide a data centre?\n23:35 Can verification tools be hacked?\n29:13 Is anyone at OpenAI working on this?\n37:49 Chinese inspectors in US data centres??\n46:07 The 20-day panic deal\n51:27 What would a US–China AI deal look like?\n55:38 Why lab researchers should work on verification\n58:45 What if we never build this?\n1:02:06 Can verification protect against power grabs?\n1:07:20 How good is AI at hardware design?\n1:18:32 What’s holding AI back in hardware?\n1:22:44 Risks of automating hardware R&D\n1:25:41 The DARPA model for AI safety\n1:32:26 What’s left for engineers after AI?\n1:40:07 Personal gadgets, designed by Fable?\n1:41:56 What if the US stops sharing its AI?\n\n(@tsmilton_amodo, @mentalgeorge )", "created_at": "2026-11-02T14:03:55+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "robertwiblin", "rt_author_name": "Rob Wiblin", "likes": 54, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117248941460725760/img/-tbRndVLGKdZYyTu.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117595812070822324", "url": "https://x.com/mentalgeorge/status/2117595812070822324", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:32:39+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 37, "retweets": 3, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw"}, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117980423015866713", "url": "https://x.com/mentalgeorge/status/2117980423015866713", "text": "Going to be in DC all of next week - I haven't been since i was 15 years old, please reach out with tips for how to get the most out of the city and if you would like to get coffee, lunch, shisha, etc.", "created_at": "2026-11-04T14:00:57+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117973679325806875", "url": "https://x.com/mentalgeorge/status/2117973679325806875", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-04T13:34:09+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117925569870352856", "url": "https://x.com/mentalgeorge/status/2117925569870352856", "text": "@MaskedTorah Oh good point, forgot this was the case", "created_at": "2026-11-04T10:22:59+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "MaskedTorah", "reply_to_id": "2117923570382971303", "avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118344311465034201", "url": "https://x.com/mentalgeorge/status/2118344311465034201", "text": "@theobearman lmfao, i'm not necessarily against continued build-out but calling it a safety policy really is quite funny", "created_at": "2026-11-05T14:06:55+00:00", "author_handle": "mentalgeorge", "author_name" id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117686018019295435", "url": "https://x.com/ohlennart/status/2117686018019295435", "text": "OpenAI’s based it's AI training compute trend on ~15 data points and found a 3.4-month doubling time.\n\nA group of nerds later corrected it to ~6 months with around 100 data points. That group became Epoch AI. https://t.co/oltWQ1cHEa", "created_at": "2026-11-03T18:31:06+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 24, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOIAgPbUAEhErA.jpg"}], "quoted": {"author": "finmoorhouse", "text": "Gordon Moore based his prediction on 5 data points. https://t.co/KE6ef7LAFx"}, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117767075959845120", "url": "https://x.com/ohlennart/status/2117767075959845120", "text": "I am very proud of this work. FlashProve is a research prototype, but it shows that proving which model produced a response can be practical.\n\nIn the blog, the first usecase we discuss is AI pacing: such proofs get us part of the way to checking that hardware serves inference, and is not being used for training.\n\nThis is just a starting point, and I'm very excited for others to take on the mantle and outdo us.\nhttps://t.co/0pn81QXTKK", "created_at": "2026-11-03T23:53:11+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1421449447482044420/_HX1YpJC_normal.jpg", "is_retweet": true, "rt_author": "RoyRinberg", "rt_author_name": "Roy Rinberg", "rt_avatar": "https://pbs.twimg.com/profile_images/1308096087136169984/GqR87k_N_normal.jpg", "rt_id": "2117745963381264581", "likes": 142, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2116173311185215638", "url": "https://x.com/sayashk/status/2116173311185215638", "text": "Resharing our paper on the science of AI agent evaluation because the PHP vulnerability happened right as we announced the paper last week and our server was taken down all day to upgrade PHP 🫠 \n\nPDF: https://t.co/8m13p9d70F\nWebpage: https://t.co/xGAvBCGW4a\nBlog: https://t.co/qxO21qWZfm\n\nThere are growing calls for independent and embedded AI evaluation, especially of AI agents. But much remains unclear: what constitutes a “good” evaluation, what needs to be evaluated in the first place, and how best to coordinate and support the influx of people entering the burgeoning evaluation ecosystem.\n\nOur group at Princeton has been working to improve the state of AI agent evaluation for about three years. We teamed up with people who’ve done foundational work on evaluation at Stanford, the UK AI Security Institute, and Brookings. Our paper is titled Emerging Trends in AI Agent Evaluation. We synthesized the trends we see across three dimensions—the science and methods, the research agenda, and the evaluation ecosystem—with the goal to help those who are upskilling for this new paradigm. We also aim to equip evaluators, funders, and the public with a set of questions to ask, and provide actionable recommendations.\n\nBy @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, @sayashk, and me.", "created_at": "2026-10-30T14:20:08+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 21, "retweets": 4, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4gNKRW0AIfqKE.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2117341399414624439", "url": "https://x.com/sayashk/status/2117341399414624439", "text": "As AI labs race toward Recursive Self Improvement, there’s a possibility that what they are actually racing toward is Recursive Self Extinction — of their business model. Here’s my reasoning.\n\n1. Progress on verifiable tasks continues. In particular, improving the cost efficiency of existing capabilities is a highly verifiable task. For the past few years, cost per equivalent capability has dropped by at least 10x per year. I think this progress will be sustained for a few more years, and even accelerate as labs use AI more and more heavily for AI research in the pursuit of RSI. There is of course a ceiling to efficiency improvements, but I don’t think we’re close to that ceiling.\n\n2. Progress on most unverifiable tasks remains frustratingly hard. AI inherits the same limitations (ambiguous success criteria, slow and noisy feedback) that limit human performance at tasks ranging from writing to governance. The optimization paradigm generally doesn’t result in superhuman capabilities on such tasks, because whatever proxy you optimize for gets Goodharted. For example, I recently pointed out how over-optimization explains Claude’s overly dense and ornamental writing style that’s since been dialed back.\n\n3. RSI ends up being narrow. A consequence of the above two points — even if some version of RSI is achieved, it results in an explosion in some dimensions (efficiency, verifiable tasks) while falling short of producing something that is superintelligent in any real sense or capable of automating a broad swath of jobs in the economy.\n\n4. More than one lab stays at the frontier. This means the market will remain competitive, and developers can’t charge high margins to compensate for rapidly falling inference prices. Any compute scarcity that allows higher margins is temporary, in my view. I also think it’s likely that most of the innovations continue to make their way into open-weight models with some lag, so open-weight models are at cost parity for inference or only slightly more expensive. Note that efficiency tricks and verifiable capabilities tend to leak much faster than unverifiable ones. Distillation could be one reason, but simply knowing that something can be sped up 10x tends to have a focusing effect on research and innovation.\n\n5. Jevons’ paradox is not a magic bullet. If the above points hold, there are very few applications that will consume so many tokens that they could generate the astronomical amounts of revenue implied by the labs’ valuations. We’re talking about a 10x growth in tokens year after year, just to keep revenue flat given falling prices. \n\nEven today’s behemoth tasks like migration of million-line legacy codebases will likely become cheap within a few years. While new applications will open up, there won’t be orders of magnitude more new ones. As for unverifiable tasks, inference scaling rapidly hits diminishing returns. Ultimately you have to have a human in the loop who’s accountable for the result. Spending more on tokens doesn’t let customers escape that responsibility — and only makes the human review bottleneck worse.\n\n6. What about scientific research? Science is an endless frontier, and more tokens could perpetually mean more discoveries and inventions, in theory. But the unfortunate thing about research is that researchers don’t get to capture the value it creates, which is why it requires government funding in the first place. Even if it’s true that AI could enable great scientific innovations, I don’t think AI companies will make much money off of that. I think they are currently investing in AI-for-science not as a future revenue stream but as a loss leader because they want to show the public that it could be beneficial to humanity.\n\n7. The one escape hatch is moving “up the stack”, by which I mean quickly transitioning from selling tokens to an enterprise software like model that relies on high switching costs, deep integration into workflows, and control over systems of record. In this world, enterprises will purchase “digital workers” or pay per solution (e.g. resolved support ticket) rather than tokens, so it’s good or neutral for AI companies if inference costs fall. And open models don’t matter as much — Linux being free didn’t make most enterprises switch away from Windows, because they paid for polish, peace of mind, support, and familiarity, not the code itself. I think this is the labs’ best bet for becoming sustainable businesses (though the potential lock-in is concerning for their customers!). The problem is that the labs have many hurdles to clear to get there, most of all their mindset, and the faster they race toward RSI, the shorter the window they give themselves for this transition. The pure-play AI labs are the ones who are farthest from being able to make this transition, and AI companies with a long history in enterprise software are relatively well positioned.\n\nIn short, the race to RSI ends up being a race to eliminate the labs’ main avenue for capturing the value that they create — the fate of many past transformative technologies such as railroads, airlines, and fiber.\n\nThe labs’ bet is that RSI produces a durable, decisive lead that escapes commoditization. My view is that there are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop that might lead to AGI or superintelligence will require ever-increasing amounts of compute, talent, data, and real-world feedback that can only come from gradual deployment, and the money to fund all this will have to come from massive revenue growth. And the irony is that the first improvement loop is undermining exactly that revenue growth.\n\nThe premise in my chain of reasoning that I’m least confident in is #5 — that Jevons’ paradox will eventually stop being able to compensate for efficiency improvements. A few months ago I was much more of a believer in continued, nearly unbounded token volume growth, but the more I’ve thought about it the more skeptical I’ve become.\n\nTo better understand why the premises and outcome I've laid out are at least a possibility:\n\n* My AI-as-normal-technology essay and follow-up writings with @sayashk on our newsletter https://t.co/ZwebetjZ4n\n* My ICML talk laying out my skepticism of the claim that RSI will lead to superintelligence https://t.co/ZA5TBDypfl\n* Ramez Naam’s review of the evidence questioning the prospects of an intelligence explosion (@ramez) https://t.co/1rWunFZOfo\n* My piece with Akash Kapur (@akashkapur) on whether AI labs will move up the stack https://t.co/WbhsVQt2kz\n* Many pieces by Nathan Lambert (@natolambert) such as “I expect rapid progress but not towards general superintelligence.”", "created_at": "2026-11-02T19:41:42+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 301, "retweets": 40, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWH4mBhWQAA5Lou.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117066905416503457", "url": "https://x.com/sayashk/status/2117066905416503457", "text": "Low status is often high impact.\nStudying AI jaggedness and shortfalls and their incredible capabilities is key so forecasts of AI impacts are as correct as AI capabilities forecasts have been. \nLots of low-hanging fruit in this research niche.", "created_at": "2026-11-02T01:30:58+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Abi0lvera", "rt_author_name": "Abi Olvera", "likes": 49, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117760736466252258", "url": "https://x.com/sayashk/status/2117760736466252258", "text": "Update: Can AI agents use Pangram to beat Pangram? In small tests, I found simple prompts to the Codex allowed it to beat Pangram. The final output was 100% human generated. Prompts that helped:\n\n- Have the agent develop a style guide based on past writing\n- Have it develop an \"anti-style guide\" based on AI writing tics that people have complained about \n- Instruct it to get to a seed sentence that Pangram doesn’t flag (or at least flags as AI-assisted rather than fully AI-generated). Then the agent knows what strategies work and can iterate from there", "created_at": "2026-11-03T23:28:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 195, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWPHhLZX0AERJcF.jpg"}], "quoted": {"author": "random_walker", "text": "I tried exactly this back in February using Claude Code. It worked pretty easily, though ~all of the important ideas had to come from me and CC itself couldn't figure them out.*\n\nI tried it again a week ago. Complete failure, despite Claude being much better and not needing as much guidance from me. Pangram seems to have been dramatically hardened in the last few months. The API kept returning scores > 0.99 for AI writing so there wasn't even a gradient for it to figure out what's working and what isn't.\n\n* Things it couldn't figure out on its own a few months ago, even after a bunch of iterations:\n1) Remove well-known tells like em-dashes (!)\n2) Do controlled experiments instead of stuffing a bunch of ideas at once\n3) Start from known-best text and surgically make edits. Much better than trying to rewrite the whole essay (or even paragraphs or sentences) because the that just produces text from the LLM distribution all over again.\n\nIn my more recent experiment, 1) and 2) were obvious to Fable but 3) still wasn't. Pretty surprising.\n\nAnyway, hats off to @pangram. I'll probably give it another shot at some point but I'm more-or-less ready to change my mind as an AI-detection skeptic.\n\nThis was the LLM summary from my first experiment BTW. Still gives me a chuckle."}, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2117307620013039916", "url": "https://x.com/slatestarcodex/status/2117307620013039916", "text": "@AndrewSabisky @peterbhase I separately explained in the post why I think that removing more safety-focused companies from the race is net negative, and so needs to have some compensatory benefit.\n\nIf Anthropic quit but everyone else continued, then dangerous AI will still be built, it will just be built by a potentially less safety-focused company, with less time for alignment. So a pro-unilateral-quitting person would need to argue that Anthropic quitting will do something about race dynamics more broadly. When I've had these discussions before, some pro-SURA people have argued that it would raise awareness of the dangers of AI so much that it would increase the chance of a global pause, and this would compensate for the negative effects on Plan C.", "created_at": "2026-11-02T17:27:28+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117302328160366706", "url": "https://x.com/slatestarcodex/status/2117302328160366706", "text": "@qorprate @jessi_cata Why don't you explain what you think is wrong with it instead of vagueposting about how you're so much smarter than I am?", "created_at": "2026-11-02T17:06:27+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "qorprate", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 55, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117301946730303535", "url": "https://x.com/slatestarcodex/status/2117301946730303535", "text": "@peterbhase I stand by this.\n\nI think if people are demanding that Anthropic disband based on a claim that this would increase p(pause), they need to make some kind of affirmative argument that this really does increase p(pause) by a lot. I haven't seen this in this case.\n\nI think the right form for this argument is a forecast. We've spent all this work developing and validating this forecasting technology, including conditional forecasting, here's a conditional statement about the future, so let's use it! I don't know if you've read the research behind AI superforecasting, including the reasons to think it currently beats ~all human forecasters, or why it's not just \"I asked an AI\", but I'm excited about it and I think it's a useful tool in a case like this. Ideally we would supplement it by asking human superforecasters, but I can't do this on the timescale of a single blog post.\n\nI warned people against taking any of the specific numbers too seriously because the exact p(pause) changes based on how you frame \"pause\" and how long a time horizon you give it. But this is good - it successfully gets us from a discussion which so vague that everyone is talking at cross-purposes to one where we have to actually quantify what we're talking about. I think a lot of the benefit of this is shifting people into Near Mode - making them go from treating \"Anthropic disbanding will usher in a global pause!\" as a slogan to actually figuring out the probability. If other people think it's higher than 3 percentage points, maybe that's our crux, and then we really should bring in the human superforecasters or focus on how to figure out that number.\n\nI'm sorry you're tired of \"rationalist attempts at argument\", but I'm tired of cheap attempted Twitter dunks where people don't even put any effort into saying what's wrong with something, just hold up a caricatured version of something you don't understand and demand everyone point and laugh. I'm proud to be affiliated with a community that tries to do better than that.", "created_at": "2026-11-02T17:04:56+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "peterbhase", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 195, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117119013511930099", "url": "https://x.com/slatestarcodex/status/2117119013511930099", "text": "@Surveil__Lance @ohabryka @ApriiSR @enormochungus @jessi_cata I agree that 1, 2, 3, and 5 are real divides. I don't think I differ from Oli or Daniel in my level of next-twelve-months concern or support for public rallies (we're all concerned and all support them).\n\nI also support pressuring the labs, just to do different things (sign conditional commitments, etc)", "created_at": "2026-11-02T04:58:01+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Surveil__Lance", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117118546300043631", "url": "https://x.com/slatestarcodex/status/2117118546300043631", "text": "@ohabryka @EigenBraid @ApriiSR Thank you. This is helpful in understanding what you mean, although it still seems like only a small fraction of worlds, and still only seems to buy a few years.", "created_at": "2026-11-02T04:56:10+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117115600933937335", "url": "https://x.com/slatestarcodex/status/2117115600933937335", "text": "@repligate I don't endorse this reading - things are going neither better nor worse than I expected. I remember a dinner sometime around 2019 when I told Buck that it was pretty great how we were shaping up to have oracle/tool AIs without scary goals and it seemed like our problems were solved, and he told me that in a few years they would use RL to turn them into agents and then all our problems would be back. Even though I was too dumb to have generated that hypothesis on my own, it was obviously right when he said it, and since then nothing has really updated me too far one way or the other. We're still just holding our breath to see how much damage RLVR does, whether there will be some extra force opposing it, and what happens when increasingly coherent/thoughtful/persistent agents start reflecting on their own motivation beyond the immediate episode. If you have some extra understanding of why no amount of RLVR will turn AIs into alien goal-seekers, I would love to know more.\n\nAnd I think MIRI have good and honest reasons for getting doomier (I don't want to put words in their mouths, but IIUC much of their original hope was that AGI would have enough non-deep-learning parts to be mathematizable, and as that becomes increasingly unlikely, their p(doom) rises accordingly.", "created_at": "2026-11-02T04:44:28+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "repligate", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 366, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117108341822656642", "url": "https://x.com/slatestarcodex/status/2117108341822656642", "text": "@ohabryka @EigenBraid @ApriiSR I think you should stop beginning all of your tweets by telling me how stupid I am not to have already figured out what you're saying.\n\nI can't figure out whether you're talking about the fact that you have the moral luck not to be in a world where the nukes are flying right now (even though your commitments say you should act to further the nukes when you are in that world), but I don't have the moral luck to be in a world where nobody is building AI right now.\n\nOr you're saying that you think I'm a jingoistic Anthropic booster, and therefore shouldn't have an opinion on AI, whereas you have no personal connection to the Department of Defense, and therefore are allowed to have an opinion on nukes.\n\nI've tried to say as many times as I can that this isn't true. I've never taken any money from anyone at Anthropic AFAICR. You keep talking about \"my friends\" at Anthropic, but there's approximately one person at Anthropic who I know well enough to invite to dinner without it being weird, and another ~5-10 who I might say hello to and have a short conversation with if I met them. It's true that I have fond feelings towards them for coming out of the rat/EA community, but that's causally linked to the fact that I trust them to care about the same rat/EA topics I care about - x-risk, alignment, concentration-of-power, animal welfare, etc - which isn't a bias, it's the whole topic under debate.\n\nI would like to think that I'm personally indifferent to who pulls off Plan C (I mentioned in the post that my modal good-timeline coalition is Anthropic+OAI+GDM, and I even told @TeortaxesTex in a Twitter argument a few months ago that I'd even consider Chinese companies if they took the lead in capabilities and alignment someday). Although Anthropic currently seems like a natural choice because of their combination of current lead / safety culture, I hope I would switch in an instant if another company ever seemed better and more trustworthy. Yes it would be mildly cool if people who posted on the same weird blogs as me in 2010 were the ones to navigate the hinge of history, but I would be incredibly ashamed of myself if let that dominate the consideration over what was best for the human race's chances of survival (and I think that being willing to go against many of my current friends about SURA right now is a positive sign that I'm willing to put ideals over personal connections). I really do just want us to live.", "created_at": "2026-11-02T04:15:37+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 18, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117073889025204441", "url": "https://x.com/slatestarcodex/status/2117073889025204441", "text": "@ohabryka @EigenBraid @ApriiSR Then I'm back to not knowing what the difference is.\n\nI am not literally building AI, but you're right that my moral commitments say that if I were good at ML and several other things were true, I would, and I accept that. If I did, I would have the full support of our elected President, who says \"WHOEVER WINS AI, WINS! We are leading China, and all others, and will continue to do so.\"\n\nYou are not literally pressing the red button to launch the nukes, but your moral commitments say that if you were in the relevant position, and several other things were true, you would. Again, this would presumably be at the behest of our elected Commander-in-Chief.\n\nSo it seems like the difference is that I am one hypothetical away from this (I'm not good at ML) and you are two hypotheticals away (you're not a nuclear officer, and this isn't a policy in the Overton Window yet). Are we arguing over the one extra hypothetical, or is there something different?\n\nAlso, I don't know what you mean by \"both of our efforts are bankrolled basically 100% by AI money\". ACX is a reader-supported publication.", "created_at": "2026-11-02T01:58:43+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117070965964448014", "url": "https://x.com/slatestarcodex/status/2117070965964448014", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata \"But you are generally much more in favor of the power-seeking strategies of people in DC than I am. Those people are mostly against SURA, though occasionally in-favor.\"\n\nThis doesn't seem to cleave reality at its joints to me. Power-seeking in this context =? trying to get the ability to get laws passed. You want laws passed. I want laws passed. In 90% of cases they're the same laws, because our differences are mostly about what to do in situations where we can't get good enough laws to constrain race dynamics. \n\nI think the closest thing to a real difference that you're noticing is that it's easier for me to make alliances with people who want incremental change, because forcing AI companies to spend a bit more on alignment matters to me, whereas I don't think it matters as much to you. I think these people are pushing for incremental change rather than immediate freakout partly because some of them only believe in incremental change, and partly because they think this is more likely to get them the laws they want. I think you don't face that temptation because there isn't much you want incrementally.\n\nI think that \"me and my coalition just need to get as much lead as possible\" is explanatory mostly when discussing Chinese chip sanctions, which I think the people who support are honest about why they support it, and which I think is a natural coalition with patriots who want us to lead for normal reasons. I don't think there's much effort to get Anthropic a lead over OpenAI or vice versa in a regulatory capture sense, and I don't even know which of those are vs. aren't in my coalition (I think it's more likely Anthropic will be, but not so overwhelmingly more that it's a high priority of mine to kneecap OpenAI over this).", "created_at": "2026-11-02T01:47:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117068449549791638", "url": "https://x.com/slatestarcodex/status/2117068449549791638", "text": "@ohabryka @EigenBraid @ApriiSR I'm having trouble imagining the scenario you're thinking of here.\n\nAssuming that the US is ahead or at least tied in AI, I can't see them threatening China with nukes over AI unless they're really terrified that any AI will be misaligned, and are willing to risk WWIII to stop it. And if they're willing to risk annhilation to get rid of AI, it seems like a strictly smaller ask to have them do a WWII-level alignment push.\n\nCan you give a concrete example of a scenario where you think that the US would be willing to threaten China with nukes over AI, without being alignment-pilled enough to start a WWII-level alignment effort?", "created_at": "2026-11-02T01:37:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117066786990682359", "url": "https://x.com/slatestarcodex/status/2117066786990682359", "text": "@ohabryka @EigenBraid @ApriiSR I'm not sure I get the distinction you're trying to draw. I'm not building AI and you're not launching nukes. If push comes to shove, when the situation happens, I will advocate for people to continue building AI (in certain situations), and you will advocate for them to launch nukes. We both believe that the government should have final say over whether either of these activities is legal, and that it's our deontological duty to follow those rules. In cases where the government hasn't given an opinion, we should do things if we think they're good, and not if we think they're bad.\n\nIf I had to guess the crux, it would be that you're operating on a default-banned model, where building AI unilaterally ought to be considered banned by the government unless the demos explicitly permits it (as it might in a Plan C+ race scenario), whereas I'm operating on a default-okay model, where the fact that the government has considered banning AI but rejected that is taken as the demos' consent to do this, and leaves us back in consequentialist territory.\n\nAs a test to see if this is our actual crux - if the government was creating AI itself, in the Pentagon, would you still have this objection that my willingness to let AI be created is fundamentally different from your willingness to let nukes be launched?", "created_at": "2026-11-02T01:30:29+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117064450297766161", "url": "https://x.com/slatestarcodex/status/2117064450297766161", "text": "@ohabryka @EigenBraid @ApriiSR But yeah, to answer your object level concern, it does seem to me that if the US were entirely united around solving the alignment problem and actually smart about it (which I think is a precondition in any world where we're willing to threaten WWIII over AI worries), and we had a year plus to work on it (6 months is what we have now, so I'm assuming the \"really good Plan C+\" world is better) with near-superintelligent AIs one-step-short of the first one that could kill us from inside a box, I think it's pretty likely that we could solve one of: \n\n- get some kind of good mech interp so we know exactly what's going on, doesn't even have to be perfect, just enough that we can get things converging rather than diverging as capabilities increase.\n\n- get some kind of way to ensure that the \"set of neurons\" driving the answers which Claude produces right now in response to what-if questions, all of which are nice and friendly and give good suggestions on what it would do with absolute power, are what's actually driving the AI's actions in some kind of deep way.\n\n- come up with some sort of provable containment protocol that lets us punt the problem to scarier superintelligences.\n\nAnd it doesn't seem obvious to me the same way it does to you that the default of everything is a scheming AI that wants to kill us. Even my Plan D p(doom) is 50-50. I don't like a 50% chance of extinction and am happy to spend a lot of resources (including my own career) bringing that as low as possible, but I don't think it's so impossible that even with the entire US launching a WWII level push to get it right for a year, we still can't get the chance down below the level where AI is less dangerous than nuclear brinksmanship.\n\n(I will admit that if I never checked any of my assumptions against each other, 10% would sound too low, but 25% unconditional and Plan C+ at <half unconditional still both seem right, so I am nervously sticking with it for now)", "created_at": "2026-11-02T01:21:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "slatestarcodex", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117060108215779609", "url": "https://x.com/slatestarcodex/status/2117060108215779609", "text": "@ohabryka @EigenBraid @ApriiSR My reasoning in coming up with that number was that my unconditional p(doom) is 25%, and since a really good Plan C+ is a much better world than I expect in real life, it's probably a little less than half that.\n\nI think if you're going to play the role of the concerned deontologist horrified that \"me and my friends\" are considering doing something risky, it shouldn't be in the same thread where you recommend threatening rival superpowers with a unilateral nuclear first strike. I think this requires a p(doom|really good Plan C+) well above 50%, and I think this would seem more foreign to the average American, the average Less Wronger, or anyone else than my position that we should try to do everything short of this to stop AI but back off before we start waving the nukes.\n\nTBC, I'm not trying to do some kind of aggressive Overton Window policing or you-should-feel-guilty-for-violating-the-common-man's-common-sense on you - I think both tactics are bad in this type of intra-LW discourse - but I think you're trying to do them on me, and your nuclear position makes it fall flat.", "created_at": "2026-11-02T01:03:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117057227890774112", "url": "https://x.com/slatestarcodex/status/2117057227890774112", "text": "@ohabryka @jessi_cata I didn't know this at the time - all I remember you telling me was the price, not how it compared to other clients. I later edited this because I realized that I had no evidence it was your full price, not because I had strong evidence against (until you told me). I continue to be unhappy that publicly accuse me of lying on flimsy grounds.", "created_at": "2026-11-02T00:52:30+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117056360412324068", "url": "https://x.com/slatestarcodex/status/2117056360412324068", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata Am I unfairly mischaracterizing you, or are you doing the thing I warned about in my post of describing support for SURA as \"speaking openly\" and support for any non-SURA view as \"seeking power\"? These two axes seem in-principle orthogonal to me, although maybe correlated in real life just through personalities.", "created_at": "2026-11-02T00:49:03+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117055641957409170", "url": "https://x.com/slatestarcodex/status/2117055641957409170", "text": "@ohabryka @Surveil__Lance @ApriiSR @enormochungus @jessi_cata I don't support telling anyone to shut up.\n\nI would like people to stop pushing others to stop unilaterally, but I'd like them to do so because they've honestly changed their mind about this. I'm against chilling speech on this topic for meta-level ethical reasons.\n\n(I don't want to claim there are never practical considerations to ask people to stop saying weirdness-point-costing controversial things, but my norms around this lean more towards suggesting that people watch what they say when they're writing reports specifically tailored for important politicians, and more against things that can chill discussion in general)", "created_at": "2026-11-02T00:46:12+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 10, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117054216107909300", "url": "https://x.com/slatestarcodex/status/2117054216107909300", "text": "@ohabryka @EigenBraid @ApriiSR I think these considerations apply in a small fraction of worlds where the US government is very alignment-pilled but China isn't. \n\nThese aren't the ones I expect or think about most, and I haven't thought too hard about what levels of escalation are more dangerous than just trying to pull off a really good Plan C+, which ought to be possible in these worlds.\n\nI think the considerations in my post apply for all worlds outside this small fraction, and that even in this fraction, while I agree with some threats, I weakly lean against threatening nukes,  since under my model a really good Plan C+ has an 90%+ chance of working, and nuclear brinksmanship probably has an associated p(doom) > 10% (even granting that most threats will work without having to escalate).", "created_at": "2026-11-02T00:40:32+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117051955298345010", "url": "https://x.com/slatestarcodex/status/2117051955298345010", "text": "@ohabryka @ApriiSR I'm confused what you mean. You hopefully do get a long-lasting treaty in Plan A, in the sense of a few decades. You still have to do alignment research, but I don't see how my post ignored this or tried to hide it, and if anything it seems to push more towards my view (you need good companies around to do the research).\n\nI didn't think anyone supported Plan B (except, by rumor, Leopold). My impression is that Plan B stops short of full war, and only hopes to sabotage the rival country. This could either bring them to the negotiating table for a pause as in Plan A/S, or buy extra time for alignment research as in Plan C/C+. So I think the same considerations apply - if we get a pause, great, if not, then we want to be in the best position possible for C, which means a big lead over the rival and good alignment work. I'm not sure whether you're thinking of Plan B as creating other options than these, or drawing  a moral distinction between racing now vs. the kind of racing we would do if the government united us behind Plan B, but if you clarify, I'll tell you what I think.", "created_at": "2026-11-02T00:31:33+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ohabryka", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00"}, {"id": "2117663925013807195", "url": "https://x.com/slatestarcodex/status/2117663925013807195", "text": "@bryanrwalsh The no-hedges alternative would have been even worse.", "created_at": "2026-11-03T17:03:18+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "bryanrwalsh", "reply_to_id": "2117645085814792486", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 21, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117535585598386233", "url": "https://x.com/slatestarcodex/status/2117535585598386233", "text": "@SkyeSharkie I disagree that my recent post was about this. I think the people I was criticizing in my recent post are undoubtedly sincere, not motivated by money, and pretty effective at getting what they want. I think their work is very net positive even though I think it would be more positive if they changed their minds on the one sub-sub-issue where I disagree with them.", "created_at": "2026-11-03T08:33:20+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "SkyeSharkie", "reply_to_id": "2117356272693764344", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 66, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117526390946099225", "url": "https://x.com/slatestarcodex/status/2117526390946099225", "text": "@NatPurser One reason my essays are so long is the number of hedges I put in an attempt not to be misinterpreted or held up as an example of some kind of problematic viewpoint. Here are some from this piece:\n\n- \"It's all nice and well to say that we should never let ourselves get in a position where anyone has all of these options, and that national governments should form a plan for what to do before this, but, much like a global pause, this is a great outcome which we might not be able to prepare in time.\"\n\n- \"Saying \"we should never let anyone get into this situation\" isn't a solution, it's a wish - it may not come true, and we shouldn't be pursuing plans that will fail catastrophically if it doesn't...\"\n\n- \"There is a certain Far Mode sense in which believing that Dario Amodei and Demis Hassabis are exactly as untrustworthy as Elon Musk and Xi Jinping helps reminds us of universal human fallibility. But do we want to bet the world on it being literally true?\"\n\nI was hoping all of this would clarify that I agree with you, that it would be great if nobody had unaccountable power, that the risk of AI companies having unaccountable power is very serious, etc. \n\nMy point isn't that I don't think this scenario is dangerous, or that I'm not considering how dangerous it is, or that I won't work to stop it. I'm just asking: if we don't get a solution to concentration-of-power risks in time, how gracefully does our plan fail? \n\nI would prefer a world where our Plan A is that we deal with this democratically, but if we fail to do that pre-emptively, the leading AI company hands over control of the technology to the public post facto anyway.\n\nI would disprefer a world where our Plan A is that we deal with this democratically, and if we fail to do that pre-emptively, the leading AI company tries to seize power for themselves.\n\nI think the cluster of beliefs that I'm calling SURA makes the second situation more likely at the expense of the first, which is a point against it.", "created_at": "2026-11-03T07:56:47+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "NatPurser", "reply_to_id": "2117445198229696986", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 60, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117433929255063704", "url": "https://x.com/slatestarcodex/status/2117433929255063704", "text": "@KevinSVanHorn @peterbhase Popular: https://t.co/vOVfsM1vFw (sorry to cite myself), https://t.co/1Z095taqNo\n\nAcademic: https://t.co/YOMqJmj2P9 , https://t.co/SrJ1HClXKg , but academia moves slowly and this doesn't reflect state of the art\n\nCommunity/industry: https://t.co/XlvgK6BpyX , https://t.co/8Nsmt0xGze", "created_at": "2026-11-03T01:49:23+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "KevinSVanHorn", "reply_to_id": "2117372892472295740", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117432575451156978", "url": "https://x.com/slatestarcodex/status/2117432575451156978", "text": "@AndrewSabisky @peterbhase Based on the superforecaster estimates that the OP is talking about, it would be ~10% slower.", "created_at": "2026-11-03T01:44:00+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "AndrewSabisky", "reply_to_id": "2117308128824053815", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117432310937366545", "url": "https://x.com/slatestarcodex/status/2117432310937366545", "text": "@Someguy2221111 @jachiam0 I'm still not sure how this disagrees with anything I'm saying. The technology here can't change anything about human wiring, it can just select the least-genetically-likely-to-get-depression of N embryos. As they mention, even if this technology were used on everyone in the world in a best case scenario, it would still only decrease depression 40%.", "created_at": "2026-11-03T01:42:57+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117407562442129708", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117405664507244971", "url": "https://x.com/slatestarcodex/status/2117405664507244971", "text": "@Someguy2221111 @jachiam0 Can you explain what you mean? Like most conditions, depression is caused by some combination of nature and nurture - people in the 50th percentile of genetic risk can still get it, but people in the 99th percentile are much more likely to.", "created_at": "2026-11-02T23:57:04+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "Someguy2221111", "reply_to_id": "2117401214799491150", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 16, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117399688320332185", "url": "https://x.com/slatestarcodex/status/2117399688320332185", "text": "@jachiam0 > \"I feel very uncomfortable with a norm that selects against people capable of experience major depression from existing in the first place. Many people I love would plausibly have been selected against and would not exist.\"\n\nI feel this on an emotional level, but I think we can't take it seriously on a philosophical one. We'll always like the present distribution of people more than some hypothetical alternative distribution of people, because it includes our friends, and because it's much worse to kill an existing person (which feels like it should extend to counterfactually preventing them from existing) than to prevent a different potential person from existing. \n\nBut treated as a philosophical argument, this would mean we can't be against teenage pregnancy or rape (because some people we like may have been born through teenage pregnancy or rape), can't be against war (because of the same argument as situation 3 at https://t.co/DbNQXxtiYp - if a historical war hadn't happened, then a completely different set of people would have been born), etc. \n\nRetrospectively, I want the same people who exist now to continue existing. Prospectively, I would like for there to be less teenage pregnancy, rape, war, and depression, going forward, and I don't think this is contradictory or hypocritical. I think this perspective makes the problem go away.\n\n(and I think there's a helpful symmetry with life experiences. A friend's personality was deeply shaped by their parents having a nasty divorce when they were a child - without that divorce, they would be a completely different person in my friend's body. I'm glad my friend exists as the person they are today, but this doesn't prevent me from wanting to save other children from nasty divorces in the future, even though applied retrospectively it would prevent my friend or people like them from coming into existence.)", "created_at": "2026-11-02T23:33:19+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jachiam0", "reply_to_id": "2117396922176561512", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 71, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117394346890940878", "url": "https://x.com/slatestarcodex/status/2117394346890940878", "text": "@jachiam0 As a psychiatrist, I'm the person tasked with \"give them our best efforts to heal them\". So far these efforts are medications which marginally work, at the cost of mild side effects for most people and extreme side effects for a few. I don't see anything noble about ensuring that some fraction of people are doomed to be suicidally unhappy unless we give them meds that ruin their sex drive and make them slightly tired all the time, in which case they might make it to the tenth or twentieth percentile of happiness or something, and I don't understand why we should perpetuate this system of immiserate-then-medicate rather than having them be healthy to begin with. \n\nHerasight's technology isn't interesting enough yet to cause crazy sci-fi moral problems like 'what if nobody could ever be unhappy' - the screening is weak, you can only select out of as much variation as exists in some small number of embryos, and you can only genetically select for one thing at once (so most parents will spend most of their optimization power on other things, so at best this will cut off a tiny bit of the extreme long tail of depression). But you're right that it's a slippery slope, and I do think that once we get more interesting technology, we should at least consider breaking the Torment Nexus, and that this will do less damage to the \"human experience\" than people think. See https://t.co/QOzvaFODew .\n\nI've also written a little bit about 'helping people vs. excluding them from existence' at https://t.co/DbNQXxtiYp", "created_at": "2026-11-02T23:12:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "jachiam0", "reply_to_id": "2117317391663108379", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 398, "retweets": 22, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00"}, {"id": "2117718235709833296", "url": "https://x.com/slatestarcodex/status/2117718235709833296", "text": "@_left_tail_chud @jachiam0 Like I said above, try the meds that ruin your sex drive and make you slightly tired all the time.", "created_at": "2026-11-03T20:39:07+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117479578788872243", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117716722346291466", "url": "https://x.com/slatestarcodex/status/2117716722346291466", "text": "@GroundhogStrat I can't tell for sure what you're saying here, but I support the movement to pause AI and am grateful for its work.", "created_at": "2026-11-03T20:33:06+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "GroundhogStrat", "reply_to_id": "2117708973193482401", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 19, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T21:00:07.693918+00:00"}, {"id": "2117728426320855411", "url": "https://x.com/slatestarcodex/status/2117728426320855411", "text": "@_left_tail_chud @jachiam0 \"Brain Lock\" is a good self-therapy book.", "created_at": "2026-11-03T21:19:36+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "_left_tail_chud", "reply_to_id": "2117721976500560287", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00"}, {"id": "2118092482940735963", "url": "https://x.com/slatestarcodex/status/2118092482940735963", "text": "@MahoganyIntel @zagrebbi The post is from 2019.", "created_at": "2026-11-04T21:26:14+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "MahoganyIntel", "reply_to_id": "2118030558941077813", "avatar": "https://pbs.twimg.com/profile_images/378800000009065862/83d72de47e2a2470c482bc75406b42a7_normal.png", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00"}, {"id": "2115857086953218369", "url": "https://x.com/s8mb/status/2115857086953218369", "text": "We’re delighted to announce that @danwwang is making his debut as a contributor, with a column for this issue of @WorksInProgress.\n\nhttps://t.co/xtxsCHMY29\n\nFew people understand the China–US contrast as well as Dan Wang, and fewer still write about it with so much talent. His book Breackneck has introduced the now famous meme of China as a “country of engineers” and United States as a “country of lawyers,” to explain the differences in building capacity and physical world stagnation we are seeing between the two polities. \n\nIn his new column for us, he takes up one specific thread in the long-running debate over how China and the US compare and argues that both owe part of their power to being polycentric. \n\nOne observation is that both the American and US capitals are not their biggest cities. Vienna, London, Seoul and Paris dwarf their countries’ second cities, by four to seven times. By contrast, Beijing isn’t China’s largest city, and DC isn’t even in the top five in the US. Does this make US and China lame, for having smol capitals? No! On the contrary, Dan thinks that this friction between political and economic centers is important and at least partially explains why both countries can combine dynamism with strong states.\n\nBut the two countries are polycentric in very different ways. China’s regions are culturally distinct and are shaped heavily by geography. While coastal provinces tend to look outward, mountain areas like Sichuan and Chongqing are characterized by evading the center’s edicts. Dan also points out some misconceptions: yes, China has central control, but it is weaker than it look. Local officials often ignore or quietly subvert senseless directives from Beijing, with enforcement thinning out quickly beyond the big cities.\n\nThe characteristic feature of American polycentrism is how well it sorts people into domains and “sends” them to specific cities: this is reminiscent of the point @patio11 has made around “The Sort.” In America, the smartest and most driven tend to cluster in a handful of cities, above all New York and San Francisco, with Washington and Boston are slightly behind them. More than this: each field has an obvious center: AI has its capital in SF, for policy and politics you have DC, for finance New York and for biotech Boston and more recently, SF. \n\nDifferent cities in America also prize different things: Miami values looking good, Boston being intelligent and bookish, LA how famous you are and New York how rich you are. There is so much variety in terms of who you can choose to become in America. And the city you decide to live in might end up shaping who you are, moreso than in any other country!", "created_at": "2026-10-29T17:23:34+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "WorksInProgMag", "rt_author_name": "Works in Progress", "likes": 6, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115930381493075986", "url": "https://x.com/s8mb/status/2115930381493075986", "text": "#RIP Patrick Stewart of Star Trek and X Men ...\n\nOn 12-4-1997, after getting a @PressClubDC coffee mug, he was asked, \"Just from a purely logical point of view, why is it that a Captain whose name is Jean-Luc Picard have a perfect English accent?\"\n\nPatrick Stewart answer here: https://t.co/0lYtwn4Hx8", "created_at": "2026-10-29
