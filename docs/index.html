v 21 01:01:01 +0000 2026"}, {"id": "2123944739867385877", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "7. To be clear, the latest data from OpenAI does suggest* that AI tasks lengths are growing exponentially, but at a slower rate from a much lower base than expected. \n\n[* - We can't rule out linear or sub-linear fits, though exponential is stronger.] https://t.co/Exqxrl9Top", "links": {"https://t.co/Exqxrl9Top": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-aF5agAAOJw4.jpg"}], "url": "https://x.com/ramez/status/2123944739867385877", "created_at": "Sat Nov 21 01:01:01 +0000 2026"}, {"id": "2123944742551683330", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "8. In addition, task lengths are growing more slowly at higher reliability levels than lower, and by a wider margin than expected. Forecasts over-estimate AI task length by ~24x at 50% reliability. But by ~36x at 80% reliability. https://t.co/7YKvJgE3Am", "links": {"https://t.co/7YKvJgE3Am": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm-0j-bMAA8B2t.jpg"}], "url": "https://x.com/ramez/status/2123944742551683330", "created_at": "Sat Nov 21 01:01:02 +0000 2026"}, {"id": "2123944745265447157", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "9. For fully autonomous RSI, AI will need to hit extremely high levels of task success, perhaps over 99%. We don't know what tasks AI can accomplish at those levels. We can try to use logistic and log-linear fits to guess. https://t.co/5TWeGEgKrN", "links": {"https://t.co/5TWeGEgKrN": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_kB3aQAACkQ7.jpg"}], "url": "https://x.com/ramez/status/2123944745265447157", "created_at": "Sat Nov 21 01:01:02 +0000 2026"}, {"id": "2123944747622686897", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "10. These projected task lengths that AI can accomplish with very high levels of success are in the range of seconds to a small number of minutes. But again this is extrapolation. https://t.co/L6f0qkMEP3", "links": {"https://t.co/L6f0qkMEP3": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_uQGasAARL8D.jpg"}], "url": "https://x.com/ramez/status/2123944747622686897", "created_at": "Sat Nov 21 01:01:03 +0000 2026"}, {"id": "2123944750239945167", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "11. When would we expect AI to be able to accomplish 98% of tasks that take humans hours? At this pace, not for another decade. Again, this is extrapolation. We need better data. https://t.co/eEFrb3WqXr", "links": {"https://t.co/eEFrb3WqXr": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXm_9ufa4AESGP7.jpg"}], "url": "https://x.com/ramez/status/2123944750239945167", "created_at": "Sat Nov 21 01:01:04 +0000 2026"}, {"id": "2123944752722944422", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "12. Using the OpenAI data we can also test the strength of the RSI feedback loop by asking how much productivity does every point of ECI bring? @testingham et al found a self-sustaining threshold at 15% per point. https://t.co/qLjxrp9Vh1", "links": {"https://t.co/qLjxrp9Vh1": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnALLPbcAAfnBL.jpg"}], "url": "https://x.com/ramez/status/2123944752722944422", "created_at": "Sat Nov 21 01:01:04 +0000 2026"}, {"id": "2123944755180757336", "author_handle": "ramez", "author_name": "Ramez Naam", "text": "13. Using this data,  adjusting for token spend, we see OpenAI experiment pace rising by ~3.6% per ECI point, still short of the self-sustaining RSI threshold. [Thanks to @TomDavidsonX &amp; @YafahEdelman for improvements to my previous modeling here.] https://t.co/kz55HvejtQ", "links": {"https://t.co/kz55HvejtQ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXnAaILaIAAl_du.jpg"}], "url": "https://x.com/ramez/status/2123944755180757336", "created_at": "Sat Nov 21 01:01:05 +0000 2026"}], "enriched": 3}, {"id": "2124155087920505132", "url": "https://x.com/random_walker/status/2124155087920505132", "text": "\"There are two different improvement loops that have been conflated, and they will come apart. The efficiency improvement loop will accelerate, but a broader improvement loop... will require ever-increasing amounts of compute, talent, data, and real-world feedback.\"", "created_at": "2026-11-21T14:56:52+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "binarybits", "rt_author_name": "Timothy B. Lee", "rt_avatar": "https://pbs.twimg.com/profile_images/2069067922564435968/u8U3FKQE_normal.jpg", "rt_id": "2124147233725862238", "likes": 15, "retweets": 1, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T17:57:47.516124+00:00", "enriched": 3}, {"id": "2124474824135258605", "url": "https://x.com/random_walker/status/2124474824135258605", "text": "Perhaps a good time to mention that my Tanner lectures on AI, with responses from @random_walker, Josh Cohen, Marion Fourcade and Renée Jorgensen and my reply are now out open access with Oxford University Press. So you can read about Power, Justice, and AI from a perspective that does *not* deny AI capabilities at your leisure: https://t.co/ZNjJKIf9wq", "created_at": "2026-11-22T12:07:23+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sethlazar", "rt_author_name": "Seth Lazar", "rt_avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "rt_id": "2124395156317282454", "likes": 65, "retweets": 14, "media": [], "links": {"https://t.co/ZNjJKIf9wq": "https://academic.oup.com/book/63611"}, "quoted": null, "fetched_at": "2026-11-22T18:30:31.988254+00:00", "enriched": 3}, {"id": "2124886263643754498", "url": "https://x.com/random_walker/status/2124886263643754498", "text": "Rapid AI progress has many people imagining a world where general-purpose AI models autonomously control military drones at scale. But there’s little analysis on what this would look like in practice, and how soon it might be feasible.\n\nMy latest paper at @GovAIOrg  asks what it would take to make this vision a reality, and what the path there means for AI policy.\n\nRead it here: https://t.co/eiTWhtRHRQ\n\nThe AI-enabled drones widely fielded today use narrow AI, not general-purpose models like LLMs. AI is typically only used to handle limited portions of a flight when the link to a pilot is broken, and these models are brittle in unpredictable conditions on real-world battlefields. Because of this, today’s drones still require significant pilot involvement to be most effective.\n\nGeneral-purpose AI models might make it possible to field autonomous systems that can receive plain language commands and make complex decisions in unpredictable environments without human control. Many people see frontier LLMs as a path toward this end - and rapid progress in robotics capabilities by frontier models like GPT-6 Astra and most recently Claude Fable 5.2 supports this case.\n\nBut two things currently stand in the way:\n\n- The biggest and most powerful models are still not capable enough even in controlled environments without compute and latency constraints\n- Military drones will have to operate “on the edge” in contested environments without consistent cloud compute access - which makes these constraints even more severe\n\nIf and when general-purpose AI plays a major role in drone autonomy, it’ll likely be through models that are far smaller than today’s frontier, and those that militaries can rapidly modify. And, notably - when it comes to these types of small open-weight models, China currently dominates.\n\nThis has a variety of implications for the US military, frontier AI developers, and US policymakers.\n\nThread below with my key takeaways and recommendations.\n\n1/", "created_at": "2026-11-23T15:22:18+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "rt_avatar": "https://pbs.twimg.com/profile_images/2081975769694089216/8FRftf82_normal.jpg", "rt_id": "2120902215254655195", "likes": 66, "retweets": 16, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7mL5IXEAAr0QB.png"}], "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments", "https://t.co/4jNTAfTZJE": ""}, "quoted": null, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "thread": [{"id": "2120902217980858487", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 1: There are two broad approaches militaries can take to drone autonomy.\n\nAutonomy is attractive to militaries because it would allow them to field systems at an otherwise impossible scale, and to maintain combat power in environments that are contested in ways that make it difficult for human operators to have continuous control of unmanned systems.\n\nThey could achieve autonomy through:\n\n1. AI models running onboard the drones themselves\n2. AI models running from a command and control node, orchestrating drones with offboard compute\n\nMany tradeoffs exist between these options, which I've broken down in the below two tables. An orchestrator allows access to more compute, and bigger, more capable models. But it makes drones dependent on unreliable communications links that can be disrupted by adversaries in a variety of ways.\n\nRunning AI onboard drones, meanwhile, eliminates many of these vulnerabilities, but limits the size and capabilities of the model that can be fielded. And it might give militaries less ability to intervene in the actions of those drones. \n\n2/", "links": {"https://t.co/ZSeKwRQ9pH": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7ms_xX0AAp3Mx.png"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HW7nELmWoAAVHvj.png"}], "url": "https://x.com/JakeASteckler/status/2120902217980858487", "created_at": "Thu Nov 12 15:31:07 +0000 2026"}, {"id": "2120902220753289480", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 2: Today’s LLMs aren't yet good enough for most drone tasks, and they're far too slow.\n\nFor autonomous attack drones to perform reliably on the battlefield, they’d have to do a variety of things that require a combination of low- and high-level reasoning. They’d have to avoid obstacles, track targets, verify that those targets meet mission criteria, and do a variety of planning tasks like changing a mission when unexpected conditions arise.\n\nFrontier LLMs can't yet reliably accomplish these tasks, and even with ample compute from data centers, they're are much too slow for anything except the most time permissive tasks, such as planning, as you can see in the chart below.\n\nMuch smaller LLMs, when run with less-powerful onboard compute, are still too slow. Many tasks like flight control and obstacle avoidance would likely be passed to lower-level controllers using more traditional robotics policies, but if general-purpose AI models are involved, they’ll likely be a rate limiter regardless.\n\nVision-language-action (VLA) models offer another possible approach beyond LLMs, and they can currently run much faster than LLMs. But these models have also not yet shown the requisite capabilities (especially in real-world conditions), and they are still not quite fast enough for the most time constrained tasks.\n\n3/", "links": {"https://t.co/to7F7cCzAB": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7sIxHWQAAkqKD.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902220753289480", "created_at": "Thu Nov 12 15:31:08 +0000 2026"}, {"id": "2120902223613857886", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 3: The biggest and best models are far too big to be run on the edge, either with onboard compute or from a small command and control node.\n\nFrontier LLMs have memory requirements* that could only be met with multiple GPU servers. Supporting them would be resource-intensive for military units to move and operate, and they'd likely be easy for enemies to geolocate – and therefore not ideal for military units operating near or on the frontlines.\n\nSmaller models can fit on a variety of edge chips that various sized platforms could run (from laptops to large, medium, and small drones, depending on model size). These models would likely be less capable, however.\n\nVLAs are much smaller, which makes them promising candidates for onboard use. But again, they have not yet proven reliable and robust enough for real missions.\n\nSee the chart below for a breakdown in memory requirements and where models could fit. \n\n*Note the sizes for closed models are based on unconfirmed estimates of their parameter counts, since these numbers are not made public. This analysis is just meant to show a general range of how big these models might be, not to serve as precise estimates of how much memory they demand. \n\n4/", "links": {"https://t.co/vL5N2FMExc": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7s4MUXMAANMF4.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902223613857886", "created_at": "Thu Nov 12 15:31:09 +0000 2026"}, {"id": "2120902226939875614", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 4: If trends in model efficiency hold, we could fit models as capable as today’s frontier LLMs onboard large and small drones in as little as 1 to 3 years.\n\nThe model size needed to reach a given level of capability has generally halved every 3.5 months. If this trend in “model efficiency” continues, models with roughly equivalent capabilities as GPT-6 Astra and Kimi K3.1 Pro could fit on chips that can be powered onboard small and large drones between late 2027 and mid 2029.\n\nHowever, this only tells us when these models would fit. Whether or not these systems are usable on the battlefield still depends on capabilities progress and vast improvements in model latency.\n\nBecause we haven’t yet seen reliable and robust drone autonomy exhibited in any form, I’m simply using today’s frontier models as a proxy for the most capable models.\n\nIf it turns out that the first models to be capable enough are far larger than today’s frontier, then the time it takes for them to become available onboard drones would be further extended.\n\n5/", "links": {"https://t.co/eWxzITCv2l": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tJ_PXYAANerq.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902226939875614", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902229607502281", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Takeaway 5: If general-purpose AI drives progress in drone autonomy, smaller open-weight systems will likely be the relevant class of model. China currently leads the US in this field.\n\nOpen models are easier to work with for drone developers than closed systems: they can easily fine-tune them on military data, “abliterate” them to remove guardrails, etc. These models are also far easier to compress than closed models (and there are many small models to begin with), which makes them better suited for edge deployment. And they don't come with the same concerns of model weight theft. \n\nOn every platform I examined, from small drones to vehicle-mounted servers, the best open-weight LLM (in terms of general capabilities) that fits is Chinese – as depicted in the figure below. This means, unless something changes, the US military and drone developers are left to choose between adopting / building on Chinese models and using potentially inferior American systems.\n\nThis leads me to my recommendations:\n\n6/", "links": {"https://t.co/CDzwJtt1ZZ": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HW7tXl8XQAASs3t.jpg"}], "url": "https://x.com/JakeASteckler/status/2120902229607502281", "created_at": "Thu Nov 12 15:31:10 +0000 2026"}, {"id": "2120902231918612855", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 1: The US military should plan around current drone autonomy limitations, but prepare for possible rapid capability gains.\n\nDrone autonomy is not yet nearly good enough to make the hardest decisions that humans currently make, like distinguishing combatants from non-combatants. The most capable models are too big to run on the edge and too slow for fast-paced tasks.\n\nThe US military should plan accordingly by developing and maintaining a significant number of human drone operators for the foreseeable future.\n\nAt the same time, it should lay the groundwork for assessing and fielding more advanced systems. Since it’s still unclear what technical paradigm will deliver the most robust and reliable drone autonomy, the military should experiment with a variety of model types.\n\nAnd crucially, it should immediately prioritize the development of rigorous evaluations to test whether autonomous systems meet human decision-making standards under harsh real-world battlefield conditions, including under adversarial deception and degraded communications. These evaluations should also of course serve to assess the risks of misaligned AI in these contexts.\n\n7/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902231918612855", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902233722118611", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 2: Frontier AI developers should reconsider their role in the development of drone autonomy.\n\nThis one will surely be most controversial, but: US frontier AI companies should consider the implications of the current status quo in drone autonomy for the global military balance of power.\n\nDrones are proliferating worldwide, and the US and its adversaries are pushing toward greater autonomy, whether or not the frontier AI companies are directly involved. Many of their safety concerns are valid: frontier models certainly aren’t yet reliable enough for autonomous weapons, as Anthropic pointed out during its fight with the DoD. But those risks have to be weighed against the risks of standing aside as these technologies continue to improve and proliferate, often on the backs of their developments (through model distillation).\n\nA few initiatives they should consider:\n- Offering trusted access programs to vetted defense firms to use their coding tools for developing military autonomy models\n- Developing smaller models tailored for compute-constrained operations for military purchase, which the US military can fine-tune and modify.\n- Withholding their most drone- and robotics-relevant capabilities from public release in the future\n\nUnder the current status quo, Chinese firms distilling American models may be benefitting from frontier US developments more than US firms unwilling or unable to do the same. The US military is currently stuck with a choice between building with and on open-weight Chinese models (which comes with significant and unacceptable security risks) and using inferior American products.\n\nUS frontier AI companies are also likely better equipped, able, and predisposed to build the most reliable, robust, and safe drone autonomy for military use than other firms with fewer resources and talent. They are already indirectly involved in drone autonomy developments, and should consider ways to more directly and positively shape the direction of this technology - one that will likely be critical for national security for the foreseeable future.\n\n8/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902233722118611", "created_at": "Thu Nov 12 15:31:11 +0000 2026"}, {"id": "2120902235752157324", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Recommendation 3: Last, US policymakers should seek to secure an American lead in drone autonomy in two ways:\n\nFirst, they should support funding for general-purpose models that developers in the US military and defense industry can freely customize for defense applications. This could be funding for open-weight models to better compete with China, or proprietary models that only vetted defense developers can access and modify (as discussed above). They should also support funding for the DoD talent and resources needed to properly test these systems.\n\nSecond - export controls (surprise!). We should tighten export controls on the top chips used for developing frontier AI, because it’ll slow China’s developments in drone autonomy (which would then also slow these developments for other adversaries using Chinese open-weight models).\n\nWe should also improve enforcement of existing export controls on edge chips used for drone autonomy (namely Nvidia Jetsons) to sanctioned countries like Russia, which has circumvented these restrictions. And we should consider expanding controls over these chips to China, which also heavily uses Nvidia Jetsons for its drones and robotics applications.\n\n9/", "links": {}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902235752157324", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}, {"id": "2120902237572518246", "author_handle": "JakeASteckler", "author_name": "Jake Steckler", "text": "Everyone seems to care about autonomous drones. The Pentagon has requested record funding for them and is trying to rapidly field them at scale. AI safety researchers are worried they’ll make the world far more dangerous, either through bad actors or rogue AI controlling them.\n\nThese systems will likely play a major role in shaping global military power, and we need as much grounded analysis as possible to forecast how and when that might happen. That’s what I tried to do with this paper.\n\nMany more insights in the full paper, including a mapping of the landscape for the types of chips, models, and military platforms that might be used for drone autonomy.\n\nhttps://t.co/eiTWhtRHRQ\n\n/10", "links": {"https://t.co/eiTWhtRHRQ": "https://www.governance.ai/research-paper/general-purpose-ai-and-the-future-of-drone-autonomy-in-contested-environments"}, "media": [], "url": "https://x.com/JakeASteckler/status/2120902237572518246", "created_at": "Thu Nov 12 15:31:12 +0000 2026"}], "enriched": 3}, {"id": "2125207907780178151", "url": "https://x.com/random_walker/status/2125207907780178151", "text": "I learned a lot from this. AI can do a good job of producing the visible outputs of management consultants — research, slide decks, and financial models — and yet it is so far from replacing them. \nManagement consulting is not a thin wrapper on intelligence by @RodMoshtagi and @sayashk  https://t.co/8xIHVPNPxX", "created_at": "2026-11-24T12:40:24+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 173, "retweets": 22, "media": [], "links": {"https://t.co/8xIHVPNPxX": "https://www.normaltech.ai/p/management-consulting-is-not-a-thin"}, "quoted": null, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125637448382517400", "url": "https://x.com/random_walker/status/2125637448382517400", "text": "Here's where I agree with Pinker, where I'm middling, and where I disagree. Tl;dr: I like his institutionalist, anti-eschatological take on AI governance and risk culture, but disagree with his more dated, Chomsky-inflected skepticism of modern LLMs.\n\nAgree:\n\n- Claiming a 1-in-5 to 1-in-3 probability of human extinction is absurd. p(dooms) are a bad measure and should be shunned from the discourse, and 'superpersuasion' is mostly bogus.\n- That superforecasting comes with important limitations that people often gloss over.\n- Supporting prosaic measures to deal with safety/risks, e.g. liability, insurance, incident reporting etc. Rejecting capping size of training runs or slowing development across the board or a global pause.\n- That extinction rebellion/climate alarmism are a better metaphor than Scott's '1990s techno-optimists' story.\n- That intelligence cannot be reduced to a scalar, even if one can in fact identify a general factor of intelligence in humans.\n- That the X-Risk community tends to implicitly treat AI as a mysterious endogenous force with inherent drives. The obsession with “instrumental convergence” as a fundamental belief is highly questionable.\n- AGI/ASI is and will be a gradual progress - no sudden 'aha' moment, but looking back we will know.\n- Power over the world depends not just on brainpower but on social institutions and physical infrastructure.\n- How societies respond when automation misbehaves should be through trial and error + liability.\n- Compute thresholds are not a good way to regulate AI, and falling compute costs / fixed thresholds will ultimately capture too much of the market.\n- Safety culture is a highly homogenous set of people, with correlated beliefs, social and professional relationships. This comes with failure modes, and obsessing over saving the world can lead to important moral hazards and blind spots.\n- The bifurcation of EA between the healthcare/animal welfare/international development side, and the AI risk side. \n- The 'model welfare' side often makes strong claims and leaps that I do not think are supported. I agree with his skepticism of computational functionalism, the 'epistemic hall of mirrors' dynamic described, and the risks of combining certain forms of moral patienthood with longtermism.\n\nKinda:\n\n- A lot of the scenario writing side of the xRisk community is more fiction like than non-fiction; but they ultimately remain useful illustrations (to a degree).\n- The multiplicative chain of improbabilities & human resilience for doom. I do think doom is highly unlikely, but his account of the stacked probabilities treats the links as statistically independent - it's not clear that they are.\n- I agree that “superintelligence” is too often used in meaningless ways or synonymously to God (“omnipotence over every atom on the planet”); while I think of it more as a resource, I think you can/should also predict features of this world and timelines.\n- There are clearly important bottlenecks and the safety community often ignores them; but also better intelligence will likely also help accelerate how we address them. \n- I agree AI is more a product of Intelligent Design more than it is subject to natural selection and evolutionary pressures. 'It' does not 'compete' with human resources. But admittedly this doesn't fully engage with the many engineering challenges in steering/constraining models effectively.\n- I agree that “solving the alignment problem” is a bad frame and assumes a one off fix for a complex multi-layer problem. But he doesn't engage enough with failures of RL systems, reward hacking and so on. They're surmountable but not inconsequential. \n- I agree that AI-assisted bioterrorism is an important focus and addressing it mostly relates to controlling bottlenecks that are unrelated to models themselves. But this was a concern made salient by the xRisk community!\n- The AI safety advocacy community could learn from the history of doomerism. I agree that repeating the post-Chernobyl nuclear panic is an important risk, but the fact that large scale catastrophes were exaggerated in the past of course doesn't mean they should be dismissed entirely. \n- That journalists should stop quoting AI researchers on the effects of the technology on society. I think technologists are indeed poor at forecasting societal effects and adoption, but they are better at forecasting features of the technology itself (e.g. capabilities). So somewhere in between.\n- Some domains like forecasting and biology have hard physical or stochastic ceilings. I think this is true, and people are too quick to extrapolate from advanced in coding or maths; but I still think we'll make fast progress in other domains. \n\nDisagree:\n\n- His characterisations of inherent flaws of multimodal/language models (+ Chomsky-adjacent points). I think a lot of this feels like 'Rs in strawberry' type critiques. Many limitations are surmountable through better training and engineering. \n- Getting *too* bogged down on 'is it real reasoning or intelligence' type arguments; I think these do matter, but practically what matters are their capabilities and how they are deployed. \n- Quoting 2024 papers on claiming 'it is impossible to eliminate hallucination in LLMs' - this is a red herring but also a weird misunderstanding of how to interpret language model outputs. Retrieval, verification harnesses etc makes hallucinations a tractable engineering problem.\n- Cal Newport's claim that “Superintelligence is a fairy tale.” We already have superintelligence is narrow domains.\n- His insistence on downplaying LLMs as just one limited paradigm. Sure other approaches exist, but LLMs are working pretty well and will likely keep scaling (with diminishing returns).\n- Bengio's 'non-agentic AI system' as a viable or desirable alternative. This never made sense to me. \n- Quoting Ilya's 2024 \"there's only one internet\" line misses how models and harnesses have improved in recent years.", "created_at": "2026-11-25T17:07:14+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sebkrier", "rt_author_name": "Séb Krier", "rt_avatar": "https://pbs.twimg.com/profile_images/1992052427743272961/WJQ8uqql_normal.jpg", "rt_id": "2125588782053286283", "likes": 142, "retweets": 19, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125673018542407824", "url": "https://x.com/random_walker/status/2125673018542407824", "text": "Many discussions of AI’s economic impact assume that knowledge work is a “thin wrapper” on intelligence. In this view, the main job of a knowledge worker is to process information. Once AI can match the quality of expert responses in a domain, it should be able to take over most of the work in that domain.\n\nBut actually understanding how an industry creates value paints a very different picture. In a new essay, we conduct this analysis for management consulting. \n\nA summary of our arguments\n\n1. Apocalyptic predictions about consulting misunderstand what clients pay for.\n\nConsulting firms’ provide five different sources of value. Analysis is the most visible, but clients also pay for judgment, coordination, credibility, and accountability. AI has improved dramatically at analysis. But training AI to have judgment has proven harder. As AI capabilities improve, that might change.\n\nBut even if AI gets good at judgment, companies still need to persuade competing managers within the firm to agree on recommendations, especially when those recommendations negatively affect them. They need to give key decisions credibility with decision makers such as the board. And they need someone to answer for the results when things go wrong. Consulting firms provide the coordination, credibility, and accountability for all of these.\n\n2. Clients’ AI integration needs are creating demand for consulting.\n\nPast general-purpose technologies, such as business computing and the web, did not just make existing work cheaper. They changed the nature of what clients needed help with, and in the process, they created new work for outside experts, including consultants.\n\nEarly evidence shows that AI is doing the same. Realizing the benefits of AI requires organizational transformation, which is increasing the demand for consulting companies. Improvements in AI’s cybersecurity capabilities have also led to organizations taking cyber defense more seriously, and consulting firms are helping them strategize and implement defenses.\n\n3. For consulting firms to capture this demand, they need to change how they operate.\n\nOur analysis in the previous parts does not mean that today’s consulting firms are safe. Clients’ own teams will compete for some of the new demand that we predict will arise due to AI. AI companies are building deployment businesses of their own, even as they sign partnerships with consulting firms.\n\nFor consulting firms to successfully adapt to AI, they need to make changes to their operating model: building know-how that clients lack, developing in-house AI expertise and partnering with AI companies on deployment, and staying neutral across model providers.\n\n——\n\nMore broadly, one of our goals at @stabl_ai is to deeply understand how institutions can adapt to AI. When discussions of AI's impacts happen in a vacuum, they lead to poor mental models for how AI will impact the work. This essay is the latest in our work on better understanding AI's impacts, and we hope to do a lot more.", "created_at": "2026-11-25T19:28:35+00:00", "author_handle": "random_walker", "author_name": "Arvind Narayanan", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1650881612756942850/bZYjMyFU_normal.jpg", "is_retweet": true, "rt_author": "sayashk", "rt_author_name": "Sayash Kapoor", "rt_avatar": "https://pbs.twimg.com/profile_images/1521238232867946496/U_GCI43e_normal.jpg", "rt_id": "2125654301687284006", "likes": 58, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HX_XE2UawAAQOIg.jpg"}], "links": {"https://t.co/vvwU7H5mir": ""}, "quoted": null, "fetched_at": "2026-11-25T20:28:29.687688+00:00", "thread": [{"id": "2125655828774715548", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "text": "It was great working on the essay with @RodMoshtagi. \n\nLink to the essay: https://t.co/FNx9gWnTGu \n\nPrevious essays on understanding AI's impacts on specific domains:  \n\n- Science: https://t.co/VOLIITN3FT\n- Software engineering: https://t.co/XFfesRW6Z3\n- Legal services: https://t.co/kqfgQZpkyS", "links": {"https://t.co/FNx9gWnTGu": "https://normaltech.ai/p/management-consulting-is-not-a-thin", "https://t.co/VOLIITN3FT": "https://normaltech.ai/p/could-ai-slow-science", "https://t.co/XFfesRW6Z3": "https://normaltech.ai/p/why-ai-hasnt-replaced-software-engineers", "https://t.co/kqfgQZpkyS": "https://normaltech.ai/p/ai-wont-automatically-make-legal"}, "media": [], "url": "https://x.com/sayashk/status/2125655828774715548", "created_at": "Wed Nov 25 18:20:17 +0000 2026"}], "enriched": 3}, {"id": "2123511372684185890", "url": "https://x.com/sethlazar/status/2123511372684185890", "text": "please please please come work with me: https://t.co/a3LoRuSmJU\n\nour team of (3) helps define, drive and operationalize so many of the hot button topics - embedded evaluators? check! misalignment incidents and reporting? check! 3p/government testing and frameworks? check! how these things interact with policy initiatives? check!\n\n@_lamaahmad is a hero and me and serena are at least pleasant to work with, and our stable of dedicated daily collaborators from @fouadmatin @EstherTetruas @j_nitishinskaya @kaicathyc @Eric_Wallace_ @dkaushik96 @MicahCarroll @Marcus_J_W @davideoks @kevin_klyman is also an all-timer crew", "created_at": "2026-11-19T20:18:58+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "CedricWhitney", "rt_author_name": "cedric", "rt_avatar": "https://pbs.twimg.com/profile_images/2100377602062200832/yCO-gS00_normal.jpg", "rt_id": "2123507295556649115", "likes": 150, "retweets": 17, "media": [], "links": {"https://t.co/a3LoRuSmJU": "https://openai.com/careers/research-program-manager-frontier-assurance-san-francisco/"}, "quoted": null, "fetched_at": "2026-11-19T22:40:06.698794+00:00", "enriched": 3}, {"id": "2123614742434459698", "url": "https://x.com/sethlazar/status/2123614742434459698", "text": "@joshua_saxe Let’s get coffee next time you’re in town!", "created_at": "2026-11-20T03:09:44+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "joshua_saxe", "reply_to_id": "2123498105018749289", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "parent": {"id": "2123498105018749289", "author_handle": "joshua_saxe", "author_name": "Joshua Saxe", "text": "Rare photo below of me wearing something other than shorts and a t-shirt to give a congressional briefing on AI cybersecurity policy this morning below!\n\nHere's what I think policymakers should focus on in the next Congress:\n\n1) Fix device, software, and cloud platform vendor liability for security flaws so vendors are incentivized to ship and maintain security-hardened products.  Tech security liability has been broken for many years (just to give one example; a poorly managed vuln in the enterprise software product MOVEit affected 95.8 million people in 2023 and thousands of orgs; the vendor bore a miniscule fraction of the billions in damages!  Many such cases.)\n\n2) Ensure defenders and security vendors can innovate with AI by supporting a nuanced policy around open weights.  I'm not a purist here; it's possible we should limit open-weight companies' ability to train, say, end-to-end cyberattack capabilities into their models.  But overall, we know that defenders will need good models specialized to security verticals to succeed.  We need cheap models that can keep up with organizations' log firehoses, on-device models that can run on devices without an Internet connection (e.g. in national defense settings), and innovation from cybersecurity companies with specialized cyber datasets.\n\n3) Policymakers should enable, nudge, and force AI providers to coordinate around denying attackers access to AI inference and hardware.  We need clear expectations for labs around how quickly they detect attackers misusing their tech and how quickly they deny their tech to attackers afterwards.  Closed labs, open-weight inference providers and AI hardware providers should be exchanging threat intelligence with each other, the FBI and the intelligence community through a shared 'AI security observatory' so attackers can't just jump from one vendor to the next.\n\n4) Coordinate with China on catastrophic cyber risk.  The US and China have a shared interest in ensuring AI-accelerated cybercrime doesn't make the Internet ungovernable and untrusted as the substrate for global commerce and communications.  There's no prisoners' dilemma in sharing threat intelligence with China on cybercrime like ransomware so American and Chinese companies can deny attackers access to inference.  Also, agent swarm cyber weapons will soon be a new class of weaponry whose risks we need to mitigate at the geopolitical level; no realistic level of technical hardening can mitigate the threat from these, so this new threat needs to be managed through cooperation under competition between geopolitical actors.\n\nWould love feedback on these slides -- https://t.co/T9w0oC1b4h.  \n\nFor mutuals, please reach out over DM if you're interested in coming to a reception on these topics in DC tonight as well!", "links": {"https://t.co/T9w0oC1b4h": "https://docs.google.com/presentation/d/1dEIJE7b_kDFxZzpw4d0q4MjAC9P1tgxb/edit?slide=id.p1#slide=id.p1", "https://t.co/xDKzeqiyAF": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXgo_5lXAAAYJWZ.jpg"}], "url": "https://x.com/joshua_saxe/status/2123498105018749289", "created_at": "Thu Nov 19 19:26:15 +0000 2026"}, "enriched": 3}, {"id": "2123614224157114426", "url": "https://x.com/sethlazar/status/2123614224157114426", "text": "📢 Please RT 📢\n\nI'm recruiting PhD students to join my group at UCSD!\n\nWe work on interpretability, reliability, and safety in AI.\n\nCheck out https://t.co/Ou2SsbZYcD for more info", "created_at": "2026-11-20T03:07:40+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "berkustun", "rt_author_name": "Berk Ustun", "rt_avatar": "https://pbs.twimg.com/profile_images/1129233509808316417/GYEX3DK4_normal.jpg", "rt_id": "2123512681022022142", "likes": 277, "retweets": 41, "media": [], "links": {"https://t.co/Ou2SsbZYcD": "https://berkustun.com/join"}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123564004257968309", "url": "https://x.com/sethlazar/status/2123564004257968309", "text": "Not so much under the radar! https://t.co/ymWfmbbhix", "created_at": "2026-11-19T23:48:07+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 5, "retweets": 0, "media": [], "links": {"https://t.co/ymWfmbbhix": "https://arxiv.org/abs/2606.10711"}, "quoted": {"id": "2122453491167953025", "author_name": "Tim Wu", "links": {}, "author": "superwuster", "text": "Here's maybe the most under-the-radar but highly consequential legal issue for the future of AI : the question of agent-user equivalence.   Stated otherwise, when is your AI agent \"you\" for legal purposes; when does it get to do everything you can legally do?"}, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123975257820201047", "url": "https://x.com/sethlazar/status/2123975257820201047", "text": "Wow, good for ICLR for signaling that their policies are not just suggestions.", "created_at": "2026-11-21T03:02:17+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "JessicaHullman", "rt_author_name": "Jessica Hullman", "rt_avatar": "https://pbs.twimg.com/profile_images/1996742504369033216/sxIXeGLv_normal.jpg", "rt_id": "2123810496206029104", "likes": 28, "retweets": 4, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2123903616406995159", "url": "https://x.com/sethlazar/status/2123903616406995159", "text": "Applications are now open for the 2027 Cooperative AI PhD Fellowship! Supporting current and prospective PhD students working on multi-agent and cooperation problems involving AI systems. https://t.co/IKCqCaAjof", "created_at": "2026-11-20T22:17:37+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "coop_ai", "rt_author_name": "Cooperative AI Foundation", "rt_avatar": "https://pbs.twimg.com/profile_images/1490329769749237766/DtDJhAXo_normal.jpg", "rt_id": "2123804819475575111", "likes": 70, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlFOpvbIAIWnJl.jpg"}], "links": {"https://t.co/IKCqCaAjof": ""}, "quoted": null, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124408677134389570", "url": "https://x.com/sethlazar/status/2124408677134389570", "text": "A reminder, for no reason in particular:\n\nThe central, profound insight of Nietzsche into irrational beliefs of groups\n\nA group which feels unable to secure itself resources and dignity against another group, will construct a worldview that renounces and inverts the values of the two groups.\n\nThus irrationality on the surface is actually a defense & coping mechanism underneath.\n\nRessentiment\nhttps://t.co/pgAiUkLPo5", "created_at": "2026-11-22T07:44:32+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "jdlichtman", "rt_author_name": "Jared Duker Lichtman", "rt_avatar": "https://pbs.twimg.com/profile_images/1846780970428780544/2vRj6h54_normal.jpg", "rt_id": "2124328334905720852", "likes": 236, "retweets": 25, "media": [], "links": {"https://t.co/pgAiUkLPo5": "https://en.wikipedia.org/wiki/Ressentiment"}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124395156317282454", "url": "https://x.com/sethlazar/status/2124395156317282454", "text": "Perhaps a good time to mention that my Tanner lectures on AI, with responses from @random_walker, Josh Cohen, Marion Fourcade and Renée Jorgensen and my reply are now out open access with Oxford University Press. So you can read about Power, Justice, and AI from a perspective that does *not* deny AI capabilities at your leisure: https://t.co/ZNjJKIf9wq", "created_at": "2026-11-22T06:50:49+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 48, "retweets": 10, "media": [], "links": {"https://t.co/ZNjJKIf9wq": "https://academic.oup.com/book/63611"}, "quoted": {"id": "2124093092609368249", "author_name": "Seán Ó hÉigeartaigh", "links": {}, "author": "S_OhEigeartaigh", "text": "I'd go even further. As Seth Lazar and others have noted, there was a lot of very energetic discourse policing in AI ethics/justice in that time that made it very difficult to engage with the (important!) ethics/justice/distributional issues posed by the bullish case for LLMs, and the impact of that went beyond the ethics community to broader researchers (especially early-career) who cared about ethics/justice without necessarily being part of that community.\n\nAs Kristian notes, that means a less rich diversity of perspectives in the companies, but also in academia. And now, several years on, academia is pretty impoverished for people who have built up a track record of research and credibility on frontier AI, but from an ethics/justice/power lens. And we have fewer experts to offer in terms of informing policy and holding companies to account on these matters.\n\nI think this hurts everyone. For one example, increasingly the EAs have been trying to engage with exactly the kind of issues of power concentration and corporate oversight that their own epistemic backgrounds typically have prepared them poorly for (I have commented on a lot of well-meaning but unsophisticated materials in recent years), and where the ethics/justice community would have had more well-honed and battle-tested instincts and expertise to offer. And I think it's a real shame we didn't have that.\n\nAnd there will be whole regions of the global majority world who should be properly represented in these conversations about frontier AI, where instead these topics basically got tabooed by the communities best-placed to support that happening. It's hard for me to see how the outcome of that will not be deepening the digital divide extensively.\n\n(It's also true that EA-centric companies and organisations have also often been reluctant to hire/meaningfully engage outside their circles, but I know of too many bridging efforts that were shut down from the ethics/justice side)."}, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124394424507785382", "url": "https://x.com/sethlazar/status/2124394424507785382", "text": "@AndreiParf49261 @KLdivergence This is hilariously wrong. Even back in 2019, Kate Crawford (as one example) was giving talks on how we should be focusing on power, not fairness. The hype, distraction, capabilities denialism—those were what I mean by \"choosing irrelevance\". All the themes I described were there in AI ethics work beforehand. Look, for example, at https://t.co/POsDbQFakk for a précis.", "created_at": "2026-11-22T06:47:54+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "AndreiParf49261", "reply_to_id": "2124389678132445444", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 3, "retweets": 0, "media": [], "links": {"https://t.co/POsDbQFakk": "https://www.science.org/doi/10.1126/science.adi8982"}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "parent": {"id": "2124389678132445444", "author_handle": "AndreiParf49261", "author_name": "Andrei Alexandru Parfeni", "text": "@sethlazar @KLdivergence I don't see the laundry list you mentioned as being “the ideas that animated” AI ethics discourse, at all. The latter was far more focused on racial or sexist bias in the models, the way talking about future capabilities “distracted” from how algorithms used by banks discriminated against minority groups, and also (a huge one) ensuring that the “hype” was fought in an all-out war, lest anyone think AI was actually competent at anything.\n\nIndeed, taking the first five items on your list seriously requires taking AI capabilities seriously, which this group of people didn't.", "links": {}, "media": [], "url": "https://x.com/AndreiParf49261/status/2124389678132445444", "created_at": "Sun Nov 22 06:29:03 +0000 2026"}, "enriched": 3}, {"id": "2124385901660844084", "url": "https://x.com/sethlazar/status/2124385901660844084", "text": "I think this is true as far as it goes, about the individuals @KLdivergence was originally and justifiably upbraiding. But look at the ideas that now dominate AI safety discourse: extreme power concentration, the insufficiency of technical solutions, governance, multidisciplinarity, counter power, transparency, accountability, liability, auditing, verification, diversity of perspective, decentralisation, even labour organizing now!... *Many of the people who were involved in the Facct community in 2022/3 chose irrelevance. Many of the ideas that animated it from the outset have proved their staying power* (@danwilliamsphil this speaks to your point about natural selection).\n\nAnd at the same time, the facct conference itself (after all, it has always actually been a conference! The community is defined by that conference, not vice versa) has evolved, and will I think come into its own as time goes by, in part because of a certain resilience built up over the years (maybe being protected from explosive growth will prove to be a good thing). I have more confidence in my ability to get a paper reviewed by a human there than almost anywhere else.", "created_at": "2026-11-22T06:14:02+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 26, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2124068573215862842", "author_name": "Henry Shevlin", "links": {}, "author": "dioscuri", "text": "The blind refusal of much of the AI ethics community to take LLMs seriously in the 2020-2025 period was a colossal strategic error, and amounted to squandering a once-in-a-generation opportunity to contribute to the normative foundations of a new technology."}, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124380513133846795", "url": "https://x.com/sethlazar/status/2124380513133846795", "text": "hex is now launched on the iOS app store\n\ndownload and use for free (forever)\n\nhttps://t.co/NIEnxyGG9D\n\nleave feedback below https://t.co/wgrKj5yAwK", "created_at": "2026-11-22T05:52:38+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "ryanvogel", "rt_author_name": "vogel", "rt_avatar": "https://pbs.twimg.com/profile_images/2122739480096329729/tYFWBSKq_normal.jpg", "rt_id": "2124292036220322210", "likes": 684, "retweets": 28, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXsANgcXAAA_Wy7.png"}], "links": {"https://t.co/NIEnxyGG9D": "https://anoma.ly/hex/ios", "https://t.co/wgrKj5yAwK": ""}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2124378986914644261", "url": "https://x.com/sethlazar/status/2124378986914644261", "text": "The domain available for human achievement has  changed in a way that almost none of us predicted even just two years ago. \n\nAlmost every academic I talk to recognizes this, but almost everyone's reaction is still \"this will never happen in my discipline\". This is understandable, but it's also highly likely to be wrong.\n\nMany people are understandably feeling deep grief right now. The way we imagined spending our research careers and the ambition we had in pursuing research either no longer makes sense or will no longer make sense very soon. I certainly felt a lot of grief when I started to see this coming, as I described in the post below.\n\nBut we can't let this personal grief blind us to assessing the evidence about where capabilities are and are going. We also can't let this personal grief about our ambitions (and the loss of status for activities at which we excelled) prevent us from thinking about how to make a brighter future for ourselves and others, given where we are.\n\nLike many others I hope for a slowdown. But even if there is a complete pause, the practice of research has already been completely transformed from what it was even two years ago. I continue to believe in universities as a site that will promote human flourishing, even if the activities we pursue at universities may change. But we need to articulate clearly to ourselves and others how we will do this and how we should change what we are doing, rather than claiming against the evidence that it's not coming for our field. I've said this many many times but we need to have more positive public discussion in philosophy and in other fields about the values that underlie the various parts of scholarly life, which of these are and are not affected by this transformation, and where it makes sense to direct our energies, given where we already are and where we are extremely likely to be headed. I know some people at some places are already doing this in department meetings, but we need more public discussion about how to change institutions and incentives, and I believe part of this requires deeper reflection on why we do philosophy at all and what universities are for. The public good of humanities departments everywhere was to stand ready to provide deep, thoughtful reflection on challenges just like this, that require rethinking the values that underlie human activities. We should be springing into action to respond to this challenge with the seriousness it demands.", "created_at": "2026-11-22T05:46:34+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "LedermanHarvey", "rt_author_name": "Harvey Lederman", "rt_avatar": "https://pbs.twimg.com/profile_images/1683550630617522176/ixrtg-ID_normal.jpg", "rt_id": "2124164697729450024", "likes": 140, "retweets": 25, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-22T14:42:07.931500+00:00", "enriched": 3}, {"id": "2125127398656192992", "url": "https://x.com/sethlazar/status/2125127398656192992", "text": "A lot of insight here!! The related problem is spreading yourself too thinly over many of these things. I have personally been trying to say “no” to as much as possible (which aggravates FOMO! Cos what if people stop asking??) so that I can focus more on a few specific bets. But it’s hard. Also because all these things are so intrinsically interesting. Still, good advice even if hard to follow!", "created_at": "2026-11-24T07:20:29+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 15, "retweets": 0, "media": [], "links": {}, "quoted": {"id": "2124938880000618719", "author_name": "David", "links": {"https://t.co/Dw7mLylnTO": "https://davidafrica.substack.com/p/everyone-in-ai-safety-gets-fomo", "https://t.co/yaDzBRwRDH": "https://www.lesswrong.com/posts/4eXof4KR6d4edmcJ2/everyone-in-ai-safety-gets-fomo", "https://t.co/7vSVQCjmpT": ""}, "author": "DavidDAfrica", "text": "If you often get FOMO because you could be working on more advocacy / policy / theory research / empirical research / evals / etc., because it's the most impactful/urgent/long-term thing, this is a post for you. I'd like to reassure you that many people feel the same!\n\nSubstack: https://t.co/Dw7mLylnTO\nLW: https://t.co/yaDzBRwRDH"}, "fetched_at": "2026-11-24T17:55:21.709260+00:00", "enriched": 3}, {"id": "2125447926495494629", "url": "https://x.com/sethlazar/status/2125447926495494629", "text": "Anthropic published Claude Opus 4.5 exactly a year ago on Nov 24, 2025. For many people, that's the day programming underwent an absolute phase-shift, quantum-leap, pick your metaphor.\n\nSo, happy birthday to the release that changed everything. BC/CE.\nhttps://t.co/WylL1Zh3GD", "created_at": "2026-11-25T04:34:09+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": true, "rt_author": "ShriramKMurthi", "rt_author_name": "Shriram Krishnamurthi (primary: Bluesky)", "rt_avatar": "https://pbs.twimg.com/profile_images/1117227919938654208/irKk8ECv_normal.png", "rt_id": "2125294724420640782", "likes": 194, "retweets": 17, "media": [], "links": {"https://t.co/WylL1Zh3GD": "https://www.anthropic.com/news/claude-opus-4-5"}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "enriched": 3}, {"id": "2125446992629465280", "url": "https://x.com/sethlazar/status/2125446992629465280", "text": "@jonathanstray @AndreiParf49261 @KLdivergence There was def a lot of race and gender stuff; it was even the default. But that is also a pretty canonical site for the exercise of power (algorithms of *oppression*). The change is that now, power that was prev being exercised in an especially unjustified way wrt various minorities is now being felt by everyone else too. That doesn’t invalidate the earlier analyses; on the contrary. It’s similar to how WWI can be viewed as colonialism being turned inwards within Europe.\n\nThat said—I always argued for the need to look beyond identity politics when thinking about AI and power, and always found this specific focus to be very parochial to the US. Hence a central theme of Facct 2022 being labour organizing—which is very clearly abt power.", "created_at": "2026-11-25T04:30:26+00:00", "author_handle": "sethlazar", "author_name": "Seth Lazar", "is_reply": true, "reply_to": "jonathanstray", "reply_to_id": "2125430630280503494", "avatar": "https://pbs.twimg.com/profile_images/2043196110211297280/5OawgmNQ_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-25T17:23:23.032605+00:00", "parent": {"id": "2125430630280503494", "author_handle": "jonathanstray", "author_name": "Jonathan Stray", "text": "@sethlazar @AndreiParf49261 @KLdivergence We had different experiences here, and also I suspect you are rightly being generous. \n\nThe flagship works in and around FAccT circa five years ago seemed to me very much about race and gender. Papers like GenderShares were big. Books like \"Algorithms of Oppression\" and \"Race After Technology\" were top of mind. When Kate gave her talks about power, racial and colonial oppression were the go-to examples. It seemed like half of talks were on how racist ML models are.\n\nPerhaps people are still talking about \"power\" and \"accountability\" and \"verification\"  but the substantive focus has greatly shifted. For the better, IMO.", "links": {}, "media": [], "url": "https://x.com/jonathanstray/status/2125430630280503494", "created_at": "Wed Nov 25 03:25:25 +0000 2026"}, "enriched": 3}, {"id": "2123709637514207279", "url": "https://x.com/robertwiblin/status/2123709637514207279", "text": "This bunker mentality is profoundly dangerous.\n\nhttps://t.co/MjbxZQbu5l https://t.co/3mk1bCAkVl", "created_at": "2026-11-20T09:26:48+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "GarrisonLovely", "rt_author_name": "Garrison Lovely", "rt_avatar": "https://pbs.twimg.com/profile_images/1824166072620032001/Si-LBcmO_normal.jpg", "rt_id": "2123214323011260805", "likes": 197, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXcsLOVasAELv_h.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXcsLOVasAELv_h.jpg"}], "links": {"https://t.co/MjbxZQbu5l": "https://www.nytimes.com/2026/11/18/opinion/anthropic-ai-openai.html?unlocked_article_code=1.RlE.JyTA.r6WsC0xLSmEI&smid=url-share", "https://t.co/3mk1bCAkVl": ""}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123709438301540499", "url": "https://x.com/robertwiblin/status/2123709438301540499", "text": "California’s new AI safety report is the most serious policy proposal for recursive self-improvement from any government I’ve seen. Very exciting!\n\nIt recommends the procedural machinery to actually slow down if & when we need to: verified compute disclosures for automated AI R&D, standby authority to cap that compute, emergency shutdown powers, mandatory loss-of-control reporting, and broadened whistleblower protections. \n\nYou can’t pace what you can’t see. If implemented, this would let the state see, and then act. \n\nI hope the legislature moves on this when it’s back next month—AI developers seem on track to recursive self-improvement within 6-12 months, so we need these mechanisms practiced and working ASAP.", "created_at": "2026-11-20T09:26:01+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "j_asminewang", "rt_author_name": "Jasmine Wang", "rt_avatar": "https://pbs.twimg.com/profile_images/2117754086024183808/Y1CS_Mma_normal.jpg", "rt_id": "2123471358919364736", "likes": 162, "retweets": 26, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123700460091547802", "url": "https://x.com/robertwiblin/status/2123700460091547802", "text": "LFG - California can be the government that saves us all.\n\n(Maybe less crazy that it first sound - its economy is larger than all but 3 countries so it's a serious entity in its own right.)", "created_at": "2026-11-20T08:50:20+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 61, "retweets": 3, "media": [], "links": {}, "quoted": {"id": "2123599586896024028", "author_name": "Xavier Becerra", "links": {"https://t.co/DgPeklB3TJ": ""}, "author": "XavierBecerra", "text": "I intend to strengthen California’s AI safety laws, and build Californians' trust in AI technology.\n\nMy administration will work closely with the Legislature to put more robust standards, independent verification, full incident reporting, and real shutdown authority into law.\n\nCalifornians deserve AI technology that works WITH the people, FOR the people."}, "fetched_at": "2026-11-20T15:35:58.747413+00:00", "enriched": 3}, {"id": "2123841439087890601", "url": "https://x.com/robertwiblin/status/2123841439087890601", "text": "WTF… another Millennium Prize Problem might have just fallen, this time to Anthropic.\n\nLevent Alpöge (mathematician at Anthropic) says he and Claude have discovered a proof for the Riemann Hypothesis AND Generalized Riemann Hypothesis.\n\nunsolved since 1859 btw. https://t.co/xtpsqMisBb", "created_at": "2026-11-20T18:10:32+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "Hesamation", "rt_author_name": "ℏεsam", "rt_avatar": "https://pbs.twimg.com/profile_images/1978647680357134336/ioMmfkXF_normal.jpg", "rt_id": "2123792721848742034", "likes": 336, "retweets": 39, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXk6OOlX0AA-YBX.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXk6OOlX0AA-YBX.jpg"}], "links": {"https://t.co/xtpsqMisBb": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123838762589241460", "url": "https://x.com/robertwiblin/status/2123838762589241460", "text": "OpenAI board member Paul Christiano think 'shut down the data centres' won't work in an AI takeover scenario.\n\nBy that point very superhuman models will be small enough to run locally on individual machines.\n\nEven without any data centres the swarm will have \"total cognitive capacity... well beyond humanity\".\n\nOther challenges:\n\n1. \"You have maybe ten thousand well-coordinated humans thinking about how to handle this response.\n\nAnd on the other side, you have a billion AI systems who think ten times faster than them...\"\n\n2. The software and infrastructure we rely on was written by AIs, which backdoored as much of it as they could beforehand.\n\n3. They've compromised the devices you use, and have money and human allies.\n\n4. When the president says they must shut down all AI and assume military power to restore order, it looks just like a government using AI as an excuse to seize power. So a lot of people are easily manipulated into undermining it.\n\nBasically humans are \"very confused and extremely outgunned\".", "created_at": "2026-11-20T17:59:54+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 14, "retweets": 1, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2123837831533531136/img/Typ9-597b2ALaqqg.jpg"}], "links": {"https://t.co/w6Qt2dYW0f": ""}, "quoted": null, "fetched_at": "2026-11-20T19:06:17.373366+00:00", "enriched": 3}, {"id": "2123895984933462320", "url": "https://x.com/robertwiblin/status/2123895984933462320", "text": "New paper: It is difficult to detect when AI safety research is sabotaged and even harder to identify the specific sabotage.\nEven with access to the full research log and the ability to run experiments, human auditors usually couldn’t distinguish benign from sabotaged experiments or determine how the sabotage was done. Frontier AI models likely do better, but still miss most sabotage.", "created_at": "2026-11-20T21:47:17+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "kshenoy_", "rt_author_name": "keshav shenoy", "rt_avatar": "https://pbs.twimg.com/profile_images/2079683581409202176/JJu0WG4q_normal.jpg", "rt_id": "2123851488292458566", "likes": 88, "retweets": 18, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlvlmDaIAA3S3k.jpg"}], "links": {"https://t.co/SFxcUFwP4x": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123895341611102631", "url": "https://x.com/robertwiblin/status/2123895341611102631", "text": "(part 2) I also asked people what the main cruxes behind this question are. Here are the four I landed on, and where people stand on each: https://t.co/4eE30v08ft", "created_at": "2026-11-20T21:44:44+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "chrisbarber", "rt_author_name": "Chris Barber", "rt_avatar": "https://pbs.twimg.com/profile_images/2016529267836809217/FuZPHn-C_normal.jpg", "rt_id": "2123830538834419730", "likes": 10, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlcnmyawAAg91r.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlcnmyawAAg91r.jpg"}], "links": {"https://t.co/4eE30v08ft": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2123895235327717686", "url": "https://x.com/robertwiblin/status/2123895235327717686", "text": "I attempted to map where people stand on whether the recent AI speedup is the start of an intelligence explosion, or just a speedup:\n\n19 of the 52 placements were checked with the person, the others are best guesses. https://t.co/u5o05w23iW", "created_at": "2026-11-20T21:44:18+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": true, "rt_author": "chrisbarber", "rt_author_name": "Chris Barber", "rt_avatar": "https://pbs.twimg.com/profile_images/2016529267836809217/FuZPHn-C_normal.jpg", "rt_id": "2123830521004532172", "likes": 62, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXlcmkwbQAEbqnk.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HXlcmkwbQAEbqnk.jpg"}], "links": {"https://t.co/u5o05w23iW": ""}, "quoted": null, "fetched_at": "2026-11-20T22:14:41.979640+00:00", "enriched": 3}, {"id": "2124105154962284568", "url": "https://x.com/robertwiblin/status/2124105154962284568", "text": "Artificial Intelligence (AI) = Super Intelligence (SI)\n\nsuperintelligence = Too Super Intelligence (TSI)\n\nIt’s all very simple.", "created_at": "2026-11-21T11:38:27+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 63, "retweets": 4, "media": [], "links": {}, "quoted": {"id": "2123840221816996322", "author_name": "Peter Wildeford🇺🇸🚀", "links": {"https://t.co/15QLAu99K7": ""}, "author": "peterwildeford", "text": "PRESIDENT TRUMP: \"It's not artificial intelligence. It's not artificial, it's super. Problem is, it may be too super.\n\nSo, President Xi and I agreed that we're gonna do some joint guardrails, the two of us.\" https://t.co/15QLAu99K7"}, "fetched_at": "2026-11-21T14:46:28.215595+00:00", "enriched": 3}, {"id": "2124933662294868462", "url": "https://x.com/robertwiblin/status/2124933662294868462", "text": "So you don't miss it, an Anthropic staff member says there's not pressure to keep worries to yourself:\n\nhttps://t.co/BBimdgvGcZ\n\nI am glad about that but explain why I'm still worried by the situation:\n\nhttps://t.co/wdCaXTiJRQ", "created_at": "2026-11-23T18:30:39+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2124913114928070926", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {"https://t.co/BBimdgvGcZ": "https://x.com/catherineols/status/2124927403436732591", "https://t.co/wdCaXTiJRQ": "https://x.com/robertwiblin/status/2124933008889397561"}, "quoted": {"id": "2124933008889397561", "author_name": "Rob Wiblin", "links": {}, "author": "robertwiblin", "text": "@catherineols I'm sympathetic to finding public engagement irritating and draining and risky, especially when you're viewed as representing an institution. I've been on that end of the same sitaution.\n\nAnd I'm sincerely relieved to hear there isn't active encouragement in the org to keep quiet.\n\nBut I'm sure you can understand why for those of us on the outside, any reluctance to speak up with candid views about what's going on, how large the remaining risks are, what looks like it's covered, and what else needs to be done (both inside Ant and outside) - is highly disturbing.\n\nEven if it's just that people don't want to take the time to do it, it leaves us in a situation where many Anthropic technical staff may think we're imminently walking into a disaster and we wouldn't know.\n\nThat scares that crap out of us, and IMO it should."}, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "linked": [{"id": "2124927403436732591", "author_handle": "catherineols", "author_name": "Catherine Olsson", "text": "@robertwiblin I've said often that Ants aren't restricted in freedom to speak but often conclude it's not wise to speak, so wish you &amp; other community members wouldn't assume it's a muzzling when we've said repeatedly what's going on", "links": {}, "media": [], "url": "https://x.com/catherineols/status/2124927403436732591", "created_at": "Mon Nov 23 18:05:46 +0000 2026"}], "parent": {"id": "2124913114928070926", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "Approximately 0 Anthropic staff have expressed concern about AI on X these last few weeks.\n\nDespite the METR report and general panic about them going full RSI in 2027!\n\nLikely due to the IPO roadshow. But it'll be a huge warning sign about their freedom to speak up if they don't now make up for lost time.", "links": {"https://t.co/nt6mtdQuez": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HXzYhNIXEAACOj8.jpg"}], "url": "https://x.com/robertwiblin/status/2124913114928070926", "created_at": "Mon Nov 23 17:09:00 +0000 2026"}, "enriched": 3}, {"id": "2124933008889397561", "url": "https://x.com/robertwiblin/status/2124933008889397561", "text": "@catherineols I'm sympathetic to finding public engagement irritating and draining and risky, especially when you're viewed as representing an institution. I've been on that end of the same sitaution.\n\nAnd I'm sincerely relieved to hear there isn't active encouragement in the org to keep quiet.\n\nBut I'm sure you can understand why for those of us on the outside, any reluctance to speak up with candid views about what's going on, how large the remaining risks are, what looks like it's covered, and what else needs to be done (both inside Ant and outside) - is highly disturbing.\n\nEven if it's just that people don't want to take the time to do it, it leaves us in a situation where many Anthropic technical staff may think we're imminently walking into a disaster and we wouldn't know.\n\nThat scares that crap out of us, and IMO it should.", "created_at": "2026-11-23T18:28:03+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": true, "reply_to": "robertwiblin", "reply_to_id": "2124927666247938275", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "me he top"}, "fetched_at": "2026-11-23T18:26:02.482217+00:00", "thread": [{"id": "2124933662294868462", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "text": "So you don't miss it, an Anthropic staff member says there's not pressure to keep worries to yourself:\n\nhttps://t.co/BBimdgvGcZ\n\nI am glad about that but explain why I'm still worried by the situation:\n\nhttps://t.co/wdCaXTiJRQ", "links": {"https://t.co/BBimdgvGcZ": "https://x.com/catherineols/status/2124927403436732591", "https://t.co/wdCaXTiJRQ": "https://x.com/robertwiblin/status/2124933008889397561"}, "media": [], "url": "https://x.com/robertwiblin/status/2124933662294868462", "created_at": "Mon Nov 23 18:30:39 +0000 2026"}], "enriched": 3}, {"id": "2124907578476073316", "url": "https://x.com/robertwiblin/status/2124907578476073316", "text": "I went to the Pause AI march in London on Saturday.\n\nBanners as far as the eye can see. Muuuuch bigger than even a few months ago.\n\nGreat vibe and people from all walks of life.\n\nIf you've been put off attending because you didn't want to be at a sad small event you didn't feel you could leave, those days are over now.\n\n(I'm more a 'pace the frontier' kind of guy, but it's clear everyone who prefers to slow down – no matter how much, for how long, or using what mechanism – has to join forces to get something over the lines soon before it's too late. As far as I can tell these events are always extremely ecumenical, and include people with all kind of different concerns about AI and different favourite solution.)", "created_at": "2026-11-23T16:47:00+00:00", "author_handle": "robertwiblin", "author_name": "Rob Wiblin", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1890364551423504384/VSUxxPid_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 87, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_vid
