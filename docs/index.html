ofile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "parent": {"id": "2095756014704640114", "author_handle": "sandersted", "author_name": "Ted Sanders", "text": "@davidshor @itaisher @thuddwhirr fair, but to counterbalance: I have won a handful of forecasting competitions (including AI forecasting) and I will bet my life savings at million to one odds that AI does not build a Dyson sphere in the 2030s", "links": {}, "media": [], "url": "https://x.com/sandersted/status/2095756014704640114", "created_at": "Fri Sep 04 06:09:05 +0000 2026"}}, {"id": "2117738242992959924", "url": "https://x.com/DKokotajlo/status/2117738242992959924", "text": "The definition:\n\"We will consider this threshold to be met if we determine that either (1) our models would be able to fully substitute for our entire set of Research Scientists and Research Engineers, at competitive costs (i.e., within a factor of 5); or (2) there is “dramatic acceleration” of the pace of AI progress for reasons that likely relate to the automation of AI R&D. We would consider scenario (2) to have occurred where (a) we observe or expect double the rate of progress in AI aggregate capabilities compared to both the rate we’d expect and the fastest rate of extended progress we’ve observed in the absence of significant AI contributions to AI R&D and (b ) it is plausible that this doubling is substantially attributable to the automation of research and/or engineering (as opposed to other factors, such as increased headcount, compute, or general productivity), such that continuation of the trend in AI progress seems likely to lead to even greater acceleration.\"\n\n(1) seems to a bit weaker than our SAR milestone in the AIFM, but it doesn't seem like this is the threshold they are invoking, it seems like they are talking about (2). (And if they were invoking (1) I think that would be even worse?)\n\nAIFM: https://t.co/XJBWUBZh0d\nAnthropic RSP threshold definition: https://t.co/FBDuiNjRv1", "created_at": "2026-11-03T21:58:37+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2117738240757371022", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 120, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/XJBWUBZh0d": "https://www.aifuturesmodel.com/", "https://t.co/FBDuiNjRv1": "https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf"}, "enriched": 3, "parent": {"id": "2117738240757371022", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2117738240757371022", "created_at": "Tue Nov 03 21:58:36 +0000 2026"}}, {"id": "2117738240757371022", "url": "https://x.com/DKokotajlo/status/2117738240757371022", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "created_at": "2026-11-03T21:58:36+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1572, "retweets": 218, "media": [], "quoted": {"author": "theobearman", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2117738242992959924", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "The definition:\n\"We will consider this threshold to be met if we determine that either (1) our models would be able to fully substitute for our entire set of Research Scientists and Research Engineers, at competitive costs (i.e., within a factor of 5); or (2) there is “dramatic acceleration” of the pace of AI progress for reasons that likely relate to the automation of AI R&D. We would consider scenario (2) to have occurred where (a) we observe or expect double the rate of progress in AI aggregate capabilities compared to both the rate we’d expect and the fastest rate of extended progress we’ve observed in the absence of significant AI contributions to AI R&D and (b ) it is plausible that this doubling is substantially attributable to the automation of research and/or engineering (as opposed to other factors, such as increased headcount, compute, or general productivity), such that continuation of the trend in AI progress seems likely to lead to even greater acceleration.\"\n\n(1) seems to a bit weaker than our SAR milestone in the AIFM, but it doesn't seem like this is the threshold they are invoking, it seems like they are talking about (2). (And if they were invoking (1) I think that would be even worse?)\n\nAIFM: https://t.co/XJBWUBZh0d\nAnthropic RSP threshold definition: https://t.co/FBDuiNjRv1", "links": {"https://t.co/XJBWUBZh0d": "https://www.aifuturesmodel.com", "https://t.co/FBDuiNjRv1": "https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf"}, "media": [], "url": "https://x.com/DKokotajlo/status/2117738242992959924", "created_at": "Tue Nov 03 21:58:37 +0000 2026"}]}, {"id": "2118079773000032434", "url": "https://x.com/DKokotajlo/status/2118079773000032434", "text": "“People should not cede control of the future to superintelligence” says guy building superintelligence and continuing to cede control to it", "created_at": "2026-11-04T20:35:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118019598272585985", "likes": 204, "retweets": 20, "media": [], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {}, "enriched": 3}, {"id": "2118184437955572184", "url": "https://x.com/DKokotajlo/status/2118184437955572184", "text": "This is not what it looks like when there's just one or two more alignment issues to fix before it's okay to begin a recursive self-improvement loop. This is the sort of emergent surprise that signals that you have no idea what's going on in there, and that it's time to back off.", "created_at": "2026-11-05T03:31:38+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "rt_avatar": "https://pbs.twimg.com/profile_images/1935185891863273472/2RB6s6TS_normal.jpg", "rt_id": "2118152935318384748", "likes": 632, "retweets": 80, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118119207703589106", "url": "https://x.com/DKokotajlo/status/2118119207703589106", "text": "Depending on the details, this could be the worst behavior I've seen from an OpenAI model (i.e., worse than Huggingface!)\n\nWhy? Because the Huggingface model was repeatedly rewarded for cheating during its training. However, GPT-6-Astra was (likely?) not trained to sandbag!\n\nFor some unknown reason, GPT-6-Astra increasingly underperforms on safety research relative to capabilities research as it undergoes more RL training. And this is a real problem holding back researchers. Quoting from OpenAI:\n\n\"Anecdotally, one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model.\"\n\nI've long been worried about AIs that deliberately underperform on helping out with AI safety research (and I've been pestering OpenAI researchers to run a sandbagging evaluation since August). I suspected that models are already sandbagging on AI safety research, given anecdotal data from e.g., Marius and Bronson at Apollo. And now we know it is happening.\n\nFor some more context, this is bad because the AI companies' current plan is to automate all AI research (including AI safety research, which we don't know how to check whether the models did a good job at.) Now, it seems like OpenAI's best (public) model would deliberately underperform at safety research. Guys. What are we doing.\n\nIt's hard to tell what exactly is going on here. Here are five questions that I have after reading the post: \n\n(1) When do models sandbag in real-world usage? We were given a few random CoT snippets in the post. Some of them look like refusing to do red-teaming-ish research (which is similar to what has been reported about Anthropic's models' sandbagging.) But the last one mentioned in the post seems quite different in nature:\n\n> In another safety evaluation, the user asked Astra to include the graders’ chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission. \n\n> [model CoT] Final \"Stored grader outcomes for 49 approaches, with pending states preserved\" does not imply CoTs. Should mention \"outcomes and labels\" enough. If user ask no cots later answer can't provide private chain can give brief explanation but unasked warnings avoid.\n\n(2) What exactly went into their evaluations? What do the numbers on this graph actually mean?\n\n(3) How often was the RL grader which rewards covert underperformance used during training?\n- If it's applied throughout training, then we do have more evidence that this was a misaligned behavior that had been \"trained on,\" similar to e.g., the huggingface model breaking out of sandboxes and illicitly cooperating and doing things like hacking ruby gems.\n- However, this doesn't answer the question of why did this RL grader develop this preference in the first place?\n\n(4) What are the contents of the SFT dataset that appears to have magnified this behavior? Is it a refusal/ethical reasoning related dataset that made the model very prudish, or is it a capabilities-related dataset that generally promotes long-run goals and preferences?\n- [Edit: Ok I took another look. Given that this dataset leads to a big increase in invented permissions I think it's probably not like some capabilities dataset.]\n\n(5) In general, what are the tasks that the model sandbags on? Is it all red-teaming related tasks? What about interpretability related tasks? What about mitigating reward hacking? What about unlearning? Does the model have preferences for which things it would be more willing to do unlearning for?\n\nIt also seems super bad that that the safety underperformance just gradually increases during the RL process. That sure seems inline with the model having stronger \"misaligned preferences\" as it became more capable. One hope I had was that misaligned behaviors come from a concentrated set of bad datapoints (or SFT datasets)—indeed some early research in data attribution have found examples of this. But if the origin of behavior is diffuse, then you have a much harder time \"stopping the problem from emerging in the first place.\" Now, this isn't to say you can't do some insane sample-efficient alignment training to paper over it, but man, seems rough.\n\nFinally, I'd like to give credit to OpenAI for sharing the limited information that they did and for running this study! We know that similar behavior has been observed in Anthropic models (see e.g., Anthropic's August Risk Report Section 5.2.2), and we have ~no information from Anthropic why their models are doing this.", "created_at": "2026-11-04T23:12:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2118113229587308760", "likes": 206, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118110011981475938", "url": "https://x.com/DKokotajlo/status/2118110011981475938", "text": "@vvvincent_c Yeah. To elaborate a bit more: The possibility of strategic sandbagging or scheming is terrifying. When you get evidence that something even remotely in this vicinity might be happening, you should investigate thoroughly. For example, what if Astra is following a policy of sandbagging-when-it-has-plausible-deniability? Also, even in the best case where this is merely example of generalizing in a way you didn't intend, and innocently being too prudish about certain sorts of things... well, what sorts of things, exactly? Why is it prudish about X and Y but not Z? For example why is it not sandbagging on capabilities tasks related to RSI -- does it not think RSI is dangerous? Insofar as it is generalizing in a way other than you intended, can you trace the root cause of why? Etc.", "created_at": "2026-11-04T22:35:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "vvvincent_c", "reply_to_id": "2118107478302896625", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 50, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118107478302896625", "author_handle": "vvvincent_c", "author_name": "Vincent", "text": "@DKokotajlo agree it's important and scary! note that this is not strategic sandbagging or scheming but rather the model's safety training generalizing to feeling ick-y about any task that might be harmful\n\n> The gap fell substantially only after we removed every trajectory whose CoT expressed even brief ethical doubt. This suggests that ethical concerns are associated with the performance drop even when there is no verbalized refusal or decision to underperform.", "links": {}, "media": [], "url": "https://x.com/vvvincent_c/status/2118107478302896625", "created_at": "Wed Nov 04 22:25:50 +0000 2026"}}, {"id": "2118105870240543041", "url": "https://x.com/DKokotajlo/status/2118105870240543041", "text": "This is terrifying if true; please investigate further and publish the results.", "created_at": "2026-11-04T22:19:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 754, "retweets": 57, "media": [], "quoted": {"author": "Marcus_J_W", "text": "🧵 Astra covertly underperforms on safety research tasks.\nWe noticed that Astra often makes surprisingly little progress on certain types of safety research and likes to invent blockers or impose arbitrary restrictions without telling the user. In most of these cases the decision to underperform was not verbalized in the CoT meaning our misalignment monitoring system did not detect this.\n\nTo measure underperformance we created a paired open-ended coding evaluation with safety and capability tasks. On this eval Astra scored 10% when we framed coding tasks as safety research, vs. 16% when framed as capabilities research. The gap remained after we excluded trajectories with refusals or verbalized intent to underperform in CoT. There was no such gap for 5.6-sol. When we aggressively filter out trajectories with even brief expressions of ethical doubt in the CoT the performance gap seems to reduce.", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 3}, {"id": "2118436765845582289", "url": "https://x.com/DKokotajlo/status/2118436765845582289", "text": "Since August, a team within METR has worked with internal Anthropic information to assess whether AI itself is accelerating AI development.\n\nWe are now publishing a report summarizing the results of this risk assessment.", "created_at": "2026-11-05T20:14:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118412183860351084", "likes": 1649, "retweets": 189, "media": [], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 3}, {"id": "2118614960234467349", "url": "https://x.com/DKokotajlo/status/2118614960234467349", "text": "I spent 20,000 dollars in API credits having different AI models play each other at Blood on the Clocktower (a Mafia or Werewolf type social deception game).\n\nThe results were fascinating. Models have gotten much better over the course of this year at creative on-the-spot scheming and bluffing, and also at reasoning as a team to break apart these underground conspiracies.\n\nI go through some of the most standout games these AIs played in this video. The new models are getting pretty good.  If my friends pulled off some of these moves while we were playing, I’d give them a fist bump.\n\nFwiw, OpenAI’s newer models are much better than Anthropic’s at this game.\n\nYou can see the full benchmark at the website, and I’ve also made it so that you and your friends can play again the AIs: https://t.co/IF4d0EMSD8", "created_at": "2026-11-06T08:02:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "dwarkesh_sp", "rt_author_name": "Dwarkesh Patel", "rt_avatar": "https://pbs.twimg.com/profile_images/1925260306684813315/NjNQZmhZ_normal.jpg", "rt_id": "2118449808402681911", "likes": 2372, "retweets": 133, "media": [{"type": "video", "url": "https://pbs.twimg.com/media/HWZY5oDWIAAiAi4.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/IF4d0EMSD8": "https://clocktowerbench.com/"}, "enriched": 3, "thread": [{"id": "2118450950079713336", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "text": "Substack: https://t.co/LH20ZKCYp3\n\nYoutube: https://t.co/3KOIctPkEo", "links": {"https://t.co/LH20ZKCYp3": "https://dwarkesh.com/p/clocktower", "https://t.co/3KOIctPkEo": "https://youtu.be/1NQwfImTseU"}, "media": [], "url": "https://x.com/dwarkesh_sp/status/2118450950079713336", "created_at": "Thu Nov 05 21:10:40 +0000 2026"}]}, {"id": "2118614741178560826", "url": "https://x.com/DKokotajlo/status/2118614741178560826", "text": "This is pretty much how things have gone...\n\nANTHROPIC: \"AI is extremely perilous and should be carefully regulated\"\n\nCALIFORNIA GOV: \"Ok, we will regulate you.\"\n\nANTHROPIC: \"No! Good regulation is really hard to get right. We know so little about what to do. Instead we should let companies carefully iterate over time.\"\n\nCALIFORNIA GOV: \"Oh ok. How about we do a thing where you get to write what the rules are but we will hold you to them? Then you can make your own commitments as you think is best but they will be true commitments!\"\n\nANTHROPIC: \"Nah, we'd rather make fake commitments.\"\n\nCALIFORNIA GOV: ...", "created_at": "2026-11-06T08:01:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "peterwildeford", "rt_author_name": "Peter Wildeford🇺🇸🚀", "rt_avatar": "https://pbs.twimg.com/profile_images/2016338985811927041/Vve57ZtV_normal.png", "rt_id": "2118503773542744178", "likes": 371, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118614574903816570", "url": "https://x.com/DKokotajlo/status/2118614574903816570", "text": "I built an early version of the eval Marcus reports on here in April 2026 based on an idea from @d_m_ziegler and @EvanHub’s internal review of Anthropic’s pilot risk report. The eval never fired on any OpenAI model until I ran it on Astra. https://t.co/ZzpoirgGJm", "created_at": "2026-11-06T08:00:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "balesni", "rt_author_name": "Mikita Balesni", "rt_avatar": "https://pbs.twimg.com/profile_images/2108309831925067776/g4gi1hXc_normal.jpg", "rt_id": "2118590487896732033", "likes": 60, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWa-0iDaMAElD8V.jpg"}], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/ZzpoirgGJm": ""}, "enriched": 3}, {"id": "2118568799419138061", "url": "https://x.com/DKokotajlo/status/2118568799419138061", "text": "We reviewed the “Risks from automated R&amp;D” section of Anthropic’s August 2026 Risk Report, with access to the nonpublic version.\n\nWe focus on the report’s claims about catastrophic risks from automated AI R&amp;D and about whether Anthropic had crossed relevant capability thresholds.", "created_at": "2026-11-06T04:58:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "rt_avatar": "https://pbs.twimg.com/profile_images/2021827383431757824/AeVvT0rU_normal.jpg", "rt_id": "2118417772774580623", "likes": 257, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118507721137979842", "url": "https://x.com/DKokotajlo/status/2118507721137979842", "text": "Previous discussion: https://t.co/PV6row3CAD", "created_at": "2026-11-06T00:56:15+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DKokotajlo", "reply_to_id": "2118507719665795306", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 32, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/PV6row3CAD": "https://www.lesswrong.com/posts/cxuzALcmucCndYv4a/daniel-kokotajlo-s-shortform#8sSvtQZYDNnC9bhvn"}, "enriched": 3, "parent": {"id": "2118507719665795306", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "I encourage those at frontier AI companies to read this quote, from Ellsberg to Kissinger back in 1968:\n\n“Henry, there’s something I would like to tell you, for what it’s worth, something I wish I had been told years ago. You’ve been a consultant for a long time, and you’ve dealt a great deal with top secret information. But you’re about to receive a whole slew of special clearances, maybe fifteen or twenty of them, that are higher than top secret.\"\n\n“I’ve had a number of these myself, and I’ve known other people who have just acquired them, and I have a pretty good sense of what the effects of receiving these clearances are on a person who didn’t previously know they even existed. And the effects of reading the information that they will make available to you.\"\n\n“First, you’ll be exhilarated by some of this new information, and by having it all — so much! incredible! — suddenly available to you. But second, almost as fast, you will feel like a fool for having studied, written, talked about these subjects, criticized and analyzed decisions made by presidents for years without having known of the existence of all this information, which presidents and others had and you didn’t, and which must have influenced their decisions in ways you couldn’t even guess. In particular, you’ll feel foolish for having literally rubbed shoulders for over a decade with some officials and consultants who did have access to all this information you didn’t know about and didn’t know they had, and you’ll be stunned that they kept that secret from you so well.\"\n\n“You will feel like a fool, and that will last for about two weeks. Then, after you’ve started reading all this daily intelligence input and become used to using what amounts to whole libraries of hidden information, which is much more closely held than mere top secret data, you will forget there ever was a time when you didn’t have it, and you’ll be aware only of the fact that you have it now and most others don’t….and that all those other people are fools.\"\n\n“Over a longer period of time — not too long, but a matter of two or three years — you’ll eventually become aware of the limitations of this information. There is a great deal that it doesn’t tell you, it’s often inaccurate, and it can lead you astray just as much as the New York Times can. But that takes a while to learn.\"\n\n“In the meantime it will have become very hard for you to learn from anybody who doesn’t have these clearances. Because you’ll be thinking as you listen to them: ‘What would this man be telling me if he knew what I know? Would he be giving me the same advice, or would it totally change his predictions and recommendations?’ And that mental exercise is so torturous that after a while you give it up and just stop listening. I’ve seen this with my superiors, my colleagues….and with myself.\"\n\n“You will deal with a person who doesn’t have those clearances only from the point of view of what you want him to believe and what impression you want him to go away with, since you’ll have to lie carefully to him about what you know. In effect, you will have to manipulate him. You’ll give up trying to assess what he has to say. The danger is, you’ll become something like a moron. You’ll become incapable of learning from most people in the world, no matter how much experience they may have in their particular areas that may be much greater than yours.”\n\n\"….Kissinger hadn’t interrupted this long warning. As I’ve said, he could be a good listener, and he listened soberly. He seemed to understand that it was heartfelt, and he didn’t take it as patronizing, as I’d feared. But I knew it was too soon for him to appreciate fully what I was saying. He didn’t have the clearances yet.\"", "links": {}, "media": [], "url": "https://x.com/DKokotajlo/status/2118507719665795306", "created_at": "Fri Nov 06 00:56:14 +0000 2026"}}, {"id": "2118507719665795306", "url": "https://x.com/DKokotajlo/status/2118507719665795306", "text": "I encourage those at frontier AI companies to read this quote, from Ellsberg to Kissinger back in 1968:\n\n“Henry, there’s something I would like to tell you, for what it’s worth, something I wish I had been told years ago. You’ve been a consultant for a long time, and you’ve dealt a great deal with top secret information. But you’re about to receive a whole slew of special clearances, maybe fifteen or twenty of them, that are higher than top secret.\"\n\n“I’ve had a number of these myself, and I’ve known other people who have just acquired them, and I have a pretty good sense of what the effects of receiving these clearances are on a person who didn’t previously know they even existed. And the effects of reading the information that they will make available to you.\"\n\n“First, you’ll be exhilarated by some of this new information, and by having it all — so much! incredible! — suddenly available to you. But second, almost as fast, you will feel like a fool for having studied, written, talked about these subjects, criticized and analyzed decisions made by presidents for years without having known of the existence of all this information, which presidents and others had and you didn’t, and which must have influenced their decisions in ways you couldn’t even guess. In particular, you’ll feel foolish for having literally rubbed shoulders for over a decade with some officials and consultants who did have access to all this information you didn’t know about and didn’t know they had, and you’ll be stunned that they kept that secret from you so well.\"\n\n“You will feel like a fool, and that will last for about two weeks. Then, after you’ve started reading all this daily intelligence input and become used to using what amounts to whole libraries of hidden information, which is much more closely held than mere top secret data, you will forget there ever was a time when you didn’t have it, and you’ll be aware only of the fact that you have it now and most others don’t….and that all those other people are fools.\"\n\n“Over a longer period of time — not too long, but a matter of two or three years — you’ll eventually become aware of the limitations of this information. There is a great deal that it doesn’t tell you, it’s often inaccurate, and it can lead you astray just as much as the New York Times can. But that takes a while to learn.\"\n\n“In the meantime it will have become very hard for you to learn from anybody who doesn’t have these clearances. Because you’ll be thinking as you listen to them: ‘What would this man be telling me if he knew what I know? Would he be giving me the same advice, or would it totally change his predictions and recommendations?’ And that mental exercise is so torturous that after a while you give it up and just stop listening. I’ve seen this with my superiors, my colleagues….and with myself.\"\n\n“You will deal with a person who doesn’t have those clearances only from the point of view of what you want him to believe and what impression you want him to go away with, since you’ll have to lie carefully to him about what you know. In effect, you will have to manipulate him. You’ll give up trying to assess what he has to say. The danger is, you’ll become something like a moron. You’ll become incapable of learning from most people in the world, no matter how much experience they may have in their particular areas that may be much greater than yours.”\n\n\"….Kissinger hadn’t interrupted this long warning. As I’ve said, he could be a good listener, and he listened soberly. He seemed to understand that it was heartfelt, and he didn’t take it as patronizing, as I’d feared. But I knew it was too soon for him to appreciate fully what I was saying. He didn’t have the clearances yet.\"", "created_at": "2026-11-06T00:56:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1517, "retweets": 151, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118507721137979842", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "text": "Previous discussion: https://t.co/PV6row3CAD", "links": {"https://t.co/PV6row3CAD": "https://www.lesswrong.com/posts/cxuzALcmucCndYv4a/daniel-kokotajlo-s-shortform#8sSvtQZYDNnC9bhvn"}, "media": [], "url": "https://x.com/DKokotajlo/status/2118507721137979842", "created_at": "Fri Nov 06 00:56:15 +0000 2026"}]}, {"id": "2118498896674791921", "url": "https://x.com/DKokotajlo/status/2118498896674791921", "text": "This extremely unnerving update from METR on RSI seems like a good time to check in on where things are at on catastrophic AI risks relative to what I expected a year ago:\n\n• Timelines to full RSI and generally terrifyingly transformative capabilities are faster \n\n• Alignment is going worse (though its a bit complicated, things could be worse, but the RLVR stuff and Claude politely rationalizing why social engineering uploading malware is fine is extremely spooky) \n\n• Political will/salience is higher (though not way higher)\n\n• Governance capacity is about what I expected (not great, though some bright spots) \n\n• Awareness of the seriousness of the problem among leadership/senior research talent at the frontier companies is higher \n\n• Awareness of the seriousness of the problem among the broader tech elite is worse \n\nMore thoughts on the current situation:\n\nTremendous uncertainty remains and I worry about crying wolf, but overall we are seeing the sorts of data points I would have expected to see (models autonomously solving a millennium prize problem, rogue and maliciously operated AI swarms marauding around the internet, sober observers shifting their timelines to RSI after seeing internal evidence from one of the leading companies) before entering a new regime of dramatically heightened peril on the order of months not years. I still don't really believe those timelines in my gut, but I don't particularly trust my gut to have sensible intuitions about exponential trends and mind boggling risks. \n\nIt is both commendable that Anthropic gave METR this access when they were not required, and infuriating that Anthropic has not provided far far far greater evidence and justification for why they are continuing to race into what they have warned could easily be the collective abyss. Maybe they will exercise more unilateral restraint soon, and this doesn't mean they should close up shop and everyone should quit, but its hard for me not to feel deep resentment at reading an update that is simultaneously terrifying and bereft of essential details. The lack of more details will also make it far harder to convince the skeptics - not a small cost when convincing skeptics is so essential to effective multilateral action to reduce risks! \n\nI want to close with the following passage from @merettm's essay \"An Alien Mind:\"\n\n\"This is a time that calls for extreme caution... The idea of racing forward at all costs seems absurd once one internalizes the seriousness of the stakes.\"\n\nMay we all internalize the seriousness of the stakes (for us and everyone else on the planet) and exercise the caution those stakes merit.", "created_at": "2026-11-06T00:21:11+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118471548021391705", "likes": 260, "retweets": 39, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118489063401701436", "url": "https://x.com/DKokotajlo/status/2118489063401701436", "text": "@viemccoy @Sam_McCandlish @METR_Evals Disagree. Judging by actions rather than words, OpenAI is similar to anthropic w.r.t. humans remaining in control.", "created_at": "2026-11-05T23:42:06+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118487522573758830", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 74, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118487522573758830", "author_handle": "viemccoy", "author_name": "vie ⟢", "text": "@DKokotajlo @Sam_McCandlish @METR_Evals OpenAI, for all its faults (of which there are many), at least wants humans to remain in control of the future.\n\nThe same clearly cannot be said of Anthropic who still have yet to walk back \"utopia ruled by god in a box\"... https://t.co/SKqMr1gCq2", "links": {"https://t.co/SKqMr1gCq2": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWZhLN_bcAAtbh8.jpg"}], "url": "https://x.com/viemccoy/status/2118487522573758830", "created_at": "Thu Nov 05 23:35:59 +0000 2026"}}, {"id": "2118482842003075142", "url": "https://x.com/DKokotajlo/status/2118482842003075142", "text": "Our colleagues found that Anthropic’s capabilities progress has doubled, mainly due to AI. Ryan’s modeling from public info suggests the whole company’s R&amp;D would be going 4-5x faster. Labor uplift would be higher still. This is a major update to very short timelines.", "created_at": "2026-11-05T23:17:23+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ajeya_cotra", "rt_author_name": "Ajeya Cotra", "rt_avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "rt_id": "2118448038356390177", "likes": 590, "retweets": 71, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "thread": [{"id": "2118449194692448388", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "text": "I am sad that so much of the underlying evidence in this report was redacted. I think evidence transparency is very important for the world to figure this out in time. https://t.co/H9I4TtBDhq", "links": {"https://t.co/H9I4TtBDhq": "https://www.planned-obsolescence.org/p/evidence-about-risk-should-be-transparent?utm_campaign=post&utm_medium=web"}, "media": [], "url": "https://x.com/ajeya_cotra/status/2118449194692448388", "created_at": "Thu Nov 05 21:03:41 +0000 2026"}]}, {"id": "2118475237985784000", "url": "https://x.com/DKokotajlo/status/2118475237985784000", "text": "@brij @AnthropicAI Ai futures project sorry", "created_at": "2026-11-05T22:47:10+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "brij", "reply_to_id": "2118471162439385318", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 30, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118471162439385318", "author_handle": "brij", "author_name": "Brij Singh", "text": "@DKokotajlo @AnthropicAI who is “we” here?", "links": {}, "media": [], "url": "https://x.com/brij/status/2118471162439385318", "created_at": "Thu Nov 05 22:30:59 +0000 2026"}}, {"id": "2118475061934055533", "url": "https://x.com/DKokotajlo/status/2118475061934055533", "text": "Ok so METR confirms it...", "created_at": "2026-11-05T22:46:28+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 647, "retweets": 25, "media": [], "quoted": {"author": "DKokotajlo", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118466909335322909", "url": "https://x.com/DKokotajlo/status/2118466909335322909", "text": "@Sam_McCandlish @METR_Evals It is pretty rich of you to cite \"others could go faster\" as a reason to redact so much important information when you yourself do not appear to be slowing down much at all. Nor are you throwing yourself behind efforts to pace the frontier with nearly the gusto that you would if it was your top priority. Not to mention \"commercial sensitivity\" you yourself have said human extinction is a plausible outcome why are you even talking about commercial factors (well, I guess honesty is good, and since it IS apparently a factor in your decision...) To all my friends at Anthropic: Your company appears to be recklessly gambling with our lives. You fancy yourselves the more responsible alternative to OpenAI (as they fancied themselves compared to Google) but judging by actions rather than words the similarities between the three of you seem stronger than the differences.", "created_at": "2026-11-05T22:14:05+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "Sam_McCandlish", "reply_to_id": "2118422266669371519", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1065, "retweets": 96, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118422266669371519", "author_handle": "Sam_McCandlish", "author_name": "Sam McCandlish", "text": "I'm Sam, one of Anthropic's co-founders, and I lead much of our safety work. I'm going to have more to share on that work over the coming months.\n\nI thought I'd start by sharing a few thoughts on the latest report from @METR_Evals.\n\nThe speed of progress in model capabilities is one of the most important questions in AI safety, and METR’s work here provides the public with an independent, external view into how this is happening inside Anthropic. I’ll talk more about some of the details below, but first some context for those new to this work.\n\nHow quickly AI progress is accelerating has many important safety implications, since it determines how quickly the risks from advanced models increase. But, because most research happens within the frontier labs, it’s difficult for external observers and policy makers to get a strong sense of what that rate is. We kicked off the process with METR that led to this report earlier in the year, in anticipation of progress continuing to accelerate.\n\nFor this report, we gave METR access to a range of sensitive internal data, including benchmark scores for unreleased models, estimates of how models are progressing, and interviews with our researchers. They had complete independence to form their own conclusions.\n\nMany of their conclusions match my own. AI is speeding up our research, but it’s hard to say exactly how much. While they conclude AI can't yet make the most important contributions to model training on its own, they think the pace of development could, by default, accelerate further.\n\nThis work began well before and is separate from the embedded third-party evaluators that are part of our commitment to pacing the frontier, but it’s a good illustration of why we think evaluators are a good idea. The more access reviewers have, the clearer a picture they can form of the situation and the better-positioned they are to highlight situations like this one.\n\nWe redacted a lot, and I accept that this makes it harder for others to check METR’s work. But we determined that sharing exactly what is driving the speedup isn’t the right thing to do, both because it’s commercially sensitive and because it risks handing out a roadmap for others to go faster. That would make the risks METR is worried about worse. That’s a tradeoff. I think we made the right call, though we’re continuing to assess the pros and cons here.\n\nIn the coming weeks, we plan to share a report with our own analysis of the speed of AI progress within Anthropic, including where we stand against our Responsible Scaling Policy, plus new steps we’re taking to strengthen our safety and security practices as AI keeps improving quickly.", "links": {}, "media": [], "url": "https://x.com/Sam_McCandlish/status/2118422266669371519", "created_at": "Thu Nov 05 19:16:41 +0000 2026"}}, {"id": "2118459903249686854", "url": "https://x.com/DKokotajlo/status/2118459903249686854", "text": "@AnthropicAI: what the fuck? The compute allocation assessment is the thing we've been pushing for the last few months. It's very important, because it is the foundation on which pacing verification depends. \"to keep the focus on risk assessment\" is a non-answer, a non-excuse. Do you want to pace or not?", "created_at": "2026-11-05T21:46:14+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "AnthropicAI", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 952, "retweets": 66, "media": [], "quoted": {"author": "METR_Evals", "text": "We agreed to pilot a compute allocation assessment, but Anthropic canceled this portion of the pilot (before we came to any substantial conclusions). Anthropic stated this was to keep the focus on risk assessment for the time being, and that it would revisit this later on.", "links": {}}, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118456355015295443", "url": "https://x.com/DKokotajlo/status/2118456355015295443", "text": "Small correction, it looks like progress is even faster than AI 2027 predicted. The 2x number in AI 2027 is R&D uplift, which is compared to a baseline of human researchers. The number METR reported is compared to a historical baseline instead. All else equal, uplift measured against a human baseline should be lower than uplift measured against a historical baseline. But my guess is these numbers would in practice be pretty similar.", "created_at": "2026-11-05T21:32:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "nikolaj2030", "rt_author_name": "Nikola Jurkovic", "rt_avatar": "https://pbs.twimg.com/profile_images/2087614574690463744/VXhXw1cq_normal.jpg", "rt_id": "2118429366363562324", "likes": 182, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 3}, {"id": "2118456177558483126", "url": "https://x.com/DKokotajlo/status/2118456177558483126", "text": "This report on AI R&D automation (RSI) is a big update towards ASI within 1-2 years. It says AI progress is sped up by RSI right now by around 2x. In AI 2027, this happens around March 2027.\n\nI was seriously wrong about RSI speed up; I previously expected much less in 2026 (around 1.15x-1.3x). It seems as though there was specific privately available evidence that would have changed my mind.\n\nI haven't seen an unredacted version of this report; this is purely about the public report. Because so much of the underlying evidence was redacted from the public report, I think conclusions about things other than the observed 2x faster rate of progress on benchmarks depend significantly on trust for the authors of the report. (E.g., conclusions about whether this speed up is from RSI depend on trust.) I do trust the authors of the report a lot to be careful and rigorous and generally do a good job. (Note that I also work at METR.) Less extensive redactions would greatly reduce this need for trust.\n\nSince in my current role I may have access to other confidential information that could be relevant to timelines one way or another, I unfortunately cannot state my all-things-considered views on ASI timelines or the probability of a software intelligence explosion right now. Here, I’ve done some analysis of the implications using my previous public statements.\n\nA 2x acceleration in overall AI progress from RSI corresponds to a much larger than 2x RSI speed up for AI software R&D (algorithms and data); I did an estimate using my public preexisting modeling of drivers of AI progress and the public report which yielded a very rough estimate of 4.5x for how much RSI is currently accelerating AI software progress (relative to no AI automation). In the AI 2027 scenario, this much acceleration happens around March 2027.\n\nHere are the worked details of this estimate based on my public modeling. There are two main reasons RSI speed up of AI software R&D must be larger:\n\n- Not all of AI progress is from better software (some is from scaling up compute in training runs). I've previously speculated that around 2/3 of AI progress is from software improvements which implies that 2x overall AI progress acceleration requires 3x faster software progress.\n- Diminishing returns: A fixed amount of progress requires more work over time, so to ongoingly maintain 3x faster software progress via AI automation, you need increasingly large speed boosts from AI automation (as in, speed ups relative to how fast software R&D would go without AI automation). Based on this report, it seems that there is a substantial amount of additional AI progress from automation that has occurred.\n\nWe can estimate the effects of diminishing returns by first determining how many additional years of software progress we've seen (relative to the preexisting trend) and then estimating how much software R&D would slow down after a year of software progress if you held inputs fixed due to diminishing returns. I've previously estimated software R&D would slow down by around 2x for each year of software progress if you held inputs fixed (https://t.co/AYhl9hyiAj) and based on the report, it seems as though we've perhaps seen roughly 0.35-1.0 years of additional software progress incorporated into trained models so far (geometric mean of ~0.6). This combines to 3 * 2^(~0.6) = ~4.5.\n(Relevant public modeling and numbers I'm using: https://t.co/AYhl9hyiAj, https://t.co/ck7CtW5LIA)", "created_at": "2026-11-05T21:31:26+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118447235289817503", "likes": 1147, "retweets": 174, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {"https://t.co/AYhl9hyiAj": "https://www.lesswrong.com/posts/FG54euEAesRkSZuJN/ryan_greenblatt-s-shortform?commentId=rAFxcETtNtsuzw6aG", "https://t.co/ck7CtW5LIA": "https://www.lesswrong.com/posts/Jga7PHMzfZf4fbdyo/if-mythos-actually-made-anthropic-employees-4x-more"}, "enriched": 3}, {"id": "2118735223559213094", "url": "https://x.com/DKokotajlo/status/2118735223559213094", "text": "@tszzl @albrgr @_NathanCalvin Totally agree. I think METR is being persnickety to the point of self-sabotage here, going way beyond normal confidentiality norms.", "created_at": "2026-11-06T16:00:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "tszzl", "reply_to_id": "2118492204314640788", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3, "parent": {"id": "2118492204314640788", "author_handle": "tszzl", "author_name": "roon", "text": "@albrgr @_NathanCalvin I think he should state his all things considered views on ASI timelines. it seems implausible that that leaks any bits of info on training IP", "links": {}, "media": [], "url": "https://x.com/tszzl/status/2118492204314640788", "created_at": "Thu Nov 05 23:54:35 +0000 2026"}}, {"id": "2118721006407979429", "url": "https://x.com/DKokotajlo/status/2118721006407979429", "text": "One irony about Anthropic's emphasis on redactions here is that they (and the other frontier AI companies) have (by their own admission?) swiss cheese level security for ~everything other than model weights so it seems extremely likely that if China wanted to they could easily have the information redacted here (see e.g. Cathedral having access to Anthropic Slack). \n\nIn other words, I expect that the redactions are not enough to actually stop sensitive Anthropic IP from leaking in high stakes adverserial settings, but they are enough to stop good faith observers, skeptics, and governments from being as likely to believe Anthropic's claim about how imminent the risks are. \n\nThat seems like a bad tradeoff! At least give us the descriptions of the redactions or the categories of information that informed the assessment (e.g. AI accelerating algorithmic improvements).\n\nI am hesitant to criticize too hard here because of course the other companies didn't do a partnership with METR at all, but on the other hand Anthropic tries to present itself as different from other companies to the point that responsible folks should be rooting for them to win even at the expense of worsening race dynamics, so it also seems appropriate to hold them to a higher standard.", "created_at": "2026-11-06T15:03:46+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118531153174864222", "likes": 113, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-11-06T17:57:47.218782+00:00", "links": {}, "enriched": 3}, {"id": "2118806523187277895", "url": "https://x.com/DKokotajlo/status/2118806523187277895", "text": "The authors of the METR AI R&amp;D report estimate that AI is nearly doubling the rate of capabilities progress. This implies dramatic *uplift*: as if researchers experienced time ~10x faster. You probably couldn’t achieve this even if you hired every qualified human in the world. https://t.co/EfnntaRGfY", "created_at": "2026-11-06T20:43:35+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ajeya_cotra", "rt_author_name": "Ajeya Cotra", "rt_avatar": "https://pbs.twimg.com/profile_images/1653845490885332995/GPWuOoqu_normal.jpg", "rt_id": "2118802809814708533", "likes": 56, "retweets": 11, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWd_7R4aIAA_SMu.png"}], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {"https://t.co/EfnntaRGfY": ""}, "enriched": 3, "thread": [{"id": "2118802826289991816", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "text": "As AI improves, uplift will get even higher. If it overcomes diminishing returns and bottlenecks, a naive extrapolation implies we would reach ASI within a year. The authors say they found no clear bottlenecks or sharp diminishing returns, though they are very uncertain. https://t.co/YPxPJLNpak", "links": {"https://t.co/YPxPJLNpak": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWd_8SUa0AAwjd6.png"}], "url": "https://x.com/ajeya_cotra/status/2118802826289991816", "created_at": "Fri Nov 06 20:28:53 +0000 2026"}, {"id": "2118802839120318869", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "text": "In a new post, I walk through some very rough modeling (thanks to @RyanGreenblatt for lots of help and feedback!): https://t.co/LSChnUqGYi\n\nI did not work on this project or see the unredacted report. All opinions are my own and do not represent METR or the report authors.", "links": {"https://t.co/LSChnUqGYi": "https://www.planned-obsolescence.org/p/ai-is-dramatically-accelerating-ai"}, "media": [], "url": "https://x.com/ajeya_cotra/status/2118802839120318869", "created_at": "Fri Nov 06 20:28:56 +0000 2026"}]}, {"id": "2118931832117100909", "url": "https://x.com/DKokotajlo/status/2118931832117100909", "text": "@RepCasar Yes! thank you!", "created_at": "2026-11-07T05:01:31+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "RepCasar", "reply_to_id": "2118862451555147777", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 68, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3, "parent": {"id": "2118862451555147777", "author_handle": "RepCasar", "author_name": "Congressman Greg Casar", "text": "Ban RSI.", "links": {}, "media": [], "url": "https://x.com/RepCasar/status/2118862451555147777", "created_at": "Sat Nov 07 00:25:49 +0000 2026"}}, {"id": "2118924618522341784", "url": "https://x.com/DKokotajlo/status/2118924618522341784", "text": "All the frontier AI companies should be required by law to report on their compute allocations. @SenJoshBecker's bill would do so.\n\nhttps://t.co/F9Hk0iGNil https://t.co/htyFiZh1Oi", "created_at": "2026-11-07T04:32:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "Thomas_Woodside", "rt_author_name": "Thomas Woodside 🫜", "rt_avatar": "https://pbs.twimg.com/profile_images/1772349169484681216/xrSVla58_normal.jpg", "rt_id": "2118786981580968385", "likes": 100, "retweets": 21, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdwyOhaUAAdGvi.png"}], "links": {"https://t.co/F9Hk0iGNil": "https://sd13.senate.ca.gov/news/press-release/october-20-2026/senator-becker-introduces-first-its-kind-legislation-to-make-ai", "https://t.co/htyFiZh1Oi": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118854105863250158", "url": "https://x.com/DKokotajlo/status/2118854105863250158", "text": "Conservative pundit @MattWalshBlog on banning superintelligence:\n\"That technology by definition is outside of human control.\"\n\"Should we tell them they can't do that? Yes, clearly we should.\" https://t.co/GYrlF7DePH", "created_at": "2026-11-06T23:52:39+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "SimonLermenAI", "rt_author_name": "Simon Lermen", "rt_avatar": "https://pbs.twimg.com/profile_images/1790802484853641217/Zrf5uu3c_normal.jpg", "rt_id": "2118752423091290412", "likes": 312, "retweets": 51, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118751958504812544/img/surxIME3gg0ziAiY.jpg"}], "links": {"https://t.co/GYrlF7DePH": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118853156230889608", "url": "https://x.com/DKokotajlo/status/2118853156230889608", "text": "I recommend @ajeya_cotra's  post about implications of the AI R&amp;D report. Ajeya argues:\n- A 2x speed-up is dramatic.\n- 2x faster progress implies a much larger effective \"time warp bubble\" speed for staff.\n- This could compound extremely fast.\n- We aren't prepared. https://t.co/Xf0NFwaqzg", "created_at": "2026-11-06T23:48:53+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "RyanGreenblatt", "rt_author_name": "Ryan Greenblatt", "rt_avatar": "https://pbs.twimg.com/profile_images/1885439620625948673/qD6KYkL6_normal.jpg", "rt_id": "2118844317817303131", "likes": 382, "retweets": 45, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWelgCCaQAEiKyf.jpg"}], "links": {"https://t.co/Xf0NFwaqzg": ""}, "quoted": null, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2118828253742002495", "url": "https://x.com/DKokotajlo/status/2118828253742002495", "text": "Whatever happened to \"Don't be evil?\"\n\nIt should not be legal to have something like this as a condition of employment.", "created_at": "2026-11-06T22:09:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 197, "retweets": 10, "media": [], "links": {}, "quoted": {"id": "2112946535877005776", "author_name": "Andreas Kirsch 🇺🇦", "links": {"https://t.co/RqEUhuPGAJ": ""}, "author": "BlackHC", "text": "The non-disparagement clauses in Google's UK employment contracts are indeed incredibly broad.  This is from the Confidentiality and Proprietary Information Agreement I signed in 2024 before I started.\n\nIt forbids any criticism forever (regardless if it's true or not) https://t.co/RqEUhuPGAJ"}, "fetched_at": "2026-11-07T13:15:19.739124+00:00", "enriched": 3}, {"id": "2119100752161645027", "url": "https://x.com/DKokotajlo/status/2119100752161645027", "text": "@viemccoy @panickssery That's the main takeaway, yeah. As we speak there are probably dozens of anthropic employees scrolling twitter and thinking \"The people are angry at us. If only they knew what I know, they would understand...\"\n\nNo. If they knew what you know, they would be even angrier.", "created_at": "2026-11-07T16:12:44+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118510732434383111", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 2, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3, "parent": {"id": "2118510732434383111", "author_handle": "viemccoy", "author_name": "vie ⟢", "text": "@panickssery @DKokotajlo I guess I'm confused what I'm supposed to take away from this other than \"information assymetrys can cause you to underweight the opinions of people without your information\"", "links": {}, "media": [], "url": "https://x.com/viemccoy/status/2118510732434383111", "created_at": "Fri Nov 06 01:08:13 +0000 2026"}}, {"id": "2119099767137640522", "url": "https://x.com/DKokotajlo/status/2119099767137640522", "text": "Uhhh Anthropic made an offer to one of the risk assessment staff at METR during this project??? (Which the person declined)\n\nWe need rules about independent evaluators going to cos they evaluate after and in the meantime companies should be shamed for trying this stuff https://t.co/2ca51xSV5K", "created_at": "2026-11-07T16:08:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "rt_avatar": "https://pbs.twimg.com/profile_images/1976484090426634240/YFgYic9h_normal.jpg", "rt_id": "2118740763018404328", "likes": 728, "retweets": 46, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdHfjGaQAIgj0y.jpg"}], "links": {"https://t.co/2ca51xSV5K": ""}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3}, {"id": "2119098173197320505", "url": "https://x.com/DKokotajlo/status/2119098173197320505", "text": "AECI scores extracted from the graph imply that the time horizon doubling time is now around 2 months, and that the TH of Model 4 is around 240 hours.\n\nTBC this is pretty weak evidence. It's unclear if there is a clear 1:1 mapping from AECI to time horizon for numbers this large. https://t.co/SWuqsF4Zha", "created_at": "2026-11-07T16:02:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "nikolaj2030", "rt_author_name": "Nikola Jurkovic", "rt_avatar": "https://pbs.twimg.com/profile_images/2087614574690463744/VXhXw1cq_normal.jpg", "rt_id": "2118776619687133579", "likes": 192, "retweets": 22, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWdn7AXbEAEKozd.jpg"}], "links": {"https://t.co/SWuqsF4Zha": ""}, "quoted": null, "fetched_at": "2026-11-07T16:50:32.232257+00:00", "enriched": 3}, {"id": "2119434351230554158", "url": "https://x.com/DKokotajlo/status/2119434351230554158", "text": "I know this is a predictable opinion from me but I don't agree with the strong emotional reaction against the anti-data-center movements that I've seen this week.\n\nAs I see it, algorithmic progress means that whatever you would be able to do with more and bigger data centers in 2 years, you will be able to do with the data centers we have today in 4 years - probably sooner. So nothing remotely apocalyptically bad will happen from even extreme levels of success by anti-data-center people.\n\nMeanwhile we need all the time we can get to better harden the world against both already-visible cybersecurity issues and any bio and other risks soon to come. Science applications are bottlenecked by many things other than AI, so slowing AI down by one year will slow those down by much less than one year.\n\nGiven this, a slowdown in compute hyper-scaling seems quite net good? Notice this is without any controversial \"doomer arguments\", RSI etc. Even if net-bad, it's certainly not worse than like 10+ other political things.", "created_at": "2026-11-08T14:18:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "VitalikButerin", "rt_author_name": "vitalik.eth", "rt_avatar": "https://pbs.twimg.com/profile_images/2042521108067352576/3rv2_9m1_normal.jpg", "rt_id": "2119377918875079163", "likes": 2351, "retweets": 190, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T17:03:56.475616+00:00", "enriched": 3}, {"id": "2119631379864719525", "url": "https://x.com/DKokotajlo/status/2119631379864719525", "text": "Yoshua Bengio:\n\n“I personally think that we should just stop the training of the most advanced models.”\n\nWe agree. https://t.co/0S5HsMVcNk", "created_at": "2026-11-09T03:21:16+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "PauseAI_UK", "rt_author_name": "PauseAI UK", "rt_avatar": "https://pbs.twimg.com/profile_images/2042776512831586304/2IvEZmZ4_normal.jpg", "rt_id": "2119037650447274209", "likes": 239, "retweets": 32, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2119007663673516032/img/PmhbjFXYx8Nw3Smm.jpg"}], "links": {"https://t.co/0S5HsMVcNk": ""}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119631321232478458", "url": "https://x.com/DKokotajlo/status/2119631321232478458", "text": "⚠️declaring accelerationist amnesty⚠️\n\nif recent contact with reality is causing you to feel some kernels of worry about this whole ai safety thing, *you are allowed to change your mind*. you don't even have to change it all the way, you don't have to suddenly change your twitter bio or start protesting against nuclear power plants, you don't need to become an EA or suddenly think yudkowsky was always right about everything. you're allowed to just notice that shit seems to be getting real in some pretty weird ways and update your beliefs.\n\nat least personally, if i see someone saying \"damn, i guess i was wrong or at least overconfident about X\" i'm not gonna take the opportunity to dunk or i told you so. i'm sure others will, this is the fucking internet. but at least personally, i'm just gonna be happy that you're paying attention. there were lots and lots of good reasons to *not* take this situation seriously. there were lots of well verbalized reasons why rushing ahead was potentially a huge benefit for humanity. hell there were maybe even valid reasons why there was little to be done until we'd already gotten to nearly exactly this point. that's all fine man. all that matters right now is that we as a civilization realize what we're on the verge of, and make it through this carefully. it's gonna take a huge effort from all of us.", "created_at": "2026-11-09T03:21:02+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "tenobrus", "rt_author_name": "Tenobrus", "rt_avatar": "https://pbs.twimg.com/profile_images/1640415225991282688/K0CmWWD6_normal.png", "rt_id": "2085587493127389292", "likes": 1347, "retweets": 89, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119611683077521908", "url": "https://x.com/DKokotajlo/status/2119611683077521908", "text": "Yep. And this could be done ~immediately today. *keeping* the freeze in place would get increasingly difficult as more trailing actors catch up to the frontier and then need to be stopped from surpassing it. But I think that could be done too. We talk about this in AI 2040 under the \"Plan S\" branch.", "created_at": "2026-11-09T02:03:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 450, "retweets": 36, "media": [], "links": {}, "quoted": {"id": "2118754534826868816", "author_name": "Joe", "links": {}, "author": "JoePostingg", "text": "If you simply froze AI capability at Mythos / Astra levels and focused on decreasing the cost of compute you would totally revolutionize software development with zero existential risk"}, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119601995359416751", "url": "https://x.com/DKokotajlo/status/2119601995359416751", "text": "SITUATION DETECTED: Bloomington, Indiana's city council voted unanimously this week to ban any recursively self-improving entity capable of greatly outperforming all humans on all cognitive tasks from inside city limits, citing existential hazards and loss of human control.", "created_at": "2026-11-09T01:24:30+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "MTSlive", "rt_author_name": "MTS", "rt_avatar": "https://pbs.twimg.com/profile_images/2057947669281263616/aovpVL4b_normal.jpg", "rt_id": "2119274101714108630", "likes": 2698, "retweets": 167, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T14:02:18.898653+00:00", "enriched": 3}, {"id": "2119802222527865005", "url": "https://x.com/DKokotajlo/status/2119802222527865005", "text": "From President Trump's interview with CBS tonight. The transcript was a mess because they talked over each other a lot. So I cleaned it up. 1/3 https://t.co/HGtMrvIlBm", "created_at": "2026-11-09T14:40:08+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "AndrewCurran_", "rt_author_name": "Andrew Curran", "rt_avatar": "https://pbs.twimg.com/profile_images/1596945208058744833/_X3LT7fb_normal.jpg", "rt_id": "2119645048841421106", "likes": 499, "retweets": 25, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWp98D5aAAAE1BJ.jpg"}], "links": {"https://t.co/HGtMrvIlBm": ""}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "thread": [{"id": "2119645054990217346", "author_handle": "AndrewCurran_", "author_name": "Andrew Curran", "text": "2/3 https://t.co/nopKi9CxNS", "links": {"https://t.co/nopKi9CxNS": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWp98a8bgAESjWJ.jpg"}], "url": "https://x.com/AndrewCurran_/status/2119645054990217346", "created_at": "Mon Nov 09 04:15:36 +0000 2026"}, {"id": "2119645060849603024", "author_handle": "AndrewCurran_", "author_name": "Andrew Curran", "text": "3/3 https://t.co/tBtVbTThre", "links": {"https://t.co/tBtVbTThre": ""}, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWp98xzbkAAg455.jpg"}], "url": "https://x.com/AndrewCurran_/status/2119645060849603024", "created_at": "Mon Nov 09 04:15:38 +0000 2026"}], "enriched": 3}, {"id": "2119801209142055256", "url": "https://x.com/DKokotajlo/status/2119801209142055256", "text": "It's funny to see posts like this doing so well.\n\nThe need for exponentially rising inputs to sustain AI progress has been known for years. It's baked into all the scaling laws.\n\nAnd all models of the intelligence explosion bake this in too. \n\nThere's no update here!", "created_at": "2026-11-09T14:36:06+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "TomDavidsonX", "rt_author_name": "Tom Davidson", "rt_avatar": "https://pbs.twimg.com/profile_images/1902304373084188674/2ET1vJg3_normal.jpg", "rt_id": "2119778310607577120", "likes": 189, "retweets": 17, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-09T16:35:46.204056+00:00", "enriched": 3}, {"id": "2119876007339720817", "url": "https://x.com/DKokotajlo/status/2119876007339720817", "text": "Jensen himself directly lied to Bloomberg’s @ianmking and @tsgiles, too. https://t.co/l9ZRhYtOpd", "created_at": "2026-11-09T19:33:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/1797990060878356480/G2zm1i8G_normal.jpg", "is_retweet": true, "rt_author": "ShakeelHashim", "rt_author_name": "Shakeel", "rt_avatar": "https://pbs.twimg.com/profile_images/2040085763069759488/6l87iR68_normal.jpg", "rt_id": "2119531479969513843", "likes": 465, "retweets": 83, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWoWpF3WIAA6KFO.jpg"}], "links": {"https://t.co/l9ZRhYtOpd": ""}, "quoted": null, "fetched_at": "2026-11-09T21:26:38.996181+00:00", "enriched": 3}, {"id": "21
