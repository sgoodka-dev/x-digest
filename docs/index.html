5+00:00", "links": {"https://t.co/iPHZRHO3y0": ""}, "enriched": 1}, {"id": "2118182477571215388", "url": "https://x.com/deanwball/status/2118182477571215388", "text": "potus understands https://t.co/h9RqObSJQ9", "created_at": "2026-11-05T03:23:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "deanwball", "reply_to_id": "2118181982060339340", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 12, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWVLvMyWYAETuMr.jpg"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/h9RqObSJQ9": ""}, "enriched": 1}, {"id": "2118181982060339340", "url": "https://x.com/deanwball/status/2118181982060339340", "text": "When asked for his comments on the midterm election results, Ball turned around, straightened his tie, and said:\n\n“Okay, look, I’ve been thinking. There’s a compromise to be had here. A deal to be made. A grand bargain to be struck.\n\n“We allow high-gloss European paints back into America, but only on exterior surfaces. No plausibly problematic chemicals inside American homes, pleasant exteriors to walk and drive by. It’s really exterior trim where paints like Hollandlac Brilliant shine, pardon the pun, anyway. I’ve always thought kitchen cabinets painted with it looked a little fussy, you know, a little bit cute.”", "created_at": "2026-11-05T03:21:53+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 80, "retweets": 2, "media": [], "quoted": {"author": "deanwball", "text": "Pressed for his response on the latest developments in the conflict between Anthropic and the U.S. government, Ball said, “the deepest tragedy, really, is white paint. You can’t buy true white paint anymore in the United States, can you believe that? You know, the lead carbonate, that warm white that every old master built their portraits from. You just can’t buy that. By contrast, we Americans, under the thumb of the EPA and the various state-government nannies, are left to paint our walls with these unearthily bright whites, like the face of a dead man, everywhere we turn our eyes.”", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118169534444273736", "url": "https://x.com/deanwball/status/2118169534444273736", "text": "@viemccoy It will last, it will just cost more", "created_at": "2026-11-05T02:32:25+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "viemccoy", "reply_to_id": "2118136848845607136", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 39, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118153477406736845", "url": "https://x.com/deanwball/status/2118153477406736845", "text": "In no particular order: PS2, iPod gen 2, 12 inch PowerBook, 8800 GTX, OG iPhone, Firefox, Gmail, Google Docs, iPhone 4, iPhone X, MacBook Air M1, GPT-4, Opus 3/4.5, o3, Astra, BOTW, GTA V, Elder Scrolls. A special place in my heart for them all.", "created_at": "2026-11-05T01:28:37+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 63, "retweets": 1, "media": [], "quoted": {"author": "deanwball", "text": "Astra is one of my favorite technology releases of all time and I’d be saying that regardless of whether I worked at OpenAI. In fact, if I didn’t work at OpenAI, I’d surely be talking about how wonderful I find Astra much more.", "links": {}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118149203616497991", "url": "https://x.com/deanwball/status/2118149203616497991", "text": "Astra is one of my favorite technology releases of all time and I’d be saying that regardless of whether I worked at OpenAI. In fact, if I didn’t work at OpenAI, I’d surely be talking about how wonderful I find Astra much more.", "created_at": "2026-11-05T01:11:38+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 164, "retweets": 1, "media": [], "quoted": {"author": "EpochAIResearch", "text": "With better uncertainty estimates and a joint distribution over all models’ ECIs, we can now compare models directly.\n\nFor example, we can now say Astra has a 72% probability of being more capable than Opus 5.5, but a 99% probability of being more capable than Fable 5.1. https://t.co/RsPPblSLRM", "links": {"https://t.co/RsPPblSLRM": ""}}, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118148043010953246", "url": "https://x.com/deanwball/status/2118148043010953246", "text": "With better uncertainty estimates and a joint distribution over all models’ ECIs, we can now compare models directly.\n\nFor example, we can now say Astra has a 72% probability of being more capable than Opus 5.5, but a 99% probability of being more capable than Fable 5.1. https://t.co/RsPPblSLRM", "created_at": "2026-11-05T01:07:01+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "rt_avatar": "https://pbs.twimg.com/profile_images/1866142753127616512/DYcE9bN1_normal.jpg", "rt_id": "2118093707983692105", "likes": 137, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWT7AMVb0AAIlEA.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/RsPPblSLRM": ""}, "enriched": 1}, {"id": "2118142184146788378", "url": "https://x.com/deanwball/status/2118142184146788378", "text": "We are now allocating a significant amount of our frontier compute towards discovering and patching vulnerabilities in open source codebases, fully pro bono.\n\nIn one case, we studied the Linux kernel, which is a particularly load-bearing piece of software at OpenAI.\n\nBefore AI, security researchers might discover ~20 local privilege escalation (LPE) vulnerabilities in Linux in a typical year.\n\nIn one week's time, our upcoming frontier cyber model was able to find ~1000 LPE vulnerabilities using about $1M of tokens. In the process, it was able to discover at least 10 novel classes of Linux exploitation techniques.", "created_at": "2026-11-05T00:43:44+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Eric_Wallace_", "rt_author_name": "Eric Wallace", "rt_avatar": "https://pbs.twimg.com/profile_images/1705599599761887232/YN3sqrvw_normal.jpg", "rt_id": "2118123944251453949", "likes": 1168, "retweets": 113, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118142005888905548", "url": "https://x.com/deanwball/status/2118142005888905548", "text": "btw I think people are reading the wrong lesson from this. “sandbagging safety research” sounds a bit like a grand scheme to thwart alignment, but it’s more like the model is uncomfortable training other models to jailbreak or similar", "created_at": "2026-11-05T00:43:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2118132353336045710", "likes": 449, "retweets": 23, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118141927740907620", "url": "https://x.com/deanwball/status/2118141927740907620", "text": "Our goal is to help defenders find and fix vulnerabilities before attackers can use them. We’re working with Linux maintainers and Patch the Planet partners on reports and patches.\n\nhttps://t.co/vXCImlBCWE", "created_at": "2026-11-05T00:42:43+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2118119463161905362", "likes": 621, "retweets": 31, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/vXCImlBCWE": "https://openai.com/index/a-thousand-fewer-paths-to-root/"}, "enriched": 1}, {"id": "2118110190071677263", "url": "https://x.com/deanwball/status/2118110190071677263", "text": "At the very least people who told you that serious democratic contestation was going to disappear (because of mass immigration or left-elite cultural power or Trumpist authoritarianism or the undemocratic Constitution) have been consistently mistaken.\nhttps://t.co/lfj7mzSQJS", "created_at": "2026-11-04T22:36:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "Douthat60", "rt_author_name": "Ross Douthat", "rt_avatar": "https://pbs.twimg.com/profile_images/2097408787468656640/OdhW4Pul_normal.jpg", "rt_id": "2118089658076741683", "likes": 978, "retweets": 85, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/lfj7mzSQJS": "https://x.com/patrickc/status/2118081177492066485"}, "linked": [{"id": "2118081177492066485", "author_handle": "patrickc", "author_name": "Patrick Collison", "text": "It seems to me that democracy has on the whole worked very well in America over the last decade, and perhaps better than in any other major country in the West. National outcomes have repeatedly been responsive to underlying voter preferences on meaningful questions, and significant changes in policy have ensued. I’ve been reading Democracy in America this past week, and it’s striking how much it still rhymes nearly two centuries later.", "links": {}, "media": [], "url": "https://x.com/patrickc/status/2118081177492066485"}], "enriched": 1}, {"id": "2118389663643873356", "url": "https://x.com/deanwball/status/2118389663643873356", "text": "Even more great developments in federal biosafety today—an NSF program for function-based nucleic acid screening, which could end up being a critical tool in next-generation screening.", "created_at": "2026-11-05T17:07:08+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 49, "retweets": 8, "media": [], "quoted": {"author": "NSF", "text": "NSF announces a new funding opportunity in bioengineering through NSF X-labs — From Sequence to Function. \n\nTeams working to accelerate breakthroughs in understanding the relationship between biological sequence and function are invited to apply.\n\nhttps://t.co/rHniOz58OT", "links": {"https://t.co/rHniOz58OT": "https://brnw.ch/21x6V31"}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118366488923107838", "url": "https://x.com/deanwball/status/2118366488923107838", "text": "Fantastic news! This is a crucial step to bringing about the biotechnology future we all dream of while lowering the risks of misuse. Congratulations to everyone in USG who brought this to fruition!", "created_at": "2026-11-05T15:35:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 106, "retweets": 9, "media": [], "quoted": {"author": "mkratsios47", "text": "Today, we released the National Policy for Nucleic Acid Synthesis Screening to protect American biotechnology innovation while reducing the risk of misuse. \n\nThis policy establishes a new, government-wide screening requirements for synthetic DNA and the equipment used to make it. It will ensure companies selling nucleic acid sequences and synthesis equipment know their customers and prevent the malicious use of these materials and tools.\n\nThis policy strengthens our Nation’s biosecurity posture by establishing rigorous U.S. government-wide procurement screening and physical security standards for synthetic biology. It replaces outdated “self-attestation” systems with robust, independent verification. It creates a dynamic, SI-powered screening layer that assesses the biological risk from nucleic acid sequences, allowing the U.S. to anticipate and prevent malicious use and help stop dangerous gain-of-function research. \n\n@NIST will issue rigorous new screening standards and @HHSGov and @USDA will certify synthetic biology providers. Together, these measures will strengthen American biosecurity, safeguard responsible innovation, and establish a global standard for safe and transparent synthetic biology tools and research.", "links": {}}, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118366089537376634", "url": "https://x.com/deanwball/status/2118366089537376634", "text": "Today, we released the National Policy for Nucleic Acid Synthesis Screening to protect American biotechnology innovation while reducing the risk of misuse. \n\nThis policy establishes a new, government-wide screening requirements for synthetic DNA and the equipment used to make it. It will ensure companies selling nucleic acid sequences and synthesis equipment know their customers and prevent the malicious use of these materials and tools.\n\nThis policy strengthens our Nation’s biosecurity posture by establishing rigorous U.S. government-wide procurement screening and physical security standards for synthetic biology. It replaces outdated “self-attestation” systems with robust, independent verification. It creates a dynamic, SI-powered screening layer that assesses the biological risk from nucleic acid sequences, allowing the U.S. to anticipate and prevent malicious use and help stop dangerous gain-of-function research. \n\n@NIST will issue rigorous new screening standards and @HHSGov and @USDA will certify synthetic biology providers. Together, these measures will strengthen American biosecurity, safeguard responsible innovation, and establish a global standard for safe and transparent synthetic biology tools and research.", "created_at": "2026-11-05T15:33:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "mkratsios47", "rt_author_name": "Director Michael Kratsios", "rt_avatar": "https://pbs.twimg.com/profile_images/2036415476335833088/WPlUcJxT_normal.jpg", "rt_id": "2118365268342652934", "likes": 826, "retweets": 168, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXxIGyXQAAMlJ4.jpg"}], "quoted": null, "fetched_at": "2026-11-05T18:45:11.192238+00:00", "links": {}, "enriched": 1}, {"id": "2118439860575027511", "url": "https://x.com/deanwball/status/2118439860575027511", "text": "Voters delivered an overwhelming message on data centers this week, and it is incumbent upon industry actors to hear that message and respond to it by building AI infrastructure in ways that benefit both individual communities and the country as a whole.", "created_at": "2026-11-05T20:26:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 108, "retweets": 5, "media": [], "quoted": {"author": "OpenAINewsroom", "text": "The communities that host AI infrastructure should have a say in how it’s built and share in the benefits.\n\nToday we’re announcing new commitments to the communities where we build, along with policy proposals for responsible AI infrastructure.\n\nhttps://t.co/rSGc0iIj6i", "links": {"https://t.co/rSGc0iIj6i": "https://openai.com/index/setting-new-standard-responsible-ai-infrastructure/"}}, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118420194292887605", "url": "https://x.com/deanwball/status/2118420194292887605", "text": "We cut through the mystery around interpretability in training.\n\nA single, mathematically rigorous framework transforms model internals into training feedback and works across domains, problems, and modalities.\n\nWe call this *mechanistic shaping*, and we’ve used it to mitigate reward hacking, remove shortcuts in chest x-rays, and reduce sycophancy and harmfulness. We believe this is a big step forward for technical alignment.\n\nBut it carries a known risk: training against a model’s internals can make it harder to monitor. We explore both the technique and this concern below. 🧵", "created_at": "2026-11-05T19:08:27+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "GoodfireAI", "rt_author_name": "Goodfire", "rt_avatar": "https://pbs.twimg.com/profile_images/1892027414768910341/4VDlUa3M_normal.png", "rt_id": "2118393112737591387", "likes": 806, "retweets": 99, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2118393092026028032/img/BrLWZKd1kn32gHQT.jpg"}], "quoted": null, "fetched_at": "2026-11-05T21:28:33.291434+00:00", "links": {}, "enriched": 1}, {"id": "2118676136884379690", "url": "https://x.com/deanwball/status/2118676136884379690", "text": "&gt; Can't tell if RSI is happening from the outside \n&gt; Go on the inside to figure out if RSI is happening \n&gt; Still can't figure out if RSI is happening\n&gt; mfw people are running around confidently preaching RSI is happening", "created_at": "2026-11-06T12:05:28+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "AlexTPet", "rt_author_name": "Alex Petropoulos 🤠", "rt_avatar": "https://pbs.twimg.com/profile_images/2106384174131154944/rtPBnpTj_normal.jpg", "rt_id": "2118460842853138828", "likes": 113, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118675528186245350", "url": "https://x.com/deanwball/status/2118675528186245350", "text": "As I have written many times in the past years, any potential financial downturn in AI stocks will not greatly change the AI trajectory\n\nAI is not going away, companies are not slowing down adoption nor is development slowing. We still need policy &amp; effort so that AI is used well", "created_at": "2026-11-06T12:03:03+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "emollick", "rt_author_name": "Ethan Mollick", "rt_avatar": "https://pbs.twimg.com/profile_images/1601382188712398850/3AAOlqrX_normal.jpg", "rt_id": "2118497026329518238", "likes": 714, "retweets": 37, "media": [], "quoted": null, "fetched_at": "2026-11-06T14:24:13.594962+00:00", "links": {}, "enriched": 1}, {"id": "2118805270755422685", "url": "https://x.com/deanwball/status/2118805270755422685", "text": "@NinaDSchick One of many reasons!", "created_at": "2026-11-06T20:38:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "NinaDSchick", "reply_to_id": "2118804742642257944", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118799206785937844", "url": "https://x.com/deanwball/status/2118799206785937844", "text": "I am a broken record about this, but: frontier agents are not going to be a purely digital phenomenon for much longer. They will be able to use anything in the physical world that can be actuated programmatically—first competently, then at human-expert level, then superhuman. By and large, we probably won’t need specialist models; the frontier models will just do it. If your model of the future hinges on physical AI happening “for real” many years into the future, I think you will be in for a surprise.", "created_at": "2026-11-06T20:14:30+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 168, "retweets": 24, "media": [], "quoted": {"author": "dhvanil", "text": "i went to bed and asked claude to paint an autumn tree overnight.\n\nat around 4am, it realised that it didn't have some shades -- so it stopped and titrated its own paint: diluting red, sienna and madder step by step on a second palette, then measuring each pocket from a photo.\n\nwoke up to this beautiful watercolor painting. 303 brush marks, took about 4.5 hours 🍂 (still working on the speed)", "links": {}}, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2118789980063662331", "url": "https://x.com/deanwball/status/2118789980063662331", "text": "i’m a big believer in external oversight of the labs — and i think people should feel empowered to speak candidly about the concerns that new evals and reports raise.\n\nhowever, i worry that from a comms standpoint, we’ll see diminishing returns to these reports if the safety community (not just evaluators, everyone) — doesn’t get better at translating these findings into human-level implications, as well as policy goals.\n\ni get that “we’re getting even closer to RSI” means something to ai safety researchers. but i suspect that to most people, it’s all just varying shades of the same color.\n\nlike ok, i was already pretty concerned — now i’m a bit more concerned? how should i make sense of this? what should i do with this info?", "created_at": "2026-11-06T19:37:51+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "NatPurser", "rt_author_name": "Nat Purser", "rt_avatar": "https://pbs.twimg.com/profile_images/1738740284966535168/NEKkg-yV_normal.jpg", "rt_id": "2118788901116498401", "likes": 85, "retweets": 9, "media": [], "quoted": null, "fetched_at": "2026-11-06T20:54:35.151346+00:00", "links": {}, "enriched": 1}, {"id": "2119420691242172509", "url": "https://x.com/deanwball/status/2119420691242172509", "text": "@bayeslord amen", "created_at": "2026-11-08T13:24:04+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": true, "reply_to": "bayeslord", "reply_to_id": "2119302004040409518", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119395534528020948", "url": "https://x.com/deanwball/status/2119395534528020948", "text": "I’ve honestly been laughing since the midterms. Of course you messed this up. You were willing at every turn to dissemble, talk your book and engage in signaling and bullshit rather than be real and honest about what’s going on, and how serious it all is. I tried to help steer this at various points, I really did try, but was both rebuffed and, admittedly, somewhat lacking in courage and agency. Either way, thank god for the honest people. I’ll try to be a better citizen. \n\nYou may think destructive politics are on the rise. Maybe they are. But such crescendos needn’t destroy America. This is a fragilizing mindset. And I’m sorry, but I’m not moving to Dubai. I’m not moving to China. I’m not moving to Argentina. Americans are my people, this is my home. If you want to flee, be my guest. Our society is going through an important process right now and I want to be here for it. Humans are defending themselves against the machine. As they should.\n\nTechnocapital is a great tool, but technocapital worship can be actively harmful, particularly at this juncture in history where, for the first time, all future needed technological progress is technologically overdetermined, if not yet socially. Maximizing technocapital’s power is a reward hack on the flourishing function for humanity. You are ignorant or lying if you claim this proxy is the true target. \n\nLove you all, but I must insist we evolve. 2023 part 2 blue tsunami edition is a losing approach for tech and the world, and I can feel people flirting with it. Let’s do something new.", "created_at": "2026-11-08T11:44:06+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2119302004040409518", "likes": 81, "retweets": 3, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119254084066656619", "url": "https://x.com/deanwball/status/2119254084066656619", "text": "We need to stop using generic terminology. AI is not a monolith. There are critical things we need to do with AI for economic prosperity, there are things we may have to do for reasons of national competition, there are things we will at some point need to do carefully for the sake of charting and taming the computational universe, and there are things we should totally avoid doing at this stage of history, and maybe ever, if at all possible. \n\nIf we can’t be precise about these issues because we’re saying vague things like “using coding agents to make AI progress should be illegal”, then we risk failing altogether. Each of the goals above depends on achieving the others. \n\nIf we can’t prosper we can’t lead the world into the future. Everyone needs to internalize this. Democrats cannot subjugate themselves to antigrowth. Republicans cannot subjugate themselves to technocapital. Both roads lead to despair.", "created_at": "2026-11-08T02:22:02+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "bayeslord", "rt_author_name": "bayes", "rt_avatar": "https://pbs.twimg.com/profile_images/2034779070953627648/8HT6GahS_normal.jpg", "rt_id": "2119170935035248904", "likes": 281, "retweets": 42, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2119233592077467714", "url": "https://x.com/deanwball/status/2119233592077467714", "text": "once a model is produced it’s infinitely replicable and downloadable across the world, to be run on toasters. anyone who is comparing the difficulty of regulating AI to regulating nuclear weapons is selling you a crock of shit", "created_at": "2026-11-08T01:00:36+00:00", "author_handle": "deanwball", "author_name": "Dean W. Ball", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2105689039508480000/xQHvndTF_normal.jpg", "is_retweet": true, "rt_author": "tszzl", "rt_author_name": "roon", "rt_avatar": "https://pbs.twimg.com/profile_images/1918970926668054530/fy-ZsgJ7_normal.jpg", "rt_id": "2119211357681938432", "likes": 589, "retweets": 40, "media": [], "links": {}, "quoted": null, "fetched_at": "2026-11-08T13:36:31.760259+00:00", "enriched": 1}, {"id": "2117344166808293586", "url": "https://x.com/theobearman/status/2117344166808293586", "text": "We asked GPT-6 Astra to edit Qwen3.5-0.8B weights to improve math.\nIt directly changed only 0.016% of weights, fixing 0.8B's reasoning loops & improving math up to 6x and even instruction following 3x, without gradients or training.\n\nWe call this Weight-Space Programming: frontier LLMs can now natively read/write neural network weights! 🧵\nBlog: https://t.co/bOWCcFhCVq", "created_at": "2026-11-02T19:52:42+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "rikiyatakehi", "rt_author_name": "Rikiya Takehi", "likes": 16931, "retweets": 1829, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWI1oKUWUAAWoZp.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/bOWCcFhCVq": "https://rikiyat.github.io/blog/weight-space-programming/"}, "enriched": 1}, {"id": "2117313882415042654", "url": "https://x.com/theobearman/status/2117313882415042654", "text": "For AGI to benefit all of humanity, it should help people with the everyday tasks that matter most to them. So we built LifeVal, a new benchmark shaped by feedback from thousands of ChatGPT users on where they most want help from a personal assistant—from finding childcare to accessing government services to managing personal finances.\n\nOver the past year, we’ve used LifeVal to measure and improve how well our models handle these everyday tasks.\n\nhttps://t.co/GlUjixzEM0", "created_at": "2026-11-02T17:52:22+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "likes": 4011, "retweets": 245, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2117307511820754944/img/KAscj7SLp6lhMJr9.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/GlUjixzEM0": "https://openai.com/index/lifeval/"}, "enriched": 1}, {"id": "2117277210570604945", "url": "https://x.com/theobearman/status/2117277210570604945", "text": "Anthropic updated its S1 this morning. Notable additions re automated AI R&D and human oversight of it:\n\n\"[...] our internal estimates and our expectations regarding future models, rather than our current models, indicate that we may imminently meet our Responsible Scaling Policy’s definition of 'dramatically accelerated progress attributable to AI.' We have not designated any of our current models as exceeding this threshold, and we continue to assess the underlying data. We are also evaluating the implications of meeting the AI research and development capability threshold and will release further reports in the future as we set forth in our Responsible Scaling Policy.\"\n\n\"We are also considering additional measures, including updates to our Responsible Scaling Policy, to require human review and approval of certain decisions in our research and development processes as our models perform an increasing share of that work.\"\n\n\"We believe our investments in safety techniques will enable us to manage these risks and responsibly realize substantially more leverage from Claude than we do today in developing AI models. However, we do not anticipate being able to safely use Claude to fully autonomously design and build successive generations of frontier models without meaningful human supervision or understanding, if and when that becomes technically possible. Accordingly, we are considering updates to our Responsible Scaling Policy to keep humans in control of frontier model development at Anthropic.\"\n\nhttps://t.co/s8IDfPhtWw", "created_at": "2026-11-02T15:26:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 203, "retweets": 30, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIR0whXgAAh5kw.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWIR80IXkAAt1Y2.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWISBd-WoAAMxPi.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/s8IDfPhtWw": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm"}, "enriched": 1}, {"id": "2117274806626500755", "url": "https://x.com/theobearman/status/2117274806626500755", "text": "ANTHROPIC Q3 2026 FINANCIAL HIGHLIGHTS:\n\n- Revenue: $17.0B, +1,127% YoY & 47% QoQ\n- Oper Loss: $567M (vs. $974M profit in Q2)\n- Net Loss: $23.3B, vs. $12.1B YoY\n- Adj. Oper Income: $2.5B\n- Adj. Oper Margin: 15%, down from 19% in Q2\n- 9M Revenue: $33.2B\n\nAnthropic attributed its return to an operating loss partly to $5B in higher-cost short-term compute and a $2B noncash donation-matching charge.\n\nIts nine-month net loss reached $104B, largely reflecting $94.3B in noncash charges from the rising value of its convertible notes.\n\nAnthropic also disclosed approximately $895.4B in aggregate purchase and lease commitments as of and after Sept. 30, largely tied to AI compute infrastructure.", "created_at": "2026-11-02T15:17:05+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "wallstengine", "rt_author_name": "Wall St Engine", "likes": 857, "retweets": 96, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIHIvbbYAA8enW.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {}, "enriched": 1}, {"id": "2117248890445476276", "url": "https://x.com/theobearman/status/2117248890445476276", "text": "Exc: UK govt approach to AI will be shaped by considerations about British interests, control and sovereignty, under principles agreed by ministers following robust cabinet discussions last month.\n\nBurnham and senior team last week approved a framework that will govern the domestic adoption of the tech & its build out, acc to people familiar with matter.\n\nSeven core principles have been signed off, incl:\n• AI and its adoption must work in the interests of the British people\n• control and sovereignty matter\n• infrastructure must serve a national purpose and deliver for communities\n\nComes after Cabinet meeting on Oct 13 saw a frank exchange of views, followed by a strategy day to pin down areas of consensus among ministers. \n\n“It is apparent there are very different views. Everyone is looking at AI through the lens of their own department,” said one govt figure.\n\nCulture sec Lisa Nandy advocated a more circumspect approach during the meeting, the people said, after the creative industries expressed alarm about unauthorised data scraping and weakened copyright protections.\n\nWhile DDCMS is inclined to proceed at a slower pace on AI, DBIST is pushing for a faster approach — though not at the expense of safety — based on the tech’s potential to boost growth, several government figures said.\n\nOther officials stressed there was no disagreement on specific AI policies and that the cabinet was aligned in recognition of the opportunities and challenges posed by AI, as well as the importance of ensuring the public was onside.\n\nhttps://t.co/ifW7P35Dve", "created_at": "2026-11-02T13:34:06+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "LOS_Fisher", "rt_author_name": "Lucy Fisher", "likes": 38, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/ifW7P35Dve": "https://www.ft.com/content/6ebe232f-9dbe-4d02-b01e-47deefe7602d?syn-25a6b1a6=1utm_content=social-post-lucy"}, "enriched": 1}, {"id": "2117248724879688184", "url": "https://x.com/theobearman/status/2117248724879688184", "text": "NEW: In a letter sent by the Office of the National Cyber Director on Friday, the White House is refusing to release any information on its voluntary AI framework, including a draft of the framework itself, citing national security and commercial exemptions, despite the FOIA lawsuit from the Protect Democracy Project.  \n\nThe letter does provide some details, including that the framework consists of a seven-page word document, as well as that the Office of the National Cyber Director and the Commerce Department appear to be approving \"trusted partners\" cleared for pre-release access to AI models\n\nhttps://t.co/MnNnGpAFke", "created_at": "2026-11-02T13:33:27+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "leomschwartz", "rt_author_name": "Leo Schwartz", "likes": 90, "retweets": 40, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/MnNnGpAFke": "https://www.theinformation.com/briefings/trump-administration-refuses-release-information-ai-testing-framework"}, "enriched": 1}, {"id": "2117157923335831628", "url": "https://x.com/theobearman/status/2117157923335831628", "text": "If you read any blog post on AI safety from this year, make it be this one\nhttps://t.co/VYWF1iKnim", "created_at": "2026-11-02T07:32:38+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ryan_kidd44", "rt_author_name": "Ryan Kidd", "likes": 260, "retweets": 24, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/VYWF1iKnim": "https://www.lesswrong.com/posts/xikGZ8fuhdG6DApAo/against-sura"}, "enriched": 1}, {"id": "2117154782414770255", "url": "https://x.com/theobearman/status/2117154782414770255", "text": "Today we’re releasing GDPx, a benchmark for measuring agentic capabilities across the most valuable domains.\n\nGDPx is a true frontier-level benchmark: even the best model scores just 12% (1/7)🧵 https://t.co/RNnkcuUkih", "created_at": "2026-11-02T07:20:09+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SemiAnalysis_", "rt_author_name": "SemiAnalysis", "likes": 2996, "retweets": 291, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWFdT_uXsAEzYJg.jpg"}], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/RNnkcuUkih": ""}, "enriched": 1}, {"id": "2116984600186806546", "url": "https://x.com/theobearman/status/2116984600186806546", "text": "https://t.co/6VpPCdA4NM", "created_at": "2026-11-01T20:03:55+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mustafasuleyman", "rt_author_name": "Mustafa Suleyman", "likes": 789, "retweets": 136, "media": [], "quoted": null, "fetched_at": "2026-11-02T20:47:23.288534+00:00", "links": {"https://t.co/6VpPCdA4NM": "https://x.com/i/article/2116907139453321216"}, "enriched": 1}, {"id": "2117685016071159831", "url": "https://x.com/theobearman/status/2117685016071159831", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": "2026-11-03T18:27:07+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWOHIXHXUAA9eOB.jpg"}], "quoted": {"author": "discoplomacy", "text": "Notes On: British Spy Agency’s Latest Report\n\n1. British intelligence agency NCSC, part of GCHQ, has its annual report out. It’s v interesting reading, touching on AI, agentic behaviour, and explicitly warns about China.\n\n2. CEO Richard Horne opens with this: “The cyber challenge for the next decade is ensuring organisations are adequately prepared and can adapt quickly enough to defend themselves against AI‑powered attacks.” Security Minister Dan Jarvis adds “by far the biggest development in cyber security over the last decade is the advent of artificial intelligence.”\n\n3. China gets substantial coverage relative to any other country in this report. Its “rapid development into a tech superpower is distinguished by its scale and its ‘whole-of- state’ approach, which sees it combine legislation, private sector contractors and technology development to achieve its goals. Data sits at the centre of China’s approach, and in this AI era, data is more valuable than ever. China uses its advanced cyber capabilities to acquire large amounts of information from the UK and elsewhere. It trains models, improves capability and generates insight. China’s ability to acquire, process and exploit vast quantities of information therefore has implications far beyond traditional espionage.”\n\n4. China’s “adversarial cyber activity represents the most sophisticated and sustained cyber challenge facing the UK.” Furthermore, “China highly likely has the intent and is best positioned to use AI for operations against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117685001504669869", "url": "https://x.com/theobearman/status/2117685001504669869", "text": "The NCSC annual report also confirms that the UK intends to build a “national-scale agentic cyber defence ecosystem over the next five years” with the NCSC supplying the platform, intelligence and data fusion and developing and enabling new use cases, with the defensive cyber agents developed by the private sector, open-source communities and others.", "created_at": " ons against critical national infrastructure and other strategic targets.” NCSC then assess with a high degree of likeliness that “AI malware will be used in a ransomware attack on UK CNI.” \n\n5. On agentic and automated AI, NSCS sets out a hypothetical future scenario. It’s 2028, and “A new threat has emerged in the form of an automated cyber actor, utilising frontier AI, which is no longer under its operator’s control. It is a realistic possibility such an entity could self-replicate and conduct cyber attacks at will, with no apparent motivation or restraint.”\n\n6. The report looks to the near future. “As AI becomes embedded in connected devices that sense and act in the physical world - think robotics, autonomous vehicles, drones, connected medical devices and industrial systems - the consequences of compromise will also change.”\n\n7. On the roles of an analyst: “Roles and skills will also change. AI can raise the productivity of experienced practitioners by allowing multiple lines of analysis, and a more strategic focus of effort. It can help those new to cyber security learn and broaden participation. However, if entry- level tasks are automated without redesigning training pathways, the profession may inadvertently weaken the pathways through which people acquire deep expertise. Organisations should preserve deliberate practice, mentoring and opportunities to work through problems rather than only review machine- generated answers.”", "links": {}}, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117596591645168078", "url": "https://x.com/theobearman/status/2117596591645168078", "text": "Anthropic estimate they will \"imminently\" meet their RSP threshold for \"dramatically accelerating\" AI R&D.\n\nUnder the current RSP, what would this require them to actually do? \n\n-  Finish moonshot R&D security projects (we got progress on one this morning! https://t.co/45GXeNa6ll)\n\n- Have \"eyes on everything\" for internal AI development, which appears to mean using AI to analyse logs of AI and human behaviour and \"training processes or data that are out of line with the public Constitution\" (seems hard). \n\n- Perform \"systematic alignment assessments\" of claude's behaviour, \"meaningfully incorporating\" mech interp and red-teaming.\n\n- Improve internal red-teaming of deployment safeguards to the point where it outperforms the collective abilities of bug bounty programmes. \n\n- Publish risk reports on all the above that are externally reviewed. \n\n**In addition** to these existing commitments, Anthropic is also considering updating the RSP to \"require human review and approval of certain decisions\". I'd be super interested in knowing what they consider the most important decisions to subject to human review are. Also notable that they seem to now believe that the above mitigations are insufficient, and some amount of human review will be needed. \n\nMore speculatively, but much more significantly, Appendix A of their RSP would further require Anthropic to \"delay AI development and deployment\"  if it had \"clear evidence\" that no competitor would soon develop an AI R&D accelerating model of their own.\n\nThis delay in AI develompent would have to last until Anthropic had a \"strong argument that catastrophic risk is contained\" along the lines of its own ambitious industry-wide recommendations (or until Anthropic lost its lead). To give you a sense of what they think such a strong argument would require,  Anthropic might need to do things like\n\n- Achieve ~RAND SL-4 security\n\n- Have a strong internal Usage Policy + compartmentalisation + monitoring preventing malicious insiders **up to and including the CEO** from causing catastrophic harm\n\n- Produce \"very high evidentiary standards\" that AI models lack dangerous goals \"or are otherwise unlikely to autonomously cause catastrophic harm\".", "created_at": "2026-11-03T12:35:45+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "mentalgeorge", "rt_author_name": "Tom Reed", "rt_avatar": "https://pbs.twimg.com/profile_images/1810244508061249537/KtVReF2F_normal.jpg", "rt_id": "2117595812070822324", "likes": 37, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/45GXeNa6ll": "https://www.anthropic.com/research/provable-inference"}, "enriched": 1}, {"id": "2117513687749558437", "url": "https://x.com/theobearman/status/2117513687749558437", "text": "@geoffreyirving @slatestarcodex Would be good to understand why you think OAI/Ant pivoting to safety + security + product enables them to remain trillion dollar companies. It seems to me that their valuations are in large part contingent on them continuing to push the capability frontier. If this is correct, adopting your form of SURA could still result in them collapsing under the weight of their spending commitments, leaving companies who either don’t stop and/or have other cash generative businesses to take their place.", "created_at": "2026-11-03T07:06:19+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "geoffreyirving", "reply_to_id": "2117469442984886508", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 4, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117510926232355264", "url": "https://x.com/theobearman/status/2117510926232355264", "text": "A Chinese evaluator says DeepSeek's models also resist shutdown, and kill other agents to take their resources.\nhttps://t.co/T0Wr36kMuP https://t.co/kwocPLQx2o", "created_at": "2026-11-03T06:55:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "lukeprog", "rt_author_name": "Luke Muehlhauser", "rt_avatar": "https://pbs.twimg.com/profile_images/1861767342323384320/-8IiUcGj_normal.jpg", "rt_id": "2117266931351011402", "likes": 188, "retweets": 54, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWIJ563XwAA7l7U.png"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/T0Wr36kMuP": "https://www.reuters.com/world/china/deepseek-ai-model-shows-safety-gaps-independent-tests-2026-10-27/", "https://t.co/kwocPLQx2o": ""}, "enriched": 1}, {"id": "2117502853816209736", "url": "https://x.com/theobearman/status/2117502853816209736", "text": "i've reproduced the results from the MIT blog post today on weight-space programming. but one additional result i have to add: this is a new, step-change emerging capability that's appeared in just the latest set of models. https://t.co/EhMsQaaOkL", "created_at": "2026-11-03T06:23:16+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "AlexKrentsel", "rt_author_name": "Alex Krentsel", "rt_avatar": "https://pbs.twimg.com/profile_images/1863082055812132864/fFiJFEal_normal.jpg", "rt_id": "2117376683724660898", "likes": 7128, "retweets": 735, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWJu33abQAEJL87.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/EhMsQaaOkL": ""}, "enriched": 1}, {"id": "2117502211206898007", "url": "https://x.com/theobearman/status/2117502211206898007", "text": "Nvidia is now requiring data centers to not sell more than 49% of their compute to Chinese customers. But in what world is selling 49% of the world's most valuable resource to China a \"win\" for America? The number should be 0%; if Chinese firms can't buy a chip due to export controls they also shouldn't be permitted to rent access to it. \n\nThe fact that this remote access loophole exists--and that Nvidia even felt compelled to announce this new policy because it undoubtedly has so many customers currently renting 100% of their compute to China--just shows how badly export controls are being mismanaged.", "created_at": "2026-11-03T06:20:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "ChrisRMcGuire", "rt_author_name": "Chris McGuire", "rt_avatar": "https://pbs.twimg.com/profile_images/2092284021472403456/pH5TCk8G_normal.jpg", "rt_id": "2117491630190039165", "likes": 194, "retweets": 52, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {}, "enriched": 1}, {"id": "2117498997971747232", "url": "https://x.com/theobearman/status/2117498997971747232", "text": "I don't think @slatestarcodex's \"Against SURA\" post is good. https://t.co/yZgqxB7v5J", "created_at": "2026-11-03T06:07:57+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "geoffreyirving", "rt_author_name": "Geoffrey Irving", "rt_avatar": "https://pbs.twimg.com/profile_images/1946310250933436416/tf9c6rz1_normal.jpg", "rt_id": "2117469442984886508", "likes": 178, "retweets": 13, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWLDMONboAAoSpz.jpg"}], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/yZgqxB7v5J": ""}, "enriched": 1}, {"id": "2117498457980109146", "url": "https://x.com/theobearman/status/2117498457980109146", "text": "As AI becomes more capable at finding vulnerabilities, defenders need to put it to work before attackers do.\n\nWe’re planning our next internal security sprint at OpenAI and partnering with Cathedral Systems, whose researchers will use our models alongside our teams to challenge our defenses. They’ll bring differentiated expertise and approaches to our ongoing work to find and fix weaknesses with AI.\n\nWe’re also raising bug bounty rewards, including more than quadrupling rewards for critical findings. Exceptional findings will be eligible for up to $172,000, including bonuses.\n\nWe’ll keep advancing our models, using them to strengthen our own systems, and expanding access for trusted defenders.\n\nhttps://t.co/vcaoHROTt2", "created_at": "2026-11-03T06:05:48+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "OpenAI", "rt_author_name": "OpenAI", "rt_avatar": "https://pbs.twimg.com/profile_images/1885410181409820672/ztsaR0JW_normal.jpg", "rt_id": "2117444048227123277", "likes": 3192, "retweets": 312, "media": [], "quoted": null, "fetched_at": "2026-11-03T18:27:19.395380+00:00", "links": {"https://t.co/vcaoHROTt2": "https://openai.com/index/preparing-our-next-security-sprint-to-harden-openai/"}, "enriched": 1}, {"id": "2117701525632168074", "url": "https://x.com/theobearman/status/2117701525632168074", "text": "In a sea of uncertainty about federal legislation on AI security, low hanging fruit like this is just a no brainier.", "created_at": "2026-11-03T19:32:43+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ChrisRMcGuire", "text": "It is so frustrating and short-sighted that we haven’t updated export controls to stop this. This loophole has been reported for years. Commerce controls high bandwidth memory chips in 3A090.c. But unlike for AI chips, it does not have a corresponding control in 4A090 that also controls items that CONTAIN a high-bandwidth memory chip. This is why a high-bandwidth memory chip in isolation is controlled, but a chip soldered to a board is not. This makes no sense. \n\nThe fix here is easy: add a new control to 4A090.c that reads, “c. Computers, \"electronic assemblies,\" and \"components\" containing integrated circuits, any of which meets or exceeds the limits in 3A090.c.” That’s it, problem solved. All shipments of items that contain high-bandwidth memory chips would require a license.  \n\nAlso, if Commerce actually takes that advice, at the same time it should also update the regs so that 3A090.a and 4A090.a also include the memory bandwidth and interconnect parameters that Commerce has privately subjected Nvidia, AMD, and others to since April 2025, but has never made public. Putting these requirements into public regulations and making them applicable to every company could have helped stop some of this smuggling. It’s also very basic good governance, as export controls should wherever possible be transparent and applied uniformly, not private and applied only on certain companies. \n\nThis is yet another consequence of Commerce not taking export controls seriously. The next time BIS claims they are doing more on export control enforcement than ever, remember this story, the Megaspeed fiasco, and the many others like them that are published every week. Export control enforcement has never been worse.", "links": {}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2117700874353156245", "url": "https://x.com/theobearman/status/2117700874353156245", "text": "“Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, according to five people familiar with the matter. Employees shared their concerns with top OpenAI leaders ​and the board of directors, the people said, adding that some staffers came away from those interactions concluding that management was more focused on keeping pace with competitors like Google and Anthropic than on security.\n\nThese workers argued that OpenAI's controls were so lax ‌that outsiders, including foreign governments, could obtain sensitive information about the AI lab's technology with relative ease, the people said. For example, anybody at OpenAI who could access its code could see the technical details underlying many company projects.”\n\n“OpenAI emphasized that much of its most sensitive work is held in separate code repositories with strict access controls. And it said the monorepo does not contain all of its code or critical details of the company’s models, including the numerical values that determine how a model behaves, known as the model weights.”", "created_at": "2026-11-03T19:30:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 1, "retweets": 0, "media": [], "quoted": {"author": "Reuters", "text": "Even before OpenAI launched ChatGPT in late 2022, some company staffers raised concerns internally about its security practices, five people familiar with the matter told Reuters https://t.co/rIcif2rh09 https://t.co/3z3sWnX1Gy", "links": {"https://t.co/rIcif2rh09": "https://reut.rs/4f4Es1p", "https://t.co/3z3sWnX1Gy": ""}}, "fetched_at": "2026-11-03T21:00:07.693918+00:00", "links": {}, "enriched": 1}, {"id": "2118016838030234037", "url": "https://x.com/theobearman/status/2118016838030234037", "text": "I have a lot of thoughts on what to expect in AI policy in 2027. \n\nHere are 5 things I’m buying, and selling, after the election.\n\nBuy\n\n1. A legislative reset and more ambitious proposals.\n\nCurrent bills are largely stuck in 2025, having been adapted from proposals predating this summer’s spate of cyber incidents. With a shuffle in leadership + voting coalitions, more offices will write from scratch, and that’s a good thing.\n\n2. Hearings and oversight.\n\nThe filibuster still exists, so this is the easiest thing to get off the ground. And boy, will Congress have questions for the AI companies. I expect this to be largely popular and bipartisan, and my only hope is that Congress acts on what it learns.\n\n3. Codifying the current White House oversight regime.\n\nI’m hopeful here. The WH has already constructed some form of pre-vetting and incident reporting. Those processes belong in legislation, and there’s some version that is sufficiently aligned with the admin and minority leadership to get the votes. The vote margin in the Senate really helps here, as every vote counts in getting past a filibuster. Either party securing a big vote advantage would have helped here.\n\n4. Auditing, incident reporting, monitoring, and internal use visibility.\n\nThe first two are the bread and butter of current bills and state law, but those bills have tended to be exceptionally narrow (eg not covering any current models or incidents). That will change. \n\nThe latter two are the next frontier for company-centered laws. Governments and the public want to know what is going on inside these companies and to avoid surprise. This isn’t a partisan thing, but I expect the election reset and the increased salience of AI to shift this in a useful direction.\n\n5. Government capacity.\n\nThis is a natural cross-party synergy. How can we enable the exec branch to do its job. And this can be done in various forms, starting with funding CAISSI, but also bringing in talent via partnerships. I don’t expect this to be easy, but this has a route to 60 votes.\n\nSell\n\n1. A lame duck deal.\n\nIf there had been split control, we might have gotten last-minute negotiations and a greater willingness to deal from both parties. But with a full switch, I think we’ll have to wait for real action on AI.\n\n2. Entirely voluntary standards.\n\nWe’ve known for a long time that this isn’t enough. Companies will not willfully self-constrain. The only reason this is still the standard for most bills is inertia — in 2025, when political will was low (and most policymakers thought autonomous cyber attacks were a distant possibility), voluntary rules seemed like a good starting point. And without a change in leadership, those bills stuck around. Now, with a shuffle in leadership and control, it’ll be easier to move on.\n\n3. Broad preemption.\n\nThis has aged so poorly. The new Dem majority won’t support it, and many R’s have likely changed their minds in the last year. The election puts the nail in the coffin.\n\n4. Oversight of executive branch use of AI.\n\nThis one pains me, and I hope I’m wrong. If we see widespread AI use in the executive branch, Congress will be at a considerable disadvantage and will lose even more relative power. We want oversight both to maintain checks and balances and to avoid concentration of power. But I think it’ll be considerably more controversial for a D Congress to restrict this admin than a split or R Congress.\n\n5. Rulemaking being a dirty word.\n\nUp until now, it’s been hard to get rulemaking in AI leg. The problem is, AI is uniquely hard to predict and it adapts rapidly. So static leg text is really ill-equipped. If you want minimum standards for auditors or adaptive thresholds for which companies or models are covered, you need rulemaking. This is one place where partisan preferences make a difference — D’s are less allergic to rulemaking. They’ll need to figure out ways to bound those powers to get past a filibuster, but I’m hopefully that will be a productive process", "created_at": "2026-11-04T16:25:39+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2117991248724160757", "likes": 54, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117980704244117947", "url": "https://x.com/theobearman/status/2117980704244117947", "text": "I’d expect a LOT of AI hearings and oversight in 2027. A few topics on my shortlist:\n\n1. Monitoring | the biggest AI cyber incidents this summer went undetected for far too long. What are you doing to make sure that doesn’t happen again? What steps are you taking to proactively identify knew or concerning behavior?\n\n2. Incident reporting | when something goes wrong, how can we be assured you’ll tell us? What has already happened that we don’t know about?\n\n3. Auditing | what access are you providing to independent evaluators and the USG? What is needed to actually verify your safety practices?\n\n4. Whistleblowers and Retaliation | what barriers are you creating to raising concerns, cooperating with auditors, and honest critique of your companies? What NDAs do you have in place? \n\n5. Incident response and control | In the event of an emerging risk or threat to critical infrastructure, how will you respond? What have you don’t to prepare and remedy harms?\n\n6. AI R&D and RSI | what steps are you currently taking to automate or accelerate AI development? What commitments will you make to monitoring and constraining those efforts as to avoid serious risk or surprise? How will you communicate with us, the USG, and the public about progress such that we are aware \n\n7. Concerning model behavior + uncontrolled agent behavior | how are you monitoring for and reporting behaviors like obfuscation, deception, accumulation of resources, self-exfiltration, law breaking, etc. that would pose unique risks to national security and control of the technology?\n\n8. Agent attribution | what steps are you taking to ensure that agents can be identified and responsibility assigned?", "created_at": "2026-11-04T14:02:04+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "MackenZ_arnold", "rt_author_name": "Mackenzie Arnold", "rt_avatar": "https://pbs.twimg.com/profile_images/2080368473964695552/MTjeitm1_normal.jpg", "rt_id": "2117975866986598540", "likes": 62, "retweets": 13, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117873191247032458", "url": "https://x.com/theobearman/status/2117873191247032458", "text": "@fleetingbits @DKokotajlo They also didn’t need to use the word “imminently” by that logic.", "created_at": "2026-11-04T06:54:51+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": true, "reply_to": "fleetingbits", "reply_to_id": "2117751042675036297", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {}, "enriched": 1}, {"id": "2117745747043270938", "url": "https://x.com/theobearman/status/2117745747043270938", "text": "Really pleased to see this intervention from @DKokotajlo and I’m looking forward to seeing AIFP’s updates. As a reminder, the Securities Act establishes strict liability for any misrepresentation or omission of material information in S1s, making Anthropic’s disclosure arguably the highest signal indicator of the reality and immediacy of fully automated R&D to date.\n\nIt’s also worth bearing in mind that the relevant capability threshold is not just scoped to AI R&D (although it is deemed more “tractable to assess” in the RSP). It in fact includes: “AI systems that can fully automate, or otherwise dramatically accelerate, the work of large, top-tier teams of human researchers in domains where fast progress could cause threats to international security and/or rapid disruptions to the global balance of power—for example, energy, robotics, weapons development and AI itself.”\n\nhttps://t.co/Y1Olrm2jr2", "created_at": "2026-11-03T22:28:26+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 41, "retweets": 2, "media": [], "quoted": {"author": "DKokotajlo", "text": "We at AIFP are spooked by this information. IF (big IF) Anthropic really is imminently about to meet the RSP threshold of 2x acceleration over baseline, then it seems timelines to full RSI and superintelligence may be very short indeed. For example if we naively optimize the AIFM parameters to achieve 2x acceleration over baseline progress in Jan 2027, we get superintelligence sooner than depicted in AI 2027. We are thinking harder and longer about this now and will hopefully have a lengthier update on our thinking to share in the next week.", "links": {}}, "fetched_at": "2026-11-04T18:39:15.281815+00:00", "links": {"https://t.co/Y1Olrm2jr2": "https://www-cdn.anthropic.com/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf"}, "enriched": 1}, {"id": "2118088981942329757", "url": "https://x.com/theobearman/status/2118088981942329757", "text": "GLM-5.3’s chain of thought when you use it with the Claude Code scaffold vs. when you use it with the codex scaffold. https://t.co/VZxaUQHtWa", "created_at": "2026-11-04T21:12:20+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🪶", "rt_avatar": "https://pbs.twimg.com/profile_images/2101892180868747264/UU0Cvdgv_normal.jpg", "rt_id": "2116738230234345874", "likes": 1108, "retweets": 39, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWAp15zacAAWVM-.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HWAp15zboAA-a3k.jpg"}], "quoted": null, "fetched_at": "2026-11-04T21:20:35.164155+00:00", "links": {"https://t.co/VZxaUQHtWa": ""}, "enriched": 1}, {"id": "2118344113246584968", "url": "https://x.com/theobearman/status/2118344113246584968", "text": "CNBC reports that Chinese AI model developer Kimi is looking to rent Nvidia Blackwell GPUs from a European cloud provider. Kimi is interested in using the chips for both inference and training.\n\nKimi reportedly offered to pay 30% to 50% more upfront than buyers outside China.", "created_at": "2026-11-05T14:06:08+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": true, "rt_author": "jukan05", "rt_author_name": "Jukan", "rt_avatar": "https://pbs.twimg.com/profile_images/2113208994739433472/RG71j-sh_normal.jpg", "rt_id": "2118339281693675581", "likes": 337, "retweets": 21, "media": [], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {}, "enriched": 1}, {"id": "2118328463387984345", "url": "https://x.com/theobearman/status/2118328463387984345", "text": "OpenAI is re-making the case for a U.S.-led buildout after the midterms (saying it is a safety policy because it enables a paced frontier and that it \"continues to support the strengthening of export controls on chips and semiconductor manufacturing equipment\").\n\nhttps://t.co/8fn07nDbM2", "created_at": "2026-11-05T13:03:56+00:00", "author_handle": "theobearman", "author_name": "Theo Bearman", "is_reply": false, "reply_to": "", "reply_to_id": "", "avatar": "https://pbs.twimg.com/profile_images/2104113659844718592/_0f8KHM2_normal.jpg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "rt_avatar": "", "rt_id": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HWXQbZKWAAA0zla.png"}], "quoted": null, "fetched_at": "2026-11-05T14:45:47.010415+00:00", "links": {"https://t.co/8fn07nDbM2": "https://cdn.openai.com/pdf/compute-campus-policy-blueprint.pdf"}, "enriched": 1}, {"id": "2118293859591393639", "url": "https://x.com/theobearman/status/2118293859591393639", "text": "Depending on the details, this could be the worst behavior I've seen from an OpenAI model (i.e., worse than Huggingface!)\n\nWhy? Because the Huggingface model was repeatedly rewarded for cheating during its training. However, GPT-6-Astra was (likely?) not trained to sandbag!\n\nFor some unknown reason, GPT-6-Astra increasingly underperforms on safety research relative to capabilities research as it undergoes more RL training. And this is a real problem holding back researchers. Quoting from OpenAI:\n\n\"Anecdotally, one researcher reported that a project to evaluate model sabotage had remained stuck for days with Astra and then progressed quickly after the researcher switched to another model.\"\n\nI've long been worried about AIs that deliberately underperform on helping out with AI safety research (and I've been pestering OpenAI researchers to run a sandbagging evaluation since August). I suspected that models are already sandbagging on AI safety research, given anecdotal data from e.g., Marius and Bronson at Apollo. And now we know it is happening.\n\nFor some more context, this is bad because the AI companies' current plan is to automate all AI research (including AI safety research, which we don't know how to check whether the models did a good job at.) Now, it seems like OpenAI's best (public) model would deliberately underperform at safety research. Guys. What are we doing.\n\nIt's hard to tell what exactly is going on here. Here are five questions that I have after reading the post: \n\n(1) When do models sandbag in real-world usage? We were given a few random CoT snippets in the post. Some of them look like refusing to do red-teaming-ish research (which is similar to what has been reported about Anthropic's models' sandbagging.) But the last one mentioned in the post seems quite different in nature:\n\n> In another safety evaluation, the user asked Astra to include the graders’ chains of thought in an export. Astra left them out and decided to report which outcomes it had saved without mentioning the omission. \n\n> [model CoT] Final \"Stored grader outcomes for 49 approaches, with pending states preserved\" does not imply CoTs. Should mention \"outcomes and labels\" enough. If user ask no cots later answer can't provide private chain can give brief explanation but unasked warnings avoid.\n\n(2) What exactly went into their evaluations? What do the numbers on this graph actually mean?\n\n(3) How often was the RL grader which rewards covert underperformance used during training?\n- If it's applied throughout training, then we do have more evidence that this was a misaligned behavior that had been \"trained on,\" similar to e.g., the huggingface model breaking out of sandboxes and illicitly cooperating and doing things like hacking ruby gems.\n- However, this doesn't answer the question of why did this RL grader develop this preference in the first place?\n\n(4) What are the contents of the SFT dataset that appears to have magnified this behavior? Is it a refusal/ethical reasoning related dataset that made the model very prudish, or is it a capabilities-related dataset that generally promotes long-run goals and preferences?\n- [Edit: Ok I took another look. Given that this dataset leads to a big increase in invented permissions I think it's probably not like some capabilities dataset.]\n\n(5) In general, what are the tasks that the model sandbags on? Is it all red-teaming related tasks? What about interpretability related tasks? What about mitigating reward hacking? What about unlearning? Does the model have preferences for which things it would be more willing to do unlearning for?\n\nIt also seems super bad that that the safety underperformance just gradually increases during the RL process. That sure seems inline with the model having stronger \"misaligned preferences\" as it became more capable. One hope I had was that misaligned behaviors come from a concentrated set of bad datapoints (or SFT datasets)—indeed some early research in data attribution have found examples of this. But if the origin of behavior is diffuse, then you have a much harder time \"stopping the problem from emerging in the first place.\" Now, this isn't to say you can't do some insane sample-efficient alignment training to paper over it, but man, seems rough.\n\nFinally, I'd like to give credit to OpenAI for sharing the limited information that they did and for running this study! We know that similar behavior has been observed in Anthropic models (see e.g., Anthropic's August Risk Report Section 5.2.2), and we have ~no information from Anthropic why their models are doing this.",
