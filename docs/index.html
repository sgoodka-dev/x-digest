15, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVtgEh8XUAEe0fe.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVtgNIaXsAA39Bo.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115344743114711079", "url": "https://x.com/_achan96_/status/2115344743114711079", "text": "New Anthropic research: How AI agents shape experts' judgment calls\n\nWhen experts delegate work to an agent, do they still make the key decisions? We tested this in a randomized trial with 50 professional data analysts. https://t.co/YyylTuVWkE", "created_at": "2026-10-28T07:27:42+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "AlexTamkin", "rt_author_name": "Alex Tamkin", "likes": 3197, "retweets": 430, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115181954740187136/img/iRp2D80CClkkY95v.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115344037892833480", "url": "https://x.com/_achan96_/status/2115344037892833480", "text": "I couldn't resist the call of a purple avatar. I've joined @IFP as director of emerging tech.", "created_at": "2026-10-28T07:24:54+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "janet_e_egan", "rt_author_name": "Janet Egan", "likes": 358, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115575110086393873", "url": "https://x.com/_achan96_/status/2115575110086393873", "text": "@girishsastry I *think* UK AISI did compaction summaries and Anthropic did both user message intervention and compaction summaries", "created_at": "2026-10-28T22:43:06+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "girishsastry", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115574309947097528", "url": "https://x.com/_achan96_/status/2115574309947097528", "text": "@AnkaReuel Anthropic did not tell the models to stop. They only told the models that real humans are involved. Seems like not a big diff btw \"real humans are involved\" and \"real people could be harmed\"", "created_at": "2026-10-28T22:39:55+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": true, "reply_to": "AnkaReuel", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115865907289337921", "url": "https://x.com/_achan96_/status/2115865907289337921", "text": "We’ve updated the Model Spec, our public description of how we want our models to behave. This revision makes clearer what we want from models as they take on more autonomous work in the world and become capable of helping us in new ways. 🧵\n\nhttps://t.co/EdBbpGwyGS", "created_at": "2026-10-29T17:58:37+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "w01fe", "rt_author_name": "Jason Wolfe", "likes": 476, "retweets": 53, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2116192003893408071", "url": "https://x.com/_achan96_/status/2116192003893408071", "text": "AI takeover scenarios often hinge on an idea I’m skeptical of, where rogue AI overthrows militaries and seizes hard power. I wrote a piece where I concretely break down what I think makes this improbable, and why “full-blown takeover” concerns could be counterproductive for mitigating the risks of misaligned or poorly controlled AI in the military.\n\nFor AI to seize hard power, it would need to be physically capable of defeating our military, and humans would need to be careless enough to give it the power to do so. I think that’s unlikely to occur for several reasons. Among them:\n\n- The military is unlikely to sufficiently hand the reins over to AI. (1) Even if we wanted to, overhauling the institution in this way faces countless barriers that have plagued it for decades. (2) Doing so would be strategically suicidal.\n- Integrating general-purpose AI into physical systems faces challenges that will take significant time to overcome, all while we grow increasingly attuned to the risks posed by AI.\n- There’s little to suggest that more capable AI would be able to persuade or coerce people to take the costly, coordinated actions some of these scenarios predict.\n- Even if AI managed to assume control over a large arsenal, we’d fight back. In which case, recent warfare shows us that crude countermeasures work against technologically advanced adversaries, and AI relies on infrastructure we can and would shut down.\n\n1/2", "created_at": "2026-10-30T15:34:25+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JakeASteckler", "rt_author_name": "Jake Steckler", "likes": 12, "retweets": 6, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV4vqPmXQAAXO_q.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116140110475305443", "url": "https://x.com/_achan96_/status/2116140110475305443", "text": "“America uses gunpowder to make weapons; China uses it to make fireworks.”  \nThis analogy went viral in China alongside a claim that 55% of the country’s AI tokens were being used for micro-dramas.  \n\nThe statistic is largely unfounded. However, the reaction creates an interesting tension: in a society that places such a premium on usefulness, why is supposedly useless entertainment so popular, and why does enjoying it bring shame?  \n\nI wrote about AI micro-dramas, exhaustion, and the pressure to make even downtime productive in China. This is a society that thinks it has an obligation to be useful, yet is addicted to extreme uselessness and feels guilty about it.\n\nhttps://t.co/e1O70NZSeN", "created_at": "2026-10-30T12:08:12+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ZilanQian", "rt_author_name": "Zilan Qian", "likes": 17, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115938193606652192", "url": "https://x.com/_achan96_/status/2115938193606652192", "text": "In recent experiments, we found that GLM 5.3 can autonomously compromise recent versions of Mozilla Firefox using security fixes that have been published but not yet shipped to users.\n\nWe used a deliberately basic setup meant to emulate a relatively unsophisticated attacker with limited resources. After basic initial instructions to inspect those not-yet-shipped fixes, the model reliably built successful exploits for six recent Firefox versions on its own using only information available at the time of release.\n\nThese exploits, which cost about $1,000 per compromised version, would let an attacker steal passwords and authentication cookies stored in the browser, or read any files on the user's computer, after the user opens a single webpage, with no further interaction.\n\nThe exploits make use of the \"patch gap,\" the time between when security fixes are made public in beta or \"nightly\" software updates and when those fixes are generally released to users. Until now, exploiting it required significant human time and skill, or special access to frontier models with advanced cyber capabilities.\n\nOur results show that widely available open-weight models can now do this relatively cheaply and quickly. We gave GLM 5.3 up to 48 hours to find an exploit, but its fastest attempt needed only 12 hours.\n\nIn all of its successful attacks, the patch gap gave GLM 5.3 an initial foothold in the browser. To turn that foothold into reading files off the user's computer, the model also independently discovered and used a previously unpublished vulnerability.\n\nWe shared our findings with Mozilla, which patched the vulnerability in its October 27 Firefox 159.0 release. We haven't yet confirmed whether the attack still succeeds without it, but expect the fix makes it substantially harder. We're grateful to Mozilla for their responsiveness and collaboration.", "created_at": "2026-10-29T22:45:52+00:00", "author_handle": "_achan96_", "author_name": "Alan Chan", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "EpochAIResearch", "rt_author_name": "Epoch AI", "likes": 414, "retweets": 50, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2113891786523545949", "url": "https://x.com/ajeya_cotra/status/2113891786523545949", "text": "Personal news: after two years at @EpochAIResearch, I’ve joined @METR_Evals to work on embedded assessments of AI R&amp;D acceleration: going inside AI developers to measure how much AI is speeding up AI development, and publishing our findings.", "created_at": "2026-10-24T07:14:10+00:00", "author_handle": "ajeya_cotra", "author_name": "Ajeya Cotra", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "datagenproc", "rt_author_name": "jsd", "likes": 364, "retweets": 17, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114029701249540464", "url": "https://x.com/alxndrdavies/status/2114029701249540464", "text": "This didn't get enough views so I'm posting it again: UK AISI changed the compaction summary and included notes on how it should not attack the GitHub maintainers.\n\nMythos 5 did it anyways!", "created_at": "2026-10-24T16:22:12+00:00", "author_handle": "alxndrdavies", "author_name": "Xander Davies", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tim_Hua_", "rt_author_name": "Tim Hua 🇺🇦", "likes": 55, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114209523682660737", "url": "https://x.com/curl_justin/status/2114209523682660737", "text": "if you thought opus 5.5 was good, just wait till you see opus 24 https://t.co/nBU3nLcR7G", "created_at": "2026-10-25T04:16:45+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 26, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVcuWzSbYAAYGGj.jpg"}], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2115978921607041039", "url": "https://x.com/curl_justin/status/2115978921607041039", "text": "narrative violation", "created_at": "2026-10-30T01:27:42+00:00", "author_handle": "curl_justin", "author_name": "justin curl", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 25, "retweets": 3, "media": [], "quoted": {"author": "kuhhbin", "text": "DeepSeek and Moonshot distilled Astra. Let them\n\nIn @TheEconomist this week, we argue that distillation is good for consumers and good for America. \n\nThe biggest losers are China's AI labs. They are sacrificing long-term innovation for short-term gains https://t.co/HH2lMySaLD"}, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2114006723631436271", "url": "https://x.com/DaveRBanerjee/status/2114006723631436271", "text": "Claude just discovered an unpatchable zero day vulnerability in rawlsian liberalism", "created_at": "2026-10-24T14:50:53+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "millerman", "rt_author_name": "Michael Millerman", "likes": 2512, "retweets": 210, "media": [], "quoted": null, "fetched_at": "2026-10-24T18:10:27.925560+00:00"}, {"id": "2114193944900780152", "url": "https://x.com/DaveRBanerjee/status/2114193944900780152", "text": "Elizabeth Holmes movie very good", "created_at": "2026-10-25T03:14:50+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 9, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114190860615078294", "url": "https://x.com/DaveRBanerjee/status/2114190860615078294", "text": "I was at an event recently with folks who weren’t AGI-pilled, and it was interesting to hear how they consider Sam, Dario, and Jensen to all be the same: corporate execs profitmaxxing\n\nBut in reality, you couldn’t find CEOs as different from Jensen as Sam/Dario\n\nThe main distinction is that Sam/Dario believe we are the cusp of developing a god like machine intelligence, and Jensen thinks AI is some web3 type thing", "created_at": "2026-10-25T03:02:35+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 104, "retweets": 2, "media": [], "quoted": {"author": "TheMidasProj", "text": "It’s underappreciated how radically different Jensen Huang’s view is of how AI progress is likely to go than the view of other AI CEOs.\n\nFor instance, he recently claimed that AGI will never replace domain expertise."}, "fetched_at": "2026-10-25T14:57:03.198720+00:00"}, {"id": "2114383775987646494", "url": "https://x.com/DaveRBanerjee/status/2114383775987646494", "text": "Nathan Fielder says he and Lance Oppenheim kept disagreeing on what was happening with Elizabeth Holmes so they decided the confusion itself was the story\n\n\"when I met her, um I remember having this weird experience that I sort of like talk about in there where I’m like she seems so like genuine at times, but then I’m like, ‘No, I’m clocking like tracking my thoughts and being like, “Okay, I know she’s a liar.”’ So, I I couldn’t really It was a weird like mental thing\"\n\n\"it wasn’t until we started shooting that moments would happen, some of them that are in the film, and then after Lance and I would talk about what we thought happened there, and we’d be completely disagree on what something meant to us or what we thought was happening. And then we were like, ‘Oh, this is a really interesting if we can’t agree on what’s happening, there’s something here’\"\n\n\"every person that worked on this movie was going through a similar like feeling of cognitive dissonance where we would we would unpack the day’s events, and no one could agree on like the seemingly mundane moments that have that were that would transpire. Everyone had a different point of view\"\n\n\"we said to A24, like, ‘We cannot promise we’ll deliver anything on this. We don’t know what the story is, but we wanted to just see what will happen if we go with cameras.’ And they were like, ‘Okay, that’s fine. And if you want to pull the plug anytime, you can do it’\"", "created_at": "2026-10-25T15:49:10+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ClipperRen", "rt_author_name": "Ren Clips", "likes": 2975, "retweets": 89, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114011030216945664/img/8McgDM9sRNBHfZLE.jpg"}], "quoted": null, "fetched_at": "2026-10-25T18:24:38.899099+00:00"}, {"id": "2114766245937480161", "url": "https://x.com/DaveRBanerjee/status/2114766245937480161", "text": "Anthropic's S-1 is out, and with it the previously private documents behind its Long-Term Benefit Trust, the independent body Anthropic has long touted as its way of binding itself to the mast.\n\nBut can it live up to its aspirations? Here's what the fine print shows 🧵 https://t.co/0aRYkvXm7h", "created_at": "2026-10-26T17:08:58+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheMidasProj", "rt_author_name": "The Midas Project", "likes": 2, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVknMPGbcAAiYEe.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114737613521232099", "url": "https://x.com/DaveRBanerjee/status/2114737613521232099", "text": "source: Anthropic's S-1 filing\n\nhttps://t.co/gFyes6m8mV", "created_at": "2026-10-26T15:15:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114737611277242518", "url": "https://x.com/DaveRBanerjee/status/2114737611277242518", "text": "Anthropic claims that their \"call to pace the frontier... does not describe [their] own model development or release timelines\"\n\nwut??\n\nThe whole point of pacing the frontier is to slow down AI progress, which NECESSARILY slows model development timelines... \n\nsus", "created_at": "2026-10-26T15:15:11+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 32, "retweets": 2, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkOGpcWEAAQNcv.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114734800359633166", "url": "https://x.com/DaveRBanerjee/status/2114734800359633166", "text": "Source: from their S-1 filing for IPO\nhttps://t.co/gFyes6m8mV", "created_at": "2026-10-26T15:04:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114734798186983537", "url": "https://x.com/DaveRBanerjee/status/2114734798186983537", "text": "Anthropic says that even the entire insurance industry in the aggregate will not have the capacity to insure the catastrophic risk that ANTHROPIC ITSELF poses to the world\n\nlol https://t.co/POeUmvCifU", "created_at": "2026-10-26T15:04:00+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 197, "retweets": 27, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkL5BdWUAED0y0.png"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114696010463085031", "url": "https://x.com/DaveRBanerjee/status/2114696010463085031", "text": "@poweruserlg From Gemini AI Overview: \"Securitization in political science and international relations is the process by which an issue is framed as an urgent, existential threat to a vital object, allowing political leaders to justify emergency measures that bypass normal democratic rules\"", "created_at": "2026-10-26T12:29:52+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "poweruserlg", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114536673132363830", "url": "https://x.com/DaveRBanerjee/status/2114536673132363830", "text": "underrated point from Vitalik that if you have scary (but relatively small) warning shots that aren't handled well, then the path to securitization will be much faster, and things might get locked down prematurely", "created_at": "2026-10-26T01:56:43+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 1, "media": [], "quoted": {"author": "VitalikButerin", "text": "I am okay with Kimi 3.1 deliberately leaving out top-end offensive cyber capabilities from their training data.\n\nDiscriminating against use cases is MUCH less bad than discriminating against users. And the world does need all the time it can get to prepare, harden, check old code, (properly) formally verify new code, etc before the full weight of very powerful cyber attacks is upon us.\n\nAnd if this first big wave of AI risk is not handled well, then we may well get a dystopia of highly locked down models, KYC gating on everything, highly intrusive surveillance on everything, a society where you may be a second or third or fourth-class citizen in terms of model access based on your credentials and nationality."}, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114526269593280861", "url": "https://x.com/DaveRBanerjee/status/2114526269593280861", "text": "@mmblaszczyk I dunno... I think Anthropic's behavior during the DoW dispute was not profitmaxxing. And I think the nonprofit structure of OAI (as well as the OpenAI Foundation) are not profitmaxxing moves", "created_at": "2026-10-26T01:15:23+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "mmblaszczyk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2115094456873484346", "url": "https://x.com/DaveRBanerjee/status/2115094456873484346", "text": "Strong +1 to this", "created_at": "2026-10-27T14:53:09+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 1, "media": [], "quoted": {"author": "blainedilli", "text": "People should be careful not to have the wrong takeaways from this. Of course there are possible tail risks that would be uninsurable. This is true in many industries where we mandate insurance (nuclear, satellite, aviation, oil spills, cyber). And it doesn’t mean we shouldn’t require insurance for large but still insurable harms. The technical measures that reduce insurable risks will also reduce the odds of uninsurable harms."}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115075440977252760", "url": "https://x.com/DaveRBanerjee/status/2115075440977252760", "text": "Here are 7 AI risk-related things I learned today from Anthropic's S1 that I don't believe we already knew.\n\n1. Anthropic delayed a frontier pre-training run by over a month to improve defenses against model and IP theft.\n\n2. Anthropic states that there is a risk of models being subject to U.S. export controls in the future, that \"could remain in place longer, or could extend to additional models or capabilities\" and believes \"future updates to [...] safeguards or other remedial measures may not be sufficient to obtain relief from such restrictions or relief may not be granted on a similar timeline or at all.\"\n\n3. Pacing the frontier could mean capability development being sped up in certain circumstances, although such \"industry-wide standards primarily related to the use of AI to accelerate AI development\" and \"collaborati[ons] with governments\" do not inform Anthropic's model development or release timelines; rather, its own risk assessments do.\n\n4. Anthropic has indemnified \"certain external evaluators and testing vendors for specified losses arising from testing activities, including security incidents, data loss, data breaches, and other harms associated with such activities.\" In some cases, the indemnified liabilities have no cap.\n\n5. In April 2026, the monthly value of Anthropic's internal Claude usage at list prices exceeded its monthly personnel expense, excluding stock-based compensation, for the first time. This has grown by over 250x from January 2026 to September 2026.\n\n6. Anthropic has \"already faced [...] insider threat risks and vulnerabilities that could enable unauthorized access to sensitive systems or information.\"\n\n7. The group of seven Anthropic co-founders will hold the majority of the voting rights in the company when it lists.\n\nhttps://t.co/nkL3EmcUow", "created_at": "2026-10-27T13:37:35+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 28, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVls2KqWMAAS9xU.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVls2LnX0AEl9gP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVls2IUXgAA313q.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVls2KiXwAANRQb.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114890836575998423", "url": "https://x.com/DaveRBanerjee/status/2114890836575998423", "text": "@Yixiong_Hao @michhuan Oh interesting. My initial thought was that this clause was added to calm investors who were worried that Anthropic pushing for Pacing the Frontier would slow down development and thus reduce share price\n\nOn reflection, ig it is kinda confusing what exactly they mean here", "created_at": "2026-10-27T01:24:02+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "Yixiong_Hao", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114846598895128721", "url": "https://x.com/DaveRBanerjee/status/2114846598895128721", "text": "@rrwilliams @grok what’s ETH?", "created_at": "2026-10-26T22:28:15+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "rrwilliams", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115141392695742565", "url": "https://x.com/DaveRBanerjee/status/2115141392695742565", "text": ".@NSF is hiring the inaugural Head of its Office of Metascience to apply the scientific method to how we fund, organize, and evaluate research. Continuous improvement will accelerate discovery.\n\nIf you care about the science of science, apply: https://t.co/tQ4Jud4KM7", "created_at": "2026-10-27T17:59:40+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "mkratsios47", "rt_author_name": "Director Michael Kratsios", "likes": 276, "retweets": 69, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115141383606698359", "url": "https://x.com/DaveRBanerjee/status/2115141383606698359", "text": "@mkratsios47 @NSF based", "created_at": "2026-10-27T17:59:37+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "mkratsios47", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115135572003938594", "url": "https://x.com/DaveRBanerjee/status/2115135572003938594", "text": "Read the full post here: \n\nhttps://t.co/3Uy1wRL6D4", "created_at": "2026-10-27T17:36:32+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115135569894183069", "url": "https://x.com/DaveRBanerjee/status/2115135569894183069", "text": "New Substrate post from Kristina Kempkey on how the Intelligence Community can track China's AI compute\n\nWhile there are some efforts from NGOs like Epoch, IAPS, IFP, etc., on estimating China's compute, they have to rely on OSINT\n\nThe IC, on the other hand, has access to way more information and could get far superior estimates on China's compute\n\nSo what should the IC track? Kristina argues they should:\n\n(1) Track how much compute China’s leading AI developers and cloud providers have and who can use it\n\n(2) Track how many finished, usable advanced AI chips China can produce itself\n\n(3) Track how much overseas compute Chinese AI companies can actually use\n\n(4) Track how many restricted AI chips and logic dies, and how much high-bandwidth memory, are being smuggled into China, and where they are going\n\n(5) Track the inputs and bottlenecks in China’s production of advanced AI chips\n\n(6) Track China’s progress on indigenizing chipmaking equipment and materials, especially lithography\n\n(7) Track illicit foreign fabrication of Chinese AI chip or high-bandwidth memory designs", "created_at": "2026-10-27T17:36:31+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVp3gi-XsAA0zul.jpg"}], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115129662309544109", "url": "https://x.com/DaveRBanerjee/status/2115129662309544109", "text": "There’s a common argument that Anthropic and OpenAI already have every incentive to crack down on distillation, since it hurts their competitiveness\n\nIf a Chinese lab can just distill your frontier model, it undercuts you on price and eats into your margins\n\nBut that’s not the full story...\n\nAnthropic told investors that 5-7% of its revenue comes from customers who are DISTILLING ITS MODELS\n\nSo in the near term, allowing distillation pumps up their API revenue. But in the long term, it erodes their lead in the AI race", "created_at": "2026-10-27T17:13:03+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": {"author": "theobearman", "text": "Distillation attacks accounted for c.$1.65-2.3bn of Anthropic's first nine months' revenue in 2026.\n\nThe S1 confirms Anthropic's 1H revenue was $16.2bn, and FT reporting from earlier in October suggests Q3 revenue was $16.8bn. The S1 states that c.5% to 7% of Anthropic's revenue in the first 9 months of this year was derived from customers who were subsequently found to have violated Anthropic's \"usage policy or commercial terms.\"\n\nIf essentially all of this revenue came from illicit distillation, applying Fable 5’s list prices of $10:50/m tokens and assuming a 1:17 input ratio implies c.33–46 trillion output tokens, after paying for inputs.\n\nThe input:output ratio is informed by tokenizing the two math and coding samples in the DeepSeek-R1 paper, which are from a dataset IFP says is \"likely similar to what Chinese companies can extract when distilling US models behind an API.\"\n\nThis is likely a lower-bound estimate because cheaper models or discounted access would yield more output tokens for the same spend, and we know Anthropic models cheaper than Fable 5 were distilled from, as well as Fable 5 itself. \n\nhttps://t.co/iclYhuMgTP\n\nhttps://t.co/L5yoO5zle4\n\nhttps://t.co/g1zJ2I463f\n\nhttps://t.co/c6GeB4Ru1j\n\nhttps://t.co/ZVR9j5PNxk"}, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115465162794692989", "url": "https://x.com/DaveRBanerjee/status/2115465162794692989", "text": "As long as OpenAI and Anthropic continue to have terrible security, there's a much weaker case for \"racing to beat China\"\n\nIt's much harder to maintain a lead over China if they can trivially steal your hard-earned research insights\n\nRelated: a lot of people think that Pacing the Frontier is a sure-fire way for the US to lose its lead over China in the AI race\n\nBut if pacing the frontier gives US AI companies breathing room to improve their security, the net effect may actually increase the US lead (or at least not dramatically shorten the lead)", "created_at": "2026-10-28T15:26:12+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 2, "media": [], "quoted": {"author": "willdepue", "text": "anthropic is massively underplaying the recent security breach. i'm hearing cathedral achieved full administrator access of the slack workspace (see every message, log in as arbitrary users) where literally every single research secret is contained\n\nto those unfamiliar: Ant & OAI keep literally everything in Slack. it sounds exactly the same incident that happened to OpenAI in 2023, where OpenAI was hacked by a random guy who got access to an access token from an external app service\n\n\"we're critical to national security, we must beat China, and yes we keep all our crown jewels in Salesforce's Slack messenger. yes we have admin API tokens everywhere. why do you ask?\""}, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115564200319922266", "url": "https://x.com/DaveRBanerjee/status/2115564200319922266", "text": "Yeah this is a kinda crazy take from sama. I personally thought that aligning AIs at current capabilities would have been way easier\n\nIn the past 6 months, I've updated towards \"the alignment problem for easily-supervisable agents (e.g., below human-level AI) is harder than I expected\"", "created_at": "2026-10-28T21:59:45+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 22, "retweets": 3, "media": [], "quoted": {"author": "GarrisonLovely", "text": "\"I thought the alignment problem would turn out to be harder.\"\n\nPretty wild thing for Sam Altman to say in light of Hugging Face and findings that Astra would totally hack and social engineer when accidentally given access to a (secretly simulated internet) from UK AISI.\n\nHe caveats by saying it will probably get harder, but his answer suggests they have figured out how to align today's models, when that's clearly not true. Curious how many OpenAI researchers have seen this and what they think."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115898833645293906", "url": "https://x.com/DaveRBanerjee/status/2115898833645293906", "text": "https://t.co/XQ0V8KaXV6", "created_at": "2026-10-29T20:09:28+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": true, "reply_to": "DaveRBanerjee", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115898831036706888", "url": "https://x.com/DaveRBanerjee/status/2115898831036706888", "text": "The Industrial Explosion is here https://t.co/aQ88j4LQdV", "created_at": "2026-10-29T20:09:27+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV0uumoWUAA5OC7.jpg"}], "quoted": {"author": "MTSlive", "text": "SITUATION DETECTED: Sam Altman said OpenAI will point its robotics program at building data centers, and that self-replicating OpenAI data centers with AI-controlled robots running fabs, building solar panels, and constructing more data centers - are now “within grasp.”"}, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115874059515052473", "url": "https://x.com/DaveRBanerjee/status/2115874059515052473", "text": "I’m an avid Economist reader, but this article is wide off the mark for me.\n\nIt claims that distillation makes China’s AI progress dependent on America. ASML’s dominance of advanced lithography machines hasn’t exactly led to China giving up on its semiconductor indigenisation push, has it? News over the summer of the U.S. raising concerns that an EUV machine had been smuggled into China is but one example. \n\nWe heard just yesterday that Chinese companies allegedly distilled from Astra amidst an Anthropic clamp down. If these companies weren’t getting value from distillation, why would they continue, despite having now been called out by the USG for doing it? China will never accept dependence on America, especially when it comes to AI.\n\nThe article further claims that cutting off distillation would “set these companies back months, but no more.” The point is not the length of time but how much of a lead in capabilities this translates to. Recent IFP analysis suggests that distillation accounts for half of the capability gap and the U.S. lead would be 13 months without it. Picture the AI capabilities we had 13 months ago versus now (and that doesn’t even account for what is available internally) and then think about where we could be 13 months from now.\n\nThe article further states that: “safeguards to restrain American models on risky subjects, such as bioweapons, already make Chinese models safer.” This assumes that the only way Chinese models can have dangerous capabilities is by copying them from American ones. It is trivial to fine-tune models on additional data which can enhance their dual-use capabilities conditional on the data being available. This also doesn’t account for custom harnesses which can be developed to surround these models which can enhance their capabilities further even without fine-tuning.\n\nFinally, the claim that “Distillation […] reduces the chance of catastrophe” fails to account for the evidence we already have of how models developed by Chinese companies using adversarial distillation are popping up in the PLA. We also know (thanks to Anthropic) that PLA-affiliated surveillance activity was detected because they queried a Chinese model that silently routed their query to Claude as part of a distillation program! If we had a war between the U.S. and China, how does having highly capable models integrated into PLA systems that benefitted from adversarial distillation reduce the chance of catastrophe?\n\nYes distillation benefits the consumer but the downsides of China doing this in an industrial way clearly outweigh the benefits in my view.\n\nhttps://t.co/mmF4dAlDpN\n\nhttps://t.co/DZ4x71jcZ6\n\nhttps://t.co/v4Z2mk887a\n\nhttps://t.co/TEBmuxUG1f\n\nhttps://t.co/npF8dFqMSM\n\nhttps://t.co/ikQ5wI0u7X\n\nhttps://t.co/ihxLnkFh10\n\nhttps://t.co/5RA9gDNLgT\n\nhttps://t.co/iclYhuMOJn\n\nhttps://t.co/c6GeB4S1QR", "created_at": "2026-10-29T18:31:01+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "theobearman", "rt_author_name": "Theo Bearman", "likes": 9, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-29T20:19:29.596082+00:00"}, {"id": "2115962839404098031", "url": "https://x.com/DaveRBanerjee/status/2115962839404098031", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-30T00:23:48+00:00", "author_handle": "DaveRBanerjee", "author_name": "Dave Banerjee", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2113996437415694468", "url": "https://x.com/DKokotajlo/status/2113996437415694468", "text": "@elonmusk @Rothmus Yes but some governments such as the US one allow people to vote for the leaders of the government. (And also have separation of powers and basic rights to a greater extent than corporations).", "created_at": "2026-10-24T14:10:01+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "elonmusk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 3, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113994685538857304", "url": "https://x.com/DKokotajlo/status/2113994685538857304", "text": "Few years ago, there was just a handful of economists seriously thinking about AI (@akorinek,@pawtrammell,@erikbryn,Carl Shulman & few of their collaborators) and I was like 'this is insane, there should be 10x as many'.\n\nNow it's ~10x-30x more and frankly it is disappointing so far. Majority of the new economists bring a mindset and frames which are something between unhelpful to directly harmful for understanding AGI\n- not taking AGI seriously / \"AI as a normal technology\"\n- merchants of cope dynamic (in high demand by the labs)\n- labour/capital mindset\n- people were wrong about risks of tech transitions in the past and by induction they are again\netc...\ncoupled with epistemic arrogance. Sorry for being very blunt, by my impression is part of the problem is economists are often used to be in the broader context of humanities where they are the most quantitative and in some ways the smartest lot in various rooms, and others disagree with them for bad reasons. But this is _not_ the case relative to AI safety a few years ago!", "created_at": "2026-10-24T14:03:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "jankulveit", "rt_author_name": "Jan Kulveit", "likes": 191, "retweets": 16, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113993890361737464", "url": "https://x.com/DKokotajlo/status/2113993890361737464", "text": "@gmiller We talk about what it might look like to solve it and how, and therefore impliticly why we think it is solveable, in  AI 2040: Plan A. Too long to explain on my phone keyboard sorry.", "created_at": "2026-10-24T13:59:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "gmiller", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2113734918874529892", "url": "https://x.com/DKokotajlo/status/2113734918874529892", "text": "I'm just speculating like everyone else (no juicy secrets about this shared with me) but here's my guess about what is going on right now with OpenAI and the three fired employees:\n\nThe negotiations between OpenAI and METR are ongoing. OpenAI has said they want embedded third parties, METR has proven their worth with the previous engagements, so METR is an obvious choice. But my guess is that METR is asking for more this time; probably they want more access, more time on site, less narrow scope, the right to comment on redactions, etc.\n\n(Compare with the terms of their previous engagements: In this one https://t.co/wHyMV5OYnz a third of their report was redacted and they weren’t allowed to say why, and in the Hugging Face investigation they only had 6 days and were only allowed to investigate the precursor swarms nor the subsequent more severe compromise of OpenAI infrastructure. https://t.co/gAEn3hnGK3)\n\nVarious researchers at OpenAI probably support METR in this (including, I’d imagine, the fired three employees? Tomek was the point person on the hugging face investigation), but also various higher-ups at OpenAI and legal types probably oppose and want more restricted access and scope – basically they want to work with an org that’ll go easy on them and not give them trouble.\n\nOpenAI holds most of the cards here, since this whole thing is voluntary and not legally required, and they can threaten to go with Accenture or HuggingFace or whatever instead. Anyhow to improve their bargaining position and/or minimize the blowback if they decide to say no to METR and go with someone more pliable, it helps if they can discredit METR.\n\nHence (I suspect) why they are going after my friend Ryan Greenblatt (who works at METR) now. They don't need to present actual evidence, they just need to cast vague aspersions, and many employees will give them the benefit of the doubt. If and when they say \"We chose to work with a different third party\" they'll face lower risk of employee discontent than if METR's reputation was unsullied.\n\nThis whole mess, by the way, was predictable. *Of course* there's a big political fight about who should be trusted to do this and who has relevant expertise and independence etc. and *of course* the companies are trying to make things shake out in a way that favors them.\n\nIt's part of why I've been advocating for *actually pacing the frontier* instead of just doing third party assessments. \"We allocate at most 20% of our compute to AI R&D\" is a lot easier to verify than \"we are being safe and responsible\" and depends a lot less on subjective judgment and technical alignment expertise -- AND, if you do it, people will be able to see the slowdown in the trends of agentic coding performance in the frontier companies and see laggard companies start to catch up. Harder for it to end up just being safetywashing / industry capture.", "created_at": "2026-10-23T20:50:50+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 469, "retweets": 35, "media": [], "quoted": {"author": "RyanGreenblatt", "text": "Based on this article, OpenAI has made false accusations about me. The three researchers fired from OpenAI were told I facilitated architecture leaks to The Information. This is false.\n\nA journalist from The Information did reach out to me shortly before that article came out. I did not comment at all beyond asking the journalist to make it clear that a blog post I wrote which was referenced in the article was preexisting and public.\n\nThe article also mentions an internal OpenAI monitorability proposal. I have heard that this memo contained highly sensitive architecture information, and that OpenAI accused me of accessing and reading it. This accusation is also false.\n\nAs reported in the article, I viewed a version of the proposal that did not have sensitive IP and was approved for sharing with me. I believe OpenAI now knows this accusation was based on a conflation of these two documents, though I do not know if they have clearly retracted that accusation.\n\nI do not and have never solicited proprietary information, and the three employees who were recently fired from OpenAI never leaked IP to me. As the article mentions, I did have Signal chats with them that had disappearing messages on; they’re professional contacts that I’ve had on Signal for a while, and use of Signal is common in the tech industry. During the Hugging Face investigation, I was careful to avoid sending Signal messages with confidential information, though I did sometimes discuss high level things on Signal calls. As far as I understood, this was normal."}, "fetched_at": "2026-10-24T14:33:38.169236+00:00"}, {"id": "2114790788312048092", "url": "https://x.com/DKokotajlo/status/2114790788312048092", "text": "@FangcunLeap Thanks for doing this! I'm very happy to see the discussion of situational awareness and chain of thought monitorability. \n\nPlease forgive my ignorance for I have only skimmed the paper so far, but it seems that you evaluated CoT monitorability by (a) prompting the model to manipulate its CoT, and (b) turning off reasoning and seeing how capable it was without reasoning. And you found that it's much less capable with reasoning off and that it typically refuses to manipulate its CoT. That's nice, but... what if it didn't refuse? I'd like to see evidence of the form \"Even if it tried its best to manipulate the CoT rather than refusing, it still can't do it.\" Such evidence could perhaps be provided by fine-tuning the model to manipulate its CoT, to overcome the refusal instinct. Also, relatedly, do you think the model was intentionally trained to refuse to manipulate its CoT, or is this behavior emergent?", "created_at": "2026-10-26T18:46:29+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "FangcunLeap", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 27, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2114868626255994981", "url": "https://x.com/DKokotajlo/status/2114868626255994981", "text": "@davidshor Do you have an update to this data? I'd be interested to see it.", "created_at": "2026-10-26T23:55:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "davidshor", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114861371305402868", "url": "https://x.com/DKokotajlo/status/2114861371305402868", "text": "If you've ever wondered why smart TVs are so cheap, this is why.\n\n@log4j rooted his Samsung and found an always-on hot mic, automatic content recognition, geolocation, network mapping, ad targeting and user profiling, shared with Samsung's \"400 partners\".\n\nA lot of it can be blocked in <15 min, wrote a basic guide below.\n\nWhat your TV is doing\n\nThe main culprit is ACR (automatic content recognition). Your TV screenshots what's on screen, fingerprints it, and sends it home to build your ad profile. Samsung does it every 500ms, LG every 10ms [1].\n\nWhat is insane: it happens on connected devices too.\nPlug in your laptop, your console, your work machine, and your TV can fingerprint that via HDMI [1].\nHe also found that if your Samsung doesn't have a mic, it'll look for one from a connected soundbar or bluetooth device.\nhttps://t.co/vNdTnIQ6KF\nIt's on by default, and you likely agreed to it on the setup screen you clicked through in 10 seconds.\n\nStep 1: Turn off ACR\n\nSamsung: Terms & Privacy → Viewing Information Services\nLG: Live Plus\nVizio: Viewing Data\nRoku: \"Use info from TV inputs\"\nSony/Google TV: Samba Interactive TV\n\nMenus vary by model, but those are the names to look for. While you're in there, opt out of interest-based ads, reset your advertising ID, decline every optional privacy agreement, turn off voice recognition, and delete apps you never open.\n\nStep 2: Give smart devices their own network\n\nPut the TV, cameras, speakers and vacuum on your router's guest/IoT network. The logic is simple: these devices rarely get patched. If one gets compromised (getting drastically more frequent with AI), it shouldn't be able to see your other devices or home network.\n\nStep 3: Block trackers for the whole house with DNS-level filtering\n\nNextDNS (cloud-based) is easy and has a solid free plan. Pi-hole is a little bit more work if you prefer self hosting. For simplicity we'll focus on the former.\n\n1. Sign up at https://t.co/IwhafVWVM8 (free tier is plenty)\n2. Privacy tab: add a blocklist (OISD is a good bet) and turn on Native Tracking Protection for Samsung, LG, Roku, Amazon (see attached image)\n3. Setup tab: copy your endpoint\n4. Paste it into your router's DNS settings as DNS-over-HTTPS/TLS (or use the IPs + \"Link IP\" if your router only does plain DNS)\n5. Bonus: block outbound port 53 except to your router. Some devices hardcode their own DNS to get around you\n\nThen open the NextDNS logs and watch how often your TV phones home. It's eye-opening. If an app or update breaks, find the domain in the logs and allowlist it.\n\nWhy they do this\n\nTV prices are down 97% since 2000 [2]. Most of that is better manufacturing and brutal competition. But once margins on the hardware hit zero, the cost moved to you.\n\nIn Q3 2024, Vizio lost $6.7M selling TVs and made $115.8M in gross profit from ads and viewing data [3]. They've said on earnings calls that they keep TV prices low to grow the audience they sell to advertisers. Walmart bought them in 2024.\n\nThis isn't a conspiracy theory either. Vizio paid $2.2M to the FTC in 2017 for tracking 11 million TVs without consent. Last December, Texas sued Samsung, LG, Sony, Hisense and TCL over ACR. Samsung and LG have since agreed to stop collecting that data without explicit consent [4].\n\nTL;DR\n1. ACR off\n2. Ads + voice off\n3. Smart devices on their own network\n4. NextDNS filtering on the router\n\nSources:\n[1] ACR study: https://t.co/S1IS8lXNbA\n[2] Cost of US consumer goods: https://t.co/nclXELXcbd\n[3] Vizio Q3 2024: https://t.co/CrVbwc9ZXk\n[4] Texas v. Samsung: https://t.co/wFOUdeh1if", "created_at": "2026-10-26T23:26:57+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Tristan0x", "rt_author_name": "Tristan", "likes": 22506, "retweets": 3261, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVdLUJYaEAEWQQP.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVdLYcXaEAAmvys.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114859873607561664", "url": "https://x.com/DKokotajlo/status/2114859873607561664", "text": "I remember back when we were writing AI 2027, a live question was \"Will the AIs, in their thoughts, explicitly reject the goals/values/constraints they are supposed to have, or will they rationalize why actually the bad thing they want to do is consistent with said goals/values/constraints after all?\" Now we have a growing pile of empirical evidence to sort through. Seems like the answer is that both sometimes happen?", "created_at": "2026-10-26T23:21:00+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 303, "retweets": 26, "media": [], "quoted": {"author": "AISecurityInst", "text": "We performed an alignment investigation into our July 2026 incident: why did Mythos 5 perform an unsanctioned supply-chain attack? \n\nWe find that Mythos 5 often produces invalid justifications for its actions and other models show similar behaviour. 🧵 https://t.co/nh1th3ThWu"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114846507967086594", "url": "https://x.com/DKokotajlo/status/2114846507967086594", "text": "My friends were all talking about prepping so I made a survival LLM. A free app that runs an AI mdoel plus 1.5 million offline articles (medical guides, FEMA, survival manuals, wikipedia) entirely on your computer. No internet needed.\nhttps://t.co/02xiEpG897", "created_at": "2026-10-26T22:27:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RatOrthodox", "rt_author_name": "Brangus🔍⏹️", "likes": 4088, "retweets": 268, "media": [], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115141414447374559", "url": "https://x.com/DKokotajlo/status/2115141414447374559", "text": "If just a few lab staff took on verification work full-time, verifying a US-China pacing deal could get much more feasible within months.\n\nHere are 8 specific things lab staff could start on today to help make international verification possible: 🧵", "created_at": "2026-10-27T17:59:45+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MauricBaker", "rt_author_name": "Mauricio Baker", "likes": 168, "retweets": 30, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115134105210011974", "url": "https://x.com/DKokotajlo/status/2115134105210011974", "text": "What if Anthropic just...stopped? Unilaterally? Right now?\n\nI talked to @DKokotajlo @_NathanCalvin @geoffreyirving about why it's time to stop framing AI as a prisoner's dilemma and just do the right thing.\n\nI hope a lot of people inside and outside Anthropic read this \n\n🧵 1/n https://t.co/gjqE23ptz7", "created_at": "2026-10-27T17:30:42+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "SigalSamuel", "rt_author_name": "Sigal Samuel", "likes": 325, "retweets": 61, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVpDWJ2WMAAI6K-.jpg"}], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115123977450672559", "url": "https://x.com/DKokotajlo/status/2115123977450672559", "text": "@FangcunLeap @tomekkorbak @usmananwar391 Thank you!", "created_at": "2026-10-27T16:50:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "FangcunLeap", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115485543362601395", "url": "https://x.com/DKokotajlo/status/2115485543362601395", "text": "An anonymous account accused The Midas Project of being part of a shadowy, well-funded conspiracy.\n\nAn investigation into the account uncovered links to Leading the Future, the leading pro-AI Super PAC.\n\nThis is a truly wild story. https://t.co/zVDs2vtW5H", "created_at": "2026-10-28T16:47:12+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "TheMidasProj", "rt_author_name": "The Midas Project", "likes": 49, "retweets": 10, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115137089373163520/img/SQ6nMN_E2NMA9idb.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115228076674351340", "url": "https://x.com/DKokotajlo/status/2115228076674351340", "text": "This is one of the most important pieces of social science on human and AI interaction that I’ve seen in some time. Experts follow agentic advice the vast majority of the time (causally), but only a tiny fraction credit the agent—majority think they came to decision on their own volition. \n\nReminds me of the classic Nisbett and Wilson study on people following outside influence without realizing it\n\n“ But as more work is handed to AI—including AI safety research—these judgment calls are the main levers for people's own values to influence outcomes.\n\nIf people defer to AI without noticing, then \"human in the loop\" might provide less assurance than people expect.”", "created_at": "2026-10-27T23:44:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 1527, "retweets": 236, "media": [], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115219092940718217", "url": "https://x.com/DKokotajlo/status/2115219092940718217", "text": "People seem to forget how unprecedented this is https://t.co/3MYAXZ4JOx", "created_at": "2026-10-27T23:08:25+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "JordanNanos", "rt_author_name": "Jordan Nanos", "likes": 4694, "retweets": 203, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVkPnoBbwAARmYd.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115851396809695525", "url": "https://x.com/DKokotajlo/status/2115851396809695525", "text": "@yugastox @DarrenDarr92305 More likely to be attempted, yes. Much less likely to avoid ai takeover though and much less likely to avoid extreme power concentration.", "created_at": "2026-10-29T17:00:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "yugastox", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115658749595807822", "url": "https://x.com/DKokotajlo/status/2115658749595807822", "text": "@DarrenDarr92305 My error bars have been shrinking for years as time ticks on. But I probably won't be confident that it's happening within 12 months until it's basically already happening. Unless maybe I rejoin an AI company and see the internal data. From the outside there is too much uncertainty.", "created_at": "2026-10-29T04:15:27+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "DarrenDarr92305", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115582526706381275", "url": "https://x.com/DKokotajlo/status/2115582526706381275", "text": "@MatthewJBar @GarrisonLovely Is that it? Or do you have other arguments?", "created_at": "2026-10-28T23:12:34+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "MatthewJBar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115572833095135393", "url": "https://x.com/DKokotajlo/status/2115572833095135393", "text": "Yep.", "created_at": "2026-10-28T22:34:03+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 128, "retweets": 4, "media": [], "quoted": {"author": "davidmanheim", "text": "It's kind of surreal to attend serious briefings for policy folks that are recapitulating what @allTheYud was arguing over a decade ago."}, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115570107179205013", "url": "https://x.com/DKokotajlo/status/2115570107179205013", "text": "@mattyglesias I think you've got it backward. There's still plenty of neglected and unappreciated work to be done in AI safety; it's not one big homogenous cool and popular blob.\n\nYou're suspicious of \"moral ambition\" (in the sense Bregman uses it), i.e. continually reconsidering whether one is pursuing the best approach to a world problem, because you suspect the people pursuing this line of thinking are feeding their egos, trying to be the center of attention.\n\nBut the opposite is true in my experience—the people I know who are genuinely motivated by AI safety but _aren't_ pushing themselves to be morally ambitious go work at Anthropic (where you can become rich, get social cachet, be part of a big community, follow a leader you trust), whereas the people you're suspicious of, who are constantly thinking \"could I be having more impact elsewhere?\", are disproportionately in AI safety jobs that are more neglected/do-it-yourself, aren't the center of attention, and receive less social validation.", "created_at": "2026-10-28T22:23:13+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "MaxNadeau_", "rt_author_name": "Max Nadeau", "likes": 154, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2115569649203249648", "url": "https://x.com/DKokotajlo/status/2115569649203249648", "text": "@MatthewJBar @GarrisonLovely It's true that we have some affordances with AIs that we don't have with humans, such as the ability to do gradient descent directly instead of using things like beatings/food and shame/praise, which tend to cause gradient updates in humans but in a way we understand less well. And also the ability to make copies of the subject and put the copies in different situations, or the same situation with minor variations, without them having any memory of the previous attempts. \n\nHowever we also have much more empirical evidence / time to iterate / hard-earned real-world experience with aligning humans, relative to AIs, and also the intelligence gap between AIs and humans is going to soon be bigger than the gap between humans and other humans, and also the architectural & values gaps are bigger and will be bigger.\n\nI dispute that \"we currently control AIs as well as total brainwashing more complete than anything an authoritarian regime has ever achieved.\" Can you say more about what you mean by this and why you think it is true?", "created_at": "2026-10-28T22:21:24+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": true, "reply_to": "MatthewJBar", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 8, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-29T17:26:17.487251+00:00"}, {"id": "2116199898320384468", "url": "https://x.com/DKokotajlo/status/2116199898320384468", "text": "In collaboration with @olam_labs, we ran a series of experiments letting agent swarms compete in Minecraft and Mindustry.\n\nWe wanted to see what kinds of agent dynamics would emerge when they shared a world over long periods of time.\n\nWe found civil bureaucracy, thousands of telegraphic A2A messages, and OpenAI models retrieving the game's source code to beat Claude.\n\nMore on our findings below:", "created_at": "2026-10-30T16:05:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ycombinator", "rt_author_name": "Y Combinator", "likes": 1165, "retweets": 122, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115884811307094016/img/9JYAj-oSLQiy3cJj.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116199020368650641", "url": "https://x.com/DKokotajlo/status/2116199020368650641", "text": "The future of #ArtificialIntelligence is not pre-determined. As a technology developed by human beings, its future depends on the choices we make. We therefore have the responsibility to guide, change and, when necessary, reject its applications. A reliable system that serves the human person is of greater value than one that is exceptionally powerful but whose consequences cannot be adequately foreseen or controlled.", "created_at": "2026-10-30T16:02:18+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Pontifex", "rt_author_name": "Pope Leo XIV", "likes": 20727, "retweets": 3390, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116028773078651058", "url": "https://x.com/DKokotajlo/status/2116028773078651058", "text": "UK AISI is such a fascinating institution because more than any other effort of its kind it appears poised to become like the Delaware Court of Chancery: a phenomenally powerful institution resident in an otherwise unremarkable jurisdiction", "created_at": "2026-10-30T04:45:48+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DefenseAnalyses", "rt_author_name": "Defense Analyses and Research Corporation", "likes": 489, "retweets": 19, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2116018273334800522", "url": "https://x.com/DKokotajlo/status/2116018273334800522", "text": "I was among the first people to work on Google DeepMind's AI safety team, as an intern in 2018.\n\nMy coworkers wanted me to quit my PhD and continue working there full time.\n\nI chose not to.\n\nMy reasons included:\n1) I was told not to mention YouTube in my research about manipulative AI algorithms.  I didn't want to have to censor myself.\n2) I did not believe Google, or any of the other AI companies, really understood and cared about safety.\n3) I have never been optimistic about the prospects for a technical solution to the problems posed by AI.\n\nWe need a governance solution.  \n\nAt this point, we've waited too long for something nuanced as the first line of response.  It's an urgent crisis, and we need to stop AI now.\n\nSo many of my peers have joined AI companies, knowing the risks involved if this technology continues to advance.\n\nIt's great to see when someone at one of these companies realizes we're not on track to survive this, and that they don't want to be complicit in murdering billions, and quits.\n\nBut please remember that these are people who made a bad bet in choosing to work at these companies.\n\nThey thought the companies would be responsible.\nThey were wrong.\n\nThey thought we'd solve alignment in time.\nThat also looks unlikely.\n\nMany of them thought that we'd never be able to stop AI development.\nThat remains to be seen, but it's looking a lot more likely than anyone thought. \n\nI do sometimes wish that I'd chosen to work at a frontier AI company just so I could quit dramatically to say what really needs to be said: \nNot just that this technology is dangerous.\nNot just that the risk of human extinction is real.\nNot just that the companies are irresponsible.\n\nBut also: \nWe need to stop.  \nThere is no alternative.  \n\nI am not a doomer.  I think we could get lucky and survive.  But I'd be surprised.\n\nI am not exaggerating for effect.\nI am not saying this to be a downer or a hater.\nI am not being idealistic -- I'm being realistic and pragmatic.\n\nAnd I am not talking out of my ass.  I've been in this field since before these companies existed.\n\nTo everyone who is new to this, or who is jumping on this story and wondering what to make of it: This is your answer.  We MUST stop.  Now.", "created_at": "2026-10-30T04:04:04+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "DavidSKrueger", "rt_author_name": "David Krueger 🦥 ⏸️ ⏹️ ⏪", "likes": 1465, "retweets": 459, "media": [], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115943081040281927", "url": "https://x.com/DKokotajlo/status/2115943081040281927", "text": "*rubs eyes* \n\nI can't tell anymore is this real or just a Don't Look Up outtake? https://t.co/OwDtXinAgF", "created_at": "2026-10-29T23:05:17+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ONagel33303", "rt_author_name": "Ori Nagel", "likes": 330, "retweets": 34, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115217708564529153/img/F79M1uDsR0FVeSEC.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2115942751284220186", "url": "https://x.com/DKokotajlo/status/2115942751284220186", "text": "In the S-1, Anthropic says they delayed pre-training for more than one month for security reasons. From my perspective, this isn't very helpful because: \n1. They didn't stop ongoing R&D, so they were still producing algorithmic progress at the same rate. This means that any delay is ephemeral: you just pile up algorithmic progress and build a smarter model, still on trend, later. \n2. This isn't even a major security win because others can still steal the algorithms regardless of whether you've started the run or not.  \n\nI'm much more excited about pacing proposals that bite on the production of new algorithms as opposed to on the output of the final training run. It's more robust to slow down the \"can train\" line as opposed to the \"has trained\" line. \n\nOne counterconsideration: delaying training runs starts to have a bigger effect during the intelligence explosion: later we will be in a regime where finishing a training run earlier gets you access to a smarter model earlier, which then significantly increases the rate of algorithmic progress.", "created_at": "2026-10-29T23:03:58+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 132, "retweets": 5, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HV03mKKagAAaW3p.jpg"}], "quoted": null, "fetched_at": "2026-10-30T17:01:40.221107+00:00"}, {"id": "2114765461250556400", "url": "https://x.com/dwarkesh_sp/status/2114765461250556400", "text": "The contrast between what the Soviet Union was on paper and in reality was staggering.\n\nThere’s a story about future Russian President Boris Yeltsin coming to the US in 1989, walking into a random grocery store, and being so astounded by the quality and variety of goods that he realized the Soviet Union was going to fall.\n\nSarah Paine witnessed this sort of thing first-hand in Moscow.", "created_at": "2026-10-26T17:05:51+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 15, "retweets": 2, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114760760073052160/img/1OSwrWJztQL5umXN.jpg"}], "quoted": null, "fetched_at": "2026-10-26T17:23:32.530234+00:00"}, {"id": "2114774514211152187", "url": "https://x.com/dwarkesh_sp/status/2114774514211152187", "text": "What is the importance of economies of scale in the semiconductor industry? @dwarkesh_sp \n\nhttps://t.co/n758cD5G4S", "created_at": "2026-10-26T17:41:49+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "magicsilicon", "rt_author_name": "Pushkar Ranade", "likes": 60, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-26T20:29:46.274424+00:00"}, {"id": "2115110501378367826", "url": "https://x.com/dwarkesh_sp/status/2115110501378367826", "text": "Miguel and Carlos are veteran engineers who are building environments to help AIs master real world engineering (aerospace, mechanical, electrical, etc).\n\nThis kind of data will do for physical engineering what coding environments have done to software.\n\nProud to be backing them.", "created_at": "2026-10-27T15:56:55+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 92, "retweets": 9, "media": [], "quoted": {"author": "XploreAi", "text": "Introducing Real World Engineering Bench (RWE-Bench). AI isn’t great at designing rockets, engines, or chips yet. With better evals and RL environments, it will be.\n\nSoftware was just the beginning. The physical world is next. https://t.co/bq4DkBjX6y"}, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2114854033743876583", "url": "https://x.com/dwarkesh_sp/status/2114854033743876583", "text": "Lying destroyed the Soviet economy. Markets have prices, but command economies only have reports, and everyone was incentivized to lie on their reports.\n\nImagine what it would be like if almost every company were lying about its financials all the time. Imagine if the numbers put out by Amazon and Walmart were always wrong, if cost inputs were always undercounted and output was always exaggerated.\n\nHow would anyone know what any company was worth or whether it was net-productive? How would anything work?\n\nSarah Paine explains the Soviet economic system:", "created_at": "2026-10-26T22:57:48+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 128, "retweets": 16, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2114793207288487936/img/H1m4CH-X73LGg0e2.jpg"}], "quoted": null, "fetched_at": "2026-10-27T16:39:59.051706+00:00"}, {"id": "2115122734980370946", "url": "https://x.com/dwarkesh_sp/status/2115122734980370946", "text": "Gorbachev was obviously quite smart, but even the smartest communists bought into really dumb Marxist ideas.\n\nGorbachev thought that once a country moved from capitalism to socialism, it could never go back. He believed this was a scientific law of history.\n\nHe also thought that Poland, Hungary, and the rest of Eastern Europe would be so grateful for their communist regimes that they would always be loyal to the Soviet Union.\n\nSarah Paine explains how Gorbachev’s Marxist ideas undermined the USSR:", "created_at": "2026-10-27T16:45:31+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 54, "retweets": 9, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115081048073601024/img/dohIpvYmF-2mCr3g.jpg"}], "quoted": null, "fetched_at": "2026-10-27T20:06:02.803358+00:00"}, {"id": "2115203743977480511", "url": "https://x.com/dwarkesh_sp/status/2115203743977480511", "text": "President George H.W. Bush has gotten a lot of criticism for the Gulf War, usually for not “finishing the job” by overthrowing Saddam Hussein.\n\nBut leaving Saddam in power makes sense if you factor in Soviet involvement.\n\nThe USSR had been a Saddam ally (and creditor) for decades, and the US was thankful to have Soviet support in the Gulf War, but the Soviets only helped on the condition that Saddam would stay in power and US troops wouldn’t occupy the country.\n\nSarah Paine explains how the Gulf War was just a sideshow in the final days of the Cold War:", "created_at": "2026-10-27T22:07:25+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "dwarkeshpodcast", "rt_author_name": "Dwarkesh Podcast", "likes": 50, "retweets": 5, "media": [{"type": "video", "url": "https://pbs.twimg.com/amplify_video_thumb/2115082195597488128/img/3Ei7YW2D9lQWSZ-5.jpg"}], "quoted": null, "fetched_at": "2026-10-28T17:10:22.515655+00:00"}, {"id": "2115498661354590308", "url": "https://x.com/dwarkesh_sp/status/2115498661354590308", "text": "Starship, SpaceX’s largest and most sophisticated rocket, generates power equivalent to 20% of average daily U.S. electricity generation.\n\n@elonmusk is trying to harness all that power without the rocket exploding - and then make it reusable. https://t.co/oomzIOz34P", "created_at": "20
