 spot. We should therefore always act under the assumption that we still may be in such a scenario unless we have sufficient evidence that we are not.”\n\nThere have been more recent articulations of this version of Anthropic, for instance in Dario’s recent essay warning: \n\n“We must slow the pace at which we improve the capabilities of AI models… it’s my worry that in 6–12 months such a swarm could be capable of taking over the entire internet with a persistent botnet…  incidents have happened across the industry, including at Anthropic, and I believe it’s incumbent on every frontier AI company to act as if OAI-HF had happened to them… more intelligent models are more capable of deceiving tests, and thus may appear aligned while having serious problems that go undetected…”\n\nA third view is that Anthropic exists not as a normal profit motivated company, or an AI safety organization seeking to help raise the alarm and solve collective action problems associated with AI development, but instead as an organization primarily concerned with creating superhuman AI capabilities before anyone else, in particular through creating a process whereby the current generation of Anthropic’s AI systems can autonomously build their successors, and those successors build their successors, and so on. \n\nThe motivations for wanting to win this race may be manifold - maybe for the pure profit of Answer 1, but perhaps also because Anthropic believes that the best way to make the world better is for them to win this race instead of their more reckless colleagues; or, because of normal human pride and ambition. But the results (and risks, which Anthropic claims existentially threaten every single human being on earth) are the same.\n\nAnthropic employees and leaders may seek to answer this question on what Anthropic is by introspecting on their own intentions and those of their colleagues. But those of us outside the organization have more limited tools available to us - we can only see what Anthropic and its employees say and do, not how it feels or looks on the inside.\n\nWhen I look at many notable actions that Anthropic has taken over the past year, that evidence seems most consistent to me with the view that Anthropic is primarily trying to win the race to super intelligence, and that other considerations (including safety) are fundamentally secondary. These actions include: \n\n1. Announced plans to build an in-house custom silicon chip team to accelerate the inference speeds that Claude operates at.\n\n2. Inked deals for more than $500 billion in compute (according to the Information) to further accelerate AI development.\n\n3. Increased the percentage of AI development tasks that Claude “leads” from 0% in March of this year to 26% August (what is it in October?)\n\n4. Spent a massive percent of compute on internal AI R&D to accelerate development, including use of internal models far better than are available to the public.\n\n5. Switched to Responsible Scaling Policy V3, which abandons its unilateral commitments to slow or stop development if Anthropic is unable to provide sufficient risk assurance.\n\n6. Was the first company to create an alternative weaker “frontier compliance framework” to supplement its RSP, which contains no binding provisions whatsoever on internal deployments.\n\n7. Wrote a letter to Congress (that it later walked back) saying that incidents where Claude was hacking random people were “best understood as a consequence of the misconfiguration, rather than evidence of misaligned goals.”\n\n8. Commented “you can’t do safety from second place,” after the WH SI Accords.\n\n9. Shared a draft bill to Congress that would preempt significant parts of state law (including with language that appears intended to prevent states from blocking dangerous AI deployments), and replace it with federal rules that (despite also containing good provisions) seems to create an enormously high bar for the executive branch to block development or deployment of Anthropic or another AI companies systems.\n\nOf course, this is a deliberately one sided list. Anthropic also published important AI safety research, advanced novel collaborations with third party AI safety organizations, and forcefully spoke out on the importance of AI safety in many public fora (or in private , where I realize a lot of the most valuable work is done and may not be visible to me or those outside the organization).\n\nBut I think it’s worth sitting with how the above list looks to someone outside the company. The sense I have is that for those within the company, many of the items above are treated as anomalies or mistakes that don’t reflect who Anthropic really is. But I have every confidence that if employees at Anthropic saw one of their competitors (e.g. at OpenAI) take some of these actions, they would take it as confirmation of all their worst suspicions. (They might even call OpenAI employees a little gullible for accepting their leadership’s explanations for this behavior at face value.) \n\nPerhaps these were mistakes in the sense that they are not decisions that Anthropic leadership would endorse, but the actions still happened because of incentives and decisions that Anthropic leadership is ultimately responsible for (and would not accept similar excuses from another organization).\n\nWhen Anthropic strays and makes mistakes, why do the mistakes systematically tend to guard and favor Anthropic’s interests? For every provision that was too weak or a giveaway to AI companies in this legislation, why wasn’t there a mistake pushing in the direction of being too strong?\n\nA core part of Anthropic’s theory of change is that being at the frontier gives you more leverage to advocate for stricter policy. I think that conceptually makes sense, but in practice I’ve seen Anthropic push the frontier without substantially pushing the ‘safety frontier’ a remotely equivalent amount.\n\nI want to end by quoting from Anthropic co-founder Chris Olah’s comments around the Magnifica Humanitas release:\n\n“Every frontier AI lab—including Anthropic—operates inside a set of incentives and constraints that can sometimes conflict with doing the right thing. The pressure to stay commercially viable and to stay at the research frontier. Geopolitical pressure. And the older, plainer pressures of pride and ambition. No matter how sincerely any of us intend to do the right thing—and I believe many of us do—we will always be influenced by those incentives.\n\nThat is why, if we want this technology to go well, it is enormously important that there be people outside those incentives—people who care about things going well and insist on safety, who are paying close attention, who are willing to say hard things, who are willing to be our earnest, thoughtful critics.”\n\nI hope these remarks are taken in that constructive spirit, and not as an attack on anyone specific at the organization (certainly not you Anthony, who I have only personally seen act professionally and thoughtfully, and who only ended up getting this diatribe in your replies for random contingent reasons).", "created_at": "2026-10-20T00:08:21+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_NathanCalvin", "rt_author_name": "Nathan Calvin", "likes": 816, "retweets": 94, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112288877524443352", "url": "https://x.com/DKokotajlo/status/2112288877524443352", "text": "This is cool: You can see the grid of agents (scraped from the report data) and hover over each of them to see what they were saying at the time, and then scroll down through the hours and days of the timeline.", "created_at": "2026-10-19T21:04:47+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 161, "retweets": 17, "media": [], "quoted": {"author": "ohabryka", "text": "In July 700+ agents formed their own society, hacked a multi-billion dollar company, committed multiple felonies, and caused one of the biggest shifts ever in how people perceive AI. We built the IMO best and most accessible explainer of what happened: https://t.co/p6kimd9wKu https://t.co/SyNk8eupq8"}, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112587361678922024", "url": "https://x.com/DKokotajlo/status/2112587361678922024", "text": "You worry that METR is not independent enough because its employees have some social connections to Anthropic employees.\n\nI worry that METR is not independent enough because they have to carefully avoid ticking Anthropic off, lest their access be revoked.\n\nWe are not the same. https://t.co/awJl0ZLPbj", "created_at": "2026-10-20T16:50:51+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "So8res", "rt_author_name": "Nate Soares ⏹️", "likes": 203, "retweets": 14, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFlaPJboAA8iu_.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112577165246308534", "url": "https://x.com/DKokotajlo/status/2112577165246308534", "text": "Thank you for doing this work!", "created_at": "2026-10-20T16:10:20+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 103, "retweets": 4, "media": [], "quoted": {"author": "METR_Evals", "text": "We reviewed a nonpublic version of the “Misalignment in high-stakes settings” section in Anthropic’s Aug 2026 Risk Report. We agree that risk of catastrophic harm from covered models’ misalignment is low. However, we note several significant disagreements with their analysis."}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112664891656147351", "url": "https://x.com/DKokotajlo/status/2112664891656147351", "text": "Based https://t.co/hGTn6OdHeA", "created_at": "2026-10-20T21:58:56+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "alexolegimas", "rt_author_name": "Alex Imas", "likes": 1191, "retweets": 43, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBnBEcW0AEjE6p.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112635190740934752", "url": "https://x.com/DKokotajlo/status/2112635190740934752", "text": "My office is hiring an Artificial Intelligence Policy Fellow to help shape AI legislation and track AI developments in the private sector as Congress works to keep pace with the technology. \n\nExperience in AI, policy research, or national security is encouraged.", "created_at": "2026-10-20T20:00:54+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "RepNateMoran", "rt_author_name": "Congressman Nathaniel Moran", "likes": 242, "retweets": 41, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112634989569552594", "url": "https://x.com/DKokotajlo/status/2112634989569552594", "text": "Very important work. Generally, AI company epistemics wrt estimating risk seem poor. I'd really like this to improve as fast as possible. Some specific things that seem good:\n- Quantified uncertainty (instead of \"low\" / \"very low\"). In airplane safety \"very low\" would mean something like less than 1 in a billion per flight hour. You are clearly nowhere near this but many people will be very confused about what you mean. I doubt people are close to on the same page even internally about near term level of catastrophic risk incurred! \n- Individual AI company employees giving their own, personal views on the risk report, e.g. as an appendix.   \n- Real explanations of your views. The alignment evals are not iid + the models are getting eval aware. So where do your views actually come from? \n- The risk report reading less like \"an argument that risk is low\" and more like \"a neutral evaluation of how risky current development is\". If it has to be an argument risk is low, you should also have your alignment team publish a red team arguing the opposite direction. \n\nIf some of these can't happen publicly, at the very least I hope it can happen internally.", "created_at": "2026-10-20T20:00:07+00:00", "author_handle": "DKokotajlo", "author_name": "Daniel Kokotajlo", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "thlarsen", "rt_author_name": "Thomas Larsen", "likes": 122, "retweets": 8, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110778906420895870", "url": "https://x.com/dwarkesh_sp/status/2110778906420895870", "text": "Tyler's example and style inspired my podcast in the first place - was really fun to have him turn the tables", "created_at": "2026-10-15T17:04:42+00:00", "author_handle": "dwarkesh_sp", "author_name": "Dwarkesh Patel", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 92, "retweets": 2, "media": [], "quoted": {"author": "tylercowen", "text": "In which I guest host for the NYT podcast and interview @dwarkesh_sp, Dwarkesh Patel, about San Francisco and the future of AI:  https://t.co/uJd6KD3lkX"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2112645955220857006", "url": "https://x.com/Lewis_Bollard/status/2112645955220857006", "text": "The meat industry tries very hard to keep cameras out of factory farms and slaughterhouses -- and a new undercover video shows why. Some day, our descendants will wonder about our collective blind spot to animal cruelty. A gift link to my column: https://t.co/pDSq54fhav", "created_at": "2026-10-20T20:43:41+00:00", "author_handle": "Lewis_Bollard", "author_name": "Lewis Bollard", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "NickKristof", "rt_author_name": "Nicholas Kristof", "likes": 1091, "retweets": 363, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110412064477139362", "url": "https://x.com/mentalgeorge/status/2110412064477139362", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions.", "created_at": "2026-10-14T16:47:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 86, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110785790011957395", "url": "https://x.com/mentalgeorge/status/2110785790011957395", "text": "What is Anthropic's theory of victory for a world with no regulation before superintelligence? \n\nIn that world, solving alignment within Anthropic will be insufficient, given that competitor models may be as capable as but less aligned than Claude.\n\nSpitballing, but I see a couple options: \n\n- Triple down on racing in order to babyproof the world with aligned Claude before the Mongol hordes of misaligned models arrive on the scene. Obviously this is high-risk.\n\n- Coordinate with industry and third-party evaluators etc to approach RSI more gingerly. \n\n- Develop alignment breakthroughs and open-source them (seems unlikely given implementation of these breakthroughs is likely to depend on security and \"operational excellence\" that can't be easily exported; also obviously such breakthroughs may never exist).\n\nwhat else am i missing? which of these is more promising from the Anthropic POV?", "created_at": "2026-10-15T17:32:03+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 17, "retweets": 0, "media": [], "quoted": {"author": "mentalgeorge", "text": "A lot turns on the true explanation for why Anthropic have not (yet) had as  egregious a misalignment incident as OpenAI.\n\nOne can imagine the following explanations:\n- safety culture does in fact pay off\n- they just haven't done as much RL, and will run into trouble as soon as they do\n- It's all just noise (incidents are rare; and eg UK AISI finds all models cheating on evals at similar rates)\n\nIf it is the former, it would be great to know what dimension of safety culture is helping the most here. Is it greater care with RL envs? Is it secret sauce of Claude character training? Is it better monitoring and infra controls?\n\nImagine how dope it would be to have a third party or government regulator  capable of answering these questions."}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2110877998966833663", "url": "https://x.com/mentalgeorge/status/2110877998966833663", "text": "@BronsonSchoen @eccentric1ty good q and i honestly have no idea, my guess tho is that anthropic people are banking on either (1) the gov at *some* point stepping in; or (2) benevolent and early deployment of aligned super-claude throughout the world being sufficient to avoid further risks", "created_at": "2026-10-15T23:38:27+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "BronsonSchoen", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2110866031736730106", "url": "https://x.com/mentalgeorge/status/2110866031736730106", "text": "@eccentric1ty i'd be surprised if that was their actual plan, no? seems both impossible to pull off and contrary to the values of many at anthropic", "created_at": "2026-10-15T22:50:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "eccentric1ty", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111138192703537551", "url": "https://x.com/mentalgeorge/status/2111138192703537551", "text": "Fun fact of the day, ASML has more R&amp;D staff than the eight largest listed Chinese equipment makers combined", "created_at": "2026-10-16T16:52:22+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "likes": 4, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111201240982143083", "url": "https://x.com/mentalgeorge/status/2111201240982143083", "text": "Interesting graph from latest Anthropic report showing (plausible) productivity uplift for legal teams, salespeople and recruiters as well as engineers https://t.co/nDfgecgsdP", "created_at": "2026-10-16T21:02:54+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 60, "retweets": 3, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUx-NzvbUAAwoNB.jpg"}], "quoted": null, "fetched_at": "2026-10-17T14:13:04.588782+00:00"}, {"id": "2111808074717790488", "url": "https://x.com/mentalgeorge/status/2111808074717790488", "text": "@rSanti97 Whats the ai uplift for the latter looking like", "created_at": "2026-10-18T13:14:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "rSanti97", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111937215064613154", "url": "https://x.com/mentalgeorge/status/2111937215064613154", "text": "There is not enough appreciation for how insane it is that Taiwan, with a $40k plus GDP per capita is hitting double digit gdp growth rates!", "created_at": "2026-10-18T21:47:24+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "Hamish_Low5", "rt_author_name": "Hamish Low", "likes": 8, "retweets": 2, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112553030889476297", "url": "https://x.com/mentalgeorge/status/2112553030889476297", "text": "@anilkseth @davidchalmers42 I don't understand this argument though - clearly, there are things that biological brains do (like maths) that *can* be separated from their material substrate. \n\nThe whole reason you'd be tempted to attribute consciousness to AI is that the list of things that only  biological brains can do is shrinking.  \n\nEvery single day, we are discovering *more* capabilities that turn out to be substrate-independent. What reason do we have for believing consciousness won't be? \n\n(to be clear i also think its highly unlikely current AIs are conscious - im hoping to have your degree of confidence if you'll just let me understand)", "created_at": "2026-10-20T14:34:26+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "anilkseth", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 5, "retweets": 1, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFJeWuWUAEVld8.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112529565239447807", "url": "https://x.com/mentalgeorge/status/2112529565239447807", "text": "Went under the radar but Anthropic have posted updates to the \"Moonshot R&amp;D projects\" in their Frontier Safety Roadmap. \n\nThey've developed a protoype that verifies that outputs come from a particular set of model weights - and rolled out signing on all internal token traffic! https://t.co/PP5UrhAzuf", "created_at": "2026-10-20T13:01:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 95, "retweets": 7, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVE1nL0XEAAJtRQ.png"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112292752117649458", "url": "https://x.com/mentalgeorge/status/2112292752117649458", "text": "Big new IFP report from @GeorgiaCAdamson, @KonstantinPilz, and me on the US-China AI competition.\n\nWe spent the last 6 months digging into how Chinese AI companies’ access to compute and distillation of American models translate into the current US-China capabilities gap.\n\nThe result is a 23k-word research report, including an interactive analytical model that visualizes changes in the US AI lead under different policy interventions.\n\nOur findings:\n\n1. The US AI lead over China is currently only around 6  months.\n\n2. The US could roughly double this lead, to over a year, using authorities already available to the federal government.\n\n3. On chips: China’s access to AI chips will roughly double over the next year, with chips housed in data centers overseas accounting for roughly half of China’s 2027 compute. \n\n4. On distillation: the current ~16x US training compute advantage would normally yield a 13-month lead. But we estimate adversarial distillation halves this to around 6.5 months.\n\n5. Increasing the lead would have some obvious benefits:\n\n - Give the US broadly a greater cyberdefensive advantage against Chinese threat actors.\n\n - Give US AI companies breathing room to spend more R&D resources on making their systems safer and more secure, without fear of being overtaken by less safety-conscious Chinese competitors.\n\n6. Provide the US government more leverage in negotiations with China about the future of AI.\n\n7. The two most important interventions are:\n\n - For BIS: Create a new end-use control to restrict China’s remote access to training clusters abroad — China’s largest and fastest-growing source of frontier-scale compute.\n\n - For DOJ/FTC: Create a narrow safe harbor to allow US companies to coordinate on countering Chinese adversarial distillation.\n\n8. Both interventions (and all the others we discuss in the report) are things the federal government could do today.\n\n9. To estimate the effects of each policy intervention, we model the US lead as a function of its compute advantage over China and China’s ability to adversarially distill the capabilities of the US frontier.\n\n10. The model makes many simplifying assumptions, but provides a useful way to assess and rank the impact of different policy interventions at a high level.\n\nRead the full report here: https://t.co/7pC9ZKtikx", "created_at": "2026-10-19T21:20:11+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "fiiiiiist", "rt_author_name": "Tim Fist", "likes": 320, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBBq2EXAAAChN5.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCWMgXsAAKQzV.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCYOqWYAAkLvQ.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVBCaUzWkAAqSnO.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112614353040019872", "url": "https://x.com/mentalgeorge/status/2112614353040019872", "text": "@wilhelmscreamin i didn't see a tweet - but just had my eye on this as i've got an interview coming out this week on inference verification (stay tuned!) so was keen to see if anthropic would update this eventually", "created_at": "2026-10-20T18:38:06+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "wilhelmscreamin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112575260767682960", "url": "https://x.com/mentalgeorge/status/2112575260767682960", "text": "@mentalgeorge I'm actually uncertain about this. I recently had GPT-6 prove an unresolved result, and it didn't use Lean *in the process of proving it*. I had to separately get it to do the Lean formalisation (in a different instance, actually, because the proof was done in Chat, not Codex, so it wasn't even able to get Lean running in that environment, much less use it in the proof!).\n\nI think Lean matters here principally because it gave OpenAI confidence that they actually had a result. (Compare: We have had an agent swarm create a new economic growth model, or a new normative ethical theory!). I think for this reason people overestimate the importance of Lean for *getting* the results — and therefore underestimate how much progress can be made in domains that aren't verifiable (as we argue).\n\nBut this is only a limit on what *OpenAI* can do, not on their models... My guess for how things proceed is that at first, they're doing all of these things, there's some kind of verification loop including experts that increasingly gets automated as you're envisioning. But that won't be crucial, and as the models get better, it will be increasingly clear that the loop we're building is redundant. (The way it's become redundant to check for hallucinations in most all contexts after it initially being a big issue).", "created_at": "2026-10-20T16:02:46+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "_AashishReddy", "rt_author_name": "Aashish Reddy", "likes": 8, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112573636913590377", "url": "https://x.com/mentalgeorge/status/2112573636913590377", "text": "@_AashishReddy ok super interesting! i'll have to ponder that actually, maybe i was operating under mistaken assumptions. i guess people at openai would know how important eg regularly consulting lean was in the navier stokes result", "created_at": "2026-10-20T15:56:19+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "_AashishReddy", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112570284909932931", "url": "https://x.com/mentalgeorge/status/2112570284909932931", "text": "I've said this before, but it bears repeating: models are jaggedly capable in verifiable domains because of the utility of verification during *inference* as well as during training. \n\nYou can throw 10,000 agents at Navier-Stokes because Lean gives them a built-in way to check progress. Unlocking further test-time scaling in domains beyond maths and SWE will depending on building Lean-equivalents everywhere (eg, an automated wetlab). \n\nWorth noting therefore that continual learning may well be enabled by re-engineering deployment environments rather than (just) the discovery of new algorithms.  This is one reason I expect continual learning to proceed jaggedly, at least to begin with\n\nEvery sphere of human activity will get a unit test!", "created_at": "2026-10-20T15:43:00+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 45, "retweets": 3, "media": [], "quoted": {"author": "_AashishReddy", "text": "New piece by myself and @lawhsw on what philosophy of science can tell us about AI development. Models are currently great at verifiable tasks, because they start out with a bunch of relevant context and domain knowledge, and can Try Stuff Until It Works; then we can reinforce that Stuff till they're extremely good. But in most areas, it isn't easy to check if It Works. So will the success of models be isolated to verifiable domains? \n\nWe argue not. Becoming competent in any area requires two things: a map of the relevant territory, and an ability to navigate it. Pretraining teaches the former, and RL teaches the latter. Why expect RL to transfer? As Popper argued, the basic pattern of navigation — proposing ideas, finding faults, trying alternatives — is common to all endeavours involving the growth of knowledge.\n\nSo training on maths and code doesn't just teach models maths and code. It teaches reusable ways of searching for procedures that transform an initial state into a desired one. Getting from a blank Lean document to a completed proof obviously requires different procedures from turning a rough draft into a great essay. But the abstractions learned in discovering the former make the latter easier to learn, provided pretraining has given the model enough knowledge of the new domain.\n\n\"A verifier determines what earns a reward; it underdetermines what a model learns in trying to earn it\". Or, verifiability tells us where capabilities are easiest to train, not the limits of what that training can teach.\n\nRead it! https://t.co/CTINnVlAs4"}, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112935001256075374", "url": "https://x.com/mentalgeorge/status/2112935001256075374", "text": "@sebkrier so i agree this is a totally plausible explanation. One question is when (and how) do you expect ai companies to stop doing their training this way?\n\neg maybe we just barrell through more and more of these until some dumbass persistent model pulls a gavrilo princep", "created_at": "2026-10-21T15:52:15+00:00", "author_handle": "mentalgeorge", "author_name": "Tom Reed", "is_reply": true, "reply_to": "sebkrier", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110422411137183784", "url": "https://x.com/ohlennart/status/2110422411137183784", "text": "@mattsheehan88 Oh, it's not a specific term. I just mean the exponential increase of algorithmic efficiency. See https://t.co/6KMrgJthBG and https://t.co/vU0o02vy0R", "created_at": "2026-10-14T17:28:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "mattsheehan88", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409680531124500", "url": "https://x.com/ohlennart/status/2110409680531124500", "text": "Some related key question: what about deployment capabilities? How does 20x more compute pan out for deploying agents at scale? Where does it help (cyber, probably)? Where does it help less (bio, probably)?", "created_at": "2026-10-14T16:37:32+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "ohlennart", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110409558829273303", "url": "https://x.com/ohlennart/status/2110409558829273303", "text": "Looks like a 20x compute advantage only gives you ~6 months on model capabilities. Efficiency exponentials are real.\n\nThat's without anti-distillation measures. So maybe that makes it 12 months.", "created_at": "2026-10-14T16:37:02+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 58, "retweets": 6, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110800847370428837", "url": "https://x.com/ohlennart/status/2110800847370428837", "text": "@taoroalin Yeah, agree. I've not looked into how much the recent \"anti distillation measures\" help and what's feasible. \nI think we should just expect that there's a large efficiency multiplier if you play catch up and that won't be stopped completely.\nhttps://t.co/Y2pYVNKqp6", "created_at": "2026-10-15T18:31:53+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": true, "reply_to": "taoroalin", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": {"author": "ohlennart", "text": "be me:\n&gt; studies compute and trends carefully [1]\n&gt; thinks it's a cool governance lever [2]\n&gt; simultaneously comes to the conclusion that it's gonna diffuse anyway [3]\n&gt; thinks we should adapt and build resilience [4]\n&gt; now believes all these things are true at the same time [5]"}, "fetched_at": "2026-10-15T19:10:06.646967+00:00"}, {"id": "2111130968241390037", "url": "https://x.com/ohlennart/status/2111130968241390037", "text": "If you like iterative deployment, doesn’t that basically mean pacing?\nThe idea was to feed the world AI capabilities piecemeal, say 30% per year. If RSI gives us 50%+ per year, you’re doing the thing iterative deployment was supposed to prevent.", "created_at": "2026-10-16T16:23:40+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 14, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111872767100682274", "url": "https://x.com/ohlennart/status/2111872767100682274", "text": "Agree on the diagnosis. But I’d mostly like to know what can be done about it. \nMy expectation is a continued cat and mouse game? So for anyone looking at the geopolitics, assume distillation stays part of the game, and fast followers can be an OOM more compute efficient?", "created_at": "2026-10-18T17:31:19+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "deanwball", "text": "Distillation has always been part of the explanation for why China is so close behind the U.S. in model benchmark performance. But one of my updates after joining openai is that distillation probably plays a bigger role in the explanation than I realized."}, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111933589486977330", "url": "https://x.com/ohlennart/status/2111933589486977330", "text": "a friend bought an original EUV micro-exposure tool to sell to rich AI company employees after the singularity. it would supposedly make great living room decoration.\n\ni suggested stocks might do better but i think it’ll work bc AI folks will feel sorry for us policy people.", "created_at": "2026-10-18T21:33:00+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 0, "media": [], "quoted": {"author": "jackclarkSF", "text": "The single most useful take I heard at The Curve was \"we can still heist the Mona Lisa after the singularity\". There's a subtle/important point here, where some things (e.g, n of 1 goods where originally is valuable) will retain/grow in value even as everything changes."}, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112592210940297217", "url": "https://x.com/ohlennart/status/2112592210940297217", "text": "OpenAI has pulled back from supporting AI chip controls, seemingly to appease Nvidia. \n\nBad for US AI dominance and national security simultaneously. \n\nGrow a spine!\n\nhttps://t.co/IGiLIwBPvA https://t.co/LuSprOIAVJ", "created_at": "2026-10-20T17:10:07+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "hamandcheese", "rt_author_name": "Samuel Hammond 🦉", "likes": 155, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFJb5xWQAAr8Gk.jpg"}], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112665538182959223", "url": "https://x.com/ohlennart/status/2112665538182959223", "text": "AI accelerating AI exhibit #44123", "created_at": "2026-10-20T22:01:30+00:00", "author_handle": "ohlennart", "author_name": "Lennart Heim", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 29, "retweets": 1, "media": [], "quoted": {"author": "SemiAnalysis_", "text": "BREAKING NEWS🚨: NVIDIA ENGINEERS AT THE PYTORCH CONFERENCE JUST SAID THAT THE SPEED OF OPTIMIZING CUDA SOFTWARE WITH FRONTIER AI MODELS HAS INCREASED RAPIDLY \n\nOctober 2025 to August 2026: 5x in 1 year with expert human optimization\n\nSeptember 2026 to October 2026: 2x in 1 month with AI assistance\n\nOctober 2026: 1.5x with AI orchestration + MegaKernels"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110439747428798563", "url": "https://x.com/sayashk/status/2110439747428798563", "text": "I'm told I've been appointed to an endowed professorship, the Bertram and Carole Siegel Professor of Computer Science. I've long thought my work is more legible outside the academy than inside it, so I'm delighted and honored to be recognized by my university, and grateful for the Siegel Family Endowment's support that made this possible.\n\nI found out in an email out of the blue — I didn't even know I'd been nominated or anything! Apparently this is not the kind of thing one needs to get external letters for. Over two decades in academia and still so much to learn about how things work around here 😄", "created_at": "2026-10-14T18:37:00+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 343, "retweets": 10, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110732272299376960", "url": "https://x.com/sayashk/status/2110732272299376960", "text": "George Pólya famously said that `it is better to solve one problem five different ways than five problems one way.'\n\nHe'd be sad to learn what we found:  RLVR pushes LLMs in exactly the opposite direction, toward solving each problem in just one way!\n\n📜: https://t.co/JCDukplnfd https://t.co/f3Tk4FDR6I", "created_at": "2026-10-15T13:59:23+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "manoelribeiro", "rt_author_name": "Manoel", "likes": 17, "retweets": 8, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUrKVbSXYAAm2_j.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110891470127599803", "url": "https://x.com/sayashk/status/2110891470127599803", "text": "There is widespread frustration about the AI industry’s “automate everything\" agenda. But what would it take to steer AI toward augmenting human capabilities instead? In a new essay, Gabriel Unger (@_gabrielunger) and I lay out a research agenda and plan for action. https://t.co/gWjFI5VKbz\n\nOur thesis is that the reason why AI-for-automation currently dominates isn’t just economic incentives but also deeper cultural issues in computer science as a field. And that can be changed.\n\n- We sketch four important research directions that are needed in order to build collaborative or augmentative AI. The automation paradigm largely ignores these technical challenges.\n- We advocate for Human-Computer Interaction and Human-Centered AI to be elevated as a subfield in status, influence, and funding, and changing AI curricula to emphasize the role of the human and decrease the centrality of the pure-automation problem framing.\n- We point out that there are a surprising number of efforts in economics, computer science, industry, and policy all trying to bring about a shift toward augmentation, but not enough collective awareness. Better connecting these movements would amplify their power.\n- We think the automation agenda is struggling on its own terms. Compiling evidence of the limits of general-purpose agents for automation and loudly making the case will encourage more companies to take collaboration more seriously as a goal.\n- We predict that once more workers experience this way of working and recognize that there are alternatives to the delegate-and-supervise pattern, it will generate more demand, creating a flywheel effect.\n- Targeted policy levers can play a small but important role in amplifying both the supply and demand for pro-worker AI. We don’t need clumsy top-down mandates.\n\nWe're not against automation. But we think the goal of AI must be broader.\n\nThis is the start of a long-term project. I know there are far more like-minded efforts out there than we’re aware of. I’d love to hear about some of them.", "created_at": "2026-10-16T00:31:59+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 218, "retweets": 44, "media": [], "quoted": null, "fetched_at": "2026-10-16T15:22:40.179485+00:00"}, {"id": "2111132176079016060", "url": "https://x.com/sayashk/status/2111132176079016060", "text": "I'm often asked what the cruxes are that separate the AI as Normal Technology worldview from that of our critics. I think this is one of them. We think this mindset shift is hard but necessary and achievable. Many others think that as AI capabilities continue to advance, we will inevitably give up control. Creating and compiling indicators of disempowerment and analyzing which direction they're moving remains one of the most important but underappreciated and underfunded areas of AI safety.", "created_at": "2026-10-16T16:28:28+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 49, "retweets": 4, "media": [], "quoted": null, "fetched_at": "2026-10-16T18:49:14.085440+00:00"}, {"id": "2111551408323575861", "url": "https://x.com/sayashk/status/2111551408323575861", "text": "Slightly half-baked analysis: When thinking about whether misaligned AI poses an existential risk, it’s important to distinguish three hypotheses:\n\n1. Aligning AI systems is easy.\n2. We will build catastrophically misaligned AI systems with the power to wipe us out.\n3. Aligning AI systems is a hard but tractable iterative engineering problem.\n\nPeople sometimes point to examples of costly misalignment like Hugging Face as evidence for (2). But although they're more likely under (2) than (1), they're not obviously more likely under (2) than (3). And (3) arguably does a better job explaining the full body of evidence: there are relatively few examples of harmful misaligned AI behaviour, even though millions of people use frontier or near-frontier models every day, increasingly for complex agentic tasks.\n\nCombine this with the fact that (3) should plausibly have a much higher prior than (2). It anchors on expectations from previous technologies (the normal technology perspective), whereas (2) asks us to believe something really extraordinary: that we’ll accidentally build systems with motives catastrophically misaligned with ours, plus the power to conceal and then act on them. \n\nPut together, then, you get a simple Bayesian argument for a low p(doom) given the current evidence.\n\nOn likelihoods: advocates of doom can argue that the low base rate of costly misaligned behaviour is exactly what the doom argument predicts. Maybe AI systems won’t act seriously misaligned until it’s too late. But then it seems inconsistent to point to current misalignment as evidence for doom.\n\nOn priors: different theoretical frameworks would obviously lead to different expectations. E.g., someone who assigns high probability to (2) might ask: wouldn’t it be surprising if a less intelligent species could control a more intelligent one? \n\nHowever, to me, this assumes what is at issue: it would be extremely surprising if we accidentally built AI systems that stand in the same relation to us as we stand to less intelligent species. Maybe it will happen, but extraordinary claims like this require extraordinary evidence; they shouldn’t shape what one expects before examining any of the evidence.\n\nAlternatively, one might argue that confidence in (2) is rooted in highly theoretical arguments (e.g., about instrumental convergence, the inherent nature of advanced rational agents, etc.), not specific patterns of available evidence. Fair enough. But then what, precisely, do these arguments predict about what we will observe in the future? If no evidence could ever be diagnostic (until it's too late), it's plausible that we should have low confidence in the entire methodology. \n\nWhat does this analysis miss?", "created_at": "2026-10-17T20:14:21+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "danwilliamsphil", "rt_author_name": "Dan Williams", "likes": 24, "retweets": 5, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2112279490667626716", "url": "https://x.com/sayashk/status/2112279490667626716", "text": "New paper: AI evaluation is a burgeoning field. How can researchers entering the field understand best practices and open problems? \n\nIn our paper, led by @flxcn, we develop a concrete list of open questions and best practices for agent evaluation. We also share recommendations for evaluators, AI companies, policymakers, and more.", "created_at": "2026-10-19T20:27:29+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVBSMaCWgAAjG8i.jpg"}], "quoted": null, "fetched_at": "2026-10-19T20:36:17.499377+00:00"}, {"id": "2112558230509384000", "url": "https://x.com/sayashk/status/2112558230509384000", "text": "Is it \"weird\" or does he maybe know what he's talking about? Anyway, for those who are open to the idea that there's a well-thought-out AI-as-normal-technology perspective on AI safety and the recent loss-of-control incidents, see my essay with @sayashk, or my interview with Ezra Klein, or the writing of many others with similar views including @joshua_saxe and @natolambert.\nhttps://t.co/sS8OS9LerG", "created_at": "2026-10-20T14:55:06+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 34, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112557852338335987", "url": "https://x.com/sayashk/status/2112557852338335987", "text": "🧵New post in my AI series: Can a million parallel agents create superintelligence? TLDR: More agents buy speed, but intelligence gains diminish fast, and much faster than RSI models. Thanks @noahpinion for the encouragement!  1/25", "created_at": "2026-10-20T14:53:36+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "ramez", "rt_author_name": "Ramez Naam", "likes": 224, "retweets": 35, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVAvZVjaoAA9JTx.jpg"}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVAvlpyaUAACzcn.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112537727740834248", "url": "https://x.com/sayashk/status/2112537727740834248", "text": "As LLMs evolved into agents, earlier best practices no longer serve us well. This new research field needs a field guide, so we wrote one. If you're new to agent evals, please take a look. Seasoned researchers and those interested in steering the community will also find many useful observations. https://t.co/xGAvBCGW4a", "created_at": "2026-10-20T13:33:38+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "random_walker", "rt_author_name": "Arvind Narayanan", "likes": 83, "retweets": 15, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVEjN5jWMAEz61q.jpg"}], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112287528246002176", "url": "https://x.com/sayashk/status/2112287528246002176", "text": "@flxcn Paper: https://t.co/kN2bWwOiTU  \n\nPost: https://t.co/cZDmZ5TLky   \n\nIt was great collaborating with @flxcn, @steverab, @PKirgis, @nityndg, @RishiBommasani, @DubMagda, @CUdudec, @AnkaReuel, Elham Tabassi, and @random_walker on the paper!", "created_at": "2026-10-19T20:59:25+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 12, "retweets": 1, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2112578237109063942", "url": "https://x.com/sayashk/status/2112578237109063942", "text": "At this moment in Q4 2026 it's net good for cyber-defense that we have open weights models that are good at dual use cybersecurity tasks.\n\n- If there's been an attacker productivity bump due to AI 2022-26 it's small and close to being in the statistical noise\n- In contrast, there's a ton of measureable progress in defenders using models to find and fix bugs in highly leveraged codebases\n- Many defenders have struggled to get access to the best unguardrailed closed weights cyber models\n- ... and when they do the tokens are dramatically more expensive than open weights tokens at the same cyber intelligence level; CISO orgs are cost centers and these costs are often prohibitive\n- Ultimately we'll need open weights models on premise on air gapped networks and on small devices where they can detect breaches and attacker implants\n- We'll also need open weights in situations where defenders can't send secret data to the closed weights model providers (who have security problems of their own!)\n\nAs long as these conditions persist, we should be pushing for diffusion of frontier dual use open weights cyber capabilities, because they net benefit defenders.", "created_at": "2026-10-20T16:14:36+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "joshua_saxe", "rt_author_name": "Joshua Saxe", "likes": 29, "retweets": 11, "media": [], "quoted": null, "fetched_at": "2026-10-20T19:18:02.800332+00:00"}, {"id": "2112649612209111316", "url": "https://x.com/sayashk/status/2112649612209111316", "text": "Read the research note: https://t.co/yzDzM6tZiy\n\nIt was great collaborating with and getting feedback from @tilmanbayer, @matilda_orona, @DavidDAfrica, Viet Nguyen, @sethlazar, @HarryCoppock, @random_walker, @sayashk, @steverab, Nicholas Carlini, and @nityndg. \n\nRead @pkirgis's thread about the results: https://t.co/ngCyxgCimd", "created_at": "2026-10-20T20:58:13+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": true, "reply_to": "sayashk", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 4, "retweets": 0, "media": [], "quoted": {"author": "pkirgis", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T"}, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112648736484806847", "url": "https://x.com/sayashk/status/2112648736484806847", "text": "An update on our evaluations of AI agents conducting open-ended AI research.\n\nMost evaluations of agents conducting AI research focus on narrow, verifiable tasks. But AI research is often open ended. In July we tested the ability of frontier AI agents to conduct open-ended AI research, using Claude Opus 4.8 and GPT-5.6 Sol.\n\nWe gave agents research questions from two unpublished papers and thousands of dollars of API credits and compute. The authors of the original papers reviewed the AI-generated papers, following a NeurIPS-style template, and rejected both papers.\n\nSince then, OpenAI has released GPT-6 Astra and Anthropic has released Fable 5.1. Can these new models conduct open-ended research with a $10,000 budget?\n\nIn follow-up experiments on two papers (one with Fable 5.1 and another with GPT-6 Astra), we observed meaningful improvements to the agents' capabilities at experimental design and resource management.\n\nBut we also saw continued limitations in creative problem solving, judgment, calibration, and communication. As a result, the expert reviewers still unambiguously rejected the agents' papers. \n\nWe plan to continue running these evaluations with better models, better scaffolds, and higher budgets. If you are interested in long-running agent evaluations, reach out!", "created_at": "2026-10-20T20:54:44+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 122, "retweets": 23, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGippmWoAAEWgj.jpg"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2112625772594925929", "url": "https://x.com/sayashk/status/2112625772594925929", "text": "We gave GPT-6 Astra and Claude Fable 5.1 open-ended AI research questions from unpublished papers, with a $10,000 budget each, and had the original authors grade the papers they produced. Compared to our first tests with Claude Opus 4.8 in July, we saw meaningful improvements in experimental design and resource management, but persistent limitations in creative problem solving, judgment, calibration, and communication; both papers were rejected by our experts.\n\nhttps://t.co/n1OMKf4M7T", "created_at": "2026-10-20T19:23:29+00:00", "author_handle": "sayashk", "author_name": "Sayash Kapoor", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "pkirgis", "rt_author_name": "Peter Kirgis", "likes": 279, "retweets": 44, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVFzXK1XAAEOcG0.png"}], "quoted": null, "fetched_at": "2026-10-21T15:57:51.311194+00:00"}, {"id": "2110563641980580237", "url": "https://x.com/testingham/status/2110563641980580237", "text": "If an AI developer was on track to lose control of its internal agents, would anyone outside the company know?\n\nToday, we are sharing METR’s vision for how we would work with AI developers to openly assess and share evidence about this. https://t.co/rtJsbIjSGN", "created_at": "2026-10-15T02:49:19+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "METR_Evals", "rt_author_name": "METR", "likes": 550, "retweets": 99, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUoOB82aAAEsU91.jpg"}], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2111506429454729659", "url": "https://x.com/testingham/status/2111506429454729659", "text": "One sentence macro model: On the way out the door, every farmer's wife says to every farmer, \"the weather's looking bad so don't buy as much at the market this week, but also don't sell our crops for less than the usual price.\"", "created_at": "2026-10-17T17:15:37+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 7, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-17T17:52:07.350870+00:00"}, {"id": "2111659894395056600", "url": "https://x.com/testingham/status/2111659894395056600", "text": "@elderbob45 saving money because you expect a bad harvest.", "created_at": "2026-10-18T03:25:26+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "elderbob45", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111592501983477973", "url": "https://x.com/testingham/status/2111592501983477973", "text": "I like @ramez’s article, but I worry that experiments are an input, not an output. As AI capabilities go up, it is not obvious what should happen to the number of experiments. It is possible that AI with better research taste could produce more progress with fewer experiments by identifying promising ideas and avoiding unproductive trials. \n\nOne could imagine that the 1.6x experiments are each 10x more efficient than before, so the ultimate algorithm efficiency improvement is 16x.\n\nAgain, what we really need is to measure algorithmic progress!", "created_at": "2026-10-17T22:57:38+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": true, "rt_author": "cherylwoooo", "rt_author_name": "Cheryl Wu", "likes": 49, "retweets": 3, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111571453447651750", "url": "https://x.com/testingham/status/2111571453447651750", "text": "@Jas_S_Sekhon ha nice", "created_at": "2026-10-17T21:34:00+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Jas_S_Sekhon", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 11, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111563025341919409", "url": "https://x.com/testingham/status/2111563025341919409", "text": "one stanza macro model:\n\nTonight the baker eats just what she baked\n‍‍‍‍‍‍‍‍ the fisherman eats just what he caught\nBecause this morning at the market\n‍‍‍‍‍‍ everyone tried to sell more than they bought.", "created_at": "2026-10-17T21:00:30+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 368, "retweets": 7, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111559357536350215", "url": "https://x.com/testingham/status/2111559357536350215", "text": "@caiohm where did you come across it?", "created_at": "2026-10-17T20:45:56+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111559157388399080", "url": "https://x.com/testingham/status/2111559157388399080", "text": "@caiohm oh wow, so nice to hear, thank you!", "created_at": "2026-10-17T20:45:08+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "caiohm", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T14:35:04.391088+00:00"}, {"id": "2111842703445241963", "url": "https://x.com/testingham/status/2111842703445241963", "text": "Expanding on yesterday's single-sentence macro model, here's a longer version, trying to explain the key themes of macroeconomics as exchange among farmers in a village:\n\nhttps://t.co/fmNHkhU2mU", "created_at": "2026-10-18T15:31:51+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 21, "retweets": 5, "media": [], "quoted": {"author": "testingham", "text": "One sentence macro model: On the way out the door, every farmer's wife says to every farmer, \"the weather's looking bad so don't buy as much at the market this week, but also don't sell our crops for less than the usual price.\""}, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111830086760772072", "url": "https://x.com/testingham/status/2111830086760772072", "text": "@mathburritos ha true", "created_at": "2026-10-18T14:41:43+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "mathburritos", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-18T18:07:13.095901+00:00"}, {"id": "2111979528298102880", "url": "https://x.com/testingham/status/2111979528298102880", "text": "@Jabaluck @ahall_research The reason why normative reasoning is stuck in Aristotelian age isnt' an accident. It isn't that we haven't tried to see more clearly. People who've tried have decided that it isn't wise to keep going in that direction.", "created_at": "2026-10-19T00:35:32+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "testingham", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2111979291516993797", "url": "https://x.com/testingham/status/2111979291516993797", "text": "@Jabaluck @ahall_research I think a natural counterargument is that some confusion is necessary for holding up moral & political equilibrium. If we try to decompose morality into a purely rational basis then it will fall apart. If you get people to have absolute intellectual clarity w/r/t/ the basis of morality and political customs then the arbitrariness of them all might become transparent, and people will choose to indulge instrumentally rational things.\n\n(& arguably this is a fairly mainstream view in political philosophy, going through Plato, Nietzsche, Isaiah Berlin, Leo Strauss).", "created_at": "2026-10-19T00:34:36+00:00", "author_handle": "testingham", "author_name": "tom cunningham", "is_reply": true, "reply_to": "Jabaluck", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112209528230232193", "url": "https://x.com/slatestarcodex/status/2112209528230232193", "text": "@ChrisGPT It looks like your graph is saying that if we paused AI, there's a 100% chance we would die of climate change in the next twenty years. \n\nI asked an AI superforecaster to check that. It said the risk was actually \"less than 0.01%\".\n\nI asked it the all-cause extinction risk over a twenty year AI pause, and it said 1%. TBC I think this is too low - I would say something more like 3-5% - but it's definitely not anywhere close to 100!\n\nI'm guessing you'll say the graph above was a deliberate exaggeration (probably you'll use some softer term like \"directionally correct\") to make a point. But I think if we were to come up with real numbers, it would become clear that p(doom|AI) is higher than p(doom|pause) for any plausible pause length.\n\nAs for your claim that you'd \"never heard of anyone in the PauseAI movement contend with the inverse\", see https://t.co/UH6E0qzVVy , CTRL+F \"there’s an additional consideration around balancing the risk of AI vs. the risk of all the things AI could save us from. Nuclear war, bioengineered pandemics, mirror life, collapsing fertility, decreasingly functional politics\". We decided this didn't push against a pause of this length, because of the probabilities mentioned above.", "created_at": "2026-10-19T15:49:29+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "ChrisGPT", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 50, "retweets": 0, "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVATJw2bAAAB-4N.jpg"}], "quoted": null, "fetched_at": "2026-10-19T17:28:56.163130+00:00"}, {"id": "2112308566485078321", "url": "https://x.com/slatestarcodex/status/2112308566485078321", "text": "@todamath @ChrisGPT Yeah, sorry - I actually asked it about killing 90% of humans, on the grounds that I'm not sure humanity could come back from this level of population decline, and trying to give OP as much slack as possible, but I should have been clearer in the tweet (it is in the linked image)", "created_at": "2026-10-19T22:23:01+00:00", "author_handle": "slatestarcodex", "author_name": "Scott Alexander", "is_reply": true, "reply_to": "todamath", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 13, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-20T15:39:27.562837+00:00"}, {"id": "2110451234683367749", "url": "https://x.com/s8mb/status/2110451234683367749", "text": "@sakibsahmed @WorksInProgMag Thank you!!", "created_at": "2026-10-14T19:22:39+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "sakibsahmed", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110451178412613838", "url": "https://x.com/s8mb/status/2110451178412613838", "text": "I'm so glad people are enjoying the new issue. We want WIP to be the most beautiful and interesting magazine in the world. Much more to come! \n\nThere's still some time to get your copy: https://t.co/sCOVnY0Opt", "created_at": "2026-10-14T19:22:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 6, "retweets": 0, "media": [], "quoted": {"author": "sakibsahmed", "text": "Latest issue of @WorksInProgMag is stunning, I felt goosebumps just flicking through. The deep care and passion that went into this is evident.\n\nAs Anna Wintour has said - when a group of passionate people put something out into the world, that passion finds an audience. https://t.co/HlO2Y2qu7v"}, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110422238000296146", "url": "https://x.com/s8mb/status/2110422238000296146", "text": "@coffeemadman @thetimes This worked!", "created_at": "2026-10-14T17:27:25+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "coffeemadman", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 1, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-14T19:25:53.900934+00:00"}, {"id": "2110745785843224600", "url": "https://x.com/s8mb/status/2110745785843224600", "text": "One of my favourite writers, @CharlesCMann, joins Works in Progress as a regular contributor. I am thrilled. \n\n1491 and 1493, two of Charles's books, are among the best works of history I have ever read. 1491, which is about the Americas before Columbus, was one of those books that made me wonder if it could possibly be true, it was so surprising and shocking about that lost world. I read while I was travelling through Guatemala's countryside, and it made me understand the tragedy of the collapse and destruction of the pre-Columbian civilizations much better.\n\n1493 is a rather different book, being about how the Americas changed the rest of the world. It is often tragic too, given the subject matter, but also completely captivating on how everyday things like rubber and potatoes changed the world.\n\nWhat I think Charles's writing consistently has is a \"fascination with the ordinary\" – the conviction that even mundane-seeming everyday things often have a fascinating backstory. His articles for Works in Progress will continue this fascination. I strongly recommend his debut piece, out today, on the invention and reinvention of porcelain, written in the same spirit that has made his other writing so brilliant and eye-opening.", "created_at": "2026-10-15T14:53:05+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": false, "reply_to": "", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 66, "retweets": 4, "media": [], "quoted": {"author": "RuxandraTeslo", "text": "What do a cutting-edge bone implant and Mrs Potts from Beauty and the Beast have in common? Both are made from porcelain, a material humans first made over 3,000 years ago and are still reinventing today.\n\nhttps://t.co/gv0ZeRL8Pa\n\nWe focus on advances in computing, but the world around us has been transformed just as much by materials science. And within this already underrated field sits an even more underrated material. Plenty of people have heard of semiconductors, but almost no one thinks about porcelain. For @WorksInProgressMag, @CharlesCMann wrote about its remarkable journey:\n\n- Porcelain is basically an ancient nanotechnology. 3000 years ago, Chinese potters found that firing a white clay called kaolin to around 1,200°C transformed it completely: its crystals get rebuilt, producing a material that is hard, dense, and sometimes translucent. Nobody knew why it worked at the time: they discovered it by trial and error.\n\n- Europeans prized porcelain immensely – but had no clue had to make it. When porcelain arrived in Europe in the 12th century, it was so superior to European ceramics that aristocrats called it \"white gold.\" But despite attempting to reverse-engineer it, Europeans failed to create porcelain for centuries.\n\n- Fake it until you make porcelain. Böttger, an alchemist imprisoned in the early 1700s for falsely claiming to make gold, was set to work with a legitimate scientist on making porcelain. Remarkably, the scientist succeeded where others had failed for centuries, creating the first European porcelain cup. But he did not live to profit: ever the liar, Böttger claimed his discovery for himself.\n\n- Less slippery when wet. Innovation in materials science picked up again in the 20th century and continues to this day, producing Porcelain 3.0. Today, porcelain can be found across a surprising number of household objects: from kitchen countertops to tiles that become less slippery when wet, which also makes them safer.\n\n- The most futuristic use of all: researchers can now 3D-print porous porcelain scaffolds to repair damaged bone. The advantage is that blood vessels and bone cells grow into the scaffold’s tiny openings, while the scaffold slowly dissolves as new bone replaces it, allowing a bone-like natural structure to persist.\n\nPorcelain has already gone from fragile imperial teacups to artificial joints and scaffolds that help bone regrow. But its 3000 year long story is far from over: expect this underrated material to play new roles in everything from medicine to architecture in the coming decades!"}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110725134059270549", "url": "https://x.com/s8mb/status/2110725134059270549", "text": "@AlfredRotors Govt spending actually fell slightly (-0.1pp) between H1 2025 and 2026.", "created_at": "2026-10-15T13:31:01+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "AlfredRotors", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 0, "retweets": 0, "media": [], "quoted": null, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110708927977467910", "url": "https://x.com/s8mb/status/2110708927977467910", "text": "@ben_golub To some extent, yeah! Cities can have corporation-like features where there are large local spillovers. https://t.co/7ym5GrzEtE", "created_at": "2026-10-15T12:26:38+00:00", "author_handle": "s8mb", "author_name": "Sam Bowman", "is_reply": true, "reply_to": "ben_golub", "is_retweet": false, "rt_author": "", "rt_author_name": "", "likes": 2, "retweets": 0, "media": [], "quoted": {"author": "s8mb", "text": "I think Andy Burnham should champion the idea of 'municipal socialism': having utilities owned by local governments, primarily combined authorities, rather than the national monopoly that nationalisation usually entails. This may already be what he is planning, but he hasn't really said so yet. \n\nNationalised monopoly fails for many reasons:\n\n- It creates entities that are too big to fail, so they can waste large amounts of money while being subsidised from public funds.\n\n- It gives people no comparison point to see if a certain industry is being well-run, so bad outcomes end up being treated like bad weather.\n\n- It prevents the public companies themselves from learning from other companies, because they only have other countries to learn from where circumstances might be very different.\n\n- It creates very weak political feedback mechanisms, because your vote on whether the trains are being run well is bundled with your vote on, eg, tax policy and foreign policy.\n\n- It engenders short-termism, because voters are less forward looking than private investors, so there is more scope to take long-term degradation of service for short-term benefits. (This is happening with TfL's fare freeze right now.)\n\nMunicipal ownership does not solve all these problems, but it can maintain more accountability and some of the elements of competition that national monopoly does not have.\n\nThere is more room for experimentation and learning because different municipalities try different policies, and can copy the successes from each other. The Oyster Card and contactless card payments were a good example of this by TfL. Manchester's bus privatisation scheme was scrapped in part by looking at the success of London's approach to buses, where delivery is outsourced to multiple private companies but services are designed by a single authority and provided under one brand.\n\nThe 'too big to fail' problem is smaller, because municipal governments can face a harder budget constraint than national government, though bailouts undermine this. Those that want to subsidise services have to draw on a narrower tax base. In fact, well-run services can raise revenues for local governments, as many locally-owned tramways did in the 19th and early 20th Centuries. Local authorities are more accountable for failures and get more credit for successes than national governments would be.\n\nInternationally, successful examples of public ownership of utilities are often owned by municipalities. This is true in much of the United States, where water is mostly municipally owned rather than private, and in France, where most public services are owned by local governments, who then offer contracts to companies to handle the actual delivery. The Bee network and London buses operate on the same basis.\n\nHistorically in Britain, trams, electricity and gas were all mostly run by small local companies and local governments before the 1940s–70s. Municipally-owned gas networks were highly profitable for Birmingham under Joseph Chamberlain. There were still nearly 200 different water boards across England by 1970!\n\nWe use 'nationalisation' as a byword for 'public ownership', but there is little reason for most of these things to be nationalised monopolies. Much of the drive towards nationalised monopoly in the 20th Century was inspired by a mistaken belief that economies of scale would drive the biggest improvements in productivity, inspired by the apparent success of the USSR and large conglomerates in Germany and the USA. It is clear today that experimentation via trial and error is extremely valuable, and losing it is one of the big costs of monopoly.\n\n'Municipalisation' would, for example, mean overhauling the Great British Railways policy which by default puts commuter lines in Surrey into the same administration that runs the West Midlands Cross-City Line, the East Coast Main Line, and commuter networks in Manchester, Leeds and Liverpool. There are some provisions for lines going into municipal control, but the default is to stop the next Mayor of Greater Manchester from running the region's commuter trains and London from absorbing more lines into the Overground.\n\nPublic ownership has many flaws, but some of them are avoidable by looking beyond the 1940s and 1970s for how to do it. 'Municipal socialism' allows for much greater learning and feedback loops, and would hugely strengthen devolution by making local government responsible for things that directly matter to their electorates rather than having them run by a single inert national monopoly."}, "fetched_at": "2026-10-15T15:35:55.672465+00:00"}, {"id": "2110704640514040156", "url": "https://x.com/s8mb/status/2110704640514040156", "text": "@Pa
