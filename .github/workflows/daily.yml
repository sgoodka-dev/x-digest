name: Daily digest

# Collects new tweets twice a day, well before the 6:30pm UK email.
# GitHub's scheduler can run hours late or skip a run when busy, so there are
# two runs; anything collected late is simply picked up by the next email.
on:
  schedule:
    - cron: '17 11 * * *'   # 11:17 UTC = 12:17 BST / 11:17 GMT
    - cron: '17 15 * * *'   # 15:17 UTC = 16:17 BST / 15:17 GMT
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Fetch new tweets
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        run: python scripts/fetch.py

      - name: Rebuild data page
        run: python scripts/build_site.py

      - name: Save collected tweets
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "Collect tweets $(date -u +'%F %H:%M')"
          git pull --rebase --autostash origin main
          git push
